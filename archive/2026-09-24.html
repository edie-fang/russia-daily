{"date": "2026-09-24", "stats": {"total": 29, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "Ozon 为 БПЛА 保险「反向补贴」：服装鞋履商家保费全额返还，履约中心免费仓储拉长至 365 天", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-23 12:30", "summary": "Ozon 9-23 宣布一揽子卖家支持措施。核心三条：① 服装、鞋履与部分配饰类目，凡持有「Ингосстрах」БПЛА 风险保单的商家，自 10-05 起至 2026 年底可获等额于保费的奖金返还（首笔按 10 月账期于 11 月发放）；商家须设置「申报货值」，且申报货值需低于最高赔付额 5%；② 自 09-22 至年底向 Ozon 履约中心（ЛЦ）发货的商家，商品免费存放期延长至 365 天（大件 40 天）；③ 向「西伯利亚与哈萨克斯坦」履约中心免费运输卖家商品的政策延至 2027-01-15，并对上述类目免收混合供货（一箱多码多款）处理费。数据显示「Ингосстрах」已向 Ozon 受损卖家赔付 82 亿卢布、覆盖约 9 万家，首批集中于 Чапаевск（萨马拉州）、Махачкала（达吉斯坦）、Энем（阿迪格）。", "table": [["保费返还", "等于保单成本，10-05~年底"], ["首笔到账", "2026-11（按 10 月账期）"], ["申报货值上限", "低于最高赔付额 5%"], ["免费仓储", "365 天（大件 40 天），09-22 起"], ["免费运输至西伯利亚/哈国", "延至 2027-01-15"], ["已赔付", "82 亿卢布 / 约 9 万家卖家"]], "sourceFull": "https://www.kommersant.ru/doc/8973050"}, {"num": 2, "title": "俄央行拟把 маркетплейсы 与国家即时通讯工具「Макс」接入反欺诈信息交换系统", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-23 17:07", "summary": "俄央行信息安全司司长 Вадим Уваров 在国际银行论坛表示，央行希望把电商平台与国产即时通讯工具「Макс」纳入反欺诈协作：让平台成为央行反欺诈信息系统的参与方，把风控信号从「转账发生后」前移到「转账发生前」——例如他人账号被批量下单、通过通讯软件实施的钓鱼来电等在平台侧即被记录并进入共享系统。央行并称正与 НСПК 合作完善盗款追回机制，目标是全额返还受害人被窃资金（目前部分金额仍停留在发起追回的银行）。对卖家含义：平台账户的风控审查将同步收紧，多账号、代运营与异常下单需提前规范，避免关联主体被误判。", "table": [["参与方", "маркетплейсы + «Макс» + банки"], ["目标", "转账前拦截（非事后）"], ["风控信号", "批量下单 / 钓鱼来电"], ["盗款返还", "目标全额（与 НСПК 合作）"]], "sourceFull": "https://www.kommersant.ru/doc/8973285"}, {"num": 3, "title": "«Лента» 拿下西伯利亚最大独立零售商 «Мария-Ра»：1,303 家门店、交易估值 400–600 亿卢布", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)（引 Банкфакс）", "time": "09-23 10:41", "summary": "«Мария-Ра» 员工已获通知公司变更所有者，控制权转归 «Лента»（属 «Севергрупп»）。据 Infoline，截至 2026-07-01 «Мария-Ра» 在阿尔泰边疆区、阿尔泰共和国、新西伯利亚州、克麦罗沃州、托木斯克州的 280 个居民点拥有 1,303 家门店；分析机构估算交易对价 400–600 亿卢布。消息称 «Мария-Ра» 招牌至少保留两年，暂不进行品牌重塑。对卖家的含义：西伯利亚快消与家居类目的线下分销入口进一步集中，区域连锁采购决策与账期条款或随整合调整，区域经销商与「店中店」合作需重新谈判。", "table": [["收购方", "«Лента»（Севергрупп）"], ["标的门店", "1,303 家 / 280 个居民点"], ["覆盖", "阿尔泰、新西伯利亚、克麦罗沃、托木斯克等"], ["估算对价", "400–600 亿卢布"], ["品牌保留", "至少 2 年"]], "sourceFull": "https://www.retail.ru/news/lenta-priobrela-torgovuyu-set-mariya-ra-23-sentyabrya-2026-282462/"}, {"num": 4, "title": "Wildberries 自提点加入「安全岛」项目：首都区 ПВЗ 可协助走失者", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-23 10:53", "summary": "Wildberries 成为「Островок безопасности」项目合作伙伴，莫斯科与莫斯科州的自营自提点（ПВЗ）员工经过培训后，可协助走失儿童、记忆障碍老人与特殊需求人群快速联络志愿者与 МВД。该项目 2019 年由搜寻队 «ЛизаАлерт»、失踪人口搜寻中心（ЦППЛ）与 X5 Group 共同发起，至 9 月已帮助约 1 万人回家；后续或将扩展至合作加盟 ПВЗ。对卖家的含义：ПВЗ 正从「取货点」升级为社区基础设施，与「买家议价」「未取件商品就地转售」等动作叠加，末端点位的功能与话语权持续上升。", "table": [["项目起点", "2019 年（ЛизаАлерт + ЦППЛ + X5）"], ["覆盖", "首都区自营 ПВЗ，或扩至加盟"], ["累计寻回", "约 1 万人"], ["协作方", "志愿者 + МВД"]], "sourceFull": "https://www.kommersant.ru/doc/8972952"}, {"num": 5, "title": "Wildberries & Russ 在埃里温上线 WB Taxi，海外出行服务成为独立扩张方向", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-22 10:52", "summary": "RWB 宣布在亚美尼亚埃里温上线打车服务 WB Taxi，此前已在白俄罗斯、乌兹别克斯坦、吉尔吉斯斯坦落地。首批向员工与合作伙伴发放专用邀请，其他用户可下载 App 加入等待名单；提供 «Стандарт» / «Комфорт» / «Мульти» 三档（后者可跨品类同时叫车），对司机承诺更低的聚合器佣金。2026 年 4 月 RWB 已收购打车聚合器 «Ситимобил»、«Таксовичкоф»、«Грузовичкоф»；俄罗斯本土打车服务拟于 2026 年推出。对卖家的含义：平台系流量入口与履约网络继续跨界，未来「叫车—取件—退货」末端闭环的可能性上升。", "table": [["新市场", "亚美尼亚（埃里温）"], ["已有市场", "白俄 / 乌兹 / 吉尔吉斯"], ["档位", "Стандарт / Комфорт / Мульти"], ["关联收购", "Ситимобил / Таксовичкоф / Грузовичкоф（2026-04）"]], "sourceFull": "https://www.kommersant.ru/doc/8972116"}, {"num": 6, "title": "«Ромир»：56% 俄消费者反对电商平台与俄邮政在线售酒合法化", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-22 07:01", "summary": "«Ромир» 夏季末民调显示，56% 受访者不赞成通过电商平台与俄罗斯邮政网点合法销售酒精，24% 明确赞成、另 20% 倾向于赞成；反对者以女性与 60 岁以上人群为主。反对理由集中在：提高未成年人可得性（56%）、整体消费量上升（51%）、可得性与普及（49%）、假酒线上销售增加（46%）。支持者认为可节省采购时间（45%）、价格更易负担且品类更全（41%），农村居民支持度更高。对卖家的含义：酒类线上化仍缺消费端共识，若政策放开，平台侧的年龄核验、配送合规与保险要求会显著高于其他类目。", "table": [["不赞成", "56%"], ["赞成 / 倾向赞成", "24% / 20%"], ["首要反对理由", "未成年人可得性 56%"], ["支持理由", "省时 45% / 价格与品类 41%"]], "sourceFull": "https://www.kommersant.ru/doc/8971935"}, {"num": 7, "title": "E-Promo Group：上半年俄电商流量成本 +11.5%、目标转化成本 +18.7%，转化率系统性下滑", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-23 14:00", "summary": "E-Promo Group 对五个行业的监测显示，2026 年上半年 performance 广告的目标转化成本（CPA）同比 +17.4%，而点击成本（CPC）仅 +2.1%，二者增速差 15.3 个百分点；其中线上零售 CPC +11.5%、CPA +18.7%。分析认为这表明用户仍会点击比价，但走到下单/留资的意愿下降——即流量更便宜、结果更贵。对卖家的含义：站内与站外广告的获客边际成本在抬升，Q4 促销预算应按 CPA 而非 CPC 重算，并把比价场景（详情页、评价、配送时效）作为转化率修复的重点。", "table": [["CPA（全行业）", "+17.4% 同比"], ["CPC（全行业）", "+2.1%"], ["增速差", "15.3 п.п."], ["线上零售", "CPC +11.5% / CPA +18.7%"]], "sourceFull": "https://www.retail.ru/news/e-promo-group-stoimost-tselevogo-deystviya-v-internet-reklame-vyrosla-na-17-4-23-sentyabrya-2026-282477/"}, {"num": 8, "title": "9-23 凌晨俄方通报击落 514 架无人机；9-22 昼间另有 35 架", "tag": "local", "tagText": "本地", "source": "Vedomosti / 生意人报(Kommersant)", "time": "09-23 09:05", "summary": "俄国防部与各地通报：9-23 夜间至清晨在全俄击落 514 架乌克兰无人机（Vedomosti 09-23 09:05、Kommersant 09-23 09:04 同口径）；9-22 昼间另有 35 架；9-22 单日通报数为 297 架。同期塞瓦斯托波尔通报防空正在拦截来袭目标，索契海滩在解除无人艇（БЭК）威胁后恢复开放。对物流的含义：单夜数百架级别的规模已成为常态，莫斯科、南部与伏尔加流域枢纽的临时空域关闭仍是 Q4 到仓时效的最主要外生扰动，备货窗口应按「枢纽停摆 24–48 小时」预留缓冲。", "table": [["9-23 击落", "514 架（全俄）"], ["9-22 昼间", "35 架"], ["9-22 通报", "297 架"], ["关联处置", "塞瓦斯托波尔防空拦截；索契海滩恢复"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/23/1231029-sili-pvo-sbili"}, {"num": 9, "title": "柏林-勃兰登堡机场因无人机停摆 45 分钟；德国该机场上半年录得 28 起无人机事件", "tag": "local", "tagText": "本地", "source": "Lenta.ru", "time": "09-23 23:10", "summary": "据德媒 Zeit，柏林-勃兰登堡国际机场（BER）在空域发现无人机后临时关闭约 45 分钟：当地时间约 20:00 先关闭北跑道，20:20 南跑道亦停止运行，全部飞行作业中断。统计显示该机场在 2026 年上半年录得 28 起无人机事件，而 2025 年全年仅 8 起。同期德国调查人员在下萨克森州 Вунсторф 军用机场此前发现无人机的位置数米处查获可疑物质。对供应链的含义：欧盟民航与军用枢纽的无人机干扰频率快速上升，欧洲中转与末端配送的准点率风险正在从东欧向内陆扩散。", "table": [["停摆时长", "约 45 分钟"], ["时序", "20:00 北跑道 / 20:20 南跑道"], ["BER 上半年事件", "28 起（2025 全年 8 起）"], ["关联", "Вунсторф 军用机场查获可疑物质"]], "sourceFull": "https://lenta.ru/news/2026/09/23/aeroport-berlina-priostanovil-rabotu-iz-za-obnaruzheniya-bespilotnika/"}, {"num": 10, "title": "«Auchan» 未能按期出售俄业务：夏季已与 «Кама Капитал» 谈成、交易最终未落地", "tag": "local", "tagText": "本地", "source": "消息报(Izvestia)", "time": "09-24 00:40", "summary": "据《消息报》引两名接近交易双方的信源，法国 «Auchan» 于今年夏季已就出售其俄罗斯子公司（运营俄境内连锁门店）与投资公司 «Кама Капитал» 达成一致，但该交易最终未能完成；一名商业地产顾问与一家大型连锁零售商高管亦知悉相关谈判。对卖家的含义：外资零售资产在临时管理人/审批不确定性下的处置仍可能反复（此前已有 «Лемана Про»、«Ашан»、Volkswagen 等案例），与外资供应商签长期合同、依赖单一渠道分销的卖家，应把渠道主体变更条款写进合同。", "table": [["标的", "Auchan 俄罗斯子公司"], ["拟受让方", "«Кама Капитал»"], ["谈判时间", "2026 年夏季"], ["结果", "交易未完成"]], "sourceFull": "https://iz.ru/2172445/2026-09-24/auchan-ne-uspel-prodat-rossiiskii-biznes"}, {"num": 11, "title": "Volkswagen 破产管理人质疑俄资产交易：追索 40 亿卢布股息", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-22 13:29", "summary": "据仲裁案件库，买下 Volkswagen AG 对 НАЗ（原 ГАЗ）债权的 АО «Камея» 起诉要求认定大众出售俄资产的多笔交易无效，涉及卡卢加汽车厂（现 АГР）与 MAN 卡车经销商（现 МТБР）；Volkswagen AG 破产管理人 Наталья Винокурова 同时申请认定 Scania 经销商结构（现 БВГ）交易无效，并另就 «Порше Руссланд» 向境外股东支付的 40 亿卢布股息主张追偿。对卖家的含义：外资在俄资产的「售后回溯」风险上升（本案属破产程序中的资产追回），与外资主体存在历史债权、代垫款或渠道协议的卖家应提前评估合同被认定无效后的货款与库存归属。", "table": [["争议标的", "卡卢加汽车厂 / MAN / Scania 经销商交易"], ["追索股息", "40 亿卢布（Порше Руссланд）"], ["程序", "破产程序中申请交易无效"], ["主张", "将资产/款项收回破产财产"]], "sourceFull": "https://www.kommersant.ru/doc/8972260"}, {"num": 12, "title": "美国与中国把「釜山协议」延长至 2027-01-10", "tag": "local", "tagText": "本地", "source": "消息报(Izvestia) / 国际文传电讯社(Interfax)", "time": "09-24 04:25", "summary": "美国财长 Скотт Бессент 在与中方国务院副总理何立峰会面后表示，双方已同意把所谓「釜山协议」（经济缓和安排）延长至 1 月 10 日，即从 2025 年 10 月 30 日釜山中美元首会晤达成的贸易休战再获展期；同期美国方面称将继续延长与中国的贸易协定。对俄罗斯市场的含义：中美关税休战延长，短期压低「转口与灰色清关」的政策不确定性溢价，但也意味着美国对第三国采购俄油气加征关税的框架性压力（格雷厄姆制裁法）仍是 Q4 的主要宏观风险（详见第 18 条的能源侧传导）。", "table": [["延长后期限", "2027-01-10"], ["宣布人", "美财长 Бессент"], ["中方对接", "副总理何立峰"], ["起点", "2025-10-30 釜山会晤"]], "sourceFull": "https://iz.ru/2172536/2026-09-24/ssha-i-kitai-prodlili-deistvie-pusanskogo-soglasheniya-do-10-ianvaria"}, {"num": 13, "title": "年度通胀放缓至 6.22%；周度仅 +0.06%，汽油年初至今累计 +21.1%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)（引 Минэкономразвития / Росстат）", "time": "09-23 20:25", "summary": "俄经济发展部数据：9 月 21 日口径年度通胀 6.22%，较一周前的 6.24% 小幅回落；9-15 至 9-21 一周物价 +0.06%。俄统计局细项：鸡蛋周涨 2.4%，荞麦与冷冻鱼 +0.6%，猪肉与鸡肉 +0.5%，葵油与奶渣 +0.4%；蔬果整体 -1.6%（土豆 -3.4%、卷心菜 -3.3%、胡萝卜 -3.0%、苹果 -2.6%）。汽油周涨 0.05%、年初至今 +21.1%；柴油周跌 0.66%、年初至今 +14.74%。对卖家的含义：食品端通缩与燃油/物流端通胀并存，Q4 干线运价与到仓成本仍按高位预排，而快消品类的定价空间相对宽松。", "table": [["年度通胀（9-21）", "6.22%（前值 6.24%）"], ["周度涨幅", "+0.06%"], ["汽油（年初至今）", "+21.1%"], ["柴油（年初至今）", "+14.74%"], ["蔬果（周）", "-1.6%"]], "sourceFull": "https://www.kommersant.ru/doc/8973577"}, {"num": 14, "title": "8 月工业产出环比 -0.3%、同比 -0.6%；三季度消费者信心降至 -16%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)（引 Росстат / ЦМАКП）", "time": "09-24 01:27", "summary": "俄统计局：8 月工业产出指数在 6 月 +0.2%、7 月 +0.1% 的弱增长后再度环比 -0.3%（季调），同比 -0.6%，1–8 月累计零增长。面向国内民用需求的部门继续收缩：服装 -2.8%、纺织 -1.1%、家具 -1.6%、纸品 -3.8%（环比），食品 +2.2%。「СберИндекс」显示 9-14~9-20 一周实际消费支出同比增速回升至 1.5%（前值 1.2%），但非食品类名义增速继续放缓至 10.7%（前值 10.9%）。统计局三季度消费者信心指数降至 -16%（环比 -3 п.п.），对经济形势预期 -15%、对个人财务状况预期 -8%，预计自身状况恶化的比例由 21% 升至 24%，大额采购适宜度 -20%。", "table": [["工业产出（8 月环比/同比）", "-0.3% / -0.6%"], ["1–8 月累计", "0.0%"], ["服装/家具/纸品（环比）", "-2.8% / -1.6% / -3.8%"], ["实际消费（9-14~20）", "+1.5% 同比"], ["消费者信心（Q3）", "-16%（-3 п.п.）"]], "sourceFull": "https://www.kommersant.ru/doc/8973591"}, {"num": 15, "title": "俄央行把「中东局势长期化」列入输入型通胀风险：进口价格或加速上涨", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)（引 ЦБ РФ）", "time": "09-23 18:11", "summary": "俄央行在关键利率讨论纪要中把外部条件恶化新增为通胀风险：若中东地缘紧张长期持续，将推高全球经济通胀压力并加快俄罗斯进口品价格上涨；全球经济疲弱则可能压制俄出口需求。背景：美以对伊军事行动导致霍尔木兹海峡通行受限——该通道占全球燃料供应约 20%，日通行船舶由冲突前的约 125 艘降至 9 月中旬的数十艘；油价自 63–67 美元/桶区间一度升至 90–100 美元/桶。传导路径为进口成本 + 汇率：输入品与物流涨价、卢布走弱迅速反映到进口商品与零部件价格。对卖家的含义：若紧张延续，央行维持紧缩的时间可能长于基准情景，融资成本与进口采购价双向承压。", "table": [["新增风险", "外部条件恶化/中东长期化"], ["霍尔木兹占比", "全球燃料供应约 20%"], ["日通行船舶", "125 艘 → 数十艘"], ["油价区间", "63–67 → 90–100 美元/桶"], ["传导", "进口成本 + 汇率"]], "sourceFull": "https://www.kommersant.ru/doc/8973444"}, {"num": 16, "title": "工业用户反对把电网「防打击安全支出」计入输配电价；ФАС 同期起草统一费率监管法", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant) / Vedomosti", "time": "09-23 19:05", "summary": "«能源消费者协会» 公开反对 ФАС 把电网企业人员与设施的防打击安全支出纳入其非可控费用的做法，认为「把防护与修复成本直接全额转嫁到电价，是把电网垄断企业的财务风险二次转嫁给工业」，并指出 «Россети» 2025 年净利约 2,030 亿卢布、2026 上半年约 1,760 亿卢布，主张资金应由企业自有资金、财政支持与税款延期共同承担，电价不应成为唯一补偿来源。ФАС 强调该举措不涉及居民电价；费率按 2022–2025 三年期的实际防护支出分摊，且需联邦/地区层面决议。同期 ФАС 已起草统一费率监管法草案（Vedomosti 09-23 22:16）。对卖家的含义：反无人机防护成本正从企业自担转向可转移、可摊销，但落地节奏与分摊比例仍存争议，园区与仓储租金中的「安全附加」需索要明细。", "table": [["争议", "电网防护/修复支出计入输配电价"], ["Россети 净利", "2025 约 2,030 亿 / 2026H1 约 1,760 亿卢布"], ["分摊期", "2022–2025 支出分三期"], ["居民电价", "不受影响（ФАС 声明）"], ["关联", "ФАС 统一费率监管法草案"]], "sourceFull": "https://www.kommersant.ru/doc/8973507"}, {"num": 17, "title": "ОЭСР 上调 2026 全球 GDP 至 2.9%，俄罗斯 2026 维持 0.5%、2027 下调至 0.6%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)（引 ОЭСР）", "time": "09-24 01:27", "summary": "ОЭСР 9-23 报告将 2026 年全球 GDP 增速预测由 2.8% 上调至 2.9%，2027 年下调 0.1 п.п. 至 3.0%，称全球经济对中东能源危机的韧性超预期，但同时提示全球通胀风险上升、主要央行或需进一步收紧。分国别：美国 2026 +2.2%（前值 2.0%）、2027 +2.1%；欧元区 2026 由 0.8% 上调至 1.0%、2027 由 1.2% 降至 1.0%；中国 2026 维持 4.5%、2027 由 4.3% 降至 4.2%。俄罗斯 2026 维持 0.5%，2027 由 0.8% 下调至 0.6%（报告未给出下调理由）。对卖家的含义：外部需求端「美中偏稳、欧俄偏弱」的格局延续，俄国内消费类目仍需靠结构性替代而非总量扩张驱动。", "table": [["全球 GDP 2026 / 2027", "2.9% / 3.0%"], ["美国 2026 / 2027", "2.2% / 2.1%"], ["欧元区 2026 / 2027", "1.0% / 1.0%"], ["中国 2026 / 2027", "4.5% / 4.2%"], ["俄罗斯 2026 / 2027", "0.5% / 0.6%"]], "sourceFull": "https://www.kommersant.ru/doc/8973548"}, {"num": 18, "title": "布伦特 11 月合约跌破 98 美元（-2.6%，9-8 以来首次）；美方筹备 90 天柴油出口禁令", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant) / 国际文传电讯社(Interfax)", "time": "09-22 13:38", "summary": "9-22 布伦特 11 月期货下挫 2.6% 至 97.7 美元/桶，为 9-8 以来首次跌破 98 美元；WTI 同期走弱。下行动能来自沙特恢复「东西向」输油管道（可将约 400 万桶/日、约全球 4% 的供应经红海转运至延布）与美方对伊谈判进展。与此同时，Politico 引消息称白宫正在筹备为期 90 天的柴油出口禁令（法律层面仍在推进），特朗普或在本周末前宣布——这将是 2015 年奥巴马解除石油出口禁令以来首次能源出口限制，能源部长 Райт、财长 Бессент 与内政部长 Берг姆均持反对意见。9-23~24 布伦特在 97–100 美元区间震荡（9-24 第三方聚合口径约 97.2 美元、-1.2%，官方收盘价待核实）。对卖家的含义：油价回落缓解运价压力，但柴油出口禁令若落地将抬升全球柴油与干线运费，Q4 陆运成本仍按高位情景预排。", "table": [["布伦特（11 月合约，9-22）", "97.7 美元/桶（-2.6%）"], ["关键位", "首次跌破 98（自 9-8）"], ["推跌因素", "沙特东西向管道重启 + 美伊谈判"], ["待落地政策", "美国 90 天柴油出口禁令"], ["9-23~24 区间", "97–100 美元/桶"]], "sourceFull": "https://www.kommersant.ru/doc/8972288"}, {"num": 19, "title": "数字卢布进入「功能扩容期」：账户数约 20 万，拟测试无网离线支付", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)（引 ЦБ РФ / Минфин）", "time": "09-23 17:35", "summary": "在普京与政府的会议上，俄央行行长 Набиуллина 表示央行将扩充数字卢布的技术能力，近期计划测试不连接网络即可完成的支付：央行正与受保护 SIM 卡的俄方开发者合作，使人在无移动互联网处也能用数字卢布付款，未来不排除用于跨境结算。自 9 月 1 日起，36 家最大银行的客户可开立数字卢布账户，目前已开立约 20 万个；央行计划到 2029 年测试以数字卢布发放贷款。技术主要约束是双重花费（同一代币在未同步前被多次出示）。同期 Силуанов 通报已出现首批以数字卢布缴纳的税款与罚款，普京要求央行与财政部向公众解释数字卢布与普通非现金支付的区别。", "table": [["数字卢布账户", "约 20 万个"], ["可开户银行", "36 家最大银行（09-01 起）"], ["新测试方向", "离线（无网）支付；跨境结算"], ["贷款测试目标", "2029 年前"], ["主要技术风险", "双重花费"]], "sourceFull": "https://www.kommersant.ru/doc/8973400"}, {"num": 20, "title": "РЭЦ：2025 年非资源非能源出口 +11%，2026 年前 7 个月 +8%", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)（引 РЭЦ）", "time": "09-23 10:55", "summary": "在 «Экспортер года. Сделано в России» 颁奖典礼上（9-22 于 ВДНХ «Космос» 馆，第一副总理 Мантуров 出席并致辞），俄罗斯出口中心（РЭЦ，属 ВЭБ.РФ）通报：2025 年非资源非能源出口增长 11%，2026 年前 7 个月再增 8%。对卖家的含义：非资源类出口（含消费品、家居、照明、美妆等）仍在财政与 РЭЦ 认证体系（«Сделано в России»）支持下扩张，认证与出口物流补贴是中小品牌进入独联体、中东与东南亚市场的现实抓手。", "table": [["非资源非能源出口 2025", "+11%"], ["2026 年前 7 个月", "+8%"], ["主办", "РЭЦ + 第一频道"], ["出席", "第一副总理 Мантуров"]], "sourceFull": "https://ria.ru/20260923/premiya-2119686173.html"}, {"num": 21, "title": "НАФИ 发布「俄罗斯人最喜爱品牌 Top-50」：电子产品与家电占 20%，美妆品牌 Nivea、L'Oréal、Yves Rocher、Mixit 入榜", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)（引 НАФИ）", "time": "09-23 10:30", "summary": "НАФИ 分析中心（5,000 人样本，经 Росстат 结构加权，РБК 与 АКАР 支持）发布首个「Top-50 любимых брендов」。前十：Samsung、«Яндекс»、«Сбер»、Ozon、Adidas、Nike、Xiaomi、Apple、Sony、Wildberries——数字与零售平台在榜单中的存在感显著。结构上：快消（食品饮料）18 个品牌占 36%；消费电子与家电 10 个品牌占 20%（Samsung、Apple、Sony、LG、Xiaomi、Philips、Bosch、Tefal、Panasonic、Honor）；数字服务与零售各占 18%；汽车 8%。入榜美妆与个护品牌：Nivea（28）、L'Oréal（40）、«Чистая линия»（43）、Yves Rocher（44）、Mixit（49）。对卖家的含义：该榜单直接反映品牌资产的可迁移性——平台自有品牌与消费电子品牌的用户黏性高于多数美妆品牌，美妆类目的心智占位仍需依靠内容与试用转化。", "table": [["样本", "5,000 人（结构加权）"], ["前十", "Samsung / Яндекс / Сбер / Ozon / Adidas / Nike / Xiaomi / Apple / Sony / WB"], ["消费电子与家电占比", "20%（10 个品牌）"], ["美妆个护入榜", "Nivea 28 / L'Oréal 40 / Чистая линия 43 / Yves Rocher 44 / Mixit 49"], ["快消占比", "36%（18 个品牌）"]], "sourceFull": "https://www.kommersant.ru/doc/8291957"}, {"num": 22, "title": "俄政府推动整治「伪环保」宣称：45% 消费者选购环保标识商品，42% 的环保标识商品不达标", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)（引 Правительство РФ / ВЦИОМ / Роскачество）", "time": "09-23 15:53", "summary": "俄政府「打击工业品非法流通国家委员会」会议（由第一副总理 Мантуров 主持）指出，需出台措施遏制对商品或服务环保性的虚假或夸大宣传（即「漂绿」），避免企业以低成本博取购买与形象收益。据 ВЦИОМ 2025 年数据，约 45% 俄罗斯消费者会选择带环保标识的商品；而 «Роскачество» 研究显示，42% 带环保标识的商品不符合其宣称特性。对美妆与家清类卖家的含义：含 «эко / био / натуральный» 等宣称的包装与商品卡文案将进入监管视野（叠加 Роспатент 自 2027-03-01 上线的商品卡真伪核验机制与「诚实标识」扩围），宣称用语与检测报告需提前对齐。", "table": [["选择环保标识商品", "约 45%（ВЦИОМ 2025）"], ["环保标识不达标", "42%（Роскачество）"], ["主持", "第一副总理 Мантуров"], ["关联机制", "Роспатент 商品卡核验（2027-03-01）"]], "sourceFull": "https://ria.ru/20260923/pravitelstvo-2119781959.html"}, {"num": 23, "title": "Минпромторг：2027-01-01 起 утильсбор 上调 10–20%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)（引 Минпромторг） / 零售网(Retail.ru)", "time": "09-23 15:03", "summary": "俄工贸部新闻处向 Autonews.ru 确认，2027 年 1 月 1 日起，утилизационный сбор（回收处理费）费率将按政府 2024 年批准的刻度按机型上调 10–20%。现行基准费率为乘用车 2 万卢布、其他车辆 15 万卢布，系数取决于车型、发动机功率与车龄；个人自用进口 3 年以内、排量 3 升以下车辆仍适用优惠费率 3,400 卢布。工贸部称逐步上调为投资决策提供可预期条件，2026 年前 8 个月俄产车辆在国内市场占比已达 63.6%。对卖家的含义：家电不直接适用该费率，但汽车与部分带电机的机械类目进口成本将上行，且「回收费—定价—税率」联动会外溢到含电机的小家电报关口径，进口清关报价需按新费率重算。", "table": [["生效", "2027-01-01"], ["上调幅度", "10–20%（按机型）"], ["基准费率", "乘用车 2 万 / 其他 15 万卢布"], ["个人自用优惠", "3,400 卢布"], ["俄产车份额（8 个月）", "63.6%"]], "sourceFull": "https://www.kommersant.ru/doc/8973184"}, {"num": 24, "title": "政府将立法确立 утильсбор 税率变更规则：上调不得有追溯力", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)（引 buh.ru / Минпромторг）", "time": "09-23 15:30", "summary": "Минпромторг 就《生产与消费废弃物法》第 24.1 条拟定修正案并公示（统一立法公示门户）：① 若新规上调费率、增设义务或恶化纳税义务人处境，须在官方公布后满 30 日方可生效，且无追溯力；② 若新规下调费率、减除义务或改善处境，可自公布之日起生效并具追溯力。上述规则拟自 2027-01-01 起施行。对卖家的含义：这是费率上调前的程序性保护（给出 30 天缓冲与「不溯及既往」兜底），但与第 23 条的 10–20% 上调并不冲突——2027 年清关与备货日历需把该 30 天窗口作为最后锁价节点。", "table": [["上调类规则", "公布后满 30 日生效、不溯及"], ["下调类规则", "可即日生效、可追溯"], ["拟施行", "2027-01-01"], ["依据", "89-ФЗ 第 24.1 条修正案"]], "sourceFull": "https://www.retail.ru/news/vlasti-ustanovyat-pravila-izmeneniya-stavok-utilizatsionnogo-sbora-23-sentyabrya-2026-282460/"}, {"num": 25, "title": "智能手机与笔记本或可享「技术费」33% 折扣，与 ГИС 商品标记挂钩", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-23 06:00", "summary": "据三位知情人士，「技术费」项下已纳入强制标记体系的智能手机与笔记本，其费率或比基准费率低 33%：具体为以「商标与产品型号」系数乘以基准费率计算，系数取决于产品是否已在俄国家商品流通监测信息系统（ГИС）登记——未登记的产品技术费将高出 33%。自 2026-05-01 起，俄对无线电子产品（智能手机、笔记本，以及插座、印刷电路板、继电器）实施强制标记。基准费率由 Минпромторг 依 2025 年进口商品平均海关价值中位数并计入 4% 目标通胀确定，计算按整数取整；技术费六年期潜在财政收入估计 1,360 亿卢布。对卖家的含义：该机制实质是用合规登记换费率折扣，建议优先完成 ГИС 标记与型号登记，避免被动承担 33% 溢价。", "table": [["优惠幅度", "基准费率的 -33%"], ["挂钩", "ГИС 商品流通监测系统登记"], ["未登记惩罚", "+33%"], ["强制标记起点", "2026-05-01（手机/笔记本/插座/PCB/继电器）"], ["六年潜在收入", "1,360 亿卢布"]], "sourceFull": "https://www.kommersant.ru/doc/8972749"}, {"num": 26, "title": "新 iPhone 在俄销售逊于上一代：预购持平、二手平台成交 -13%", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)（引 消息报(Izvestia)）", "time": "09-23 09:27", "summary": "据《消息报》，iPhone 18 Pro / Pro Max 在俄首销未达预期，需求与上一代持平甚至更低。渠道侧：re:Store 称付费预购热度与新机型代际持平，9-23 起开放现货销售；最受欢迎配色为酒红（бургунди），其后为上一代所无的黑色；预购机型中 512GB 占 37.4%、256GB 占 33.3%，1TB 与 2TB 分别 17.9% 与 11.4%。RWB 确认 18 Pro 首销需求与去年持平，并预计需求增量将来自 10-23 发售的首款折叠机 Apple Duo（晚 5 周）。«Авито» 数据显示，9-19~20 新机成交笔数较上一代同期低 13%，256–512GB 的 18 Pro 均价 12 万–16 万卢布，平均客单约 12.7 万卢布，折叠机 Duo 成交占比不足 1%。对卖家的含义：高端手机换机周期继续拉长，配件与「以旧换新」二级流转的盈利空间大于整机新品。", "table": [["首销表现", "持平或低于上一代"], ["现货开售", "09-23（预购 09-18 起）"], ["预购结构", "512GB 37.4% / 256GB 33.3%"], ["Авито 成交", "同比 -13%"], ["均价 / 客单", "12–16 万 / 约 12.7 万卢布"], ["折叠机 Duo", "10-23 发售，占比 <1%"]], "sourceFull": "https://www.retail.ru/news/novyy-iphone-v-rossii-prodaetsya-khuzhe-proshlogodnego-23-sentyabrya-2026-282454/"}, {"num": 27, "title": "欧洲议会支持扩大 CBAM 至汽车零部件与家用电器", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-22 17:00", "summary": "欧洲议会通过立场文件，支持把跨境碳调节机制（CBAM）扩展至新的进口品类——包括部分汽车零部件与家用电器，并建议取消「进口商品价格急涨时可暂停征收碳费」的弹性条款，转而把 CBAM 收入用于支持受影响行业；对铝制品则拟把受管最小批量由 50 吨降至 5 吨，并把废铝计入核算。CBAM 自 2026-01-01 进入正式阶段，进口商已需为钢铁、铝、水泥、化肥等的隐含碳排放付费；欧委会此前披露的扩围路径（含洗衣机、冰箱等大型家电，以及发动机、电缆、电梯、工业机器人等）指向 2028 年。最终规则仍需与欧盟成员国协商。对卖家的含义：若含金属部件的家电与灯具进入 CBAM 扩围清单，对欧出口的碳数据追溯将成为准入门槛，需提前建立产品级碳排放台账。", "table": [["新增品类（议会建议）", "部分汽车零部件、家用电器"], ["铝受管门槛", "50 吨 → 5 吨"], ["新增核算", "废铝纳入"], ["CBAM 正式阶段", "2026-01-01 起"], ["欧委会扩围路径", "指向 2028 年（含洗衣机/冰箱等）"]], "sourceFull": "https://www.kommersant.ru/doc/8972573"}, {"num": 28, "title": "冬宫（Зимний дворец）启动建筑照明改造一期：更换灯具与电缆，2027 年完成", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)（引 Гос. Эрмитаж） / 国际文传电讯社(Interfax)", "time": "09-23 21:30", "summary": "国立艾尔米塔什博物馆通报，圣彼得堡已启动冬宫建筑艺术照明更新一期：全面更换主楼立面照明设备，包括灯具、电缆线路与照明配电盘；施工期间冬宫晚间照明可能部分或全部停用。主门拱将安装新照明，Комендантский、Октябрьский、Салтыковский、Иорданский 四个入口将增设新灯具（фонари）。一期不涉及大庭院（Большой двор）照明，计划 2027 年完工。现有照明主体形成于 2003 年，临涅瓦河北立面照明为 1994 年所建；主博物馆建筑群（冬宫至艾尔米塔什剧院）新照明方案于 2023 年制定。对卖家的含义：这是公共建筑景观照明的典型大单场景，验证俄市场对高显色、长寿命、可维护 LED 灯具与配套配电的采购需求持续存在。", "table": [["工程内容", "立面灯具 + 电缆线路 + 照明配电盘"], ["新增", "主门拱照明；4 个入口新 фонари"], ["一期完工", "2027 年"], ["不涉及", "大庭院照明"], ["旧系统", "2003 年（主体）/ 1994 年（北立面）"]], "sourceFull": "https://www.kommersant.ru/doc/8973584"}, {"num": 29, "title": "斯维尔德洛夫斯克铁路夏季更换 2,300 盏 LED：11 个车站，年节电 290 万千瓦时", "tag": "local", "tagText": "本地", "source": "КП-Урал（引 СвЖД）", "time": "09-22 12:00", "summary": "СвЖД（斯维尔德洛夫斯克铁路）公布节能计划进展：2026 年 6–8 月在 11 个车站安装 2,300 盏现代 LED 灯具，替换原有卤素灯、荧光灯与白炽灯，站点包括伊谢季、舒拉拉、涅维扬斯克、斯梅奇卡、卡奇卡纳尔、谢罗夫-扎沃茨科伊、伊夫杰利-1、伊斯托奇尼克、波克罗夫斯克-乌拉尔斯基（斯维尔德洛夫斯克州）、沃伊诺夫卡（秋明州）与列夫希诺（彼尔姆边疆区）。全年计划在 17 个设施更换近 3,000 套室外照明设备（后续含叶戈尔希诺、阿拉帕耶夫斯克、第一乌拉尔斯克、库什瓦、下塔吉尔等站）；17 站改造完成后年节电 290 万千瓦时。2025 年该铁路已在 15 个车站更换 5,000 余盏 LED 灯。对卖家的含义：俄铁路与市政系统的 LED 替换是持续、预算化的采购流，强调长寿命、低光衰与能效论证，是进入俄 B 端照明渠道的现实切口。", "table": [["2026 夏季安装", "2,300 盏 / 11 站"], ["全年计划", "近 3,000 套 / 17 个设施"], ["年节电（17 站）", "290 万千瓦时"], ["2025 年基数", "5,000+ 盏 / 15 站"]], "sourceFull": "https://www.ural.kp.ru/online/news/7183538/"}]}
