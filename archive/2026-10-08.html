{"date": "2026-10-08", "stats": {"total": 18, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "cat": "platform", "catText": "平台规则变动", "title": "【费用·罚金】Wildberries 下调 FBS 卖家超时发货罚款，并推出履约激励（至 2026 年底）", "tag": "local", "tagText": "本地", "source": "Vedomosti（援引 АУРЭК）", "time": "10-07 14:15", "summary": "Wildberries 大幅放宽 FBS 卖家超时发货罚则：延迟 48–52 小时的罚金由每小时 0.3% 降至 0.2%；延迟超过 52 小时一律封顶为货值 1%（原按时长累进，最高可罚至 9%）。同期推出正向激励——FBS 在 13 小时内发货佣金下调 5 个百分点、13–42 小时内发货下调 3.5 个百分点；卖家侧自动取消订单窗口延长至 192 小时；自提点（ПВЗ）处理费与自动退货费用下调，「卖家仓库周末」选项免费。新规有效期至 2026 年底，意在旺季前降低履约摩擦、提高平台内 FBS 供应比例。", "table": [["⏱ 生效时间", "即日生效，有效期至 2026-12-31"], ["🎯 实际影响", "履约/成本：FBS 超时风险与罚金显著下降，发货时效不稳的中小卖家受益最大；13 小时内发货可拿到 5 个百分点佣金优惠，直接增厚毛利，但需以更快的备货与出库能力换取。"], ["✅ 建议动作", "运营与物流本周内测算 FBS 订单把平均发货时效压进 13 小时后的佣金节省额，重排旺季排产与出库班次，并评估是否使用免费的「卖家仓库周末」。"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/10/07/1235049-wildberries-snizil-shtrafi"}, {"num": 2, "cat": "platform", "catText": "平台规则变动", "title": "【履约·仓配】Ozon 上线承运商卸货停机自动补偿：自第 121 分钟起 21 ₽/分钟", "tag": "local", "tagText": "本地", "source": "Retail.ru（援引 Ozon）", "time": "10-07 14:37", "summary": "Ozon 通过 «Вози Ozon» 服务上线车辆停机自动补偿：承运商车辆到仓后，若装货/卸货晚于计划到达时间 2 小时（即自第 121 分钟起），平台按每分钟 21 ₽ 对车辆全程在场时间给予补偿，一直计到离场标记形成为止，金额由系统自动核算并结算。此举针对旺季入仓排队与越库环节的车辆长时间滞留，用平台侧补偿提高承运商到仓与按时履约意愿。", "table": [["⏱ 生效时间", "即日生效（2026-10-07 报道）"], ["🎯 实际影响", "履约/时效：FBO/FBS 入仓与越库环节的排队成本部分转由平台承担，可降低承运商因滞留而向卖家转嫁的附加费与拒单率，旺季到仓时效更可控。"], ["✅ 建议动作", "物流负责人本周内向主要承运商确认是否已在 «Вози Ozon» 开启自动补偿，并把到仓时段安排在非高峰；如承运商报价含「滞留费」，按新机制重新议价。"]], "sourceFull": "https://www.retail.ru/news/ozon-budet-kompensirovat-prostoi-perevozchikam-7-oktyabrya-2026-283063/"}, {"num": 3, "cat": "ecom", "catText": "电商动态", "title": "Wildberries 测试推出教育领域政府采购平台：单笔上限 500 万 ₽，接入免费", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "10-07 13:00", "summary": "Wildberries（隶属 объединённая компания RWB）将在测试模式下推出面向教育类国有机构的数字采购平台：单笔采购上限 500 万 ₽，公立幼儿园、学校、中专与技校可采购文具、日用与设备类商品，订单可通过 Wildberries 物流基础设施履约。卖家需先在 ЕИС「采购参与者统一名录」完成注册，接入免费；首期仅向测试卖家开放，随后向满足政府采购资质要求的全部合作方开放，交易机制贴近平台常规下单（卖家预先挂出含价格、数量、交期与供货条件的报价，平台按参数自动匹配）。RWB 创新与生态发展总监 Евгений Этин 在「数字解决方案」论坛公布，方向源于普京关于以平台承接教育领域政府采购的提议。", "table": [["单笔采购上限", "500 万 ₽"], ["首批买方", "公立幼儿园/学校/中专技校（文具、日用、设备）"], ["卖家门槛", "ЕИС 采购参与者统一名录注册；接入免费"], ["模式", "先测试卖家，后向合规合作方开放"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/10/07/1234776-wildberries-zapustit"}, {"num": 4, "cat": "ecom", "catText": "电商动态", "title": "线下零售联盟致函米舒斯京：要求限制平台「避税式」简易税制并强制自提点缴补偿性税费", "tag": "local", "tagText": "本地", "source": "Retail.ru / «Ъ»", "time": "10-07 11:20", "summary": "РАТЭК（家电与计算机技术贸易企业协会）、俄罗斯纺织业者协会、家居连锁「Леонардо」及多地区购物中心运营商联名致信总理米舒斯京，要求拉平线上与线下税负：限制在「用于规避纳税」情形下以简易税制（УСН）及代理/佣金模式销售商品，并强制自提点（ПВЗ）就发出商品营业额缴纳补偿性税费；函件同时指出人员成本、保险缴费等负担差异。分析机构估算，2026 年由线上线下税负差带来的预算收入缺口或达 4400 亿–6900 亿 ₽。目前仍属倡议阶段，尚无立法落地。", "table": [["诉求一", "限制 УСН / 代理佣金模式的「避税」使用"], ["诉求二", "ПВЗ 按发出商品营业额缴补偿性税费"], ["2026 预算缺口估算", "4400 亿 – 6900 亿 ₽"], ["状态", "倡议阶段，无立法"]], "sourceFull": "https://www.retail.ru/news/oflayn-torgovlya-poprosila-pravitelstvo-usilit-nalogovyy-kontrol-za-marketpleysa-7-oktyabrya-2026-283052/"}, {"num": 5, "cat": "ecom", "catText": "电商动态", "title": "Poizon（«Дэву»）：半年内俄境内查获仿冒品数量增长近 57%，Air Jordan 系被仿最多", "tag": "local", "tagText": "本地", "source": "Retail.ru（援引 Poizon/«Дэву»）", "time": "10-07 17:40", "summary": "鉴定平台 Poizon（«Дэву»）披露：半年内俄罗斯境内查获的仿冒品数量同比增长近 57%，仿冒高度集中在鞋类。按单款统计，被仿最多的是 Air Jordan 1（6 个月查获 20 468 件）与 Air Jordan 4（13 289 件）；Adidas Originals Samba、Handball Spezial 等因二级市场需求旺盛进入前十。价格分布上，54.1% 的仿冒品售价落在 5000–15000 ₽ 区间，36.1% 落在 15000–50000 ₽，5.9% 在 15 万 ₽ 以上。报告并指出假货已开始伪造溯源芯片与验真页面，增加识别难度。", "table": [["半年查获仿冒品同比", "≈ +57%"], ["被仿最多单品", "Air Jordan 1（20 468 件）、Air Jordan 4（13 289 件）"], ["价格分布", "5000–15000 ₽：54.1%；15000–50000 ₽：36.1%"], ["新手法", "伪造溯源芯片与验真页"]], "sourceFull": "https://www.retail.ru/news/poizon-devu-za-polgoda-chislo-vyyavlennykh-poddelok-v-rossii-vyroslo-pochti-na-5-7-oktyabrya-2026-283072/"}, {"num": 6, "cat": "ecom", "catText": "电商动态", "title": "«Авито Услуги» 与 PIM Solutions 上线自提点间（ПВЗ–ПВЗ）寄件服务", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-07 21:02", "summary": "«Авито Услуги» 与物流服务商 PIM Solutions 联合推出自提点间（ПВЗ–ПВЗ）寄件服务，仅面向个人用户用于私人寄递，单件重量上限 100 kg，覆盖俄罗斯全境；用户可在平台下单，就近投递与取件。此举把 Авито 的流量与既有 ПВЗ/包裹网络打通，切入俄 C2C 与个人小件寄递市场，对以自提点为核心的零售网络是流量增量，也是个人寄递场景的替代选择。", "table": [["合作方", "«Авито Услуги» × PIM Solutions"], ["对象", "仅个人用户（私人寄递）"], ["重量上限", "100 kg"], ["覆盖", "俄罗斯全境"]], "sourceFull": "https://www.retail.ru/news/avito-uslugi-i-pim-solutions-zapustili-servis-otpravki-posylok-mezhdu-pvz-7-oktyabrya-2026-283079/"}, {"num": 7, "cat": "ecom", "catText": "电商动态", "title": "Wildberries 推出「WB Спорт」：App 内运动专区 + 六大项目内容生态", "tag": "local", "tagText": "本地", "source": "CNews / Retail.ru", "time": "10-07 12:33", "summary": "Wildberries 推出数字化产品 «WB Спорт»，以 App 内同名专区为入口：聚合运动品牌与商品专门橱窗、按运动类型的主题精选与个性化推荐、球迷周边（мерч），以及在线杂志的专家内容，覆盖跑步、板式网球、瑜伽、自行车、足球、冰球六大项目。首场整合营销为 10-03 在莫斯科举办的「粉色跑」活动，参与者与来宾可现场体验并购买合作品牌商品。此前该品牌方向主要依托与俱乐部、协会的合作项目，现转为系统化的内容+商品生态。", "table": [["产品形态", "App 内 «WB Спорт» 专区"], ["六大项目", "跑步/板式网球/瑜伽/自行车/足球/冰球"], ["内容构成", "运动品牌橱窗 + 主题精选 + 球迷周边 + 在线杂志"], ["首发活动", "10-03 莫斯科「粉色跑」"]], "sourceFull": "https://www.retail.ru/news/wildberries-zapustit-wb-sport-7-oktyabrya-2026-283056/"}, {"num": 8, "cat": "appliance", "catText": "家电电器", "title": "«М.Видео»：俄平板电脑市场 9 个月达 434 亿 ₽，「量减价增」、均价升至 2.03 万 ₽", "tag": "local", "tagText": "本地", "source": "М.Видео（Retail.ru 转述）", "time": "10-07 10:36", "summary": "«М.Видео-Эльдорадо» 评估：2026 年前 9 个月俄罗斯平板电脑市场约 214 万台、434 亿 ₽，金额同比 +4.3%、台数同比 -4%，均价升至 2.03 万 ₽（+8.7%），呈「量减价增」。按金额排名前三为 Huawei、Apple、Xiaomi，Huawei 与 Apple 的差距缩小至 0.25 个百分点，Redmi 为增速最快品牌。中高端与国产品牌份额继续上行，低价段需求受价格上行抑制。", "table": [["9M2026 规模", "≈214 万台 / 434 亿 ₽"], ["同比", "金额 +4.3%，台数 -4%"], ["均价", "2.03 万 ₽（+8.7%）"], ["金额榜", "Huawei ≈ Apple > Xiaomi；Redmi 增速最快"]], "sourceFull": "https://www.retail.ru/news/m-video-rynok-planshetov-v-rossii-vyros-do-43-4-mlrd-rubley-7-oktyabrya-2026-283050/"}, {"num": 9, "cat": "econ", "catText": "经济金融", "title": "Brent 原油回升至 $102/桶", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "10-07 18:45", "summary": "国际油价走高：北海 Brent 原油 10-07 报 102 美元/桶，较前一交易日继续回升，市场对俄油出口受限与供应扰动的担忧支撑现货。此前美国能源信息署（EIA）在短期展望中预计 2026 年 Brent 均价 96.3 美元/桶，当前价格已高于该预测。国内成品油价格随国际油价与调价机制联动。", "table": [["Brent（10-07）", "$102/桶"], ["EIA 2026 均价预测", "$96.3/桶"], ["驱动", "俄油出口制裁与供应链扰动"]], "sourceFull": "https://www.vedomosti.ru/investments/news/2026/10/07/1235189-brent-podorozhala"}, {"num": 10, "cat": "econ", "catText": "经济金融", "title": "周通胀 0.96%（9-29~10-05），年内逼近 6%；ЖКХ 调价贡献 0.75 个百分点", "tag": "local", "tagText": "本地", "source": "Vedomosti / Lenta", "time": "10-07 19:33", "summary": "俄统计与经济发展部数据：9 月 29 日至 10 月 5 日一周通胀率为 0.96%，年初至今累计逼近 6%。Минэк 指出，公用事业（ЖКХ）费率指数化对当周通胀贡献约 0.75 个百分点，属一次性集中调价；剔除该因素后价格压力相对温和。通胀读数上行将影响央行关键利率路径与旺季消费端定价。", "table": [["周通胀（9-29~10-05）", "0.96%"], ["年初至今", "逼近 6%"], ["ЖКХ 调价贡献", "0.75 个百分点"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/10/07/1235202-inflyatsiya-v-rossii"}, {"num": 11, "cat": "econ", "catText": "经济金融", "title": "IMOEX 指数 10-07 突破 2350 点，为 9 月 15 日以来首次", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "10-07 11:02", "summary": "莫斯科交易所指数（IMOEX）10-07 升破 2350 点，为 9 月 15 日以来首次；当日 IMOEX 收涨 0.42% 至 2338 点上方，平台与消费板块领涨（Ozon 涨 3.02%）。指数重回 2350 上方，反映市场对电商平台仓储遇袭风险的定价边际缓解，以及油价回升对能源权重的支撑。", "table": [["IMOEX", "盘中破 2350（自 9-15 以来首次）"], ["当日", "+0.42%，≈2338 点"], ["领涨", "Ozon +3.02%"]], "sourceFull": "https://www.vedomosti.ru/investments/news/2026/10/07/1234942-indeks-mosbirzhi"}, {"num": 12, "cat": "econ", "catText": "经济金融", "title": "国家福利基金（ФНБ）9 月缩水 2100 亿 ₽，政府筹备「低油价时期」预案", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "10-07 16:16", "summary": "俄财政部数据：9 月国家福利基金（ФНБ）规模缩减 2100 亿 ₽，流动性资产进一步下降，资金主要用于弥补预算缺口与既定项目支出。同期政府表示正为「低油价时期」准备财政预案，以降低对能源收入的依赖、缓冲油价波动对预算的冲击。", "table": [["ФНБ 9 月变动", "-2100 亿 ₽"], ["背景", "政府筹备「低油价时期」财政预案"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/10/07/1235116-fond-sokratilsya"}, {"num": 13, "cat": "politics", "catText": "时政要闻", "title": "夜间防空击落 311 架无人机，当日再击落 59 架", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "10-07 09:04", "summary": "俄国防部通报：10-07 夜间防空部队在俄境内击落 311 架乌克兰无人机，覆盖多个州；当日又击落 59 架。乌方持续以远程无人机打击俄能源与物流基础设施，多地机场与防空系统维持高戒备。基础设施遇袭风险仍是我方备货与入仓时效的主要外部扰动变量。", "table": [["夜间击落", "311 架"], ["当日再击落", "59 架"], ["主要方向", "能源与物流基础设施"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/10/07/1234908-za-noch-sili-pvo"}, {"num": 14, "cat": "politics", "catText": "时政要闻", "title": "无人机袭击别尔哥罗德州 Яковлевский 采矿选矿联合企业（ГОК）", "tag": "local", "tagText": "本地", "source": "Izvestia", "time": "10-08 02:34", "summary": "10-07 别尔哥罗德州 Яковлевский 采矿选矿联合企业（ГОК）遭乌军无人机袭击，企业变电站受损，井下作业人员全部安全升井，无人员伤亡；同期克拉斯诺达尔边疆区防空系统启动拦截来袭无人机。冶金与工业设施持续遇袭，扰动相关原料与物流链条。", "table": [["目标", "Яковлевский ГОК（别尔哥罗德州）"], ["损失", "变电站受损"], ["伤亡", "无（井下人员已升井）"]], "sourceFull": "https://iz.ru/2180526/2026-10-08/bpla-atakoval-iakovlevskii-gok-v-belgorodskoi-oblasti"}, {"num": 15, "cat": "politics", "catText": "时政要闻", "title": "匈牙利解除对乌克兰入盟谈判的否决", "tag": "local", "tagText": "本地", "source": "Vedomosti (Rapporteur)", "time": "10-07 16:36", "summary": "匈牙利解除对乌克兰入盟谈判的否决，欧盟可推进开启与乌克兰的入盟谈判章节；此前布达佩斯长期以乌方匈族少数民族语言权利未获保障为由阻挠。乌入盟进程推进将影响欧洲地缘格局与欧盟对俄制裁的协调节奏，进而影响跨境结算、物流与合规环境。", "table": [["进展", "匈解除否决，可推进开启入盟谈判"], ["此前条件", "匈族语言权利保障"], ["影响", "欧盟对乌/对俄政策与制裁节奏"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/10/07/1235119-vengriya-snyala-veto"}, {"num": 16, "cat": "politics", "catText": "时政要闻", "title": "油轮 Aframax Rio 在索契近海遇袭起火：23 名船员获救、海域未检出污染（更新）", "tag": "local", "tagText": "本地", "source": "Kommersant / Lenta / Vedomosti", "time": "10-07 14:48", "summary": "10-06 傍晚，利比里亚旗油轮 Aframax Rio 在索契附近黑海水域遭无人艇（БЭК）袭击起火，船上 23 名印度籍船员全部安全撤离、无伤亡；该船满载自新罗西斯克驶往印度的原油，火势在索契沿岸可见，当地一度关闭海滩并提示居民勿开窗。10-07 通报黑海未检出油污污染；10-08 凌晨索契机场实施临时限制后已解除。属「影子船队」运输环节再遭打击，黑海航运与保险风险上升。", "table": [["时间/地点", "10-06 傍晚，索契近海"], ["船只", "Aframax Rio（利比里亚旗）"], ["伤亡", "23 名船员全部安全撤离"], ["后续", "10-07 未检出油污；10-08 机场限制解除"]], "sourceFull": "https://kommersant.ru/doc/9008173"}, {"num": 17, "cat": "other", "catText": "其它动态", "title": "法院对 Zoom 罚款 6500 万 ₽（Google/Reddit/Telegram/Twitch 同期被罚）", "tag": "local", "tagText": "本地", "source": "Vedomosti / Lenta", "time": "10-07 17:18", "summary": "莫斯科法院对 Zoom 处以 6500 万 ₽ 罚款，事由为未按规定在俄境内本地化存储俄用户数据；同期法院还对 Google、Reddit、Telegram、Twitch 等境外平台因未删除违禁内容或未落实数据本地化开出罚单。境外平台在俄合规压力持续上升，也提示在俄运营的第三方 SaaS/协作工具存在随时受限的风险。", "table": [["Zoom 罚款", "6500 万 ₽"], ["事由", "未本地化存储俄用户数据"], ["同期", "Google/Reddit/Telegram/Twitch 亦被罚"]], "sourceFull": "https://www.vedomosti.ru/society/news/2026/10/07/1235153-oshtrafoval-zoom"}, {"num": 18, "cat": "other", "catText": "其它动态", "title": "ФНС：自 2027 年起变更企业所得税申报表格式", "tag": "local", "tagText": "本地", "source": "Retail.ru（援引 ФНС）", "time": "10-07 15:37", "summary": "俄联邦税务局（ФНС）公布：自 2027 年起变更企业所得税申报表格式，主要涉及设有多个分支机构的「地域分布式」公司，调整分支机构与母公司数据的填报口径与附表结构。企业需提前升级财税系统与报表模板，避免申报口径不符。", "table": [["生效", "自 2027 年起"], ["对象", "多分支机构（地域分布型）企业"], ["变化", "申报表结构与附表口径调整"]], "sourceFull": "https://www.retail.ru/news/fns-kak-izmenitsya-forma-deklaratsii-po-nalogu-na-pribyl-s-2027-goda-7-oktyabrya-2026-283067/"}]}
