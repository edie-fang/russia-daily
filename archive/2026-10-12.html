{"date": "2026-10-12", "stats": {"total": 16, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "cat": "platform", "catText": "平台规则变动", "title": "Яндекс Маркет：数据中心遇袭致分拣中心临时停用，平台剔除 10-11 订单质量指数并免除超时罚金", "tag": "local", "tagText": "本地", "source": "Бизнес Online", "time": "10-11 20:23", "summary": "10-11 凌晨乌方无人机袭击 «Яндекс» 弗拉基米尔数据中心（一周内第三座，此前为梁赞州与卡卢加），Яндекс Маркет 大量分拣中心（СЦ）临时不可用，卖家后台订单显示延迟、部分已生成订单缺少面单；平台卖家公告宣布 10-11 产生的订单不计入订单质量指数（индекс качества）、超时罚金（плата за опоздания）免除，并顺延收货预约。至 10-11 14:19，除 Царицыно 外全部分拣中心恢复收货，FBS 货件与 FBY 中转供货可正常送达，卖家仓上门取件自 10-12 恢复。", "table": [["⏱ 生效时间", "2026-10-11 即日生效；服务自 10-11 晚间起逐步恢复，取件 10-12 恢复"], ["🎯 实际影响", "履约/仓配：FBS·FBY 入仓与跨集群调拨中断约 1 天；10-11 超时不再罚分，但库存周转与买家时效感知受扰，缺面单订单需人工补打"], ["✅ 建议动作", "运营 10-12 前逐单核对 10-11 订单面单与入仓预约，优先改约可用分拣中心（避开 Царицыно），留存平台公告截图以备考核申诉"]], "sourceFull": "https://www.business-gazeta.ru/news/713211"}, {"num": 2, "cat": "ecom", "catText": "电商动态", "title": "Wildberries 延迟向自提点（ПВЗ）业主结付货款，平台称系技术故障并已解决", "tag": "local", "tagText": "本地", "source": "Oborot.ru", "time": "10-10", "summary": "多名 Wildberries 自提点业主公开反映平台延迟支付其货款/佣金结算（部分称已拖欠数日），平台回应称系技术故障、目前已完成处理。自提点是 WB 末端网络的核心：全国 ПВЗ 已达约 26 万处、扩张速度放缓至年增约 25%，末端结算异常直接影响加盟商现金流与开店意愿。含义：平台与末端合作方的资金链稳定性成为新的风险点，跨境卖家应把「平台结算节奏」纳入回款风险监控，关注是否外溢到卖家侧回款与提现时效。", "table": [["主体", "Wildberries 自提点（ПВЗ）业主"], ["平台回应", "技术故障，已完成处理"], ["背景", "全国 ПВЗ 约 26 万处，扩张放缓至年增约 25%"]], "sourceFull": "https://oborot.ru/news/vladelcy-pvz-pishut-chto-wildberries-zaderzhivaet-vyplaty-markeplejs-govorit-o-tehnicheskoj-probleme-kotoruyu-uzhe-reshil-i281192.html"}, {"num": 3, "cat": "ecom", "catText": "电商动态", "title": "Ozon 借 VK 内容电商：2.2 万博主 × 70 万条视频带来超 950 万笔成交订单", "tag": "local", "tagText": "本地", "source": "Oborot.ru", "time": "10-10", "summary": "Ozon 通报其与 VK 的内容电商合作成果：2.2 万名博主累计发布约 70 万条视频，带来超过 950 万笔已成交（выкупленных）订单。内容种草到站内成单的链路正成为平台新的流量入口，同期 Retail.ru 调查亦显示 8 成 35 岁以上消费者购前观看商品视频。含义：卖家可把达人内容投放纳入 Q4 旺季获客组合，测算短视频素材与推广佣金的投入产出，并优先给高毛利、易演示的 SKU 配内容预算。", "table": [["参与博主", "2.2 万名（VK × Ozon）"], ["视频量", "约 70 万条"], ["带来订单", "超 950 万笔（已成交）"], ["同业信号", "8 成 35+ 消费者购前看商品视频"]], "sourceFull": "https://oborot.ru/news/22-tysyachi-blogerov-700-tysyach-video-kak-ozon-poluchil-iz-vk-bolee-95-mln-vykuplennyh-zakazov-i281203.html"}, {"num": 4, "cat": "ecom", "catText": "电商动态", "title": "莫斯科州仓储市场：全年成交面积或增 25% 至约 200 万㎡，租金同比 +13%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "10-11 13:27", "summary": "生意人报报道，受电商需求推动，年内仓库成交面积有望增长 25% 至约 200 万㎡，莫斯科州平均租金同比上涨 13% 至约 1.03 万卢布/㎡/年，空置率由 7.8% 降至约 5%。仓储需求持续向电商与履约服务集中。含义：卖家的 FBO 与第三方仓（3PL）仓储报价与仓位紧张度同步上行，需重算 Q4 旺季单位仓储成本、提前锁价并评估分仓策略。", "table": [["成交面积", "预计约 200 万㎡（+25%）"], ["平均租金", "约 1.03 万 ₽/㎡/年（+13%）"], ["空置率", "7.8% → 约 5%"], ["主要驱动", "电商与履约仓储需求"]], "sourceFull": "https://www.kommersant.ru/doc/9023787"}, {"num": 5, "cat": "appliance", "catText": "家电电器", "title": "IDC：2026 年 Q3 全球 PC 出货量同比 -20.1% 至 6,270 万台，前五厂商全线下滑", "tag": "local", "tagText": "本地", "source": "连塔网(Lenta.ru)", "time": "10-12 02:00", "summary": "IDC 统计显示 2026 年三季度全球 PC 出货量同比下降 20.1% 至 6,270 万台，前五厂商同步下滑：联想 -22.6%、惠普 -30.9%、戴尔 -25%、苹果 -11.3%、华硕 -8.6%，内存等零部件短缺与涨价是主因。含义：PC 及周边（内存、存储、外设）供给与价格波动将传导至以进口为主的俄市场，电脑与配件类目的采购价与到货节奏风险上升，旺季前应锁定长单并压缩低毛利 SKU。", "table": [["全球出货量", "6,270 万台（同比 -20.1%）"], ["联想/惠普", "-22.6% / -30.9%"], ["戴尔/苹果/华硕", "-25% / -11.3% / -8.6%"], ["主因", "内存等零部件短缺与涨价"]], "sourceFull": "https://lenta.ru/news/2026/10/12/pcs/"}, {"num": 6, "cat": "econ", "catText": "经济金融", "title": "关键行情：Brent 12 月合约上探 $105.58 后周末休市，央行汇率维持美元 84.90 / 欧元 94.97 / 人民币 12.67", "tag": "local", "tagText": "本地", "source": "俄央行(CBR)｜ICE", "time": "10-12 05:00", "summary": "俄市场周末休市：Brent 最近可确认报价为 10-08 晚 12 月合约 $105.58/桶（单日 +5.37%，受霍尔木兹油轮遇袭与美湾减产推动），10-11~10-12 无新报价；WTI 同期 $92.98。俄央行现行官方汇率维持美元 84.9048 ₽、欧元 94.9745 ₽、人民币 12.6739 ₽（10-13 更新），莫交所指数因周末休市本期未取得、不以上一交易日数据充数。含义：结汇与卢布定价随油价与制裁预期波动，建议按月度锁汇窗口控制敞口。", "table": [["Brent（12 月合约）", "$105.58/桶（10-08 晚，+5.37%）；周末休市无新报价"], ["WTI", "$92.98/桶（同期）"], ["央行汇率", "美元 84.9048 / 欧元 94.9745 / 人民币 12.6739 ₽"], ["莫交所指数", "周末休市，本期未取得"]], "sourceFull": "https://www.cbr.ru/currency_base/daily/?date_req=12.10.2026"}, {"num": 7, "cat": "econ", "catText": "经济金融", "title": "央行收紧电子钱包监管：批准电子货币运营商 33 项评估标准，并酝酿限制未成年人钱包、打击「钱骡」", "tag": "local", "tagText": "本地", "source": "消息报(Izvestia)", "time": "10-12 00:50", "summary": "消息报报道，央行已批准对电子货币运营商（ЭДС）按 33 项标准、4 个等级的评估方法，评估结果将影响运营商合规水平与市场准入；同时监管正酝酿限制未成年人使用电子钱包、打击「钱骡（дропперы）」的新规，因平台钱包与代收付场景广泛存在，新规可能波及电商平台及卖家的收款链路。含义：支付与结算合规要求趋严，需核对所用电子钱包/支付服务商的资质评级、用户身份核验与反洗钱流程。", "table": [["评估对象", "电子货币运营商（ЭДС）"], ["方法", "33 项标准 / 4 个等级"], ["在建新规", "限制未成年人钱包；打击钱骡（дропперы）"], ["潜在外溢", "电商平台与卖家收款/代收付链路"]], "sourceFull": "https://iz.ru/2182545/2026-10-12/tcb-uzhestochit-kontrol-za-elektronnymi-koshelkami"}, {"num": 8, "cat": "econ", "catText": "经济金融", "title": "央行与财政部拒绝赋予债券持有人就审计结论起诉的权利，同期发行人违约数近乎三倍", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "10-12 02:06", "summary": "生意人报报道，央行与财政部未支持赋予债券持有人对被审计报告（审计结论）提起诉讼的权利，理由是过度加重审计机构责任；文章同时指出俄债市发行人违约数量同比近乎三倍。含义：固收信用环境恶化、企业直接融资与再融资成本上升，对依赖债市融资的仓储、物流与平台生态企业构成压力，间接影响卖家的服务报价与账期条件。", "table": [["争议", "债券持有人对审计结论的诉权"], ["监管态度", "央行与财政部未予支持"], ["债市信号", "发行人违约数同比近乎三倍"]], "sourceFull": "https://www.kommersant.ru/doc/9024197"}, {"num": 9, "cat": "econ", "catText": "经济金融", "title": "对俄油轮运价连续第四个月上涨，制裁下影子船队与运费同步走高", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "10-12 02:06", "summary": "生意人报报道，因制裁限制与合规要求趋严，对俄原油及油品运输的油轮运价（танкерный фрахт）连续第四个月上涨，可用运力收紧、航线拉长推高单程成本。含义：全球油运与保险成本上行会通过燃油与海运附加费传导至普通集运与跨境物流，Q4 旺季运费与时效波动风险上升，建议提前锁定运价并预留改道冗余。", "table": [["指标", "对俄油轮运价（фрахт）"], ["趋势", "连续第 4 个月上涨"], ["主因", "制裁合规趋严、可用运力收紧、航线拉长"]], "sourceFull": "https://www.kommersant.ru/doc/9023766"}, {"num": 10, "cat": "politics", "catText": "时政要闻", "title": "欧盟外长会拟通过对俄「迄今最大」制裁包：逾 1,500 名个人与实体入列", "tag": "local", "tagText": "本地", "source": "Interfax", "time": "10-12 03:30", "summary": "欧盟外交消息称，10-13 卢森堡外长会将审议对俄新一轮制裁方案，规模为迄今最大：拟将逾 1,500 名个人与实体列入清单，涉及与杜马选举相关的人员、规避制裁的网络以及「影子舰队」油轮，并进一步限制金融与能源收入渠道。含义：二级制裁与合规风险面继续扩大，跨境结算、承运人与货代选择的合规审查趋严，需梳理合作方清单并留存合规尽调记录。", "table": [["会议", "欧盟外长会（卢森堡）"], ["规模", "逾 1,500 名个人与实体"], ["重点", "杜马选举相关人员、影子舰队、金融与能源收入"], ["评注", "迄今最大规模制裁包"]], "sourceFull": "https://www.interfax.ru/world/1121745"}, {"num": 11, "cat": "politics", "catText": "时政要闻", "title": "特朗普宣布「能源休战」并与俄达成柴油安排，同时施压基辅：继续打击俄炼油设施将影响美方军援", "tag": "local", "tagText": "本地", "source": "Interfax", "time": "10-12 00:59", "summary": "特朗普宣布俄乌「能源休战」，并推动莫斯科与基辅停止相互打击炼油厂（НПЗ）；美方同步扩大自俄与加拿大采购柴油的能源安排，美财长则回应欧洲批评称「指责是虚伪的」。美国共和党内部与国际伙伴对柴油安排分歧明显。含义：能源与安全议题进一步交易化，制裁口径、能源流向与美方军援存在政策反复风险，二级制裁不确定性上升，需持续跟踪结算与承运通道变化。", "table": [["表态人", "美国总统特朗普"], ["核心", "宣布俄乌「能源休战」，要求停打炼油厂"], ["同步", "美扩大自俄/加拿大采购柴油"], ["风险", "制裁与军援口径存在政策反复"]], "sourceFull": "https://www.interfax.ru/world/1121735"}, {"num": 12, "cat": "politics", "catText": "时政要闻", "title": "10-11 晚间莫斯科全部机场一度停摆，数十架航班无法降落", "tag": "local", "tagText": "本地", "source": "连塔网(Lenta.ru)", "time": "10-11 21:14", "summary": "10-11 晚间，因无人机威胁，莫斯科伏努科沃、多莫杰多沃、谢列梅捷沃、茹科夫斯基等机场先后实施起降限制，数十架航班无法在莫斯科降落，航班被分流至下诺夫哥罗德等备降机场；当晚 22:00 后各机场陆续解除限制。含义：首都空域管制频繁且有扩大趋势，空运（高价值小件、样品、备件）时效与保险条款不确定性上升，卖家需预留 1–2 天冗余并向货代确认改道与备降方案。", "table": [["时段", "2026-10-11 晚间（22:00 后陆续解除）"], ["涉及", "伏努科沃/多莫杰多沃/谢列梅捷沃/茹科夫斯基等"], ["影响", "数十架航班无法降落，分流至备降机场"]], "sourceFull": "https://lenta.ru/news/2026/10/12/vse-aeroporty-moskvy-prekratili-rabotu/"}, {"num": 13, "cat": "politics", "catText": "时政要闻", "title": "沙特利雅得/达曼机场遭无人机袭击致 1 死，阿曼近海及霍尔木兹海峡油轮接连遇袭", "tag": "local", "tagText": "本地", "source": "Interfax", "time": "10-12 02:35", "summary": "沙特利雅得机场遭无人机袭击，造成 1 人死亡、十余人受伤（胡塞武装宣称对达曼机场袭击负责），国际机场预计再关闭约一天；同期一艘商船在阿曼近海遭无人机击中起火，霍尔木兹海峡另有一艘油轮触雷，一艘油轮因故障导致博斯普鲁斯海峡一度停航。含义：中东航运与原油运输风险溢价回升，海运与保险成本上行，将通过运费与燃油附加费传导至跨境物流成本。", "table": [["利雅得机场", "无人机袭击，1 死十余人伤；预计再关闭约 1 天"], ["霍尔木兹/阿曼", "油轮触雷、商船被无人机击中"], ["连带", "博斯普鲁斯海峡因油轮故障一度停航"]], "sourceFull": "https://www.interfax.ru/world/1121743"}, {"num": 14, "cat": "politics", "catText": "时政要闻", "title": "俄多地遭无人机袭击：顿涅茨克 1 死 2 伤，雅罗斯拉夫尔州击落 1 架、布良斯克铁路一度中断后恢复", "tag": "local", "tagText": "本地", "source": "消息报(Izvestia)", "time": "10-12 03:00", "summary": "10-11 夜至 10-12 晨，乌方无人机袭击俄多地：顿涅茨克人民共和国 1 名平民死亡、2 人受伤；雅罗斯拉夫尔州击落 1 架无人机并临时调整市内交通；布良斯克州因袭击一度中断的铁路运输已恢复。含义：袭击趋于常态化，铁路与空域管制反复出现，俄境内干线运输时效与保险条款的不确定性持续，旺季备货排期应保留冗余并跟踪承运商改道通知。", "table": [["顿涅茨克", "平民 1 死 2 伤"], ["雅罗斯拉夫尔州", "击落 1 架无人机，市内交通临时调整"], ["布良斯克州", "铁路运输一度中断，已恢复"]], "sourceFull": "https://iz.ru/2182576/2026-10-12/odin-chelovek-pogib-i-dva-postradali-v-rezultate-atak-vsu-na-dnr"}, {"num": 15, "cat": "other", "catText": "其它动态", "title": "交通部明确断网与技术故障时运输电子单据（ЭПД）的办理口径", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-11 14:00", "summary": "交通部说明在无互联网连接或系统技术故障情况下如何办理运输电子单据（ЭПД）：自 9 月 1 日起运输业强制使用电子运单后，行业多次出现流程混乱与时效放缓。含义：干线运输的合规与时效风险仍在，卖家应要求承运商具备离线过渡与回退方案，并在合同中明确系统故障时的责任与时效归属。", "table": [["政策", "运输电子单据（ЭПД）离线/故障办理口径"], ["背景", "9 月 1 日起运输业强制电子运单"], ["影响", "干线运输合规与时效风险，需承运商离线预案"]], "sourceFull": "https://www.retail.ru/news/mintrans-obyasnil-kak-oformlyat-epd-bez-interneta-i-pri-tekhnicheskikh-sboyakh-11-oktyabrya-2026-283178/"}, {"num": 16, "cat": "other", "catText": "其它动态", "title": "Retail.ru 周报（05.10–11.10）：红鱼子酱产量下滑近 70%，«Перекрёсток» 推出新业态超市", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-11 10:25", "summary": "Retail.ru 周度综述显示：俄红鱼子酱产量同比下滑近 70%，新年季零售价可能上涨 4–5 倍；连锁 «Перекрёсток»（X5）推出新型数字化超市业态；ФАС 对奶渣（сырки）生产商立案调查。含义：节日食品（干货、礼盒、礼赠类目）供给与价格波动加大，旺季备货需提前锁货并评估替代品与定价弹性，同时警惕价格合规审查风险。", "table": [["红鱼子酱", "产量下滑近 70%，新年季或涨 4–5 倍"], ["零售业态", "«Перекрёсток»（X5）推出数字化新业态"], ["监管", "ФАС 对奶渣生产商立案"]], "sourceFull": "https://www.retail.ru/news/daydzhest-05-10-11-10-proizvodstvo-krasnoy-ikry-upalo-pochti-na-70-perekryestok-otkryl-supermarket-s/"}]}
