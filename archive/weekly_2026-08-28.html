）。平台生态在袭击冲击下仍保持扩张，供给侧竞争加剧。", "sourceFull": "vedomosti.ru/business/articles/2026/08/27/1224117"}, {"num": 9, "title": "WB 生态扩张：上线铁路车票销售（对标俄铁）+ 发布自研即时通讯 WB Chat", "tag": "local", "tagText": "本地", "source": "CNews", "time": "08-26~08-27", "summary": "8-27 WB 上线俄铁（РЖД）火车票直销服务，卖点免排队、免中介服务费，首日部分浏览器不显示入口、兼容性待完善；8-26 WB 发布自研即时通讯 WB Chat 公开测试版（App Store/Google Play/RuStore），功能类 Telegram（收藏夹、聊天文件夹、底部导航），初期 Google Play 下载超 1000 次、评分 2.5/5。平台向\"超级应用\"方向扩张。", "sourceFull": "cnews.ru/news/top/2026-08-27_wildberries_sozdal_ubijtsu_glavnogo；cnews.ru/news/top/2026-08-26_wildberries_zapustil_sobstvennogo"}, {"num": 10, "title": "资本运作：VTB 推迟收购 WB 银行 5% 股权交易至 9 月，配套增发 3000-4000 亿卢布不变", "tag": "local", "tagText": "本地", "source": "Interfax", "time": "08-28", "summary": "VTB 将收购 WB 银行 5% 股权交易推迟至 2026 年 9 月（月底前），配套增发 3000-4000 亿卢布计划不变，VTB 股价处于历史低位。WB 银行股权结构变动期延长，卖家需关注 WB 金融生态（结算、信贷产品）的潜在变化。", "sourceFull": "interfax.ru/business/1111724"}, {"num": 11, "title": "线上食品杂货 2026 Q2 环比首降 2.5%，板块进入饱和期", "tag": "local", "tagText": "本地", "source": "Lenta 引 URA.RU/Infoline", "time": "08-23", "summary": "Infoline 数据：2026 年 Q2 俄在线食品销售环比 -2.5%，为该板块首次出现下滑（此前持续不间断增长）。专家归因：低基数效应消退、市场趋于饱和、夏季假期季节因素。预计全年在线食品板块仍保持正增长，对 Ozon/WB 生鲜日百与即时零售增速预期有参考价值。", "sourceFull": "lenta.ru/news/2026/08/23/rossiyanam-nadoelo-zakazyvat-dostavku-produktov-v-onlayn-servisah/"}, {"num": 12, "title": "ФБК 调查：Ozon 最大股东 27.7% 股份收购资金疑与普京友人 Тимченко 关联（英文源，待核实）", "tag": "en", "tagText": "英文", "source": "Meduza 引 ФБК 调查", "time": "08-27", "summary": "ФБК 调查称，Ozon 最大股东（投资人 Чачава 所持 27.7% 股份）收购资金疑来自普京友人 Тимченко 旗下公司，并诉求对\"普京股份代持人\"实施制裁。属单方调查结论，Ozon 及涉事方尚未回应，股份代持与实控关系需官方文件证实，按待核实处理。", "sourceFull": "meduza.io/feature/2026/08/27/krupneyshiy-aktsioner-ozon-kupil-dolyu-v-marketpleyse-na-dengi-kompanii-druga-putina-gennadiya-timchenko-vyyasnil-fbk"}]}, {"icon": "🏛", "name": "时政", "items": [{"num": 13, "title": "普京将出席 11 月 APEC 峰会（深圳，11/18-19）——2017 年以来首次个人出席", "tag": "local", "tagText": "本地", "source": "Lenta 引 MИД、TASS", "time": "08-23~08-28", "summary": "俄外交部特命大使贝尔德耶夫确认：普京将率团出席 11 月 18-19 日深圳 APEC 峰会，为 2017 年以来首次个人出席；将与习近平及亚太主要经济体领导人协调重要方向，俄方正争取将 2035 年 APEC 轮值主席申请纳入峰会成果。此前总统助理乌沙科夫 8-23 称若普京与特朗普同场出席，\"不可避免地\"会面。", "sourceFull": "lenta.ru/news/2026/08/28/putin-vpervye-s-2017-goda-posetit-sammit-ates/；lenta.ru/news/2026/08/23/stalo-izvestno-o-vozmozhnoy-vstreche-putina-i-trampa-v-noyabre/"}, {"num": 14, "title": "俄乌谈判信号增多：土耳其预计年底前恢复、美国承诺斡旋、俄乌协商\"相当大规模\"换俘名单", "tag": "local", "tagText": "本地", "source": "RIA、Lenta、TASS", "time": "08-24~08-26", "summary": "土耳其政府消息人士 8-24 预计乌克兰谈判年底前恢复、安卡拉愿继续斡旋；美国常驻联合国副代表 8-25 承诺\"尽一切可能\"促成谈判、并拒签反俄涉乌声明；俄乌 8-26 确认正在协商\"相当大规模\"战俘交换名单。反向信号：佩斯科夫 8-27 称不掌握新一轮三方会谈计划信息，涅边贾称俄方收到的谈判要求\"看起来奇怪\"。实质进展仍待观察。", "sourceFull": "ria.ru/20260824/turtsiya-2112715606.html；lenta.ru/news/2026/08/25/v-ssha-poobeschali-sodeystvovat-peregovoram-mezhdu-rossiey-i-ukrainoy/；tass.ru/politika/28044695；ria.ru/20260827/pergovory-2113498964.html"}, {"num": 15, "title": "袭击升级为国际政治议题：芬兰总统公开为乌军袭击 WB 仓库辩护，克宫回应\"基辅将持续感受到\"", "tag": "local", "tagText": "本地", "source": "RIA、Lenta", "time": "08-25", "summary": "芬兰总统斯图布公开为乌克兰袭击 Wildberries 仓库辩护，基辅回应称\"任务就是杀\"；俄外交部无任所大使米罗什尼克指斯图布意在破坏和平倡议。国际红十字会 8-26 实地走访遭袭 WB 仓库（舒沙雷/红博尔）确认无军事设施。克宫 8-24 已表态：对乌方袭击商业基础设施的回应\"基辅将持续感受到\"。电商仓库遇袭已推升为国际政治议题，短期内袭击风险难见降温。", "sourceFull": "ria.ru/20260825/ukraina-2112961785.html；ria.ru/20260826/mkkk-2113363694.html"}, {"num": 16, "title": "CIA 局长 8-25 秘密访俄：CBS 称其警告莫斯科勿攻北约并谈伊朗，佩斯科夫确认系情报渠道接触", "tag": "local", "tagText": "本地", "source": "Interfax 引 CBS", "time": "08-27", "summary": "CBS 披露 CIA 局长 8-25 秘密访俄（C-17 降落伏努科沃），主要议题为警告勿攻北约及伊朗/霍尔木兹局势；佩斯科夫确认系情报渠道接触、普京未会面。美俄情报高层罕见直接接触，叠加美伊停火消息（见经济[29]），中东与俄乌两条线的外交信号同步增多。", "sourceFull": "interfax.ru/russia/1111552"}, {"num": 17, "title": "梵蒂冈外交负责人加拉格尔访俄——开战以来首次", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-25", "summary": "梵蒂冈外交负责人、总主教加拉格尔抵达莫斯科正式访问，为特别军事行动开始以来首次；俄外交委员会主席称梵蒂冈可在乌克兰人道主义议题上提供帮助。梵蒂冈渠道或成为战俘交换、儿童遣返等人道议题的旁路通道。", "sourceFull": "tass.ru/politika/28041107"}, {"num": 18, "title": "杜马选举冲刺：广播辩论启动、\"亚博卢\"被禁参选、\"新人党\"争抢其选民", "tag": "local", "tagText": "本地", "source": "Kommersant、TASS", "time": "08-25", "summary": "8-25 起\"灯塔\"\"Вести ФМ\"等开播杜马选举竞选辩论；\"亚博卢\"党被取消参选资格，其相当一部分选民成为\"新人党\"的争取目标，反对票仓面临重新分配。选战格局变化关乎 9 月统一投票日后的经济/平台监管立法走向。", "sourceFull": "kommersant.ru/doc/8907360"}, {"num": 19, "title": "9 月 1 日起俄中小学课堂全面禁用手机", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-26", "summary": "俄教育部确认，自 9 月 1 日新学年起学生课堂禁止使用手机，仅威胁师生生命健康的紧急情况除外。此前\"儿童用品+开学季\"为电商 8 月销售高峰，新规落地后家长对非智能替代品（电话手表、功能机）需求或现结构性变化。", "sourceFull": "tass.ru/obschestvo/28044497"}, {"num": 20, "title": "立陶宛威胁对加里宁格勒\"预防性打击\"，波罗的海方向对抗风险升温", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-27", "summary": "立陶宛方面威胁对加里宁格勒州实施\"预防性打击\"，背景为俄乌冲突升级与北约对抗风险；波罗的海方向紧张度上升，对俄西北物流通道与加里宁格勒飞地供应链的潜在影响需跟踪。", "sourceFull": "lenta.ru/news/2026/08/27/long-budet-unichtozhena-v-litve-prigrozili-preventivnymi-udarami-nato-po-kaliningradskoy-oblasti/"}, {"num": 21, "title": "无人机夜袭常态化：8-24 克拉斯诺达尔 2 儿童遇难、8-26 凌晨莫斯科方向 10 架+10 机场关闭、8-28 凌晨莫斯科州/雅罗斯拉夫尔/图拉再遭袭", "tag": "local", "tagText": "本地", "source": "RIA、Interfax、TASS", "time": "08-24~08-28", "summary": "8-24 凌晨克拉斯诺达尔边疆区遭大规模无人机袭击（儿童中心 2 死 7 伤），南部至少 7 座机场轮番临时关闭（萨拉托夫一夜三次）；8-26 凌晨莫斯科方向击落 10 架、超 10 座机场限航，利佩茨克州民宅坠机致 2 死；8-28 凌晨莫斯科州/雅罗斯拉夫尔/图拉州再遭袭（图拉拦截 28 架），伊万诺沃等机场临时限航。航空与区域物流夜间中断已成常态，空运时效持续承压。", "sourceFull": "ria.ru/20260824/ogranicheniya-2112715751.html；interfax.ru/russia/1111253；ria.ru/20260828/ivanovo-2113809552.html"}]}, {"icon": "📊", "name": "经济", "items": [{"num": 22, "title": "卢布全周走弱：央行官方牌价美元 83.29（8-25）→ 85.95（8-27，较 8-24 贬值约 3.2%），欧元破 100 卢布", "tag": "local", "tagText": "本地", "source": "Lenta、CBR", "time": "08-25~08-27", "summary": "央行 8-25 官方牌价美元 83.29 卢布（+37 戈比）、欧元 97.44；8-27 美元 85.95 卢布（较 8-24 的 83.29 贬值约 3.2%）、欧元 100.30 破百。VTB 行长科斯廷称对出口商更优的美元区间为 90-100 卢布，可增出口收入并补充联邦预算；РСПП 主席绍欣认为央行紧缩政策不会允许卢布大幅贬值。对跨境卖家回款汇率与定价策略有直接影响。", "sourceFull": "lenta.ru/news/2026/08/24/tsb-povysil-kurs-dollara-v-rossii/；cbr.ru/currency_base/daily/?date_req=2026-08-27"}, {"num": 23, "title": "燃料危机多管齐下：普京首谈\"确有不便\"、土耳其油轮到港、哈炼厂供油、塞瓦斯托波尔 QR 限购、卢卡申科承诺履行义务", "tag": "local", "tagText": "本地", "source": "Lenta、Kommersant、Interfax、RIA、TASS", "time": "08-23~08-28", "summary": "普京 8-23 首次公开谈燃料危机：\"确有不便\"，政府已设专门委员会管控。供给端：首艘土耳其汽油油轮（20 万桶）8 月底前抵俄、7 月底以来海运进口超 100 万桶；哈\"康登萨特\"炼厂将启动对俄汽柴油供应；卢卡申科 8-28 承诺继续履行对俄燃油义务（7 月曾供创纪录的 21.2 万吨汽油、16.2 万吨柴油）；部分炼厂检修结束将复产。需求端：塞瓦斯托波尔 8-25 起 QR 码限购（Ai-92 限 20 升）；加油站运营商请求延长柴油出口全面禁令；ФАС 今年已对燃油市场立案 45 起、发 71 份警告。", "sourceFull": "lenta.ru/news/2026/08/23/putin-vyskazalsya-o-situatsii-s-toplivom-v-strane/；kommersant.ru/doc/8906496；kommersant.ru/doc/8908160；interfax.ru/russia/1111038；lenta.ru/news/2026/08/28/pomozhem/；ria.ru/20260827/fas-2113696599.html"}, {"num": 24, "title": "GDP 与实力：年初至今 GDP 破 100 万亿卢布、预算非能源收入占比超 80%；2025 PPP 口径 7.24 万亿美元居全球第四", "tag": "local", "tagText": "本地", "source": "RIA 引世界银行", "time": "08-26~08-27", "summary": "米舒斯京通报：俄 GDP 年初至今超 100 万亿卢布（约 102 万亿），预算收入超 18.64 万亿卢布、非能源收入占比超 80%；世界银行数据：2025 年俄 PPP 口径 GDP 达 7.24 万亿美元居全球第四，领先德国 9398 亿美元，2026 年预测约 7.34 万亿美元。官方\"增长叙事\"强势，支撑预算扩张与补贴政策空间。", "sourceFull": "ria.ru/20260827/vvp-2113600517.html；ria.ru/20260826/rossiya-2113403909.html"}, {"num": 25, "title": "粮食丰收与出口链：总收成破 1 亿吨（+12.5%）、小麦出口关税上调至 1000+ 卢布/吨、政府拨 95 亿卢布补贴铁路运粮", "tag": "local", "tagText": "本地", "source": "Interfax、RIA", "time": "08-26~08-27", "summary": "俄粮食总收成突破 1 亿吨：已收 2790 万公顷、单产 36 公担/公顷（+4.3%）、同比 +12.5%；小麦出口关税 8-26 起上调至每吨 1000+ 卢布（弹性关税随基准价浮动）；政府拨超 95 亿卢布补贴农产品铁路优惠运价；米舒斯京称全球对俄农产品需求强劲、加工品出口占比持续上升。出口成本抬升或继续传导至国内粮价与食品通胀预期。", "sourceFull": "interfax.ru/russia/1111241；ria.ru/20260826/rossija-2113391957.html；ria.ru/20260827/perevozki-2113590755.html；ria.ru/20260827/mishustin-2113590017.html"}, {"num": 26, "title": "利率与信贷冷热分化：关键利率 14%（乐观情形年底 13%）、大行存款利率上限 19%、信贷发放降 1.5-2 倍、经纪账户净流入 1.1 万亿", "tag": "local", "tagText": "本地", "source": "RIA、TASS、Kommersant", "time": "08-25~08-28", "summary": "杜马金融委员会主席阿克萨科夫 8-28：乐观情形下年底关键利率可降至 13%（现 14%），关键变量为预算调整与三年预算案。Финуслуги：大行存款利率上限已触及 19%；НБКИ：信贷发放节奏同比降 1.5-2 倍、新信用卡额度收缩。Q2 经纪账户净流入 1.1 万亿卢布创阶段性高点。央行 8-28 将 MFO 现金贷款单笔上限翻倍至 10 万卢布（当铺 20 万、消费合作社最高 100 万）。高息揽储与信贷收缩并存，消费端购买力承压。", "sourceFull": "ria.ru/20260828/aksakov-2113711889.html；tass.ru/ekonomika/28044587；kommersant.ru/doc/8908201；ria.ru/20260828/tsb-2113803343.html"}, {"num": 27, "title": "数字卢布 9/1 全面商用倒计时：MTS 缴话费、Fix Price 全渠道收银、Магнит 超市收银台实测", "tag": "local", "tagText": "本地", "source": "TASS 引 Vedomosti、RIA", "time": "08-25~08-26", "summary": "MTS 客户 9 月 1 日起可用数字卢布缴话费；Fix Price 9 月 1 日起支持数字卢布支付、全部系统重要性银行就绪；莫斯科\"Магнит\"自助收银台已现数字卢布支付标识（选数字卢布→生成 QR→银行 App 扫码）。叠加此前 WB/Ozon 确认 9/1 上线，数字卢布从对公/政务场景向日常消费支付全面渗透，电商支付链路生变。", "sourceFull": "tass.ru/ekonomika/28041205；ria.ru/20260825/rubl-2113105822.html；ria.ru/20260826/logotipy-2113400362.html"}, {"num": 28, "title": "СБП 转账监管升级：НСПК 9 月 1 日起向金融监测局传输数据", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-25", "summary": "国家支付卡系统（НСПК）自 9 月 1 日起向俄金融监测局（Росфинмониторинг）传输 СБП 快捷支付转账数据，官方目的为加速数据核验、减轻信贷机构负担。个人间/小额商户 СБП 流水进入反洗钱监测视野，电商卖家私域收款合规要求趋严。", "sourceFull": "tass.ru/ekonomika/28041129"}, {"num": 29, "title": "海湾航运风险与停火信号并存：美伊停火协议或数日内官宣；伊朗海上封锁驱离 70 艘；阿曼湾油轮被击中瘫痪", "tag": "local", "tagText": "本地", "source": "RIA、Interfax", "time": "08-24~08-25", "summary": "消息人士（伊朗、巴基斯坦信源）：美伊已达成停火协议、或数日内正式宣布（6 月中旬备忘录后一度搁置）；同期 CENTCOM 通报截至 8-23 已驱离 70 艘商船、瘫痪 3 艘、登检 2 艘；阿曼湾一艘油轮被不明弹丸击中机舱瘫痪、船员安全。海湾航运风险溢价仍处高位，对俄油价格与俄能源收入的传导需持续跟踪。", "sourceFull": "ria.ru/20260825/iran-2113173135.html；interfax.ru/world/1110862；interfax.ru/world/1111054"}, {"num": 30, "title": "全球粮食价格压力抬头：NYT 预警三大支柱失灵、全球糖价创 2025 年 4 月以来新高（8 月 +26.5%）", "tag": "local", "tagText": "本地", "source": "RIA 引 NYT/FAO、Lenta 引 ICE", "time": "08-24~08-28", "summary": "NYT 引专家：全球粮食体系三大支柱（畅通贸易、廉价能源、稳定气候）当前均不成立，热浪干旱致美国等小麦主产国减产将推高粮价，黑海战区+红海绕行+巴拿马运河通航威胁共同推升运输成本。ICE 伦敦糖期货 8-28 盘中升至 18.54 美分/磅（+1.76%），为 2025 年 4 月 8 日以来最高、8 月以来 +26.5%，专家归因于厄尔尼诺与印度产量或降 300-800 万吨。土耳其专家 8-28 提议建黑海无冲突安全区以恢复俄乌粮食海运。对俄食品通胀与出口收入均为双向变量。", "sourceFull": "ria.ru/20260824/prodovolstvie-2112714888.html；lenta.ru/news/2026/08/28/mirovye-tseny-na-sahar-dostigli-maksimuma/；lenta.ru/news/2026/08/28/v-turtsii-nashli-sposob-reshit-problemu-s-morskim-vyvozom-rossiyskogo-zerna/"}, {"num": 31, "title": "小出口商结算结构：卢布份额降至 76.8%（2022H2 以来最低）、外币占 23.2%", "tag": "local", "tagText": "本地", "source": "Kommersant 引 Точка 银行", "time": "08-24", "summary": "Точка 银行数据：2026 上半年微型/小型出口企业境外入账中卢布占 76.8%（同比 -4.5 个百分点，2022H2 以来最低）、外币占 23.2%；欧亚经济联盟/独联体方向卢布结算已成标准，区外买家更多使用人民币、迪拉姆、坚戈；部分出口商因需境外采购原料设备更愿收人民币。结算货币多元化趋势对跨境收款路径选择有参考价值。", "sourceFull": "kommersant.ru/doc/8906498"}, {"num": 32, "title": "行业与劳动力：制造业平均月薪约 10 万卢布（+14%）；在俄中资企业约 1.55 万家；数字营销市场或萎缩 1-3%", "tag": "local", "tagText": "本地", "source": "RIA、Kommersant", "time": "08-25~08-26", "summary": "工贸部长阿利哈诺夫向普京汇报：俄制造业平均月薪约 10 万卢布、实际增速约 +14%；在俄中资企业约 1.55 万家、近半数集中于莫斯科及周边（其他集聚区：阿穆尔州、滨海边疆区等）；企业与政府双双缩减数字营销开支，2026 全年数字营销市场规模或下降 1-3%（公部门削减最狠），将压低电商站外获客效率。", "sourceFull": "ria.ru/20260826/zarplata-2113287620.html；ria.ru/20260826/kitay-2113295151.html；kommersant.ru/doc/8908050"}]}, {"icon": "💄", "name": "美妆", "items": [{"num": 33, "title": "渠道迁移：美妆零售自有 App 订单频次同比 +50%，金苹果客单价 +36%；品牌因平台佣金与风险撤离市场平台", "tag": "local", "tagText": "本地", "source": "Kommersant 引 MTS AdTech", "time": "08-23", "summary": "MTS AdTech 数据：2026 年 1-7 月美妆零售 App 用户下单频次同比 +50%（活跃用户仅 +4%，存量运营深化）；用户增长前三：金苹果 +13%、彩虹微笑与女友各 +11%；客单价：金苹果 +36%、Л'Этуаль +20%、Рив гош +5%。驱动因素：市场平台佣金上升与风险加大，化妆品厂商转向零售商自有线上渠道（金苹果线上占比 2024 年 50%→2025 年超 60%）。隐忧：美妆行业企业注销数量同比增 1.5 倍。", "sourceFull": "kommersant.ru/doc/8906427"}, {"num": 34, "title": "韩妆填补份额：1-7 月对俄出口 2.541 亿美元（+21%）", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-23", "summary": "韩国 2026 年 1-7 月对俄化妆品供应额 2.541 亿美元、同比增长 21%。在欧美品牌退出/收缩背景下，韩妆继续填补俄罗斯进口美妆份额，与本土品牌（上半年莫斯科 БИГ 厂产量超 4100 万件）及中国品牌形成三线竞争。对 mosai 美妆线选品与定价有对标意义。", "sourceFull": "ria.ru/20260823/koreja-2112626522.html"}, {"num": 35, "title": "市场转入\"无限循环\"消费模型：复购留存取代拉新成竞争核心", "tag": "local", "tagText": "本地", "source": "Рухим 引 Оккам 研究", "time": "08-25", "summary": "营销传播集团\"Оккам\"发布美妆客户旅程研究：市场已从线性漏斗转入\"无限循环\"模型——购买不再是终点，复购与注意力争夺成为主战场；品牌忠诚度被视为核心资产，仅靠新品首发声量已不足以建立优势。对美妆卖家提示：内容与会员运营投入权重应继续高于一次性拉新。", "sourceFull": "ruhim.ru/news/news.htm（2026-08-25 期）"}, {"num": 36, "title": "卖家损失个案：歌手 Hanna 称 WB 仓库大火烧毁 3000 万卢布化妆品、损失约 7000 万卢布营收、转自建仓", "tag": "local", "tagText": "本地", "source": "newsmuz", "time": "08-26", "summary": "歌手 Hanna 披露：WB 仓库大火烧毁其 3000 万卢布（成本口径）化妆品，营收损失约 7000 万卢布，已将库存转移至自建仓库、继续平台销售。个案折射中小卖家在遇袭风险下的被动应对路径（自建仓/多仓分散），与平台微仓化趋势方向一致。", "sourceFull": "newsmuz.com/news/pop/hanna-poteryala-kosmetiki-na-30-mln-iz-za-udarov-po-wildberries-52313"}, {"num": 37, "title": "整合与渠道结构：头部品牌 VOIS 启动品牌收购计划；AI 美妆推荐中药妆品牌霸榜、奢侈品牌\"隐身\"", "tag": "local", "tagText": "本地", "source": "retail.ru", "time": "08-27", "summary": "俄头部美妆品牌 VOIS 宣布启动品牌收购计划（全资/合伙/联合开发模式），目标为有电商基础的 beauty 品牌，美妆市场进入整合期；同期研究显示 AI 美妆推荐中面部护理药妆/皮肤学品牌霸榜（La Roche-Posay 36.9%、BIODERMA 13.2%、CeraVe 11.3%、Vichy 10.3%），奢侈品牌全部跌出前 11——AI 推荐渠道正在重塑美妆流量分配，药妆定位获结构性红利。", "sourceFull": "retail.ru/news/vois-obyavil-o-zapuske-programmy-po-priobreteniyu-kosmeticheskikh-brendov-27-avgusta-2026-281449；retail.ru/news/aptechnye-brendy-zakhvatili-top-rekomendatsiy-ii-v-ukhode-za-litsom-issledovanie-27-avgusta-2026-281452"}]}, {"icon": "🔌", "name": "电器", "items": [{"num": 38, "title": "PCB 本土化博弈：厂商联盟致函警告强制俄产材料成本涨 2-8 倍，工贸部反向收紧（13 类设备强制清单）", "tag": "local", "tagText": "本地", "source": "Kommersant", "time": "08-24", "summary": "АНО\"印刷电路板联盟\"（成员含 Yadro、GS Group、Резонит 等）8-19 致函工贸部：制裁致原料物流受阻、已现断供与违约案例，若按 719 号决议强制使用俄产材料，成本将上涨 2-8 倍甚至更多，Q4 旺季生产或延误。工贸部反向收紧：拟将 13 类 PCB 生产设备纳入强制本土化（2027-2029 年\"俄产\"认定需 20-170 分、2030-2032 年 40-240 分、2033 年起 60-290 分）。2025 年俄 PCB 市场 1.23 亿平方分米、国产仅占 24%。对电器/消费电子供给成本构成上行压力。", "sourceFull": "kommersant.ru/doc/8906437；kommersant.ru/doc/8907276"}, {"num": 39, "title": "小米 Mijia 大型家电正式入俄：451L 冰箱 79990 卢布、洗烘一体机 47990 卢布", "tag": "local", "tagText": "本地", "source": "ichip.ru", "time": "08-25", "summary": "小米 8-25 起在俄正式开售 Mijia 大型家电：451L 对开门冰箱（iFresh 变温区、Ag⁺ 除菌、双变频）79990 卢布、10.5kg 洗烘一体机（直驱电机、自动投放、蒸汽护理）47990 卢布，支持米家 App 远程控制。中国品牌大型家电以官方渠道+高性价比组合入俄，中端家电价格带竞争加剧。", "sourceFull": "ichip.ru/novosti/xiaomi-nachala-oficialnye-prodazhi-bytovoy-tehniki-mijia-v-rossii-969612"}, {"num": 40, "title": "小家电市场：上半年销量 3930 万台（+14.3%）、金额 1662 亿卢布（+4%）、均价下降 9%", "tag": "local", "tagText": "本地", "source": "New Retail 引 М.Видео", "time": "08-27", "summary": "М.Видео 数据：2026 上半年俄小家电销量 3930 万台（+14.3%）、金额 1662 亿卢布（+4%）、平均单价 -9%——量增价跌结构延续，中低价格带走量。对 mosaihome 小家电线定价与促销节奏有参考价值。", "sourceFull": "new-retail.ru/novosti/retail/rynok_maloy_bytovoy_tekhniki_v_i_polugodii_pokazal_rost_na_14/"}, {"num": 41, "title": "灰色进口整治：海关查获 13.5 吨\"灰色\"Apple/Dyson 设备（3300+ 件、货值 1.23 亿卢布）", "tag": "local", "tagText": "本地", "source": "iz.ru", "time": "08-27", "summary": "俄海关查获 13.5 吨\"灰色\"渠道 Apple/Dyson 设备，超 3300 件、货值 1.23 亿卢布，补缴关税约 3500 万卢布。平行进口执法趋严信号，跨境 3C 卖家需关注货源合规性与灰色渠道风险。", "sourceFull": "iz.ru/2156110"}, {"num": 42, "title": "汽车（扩展）：二手电动车 7 月销量创历史新高——3646 辆（同比 2.9 倍），日产占 35%", "tag": "local", "tagText": "本地", "source": "Lenta 引 Автостат", "time": "08-25", "summary": "Автостат：7 月俄二手电动车成交 3646 辆、为 2025 年 7 月的 2.9 倍，二手市场首次突破 3000 辆关口；品牌结构：日产 1281 辆（35%）、极氪 430 辆、特斯拉 337 辆，前三合计 56%；1-7 月累计 11374 辆（+67%）。新车进口端 7 月 1210 辆、阿维塔占到港量过半。", "sourceFull": "lenta.ru/news/2026/08/25/rossiyane-kupili-rekordnoe-kolichestvo-odnogo-vida-avtomobiley/"}]}, {"icon": "💡", "name": "灯具", "items": [{"num": 43, "title": "GS Led 成为首家按新规（ПП №719）纳入俄工业品名册的 LED 制造商——灯具栏目打破三周静默", "tag": "local", "tagText": "本地", "source": "CNews", "time": "08-26", "summary": "GS Group 旗下 GS Led（加里宁格勒\"Технополис GS\"）成为首家按 ПП №719 新规（2026-01-01 生效）纳入俄工业品名册的 LED 制造商：产品 0.5-6W、色温 2000-6500K、显色指数最高 CRI 98+，用于工业/室内/户外照明；名册内产品享政府采购优先。本土 LED 供给进入合规化通道。其余窗口内（08-24~08-28）检索未见灯具照明市场其他新增重大动态，按去重规则如实标注。", "sourceFull": "cnews.ru/news/line/2026-08-26_rossijskie_svetodiody_vpervye"}]}, {"icon": "🔍", "name": "待核实事件核查", "items": [{"num": 44, "title": "五项长期/新增待关注事件全周核查结果", "tag": "local", "tagText": "核查", "source": "综合检索", "time": "08-24~08-28", "summary": "①Ozon 8/28 第三次调整佣金（FBS 低价商品最高 26%）——全周无官方调佣公告，仍未获证实；②Ozon 乌法仓是否被直接击中——官方口径\"轻损、无火灾、暂停收货待检\"，直接命中与损毁程度待进一步通报；③ФБК 关于 Ozon 最大股东资金与 Тимченко 关联的调查——单方调查结论、无涉事方回应，需官方文件证实（本期[12]按待核实收录）；④8-28 晨\"又一 WB 仓库起火 2 人死亡\"传言——仅地区媒体标题，RIA/TASS/Interfax/Lenta 无对应官方通报，未计入数据库；⑤涅文诺梅斯克 Ozon 仓库——8-26 已确认 8-24 夜因无人机威胁疏散停工，按\"疏散停工\"计入遇袭数据库（Ozon 第 7 处），是否被直接击中仍待核实。", "sourceFull": ""}]}], "keyData": {"headers": ["指标", "周初（08-24/25）", "周末（08-27/28）", "趋势"], "rows": [["央行官方美元汇率（卢布）", "83.29（8-25）", "85.95（8-27，较 8-24 贬约 3.2%）", "全周走弱"], ["央行官方欧元汇率（卢布）", "97.44（8-25）", "100.30（8-27）", "破 100 关口"], ["Ozon 股价", "—", "单日 -28% 至 2112.5 卢布（8-24，2023/8 以来最低）", "暴跌"], ["莫交所指数", "—", "跌破 2100 点（8-24，Ozon 拖累超 0.6pct）", "承压"], ["Ozon 受影响仓储设施", "4 处（8-23 末）", "8 处（新增克拉斯诺达尔/马哈奇卡拉/塔赫塔穆凯/涅文诺梅斯克/乌法/奥伦堡）", "一周翻倍"], ["WB 遇袭设施", "22 城/17 地区", "22 城（8-26 科托夫斯克全毁：16 架无人机、火场超 10 万㎡、2 伤）", "新增 1 处全毁"], ["8-27 夜全俄拦截无人机", "—", "267 架固定翼", "夜间袭击常态化"], ["受损卖家总损失（含利润）", "—", "6000 亿-7000 亿卢布（Data Insight）；WB 卖家商品损失 5170-5800 亿", "巨量"], ["获赔进度", "—", "受损仓有货卖家 78%，43% 获赔、平均约 20%", "赔付偏低"], ["电商卖家总数", "—", "超 150 万（Q2 同比 +20.5%，中小 87.9%）", "持续扩张"], ["Q2 订单量 / 活跃买家", "—", "26 亿单（+38.7%）/ 9160 万人（+11.9%）", "高增"], ["GDP（年初至今）", "—", "破 100 万亿卢布（约 102 万亿）；预算收入 18.64 万亿", "高增"], ["2025 PPP 口径 GDP", "—", "7.24 万亿美元（全球第四，领先德国 9398 亿）", "全球第四"], ["关键利率", "14%", "14%（杜马金融委：乐观情形年底 13%）", "降息预期"], ["大行存款利率上限 / 信贷发放", "—", "19% / 同比降 1.5-2 倍", "冷热分化"], ["粮食总收成", "—", "破 1 亿吨（+12.5%），单产 36 公担/公顷（+4.3%）", "丰收"], ["小麦出口关税", "—", "上调至 1000+ 卢布/吨（8-26 起）", "上调"], ["制造业平均月薪", "—", "约 10 万卢布（实际 +14%）", "高增"], ["小家电上半年销量", "—", "3930 万台（+14.3%）、金额 1662 亿卢布、均价 -9%", "量增价跌"], ["韩妆对俄出口（1-7 月）", "—", "2.541 亿美元（+21%）", "填补份额"], ["全球糖价", "—", "18.54 美分/磅（8 月以来 +26.5%，2025/4 以来最高）", "大涨"], ["美妆自有 App 下单频次", "—", "同比 +50%（金苹果客单价 +36%）", "存量深化"], ["二手电动车 7 月销量", "—", "3646 辆（2.9 倍，首次破 3000）", "创新高"], ["莫斯科圈物流园成交预期", "年降 20-30%", "150 万㎡（+8%）", "由降转升"], ["海运进口汽油", "—", "超 100 万桶（7 月底以来）；首艘土耳其油轮 20 万桶", "进口补充"], ["数字卢布", "12 家大行 9/1 就绪", "MTS/Fix Price/Магнит 场景落地，9/1 全面商用", "场景爆发"]]}, "trends": [{"title": "电商物流", "text": "本周仓库遇袭从\"点状事件\"演变为\"系统性风险+制度化救助\"——Ozon 受影响设施一周翻倍（4→8 处），WB 科托夫斯克全毁，克宫承诺\"强硬回应\"、外交部定性\"协调攻击\"，叠加 8-27 夜 267 架拦截与多座机场夜间限航，履约的基础设施风险溢价仍在上升通道。同时\"袭击经济学\"开始重塑行业结构：平台转向 6 千-1 万㎡ 区域微仓、WB 卖家 FBS 兴趣 +10 倍、莫斯科圈物流园成交预期由降转升（+8%）——受损仓储面积正在转化为租赁与建设需求，核心区仓储租金上行压力值得关注。救助体系三级成型：财政部全国措施（损失超年收入 5% 可缓缴）→ 州级专项贷款（诺夫哥罗德 5%）→ 平台自纾困（Ozon 关 38 地区货到付款、取消延迟发货罚款）。卖家应把仓库分散、库存保险纳入常规成本，并跟踪 9 月后货到付款政策范围与获赔进度（当前仅 43% 卖家获赔、平均约 20%）。"}, {"title": "平台政策", "text": "监管\"一紧一松\"双向加码。紧：Ozon 以安全为由全量下架芳香吸入器、与 IT 协会升级软件类商品管控，НСПК 9/1 起将 СБП 流水纳入反洗钱监测，平台合规与收款透明度要求上升；松：政府正式批准受损卖家税/社保缓缴+暂停检查、Ozon 取消卖家延迟发货罚款。渠道端，WB 上线铁路车票+自研即时通讯 WB Chat，平台向\"超级应用\"扩张；数字卢布 9/1 全面商用进入最后一周（MTS 缴话费、Fix Price 收银、Магнит 实测、WB/Ozon 上线），支付入口换代直接改变回款链路。资本端 VTB 收购 WB 银行 5% 股权推迟至 9 月，WB 金融生态仍处变动期。"}, {"title": "经济数据", "text": "宏观组合\"增长亮眼+信贷收敛\"——GDP 年初至今破 100 万亿卢布、2025 PPP 口径 7.24 万亿美元全球第四（领先德国近万亿）、粮食收成破 1 亿吨（+12.5%）、制造业月薪 +14%，官方增长叙事强势；但金融端冷热分化：存款利率上限 19% 高息揽储、信贷发放节奏同比降 1.5-2 倍、Q2 经纪账户净流入 1.1 万亿——居民资产向存款/股市再平衡，消费信贷收缩对耐用品购买力的压制延续。关键利率 14% 之下，杜马金融委主席给出\"乐观情形年底 13%\"路径，9 月会议与 10 月三年预算案是两大观察点。卢布全周走弱 3.2%（83.29→85.95），对出口商阶段性友好（VTB 行长称 90-100 区间更优），但推升进口成本与通胀输入。"}, {"title": "能源价格", "text": "燃料危机进入\"多管齐下\"应对期——普京首次公开承认\"确有不便\"并设专门委员会；供给端：首艘土耳其汽油油轮抵俄（20 万桶）、7 月底以来海运进口超 100 万桶、哈\"康登萨特\"炼厂将供汽柴油、卢卡申科承诺履行对俄燃油义务（7 月已供 21.2 万吨汽油）、部分炼厂检修结束复产；需求端：塞瓦斯托波尔 QR 码限购（Ai-92 限 20 升）落地、ФАС 立案 45 起发 71 份警告。短期燃油紧张或边际缓解，但区域价差与配给仍将存在。海湾风险溢价仍在：美伊停火协议消息（或数日内官宣）与伊朗海上封锁（驱离 70 艘、瘫痪 3 艘）并存，阿曼湾油轮遇袭显示航运风险未消。全球农产品价格抬头（糖 8 月 +26.5%、小麦出口关税上调、NYT 预警粮价大涨），食品通胀输入压力上升，物流燃油与粮价是未来几周卖家定价的关键输入。"}, {"title": "消费市场", "text": "结构性分化延续——增长侧：小家电上半年销量 +14.3%（量增价跌、均价 -9%）、二手电动车 7 月创新高（2.9 倍）、美妆自有 App 订单频次 +50%（存量运营深化）、韩妆对俄出口 +21%、Q2 电商订单 +38.7%；承压侧：信贷发放降 1.5-2 倍、线上食品 Q2 环比首降 2.5% 预示板块饱和、物流园租金上行。美妆行业进入整合期（VOIS 启动品牌收购；AI 推荐药妆霸榜/奢牌隐身，流量分配规则生变），电器端灰色进口整治（查获 13.5 吨、货值 1.23 亿卢布）提示平行进口通道合规风险。灯具栏目本周打破三周静默（GS Led 入 ПП №719 名册、享政府采购优先），本土 LED 供给合规化通道打开，但整体仍无重大市场动态。"}], "sourceStats": "44 条收录条目中，本周日报 88 条按周视角归并改写为 40 条 + 周五补充抓取 4 条（Lenta）。本地 91 条
