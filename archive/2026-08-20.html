{"date": "2026-08-20", "stats": {"total": 19, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "俄外交部：WB物流设施遭乌军无人机协调性系列袭击，波及三地区枢纽", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-18 07:16", "summary": "俄外交部无任所大使米罗什尼克周报：Wildberries物流基础设施上周遭乌军无人机协调性系列袭击，巴什科尔托斯坦、沃罗涅日州、莫斯科州的大型区域枢纽与分拣中心被击中。叠加8/16波多利斯克、8/18波戈罗茨克两次仓库遇袭，WB仓储网络已成系统性打击目标，履约与卖家补货风险持续高位。", "table": [["遇袭范围", "巴什科尔托斯坦/沃罗涅日/莫斯科州"], ["信息来源", "俄外交部周报"]], "sourceFull": "https://ria.ru/20260818/wildberries-2111482913.html"}, {"num": 2, "title": "每10家俄购物中心或有1家到2027年关闭或转型", "tag": "local", "tagText": "本地", "source": "Lenta引《消息报》", "time": "08-19 19:36", "summary": "据《消息报》引专家预测：到2027年底俄约500~700家购物中心将大幅调整业态，其中150~250家完全停业，相当于全国每10家就有1家关闭或改造。主因是消费行为加速向线上迁移，传统商业综合体模式承压。线下零售收缩与电商渗透加深并行，长期利好平台型渠道。", "table": [["转型购物中心", "500~700家(至2027底)"], ["完全停业", "150~250家"]], "sourceFull": "https://lenta.ru/news/2026/08/19/kazhdyy-desyatyy-tts-v-rossii-mozhet-zakrytsya-ili-smenit-profil-k-2027-godu/"}, {"num": 3, "title": "中选委批准32个地区首次以电子形式统计杜马选举结果", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-19 20:37", "summary": "8/19俄中央选举委员会批准国家杜马选举的议决书与汇总表格式，并确定可以电子形式编制和传送结果的选委会名单，32个地区今秋投票将首次电子化计票。9月统一选举日临近，选举组织与监管节奏加快（此前俄方已预警境外挑衅与虚假出口民调）。", "table": [["电子化计票地区", "32个"], ["选举时间", "9月统一投票日"]], "sourceFull": "https://www.kommersant.ru/doc/8893225"}, {"num": 4, "title": "奔萨/萨拉托夫/伏尔加格勒机场夜间临时关闭，俄对乌发动新一轮打击", "tag": "local", "tagText": "本地", "source": "国际文传(Interfax)", "time": "08-19 23:29", "summary": "8/19深夜俄航空署宣布奔萨、萨拉托夫、伏尔加格勒机场临时限制起降；8/20凌晨伏努科沃机场一度限流后恢复。同期Lenta报道俄对乌克兰发动新一轮打击，第聂伯罗彼得罗夫斯克传出爆炸声。机场临时管制频率未见下降，航空物流时效扰动延续。", "table": [["受限机场", "奔萨/萨拉托夫/伏尔加格勒/伏努科沃"], ["状态", "8/20晨陆续恢复"]], "sourceFull": "https://www.interfax.ru/russia/1110209"}, {"num": 5, "title": "瑞士跟进欧盟第20轮对俄制裁：禁止LNG油轮服务等", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-19 21:39", "summary": "8/19瑞士政府宣布采纳欧盟第20轮制裁框架下的对俄措施：禁止为俄液化天然气油轮、破冰船及LNG接收终端提供服务，并禁止向俄出售油轮及经第三国转售。瑞士还首次拒绝俄公民入境就医。制裁网络向俄能源海运服务链延伸，LNG出口物流成本与船队获取难度上升。", "table": [["制裁内容", "LNG油轮/破冰船/接收终端服务禁令"], ["依据", "欧盟第20轮制裁框架"]], "sourceFull": "https://lenta.ru/news/2026/08/19/shveytsariya-vvela-novye-sanktsii-protiv-rossii/"}, {"num": 6, "title": "俄开始进口燃料：诺瓦克称燃油市场进入第二阶段紧张，25个地区汽油降价", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-19 18:31", "summary": "副总理诺瓦克8/19表示俄已开始从其他国家进口燃料（此前已禁出口+给进口税收优惠），燃油市场处于第二阶段紧张局面，政府每日监控调度；部分炼厂将于近期结束检修复产。同时俄统计局数据显示8/10-17一周汽油价格在25个地区下降（图瓦-3.46%居首）。燃油供给紧张直接影响物流运输成本。", "table": [["措施", "禁止出口+启动进口+税收优惠"], ["汽油降价地区", "25个(图瓦-3.46%居首)"]], "sourceFull": "https://ria.ru/20260819/toplivo-2111899835.html"}, {"num": 7, "title": "俄8/11-17周度通缩-0.02%，年内累计通胀+4.67%", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)据俄统计局", "time": "08-19 19:03", "summary": "俄统计局：8/11-17周度CPI为99.98%（通缩0.02%，前周-0.06%），8月以来-0.08%，年初以来+4.67%。通缩主要由果蔬拉动（-2.1%：白菜-5.4%、土豆-5.3%）及黑海旅游线路-4.8%；汽油周涨0.5%、智能手机+1%。年内通胀节奏低于往年，为央行降息留出空间。", "table": [["周度CPI", "-0.02%"], ["年内通胀", "+4.67%"], ["果蔬价格", "-2.1%"]], "sourceFull": "https://ria.ru/20260819/defljatsija-2111908026.html"}, {"num": 8, "title": "俄居民通胀预期降至13.7%，央行考虑暂停加息或降息", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-20 02:33", "summary": "央行инФОМ调查：8月居民一年期通胀预期从14.7%降至13.7%，观测通胀从15.1%降至14.3%；零售业三月价格预期从11.8%降至10.6%。分析师警告调查期未完全反映燃油第二轮紧张，10月还有公用事业费调涨。7月核心通胀年化升至7%，年通胀5.98%。市场基本情景为关键利率维持14%或下调。", "table": [["通胀预期", "13.7%(前值14.7%)"], ["观测通胀", "14.3%(前值15.1%)"], ["关键利率", "现14%"]], "sourceFull": "https://www.kommersant.ru/doc/8893267"}, {"num": 9, "title": "央行探讨与他国开展数字卢布跨境结算", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-20 04:47", "summary": "央行国家支付系统司司长巴金娜8/20接受RIA专访：正与多个外国伙伴探讨数字卢布跨境结算方案，因议题敏感暂不披露细节；前提是对方拥有自家央行数字货币平台或类似设施。目前全球仅牙买加、巴哈马、哈萨克斯坦三国正式运行CBDC。数字卢布9/1全面商用后，跨境化是下一观察点。", "table": [["全球正式运行CBDC", "3国(牙买加/巴哈马/哈萨克)"], ["数字卢布全面商用", "9月1日"]], "sourceFull": "https://ria.ru/20260820/tsb-2111953598.html"}, {"num": 10, "title": "伊朗央行行长：石油出口几乎停止；特朗普称伊朗局势改善则油价或暴跌", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-19 23:23", "summary": "伊朗央行行长赫马蒂8/19电视讲话称当前条件下石油出口几乎已经停止，但强调外汇储备足以保障药品与基本物资。同日特朗普表示若伊朗问题改善油价可能暴跌；Axios披露美军已秘密控制霍尔木兹海峡南航道两个月保障油运。油价地缘溢价逻辑面临重估（昨日Brent曾破92美元，本窗口无新报价，如实标注）。", "table": [["伊朗石油出口", "几乎停止(央行行长表态)"], ["Brent油价", "昨日破92美元(窗口内无新报价)"]], "sourceFull": "https://ria.ru/20260819/iran-2111935947.html"}, {"num": 11, "title": "俄油海运运费大涨：新罗西斯克-西印度航线+43.5%至22.3美元/桶", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-19 19:30", "summary": "ЦЦИ数据：8/10-14波罗的海港口Aframax油轮运价周涨5.2~10.8%（至印度15.2~15.9美元/桶）；黑海新罗西斯克涨幅更大：至土耳其+17.1%至12.3美元、至西印度+43.5%至22.3美元、至华北+22.7%至24.7美元/桶。Vortexa指伊俄沙美合计海运出口降至约1200万桶/日，较7月少500万桶。运费上涨侵蚀俄油出口净回值。", "table": [["新罗西斯克-西印度", "+43.5%至22.3美元/桶"], ["全球海运出口", "约1200万桶/日(较7月-500万)"]], "sourceFull": "https://www.kommersant.ru/doc/8893157"}, {"num": 12, "title": "俄铝上半年铝销量-10%至205万吨，净利润4.19亿美元扭亏", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-19 20:13", "summary": "俄铝中报：上半年铝销量同比-10%至205万吨（2024年来首次下滑），但LME铝价+33.4%（3380美元/吨）带动营收+10.9%至83.3亿美元，调整后EBITDA+64.4%至12.3亿美元，净利润4.19亿美元（上年同期亏8700万）。亚洲市场收入+20.7%至48.1亿美元、占比升至58%。金属价格高位掩盖销量走弱。", "table": [["铝销量", "205万吨(-10%)"], ["营收", "83.3亿美元(+10.9%)"], ["净利润", "4.19亿美元(扭亏)"]], "sourceFull": "https://www.kommersant.ru/doc/8893227"}, {"num": 13, "title": "俄欧上半年贸易额-13%至269亿欧元，创1999年以来同期最低", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)据Eurostat", "time": "08-20 02:06", "summary": "Kommersant据Eurostat测算：2026上半年俄欧贸易额同比-13%至269亿欧元，为1999年上半年以来最低；俄对欧出口122亿（天然气74亿居首、石油腰斩至13亿），欧对俄出口148亿，欧盟连续第二个半年对俄顺差（+26亿）。未受制裁的药品成最大输俄品类（+21%至57亿欧元）。俄欧贸易萎缩倒逼进口替代。", "table": [["俄欧贸易额", "269亿欧元(-13%)"], ["对欧石油出口", "腰斩至13亿欧元"], ["药品输俄", "+21%至57亿欧元"]], "sourceFull": "https://www.kommersant.ru/doc/8893245"}, {"num": 14, "title": "普京主持战略发展委员会：部署新投资周期，结构转型55项完成11项", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-19 21:14", "summary": "8/19战略发展与国家项目委员会会议：诺瓦克汇报经济结构转型计划55项措施已完成11项、44项在途；普京称提升投资活跃度是增长首要条件。РСПП此前警告投资暂停恐变长期冻结，企业界主要痛点为强卢布与高关键利率。政府支持重点为技术主权项目与内需部门，消费品生产获政策倾斜信号明确。", "table": [["结构转型计划", "55项完成11项"], ["企业痛点", "强卢布+高关键利率"]], "sourceFull": "https://www.kommersant.ru/doc/8893265"}, {"num": 15, "title": "央行官方美元汇率小幅下调至85.13（8/20），欧元98.54", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-19 18:17", "summary": "俄央行8/19公布8/20官方汇率：美元85.16→85.13卢布（小幅下调），欧元98.73→98.54卢布（前日再度上调后的回摆）。卢布在85附近高位拉锯，强卢布叠加高利率继续压制进口成本但也挤压出口商利润，是商界向政府反映的两大痛点之一。", "table": [["官方美元", "85.13(前值85.16)"], ["官方欧元", "98.54(前值98.73)"]], "sourceFull": "https://lenta.ru/news/2026/08/19/tsentrobank-ponizil-kurs-dollara/"}, {"num": 16, "title": "泰国有意增加进口俄石油与LNG", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-20 02:09", "summary": "俄远东发展部长切昆科夫8/20表示，泰国有兴趣扩大自俄进口石油与液化天然气（标题级收录，具体量级待核实）。俄能源出口东南亚多元化再添潜在客户，对冲对欧出口萎缩。", "table": [["状态", "标题级收录，量级待核实"]], "sourceFull": "https://tass.ru/ekonomika/28027265"}, {"num": 17, "title": "ФАС：47个地区达成抑制糖价协议", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-20 04:53", "summary": "俄联邦反垄断局8/20表示，已有47个地区当局同意签署抑制食糖价格的协议（标题级收录）。继燃油后，食品价格行政性管控范围扩大，反映政府对民生通胀的高压姿态。", "table": [["签约地区", "47个"], ["状态", "标题级收录"]], "sourceFull": "https://tass.ru/ekonomika/28027435"}, {"num": 18, "title": "上半年俄自欧盟进口化妆品及护肤品2.36亿欧元（-4%）", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)据Eurostat", "time": "08-20 02:06", "summary": "Kommersant对Eurostat俄欧贸易数据的分析显示：2026上半年俄罗斯仍从欧盟进口化妆品及各类护肤品2.36亿欧元，同比-4%，属俄自欧进口的主要品类之一（最大品类为未受制裁药品57亿欧元，+21%）。欧洲美妆输俄规模温和收缩但通道仍存，与本土品牌替代及平行进口形成持续竞争。", "table": [["对欧化妆品进口", "2.36亿欧元(-4%)"], ["对比：药品", "57亿欧元(+21%)"]], "sourceFull": "https://www.kommersant.ru/doc/8893245"}, {"num": 19, "title": "周度家电价格：吸尘器-0.1%、电视持平、智能手机+1%", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)据俄统计局", "time": "08-19 19:03", "summary": "俄统计局8/11-17周度物价：非食品类中吸尘器降价0.1%、电视机价格持平、智能手机上涨1%；新车中国产品牌价格不变、进口车+0.2%。电器品类价格整体平稳，智能手机涨幅居前，叠加卢布强势与进口通道变化，3C品类定价压力小幅上行。", "table": [["智能手机", "+1%"], ["吸尘器", "-0.1%"], ["电视机", "持平"]], "sourceFull": "https://ria.ru/20260819/defljatsija-2111908026.html"}]}
</script>
