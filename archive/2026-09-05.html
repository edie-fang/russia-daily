{"date": "2026-09-05", "stats": {"total": 11, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "Wildberries 首批合作收货点(ППТ)开业：覆盖三大联邦区，单试点处理超1万件", "tag": "local", "tagText": "本地", "source": "国际文传电讯(Interfax)", "time": "09-04 20:41", "summary": "Wildberries(RWB)9-4宣布首批合作收货点(ППТ)开业，覆盖中央/南方/西伯利亚联邦区，受理卖家供货：FBW模式下收货后转运公司物流设施，FBS模式下作中转直发自提点。业主按箱计酬(同自提点标准)，退货存放超3天另获补贴；单个测试点已处理超1万件商品，场地要求≥100平方米。这是8月仓库连遭无人机袭击后，WB绕开受损大仓、铺开分布式收货网络的关键落地。", "table": [["首批区域", "中央/南方/西伯利亚联邦区"], ["受理模式", "FBW入仓+FBS中转直发"], ["单点峰值", ">1万件"], ["场地要求", "≥100㎡(含车位/监控)"], ["报酬", "按箱计(同ПВЗ)+退货超3天补贴"]], "sourceFull": "https://www.interfax.ru/business/1113172"}, {"num": 2, "title": "Ozon 拟在 29 城引入第三方分拣/履约中心：报名经 Bidzaar，≥1500㎡仓库可参与", "tag": "local", "tagText": "本地", "source": "俄商业资讯(РБК)", "time": "09-04 18:30", "summary": "Ozon宣布启动第三方物流伙伴计划：将外部运营商分拣中心接入自有网络，首批覆盖29座城市，拥有或承租≥1500平方米仓库的业主可报名，承担收货、分拣、处理、发货职能；结算条件按服务内容个案协商，申请经Bidzaar电子交易平台提交。8月下旬马哈奇卡拉、克拉斯诺达尔、罗斯托夫、别尔哥罗德等地物流设施接连遇袭后，Ozon明显加快轻资产化、分布式履约布局以分散风险。", "table": [["首批城市", "29座"], ["仓库门槛", "≥1,500㎡(自有/承租)"], ["职责", "收货/分拣/处理/发货"], ["报名", "Bidzaar电子平台"], ["条件", "个案协商"]], "sourceFull": "https://www.rbc.ru/business/04/09/2026/6a9afab50c73c78f2ee838b2"}, {"num": 3, "title": "俄零售自有品牌(СТМ)上半年销量+9%、金额+14%，Чижик占比升至51%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-04 12:00", "summary": "NTech统计显示，2026年上半年俄连锁零售自有品牌及自产商品销量同比+9%、金额+14%，明显跑赢行业整体(销量+2.1%、金额+6.4%)。X5旗下Чижик自有品牌占比由46%升至51%，2028年目标65%；РОМИР调查7月63%受访者偶尔购买СТМ。业内预计中期СТМ占零售额比重将达28-30%(硬折扣店50-60%)，其毛利率约35%、高于第三方品牌26%，对品牌商货架与定价形成持续挤压。", "table": [["СТМ销量/金额(H1)", "+9% / +14%"], ["全渠道同期", "+2.1% / +6.4%"], ["Чижик占比", "46%→51%(2028目标65%)"], ["СТМ毛利率", "约35% vs 品牌26%"], ["中期占比预测", "28-30%"]], "sourceFull": "https://www.kommersant.ru/doc/8925421"}, {"num": 4, "title": "9-4 俄军单日拦截 480 架乌无人机、莫斯科方向 65 架：近期最强一波袭击，无平台仓受损", "tag": "local", "tagText": "本地", "source": "国际文传电讯(Interfax)", "time": "09-04 20:41", "summary": "俄国防部通报：9-4(周五)08:00-20:00莫斯科时间共拦截摧毁480架乌方固定翼无人机，覆盖莫斯科州、别尔哥罗德、布良斯克、弗拉基米尔、卡卢加、库尔斯克、奥廖尔、罗斯托夫、梁赞、斯摩棱斯克、图拉州、克拉斯诺达尔边疆区、克里米亚及黑海。莫斯科市长索比亚宁称当日飞向莫斯科的无人机累计被击落65架，残骸由应急部门处置。单日强度为近期峰值，但截至截稿无电商平台仓库受损通报。", "table": [["单日拦截", "480架(08:00-20:00 MSK)"], ["莫斯科方向", "累计65架"], ["覆盖", "11州+克拉斯诺达尔/克里米亚/黑海"], ["平台仓库", "无受损通报"]], "sourceFull": "https://www.interfax.ru/russia/1113289"}, {"num": 5, "title": "特朗普证实特使 9-5~6 携停战提议访莫斯科；泽连斯基承诺访期不对莫斯科发动空袭", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "09-04 22:14", "summary": "特朗普9-4在白宫首次官方证实：特使威特科夫与女婿库什纳将于9月5-6日访问莫斯科，带去结束乌克兰冲突的提议(称并非新方案)，周日后转赴基辅。泽连斯基此前确认双方已商定初步日期，并承诺乌方在特使访俄期间不对莫斯科发动空袭、要求俄方“镜像”保证静默。若双方落实，9-5~6前后高频无人机袭击或出现短暂窗口，对俄境内物流与仓库风险敞口是潜在缓释信号(待验证)。", "table": [["行程", "9-5~6莫斯科→9-6(周日)基辅"], ["任务", "携停战提议(非新方案)"], ["泽连斯基承诺", "访期不对莫斯科空袭(待俄回应)"], ["意义", "潜在袭击窗口期"]], "sourceFull": "https://lenta.ru/news/2026/09/04/tramp-raskryl-podrobnosti-vizita-uitkoffa-i-kushnera-v-rossiyu/"}, {"num": 6, "title": "俄8月海运原油出口环比-12%至383万桶/日(3月来最低)：黑海腰斩、对印大降59%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-04 19:04", "summary": "S&P Global数据：俄8月海运原油出口环比-12%至383万桶/日，为3月以来最低(同比+12%)。黑海港口出口较7月腰斩至38.03万桶/日——战争风险令船东回避新罗西斯克航线、运价上涨；波罗的海出口+1.7%至187万桶/日。对印出口-59%至81万桶/日，对华+9%至98万桶/日(同比-17%)，埃及转运量+319%至93.5万桶/日。Urals(普里莫尔斯克FOB,9-2)报75.63美元/桶、对Brent贴水22.86美元；拟自10-1起对炼厂解除柴油出口禁令。", "table": [["8月海运原油", "383万桶/日(环比-12%,3月来最低)"], ["黑海出口", "38.03万桶/日(腰斩)"], ["对印度", "-59%至81万桶/日"], ["对中国", "+9%至98万桶/日(同比-17%)"], ["Urals(9-2 FOB)", "$75.63/桶,贴水$22.86"]], "sourceFull": "https://www.kommersant.ru/doc/8936828"}, {"num": 7, "title": "央行官方汇率(9-5生效)：美元86.59卢布，卢布连续第三日回升", "tag": "local", "tagText": "本地", "source": "俄央行(ЦБ РФ)", "time": "09-04 11:30", "summary": "俄央行9-5生效官方汇率：美元86.5857卢布(前值86.8872)、欧元100.5693、人民币12.8849(前值12.9191)。卢布对美元连续第三个交易日回升——9-2触及86.99阶段低点后，受Brent油价高位(约95-100美元)支撑出口收入、出口商售汇及9月税期临近等因素带动，累计升值约0.4卢布。人民币对卢布同步走强至12.88，对中俄贸易结算成本形成小幅利好。", "table": [["美元", "86.5857(前值86.8872)"], ["欧元", "100.5693"], ["人民币", "12.8849(前值12.9191)"], ["趋势", "连续第3日回升"]], "sourceFull": "https://www.cbr-xml-daily.ru/daily_json.js"}, {"num": 8, "title": "Q2非现金结算占比88.4%(-0.5pp)多年首降，流通现金升至21.3万亿卢布", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-04 19:38", "summary": "俄央行《国家支付系统发展》季报(9-4发布)：2026年二季度零售非现金结算占比88.4%，环比降0.5个百分点，为多年来首次下降；央行称居民现金需求上升，现金支付量首次录得正增长。流通现金规模由年初19.7万亿卢布增至7月1日的21.3万亿；РСХБ预测2026全年现金增量达峰值3.4万亿卢布。主因包括移动网络受限与税制改革。对电商影响有限(线上支付渗透未变)，但居民现金偏好回升值得关注。", "table": [["Q2非现金占比", "88.4%(-0.5pp,多年首降)"], ["流通现金", "21.3万亿卢布(7-1)"], ["全年增量预测", "+3.4万亿卢布(РСХБ)"], ["主因", "移动网络受限+税改"]], "sourceFull": "https://www.kommersant.ru/doc/8936836"}, {"num": 9, "title": "俄气：西伯利亚力量管道2026年已三次刷新对华日供气纪录", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-04 04:53", "summary": "俄气总裁米勒9-4在油气行业日前夕会议表示，西伯利亚力量管道2026年对华供气继续刷新单日纪录——年内已三次创日供新高(1月两次、7月一次)，延续历年增供节奏。背景是俄中正商谈西伯利亚力量-贝加尔新管道及北极LNG合作。消息未披露当日具体供气数值，属对华能源出口趋势的确认性表态，间接支撑俄东部出口物流与跨境结算需求。", "table": [["年内日供纪录", "3次(1月×2、7月×1)"], ["场合", "米勒油气行业日前讲话"], ["背景", "俄中商谈新管道"], ["注", "未披露最新数值"]], "sourceFull": "https://ria.ru/20260904/miller-2115488910.html"}, {"num": 10, "title": "iPhone 18 Pro 俄市场平行进口预购价曝光：256GB 12万卢布起", "tag": "local", "tagText": "本地", "source": "Lenta(引Appleinsider)", "time": "09-04 19:10", "summary": "Appleinsider披露，俄电子零售商已开始为新款iPhone 18 Pro收取预购(苹果9-9发布会尚未举行)：平行进口渠道预购价256GB约12万卢布起、512GB约14万、1TB约18万、2TB约21万卢布，商家称正式发布后将按官方定价调整。该价位反映俄灰市/平行进口对新旗舰的定价水位与需求预期，可作为俄3C及配件市场消费力与备货定价的参考信号(待核实：9-9发布会后更新)。", "table": [["256GB", "12万卢布起"], ["512GB/1TB/2TB", "14万/18万/21万卢布"], ["状态", "发布会(9-9)前灰市预购价"], ["注", "官方定价后调整"]], "sourceFull": "https://lenta.ru/news/2026/09/04/iphone-prices/"}, {"num": 11, "title": "7月美国对俄游戏机出口创双边纪录7.48万美元(环比+2.3倍)", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-04 04:40", "summary": "据美国海关数据，7月美国对俄游戏机直接出口额达创纪录的7.48万美元，环比+2.3倍、同比+2.6倍。绝对规模极小——2022年西方对俄消费电子出口受限后，游戏机对俄供货多经第三方转口，直连通道属象征性存在。俄媒以此观察制裁下美俄零星贸易窗口，对判断俄消费电子市场实际供需参考意义有限，仅作趋势性信号。", "table": [["7月出口额", "$7.48万(纪录)"], ["环比/同比", "+2.3倍/+2.6倍"], ["解读", "制裁下零星直连通道,体量极小"]], "sourceFull": "https://ria.ru/20260904/eksport-2115571890.html"}]}
