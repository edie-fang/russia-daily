www.vedomosti.ru/economics/news/2026/11/09/1243654-stavka-ostanetsya-dvuznachnoi"}, {"num": 16, "cat": "econ", "catText": "经济金融", "title": "10 月国际储备 -108 亿美元：黄金重估贡献主要降幅；ФНБ 升至 1620.6 亿美元", "tag": "local", "tagText": "本地", "source": "Ведомости（引 ЦБ РФ）", "time": "11-09 16:26", "summary": "央行数据：10 月国际储备减少 108 亿美元，其中外汇储备从 4301.53 亿降至 4289.54 亿美元，货币黄金估值减少 96.49 亿美元（3016.07 亿→2919.58 亿），降幅主要来自黄金重估。同期 ФНБ 10 月增加 707 亿卢布，达 1620.63 亿美元，流动性部分 3.578 万亿卢布，相当于 2026 年预测 GDP 的 1.5%。", "table": [["指标", "数值"], ["10 月国际储备", "-108 亿美元"], ["其中黄金重估", "-96.49 亿美元（3016.07→2919.58 亿）"], ["ФНБ 规模", "1620.63 亿美元（10 月 +707 亿卢布）"], ["ФНБ 流动部分", "3.578 万亿卢布（占 2026 预测 GDP 1.5%）"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/11/09/1243766-mezhdunarodnie-rezervi-sokratilis"}, {"num": 17, "cat": "econ", "catText": "经济金融", "title": "拉夫罗夫：北方海航道货运量创历史新高，2026 年预计 4000 万吨", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-10 01:07", "summary": "拉夫罗夫 11-10 表示，北方海航道（Севморпуть）货运量已达历史最高，预计 2026 年全年 4000 万吨；称跨北极航线是南向运输通道「安全且有收益的替代」，同时「北—南」走廊与东部铁路 polygon 货量也在增长。对中俄海运，北极线较苏伊士航程明显缩短，但通航窗口集中在 7–11 月。", "table": [["指标", "数值"], ["2026 年货运量（预测）", "4000 万吨"], ["状态", "历史最高"], ["通航窗口", "约 7–11 月（季节性）"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/11/10/1243901-obem-perevozok-po-sevmorputi"}, {"num": 18, "cat": "politics", "catText": "时政要闻", "title": "俄美乌阿布扎比三方会谈 11-10 启动：梅金斯基率团，首议俄乌与地区安全保障", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-09 22:45", "summary": "俄代表团 11-09 晚抵达阿布扎比，11-10~11 与美、乌举行三方会谈：俄方由总统助理梅金斯基率领，成员含副外长里亚布科夫、加卢津与格鲁乌局长科斯秋科夫；美方为威特科夫与库什纳，乌方由乌梅罗夫率领。拉夫罗夫称议程第一项是俄乌及地区安全保障，佩斯科夫否认欧洲参与；路透称威特科夫与库什纳会后可能赴俄与普京会面。", "table": [["要素", "内容"], ["时间地点", "2026-11-10~11，阿布扎比"], ["俄方团长", "梅金斯基（总统助理）"], ["首项议程", "俄乌与地区安全保障"], ["欧洲参与", "佩斯科夫否认；欧盟称已确认参与（口径冲突）"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/11/09/1243886-rossiiskaya-delegatsiya-pribila"}, {"num": 19, "cat": "politics", "catText": "时政要闻", "title": "欧盟把对乌军事训练任务延至 2028-11-15，追加近 3 亿欧元并首次设驻乌存在", "tag": "local", "tagText": "本地", "source": "Интерфакс", "time": "11-09 21:15", "summary": "欧盟理事会 11-09 决定把 EUMAM Ukraine 任务授权再延两年至 2028-11-15，预算近 3 亿欧元，并首次规定在乌克兰境内设常驻存在，以便与乌军及国际伙伴直接对接。此前 Politico 报道北约对乌军援缺口约 70 亿欧元。含义：欧洲对乌军事投入制度化，制裁与俄欧对立长期化。", "table": [["要素", "内容"], ["延期", "至 2028-11-15（+2 年）"], ["预算", "近 3 亿欧元"], ["新增", "首次在乌境内设常驻存在"]], "sourceFull": "https://www.interfax.ru/world/1127922"}, {"num": 20, "cat": "politics", "catText": "时政要闻", "title": "加拿大制裁 38 家实体与 24 名个人：含弹道导弹技术、网络行动与加密交易所", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-09 15:52", "summary": "加拿大 11-09 宣布新一轮制裁，针对 38 家俄罗斯实体与 24 名个人，重点为参与弹道导弹技术研发的国防工业企业、网络行动参与者，并把加密货币交易所等金融结构纳入。加方称将继续对俄施压。含义：涉密支付与加密结算通道进一步收窄。", "table": [["要素", "内容"], ["实体 / 个人", "38 家 / 24 人"], ["重点", "弹道导弹技术、网络行动"], ["新增范围", "加密货币交易所等金融结构"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/11/09/1243751-kanada-vvela"}, {"num": 21, "cat": "politics", "catText": "时政要闻", "title": "11-09 夜袭列宁格勒州致死 1 人：КИНЕФ 炼厂被命中起火，当夜全俄击落 430 架", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-09 11:22", "summary": "列宁格勒州长 Дрозденко 通报：11-09 夜间该州遭袭，1 人死亡（居民楼被碎片击中，其余住户疏散并设临时安置点）；无人机命中基里希市 КИНЕФ 炼厂区域并引发火灾，已控制；基里希供热设备受损、供电短暂中断后恢复，全州击落 113 架。俄国防部称 11-08 20:00 至 11-09 08:00 在 16 个地区击落 430 架无人机，圣彼得堡普尔科沃等 7 座机场一度限航。", "table": [["要素", "内容"], ["死亡", "1 人（列宁格勒州，居民楼碎片）"], ["命中", "基里希 КИНЕФ 炼厂区域起火（已控制）"], ["击落", "全州 113 架 / 全俄 16 地区 430 架"], ["机场", "普尔科沃、多莫杰多沃、伏努科沃等 7 座限航"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/11/09/1243612-odin-chelovek"}, {"num": 22, "cat": "politics", "catText": "时政要闻", "title": "普京 11-11 主持莫斯科 ОДКБ 峰会：将通过总结宣言与至 2030 年反恐战略", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-09 13:36", "summary": "克里姆林宫确认普京将出席 11-11 莫斯科集体安全条约组织（ОДКБ）峰会，会上讨论集体安全体系完善与国际问题，计划签署总结宣言与至 2030 年反恐战略；同期普京还将主持体育委员会会议并召开安全会议。含义：集安框架强化，对中亚转口与 EAEU 通道政策有连带影响。", "table": [["要素", "内容"], ["时间地点", "2026-11-11，莫斯科"], ["文件", "总结宣言 + 至 2030 年反恐战略"], ["同期", "体育委员会、安全会议"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/11/09/1243693-putin-provedet"}, {"num": 23, "cat": "other", "catText": "其它动态", "title": "Changan 在俄召回 1905 辆 UNI-V：车机界面可能无法显示俄语", "tag": "local", "tagText": "本地", "source": "Retail.ru（引 Росстандарт）", "time": "11-09 09:58", "summary": "«Чанъань Моторс Рус» 向 Rosstandart 报备召回 1905 辆 2023-09-01 至 2026-04-22 期间售出的 UNI-V 掀背车，原因是车机界面存在无法以俄语显示的可能，影响视觉/语音信息与指令输入；将通过软件升级免费修复。含义：进口车机本地化合规趋严，平行进口车型的俄语界面与 EAC 一致性风险上升。", "table": [["指标", "数值"], ["召回数量", "1905 辆"], ["生产/售出区间", "2023-09-01 ~ 2026-04-22"], ["原因", "车机界面可能非俄语"], ["处置", "免费软件升级"]], "sourceFull": "https://www.retail.ru/news/changan-otzyvaet-v-rf-pochti-2-tys-liftbekov-uni-v-9-noyabrya-2026-284161/"}]}
