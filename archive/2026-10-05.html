.2、4.2.5、4.2.7、3.5、4.5.1、6.2）；季节性商品寻回/退库窗口顺延至 2026-11-01 ~ 2027-01-31，时限 70 个日历日。", "table": [["⏱ 生效时间", "2026-10-01（已生效）"], ["🎯 实际影响", "Ultima 类目每单成本上浮 0,5 个百分点，须复核定价与毛利；平台争议处理提速，反向压缩我方证据准备与回复窗口"], ["✅ 建议动作", "客服/财务 2 周内把申诉与索赔 SLA 调整为 15 天内闭环，并核对 Ultima 商品到手毛利，必要时调价或迁移分区"]], "sourceFull": "https://yandex.ru/support/marketplace/ru/marketing/ultima"}, {"num": 7, "cat": "platform", "catText": "平台规则变动", "title": "Wildberries 新规生效日再度后延至 10-30/11-09，电子滑板车新增 DBW 渠道", "tag": "local", "tagText": "本地", "source": "Wildberries 官方文档（经 ferta.su 监测）", "time": "10-01 09:00", "summary": "Wildberries 再次推迟一批新条款生效时间：п.4.6.1 与 п.4.9 改为 2026-10-30 生效；п.9.11.11 第 6、7 项与 п.13.7 改为 2026-11-09 生效（罚款清单相关条款生效日此前已由 08-31 推迟至 10-01，单项处罚金额未变，如 п.20 仍为 100 000 ₽）。另在《禁止商品清单》第 48 项中，电子滑板车新增「Деливери WB」(DBW) 销售渠道，此前仅支持「Витрина」「Витрина Экспресс」与卖家自提。", "table": [["⏱ 生效时间", "2026-10-30 / 2026-11-09（上一轮为 10-01）"], ["🎯 实际影响", "WB 规则过渡期再次延长，罚款与合规压力短期缓解，核查节点需后移；滑板车类目新增交付方式，渠道更灵活"], ["✅ 建议动作", "合规岗把 WB 新规核查与应对节点统一改至 10-29 与 11-08；有电动滑板车 SKU 的评估开通 DBW 渠道"]], "sourceFull": "https://ferta.su/izmeneniya#wildberries-perenos-srokov"}, {"num": 8, "cat": "ecom", "catText": "电商动态", "title": "律师：买家导致商品外观或配件损坏等情形，平台可依法拒绝退货", "tag": "local", "tagText": "本地", "source": "ТАСС", "time": "10-05 01:49", "summary": "俄罗斯法律界人士（Кутафин 大学金融法教研室副教授 Карпов）就平台退货规则说明：若商品外观损坏或配件缺失系买家原因造成，平台/卖方可以拒绝退货退款；退货权行使以商品保持完好、可再次销售为前提，具体判定依《消费者权益保护法》与平台规则执行。含义：退货争议中卖家举证更为关键，售后话术与验收留证流程需规范化。", "table": [["可拒退情形", "外观损坏／配件缺失系买家所致"], ["判定依据", "消费者权益保护法＋平台退货规则"]], "sourceFull": "https://tass.ru/obschestvo/28180979"}, {"num": 9, "cat": "ecom", "catText": "电商动态", "title": "俄政府拟将「面向反无人机防护的无偿转让商品」列入免征增值税清单", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-02 20:26", "summary": "俄罗斯政府计划补充增值税免税业务清单：为反无人机（БПЛА）防护目的无偿转让的商品将免征增值税。此举与 10-03 期收录的受袭卖家税费递延（政府令 №1277）形成配套，指向同一政策方向——降低因无人机袭击产生的企业与卖家成本。含义：参与反无人机防护捐赠/配套的供应链环节税务成本下降。", "table": [["主体", "俄罗斯政府（草案，待通过）"], ["内容", "反无人机防护用无偿转让商品 → 免征增值税"]], "sourceFull": "https://www.retail.ru/news/bezvozmezdnuyu-peredachu-tovarov-dlya-tseley-zashchity-ot-bpla-osvobodyat-ot-nds-2-oktyabrya-2026-282876/"}, {"num": 10, "cat": "ecom", "catText": "电商动态", "title": "IT 税收优惠或扩至电子书与有声书服务", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-02 21:11", "summary": "有法案提交国家杜马：拟将 IT 行业税收优惠适用范围扩展至电子书与有声书服务，使数字内容平台可适用与 IT 公司相同的优惠税率与费率待遇。含义：数字内容渠道税负下降，间接利好内容型消费与相关硬件（阅读器、耳机）需求；我方数字内容/订阅类业务可评估适用性。", "table": [["主体", "法案（已提交国家杜马）"], ["对象", "电子书、有声书服务"]], "sourceFull": "https://www.retail.ru/news/nalogovye-it-lgoty-mogut-rasprostranit-na-servisy-elektronnykh-i-audioknig-2-oktyabrya-2026-282879/"}, {"num": 11, "cat": "appliance", "catText": "家电电器", "title": "Samsung 首次在俄罗斯智能手机销售额上超过 Apple", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-04 10:25", "summary": "Retail.ru 周报（28.09–04.10）汇总：在俄罗斯智能手机市场，Samsung 首次在销售额（收入口径）上超过 Apple；同期俄罗斯 Metro 资产被移交临时管理、「Около」连锁营收创纪录增长 61,2%。含义：俄智能手机价格带与品牌结构继续重排，韩系在中高价段份额上行，安卓生态相关的配件与小家电可随之调整投放结构。", "table": [["关键结论", "Samsung 销售额首次超 Apple（俄市场）"], ["同期", "Metro 俄资产移交临时管理；«Около» 营收 +61,2%"]], "sourceFull": "https://www.retail.ru/news/daydzhest-28-09-04-10--4-oktyabrya-2026-282885/"}, {"num": 12, "cat": "econ", "catText": "经济金融", "title": "Brent 突破 103 美元/桶", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "10-05 02:02", "summary": "10-05 凌晨油价走高：Brent 原油价格突破 103 美元/桶。结合 ОПЕК+ 维持 11 月配额不变，短期油价对供应政策与地缘扰动仍高度敏感。含义：油价上行推高俄境内干线运输与仓储能耗成本，同时强化卢布收入侧的能源现金流，中俄陆运/铁路报价的 Q4 假设需留出上浮空间。", "table": [["Brent", ">103 美元/桶"]], "sourceFull": "https://ria.ru/20261005/neft-2122205575.html"}, {"num": 13, "cat": "econ", "catText": "经济金融", "title": "欧元区 9 月通胀升至 3,8%，创三年新高（能源项 +18,8%）", "tag": "local", "tagText": "本地", "source": "Коммерсантъ / Eurostat", "time": "10-05 01:30", "summary": "Eurostat 数据：欧元区 9 月消费者价格指数同比升至 3,8%（8 月 3,2%），为三年最高；主要推手仍是能源价格，能源项同比 +18,8%（上月 +14,3%）。含义：欧洲通胀回升削弱其降息空间与消费需求，对以欧洲为终端的转口/配套链条构成压制；欧元区能源成本上行也会间接抬高俄欧之间替代性物流成本。", "table": [["欧元区 CPI", "3,8%（前值 3,2%）"], ["能源项", "+18,8%（前值 +14,3%）"]], "sourceFull": "https://www.kommersant.ru/doc/9005955"}, {"num": 14, "cat": "econ", "catText": "经济金融", "title": "粮食货运获铁路最高优先级，其他货类让行", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "10-05 01:30", "summary": "据《Коммерсантъ》，为刺激俄粮出口，政府大幅提升粮食铁路运输优先级：粮食将按「第三类优先顺序」运输，即等同于依总统令/指示运输的货物，优先于绝大多数其它货类。含义：秋季出口旺季，集装箱与非粮大宗货物在俄铁（РЖД）网络上的时效与站点配额可能被挤压，涉俄线铁路/多式联运的发货计划需预留缓冲并提前订舱。", "table": [["优先级", "第三类（等同总统令货物）"], ["目的", "刺激粮食出口"]], "sourceFull": "https://www.kommersant.ru/doc/9005995"}, {"num": 15, "cat": "econ", "catText": "经济金融", "title": "机构预计 10 月国家福利基金（ФНБ）购汇规模成倍增长", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "10-05 03:57", "summary": "金融机构预期，10 月国家福利基金（ФНБ）的购汇规模将出现成倍增长。含义：预算规则下的购汇规模放大会增加外汇需求，对卢布汇率形成阶段性压力；跨境回款与结汇节奏需据此调整，避免在汇率波动区间内被动换汇。", "table": [["预期", "10 月 ФНБ 购汇成倍增长"]], "sourceFull": "https://ria.ru/20261005/fnb-2122210690.html"}, {"num": 16, "cat": "econ", "catText": "经济金融", "title": "ОПЕК+ 七国维持 11 月石油产量配额不变", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "10-04 16:10", "summary": "ОПЕК+ 相关七国（含俄罗斯、沙特）决定维持 11 月产量配额不变（10-04 期已收录会前安排，本期为结果）。含义：产量政策延续，短期油价走势更多取决于地缘扰动与需求侧变化，卢布与物流成本假设可暂时维持现状。", "table": [["决议", "11 月配额维持不变"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/10/04/1234087-opek-sohranila-kvoti"}, {"num": 17, "cat": "politics", "catText": "时政要闻", "title": "普京下周将出席在土库曼斯坦举行的独联体（СНГ）峰会", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "10-04 12:28", "summary": "克里姆林宫通报，普京将于下周赴土库曼斯坦参加独联体峰会。含义：中亚方向高层往来密集，与中亚仓储/转运节点（哈萨克斯坦、乌兹别克斯坦、土库曼斯坦）相关的政策与通关便利化动向值得跟踪，或影响我方在中亚的备选履约链路。", "table": [["事件", "普京出席 СНГ 峰会（土库曼斯坦）"], ["时间", "下周"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/10/04/1234062-putin-na-sleduyuschei-nedele"}, {"num": 18, "cat": "politics", "catText": "时政要闻", "title": "德国总理默茨突访基辅并公开向普京喊话，德国追加 13,5 亿欧元援助", "tag": "local", "tagText": "本地", "source": "Ведомости / Lenta.ru", "time": "10-04 17:58", "summary": "德国总理默茨（Мерц）未经宣布到访基辅，公开向普京喊话并表示准备谈判；同日德方宣布向乌克兰追加 13,5 亿欧元援助。俄方对此反应强烈。含义：欧洲对乌援助与谈判姿态同步加码，短期看不到制裁与物流环境的缓和信号，涉欧转口与合规审查标准预计维持严格。", "table": [["事件", "默茨突访基辅＋对普京喊话"], ["援助", "德国追加 13,5 亿欧元"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/10/04/1234097-germaniya-napravit-ukraine"}, {"num": 19, "cat": "politics", "catText": "时政要闻", "title": "俄防空一夜击落 559 架无人机，单日口径逾千架", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "10-04 08:36", "summary": "俄方通报：10-04 夜间防空部队在俄各州上空击落 559 架无人机，其中多次为飞向莫斯科方向的目标，莫斯科机场一度按「许可」模式接收与放行航班；当日累计击落规模超过 1 000 架（含 1 222 架的单日口径）。含义：无人机攻防强度维持高位，首都及南部空域扰动反复出现，空运时效与商务出行需长期准备备选方案，平台仓与物流节点的安全溢价不宜下调。", "table": [["夜间击落", "559 架（含莫斯科方向）"], ["单日口径", "1 222 架"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/10/04/1234044-sili-pvo-unichtozhili"}, {"num": 20, "cat": "politics", "catText": "时政要闻", "title": "哈巴罗夫斯克边疆区政府编制缩减 15%", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "10-05 02:22", "summary": "哈巴罗夫斯克边疆区决定将政府领导层编制缩减 15%。含义：地方财政继续压缩行政支出，远东地区政府采购与服务需求结构或随之调整；对以政企采购为渠道的品类（照明、电气、工具）需关注区域预算节奏变化。", "table": [["措施", "边疆区政府编制 -15%"]], "sourceFull": "https://ria.ru/20261005/khabarovskiy-2122206656.html"}, {"num": 21, "cat": "other", "catText": "其它动态", "title": "Volvo 在俄注册其标志商标，有效期至 2035 年 12 月", "tag": "local", "tagText": "本地", "source": "Retail.ru / ТАСС", "time": "10-04 12:33", "summary": "据 ТАСС 记者查证，Volvo 已在俄注册公司标志商标，覆盖第 7、12、37 类（机器与机械设备、发动机与电力驱动、车辆与电动车/混动车，以及安装、维修、保养、电动车充电与建筑/充电设备租赁服务）；申请于 2025 年 12 月自瑞典提交，2026 年 9 月完成注册，有效期至 2035 年 12 月。Volvo 自 2022 年 2 月暂停在俄业务，其俄资产此前已移交俄方投资者。含义：外资品牌在俄商标层面延续布局，为未来渠道回归或本地授权留出空间。", "table": [["商标类别", "МКТУ 7、12、37"], ["有效期", "至 2035 年 12 月"]], "sourceFull": "https://www.retail.ru/news/volvo-zaregistrirovala-v-rossii-tovarnyy-znak-svoego-logotipa-4-oktyabrya-2026-282899/"}, {"num": 22, "cat": "other", "catText": "其它动态", "title": "«Авито Подработка»：老龄灵活就业需求上行，销售顾问岗位报价 +62%", "tag": "local", "tagText": "本地", "source": "Retail.ru / «Авито Подработка»", "time": "10-04 14:02", "summary": "«Авито Подработка» 统计 2026 年第三季度面向退休年龄执行者的用工需求：设备与器材技术维修养护类增幅最大（+74%，平均 3 900 ₽/班）；单岗位增幅第一为家具组装工（+93%，平均 5 000 ₽/班），其次为杂工（+86%，平均 7 971 ₽/班）与销售顾问（+62%，平均 8 000 ₽/班）。含义：老龄劳动力在零售与末端服务环节的供给增加，可在季节性用工与门店/取货点人力配置上评估弹性用工。", "table": [["技术维修养护", "+74%（3 900 ₽/班）"], ["家具组装", "+93%（5 000 ₽/班）"], ["销售顾问", "+62%（8 000 ₽/班）"]], "sourceFull": "https://www.retail.ru/news/avito-podrabotka-spros-na-prodavtsov-konsultantov-sredi-pensionerov-vyros-na-62-4-oktyabrya-2026-282900/"}]}
