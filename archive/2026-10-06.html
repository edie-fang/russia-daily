: "10-06 00:37", "summary": "据《消息报》援引两名知情人士，Сбер 正准备以四足「机器狗」充当配送机器人，试点已于 9 月中旬在莫斯科启动；目前尚无真实订单与下单入口，公司称在发展可物理交互的 Physical AI 方向。末端配送自动化仍处早期验证阶段，暂不改变现有履约方案，但值得跟踪其对「最后一公里」成本曲线的长期影响。", "table": [["试点时间", "2026 年 9 月中旬（莫斯科）"]], "sourceFull": "https://ria.ru/20261006/sber-2122463579.html"}, {"num": 16, "cat": "other", "catText": "其它动态", "title": "俄百万人口城市中约半数家居用品门店数量下降", "tag": "local", "tagText": "本地", "source": "生意人报 (Коммерсантъ)", "time": "10-06 02:26", "summary": "据《生意人报》，俄罗斯约半数百万人口城市出现「家居用品（товары для дома）」专业门店数量下降，被认为是线下竞争加剧与消费渠道转移的结果。家居品类的线下分流与线上集中趋势延续，线上内容与货架运营的重要性进一步上升。", "table": [["百万人口城市", "约半数家居门店数下降"]], "sourceFull": "https://www.kommersant.ru/doc/9006725"}]}
