{"date": "2026-09-02", "stats": {"total": 17, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "三大平台启动数字卢布支付：WB/Ozon/Yandex Market 下单可选", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-02 01:37", "summary": "俄新社实测：Wildberries、Ozon、Yandex Market 三大电商平台已在支付方式中新增数字卢布选项（与银行卡/СБП并列）。数字卢布为俄央行推出的第三货币形态，9月1日起12家大型银行开放数字钱包，覆盖约80%市场。对卖家而言，支付通道扩容或改善转化率，但需关注结算时效与退货规则变化。", "table": [["平台", "WB / Ozon / Яндекс Маркет"], ["入口", "支付方式新增数字卢布"], ["背景", "9-1起12家银行开放钱包"]], "sourceFull": "https://ria.ru/20260902/rubl-2114773154.html"}, {"num": 2, "title": "曼图罗夫：政府掌控平台遇袭局面，支持措施部委间讨论中", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "09-02 04:21", "summary": "第一副总理曼图罗夫表示，政府正收集并分析企业界关于电商仓储遇袭的应对建议，相关支持措施由 ФНС（税务局）、财政部、经发部、工贸部参与讨论。这是副总理级对\"受袭卖家救助\"议题的最新确认，此前 Минэк 8-28 已召开数字平台总部会议，受损卖家税收缓缴政策已先行落地。", "table": [["表态", "第一副总理曼图罗夫"], ["参与部委", "ФНС/Минфин/Минэк/Минпромторг"], ["阶段", "建议收集分析中"]], "sourceFull": "https://tass.ru/ekonomika/28068109"}, {"num": 3, "title": "公共院：10月平台经济法生效后平台不得未经卖家同意打折", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "09-02 04:17", "summary": "公共院公共监督委员会成员 Машаров 表示，10月生效的平台经济法将为平台经济建立统一系统法律框架，平台未经卖家同意不得自行打折。对卖家属利好：平台补贴式降价促销或受限，定价权回归卖家；但需注意促销协同规则、佣金与流量机制可能同步调整，建议提前检查店铺折扣授权设置。", "table": [["表态", "公共院委员 Машаров"], ["生效", "10月平台经济法"], ["影响", "平台折扣需卖家同意"]], "sourceFull": "https://tass.ru/ekonomika/28068077"}, {"num": 4, "title": "俄Top-10食品零售商H1营收增速放缓至11.6%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-02 02:35", "summary": "Infoline数据：俄Top-10食品零售连锁2026上半年营收增速放缓至11.6%。原因包括竞争加剧、成本上升（含燃油危机推高物流成本）及居民实际收入下降。食品零售是电商价格锚点品类，增速放缓信号叠加汽油纪录价，提示下半年俄罗斯内需与消费支出可能承压，卖家定价需更谨慎。", "table": [["H1营收增速", "+11.6%（放缓）"], ["主因", "竞争/成本/收入下降"], ["数据源", "Infoline"]], "sourceFull": "https://www.kommersant.ru/doc/8923610"}, {"num": 5, "title": "德国终止柏林俄之家协议、9-18前关闭波恩俄总领馆，俄称将回应", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "09-01 18:51", "summary": "德国外长宣布终止柏林\"俄罗斯之家\"文化中心活动协议，并决定9月18日前关闭俄罗斯驻波恩总领馆。此举为德方对8月初莱比锡机场无人机事件的回应措施之一。俄外交部回应称将\"视需要\"采取回应措施（Interfax 9-2）。俄欧关系再降温，关注后续对经贸与结算环境的间接影响。", "table": [["措施", "终止俄之家协议+关波恩总领馆"], ["时限", "9-18前"], ["背景", "莱比锡机场无人机事件"]], "sourceFull": "https://lenta.ru/news/2026/09/01/germaniya-zakryla-russkiy-dom-i-genkonsulstvo-rossii/"}, {"num": 6, "title": "俄单日拦截1050架无人机+13枚航弹，莫斯科21架", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "09-01 19:50", "summary": "俄国防部通报：24小时内全俄拦截乌克兰方向1050架无人机及13枚航空炸弹，单日拦截量创新高；其中莫斯科当天击落21架（索比亚宁晚间通报新增4架）。袭击规模维持高位但电商仓库连续两天无直接命中，空袭风险仍是物流履约的最大外部变量，建议持续分散库存。", "table": [["全俄单日拦截", "1050架无人机+13枚航弹"], ["莫斯科", "当日21架"], ["电商仓", "无直接命中"]], "sourceFull": "https://lenta.ru/news/2026/09/01/chislo-sbityh-na-podlete-k-moskve-dronov-vozroslo/"}, {"num": 7, "title": "美财长贝森特：乌克兰问题需各方直接对话；西卢安诺夫赴美会晤", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "09-02 01:40", "summary": "美财长贝森特在G20财长会后表示，乌克兰冲突解决离不开所有相关方的直接接触——回应俄财长西卢安诺夫出席北卡阿什维尔G20会议并与他会晤一事。贝森特同时称与俄接触重要（Interfax），尽管欧洲方面不满。俄美财长直接会晤为俄乌冲突以来罕见高层接触，关注后续对制裁与贸易的边际影响。", "table": [["场合", "G20财长会（阿什维尔）"], ["会晤", "贝森特×西卢安诺夫"], ["表态", "冲突需各方直接对话"]], "sourceFull": "https://lenta.ru/news/2026/09/02/vizit-siluanova-v-ssha-svyazali-s-ukrainskim-uregulirovaniem/"}, {"num": 8, "title": "普京比什凯克记者会：粮食协议后仅0.2%乌克兰粮食到非洲", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-01 23:59", "summary": "普京在比什凯克（上合峰会+双边会谈后）记者会上称，黑海粮食协议执行期间仅0.2%乌克兰粮食运抵非洲，其余以高价流向欧洲发达国家；并称俄愿意向德国供应天然气但\"柏林不敢\"、受损炼油厂已修复90%。粮食协议\"已死\"（俄外交部口径）背景下，全球粮价与俄农业出口政策值得关注。", "table": [["到非洲比例", "仅0.2%"], ["对德供气", "俄愿供，称\"柏林不敢\""], ["НПЗ修复", "90%"]], "sourceFull": "https://ria.ru/20260901/zerno-2114763274.html"}, {"num": 9, "title": "别尔哥罗德州知识日遭袭3伤：舍别基诺/拉基特诺耶", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "09-01 22:37", "summary": "别尔哥罗德州通报9月1日（知识日）遭乌方袭击共3人受伤：舍别基诺一架无人机撞击路面致1人声压伤，另有2名卡车司机遭无人机袭击受伤；拉基特诺耶村FPV无人机损毁3栋民房外墙及3辆汽车。袭击目标均为民用设施、不涉及电商平台仓库，但该州紧邻俄乌边境，物流通道风险持续。", "table": [["伤亡", "3人"], ["地点", "舍别基诺/拉基特诺耶"], ["性质", "非平台物流目标"]], "sourceFull": "https://lenta.ru/news/2026/09/01/nazvano-chislo-postradavshih-iz-za-atak-vsu-na-rossiyskiy-region-v-den-znaniy/"}, {"num": 10, "title": "Brent盘中突破97美元后回落至96.65，美伊互袭推升油价", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-02 04:03", "summary": "美伊军事互袭（美国打击伊朗防空/雷达设施，伊朗反击美军基地）推升油价：Brent 12月期货盘中突破97美元/桶（7月24日以来首次，TASS口径），至03:58回落至96.65美元（+1.48%）；WTI涨1.98%至92.2美元。油价高企将抬升俄罗斯物流与燃油成本，并影响进口商品到岸价。", "table": [["Brent", "96.65美元(+1.48%)"], ["盘中高点", ">97美元"], ["WTI", "92.2美元(+1.98%)"]], "sourceFull": "https://ria.ru/20260902/neft-2114781045.html"}, {"num": 11, "title": "АИ-92汽油75,470卢布/吨创纪录", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-02 02:35", "summary": "生意人报：АИ-92汽油批发价升至75,470卢布/吨，创历史纪录。燃油危机持续传导：对电商而言，快递干线运输与仓储冷链成本直接承压；结合Brent破97、食品零售商成本上升，物流费用上行或成下半年卖家履约成本最大变量，建议评估运费调价与包邮门槛。", "table": [["АИ-92", "75,470卢布/吨（纪录）"], ["传导", "物流/零售成本上行"]], "sourceFull": "https://www.kommersant.ru/doc/8923536"}, {"num": 12, "title": "2027年起俄新增\"住房存款\"+\"社会存款\"", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-02 03:18", "summary": "2027年1月1日起俄罗斯推出住房存款：资金仅限购房/建房使用，存款保险保额最高1000万卢布（普通存款为140万），存够首付可享优惠房贷锁定；社会存款面向多子女家庭、领取补发退休金者等，最高50万卢布、期限1年、可随时存取不损失利息。银行体系新增吸储工具，或影响市场利率走向。", "table": [["住房存款保额", "最高1000万卢布"], ["用途", "仅限购房/建房"], ["社会存款", "最高50万/1年期"], ["生效", "2027-01-01"]], "sourceFull": "https://ria.ru/20260902/vklady-2114775608.html"}, {"num": 13, "title": "加密市场正式交易或临近新年：缺央行细则", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-01 19:00", "summary": "9月1日加密货币合法流通法生效后，俄加密市场交易尚未启动：参与者仍在搭建基础设施并等待央行下位法细则，正式交易预计临近新年。此前法律允许合格投资者经许可平台交易、非合格投资者年度限额30万卢布，外贸结算可用加密币。外贸收款与结算通道的逐步合规化值得跨境卖家关注。", "table": [["现状", "法律生效、交易未启动"], ["障碍", "央行下位法细则未出"], ["预期", "交易临近新年"]], "sourceFull": "https://www.kommersant.ru/doc/8923498"}, {"num": 14, "title": "央行外币取现限制再延半年至2027-03-09", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-01 17:03", "summary": "俄央行将外币现钞取现限制再延长半年至2027年3月9日：2022年3月9日前开立的账户仍限取余额但不超1万美元等值（此前未动用过该额度者），其余资金仍可通过转账等方式使用。限制源于西方制裁禁止俄金融机构购买外币现钞。对跨境卖家：美元/欧元现金流动性受限持续，结算应优先本币与人民币通道。", "table": [["延长至", "2027-03-09"], ["限额", "≤1万美元等值（老账户）"], ["原因", "制裁禁止购西方现钞"]], "sourceFull": "https://ria.ru/20260901/ekonomika-2114672528.html"}, {"num": 15, "title": "苹果最便宜笔记本MacBook Neo俄市场降至5万卢布", "tag": "local", "tagText": "本地", "source": "Lenta引Hi-Tech Mail.ru", "time": "09-01 18:49", "summary": "苹果入门笔记本MacBook Neo（3月发布）俄市场售价降至约5万卢布：主流线上平台53,000卢布、部分小平台低于5万；4个月前上市价最低7万卢布。学生与办公定位的MacBook Neo价格下探，反映俄消费电子渠道库存压力与需求疲软，苹果产品线降价或带动整体笔电市场价格中枢下移。", "table": [["现价", "<5万卢布（平台53,000）"], ["4个月前", "最低7万卢布"], ["定位", "学生/办公入门"]], "sourceFull": "https://lenta.ru/news/2026/09/01/neo/"}, {"num": 16, "title": "ГК「Элемент」\"Кубик\"电源电子生产或推迟一年", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-02 02:35", "summary": "俄最大微电子控股集团「Элемент」的电源电子\"Кубик\"量产项目或推迟一年启动。消息源称与关键参数变化有关（具体未点名）。电源电子是家电/照明/充电设备上游，本土化产能延期意味着进口替代节奏放缓，相关电子元器件供应与价格或维持紧平衡。", "table": [["项目", "电源电子\"Кубик\"量产"], ["推迟", "或延后一年"], ["原因", "关键参数变化"]], "sourceFull": "https://www.kommersant.ru/doc/8923591"}, {"num": 17, "title": "俄汽车工业2035战略更新：公布强弱项", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "09-02 04:40", "summary": "俄公布更新版汽车工业发展战略（至2035年）评估：俄汽车工业强项为生产产能规模与自主开发能力（含发动机等核心部件），短板项未完全披露（TASS标题级信息）。此前Автостат预测俄本土品牌年底份额或超中国品牌。俄系与中系车企份额之争进入关键期，配件与售后市场格局或随之变化。", "table": [["强项", "产能规模+自主开发"], ["依据", "汽车工业战略2035更新版"], ["背景", "本土品牌份额追赶中国品牌"]], "sourceFull": "https://tass.ru/ekonomika/28068165"}]}
