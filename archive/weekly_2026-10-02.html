动员节奏进入秋季阶段，农村与东南部地区劳动力紧张可能加剧、物流与仓储季节性缺员风险上升，Q4 用工与排班计划宜提前锁定弹性人力。", "table": [["编制人数", "244 万人"], ["秋季征兵", "约 12 万人"], ["起运", "10-10 起（农村 10-15）"]], "num": 11, "tag": "local", "tagText": "本地", "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/28/1232522-putin-uvelichil-chislennost"}]}, {"icon": "📊", "name": "经济", "items": [{"title": "10-01「组合拳」生效：消费贷 5 年+额度压至 1/5、家庭按揭差异化（最低 2%）、ЖКХ +9.9%、军人薪资指数化", "source": "俄新社(RIA) / Интерфакс / Известия", "time": "10-01", "url": "https://ria.ru/20261001/tsb-2121338949.html", "summary": "10-01 起一批直接影响居民钱包与消费的规则生效：① 央行收紧零售信贷宏观审慎限额——5 年以上消费贷额度压缩至原来的 1/5；② 家庭按揭新条款：按子女数与地区差异化、最低 2%（首都区上限 1,200 万卢布、补贴期封顶 15 年）；③ 公用事业费率平均 +9.9%；④ 军人薪资指数化 +4%、两类退休人员养老金翻倍。含义：Q4 大件消费（家电/灯具/家居）的信贷弹性下降、分期渗透承压，同时收入端获得局部补偿——定价与分期工具组合需重新测算。", "table": [["消费贷", "5 年+额度压至 1/5"], ["家庭按揭", "最低 2%（差异化）"], ["ЖКХ", "平均 +9.9%"], ["军人薪资", "+4% / 养老金翻倍"]], "num": 12, "tag": "local", "tagText": "本地", "sourceFull": "https://ria.ru/20261001/tsb-2121338949.html"}, {"title": "通胀预期再走高至 14.2%；央行把 50 美元/桶列为宽松「门槛价」，机构押注 12 月「新年礼物」", "source": "生意人报(Kommersant) / Vedomosti", "time": "09-29 ~ 09-30", "url": "https://www.kommersant.ru/doc/8989929", "summary": "俄央行数据显示 9 月居民对未来 12 个月通胀的中位预期升至 14.2%（+0.5 п.п.；有储蓄者 12.8%、无储蓄者 15.4%）；同时央行研究称 50 美元/桶的「门槛价」或成宽松理由，ВТБ 称 12 月利率决定可能是「新年礼物」。含义：通胀预期继续脱锚、压制降息节奏，但若油价与制裁链条稳定，12 月存在政策转向窗口；Q4 促销预算应按高通胀假设测算并设 ROI 下限，运费/仓租/人工成本沿用保守口径。", "table": [["通胀预期（9 月）", "14.2%（+0.5 п.п.）"], ["有/无储蓄者", "12.8% / 15.4%"], ["门槛价", "50 美元/桶或成宽松理由"], ["下次议息", "10-23；12 月或成「礼物」"]], "num": 13, "tag": "local", "tagText": "本地", "sourceFull": "https://www.kommersant.ru/doc/8989929"}, {"title": "财政与能源：2027–2029 预算草案提交杜马（三年赤字约 2% GDP）；石油出口周收入创 2022 年来新高、柴油禁令延至 10-31", "source": "生意人报(Kommersant) / Lenta.ru / Vedomosti", "time": "09-28 ~ 10-02", "url": "https://www.kommersant.ru/doc/8990879", "summary": "① 2027–2029 联邦预算草案提交杜马：三年连年为赤字、约 2% GDP；审计院称全年油气收入预计 7.3 万亿卢布、缺口 1.6 万亿（-18%）。② 俄石油出口周收入创 2022 年以来新高（单周 27.5 亿美元），但 Brent 10-02 收跌至 99.05 美元；柴油出口禁令再延至 10-31，Новак 称「有盈余才会考虑恢复出口」。含义：财政收紧下补贴削减与「精准加税」方向延续；柴油管制延续保内需、但成品油与汽油价格链条仍是 Q4 物流成本的主要不确定项。", "table": [["预算赤字", "约 2% GDP（三年）"], ["油气收入缺口", "1.6 万亿卢布（-18%）"], ["出口周收入", "27.5 亿美元（2022 来最高）"], ["柴油禁令", "延至 10-31"]], "num": 14, "tag": "local", "tagText": "本地", "sourceFull": "https://www.kommersant.ru/doc/8990879"}]}, {"icon": "💄", "name": "美妆", "items": [{"title": "«М.Косметик» 上半年关闭 97 家门店（同比 4.6 倍）：美妆线下收缩、线上迁移加速", "source": "生意人报(Kommersant) / Infoline", "time": "09-27 ~ 09-28", "url": "https://www.kommersant.ru/doc/8987392", "summary": "Infoline 统计：«М.Косметик»（原 «Магнит Косметик»）1–6 月关闭 97 家门店，为去年同期（21 家）的 4.6 倍；上半年净营收 1,165 亿卢布、仅增 0.8%（上年同期 +6.2%）。母公司 «Магнит» 同期关闭 5 家大型/超市与 1 家 «Азбука вкуса»，折扣业态新开店从 845 家降至 211 家。分析称非食品类线上渠道已占 57%。含义：美妆线下收缩、需求向线上迁移加速——线上货架竞争与流量成本将继续上行，线下铺货型供应商需重排渠道权重。", "table": [["关店", "97 家（4.6 倍）"], ["净营收", "1,165 亿（+0.8%）"], ["线上占比", "非食品 57%"], ["业态", "折扣新开店大幅收缩"]], "num": 15, "tag": "local", "tagText": "本地", "sourceFull": "https://www.kommersant.ru/doc/8987392"}, {"title": "БАД 进口关税 35% 于 10-02 生效；调研：半数俄罗斯人服用膳食补充剂", "source": "生意人报(Kommersant) / 零售网(Retail.ru)", "time": "09-27 ~ 10-02", "url": "https://www.kommersant.ru/doc/8988103", "summary": "① 政府对消费包装 БАД（膳食补充剂）加征 35% 进口关税，10-02 生效、执行至 2027-12-31（现行 10–20%）：DSM Group 估算零售价将涨 10–15%，不友好国家产品占市场金额 32.8%（含 Solgar、Бак-Сет、Детримакс 等主流品牌）；② 调研（Repeat/Ромир）：18–45 岁俄罗斯人 50% 服用 БАД、系统健康管理者中渗透率 65%。含义：保健与「保健+个护」组合品的采购结构向本土/中国供应链切换，10 月前完成价格与标签合规调整。", "table": [["关税", "+35%（10-02 生效）"], ["执行期", "至 2027-12-31"], ["预计涨价", "零售 +10–15%"], ["服用率", "50%（健康人群 65%）"]], "num": 16, "tag": "local", "tagText": "本地", "sourceFull": "https://www.kommersant.ru/doc/8988103"}, {"title": "「自我关怀」消费走高（SPA +78%）；«Азбука вкуса» 推自有美妆线 Easy Beauty", "source": "零售网(Retail.ru) / Ведомости", "time": "09-29 ~ 09-30", "url": "https://www.retail.ru/news/yukassa-rossiyane-stali-bolshe-vkladyvatsya-v-zabotu-o-sebe-29-sentyabrya-2026-282740/", "summary": "① «ЮKassa» 支付数据：俄居民「自我关怀」支出全面走高——SPA 营业额 +78%（客单价 +30% 至 7,138 卢布）、医学检验机构 +61%、诊所 +48%、药品零售 +28%、眼镜店 +28%；② «Азбука вкуса» 推出自有护理品牌 Easy Beauty：首批 10 个单品、规划 28 个品类（含男士与儿童线），自研+代工，行业估算投入 2,500–4,000 万卢布。含义：高客单护理场景放量（家用美容仪、功能性护理的溢价空间优于基础洗护）；食品零售商以自有品牌切入个护、低价段竞争加剧。", "table": [["SPA 营业额", "+78%（客单价 7,138 ₽）"], ["医学检验", "+61%"], ["Easy Beauty", "10 SKU → 28 品类"], ["投入估算", "2,500–4,000 万卢布"]], "num": 17, "tag": "local", "tagText": "本地", "sourceFull": "https://www.retail.ru/news/yukassa-rossiyane-stali-bolshe-vkladyvatsya-v-zabotu-o-sebe-29-sentyabrya-2026-282740/"}]}, {"icon": "🔌", "name": "电器", "items": [{"title": "Apple 失去俄智能手机销售额第一（份额 23%）：消费者向中端 Android 与复新机集中", "source": "Известия / 零售网(Retail.ru)", "time": "09-28 ~ 09-30", "url": "https://iz.ru/2175763/2026-09-30/apple-utratila-pervoe-mesto-v-rf-po-prodazham-smartfonov-v-dengakh", "summary": "① Apple 在俄智能手机销售额份额同比下降约 16 п.п. 至 23%，让出金额口径第一（Samsung 升至 24%；Apple 销量份额仅约 7%、位列第五）；② «М.Видео»：开学前最后一周复新（восстановленные）Android 手机需求环比 +13%，8 月复新机销量较 7 月 +15%（Xiaomi +62%、Honor +35%、Huawei +6%）。含义：消费者向中端 Android 与复新机集中、高端旗舰价格弹性下降——中低价位机型、配件、以旧换新与复新渠道的备货权重应上调。", "table": [["Apple 份额", "23%（-16 п.п.）"], ["Samsung", "24%（反超）"], ["复新机需求", "+13~15%"], ["Xiaomi", "+62%"]], "num": 18, "tag": "local", "tagText": "本地", "sourceFull": "https://iz.ru/2175763/2026-09-30/apple-utratila-pervoe-mesto-v-rf-po-prodazham-smartfonov-v-dengakh"}, {"title": "俄微电子生产商或获扩大税收优惠：国产替代与元器件溯源核查并行推进", "source": "零售网(Retail.ru) / Vedomosti", "time": "09-28 ~ 09-29", "url": "https://www.retail.ru/news/rossiyskim-proizvoditelyam-mikroelektroniki-mogut-rasshirit-nalogovye-lgoty-28-sentyabrya-2026-282678/", "summary": "报道称俄微电子（микроэлектроника）生产商有望获得扩大的税收优惠；此前 Vedomosti 报道俄将基于 «Интегральные системы» 组建统一的微电子公司、已掌握约 60 种关键电子材料的生产。叠加 «Честный знак» 对电子产品供应商的溯源核查（识别「以国产名义使用进口件」），政策取向为借税收与监管工具双轮拉动本土半导体与元器件产能。含义：对依赖进口元器件的家电、灯具与消费电子构成中期成本与合规变量，供应链本地化资料需提前备查。", "table": [["方向", "微电子税收优惠扩围"], ["载体", "«Интегральные системы»"], ["关键材料", "已掌握约 60 种"], ["配套", "маркировка 溯源核查"]], "num": 19, "tag": "local", "tagText": "本地", "sourceFull": "https://w
