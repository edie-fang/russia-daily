B 按均价减佣金赔付、ЭДО 走流程、年底分期"], ["收费", "按烧毁货值抽成（100% 预付或 50/50）"], ["官方回应", "WB 无额外赔付渠道；АУРЭК 确认系诈骗"]], "num": 10, "tag": "local", "tagText": "本地"}, {"title": "库存搬出平台仓：分销商占 3PL 库容升至 43%（1-9 月），平台卖家与小型零售商开始租用外部库容", "source": "生意人报(Kommersant)", "time": "09-11", "summary": "2026 年 1-9 月分销商在 3PL 仓（运营商承揽运输到仓储全流程）总面积中占比升至 43%，电商平台卖家与小型零售商成为新增租户，主动避免把全部库存压在平台自有仓。仓库遇袭常态化下，物流外包与多仓分散成为主流应对，平台「仓配一体化」的黏性被削弱，第三方仓储运营商话语权上升。", "url": "https://www.kommersant.ru/doc/8941252", "table": [["分销商占 3PL 库容", "43%（2026 年 1-9 月）"], ["新增租户", "平台卖家＋小型零售商"], ["驱动", "平台仓遇袭风险、避免库存单点集中"], ["趋势", "物流外包＋多仓分散（去中心化）"]], "num": 11, "tag": "local", "tagText": "本地"}, {"title": "平台打假升级：米舒斯京要求保护消费者，Роспатент 商品卡真伪核验机制 2027-03-01 上线", "source": "РИА Новости", "time": "09-10", "summary": "米舒斯京 9-10 强调必须保护俄公民免受平台假货侵害并帮助权利人解决知识产权争议；Роспатент 已开发商品卡真实性核验机制，2027-03-01 上线——数字平台将自动比对独家权利与商标注册库，核验卖家与商品。对平台卖家而言，品牌授权链、商标证明与进口合规文件将成为刚性材料，否则卡片可能被批量下架。", "url": "https://ria.ru/20260910/rospatent-2116760011.html", "table": [["核验对象", "商品卡/卖家（自动比对独家权利＋商标库）"], ["上线时间", "2027-03-01"], ["官方口径", "米舒斯京：保护消费者免受平台假货侵害"], ["对卖家", "授权链与合规文件成为刚性"]], "num": 12, "tag": "local", "tagText": "本地"}, {"title": "Роспатент：俄本土品牌注册申请增 23% 至 7.5 万件，服装与电子品类最活跃", "source": "Ведомости", "time": "09-10", "summary": "Роспатент 局长祖博夫向米舒斯京汇报：2026 上半年俄本土品牌注册申请量同比 +23% 至 7.5 万件，覆盖服装、食品与电子等品类；发明专利申请约 1.1 万件（+15%）、IT 软件登记申请 +20%，近五年俄科学家累计提交 14 万件专利。本土供给替代提速，进口卖家的竞争强度与合规门槛同步抬升。", "url": "https://www.vedomosti.ru/business/news/2026/09/10/1227822-zubov-chislo-otechestvennih", "table": [["品牌注册申请", "7.5 万件（2026H1，+23%）"], ["活跃品类", "服装、食品、电子产品"], ["发明专利", "约 1.1 万件（+15%）"], ["IT 软件登记", "+20%"]], "num": 13, "tag": "local", "tagText": "本地"}, {"title": "Ростех 首个工业品电商平台 PCAT.ru 刚全面上线即遭强力黑客攻击、门户不可访问", "source": "РИА Новости", "time": "09-09", "summary": "Ростех 旗下工业技术电商平台 PCAT.ru 自 9 月起覆盖集团全部民品企业（180+ 企业/科研机构、1,250+ 产品、370+ 技术能力、周访问量 23,000+）后随即遭强力黑客攻击，门户不可访问；公司称正在消除后果、恢复访问，未披露来源与数据影响。俄首个工业品电商平台开局即遇网攻，平台基础设施安全成为新的风险点。", "url": "https://ria.ru/20260909/marketplejs-2116549577.html", "table": [["平台", "PCAT.ru（Ростех）"], ["事件", "全面上线后即遭强力黑客攻击"], ["官方", "正在恢复访问，未披露来源与数据影响"], ["规模", "180+ 企业；1,250+ 产品"]], "num": 14, "tag": "local", "tagText": "本地"}, {"title": "「Госуслуги」通知：建议使用俄本土浏览器或安装 Минцифры 证书，否则平台站点访问或异常", "source": "РИА Новости", "time": "09-10", "summary": "俄公民收到「Госуслуги」通知：建议使用俄本土浏览器或安装 Минцифры 证书，以便无故障访问俄境内网站、电商平台与银行服务。此前多项境外证书在俄受限，导致平台页面加载与支付出现异常。对跨境卖家而言，店铺后台稳定性、支付回执与客服链路越来越依赖俄本土访问环境，应准备替代网络/设备方案。", "url": "https://ria.ru/20260910/gosuslugi-2116924434.html", "table": [["通知渠道", "「Госуслуги」"], ["建议", "俄本土浏览器 / 安装 Минцифры 证书"], ["影响面", "俄境内网站、电商平台、银行服务"], ["对卖家", "后台与支付链路的本土化访问依赖上升"]], "num": 15, "tag": "local", "tagText": "本地"}, {"title": "「Герофарм」撤回对 WB（РВБ）的诉讼：平台删除与药品同名的 БАД 卡片后双方和解", "source": "Ведомости", "time": "09-09", "summary": "«Герофарм» 撤回了对 ООО «РВБ»（Wildberries+Russ 合并主体）的诉讼：平台出现与「Седжаро」「Семавик некст」等减重药同名或近似的 БАД、或误导消费者，WB 在起诉前已删除争议卡片，双方约定继续合作打假；对 БАД 供应商的诉讼照常进行。平台商品命名合规审查趋严，卖家应避免「傍药名/傍品牌」。", "url": "https://www.vedomosti.ru/business/news/2026/09/09/1227277-gerofarm-otkazalsya", "table": [["主体", "«Герофарм» vs ООО «РВБ»"], ["起因", "与减重药同名/近似的 БАД 卡片"], ["结果", "WB 已删卡；撤诉申请已提交法院"], ["启示", "商品命名合规审查趋严"]], "num": 16, "tag": "local", "tagText": "本地"}, {"title": "标记制度成效显现：俄 БАД 合法进口商数量增加 13 倍", "source": "ТАСС", "time": "09-11", "summary": "塔斯社：实行强制标记（「诚实标识」）制度后，俄 БАД（膳食补充剂）合法进口商数量增长 13 倍，灰色渠道被大幅压缩，合规供应商成为线上保健品类的主要供给来源。与 Роспатент 商品卡核验、Герофарм 撤诉等信号叠加，平台健康品类的准入与合规门槛在快速抬升。", "url": "https://tass.ru/ekonomika/28103637", "table": [["指标", "БАД 合法进口商数量"], ["变化", "+13 倍（标记制度后）"], ["含义", "灰色渠道压缩、合规供给集中"]], "num": 17, "tag": "local", "tagText": "本地"}]}, {"icon": "🏛", "name": "时政", "items": [{"title": "美特使穿梭收官：维特科夫/库什纳称「和谈要素齐备」，白宫由万斯/鲁比奥团队起草一揽子方案，三方会晤或很快官宣", "source": "Lenta（引 FT/美方/俄分析人士）/ Ведомости", "time": "09-07 ~ 09-08", "summary": "维特科夫与库什纳 9-5 在莫斯科与普京会谈 3 小时 10 分、9-6 在基辅会见泽连斯基后乘专列离乌，称「和平要素齐备」、俄美乌三方新一轮会谈或很快官宣；白宫由万斯/鲁比奥团队起草一揽子和平方案（目标长期和平而非单纯停火），FT 称带往的是按 2 月停摆后形势修订的旧版文件、核心仍是顿巴斯领土。俄分析人士质疑缺乏实质进展空间。", "url": "https://lenta.ru/news/2026/09/07/uitkoff-i-kushner-pokinuli-kiev-posle-vstrechi-s-zelenskim；https://lenta.ru/news/2026/09/07/long-witkoff/", "table": [["行程", "莫斯科 9-5（3h10m）→基辅 9-6→专列离乌"], ["表述", "「和平要素齐备」，三方会晤或很快官宣"], ["方案", "万斯/鲁比奥团队起草一揽子方案"], ["焦点", "顿巴斯领土；FT 称系修订版旧文件"], ["对市场", "若停火推进，仓袭风险/卢布/消费信心联动改善"]], "num": 18, "tag": "local", "tagText": "本地"}, {"title": "普京与特朗普第 5 次通话（约 1 小时）：尽快结束冲突将打开「宏大且可观」的美俄经贸前景", "source": "生意人报(Kommersant) / Lenta / Ведомости", "time": "09-08", "summary": "普京与特朗普 9-8 通话约 1 小时，为年内第 5 次（上次 7-4），议题为威特科夫/库什纳 9-5~6 访莫斯科与基辅的成果；特朗普称尽快结束冲突将打开全面恢复美俄关系的「宏大且可观」前景、经贸互利巨大，望任内突破；普京正面评价美方斡旋并重申「无对欧侵略计划」。乌沙科夫称气氛积极、保持联系；拉夫罗夫称特使会谈基于「乌不入约＋承认地面现实」立场。", "url": "https://www.kommersant.ru/doc/8939381", "table": [["时长/次数", "约 1 小时 / 年内第 5 次"], ["特朗普表述", "结束冲突→美俄经贸「宏大且可观」前景"], ["俄方", "普京正面评价斡旋；重申无对欧侵略计划"], ["佐证", "拉夫罗夫：基于乌不入约＋承认地面现实"]], "num": 19, "tag": "local", "tagText": "本地"}, {"title": "鲁比奥：莫斯科与基辅会谈「内容充实」、近期或出新调解计划；特朗普-泽连斯基或 9 月会面", "source": "РИА Новости（ТАСС/Lenta/Интерфакс 交叉）", "time": "09-09", "summary": "鲁比奥称莫斯科与基辅的会谈「内容充实」、有新想法，近期或出台新调解计划、不排除三方接触；泽连斯基称乌准备寻求妥协，此前透露三方会晤地点讨论，乌方拉达则称美方条件「比以往更差」。另有美媒称特朗普-泽连斯基或 9 月会面（未官宣）。和谈若推进将改善仓袭风险、卢布与消费联动，但反复属常态、不宜线性外推。", "url": "https://ria.ru/20260909/rubio-2116460583.html", "table": [["鲁比奥", "会谈「内容充实」，近期或出新调解计划"], ["泽连斯基", "准备寻求妥协；三方会晤地点讨论中"], ["乌方质疑", "拉达称美方条件「比以往更差」"], ["传闻", "特朗普-泽连斯基或 9 月会面（未官宣）"]], "num": 20, "tag": "local", "tagText": "本地"}, {"title": "双向「静默」到期：普京「3 天不打击基辅」9-8 0:00 到期、泽连斯基「停袭莫斯科」9-8 23:59 到期——窗口期内莫斯科方向无遇袭通报", "source": "ТАСС / Ведомости", "time": "09-08 ~ 09-09", "summary": "普京自 9-5 0:00 起「3 天不打击基辅」的窗口于 9-8 0:00 到期；泽连斯基「9-6~8 不袭莫斯科/基辅」承诺于 9-8 23:59 到期。窗口期内莫斯科方向确无遇袭通报，但俄境内其他地区袭击未停（彼尔姆、鞑靼斯坦、萨拉托夫、克里米亚等）。窗口关闭后莫斯科方向风险或回升，仓配风控不宜松懈。", "url": "https://tass.ru/politika/28088947", "table": [["普京停打基辅", "9-5 0:00 起 3 天，9-8 0:00 到期"], ["泽连斯基承诺", "9-6~8 不袭莫斯科/基辅，9-8 23:59 到期"], ["兑现", "莫斯科方向无遇袭通报；其余地区未停"], ["风险", "窗口关闭后莫斯科方向风险或回升"]], "num": 21, "tag": "local", "tagText": "本地"}, {"title": "静默到期前后大规模夜袭：单夜拦截 ertainment（2026-09）"], ["拟覆盖", "化妆品、首饰、配饰、餐具、食品饮料、广告"], ["信号", "西方品牌在俄商标布局或重启"], ["对卖家", "排查命名/图案侵权风险"]], "num": 50, "tag": "local", "tagText": "本地"}, {"title": "摩尔曼斯克鳕鱼胶原蛋白获亚太多国认证：月产 3.5 吨，大部分产量留国内", "source": "РИА Новости", "time": "09-09", "summary": "摩尔曼斯克生物技术企业成为俄首家以北大西洋鳕鱼生产低分子胶原蛋白的厂商，已取得日本、巴西、阿联酋、卡塔尔、科威特、巴林、韩国市场认证并扩大出口地理；月产海洋胶原蛋白 3.5 吨，大部分产量保留给俄本土市场。俄美妆原料端的进口替代与出口双线推进，本土原料供应链地位上升，相关成品价格或有结构性变化。", "url": "https://ria.ru/20260909/kollagen-2116458421.html", "table": [["产品", "低分子鳕鱼胶原蛋白（俄首家）"], ["认证市场", "日本/巴西/阿联酋/卡塔尔/科威特/巴林/韩国"], ["产能", "3.5 吨/月"], ["分配", "大部分产量留俄市场"]], "num": 51, "tag": "local", "tagText": "本地"}]}, {"icon": "🔌", "name": "电器", "items": [{"title": "美妆连锁「跨界」卖电器成新增长极：Золотое яблоко 俄本土品牌电器销售两年增 4.3 倍", "source": "生意人报(Kommersant)", "time": "09-07", "summary": "Золотое яблоко 公布：H1-2026 店内俄品牌电器销售额 +37%、销量 +19%（增速超化妆品等全品类），耳机/音箱金额同比 ×3.1、销量 ×2.8；两年间（2026.1-8 vs 2024 同期）金额 ×4.3、数量 ×3。俄品牌占金额 25-30%（美妆＋小家电＋个护电器盘约 4000 亿卢布，个护电器约 1000 亿），智能音箱俄语助手机型份额 >96%。Л'Этуаль 2025 年美容设备销售超 2 亿卢布/7.7 万台。渠道多元化是当前美妆零售最大结构变化。", "url": "https://www.kommersant.ru/doc/8937525", "table": [["H1-2026 俄品牌电器", "金额 +37% / 销量 +19%"], ["耳机/音箱", "金额 ×3.1（销量 ×2.8）"], ["两年增速", "金额 ×4.3、数量 ×3"], ["俄品牌份额", "金额 25-30%"], ["智能音箱", "俄语助手机型份额 >96%"]], "num": 52, "tag": "local", "tagText": "本地"}, {"title": "М.видео 获 17.5 亿卢布 7 年期授信，投建「自营＋合作自提点＋快递柜」多品类电商平台", "source": "Ведомости", "time": "09-07", "summary": "М.видео 获得 17.5 亿卢布 7 年期授信（2033-09 到期，8-24 股东会批准、8-26 落地），用于主业发展并投建多品类电商平台（自营零售＋合作 ПВЗ＋快递柜）。公司总金融负债 1592 亿卢布（6-30），其中短债由 1500 亿降至 1325 亿、长债由 22 亿升至 267 亿（大部分贷款展期最长 7 年）。债务结构改善为平台化转型提供窗口。", "url": "https://www.vedomosti.ru/business/articles/2026/09/07/1226734-mvideo-privleklo-kredit", "table": [["授信", "17.5 亿卢布（7 年期，2033-09 到期）"], ["用途", "多品类平台（自营＋ПВЗ＋постаматы）"], ["总金融负债", "1592 亿卢布（6-30）"], ["短/长债", "1500→1325 亿 / 22→267 亿卢布"]], "num": 53, "tag": "local", "tagText": "本地"}, {"title": "俄智能手机市场 1-9 月：1440 万台/3700 亿卢布（-11%/-5.9%），iPhone 70 万台/610 亿卢布占金额 30%", "source": "生意人报(Kommersant)（引 М.Видео / Платформа ОФД）", "time": "09-09", "summary": "1-9 月俄智能手机市场 1440 万台、3700 亿卢布，台数同比 -11%、金额 -5.9%；iPhone 约 70 万台/610 亿卢布，占台数 4.9%、占金额 30%（2025 年同期 3.7%/27%）；市场均价 22,304 卢布（-4% y/y）。新机发布难提振整体市场，苹果继续吸走高端金额份额，中低价段竞争加剧。", "url": "https://www.kommersant.ru/doc/8940270", "table": [["市场（1-9月）", "1440 万台 / 3700 亿卢布（-11% / -5.9%）"], ["iPhone", "70 万台 / 610 亿卢布"], ["iPhone 金额占比", "30%（2025 同期 27%）"], ["中位价", "22,304 卢布（-4% y/y）"]], "num": 54, "tag": "local", "tagText": "本地"}, {"title": "苹果发布会与在俄预售：iPhone 18 Pro/Max＋首款折叠屏 iPhone Duo，WB 14.1 万卢布起；预售需求超 2025 年", "source": "РИА Новости / Ведомости / ТАСС", "time": "09-10 ~ 09-11", "summary": "苹果发布首款折叠屏 iPhone Duo 与 iPhone 18 Pro/Max 并上调全线定价，俄平台同步开启预售：WB 首发 14.1 万卢布起（仅 Pro/Pro Max）；Ozon（联手 restore:）Pro 19.999-39.999 万、Pro Max 21.999-44.999 万；М.Видео Pro 17.4999 万起；Яндекс Маркет 9-10 开售、9-26 后发货（Pro 14.7 万起）。折叠屏 Duo 俄预期 24.5 万卢布起。塔斯社称预售需求超 2025 年水平——平台把首发预售做成流量与支付工具。", "url": "https://ria.ru/20260910/predzakaz-2116705280.html；https://tass.ru/ekonomika/28103453", "table": [["WB", "14.1 万卢布起（Pro/Pro Max）"], ["Ozon", "Pro 19.999-39.999 万；Pro Max 21.999-44.999 万"], ["М.Видео", "Pro 17.4999 万起；Pro Max 18.9999 万起"], ["Яндекс Маркет", "9-10 开售、9-26 后发货；Pro 14.7 万起"], ["折叠屏 Duo", "预期 24.5 万卢布起"], ["预售需求", "超 2025 年水平（ТАСС）"]], "num": 55, "tag": "local", "tagText": "本地"}, {"title": "约 37% 俄家长推迟开学季电子采购：8 月价格可涨 50-100%，9-10 月成关键窗口", "source": "РИА Новости", "time": "09-10", "summary": "调查显示约 37% 的俄家长将笔记本、平板与智能手机等开学电子采购推迟到秋季以省钱：8 月为需求峰值、卖家没有折扣动力，价格可上涨 50-100%，延后购买可升级机型或同款更低价。对 3C 卖家而言，9-10 月的价格策略与转化窗口至关重要，需平衡旺季尾单与库存周转。", "url": "https://ria.ru/20260910/tekhnika-2116706956.html", "table": [["推迟比例", "约 37%（笔记本/平板/手机）"], ["8 月价格", "旺季可上涨 50-100%"], ["消费者逻辑", "延后可升级或同款更低价"], ["对卖家", "9-10 月价格与转化关键窗口"]], "num": 56, "tag": "local", "tagText": "本地"}, {"title": "Минцифры 拟立法把「Алиса AI」设为不可卸载预装应用，行业要求公开讨论", "source": "生意人报(Kommersant)", "time": "09-11", "summary": "Минцифры 正在修订法案，拟将「Алиса AI」定位为智能手机上不可卸载的预装应用，行业要求该倡议公开讨论。参照此前俄对预装软件清单的强制要求，新规将进一步锁定国产 AI 助手的入口地位，影响手机厂商的预装结构、应用分发渠道与数字广告流量分配，也牵动第三方 App 的预装博弈。", "url": "https://www.kommersant.ru/doc/8941278", "table": [["主管机关", "Минцифры（修订法案中）"], ["拟规定", "«Алиса AI» 成为不可卸载预装应用"], ["行业态度", "要求公开讨论"], ["影响", "预装结构、应用分发与广告流量分配"]], "num": 57, "tag": "local", "tagText": "本地"}, {"title": "俄电表更换期限自 2027-01-01 起由 6 个月缩短至 3 个月，费用由供能企业承担", "source": "РИА Новости", "time": "09-11", "summary": "自 2027-01-01 起，俄故障电表更换期限由 6 个月缩短至 3 个月：公寓楼内由保底供电方、私宅由电网公司负责更换，居民无需自购设备与支付安装费；若能源公司逾期未在用户投诉后整改，电价将适用下调系数。电表采购与安装责任明确转向供能企业侧，B2B 计量设备与安装服务需求相应上升。", "url": "https://ria.ru/20260911/elektroschetchiki-2116947994.html", "table": [["生效时间", "2027-01-01"], ["期限", "6 个月 → 3 个月"], ["责任方", "公寓楼：保底供电方；私宅：电网公司"], ["用户成本", "免设备与安装费（逾期电价下调系数）"]], "num": 58, "tag": "local", "tagText": "本地"}]}, {"icon": "💡", "name": "灯具", "items": [{"title": "灯具照明栏目全周无新增重大动态（连续第 3 周静默）：5 期日报均为空窗，周五补充检索亦无照明市场重大新闻", "source": "综合检索（РИА/ТАСС/Интерфакс/Lenta RSS）", "time": "09-07 ~ 09-11", "summary": "本周 5 期日报灯具栏目均标注「本期无新增重大动态」；周五补充抓取（РИА/ТАСС/Интерфакс/Lenta，светильник/освещение/LED/лампы 关键词）亦未见照明市场新增重大事件。行业存量口径不变：2025 年俄灯具产量 2380 万只（同比 -21.4%），进口仍以中国产品为主。受仓库遇袭与物流改道影响，照明品类的到仓时效与分仓成本仍是主要变量；邻域信号为 3PL 库容占比升至 43%、政府采购平台 10-1 白名单（工程渠道潜在增量）。", "url": "", "table": [["本周状态", "连续第 3 周无新增重大动态"], ["产量口径", "2025 年 2380 万只（-21.4% y/y）"], ["主要变量", "仓库遇袭与物流改道 → 到仓时效/分仓成本"], ["邻域信号", "3PL 库容 43%；政府采购平台 10-1 白名单"]], "num": 59, "tag": "local", "tagText": "本地"}]}, {"icon": "🚗", "name": "汽车（扩展）", "items": [{"title": "Автостат：8 月全月新车 122,234 辆（-7%），36 周注册超 3 万辆（+6.1%）；前十品牌几乎全线下滑", "source": "Ведомости（引 Автостат / Паспорт промышленный консалтинг）", "time": "09-07", "summary": "8 月俄新车销量 122,234 辆（-7% y/y），前十品牌几乎全线下滑：Belgee -44%、Geely -25%、Changan -14%、Haval -9%、Lada -2%；逆势者为平行进口 Mazda（≈3,194 辆，近 5 倍）、Toyota 3,133 辆（+5%）与奇瑞系 Tenet（12,167 辆，新增）。第 36 周（8-31~9-6）注册超 3 万辆，环比 +6.1%、同比 +4%（含月末交付翘尾）。分析师认为需再观察 2-3 周方能判断趋势。", "url": "https://www.vedomosti.ru/auto/news/2026/09/07/1226790-prodazhi-novih-legkovih", "table": [["8 月销量", "122,234 辆（-7% y/y）"], ["36 周注册", ">3 万辆（环比 +6.1%、同比 +4%）"], ["领跌", "Belgee -44%、Geely -25%、Changan -14%、Haval -9%"], ["逆势", "Mazda 3,194 辆、Toyota 3,133 辆、Tenet 12,167 辆"]], "num": 60, "tag": "local", "tagText": "本地"}, {"title": "8 月汽车贷款创年内纪录：1837 亿卢布/11.63 万笔（+11.2% / +10.4%），1-8 月累计 1.244 万亿（+28.9%）", "source": "生意人报(Kommersant)（引 Frank RG＋Автостат）", "time": "09-09", "summary": "8 月俄车贷金额 1837 亿卢布（环比 +11.2%）、笔数 11.63 万（+10.4%），创年内纪录，平均贷款额 158 万卢布（+0.7%）；1-8 月累计 1.244 万亿卢布（+28.9% y/y）。驱动为燃油短缺推高电动/柴油车需求、报废税上调预期引发抢购以及降息改善信贷条件。机构预期全年 +15~20%，2027 年央行新规或降温。", "url": "https://www.kommersant.ru/doc/8939238", "table": [["8 月金额/笔数", "1837 亿卢布（+11.2%）/ 11.63 万笔（+10.4%）"], ["1-8 月累计", "1.244 万亿卢布（+28.9%）"], ["平均金额", "158 万卢布（+0.7%）"], ["驱动", "燃油短缺、报废税预期、降息"]], "num": 61, "tag": "local", "tagText": "本地"}, {"title": "Haval H9 在加里宁格勒 Автотор 启动组装（俄第 3 处产线）：高额回收费令整车进口不再划算", "source": "生意人报(Kommersant)", "time": "09-08", "summary": "Haval 在加里宁格勒 Автотор 启动 H9 组装，成为其在俄第 3 处产线（另有图拉厂、卡卢加 ПСМА 租线）。动因为报废税（утильсбор）高企致整车进口不划算、ОЭЗ 补偿与税收优惠及物流便利；以焊装车身 CKD 起步、逐步提升本地化，柴油版后续或上产线。Haval 1-8 月销量 11.43 万辆（+22.8%，俄第 2，仅次于 АвтоВАЗ），Jolion ≈4.9 万辆（+29.5%）。", "url": "https://www.kommersant.ru/doc/8939226", "table": [["新基地", "加里宁格勒 Автотор（俄第 3 处）"], ["动因", "报废税高企、ОЭЗ 优惠、物流便利"], ["进度", "CKD 起步，逐步提升本地化"], ["Haval 1-8 月", "11.43 万辆（+22.8%，俄第 2）"]], "num": 62, "tag": "local", "tagText": "本地"}, {"title": "9 月已有 7 个品牌上调在俄车价（Автостат）", "source": "Lenta（引 Автостат）", "time": "09-09", "summary": "Автостат：9 月头几天已有 7 个汽车品牌上调在俄售价，背景为报废税（утильсбор）上调预期、卢布走强下的到岸成本变化与需求回暖。涨价潮或促使经销商清库存促销，短期价格窗口仍在，但跨年成本结构上行趋势明确。", "url": "https://lenta.ru/news/2026/09/09/srazu-neskolko-avtoproizvoditeley-peresmotreli-tseny-na-mashiny-v-rossii/", "table": [["事实", "9 月已有 7 个品牌上调售价"], ["背景", "报废税预期＋到岸成本＋需求回暖"], ["对市场", "或促经销商清库存促销，价格窗口仍在"]], "num": 63, "tag": "local", "tagText": "本地"}, {"title": "АвтоВАЗ 已向 31 国出口 Lada，今年出口目标 3 万辆（+45%）", "source": "Ведомости", "time": "09-09", "summary": "АвтоВАЗ 已向 31 个方向出口 Lada，9-9 举办进口商大会（15+ 国约 50 名代表），2026 年出口目标 3 万辆（较 2025 年 +45%），热销车型为 Granta 与 Vesta；2025 年新增阿布哈兹/埃及/利比亚/委内瑞拉，白俄/哈/乌兹/塔吉克/伊朗/也门新开 7 家经销中心。俄车企出口重心转向独联体、中东与非洲。", "url": "https://www.vedomosti.ru/auto/news/2026/09/09/1227560-eksportiruet-lada", "table": [["出口地理", "31 个方向"], ["目标", "2026 年 3 万辆（+45% y/y）"], ["热销车型", "Lada Granta、Vesta"], ["2025 新增", "阿布哈兹/埃及/利比亚/委内瑞拉"]], "num": 64, "tag": "local", "tagText": "本地"}]}, {"icon": "🔍", "name": "待核实事件核查", "items": [{"title": "本周待核实事件核查汇总（综合检索 | 09-07~09-11）", "source": "综合检索", "time": "09-07 ~ 09-11", "summary": "①Ozon 萨拉托夫仓损毁规模与起火面积——Ozon 仅确认「起火、员工疏散、初步无伤亡」，损失与复产时间待通报；②萨拉托夫事件弹种——平台与州长口径一致（物流中心＋配送枢纽被击中），具体弹种未披露；③WB FBS 97.4%——「Точка」银行基于 Mpstats 测算，WB 仅确认「FBS 兴趣上升」，非官方口径；④WB 未付结算周涉及 200 亿卢布——联盟估算，平台未确认具体金额；⑤新乌连戈伊遇袭设施与损失、新罗西斯克 4 人死亡口径待官方更新；⑥中国品牌新车在俄销量下滑（塔斯社引 Газпромбанк автолизинг）未获独立交叉验证；⑦外贸顺差口径差异（1-7 月 892 亿美元 vs 79 亿美元）系海关署与央行/国际收支口径不同；⑧三方会谈地点与时间、加拿大拦截弹交付时间表均无官宣。", "url": "", "table": [["待核实项", "Ozon 萨拉托夫损失规模/复产时间"], ["口径类", "WB FBS 97.4%（第三方测算）；顺差 892 vs 79 亿美元（口径差异）"], ["未官宣", "三方会谈日程；加方拦截弹交付时间表"], ["标题级", "中国品牌新车销量下滑（ТАСС，未交叉验证）"]], "num": 65, "tag": "local", "tagText": "本地"}]}], "keyData": {"headers": ["指标", "周初（09-07/08）", "周末（09-10/11）", "趋势"], "rows": [["央行关键利率", "14%（7-24 起，处降息周期）", "14%（9-11 维持，首次暂停）", "★中断降息周期，未给方向信号"], ["央行官方美元汇率（卢布）", "86.59（9-7）", "84.35（9-11；场外最低 83.47）", "卢布走强约 2.2 卢布"], ["央行官方欧元汇率（卢布）", "100.57（9-7）", "98.29（9-11）", "跌破 100"], ["Brent 原油（美元/桶）", "97.95（9-7，破 98）", "108.21 盘中（9-10）→104（9-11，-3.35%）", "周内 +10% 后回吐"], ["年化通胀（央行口径）", "—（8 月基础通胀约 5%）", "6.3%（9-7 估计）；稳定通胀 5-6%", "燃料推升；年底预期 6-7%"], ["IMOEX", "2265.65（9-7 收盘）", "2304.19（9-10）→2279.91（9-11 盘中 -1.26%）", "站上 2300 后回落"], ["平台仓遇袭城市", "WB 22 城 / Ozon 10 城", "WB 22 城 / Ozon 11 城（9-11 萨拉托夫）", "Ozon +1；WB 连续 11 天无新增"], ["卖家自发货（FBS）占比", "WB 6 月 FBO 94.9%", "WB FBS 97.4% / Ozon 73.1%（8 月末）", "★结构性转向自发货"], ["3PL 库容中分销商占比", "—", "43%（2026 年 1-9 月）", "库存外移、平台黏性削弱"], ["单夜无人机拦截量", "306 架（9-6 夜）", "596 架（9-8 夜~9-9 晨）", "高位，纵深扩至北极圈"], ["联邦预算赤字（1-8 月）", "—", "5.8 万亿卢布＝GDP 2.5%", "同比扩大 1.5 倍"], ["外贸顺差（1-7 月）", "—", "892 亿美元（+13.3%）", "对亚 +16.9%、对欧 -3.7%"], ["俄原油产量/配额", "10 月配额 994.9 万桶/日（冻结）", "8 月实际 871.8 万桶/日（-16 万）", "低于上限 116.9 万桶/日"], ["8 月汽车贷款", "—", "1837 亿卢布（年内纪录，+11.2% m/m）", "1-8 月累计 +28.9%"], ["8 月新车销量", "—", "122,234 辆（-7% y/y）；36 周 +6.1%", "月度仍降、周度回暖"], ["合规门槛", "—", "商品卡核验 2027-03-01；诚实标识 51 类；БАД 进口商 ×13", "准入与命名合规刚性化"]]}, "trends": [{"title": "电商物流", "text": "本周是「平台仓风险再定价」的一周：9-11 凌晨 Ozon 萨拉托夫物流中心＋配送枢纽被击中（Ozon 遇袭城市 10→11，WB 维持 22 城、连续第 11 天无新增），叠加 9-8~9-9 单夜 596 架无人机的密集袭击，卖方行为已从「应急」转为「结构性迁移」——8 月末 WB 采用 FBS 的卖家占比升至 97.4%（6 月 +42.3pp）、FBO 降至 62.8%，Ozon FBS 升至 73.1%；分销商占 3PL 库容升至 43%，物流外包与多仓分散成为主流。供给侧同步收紧：莫斯科小面积仓 H1 新交付 -72%、空置率 11.8%，限航与炼厂检修推高干线运价；Минпромторг 称「100% 重建」为时过早、年底才定重建规模与国家参与度，意味着 FBO 容量与区域时效的紧张将持续到 Q4。建议：把「单点损失上限」写进库存分配规则（单仓不超过 X% 库存）、锁定 3PL/外部仓合同与运力、按 FBS+FBO 组合重算履约成本，并核对在途改道后的时效承诺与赔付口径。"}, {"title": "平台政策", "text": "合规与费率两条线同时收紧。合规侧：Роспатент 商品卡真伪核验机制 2027-03-01 上线（自动比对独家权利与商标库）、米舒斯京打假表态、Роспатент 本土品牌注册申请 +23% 至 7.5 万件、华纳兄弟注册 Harry Potter 商标（覆盖化妆品）、Герофарм 撤诉（平台删同名 БАД 卡片后和解）、标记制度后 БАД 合法进口商增 13 倍——品牌授权链与命名/图案合规已从「软要求」变成上架刚需。费率侧：Ozon 披露卖家 1-7 月综合服务成本占售价均值 24.73%（纯佣金仅 1.54%）、9-1 起下调「自有仓发货」佣金推动自发货、Минпромторг 与政府年底前定仓库重建规模、10-1 政府采购平台白名单（学校/幼儿园直采）与「诚实标识」51 类扩围。建议 Q4 前完成：①商标/授权文件盘点；②逐项核对平台费率性价比（物流/推广是大头）；③评估教育/政采渠道入驻；④跟踪 10-1 平台经济法与标识扩围清单。"}, {"title": "经济数据", "text": "9-11 央行维持 14% 是关键转折：中断 2025-06 起的降息周期，且「实质未讨论降息」、未给方向信号，行长称降息空间小于上半年预期、政策将更紧——但也不会长期维持在「经济无法承受」的水平。数据侧偏「滞胀式组合」：年化通胀 6.3%（9-7）、稳定通胀区间上调至 5-6%、年底通胀预期 6-7%，企业价格预期 22.7 点三连升；同时 Q3 增长温和、消费需求放缓、H1 固定资产投资 -9.9%（连续第 5 季）、1-8 月预算赤字 5.8 万亿（GDP 2.5%）。外部压力上行：ЕЦБ 年内第二次加息至 2.5%、霍尔木兹局势被定性为「净通胀性」。对经营的直接含义：融资成本难快速下行、信贷扩张受限（8 月车贷却创纪录 1837 亿卢布，属报废税预期推动），Q4 备货的库存资金成本应按「利率高位延续至 2027」做压力测试；同时关注 10 月会议（有分析师预期降至 13.75%）。"}, {"title": "能源价格", "text": "单周「过山车」：Brent 从 9-7 的 98 美元一路升至 9-10 盘中 108.21（5-21 以来首次，Goldman 称或至 120），9-11 又回落 3.35% 至 104 美元，因 МЭА 称 2026 年全球油品供需收缩幅度超预期、8 月已把三季度供应缺口预估上调逾一倍至 180 万桶/日。供给政策面：OPEC+ 冻结 10 月配额（俄 994.9 万桶/日，结束 4 个月连增），俄 8 月实际产量 871.8 万桶/日、低于上限 116.9 万桶/日；Urals 8 月环比 +16%、9 月首周破 80 美元，МЭА 计俄 8 月油气出口收入 138.7 亿美元。欧洲气价破 1000 美元/千m³（ПХГ 仅 67.3%）。传导：俄油气收入与输入性通胀压力同升，是央行不敢降息的核心外部变量；物流侧燃料批发先增后落（炼厂检修）仍将推高干线运价，须在 Q4 运价合同中锁价或设燃料附加条款。"}, {"title": "消费市场", "text": "结构性降价与结构性涨价并存。降价面：АКОРТ 8 月社会民生食品均价 -4.2%（红茶 -23.6%、整鸡 -13.4%、糖 -12.7%），蔬果 -1.8%；卢布周内走强（官方美元 86.59→84.35、欧元跌破 100）压低进口成本，Платформа ОФД 预计电子与进口服装年底前或继续降价。涨价面：耐用品一周涨幅明显（智能手机 +2.4%、电视 +1.5%、国产车 +0.9%）、9 月 7 个汽车品牌上调售价、约 37% 家长推迟开学季电子采购至 9-10 月。需求端：Ozon 约 85% 活跃买家在地区、小城镇订单占 1/3；1-7 月经销商酒类周转 -28.2%；1-9 月智能手机台数 -11%。结论：消费者更「挑价格、等窗口」，进口标品旺季毛利受汇率改善支撑但价格战加剧；建议把 9-10 月作为开学季尾单与高端机（iPhone 18 预售需求超 2025）的价格与转化决战窗口，同时警惕自发货切换后的时效差评风险。"}, {"title": "地缘与风险", "text": "和谈进入「要素齐备但无路线图」阶段：维特科夫/库什纳称和平要素齐备、白宫由万斯/鲁比奥团队起草一揽子方案，普京与特朗普年内第 5 次通话（约 1 小时）、鲁比奥称近期或出新调解计划，俄方称阿布扎比为三方会谈优先地；但战场侧袭击烈度维持高位（单夜 596 架被击落、新罗西斯克 4 死 29 伤、索契遭无人艇袭击），且打击纵深首次延伸至北极圈（新乌连戈伊 ТЭК 起火）、俄军对乌仓库与港口实施对等打击。国内政策延续性增强（杜马选举预测统俄约 50%、投票率近 70%）；外部压力不减（加拿大 2.53 亿美元拦截弹、立陶宛核武修宪议题）。对经营的含义：和谈预期是卢布与风险资产的上行变量，但袭击面在扩大而非收敛——库存分散、保险与改道预案应作为常态成本而非临时措施。"}], "sourceStats": "共 65 条收录条目，其中 63 条为实体引用条目（灯具空窗注解 1 条、待核实汇总 1 条为程序性标注，不计入引用统计）。实体条目信源：РИА Новости、ТАСС、Интерфакс、Lenta、生意人报（Коммерсантъ）、Ведомости、俄央行（ЦБ РФ）等俄语媒体；其中 Ведомости/生意人报引 Автостат、Frank RG、Росстат、Infoline、АКОРТ、МЭА、ОПЕК 等机构数据，均按本地媒体计。本地媒体 63 条＝100%；中文 0 条、英文 0 条（Lenta 引 FT/Goldman 等外媒内容仍以俄媒为信源、按本地计）。本地信源占比 100%，≥ 60% 达标。周五补充抓取 30 篇新文章全部来自 РИА Новости / Lenta / ТАСС / Интерфакс 四家俄语媒体。", "meta": ["报告编号：RU-WEEKLY-2026-W37", "覆盖周期：2026-09-07（周一）~ 09-11（周五），第 37 周", "收录条目：65 条（电商17、时政12、经济18、美妆4、电器7、灯具1、汽车5、待核实事件核查1；其中灯具与待核实各 1 条为程序性标注，不计入引用统计）", "数据来源：本地日报 5 期（09-07 共 11 条、09-08 共 10 条、09-09 共 11 条、09-10 共 22 条、09-11 共 23 条，合计 77 条，窗口 09-07~09-11 无空窗，均已入库 state.db）+ 周五补充抓取新文章 30 篇（РИА Новости 11 / Lenta 12 / ТАСС 3 / Интерфакс 2 / 其他 2），其中 13 条作为独立条目收录，其余（央行议息系列稿、汇率与股市快讯等）按主题并入「央行 9-11 决议」「Brent 周内波动」「卢布走强」等条目", "去重：30 个补充 URL 全部查 state.db articles 表确认无冲突（0 重复，INSERT OR IGNORE 后 articles 594→624 条）；内容比对本周日报，补充条目均非日报已收内容；周报条目与日报同源内容（仓库遇袭链、FBS 结构变化、汇率/股市、Brent、Роспатент 合规等）按周视角归并改
