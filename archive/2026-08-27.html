{"date": "2026-08-27", "stats": {"total": 21, "local_pct": "95%", "cn_pct": "0%", "en_pct": "5%"}, "items": [{"num": 1, "title": "🚨仓库被炸：Ozon乌法物流中心遭无人机袭击（轻损停收）、奥伦堡疏散后复工，克宫承诺强硬回应", "tag": "local", "tagText": "本地", "source": "国际文传(Interfax)", "time": "08-27 09:03", "summary": "8-27凌晨无人机袭击Ozon乌法物流中心（UFA_RFC履约中心，9.3万㎡，伏尔加联邦区最大）：无火灾、轻损但停运待全面检查，暂停接收卖家配送、在途货改道；奥伦堡设施疏散后已复工。同夜俄拦截267架无人机。克宫称将对打击经济贸易基础设施作出强硬回应。Ozon受影响设施累计8处。", "table": [["Ozon乌法仓", "UFA_RFC·9.3万㎡·轻损无火灾·暂停收货待检"], ["Ozon奥伦堡仓", "疏散后已复工"], ["8-27夜全俄拦截", "267架固定翼无人机"], ["Ozon受影响设施", "累计8处"]], "sourceFull": "https://www.interfax.ru/russia/1111509"}, {"num": 2, "title": "俄电商平台卖家总数Q2突破150万：同比+20.5%，中小企业占87.9%", "tag": "local", "tagText": "本地", "source": "商业日报(Vedomosti)", "time": "08-27 13:32", "summary": "俄数字平台协会(АЦП)与Infoline研究（Ведомости披露）：2026Q2俄主要电商平台卖家总数同比+20.5%突破150万人，中小企业占87.9%；订单量超26亿单（+38.7%），活跃买家9160万人（+11.9%）。订单增速为买家增速3倍以上，平台供给扩张、单卖家集中度上升。", "table": [["卖家总数", "超150万（Q2同比+20.5%）"], ["中小企业占比", "87.9%"], ["Q2订单量", "超26亿单（+38.7%）"], ["活跃买家", "9160万人（+11.9%）"]], "sourceFull": "https://www.vedomosti.ru/business/articles/2026/08/27/1224117-chislo-prodavtsov-na-krupneishih"}, {"num": 3, "title": "WB上线铁路车票销售服务，对标俄铁官网售票", "tag": "local", "tagText": "本地", "source": "CNews", "time": "08-27 13:50", "summary": "WB于8-27上线铁路车票直销服务，成为俄铁官网售票的替代渠道，主打免排队、免中介服务费，被CNews称为\"俄铁主站服务的杀手\"。上线首日部分主流浏览器不显示入口、兼容性待完善。平台从商品电商向高频生活服务延伸，与9-1接入数字卢布同步扩容生态。", "table": [["服务内容", "俄铁(RЖД)火车票直销"], ["卖点", "免排队、免中介服务费"], ["上线日", "08-27"], ["首日情况", "部分浏览器不显示入口"]], "sourceFull": "https://www.cnews.ru/news/top/2026-08-27_wildberries_sozdal_ubijtsu_glavnogo"}, {"num": 4, "title": "WB发布自研即时通讯WB Chat，对标VK国家通讯\"Макс\"", "tag": "local", "tagText": "本地", "source": "CNews", "time": "08-26 15:06", "summary": "WB于8-26发布自研即时通讯WB Chat公开测试版，功能对标Telegram（收藏夹、聊天文件夹、底部导航），主要竞争VK旗下国家通讯\"Макс\"，已三端上架。初期反馈平淡：下载超1000次、评分2.5/5。WB借电商流量向通讯工具扩张，构建平台内买卖双方闭环沟通。", "table": [["版本", "公开测试版（三端上架）"], ["功能", "类Telegram：收藏/文件夹/导航"], ["初期反馈", "下载超1000次、评分2.5/5"]], "sourceFull": "https://www.cnews.ru/news/top/2026-08-26_wildberries_zapustil_sobstvennogo"}, {"num": 5, "title": "ФБК调查：Ozon最大股东27.7%股份收购资金疑与普京友人Тимченко关联（待核实）", "tag": "en", "tagText": "英文", "source": "Meduza(引ФБК调查)", "time": "08-27 16:32", "summary": "ФБК（纳瓦尔尼团队）8-27调查称，Ozon最大股东Чачава收购27.7%股份的资金来自普京友人Тимченко旗下公司，呼吁制裁\"股份代持人\"。Ozon为俄第二大电商平台。属单方调查结论，Ozon及涉事方未回应，实控关系待官方文件核实，本期如实标注\"待核实\"。", "table": [["涉事股份", "27.7%（最大股东Чачава所持）"], ["资金来源指控", "Тимченко（普京友人）旗下公司"], ["ФБК诉求", "对代持人实施制裁"], ["Ozon回应", "暂无（待核实）"]], "sourceFull": "https://meduza.io/feature/2026/08/27/krupneyshiy-aktsioner-ozon-kupil-dolyu-v-marketpleyse-na-dengi-kompanii-druga-putina-gennadiya-timchenko-vyyasnil-fbk"}, {"num": 6, "title": "克宫：将对乌方打击俄经济贸易基础设施作出\"强硬回应\"", "tag": "local", "tagText": "本地", "source": "REGNUM(引Bloomberg)", "time": "08-27 10:44", "summary": "佩斯科夫8-27向Bloomberg表示，俄对乌军打击本国经济与贸易基础设施的回应将\"强硬\"；普京此前称反制呈镜像性质、强度数倍于对方。表态针对8-26/27 WB科托夫斯克、Ozon乌法/奥伦堡连续遇袭，冲突目标向经济基础设施扩散，跨境物流供应链风险上升。", "table": [["表态人", "佩斯科夫（Bloomberg采访）"], ["回应基调", "强硬；普京称镜像反制、强度数倍"], ["背景", "8-26/27电商仓库连续遇袭"]], "sourceFull": "https://cdn.regnum.ru/news/4057756"}, {"num": 7, "title": "莫斯科宣布罗马尼亚驻俄使馆一名工作人员为\"不受欢迎的人\"", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-27 10:59", "summary": "俄外交部8-27宣布罗马尼亚驻莫斯科使馆一名工作人员为\"不受欢迎的人\"，称此举是对布加勒斯特方面无端针对俄外交官决定的回应。俄罗外交摩擦延续北约东翼紧张氛围，虽不直接影响贸易，但陆运/空运通道的间接扰动风险需持续观察，跨境物流企业宜关注欧盟东翼边境口岸动态。", "table": [["对象", "罗马尼亚驻俄使馆工作人员"], ["原因", "对布加勒斯特无理决定的对等回应"]], "sourceFull": "https://ria.ru/20260827/rumyniya-2113467848.html"}, {"num": 8, "title": "佩斯科夫：无新一轮俄美乌三方谈判计划信息，基辅欲\"激活\"谈判议题", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-27 12:17", "summary": "佩斯科夫8-27表示不掌握新一轮俄美乌三方谈判的举行计划与时间表。此前泽连斯基办公室Буданов称基辅希望\"激活\"谈判议题。谈判进程与战场升级并行，俄乌局势仍是影响汇率、物流与消费信心的最大宏观变量，需保持跟踪。", "table": [["表态", "不掌握下轮三方会谈计划与日程"], ["背景", "Буданов称基辅欲激活谈判议题"]], "sourceFull": "https://ria.ru/20260827/pergovory-2113498964.html"}, {"num": 9, "title": "消息人士：美伊已达成停火协议，或数日内正式宣布", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-25 22:25", "summary": "8-25俄新社援引伊朗与巴基斯坦消息人士称，华盛顿与德黑兰已就停火达成一致，预计数日内正式官宣，随后将举行谈判与技术性会议。6月中旬双方签署启动和平协议进程的备忘录后一度搁置。若停火落地，霍尔木兹海峡航运风险与油价溢价有望回落，直接影响俄能源收入、卢布汇率与进口商品成本。", "table": [["状态", "已达成（伊朗、巴基斯坦消息源）"], ["后续", "数日内官宣+谈判与技术会议"], ["背景", "6月签署备忘录后一度搁置"]], "sourceFull": "https://ria.ru/20260825/iran-2113173135.html"}, {"num": 10, "title": "Fix Price 9月1日起支持数字卢布支付，系统重要性银行全面就绪", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-25 15:28", "summary": "俄折扣零售连锁Fix Price宣布9月1日起开通数字卢布支付，成为首批接入央行数字货币的零售商；俄央行称所有系统重要性银行已就绪，届时进入大规模商用。对卖家影响：结算通道或新增选项，WB/Ozon接入进度、退款链路变化需关注。", "table": [["上线时间", "09-01"], ["银行就绪", "全部系统重要性银行"], ["场景", "Fix Price全渠道收银"]], "sourceFull": "https://ria.ru/20260825/rubl-2113105822.html"}, {"num": 11, "title": "数字卢布支付标识开始现身俄超市收银台", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-26 22:36", "summary": "8-26俄新社记者实测发现，莫斯科\"Магнит\"超市自助收银台已出现数字卢布支付选项：选择后生成二维码、用银行App扫码即可完成付款。数字卢布从央行测试走向零售终端的信号明确，9月1日商用节点临近。消费支付方式与电商结算生态将逐步重构，卖家收款、退款与对账流程需提前适配。", "table": [["实测场景", "莫斯科\"Магнит\"自助收银台"], ["支付方式", "选数字卢布→QR扫码→银行App确认"]], "sourceFull": "https://ria.ru/20260826/logotipy-2113400362.html"}, {"num": 12, "title": "俄粮食收成突破1亿吨：100.5万吨（+12.5%），已收面积超65%", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-26 20:53", "summary": "俄农业部8-26通报：已收获谷物1.005亿吨，同比+12.5%，脱粒面积2790万公顷、占谷物种植面积超65%。粮食丰产支撑俄农产品出口能力与通胀预期稳定，谷物出口关税调整空间随之打开。对跨境卖家而言，农产品出口链（含对华物流）运力与政策变化值得关注，粮价平稳亦有助于压低食品类目通胀压力。", "table": [["总收成", "1.005亿吨（同比+12.5%）"], ["已脱粒面积", "2790万公顷（超65%）"]], "sourceFull": "https://ria.ru/20260826/rossija-2113391957.html"}, {"num": 13, "title": "俄制造业平均月薪同比+14%至约10万卢布", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-26 14:13", "summary": "工贸部长阿利哈诺夫8-26在与普京会面时透露，俄制造业2025年平均月薪实际增长近14%、逼近10万卢布。工资强劲增长在支撑消费的同时推高人工与物流成本，电商履约、仓储用工价格预计继续上行，分拣、配送、客服外包等卖家运营成本面临抬升压力。", "table": [["实际增速", "约+14%"], ["平均月薪", "约10万卢布"], ["场合", "阿利哈诺夫向普京汇报"]], "sourceFull": "https://ria.ru/20260826/zarplata-2113287620.html"}, {"num": 14, "title": "在俄中资企业约1.55万家，近半数集中于莫斯科及周边", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-26 14:47", "summary": "俄中友好、和平与发展委员会俄方主席Титов 8-26表示，全俄约1.55万家中国企业，其中近半数位于莫斯科及莫斯科州，阿穆尔州、滨海边疆区等地亦为集聚区。中俄经贸深度绑定为跨境电商供应链提供稳定底座，但企业集聚也意味着合规监管趋于集中化，新进入者选址与合规投入需权衡。", "table": [["中资企业总数", "约1.55万家"], ["莫斯科及周边占比", "约50%"], ["其他集聚区", "阿穆尔州、滨海边疆区等"]], "sourceFull": "https://ria.ru/20260826/kitay-2113295151.html"}, {"num": 15, "title": "米舒斯京：全球对俄农产品需求强劲，加工品出口占比持续上升", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-27 15:39", "summary": "总理米舒斯京8-27在政府会议上表示，全球对俄粮食、油料等农产品需求旺盛，且出口结构中加工产品占比持续上升，意味着更多就业与附加值留在境内。俄农产品出口链的政策托底力度加大，对华农产品贸易与相关物流企业是利好信号；卖家可关注跨境冷链与大宗物流运力变化对陆运通道的挤出效应。", "table": [["表态", "全球对俄粮食/油料需求旺盛"], ["趋势", "出口中加工产品占比上升"], ["意义", "农业出口价值链升级"]], "sourceFull": "https://ria.ru/20260827/mishustin-2113590017.html"}, {"num": 16, "title": "ФАС今年已对燃油市场立案45起、发出71份警告", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-27 22:52", "summary": "俄联邦反垄断局（ФАС）8-27通报，今年以来已对石油公司与独立成品油市场参与者立案45起、发出71份警告，并持续推进燃油价格经济合理性监管。燃油价格稳定直接影响全俄物流运输成本（干线运输、最后一公里配送），对电商履约成本构成中期约束，燃油附加费与干线运价的联动值得卖家跟踪。", "table": [["立案", "45起（石油公司+独立参与者）"], ["警告", "71份"], ["监管目标", "经济合理油价"]], "sourceFull": "https://ria.ru/20260827/fas-2113696599.html"}, {"num": 17, "title": "央行8-27官方汇率：美元85.95卢布、欧元100.30卢布", "tag": "local", "tagText": "本地", "source": "俄央行(CBR)官方数据", "time": "08-27 11:30", "summary": "俄央行8-27公布的官方汇率：美元85.95卢布（较8-24的83.29贬值约3.2%）、欧元100.30卢布。卢布走弱叠加仓库遇袭冲击，进口结算成本上行；对以卢布计价的在俄卖家而言，人民币/卢布兑换窗口、定价调价节奏与回款周期需重点管理，建议密切关注央行利率决议与汇率干预信号。", "table": [["USD/RUB", "85.9541（较8-24贬值约3.2%）"], ["EUR/RUB", "100.2998"]], "sourceFull": "https://cbr.ru/currency_base/daily/?date_req=2026-08-27"}, {"num": 18, "title": "歌手Hanna：WB仓库大火烧毁3000万卢布化妆品，损失约7000万卢布营收、转自建仓", "tag": "local", "tagText": "本地", "source": "newsmuz", "time": "08-26 16:44", "summary": "俄歌手Ханна（Анна Курьянова）8-26自述，其自有美妆品牌在WB仓库火灾中烧毁成本价3000万卢布货品、损失约7000万卢布营收，已转自建仓储存并继续平台销售。明星品牌同样暴露于仓储集中风险，\"库存分散+自建仓\"对冲逻辑在中小品牌端加速落地。", "table": [["烧毁货值", "3000万卢布（成本口径）"], ["营收损失", "约7000万卢布"], ["应对", "库存转自建仓，继续平台销售"]], "sourceFull": "https://newsmuz.com/news/pop/hanna-poteryala-kosmetiki-na-30-mln-iz-za-udarov-po-wildberries-52313"}, {"num": 19, "title": "研究：AI美妆推荐中药店/皮肤学品牌霸榜（La Roche-Posay 36.9%），奢侈品牌出局", "tag": "local", "tagText": "本地", "source": "零售门户(retail.ru)", "time": "08-27 02:40", "summary": "8-27发布的美妆AI推荐可见度研究：面部护理AI推荐榜前11名全为药店/皮肤学品牌，La Roche-Posay以36.9%居首，奢侈品牌无一入榜；跨模型差异显著（如Nivea在DeepSeek为16.5%）。美妆搜索与转化正被AI推荐重构，Listing优化需围绕功效词。", "table": [["面部护理AI推荐", "LRP 36.9%、BIODERMA 13.2%、CeraVe 11.3%、Vichy 10.3%"], ["奢侈品牌", "全部跌出前11"], ["跨模型差异", "Nivea: DeepSeek 16.5% vs Google AI 3.5%"]], "sourceFull": "https://www.retail.ru/news/aptechnye-brendy-zakhvatili-top-rekomendatsiy-ii-v-ukhode-za-litsom-issledovanie-27-avgusta-2026-281452"}, {"num": 20, "title": "小米Mijia大型家电正式入俄：451L冰箱79990卢布、洗烘一体机47990卢布", "tag": "local", "tagText": "本地", "source": "ichip.ru", "time": "08-25 15:35", "summary": "小米8-25起在俄正式开售Mijia大型家电：451L对开门冰箱（iFresh变温区、Ag⁺抗菌、双变频，79990卢布）与10.5kg洗烘一体机（直驱、自动投放、蒸汽护理，47990卢布），支持米家App远程控制。首次官方进入俄大型家电市场，将对中高端白电价格带形成冲击。", "table": [["冰箱", "451L对开门（iFresh/Ag⁺/双变频）79990卢布"], ["洗烘一体", "10.5kg（直驱/自动投放/蒸汽）47990卢布"], ["智能控制", "米家App远程管理"], ["上市日", "08-25"]], "sourceFull": "https://ichip.ru/novosti/xiaomi-nachala-oficialnye-prodazhi-bytovoy-tehniki-mijia-v-rossii-969612"}, {"num": 21, "title": "GS Led成为首家按新规(ПП №719)纳入俄工业品名册的LED制造商", "tag": "local", "tagText": "本地", "source": "CNews", "time": "08-26 12:00", "summary": "CNews 8-26报道：GS Group旗下GS Led成为首家按新规（ПП №719）将俄产LED纳入\"俄工业品名册\"的企业，功率0.5-6W、色温2000-6500K、显色指数最高CRI 98+，产自加里宁格勒。俄照明本土化采购门槛抬升，进口灯具品牌需关注俄产替代与认证壁垒。", "table": [["企业", "GS Group旗下GS Led（加里宁格勒）"], ["产品参数", "0.5-6W、2000-6500K、CRI最高98+"], ["法规背景", "ПП №719新规（2026-01-01生效）"]], "sourceFull": "https://www.cnews.ru/news/line/2026-08-26_rossijskie_svetodiody_vpervye"}]}
