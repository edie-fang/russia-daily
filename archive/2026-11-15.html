agText": "本地", "source": "Ведомости", "time": "11-14 12:06", "summary": "国家杜马劳动与社会政策委员会第一副主席 Лантратова 称，统一儿童津贴自 2027 年 1 月 1 日起自动指数化 6.8%，无需重新申请。2026-05 起多子女家庭保留津贴的新规已生效：人均收入超过地区最低生活保障线不超过 10% 仍可领取。补贴上调对低客单价必需品的需求构成支撑。", "table": [["指数化幅度", "6.8%"], ["生效", "2027-01-01"], ["手续", "自动，无需申请"], ["多子女家庭", "收入超线 ≤10% 仍可领"]], "sourceFull": "https://www.vedomosti.ru/society/news/2026/11/14/1245364-edinoe-posobie"}, {"num": 15, "cat": "econ", "catText": "经济金融", "title": "霍尔木兹以东一艘液化气船触雷起火；10 月该海峡已有 34 艘船遇袭", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-14 10:39", "summary": "伊朗海军称，一艘运液化气的船在霍尔木兹海峡以东触雷起火并停航，该船关闭了跟踪识别系统、无视警告进入禁区。11-12 两艘油轮在穿越海峡南部时爆炸，11-07 另有两艘受损，10 月该海峡共有 34 艘船遇袭。海峡通航仍远低于战前水平，海运与保险成本维持高位。", "table": [["最新事件", "11-14 液化气船触雷起火"], ["11-12", "两艘油轮爆炸"], ["10 月遇袭船舶", "34 艘"], ["通航", "仍显著低于战前"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/11/14/1245359-tanker-podorvalsya"}, {"num": 16, "cat": "econ", "catText": "经济金融", "title": "圣彼得堡交易所：АИ-92 周均价 -2.3% 至 65,489 ₽/吨，冬季柴油 -2%", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-13 14:57", "summary": "据俄新社基于圣彼得堡交易所数据的计算，11-09~11-13 俄欧洲部分 АИ-92 均价跌 2.3% 至 65,489 ₽/吨（前一周 67,060），АИ-95 跌 2.2% 至 72,381 ₽/吨，换季柴油跌 0.3% 至 60,797 ₽/吨，冬季柴油跌 2% 至 78,857 ₽/吨。批发端连续回落，为 Q4 干线运价与到仓成本提供缓冲。", "table": [["АИ-92", "65,489 ₽/吨（-2.3%）"], ["АИ-95", "72,381 ₽/吨（-2.2%）"], ["换季柴油", "60,797 ₽/吨（-0.3%）"], ["冬季柴油", "78,857 ₽/吨（-2.0%）"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/11/13/1245196-birzhevie-tseni"}, {"num": 17, "cat": "politics", "catText": "时政要闻", "title": "佩斯科夫：普京-习近平-特朗普 11-19 在深圳举行三方会晤", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-14 18:27", "summary": "俄总统新闻秘书佩斯科夫确认，普京、习近平与特朗普的三方会晤定于 11 月 19 日在深圳 APEC 峰会期间举行。白宫 11-14 已预告该会晤并称不预期达成协议；这是 2022 年以来三国领导人首次同场。会晤议题清单与是否安排双边会谈尚未公布（待核实）。", "table": [["日期", "2026-11-19"], ["地点", "深圳（APEC 期间）"], ["形式", "三方会晤"], ["双边安排", "未公布（待核实）"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/11/14/1245397-vstrecha-proidet-19-noyabrya"}, {"num": 18, "cat": "politics", "catText": "时政要闻", "title": "库什纳：双方准备「实际妥协」，美方聚焦促成莫斯科与欧洲接触", "tag": "local", "tagText": "本地", "source": "Интерфакс", "time": "11-14 23:48", "summary": "特朗普特使库什纳称，乌克兰冲突双方已准备好「实际妥协」，美方当前聚焦推动俄罗斯与欧洲建立接触，并称北约仍将是欧洲安全的基础。他表示有「新想法」在酝酿，11-14 已与乌、俄、欧三方继续磋商。俄方与欧洲均未确认具体安排（待核实）。", "table": [["表态方", "库什纳（美特使）"], ["核心表述", "双方准备「实际妥协」"], ["美方重点", "推动俄欧接触"], ["北约定位", "仍是欧洲安全基础"]], "sourceFull": "https://www.interfax.ru/world/1129043"}, {"num": 19, "cat": "politics", "catText": "时政要闻", "title": "克宫：尚未收到欧洲谈判方的接触信号，俄方不设前提条件", "tag": "local", "tagText": "本地", "source": "Известия", "time": "11-15 02:39", "summary": "佩斯科夫称，欧洲方面的谈判代表目前尚未与俄方接触，俄方不会就欧洲谈判组的组成设定条件，但需先弄清欧盟立场能在多大程度上促进和平。该表态与库什纳「推动俄欧接触」的说法形成时间差：美方称在搭桥，俄方称尚未接到信号，欧洲是否入局仍待观察（待核实）。", "table": [["表态方", "佩斯科夫"], ["欧洲接触", "尚未发生"], ["俄方条件", "不设条件"], ["待观察", "欧盟立场能否促和"]], "sourceFull": "https://iz.ru/2201998/2026-11-15/kreml-ne-poluchal-ot-evropy-signalov-po-uregulirovaniiu-na-ukraine"}, {"num": 20, "cat": "politics", "catText": "时政要闻", "title": "彭博：美拟仅从欧洲撤 5,000 军人，赫格塞思 12-01 前提交报告", "tag": "local", "tagText": "本地", "source": "Интерфакс", "time": "11-15 01:01", "summary": "彭博引消息人士称，美方在欧驻军拟减至约 8 万人，实际仅撤约 5,000 人，远小于此前讨论的 2.5 万人；原因是驻欧兵力对中东行动至关重要，且盟国提高国防预算缓解了华盛顿立场。防长赫格塞思将于 12-01 前向特朗普提交方案报告。", "table": [["撤军规模", "约 5,000 人"], ["此前讨论", "最多 2.5 万人"], ["驻欧规模", "约 8 万人"], ["报告时限", "2026-12-01"]], "sourceFull": "https://www.interfax.ru/world/1129051"}, {"num": 21, "cat": "politics", "catText": "时政要闻", "title": "俄国防部：单日击落 231 架无人机，夜间 29 架，142 个区域目标被打击", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-14 12:36", "summary": "俄国防部称过去一日击落 231 架乌克兰无人机，其中 11-14 夜间 29 架；俄军称打击了服务于乌军的能源与交通设施、无人机生产与存放点、弹药库及 142 个区域的临时部署点。莫斯科方向 11-14 击落 3 架；塔甘罗格 11-15 凌晨亦有无人机被击落、残骸落地，无平台仓受损通报。", "table": [["单日击落", "231 架"], ["11-14 夜间", "29 架"], ["打击区域", "142 个"], ["莫斯科方向", "11-14 击落 3 架"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/11/14/1245367-pvo-sutki-sbili"}]}
