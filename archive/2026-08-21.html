{"date": "2026-08-21", "stats": {"total": 22, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "Wildberries与Ozon将于9/1上线数字卢布支付", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)、生意人报(Kommersant)", "time": "08-20 21:45", "summary": "俄两大平台Wildberries与Ozon向RIA确认：9月1日起上线数字卢布支付，应用内将支持开通数字钱包。数字卢布9/1全面商用首批落地场景即覆盖头部电商，平台支付体系迎来央行数字货币新入口，卖家回款链路与支付费率结构变化值得跟踪。", "table": [["上线时间", "9月1日"], ["支付方式", "App内开通数字钱包"]], "sourceFull": "https://ria.ru/20260820/rubli-2112153477.html"}, {"num": 2, "title": "超100家圣彼得堡生产/销售企业受WB仓库无人机袭击波及，市政府拟推专项贷款", "tag": "local", "tagText": "本地", "source": "国际文传(Interfax)、俄新社(RIA)", "time": "08-20 23:17", "summary": "圣彼得堡副市长波利亚科夫：无人机袭击Wildberries-Russ物流设施已波及超过100家本地生产企业；市工业政策与贸易委员会宣布近期推出面向受损WB生产商与卖家的专项贷款计划，РСПП同日讨论支持措施。WB仓储遇袭损失从卖家端蔓延至生产端，地方政府开始制度化兜底。", "table": [["受损企业", "100+家(圣彼得堡)"], ["应对措施", "专项贷款计划(拟推出)"]], "sourceFull": "https://www.interfax.ru/russia/1110400"}, {"num": 3, "title": "WB银行免除全部ПВЗ业主账户服务费与转账费", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-20 15:10", "summary": "WB银行宣布新的商家支持措施：免除全部Wildberries提货点(ПВЗ)业主的账户服务费与转账费。提货点网络是平台末端履约核心资产，此前行业曾现ПВЗ盈利争议，免手续费直接降低网点运营成本，意在稳定末端网络。", "table": [["免费范围", "账户服务费+转账费"], ["覆盖对象", "全部WB ПВЗ业主"]], "sourceFull": "https://ria.ru/20260820/pvz-2112067302.html"}, {"num": 4, "title": "乌克兰对俄铝(Русал)集团实施制裁", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-21 00:09", "summary": "泽连斯基签署制裁令，对俄铝集团及多名关联人员实施限制，基辅将其与俄军工体系挂钩。俄铝中报刚披露上半年销量-10%、靠铝价+33.4%扭亏，其亚洲市场占比已升至58%，乌方制裁实际冲击有限，但增加第三国交易的合规噪音。", "table": [["制裁对象", "俄铝集团及关联人员"], ["俄铝亚洲收入占比", "58%"]], "sourceFull": "https://tass.ru/ekonomika/28030473"}, {"num": 5, "title": "克罗地亚逮捕北溪案德国通缉的乌克兰公民", "tag": "local", "tagText": "本地", "source": "国际文传(Interfax)、生意人报(Kommersant)", "time": "08-20 22:02", "summary": "克罗地亚在讯问后逮捕一名德国通缉的乌克兰公民，涉2022年北溪管道爆炸案；Kommersant披露其为职业潜水员Журавлев，此前曾两度逃脱对德引渡。案件调查持续指向乌方人员，俄欧能源基础设施旧案重回舆论场。", "table": [], "sourceFull": "https://www.interfax.ru/world/1110394"}, {"num": 6, "title": "俄外交部：不排除境外杜马选举投票站遭挑衅", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-21 00:55", "summary": "俄外交部表示，不排除9月杜马选举期间境外投票站遭遇挑衅的可能（前日驻德使馆已预警9/20前后或现虚假出口民调）。统一投票日临近，官方连续两日就境外投票安全发声，选举安保与舆论管控同步升级。", "table": [], "sourceFull": "https://ria.ru/20260821/moskva-2112166413.html"}, {"num": 7, "title": "涅边贾：俄罗斯不需要动员", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)、塔斯社(TASS)", "time": "08-20 23:00", "summary": "俄常驻联合国代表涅边贾在安理会表示俄罗斯没有必要进行动员（TASS同播）。该表态与前期FT克里姆林宫招募40.9万合同兵报道形成直接对照——该待核实事项仍无俄媒佐证，本期以官方否认性表态记录在案。", "table": [], "sourceFull": "https://ria.ru/20260820/nebenzya-2112160889.html"}, {"num": 8, "title": "央行8/21官方美元汇率83.35卢布（-1.78），跌破84关口", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)、Lenta", "time": "08-20 19:41", "summary": "央行设定8/21官方汇率：美元83.35卢布，单日下调1.78卢布，跌破84；两日累计下调近2卢布（8/20为85.13）。卢布加速走强叠加油价高位，出口商汇兑收益承压，进口商品（美妆/3C/灯具）成本端继续受益，与平台定价策略联动需关注。", "table": [["美元(8/21)", "83.35(-1.78)"], ["美元(8/20)", "85.13"]], "sourceFull": "https://www.kommersant.ru/doc/8894035"}, {"num": 9, "title": "Brent盘中突破93.5美元、峰值94.71，创逾三周新高", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-20 20:57", "summary": "8/20盘中Brent涨破93.5美元/桶、峰值触及94.71，较前收+2.07%（+1.9美元），创三周多新高。驱动为特朗普威胁升级对伊经济绞杀、警告其贸易伙伴将面临巨大经济后果；美财长同日公开表示不理解油价跳涨。前日破92记录被刷新，油价地缘溢价持续重估，利好俄油收入但推高燃油内销压力。", "table": [["Brent峰值", "94.71美元/桶"], ["涨幅", "+2.07%"], ["性质", "逾三周新高"]], "sourceFull": "https://lenta.ru/news/2026/08/20/tseny-na-neft-dostigli-maksimuma-na-fone-ugrozy-trampa-usilit-davlenie-na-iran/"}, {"num": 10, "title": "俄国际储备一周+156亿美元至7556亿", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)据央行", "time": "08-20 17:27", "summary": "央行数据：截至8/14俄国际储备7556亿美元，单周增加156亿（8/7为7400亿）。油气收入与金价高位推动储备回升，外汇缓冲加厚为央行降息路径提供安全垫。", "table": [["国际储备", "7556亿美元"], ["周变动", "+156亿美元"]], "sourceFull": "https://www.kommersant.ru/doc/8893935"}, {"num": 11, "title": "央行7月减持黄金储备20万盎司至7320万盎司，2020年1月来最低", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-20 20:17", "summary": "截  "https://ria.ru/20260821/bitkoin-2112176206.html"}, {"num": 17, "title": "秋季关键利率预测：10/23会议或暂停降息", "tag": "local", "tagText": "本地", "source": "Lenta引Gazeta.ru", "time": "08-21 04:15", "summary": "Garda Capital专家Селезнев：央行大概率在10月23日会议暂停降息；9月会议前将参考8月通胀数据，若燃油危机缓解则有降息空间。三大变数：通胀预期、燃油价格、预算赤字（10月将向杜马提交三年预算）。另：7月居民现金贷款创纪录达4870.4亿卢布。现利率14%，降息路径预期继续发酵。", "table": [["现关键利率", "14%"], ["7月现金贷款", "4870.4亿卢布(纪录)"]], "sourceFull": "https://lenta.ru/news/2026/08/21/v-rossii-dali-prognoz-po-klyuchevoy-stavke-na-osen/"}, {"num": 18, "title": "7月新车贷款加权平均利率升至12%，2025年11月来首次回升", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-21 02:51", "summary": "7月新车贷款加权平均利率升至12%年化，为2025年11月以来首次上升；车企收缩自有补贴计划（需求稳定+库存下降），银行靠砍附加服务维持投放。高利率下汽车金融成本触底回升，车市以价换量窗口收窄。", "table": [["新车贷利率", "12%(7月加权)"], ["环比", "2025年11月来首升"]], "sourceFull": "https://www.kommersant.ru/doc/8894069"}, {"num": 19, "title": "俄银行2026年信息安全支出预计+10-15%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-21 02:32", "summary": "Kommersant：2026年俄信贷机构信息安全支出预计增长10-15%，投入结构从合规达标与进口替代转向既有系统的集成运营。金融业网安预算扩张，利好本土安全厂商与集成商。", "table": [["信安支出增速", "+10-15%(2026E)"]], "sourceFull": "https://www.kommersant.ru/doc/8894011"}, {"num": 20, "title": "香蕉零售价一个月下降近8%，起步价110卢布/公斤", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)引АКОРТ", "time": "08-21 00:13", "summary": "全俄全渠道零售协会(АКОРТ)主席Богданов：大型连锁香蕉价格一个月内下降近8%，起步价110卢布/公斤。进口果蔬回落是8月周度通缩-0.02%的主要拉动项（前日CPI报道），民生价格缓和持续为降息铺垫。", "table": [["香蕉价格", "-8%/月"], ["起步价", "110卢布/公斤"]], "sourceFull": "https://ria.ru/20260821/banany-2112165141.html"}, {"num": 21, "title": "俄美在欧盟鱼柳进口市场并驾齐驱，各占8%份额", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)引ВАРПЭ", "time": "08-21 03:41", "summary": "全俄渔业协会(ВАРПЭ)主席Зверев：俄罗斯与美国在欧盟鱼柳进口市场各占8%份额，呈并驾齐驱之势。叠加6月对欧鱼类出口+1.7倍（前期报道），水产成为少数守住对欧存量市场的品类。", "table": [["欧盟鱼柳进口份额", "俄8%/美8%"]], "sourceFull": "https://ria.ru/20260821/ryba-2112173443.html"}, {"num": 22, "title": "上半年便携音乐播放器销量同比+40%（М.Видео口径）", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)引М.Видео", "time": "08-19 09:09", "summary": "М.Видео向RIA披露：上半年便携音乐播放器销量同比增长近40%，复古音频消费回潮。3C细分品类再现结构性增长，与前期毛皮配件热销、智能手机周涨价并列为非必需消费回暖信号。", "table": [["便携播放器销量", "上半年+40%"]], "sourceFull": "https://ria.ru/20260819/pleer-2111723637.html"}]}
