], ["9–10 月购买", "55.9%"], ["提前关注", "45.1%"]], "sourceFull": "https://www.retail.ru/news/poizon-devu-kazhdyy-chetvertyy-pokupatel-priobretaet-zimnie-veshchi-eshche-letom-23-noyabrya-2026-284826/"}, {"num": 11, "cat": "lighting", "catText": "灯具照明", "title": "灯具照明：本期无新增重大动态（距 12-01 贴码截止 7 天）", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "11-24 05:00", "summary": "本期无新增行业动态。核对范围：Retail.ru 灯具主题页与新闻流（11-23~11-24 共 30 条）、Sellers Platform 与 MPUP 平台公告、Ведомости/Коммерсантъ 当日商务版，未见灯具行业新数据或政策。提示：12-01 起灯具（9405）、LED 灯与灯泡（8539）等无线电电子产品无码禁售，剩 7 天完成贴码或清库。", "table": [["距贴码截止", "7 天（2026-11-30）"], ["覆盖品类", "9405 灯具 / 8539 LED 灯与灯泡"]], "sourceFull": "https://www.retail.ru/theme/lighting/?d=2026-11-24"}, {"num": 12, "cat": "beauty", "catText": "美妆个护", "title": "调查：33% 俄罗斯女性按社媒评价与评论区内容决定化妆品购买", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "11-23 11:09", "summary": "«Одноклассники» 节前调查显示，33% 的女性受访者表示社媒中的评价与评论区讨论直接影响化妆品与护肤品购买决策，节日礼盒选品更依赖口碑内容。对卖家的含义：美妆商品卡的评分、评价数量与 UGC 内容对转化影响大于单纯降价，节前应把评价运营与内容素材排在促销之前。", "table": [["受评价影响", "33%"], ["场景", "节前礼盒与补货采购"]], "sourceFull": "https://www.retail.ru/news/kazhdaya-tretya-rossiyanka-vybiraet-kosmetiku-po-otzyvam-i-obsuzhdeniyam-v-sotss-23-noyabrya-2026-284800/"}, {"num": 13, "cat": "appliance", "catText": "家电电器", "title": "家电电器：本期无新增重大动态", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "11-24 05:00", "summary": "本期无新增重大动态。核对范围：Retail.ru 家电与电子主题页、М.Видео-Эльдорадо 新闻稿、Коммерсантъ/Ведомости 当日商务版。11-23 期已收录的咖啡机 9 个月 200 万台数据本期复核无更新，按去重规则不重复收录；家电品类暂无窗口内新政策或销量数据。", "table": [], "sourceFull": "https://www.retail.ru/theme/electronics/?d=2026-11-24"}, {"num": 14, "cat": "econ", "catText": "经济金融", "title": "Brent 跌破 87 美元：2 月合约 87.52 美元/桶（-2.7%），8 月末以来首次", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-23 17:10", "summary": "11-23 16:56 MSK，2 月布伦特期货报 87.52 美元/桶，日内 -2.7%，为 8 月末以来首次跌破 87 美元（当日早间已跌破 89 美元）。推手是特朗普称愿在新年后恢复对伊打击，等于延长外交窗口，市场对供应中断的溢价回落。油价下行利好干线物流成本，但削弱卢布的商品货币支撑。", "table": [["Brent 2 月合约", "$87.52/桶（-2.7%）"], ["首次跌破 $87", "2026-11-23（自 8 月末）"]], "sourceFull": "https://www.vedomosti.ru/investments/news/2026/11/23/1414449-tsena-brent"}, {"num": 15, "cat": "econ", "catText": "经济金融", "title": "ФАС 13 年来首次上调配电网回报率：RAB 口径 11%→17.92%", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "11-24 01:06", "summary": "ФАС 自 2013 年以来首次上调配电网络投资回报率：按 RAB 方法运营的电网公司，基准回报率由 11% 提高到 17.92%，幅度 1.5 倍。含义是配电投资回报抬升，终端电价与接入费面临上行压力；用电与恒温设备密集的照明、家电、仓配环节成本将逐步反映到落地成本里。", "table": [["RAB 回报率", "11% → 17.92%（+1.5 倍）"], ["上次调整", "2013 年"]], "sourceFull": "https://www.kommersant.ru/doc/9128375"}, {"num": 16, "cat": "econ", "catText": "经济金融", "title": "M2 10 月环比 +0.6% 至 138.4 万亿₽，同比增速降至 12.1%", "tag": "local", "tagText": "本地", "source": "Интерфакс", "time": "11-23 21:17", "summary": "央行数据：10 月 M2 增 0.6% 至 138.4 万亿₽，同比增速由 10-01 的 13.3% 降至 11-01 的 12.1%；M2Х*（剔除汇率重估）增 0.5%，同比 10.0%（前值 11.3%）；M0 增 1.1% 至 21.3 万亿₽，现金同比升至 22.1%。货币扩张在放缓但仍高于名义增速，需求端不至于失速，降息节奏仍是消费与备货的关键变量。", "table": [["M2", "138.4 万亿₽（+0.6% 月环比）"], ["M2 同比", "12.1%（前值 13.3%）"], ["M0", "21.3 万亿₽（现金同比 22.1%）"]], "sourceFull": "https://www.interfax.ru/business/1130885"}, {"num": 17, "cat": "econ", "catText": "经济金融", "title": "ФНС：1–10 月税收同比 +11%，新追缴系统多收 600 亿₽、欠税人减 700 万", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-23 14:18", "summary": "ФНС 局长向普京汇报：1–10 月税收收入同比 +11%；新的债务追缴系统已为预算带来约 600 亿₽，欠税人数减少约 700 万。对卖家的含义是征管数字化在加速——平台流水、银行账户与报税数据交叉比对更密，低报销售额、拆分账户、延迟申报被识别的概率上升。", "table": [["税收收入", "+11%（1–10 月）"], ["追缴新增", "600 亿₽"], ["欠税人数", "-700 万"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/11/23/1414304-glava-fns-obem"}, {"num": 18, "cat": "politics", "catText": "时政要闻", "title": "11-23 夜至 11-24 晨：飞向莫斯科 20 架无人机被击落，两大机场限流运行", "tag": "local", "tagText": "本地", "source": "Интерфакс", "time": "11-24 04:53", "summary": "11-23 夜至 11-24 凌晨，飞向莫斯科的无人机被分批击落，累计 20 架（先 9 架、后 +11 架）；伏努科沃与谢列梅捷沃机场转为「按协调时刻运行」，部分航班延误或改降。首都空域风险直接传导到仓配时效，跨区调拨与空运补货需按「机场限航日」预留 1–2 天缓冲。", "table": [["击落无人机", "20 架（累计）"], ["机场", "伏努科沃 / 谢列梅捷沃 限流"]], "sourceFull": "https://www.interfax.ru/russia/1130907"}, {"num": 19, "cat": "politics", "catText": "时政要闻", "title": "彼尔姆边疆区工业设施遭袭 1 死 2 伤；当夜全俄 17 地区击落 192 架", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-23 11:45", "summary": "11-23 彼尔姆边疆区多处工业设施遭无人机袭击，1 人死亡、2 人受伤；该州当日击落 53 架无人机。当夜全俄 17 个地区共击落 192 架。WB «Пермь-3» 分拣中心同日因空袭警报暂停收货（异地 СЦ 罚金关闭），工业与仓配同时受扰，乌拉尔方向入仓时效需按警报日重排。", "table": [["伤亡", "1 死 2 伤"], ["该州击落", "53 架"], ["全俄击落", "192 架 / 17 地区"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/11/23/1414225-udara-bpla"}, {"num": 20, "cat": "politics", "catText": "时政要闻", "title": "布良斯克州遭袭 5 人受伤，边境区物流持续处于警报状态", "tag": "local", "tagText": "本地", "source": "Интерфакс", "time": "11-23 22:46", "summary": "11-23 布良斯克州遭无人机与炮击袭击，5 人受伤并送医。该州为乌边境高频受袭区，仓储与运输设施长期处于警报状态；同夜莫斯科方向另有 20 架无人机被击落。含义是对边境州仓库的入仓与发运需预设「临时停收 + 改派邻近 СЦ」的替代方案。", "table": [["受伤", "5 人"], ["区域", "布良斯克州（边境）"]], "sourceFull": "https://www.interfax.ru/russia/1130891"}, {"num": 21, "cat": "politics", "catText": "时政要闻", "title": "伊朗称 3 艘油轮在霍尔木兹海峡触雷起火，通航风险再升级", "tag": "local", "tagText": "本地", "source": "Известия", "time": "11-24 02:53", "summary": "伊朗革命卫队称，过去数小时有 3 艘油轮在霍尔木兹海峡触雷起火；此前一周海峡通航量已降 15%，11 月以来至少 22 起袭击，为冲突以来最高。海峡风险与美伊谈判僵局叠加，是当前油价、航运保险费与中亚—俄罗斯陆路替代线路成本的主要变量。", "table": [["触雷油轮", "3 艘"], ["周通航量", "-15%"], ["11 月袭击", "至少 22 起"]], "sourceFull": "https://iz.ru/2207163/2026-11-24/v-ksir-zaiavili-o-podryve-trekh-neftianykh-tankerov-na-minakh-v-ormuzskom-prolive"}, {"num": 22, "cat": "politics", "catText": "时政要闻", "title": "库什纳：普京展示其祖父游击队档案；新一轮三方谈判「很快」举行", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "11-24 03:02", "summary": "库什纳称普京在会见中向他展示一份档案——其祖父二战期间参加游击队的记录，他称之为「含蓄的善意信号」。佩斯科夫 11-23 表示新一轮俄美乌三方谈判很快举行、日期未定，阿布扎比为备选地点之一。谈判进程仍是制裁、支付与跨境物流政策的先行变量。", "table": [["下轮三方谈判", "很快举行，日期未定"], ["备选地点", "阿布扎比"]], "sourceFull": "https://ria.ru/20261124/putin-kushner-2133517882.html"}]}
