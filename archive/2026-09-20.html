{"date": "2026-09-20", "stats": {"total": 26, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "政府批准 24 类食品价格监测清单：2027-01-01 起全链条监测，官方强调不是价格管制", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-19 11:40", "summary": "俄政府批准自 2027 年 1 月 1 日起实施价格监测的 24 类食品清单，包括鱼类、牛肉、猪肉、羊肉、禽肉、黄油与葵花籽油、牛奶、奶酪、鸡蛋、糖、盐、面粉、面包、大米、荞麦、通心粉、土豆、甜菜、洋葱、胡萝卜、番茄、黄瓜与卷心菜。联邦预算委员会第一副主席 Шендерюк-Жидков 对塔斯社强调「监测不等于价格管制」，只是让政府在民生商品异常涨价时能及时反应。2026 年 8 月通过的法律确立「从生产者到门店」的全链条监测，ФНС 将向 Минпромторг、Минсельхоз、МЭР、ФАС 与 Росстат 开放经营主体、交易、价格、销量与收支数据。", "table": [["监测品类", "24 类食品"], ["生效", "2027-01-01"], ["法律通过", "2026-08"], ["数据来源", "ФНС（税务）"], ["接收部门", "Минпромторг/Минсельхоз/МЭР/ФАС/Росстат"], ["官方口径", "监测≠价格管制"]], "sourceFull": "https://www.retail.ru/news/pravitelstvo-utverdilo-spisok-produktov-dlya-monitoringa-tsen-s-2027-goda-19-sentyabrya-2026-282320/"}, {"num": 2, "title": "梅德韦杰夫呼吁「效仿苏联无偿没收外资」：外资零售在俄资产风险再升级", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-19 10:59", "summary": "俄联邦安全会议副主席、统一俄罗斯党主席梅德韦杰夫在评论欧洲对 Nestle 与 Auchan 资产被移交临时管理的反应时称，应当「进一步超越临时管理」，回忆苏联政权初期「无偿强制把外国工厂收归国有、且从未归还」的先例。他称欧洲正与俄罗斯进行直接战争，并主张「对仇俄行径只能用直接军事威慑的语言回应」。涉事资产为普京 9-17 总统令移交临时管理的 Auchan（Ашан）、Nestle（Нестле Россия）、FM Logistic（含仓储综合体）以及原 Leroy Merlin 俄罗斯资产（现品牌 Лемана Про），临时管理方为俄方 АО «Л.Е.В. Менеджмент»。", "table": [["表态人", "梅德韦杰夫（联邦安全会议副主席）"], ["指向", "外资资产永久化没收（苏联先例）"], ["涉事主体", "Auchan / Nestle / FM Logistic / Лемана Про"], ["法令日期", "2026-09-17（普京令）"], ["临时管理方", "АО «Л.Е.В. Менеджмент»"]], "sourceFull": "https://ria.ru/20260919/aktivy-2118711138.html"}, {"num": 3, "title": "平台「假招聘」新骗局：以「商品卡审核助理」等岗位骗取学生银行信息", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-20 01:24", "summary": "俄「人民阵线」平台 Мошеловка 通报，骗子在社交网络与城市频道发布面向学生的虚假招聘，岗位包括「文字录入员」「电商平台商品卡审核助理」「每天 2–3 小时的问卷核验员」，均标注灵活工时。诱导学生参加远程面试并「录用」后，以「必须通过推荐链接办理公司工资卡」为由把人引向钓鱼站点，窃取个人与银行信息，账户随后被用作洗钱/跑分（дроппер）链条。平台提醒：正规雇主不会收取押金、数据访问费或培训费，签约前应在 ФНС 公开库核对法人。", "table": [["诱饵岗位", "商品卡审核助理/文字录入/问卷核验"], ["目标", "学生群体"], ["手法", "假录用+钓鱼工资卡链接"], ["后果", "账户被盗并沦为跑分链条"], ["核实渠道", "ФНС 法人公开库"]], "sourceFull": "https://ria.ru/20260920/moshenniki-2118835834.html"}, {"num": 4, "title": "卡巴斯基：借杜马选举行骗，奖品含主流电商平台购物卡与手机", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-18 20:28", "summary": "卡巴斯基实验室通报，随着国家杜马选举启动，出现两类针对俄用户的钓鱼：一是伪装成「线上投票」的假页面，要求填写护照序列号或 СНИЛС，随后弹出「政务账号已被入侵」提示，把骗局从线上引向电话，诱导用户交出短信验证码、安装第三方应用或向「安全账户」转账；二是「有奖匿名问卷」，以抽奖方式承诺送出智能手机、主流电商平台（маркетплейс）购物卡与现金奖励。两套话术都指向同一个资金盗取目标，卖家与仓储人员为高接触人群。", "table": [["手段一", "假线上投票+假「账号被入侵」"], ["索要数据", "护照序列号 / СНИЛС / 短信码"], ["手段二", "有奖问卷抽奖"], ["奖品", "智能手机 / 平台购物卡 / 现金"], ["实施方", "卡巴斯基实验室通报"]], "sourceFull": "https://ria.ru/20260918/kaspersky-2118629091.html"}, {"num": 5, "title": "莫斯科方向单日击落超 90 架无人机：多莫杰多沃、茹科夫斯基等机场临时限航", "tag": "local", "tagText": "本地", "source": "俄罗斯商业咨询(RBC) / 莫斯科市长办", "time": "09-20 03:56", "summary": "莫斯科市长 Собянин 通报，自 09-20 零点以来，防空力量在飞向莫斯科的航路上已击落 91 架乌克兰无人机，相关数字在夜间分成 14、15、19、20、21、25、27、34、61 等多批递增公布。受袭击影响，多莫杰多沃与茹科夫斯基机场实施临时起降限制（Росавиация），萨马拉、萨拉托夫、奔萨、索契、伏尔加格勒、坦波夫、马哈奇卡拉、克拉斯诺达尔与格连吉克等机场先后暂停或恢复收发航班，迈科普有无人机坠入居民区。袭击仍处高位，仓储与物流节点为主要风险敞口。", "table": [["击落数量", "91 架（09-20 零点以来，飞向莫斯科）"], ["通报方", "Собянин / Росавиация"], ["莫斯科机场", "多莫杰多沃、茹科夫斯基限航"], ["外地机场", "萨马拉/萨拉托夫/奔萨/索契/伏尔加格勒/坦波夫/马哈奇卡拉/克拉斯诺达尔/格连吉克"], ["居民区", "迈科普有无人机坠入"]], "sourceFull": "https://www.rbc.ru/rbcfreenews/6aaf2e32307a35eb0030ddbb"}, {"num": 6, "title": "顿涅茨克：周六无人机袭击致 18 人受伤，其中客车遇袭 12 人", "tag": "local", "tagText": "本地", "source": "国际文传电讯社(Interfax) / 俄罗斯商业咨询(RBC)", "time": "09-19 22:09", "summary": "顿涅茨克人民共和国通报，09-19 周六乌军无人机袭击造成当地 18 名平民受伤；其中一起为当日白天对一辆客运大巴的无人机打击，造成 12 名平民受伤，俄联邦侦查委员会已就戈尔洛夫卡大巴遇袭立案为恐怖袭击。袭击同时波及赫尔松方向与别尔哥罗德州边境地区，说明在选举投票期间，乌克兰方面仍维持对民用与交通设施的打击强度。", "table": [["受伤总数", "18 人（09-19 周六，顿涅茨克）"], ["客车遇袭", "12 名平民受伤（戈尔洛夫卡方向）"], ["立案", "СК 以恐怖袭击罪立案"], ["时间", "09-19 白天至傍晚"]], "sourceFull": "https://www.interfax.ru/russia/1117117"}, {"num": 7, "title": "国家杜马选举投票结束：联邦选区投票率约 44.6%，电子投票超 600 万人创纪录", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS) / 数据报(Vedomosti)", "time": "09-20 04:08", "summary": "俄中央选举委员会最新数据，国家杜马选举联邦选区投票率达到 44.57%（09-20 00:15 数据）至 44.63%（09-20 04:08），远高于 2021 年同期水平；莫斯科投票者达 312 万人，莫斯科州投票率超过 38%。远程电子投票（ДЭГ）参与人数超过 600 万、覆盖 33 个地区，其中联邦 ДЭГ 平台平均投票率约 80%，创下俄罗斯电子投票历史纪录。海外投票同步进行：已有 2.3 万余名俄公民在境外投票，投票站覆盖老挝、越南、朝鲜、印尼巴厘岛与曼谷等地。中央选举委员会同时公布了首批选举结果的公布时限。", "table": [["投票率（联邦选区）", "44.57% → 44.63%"], ["莫斯科投票人数", "312 万"], ["莫斯科州投票率", ">38%"], ["电子投票（ДЭГ）", ">600 万人 / 33 个地区"], ["联邦 ДЭГ 平台投票率", "约 80%（创纪录）"], ["海外投票", ">2.3 万人"]], "sourceFull": "https://tass.ru/politika/28129759"}, {"num": 8, "title": "投票期间网络与无人机双重干扰：卢甘斯克 4 个投票站暂停，莫斯科 ДЭГ 平台遭网攻", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)", "time": "09-19 19:22", "summary": "卢甘斯克人民共和国有 4 个选举投票站因无人机袭击威胁一度暂停工作；同日俄中央选举委员会主席 Памфилова 表示，针对莫斯科远程电子投票（ДЭГ）平台的网络攻击仍在持续。国家杜马议员 Артамонов 称，对联邦 ДЭГ 的攻击使用了人工智能与暗网工具。此外利佩茨克州一处投票站丢失 50 张选票，海外投票站方面俄方指责拉脱维亚与爱沙尼亚恐吓俄选民、德国在选举前关闭俄驻波恩总领事馆。", "table": [["暂停投票站", "4 个（卢甘斯克人民共和国）"], ["原因", "无人机袭击威胁"], ["网攻", "莫斯科 ДЭГ 平台持续被攻击"], ["攻击工具", "AI + 暗网（Артамонов 口径）"], ["其他异常", "利佩茨克州丢失 50 张选票"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/19/1230203-chetire-izbiratelnih-uchastka"}, {"num": 9, "title": "土耳其向俄乌提交「减少黑海打击」与粮食出口方案，称已收到部分回应", "tag": "local", "tagText": "本地", "source": "俄罗斯商业咨询(RBC) / 消息报(Izvestia)", "time": "09-19 23:52", "summary": "土耳其外长 Фидан 确认，安卡拉已向俄罗斯与乌克兰提交一份关于减少黑海方向打击、恢复粮食出口的提案，并称已收到部分回应、正在等待双方进一步答复。方案背景是黑海航运受阻已迫使俄石油出口重新分配（9 月上旬新罗西斯克装运环比下降 40%、波罗的海方向一周增长 8.5%），并推高全球粮价与运费。同日土耳其还表示正就 С-400 与 CAATSA 制裁问题与美方磋商，谈判进程与黑海方案相互交织。", "table": [["提出方", "土耳其（外长 Фидан）"], ["对象", "俄罗斯 / 乌克兰"], ["内容", "减少黑海打击 + 粮食出口"], ["进展", "已收到部分回应，等待答复"], ["背景", "新罗西斯克 9 月上旬装运 -40%"]], "sourceFull": "https://www.rbc.ru/politics/19/09/2026/6aaef45b213778f37a44be04"}, {"num": 10, "title": "特朗普宣布组建「人工智能部队」并设 AI 负责人，同时提议把 AI 改称「最高智能」", "tag": "local", "tagText": "本地", "source": "俄罗斯商业咨询(RBC) / 数据报(Vedomosti)", "time": "09-19 20:21", "summary": "美国总统特朗普宣布将创建专门的「人工智能部队」（AI forces）并任命一名负责该方向的「沙皇」（царь，美国政治语汇中指总统任命的专项负责人），此举发生在多家机构警告 AI 风险之后。特朗普同时在 Truth Social 发起投票，主张把「人工智能」（artificial intelligence）改名为「最高智能」或「极端智能」，理由是「人工」一词不准确。同期 Politico 报道，Anthropic、OpenAI、SpaceXAI 与 Google 因涉嫌合谋被起诉。对俄市场而言，AI 监管与算力政策的走向将影响跨境 AI 服务与工具的可获得性。", "table": [["决定", "组建 AI 部队 + 任命 AI 专项负责人"], ["宣布方", "特朗普（Truth Social）"], ["改名主张", "「最高智能」/「极端智能」"], ["同业动态", "Anthropic/OpenAI/SpaceXAI/Google 被诉合谋"], ["影响面", "AI 服务与工具跨境可获得性"]], "sourceFull": "https://www.rbc.ru/technology_and_media/19/09/2026/6aaec373213778f37a44bdf1"}, {"num": 11, "title": "中国批评美国新一轮对俄对伊制裁法，印度方面呼吁勿放弃俄油", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti) / 消息报(Izvestia)", "time": "09-19 19:01", "summary": "中国就美国通过并签署的对俄、对伊制裁新法（含对购买俄能源国家加征最高 100% 关税的授权）提出批评；同期美国智库 GTRI 负责人公开呼吁印度不要放弃俄罗斯石油。该法案签署后，其主要买方（中国、印度）的采购与结算口径成为观察重点：俄方评估认为该法「不带来原则上的新现实」，二级关税部分总统可最小化执行甚至不予使用，实际落地对象与税率仍待观察。", "table": [["批评方", "中国（针对美国制裁新法）"], ["另一表态", "GTRI 呼吁印度勿弃俄油"], ["核心工具", "对俄能源买家关税最高 100%"], ["俄方评估", "实质增量有限、执行弹性大"], ["观察重点", "中国/印度采购与结算口径"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/19/1230195-kitai-raskritikoval"}, {"num": 12, "title": "德国要求近千名 18 岁男性参加兵役体检，WSJ 称邻国担忧德国重新武装", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS) / 俄罗斯商业咨询(RBC)", "time": "09-19 22:48", "summary": "德国联邦国防军已把近 1,000 名 18 岁德国男性送往征兵体检，标志着德国兵役体检环节的强制化推进。同日《华尔街日报》报道称，德国自乌克兰冲突爆发后启动了柏林墙倒塌以来欧洲最大规模的重新武装计划，其邻国对此感到不安。对劳动力市场而言，欧洲主要经济体兵役与国防动员的推进将间接影响制造业与物流用工供给，也是判断欧洲能源与运输成本中期走向的背景变量。", "table": [["体检人数", "近 1,000 名 18 岁男性"], ["执行方", "德国联邦国防军（Bundeswehr）"], ["背景", "欧洲最大规模重新武装（WSJ）"], ["外溢", "邻国不安、用工供给预期"]], "sourceFull": "https://tass.ru/mezhdunarodnaya-panorama/28129551"}, {"num": 13, "title": "伊朗递交结束战争提案；美方称已协助运出逾 10 亿桶石油过霍尔木兹，伊方斥其撒谎", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti) / 国际文传电讯社(Interfax)", "time": "09-20 00:08", "summary": "半岛电视台报道，伊朗已通过中间渠道向美国递交一份关于停止战争的提案；同期美国中央司令部（CENTCOM）称已协助超过 10 亿桶石油经霍尔木兹海峡运出，伊朗方面称该说法为谎言。伊朗还公布了与美国开始任何谈判的七项条件。霍尔木兹通航几近停摆是本轮全球燃料价格飙升的直接原因，谈判进展将决定黑海—地中海—霍尔木兹航线的运费与保险成本走向，直接关系 Q4 跨境物流成本。", "table": [["伊方动作", "递交结束战争提案（经 Al Jazeera）"], ["美方口径", "已协助运出 >10 亿桶石油过霍尔木兹"], ["伊方回应", "斥美方说法为谎言"], ["谈判条件", "伊朗列出七项条件"], ["市场含义", "霍尔木兹通航与运费/保险成本"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/19/1230206-iran-peredal-ssha"}, {"num": 14, "title": "央行官方汇率维持：美元 84.1975 / 欧元 96.6671 / 人民币 12.5670（周末未更新）", "tag": "local", "tagText": "本地", "source": "俄罗斯央行(ЦБ РФ)", "time": "09-20 00:00", "summary": "俄央行官方汇率维持 09-19 生效口径不变：美元 84.1975 卢布、欧元 96.6671 卢布、人民币 12.5670 卢布（9-18 分别为 84.5093、97.4984、12.5788）。因 09-19 为周六、09-20 为周日，央行不发布新的汇率设定，本表为当前有效汇率，下一次更新将于 09-21 生效。卢布在选举周、油价高位与美方新制裁法签署的叠加背景下保持相对稳定，跨境结算的汇率窗口未出现新的跳变。", "table": [["美元", "84.1975（前值 84.5093）"], ["欧元", "96.6671（前值 97.4984）"], ["人民币", "12.5670（前值 12.5788）"], ["状态", "周末沿用 09-19 生效口径"], ["下一更新", "2026-09-21 生效"]], "sourceFull": "https://www.cbr.ru/scripts/XML_daily.asp"}, {"num": 15, "title": "MOEX BR-10.26：09-18 结算价 104.35 美元/桶、收盘 103.03，周末休市", "tag": "local", "tagText": "本地", "source": "莫斯科交易所(MOEX)", "time": "09-18 23:49", "summary": "莫斯科交易所 BR-10.26（Brent 十月合约，代码 BRV6）09-18 开盘 103.90、最高 104.96、最低 101.89、收盘 103.03 美元/桶，官方结算价 104.35 美元（前一交易日结算 103.37、收盘 104.24）；当周走势为 09-14 结算 107.43 → 09-15 108.08 → 09-16 105.21 → 09-17 103.37 → 09-18 104.35，全周在 107 美元下方震荡。如实标注：09-19/09-20 为周末，莫斯科交易所无交易；本机无法直连 ICE 实时行情源，ICE 即时报价未取得，故此处仅给出 MOEX 可核验口径。", "table": [["BR-10.26 结算价", "$104.35（前值 $103.37）"], ["收盘", "$103.03"], ["日内区间", "$101.89 – $104.96"], ["周内结算区间", "$103.37 – $108.08（09-14~09-18）"], ["数据完整度", "周末休市；ICE 实时价未取得"]], "sourceFull": "https://iss.moex.com/iss/history/engines/futures/markets/forts/securities/BRV6.json"}, {"num": 16, "title": "欧盟「能源封冻」显现：法国 11% 加油站断供，霍尔木兹通航近停摆", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-19 20:52", "summary": "俄直接投资基金（РФПИ）总裁、总统对外投资与经济合作特别代表 Дмитриев 称，欧盟的「能源封冻」（энергетические локдауны）正在变为现实，此言论针对另一账号发布的法国燃料短缺消息——法国已有 11% 的加油站既无汽油也无柴油。受美国、以色列与伊朗冲突升级影响，霍尔木兹海峡航运近乎停摆，该航道是全球石油、油品与液化天然气供应的关键路径，导致全球大多数国家燃料价格上涨。该趋势将通过燃油附加费与运价传导至 Q4 跨境头程与俄境内干线物流成本。", "table": [["表态人", "Дмитриев（РФПИ 总裁）"], ["法国现状", "11% 加油站无汽油/柴油"], ["航道", "霍尔木兹航运近乎停摆"], ["影响", "全球燃料价格上涨"], ["传导路径", "燃油附加费 → 头程与干线运价"]], "sourceFull": "https://ria.ru/20260919/evrosojuz-2118811832.html"}, {"num": 17, "title": "美国柴油价格刷新历史新高至 6.49 美元/加仑", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS) / 俄罗斯商业咨询(RBC)", "time": "09-19 22:45", "summary": "美国汽车协会（AAA）数据显示，美国柴油价格再度刷新历史最高纪录，达到 6.49 美元/加仑。此轮上涨与霍尔木兹通航受阻、中东冲突推高全球炼油与运输成本直接相关。柴油是干线卡车运输与海运的主要燃料，其价格新高意味着全球货运成本中枢上移，叠加欧盟燃料短缺，Q4 跨境物流（头程海运、目的国干线、仓间调拨）的运费与燃油附加费存在继续上调压力。", "table": [["柴油价格", "$6.49/加仑（历史新高）"], ["数据方", "美国汽车协会（AAA）"], ["成因", "霍尔木兹通航受阻 + 中东冲突"], ["传导", "干线卡车与海运燃料成本"]], "sourceFull": "https://tass.ru/ekonomika/28129541"}, {"num": 18, "title": "政府修改预算预测编制规则：与中期经济情景同步，强化 12 年以上长期规划", "tag": "local", "tagText": "本地", "source": "俄新社(RIA) / 俄财政部(Минфин)", "time": "09-19 17:48", "summary": "俄财政部发布政府决议，修改预算预测的编制规则以提高长期预算规划质量。预算预测每 6 年制定一次、覆盖 12 年及以上，其参数用于编制下一财年及规划期的预算；现行版本已确定到 2042 年的预算参数。新规则把预算预测的第一阶段与政府批准中期经济情景条件相衔接，并在 МЭР 批准后的 10 日内取得长期社会经济发展参数作为下一个长期规划周期的基础，同时开始计入拟通过和已通过的法案。对市场而言，长期财政参数框架的调整是中期内税收与补贴预期的观察窗口。", "table": [["发布方", "俄财政部（政府决议）"], ["预测周期", "每 6 年一次，覆盖 ≥12 年"], ["现有参数期限", "至 2042 年"], ["同步机制", "与中期经济情景条件挂钩"], ["影响", "中期税收与补贴预期"]], "sourceFull": "https://ria.ru/20260919/minfin-2118784777.html"}, {"num": 19, "title": "调查：85% 活跃加密交易者愿转入俄罗斯境内基础设施", "tag": "local", "tagText": "本地", "source": "俄新社(RIA) / Финам", "time": "09-19 10:28", "summary": "券商 Финам 对 1,500 余名客户的调查显示，若境内基础设施成熟，85% 的活跃加密交易者愿把业务转入俄罗斯境内：28% 回答「愿意」，57% 回答「更愿意」；68% 受访者已具合格投资者身份、19% 计划取得。当前 74% 的交易者仍使用境外交易所、28% 通过境外券商或银行。2026-09-01 起，为加密货币在俄合法流通建立法律基础的法规已生效。该趋势对以加密为结算备选通道的对俄贸易具有直接意义：境内合规化会改变结算路径的可得性与可追溯程度。", "table": [["愿转境内比例", "85%（28% 愿意 + 57% 更愿意）"], ["样本", "1,500+ Финам 客户"], ["仍用境外交易所", "74%"], ["法规生效", "2026-09-01（加密合法化）"], ["含意", "结算通道合规化与可追溯性"]], "sourceFull": "https://ria.ru/20260919/bolshinstvo-2118707298.html"}, {"num": 20, "title": "NYT：圭亚那成为伊朗战争与油市动荡的大受益者，日产量约 90 万桶", "tag": "local", "tagText": "本地", "source": "俄罗斯商业咨询(RBC) 引 NYT", "time": "09-19 23:02", "summary": "《纽约时报》报道，圭亚那已成为中东战争与石油市场动荡的主要受益者之一，该国石油日产量约为 90 万桶，正快速成为全球油市的重要边际供应方。在霍尔木兹通航受阻、俄石油出口被迫重排（新罗西斯克 9 月上旬装运降 40%）的格局下，非中东、非俄油源的边际增量会改变各航线的套利空间与运费结构，间接影响俄油折价与到岸成本。", "table": [["主体", "圭亚那"], ["日产量", "约 90 万桶"], ["报道方", "NYT（经 RBC 转述）"], ["背景", "霍尔木兹受阻 + 俄油出口重排"], ["影响", "油源替代与运费套利结构"]], "sourceFull": "https://www.rbc.ru/economics/19/09/2026/6aaee6e7213778f37a44bdfd"}, {"num": 21, "title": "Reuters：JPMorgan 因伊朗战争拒绝预测油价", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti) 引 Reuters", "time": "09-19 16:21", "summary": "路透社报道，JPMorgan 拒绝对当前油价给出预测，理由是美国与伊朗之间的战争导致市场极度不确定。作为全球最大的大宗商品交易银行之一，其放弃前瞻指引意味着主流机构对短期油价的判断区间已宽到难以给出数字，这对以油价为输入的成本预算（货运燃油附加费、包装与化工原料、聚乙烯类包材）构成建模困难。建议卖家的 Q4 成本测算采用情景法而非点估计。", "table": [["主体", "JPMorgan"], ["动作", "拒绝预测油价"], ["理由", "美国与伊朗战争带来极度不确定"], ["报道方", "Reuters（经 Vedomosti 转述）"], ["建议", "Q4 成本采用情景测算"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/09/19/1230180-jpmorgan-otkazalsya-prognozirovat"}, {"num": 22, "title": "Mixit 化妆品品牌总经理因特大诈骗案被莫斯科法院裁定居家软禁", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-19 15:24", "summary": "莫斯科特维尔区法院对俄罗斯化妆品品牌 Mixit 总经理奥列格·派（Олег Пай）作出居家软禁的强制措施裁定，其被指控犯有「有组织团伙或特别巨大数额的诈骗」（俄刑法第 159 条第 4 款）。法院案卷显示 09-19 12:00 开庭审理强制措施；里亚新社称未获得侦查机关与法院的进一步案情评论，涉案金额与受害方信息尚未披露。Mixit 是俄罗斯本土化妆品零售与电商渠道的重点品牌之一，其管理层涉刑案对品牌供货链、平台店铺与加盟/分销体系均构成短期不确定性。", "table": [["对象", "Mixit 总经理 Олег Пай"], ["裁定", "居家软禁（Тверской 区法院）"], ["罪名", "刑法第 159 条第 4 款（特别巨大数额诈骗）"], ["开庭", "2026-09-19 12:00"], ["案情", "金额与受害方未披露"]], "sourceFull": "https://ria.ru/20260919/arest-2118762819.html"}, {"num": 23, "title": "美妆博主家族企业被执行 40.5 万卢布：含 Letique Cosmetics 违规广告索赔案", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-19 06:40", "summary": "俄法警正在向与博主 Валерия Чекалина（Лерчек）前夫 Артем Чекалин 相关的两家莫斯科公司追缴逾 40.5 万卢布。其中，网络零售公司 «Леани»（Артем 持股 70%、其兄弟 30%，主营「互联网邮购零售」）被追缴 33.57 万卢布及 4.02 万卢布执行费，此前另案被判向 Ростелеком 支付 41.24 万卢布租金欠款；另一家公司 «Би Фит» 因消费者 Николай Сергеев 就 Cosmetic 品牌 «Letique Cosmetics» 的违规邮件广告提起精神损害赔偿诉讼而被罚 3 万卢布。案件显示美妆类目的邮件/推送营销合规与消费者维权诉讼风险在上升。", "table": [["追缴总额", ">40.5 万卢布"], ["主体", "«Леани»（互联网零售）/ «Би Фит»"], ["«Леани» 追缴", "33.57 万卢布 + 4.02 万执行费"], ["另案", "向 Ростелеком 付 41.24 万卢布租金"], ["美妆相关", "«Letique Cosmetics» 违规广告索赔 3 万卢布"]], "sourceFull": "https://ria.ru/20260919/chekalin-2118676772.html"}, {"num": 24, "title": "5G 落地时间表：现覆盖 16 城、1,000 万用户，专家称 80% 人口覆盖要到 2030–31 年", "tag": "local", "tagText": "本地", "source": "俄新社(RIA) / Lenta.ru", "time": "09-20 03:12", "summary": "Mobile Research Group 首席分析师穆尔塔津（Эльдар Муртазин）向俄新社表示，5G 网络要到 2030–31 年才能覆盖约 80% 的俄罗斯人口。上周俄罗斯刚启动首批第五代通信网络：目前在 16 个城市运行、覆盖 1,000 万用户，年底前正在推进再增加 50 个城市；数字发展部此前称 5G 很快将对 Android 用户开放，而 iPhone 用户的接入取决于苹果公司的决定。他还指出，终端必须是支持 5G 的新机型并处于覆盖范围内。对手机与配件卖家而言，5G 是明确的换机升级窗口，但节奏将比预期更慢。", "table": [["覆盖现状", "16 城 / 1,000 万用户"], ["年底计划", "再增 50 个城市"], ["80% 人口覆盖", "预计 2030–31 年"], ["Android", "即将开放"], ["iPhone", "取决于苹果决定"]], "sourceFull": "https://ria.ru/20260920/svyaz-2118839388.html"}, {"num": 25, "title": "议员提议：快递骑手与电动自行车骑行者须考取驾照", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "09-20 01:31", "summary": "俄国家杜马议员 Фадеев 提议，应当强制要求快递外卖骑手取得骑乘电动自行车（электровелосипед）所需的驾驶资格，理由是电动两轮车在城市道路与配送场景中快速增长、事故风险上升。若落地，将对即时配送与电商末端履约的用工门槛、培训成本与配送时效产生影响，同时提升电动两轮车（含配套电池、充电与安全装备）的合规化采购需求。", "table": [["提议人", "国家杜马议员 Фадеев"], ["对象", "快递骑手 / 电动自行车骑行者"], ["措施", "强制取得驾驶资格"], ["影响", "即时配送用工门槛与末端履约成本"], ["派生需求", "电动两轮车与安全装备合规化"]], "sourceFull": "https://tass.ru/obschestvo/28129665"}, {"num": 26, "title": "«М.Видео»：旅行用电子商品需求已「去季节性」", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-18 12:30", "summary": "家电与消费电子零售商 «М.Видео» 表示，旅行类商品（便携电源、充电器、转接头、运动耳机与随身影像设备等）的需求已不再呈现传统的季节性波动，全年均保持活跃。该判断意味着电子配件卖家的铺货节奏与广告投放应从「旺季脉冲」转向「全年常备」，也解释了旅行相关小件在白电/数码类目中的占比提升。作为对照：同期 «М.Видео-Эльдорадо» 二季度营收同比下滑 40% 至 470 亿卢布，已从俄十大零售商掉至第 12 位，说明线下电子零售正把增长压力转向品类结构优化。", "table": [["结论", "旅行类电子商品需求去季节性"], ["代表品类", "便携电源/充电器/转接头/运动耳机/随身影像"], ["渠道启示", "全年常备铺货而非旺季脉冲"], ["对照", "«М.Видео-Эльдорадо» Q2 营收 -40%、排名第 12"]], "sourceFull": "https://www.retail.ru/news/m-video-spros-na-tovary-dlya-puteshestviy-perestal-byt-sezonnym-18-sentyabrya-2026-282283/"}]}
