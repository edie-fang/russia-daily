10-01 生效"], ["退货修正案", "拟 2027-03-01 生效"]], "num": 2, "tag": "local", "tagText": "本地", "sourceFull": "https://www.chita.ru/text/economics/2026/09/25/76660747/"}, {"title": "财政部为 Ozon 及其卖家开税收递延通道；《税法典》修正案把「国防支出 + 受损设施修复」纳入利润税税前扣除", "source": "俄新社(RIA) / 零售网(Retail.ru) / Vedomosti", "time": "09-21 ~ 09-22", "url": "https://ria.ru/20260922/ozon-2119405473.html", "summary": "财政部副部长萨扎诺夫确认，正参照 Wildberries 先例讨论向 Ozon 及其卖家（селлеры）提供税款与社保费缓缴、暂停税务检查与缴费正确性核查，「支持规模由政府确定」，该问题处于「高度成熟阶段」；今年 8 月政府已批准针对因无人机袭击受损的 Wildberries 设施相关企业的一揽子措施。同期他表示正与行业代表起草《税法典》修正案，把「设施国防支出」与「受袭受损设施修复支出」纳入企业所得税税前扣除基数、拟秋季提交杜马，并同步研究修改立法以保护设施免遭无人机袭击——反无人机防护正从企业个别行为转向法律与税务层面的系统性安排。实务含义：Ozon 侧受损卖家有望取得与 WB 卖家同口径的现金流缓冲；自有仓或 3PL 仓的防空加固与修复成本将获得税前扣除依据，建议按「防空设备—工程改造—保险理赔」三条线分类立账留存凭证。", "table": [["当事方", "Ozon 及其卖家（селлеры）"], ["参照先例", "Wildberries（2026-08 已获批）"], ["措施", "税款/社保缓缴 + 暂停税务检查"], ["新增可扣除项", "国防支出 + 受损设施修复支出"], ["立法节奏", "修正案拟秋季提交杜马"], ["配套立法", "反 БПЛА 设施保护立法（研究中）"]], "num": 3, "tag": "local", "tagText": "本地", "sourceFull": "https://ria.ru/20260922/ozon-2119405473.html"}, {"title": "Ozon 为 БПЛА 保险「反向补贴」：服装鞋履商家保费全额返还，履约中心免费仓储延长至 365 天", "source": "生意人报(Kommersant) / 零售网(Retail.ru)", "time": "09-23 ~ 09-24", "url": "https://www.kommersant.ru/doc/8973050", "summary": "Ozon 9-23 公布一揽子卖家支持措施，核心三条：① 服装、鞋履与部分配饰类目，凡持有 «Ингосстрах» БПЛА 风险保单的商家，自 10-05 起至 2026 年底可获等额于保费的奖金返还（首笔按 10 月账期于 11 月发放），商家须设置「申报货值」且申报货值需低于最高赔付额 5%；② 自 09-22 至年底向 Ozon 履约中心（ЛЦ）发货的商家，商品免费存放期延长至 365 天（大件 40 天）；③ 向⻄伯利亚与哈萨克斯坦履约中心免费运输卖家商品的政策延至 2027-01-15。公司通报此前已赔付约 82 亿卢布、覆盖约 9 万家卖家。对卖家的含义：服装鞋履类目的「保险 + 返还」实际上把仓储风险成本部分对冲，但返还与「申报货值上限」绑定，需要与保单条款逐项核算，避免为拿返利而压低货值申报。", "table": [["保费返还", "等于保单成本，10-05 ~ 年底"], ["首笔到账", "2026-11（按 10 月账期）"], ["申报货值上限", "低于最高赔付额 5%"], ["免费仓储", "365 天（大件 40 天），09-22 起"], ["免费运输至西伯利亚/哈国", "延至 2027-01-15"], ["累计已赔付", "82 亿卢布 / 约 9 万家卖家"]], "num": 4, "tag": "local", "tagText": "本地", "sourceFull": "https://www.kommersant.ru/doc/8973050"}, {"title": "Versta.io：仓库遇袭后物流市场进入「重构期」——到门时效最坏拉长 2.5 倍、货物险涨价、批次拆散为多点小库位", "source": "零售网(Retail.ru) 引 Versta.io", "time": "09-24", "url": "https://www.retail.ru/news/rynok-logistiki-zhdet-masshtabnaya-perestroyka-posle-atak-na-sklady-marketpleyso-24-sentyabrya-2026-282516/", "summary": "数字物流运营商 Versta.io 给出遇袭潮后的第一份行业判断：① 货主与平台已开始「试探性」寻找新库源，目的是把批次打散到更多、更不起眼的小型库点来分散风险，而不是继续押注单一大型枢纽；② 由此形成从南部地区向⻄伯利亚与远东的调货需求，到门（门到门）时效最坏情形拉长至 2.5 倍；③ 货物保险费率同步上行，最终会传导到消费端价格。趋势判断：大型枢纽租金的「安全溢价」与分散小库点的「管理成本」同时上升，「一个大仓 + 一个备仓」的传统双仓结构将被「多点多批次」替代。该判断与本周莫斯科州轻型工业仓储放量（二季度新增 7.5 万㎡、环比 +42%，全年潜在 +77%）互相印证——分散库存的现货仓源正在放量，是重新议定 3PL 与仓租条款的窗口。", "table": [["时效影响", "最坏情形拉长 2.5 倍"], ["区域流向", "南部 → 西伯利亚 / 远东"], ["策略变化", "批次打散、多点小库位"], ["成本项", "货物保险费率上行"], ["结构", "由「大仓+备仓」转向多点多批次"]], "num": 5, "tag": "local", "tagText": "本地", "sourceFull": "https://www.retail.ru/news/rynok-logistiki-zhdet-masshtabnaya-perestroyka-posle-atak-na-sklady-marketpleyso-24-sentyabrya-2026-282516/"}, {"title": "联邦海关署 СПОТ 预申报系统运行三个月：财政效应 338 亿卢布，中国货直报俄罗斯比例上升", "source": "生意人报(Kommersant) / Vedomosti", "time": "09-21 ~ 09-23", "url": "https://www.kommersant.ru/doc/8972646", "summary": "财政部副部长萨扎诺夫在莫斯科金融论坛披露：自 6-1 起对经欧亚经济联盟陆路入境的进口推行的「货物等待确认系统」（СПОТ），到 9 月初已产生 338 亿卢布财政效应（全年目标 500 亿卢布）；至 9-10 应缴间接税超过 2180 亿卢布，办理 54.4 万份 ДОПП 预申报，月均 1.1 万进口商使用，95% 的 QR 码有效，每周约 600 辆卡车因手续问题被拦在边境。联邦海关署长皮卡列夫称，中国货「绝大多数按真实价值直接报关进入俄罗斯」，经吉尔吉斯斯坦与哈萨克斯坦的转口通道明显减少；企业界要求以银行保函替代保证金、并把诚信门槛降至 50–100 亿卢布。同期普京会见海关署长，专题讨论打击「灰色进口」。卖家含义：短期进口通道无新增摩擦，但报关单据与白关合规链检查会更严，需复核进口来源、报关凭证链与品牌授权文件。", "table": [["财政效应（至 9 月初）", "338 亿卢布 / 全年目标 500 亿"], ["应缴间接税（至 9-10）", "超 2180 亿卢布"], ["已办 ДОПП", "54.4 万份"], ["月均使用进口商", "1.1 万家"], ["每周被拦卡车", "约 600 辆"], ["企业诉求", "银行保函替代保证金；诚信门槛降至 50–100 亿卢布"]], "num": 6, "tag": "local", "tagText": "本地", "sourceFull": "https://www.kommersant.ru/doc/8972646"}, {"title": "Wildberries 上线「买家向卖家议价」（折扣区间 1%–35%），零售周报披露自有品牌渗透与连锁营收分化", "source": "零售网(Retail.ru)", "time": "09-20", "url": "https://www.retail.ru/news/daydzhest-14-09-20-09--20-sentyabrya-2026-282316/", "summary": "零售网周报（覆盖 9-14 至 9-20）披露：Wildberries 已上线「向卖家请求折扣」功能，买家可在商品卡内提出期望折扣，幅度区间 1%–35%，是否开放该功能、对哪些商品开放以及是否应允完全由卖家决定。周报同期记录：90% 以上消费者选择自有品牌（СТМ）、Х5 成为俄最大食品生产商、«Светофор» 与 «Ашан» 上半年营收分别下滑 4.5% 与 2.5%。对卖家的含义：议价入口把定价与促销主动权部分交回卖家，但同时把「是否被动压价」的责任转移给卖家运营能力，需同步设定折扣下限与毛利红线、按类目分层开放，避免在旺季被单向挤压。（原稿发布于 09-20，本周日报 09-21 期收录，本条属周视角归并。）", "table": [["新增功能", "买家在商品卡内请求折扣"], ["折扣区间", "1%–35%，由卖家自主决定"], ["СТМ 渗透率", "90% 以上消费者"], ["上半年营收", "Светофор -4.5%、Ашан -2.5%"], ["周报覆盖期", "09-14 ~ 09-20"]], "num": 7, "tag": "local", "tagText": "本地", "sourceFull": "https://www.retail.ru/news/daydzhest-14-09-20-09--20-sentyabrya-2026-282316/"}, {"title": "«Лента» 收购⻄伯利亚最大独立零售商 «Мария-Ра»：1,303 家门店、交易估值 400–600 亿卢布", "source": "零售网(Retail.ru) 引 Банкфакс / Infoline", "time": "09-23", "url": "https://www.retail.ru/news/lenta-priobrela-torgovuyu-set-mariya-ra-23-sentyabrya-2026-282462/", "summary": "«Мария-Ра» 员工已获通知公司变更所有者，控制权转归 «Лента»（属 «Севергрупп»）。据 Infoline，截至 2026-07-01 «Мария-Ра» 在阿尔泰边疆区、阿尔泰共和国、新西伯利亚州、克麦罗沃州、托木斯克州的 280 个居民点拥有 1,303 家门店，分析机构估算交易对价 400–600 亿卢布，消息称 «Мария-Ра» 招牌至少保留两年、暂不 rebranding。对卖家的含义：⻄伯利亚快消与家居类目的线下分销入口进一步集中，区域连锁的采购决策集中度与账期条款或随整合调整；依赖单一区域分销商的卖家应重估渠道集中度风险，并在整合窗口期尽早对接新采购主体。（同周 «Лента» 另在莫斯科新开 1 家 гипермаркет。）", "table": [["收购方", "«Лента»（Севергрупп）"], ["标的门店", "1,303 家 / 280 个居民点"], ["覆盖区域", "阿尔泰、新西伯利亚、克麦罗沃、托木斯克等"], ["估算对价", "400–600 亿卢布"], ["品牌保留", "至少 2 年"]], "num": 8, "tag": "local", "tagText": "本地", "sourceFull": "https://www.retail.ru/news/lenta-priobrela-torgovuyu-set-mariya-ra-23-sentyabrya-2026-282462/"}, {"title": "前 200 食品连锁净新增商业面积同比 -46.2%（2011 年以来最低），X5 开店计划下调 30.3%", "source": "零售网(Retail.ru)", "time": "09-24", "url": "https://www.retail.ru/news/na-46-upal-za-god-chistyy-prirost-torgovykh-ploshchadey-u-produktovykh-riteylero-24-sentyabrya-2026-282552/", "summary": "俄零售数据显示，200 家最大食品连锁 1–6 月净新增商业面积 43.01 万平方米、同比 -46.2%，为 2011 年以来最低。结构上硬折扣业态 -50.7%（主要受 «Светофор»、«Маяк»、«Доброцен» 收缩影响），超市、大卖场与「近家店」合计仅 -12.4%、但只贡献总增量的 8.7%。企业侧：«Магнит» 表示已把投资计划从「数量」转向「质量」；X5 计划 2026 年新开 2,000 家以上门店、较上年下调 30.3%。对卖家的含义：线下分销的增量入口在收缩，快消与家居的线下铺货空间让位于线上与平台渠道；与连锁谈陈列、进场与账期时，对方的扩张边际趋弱意味着议价空间有限，应把重点放在单店产出与动销而不是铺点数量。", "table": [["净新增面积（1–6 月）", "43.01 万㎡（-46.2%）"], ["硬折扣业态", "-50.7%"], ["主流业态", "-12.4%，仅占增量 8.7%"], ["X5 2026 开店", "2,000+ 家（-30.3%）"], ["历史位次", "2011 年以来最低"]], "num": 9, "tag": "local", "tagText": "本地", "sourceFull": "https://www.retail.ru/news/na-46-upal-za-god-chistyy-prirost-torgovykh-ploshchadey-u-produktovykh-riteylero-24-sentyabrya-2026-282552/"}, {"title": "E-Promo Group：上半年俄电商流量成本 +11.5%、目标转化成本 +18.7%，转化率系统性下滑", "source": "零售网(Retail.ru) 引 E-Promo Group / 消息报", "time": "09-22 ~ 09-23", "url": "https://www.retail.ru/news/e-promo-group-stoimost-tselevogo-deystviya-v-internet-reklame-vyrosla-na-17-4-23-sentyabrya-2026-282477/", "summary": "E-Promo Group 对五个行业的监测显示，2026 年上半年 performance 广告的目标转化成本（CPA）同比 +17.4%，而点击成本（CPC）仅 +2.1%，二者增速差达 15.3 个百分点；其中线上零售 CPC +11.5%、CPA +18.7%。分析认为这说明用户仍会点击比价，但走到下单或留资的意愿下降——流量更便宜、结果更贵。与之同向的是零售媒体变现加速：《消息报》报道食品零售商靠站内广告已赚取数十亿卢布，成为毛利之外的第二个利润引擎，站内广告位供给与竞价密度都会上升。卖家含义：推广费占售价比重面临新一轮抬升，Q4 促销预算应按 CPA 而非 CPC 重算并设 ROI 下限，同时把比价场景（详情页、评价、配送时效）作为转化率修复重点；零售媒体花钱的地方，也是精细化运营的利润点。", "table": [["CPA（全行业）", "+17.4% 同比"], ["CPC（全行业）", "+2.1%"], ["增速差", "15.3 п.п."], ["线上零售", "CPC +11.5% / CPA +18.7%"], ["零售媒体", "食品零售商广告收入达数十亿卢布"]], "num": 10, "tag": "local", "tagText": "本地", "sourceFull": "https://www.retail.ru/news/e-promo-group-stoimost-tselevogo-deystviya-v-internet-reklame-vyrosla-na-17-4-23-sentyabrya-2026-282477/"}, {"title": "平台合规审查全面收紧：羊毛拖鞋商品卡 80% 违规被通报；烟花类商品须持证、禁止平台内直销", "source": "零售网(Retail.ru) 引 Роскачество / Wildberries / Ozon", "time": "09-24 ~ 09-25", "url": "https://www.retail.ru/news/roskachestvo-80-kartochek-sherstyanykh-tapochek-na-marketpleysakh-vvodyat-pokupa-24-sentyabrya-2026-282524/", "summary": "«Роскачество» 公布羊毛拖鞋专项监测第一阶段结果：在 Wildberries、Ozon、Яндекс Маркет 抽查 608 张商品卡，488 张（80%）使用「мех / овчина / евромех / экомех」等替代「шерсть（羊毛）」的违规表述（不符合 ГОСТ）；分平台违规率 Wildberries 99% 最高、Яндекс Маркет 55% 最低，第二阶段实验室检测定于 2026 年底。同时针对国家「打击工业品非法流通委员会」提出的 ПВЗ 在居民楼内存放烟花制品问题，Wildberries 与 Ozon 双双收紧烟花类审核：接入专项审核、需年满 18 岁确认、无合格证直接下架、禁止平台内直销（卖家须自行仓储与配送），且仅允许销售 1–3 类民用级制品。卖家含义：材质宣称类文案与可燃易爆类目在 Q4 旺季前的合规门槛显著抬高，申报与合格证文件需留存备查，与 2027-03-01 的商品卡真伪核验形成前后夹击。", "table": [["抽查商品卡", "608 张（WB / Ozon / Яндекс Маркет）"], ["违规比例", "488 张 = 80%"], ["分平台违规率", "Wildberries 99% / Яндекс Маркет 55%"], ["烟花类新规", "18 岁确认 + 无合格证下架"], ["平台内直销", "禁止，卖家自发货"], ["可售等级", "仅 1–3 类民用级"]], "num": 11, "tag": "local", "tagText": "本地", "sourceFull": "https://www.retail.ru/news/roskachestvo-80-kartochek-sherstyanykh-tapochek-na-marketpleysakh-vvodyat-pokupa-24-sentyabrya-2026-282524/"}, {"title": "Ozon 与 Wildberries 卖家诉讼量增至 1.5–2 倍；ВТБ 与 Wildberries-Russ 的交易推迟、预计一个月内定案", "source": "生意人报(Kommersant) / Vedomosti", "time": "09-20 ~ 09-24", "url": "https://www.kommersant.ru/doc/8970918", "summary": "生意人报 9-20 报道，Ozon 与 Wildberries 记录的卖家起诉案件数量同比增至 1.5–2 倍，诉求集中在无人机袭击物流设施后的商品损失与平台赔付、回款流程中断两类；实务含义是司法途径正成为索赔与保证金追索的替代通道，建议系统留存入库凭证、保单号与平台赔付登记编号，并按批次区分「遇袭损失」与「常规退货损失」，避免举证时混同。金融侧，ВТБ 行长 Костин 表示与 Wildberries-Russ（РВБ）的战略合作计划未变，但文件准备进度略有推迟，第一步为收购 РВБ 子银行 5% 股份，预计未来一个月内完成相关约定。卖家含义：平台系金融主体结构的定型速度直接决定结算账户、账期与融资工具的可用性，若交易在 10 月落地，Q4 大促期间的平台侧账期与供应链金融产品有望更新。", "table": [["诉讼量变化", "增至 1.5–2 倍"], ["主因", "物流损失 + 赔付/回款中断"], ["涉及平台", "Ozon、Wildberries"], ["ВТБ × РВБ", "先收购 РВБ 子银行 5% 股份"], ["进度", "文件准备推迟，预计 1 个月内定案"]], "num": 12, "tag": "local", "tagText": "本地", "sourceFull": "https://www.kommersant.ru/doc/8970918"}, {"title": "莫斯科与莫斯科州成全国最大采购市场：零售板块采购额 +10%，食品 +445%、日用百货 +308%", "source": "零售网(Retail.ru)", "time": "09-24", "url": "https://www.retail.ru/news/roznichnaya-torgovlya-stala-krupneyshim-segmentom-po-obemu-zakupok-v-moskve-i-po-24-sentyabrya-2026-282525/", "summary": "电子交易平台数据显示，莫斯科与莫斯科州 2026 年上半年商业企业采购额 +10%，居全国采购需求集中度第一（其后为萨马拉州、斯维尔德洛夫斯克州、后贝加尔边疆区、圣彼得堡与列宁格勒州、克麦罗沃州、鞑靼斯坦、克拉斯诺达尔与哈巴罗夫斯克边疆区）。零售业是区域内最大采购板块，采购内容以软件、广告服务、日用百货、包装、计算机与办公设备、运输服务为主；增速最猛的是食品（+445%）、日用百货（+308%）、服务器与网络设备（近 +50%）。卖家含义：B 端（企业/连锁采购）与 G 端（政府）招标是「日用百货 + 包装 + 运输服务」类供应商的现实增量渠道，且回款相对可预期，值得在 Q4 纳入渠道结构以对冲零售端的价格竞争。", "table": [["采购额增速", "+10%（莫斯科市与莫斯科州）"], ["区域排名", "全国第 1（采购集中度）"], ["食品采购", "+445%"], ["日用百货", "+308%"], ["服务器/网络设备", "近 +50%"]], "num": 13, "tag": "local", "tagText": "本地", "sourceFull": "https://www.retail.ru/news/roznichnaya-torgovlya-stala-krupneyshim-segmentom-po-obemu-zakupok-v-moskve-i-po-24-sentyabrya-2026-282525/"}, {"title": "消费端「降级 + 季节性刚需」并存：二手与租赁消费上升，Ozon 秋季前两周服装订单同比 +1.4~1.6 倍", "source": "消息报(Izvestia) / 零售网(Retail.ru) 引 Ozon", "time": "09-22 ~ 09-25", "url": "https://www.retail.ru/news/ozon-spros-na-verkhnyuyu-odezhdu-v-nachale-sentyabrya-vyros-v-1-5-raza-god-k-god-25-sentyabrya-2026-282563/", "summary": "《消息报》9-22 报道，俄罗斯消费者在预算约束下更多转向二手物品与租赁（прокат）消费；该趋势与 8 月二手乘用车销量连续第二个月下滑、7 月消费者信心指数 -15%、近三成消费者单次采购件数压缩 10% 以上等口径一致，指向耐用品（家电、灯具、家居、家具）新品需求弹性下降，卖点需从「更新换代」转向「性价比 + 耐用 + 服务」。与之相对，季节性刚需仍在释放：Ozon 数据显示 9-1 至 9-14 童装外套订单同比 ×1.6、男装 ×1.5、女装 ×1.4，女式大衣 ×1.8、儿童羽绒服 ×1.7、毛衣近 ×2，配饰端儿童手套近 ×3（男 ×2.1、女 ×1.7）、儿童帽子 ×2.1。卖家含义：Q4 备货弹性应下调，重点押注「刚需 + 季节性高性价比」条目，并把分期/服务作为耐用品转化工具。", "table": [["消费趋势", "二手 + 租赁消费上升"], ["关联口径", "消费者信心 -15%（7 月）/ Q3 降至 -16%"], ["Ozon 秋季前两周", "童装外套 ×1.6、男装 ×1.5、女装 ×1.4"], ["女式大衣 / 儿童羽绒服", "×1.8 / ×1.7"], ["儿童手套", "近 ×3（男 ×2.1、女 ×1.7）"]], "num": 14, "tag": "local", "tagText": "本地", "sourceFull": "https://www.retail.ru/news/ozon-spros-na-verkhnyuyu-odezhdu-v-nachale-sentyabrya-vyros-v-1-5-raza-god-k-god-25-sentyabrya-2026-282563/"}, {"title": "莫斯科州轻型工业仓储回暖：二季度新增 7.5 万㎡（环比 +42%），全年潜在规模同比 +77%", "source": "零售网(Retail.ru) 引 CORE.XP", "time": "09-22", "url": "https://www.retail.ru/news/rynok-light-industrial-narashchivaet-tempy-vvod-ploshchadey-v-ii-kvartale-2026-g-22-sentyabrya-2026-282403/", "summary": "CORE.XP 数据显示，2026 年上半年莫斯科环城公路以外 light industrial 新增建设 19.7 万㎡（同比 -36%），但二季度单季投用 7.5 万㎡、环比增长 42%；年内预计再投用 50.2 万㎡，全年潜在规模达 62.9 万㎡，比 2025 年的 35.5 万㎡高 77%。上半年优质存量达 109.5 万㎡，供应仍集中于南向（辛菲罗波尔公路占 53%），多层仓库形态开始起量；二季度自由区块加权年租金 14,849 卢布/㎡（不含增值税与运营费），多层仓 17,189 卢布/㎡，上半年 78% 面积通过购买成交。卖家含义：分散库存所需的现货仓源正在放量且以「购买」为主流交易结构，对需要在莫斯科周边建立第二、第三库点的卖家而言，Q4 是谈租金与租期的相对有利窗口（叠加 Versta.io 的「多点多批次」趋势判断）。", "table": [["二季度新投用", "7.5 万㎡（环比 +42%）"], ["全年潜在规模", "62.9 万㎡（2025 年 35.5 万㎡，+77%）"], ["自由块年租金", "14,849 卢布/㎡（多层仓 17,189）"], ["供应集中度", "辛菲罗波尔公路占 53%"], ["交易结构", "上半年 78% 面积通过购买成交"]], "num": 15, "tag": "local", "tagText": "本地", "sourceFull": "https://www.retail.ru/news/rynok-light-industrial-narashchivaet-tempy-vvod-ploshchadey-v-ii-kvartale-2026-g-22-sentyabrya-2026-282403/"}, {"title": "«Яндекс» 与 VK 洽谈合并 B2B 资产：拟各持股 50% 组建合资公司，店铺 IT 与广告服务商格局可能重构", "source": "零售网(Retail.ru) 引 RBC", "time": "09-22", "url": "https://www.retail.ru/news/yandeks-i-vk-mogut-obedinit-b2b-aktivy-22-sentyabrya-2026-282418/", "summary": "据 RBC 消息，«Яндекс» 与 VK 正就组建合资公司进行谈判，新实体可能以 Yandex B2B Tech 与 VK Tech 两大方向为基础：资产清单尚未最终确定，讨论中的方案包括 VK 转出 VK Tech，«Яндекс» 转出云平台 Yandex Cloud、「Яндекс 360」服务以及 B2B 部门的一项 ИИ 资产，双方预计各持 50%，运营主体可能是 ООО «БТБ Тех»，谈判已持续两个多月。对卖家的含义：俄本土 B2B 云与数字化服务供给可能进一步集中，店铺所用的 IT、广告、CRM 与数据分析服务商的归属及费率或在整合后调整；建议梳理现有服务商合同与数据资产归属，并在续约前确认并购后的服务连续性与价格条款，避免在整合期被动接受涨价或功能变更。", "table": [["双方持股", "各 50%"], ["Яндекс 侧资产", "Yandex Cloud / «Яндекс 360» / 一项 ИИ 资产"], ["VK 侧资产", "VK Tech"], ["运营主体（候选）", "ООО «БТБ Тех»"], ["谈判时长", "2 个多月"]], "num": 16, "tag": "local", "tagText": "本地", "sourceFull": "https://www.retail.ru/news/yandeks-i-vk-mogut-obedinit-b2b-aktivy-22-sentyabrya-2026-282418/"}, {"title": "【周五补充】Wildberries 简化 ПВЗ 开店计划从「小居民点」扩至 30 万人口以上城市：无需单独租铺、可嵌入既有门店", "source": "零售网(Retail.ru) / 塔斯社(TASS)", "time": "09-25", "url": "https://www.retail.ru/news/wildberries-zapustila-uproshchennuyu-programmu-po-otkrytiyu-pvz-v-krupnykh-gorod-25-sentyabrya-2026-282592/", "summary": "Wildberries（属 RWB 集团）9-25 宣布扩大「简化条件开 ПВЗ」的加盟计划：此前只允许在人口 5,000 以下居民点以简化条件开设，现在放开到人口超过 30 万的城市。启动门槛为一张发货桌、一间带帘试衣间、一部智能手机或笔记本，以及 1 个摄像头（若库房独立则 2 个），公司免费提供面板支架、招牌与信息海报；最大变化是无需单独租铺，ПВЗ 可直接开在咖啡店、洗衣店或商店内的合规位置，按简化格式的品牌规范执行，但私宅不在适用范围内。卖家与渠道含义：城市核心区的末端取件点密度将加速提升（叠加 Wildberries 自提点加入「安全岛」项目、ПВЗ 社区基础设施属性增强），取件时效与拒收后可就地转售的能力成为卖家 Q4 时效体验的关键变量。", "table": [["新适用范围", "人口 30 万以上城市（原仅 5,000 人以下居民点）"], ["启动门槛", "1 张发货桌 + 1 间试衣间 + 手机/笔记本 + 1–2 个摄像头"], ["公司承担", "支架、招牌、信息海报免费提供"], ["形态", "可嵌入咖啡店/洗衣店/商店，无需单独租铺"], ["限制", "不适用于私宅"]], "num": 17, "tag": "local", "tagText": "本地", "sourceFull": "https://www.retail.ru/news/wildberries-zapustila-uproshchennuyu-programmu-po-otkrytiyu-pvz-v-krupnykh-gorod-25-sentyabrya-2026-282592/"}]}, {"icon": "🏛", "name": "时政", "items": [{"title": "国家杜马选举收官：«Единая Россия» 锁定宪法多数，单席位选区 225 中领先 208、投票率逾 59%", "source": "俄新社(RIA) / Vedomosti / RBC / 生意人报(Kommersant)", "time": "09-20 ~ 09-23", "url": "https://ria.ru/20260922/vybory-2119407274.html", "summary": "选举结果在 9-21 至 9-23 间基本落定：中央选举委员会处理逾 95% 议定书时，«Единая Россия» 联邦选区得票稳定在 57% 区间并锁定宪法多数（此前仅在 2007 年与 2016 年出现过两次），单席位选区在 225 个中领先 208 个，全国投票率逾 59%，远程电子投票人数超 600 万创纪录；地方层面克里米亚 ЕР 得票 60.70%（投票率 48.52%）、托木斯克州立法杜马 42 席中获 28 席、ЛДПР 历史首次进入车臣议会，米罗诺夫继续任「公正俄罗斯」党团领袖。合规争议方面，ЦИК 通报逾 36,800 张选票被判无效、15 名观察员经法院裁决被撤下、10 个地区 74 栋选举委员会建筑受损、记录 56 起虚假炸弹威胁，但明确不存在取消选举结果的依据。商业含义：政权机构延续性强，平台经济法、税收与外资资产处置路线预计不变，Q4 政策预期趋于稳定。", "table": [["议定书处理进度", "> 95%"], ["ЕР 联邦得票", "57% 区间（锁定宪法多数）"], ["单席位领先", "208 / 225"], ["投票率", "> 59%（电子投票超 600 万人）"], ["无效选票", "> 36,800 张"], ["地方", "托木斯克 42 席中 28 席；克里米亚 ЕР 60.70%"]], "num": 18, "tag": "local", "tagText": "本地", "sourceFull": "https://ria.ru/20260922/vybory-2119407274.html"}, {"title": "9-20 凌晨莫斯科州遭大规模袭击：17 个区击落 249 架，Софьино 仓储综合体起火、МНПЗ 受损、2 死 5 伤", "source": "俄新社(RIA) / 消息报(Vedomosti)", "time": "09-20", "url": "https://ria.ru/20260920/ataka-2118847265.html", "summary": "莫斯科州州长沃罗比约夫通报，9-20 凌晨 03:00–05:00 州境遭大规模无人机袭击，防空与电子战力量在 17 个区击落与压制 249 架，莫斯科市长索比亚宁通报向莫斯科方向另有 151 架被摧毁；奥列霍沃-祖耶沃区 1 名男性死亡，Софьино 1 名女性死亡、另有 5 人受伤（含 2 名儿童），全州共 20 人需要医疗救助。同一夜拉缅斯科耶区 Софьино 一处仓储综合体被击中起火、另有一栋 21 层住宅屋顶起火致 400 名住户疏散，科捷利尼基、列宁区、雷特卡里诺、科洛姆纳等多处住宅受损，莫斯科炼油厂（МНПЗ）厂内一处设施受损。本报告如实标注：起火仓储综合体的业主身份（是否属 Ozon / Wildberries 等平台）未获官方或平台确认，未计入平台仓库遇袭数据库；建议在该区域有货的卖家按「可能影响」预案对待，并按「同一夜多点受损」情景重做库存与订单演练。", "table": [["袭击时段", "09-20 03:00–05:00 MSK"], ["州境击落/压制", "249 架（17 个区）"], ["莫斯科方向摧毁", "151 架"], ["死亡 / 受伤", "2 人 / 5 人（含 2 名儿童）"], ["起火", "Софьино 仓储综合体（业主身份未获确认）"], ["其他受损", "МНПЗ 厂内设施、拉缅斯科耶 400 人疏散"]], "num": 19, "tag": "local", "tagText": "本地", "sourceFull": "https://ria.ru/20260920/ataka-2118847265.html"}, {"title": "打击纵深推向乌拉尔与伏尔加流域：9-25 斯维尔德洛夫斯克州进入「无人机危险状态」，沃罗涅日、乌里扬诺夫斯克同时遇袭", "source": "Lenta.ru / 塔斯社(TASS) / 俄新社(RIA) / Vedomosti", "time": "09-23 ~ 09-25", "url": "https://lenta.ru/news/2026/09/25/bespilotniki-atakovali-ural/", "summary": "9-25 凌晨（MSK）俄境多点遇袭：斯维尔德洛夫斯克州州长 Паслер 宣布全州进入「无人机危险状态」，提示可能出现通信与移动互联网限制、禁止拍摄防空作业与捡拾残骸——该州叶卡捷琳堡正是 Wildberries 大型履约中心所在地（8-31 已被击中一次）；乌里扬诺夫斯克正在「抵御大规模 БПЛА 袭击」；沃罗涅日上空 ПВО 接战，州长 Гусев 称市内损伤情况仍在核实。规模上，9-23 凌晨俄方通报击落 514 架（本周峰值，9-21 夜为 244 架），9-24 通报前夜仅 40 架、涉 7 个地区，单夜规模大幅回落但打击重心由中部枢纽向伏尔加流域与乌拉尔移动。卖家含义：单夜数百架级已成常态，「枢纽停摆 24–48 小时」的情景假设应扩展到乌拉尔方向；在叶卡捷琳堡、乌法、喀山、萨马拉有货的卖家需把区域分散度与替代调货路径纳入 Q4 预案。", "table": [["9-25 新增状态", "斯维尔德洛夫斯克州「无人机危险状态」"], ["同期袭击", "沃罗涅日（损伤核实中）、乌里扬诺夫斯克（大规模）"], ["关键设施", "叶卡捷琳堡为 WB 大型履约中心所在地"], ["9-23 单夜", "击落 514 架（全俄，本周峰值）"], ["9-24 通报", "前夜 40 架 / 7 个地区"]], "num": 20, "tag": "local", "tagText": "本地", "sourceFull": "https://lenta.ru/news/2026/09/25/bespilotniki-atakovali-ural/"}, {"title": "克拉斯诺达尔边疆区 9-23 起全境进入紧急状态：物流设施遭袭 + 港口停运，农产品无法外运、州内粮价供过于求", "source": "RTVI", "time": "09-23 ~ 09-24", "url": "https://rtvi.com/news/na-kubani-vveli-rezhim-chs-iz-za-problem-s-vyvozom-zerna-na-fone-atak-bpla/", "summary": "克拉斯诺达尔边疆区自 9 月 23 日起全境进入区域级紧急状态（ЧС）。政令原文指出：因对物流基础设施的「大规模袭击」、港口作业暂停以及亚速海-黑海海域航运中断，本地区农业生产经营者无法实现大量农产品的销售外运，导致国内粮食市场供过于求。对卖家的含义：这是本轮打击第一次以「地方政府 ЧС」的形式把物流中断制度化——① 南部（新罗西斯克、克拉斯诺达尔方向）的公路与铁路干线舱位将被粮食外运挤占，Q4 进出口货物的运价与预约难度上升；② 谷物、油料及其下游（面粉、饲料、包装）价格可能短期下行，而运输成本上行，两端不同步会影响快消与食品类目的毛利测算；③ 涉及南部港口中转的报关与集港计划需要预留更长的缓冲窗口。", "table": [["生效时间", "2026-09-23 起"], ["范围", "克拉斯诺达尔边疆区全境"], ["直接原因", "物流设施遭袭 + 港口停运 + 航运中断"], ["后果", "农产品无法外运、州内粮价供过于求"]], "num": 21, "tag": "local", "tagText": "本地", "sourceFull": "https://rtvi.com/news/na-kubani-vveli-rezhim-chs-iz-za-problem-s-vyvozom-zerna-na-fone-atak-bpla/"}, {"title": "9-22~9-23 伏尔加-乌拉尔枢纽机场连环停摆：喀山、萨马拉、乌法、切博克萨雷先后限制航班放行", "source": "国际文传电讯社(Interfax) / 俄新社(RIA)", "time": "09-22 ~ 09-23", "url": "https://www.interfax.ru/russia/1117854", "summary": "俄联邦航空运输署（Росавиация）通报，9-23 凌晨起先后对喀山（02:19）、布古利马与下卡姆斯克（Бегишево，02:41）、萨马拉（Курумоч）与乌法（03:57）、切博克萨雷（04:05）机场实施航班接收与放行的临时限制，莫斯科多莫杰多沃机场在实施限制后已恢复常态运行，克里米亚大桥公路交通一度暂停后恢复，所有限制理由均为「保障飞行安全」。同期萨马拉州连续第二夜遭大规模袭击，州长称「敌人瞄准的是工业企业」（该州正是 Ozon 恰帕耶夫斯克仓所在州），民用设施包括私人住宅与汽车受损。卖家含义：物流中断的传导路径已从「仓库被炸」扩展到「枢纽间歇停摆」，伏尔加流域与乌拉尔方向的主干空运、快件与部分干线时效需按「枢纽中断 24–48 小时」预留缓冲，高时效订单应准备备用通道，并持续跟踪平台的区域暂停收货与改道公告。", "table": [["受限机场", "喀山 / 萨马拉 / 乌法 / 布古利马 / 下卡姆斯克 / 切博克萨雷"], ["首起限制", "02:19（喀山）"], ["多莫杰多沃", "限制后已恢复"], ["克里米亚大桥", "暂停后恢复"], ["萨马拉州", "连续第二夜遭袭，目标为工业企业"]], "num": 22, "tag": "local", "tagText": "本地", "sourceFull": "https://www.interfax.ru/russia/1117854"}, {"title": "欧盟把对俄制裁一次延长三年（此前半年一续），Усманов 与 Фридман 被移出名单；西班牙宣布 2027-01-01 起停购俄 СПГ", "source": "Lenta.ru / 消息报(Izvestia)", "time": "09-21 ~ 09-23", "url": "https://lenta.ru/news/2026/09/21/evrosoyuz-prodlil-sanktsii-protiv-rossii-srazu-na-tri-goda/", "summary": "据捷克电视台援引外交消息源，欧盟成员国常驻代表 9-21 在布鲁塞尔会议上同意把针对俄罗斯与白俄罗斯个人及实体的制裁延长三年（此前每次仅延长 6 个月），协议随后需走书面程序完成最终批准；同时消息称俄罗斯企业家 Усманов 与 Фридман 被移出制裁名单，此前法国、卢森堡在两人的去留问题上存在分歧。9-22 西班牙外交大臣 Альбарес 在华盛顿表示，西班牙计划自 2027-01-01 起停止进口俄罗斯液化天然气（СПГ），尽管存在多年期长期合同——「合同是按十年计的，我们将执行这些新制裁」。卖家含义：制裁框架由「半年一续」变为「三年锁定」，政策不确定性下降但退出通道收窄，从事对欧转口、物流保险与结算的卖家应据此按三年期重估合规成本与替代路径；欧洲天然气与电价的中枢风险未解除（德国储气库 9 月初仅灌装 53%，为 15 年同期最低）。", "table": [["延长时长", "3 年（此前 6 个月）"], ["对象", "俄罗斯/白俄罗斯个人与实体"], ["移出名单", "Усманов、Фридман"], ["西班牙停购 СПГ", "2027-01-01 起（存量合同仍执行）"], ["德国储气", "9 月初 53%（15 年同期最低）"]], "num": 23, "tag": "local", "tagText": "本地", "sourceFull": "https://lenta.ru/news/2026/09/21/evrosoyuz-prodlil-sanktsii-protiv-rossii-srazu-na-tri-goda/"}, {"title": "联大场边：拉夫罗夫与卢比奥会晤并向古特雷斯递交布查报告；俄 МИД 就欧盟动用冻结资产承诺「对等回应」", "source": "塔斯社(TASS) / 消息报(Izvestia) / 俄新社(RIA)", "time": "09-23 ~ 09-25", "url": "https://iz.ru/2173207/2026-09-25/lavrov-obsudil-s-guterrishem-reformu-oon-i-sobytiia-v-buche", "summary": "美国国务院与俄方分别确认，俄外长拉夫罗夫与美国国务卿卢比奥于 9-23 在联合国大会期间会晤（莫斯科时间 16:00），讨论俄美在联合国框架内的互动问题与分歧；拉夫罗夫将于 9-26 在联大一般性辩论发言并举行记者会，此行仅安排与一位欧洲代表会面。9-25 拉夫罗夫与联合国秘书长古特雷斯会谈，议题包括联合国改革与布查事件，并向后者递交关于布查「挑衅」的专项报告、要求联合国做详细调查，同期与伊朗外长会谈强调伊朗危机只能外交解决。针对欧盟推动动用被冻结俄资产的收益，俄 МИД 承诺给出「经过校准的对等回应」。卖家含义：冻结资产议题升温通常伴随对等反制（历史上表现为对境内不友好国资产的临时管理以及支付/结算通道进一步收紧），跨境收款路径与在俄资产的法域风险需保持预案，结算通道不宜单点依赖。", "table": [["会晤", "拉夫罗夫 × 卢比奥（9-23 16:00 MSK，纽约）"], ["议题", "联合国框架内互动与分歧"], ["递交文件", "布查「挑衅」报告（9-25）"], ["拉夫罗夫联大演讲", "9-26"], ["冻结资产", "МИД 承诺「经过校准的对等回应」"]], "num": 24, "tag": "local", "tagText": "本地", "sourceFull": "https://iz.ru/2173207/2026-09-25/lavrov-obsudil-s-guterrishem-reformu-oon-i-sobytiia-v-buche"}, {"title": "中美把「釜山协议」延长至 2027-01-10；分析机构量化「商品大迁徙」的第三国分流效应", "source": "消息报(Izvestia) / 国际文传电讯社(Interfax) / 生意人报(Kommersant)", "time": "09-24 ~ 09-25", "url": "https://iz.ru/2172536/2026-09-24/ssha-i-kitai-prodlili-deistvie-pusanskogo-soglasheniya-do-10-ianvaria", "summary": "美国财长 Бессент 在与中方国务院副总理何立峰会面后表示，双方已同意把所谓「釜山协议」（经济缓和安排）延长至 1 月 10 日（2027-01-10），即 2025 年 10 月 30 日釜山中美元首会晤达成的贸易休战再获展期；美方同期称将继续延长与中国的贸易协定。生意人报随后刊发分析量化其外溢效应：关税与合规成本推动的产能与货流迁移并未回到原路径，而是沉淀在新的中转国与新的品类组合上（标题《Великое переселение товаров》）。对俄市场的含义：中美关税休战延长短期压低「转口与灰色清关」的政策不确定性溢价，但也意味着美国对第三国采购俄油气加征关税的框架性压力仍是 Q4 的主要宏观风险；卖家的「转口—中转国—本地仓」选点逻辑应以关税与合规「长期化」为假设，而非押注回流。", "table": [["延长后期限", "2027-01-10"], ["宣布人", "美财长 Бессент（中方对接：副总理何立峰）"], ["起点", "2025-10-30 釜山会晤"], ["结构性判断", "货流沉淀于新的中转国与品类组合"]], "num": 25, "tag": "local", "tagText": "本地", "sourceFull": "https://iz.ru/2172536/2026-09-24/ssha-i-kitai-prodlili-deistvie-pusanskogo-soglasheniya-do-10-ianvaria"}, {"title": "反无人机防护制度化下沉：达吉斯坦确定关键设施防护清单，交通部 10-01 起无人机飞行须接入 «ЭРА-ГЛОНАСС»", "source": "塔斯社(TASS) / 消息报(Izvestia)", "time": "09-23 ~ 09-25", "url": "https://iz.ru/2173201/2026-09-25/v-rossii-vvedut-novoe-uslovie-dlia-soglasovaniia-grazhdanskikh-poletov-bespilotnikov", "summary": "塔斯社 9-23 报道，达吉斯坦共和国已形成需重点防护的「关键重要设施」清单；此前财政部正研究修改立法以保护各类设施免遭无人机袭击（9-21），并拟把「国防支出与受损设施修复支出」纳入利润税税前扣除，本轮清单落地意味着反无人机防护正从中央立法下沉到地区执行层面。9-24 俄交通部进一步通报：自 2026 年 10 月 1 日起，无人机飞行计划只有在其飞行器接入 «ЭРА-ГЛОНАСС» 系统后才会被受理。卖家含义：① 若自有仓或 3PL 仓所在地区被纳入清单管理，可能面临新增的安防合规要求（监控覆盖、物理加固、报备流程），建议在 Q4 租约谈判与工程预算中预留相应科目与工期；② 低空管制与识别框架的全国铺开将形成通信、导航与识别硬件（含模组、识别装置）的新增采购需求，是电子与安防类目的机会窗口。", "table": [["地区清单", "达吉斯坦共和国「关键重要设施」"], ["政策链条", "立法研究(9-21) + 税前列支(9-21) → 地区清单(9-23)"], ["飞行新规", "2026-10-01 起飞行计划须接入 «ЭРА-ГЛОНАСС»"], ["主管", "Минтранс РФ"]], "num": 26, "tag": "local", "tagText": "本地", "sourceFull": "https://iz.ru/2173201/2026-09-25/v-rossii-vvedut-novoe-uslovie-dlia-soglasovaniia-grazhdanskikh-poletov-bespilotnikov"}, {"title": "外资在俄资产处置继续反复：«Ашан» 与 «Нестле» 声明「非国有化」，Auchan 出售交易未落地，Volkswagen 破产管理人追索 40 亿卢布股息", "source": "零售网(Retail.ru) / 消息报(Izvestia) / 生意人报(Kommersant) / Vedomosti", "time": "09-21 ~ 09-24", "url": "https://www.retail.ru/news/lemana-pro-i-ashan-prodolzhat-rabotat-v-prezhnem-rezhime-21-sentyabrya-2026-282365/", "summary": "9-17 总统令把 Auchan、Nestlé、«Лемана Про»（原 Leroy Merlin）与 FM Logistic 等在俄外资资产移交临时管理后，本周各方密集表态：«Ашан» 称已收到临时管理人信函、对方有意维持业务不间断，门店按正常模式运营；临时管理人表示拟保留 «Лемана Про» 连锁网络；«Ашан» 与 «Нестле» 均声明移交管理「不属于国有化」；«Ашан Ритейл Россия» 由 Илья Бердников 出任负责人。与此同时，《消息报》称 Auchan 今年夏季已与 «Кама Капитал» 就出售俄子公司达成一致但交易最终未能完成；Volkswagen AG 破产管理人则就 «Порше Руссланд» 向境外股东支付的 40 亿卢布股息主张追偿，并要求认定卡卢加汽车厂、MAN 与 Scania 经销商交易无效。卖家含义：外资线下零售与建材 DIY 渠道短期未中断，供货与结算对接窗口仍在，但治理结构变化后原合同条款（账期、承租条件、退换货）须与临时管理人逐项重确认；与外资主体存在历史应收/预付敞口的卖家应做压力测试，「渠道主体变更条款」应写入合同。", "table": [["涉及主体", "Auchan / Nestlé / «Лемана Про» / FM Logistic（9-17 起临时管理）"], ["状态", "各方声明非国有化、继续按原模式运营"], ["人事", "«Ашан Ритейл Россия» 由 Илья Бердников 负责"], ["Auchan 出售", "夏季与 «Кама Капитал» 谈成但未落地"], ["Volkswagen", "追索 «Порше Руссланд» 40 亿卢布股息"]], "num": 27, "tag": "local", "tagText": "本地", "sourceFull": "https://www.retail.ru/news/lemana-pro-i-ashan-prodolzhat-rabotat-v-prezhnem-rezhime-21-sentyabrya-2026-282365/"}, {"title": "谈判信号相互矛盾：特朗普要求停止打击俄炼油厂、泽连斯基称愿会面但不停火力，克里姆林宫称三方谈判无进展", "source": "Lenta.ru / RBC（引 Axios）", "time": "09-20 ~ 09-21", "url": "https://lenta.ru/news/2026/09/21/tramp-v-razgovore-s-zelenskim-potreboval-prekratit-udary-po-rossiyskim-npz/", "summary": "Lenta 引 Axios 报道，特朗普在与泽连斯基通话中要求乌克兰停止打击俄罗斯炼油厂（НПЗ），白宫把美国柴油价格创纪录与乌克兰冲突挂钩；泽连斯基则称通话中达成在纽约会面的约定「可能改变很多事」。随后泽连斯基 9-21 公开表示希望与普京会面并「转向外交」，同时明确不会停止军事行动；克里姆林宫称三方谈判尚无任何进展，乌方也未在联大期间向俄方提议会面。对俄罗斯市场的含义：若对炼厂的打击节奏下降，燃油批发紧张的边际压力缓解，干线运输与平台物流的燃油附加费上行风险相应降温；但信号相互矛盾，短期不构成风险缓释——能源与物流成本假设不宜按「停火」情景下调，Q4 备货与运费预算仍应按「袭击常态化」基准编制，同时保留油价快速回落的预案。", "table": [["通话方", "特朗普 ↔ 泽连斯基"], ["美方要求", "停止打击俄炼油厂（НПЗ）"], ["乌方表态", "愿会面 + 转向外交，但不停止火力"], ["俄方口径", "三方谈判尚无进展"]], "num": 28, "tag": "local", "tagText": "本地", "sourceFull": "https://lenta.ru/news/2026/09/21/tramp-v-razgovore-s-zelenskim-potreboval-prekratit-udary-po-rossiyskim-npz/"}]}, {"icon": "📊", "name": "经济", "items": [{"title": "政府批准 2027–2029 联邦预算：收入 43.3 万亿、支出 48.8 万亿、赤字 2.2% GDP，配 2 万亿开支优化 + 五项「精准加税」", "source": "Vedomosti / 生意人报(Kommersant)", "time": "09-24 ~ 09-25", "url": "https://www.vedomosti.ru/economics/news/2026/09/24/1231650-pravitelstvo-odobrilo-proekt-byudzheta", "summary": "俄政府 9-24 会议批准 2027 年及 2028–2029 计划期联邦预算法案：收入 43.3 万亿卢布、支出 48.8 万亿卢布，2027 年赤字 2.2% GDP（低于 2026 年预期的 3%），三年赤字大致维持在 2% GDP 附近；国家项目（含技术类项目）2027 年安排约 19 万亿卢布。资金来源为「优化其他支出约 2 万亿」加五项针对性加税——有色冶金与化肥生产商、黄金开采企业、股市投资者，以及海外网购买家（跨境 НДС，见电商第 1 条）。法案经修订后将于 10-01 前连同宏观预测一并送交新选出的国家杜马。对卖家的含义：预算口径显示财政对能源收入的依赖被主动下调，税负结构继续向平台经济与跨境消费倾斜，2027 年的清关、定价与资金成本模型需按新税费口径预演；同期 9-21 西卢安诺夫已公布 2027 年预算油价假设为 50 美元/桶、ФНБ 年内将获最多 1 万亿卢布补充注资。", "table": [["2027 收入", "43.3 万亿卢布"], ["2027 支出", "48.8 万亿卢布"], ["2027 赤字", "2.2% GDP（2026 预期 3%）"], ["国家项目", "约 19 万亿卢布"], ["其他支出优化", "约 2 万亿卢布"], ["加税对象", "有色冶金与化肥、黄金开采、股市投资者、海外网购买家"]], "num": 29, "tag": "local", "tagText": "本地", "sourceFull": "https://www.vedomosti.ru/economics/news/2026/09/24/1231650-pravitelstvo-odobrilo-proekt-byudzheta"}, {"title": "Минэк 三年宏观预测：2026 GDP +0.6%、通胀预期由 5.2% 上调至 6.8%、美元均价 79.5，增长引擎由投资转向居民消费", "source": "Vedomosti / 生意人报(Kommersant) 引 Минэкономразвития", "time": "09-24 ~ 09-25", "url": "https://www.vedomosti.ru/economics/news/2026/09/24/1231559-inflyatsiyu-na-konets-goda", "summary": "俄经济发展部在 9-24 政府会议上提交 2026–2029 宏观预测：2026 年 GDP 增速上调 0.2 п.п. 至 0.6%；2026 年底通胀预期大幅上调，由 5.2% 升至 6.8%（仍落在央行 6–7% 区间内），主因燃油涨价沿产业链传导；2026 年美元平均汇率假设 79.5 卢布；居民消费需求 +4.1%、实际可支配收入 2026 年 +0.8%（另一口径 +1%）/2027 年 +1.5%，而固定资产投资 2026 年 -5.4%、2027 年零增长——增长动能在多年投资拉动之后改由居民消费支撑，且消费增速持续高于收入增速的组合须由储蓄率下降来弥合。行业侧：药品与医疗器械生产 2026 预计 +12.1%、天然气内销价格指数化 2027-07-01 起 +10.4%、2026 年石油产量预估 4.94 亿吨、航空客运量 -0.3%。同期 ОЭСР 把 2026 年全球 GDP 上调至 2.9%，但把俄罗斯 2027 年增速由 0.8% 下调至 0.6%。卖家含义：中低价位、高频日用类目量能仍在，但干线运费与进口成本两条成本线同时抬升，定价需按 6.8% 通胀与燃油链条重算；价格敏感度上升会强化分期/BNPL 类支付工具的重要性。", "table": [["GDP 2026", "+0.6%（上调 0.2 п.п.）"], ["通胀 2026 年底", "6.8%（前值 5.2%）"], ["美元均价 2026", "79.5 卢布"], ["居民消费 / 投资 2026", "+4.1% / -5.4%"], ["实际可支配收入 2026", "+0.8% ~ +1%"], ["药品与医疗器械生产", "+12.1%"]], "num": 30, "tag": "local", "tagText": "本地", "sourceFull": "https://www.vedomosti.ru/economics/news/2026/09/24/1231559-inflyatsiyu-na-konets-goda"}, {"title": "年度通胀放缓至 6.22%、周度仅 +0.06%，但汽油年初至今累计 +21.1%（食品端通缩与燃油端通胀并存）", "source": "生意人报(Kommersant) 引 Минэкономразвития / Росстат", "time": "09-23", "url": "https://www.kommersant.ru/doc/8973577", "summary": "俄经济发展部数据：9 月 21 日口径年度通胀 6.22%，较一周前的 6.24% 小幅回落；9-15 至 9-21 一周物价仅 +0.06%。俄统计局细项：鸡蛋周涨 2.4%，荞麦与冷冻鱼 +0.6%，猪肉与鸡肉 +0.5%，葵油与奶渣 +0.4%；蔬果整体 -1.6%（土豆 -3.4%、卷心菜 -3.3%、胡萝卜 -3.0%、苹果 -2.6%）。能源端仍是通胀主推力：汽油周涨 0.05%、年初至今 +21.1%；柴油周跌 0.66%、年初至今 +14.74%。卖家含义：食品端通缩与燃油/物流端通胀并存，Q4 干线运价与到仓成本仍应按上行情景测算；10-01 起 ЖКУ 指数化预计再推高通胀约 0.7 п.п.，叠加 Минэк 上调后的 6.8% 年度预期，定价模型应把运输与能源成本单列成行而不是并入「杂费」。（同周央行把「中东局势长期化」列入输入型通胀风险，见能源条目。）", "table": [["年度通胀（9-21 口径）", "6.22%（前值 6.24%）"], ["周度涨幅（9-15~9-21）", "+0.06%"], ["汽油（年初至今）", "+21.1%（周 +0.05%）"], ["柴油（年初至今）", "+14.74%（周 -0.66%）"], ["蔬果（周）", "-1.6%"], ["后续压力", "10-01 起 ЖКУ 指数化，或再推高约 0.7 п.п."]], "num": 31, "tag": "local", "tagText": "本地", "sourceFull": "https://www.kommersant.ru/doc/8973577"}, {"title": "8 月工业产出环比 -0.3%、同比 -0.6%（1–8 月零增长），三季度消费者信心降至 -16%", "source": "生意人报(Kommersant) 引 Росстат / ЦМАКП / СберИндекс", "time": "09-24", "url": "https://www.kommersant.ru/doc/8973591", "summary": "俄统计局数据：8 月工业产出指数在 6 月 +0.2%、7 月 +0.1% 的弱增长后再度环比 -0.3%（季调）、同比 -0.6%，1–8 月累计零增长。面向国内民用需求的部门继续收缩：服装 -2.8%、纺织 -1.1%、家具 -1.6%、纸品 -3.8%（环比），食品 +2.2%。「СберИндекс」显示 9-14~9-20 一周实际消费支出同比增速回升至 1.5%（前值 1.2%），但非食品类名义增速继续放缓至 10.7%（前值 10.9%）；统计局口径三季度消费者信心指数降至 -16%（环比 -3 п.п.）。卖家含义：制造业端并未出现修复，耐用消费品与家居类目（家具 -1.6%、纺织 -1.1%）需求端仍弱，选品应回避高客单整装型需求；「消费支出回升但非食品名义增速放缓」的组合说明消费结构正向低价与刚需倾斜，Q4 促销应以件单价而非件数做目标。", "table": [["工业产出（8 月环比/同比）", "-0.3% / -0.6%"], ["1–8 月累计", "0.0%"], ["服装/家具/纸品（环比）", "-2.8% / -1.6% / -3.8%"], ["实际消费（9-14~20）", "+1.5% 同比"], ["消费者信心（Q3）", "-16%（环比 -3 п.п.）"]], "num": 32, "tag": "local", "tagText": "本地", "sourceFull": "https://www.kommersant.ru/doc/8973591"}, {"title": "审计院半年度报告：上半年联邦预算赤字 5.85 万亿卢布（为全年批准额度的 1.5 倍）、国家债务 37.5 万亿；АКРА：5 个地区贡献合并预算税收一半", "source": "俄新社(RIA) 引 审计院 / 生意人报(Kommersant) 引 АКРА", "time": "09-23", "url": "https://ria.ru/20260923/defitsit-2119624863.html", "summary": "俄审计院半年度执行报告显示，2026 年 1–6 月联邦预算赤字 5.85 万亿卢布，而 2026 年全年批准赤字为 3.786 万亿；收入 18.5 万亿卢布（油气 3.5 万亿、非油气 15 万亿），支出 24.4 万亿卢布；国家债务上半年增长 6.8% 至 37.5 万亿卢布，付息支出 1.8 万亿卢布；国家福利基金（ФНБ）卢布口径较年初减少 3110 亿至 13.1 万亿卢布，其中流动性资产减少 4733 亿至 3.6 万亿。同期 АКРА 监测显示，仅 5 个地区贡献全俄合并预算税收收入的一半：莫斯科（10.7 万亿、+28%、占比 23.6%）、汉特-曼西（3.95 万亿、-22%）、亚马尔-涅涅茨（2.84 万亿、-14%）、莫斯科州（2.71 万亿、+22%）与圣彼得堡（2.64 万亿、+10%）；莫斯科的增长来自金融业创纪录利润、贸易与 IT 板块，能源型地区因油价下跌与卢布走强明显承压。卖家含义：财政压力上升通常对应税收征管趋严与扶持政策审慎，Q4 至 2027 年的补贴申请应按「更严格合规」预期安排；税务与消费能力的地区分化加剧，渠道与库存配置宜向莫斯科、莫斯科州、圣彼得堡倾斜，资源型地区的促销投入产出比会走弱。", "table": [["上半年赤字", "5.85 万亿卢布"], ["全年批准赤字", "3.786 万亿卢布"], ["收入 / 支出", "18.5 万亿 / 24.4 万亿"], ["国家债务", "37.5 万亿（+6.8%），付息 1.8 万亿"], ["ФНБ", "13.1 万亿（-3110 亿），流动性资产 3.6 万亿"], ["税收集中度（АКРА）", "5 个地区占合并预算税收 50%（莫斯科 23.6%）"]], "num": 33, "tag": "local", "tagText": "本地", "sourceFull": "https://ria.ru/20260923/defitsit-2119624863.html"}, {"title": "流动性紧张升级：央行单日回购投放 7 万亿卢布创纪录、十大行最高存款利率突破 13%、2026 年结构性缺口预测上调至 4–5.2 万亿", "source": "生意人报(Kommersant) / Vedomosti 引 ЦБ РФ", "time": "09-22 ~ 09-23", "url": "https://www.kommersant.ru/doc/8972583", "summary": "9-22 俄央行通过回购向银行体系投放 7 万亿卢布，创此类拍卖历史纪录：一日「微调」回购投放 1 万亿（加权利率 14.28%，需求超过供给 2.6 倍），7 天期回购满足 6 万亿（14.13%，需求达 7.7 万亿）。流动性缺口来自现金外流、国库投放减少与对公信贷增长（8 月 +1.6% 至 105.2 万亿卢布）。同期俄央行数据显示，9 月第二旬十大银行卢布存款最高平均利率突破 13% 年化，为 5 月第二旬以来最高、近两个月上升 0.25 п.п.：Сбер 自 9-17 起将 6 个月与 7 个月以上存款利率上调至 13.5%，«Дом.РФ» 自 9-22 起最高达 13.7%；8 月流动性缺口达 2.45 万亿卢布。央行 9 月已把 2026 年结构性流动性缺口预测从 2.4–3.6 万亿上调至 4–5.2 万亿卢布。卖家含义：资金成本短期难降，平台结算与供应链融资费率的下行空间有限，Q4 备货融资不宜依赖「快速降息」假设（关键利率 14% 于 9-11 维持，下次议息 10-23）。", "table": [["单日回购投放", "7 万亿卢布（历史纪录）"], ["一日回购", "1 万亿 @14.28%"], ["7 天回购", "6 万亿 @14.13%"], ["十大行最高存款利率", ">13%（Сбер 13.5%、Дом.РФ 13.7%）"], ["8 月流动性缺口", "2.45 万亿卢布"], ["2026 缺口预测", "4–5.2 万亿卢布（上调）"]], "num": 34, "tag": "local", "tagText": "本地", "sourceFull": "https://www.kommersant.ru/doc/8972583"}, {"title": "油价周内剧烈震荡：Brent 由 104.42 跌破 100 后触 97.67 美元；Urals 波罗的海贴水收窄至 2025-11 以来最低、价格回到 104.99 美元", "source": "俄新社(RIA) / Lenta.ru / 生意人报(Kommersant) 引 Argus / 国际文传电讯社", "time": "09-21 ~ 09-24", "url": "https://ria.ru/20260922/neft-2119487323.html", "summary": "油价本周大幅震荡：9-21 Brent 报 104.42 美元/桶（+1.19%，MOEX BR-10.26 前一交易日结算 104.35），当日盘中一度跌破 100 美元至 99.56（单日 -3.75%）；9-22 进一步下挫 2.66% 至 97.67 美元，为 9-8 以来首次跌破 98，WTI 同步跌至 89.43（-3.18%），全球油价整体跌幅超 3%，周末区间稳定在 97–100 美元。推跌因素为沙特恢复「东西向」输油管道（可将约 400 万桶/日、约全球 4% 的供应经红海转运至延布）与美伊谈判进展、霍尔木兹通行量升至半年最高。与之相反，Argus 口径 9 月 14–18 日 Urals 对 Dated Brent 的波罗的海贴水收窄至 20.85 美元/桶（2025-11 以来最低）、Urals 价格上涨 9.3 美元至 104.99 美元（4 月以来最高），驱动为中东供应收缩与印度、中国炼厂需求；分析机构判断若中东局势进一步升级，Urals 港口报价可能再涨 25–30 美元。卖家含义：燃油附加费压力略有缓解但波动率显著放大，成本结构仍建议按财政部保守口径（预算油价 50 美元/桶）测算，并在头程报价中约定燃油浮动条款。", "table": [["Brent（09-21）", "$104.42（+1.19%）"], ["Brent（09-22）", "$97.67（-2.66%，9-8 以来首次破 98）"], ["周末区间", "$97–100"], ["Urals（波罗的海）贴水", "$20.85/桶（2025-11 以来最低）"], ["Urals 价格", "$104.99/桶（+$9.3，4 月以来最高）"], ["推跌/推涨因素", "沙特管道重启+美伊谈判 / 中东供应收缩"]], "num": 35, "tag": "local", "tagText": "本地", "sourceFull": "https://ria.ru/20260922/neft-2119487323.html"}, {"title": "美方筹备 90 天柴油出口禁令、俄方抬出柴油出口禁令解除条件；央行把「中东局势长期化」列入输入型通胀风险", "source": "生意人报(Kommersant) / Lenta.ru / 塔斯社(TASS) 引 Песков", "time": "09-24 ~ 09-25", "url": "https://www.kommersant.ru/doc/8973444", "summary": "Politico 引消息称白宫正在筹备为期 90 天的柴油出口禁令（法律层面仍在推进），特朗普或在本周末前宣布，这将是 2015 年奥巴马解除石油出口禁令以来首次能源出口限制，能源部长 Райт、财长 Бессент 与内政部长均持反对意见。9-25 俄总统新闻秘书 Песков 就俄方柴油出口禁令表态：解除需综合解决——既要保障国内市场供应，也要保证黑海航运安全，还须克服制裁等准入限制，使燃料能无障碍进入国际市场。俄央行在关键利率讨论纪要中把「外部条件恶化」新增为通胀风险：美以对伊军事行动导致霍尔木兹海峡通行受限（该通道占全球燃料供应约 20%，日通行船舶由冲突前约 125 艘降至 9 月中旬的数十艘），油价自 63–67 美元/桶区间一度升至 90–100 美元，传导路径为进口成本 + 汇率。卖家含义：若紧张延续，央行维持紧缩的时间可能长于基准情景，进口采购价与融资成本双向承压；柴油与美国出口政策是两个需要在 Q4 逐周跟踪的变量。", "table": [["美方政策", "90 天柴油出口禁令（筹备中，或本周末前宣布）"], ["俄方口径", "Песков：解除禁令需综合解决（内需 + 黑海航运安全 + 制裁解除）"], ["中东传导", "霍尔木兹占全球燃料供应约 20%，日通行船舶 125 艘 → 数十艘"], ["油价区间", "$63–67 → $90–100/桶"], ["ЦБ 风险清单", "新增「外部条件恶化」"]], "num": 36, "tag": "local", "tagText": "本地", "sourceFull": "https://www.kommersant.ru/doc/8973444"}, {"title": "铜价创历史新高（Comex 12 月合约最高 6.903 美元/磅）：灯具线缆、家电金属件与电工材料成本项上行", "source": "俄新社(RIA) / 生意人报(Kommersant)", "time": "09-22 ~ 09-24", "url": "https://ria.ru/20260923/glava-2119632944.html", "summary": "9-22 晚间 Comex 12 月交割铜期货价格最高触及 6.903 美元/磅，创历史新高；俄直接投资基金（РФПИ）总裁、总统对外投资与经济合作特别代表德米特里耶夫公开称「铜是新的黄金」。铜是灯具（电线、驱动电源、散热件）、家电与电工材料的关键成本项，纪录高位将沿产业链传导至到岸成本与零售定价；叠加本周俄财政部拟对采矿冶金企业开征 30% 超额利润税（黄金 20%）的提议，金属类原材料的成本与供应格局面临税负重塑。卖家含义：2026 年 Q4 至 2027 年 Q1 的采购与报价建议按铜价上行情景重算，评估替代规格与轻量化设计，并尽可能在 12 月前锁定框架价与价格保护期；灯具与家电类目的毛利率对铜价弹性最高，应单列成本敏感性分析。", "table": [["Comex 铜（12 月合约）", "最高 $6.903/磅（历史新高）"], ["时点", "9-22 晚间"], ["当事表态", "РФПИ 总裁德米特里耶夫「铜是新的黄金」"], ["相关品类", "灯具 / 家电 / 电工材料"]], "num": 37, "tag": "local", "tagText": "本地", "sourceFull": "https://ria.ru/20260923/glava-2119632944.html"}, {"title": "财政部拟对采矿企业开征 30% 超额利润税（黄金 20%），金属与化肥股应声下跌", "source": "Vedomosti", "time": "09-24", "url": "https://www.vedomosti.ru/investments/news/2026/09/24/1231437-aktsii-metallurgov-upali", "summary": "作为 2027 年预算的「精准加税」之一，俄财政部提议在采矿冶金领域对部分开采企业开征 30% 的「超额利润税」，计税基础为因世界价格（卢布计价）相对 2025 年基准上涨而获得的超额收入，黄金开采企业税率为 20%；消息公布后有色金属、化肥与黄金生产商的股价在 09-24 交易中下跌。卖家含义：① 铜、铝、金及化肥类原料的成本与供应格局将被税负重塑，进而影响灯具线缆与散热件、家电金属件、化肥下游（农产）的价格走势；② 若企业以提价转嫁税负，含金属件的 Q1 采购报价可能被动上移，建议在 2026 年 12 月前锁定框架价；③ 对以化肥、农产品为原料的类目（园艺、宠物、部分家清）需关注下游价格传导节奏。", "table": [["税率", "30% 超额利润税（黄金 20%）"], ["税基", "相对 2025 基准的价格上涨带来的超额收入"], ["市场反应", "金属/化肥/金矿股下跌"], ["用途", "补强各级预算收入（2027 预算加税项之一）"]], "num": 38, "tag": "local", "tagText": "本地", "sourceFull": "https://www.vedomosti.ru/investments/news/2026/09/24/1231437-aktsii-metallurgov-upali"}, {"title": "数字卢布进入「功能扩容期」：账户数约 20 万、拟测试无网离线支付，预算支出与国家合同可转数字卢布结算", "source": "生意人报(Kommersant) / 俄新社(RIA) / Vedomosti 引 ЦБ РФ / Минфин", "time": "09-22 ~ 09-24", "url": "https://www.kommersant.ru/doc/8973400", "summary": "在普京与政府的会议上，俄央行行长 Набиуллина 表示央行将扩充数字卢布的技术能力，近期计划测试不连接网络即可完成的支付（正与受保护 SIM 卡的俄方开发者合作），未来不排除用于跨境结算；自 9 月 1 日起 36 家最大银行的客户可开立数字卢布账户，目前已开立约 20 万个，央行计划到 2029 年测试以数字卢布发放贷款，主要技术约束是「双重花费」。财政部方向则拟允许以数字卢布执行部分预算支出、政府将获得把国家合同结算转为数字卢布的能力，财政部员工已经开始以数字卢布形式领取工资，西卢安诺夫公开强调其可编程、定向、可追溯的优势（作为对照，调查显示民众对数字卢布前景的信心仍有限）。卖家含义：参与政府采购与公立机构订单（含 10-01 起的学校、幼儿园直采渠道）的企业将面临数字卢布收款配置，宜尽早确认银行账户与 ERP 对数字卢布钱包的支持能力，并把「可编程支付」条款纳入合同谈判要点。", "table": [["数字卢布账户", "约 20 万个"], ["可开户银行", "36 家最大银行（09-01 起）"], ["新测试方向", "离线（无网）支付；跨境结算"], ["预算支出", "部分可用数字卢布执行"], ["先行案例", "财政部员工已以数字卢布领薪"], ["贷款测试目标", "2029 年前"]], "num": 39, "tag": "local", "tagText": "本地", "sourceFull": "https://www.kommersant.ru/doc/8973400"}, {"title": "央行敲定加密市场准入规则（10-05 生效）：兑换商最低资本 1,500 万卢布、数字托管人 5,000 万–2.5 亿卢布", "source": "Vedomosti 引 ЦБ РФ", "time": "09-24 ~ 09-25", "url": "https://www.vedomosti.ru/finance/news/2026/09/24/1231638-tsb-utverdil-poryadok", "summary": "俄央行确定了数字托管人、加密兑换商与信息系统运营方（ОИС）进入加密市场的准入办法，配套规范自 2026-10-05 起生效：参与者须提交规定文件，并证明其负责人与关键岗位人员符合要求；存量参与者可走简化程序取得数字托管人或加密兑换商资格。自有资金下限为：加密兑换商 1,500 万卢布；数字托管人视业务类型 5,000 万至 2.5 亿卢布。同时规定了名录维护、数据更新与已登记机构信息公开规则。卖家含义：加密结算通道从「灰色」转向「持牌」，但门槛较高、可用通道数量短期收紧——以加密资产做跨境收付的卖家需重新评估对手方资质与资金安全，合规成本上升；结合数字卢布扩容与 mBridge 遇挫（见结算格局条目），中俄贸易结算的现实主线仍是双边本币结算与数字卢布，而非加密通道。", "table": [["生效", "2026-10-05"], ["加密兑换商资本", "≥1,500 万卢布"], ["数字托管人资本", "5,000 万 – 2.5 亿卢布"], ["存量机构", "简化程序过渡"], ["监管", "名录制 + 高管适格审查"]], "num": 40, "tag": "local", "tagText": "本地", "sourceFull": "https://www.vedomosti.ru/finance/news/2026/09/24/1231638-tsb-utverdil-poryadok"}, {"title": "央行官方汇率：周初沿用 84.1975（09-19 生效）→ 周末 84.9057 卢布/美元，人民币 12.5670 → 12.6500", "source": "俄罗斯央行(ЦБ РФ) / Vedomosti", "time": "09-19 ~ 09-25", "url": "https://www.cbr.ru/scripts/XML_daily.asp", "summary": "周初（09-21）沿用 09-19 生效的央行官方汇率：美元 84.1975、欧元 96.6671、人民币 12.5670 卢布；至周五（09-25 生效口径）美元升至 84.9057、欧元 96.8859、人民币 12.6500，卢布对美元一周走弱约 0.8%、对人民币走弱约 0.66%。周内特征是波动被显著压缩——央行官方美元汇率曾连续八个交易日维持在约 84 卢布水平；9-24 页面快照口径美元 84.39、欧元 96.74、人民币 12.70，IMOEX 2,312.27。在选举周、油价高位与美方新制裁法签署的叠加背景下，跨境结算的汇率窗口未出现新的跳变。卖家含义：汇率横盘降低了进口成本核算的短期波动，但也意味着以美元计价采购的对冲收益有限；Q4 锁汇与对账仍建议沿用当期官方口径，Минэк 对 2026 年美元均价的假设为 79.5 卢布（隐含对卢布走强的预期），锁汇策略宜保留双向情景。", "table": [["美元", "84.1975（周初）→ 84.9057（09-25 生效）"], ["欧元", "96.6671 → 96.8859"], ["人民币", "12.5670 → 12.6500"], ["周内特征", "连续 8 个交易日横盘于约 84 卢布"], ["指数参考", "IMOEX 2,312.27（09-24 快照）"]], "num": 41, "tag": "local", "tagText": "本地", "sourceFull": "https://www.cbr.ru/scripts/XML_daily.asp"}, {"title": "防护成本的社会化与融资化：ФАС 拟把电网「防打击安全支出」计入输配电价、工业用户反对、央行愿为防护贷款提供监管优惠", "source": "生意人报(Kommersant) / Vedomosti 引 ФАС / Россети / ЦБ РФ", "time": "09-22 ~ 09-25", "url": "https://www.kommersant.ru/doc/8972457", "summary": "俄联邦反垄断局（ФАС）公布命令草案，拟将电网企业「保障人员与电力设施免遭打击手段伤害」的支出纳入不受控成本清单、计入输配电价必要毛收入（НВВ），同时把储能系统（СНЭ）维护支出纳入核算，费率按 2022–2025 三年期的实际防护支出分摊；ФАС 强调居民电价不受影响，«Россети» 称此举使安防支出在电价监管中获得经济合理性依据。随后 «能源消费者协会» 公开反对，认为「把防护与修复成本直接全额转嫁到电价，是把电网垄断企业的财务风险二次转嫁给工业」，并指出 «Россети» 2025 年净利约 2,030 亿卢布、2026 上半年约 1,760 亿卢布，主张资金应由企业自有资金、财政支持与税款延期共同承担。9-24 央行行长 Набиуллина 表示许多借款人希望投资于自身基础设施防护并为此申请贷款，央行在监管层面愿意支持。卖家含义：仓储、分拣与供电设施的「反无人机加固」开始具备融资、税务与成本分摊通道，自建仓的卖家可把防护改造纳入融资与折旧测算；租赁与 3PL 合同中的电力/安防分摊条款值得重新谈判，但优惠多以监管指引或个案口径落地，须向银行取得书面确认。", "table": [["纳入项", "电网企业人员与设施的防打击安全支出（另含 СНЭ 维护）"], ["居民电价", "不受影响（ФАС 声明）"], ["争议", "«能源消费者协会»：不应全额转嫁工业"], ["Россети 净利", "2025 约 2,030 亿 / 2026H1 约 1,760 亿卢布"], ["央行表态", "愿对基础设施防护贷款给予监管优惠"]], "num": 42, "tag": "local", "tagText": "本地", "sourceFull": "https://www.kommersant.ru/doc/8972457"}, {"title": "「家庭按揭」新规 10-01 起生效：利率与额度按地区、贷款额与子女数差异化，补贴期封顶 15 年", "source": "生意人报(Kommersant) / RTVI", "time": "09-24", "url": "https://www.kommersant.ru/doc/8974530", "summary": "俄财政部敲定「家庭按揭」（Семейная ипотека）新规：利率与贷款额度按子女数量、家庭所在地区差异化，并设定优惠利率补贴的最长期限 15 年，自 2026-10-01 起的按揭合同适用。该计划占俄全部国家优惠按揭项目的 89%（Frank RG 口径）：现行条件为有子女即可申请、全国统一 6%，首都区（莫斯科、圣彼得堡、莫斯科州、列宁格勒州）贷款上限 1,200 万卢布、其他地区 600 万卢布，2026-02-01 起一户家庭限一笔，计划自 2018 年运行至 2030-12-31，累计发放约 11 万亿卢布。卖家含义：住房与按揭条件直接决定家装、家电与家居类目的需求节奏，是 Q4 与 Q1 大件销售的领先指标；差异化后首都区与多子女家庭仍是高客单耐用品的主要需求端，区域定价、投放与分期方案应据此调整；同期杜马预测 2026 年底市场房贷利率或达 15–16%，2027 年降息路径存在但传导不同步。", "table": [["生效", "2026-10-01（新签合同）"], ["变化", "利率/额度按地区、子女数差异化"], ["补贴期上限", "15 年"], ["贷款上限", "首都区 1,200 万 / 其他地区 600 万卢布"], ["规模", "占国家优惠按揭 89%；累计约 11 万亿卢布"]], "num": 43, "tag": "local", "tagText": "本地", "sourceFull": "https://www.kommersant.ru/doc/8974530"}, {"title": "制裁与结算格局：沙特确认已退出中国主导的 mBridge、8 月中国自俄原油进口 +41%、1–8 月中俄小麦贸易扩大 7 倍", "source": "生意人报(Kommersant) / RBC / 消息报(Izvestia)", "time": "09-20 ~ 09-22", "url": "https://www.kommersant.ru/doc/8971101", "summary": "沙特央行（SAMA）确认已于 2025 年 5 月 13 日退出由中国主导的跨境数字货币结算项目 mBridge（该项目允许各国央行直接完成跨境结算、不依赖美元），目前仍与该项目保持非公开接触——主要参与方之一退出会直接影响其可信度与扩容速度。贸易侧：8 月中国自俄罗斯进口原油同比增长 41%，出现在美国新制裁法（可对购买俄油气的国家加征最高 100% 关税）生效后的首个完整月份，显示主要买方短期尚未实质压缩采购；1–8 月中国自俄小麦进口 1,760 万美元、为去年同期 7 倍，中俄贸易结构继续向「俄方农产品与资源、中方工业品」倾斜。卖家含义：能源出口收入是卢布与财政的关键支撑、人民币结算权重进一步上升，但美国二级制裁的执行风险将在 Q4 逐步显现，涉及美元敞口或美国主体（银行、保险、物流）的卖家应提前做替代安排；农产品与食品类目的双向通道相对成熟，可作为食品、干货与粮油类目的选品与物流参考。", "table": [["退出方", "沙特央行（SAMA），退出确认时间 2025-05-13"], ["项目", "mBridge（中国主导的跨境数字货币结算）"], ["中国自俄原油（8 月）", "+41% 同比（美制裁法生效首月）"], ["中国自俄小麦（1–8 月）", "$1,760 万，为去年同期 7 倍"], ["通道含义", "人民币结算权重上升；非美元基础设施扩容受阻"]], "num": 44, "tag": "local", "tagText": "本地", "sourceFull": "https://www.kommersant.ru/doc/8971101"}, {"title": "【周五补充】«Газпром» 半年报：天然气产量 +3.4% 至 2,165.5 亿立方米、对近邻国供应 +29%、对华「西伯利亚力量」超去年同期", "source": "塔斯社(TASS) / Lenta.ru 引 РИА Новости", "time": "09-25", "url": "https://lenta.ru/news/2026/09/25/gazprom-rezko-uvelichil-postavki-za-rubezh/", "summary": "«Газпром» 半年报显示：2026 年 1–6 月天然气产量同比 +3.4% 至 2,165.5 亿立方米；国内外市场天然气销售量 +4.4% 至 1,932 亿立方米；同期天然气加工量 -3.58% 至 309.9 亿立方米、集团石油产品产量 -5.7% 至 2,470 万吨。出口结构上，对近邻国管道气供应增长 29%（主要来自对哈萨克斯坦出口），经「西伯利亚力量」管道对华供应量上半年超过 2025 年同期；9-25 «Газпром Армения» 宣布在为期 10 天的计划检修后恢复对亚美尼亚供气。作为对照，俄罗斯 1–7 月对欧洲天然气出口同比增长 3.4%。对俄罗斯市场的含义：能源出口量价（叠加本周 Urals 价格回到 104.99 美元/桶）继续为财政与卢布提供支撑；对卖家而言，能源收入端的相对强势意味着 Q4 财政对「精准加税」的依赖度可能下降，但跨境 НДС 与采矿税等已进入预算框架的项目方向不变，进口成本与汇率假设仍应以官方预测（美元均价 79.5）为基准做双向情景。", "table": [["天然气产量（H1）", "+3.4% → 2,165.5 亿立方米"], ["天然气销售（H1）", "+4.4% → 1,932 亿立方米"], ["加工量 / 石油产品", "-3.58% → 309.9 亿立方米 / -5.7% → 2,470 万吨"], ["对近邻国供应", "+29%（主要为哈萨克斯坦）"], ["对华「西伯利亚力量」", "H1 超去年同期"], ["对欧洲出口（1–7 月）", "+3.4%"]], "num": 45, "tag": "local", "tagText": "本地", "sourceFull": "https://lenta.ru/news/2026/09/25/gazprom-rezko-uvelichil-postavki-za-rubezh/"}]}, {"icon": "💄", "name": "美妆", "items": [{"title": "上半年平台美妆营业额 5,040 亿卢布（+42%）：Wildberries 3,710 亿（+37%）、Ozon 1,230 亿（+70%），男性护理一年 ×1.7", "source": "Absatz.media 引 Easy Commerce", "time": "09-25", "url": "https://absatz.media/amp//news/183785-kosmetika-ushla-v-onlajn-prodazhi-na-marketplejsah-rezko-vyrosli", "summary": "研究机构 Easy Commerce 数据：2026 年上半年俄主要平台五类美妆（彩妆、男女护肤、香水、家用美容仪）营业额同比 +42% 至 5,040 亿卢布。分平台 Wildberries 3,710 亿卢布（+37%）居首，Ozon 1,230 亿卢布（+70%）增速更快；增长最快的细分是男性护理——Ozon 男士用品营业额一年增长 1.7 倍。线下专营网络同样在线上扩张：«Золотое Яблоко» 上半年化妆品销售金额 +31%、数量 +38%，«Иль де Ботэ» 线上销售 +15–20%。行业方把这一迁移归因于租金上涨与购物中心客流结构变化。卖家含义：美妆的平台集中度继续提升，Ozon 侧增速显著高于 WB，值得把新品首发与内容资源向 Ozon 倾斜；男性护理、家用美容仪与香水是当前增速最快的三个切口，男性护理的品牌集中度低、试错成本小，是 Q4–Q1 的优先测试方向。", "table": [["平台美妆营业额（H1）", "5,040 亿卢布（+42%）"], ["Wildberries", "3,710 亿卢布（+37%）"], ["Ozon", "1,230 亿卢布（+70%）"], ["男性护理", "Ozon 男士用品 ×1.7"], ["线下专营网", "Золотое Яблоко +31%（金额）/ +38%（数量）；Иль де Ботэ 线上 +15–20%"]], "num": 46, "tag": "local", "tagText": "本地", "sourceFull": "https://absatz.media/amp//news/183785-kosmetika-ushla-v-onlajn-prodazhi-na-marketplejsah-rezko-vyrosli"}, {"title": "«Лэтуаль»：线上约占 30% 营收、香水为线上线下第一大品类，「到店试香 → 线上复购」成为主流路径", "source": "零售网(Retail.ru) 引 «Лэтуаль»", "time": "09-24", "url": "https://www.retail.ru/news/letual-rossiyane-uznayut-informatsiyu-o-tovarakh-v-magazinakh-a-pokupayut-v-pril-24-sentyabrya-2026-282522/", "summary": "«Лэтуаль» 发布渠道结构分析：2026 年约 30% 营收来自线上、约 70% 来自线下门店；两年前线上仅约四分之一，2025 年升至约三分之一，2026 年稳定在 30% 左右。实体门店仍是主渠道，但用户路径已变为「到店试香/试用 → 线上复购」，香水在线上与线下均为第一品类，且「闻香」（在皮肤上感受香调变化、多方案对比）仍高度依赖线下体验。卖家含义：香水与高客单美妆的线上转化依赖线下触点，平台店铺应把香调分层的图文/短视频内容、试用装与小样组合前置到转化链路，并用「小样先行 + 正装复购」的阶梯定价承接门店体验；线下渠道的价值从「售卖」转为「体验 + 拉新」，渠道冲突的管理（价格与赠品一致性）比渠道扩张更重要。", "table": [["线上 / 线下营收", "约 30% / 约 70%"], ["线上占比演变", "25%（两年前）→ 33%（2025）→ 30%（2026）"], ["第一品类", "香水（线上线下均是）"], ["用户路径", "到店体验 → 线上复购"]], "num": 47, "tag": "local", "tagText": "本地", "sourceFull": "https://www.retail.ru/news/letual-rossiyane-uznayut-informatsiyu-o-tovarakh-v-magazinakh-a-pokupayut-v-pril-24-sentyabrya-2026-282522/"}, {"title": "美妆消费从「成套换新」转向「按需单品」：冬季视黄醇 +136%、酸类 +116%，1–8 月护发产品售出 280 万件", "source": "零售网(Retail.ru) 引 «Лэтуаль»", "time": "09-21 ~ 09-23", "url": "https://www.retail.ru/news/letual-rossiyane-ne-menyayut-ukhod-po-sezonu-oni-menyayut-ego-pod-sostoyanie-kozh-21-sentyabrya-2026-282364/", "summary": "«Лэтуаль» 分析 2026 年面部护理销售后指出：「季节性换整套化妆品」的做法正在退场，消费者保留常用基础品、只按皮肤状态替换单品；成分端季节性显著——冬季视黄醇类销量增长约 136%、酸类约 116%，透明质酸与烟酰胺在寒冷季需求最高，防晒（SPF）销售峰值不在夏季而在春季，夏季维 C 需求下降约四分之一，北部地区对保湿产品的需求比南部高约 35%；渠道端线上客单价高于线下（3–4 月差距可达两倍），但 2026 年线下销售占比反而回升约 3%。同期公司将 1–8 月数据披露：消费者在 «Лэтуаль» 购买约 280 万件护发产品，护发品类约占网络总营收 3%。卖家含义：护发与洗护的单品化、功能化（防脱、修护、头皮护理）是相对确定的增量方向，可用小规格与套装组合提升复购，并在 9–10 月换季窗口加大头皮护理与保湿/视黄醇类内容的投放；SPF 的春季峰值提示备货节奏需要前置两个月。", "table": [["冬季视黄醇", "+136%"], ["冬季酸类", "+116%"], ["SPF 峰值", "春季（非夏季）"], ["北方保湿需求", "高于南部约 35%"], ["护发销量（1–8 月）", "280 万件，约占网络营收 3%"], ["线下占比", "2026 年回升约 3%"]], "num": 48, "tag": "local", "tagText": "本地", "sourceFull": "https://www.retail.ru/news/letual-rossiyane-ne-menyayut-ukhod-po-sezonu-oni-menyayut-ego-pod-sostoyanie-kozh-21-sentyabrya-2026-282364/"}, {"title": "政府推动整治「伪环保」宣称：45% 消费者选购带环保标识商品，而 42% 环保标识商品不达标", "source": "俄新社(RIA) 引 政府 / ВЦИОМ / Роскачество", "time": "09-23", "url": "https://ria.ru/20260923/pravitelstvo-2119781959.html", "summary": "俄政府「打击工业品非法流通国家委员会」会议（由第一副总理 Мантуров 主持）指出，需出台措施遏制对商品或服务环保性的虚假或夸大宣传（即「漂绿」），避免企业以低成本博取购买与形象收益。据 ВЦИОМ 2025 年数据，约 45% 俄罗斯消费者会选择带环保标识的商品；而 «Роскачество» 研究显示，42% 带环保标识的商品不符合其宣称特性。卖家含义：含 «эко / био / натуральный» 等宣称的包装与商品卡文案将进入监管视野，叠加 Роспатент 自 2027-03-01 起的商品卡核验机制，美妆与家清类目的「成分透明 + 可验证认证」会从卖点变成合规项；建议在 Q4 上线前复核全部宣称用语与佐证文件，优先保留有第三方认证背书的表述，剔除无法举证的环保用语。", "table": [["选择环保标识商品", "约 45%（ВЦИОМ 2025）"], ["环保标识不达标", "42%（Роскачество）"], ["主持", "第一副总理 Мантуров"], ["关联机制", "Роспатент 商品卡核验（2027-03-01 起）"]], "num": 49, "tag": "local", "tagText": "本地", "sourceFull": "https://ria.ru/20260923/pravitelstvo-2119781959.html"}, {"title": "НАФИ 首个「最受喜爱品牌 Top-50」：消费电子与家电占 20%，美妆个护 Nivea、L'Oréal、Yves Rocher、Mixit 入榜", "source": "生意人报(Kommersant) 引 НАФИ", "time": "09-23", "url": "https://www.kommersant.ru/doc/8291957", "summary": "НАФИ 分析中心发布首个「最受喜爱品牌 Top-50」（5,000 人样本，经 Росстат 结构加权，РБК 与 АКАР 支持）：前十为 Samsung、«Яндекс»、«Сбер»、Ozon、Adidas、Nike、Xiaomi、Apple、Sony、Wildberries——数字与零售平台在榜单中的存在感显著。结构上：快消（食品饮料）18 个品牌占 36%；消费电子与家用电器 10 个品牌占 20%（Samsung、Apple、Sony、LG、Xiaomi、Philips、Bosch 等）；美妆个护入榜的为 Nivea（28 位）、L'Oréal（40）、Чистая линия（43）、Yves Rocher（44）与 Mixit（49）。卖家含义：榜单说明「平台品牌本身」已成为消费者的偏好对象，品牌在平台内的曝光机制（站内搜索排序、评价体系、会员权益）与产品力同等重要；美妆个护中本土品牌（Чистая линия、Mixit）与国际品牌并存，本土品牌的性价比定位在中端价格带具备竞争力，是渠道资源分配与自有品牌定位的参考坐标。", "table": [["样本", "5,000 人（结构加权）"], ["前十", "Samsung / Яндекс / Сбер / Ozon / Adidas / Nike / Xiaomi / Apple / Sony / WB"], ["消费电子与家电", "20%（10 个品牌）"], ["美妆个护入榜", "Nivea 28 / L'Oréal 40 / Чистая линия 43 / Yves Rocher 44 / Mixit 49"], ["快消占比", "36%（18 个品牌）"]], "num": 50, "tag": "local", "tagText": "本地", "sourceFull": "https://www.kommersant.ru/doc/8291957"}, {"title": "美妆行业风险与技术动态：Mixit 联合创始人就居家软禁上诉、Unilever 出售 Zwitsal、ЛЭТИ 研发皮肤多扫描仪", "source": "俄新社(RIA) / 零售网(Retail.ru) 引 Retail Detail", "time": "09-20 ~ 09-23", "url": "https://ria.ru/20260921/pay-2119365545.html", "summary": "① 俄新社 9-21 报道，化妆品品牌 Mixit 联合创始人奥列格·Пай 已就其被采取的居家软禁措施提出上诉——上周末莫斯科特维尔区法院以「特大诈骗」立案并作出居家软禁决定，上诉登记信息已进入司法系统；Mixit 是俄本土美妆头部品牌之一（刚进入 НАФИ 最受喜爱品牌 Top-50），案件走向会影响其供应链合作方与渠道库存的稳定性。② 零售网 9-20 报道，Unilever 已把婴幼儿护理品牌 Zwitsal 出售给荷兰个人护理公司 Royal Sanders，交易预计 2027 年初完成，金额未披露——这是其品牌组合简化战略的延续（此前已剥离多个食品品牌并分拆冰淇淋业务），Zwitsal 在俄认知度有限，更值得关注的是欧洲个人护理品牌持续重组对独联体供应格局的影响。③ 俄新社 9-23 报道，圣彼得堡国立电工大学（ЛЭТИ）研发出可对皮肤进行多因子评估的「多扫描仪」，用于客观评估美容护理效果，目前处研发与产业化早期。卖家含义：与 Mixit 有代销、联名或供货关系的卖家应跟踪案件进展、评估应收敞口并避免在舆情期集中铺货；品牌重组类事件对俄市场供应的影响通常滞后 2–4 个季度，需在合同层面保留替代品牌条款。", "table": [["Mixit", "联合创始人 Олег Пай 居家软禁（9-19 决定）→ 已上诉（9-21）"], ["案由", "特大诈骗"], ["Unilever", "婴幼儿护理品牌 Zwitsal 售予荷兰 Royal Sanders（2027 年初完成）"], ["ЛЭТИ", "「皮肤多扫描仪」可多因子评估护理效果（研发/产业化早期）"]], "num": 51, "tag": "local", "tagText": "本地", "sourceFull": "https://ria.ru/20260921/pay-2119365545.html"}]}, {"icon": "🔌", "name": "电器", "items": [{"title": "«М.Видео» 三重压力显性化：商业总监承认流动资金短缺、SberDevices 索赔 66 亿卢布、上半年净亏扩大至 361 亿", "source": "俄新社(RIA) / 塔斯社(TASS) / 零售网(Retail.ru) / Vedomosti", "time": "09-22 ~ 09-25", "url": "https://ria.ru/20260925/sud-2120138153.html", "summary": "① 现金流：«М.Видео» 商业总监 Сергей Уваров 在与交易对手沟通中承认公司出现流动资金短缺，一名代理模式供应商称欠款已持续三个月、金额达 1700 万卢布且仍在增长，Уваров 回应称问题「在控制之中」、逾期欠款「几乎以手工方式」逐笔处理，期望 1–2 个月内恢复正常；公司 2025 年营收同比 -28% 至 3248 亿卢布、净亏损从 201 亿扩大至 636 亿卢布，并已放弃年度分红。② 诉讼：SberDevices 旗下 ООО «СалютДевайсы» 已向莫斯科仲裁法院起诉，要求从 «М.Видео» 结构公司 ООО «МВМ» 追偿逾 66 亿卢布，公司回应正在推进争议解决、目标达成双方可接受的方案。③ 业绩：总经理 Бакальчук 表示计划 2027–2028 年恢复稳定盈利，上半年净亏同比扩大 43% 至 361 亿卢布、营收 1082 亿卢布（-36.8%）。卖家含义：以代理或供货方式向 «М.Видео» 及其平台铺货的卖家应把账期风险纳入授信模型、核对平台侧在售库存与结算路径，并复查应收与预付敞口；俄最大家电数码零售商的资金面未见改善，其平台化招商条款（佣金、账期、仓储服务）的稳定性需重新评估。", "table": [["代理制欠款", "1,700 万卢布（逾期 3 个月）"], ["SberDevices 诉讼", "索赔逾 66 亿卢布（莫斯科仲裁法院）"], ["2025 营收 / 净亏", "3,248 亿（-28%）/ 636 亿卢布"], ["2026H1 净亏 / 营收", "361 亿（+43%）/ 1,082 亿（-36.8%）"], ["转型方向", "多品类开放平台，目标 2027–2028 恢复稳定盈利"]], "num": 52, "tag": "local", "tagText": "本地", "sourceFull": "https://ria.ru/20260925/sud-2120138153.html"}, {"title": "«М.Видео» 自救路径：增发配售价 49.9 卢布/股募资 300 亿，自有 ПВЗ 加盟覆盖扩至 13 个地区并接入 «Магнит» 约 5,000 个自提点", "source": "Vedomosti / Эксперт / 零售网(Retail.ru)", "time": "09-21 ~ 09-23", "url": "https://ria.ru/20260923/pribylnost-2119629455.html", "summary": "在资金压力下，«М.Видео» 同步推进三条自救路径：① 增发（допэмиссия）股票配售价格确定为每股 49.9 卢布，方案为 6 月股东大会批准的向现有股东定向增发、合计不超过 5 亿股（面值 10 卢布），目标是完成 300 亿卢布的资本补充，资金用于把公司转型为「多品类市场平台 + 线下门店 + 自提点/快递柜网络」；② 自有品牌 ПВЗ 加盟在莫斯科、莫斯科州与圣彼得堡恢复注册（此前因申请量过大暂停），数日内收到 700 多份申请，并宣布第二波拓展进入萨马拉、罗斯托夫、新西伯利亚、斯维尔德洛夫斯克、鄂木斯克、克麦罗沃、托木斯克州与鞑靼斯坦、巴什科尔托斯坦、克拉斯诺达尔等 10 个地区，自有 ПВЗ 地理覆盖将达 13 个地区；新规要求入口装修达最低标准并完成员工培训；③ 自研几乎所有关键组件（前台、物流、个人中心、仓库与 ПВЗ 工具、运输、商品搜索与移动端），并借鉴中国方案建设「开放平台」，与 «Холодильник.ру» 等伙伴共同开发开放协议，让商家一次接入即可在多平台销售。卖家含义：家电与 3C 品类在⻄伯利亚与南部的新增取件网络正在扩容，是平台之外的一个增量渠道，值得关注其开放招商的类目佣金与仓储服务条款；但结合其资金面，任何铺货安排都应控制敞口与账期。", "table": [["配售价", "49.9 卢布/股（不超 5 亿股，面值 10 卢布）"], ["募资目标", "300 亿卢布"], ["ПВЗ 覆盖", "13 个地区（新增 10 个区域）"], ["首几日申请", "700+"], ["接入 Магнит 自提网", "首批约 5,000 个自提点、24 个地区"], ["开放平台", "与 «Холодильник.ру» 等共建开放协议"]], "num": 53, "tag": "local", "tagText": "本地", "sourceFull": "https://ria.ru/20260923/pribylnost-2119629455.html"}, {"title": "Минпромторг 公布「技术费」清单与金额：2026-12-01 开征、单件不超 5,000 卢布；手机与笔记本可享 33% 折扣（挂钩 ГИС 标记）", "source": "零售网(Retail.ru) / 生意人报(Kommersant) 引 Минпромторг", "time": "09-23 ~ 09-25", "url": "https://www.retail.ru/news/minpromtorg-opredelil-razmery-tekhnologicheskogo-sbora-dlya-elektroniki-24-sentyabrya-2026-282553/", "summary": "俄工贸部拟定政府决议草案，列出须缴「技术费（технологический сбор）」的电子元件基础与含此类元件的工业品清单及金额：该费用自 2026 年 12 月 1 日起征收，由进口或在俄生产相关产品的组织与个体经营者向联邦预算缴纳，具体金额由政府在固定卢布价格区间内确定、单件不超过 5,000 卢布。优惠机制方面，据三位知情人士，已纳入强制标记体系的智能手机与笔记本，其费率或比基准费率低 33%——以「商标与产品型号」系数乘以基准费率计算，系数取决于产品是否已在俄国家商品流通监测信息系统（ГИС）登记，未登记产品的技术费将高出 33%；自 2026-05-01 起俄对无线电子产品（智能手机、笔记本，以及插座、印刷电路板、继电器）实施强制标记，技术费六年期潜在财政收入估计 1,360 亿卢布。卖家含义：电子类目（含小家电、灯具驱动与智能模块）在 12-01 后将新增一笔按件计的固定成本，需在 11 月内完成产品归类自检（是否含电子元件基础/是否在清单内），并把该项成本纳入 Q1 到岸价与售价模型；完成 ГИС 登记可显著降低单件成本，本地组装/本地化生产亦为对冲路径。", "table": [["开征时间", "2026-12-01"], ["计征方式", "固定卢布金额/件，单件上限 5,000 卢布"], ["缴纳主体", "进口方或在俄生产者"], ["33% 折扣", "已纳入 ГИС 强制标记体系的产品"], ["未登记惩罚", "基准费率 +33%"], ["六年潜在收入", "1,360 亿卢布"]], "num": 54, "tag": "local", "tagText": "本地", "sourceFull": "https://www.retail.ru/news/minpromtorg-opredelil-razmery-tekhnologicheskogo-sbora-dlya-elektroniki-24-sentyabrya-2026-282553/"}, {"title": "утильсбор 2027-01-01 起按机型上调 10–20%，同时立法确立「上调不得有追溯力、公布后满 30 日生效」规则", "source": "生意人报(Kommersant) / 零售网(Retail.ru) 引 Минпромторг", "time": "09-23 ~ 09-24", "url": "https://www.kommersant.ru/doc/8973184", "summary": "俄工贸部向 Autonews.ru 确认，2027 年 1 月 1 日起 утилизационный сбор（回收处理费）费率将按政府 2024 年批准的刻度按机型上调 10–20%；现行基准费率为乘用车 2 万卢布、其他车辆 15 万卢布，系数取决于车型、发动机功率与车龄，个人自用进口 3 年以内、排量 3 升以下车辆仍适用优惠费率 3,400 卢布；2026 年前 8 个月俄产车辆在国内市场占比已达 63.6%。同期 Минпромторг 就《生产与消费废弃物法》第 24.1 条拟定修正案并公示：若新规上调费率、增设义务或恶化纳税义务人处境，须在官方公布后满 30 日方可生效且无追溯力；若下调费率或改善处境，可自公布之日起生效并具追溯力，上述规则拟自 2027-01-01 起施行。卖家含义：这是费率上调前的程序性保护（给出 30 天缓冲与「不溯及既往」兜底），与 10–20% 的上调并不冲突——2027 年的清关与备货日历应把该 30 天窗口作为最后的成本锁定机会；家电类目不直接适用该费，但汽车与汽配类卖家的到岸成本测算必须同步更新。", "table": [["生效", "2027-01-01"], ["上调幅度", "10–20%（按机型）"], ["基准费率", "乘用车 2 万 / 其他 15 万卢布"], ["个人自用优惠", "3,400 卢布"], ["上调类规则", "公布后满 30 日生效、不溯及"], ["下调类规则", "可即日生效、可追溯"]], "num": 55, "tag": "local", "tagText": "本地", "sourceFull": "https://www.kommersant.ru/doc/8973184"}, {"title": "欧洲议会支持把 CBAM 扩围至汽车零部件与家用电器，铝受管门槛由 50 吨降至 5 吨、废铝纳入核算", "source": "生意人报(Kommersant)", "time": "09-22 ~ 09-24", "url": "https://www.kommersant.ru/doc/8972573", "summary": "欧洲议会通过立场文件，支持把跨境碳调节机制（CBAM）扩展至新的进口品类——包括部分汽车零部件与家用电器——并建议取消「进口商品价格急涨时可暂停征收碳费」的弹性条款，转而把 CBAM 收入用于支持受影响行业；对铝制品则拟把受管最小批量由 50 吨降至 5 吨，并把废铝计入核算。CBAM 自 2026-01-01 进入正式阶段，进口商已需为钢铁、铝、水泥、化肥等的隐含碳排放付费；欧委会此前披露的扩围路径（含洗衣机、冰箱等大型家电，以及发动机、电缆、电梯、工业机器人等）指向 2028 年，最终规则仍需与欧洲理事会及成员国协商。卖家含义：① 对欧出口或经欧盟中转的家电与汽配类目，2028 年前需完成碳排放数据链与合规申报能力的准备；② 铝门槛从 50 吨降至 5 吨会显著扩大受管企业范围（中小卖家尤其受影响），废铝纳入核算将抬高再生铝采购的合规成本；③ 对以欧盟为终端市场的中资供应链而言，碳成本将成为新的报价组成部分，建议提前建立供应商碳数据台账。", "table": [["新增品类（议会建议）", "部分汽车零部件、家用电器"], ["铝受管门槛", "50 吨 → 5 吨"], ["新增核算", "废铝纳入"], ["CBAM 正式阶段", "2026-01-01 起"], ["欧委会扩围路径", "指向 2028 年（含洗衣机/冰箱等）"]], "num": 56, "tag": "local", "tagText": "本地", "sourceFull": "https://www.kommersant.ru/doc/8972573"}, {"title": "手机市场分化：新 iPhone 在俄首销逊于上一代（Авито 二手成交 -13%），HUAWEI nova 16s Pro 开启预售", "source": "零售网(Retail.ru) 引 消息报(Izvestia) / gazeta.ru", "time": "09-24 ~ 09-25", "url": "https://www.retail.ru/news/novyy-iphone-v-rossii-prodaetsya-khuzhe-proshlogodnego-23-sentyabrya-2026-282454/", "summary": "据《消息报》，iPhone 18 Pro / Pro Max 在俄首销未达预期，需求与上一代持平甚至更低：re:Store 称付费预购热度与上代持平、9-23 起开放现货销售；最受欢迎配色为酒红（бургунди），预购机型中 512GB 占 37.4%、256GB 占 33.3%、1TB 与 2TB 分别 17.9% 与 11.4%；RWB 确认首销需求与去年持平，并预计需求增量将来自 10-23 发售的首款折叠机 Apple Duo（晚 5 周，当前占比 <1%）；二手平台 «Авито» 同期成交同比 -13%，均价 12–16 万卢布、客单约 12.7 万卢布。与之相对，安卓阵营迭代未受渠道收缩影响：HUAWEI nova 16s Pro 已在俄开启预售，主打 2 亿像素（200 МП）摄像头。卖家含义：苹果生态在俄的可用性波动（叠加本周 App Store 访问中断、iPhone 18 AI 功能缺俄语支持）抑制了新机连带需求，而中高端安卓机型的配件（壳、膜、充电套装、耳机）通常在新机发布后 2–6 周进入放量期，是配件卖家 Q4 的确定性窗口；nova 系列新机预售价位也可用于判断 10 月消费电子价格带。", "table": [["iPhone 18 Pro 首销", "持平或低于上一代"], ["预购结构", "512GB 37.4% / 256GB 33.3%"], ["Авито 二手成交", "同比 -13%（均价 12–16 万卢布）"], ["折叠机 Apple Duo", "10-23 发售（占比 <1%）"], ["HUAWEI nova 16s Pro", "已开启预售，主打 200 МП 摄像头"]], "num": 57, "tag": "local", "tagText": "本地", "sourceFull": "https://www.retail.ru/news/novyy-iphone-v-rossii-prodaetsya-khuzhe-proshlogodnego-23-sentyabrya-2026-282454/"}, {"title": "智能家居的政策与网络底座双升级：Росстандарт 新增 60 余类设备 ОКПД 2 编码，全运营商移动通信将覆盖小城镇与村庄", "source": "塔斯社(TASS) 引 «Известия» / 消息报(Izvestia)", "time": "09-21 ~ 09-22", "url": "https://tass.ru/ekonomika/28132981", "summary": "塔斯社引《消息报》报道，俄标准局（Росстандарт）已在全俄产品经济活动分类目录（ОКПД 2）中为 60 余类智能家居设备新增代码，用于对其生产与进口实施管控，涉及范围包括智能家居软件、控制器与无线接入点、压力/燃气/漏水传感器、自闭阀门、百叶窗与窗帘等。同期《消息报》报道，俄罗斯将实现所有移动运营商在小型城镇与乡村的通信覆盖。两项政策形成「合规门槛 + 网络底座」的组合：新增分类通常是技术法规、认证与统计口径调整的前置动作，智能家居与家电智能化品类的认证路径与进口申报编码后续可能同步变化；而网络覆盖是联网设备（智能插座、摄像头、扫地机器人、智能照明）在下沉市场渗透的前置条件。卖家含义：建议在 Q4 新批次报关前核对 ОКПД 2 编码与合格证明要求，提前准备联网类目商品的合规与说明书本地化材料，并把县级市与乡镇列为 Q1 的增量测试市场（结合 5G 覆盖要到 2030–31 年才有 80% 人口覆盖的节奏，联网卖点在中短期仍受网络条件约束，产品说明应强调本地化控制方案）。", "table": [["管制品类", "60 余类智能家居设备"], ["典型对象", "软件、控制器、无线接入点、压力/燃气/漏水传感器、自闭阀、百叶窗与窗帘"], ["目的", "生产与进口管控"], ["网络政策", "全运营商覆盖小城镇与乡村"], ["受益品类", "智能家居 / 联网设备"]], "num": 58, "tag": "local", "tagText": "本地", "sourceFull": "https://tass.ru/ekonomika/28132981"}, {"title": "3C 生态波动：App Store 在俄出现访问与下载中断，苹果新机 AI 功能缺俄语支持", "source": "生意人报(Kommersant)", "time": "09-20 ~ 09-21", "url": "https://www.kommersant.ru/doc/8970807", "summary": "生意人报 9-20 报道，俄罗斯用户报告 App Store 出现访问与下载中断，具体原因未获官方说明；此事与近期 iPhone 18 系列的 AI 功能对俄用户不可用（缺俄语支持）形成叠加。对 3C 卖家的含义：① 苹果生态在俄的可用性波动会直接影响新机激活与相关配件（充电、保护壳、智能家居配件）的连带需求，本周的首销数据（iPhone 18 Pro 需求持平或低于上代、Авито 成交 -13%）与之互为印证；② 生态可用性下降会强化安卓生态与本土应用商店的份额优势，中低端安卓机型的配件需求与国产品牌的连带销售是更稳的增量；③ 建议在选品与售后话术上留出替代方案（如兼容安卓的智能家居方案、本地应用商店安装指导），把「生态不确定性」转化为服务差异化而不是单纯的销售风险。", "table": [["现象", "App Store 访问/下载中断"], ["原因", "未获官方说明"], ["叠加因素", "iPhone 18 系列 AI 功能对俄不可用（缺俄语支持）"], ["影响", "苹果生态可用性波动 → 配件连带需求"]], "num": 59, "tag": "local", "tagText": "本地", "sourceFull": "https://www.kommersant.ru/doc/8970807"}]}, {"icon": "💡", "name": "灯具", "items": [{"title": "装修成本上行预警：人工费三年翻倍以上，50㎡ 全面翻新现价 550 万卢布，2027 若再涨 20% 则多付 110 万", "source": "消息报(Izvestia)", "time": "09-23", "url": "https://iz.ru/2169444/2026-09-23/ekspert-rasskazala-o-riskakh-podorozhaniia-remonta-v-2027-godu", "summary": "《Известия》9-23 报道的专家评估显示，装修人工费从 2024 年的 8–12 千卢布/㎡ 升至 2026 年的 35–50 千卢布/㎡，同期材料价格涨约 23%——装修涨价的主导因素已从材料变为「稀缺的合格人工」。以 50㎡ 公寓为例，当前全面翻新（含工程、拆除、材料、门与地板）单价 110 千卢布/㎡、总额 550 万卢布；若明年涨价 5%/10%/15%/20%，则分别多支出 27.5 万/55 万/82.5 万/110 万卢布。对灯具与家居卖家的含义：装修「延后决策」会把需求推到更晚且更贵，宜在 9–11 月装修旺季用「含安装/含设计」的打包方案承接需求；鉴于人工成为主成本项，照明方案的价值主张应从「单灯价格」转向「安装与设计的一次性交付」，把安装服务能力作为差异化壁垒，同时用小规格、易安装产品（轨道灯、磁吸灯、无主灯方案）降低人工依赖度。", "table": [["装修人工费", "2024 年 8–12 千卢布/㎡ → 2026 年 35–50 千卢布/㎡"], ["材料涨幅", "同期约 +23%"], ["50㎡ 全面翻新", "110 千卢布/㎡ = 550 万卢布"], ["涨价 20% 情景", "总价 660 万卢布（+110 万）"]], "num": 60, "tag": "local", "tagText": "本地", "sourceFull": "https://iz.ru/2169444/2026-09-23/ekspert-rasskazala-o-riskakh-podorozhaniia-remonta-v-2027-godu"}, {"title": "«Лента» 调研：44% 俄罗斯人秋季考虑更新家居内饰、63% 使用色彩点缀，「局部焕新」优先于整屋换代", "source": "零售网(Retail.ru)", "time": "09-21", "url": "https://www.retail.ru/news/lenta-44-rossiyan-zadumyvayutsya-ob-obnovlenii-interera-osenyu-21-sentyabrya-2026-282384/", "summary": "«Группа Лента» 调研显示：44% 的俄罗斯人在秋季会考虑更新家居内饰；63% 的受访者在居室布置中使用色彩点缀（цветовые акценты），与销售数据吻合——饱和色调与亮色印花类的餐具、装饰品与纺织品的兴趣在上升。更新方式上，12% 每个季节都会小幅更换家居装饰，17% 会关注新的秋季系列，另有 15% 在旧物需要替换时才会购置新品。对灯具与家居卖家的含义：秋季是「局部焕新」型需求窗口，装饰性、氛围型照明（落地灯、桌灯、灯带、彩色灯泡）与家居配件优先于整套换代，可围绕「色彩点缀 + 场景方案」做组合套餐（例如「一角氛围改造」套装）；同时 44% 是意愿口径而非预算口径，客单价应按「单件替换」而非「整屋重装」设计，并用低价入门款承接意愿、以组合套餐拉高连带率。", "table": [["秋季考虑更新内饰", "44%"], ["使用色彩点缀", "63%"], ["每季小改装饰", "12%"], ["关注秋季新系列", "17%"], ["按需替换", "15%"]], "num": 61, "tag": "local", "tagText": "本地", "sourceFull": "https://www.retail.ru/news/lenta-44-rossiyan-zadumyvayutsya-ob-obnovlenii-interera-osenyu-21-sentyabrya-2026-282384/"}, {"title": "照明工程与替换需求：冬宫启动建筑照明改造一期（2027 年完工），斯维尔德洛夫斯克铁路夏季安装 2,300 盏 LED", "source": "生意人报(Kommersant) / 国际文传电讯社(Interfax) / КП-Урал 引 СвЖД", "time": "09-22 ~ 09-24", "url": "https://www.kommersant.ru/doc/8973584", "summary": "① 国立艾尔米塔什博物馆通报，圣彼得堡已启动冬宫建筑艺术照明更新一期：全面更换主楼立面照明设备，包括灯具、电缆线路与照明配电盘；施工期间冬宫晚间照明可能部分或全部停用；主门拱将安装新照明，Комендантский、Октябрьский、Салтыковский、Иорданский 四个入口将新增灯具（фонари）。一期不涉及大庭院（Большой двор）照明，计划 2027 年完工；现有照明主体形成于 2003 年，临涅瓦河北立面照明为 1994 年所建。② 斯维尔德洛夫斯克铁路（СвЖД）公布节能计划进展：2026 年 6–8 月在 11 个车站安装 2,300 盏现代 LED 灯具，替换原有卤素灯、荧光灯与白炽灯（站点含伊谢季、舒拉拉、涅维扬斯克、卡奇卡纳尔、谢罗夫-扎沃茨科伊、伊夫杰利-1 等），全年计划在 17 个设施更换近 3,000 套室外照明设备，17 站改造完成后年节电 290 万千瓦时（2025 年基数为 5,000+ 盏 / 15 站）。卖家含义：存量设施改造（工业与公共建筑替换 LED）与高端景观照明工程仍在稳定推进，是面向 B 端（工程商、铁路、市政）的确定需求；与 C 端「局部焕新」不同，B 端订单对能效参数、认证与批量交付能力要求更高，值得作为 Q4–Q1 的项目型业务储备方向。", "table": [["冬宫一期", "立面灯具 + 电缆 + 照明配电盘，2027 年完工"], ["新增", "主门拱照明、4 个入口新 фонари"], ["旧系统", "2003 年（主体）/ 1994 年（北立面）"], ["СвЖД LED", "2,300 盏 / 11 站（2026 夏季）"], ["全年计划", "近 3,000 套 / 17 个设施，年节电 290 万千瓦时"]], "num": 62, "tag": "local", "tagText": "本地", "sourceFull": "https://www.kommersant.ru/doc/8973584"}, {"title": "需求前瞻：2026 年底市场房贷利率或达 15–16%，央行基准情景预计 2027 年平均关键利率降至 10.5–12.5%", "source": "Lenta.ru 引 «Газета.Ru»", "time": "09-23", "url": "https://lenta.ru/news/2026/09/23/v-gosdume-raskryli-srok-snizheniya-stavok-po-ipoteke/", "summary": "俄国家杜马建设与住房公用事业委员会副主席 Аксененко 对《Газета.Ru》预测：到 2026 年底市场房贷利率可能达到 15–16%，因此无法简单建议家庭「现在买」还是「再等一年」——期间房贷条件、房价、租金、家庭收入与储蓄收益都会变化。但他承认存在继续降息的前提：俄央行基准情景预计 2027 年平均关键利率为 10.5–12.5%（2026 年为 14.5–14.6%），这将逐步降低市场房贷成本，但关键利率与房贷利率并不同步、也不同比例变动。对灯具与家居卖家的含义：房屋成交是照明与家居需求的领先指标——2026 年内高利率仍压制成交与装修启动，需求以「替换与局部焕新」为主；若 2027 年降息兑现，装修与照明需求有望出现一轮补偿性回升，2027 上半年应提前准备产能与安装服务资源。结合 10-01 起的「家庭按揭」差异化新规（首都区上限 1,200 万卢布、补贴期封顶 15 年），首都区与多子女家庭仍是高客单照明方案的主要需求端。", "table": [["2026 年底市场房贷利率", "或达 15–16%"], ["2027 平均关键利率", "10.5–12.5%（央行基准情景）"], ["2026 平均关键利率", "14.5–14.6%"], ["利率传导", "不同步、不同比例"], ["领先指标", "房屋成交 → 装修/照明需求"]], "num": 63, "tag": "local", "tagText": "本地", "sourceFull": "https://lenta.ru/news/2026/09/23/v-gosdume-raskryli-srok-snizheniya-stavok-po-ipoteke/"}]}, {"icon": "🚗", "name": "汽车（扩展）", "items": [{"title": "中国供应链在俄汽车市场继续固化：1–8 月整车出口 68.8 万辆、二手车进口 7.5 万辆（+98%），自韩二手车 -63%", "source": "Lenta.ru / 商业日报(Vedomosti) / 消息报(Izvestia)", "time": "09-20 ~ 09-21", "url": "https://lenta.ru/news/2026/09/20/kitay-zavalil-rossiyu-avtomobilyami/", "summary": "Lenta 引塔斯社与中国海关总署数据：2026 年前 8 个月中国对俄汽车出口总量超过 68.8 万辆；同期《Vedomosti》报道，1–8 月自中国进口至俄罗斯的二手乘用车约 75,000 辆、较 2025 年同期的约 3.8 万辆增长 98%（接近翻倍），而自韩国的二手乘用车进口同比骤降 63%。结构上，中国整车（含新能源与混动）继续填补欧美日品牌退出后的供给缺口，进口渠道与口岸物流成为俄汽车市场的关键变量；二手车进口激增与新车利率高企、居民消费降级相叠加，推动市场向「性价比 + 中国渠道」集中。对照口径：8 月俄二手乘用车销量同比下滑 8.4%，8 月中国自俄原油进口 +41%（同期能源与商品流向同步东移）。卖家含义：车用配件、养护与改装类目将随存量车龄结构年轻化与中国车型保有量上升而受益，配件需求结构从欧系转向中国车型专用件；2027-01-01 起 утильсбор 按机型上调 10–20%（见电器条目）会进一步影响整车与二手车到岸成本，配件类目的相对性价比窗口反而扩大。", "table": [["期间", "2026 年 1–8 月"], ["中国对俄整车出口", "68.8 万辆以上"], ["中国二手车进口", "约 75,000 辆（+98%）"], ["自韩二手乘用车", "同比 -63%"], ["对照", "8 月俄二手乘用车销量 -8.4%"]], "num": 64, "tag": "local", "tagText": "本地", "sourceFull": "https://lenta.ru/news/2026/09/20/kitay-zavalil-rossiyu-avtomobilyami/"}, {"title": "«Авто.ру»：3–7 年车龄二手车中中国品牌份额一年翻三倍至 20%，挂牌量同比 ×2.5", "source": "零售网(Retail.ru) 引 «Авто.ру»", "time": "09-24", "url": "https://www.retail.ru/news/spros-na-poderzhannye-kitayskie-avtomobili-ne-starshe-7-let-vyros-v-dva-raza-za--24-sentyabrya-2026-282547/", "summary": "据 «Авто.ру» 对 2026 年前 8 个月挂牌与呼叫数据的分析：车龄 3–7 年的二手车细分中，中国品牌占比一年内翻三倍、挂牌量同比增加 2.5 倍，至 9 月初中国品牌已占该细分总量的 20%。价格结构上，69% 的中国车挂牌价位于 150 万–300 万卢布区间（同车龄其他进口车该比例为 41%），即中国车集中在「中低价位带」；中国品牌的混动与纯电占比 5.3%（同比 +1 п.п.），高于其他进口车的 3.5%（同比零增长）。卖家含义：中国车在俄二手市场的保值与流通性大幅改善，对应汽车配件、改装件、车载电器与养护用品的需求将随保有量增长而持续释放，且新能源占比上升会带来三电周边（充电配件、车载电子）的新需求；选品时应按「中国车型专用件 + 中低价位带」定位，避免继续押注欧系平行进口配件。", "table": [["中国品牌份额（3–7 年车龄）", "20%（一年翻三倍）"], ["挂牌量", "同比 ×2.5"], ["价格带", "150–300 万卢布占 69%（其他进口车 41%）"], ["混动/纯电占比", "5.3%（+1 п.п.）"]], "num": 65, "tag": "local", "tagText": "本地", "sourceFull": "https://www.retail.ru/news/spros-na-poderzhannye-kitayskie-avtomobili-ne-starshe-7-let-vyros-v-dva-raza-za--24-sentyabrya-2026-282547/"}]}], "keyData": {"headers": ["指标", "周初（09-21/22）", "周末（09-24/25）", "趋势"], "rows": [["央行美元汇率", "84.1975（09-19 生效口径）", "84.9057（09-25 生效口径）", "卢布小幅走弱约 0.8%"], ["央行人民币汇率", "12.5670", "12.6500", "走弱约 0.66%"], ["Brent 原油", "$104.42（09-21）", "$97–100 区间", "周中跌破 98（9-8 以来首次），波动放大"], ["Urals（波罗的海）", "贴水收窄中", "贴水 $20.85 / 价格 $104.99", "2025-11 以来最低贴水，出口议价能力上升"], ["年度通胀", "6.24%（前值）", "6.22%（09-21 口径）", "小幅放缓；周度仅 +0.06%"], ["汽油（年初至今）", "—", "+21.1%", "燃油端通胀仍是主推力"], ["关键利率", "14%（9-11 维持）", "14%（下次议息 10-23）", "不变；Минэк 上调通胀至 6.8%"], ["十大行最高存款利率", "约 12.75%", ">13%（Сбер 13.5% / Дом.РФ 13.7%）", "上行，银行争夺新资金"], ["回购单日投放", "—", "7 万亿卢布（09-22 历史纪录）", "流动性缺口扩大，2026 预测上调至 4–5.2 万亿"], ["8 月工业产出（同比）", "—", "-0.6%（1–8 月累计 0%）", "再度转弱；家具 -1.6%、服装 -2.8%"], ["消费者信心（季度）", "-13%（Q2）", "-16%（Q3）", "继续下滑"], ["2026 GDP 预测（Минэк）", "—", "+0.6%（上调 0.2 п.п.）", "微上调；ОЭСР 维持 0.5%"], ["2026 通胀预测（Минэк）", "5.2%", "6.8%", "大幅上调（燃油链条传导）"], ["2027 预算赤字", "—", "2.2% GDP（2026 预期 3%）", "财政收紧 + 五项精准加税"], ["上半年预算赤字（审计院）", "—", "5.85 万亿卢布（全年批准额的 1.5 倍）", "执行压力大，债务 37.5 万亿"], ["单夜击落无人机（峰值）", "244 架（09-21 夜）", "514 架（09-23 夜）→ 40 架（09-24 夜）", "峰值抬升后回落，重心移向伏尔加/乌拉尔"], ["平台仓库遇袭城市口径", "WB/Russ 22 城、Ozon 12 城", "不变（连续第 10 日无新增）", "事件风险转向「成本与时效」"], ["铜价（Comex）", "—", "$6.903/磅（历史新高）", "上行；灯具/家电金属件成本承压"], ["平台美妆营业额（H1）", "—", "5,040 亿卢布（+42%）", "Ozon +70% 快于 WB +37%"], ["电商流量成本（CPA）", "—", "+17.4%（H1 全行业）", "转化率下滑，获客边际成本抬升"], ["М.Видео 上半年净亏", "—", "361 亿卢布（同比 +43%）", "现金流与偿付能力压力显性化"], ["电子「技术费」", "—", "≤5,000 卢布/件，2026-12-01 开征", "电子类目新增按件固定成本"]]}, "trends": [{"title": "电商物流与平台政策：风险从「仓库被炸」转为「成本与时效」", "text": "本周平台仓库遇袭零新增（连续第 10 日），Wildberries/Russ 22 城、Ozon 12 城口径不变，但打击纵深已推进到乌拉尔（9-25 斯维尔德洛夫斯克州进入「无人机危险状态」，州内叶卡捷琳堡为 WB 大型履约中心所在地），伏尔加-乌拉尔枢纽机场一周内多次连环停摆，克拉斯诺达尔边疆区自 9-23 起全境进入紧急状态。行业侧 Versta.io 明确判断物流市场进入「重构期」：批次拆散到多点小库位、到门时效最坏拉长 2.5 倍、货物险费率上行，与莫斯科州轻型工业仓储二季度放量 +42%、全年潜在 +77% 互为印证。结论：Q4 的物流策略应从「选一个大仓 + 一个备仓」转向「多点多批次 + 库存分散度指标」，仓租谈判窗口正好落在 Q4；同时把「枢纽中断 24–48 小时」写进时效承诺与赔付条款。"}, {"title": "平台监管与合规：10-01 与 2027-03-01 是两个硬节点", "text": "本周监管密集落地并向 2027 年延伸：① 跨境网购 НДС 22%（平台代扣）与个人包裹 100 卢布/件海关费已写入税法修正案、列入 2027 年预算「五项精准加税」，10-01 前送交新杜马；② 7 日无理由退货拟从「权利」变为需卖家审核的「请求」，电子产品与化妆品类目是否保留退货权待政府清单，退货修正案拟 2027-03-01 生效；③ 已通过的 № 289-ФЗ《平台经济法》2026-10-01 生效，先行改变平台、卖家与 ПВЗ 的规则框架；④ 商品卡核验（Роспатент，2027-03-01）与本周 Роскачество 通报（羊毛拖鞋商品卡 80% 违规、WB 违规率 99%）、烟花类须持证且禁平台内直销，共同构成「文案与资质合规」的收紧。行动要点：10-01 前完成 ПВЗ/退货流程与合同条款复核，11-30 前完成标记类库存清理（灯具 12-01 起禁售未标记品），并在 Q4 上线前对全部材质/环保/功效宣称做可举证性检查。"}, {"title": "经济数据与利率：财政收紧 + 流动性紧张，降息窗口在 2027", "text": "本周财政与货币信号同向偏紧：审计院显示上半年联邦预算赤字 5.85 万亿卢布（为全年批准额度的 1.5 倍）、国家债务 37.5 万亿；9-22 央行单日回购投放 7 万亿卢布创历史纪录、十大行最高存款利率突破 13%、2026 年结构性流动性缺口预测上调至 4–5.2 万亿；政策端则批准 2027–2029 预算（赤字 2.2% GDP、五年支出优化 2 万亿 + 五项精准加税）并把 2026 年通胀预期从 5.2% 上调至 6.8%。8 月工业产出环比 -0.3%、同比 -0.6%（1–8 月零增长），三季度消费者信心降至 -16%，增长动能由投资（2026 -5.4%）转向居民消费（+4.1%），缺口靠储蓄率下降填补。结论：Q4 资金成本难降（关键利率 14%，下次议息 10-23），备货融资不宜依赖降息假设；2027 年降息路径存在（央行基准情景 10.5–12.5%）但传导不同步，贴现与定价模型应保留双情景。"}, {"title": "能源价格与运输成本：油价波动率放大，Urals 出口议价改善", "text": "Brent 本周从 104.42 美元跌至 97.67（9-8 以来首次跌破 98）后回到 97–100 区间，推跌因素为沙特「东西向」管道重启（约 400 万桶/日、约全球 4% 供应经红海转运）与美伊谈判进展、霍尔木兹通行量升至半年最高；而 Urals 对 Dated Brent 的波罗的海贴水收窄至 20.85 美元/桶（2025-11 以来最低）、价格回到 104.99 美元（4 月以来最高），出口议价能力反而改善，情景判断若中东进一步升级或再涨 25–30 美元。美国方面正在筹备 90 天柴油出口禁令，俄方则称解除自身柴油出口禁令需「综合解决」（内需、黑海航运安全与制裁解除）。国内端汽油年初至今 +21.1%、柴油 +14.74%，10-01 起 ЖКУ 指数化预计再推高通胀约 0.7 п.п.。结论：头程与干线成本应按 97–110 美元的宽区间做情景报价并约定燃油浮动条款；同时把「油价高位 → 财政与卢布支撑 → 进口成本」双向影响纳入锁汇决策。"}, {"title": "消费市场与需求结构：消费降级与季节性刚需并存，增长靠储蓄而非收入", "text": "消费端呈现「总量微增、结构下沉」：9-14~9-20 一周实际消费支出同比 +1.5%，但非食品类名义增速放缓至 10.7%；消费者信心三季度 -16%；居民转向二手与租赁，耐用品新品弹性下降。同时季节性刚需释放明显：Ozon 秋季前两周童装外套订单 ×1.6、女式大衣 ×1.8、儿童手套近 ×3；家具（-1.6%）、服装（-2.8%）等工业产出环比收缩。Минэк 预测 2026 年消费 +4.1% 而收入仅 +0.8%~1%，缺口由储蓄率下降填补，意味着消费动能依赖「动用存量储蓄」，价格敏感度上升、分期/BNPL 类支付工具的重要性提高。结论：Q4 备货弹性下调、结构上偏向刚需与高性价比；耐用品以「服务 + 保修 + 以旧换新」替代「换新升级」叙事；线下分销增量在收缩（前 200 食品连锁净新增面积 -46.2%、X5 开店 -30.3%），渠道投入应向平台站内与 B/G 端采购转移（莫斯科与莫斯科州企业采购 +10%，食品 +445%、日用百货 +308%）。"}, {"title": "美妆渠道：平台集中度提升，Ozon 增速快于 WB，男性护理是最大增量", "text": "上半年平台美妆营业额 5,040 亿卢布（+42%），其中 Wildberries 3,710 亿（+37%）、Ozon 1,230 亿（+70%），男性护理 Ozon 侧一年 ×1.7；线下专营网络同步线上化（Золотое Яблоко 金额 +31%、数量 +38%）。消费行为上，「成套换季」让位于「按需单品」，成分季节性显著（冬季视黄醇 +136%、酸类 +116%，SPF 峰值在春季），香水仍是线上线下第一大品类且依赖线下闻香体验，用户路径变为「到店试 → 线上买」。渠道结构上 «Лэтуаль» 线上约 30% 营收（2025 年约 33% 后回落稳定）。风险项：政府整治「伪环保」宣称（45% 消费者选环保标识、42% 标识商品不达标）与 Роспатент 2027-03-01 商品卡核验会抬高文案合规成本；Mixit 创始人案件提示本土头部品牌的治理风险。建议：把 Ozon 作为新品首发与内容投放的第一渠道，优先测试男性护理、香水小样组合与头皮护理，并在 Q4 前完成全部宣称用语的可举证性复核。"}, {"title": "电器与灯具：类目新增合规成本，工程项目与存量替换撑住需求", "text": "电器端的成本与合规项明显增多：电子「技术费」2026-12-01 开征（单件 ≤5,000 卢布，ГИС 登记的受标记产品可享 33% 折扣）、утильсбор 2027-01-01 按机型上调 10–20%（并确立「公布后满 30 日生效、不溯及」的规则）、智能家居 60 余类设备新增 ОКПД 2 编码管控、CBAM 拟扩围至家电与汽车零部件（铝受管门槛 50 吨→5 吨）。渠道侧 «М.Видео» 资金压力显性化（拖欠代理商 1,700 万卢布、SberDevices 索赔 66 亿、上半年净亏 361 亿），但同时增发募资 300 亿、ПВЗ 扩至 13 个地区并接入 «Магнит» 约 5,000 个自提点，家电自提网络继续扩容。灯具栏目本周无行业垂直媒体新增条目（lightingmedia.ru 最新 09-12、led-e.ru 最新 09-15），但结构性需求仍在：装修人工费三年翻倍（50㎡ 全面翻新 550 万卢布）、44% 消费者秋季考虑局部焕新内饰、冬宫照明改造一期与斯维尔德洛夫斯克铁路 2,300 盏 LED 替换构成 B 端工程与存量替换需求。结论：C 端以「局部焕新 + 含安装服务」承接，B 端以能效参数与批量交付能力切入工程与公共交通项目；成本侧对铜价（历史新高 6.903 美元/磅）与「技术费」做单列敏感性分析，并在 11 月前完成 ОКПД 2 与合格证明的归类自检。"}], "sourceStats": "本周周报共收录 65 条条目，信源全部为俄语本土媒体与官方机构：生意人报（Коммерсантъ）、Vedomosti、俄新社（РИА Новости）、塔斯社（ТАСС）、Lenta.ru、消息报（Известия）、国际文传电讯社（Интерфакс）、零售网（Retail.ru）、RBC、丰坦卡、RTVI、Absatz.media、gazeta.ru，以及俄央行（ЦБ РФ）、俄统计局（Росстат）、经济发展部（Минэк）、财政部（Минфин）、ФАС、Московская биржа 等官方与机构口径；Argus、CORE.XP、Infoline、Easy Commerce、Versta.io、E-Promo Group、«Авто.ру»、Роскачество、ВЦИОМ、НАФИ、Easy Commerce 等第三方数据均经俄本土媒体转述后收录，按转述链计入本地信源。本地信源 65 条 ＝ 100%（≥60% 达标）；中文信源 0 条、英文直采 0 条；Bloomberg / Axios / Politico 等英文源的信息均通过 Lenta.ru / 生意人报 / 消息报 转述收录并在条目内注明原始出处。周五补充抓取（09-25 05:00–17:00 MSK 窗口）来自 ТАСС、Lenta.ru 与 Retail.ru。", "meta": ["报告编号：RU-WEEKLY-2026-W39", "覆盖周期：2026-09-21（周一）~ 09-25（周五），第 39 周", "收录条目：65 条（电商17、时政11、经济17、美妆6、电器8、灯具4、汽车（扩展）2；其中工程/程序性条目 0 条）", "数据来源：本地日报 5 期（09-21 共 24 条、09-22 共 24 条、09-23 共 29 条、09-24 共 29 条、09-25 共 27 条，合计 133 条；窗口 09-21~09-25 无空窗）+ 周五补充抓取 09-25 白天（10:00 北京时日报窗口后至 17:00 MSK）俄语信源新条目若干，其中 2 条作为独立条目收录（电商·Wildberries 简化 ПВЗ 开店扩围、经济·«Газпром» 半年报），其余（柴油出口禁令解除条件、Ozon 秋季服装需求、«Лента» 新店等）按主题并入既有条目", "去重：周报条目与本周日报同源内容（跨境 НДС、退货新规、Ozon 赔付与支持措施、物流重构、СПОТ、选举结果、莫斯科州遇袭、ЧС、机场停摆、制裁延长、预算与宏观预测、通胀与工业产出、油价与 Urals、铜价、数字卢布、美妆平台数据、М.Видео 压力、技术费与 утильсбор、CBAM、灯具工程等）按周视角归并改写，不重复计数；补充抓取的 09-25 URL 全部查 state.db articles 表确认无冲突后 INSERT OR IGNORE 入库", "入库：本周补充抓取条目已写入 state.db articles 表（report_date=2026-09-25，category 按电商/经济分类）；本周日报 133 条此前已入库（report_date=2026-09-21~2026-09-25）", "仓库遇袭专题：本周 5 期日报均为「无新增平台仓库遇袭事件」（连续第 6~10 日），累计口径不变（Wildberries / Russ 22 城、Ozon 12 城）；warehouse_attacks.json 的 events / totals 不变，updated 已随日报逐日更新至 2026-09-25，无重复追加", "汇率（ЦБ РФ 官方，2026-09-25 生效口径）：美元 84.9057 卢布 / 欧元 96.8859 / 人民币 12.6500（周初沿用 09-19 生效口径：84.1975 / 96.6671 / 12.5670）", "重点提示：①跨境网购 НДС 22% 落地定案（平台代扣 + 个人包裹 100 卢布/件）并列入 2027 年预算「五项精准加税」；②平台仓库遇袭连续 10 日零新增，但打击纵深推到乌拉尔（9-25 斯维尔德洛夫斯克州「无人机危险状态」）、克拉斯诺达尔边疆区 9-23 起全境 ЧС、伏尔加-乌拉尔机场连环停摆——风险形态从「事件」转为「成本与时效」（到门时效最坏 ×2.5、货物险涨价、多点多批次）；③监管双硬节点：289-ФЗ 平台经济法 10-01 生效、退货修正案拟 2027-03-01、商品卡核验 2027-03-01、电子技术费 12-01 开征；④宏观「财政收紧 + 流动性紧张」：7 万亿卢布单日回购创纪录、存款利率破 13%、赤字 5.85 万亿、通胀预期上调至 6.8%、Brent 跌破 98 而 Urals 贴水收窄至 2025-11 以来最低；⑤消费端降级与季节性刚需并存（二手/租赁上升、Ozon 秋季服装订单 +1.4~1.6 倍），平台美妆 +42%（Ozon +70%）。", "待核实事项：① 09-20 莫斯科州 Софьино 起火仓储综合体的业主身份是否属平台仍无官方确认（未计入遇袭数据库）；② 09-25 斯维尔德洛夫斯克、沃罗涅日与乌里扬诺夫斯克三地袭击的具体受损目标与伤亡以官方后续通报为准；③ 跨境 НДС 的分阶段落地节奏（22% 是否一次到位）以最终法案文本为准；④ 9-25 白天 Fed/第三方英文源部分数据（如美国柴油出口禁令是否正式宣布）尚未落地，以官方公告为准", "免责：本报告为公开信源整理，市场预测不可重复；涉及金额与伤情以官方后续通报为准", "推送渠道：微信（iLink bot）＋ 日报网站「📅 周度复盘」板块（archive/weekly_2026-09-25.html）"]}
