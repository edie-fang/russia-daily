s://www.kommersant.ru/doc/9111947"}, {"cat": "politics", "catText": "时政要闻", "title": "乌法与萨拉瓦特工业区遭大规模无人机袭击，击落 50+；莫斯科方向一夜约 800 架", "summary": "巴什科尔托斯坦称乌法与萨拉瓦特工业区遭大规模无人机袭击，击落 50 余架，企业正常运转、无关键损坏。莫斯科市长索比亚宁称 16 日晚至 17 日晨约 800 架无人机飞向莫斯科方向，321 架在接近时被拦截、午夜后击落 113 架；俄国防部称单日击落 2,049 架，为迄今最高。", "table": [["乌法/萨拉瓦特", "击落 50+"], ["莫斯科方向", "约 800 架"], ["拦截", "321 架 + 午夜后 113 架"], ["单日纪录", "2,049 架"]], "source": "Ведомости", "time": "11-17 08:15", "num": 20, "tag": "local", "tagText": "本地", "sourceFull": "https://www.vedomosti.ru/society/news/2026/11/17/1362522-promzoni-ufi-i-salavata"}, {"cat": "politics", "catText": "时政要闻", "title": "普京抵深圳开始 АТЭС 议程：将会晤习近平，能源与「西伯利亚力量-2」为主要议题", "summary": "普京 18 日抵达深圳并开始 АТЭС 行程：出席工商峰会，与中国、泰国、越南领导人会谈，参观莫斯科大学与北京理工大学深圳联合校区。这是普京与习近平今年第 5 次接触、第 4 次面对面，能源（含 «Сила Байкала» 天然气管道）为主要议题；11-19 中俄美三方会晤安排不变。", "table": [["会期", "11-18 至 11-19"], ["双边", "普京—习近平（今年第 4 次面谈）"], ["议题", "能源、天然气管道、贸易"], ["三方会晤", "11-19（待举行）"]], "source": "РИА Новости", "time": "11-18 00:21", "num": 21, "tag": "local", "tagText": "本地", "sourceFull": "https://ria.ru/20261118/putin-2132233359.html"}, {"cat": "politics", "catText": "时政要闻", "title": "佩斯科夫：普京年度直播连线与年度记者会 12 月举行", "summary": "俄总统新闻秘书佩斯科夫向《Ведомости》确认，普京年度「直播连线」与大型年度记者会合并举行，时间定在 12 月；2025 年为 12 月 19 日。该活动通常发布民生与财政支出信号，也是观察明年预算、补贴与税制调整的窗口。", "table": [["形式", "直播连线 + 年度记者会"], ["时间", "2026 年 12 月（具体日期待定）"], ["上年", "2025-12-19"]], "source": "Интерфакс", "time": "11-18 02:56", "num": 22, "tag": "local", "tagText": "本地", "sourceFull": "https://www.interfax.ru/russia/1129699"}, {"cat": "politics", "catText": "时政要闻", "title": "安-12 运输机在克麦罗沃州坠毁，19 人遇难", "summary": "俄国防部通报：一架安-12 运输机在克麦罗沃州（库兹巴斯）坠毁，机上 19 人全部遇难。事故原因待查，俄方已派调查组；这是近期俄国内最严重的军用运输机事故，对经西伯利亚铁路、公路的物流通道暂无直接影响，但空运运力与保险条款可能短期收紧。", "table": [["机型", "安-12"], ["地点", "克麦罗沃州"], ["遇难", "19 人"], ["原因", "待查"]], "source": "Ведомости", "time": "11-17 21:57", "num": 23, "tag": "local", "tagText": "本地", "sourceFull": "https://www.vedomosti.ru/society/news/2026/11/17/1412740-pogibli-19-chelovek"}, {"cat": "other", "catText": "其它动态", "title": "10 月中国二手车在俄卖约 4.47 万辆创纪录，同比 +21%、份额 7.2%", "summary": "Газпромбанк автолизинг：10 月俄二手市场售出约 4.47 万辆中国品牌车，同比 +21%，创纪录，占二手市场 7.2%。前三为 Chery 8,244 辆、Geely 7,916 辆、Haval 7,895 辆；1–9 月累计 26.4 万辆（+37%）。", "table": [["10 月销量", "约 4.47 万辆"], ["同比", "+21%"], ["份额", "7.2%"], ["1–9 月", "26.4 万辆（+37%）"], ["品牌前三", "Chery / Geely / Haval"]], "source": "ТАСС", "time": "11-18 04:46", "num": 24, "tag": "local", "tagText": "本地", "sourceFull": "https://tass.ru/ekonomika/28328477"}, {"cat": "other", "catText": "其它动态", "title": "1–10 月俄罗斯 SUV 需求 +17.3%，均价 370 万 ₽；Haval Jolion 居首", "summary": "Авито Авто 与《Известия》统计：1–10 月新 SUV 需求同比 +17.3%，均价 370 万卢布。Haval Jolion 260 万居首，Tenet T7 290 万、Lada Niva Legend 120 万列前三；Belgee X70 降价 11.3% 至 280 万。", "table": [["需求", "+17.3%"], ["均价", "370 万 ₽"], ["销冠", "Haval Jolion 260 万 ₽"], ["降价最多", "Belgee X70 −11.3%"]], "source": "Lenta.ru", "time": "11-17 19:25", "num": 25, "tag": "local", "tagText": "本地", "sourceFull": "https://lenta.ru/news/2026/11/17/rossiyanam-nazvali-srednyuyu-stoimost-novyh-krossoverov-i-vnedorozhnikov/"}]}
