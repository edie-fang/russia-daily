{"date": "2026-09-18", "stats": {"total": 28, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "卖家把化妆品/保健品库存从平台仓迁往持牌第三方物流，按药品标准分散存储", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-17 05:04", "summary": "俄平台卖家（化妆品、保健品、医疗器械、婴幼儿食品类）开始把库存从平台自有仓转入持药品许可的物流运营商。新机制把同一批货分散到多个终端，降低单一设施遇袭导致整批全损的风险；运营商按药品标准控温湿洁净，并按平台要求重新包装、加贴「Честный знак」Data Matrix 重复码（贴码错误即视为非法流通）。业内称袭击迫使卖家重排「存储哲学」，价格与安全成为首要指标。", "table": [["迁移品类", "化妆品 / БАД / 医疗器械 / 婴幼儿食品"], ["新机制", "库存分散至多个终端"], ["存储标准", "药品级温湿度与洁净控制"], ["合规要点", "重复码 Data Matrix（贴错即非法流通）"], ["动因", "平台仓遇袭风险"]], "sourceFull": "https://www.retail.ru/news/sellery-marketpleysov-perekhodyat-na-khranenie-tovara-na-skladakh-logisticheskikh-17-sentyabrya-2026-282262/"}, {"num": 2, "title": "Ozon 上线仓库租赁平台：现房 5 千平方米起租，代建 1 万–8.5 万平方米", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru) / 生意人报(Kommersant)", "time": "09-17 05:04", "summary": "Ozon 启动线上平台，供业主与开发商就长期租赁或 build-to-suit 代建提交方案：现房面积门槛 5 千平方米，代建项目 1 万–8.5 万平方米；地块须满足停车与公共交通可达性要求，运营流程与设备由 Ozon 承担，公司向业主索取租金与商务条件。此举发生在平台仓储接连遇袭、公司需重构物流网络的背景下，也首次把仓储需求公开给外部业主。", "table": [["上线时间", "2026-09-17"], ["现房租用门槛", "≥5,000 ㎡"], ["代建规模", "10,000–85,000 ㎡"], ["运营归属", "Ozon 负责流程与设备"], ["背景", "平台仓储遇袭后的网络重构"]], "sourceFull": "https://www.retail.ru/news/ozon-zapustil-platformu-dlya-poiska-i-arendy-skladskikh-pomeshcheniy-17-sentyabrya-2026-282237/"}, {"num": 3, "title": "俄银行协会建议追加对「遇袭企业」金融支持：优惠融资、贷款重组与监管松绑", "tag": "local", "tagText": "本地", "source": "俄新社(RIA) / 零售网(Retail.ru)", "time": "09-17 13:12", "summary": "俄银行协会（АБР）应 RWB 与 WB 银行倡议，于 9-16 开会讨论对遭无人机袭击的物流中心、仓库、生产与商贸设施、炼油厂及旅游、农业企业的金融支持。与会方认为现有措施可能不足，建议：扩大优惠融资并把数字平台与电商、炼油、农业、旅游单列额度，区分中小企业/大企业/系统重要性企业；提供贷款重组、延期付款与信贷假期；临时调整监管口径以放行融资；结合农时支持农业。", "table": [["会议时间", "2026-09-16"], ["发起方", "АБР / RWB / WB 银行"], ["建议措施", "优惠融资、重组、延期、信贷假期"], ["覆盖行业", "数字平台与电商、炼油、农业、旅游"], ["结论", "现有支持可能不足"]], "sourceFull": "https://ria.ru/20260917/abr-2118233673.html"}, {"num": 4, "title": "第一副总理：政府与地方应补偿企业反无人机防护支出（须有投入凭证）", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti) / 生意人报(Kommersant)", "time": "09-17 16:30", "summary": "第一副总理 Мантуров 在保障行业不间断运行小组会上表示，「工业韧性正在成为成本的一部分」，政府与地方应在企业提供投入凭证的前提下补偿其防护支出——包括实体防护、关键设备与物流的冗余备份、以及受损设施恢复。此前 9-3 总检察长建议对受损中小企业给予缓缴与银行优惠期，8-24 财政部已就 РВБ 遇袭企业拟定支持方案并提交政府。", "table": [["表态人", "第一副总理 Мантуров"], ["补偿前提", "确认的防护/冗余/恢复投入"], ["覆盖内容", "实体防护、设备与物流冗余、设施恢复"], ["相关进展", "9-3 总检察长建议、8-24 财政部方案"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/09/17/1229677-kompensirovat-biznesu"}, {"num": 5, "title": "经济发展部拟改平台退货规则：退货须卖家同意，2 日不回复视为同意", "tag": "local", "tagText": "本地", "source": "俄新社(RIA) / 零售网(Retail.ru)", "time": "09-17 13:57", "summary": "经济发展部就平台监管修正案（修改 289-ФЗ）公开征求意见：拟规定质量合格商品的退货须先与卖家协商，卖家须在 2 日内决定，逾期未回复视为同意退货；并拟授权政府制定「不得拒收」与「不得退货」商品清单。官方称 2004 年消费者权益保护法框架未考虑平台与自提点（ПВЗ）参与的新模式，此举意在平衡买卖双方利益。对卖家意味着需把售后响应 SLA 压到 48 小时内。", "table": [["主管", "俄经济发展部"], ["核心变化", "合格商品退货须卖家同意"], ["卖家时限", "2 日（逾期视为同意）"], ["新增授权", "政府制定不可退货商品清单"], ["配套", "10-01 平台经济法生效"]], "sourceFull": "https://ria.ru/20260917/mer-2118245523.html"}, {"num": 6, "title": "Bloomberg：Wildberries 创始人财富缩水 15 亿美元，约三分之一仓储能力被摧毁", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru) 引 Bloomberg", "time": "09-17 05:04", "summary": "Bloomberg 估算，Wildberries 创始人 Татьяна Ким 的财富自年初减少 15 亿美元至 64 亿美元，原因之一是 7 月起的平台仓库无人机袭击：约三分之一仓储能力被摧毁，受损设施超过 20 处，商品损失不低于 5500 亿卢布（约 64 亿美元）。研究机构 Data Insight 估计，修复受损仓库需逾 2000 亿卢布（约 23 亿美元）。该口径与此前俄媒的行业损失估算方向一致。", "table": [["财富变化", "-15 亿美元（至 64 亿美元）"], ["被毁仓储能力", "约 1/3"], ["受损设施", "20 处以上"], ["商品损失", "≥5,500 亿卢布"], ["修复成本", ">2,000 亿卢布（Data Insight）"]], "sourceFull": "https://www.retail.ru/news/bloomberg-sostoyanie-osnovatelnitsy-wildberries-tatyany-kim-sokratilos-na-1-5-ml-17-sentyabrya-2026-282251/"}, {"num": 7, "title": "普京签令：Auchan、Nestle、Лемана Про、FM Logistics 等俄资产移交临时管理", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant) / 国际文传电讯社(Interfax)", "time": "09-17 20:00", "summary": "普京 9-17 签署总统令，把 Auchan（«Ашан»）、Nestle（«Нестле»）、管理 «Лемана Про»（原 Leroy Merlin）的 ООО «Ле Монлид»，以及 FM Logistics 与 Bati Logistics 的俄罗斯资产移交 АО «Л.Е.В. Менеджмент» 临时管理；该管理公司 2024 年 10 月在莫斯科注册，主营商业咨询与经营管理。「Лемана ПРО» 回应称门店与运营一切照常。该项属外资零售与物流资产治理结构的重大变动。", "table": [["签署时间", "2026-09-17"], ["移交对象", "АО «Л.Е.В. Менеджмент»"], ["涉及主体", "Auchan / Nestle / Ле Монлид / FM Logistics / Bati Logistics"], ["企业回应", "Лемана ПРО：运营照常"], ["性质", "临时管理（非所有权转让）"]], "sourceFull": "https://www.retail.ru/news/rossiyskie-aktivy-auchan-nestle-lerua-merlen-i-fm-logistics-byli-peredany-vo-vre-17-sentyabrya-2026-282268/"}, {"num": 8, "title": "平台已占俄家具市场收入 37%，线下渠道跌破一半", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru) / 生意人报(Kommersant)", "time": "09-17 05:04", "summary": "performance 机构 Adgasm 与家具市场机构 FCP 对 40 余家家具企业管理层的调研显示：2026 年上半年平台占俄家具市场收入 37%（去年同期 30%），线下零售份额由 55% 降至 47%，厂商与零售商自营电商基本持平（15%→16%）。渠道继续向平台集中，线下门店的流量与转化进一步承压。", "table": [["平台份额", "37%（去年 30%）"], ["线下份额", "47%（去年 55%）"], ["自营电商", "16%（去年 15%）"], ["样本", "40+ 家具企业（Adgasm / FCP）"]], "sourceFull": "https://www.retail.ru/news/po-itogam-i-polugodiya-dolya-marketpleysov-v-vyruchke-mebelnogo-rynka-vyrosla-do-17-sentyabrya-2026-282229/"}, {"num": 9, "title": "《消息报》：42% 俄零售商计划靠 AI 压缩人力开支", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "09-18 01:47", "summary": "据《Известия》报道，42% 的俄罗斯零售商计划通过自动化（AI）削减人员支出，主要方式是把部分运营环节自动化。该口径反映零售业在人力成本上升与平台上行的双重压力下的降本取向。｜ 说明：塔斯社文章页对本机返回 403，本条仅有标题级信息，未取得细分方案与样本口径，如实标注为待核实。", "table": [["比例", "42% 零售商"], ["手段", "运营环节自动化（AI）"], ["信源层级", "TASS 转述《Известия》"], ["数据完整度", "仅标题级（原文 403）"]], "sourceFull": "https://tass.ru/ekonomika/28123161"}, {"num": 10, "title": "Wildberries 上线 AI「形象灵感」：商品卡内一次给出至多 10 套搭配", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-17 05:05", "summary": "Wildberries 在商品卡中加入 AI 功能 «Идеи образов»：模型分析商品的轮廓、长度、版型、面料、颜色与色调、季节、风格、用途、性别与年龄，再在全平台服装、鞋履与配饰中组合，一次给出至多 10 套可购搭配，用户可直接加购。平台称其解决「买什么、怎么搭」的决策问题，把搜索购物转向搭配推荐，对服饰类目卖家的关联转化有直接意义。", "table": [["功能入口", "商品卡主图按钮"], ["搭配上限", "10 套"], ["分析维度", "轮廓/版型/面料/颜色/风格等"], ["可购范围", "平台服装、鞋履、配饰"]], "sourceFull": "https://www.retail.ru/news/na-wildberries-poyavilas-ii-funktsiya-idei-obrazov-17-sentyabrya-2026-282231/"}, {"num": 11, "title": "«Ашан» 联手 «Яндекс Доставка» 上线 30–90 分钟快送，首批 19 家门店", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-17 05:05", "summary": "«Ашан Ритейл Россия» 与 «Яндекс Доставка» 合作推出门店快送：配送时长 30–90 分钟，覆盖门店 5 公里半径内的地址，已在全国 19 家门店（含 Лефортово、Рязанский проспект、Сигнальный、Сити Марьина Роща、Сити Каширская、Сити Филион 等）落地。公司称该项目用于强化线上销售布局、拉新与提升老客粘性。", "table": [["上线门店", "19 家"], ["配送时长", "30–90 分钟"], ["覆盖半径", "5 公里"], ["合作方", "«Яндекс Доставка»"]], "sourceFull": "https://www.retail.ru/news/ashan-i-yandeks-dostavka-zapustili-bystruyu-dostavku-iz-magazinov-seti-17-sentyabrya-2026-282224/"}, {"num": 12, "title": "国家杜马选举开始投票：堪察加与楚科奇首批开放，投票持续至 9-20", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant) / RBC", "time": "09-17 23:33", "summary": "莫斯科时间 9-17 23:00（当地时间 9-18 8:00），第九届国家杜马选举的首批投票站在堪察加边疆区与楚科奇自治区开放，投票持续至 9-20；同时 10 个地区举行州长直选或议会选举（莫尔多瓦、图瓦、车臣、别尔哥罗德、布良斯克、奔萨、特维尔、乌里扬诺夫斯克等），北奥塞梯与卡拉恰伊-切尔克斯由地方议会确认人选。中央选举委员会称 100% 地区选委会与几乎全部投票站配备视频监控，并警告深度伪造风险。", "table": [["投票窗口", "2026-09-18 至 09-20"], ["首批开放", "堪察加、楚科奇（09-17 23:00 МСК）"], ["同步选举", "10 个地区州长/议会"], ["技术保障", "视频监控 100% 覆盖地区选委会"], ["风险提示", "深度伪造与挑衅"]], "sourceFull": "https://www.kommersant.ru/doc/8957458"}, {"num": 13, "title": "9-18 凌晨莫斯科方向击落无人机增至 35 架", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant) / RBC", "time": "09-18 03:54", "summary": "莫斯科市长 Собянин 逐批通报：9-18 零时后向莫斯科方向飞行的无人机被防空力量击落，数量由 10 架升至 20 架、再升至 35 架，残骸落点由应急部门处置。此前一昼夜俄国防空口径为单日击落 68 架，机场限航与公路封闭仍在继续。首都方向的袭击强度未因选举周而降级。", "table": [["击落数量", "35 架（09-18 零时后）"], ["通报节奏", "10→20→35"], ["前一日口径", "单日 68 架"], ["影响", "残骸落点处置、机场限航"]], "sourceFull": "https://www.kommersant.ru/doc/8957490"}, {"num": 14, "title": "纽约时报：美方考虑在俄乌冲突结束前与俄达成商业交易", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant) / RBC", "time": "09-18 02:54", "summary": "《纽约时报》援引两名知情人士称，美国政府在考虑于乌克兰冲突结束之前就与俄罗斯达成商业交易。此前美众议院以 262:159 通过对俄制裁法案并送交总统签署，法案明文允许总统以国家利益为由不予执行；同时美方在能源与航运议题上与俄保持接触。该报道与制裁法案并存，构成「制裁与交易并行」的双轨信号。", "table": [["信源", "The New York Times（经俄媒转述）"], ["内容", "冲突结束前或达成商业交易"], ["对照事件", "美众议院 262:159 通过对俄制裁法案"], ["法案特征", "允许总统以国家利益不执行"]], "sourceFull": "https://www.kommersant.ru/doc/8957486"}, {"num": 15, "title": "NBC：五角大楼或削减驻欧美军 2.5 万人；德国总理称跨大西洋友谊「或已结束」", "tag": "local", "tagText": "本地", "source": "RBC", "time": "09-18 04:43", "summary": "NBC 报道称，五角大楼可能把驻欧美军削减 2.5 万人，为 1990 年代以来最大规模，最终建议尚未提交（同时德国方面在评估医院对可能冲突的接收能力）。德国总理 Мерц 则表示，二战后形成的「无条件跨大西洋友谊」时代已经结束。对俄方向而言，欧洲安全架构与美欧关系进入重构期。", "table": [["拟削减规模", "25,000 人"], ["规模定位", "1990 年代以来最大"], ["状态", "建议未最终提交"], ["配套表态", "Мерц：跨大西洋友谊结束"]], "sourceFull": "https://www.rbc.ru/politics/18/09/2026/6aac906a5ca62c1c84573cf0"}, {"num": 16, "title": "普京把食品反制措施延长至 2028 年 12 月 31 日", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-17 20:59", "summary": "普京签署总统令，把自 2014 年实施、针对对俄制裁国家的部分农产品与食品进口禁令（食品反制措施）延长至 2028 年 12 月 31 日。这为进口食品、餐饮供应链与替代性本土/第三国采购的中期格局设定了新的时间边界，也意味着相关分销渠道不会在短期内回归。", "table": [["措施类型", "农产品与食品进口禁令"], ["原起始", "2014 年"], ["新到期日", "2028-12-31"], ["影响面", "进口食品与分销链"]], "sourceFull": "https://www.kommersant.ru/doc/8957406"}, {"num": 17, "title": "图斯克警告俄或对北约国家发动「混合」无人机打击；扎哈罗娃称选举挑衅已出现", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-17 21:00", "summary": "波兰总理图斯克称，未来数月俄罗斯可能对支持乌克兰的北约国家发动「混合」无人机打击，并称乌军月损失达 2.7 万人（死伤，为冲突以来最高）。俄外交部发言人扎哈罗娃则表示，杜马选举期间国内外投票站已出现挑衅事件，俄方正保障境外投票站安全。安全议题继续与选举周叠加。", "table": [["图斯克口径", "俄或对北约发动混合无人机打击"], ["乌军月损失", "2.7 万人（图斯克）"], ["扎哈罗娃", "选举挑衅已出现"], ["叠加因素", "选举周 + 夜袭常态化"]], "sourceFull": "https://www.kommersant.ru/doc/8957345"}, {"num": 18, "title": "普京经济会议：年通胀降至 6.2%，8 月预算盈余 6,060 亿卢布", "tag": "local", "tagText": "本地", "source": "俄新社(RIA) / 生意人报(Kommersant)", "time": "09-17 20:25", "summary": "普京在经济问题会议上通报：截至 9-14，年通胀为 6.2%，明显低于去年同期（央行预测 2026 年全年 6–7%、2027 年回到 4%）；8 月联邦预算盈余 6,060 亿卢布，主要来自非油气收入；全年经济增长在 1% 以内；2027 年预算赤字约占 GDP 2%，基于每桶约 50 美元的保守油价假设；上半年实际工资增长 6.5%。三年期预算与 2027–2029 年社会经济发展预测正在收尾。", "table": [["年通胀（9-14）", "6.2%"], ["8 月预算盈余", "6,060 亿卢布"], ["全年 GDP 增长", "<1%"], ["2027 赤字", "约 2% GDP（油价假设 $50/桶）"], ["实际工资（上半年）", "+6.5%"]], "sourceFull": "https://ria.ru/20260917/putin-2118332354.html"}, {"num": 19, "title": "Brent 跌破 103 美元：ICE 11 月合约盘中跌 2.78%，MOEX 结算价 104.20 美元", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant) / 莫斯科交易所", "time": "09-17 14:30", "summary": "ICE 11 月 Brent 期货 9-17 14:13（莫斯科时间）下跌 2.78% 至 102.89 美元/桶，为 9-10 以来首次跌破 103 美元（当日 09:18 曾报 104.8）。莫斯科交易所 BR-10.26 合约结算价 104.20 美元/桶，较前结算 105.54 美元下跌 1.27%（收盘时间 23:49）。中东航运与制裁风险溢价回落是主要背景，需注意两口径合约月份与平台差异。", "table": [["ICE 11 月 Brent", "$102.89（-2.78%，14:13 МСК）"], ["关键位", "9-10 以来首次跌破 $103"], ["MOEX BR-10.26", "结算 $104.20（前值 $105.54，-1.27%）"], ["时点", "09-17 23:49 收盘"]], "sourceFull": "https://www.kommersant.ru/doc/8957074"}, {"num": 20, "title": "存款利率与政策利率长期背离：前十大银行平均最高存款利率升至 12.984%", "tag": "local", "tagText": "本地", "source": "RBC", "time": "09-18 00:02", "summary": "RBC 报道称，俄前十大银行平均最高存款利率在 9 月上旬达到 12.984%（年化），已连续 12 周上行；同期央行已下调关键利率 0.25 个百分点，形成「非典型」背离。分析认为这反映银行争夺长期负债的竞争与储户对通胀的预期，对企业的资金成本与账期安排具有参考意义。", "table": [["平均最高存款利率", "12.984%（9 月上旬）"], ["连升周数", "12 周"], ["对照", "央行同期降息 0.25 п.п."], ["性质", "存款端与政策利率背离"]], "sourceFull": "https://www.rbc.ru/finances/18/09/2026/6aac33049a79472450446886"}, {"num": 21, "title": "央行官方汇率 9-18：美元 84.5093、欧元 97.4984、人民币 12.5788", "tag": "local", "tagText": "本地", "source": "俄央行(ЦБ РФ)", "time": "09-18 09:00", "summary": "俄央行公布 9-18 官方汇率：美元 84.5093 卢布、欧元 97.4984 卢布、人民币 12.5788 卢布；9-17 分别为 84.1732、97.1275、12.5457。美元连续第 7 个交易日守在 84 区间上方，卢布在选举周与油价回落背景下保持窄幅波动。", "table": [["美元", "84.5093（前值 84.1732）"], ["欧元", "97.4984（前值 97.1275）"], ["人民币", "12.5788（前值 12.5457）"], ["观察", "美元连续第 7 日位于 84 上方"]], "sourceFull": "https://www.cbr.ru/scripts/XML_daily.asp"}, {"num": 22, "title": "国际储备升至 7,582 亿美元；8 月石油出口收入 138.7 亿美元", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant) / 数据报(Vedomosti)", "time": "09-17 16:57", "summary": "俄国际储备在 9-11 达到 7,582 亿美元，一周增加 47 亿美元，增量主要来自资产重估。同期 8 月石油出口收入为 138.7 亿美元。储备规模与油气收入节奏共同决定财政缓冲空间，也是「赤字约 2% GDP、油价假设 50 美元」预算框架的现实基础。", "table": [["国际储备（9-11）", "7,582 亿美元"], ["周变化", "+47 亿美元"], ["增量来源", "资产重估"], ["8 月石油出口收入", "138.7 亿美元"]], "sourceFull": "https://www.kommersant.ru/doc/8957236"}, {"num": 23, "title": "资本市场承压：«Евротранс» 违约被查操纵/内幕，ВТБ 股价创历史新低", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant) / 数据报(Vedomosti)", "time": "09-17 17:56", "summary": "央行副行长 Мумута 表示，正调查 «Евротранс» 债券违约中的市场操纵与内幕迹象；莫斯科交易所将该股从一级降至三级上市。行情层面，「Самолет」债券因可能移交部分管理权（Сбербанк 或接手部分业务）盘中一度下跌 0.2%–11.6%；ВТБ 股价创历史新低 49.435 卢布。此前央行已于 9-15 就欧盟限制承认俄法院判决向欧盟普通法院提起诉讼。", "table": [["«Евротранс»", "违约被查操纵/内幕，降为三级上市"], ["«Самолет» 债券", "盘中 -0.2%~-11.6%"], ["ВТБ 股价", "49.435 卢布（历史新低）"], ["央行诉讼", "9-15 起诉欧盟限制承认俄判决"]], "sourceFull": "https://www.kommersant.ru/doc/8957268"}, {"num": 24, "title": "7 月欧盟对俄香水出口同比 -37%、化妆品 -16%，但对俄月比回升", "tag": "local", "tagText": "本地", "source": "俄新社(RIA) 引 Eurostat", "time": "09-18 02:22", "summary": "欧统局数据显示，7 月欧盟对俄香水与淡香水出口 2,640 万欧元，同比 -37%，但环比 +7%，为 2 月以来最高；化妆品出口 3,450 万欧元，环比 +4%、同比 -16%。1–7 月累计香水 1.902 亿欧元（-22%）、化妆品 2.368 亿欧元（-17%）。结构上香水主要由法国（880 万）、西班牙（620 万）、意大利（530 万欧元）供应；化妆品以法国（近 1,200 万）、德国（近 700 万）、波兰（550 万欧元）居前。", "table": [["7 月香水出口", "2,640 万欧元（同比 -37%、环比 +7%）"], ["7 月化妆品出口", "3,450 万欧元（同比 -16%、环比 +4%）"], ["1–7 月累计", "香水 1.902 亿欧元（-22%）/ 化妆品 2.368 亿欧元（-17%）"], ["香水主要来源", "法国 / 西班牙 / 意大利"], ["化妆品主要来源", "法国 / 德国 / 波兰"]], "sourceFull": "https://ria.ru/20260918/postavki-2118361520.html"}, {"num": 25, "title": "俄税务局清算网红 Карина Кросс 的化妆品公司，9-11 移出法人登记", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru) 引俄新社", "time": "09-17 05:05", "summary": "联邦税务局（ФНС）于 9 月完成对「Кара Кросс косметикс」的清算：该公司主营化妆品与香水的零售，网红 Карина Кросс（Лазарьянц）持股 20%，另 80% 由两名自然人分持；税务局以登记信息不实为由，9-11 将法人移出 ЕГРЮЛ。该案延续了对网红美妆品牌的税务与登记合规收紧，对同类轻资产美妆品牌的合规成本构成示范效应。", "table": [["公司", "«Кара Кросс косметикс»"], ["清算动作", "9-11 移出 ЕГРЮЛ（信息不实）"], ["主业", "化妆品与香水零售"], ["网红持股", "20%"], ["监管口径", "税务与登记合规收紧"]], "sourceFull": "https://www.retail.ru/news/fns-likvidirovala-kosmeticheskuyu-kompaniyu-blogera-kariny-kross-17-sentyabrya-2026-282252/"}, {"num": 26, "title": "«Авито»：8 月显卡销量环比 +16%，新代产品供给趋稳", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-17 05:04", "summary": "«Авито» 统计显示，8 月平台显卡销量环比 +16%、同比 +5%。增长来自返校季装机与游戏旺季前的升级需求，也与新一代显卡供给与渠道趋稳、型号覆盖扩大有关；需求侧不仅有游戏，还包含图形处理、视频剪辑与 AI 计算任务。对配件类卖家而言，说明「供给稳定性」本身即可释放被压抑的替换需求。", "table": [["环比", "+16%"], ["同比", "+5%"], ["驱动", "返校装机、游戏旺季前升级"], ["供给端", "新代型号渠道趋稳、覆盖扩大"], ["需求延伸", "图形/视频/AI 计算"]], "sourceFull": "https://www.retail.ru/news/avito-prodazhi-videokart-vyrosli-na-16-17-sentyabrya-2026-282236/"}, {"num": 27, "title": "Merlion 集团进入机器人仓储设备分销，代理中国「Xgen Robot」", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-17 05:05", "summary": "Merlion 集团宣布进入机器人仓储技术与场内物流自动化设备分销：旗下履约运营商 «Кактус» 与合肥井松智能科技（Hefei Jingsong，品牌 Xgen Robot）签署分销协议。集团拥有 Ситилинк、Позитроника 等连锁与 «Кактус»（月处理逾 15 万线上订单）。俄仓储自动化市场正因人力短缺与电商增长快速扩张，此单意味着中国仓储机器人品牌借本土分销商加速入场。", "table": [["主体", "ГК Merlion / «Кактус»"], ["合作方", "合肥井松智能科技（Xgen Robot）"], ["赛道", "机器人仓储与场内物流自动化"], ["集团零售资产", "Ситилинк、Позитроника"], ["«Кактус» 体量", "月处理 >15 万线上订单"]], "sourceFull": "https://www.retail.ru/news/gk-merlion-vyydet-na-rynok-robotizirovannoy-skladskoy-tekhniki-17-sentyabrya-2026-282245/"}, {"num": 28, "title": "«Авито Авто»：夏季二手电动车与混动车需求同比 +74.8%", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-17 05:04", "summary": "«Авито Авто» 统计，2026 年夏季俄罗斯二手电动车与混合动力车需求同比 +74.8%，最受欢迎车型为 Toyota Camry、Nissan Leaf 与 Voyah Free。该数据延续了燃料价格上涨与局部燃油短缺推动非汽油动力需求的判断（前一期已收录俄媒「燃料短缺推升电动车与混动车需求」口径，本条为其平台侧量化补充）。", "table": [["需求变化", "+74.8%（同比）"], ["热门车型", "Toyota Camry / Nissan Leaf / Voyah Free"], ["周期", "2026 年夏季"], ["背景", "油价与燃油供应压力"]], "sourceFull": "https://www.retail.ru/news/letom-spros-na-elektromobili-i-gibridy-s-probegom-vyros-na-74-8-17-sentyabrya-2026-282247/"}]}
