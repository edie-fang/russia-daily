26-283102/"}, {"num": 7, "cat": "ecom", "catText": "电商动态", "tag": "local", "tagText": "本地", "source": "零售报(Retail.ru)｜ВЦИОМ", "time": "10-07 16:26", "title": "ВЦИОМ：87% 平台买家信任商品描述、评分与带图评价", "summary": "在«Цифровые решения»论坛上，АСИ 的 М. Уткин 引用 ВЦИОМ 与数字平台协会的联合研究：87% 的平台买家认为，详尽的商品描述、高评分以及带图/视频的评价，与「实物查看」带来的信任度相当。商品卡片的内容质量（描述、属性、图文评价）已成转化关键，直接决定点击与成交。", "table": [["信任描述/评分的买家", "87%"], ["研究方", "ВЦИОМ + 数字平台协会"], ["主要信任来源", "详细描述与图文评价"]], "sourceFull": "https://www.retail.ru/news/pochtit-90-pokupateley-doveryayut-opisaniyu-tovara-na-marketpleysakh-7-oktyabrya-2026-283068/"}, {"num": 8, "cat": "ecom", "catText": "电商动态", "tag": "local", "tagText": "本地", "source": "俄《Vedomosti》", "time": "10-08 15:45", "title": "Голикова：受损消费者每年获赔约 40 亿 ₽", "summary": "俄副总理 Голикова 表示，通过消费者权益保护机制，受损消费者每年获赔约 40 亿 ₽，并强调线上消费纠纷处置与平台责任。对平台卖家而言，售后与描述一致性的合规要求将持续收紧，虚假宣传与货不对板的成本上升。", "table": [["消费者年赔付规模", "约 40 亿 ₽/年"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/10/08/1235310-golikova-postradavshim-potrebitelyam"}, {"num": 9, "cat": "beauty", "catText": "美妆个护", "tag": "local", "tagText": "本地", "source": "俄《Коммерсантъ》(商人报)", "time": "10-08 23:36", "title": "Seahava 化妆品生产方涉嫌 2 亿 ₽「金融金字塔」", "summary": "据«Коммерсантъ»，自然人化妆品品牌 Seahava 的创始人兼总经理 И. Богомолова 被控侵占约 2 亿 ₽：其以「投资天然化妆品生产」为名集资，向出资人承诺年化 50%–150%，仅支付数月收益后即出境。事件提示俄美妆市场以「预售众筹/高息回报」为噱头的合规与声誉风险，正规品牌可借此强化合规背书。", "table": [["涉案金额", "约 2 亿 ₽"], ["承诺年化", "50%–150%"], ["主要指控", "侵占/非法集资"]], "sourceFull": "https://www.kommersant.ru/doc/9009306"}, {"num": 10, "cat": "appliance", "catText": "家电电器", "tag": "local", "tagText": "本地", "source": "塔斯社(ТАСС)", "time": "10-09 06:42", "title": "Народный фронт 预警：扫雪设备网购诈骗（全额预付后失联）", "summary": "«Народный фронт. Аналитика» 专家 Г. Кучава 称，骗子在网上发布除雪/清雪服务与设备广告，收取全额预付款后立即失联。冬季将至、扫雪类设备需求抬升，低价预付款成为主要诱饵；对正规卖家而言，透明付款与售后保障是可强化信任的卖点。", "table": [["风险类型", "全额预付后失联"], ["高发品类", "扫雪/除雪设备与服务"]], "sourceFull": "https://tass.ru/obschestvo/28196263"}, {"num": 11, "cat": "appliance", "catText": "家电电器", "tag": "local", "tagText": "本地", "source": "俄《Vedomosti》", "time": "10-08 14:55", "title": "Минпромторг 拟调整无线电电子产品税收优惠条件", "summary": "俄工贸部提议修改无线电电子产品（Радиоэлектроника）享受税收优惠的条件（具体门槛与生效时间待核实）。该品类涵盖电视、音视频及部分智能硬件，若优惠收窄将影响本地生产与定价，并间接改变该类目跨境供给的价格竞争格局。", "table": [["提议方", "Минпромторг（工贸部）"], ["涉及品类", "无线电电子产品"], ["状态", "提议阶段/细则待核实"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/10/08/1235291-minpromtorg-predlozhil"}, {"num": 12, "cat": "econ", "catText": "经济金融", "tag": "local", "tagText": "本地", "source": "俄《Vedomosti》", "time": "10-08 22:58", "title": "ЦБ 连续第三日将美元官方汇率维持在 85 ₽", "summary": "俄央行连续第三个交易日将美元官方汇率维持在 85 ₽，卢布短期波动收窄。汇率稳定有利于跨境卖家按周期锁汇、稳定结算与零售定价预期；后续需关注月末税费缴纳、油价波动与外部制裁对卢布的扰动。", "table": [["美元官方汇率", "85 ₽（连续第 3 日）"]], "sourceFull": "https://www.vedomosti.ru/finance/news/2026/10/08/1235536-kurs-dollara"}, {"num": 13, "cat": "econ", "catText": "经济金融", "tag": "local", "tagText": "本地", "source": "俄《Vedomosti》", "time": "10-08 16:49", "title": "Греф：俄央行已开启降息周期", "summary": "Сбербанк 总裁 Греф 表示俄央行实际上已进入降息周期，并预计信贷需求回暖（同日其在投资者论坛还就 IPO 定价、私人投资等发表系列观点）。若降息路径确立，将改善消费信贷与耐用消费品需求，对家电、家居等耐用品类目偏正面。", "table": [["观点来源", "Сбербанк 总裁 Греф"], ["判断", "央行已开启降息周期"]], "sourceFull": "https://www.vedomosti.ru/finance/news/2026/10/08/1235328-tsikl-snizheniya-stavki"}, {"num": 14, "cat": "econ", "catText": "经济金融", "tag": "local", "tagText": "本地", "source": "俄《Vedomosti》", "time": "10-08 22:39", "title": "指数 Мосбиржи 重回 2300 点", "summary": "莫斯科交易所指数回升至 2300 点关口，市场风险偏好边际改善；同日国债指数跌破 111 点。资本市场情绪回暖对本地融资与消费信心有正向外溢，但债市走弱显示利率预期仍偏紧。", "table": [["MOEX 指数", "≈2300 点"], ["国债指数", "跌破 111 点"]], "sourceFull": "https://www.vedomosti.ru/investments/news/2026/10/08/1235526-indeks-mosbirzhi"}, {"num": 15, "cat": "econ", "catText": "经济金融", "tag": "local", "tagText": "本地", "source": "消息报(Izvestia)", "time": "10-09 09:30", "title": "Мосбиржа 计划 12 月开放加密货币交易", "summary": "莫斯科交易所高管 Б. Блохин 表示，拟自 2026-12-01 起向市场参与者开放加密货币交易，将在新立法框架下运作（无需额外特别许可）；«Сбер» 已开始在其 App 内测试加密资产操作。监管框架落地或提升本地金融科技活跃度与资金流动，间接影响消费与广告投放。", "table": [["拟生效", "2026-12-01"], ["主体", "莫斯科交易所（Мосбиржа）"], ["进展", "«Сбер» 已内测加密操作"]], "sourceFull": "https://iz.ru/2181194/2026-10-09/v-mosbirzhe-zaiavili-o-planakh-zapuska-torgovli-kriptovaliutami-v-dekabre"}, {"num": 16, "cat": "econ", "catText": "经济金融", "tag": "local", "tagText": "本地", "source": "连塔网(Lenta.ru)", "time": "10-08 22:43", "title": "ВТО 上调全球贸易增长预测", "summary": "世界贸易组织(WTO)上调对全球贸易增长的预测（具体数值待核实）。外部贸易环境预期改善，对依赖跨境物流与小件出口的卖家属温和利好，但仍受制裁与支付通道约束，实际传导有限。", "table": [["机构", "世界贸易组织（ВТО）"], ["动作", "上调全球贸易增长预测"], ["数值", "待核实"]], "sourceFull": "https://lenta.ru/news/2026/10/08/vto-povysila-prognoz-po-rostu-globalnoy-torgovli/"}, {"num": 17, "cat": "politics", "catText": "时政要闻", "tag": "local", "tagText": "本地", "source": "俄《Vedomosti》｜俄国防部", "time": "10-08 21:52", "title": "10-08 大规模无人机袭击：奥мск 工业枢纽等多地遇袭有伤亡", "summary": "10 月 8 日俄多地遭无人机袭击：一架无人机抵达奥мск 州北部工业枢纽；布良斯克州一名白俄罗斯公民重伤（白方称系「被拖入冲突」）；别尔哥罗德州 Грайворон 一名女性死亡、3 人受伤；波多利斯克一名男子死亡；克拉斯诺达尔一处企业院内落有残骸。俄国防部称当日防空在各地共击落 59 架乌克兰无人机。物流与仓配网络的空袭风险仍高。", "table": [["击落无人机", "59 架/日（俄方通报）"], ["伤亡地点", "别尔哥罗德、波多利斯克等"], ["受影响设施", "奥мск 北部工业枢纽等"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/10/08/1235500-bpla-dostig-uzla"}, {"num": 18, "cat": "politics", "catText": "时政要闻", "tag": "local", "tagText": "本地", "source": "俄《Коммерсантъ》(商人报)", "time": "10-08 23:51", "title": "СКР 就「Яндекс」梁赞州数据中心遭袭立案，多地服务中断", "summary": "俄侦委(СКР)就 10-08 无人机击中«Яндекс»位于梁赞州萨索沃(Сасово)的数据中心立案侦查，定性为恐怖袭击；该数据中心一度停运，导致«Яндекс»部分服务、邮件以及«Циан»、库兹巴斯交通服务等出现中断。数字基础设施遇袭会短时波及平台化服务稳定性与线上交易。", "table": [["事件", "«Яндекс» 数据中心遭无人机袭击"], ["地点", "梁赞州萨索沃(Сасово)"], ["定性", "恐袭（СКР 立案）"]], "sourceFull": "https://www.kommersant.ru/doc/9009324"}, {"num": 19, "cat": "politics", "catText": "时政要闻", "tag": "local", "tagText": "本地", "source": "俄《Vedomosti》", "time": "10-09 02:38", "title": "普京抵达土库曼斯坦出席独联体峰会，会见伊朗总统", "summary": "普京抵达土库曼斯坦，出席独联体国家元首理事会(СНГ)并参加相关多边活动；其间与伊朗总统佩泽什基安举行会谈（原定晚一天、后提前），双方谈及双边贸易额增长与中东局势，俄方表示愿协助调解。对外经贸与区域结算通道的走向值得跟踪。", "table": [["行程", "土库曼斯坦·独联体峰会"], ["双边会见", "伊朗总统佩泽什基安"], ["议题", "贸易额增长、中东局势"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/10/08/1235603-putin-vstretilsya-s-pezeshkianom"}, {"num": 20, "cat": "politics", "catText": "时政要闻", "tag": "local", "tagText": "本地", "source": "俄《Vedomosti》", "time": "10-08 22:43", "title": "欧盟延长对俄个人制裁", "summary": "欧盟决定延长针对俄罗斯个人的制裁（延长期限与名单细节待核实）。对跨境卖家的直接影响有限，但银行合规审查趋严与欧元通道收紧的压力延续，需关注结算行政策变化。", "table": [["措施", "延长对俄个人制裁"], ["细节", "期限/名单待核实"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/10/08/1235525-es-prodlil"}, {"num": 21, "cat": "politics", "catText": "时政要闻", "tag": "local", "tagText": "本地", "source": "俄《Vedomosti》", "time": "10-08 19:02", "title": "英国制裁«Зарубежнефть»", "summary": "英国将俄油企«Зарубежнефть»列入制裁名单，俄驻英使馆已就此作出回应。制裁叠加对能源贸易与支付渠道构成扰动，间接影响物流与结算成本，需关注后续是否波及更多俄企与贸易通道。", "table": [["制裁方", "英国"], ["对象", "«Зарубежнефть»"], ["俄方回应", "使馆已表态"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/10/08/1235421-sanktsii-protiv-rossii"}, {"num": 22, "cat": "other", "catText": "其它动态", "tag": "local", "tagText": "本地", "source": "连塔网(Lenta.ru)", "time": "10-08 23:21", "title": "Geely 停止对俄官方进口三款车型", "summary": "吉利(РФ)副总经理 А. Марков 证实，Geely 已停止对俄官方进口跨界车 Monjaro、Atlas 与轿车 Preface（经销商仍可销售库存现车），在售保留 Cityray、Coolray、Okavango，并计划 2027 年在俄推出燃油/混动新车；同时准备年内首发在华最畅销的电动掀背车 EX2，中国起售价 69 800 元（约 88.9 万 ₽）。中国品牌在俄渠道与车型策略调整，牵动相关配件与周边品类。", "table": [["停进口车型", "Monjaro / Atlas / Preface"], ["在售保留", "Cityray / Coolray / Okavango"], ["EX2 起售价", "69 800 元（约 88.9 万 ₽）"]], "sourceFull": "https://lenta.ru/news/2026/10/08/kitayskiy-brend-geely-prekratil-postavki-treh-modeley-v-rossiyu/"}, {"num": 23, "cat": "other", "catText": "其它动态", "tag": "local", "tagText": "本地", "source": "塔斯社(ТАСС)｜Interfax", "time": "10-09 05:32", "title": "霍尔木兹海峡油轮触雷，CENTCOM 称已协助运输逾 12.5 亿桶石油", "summary": "伊朗媒体 Fars 称霍尔木兹海峡南部航道发生多起强烈爆炸；塔斯社报道称数艘油轮在霍尔木兹海峡触雷。美国中央司令部(CENTCOM)表示，近几个月美军已协助逾 12.5 亿桶石油经该海峡运输。海峡局势牵动国际油价，进而影响俄境内物流与运输成本。", "table": [["事件", "油轮在霍尔木兹海峡触雷"], ["CENTCOM 数据", "经海峡运输 >12.5 亿桶石油"], ["影响链条", "国际油价 → 俄物流/运输成本"]], "sourceFull": "https://tass.ru/proisshestviya/28196213"}]}
