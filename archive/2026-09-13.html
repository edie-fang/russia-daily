{"date": "2026-09-13", "stats": {"total": 22, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "ЦРПТ（«Честный знак»）与 WB、Ozon 签署路线图：商品与卖家核验前移到「上架之前」", "source": "ТАСС", "time": "09-13 03:10", "tag": "local", "tagText": "本地", "summary": "塔斯社报道，俄罗斯「诚实标识」系统运营方 ЦРПТ 副总经理列瓦兹·尤苏波夫表示，ЦРПТ 已与 Wildberries 和 Ozon 签署相关机制路线图，将把商品与卖家的核验环节前移到上架/发布之前，即在商品卡公开前完成合规校验。此前的平台打假以事后抽查与消费者投诉为主，此次路线图意味着「诚实标识」数据将与商品上架流程打通，卖家身份与商品信息真实性核验成为前置条件。对卖家而言，品牌授权链、商标证明与进口合规文件需提前备齐，否则商品卡存在被拦截或批量下架的风险。", "table": [["签署方", "ЦРПТ × Wildberries、Ozon"], ["机制", "商品与卖家在商品卡上架/发布前核验"], ["表态人", "ЦРПТ 副总经理 Реваз Юсупов"], ["变化", "打假从「事后抽查」转为「上架前前置校验」"], ["备注", "ТАСС 网页 403，本条以 RSS 摘要为准"]], "sourceFull": "https://tass.ru/ekonomika/28107113"}, {"num": 2, "title": "平台经济法 10-1 生效：未经卖家同意不得纳入促销，佣金与罚款变更须提前 45 天通知", "source": "РИА Новости", "time": "09-12 12:00", "tag": "local", "tagText": "本地", "summary": "俄国家杜马竞争保护委员会第一副主席伊戈尔·伊戈申向俄新社表示，自 2026 年 10 月 1 日起电商平台不得在未经卖家同意的情况下把其商品纳入促销活动；同日生效的平台经济法还规定，平台对佣金、罚款及其他费用的变更须不晚于 45 天前告知商家，从而排除「突然恶化合作条件」——商家可提前重算成本、调整开店节奏或修正品类结构。伊戈申称新规同时保护消费者与合规生产者，市场将清出以省掉强制认证压价的供给方。卖家需在 10-1 前完成折扣授权设置与费率变动预案。", "table": [["生效日", "2026-10-01"], ["促销规则", "未经卖家同意不得加入促销/打折"], ["费率变更", "佣金、罚款等须不晚于 45 天前通知"], ["表态人", "国家杜马竞争保护委员会第一副主席 Игорь Игошин"]], "sourceFull": "https://ria.ru/20260912/marketplejsy-2117299092.html"}, {"num": 3, "title": "遇袭受损卖家救助进入放款期：优惠贷款已开始发放，保险赔付首批 9-15 到账", "source": "РИА Новости", "time": "09-11 14:00", "tag": "local", "tagText": "本地", "summary": "俄新社报道，因 WB（РВБ）仓库遇袭受损的中小企业优惠贷款已开始实际发放——利率为「关键利率+3%」（现约 17%），单笔 500 万至 5 亿卢布，仅限补充流动资金与日常支出，由 Минэк、央行与 Корпорация МСП 共同实施；与此同时 Ozon 官方确认 «Ингосстрах» 对受损卖家的保险赔付首批款项自 9 月 15 日起分批发付。两条救助通道均由「宣布」转入「落地」，受损卖家的现金流缺口获得短期缓解。仍在等待的卖家应立即核对理赔材料与贷款条件，并从 9-15 起跟踪首批到账明细。", "table": [["优惠贷款状态", "已开始实际发放（不再只是「可申请」）"], ["利率 / 额度", "关键利率+3%（约 17%）／单笔 500 万~5 亿卢布"], ["保险赔付", "«Ингосстрах» 首批 9-15 起分批发付"], ["再保险", "央行 9 月向 РНПК 注资 1650 亿卢布"]], "sourceFull": "https://ria.ru/20260911/kredity-2116975329.html"}, {"num": 4, "title": "BRICS 新德里峰会闭幕：宣言反对单边制裁，中国 2027 年接任主席国", "source": "Коммерсантъ", "time": "09-12 18:59", "tag": "local", "tagText": "本地", "summary": "BRICS 新德里峰会通过峰会宣言，成员国一致呼吁取消「单边制裁」，认为该做法破坏国际法、联合国宪章原则与人权；宣言还支持巴勒斯坦加入联合国、对受国际原子能机构保障的和平核设施遭袭表示关切、并呼吁以色列从黎巴嫩撤出军队。峰会确定中国将于 2027 年接任轮值主席国并主办第 19 届峰会；印度外交部经济关系秘书感谢俄方对本届主席国工作的「坚定支持」。对俄贸易与结算环境而言，「反对单边制裁」的联合表态、本币结算扩容议题（印尼提议）与普京对 BRICS 经济体量的强调，均具中期意义。", "table": [["宣言要点", "一致呼吁取消单边制裁"], ["其他表态", "支持巴勒斯坦入联；关切和平核设施遇袭；呼吁以色列撤出黎巴嫩"], ["下届主席国", "中国（2027 年第 19 届峰会）"], ["结算议题", "印尼呼吁扩大本币结算"], ["普京口径", "BRICS 近五年产出占全球 GDP 逾 40%，G7 约 29%"]], "sourceFull": "https://www.kommersant.ru/doc/8953512"}, {"num": 5, "title": "普京结束三天印度访问：峰会期间双边会见密集，以 BRICS「外联」会议收官", "source": "ТАСС", "time": "09-13 00:00", "tag": "local", "tagText": "本地", "summary": "塔斯社报道，普京以 BRICS「外联」（outreach）形式会议结束为期三天的印度之行。峰会期间，普京与阿布扎比王储哈立德·本·穆罕默德·阿勒纳哈扬讨论国际局势与双边关系，与哈萨克斯坦总统托卡耶夫举行非正式会晤，并会见埃塞俄比亚总理与马来西亚总理；俄印同时准备原子能合作新阶段备忘录。俄方在峰会期间强调多极化趋势与 BRICS 份额上升，并推动 IMF、WTO 与世界银行改革议题，议题设置明显指向「制度性替代」，为俄外贸结算与能源出口通道争取更多制度空间。", "table": [["行程", "9-11~13 新德里（第 18 届 BRICS 峰会）"], ["9-12~13 双边", "阿布扎比王储、托卡耶夫、埃塞总理、马来西亚总理"], ["收官", "BRICS「outreach」外联会议"], ["成果", "俄印原子能合作新阶段备忘录；«Росатом» 增加布什尔核电站人员"]], "sourceFull": "https://tass.ru/politika/28107005"}, {"num": 6, "title": "库什纳：俄乌协议「绝大部分条款已谈妥」，领土问题最棘手", "source": "Коммерсантъ", "time": "09-13 00:24", "tag": "local", "tagText": "本地", "summary": "美方谈判代表库什纳表示，俄乌冲突和解协议中除领土问题外的所有条款均已谈妥；他同时称领土问题仍是最困难的一项，双方立场相距较远。此前美方特使威特科夫 9 月 5-6 日访俄、随后转赴基辅，乌方情报负责人布达诺夫称美方未带来新倡议但方案在持续「更新」，泽连斯基则公开邀请普京在莫斯科会面、并点名 UAE／瑞士／土耳其为可能地点。谈判进入「最后一项条款」阶段是风险偏好改善的边际信号，但领土问题无解的不确定性与袭击常态化并行，不宜据此调整库存与保险预案。", "table": [["表态人", "贾里德·库什纳（美方谈判代表）"], ["已一致", "除领土问题外的全部条款"], ["未解", "领土问题（双方立场仍相距较远）"], ["背景", "美方特使 9-5~6 访俄后转赴基辅"]], "sourceFull": "https://www.kommersant.ru/doc/8953535"}, {"num": 7, "title": "佩斯科夫：迈阿密 G20 期间普京与泽连斯基会面「不可能」", "source": "Коммерсантъ", "time": "09-12 22:51", "tag": "local", "tagText": "本地", "summary": "俄总统新闻秘书佩斯科夫向法新社表示，12 月在迈阿密举行的 G20 峰会期间普京与泽连斯基会面「不可能」；他此前强调会面须先完成专家层面准备，总统助理乌沙科夫也称普京参加 G20 一事「尚未讨论」。外长拉夫罗夫同日明确排除为谈判而暂停特别军事行动的可能。泽连斯基的会面邀请被俄方以程序与前提条件回绝，短期内高层会晤概率低，冲突外溢对物流与能源的扰动仍将持续。", "table": [["表态", "佩斯科夫（对法新社 AFP）"], ["结论", "12 月迈阿密 G20 期间普泽会面不可能"], ["前提", "须先完成专家级准备；普京赴 G20「尚未讨论」"], ["另一立场", "拉夫罗夫排除为谈判而暂停 СВО"]], "sourceFull": "https://www.kommersant.ru/doc/8953531"}, {"num": 8, "title": "美国众议院 9-14 起审议对俄「地狱制裁」法案", "source": "Коммерсантъ", "time": "09-12 05:27", "tag": "local", "tagText": "本地", "summary": "据路透社，《生意人报》报道，美国众议院将于 9 月 14 日开始审议强化对俄制裁的法案，核心设计包括对购买俄罗斯能源的第三国加征关税等次级制裁条款；三名民主党众议员已警告该案可能带来负面后果。同期欧盟内部对「将被冻结俄罗斯资产移交乌克兰」的讨论再度升温（欧洲议会部分议员提议设立新托管机构承接），俄国家杜马主席沃洛金称其为「公开抢劫」。若法案推进，印度、中国、土耳其等第三国买家的采购与结算成本可能上升，进而影响俄能源流向与卢布汇率——建议关注本周卢布与跨境结算通道的波动。", "table": [["起始", "2026-09-14（美国众议院）"], ["法案", "强化对俄制裁法案（俄媒称「地狱制裁」，Грэм 法案）"], ["核心设计", "对购买俄能源的国家加征关税等次级制裁"], ["阻力", "三名民主党众议员警告负面影响"], ["同期欧盟", "再议用被冻结俄资产援乌；沃洛金称「公开抢劫」"]], "sourceFull": "https://www.kommersant.ru/doc/8953306"}, {"num": 9, "title": "俄杜马选举 9-18~20 三天投票：境外提前投票启动，日内瓦领事馆请求加强安保", "source": "РИА Новости", "time": "09-13 01:30", "tag": "local", "tagText": "本地", "summary": "俄国家杜马第九届选举将于 9 月 18-20 日三天举行，境外投票陆续启动（土耳其、加拿大三个城市等），部分偏远地区与极地站点已提前投票。俄驻日内瓦总领事波波夫表示不排除投票日出现亲乌活动人士及「负面情绪侨民」的挑衅，使团已请求瑞士当局在选举期间加强安保，并要求 9 月 20 日禁止使团附近游行；中央选举委员会通报已有国际观察员安排。选举期与「地狱制裁」法案审议期重叠，政治风险与网络攻击（钓鱼、假冒选举机构、虚假彩票等）活跃度可能上升。", "table": [["投票日", "2026-09-18~20（三天）"], ["境外", "土耳其、加拿大三城等已启动提前投票"], ["安保", "俄驻日内瓦使团请求瑞方加强安保、9-20 禁止周边游行"], ["观察员", "中央选举委员会通报已有国际观察员"]], "sourceFull": "https://ria.ru/20260913/vybory-2117363547.html"}, {"num": 10, "title": "无人机越境：穿越摩尔多瓦领空后坠入罗马尼亚，罗方 F-16 升空", "source": "Коммерсантъ", "time": "09-13 04:47", "tag": "local", "tagText": "本地", "summary": "罗马尼亚国防部通报，一架无人机在苏恰瓦县坠入玉米地，此前穿越了摩尔多瓦领空，罗方紧急起飞 F-16 战机应对，暂无人员伤亡。同期保加利亚当局（内务部长杰梅尔吉耶夫）将 «Емко» 军工厂仓库的爆炸定性为可能的蓄意破坏。战争外溢到北约东翼国家领空与设施的事件增多，黑海与多瑙河下游方向的空域、航运与保险风险抬升，对经该区域转运的货物航线与保单安排构成压力。", "table": [["坠落地点", "罗马尼亚苏恰瓦县（玉米地）"], ["过程", "无人机先进入摩尔多瓦领空，罗方紧急起飞 F-16"], ["伤亡", "无人员伤亡通报"], ["同期", "保加利亚将 «Емко» 军工厂爆炸定性为可能的破坏行为"]], "sourceFull": "https://www.kommersant.ru/doc/8953544"}, {"num": 11, "title": "欧洲气价破 1000 美元／千立方米（2022-12 以来首次）", "source": "РБК", "time": "09-13 02:21", "tag": "local", "tagText": "本地", "summary": "据 RBC 报道，9 月 10 日欧洲交易所 1000 立方米天然气价格突破 1000 美元，为 2022 年 12 月 22 日以来首次。俄总统对外投资与经济合作特使德米特里耶夫称，欧洲气价飙升是「全球主义意识形态失败」的代价，并借此批评欧洲能源政策；同期匈牙利政府要求欧盟补偿成员国放弃俄能源的成本，芬兰航空则抱怨中国航司可飞越俄领空形成显著成本优势。欧洲能源成本与制造业竞争力差距扩大，对以欧洲为参照的俄市场物价与竞争格局构成间接影响。", "table": [["指标", "欧洲 1000 m³ 天然气交易所价格"], ["首破 1000 美元", "2026-09-10"], ["上一次", "2022-12-22"], ["俄方表态", "德米特里耶夫：系「全球主义失败」的代价"]], "sourceFull": "https://www.rbc.ru/politics/13/09/2026/6aa5de309a79478febcbb9e2"}, {"num": 12, "title": "俄央行官方汇率 9-12：美元 84.2569、欧元 97.8728、人民币 12.5519", "source": "俄央行", "time": "09-12 15:00", "tag": "local", "tagText": "本地", "summary": "俄罗斯央行公布 9 月 12 日官方汇率：美元 84.2569 卢布、欧元 97.8728 卢布、人民币 12.5519 卢布，美元较 9 月 11 日的 84.35 小幅走低，欧元维持在 98 下方。卢布当月整体在高位区间震荡：中东局势推升油价（9-11 Brent 收 108.59 美元/桶，5 月以来最高）与能源出口收入对卢布形成支撑，而美国「地狱制裁」法案审议与资本外流风险构成压制。对跨境卖家而言，人民币兑卢布 12.55 的水平直接决定采购成本与回款结汇收益，建议按此区间重算毛利与报价弹性。", "table": [["美元 USD", "84.2569（较 9-11 的 84.35 微降）"], ["欧元 EUR", "97.8728（继续在 98 下方）"], ["人民币 CNY", "12.5519"], ["来源", "俄罗斯央行官方牌价（cbr.ru XML_daily）"]], "sourceFull": "https://www.cbr.ru/currency_base/daily/"}, {"num": 13, "title": "食品价格监测入法：2027-01-01 起政府监测部分食品价格形成", "source": "РИА Новости", "time": "09-13 03:00", "tag": "local", "tagText": "本地", "summary": "俄新社报道，已公布的联邦法律规定自 2027 年 1 月 1 日起对部分食品价格的形成实施监测：政府将批准需监测的食品清单，并确定负责评估与分析价格动态及成因的联邦执行机关清单；相关机关还将获得经营主体关于食品销售与供应、利润、收入与支出的数据。这是俄在年通胀持续高于目标（8 月年通胀 6.33%、8 月物价环比 -0.08%）背景下强化价格管理的新工具，也意味着零售与平台经营的数据报送义务向价格与利润维度扩展，食品类目卖家与分销商应提前评估合规与数据准备成本。", "table": [["生效", "2027-01-01"], ["依据", "已正式公布的联邦法律"], ["监测对象", "政府确定的食品清单"], ["数据报送", "销售与供应情况、利润、收入与支出"]], "sourceFull": "https://ria.ru/20260913/tseny-2117363974.html"}, {"num": 14, "title": "央行：数字卢布大规模上线运行平稳；现金需求上升源于网络中断、税务变化与「传闻焦虑」", "source": "Коммерсантъ", "time": "09-11 15:56", "tag": "local", "tagText": "本地", "summary": "央行行长纳比乌林娜在 9 月 11 日议息会后的记者会上表示，数字卢布的大规模上线运行平稳，最初几天出现的点状技术问题已经解决。她同时解释俄罗斯现金需求上升的原因，包括移动网络中断、税务规则变化，以及「围绕各类传闻的焦虑情绪」。数字支付与现金并行既反映基础设施承压（移动互联网中断已成多地常态），也提示零售端需要维持多通道收付能力；平台与店铺结算链路对数字卢布的支持节奏值得持续跟踪，尤其是 FBS 自发货卖家的到账时效。", "table": [["数字卢布", "大规模上线运行平稳，初期点状问题已解决"], ["现金需求", "上升"], ["归因", "移动互联网中断、税务规则变化、「传闻焦虑」"], ["表态人", "央行行长纳比乌林娜"]], "sourceFull": "https://www.kommersant.ru/doc/8952818"}, {"num": 15, "title": "德国因放弃俄气累计支出 504 亿欧元", "source": "Коммерсантъ", "time": "09-11 13:37", "tag": "local", "tagText": "本地", "summary": "德国联邦财政部在回应联邦议院「绿党」议员质询时披露，德国为应对因停止俄罗斯天然气供应而引发的能源危机，已累计支出 504 亿欧元。匈牙利政府同日表示将争取欧盟对成员国放弃俄能源的补偿，并计划把相关要求写入文件。这笔账单是欧洲「能源脱钩」总成本的一个侧面；叠加 9-10 欧洲气价破 1000 美元／千立方米与国际能源署下调石油供给预估，欧洲制造业与物流成本压力仍将持续，间接影响俄市场物价与竞争格局。", "table": [["金额", "504 亿欧元"], ["用途", "应对停止俄气供应引发的能源危机"], ["来源", "德国联邦财政部（回应联邦议院质询）"], ["同期", "匈牙利争取欧盟补偿弃俄能源成本"]], "sourceFull": "https://www.kommersant.ru/doc/8952594"}, {"num": 16, "title": "ФАС：石油产品场外交易自愿登记 10 天「零申报」，2027-03 起转为强制", "source": "Коммерсантъ", "time": "09-11 01:44", "tag": "local", "tagText": "本地", "summary": "《生意人报》获悉，俄反垄断局推出的石油产品场外交易自愿登记制度在最初十天没有收到任何合同申报，而该程序将于 2027 年 3 月起转为强制。此前燃料市场因炼厂非计划检修与出口限制持续紧张，政府已自 9 月 1 日起允许加油站销售 Euro-2~5 低标号燃油；监管层希望通过登记掌握场外成交价格、抑制价格操纵。对依赖干线物流的卖家，燃油价格向运价的传导机制将更透明，但短期运价上浮压力并未缓解，旺季前建议锁定运力。", "table": [["自愿登记首 10 天", "零合同申报"], ["强制时间", "2027-03 起"], ["主管", "联邦反垄断局（ФАС）"], ["背景", "9-1 起允许加油站售 Euro-2~5 低标号燃油"]], "sourceFull": "https://www.kommersant.ru/doc/8941318"}, {"num": 17, "title": "Минпромторг：俄、中、印正磋商北方海航道（СМП）航运合作", "source": "РИА Новости", "time": "09-12 20:30", "tag": "local", "tagText": "本地", "summary": "俄新社援引工贸部消息，俄罗斯、中国与印度正就北方海航道（СМП，北极东北航道）的航运合作进行磋商。在西方制裁、红海—苏伊士—地中海方向风险上升的背景下，北极航线对俄能源与大宗商品东向出口的战略价值进一步提升，涉及破冰船队、沿线港口与保险安排等具体议题。对在俄经营的中国卖家，中远期经北极航线的备选物流通道与运价结构值得关注，但季节性通航窗口、保险可得性与港口能力仍是现实瓶颈。", "table": [["议题", "北方海航道（北极东北航道）航运合作"], ["参与方", "俄罗斯、中国、印度"], ["主管", "俄工贸部（Минпромторг）"], ["背景", "制裁下东向通道重要性上升"]], "sourceFull": "https://ria.ru/20260912/rossija-2117317596.html"}, {"num": 18, "title": "中东通道风险：伊朗提出开放霍尔木兹海峡七个条件，克宫警告曼德海峡「超级升级」", "source": "Коммерсантъ", "time": "09-12 17:12", "tag": "local", "tagText": "本地", "summary": "伊朗媒体 Tasnim 报道称，伊方向美国提出开放霍尔木兹海峡的七个条件；俄总统新闻秘书佩斯科夫表示，克宫对巴布-埃尔-曼德海峡的失稳感到担忧，并称该地区存在「超级升级」风险。此前沙特因无人机威胁暂停了「东西」输油管道运行，胡塞武装控制了曼德海峡，英国海事贸易行动办公室（UKMTO）通报霍尔木兹海峡有船只遭射击，国际油价维持高位（9-11 Brent 收 108.59 美元/桶，5 月以来最高）。两大海峡同时受扰意味着全球海运与能源供应链溢价将持续，运价与保险费率上行会逐级传导至俄进口商品成本。", "table": [["伊朗条件", "7 项（Tasnim 报道）"], ["克宫表态", "佩斯科夫：存在「超级升级」风险"], ["沙特", "因无人机威胁暂停「东西」输油管道"], ["海事", "UKMTO 通报霍尔木兹海峡有船只遭射击"], ["Brent（9-11）", "108.59 美元/桶（5 月以来最高）"]], "sourceFull": "https://www.kommersant.ru/doc/8953481"}, {"num": 19, "title": "美国亚利桑那州起诉 L'Oréal：指其护发产品存在致癌风险", "source": "РИА Новости", "time": "09-12 15:00", "tag": "local", "tagText": "本地", "summary": "俄新社报道，美国亚利桑那州已对化妆品巨头 L'Oréal 提起诉讼，指其护发产品存在致癌风险。此类诉讼通常聚焦产品成分安全性、标签与披露义务，若推进可能引发美国市场的下架、召回与更广泛的合规审查。对俄市场而言，L'Oréal 在俄业务此前已受地缘政治与渠道变化影响，本次事件以品牌合规与声誉风险为主。经营同类护发、染发与造型品类的卖家，应同步复核自有商品的成分合规文件与进口报关资料，避免被平台连带排查下架。俄罗斯本土美妆市场本期无其他新增重大动态。", "table": [["起诉方", "美国亚利桑那州"], ["被诉方", "L'Oréal（欧莱雅）"], ["事由", "护发产品致癌风险"], ["对卖家", "复核成分合规文件与进口报关资料，避免连带排查"]], "sourceFull": "https://ria.ru/20260912/loreal-2117285308.html"}, {"num": 20, "title": "新款 iPhone 预售诈骗预警：专家给出四条防骗要点", "source": "РИА Новости", "time": "09-13 02:40", "tag": "local", "tagText": "本地", "summary": "俄「Солар」集团外部数字威胁监测中心发展总监武拉斯科向俄新社表示，新款 iPhone 上市成为「诈骗的完美由头」——短期内大量用户同时搜索价格、预购与到货时间，给钓鱼站点与假预售带来可乘之机。他给出四条建议：自行打开熟悉的应用或手动输入网址、不要点击广告链接；将预购与开售日期同厂商官方公告核对；绝不向任何人透露 Apple 账号密码、双重验证码、恢复密钥或设备码；锁图标与 HTTPS 仅证明连接加密，不代表网站所有者可信。经营 3C 品类的卖家可在店铺公告同步此类提示，降低售后纠纷与差评风险。", "table": [["风险场景", "新款 iPhone 预售期"], ["专家", "«Солар» 集团 А. Вураско"], ["要点", "手动输入网址；核对官方日期；不透露验证码／恢复密钥"], ["提示", "HTTPS 与锁图标 ≠ 网站可信"]], "sourceFull": "https://ria.ru/20260913/moshenniki-2117360280.html"}, {"num": 21, "title": "«Билайн»：5G 商用需求将由工业、矿业与油气驱动", "source": "РИА Новости", "time": "09-11 16:20", "tag": "local", "tagText": "本地", "summary": "«Билайн» 向俄新社表示，5G 的首批商业需求将主要来自工业数字化改造、采矿业与油气行业，属于企业专网（Private 5G）与场景化应用，而非消费端的流量升级；公司此前预计 2027 年俄 5G 市场为 350-450 亿卢布，其中 Private 5G 约 130-160 亿卢布。与之呼应，俄已于 9 月正式商用 5G（4 家运营商、16 城、约 1000 万用户），年底前计划再增 50 城，Android 用户将先行获得接入（iPhone 取决于 Apple）。对电器与智能硬件卖家，5G 的 B 端（专网、工业物联网设备）机会显著大于 C 端换机潮。", "table": [["驱动行业", "工业数字化改造、采矿业、油气"], ["预测方", "«Билайн»（Вымпелком）"], ["2027 年 5G 市场", "350-450 亿卢布（Private 5G 约 130-160 亿）"], ["商用现状", "4 家运营商、16 城、约 1000 万用户；年底再增 50 城"]], "sourceFull": "https://ria.ru/20260911/bilayn-2117130862.html"}, {"num": 22, "title": "ГК «Элемент»：旗下 «Нанотроника» 裁员属「点状优化」", "source": "Коммерсантъ", "time": "09-12 13:19", "tag": "local", "tagText": "本地", "summary": "《生意人报》报道，俄微电子集团 «Элемент» 负责公司治理、法务与产权事务的副总裁表示，旗下 АО «Нанотроника» 确实在进行人员优化，但「纯属点状」性质，并非系统性的规模裁员。俄微电子行业在制裁条件下承担进口替代任务，但订单节奏、设备与材料供应波动导致局部人力调整。对电器类目卖家而言，本土微电子产能的稳定性直接关系本土品牌整机的供货连续性；若国产整机供给放缓，进口渠道的份额与定价空间可能回升，可作为旺季备货的判断变量。", "table": [["主体", "ГК «Элемент» / АО «Нанотроника»"], ["官方口径", "「纯属点状」，非系统性规模裁员"], ["行业", "俄罗斯微电子（进口替代）"], ["对卖家", "关注本土品牌整机供货连续性"]], "sourceFull": "https://www.kommersant.ru/doc/8953403"}]}
