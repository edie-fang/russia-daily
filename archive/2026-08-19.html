l"}, {"num": 10, "title": "俄7月对印煤炭出口同比+2.9倍至362万吨", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-19 02:11", "summary": "BigMint数据：7月俄对印煤炭出口362万吨（同比+2.9倍），其中炼焦煤180万吨（+3倍）、动力煤182万吨（+2.5倍），环比分别+50%/+21%，增幅居各主要出口国之首；前7月动力煤累计720万吨（+48%），居对印供应第四。俄煤凭借折扣与运费优势持续抢占印度市场，能源出口多元化深化。", "table": [["7月对印出口", "362万吨（+2.9倍）"], ["炼焦煤", "180万吨（+3倍）"], ["动力煤", "182万吨（+2.5倍）"]], "sourceFull": "https://www.kommersant.ru/doc/8892187"}, {"num": 11, "title": "俄钻石对印出口上半年近乎腰斩", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-19 04:13", "summary": "据《Vedomosti》援引数据：2026年上半年俄对印钻石出口较去年同期近乎减半。印度为俄钻石主要加工转口市场，出口收缩反映制裁压力、结算困难与行业库存调整叠加影响，俄钻石出口通道持续承压（标题级收录，具体数值待核实）。", "table": [["上半年对印出口", "近乎减半"], ["收录级别", "标题级（数值待核实）"]], "sourceFull": "https://tass.ru/ekonomika/28023855"}, {"num": 12, "title": "美商务部下调阿帕季特磷肥反补贴税至22.86%", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-18 23:28", "summary": "8/18美商务部依美国际贸易法院裁决发布公告：将俄磷肥公司阿帕季特2020-2021年度进口反补贴税从28.50%下调至22.86%。对俄化肥输美个案税率下调属执行司法裁决，整体对俄贸易壁垒格局未变，信号意义大于实质影响。", "table": [["税率", "28.50%→22.86%"], ["年度", "2020-2021"], ["依据", "美国际贸易法院裁决"]], "sourceFull": "https://ria.ru/20260818/ssha-2111689460.html"}, {"num": 13, "title": "阿联酋暂停与伊朗全部贸易金融往来", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-18 23:33", "summary": "8/18阿联酋外交部战略传播司司长表示：已暂停与伊朗的所有贸易与金融活动直至另行通知，此前伊朗导弹袭击阿联酋港口基础设施（未命中）。海湾局势升温强化霍尔木兹风险溢价，对油价与全球能源物流构成支撑，间接利好俄能源出口收入。", "table": [["措施", "暂停全部贸易金融往来"], ["背景", "伊朗导弹袭击阿联酋港口未命中"]], "sourceFull": "https://ria.ru/20260818/oae-2111689809.html"}, {"num": 14, "title": "央行研究：俄经济潜在增速1.3–1.5%/年", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-19 01:45", "summary": "央行研究团队发布《俄经济潜在产出：2026年评估》：俄经济潜在增速中位数约1.3~1.5%/年；现行官方预测不变（2026年GDP +0~1%，其后三年1.5~2.5%），但研究显示2.5%上限需结构性改革支撑。高利率约束下俄中长期增长空间受限，消费与投资类目增长预期趋于保守。", "table": [["潜在增速", "1.3-1.5%/年"], ["2026官方预测", "+0~1%"]], "sourceFull": "https://www.kommersant.ru/doc/8892334"}, {"num": 15, "title": "Минстрой与央行拟规范开发商长期分期销售", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-18 20:57", "summary": "8/18俄建设部与央行联合起草法案，规范开发商向购房者提供的长期分期：房屋交付后产权可过户至买家，但分期付清前房产抵押给开发商（现行制度须全额付清方可过户）。央行指分期缺乏透明核算、买家寄望利率下调后转按揭存在风险。分期制度规范化或影响购房支付结构与交房后家居/家电置办节奏。", "table": [["主体", "Минстрой+央行"], ["机制", "交房过户、付清前抵押开发商"], ["目的", "规范长期分期销售"]], "sourceFull": "https://www.kommersant.ru/doc/8892351"}, {"num": 16, "title": "商界请求政府支持受无人机袭击影响的纺织业", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-19 05:06", "summary": "8/19俄企业界向政府提交支持纺织业的措施建议，因无人机袭击冲击行业生产与仓储（标题级收录）。纺织服装为俄电商核心品类，若支持措施（类似AKIT提议的税收/信贷支持）落地，相关卖家资金链有望边际改善。", "table": [["背景", "无人机袭击冲击生产仓储"], ["诉求", "政府支持措施"], ["收录级别", "标题级"]], "sourceFull": "https://tass.ru/ekonomika/28023959"}, {"num": 17, "title": "央行再度上调官方美元汇率", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-18 17:39", "summary": "8/18俄央行再次上调官方美元汇率（具体数值待核实），延续卢布贬值趋势（8/17场外美元已升至85.44卢布、人民币12.69）。官方汇率连续上调确认卢布弱势，进口成本与在俄商品定价压力继续累积。", "table": [["动作", "官方汇率再度上调"], ["数值", "待核实"], ["背景", "8/17场外美元85.44、人民币12.69"]], "sourceFull": "https://lenta.ru/news/2026/08/18/bank-rossii-vnov-povysil-kurs-dollara/"}, {"num": 18, "title": "美妆栏目：本期无新增重大动态", "tag": "local", "tagText": "本地", "source": "综合检索", "time": "08-19 10:00", "summary": "2026年8月17-19日窗口内，RIA/Lenta/TASS/Interfax/Kommersant检索（含косметика/парфюмерия/уход关键词）未见俄罗斯美妆市场新增重大新闻（Lenta名人无妆照类八卦软文不计）。按去重规则标注：本期无新增重大动态，不填充旧信息。", "table": [], "sourceFull": ""}, {"num": 19, "title": "电器栏目：本期无新增重大动态", "tag": "local", "tagText": "本地", "source": "综合检索", "time": "08-19 10:00", "summary": "2026年8月17-19日窗口内，RIA/Lenta/TASS/Interfax/Kommersant检索（含электроника/бытовая техника关键词）未见俄罗斯电器市场新增重大新闻（Lenta消费向电视隐藏设置类软文不计）。按去重规则标注：本期无新增重大动态，不填充旧信息。", "table": [], "sourceFull": ""}, {"num": 20, "title": "灯具栏目：本期无新增重大动态", "tag": "local", "tagText": "本地", "source": "综合检索", "time": "08-19 10:00", "summary": "2026年8月17-19日窗口内，RIA/Lenta/TASS/Interfax/Kommersant检索（含светильник/освещение/LED/лампы关键词）未见俄罗斯灯具照明市场新增重大新闻。按去重规则标注：本期无新增重大动态，不填
