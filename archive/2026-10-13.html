{"date": "2026-10-13", "stats": {"total": 16, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "cat": "platform", "catText": "平台规则变动", "title": "三大平台接入「Честный знак」追溯核验：商品上架前自动比对追溯码", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "10-12 10:40", "summary": "据 Vedomosti 10-12 报道，Ozon、Wildberries、Яндекс Маркет 已获得国家商品追溯系统「Честный знак」(ГИС МТ) 的核验访问权限，可在商品上架前自动比对商品卡申报的追溯码与 ГИС МТ 登记状态。该能力落地 2026-10-01 生效的《平台经济法》(289-ФЗ) 及政府商品卡统一核验决议的口径要求：平台须对商品卡关键信息自动核验，不一致者拒绝收录/隐藏；存量商品卡留有过渡期。含义：强制追溯品类（化妆品、个护、家电等）卡片 GTIN 与 ГИС МТ 登记不一致将直接被下架，不合规 listing 加速出清。", "table": [["⏱ 生效时间", "2026-10-12（接口接入）；存量商品卡过渡期约 180 天（至 2027 年 3 月前后）"], ["🎯 实际影响", "上架与合规环节：强制追溯品类商品卡的追溯码/GTIN 与 ГИС МТ 登记不一致将被隐藏或下架，不合规 listing 加速出清"], ["✅ 建议动作", "10 月内逐 SKU 核对商品卡 GTIN 与 ГИС МТ/Честный знак 登记一致，并确认店铺已完成 Честный знак 参与人注册"]], "sourceFull": "https://www.vedomosti.ru/technology/news/2026/10/12/1236221-dostup-k-sisteme-proverki"}, {"num": 2, "cat": "ecom", "catText": "电商动态", "title": "Ozon 就误发结算通知致歉：部分卖家收到「停止付款」错误提示", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-12 17:00", "summary": "Ozon 10-12 就系统误发给卖家的结算通知公开致歉。此前部分卖家收到「将停止付款/结算失败」类错误提示，一度引发回款恐慌；平台确认系技术误报，实际结算与打款未受影响，并称已修复推送逻辑。该事件紧随 Wildberries 自提点回款延迟争议（10-11 报道）之后，卖家对平台结算系统稳定性的敏感度明显上升。含义：平台结算系统的技术故障也会通过错误通知放大卖家侧恐慌，跨境卖家需建立「以对账单为准」的核对机制，避免因误报打乱资金与备货安排。", "table": [["主体", "Ozon 卖家（收到误发结算通知）"], ["性质", "技术误报，结算未受影响"], ["时间", "2026-10-12"]], "sourceFull": "https://www.retail.ru/news/ozon-izvinilsya-za-oshibochnye-uvedomleniya-prodavtsam-o-nevyplatakh-12-oktyabrya-2026-283208/"}, {"num": 3, "cat": "ecom", "catText": "电商动态", "title": "俄自提点(ПВЗ)运营成本一年上涨约 20%，末端网络扩张放缓", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-12 12:55", "summary": "Retail.ru 10-12 报道，俄罗斯自提点(ПВЗ)运营成本同比上升约 20%（租金、人力、设备与安防支出为主）。叠加平台提货点扩张放缓（年增约 25%、全国约 26 万处），末端网络正从「跑马圈地」转向精细化运营。含义：自提点覆盖率增速放缓可能拉长偏远地区到货时效，部分点位或因成本压力退出或合并；跨境卖家需关注主力销售区域的点位稳定性与派送半径，旺季前评估是否加投末端网络已饱和地区的自有交付方式。", "table": [["ПВЗ 运营成本", "同比约 +20%"], ["全国 ПВЗ 数量", "约 26 万处（年增约 25%）"]], "sourceFull": "https://www.retail.ru/news/raskhody-na-soderzhanie-punktov-vydachi-zakazov-v-rossii-vyrosli-na-20--12-oktyabrya-2026-283196/"}, {"num": 4, "cat": "ecom", "catText": "电商动态", "title": "「Яндекс」故障波及零售与配送：分析师评估损失，履约一度中断", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-12 15:56", "summary": "10-12 分析师评估 10-11 «Яндекс» 数据中心遇袭引发的服务中断对零售与配送造成的损失：依赖 Яндекс 云、支付与调度服务的零售商与配送平台一度中断，自提点下单、配送排程与结算受影响。含义：平台订单与结算高度依赖第三方云基础设施，一旦中断将直接造成履约延迟、面单缺失与售后压力；旺季尤需预设备用收款通道、人工兜底流程与订单积压的补发排期。", "table": [["受影响环节", "下单/配送调度/结算"], ["触发事件", "10-11 «Яндекс» 弗拉基米尔数据中心遇袭"]], "sourceFull": "https://www.retail.ru/news/sboy-yandeksa-zatronul-riteyl-i-dostavku-analitiki-otsenili-ushcherb-12-oktyabrya-2026-283205/"}, {"num": 5, "cat": "ecom", "catText": "电商动态", "title": "「Яндекс Пэй」部分恢复运行：数据中心遇袭后支付通道仍不稳定", "tag": "local", "tagText": "本地", "source": "Interfax", "time": "10-13 04:32", "summary": "Interfax 10-13 报道，在数据中心遭袭后，«Яндекс Пэй» 支付服务已部分恢复运行，但尚未完全正常。10-11 «Яндекс» 位于弗拉基米尔的数据中心遇袭（一周内第三座，此前为梁赞州与卡卢加），导致其支付、广告及部分云服务中断，10-12 平台已就相關订单与广告功能缺失发过公告。含义：使用 «Яндекс Пэй» 或 Яндекс Market 结算的卖家本周须预设备用收款方式，并持续跟踪平台公告的订单处理与付款补偿机制。", "table": [["服务状态", "部分恢复（未完全正常）"], ["受损设施", "弗拉基米尔数据中心（一周内第三座）"]], "sourceFull": "https://www.interfax.ru/russia/1121979"}, {"num": 6, "cat": "ecom", "catText": "电商动态", "title": "Сбербанк 申请宣告公路承运商 «Евротранс» 破产", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "10-12 22:00", "summary": "Сбербанк 10-12 向法院提交申请，要求宣告俄罗斯大型公路货运企业 «Евротранс» 破产。该承运商长期承接俄境内干线运输业务，若进入破产程序，其运力与在手运单可能受波及。含义：若干线或 FBS 发货链路使用 «Евротранс» 或其分包运力，需尽快核查在手运单、押金与预付款，并预留替代承运商，避免 Q4 旺季干线中断造成到仓延迟与订单超时。", "table": [["申请人", "Сбербанк"], ["对象", "承运商 «Евротранс»"]], "sourceFull": "https://www.vedomosti.ru/finance/news/2026/10/12/1236471-sberbank-podal-isk"}, {"num": 7, "cat": "appliance", "catText": "家电电器", "title": "中国进口笔记本电脑价格上涨约 10%", "tag": "local", "tagText": "本地", "source": "Izvestia", "time": "10-13 00:40", "summary": "Izvestia 10-13 报道，从中国进口的笔记本电脑均价上涨约 10%，与内存/存储芯片涨价、汇率及物流成本上行有关。此前多方报道已提示 2027 年入门手机（<$400）供给收缩、路由器与充电宝等因内存短缺成本上行。含义：电器/数码类目的采购与定价成本上升，经营笔记本及数码配件的卖家需重新核算毛利，评估调价、调整 SKU 结构或提前锁定 Q4 采购价与库存。", "table": [["中国进口笔记本", "价格约 +10%"]], "sourceFull": "https://iz.ru/2183147/2026-10-13/postavliaemye-iz-knr-noutbuki-vyrosli-v-tcene-na-10"}, {"num": 8, "cat": "econ", "catText": "经济金融", "title": "官方美元汇率跌破 84 卢布：10-13 USD/RUB = 83.9153", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "10-12 18:17", "summary": "俄央行公布 10-13 官方汇率为 1 美元 = 83.9153 卢布（欧元 94.0355、人民币 12.5360），美元自 10-12 起跌破 84 关口。卢布走强与油价上行及油品出口预期改善相关。含义：人民币换卢布成本下降有利于采购与结算，但卢布快速升值会压缩以卢布计价收入折算人民币后的利润；建议按月执行汇率锁定（公司现行月度锁汇口径），并在定价模型中同步更新汇率参数。", "table": [["USD/RUB", "83.9153"], ["EUR/RUB", "94.0355"], ["CNY/RUB", "12.5360"]], "sourceFull": "https://www.vedomosti.ru/finance/news/2026/10/12/1236423-kurs-dollara"}, {"num": 9, "cat": "econ", "catText": "经济金融", "title": "Brent 盘中回升至 105.6 美元/桶", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "10-12 10:23", "summary": "Vedomosti 10-12 报道，Brent 原油盘中一度上涨至 105.6 美元/桶；同日另报油价在泽连斯基拒绝能源停火提议的消息后进一步走高。油价上行推高运输与包装成本，同时支撑卢布汇率。含义：Q4 干线运价与燃油附加费或继续承压，建议在旺季物流报价中保留燃油浮动条款，并把油价情景（100/105/110 美元）纳入成本敏感性测算。", "table": [["Brent", "≈105.6 美元/桶（10-12 盘中）"]], "sourceFull": "https://www.vedomosti.ru/investments/news/2026/10/12/1236212-neft-podorozhala"}, {"num": 10, "cat": "econ", "catText": "经济金融", "title": "仓储险费率三季度环比涨近 7 倍：无人机风险推高仓损自保成本", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "10-13 07:00", "summary": "据 Vedomosti 10-13 报道（Полис.онлайн 与 Рентал про 联合研究），2026 年三季度俄仓储险平均费率环比近乎上涨 7 倍，达保额的约 2%，同比涨幅 13–20 倍；A 级干仓费率由 6 月的 0.08–0.15% 升至 9 月的 3–5%，1 亿卢布保额对象的保费由 80–150 万卢布升至 3000–5000 万卢布。主因是国家再保险公司 РНПК 自 7 月将 1 万㎡ 以上仓库列入高风险，并自 10-01 起把 БПЛА 风险赔付上限压至保额 20%（多数仓库）。含义：仓损保险成本与免赔额显著上升，叠加 Ozon 10-13 停保，卖家自保比重加大，需重估库存集中度与仓损敞口。", "table": [["Q3 仓储险平均费率", "≈保额 2%（环比近 +7 倍）"], ["同比涨幅", "13–20 倍"], ["A 级干仓费率", "0.08–0.15%（6月）→ 3–5%（9月）"], ["РНПК БПЛА 赔付上限", "保额 20%（10-01 起）"]], "sourceFull": "https://www.vedomosti.ru/finance/articles/2026/10/13/1236473-strahovanie-skladov-podorozhalo"}, {"num": 11, "cat": "econ", "catText": "经济金融", "title": "政府从储备基金向 «Почта России» 拨款 70 亿卢布", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "10-12 17:29", "summary": "俄政府决定从储备基金拨出 70 亿卢布支持 «Почта России»。该国企近年持续亏损、网点维护成本高企，此前亦讨论通过提高养老金配送佣金等方式增收。含义：邮政网络是偏远地区与经济型配送的重要兜底，资金注入有助于维持网点与时效；但长期看「普惠配送」成本仍可能向寄件方转嫁，需关注其后续费率调整对偏远订单履约成本的影响。", "table": [["拨款金额", "70 亿卢布"], ["来源", "政府储备基金"]], "sourceFull": "https://www.vedomosti.ru/investments/news/2026/10/12/1236395-pochte-7-mlrd"}, {"num": 12, "cat": "econ", "catText": "经济金融", "title": "央行：压缩预算赤字有助于下调关键利率", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "10-12 12:40", "summary": "俄央行副行长 Заботкин 10-12 表示，压缩预算赤字将有助于降低关键利率与通胀。当前关键利率为 14%（9-11 会议维持不变），市场关注 10 月议息是否继续降息。含义：融资成本（受损卖家优惠贷款、平台账期与分期）及消费信贷环境取决于降息节奏，Q4 备货融资与促销分期方案可按「关键利率缓降」情景预排，并同步跟踪 РНПК 再保险与仓储险成本变化。", "table": [["当前关键利率", "14%"], ["信号", "压赤字→利降息"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/10/12/1236262-snizit-stavku"}, {"num": 13, "cat": "politics", "catText": "时政要闻", "title": "克宫：普京愿下令在乌克兰选举日暂停打击", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "10-12 13:56", "summary": "克宫 10-12 表示，普京愿就乌克兰选举日下令暂停对乌打击，前提是乌方对等回应。此前泽连斯基提议在选举期间实现能源与军事停火，特朗普亦介入推动。含义：若出现局部停火窗口，南部与边境地区物流时效与安全风险或短期改善，可据此微调旺季备货节奏与运力预订，但不宜将停火视作长期确定性，库存分散与备用仓预案仍须保留。", "table": [], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/10/12/1236306-ne-nanosit-udari"}, {"num": 14, "cat": "politics", "catText": "时政要闻", "title": "欧盟通过对俄第 22 轮制裁：含 GAZ 与新当选杜马议员", "tag": "local", "tagText": "本地", "source": "Kommersant", "time": "10-12 19:35", "summary": "欧盟 10-12 正式通过新一轮（第 22 轮）对俄制裁，与美方「优先和谈」的立场形成对冲。本轮措施包括对高尔基汽车厂(GAZ)、部分新当选国家杜马议员等主体的限制（Vedomosti 10-12 14:24 / Lenta 10-12 21:14）。含义：涉汽车及零部件、双用途商品的采购与结算通道或再收紧，需核查供应链中是否触及新列名主体，评估二级制裁与合规审查风险。", "table": [], "sourceFull": "https://www.kommersant.ru/doc/9024942"}, {"num": 15, "cat": "politics", "catText": "时政要闻", "title": "无人机袭击斯塔夫罗波尔边疆区工业区，13 架飞向莫斯科无人机被击落", "tag": "local", "tagText": "本地", "source": "Interfax", "time": "10-13 03:17", "summary": "Interfax 10-13 报道，俄方在斯塔夫罗波尔边疆区涅温诺梅斯克工业区及松涅奇诺多尔斯克方向抵御无人机袭击；同期另有 13 架飞向莫斯科的无人机在接近时被击落（Interfax 10-13 03:43）。该地区此前曾有平台仓库遇袭记录。含义：南部与高加索方向的干线时效与仓库安全风险依然偏高，库存分散与备用仓预案需覆盖该区域，并预留末端派送延迟的客服话术。", "table": [], "sourceFull": "https://www.interfax.ru/russia/1121971"}, {"num": 16, "cat": "politics", "catText": "时政要闻", "title": "俄美启动柴油供应谈判，外界预期莫斯科或走出制裁孤立", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "10-13 01:16", "summary": "Lenta 10-13 报道，俄罗斯与美国已就向全球市场供应柴油启动谈判，外界认为这可能意味着莫斯科逐步走出制裁孤立；此前有报道称现行制裁并不妨碍柴油供应。含义：油品出口预期改善有助于卢布与物流成本稳定，但制裁框架（含第 22 轮）尚未松动，不宜据此调整合规与结算策略，应继续按「制裁长期化」情景管理供应链与收款。", "table": [], "sourceFull": "https://lenta.ru/news/2026/10/12/long-rossiya-i-ssha-nachali-peregovory-o-postavkah-dizelya-na-mirovye-rynki-kak-eto-skazhetsya-na-vnutrennem-rynke/"}]}
</script>
