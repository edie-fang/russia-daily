cs/news/2026/11/11/1244582-es-soglasovali-sanktsii", "url": "https://www.vedomosti.ru/politics/news/2026/11/11/1244582-es-soglasovali-sanktsii"}, {"num": 15, "title": "连续夜袭：11-09 基里希 КИНЕФ 1 死、11-11 141 架致普尔科沃停摆、11-12 夜莫斯科 59 架", "tag": "local", "tagText": "本地", "source": "Ведомости / РИА Новости（本地）", "time": "11-13 00:22", "summary": "本周俄西北与中部空袭持续：11-09 凌晨列宁格勒州基里希工业区与 КИНЕФ 炼厂被命中、1 人死亡，当夜全俄击落 430 架；11-11 凌晨该州击落 141 架，普尔科沃机场一度停摆、5 班延误；11-12 夜至 13 日凌晨莫斯科方向击落 59 架，谢列梅捷沃限流至 02:57 解除，布良斯克 1 死、罗斯托夫 1,500㎡ 仓库与生产车间起火（均非平台仓）。", "table": [["🚁 11-09", "全俄击落 430 架；基里希 КИНЕФ 被命中，1 死"], ["✈️ 11-11", "列宁格勒州击落 141 架，普尔科沃停摆、5 班延误"], ["🌃 11-12 夜", "莫斯科方向 59 架，谢列梅捷沃限流至 02:57"], ["🔥 其它", "布良斯克 1 死；罗斯托夫 1,500㎡ 仓库起火（非平台仓）"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/11/13/1245000-na-podlete", "url": "https://www.vedomosti.ru/politics/news/2026/11/13/1245000-na-podlete"}]}, {"icon": "📊", "name": "经济", "items": [{"num": 16, "title": "纳比乌林娜：利率还将高位维持、2026 年 GDP ≤1%、2027 年全年两位数", "tag": "local", "tagText": "本地", "source": "Ведомости（本地）", "time": "11-12 13:43", "summary": "央行行长纳比乌林娜在杜马称，关键利率已高企三年、还将「维持一段时间」，从经济、公民与企业利益看是合理的；10-23 央行连续第二次暂停降息、维持 14%。她表示 2026 年 GDP 增速将在 1% 以内；11-09 另称基准情景下 2027 年全年利率仍为两位数。含义：备货资金成本与账期压力不会缓解。", "table": [["🏦 关键利率", "14.00%（10-23 维持）"], ["📉 2026 GDP", "≤1%"], ["📅 2027 利率", "全年两位数（11-09 表态）"], ["🧩 取向", "先压通胀，不急于降息"]], "sourceFull": "https://www.vedomosti.ru/finance/news/2026/11/12/1244792-nabiullina-klyuchevaya-stavka", "url": "https://www.vedomosti.ru/finance/news/2026/11/12/1244792-nabiullina-klyuchevaya-stavka"}, {"num": 17, "title": "11 月 3–9 日通胀 +0.12%：年初至今 6.33%、年化 6.98%，非食品与服装转跌", "tag": "local", "tagText": "本地", "source": "Ведомости（本地）", "time": "11-12 02:40", "summary": "俄统计局：11 月 3–9 日 CPI 环比 +0.12%，年初至今 +6.33%，年化 6.98%（经济发展部口径）。食品 +0.34%（果蔬 +1.6%），非食品 -0.06%、服装 -0.4%、汽油 -0.8%。央行称三季度季调后年化通胀 8%，二季度为 4.8%。", "table": [["📈 周环比", "+0.12%"], ["📅 年初至今", "+6.33%；年化 6.98%"], ["🍎 结构", "食品 +0.34%；非食品 -0.06%；服装 -0.4%；汽油 -0.8%"], ["🏦 央行口径", "Q3  "本地", "source": "MPUP（本地）", "time": "11-11 11:35", "summary": "自 2026-12-01 起，俄拟对电子产品生产商征收「技术 сбор」（技术费），所有市场参与者均须缴纳，卖家需把新增负担计入成本与售价。行业监测未拿到官方公告，具体费率、计税基数与征收办法均待核实，暂不宜按固定百分比测算。", "table": [["⏱ 生效时间", "2026-12-01"], ["🎯 对象", "电子产品生产商（全市场参与者）"], ["❓ 费率", "待核实（未见官方公告）"], ["✅ 建议动作", "在 Q4 成本模型预留变量，公告后再锁定报价"]], "sourceFull": "https://mpup.ru/news/s-1-dekabrya-2026-g-vvoditsya-tehnologicheskiy-sbor-l9soq3xa", "url": "https://mpup.ru/news/s-1-dekabrya-2026-g-vvoditsya-tehnologicheskiy-sbor-l9soq3xa"}, {"num": 24, "title": "Avito：Q3 智能手机 Apple 仍占 59%，Honor +19%、Samsung +9%、Apple -8%", "tag": "local", "tagText": "本地", "source": "Retail.ru（引 «Авито»）（本地）", "time": "11-09 13:56", "summary": "«Авито» Q3 数据：按销量 Apple 居首占 59%，最畅销机型 iPhone 13；Samsung 14%（Galaxy S26 Ultra 最好卖）、Xiaomi 10%（Poco X8 Pro）、HONOR 3%、realme 2%。增速上 Honor +19%、Samsung +9%，Xiaomi -1%、realme -5%、Apple -8%。", "table": [["📱 Apple", "59%（-8%）"], ["📱 Samsung", "14%（+9%）"], ["📱 Xiaomi", "10%（-1%）"], ["📈 最快", "HONOR +19%"]], "sourceFull": "https://www.retail.ru/news/avito-apple-sokhranila-liderstvo-na-rynke-smartfonov-v-iii-kvartale-9-noyabrya-2026-284178/", "url": "https://www.retail.ru/news/avito-apple-sokhranila-liderstvo-na-rynke-smartfonov-v-iii-kvartale-9-noyabrya-2026-284178/"}]}, {"icon": "💡", "name": "灯具", "items": [{"num": 25, "title": "铜进口升水创 2014 年监测以来新高：LME 三个月期铜 13.76 千美元/吨，灯具线缆与驱动再承压", "tag": "local", "tagText": "本地", "source": "Коммерсантъ（引 Platts / S&P Global）（本地）", "time": "11-09 02:31", "summary": "Platts：中国进口精炼铜升水一个月涨 83.3% 至 220 美元/吨，为 2014 年 8 月开始监测以来最高；11-06 LME 三个月期铜报 13.76 千美元/吨。上期所铜库存一周降 17.9% 至 4.461 万吨，中国冶炼厂检修叠加日本减产，现货偏紧。铜是灯具线缆、驱动电源与散热件的核心原料。", "table": [["📈 进口升水", "+83.3% 至 220 美元/吨（一个月）"], ["💵 LME 3M 铜", "13.76 千美元/吨（11-06）"], ["📦 SHFE 库存", "4.461 万吨（周环比 -17.9%）"], ["🏭 供应端", "中国冶炼厂检修 + 日本减产"]], "sourceFull": "https://www.kommersant.ru/doc/9092299", "url": "https://www.kommersant.ru/doc/9092299"}, {"num": 26, "title": "Честный знак 硬门槛：11-30 前须售完未打标库存，12-01 起无线电电子（含智能灯具）不得流通", "tag": "local", "tagText": "本地", "source": "MPUP（引平台公告与行业汇总）（本地）", "time": "11-09 12:00", "summary": "11-01 起智能手机、无线电电子、特种工装、化肥、工业设备、植物油与乳制品进入强制打标；已进货但未打标的库存须在 11-30 前售完或完成标识，12-01 起未打标不得流通。对灯具线，含蓝牙/Wi-Fi 模块的智能灯具、带电子控制与电源模块的照明产品最易被划入无线电电子。", "table": [["⏱ 截止", "未打标库存须在 2026-11-30 前售完或完成标识"], ["🚫 后果", "12-01 起未打标不得流通"], ["🎯 命中", "智能灯具 / 带电子控制与电源模块的照明产品"], ["✅ 建议动作", "11-20 前清点在俄未打标库存与贴码能力，缺码 SKU 先清后补"]], "sourceFull": "https://mpup.ru/news/obyazatelnaya-markirovka-smartfonov-specodezhdy-i-prochih-tovarov-s-1-obhz41pu", "url": "https://mpup.ru/news/obyazatelnaya-markirovka-smartfonov-specodezhdy-i-prochih-tovarov-s-1-obhz41pu"}, {"num": 27, "title": "«Петрович»：68% 的 18–34 岁很少开主灯，台灯/落地灯/LED 灯带成替代", "tag": "local", "tagText": "本地", "source": "Retail.ru（本地）", "time": "11-12 21:09", "summary": "СТД «Петрович» 调查：18–34 岁受访者中 68% 很少开主灯或只在必要时开（18–24 岁 72%、25–34 岁 64%、35–45 岁 43%）。局部照明替代品：台灯 26%、落地灯 19%、LED 灯带 18%、花环与装饰灯 15%；66% 年轻人称局部光够工作学习、58% 够做饭、47% 够家务维修。", "table": [["💡 很少开主灯", "18–34 岁 68%（18–24 岁 72%）"], ["🛋 替代品", "台灯 26% / 落地灯 19% / LED 灯带 18%"], ["🏠 场景", "工作学习 66% / 做饭 58% / 维修 47%"], ["🧩 含义", "主灯需求弱化，局部照明与灯带 SKU 权重上升"]], "sourceFull": "https://www.retail.ru/news/petrovich-68-molodykh-rossiyan-vklyuchayut-verkhnee-osveshchenie-tolko-pri-neobkh-12-noyabrya-2026-284363/", "url": "https://www.retail.ru/news/petrovich-68-molodykh-rossiyan-vklyuchayut-verkhnee-osveshchenie-tolko-pri-neobkh-12-noyabrya-2026-284363/"}]}], "keyData": {"headers": ["指标", "周初（11-09）", "周末（11-13）", "周内变化"], "rows": [["USD/RUB（央行官方）", "82.1386", "82.9803", "卢布贬 1.02%"], ["CNY/RUB（央行官方）", "12.2651", "12.4009", "卢布对人民币贬 1.11%"], ["EUR/RUB（央行官方）", "92.1924", "92.3322", "卢布贬 0.15%"], ["Brent 近月（美元/桶）", "98.55（11-06 收）", "92.50（11-11 收）", "周内低 89.26（11-10），全周 -6.1%"], ["IMOEX 指数", "2467.07（11-06 收）", "2494.77（11-11 收）", "+1.12%"], ["俄央行关键利率", "14.00%", "14.00%", "10-23 连续第二次暂停降息"], ["11 月 3–9 日通胀（周环比）", "—", "+0.12%", "年初至今 6.33%、年化 6.98%"], ["1–10 月预算赤字", "—", "5.23 万亿 ₽（2.3% GDP）", "油气收入 6.44 万亿、同比 -14.1%"], ["1–9 月网络零售", "—", "10.85 万亿 ₽（+16.6%）", "跨境仅占 3.4%"], ["Q3 区域高标仓空置率", "—", "3.4%（含转租）", "空置面积 -45% QoQ 至 48.4 万㎡"], ["全俄自提点（ПВЗ）总量", "—", "27.4 万个", ">80% 人口每月在平台下单"], ["1–10 月外贸额", "—", "5,762 亿美元（+13.9%）", "顺差 1,168 亿、亚洲占 72.1%"], ["黑五参与意愿", "—", "68% 卖家不参加", "68% 买家预算 <5,000 ₽"]]}, "trends": [{"title": "电商物流 / 平台政策：罚则与字段化并行，平台把「合规税」逐项前置", "text": "① 罚则端：Ozon 11-19 起把 FBS 免罚门槛从 5% 压到 2%，并对超 6 小时收货按 0.25–3% 加收装运费、取消 3%/2% 快发折扣，咨询机构估将推高平台价格 3–5%——时效从「加分项」变成「直接计费项」。② 字段端：WB 11-10 起只在 ТН ВЭД 专属字段校验编码，未填即封卡、入仓拒收，并同步要求 FBW 填报关单号与原产国代码、DBS/C&C 填 ОКСМ 国别码；平台经济法落地首月即封禁逾 900 万张商品卡（补件后约半数解封）。商品卡正在从「营销资产」变成「受监管的数据档案」。③ 仓储端：Q3 区域高标仓空置率降至 3.4%、空置面积环比 -45%，大型整块库源消失；叠加 WB 扩大 FBS、上线合作履约中心与收货点（9 月起 100+ 个），旺季的确定性来自「多点小仓 + 自有仓」而非单一大仓。净效应：11-12 月的物流账单与罚则账单不可直接同比，做单品毛利时必须把「时效罚则 + 字段合规 + 分散仓储」三项显性计入。"}, {"title": "平台基础设施与风险：袭击常态化下，平台把库存推向 FBS 与多点分散", "text": "本周无新增平台仓遇袭通报，累计仍为 44 起（WB 22 城 / Ozon 15 城），但空袭本身并未停：11-09 基里希 КИНЕФ 炼厂被命中 1 死、当夜全俄击落 430 架，11-11 列宁格勒州击落 141 架致普尔科沃停摆、5 班延误，11-12 夜莫斯科方向 59 架、谢列梅捷沃限流至 02:57。平台侧的动作是结构性的：WB 在 7-18 袭击估损约 35 万㎡后，把库存分散到多个场地、扩大 FBS 并上线合作履约中心（ПФЦ）与合作收货点（ППТ），称 FBS 时效已优于袭击前。政府 11-12 也把受袭卖家支持口径统一：损失可来自无人机/РСЗО/各类导弹，两平台损失可合并，门槛为超过年收入 5%，受损名单每月 5 日前报 ФНС。对卖家的实操含义：① 单一 SKU 不押一个枢纽；② 保留 акты приёмки 与 УПД 等凭证以备申报；③ 把「FBS 时效」当成旺季的备用主干道，而不只是补充渠道。"}, {"title": "跨境合规：22% НДС 与 ЧЗ 12-01 双线收口，2027 是模式切换点", "text": "① 税：国家杜马 11-10 一读通过自 2027-01-01 起对海外直购按 22% 征 НДС，200 欧元以下包裹同样适用——跨境直购的价格优势被制度性削平，本土仓/FBS 模式的相对价值上升，需在 2027 年前把「直购 vs 本土备货」的临界点算清。② 标识：11-01 起智能手机、无线电电子等进入强制打标，未打标库存只能卖到 11-30，12-01 起不得流通；含蓝牙/Wi-Fi 模块的智能灯具、带电子控制与电源模块的照明产品最易被划入无线电电子，这与上周通报的 12-01 流通数据申报是同一道门槛。③ 申报：WB 11-10 起 ТН ВЭД 与 ДТ 号字段收紧，编码/报关信息不全直接封卡。三条线共同指向「合规数据必须与实物同步」，建议 11-20 前完成一次在俄库存与商品卡的合规盘点。"}, {"title": "经济数据：油价下台阶、通胀回落，但利率还要「高位维持一段时间」", "text": "① 利率：纳比乌林娜在杜马称关键利率已高企三年、还将维持一段时间，2026 年 GDP 增速在 1% 以内，基准情景下 2027 年全年仍为两位数；10-23 已连续第二次维持 14.00%。② 通胀：11 月 3–9 日 CPI 环比 +0.12%、年初至今 +6.33%、年化 6.98%，非食品 -0.06%、服装 -0.4%、汽油 -0.8%——商品端已出现通缩迹象，但央行口径 Q3 季调年化仍为 8%。③ 财政与外需：1–10 月赤字 5.23 万亿卢布（2.3% GDP，去年同期 1.8%），油气收入 6.44 万亿、同比 -14.1%；1–10 月外贸额 5,762 亿美元（+13.9%）、顺差 1,168 亿、亚洲占 72.1%。④ 增长：俄科院维持 2026 年 GDP +0.7%，9 月零售同比 +3.9% 但季调后连续三个月环比下滑。对卖家：需求端不崩但走弱，融资成本与账期压力不减，Q4 定价应按「汇率 82–83、利率 14%、油价 90–95」三变量做敏感性。"}, {"title": "能源价格：Brent 周内破 90、月初 -24%，燃油附加费短期松了口气", "text": "Brent 近月合约 11-09 单日跌 7.45%、盘中见 90.56（为 9 月以来首次跌破 91），11-10 进一步跌至 89.26（8-31 以来最低、较前一日收盘 -3.6%），11 月以来累计跌近 24%；11-11 收涨约 1.1% 至 92.5。触发因素是美民主党赢得国会选举后市场押注中东行动收尾、海湾供应回升至战前 90% 以上。对跨境链路：① 干线运费与燃油附加费短期有回落空间，但 11 月单日 7%+ 的波幅无法用月度均价对冲，合同仍应保留浮动条款；② 油价下台阶同时打击俄财政（1–10 月油气收入 -14.1%、赤字 2.3% GDP）与卢布（本周 USD/RUB +1.02%、CNY/RUB +1.11%），进口成本与汇兑损失会吃掉运费节省的一半以上。报价建议按 Brent 88–98、USD/RUB 82–84 做双变量区间测试。"}, {"title": "消费市场：黑五卖家集体退场，本地/白俄供应链填补中低价带", "text": "① 促销失效：524 名卖家中 68% 不参加 11.11 与黑五（半数称没有经济空间、18% 无库存），确认参加的 363 人中多数折扣不超过 5%；381 名买家中 68% 预算低于 5,000 ₽——佣金加物流已占售价 40% 以上，「以折换量」的边际收益已经为负。② 结构替代：WB 上白俄罗斯商品 1–9 月销售增逾 4 倍，美妆 +29%、遮瑕 +65%、粉底 +57%，中低价带正被关税同盟内的供应链占据；同期平台美妆平均抽成从 20% 升至 40%，Ozon 美妆 +70%、WB +37%、Яндекс Маркет -6%。③ 品类机会：线上汽配 Q2 +39.5%（2,470 亿卢布）、平台占 64%，宠物/汽配/家居等「非标高频」类目仍在放量；灯具端 68% 的 18–34 岁很少开主灯，台灯/落地灯/LED 灯带成为替代——主灯弱化、局部照明上行的结构性变化值得排产。④ 结论：中价位「不上不下」最危险，要么向上做差异化（设计、认证、售后），要么向下用本地/白俄供应链做极致性价比。"}], "sourceStats": "收录 27 条全部来自俄语本地媒体与官方口径（«Коммерсантъ» / «Ведомости» / Retail.ru / Интерфакс / РИА Новости / Lenta.ru / MPUP / Sellers Platform / EcomHub / New Retail / Навигатор исследований / ЦБ РФ；其中 Retail.ru 引 CORE.XP·Data Insight·ЮKassa·ТАСС·«Авито»·Wildberries / ВТБ，Ведомости 引 Reuters / ЦБ，Коммерсантъ 引 ICE / Platts·S&P Global，均按本地媒体计）。本地信源 27 条、占比 100%（中文 0%、英文 0%），满足本地 ≥60% 的要求。", "meta": ["报告编号：RU-WEEKLY-2026-W46", "覆盖周期：2026-11-09（周一）~ 11-13（周五），第46周，共 5 个工作日", "收录条目：27 条（仓库遇袭1/平台规则变动3/电商8/时政3/经济3/美妆3/电器3/灯具3）", "数据来源：本周日报 5 期（14/23/24/26/24，共 111 条）按重要性精选；周报按「事件」合并同一主题的多日条目，汇率与油价补取央行官方牌价与 ICE 盘中报价", "去重口径：URL 比对 state.db articles 表（本周日报 111 条已入库）；周报条目按「事件」去重，同一事件多日出现只保留信息最全的一条并合并数据", "信源结构：本地 27 条 / 100%（要求 ≥60%）｜中文 0%｜英文 0%", "条数上限：电商 ≤8 条、其它每栏 ≤3 条；灯具 3 条、美妆 3 条均为该栏本周全部可收录项，未凑数", "口径说明：汇率取央行官方牌价（11-09 / 11-13 生效值）；油价取 ICE 盘中与收盘报价并标注时点；平台费率与规则以平台卖家渠道、行业监测为准，未见官方公告的项已在条目内标「待核实」"]}
