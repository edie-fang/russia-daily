损", "3 私宅+5 公寓楼、教堂、幼儿园"], ["防空战果", "9-8 20:00~9-9 08:00 击落 596 架"], ["索契", "БЭК 袭击海滨 8 伤、沿岸起火"], ["对市场", "南部/黑海物流与末端配送受扰，多城机场限航"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/09/1227401-chetire-cheloveka-pogibli"}, {"num": 8, "tag": "local", "tagText": "本地", "source": "Lenta", "time": "09-09 18:36", "title": "袭击首次打到北极圈：新乌连戈伊燃料能源设施遇袭起火、人员疏散", "summary": "9-9 乌军首次袭击乌尔FO 北极部分：亚马尔-涅涅茨自治区新乌连戈伊（距乌边境约 3000 公里）工业/燃料能源综合体遇袭起火、人员疏散，州长阿尔秋霍夫称对工业目标的攻击已被击退。打击纵深首次延伸至北极油气带，亚马尔 LNG 与北极航道相关供应链风险上升，平台仓无受损通报。", "table": [["地点", "新乌连戈伊（亚马尔-涅涅茨自治区）"], ["目标", "工业/燃料能源综合体（起火、人员疏散）"], ["官方", "州长阿尔秋霍夫：攻击已被击退"], ["意义", "乌军首次袭击乌尔FO 北极区"], ["对市场", "亚马尔 LNG/凝析油与北极航道供应链风险上升"]], "sourceFull": "https://lenta.ru/news/2026/09/09/long-urengoy/"}, {"num": 9, "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "09-10 00:23", "title": "梅德韦杰夫《Ведомости》专访：核武“不是恐吓而是现实”，警告可打击北约境内目标", "summary": "统俄党主席、安全会议副主席梅德韦杰夫在选举前接受《Ведомости》专访：称若国家安全受威胁俄有权使用核武，“不是恐吓而是现实”；无核国家在有核国家支持下侵俄或白俄视为联合攻击；不排除打击北约境内目标；称动员传言是基辅信息攻击、俄无需动员，合同兵已满足需求。", "table": [["身份", "统俄党主席、安全会议副主席（选前专访）"], ["核武", "受安全威胁时有权使用；威慑政策已细化"], ["北约", "不排除打击北约境内目标"], ["动员", "称动员传言系基辅信息攻击，俄无需动员"], ["其他", "对敌对国家造成最大损失；保住杜马宪法多数"]], "sourceFull": "https://ria.ru/20260910/medvedev-2116700402.html"}, {"num": 10, "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-09 14:53", "title": "俄方称阿布扎比为三方会谈优先地，佩斯科夫称“可预见未来”或重启", "summary": "俄总统助理乌沙科夫称阿布扎比是俄美乌三方会谈的优先平台、此前已在此接触；佩斯科夫 9-9 称俄美均有重启三方谈判的意愿、“可预见未来”或重启，但暂无成型路线图，和平协议条款不公开讨论。泽连斯基 9-8 点名会晤可能在 UAE/瑞士/土耳其，议题含能源、粮食与换俘。", "table": [["乌沙科夫", "阿布扎比为三方会谈优先平台"], ["佩斯科夫（9-9）", "俄美愿重启三方谈判；无成型路线图"], ["泽连斯基（9-8）", "或在 UAE/瑞士/土耳其；须有具体成果"], ["关联", "佩斯科夫称普京与特朗普讨论过与中国的三方峰会"], ["对市场", "谈判预期是卢布与俄股主要上行变量，勿线性外推"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/09/1227536-rossiya-schitaet"}, {"num": 11, "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-09 10:55", "title": "Brent 破 100 美元（7 月底以来首次），欧洲气价冲上 940 美元/千立方米", "summary": "受美伊冲突升级推动，Brent 11 月期货盘中最高触及 100.19 美元/桶（7 月底以来首次），10:46 报 99.73 美元（+1.88%）；欧洲气价在 ICE 突破 940 美元/千立方米，俄媒称创 2022 年以来最高。伊朗导弹回击美军约旦基地，此前美打击伊朗哈尔克岛与贾斯克附近油轮。", "table": [["Brent 11 月期货", "盘中 100.19（10:15 MSK），10:46 报 99.73（+1.88%）"], ["欧洲气价", "ICE 超 940 美元/千立方米（2022 年以来最高）"], ["驱动", "伊朗导弹回击美军约旦基地；美袭伊油轮"], ["对俄", "油气收入改善（1-8 月油气收入仍 -16.7%）+输入性通胀"]], "sourceFull": "https://www.vedomosti.ru/investments/news/2026/09/09/1227428-tsena-nefti-brent"}, {"num": 12, "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-09 11:10", "title": "1-8 月联邦预算赤字 5.8 万亿卢布（占 GDP 2.5%），8 月靠国企分红实现盈余", "summary": "俄财政部：1-8 月联邦预算赤字 5.8 万亿卢布＝GDP 2.5%，同比扩大 1.5 倍。收入 25.9 万亿（+9.2%），其中油气 5 万亿（-16.7%）、非油气 20.9 万亿（+18.1%）；支出 31.7 万亿（+14.7%）；8 月分红 691 亿卢布、单月盈余。", "table": [["累计赤字（1-8月）", "5.8 万亿卢布＝GDP 2.5%（计划 3.786 万亿）"], ["收入", "25.9 万亿（+9.2%）"], ["油气 / 非油气收入", "5 万亿（-16.7%）/ 20.9 万亿（+18.1%）"], ["支出", "31.7 万亿（+14.7%）"], ["8 月分红", "691 亿卢布（主要来自 Сбер）"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/09/09/1227435-defitsit-byudzheta"}, {"num": 13, "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-10 02:29", "title": "央行会前监控：8 月基础通胀年化约 5%（7 月 7%），通胀预期 14.7%→13.7%", "summary": "9-11 议息前，Газпромбанк 估 8 月基础价格年化约 5%（7 月 7%）；居民通胀预期 14.7%→13.7%，零售企业价格预期 11.8%→10.6%。Q2 GDP 环比季调 +0.9%、投资 +1.5%，企业贷款增速升至 1.3%，需求尚无确定冷却证据。", "table": [["基础通胀（8月年化）", "约 5%（7 月 7%）"], ["通胀预期", "居民 14.7%→13.7%；零售企业 11.8%→10.6%"], ["需求", "Q2 GDP +0.9% q/q；投资 +1.5%（Q1 -4.2%）"], ["信贷", "企业贷款增速 0.3%→1.3%（7 月）"], ["议息", "9-11 13:30 MSK；共识维持 14%"]], "sourceFull": "https://www.kommersant.ru/doc/8940306"}, {"num": 14, "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-09 18:13", "title": "央行 9-10 官方汇率：美元 85.46（-1.01）、欧元 99.25（-1.25），欧元跌破 100", "summary": "俄央行公布 9-10 官方汇率：美元降至 85.46 卢布（-1.01）、欧元降至 99.25 卢布（-1.25，跌破 100 关口）、人民币 12.73 卢布（-0.15）。出口结汇增加、进口下降与财政部操作量变化支撑卢布，Альфа-банк 预期 9 月汇率企稳甚至小幅走强。", "table": [["美元", "85.46 卢布（-1.01）"], ["欧元", "99.25 卢布（-1.25；9-9 为 100.45）"], ["人民币", "12.73 卢布（-0.15）"], ["背景", "结汇增加+进口下降+财政部操作量变化"]], "sourceFull": "https://www.vedomosti.ru/finance/news/2026/09/09/1227620-dollara-na-rubl"}, {"num": 15, "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-09 20:03", "title": "俄油 Urals 8 月环比涨 16% 至 60.72–69.72 美元，9 月首周破 80 美元", "summary": "俄油 Urals 8 月均价升至 60.72–69.72 美元/桶，环比上涨 16%，9 月第一周突破 80 美元/桶。支撑来自印度与中国需求上升及中东供应收缩。高油价下超额油气收入转入预算缓冲，与财政部讨论的“50 美元/桶截断价”形成配套，油气收入边际改善。", "table": [["Urals（8月）", "60.72–69.72 美元/桶（环比 +16%）"], ["9 月首周", "突破 80 美元/桶"], ["驱动", "印中需求上升+中东供应收缩"], ["联动", "预算规则截断价讨论 50 美元/桶"]], "sourceFull": "https://www.kommersant.ru/doc/8940221"}, {"num": 16, "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "09-09 19:53", "title": "财长西卢阿诺夫：预算规则截断价只考虑 50 美元/桶这一种方案", "summary": "俄财长西卢阿诺夫 9-9 表示，预算规则中的油价截断价只考虑 50 美元/桶一种方案，“没有其他方案”，该价位可使油价波动对预算平衡的影响最小化。副总理诺瓦克此前已提及讨论 50 美元方案，2027-2029 年预算草案将于 9 月提交政府审议。", "table": [["表态人", "财长 Силуанов（9-9）"], ["结论", "截断价仅考虑 50 美元/桶，“没有其他方案”"], ["理由", "该价位下油价波动对预算平衡影响最小"], ["背景", "2027-2029 预算草案 9 月提交政府审议"]], "sourceFull": "https://ria.ru/20260909/ekonomika-2116667154.html"}, {"num": 17, "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-09 15:53", "title": "普京 9-10 主持政府会议聚焦“诚实标识”：覆盖 51 类商品，非法流通占比 26%→9%", "summary": "普京 9-10 视频主持政府会议，主题是用“诚实标识”系统为经济“去灰”。系统已覆盖 51 类商品（药品、乳制品、饮用水、儿童用品、日用化学品等）并盯住互联网零售；非法流通占比由 26% 降至 9%，为预算带来 1.7 万亿卢布额外收入。", "table": [["议题", "“诚实标识”系统用于经济去灰"], ["覆盖", "51 类商品（含日用化学品、儿童用品等）"], ["成效", "非法流通 26%→9%；预算 +1.7 万亿卢布"], ["报告人", "副总理格里戈连科、Алешин、波波娃"], ["对卖家", "强制标识品类或扩围，线上渠道合规压力上升"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/09/09/1227556-putin-obsudit"}, {"num": 18, "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-10 02:55", "title": "Yves Rocher 俄子公司换帅：2025 年俄营收 64.7 亿卢布（-14%）、净利缩水近 4 倍", "summary": "法国美妆连锁 Yves Rocher 的俄罗斯主体 ООО «Ив Роше Восток» 换帅：Дюшоссуа 9-8 离任，由原负责哈萨克斯坦市场的 Храбров 接任。俄业务 2025 年营收 64.7 亿卢布（-14%）、净利 2140 万卢布（缩水近 4 倍），现有 350 家门店、10 家 SPA 与线上商城，约 75% 为加盟。", "table": [["变更", "总经理：Дюшоссуа（9-8 离任）→ Храбров"], ["门店", "350 家门店+10 家 SPA+线上商城"], ["渠道结构", "约 25% 直营、75% 加盟"], ["2025 财务", "营收 64.7 亿卢布（-14%）；净利 2140 万（约 -75%）"]], "sourceFull": "https://www.kommersant.ru/doc/8940207"}, {"num": 19, "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "09-10 01:22", "title": "苹果发布会：首款折叠屏 iPhone Duo＋iPhone 18 Pro/Max，俄平台同步预售 14.1 万卢布起", "summary": "苹果发布首款折叠屏 iPhone Duo 与 iPhone 18 Pro/Max，WB、Ozon、Яндекс Маркет、М.Видео 已在俄预售：WB 首发 14.1 万卢布起，Ozon（联手 restore:）Pro 19.999–39.999 万，М.Видео Pro 17.5 万起，Яндекс Маркет Pro 14.7 万起、9-26 后发货，折叠屏 Duo 预期 24.5 万起，全线提价。", "table": [["WB", "首发预售，14.1 万卢布起（仅 Pro/Pro Max）"], ["Ozon", "联手 restore:，Pro 19.999–39.999 万、Pro Max 21.999–44.999 万"], ["М.Видео", "Pro 17.4999 万起、Pro Max 18.9999 万起"], ["Яндекс Маркет", "9-10 开售、9-26 后发货；Pro 14.7 万、Pro Max 15.7 万起"], ["折叠屏", "iPhone Duo 俄预期 24.5 万卢布起"]], "sourceFull": "https://ria.ru/20260910/predzakaz-2116705280.html"}, {"num": 20, "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-09 21:07", "title": "俄智能手机市场 1-9 月 1440 万台/3700 亿卢布（-11%/-5.9%），iPhone 占金额 30%", "summary": "据 М.Видео 与 Платформа ОФД 数据，1-9 月俄智能手机销量 1440 万台、3700 亿卢布（-11% / -5.9%）；iPhone 售出约 70 万台、610 亿卢布，占台数 4.9%、金额 30%（去年同期 3.7%/27%）。手机中位价 22,304 卢布（-4%）。", "table": [["市场（1-9月）", "1440 万台 / 3700 亿卢布（-11% / -5.9%）"], ["iPhone", "约 70 万台 / 610 亿卢布"], ["金额占比", "30%（去年同期 27%）"], ["中位价", "22,304 卢布（-4% y/y）"]], "sourceFull": "https://www.kommersant.ru/doc/8940270"}, {"num": 21, "tag": "local", "tagText": "本地", "source": "Lenta", "time": "09-09 19:28", "title": "9 月已有 7 个品牌上调在俄车价（Автостат）", "summary": "据 Автостат，9 月头几天已有 7 个汽车品牌在俄罗斯上调售价，涨价与报废税（утильсбор）上调预期、汇率与需求回暖相关。涨价潮或促使经销商以清库存促销对冲，短期价格窗口仍在，但四季度价格中枢上移概率较大。", "table": [["事实", "9 月头几天 7 个品牌上调在俄售价"], ["来源", "Автостат"], ["背景", "报废税上调预期+汇率+需求回暖"], ["对市场", "经销商或以清库存促销对冲，短期价格窗口仍在"]], "sourceFull": "https://lenta.ru/news/2026/09/09/srazu-neskolko-avtoproizvoditeley-peresmotreli-tseny-na-mashiny-v-rossii/"}, {"num": 22, "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-09 15:53", "title": "АвтоВАЗ 已向 31 国出口 Lada，今年出口目标 3 万辆（+45%）", "summary": "АвтоВАЗ 表示 Lada 出口已覆盖 31 国，9-9 举办进口商大会（15 国以上约 50 名代表）；计划 2026 年出口 3 万辆、较 2025 年增长 45%，海外最畅销为 Lada Granta 与 Vesta，2025 年新开拓埃及、利比亚、委内瑞拉等市场。", "table": [["出口地理", "31 个国家；进口商大会 15+ 国约 50 名代表"], ["2026 目标", "出口 3 万辆（较 2025 年 +45%）"], ["热销车型", "Lada Granta、Vesta"], ["2025 新市场", "阿布哈兹/埃及/利比亚/委内瑞拉；新增 7 家经销中心"]], "sourceFull": "https://www.vedomosti.ru/auto/news/2026/09/09/1227560-eksportiruet-lada"}]}
