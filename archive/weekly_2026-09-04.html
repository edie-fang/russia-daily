/lenta.ru/news/2026/09/03/wildberries-reshil-zadeystvovat-bespilotniki/", "num": 6, "tag": "local", "tagText": "本地"}, {"title": "9-1 生效新规三连：平台/网店卖家须附官方认证文件；\"诚实标识\"扩围至凝乳/通心粉/蜂蜜、无标 БАД 禁售；消费者权益法换货/退货清单调整", "source": "RIA", "time": "09-01", "summary": "在线销售新规 9-1 生效：平台及网店卖家须在商品页附认证证书编号+有效期+发证机构（下一节点 10-1 平台经济法）；\"诚实标识\"扩围：凝乳/通心粉/蜂蜜/麦片/速食土豆泥强制标记，无标识运动营养品及保质期≤3 年 БАД 禁售，违规自动罚款最高 50 万卢布；消费者权益法修订生效（2026-09-01~2032-09-01）：投资贵金属、水暖通风产品移出免费换货清单，拖拉机/挖掘机等自走机械列入不可退换。食品/个护类目卖家须核查在售 SKU 标识合规与详情页认证文件，避免 9 月新规罚款。", "sourceFull": "https://ria.ru/20260901/rossija-2114494734.html；https://ria.ru/20260901/markirovka-2114494282.html；https://ria.ru/20260901/zakon-2114495843.html", "num": 7, "tag": "local", "tagText": "本地"}, {"title": "10 月平台经济法前瞻：公共院称平台未经卖家同意不得打折（统一法律框架）", "source": "TASS", "time": "09-02", "summary": "公共院公共监督委员会成员 Машаров：10 月生效的平台经济法将为平台经济建立统一系统法律框架，平台不得未经卖家同意打折促销——若落地，平台单方补贴式降价/大促强制跟价的规则将被限制，卖家对定价与折扣授权的控制权上升。具体法律文本细则待 10 月披露，建议卖家在平台后台核查折扣授权设置，为\"促销需同意\"规则提前做准备。", "sourceFull": "https://tass.ru/ekonomika/28068077", "num": 8, "tag": "local", "tagText": "本地"}, {"title": "俄家具市场转向 B2B：上半年产量 410 万件、零售同比 -10%，企业订单成主力（第一家具厂企业订单占比 59%）", "source": "Kommersant", "time": "08-31", "summary": "俄家具市场结构生变：上半年产量 410 万件，Q1 零售同比 -10%，企业订单（B2B+B2G）成增长主力，全年占比预计 35-40%；第一家具厂企业订单占比达 59%（超 10 亿卢布）。民用零售疲软+企业/政府采购旺盛的结构性分化，对 mosai 家具线的渠道选择（零售电商 vs 企业集采/政府采购）与产品线侧重有直接参考意义。", "sourceFull": "https://www.kommersant.ru/doc/8921764", "num": 9, "tag": "local", "tagText": "本地"}, {"title": "物流供给扩张：仓储企业注册 +30%、快递企业 +78.7%；央行：中央联邦区仓储租金上行、小面积仓与订单处理设施需求增加", "source": "Kommersant、TASS", "time": "08-31~09-04", "summary": "俄物流企业注册激增：仓储企业 3700 家（+30%）、快递企业 824 家（+78.7%），H1 电商营业额 7.2 万亿卢布（+18.7%），Ozon 自提点超 8 万并向小微物流中心转型；央行（9-4）：中央联邦区（ЦФО）仓储租金上涨，小面积仓与订单处理（fulfilment）物业询盘增加——大仓遭袭后分散备货逻辑正在转化为实际租赁需求。仓储成本上行与租约结构变化将影响卖家 2026Q4-2027 履约成本测算。", "sourceFull": "https://www.kommersant.ru/doc/8921701；https://tass.ru/ekonomika/28077805", "num": 10, "tag": "local", "tagText": "本地"}, {"title": "线下零售承压：购物中心联盟预警全俄或超 1000 家门店关闭；莫斯科客流同比 -4.6%；Top-10 食品零售商 H1 增速放缓至 +11.6%", "source": "TASS、Kommersant", "time": "09-02~09-04", "summary": "俄购物中心联盟主席 Шакиров：全俄或有超 1000 家门店关闭、各地客流下滑（首都跌幅高于全俄）；8 月最后一周莫斯科购物中心客流同比 -4.6%（环比 +6.4% 系开学采购季，短期活跃后年内转弱）；Infoline 数据：Top-10 食品零售商 H1 营收增速放缓至 +11.6%（竞争加剧+成本上升含燃油危机+实际收入下降）。线下零售收缩与成本压力延续，将进一步把购买力推向线上平台与折扣渠道。", "sourceFull": "https://tass.ru/ekonomika/28077713；https://www.kommersant.ru/doc/8924512；https://www.kommersant.ru/doc/8923610", "num": 11, "tag": "local", "tagText": "本地"}, {"title": "中小企业生态数据：首份地区支持排名（奥廖尔州居首、仅 38/89 地区按时处理申请）；亚太企业在俄商标注册增加；Пятёрочка 拟进军萨哈林与堪察加", "source": "Kommersant、TASS", "time": "08-31~09-03", "summary": "俄发布中小企业支持首份地区排名：奥廖尔/秋明/克拉斯诺亚尔斯克居前三，仅 38/89 地区按时处理申请——地区间营商环境差距明显，卖家选址/注册地选择可参考；亚太国家公司在俄商标注册数量增加（TASS 引 Ведомости）；X5 旗下 Пятёрочка 拟进军萨哈林州与堪察加边疆区（远东已布局 640 家门店，研究阶段）——远东零售网络扩张继续，区域电商履约与到店零售的配合空间上升。", "sourceFull": "https://www.kommersant.ru/doc/8921808；https://tass.ru/ekonomika/28059261；https://tass.ru/ekonomika/28073015", "num": 12, "tag": "local", "tagText": "本地"}]}, {"icon": "🏛", "name": "时政", "items": [{"title": "特朗普特使 Witkoff 与库什纳拟 9 月 5-6 日访莫斯科+基辅：\"舒适组合\"首次集结基辅，泽连斯基公开批评其访俄；佩斯科夫不确认日期", "source": "Lenta 引 TASS、Interfax", "time": "09-04", "summary": "美方消息：特朗普特使 Witkoff 与女婿库什纳拟于 9 月 5-6 日先后访问莫斯科与基辅（4 月 Witkoff 访俄后多次筹划推迟）；泽连斯基 9-3 称特朗普团队人员首次在基辅集结，并公开批评其此前访俄\"不尊重\"；因基辅茹良内机场遭袭，美方代表或改地面交通。佩斯科夫 9-4 回应不预告日期、\"接触发生时会通报\"，并暗示华盛顿或借访俄要求基辅停止对俄袭击。俄联邦委员会议员贾巴罗夫判断此行意在探明俄方立场与方案。若成行，为 4 月以来美俄最高层级直接接触，谈判信号明显升温。", "sourceFull": "https://lenta.ru/news/2026/09/04/v-kremle-otvetili-na-vopros-o-predstoyaschem-vizite-uitkoffa-i-kushnera-v-moskvu/；https://lenta.ru/news/2026/09/04/long-visit/", "num": 13, "tag": "local", "tagText": "本地"}, {"title": "美俄接触面扩大：特朗普称愿与普京会晤但\"时机未到\"，鲁比奥重申对俄对话必要；俄财长西卢安诺夫 G20 会晤美财长贝森特", "source": "Lenta、Interfax", "time": "09-01~09-02", "summary": "特朗普 9-2 表示愿与普京会晤但时机未到（此前 8-23 乌沙科夫亦称若同场\"不可避免地\"会面），国务卿鲁比奥承认对俄对话必要性；俄财长西卢安诺夫赴美参加 G20 财长会（北卡阿什维尔）并与美财长贝森特会晤，贝森特称\"若不直接对话，冲突如何解决\"、与俄接触重要。叠加 CIA 局长 8-25 秘密访俄，美俄高层接触从情报渠道向财金/外交渠道扩散，谈判前置信号密集。", "sourceFull": "https://lenta.ru/news/2026/09/03/long-ya-hochu-sdelat-eto-tramp-zayavil-chto-hochet-vstretitsya-s-putinym-no-pozzhe/；https://lenta.ru/news/2026/09/02/vizit-siluanova-v-ssha-svyazali-s-ukrainskim-uregulirovaniem/", "num": 14, "tag": "local", "tagText": "本地"}, {"title": "美对俄制裁法案搁浅：Грэм 法案众议院遇阻，彭博称审议或推迟至 11 月中期选举后", "source": "Lenta 引 Politico、Interfax 引彭博", "time": "09-01~09-04", "summary": "Грэм 对俄制裁法案参议院已通过、众议院遇阻（民主党反对+共和党热情不足）；彭博 9-4：众议院议长约翰逊称该案或至 11 月中期选举后才表决，此前\"9-14 起审议\"预期落空。对俄追加制裁的立法路径阶段性受挫，短期贸易融资与结算环境的边际压力缓解，但选举后法案复活风险仍在，出口商应把制裁波动纳入汇率与收款路径预案。", "sourceFull": "https://lenta.ru/news/2026/09/01/zakon-grema-o-sanktsiyah-protiv-rossii-stolknulsya-s-oppozitsiey-v-kongresse/；https://www.interfax.ru/world/1113102", "num": 15, "tag": "local", "tagText": "本地"}, {"title": "欧盟制裁现裂痕：斯洛伐克拒绝延长对俄个人制裁，现行一揽子 9-15 到期、27 国未达一致", "source": "Lenta", "time": "09-03", "summary": "斯洛伐克拒绝延长欧盟对俄个人制裁：现行一揽子制裁 9 月 15 日到期，欧盟大使会议未能就延期达成共识（菲佐不满欧盟对乌 900 亿欧元贷款安排）。若 9-15 前未谈拢，欧盟对俄制裁连续性将首次出现实质性缺口，涉贸易融资、签证与金融限制的稳定性生变。需跟踪斯洛伐克是否软化或换取让步。", "sourceFull": "https://lenta.ru/news/2026/09/03/v-es-ne-smogli-prodlit-sanktsii-protiv-rossii-po-odnoy-prichine/", "num": 16, "tag": "local", "tagText": "本地"}, {"title": "德国-俄关系连环恶化：终止\"俄之家\"协议并关闭波恩总领馆（9-18 前）→正式指控俄涉莱比锡无人机事件并预告反制，俄斥\"斯克里帕尔式构陷\"", "source": "Lenta、Kommersant", "time": "09-01~09-02", "summary": "德国 9-1 终止柏林俄之家协议、要求 9-18 前关闭波恩俄总领馆（背景：8 月初莱比锡机场无人机事件）；9-2 德国正式指控俄罗斯涉莱比锡事件并预告反制措施，俄外交部斥为\"斯克里帕尔式构陷\"、宣布对等关闭歌德学院并保留进一步回应（МИД\"视需要\"）。俄欧外交关系再度降温，对中欧班列/德国方向的贸易结算与合规审查环境构成扰动。", "sourceFull": "https://lenta.ru/news/2026/09/01/germaniya-zakryla-russkiy-dom-i-genkonsulstvo-rossii/；https://www.kommersant.ru/doc/8924215", "num": 17, "tag": "local", "tagText": "本地"}, {"title": "袭击烈度维持高位：9-2 夜~9-3 晨 15 个地区遭袭、莫斯科累计拦截 27 架；9-3 夜~9-4 晨索契/天狼星油库区域遇袭起火；乌推动 ICAO 限制俄领空被俄驳回", "source": "Interfax、Lenta", "time": "09-02~09-04", "summary": "俄国防部称 9-2 夜~9-3 晨 15 个地区遭袭，莫斯科零时后累计拦截 27 架（10+17），Внуково/Домодедово/索契/格连吉克/奔萨/萨拉托夫机场临时限航；9-3 夜~9-4 晨索契及联邦领土\"天狼星\"遭大规模无人机袭击、石油基地（нефтебаза）区域起火（无伤亡通报），图拉州另拦截 4 架，均无平台仓库受损。外交面：乌克兰推动 ICAO 限制俄领空民航并发布 NOTAM，俄航空署称文件无法律效力并向 ICAO 秘书长提交紧急照会；米罗什尼克称乌方一个月内第二次承认在居民区设军事仓库（米拉村弹药库）。空运与区域物流的夜间中断仍是常态变量。", "sourceFull": "https://www.interfax.ru/moscow/1112864；https://www.interfax.ru/russia/1113107；https://lenta.ru/news/2026/09/02/genseka/", "num": 18, "tag": "local", "tagText": "本地"}, {"title": "对俄能源与安全施压新动向：欧盟拟对俄石油海运实施新制裁并考虑波罗的海/北海海军任务；英国出台防制裁规避新规；拉夫罗夫警告北约北极活动", "source": "Lenta 引 Известия、RIA", "time": "08-31~09-01", "summary": "欧盟拟对俄石油海运（影子船队）实施新制裁，选项包括波罗的海+北海海军任务（议员表态+Известия 报道，未官宣）；英国出台防规避对俄制裁新措施（细则待披露）；拉夫罗夫称北约在北极活动威胁俄安全、制造紧张温床。能源海运制裁若落地将直接抬升俄油出口的航运与保险成本结构，需跟踪影子船队保险与转运节点的合规变化。", "sourceFull": "https://lenta.ru/news/2026/08/31/v-evrosoyuze-zahoteli-vvesti-novye-sanktsii-protiv-rossiyskoy-nefti/；https://ria.ru/20260901/mery-2114503907.html；https://ria.ru/20260831/lavrov-2114215587.html", "num": 19, "tag": "local", "tagText": "本地"}, {"title": "普京比什凯克记者会：粮食协议后仅 0.2% 乌克兰粮食运抵非洲；俄愿对德供气（\"柏林不敢\"）；НПЗ 修复 90%", "source": "RIA", "time": "09-01", "summary": "普京上合峰会（比什凯克）后记者会：黑海粮食协议执行后仅 0.2% 乌克兰粮食运抵非洲、其余高价流向欧洲；俄方愿恢复对德管道供气但\"柏林不敢\"；炼厂产能已修复 90%（回应燃油危机）。粮食政治化叙事与对欧供气筹码表态，为俄在粮食与能源两条对外谈判线上的姿态定调，对粮价与欧气价的预期管理有影响。", "sourceFull": "https://ria.ru/20260901/zerno-2114763274.html", "num": 20, "tag": "local", "tagText": "本地"}]}, {"icon": "📊", "name": "经济", "items": [{"title": "卢布高位震荡：美元官方牌价 86.38（8-31，2025 年 3 月以来最高）→86.99（9-3）→86.89（9-4），欧元 100.60 卢布上方", "source": "Lenta、ЦБ РФ", "time": "08-31~09-04", "summary": "央行官方牌价：美元 86.38（8-31，2025 年 3 月以来最高，背景为美联储加息预期升至 62%）→86.99（9-3 连续上调）→86.89（9-4，卢布小幅回升）；欧元 100.60（9-4），持续在 100 卢布上方运行。卢布贬值区间对出口商回款阶段性友好但推升进口成本，需关注 9 月美联储会议与俄央行关键利率决议对汇率的双向扰动。", "sourceFull": "https://lenta.ru/news/2026/08/31/kurs-dollara/；https://lenta.ru/news/2026/09/02/tsb-povysil-kurs-dollara-v-rossii/；https://www.cbr-xml-daily.ru/daily_json.js", "num": 21, "tag": "local", "tagText": "本地"}, {"title": "大宗分化：美伊互袭推升油价 Brent 一周 90.35→96.65 美元（9-2 盘中破 97，7-24 以来首次），黄金高位回落（周跌约 6%）", "source": "RIA、Kommersant", "time": "08-31~09-02", "summary": "美伊互袭升级推升油价：Brent 12 月期货 8-31 报 90.35 美元（+2.34%）、9-2 报 96.65（+1.48%，盘中破 97 为 7-24 以来首次），WTI 92.2 美元（+1.98%）；同期金价跌破 4400 美元/盎司（8-31 报 4390、-1.4%，较 8-25 高点 -6%），银/铂金同步回落——避险资产与风险溢价呈现\"油涨金跌\"的再定价。霍尔木兹方向停火信号与伊朗海上拦截（驱离 70 艘商船）并存，油价波动率仍处高位，直接作用于俄能源收入与进口通胀预期。", "sourceFull": "https://ria.ru/20260831/neft-2114222008.html；https://ria.ru/20260902/neft-2114781045.html；https://www.kommersant.ru/doc/8922801", "num": 22, "tag": "local", "tagText": "本地"}, {"title": "欧洲天然气紧张延续：8 月 TTF 均价 +16.9% 至 745.4 美元/千m³、月末峰值 848.7、储气率 57.09% 为历史同期最低；俄称部分欧盟国家私下游说保留俄气、2027 全面禁气或致欧盟衰退", "source": "RIA", "time": "09-01~09-03", "summary": "欧洲天然气 8 月均价 745.4 美元/千m³（+16.9%）、月末峰值 848.7 美元，储气库填充率 57.09%（历史同期最低）；俄副外长 9-3 称部分欧盟国家私下坚持要求允许进口俄天然气——短期合同禁运已生效（管道气 6-17 起）、长期合同管道气拟 2027-11-01 全面禁运，俄方称全面禁气或致欧盟衰退。冬季储气缺口+禁运时间表博弈，欧洲气价与俄出口通道（土耳其流/经乌中转）的不确定性是今冬能源定价的核心变量。", "sourceFull": "https://ria.ru/20260901/gaz-2114502835.html；https://ria.ru/20260903/mid-2115314286.html", "num": 23, "tag": "local", "tagText": "本地"}, {"title": "俄 8 月油气预算收入 4240 亿卢布环比腰斩（-55%）：НДД 缺位 + Urals 均价跌至 59 美元，1-8 月累计 5.02 万亿（-17%）", "source": "Kommersant", "time": "09-03", "summary": "俄 8 月油气预算收入 4240 亿卢布：环比 -55%、同比 -16%（7 月基数 9340 亿含 3960 亿 НДД 一次性补缴），Urals 7 月均价 59.02 美元/桶（环比 -7%）；1-8 月累计 5.02 万亿卢布（同比 -17%）。油价中枢回落+一次性税基退坡使能源收入明显收缩，财政对非能源收入（当前占比超 80%）与发债的依赖进一步上升，也强化了央行维持紧缩与汇率偏弱组合的动机。", "sourceFull": "https://www.kommersant.ru/doc/8925272", "num": 24, "tag": "local", "tagText": "本地"}, {"title": "燃料危机边际管控：12 家油企与 ФАС 签署限价协议（加油站涨幅不超通胀），ФАС 已立案 50 起；АИ-92 批发价 75470 卢布/吨创纪录，5-9 月近 60% 交易所汽油合同未履约", "source": "Lenta 引 Interfax、Kommersant", "time": "09-02~09-04", "summary": "ФАС 副署长 Магазинов：与 12 家大型油企签署限制加油站涨价（不超通胀水平）的协议，已立案 50 起反垄断案（多为独立零售环节）；诺瓦克称纵向一体化公司油价\"履行社会功能\"、涨幅与通胀同步，保护炼厂措施不影响油价。基本面仍紧：АИ-92 批发 75470 卢布/吨创纪录（9-2），5-9 月近 60% 交易所汽油合同未履约、炼能已修复 90%（剩 10%）。零售限价协议+批发高价并存，物流燃油成本压力短期难实质缓解。", "sourceFull": "https://lenta.ru/news/2026/09/04/neftyanye-kompanii-ogranichili-rost-tsen-na-zapravkah-urovnem-inflyatsii/；https://www.kommersant.ru/doc/8923536；https://www.kommersant.ru/doc/8924445", "num": 25, "tag": "local", "tagText": "本地"}, {"title": "宏观放缓信号确认：7 月基础行业仅 +0.8%、工业 H1 下修至零增长、GDP H1 0.6%；央行 ОДКП 三情景：2027 年 GDP 介于 -3% 至 +3.5%", "source": "Kommersant、TASS", "time": "08-31~09-03", "summary": "7 月基础行业同比 +0.8%（1-7 月 +0.1%），工业 H1 增速由 0.4% 下修至 0，GDP H1 0.6%，居民消费 7 月 +4.6%——下半年增长动能放缓、通胀上升的组合被官方数据确认；央行 ОДКП 三情景：基线赤字 2%GDP（2026）→0%（2029），通缩情景 2027 年 GDP +2.5-3.5%/通胀 3-4%，风险情景 GDP -3~-4%/通胀 11-13%/利率 19-21%；杜马金融委主席阿克萨科夫预期 2027 年通胀回落至 4% 目标。增长与通胀的赛跑决定 9 月后利率路径。", "sourceFull": "https://www.kommersant.ru/doc/8924509；https://www.kommersant.ru/doc/8922761；https://tass.ru/ekonomika/28059279", "num": 26, "tag": "local", "tagText": "本地"}, {"title": "财政发债强度创纪录：单周 ОФЗ 发行约 9390 亿卢布（年内新高、季度计划完成 63%）；储蓄银行维持 50% 分红底线、2026 年对预算贡献 1.7 万亿卢布", "source": "Kommersant、TASS", "time": "08-31~09-02", "summary": "俄财政部单周发行 ОФЗ 约 9390 亿卢布创年内纪录（溢价发行、续推浮息债），季度计划完成 63%——油气收入腰斩背景下财政靠发债补缺提速；储蓄银行宣布维持 50% 分红率底线，2026 年对各级预算贡献 1.7 万亿卢布。高利率环境下发债成本上升与银行业利润向财政输送并存，10 月三年预算案将定调 2027 年财政-货币组合。", "sourceFull": "https://www.kommersant.ru/doc/8924466；https://tass.ru/ekonomika/28059167", "num": 27, "tag": "local", "tagText": "本地"}, {"title": "券商与存款制度：Top-47 券商 H1 收入 +40% 至 418 亿卢布但净利 -30%；2027 年起新增\"住房存款\"（保额最高 1000 万卢布）与\"社会存款\"", "source": "Kommersant、RIA", "time": "08-31~09-02", "summary": "券商 H1：Top-47 收入 418 亿卢布（+40%）、净利润却降 30%（最大券商 BKS 收入 102 亿卢布）——高息环境下经纪业务量增利减；存款制度创新：2027-01-01 起新增住房存款（保额最高 1000 万卢布 vs 普通存款保险 140 万，仅限购房/建房、可锁定优惠房贷）与社会存款（最高 50 万卢布/1 年期/可无损失存取）。居民高息储蓄工具再扩容，消费信贷与耐用品购买力继续被存款市场分流。", "sourceFull": "https://www.kommersant.ru/doc/8921848；https://ria.ru/20260902/vklady-2114775608.html", "num": 28, "tag": "local", "tagText": "本地"}, {"title": "数字卢布冲击银行业测算：佣金年损失或达 1000 亿卢布、约 10% 负债流失，远期渗透率 5-30%（5-7 年）", "source": "Kommersant", "time": "09-03", "summary": "Kommersant 引行业测算：数字卢布全面商用后银行年佣金损失至多 1000 亿卢布、负债流失约 10%，5-7 年远期渗透率 5-30%。对银行中间业务与低成本负债的侵蚀逐步显性化，监管对银行转嫁成本（账户费/服务费）的限制与银行费率结构调整将是后续看点，卖家需留意收款账户费用变动。", "sourceFull": "https://www.kommersant.ru/doc/8924395", "num": 29, "tag": "local", "tagText": "本地"}, {"title": "加密资产法律框架 9-1 生效但交易未启动：央行下位法细则缺位，正式交易或临近新年才落地；外币取现限制再延半年至 2027-03-09", "source": "RIA、Kommersant", "time": "09-01~09-02", "summary": "加密货币合法流通法 9-1 生效：数字资产定位为财产、外贸结算可用全部币种+稳定币、非合格投资者限额 30 万卢布/年/中介、超 10 万卢布转非托管钱包设 48 小时冷静期——但央行下位法细则未出、交易所交易未启动，业内预期正式交易临近新年；央行外币取现限制再延半年至 2027-03-09（2022-03-09 前开户账户限取 1 万美元等值，因制裁禁止俄机构购买西方现钞）。跨境结算合规工具箱扩容但落地待细则。", "sourceFull": "https://ria.ru/20260901/rossija-2114489528.html；https://www.kommersant.ru/doc/8923498；https://ria.ru/20260901/ekonomika-2114672528.html", "num": 30, "tag": "local", "tagText": "本地"}, {"title": "粮食链政策调整：俄 9 月小麦出口或骤降 52-62% 至 180-230 万吨；拟对油脂粕出口关税设上限、谷物关税归零至 2026 年底", "source": "Kommersant", "time": "08-30~09-02", "summary": "俄 9 月小麦出口预计 180-230 万吨（同比 -52.1~-62.5%，配额/收成/物流因素待确认）；政府拟对油粕出口关税设上限（至 2026 年底）、谷物出口关税归零——托底收购价、支持农户。出口收缩+关税归零组合显示官方优先保障国内粮价稳定，全球小麦供给预期收紧叠加 NYT 预警粮价上行压力，食品通胀输入风险延续。", "sourceFull": "https://www.kommersant.ru/doc/8921811；https://www.kommersant.ru/doc/8924514", "num": 31, "tag": "local", "tagText": "本地"}, {"title": "贸易物流链受阻与保护主义：黑海集装箱航运冻结（MSC/Akkon/Arkas/FESCO 停运俄航线，货量改道圣彼得堡约 +10 万 TEU）；ЕАЭС 拟对中国镀锡板征 25.2% 保障关税；远东农产品出口 +33%", "source": "Kommersant、TASS", "time": "08-31~09-01", "summary": "黑海航运风险持续：MSC/Akkon/Arkas/FESCO 等集装箱公司停运俄黑海航线（MSC 船 8-25 遭袭、\"Янина\"号 8-1 沉没），货量改道圣彼得堡（约 +10 万 TEU）——黑海方向进口时效与运价承压、西北通道吃紧；ЕАЭС 拟对中国镀锡板（食品/化工/化妆品包装材料）征 25.2% 保障关税（中国进口占比 93-100%），包装成本上行风险需计入选品测算；远东联邦区农产品出口年初以来 +33%。", "sourceFull": "https://www.kommersant.ru/doc/8922730；https://www.kommersant.ru/doc/8922789；https://tass.ru/ekonomika/28063017", "num": 32, "tag": "local", "tagText": "本地"}, {"title": "ВЭФ-2026 经济成果密集落地：约 70 国 5000+ 人参会；俄中 H1 贸易 +22%、俄企拟发熊猫债；雅库特 28 项协议超 1800 亿卢布；远东 10 家新企业启动（50 万 TEU 码头/180 万吨甲醇）；北极项目累计投资 38 万亿卢布", "source": "RIA、TASS", "time": "09-01~09-04", "summary": "第 11 届东方经济论坛（符拉迪沃斯托克）：约 70 国 5000+ 人参会，全会 9-2 普京出席；俄中 H1 贸易额 +22%、俄企拟在华发行熊猫债；俄中能源新议题浮出：\"西伯利亚力量-贝加尔\"管道（讨论中）、北极 LNG 新项目、俄愿与中方谈新建核电站；雅库特签署 28 项协议超 1800 亿卢布（交通/能源）；普京视频启动 10 家远东企业（含符拉迪沃斯托克\"五一\"港 50 万 TEU/年集装箱码头、纳霍德卡 180 万吨/年甲醇厂、乌苏里斯克药厂）；俄北极圈项目累计投资达 38 万亿卢布。远东/北极开发与对华基建-能源绑定成为中长期增长主线，跨境物流与建材设备需求可期。", "sourceFull": "https://ria.ru/20260901/vef-2114491401.html；https://tass.ru/ekonomika/28073171；https://tass.ru/ekonomika/28077935；https://tass.ru/ekonomika/28077769；https://ria.ru/20260904/vef-2115344393.html；https://ria.ru/20260904/investitsii-2115346037.html", "num": 33, "tag": "local", "tagText": "本地"}]}, {"icon": "💄", "name": "美妆", "items": [{"title": "香水/香氛高景气：H1 产量 7230 万件（+22.9%）、香水近 3400 万瓶（+77.1%）、进口 -10.7%、本土品牌份额超 71%；Z 世代抢购教堂乳香香调\"香水油\"", "source": "Kommersant、Lenta", "time": "08-30~08-31", "summary": "俄 H1 香水产量 7230 万件（+22.9%），其中香水近 3400 万瓶（+77.1%），进口 -10.7%、本土品牌份额超 71%——进口替代+本土产能扩张双轮驱动；需求端小众化：Z 世代抢购教堂乳香香调\"香水油\"（乳香/麝香/没药/乌木/龙涎香），香氛品类向情绪/仪式感场景延伸。对 mosai 美妆线及香水类目选品：本土化包装叙事与小众香调差异化是当前流量抓手。", "sourceFull": "https://www.kommersant.ru/doc/8921702；https://lenta.ru/news/2026/08/30/rossiyskie-zumery-nachali-skupat-maslyanye-duhi-s-ladanom-v-hramah/", "num": 34, "tag": "local", "tagText": "本地"}, {"title": "监管与渠道降温信号：约 3.94 万个违禁膳食补充剂销售网站被封（涉 Ozemptrin/NOW Selenium 等）；鲜花销量出现下滑", "source": "RIA、TASS 引 Ведомости", "time": "08-31", "summary": "俄消费者权益局：约 3.94 万个违禁膳食补充剂（БАД）销售网站被封，典型案例含 Ozemptrin/NOW Selenium 等——美妆个护关联品类（口服美容/补充剂）的线上销售监管显著收紧，卖家须核查在售 БАД 的注册与标识资质；同期 Ведомости 披露鲜花销量下滑（降幅未披露），礼品场景消费走弱与居民购买力收缩的关联信号延续。", "sourceFull": "https://ria.ru/20260831/bad-2114227032.html；https://tass.ru/ekonomika/28059345", "num": 35, "tag": "local", "tagText": "本地"}]}, {"icon": "🔌", "name": "电器", "items": [{"title": "电子元件涨价：AI 算力建设热潮推高服务器内存/SSD 价格，半年涨数十个百分点", "source": "Kommersant", "time": "08-31", "summary": "Kommersant：AI 热潮拉动服务器硬件价格大涨，内存/SSD 半年涨幅达数十个百分点（品类明细涨幅待核实）。元件成本上行沿服务器→存储/3C 整机产业链传导，俄市场消费电子与网络设备的成本与供货周期面临上行压力，相关品类卖家宜提前锁定库存与价格预期。", "sourceFull": "https://www.kommersant.ru/doc/8921840", "num": 36, "tag": "local", "tagText": "本地"}, {"title": "苹果入门笔记本 MacBook Neo 俄市场跌破 5 万卢布（4 个月前最低约 7 万）：入门级价格带竞争加剧", "source": "Lenta 引 Hi-Tech Mail.ru", "time": "09-01", "summary": "苹果最便宜笔记本 MacBook Neo 俄市场现价跌破 5 万卢布（大平台约 53000 卢布），4 个月前最低约 7 万卢布，定位学生/办公入门机——平行进口渠道价与本土品牌（如低端 Windows 本）在 5 万卢布以下价格带正面竞争。开学季+入门机价格下探，3C 卖家低价带的流量转化窗口打开，但需同步评估平行进口货源合规性。", "sourceFull": "https://lenta.ru/news/2026/09/01/neo/", "num": 37, "tag": "local", "tagText": "本地"}, {"title": "本土电子制造两极：ИКС Холдинг 投超 350 亿卢布在滨海边疆区建 2 个半导体项目（2030 年前投产）；ГК \"Элемент\"电源电子\"Кубик\"量产或推迟一年", "source": "Kommersant", "time": "09-02~09-03", "summary": "ИКС Холдинг 投资超 350 亿卢布在滨海边疆区建设 2 个半导体项目（2030 年前投产，动因：优惠条件+毗邻中国供应链）——俄电子制造向远东集聚、绑定中国供应链的趋势加强；反向信号：ГК \"Элемент\"（俄最大微电子控股）的电源电子\"Кубик\"量产或推迟一年（消息源称关键参数变化）。本土替代产能爬坡与项目延期并存，电子供应链的俄产化节奏仍存不确定性。", "sourceFull": "https://www.kommersant.ru/doc/8924498；https://www.kommersant.ru/doc/8923591", "num": 38, "tag": "local", "tagText": "本地"}]}, {"icon": "🚗", "name": "汽车（扩展）", "items": [{"title": "汽车本土化瓶颈：外资退出 13 家整车厂全部找到新伙伴（控制权留俄），但中国零部件大厂不愿迁俄设厂；2035 汽车工业战略更新发布", "source": "RIA、Kommersant、TASS", "time": "09-02~09-03", "summary": "工贸部（ВЭФ）：外资退出的 13 家整车厂全部找到新伙伴、控制权保留在俄方受益人名下；但 Kommersant：中国汽车零部件大厂对赴俄设厂兴趣低（制裁风险+国内产能要求），俄本土化率提升受阻——整车组装在俄、核心零部件依赖中国进口的结构固化；同期发布汽车工业发展战略（至 2035）更新版（强项：产能规模+自主开发能力，具体目标数值待披露）。对中国供应链的依赖度上升意味着零部件跨境物流与结算稳定性成为俄汽车产业链的命门。", "sourceFull": "https://ria.ru/20260903/rossija-2115030691.html；https://www.kommersant.ru/doc/8925040；https://tass.ru/ekonomika/28068165", "num": 39, "tag": "local", "tagText": "本地"}, {"title": "新车供给活跃：АвтоВАЗ 新款 Niva Legend 上市（119.9 万卢布起）；圣彼得堡 Tenet Plus L4 全周期量产（229 台机器人）；Автостат 预计本土品牌年底份额或超中国品牌", "source": "Lenta 引 Quto、Lenta、TASS", "time": "08-31~09-03", "summary": "АвтоВАЗ 发布新款 Niva Legend 越野车（119.9 万卢布起、4 个配置、1.8L 90 马力+5MT）；АГР 控股旗下 Tenet Plus L4 紧凑型跨界车在圣彼得堡 Сестрорецк 工厂启动焊装/涂装/总装全周期量产（175 台焊接+54 台涂装机器人）；Автостат：俄本土汽车品牌年底市场份额或超中国品牌。本土产能爬坡与中系车供给扩张并存，10 万-20 万卢布价格带的竞争烈度持续上升。", "sourceFull": "https://lenta.ru/news/2026/08/31/avtovaz-ob-yavil-start-prodazh-i-tseny-na-obnovlennyy-vnedorozhnik/；https://lenta.ru/news/2026/09/03/zavod-pod-peterburgom-zapustil-polnyy-tsikl-proizvodstva-krossovera-tenet-plus-l4/；https://tass.ru/ekonomika/28059287", "num": 40, "tag": "local", "tagText": "本地"}, {"title": "Москвич 与中国世宝（Shibao）签署协议发展无人驾驶技术：俄本土车企加速绑定中国供应链", "source": "RIA", "time": "09-03", "summary": "Москвич（莫斯科车企，原雷诺资产）将与中国 Shibao（世宝）签署协议合作发展无人驾驶技术——继整车厂全面\"中化\"后，智能驾驶环节也开始引入中国伙伴。中俄汽车技术合作从整车组装向智能化（智驾/座舱）纵深延伸，对俄市场智驾功能配置的竞争格局有前瞻意义。", "sourceFull": "https://ria.ru/20260903/moskvich-2115029128.html", "num": 41, "tag": "local", "tagText": "本地"}, {"title": "ОСАГО 赔付上限拟从 40 万提至 100 万卢布（须配套打击\"汽车律师\"不当得利措施）", "source": "TASS", "time": "09-04", "summary": "俄联邦委员会建议将 ОСАГО（交强险）财产赔付上限从 40 万卢布提高至 100 万卢布，配套打击借赔付套利的不当得利\"汽车律师\"。若落地，车险成本结构将调整、保费或上行，影响用车成本与保险类目消费；属建议阶段，立法进程待跟踪。", "sourceFull": "https://tass.ru/ekonomika/28077797", "num": 42, "tag": "local", "tagText": "本地"}]}, {"icon": "💡", "name": "灯具", "items": [{"title": "灯具照明栏目全周无新增重大动态（连续第 2 周静默）：5 期日报均为空窗，周五补充检索亦无照明市场重大新闻", "source": "综合检索（RIA/TASS/Interfax/Lenta RSS）", "time": "08-31~09-04", "summary": "本周 5 期日报灯具栏目均标注\"本期无新增重大动态\"；周五补充抓取（RIA/TASS/Interfax/Lenta RSS，светильник/освещение/LED/лампы 关键词）亦未见照明市场新增重大事件——W35 GS Led 首家入 ПП №719 名册后无行业级跟进。邻域信号：ИКС Холдинг 滨海半导体项目、ВЭФ 远东基建投资潮（50 万 TEU 码头/甲醇厂/雅库特交通能源协议）指向基建与电子供应链扩张，中长期对照明工程渠道需求偏正面；LED 本土合规化（ПП №719 名册）节奏与政府采购试点（10-1 平台化采购）的叠加影响值得持续观察。按去重规则如实标注，不重复收录。", "sourceFull": "", "num": 43, "tag": "local", "tagText": "本地"}]}, {"icon": "🔍", "name": "待核实事件核查", "items": [{"title": "本周待核实事件核查汇总（综合检索 | 08-31~09-04）", "source": "综合检索", "time": "08-31~09-04", "summary": "①8-31 叶卡捷琳堡 WB 仓库是否直接命中——Интерфакс及乌拉尔本地媒体称\"有击中物流中心\"，部分信源称残骸落旁，官方未最终确认，已按受影响口径补录数据库；②WB 卖家结算延迟——官方解释系 DDoS 攻击，独立媒体称现金流承压，未获官方证实；③Ozon 哈萨克斯坦仓 9-30 免费期后的费率与跨境税则细则待公布；④9-4 索契 нефтебаза 火灾规模与损失待官方更新（袭击时段通报）；⑤欧盟对俄个人制裁 9-15 到期走向——斯洛伐克立场或软化/谈条件，27 国博弈中；⑥Ozon\"8-20 起平台均价 -3.5%\"为回应涨价传言时的表述，抽样方法未披露；⑦WB 无人机配送试点细节（区域/路线/载重）未公布；⑧\"Ведомости\"亚太商标注册增幅、英国防规避新规细则均为标题级信息。", "sourceFull": "", "num": 44, "tag": "local", "tagText": "本地"}]}], "keyData": {"headers": ["指标", "周初（08-29/31）", "周末（09-03/04）", "趋势"], "rows": [["央行官方美元汇率（卢布）", "86.38（8-31，2025/3 以来最高）", "86.99（9-3）→86.89（9-4）", "高位震荡、小幅回升"], ["央行官方欧元汇率（卢布）", "—", "100.60（9-4）", "100 卢布上方"], ["Brent 原油（美元/桶）", "90.35（8-31）", "96.65（9-2，盘中破 97，7-24 以来首次）", "美伊互袭推涨约 +7%"], ["现货金价（美元/盎司）", "—", "4390（8-31，-1.4%，较 8-25 高点 -6%）", "高位回落"], ["欧洲 TTF 天然气 8 月均价", "—", "745.4 美元/千m³（+16.9%），月末峰值 848.7", "大涨"], ["俄 8 月油气预算收入", "—", "4240 亿卢布（环比 -55%、同比 -16%）", "腰斩"], ["АИ-92 汽油批发价", "—", "75,470 卢布/吨（9-2，纪录）", "纪录新高"], ["交易所汽油合同履约（5-9 月）", "—", "近 60% 未执行；炼能修复 90%", "供给仍紧"], ["12 家油企限价协议", "—", "已签署（涨幅不超通胀）；ФАС 立案 50 起", "边际管控"], ["小麦 9 月出口", "—", "180-230 万吨（同比 -52.1~-62.5%）", "骤降"], ["GDP / 工业（H1）", "—", "GDP 0.6%；工业 0.4%→0（下修）；7 月基础行业 +0.8%", "增速放缓"], ["单周 ОФЗ 发行", "—", "约 9390 亿卢布（年内纪录），季度计划完成 63%", "发债提速"], ["俄中贸易（H1）", "—", "+22%；俄企拟发熊猫债", "高增"], ["北极圈项目累计投资", "—", "38 万亿卢布（ВЭФ 通报）", "持续扩容"], ["WB/Ozon 遇袭累计", "22 城 / 8 城（8-29 前）", "22 城 / 10 城（新增罗斯托夫、别尔哥罗德）；死亡 ≥13 人", "新增 2 城后暂停"], ["单日拦截无人机", "8-29 夜 494 架（新高）", "9-1 达 1050 架 +13 航弹（新高）", "烈度新高"], ["Сбер 受袭卖家贷款重组", "—", "申请 4000+ 份（涉 80 亿卢布），已重组 30 亿", "纾困落地"], ["图书业遇袭损失", "—", "约 1500 万册（或达 2000 万）/ 60 亿卢布", "行业核算"], ["H1 电商营业额 / 物流注册", "—", "7.2 万亿卢布（+18.7%）；仓储企业 +30%、快递 +78.7%", "供给扩张"], ["香水 H1 产量", "—", "7230 万件（+22.9%），本土份额 >71%", "进口替代高增"], ["美对俄新制裁法案", "Грэм 法案参院通过", "众议院遇阻，审议或推迟至 11 月选举后", "搁浅"], ["欧盟对俄个人制裁", "—", "斯洛伐克拒延，9-15 到期、27 国未一致", "现裂痕"]]}, "trends": [{"title": "电商物流", "text": "仓库袭击进入\"新增暂停、威胁未消\"阶段：8-29 罗斯托夫、8-30 别尔哥罗德（导弹、2 死）后连续 4 天无平台仓直接命中，但全俄单日拦截量创纪录（9-1 达 1050 架+13 航弹）、索契油库等能源设施成为新目标，夜间空域中断常态化；救助体系三级落地（联邦缓缴→总检察长提议 2027 暂停检查→萨拉托夫州级免税首例），Сбер 重组 30 亿卢布落地、彼尔姆 70+ 企业求助——\"袭击经济学\"从应急转向制度性成本分摊。供给侧：物流企业注册激增（仓储 +30%/快递 +78.7%）、央行确认中央联邦区仓储租金上行与小面积仓需求增加，微仓化/分散备货从策略变为市场定价事实。Ozon 开放哈国仓（9-30 前免费）给出海外缓冲选项。卖家应把多仓分散+库存保险+哈国备货通道纳入 Q4 常规履约预案。"}, {"title": "平台政策", "text": "9 月是规则密集生效月：9-1 在线销售认证新规、诚实标识扩围（凝乳/通心粉/蜂蜜+无标 БАД 禁售）、消费者权益法换货清单调整同日落地，合规成本一次性抬升；数字卢布 9-1 全民开放后三大平台支付入口上线（月充限 30 万卢布），银行侧测算年佣金损失或达 1000 亿卢布——支付链路与银行收费结构正在重排；10-1 平台经济法与政府采购平台化试点（普京宣布学校可直连电商\"货架\"）将同时到来，前者限制平台单方打折（需卖家同意）、后者为平台卖家打开国家订单入口，一紧一松双向改写平台生态；加密资产法生效但交易待央行细则，外汇管制延续至 2027-03。Q4 前卖家需完成标识/认证合规核查与折扣授权设置审计。"}, {"title": "经济数据", "text": "官方增长叙事与边际放缓信号并存：GDP H1 0.6%、工业 H1 下修至零、7 月基础行业仅 +0.8%，央行 ОДКП 风险情景给出 2027 年 GDP -3~-4%/通胀 11-13% 的尾部路径，宽松拐点仍远；财政端油气收入 8 月环比腰斩（4240 亿卢布）后靠创纪录发债（单周 9390 亿）与银行利润输送（储蓄银行 1.7 万亿）补缺，10 月三年预算案是关键观察点。卢布在 86-87 区间高位震荡（8-31 触及 2025/3 以来最高 86.38 后 9-4 微幅回升），对出口商回款阶段性友好但进口成本与通胀输入同步上升；券商量增利减（收入 +40%/净利 -30%）、住房存款 2027 落地——高息储蓄继续虹吸居民购买力，信贷收缩对耐用品消费的压制贯穿全年。"}, {"title": "能源价格", "text": "能源市场\"外涨内紧\"双线并行：外盘 Brent 一周 90.35→96.65（盘中破 97，美伊互袭驱动），欧洲 TTF 8 月均价 +16.9%、储气率 57.09% 历史同期最低，欧盟 2027 全面禁气时间表与部分成员国私下游说保留俄气形成拉锯；俄国内燃料危机进入管控期——12 家油企与 ФАС 签署限价协议（涨幅不超通胀）、立案 50 起，但 АИ-92 批发 75470 卢布/吨创纪录、5-9 月近 60% 交易所汽油合同未履约、炼能修复 90%，零售限价与批发高价的剪刀差意味着物流燃油成本压力中期难消；俄 8 月油气收入腰斩（Urals 59 美元）后，财政对油价敏感度上升。对卖家定价的输入变量排序：燃油物流成本 > 汇率 > 进口通胀。"}, {"title": "消费市场", "text": "结构性分化延续且线下加速收缩：购物中心联盟预警全俄或超 1000 家门店关闭、莫斯科客流同比 -4.6%，Top-10 食品零售商 H1 增速放缓至 +11.6%——线下向线上/折扣渠道迁移继续；线上侧电商基本面仍强（H1 营业额 7.2 万亿 +18.7%、物流注册激增），但数字卢布骗局、БАД 网站封锁等新监管信号提示流量与合规风险同步上升。行业亮点：香水 H1 产量 +22.9%（本土份额 >71%）、Z 世代香氛小众化、家具市场 B2B 化（企业订单占比 59%）——本土品牌化与小众差异化是美妆/家居的共同主线；电器端元件涨价（内存/SSD +数十 pct）与入门机价格战（MacBook Neo 破 5 万）并存，成本与价格两端挤压中端 3C 卖家利润。汽车链 13 家整车厂全部\"中化\"后遭遇中国零部件厂迁俄意愿低的瓶颈，本土化率叙事降温、对中国供应链依赖固化。"}], "sourceStats": "44 条收录条目中，本周日报 97 条按周视角归并改写为 41 条 + 程序性标注 2 条（灯具空窗注解、待核实核查汇总）+ 周五补充抓取独立新增 1 条（特朗普特使 Witkoff/库什纳拟访俄，两稿合一）；另有 2 条补充（油企限价协议、彼尔姆 70+ 企业求助）并入既有条目改写，不重复计数。本地 42 条来自 RIA / TASS / Interfax / Lenta / Kommersant / TKS.RU / ЦБ РФ 等俄语媒体（Lenta 引 Politico/Quto/Hi-Tech Mail.ru、TASS 引 Ведомости/Известия、Kommersant 引 Infoline、Interfax 引彭博 等均按本地媒体计）；中文 0 条、英文 0 条。灯具\"无新增\"注解条目与待核实汇总条目为程序性标注（不计入引用统计），按实际引用 42 条计，本地信源占比 100% ≥ 60% 达标。", "meta": ["报告编号：RU-WEEKLY-2026-W36", "覆盖周期：2026-08-31（周一）~ 09-04（周五），第36周", "收录条目：44 条（电商 12 / 时政 8 / 经济 13 / 美妆 2 / 电器 3 / 汽车扩展 4 / 灯具 1 / 待核实汇总 1）", "数据来源：本地日报 5 期（08-31 共 21 条、09-01 共 22 条、09-02 共 17 条、09-03 共 19 条、09-04 共 18 条，合计 97 条，窗口 08-29~09-04 无空窗，均已入库）+ 周五下午补充抓取 3
