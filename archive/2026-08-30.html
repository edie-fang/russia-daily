{"date": "2026-08-30", "stats": {"total": 21, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "Сбер：平台电商已占俄经济'巨大'份额，居民平台支出下降15%", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-30 05:00", "summary": "塔斯社8-30援引Sber最新分析称，电商平台已在俄罗斯经济中占据'巨大'份额；同时Sber评估居民在电商平台上的支出下降15%。平台经济规模与消费端短期降温并存，具体统计周期与口径未披露。", "table": [["居民平台支出变化", "-15%"], ["Sber定性", "平台电商占经济'巨大'份额"]], "sourceFull": "https://tass.ru/ekonomika/28057591"}, {"num": 2, "title": "Ozon 9-10起自提点直售滞取/拒收商品，10月起卖家可直送自提点", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-28 18:53", "summary": "Ozon宣布自9月10日起，两周未取或买家拒收的商品将直接在自提点(ПВЗ)销售，商品同步展示在Ozon橱窗可下单，订单由自提点发往买家城市；10月起卖家可自行将商品直送自提点，或就近送至ПВЗ由平台转运至其他网点。新模式盘活滞销库存、缩短履约链路。", "table": [["直售启动", "9月10日"], ["商品范围", "两周未取/拒收商品"], ["卖家直送", "10月起"]], "sourceFull": "https://ria.ru/20260828/ozon-2113892617.html"}, {"num": 3, "title": "Минэк数字平台总部会议：讨论受损卖家支持、拉平中外卖家条件", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-28 20:02", "summary": "俄经济发展部长列舍特尼科夫8-28主持数字中介平台总部会议，讨论平台物流基础设施受损背景下最尖锐议题：拉平俄罗斯与外国卖家的经营条件、支持受影响创业主体，并协调各州、商业协会与专家意见，后续或出台平台卖家权益相关新规。", "table": [["主持", "列舍特尼科夫(经发部长)"], ["核心议题", "拉平中外卖家条件+受损卖家支持"]], "sourceFull": "https://ria.ru/20260828/prodavtsy-2113912783.html"}, {"num": 4, "title": "坦波夫州推'商业团结'支持包，助科托夫斯克WB仓受损卖家", "tag": "local", "tagText": "本地", "source": "国际文传(Interfax)", "time": "08-29 13:40", "summary": "坦波夫州州长佩尔维绍夫指示制定'商业团结'支持包，为科托夫斯克Wildberries仓库火灾受损企业家提供金融、法律、营销与咨询支持。该仓8-26遭无人机袭击后完全烧毁（火场超10万㎡），州政府接管受损卖家善后，具体申请细则待公布。", "table": [["支持包", "'商业团结'(金融/法律/营销/咨询)"], ["背景", "科托夫斯克WB仓8-26全毁"]], "sourceFull": "https://www.interfax.ru/russia/1111974"}, {"num": 5, "title": "俄制定机器人配送交通规则，35个地区试点3年", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-29 12:16", "summary": "俄交通部长尼基京称，经发部联合交通部、内务部制定自主配送机器人行驶参数，机器人将遵守交规，试点在35个联邦主体实施、为期3年。参数将写入最终政府令，为城市内配送机器人商业化运营铺路，利好即时零售与电商末端配送。", "table": [["试点范围", "35个联邦主体"], ["试点期限", "3年"]], "sourceFull": "https://lenta.ru/news/2026/08/29/v-rossii-razrabotali-pdd-dlya-robotov-dostavschikov/"}, {"num": 6, "title": "商店统一QR码收银：一扫替代多码，支持СБП/分期/数字卢布", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-29 16:23", "summary": "俄罗斯推进收银台统一QR码方案：多个支付贴码将合并为一个，顾客扫码后选择支付方式（СБП快付、分期、数字卢布等）并确认。专家称该模式简化线下支付流程，随9月1日数字卢布正式推出，统一码将成为其重要落地入口。", "table": [["模式", "一码多付(СБП/分期/数字卢布)"]], "sourceFull": "https://lenta.ru/news/2026/08/29/rossiyanam-raskryli-podrobnosti-novoy-sistemy-s-edinym-qr-kodom-v-magazinah/"}, {"num": 7, "title": "8-29~8-30大规模无人机夜袭：列宁格勒州НПЗ起火、莫斯科拦截10架、罗斯托夫11伤", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-30 05:02", "summary": "8-29夜至8-30晨乌方对俄发动大规模无人机袭击：列宁格勒州击落42架（НПЗ起火）、莫斯科方向拦截10架、罗斯托夫州11人受伤（含4名儿童住院）、别尔哥罗德州2人受伤；乌方单日发射超300架无人机，多地机场一度限航。", "table": [["列宁格勒州", "42架击落/НПЗ起火"], ["莫斯科方向", "10架拦截"], ["罗斯托夫州", "11伤(4童住院)"], ["乌方单日发射", "300+架"]], "sourceFull": "https://ria.ru/20260830/npz-2114091203.html"}, {"num": 8, "title": "默茨下周宣布对俄单边制裁，独立于欧盟", "tag": "local", "tagText": "本地", "source": "国际文传(Interfax)引Politico", "time": "08-29 21:30", "summary": "Politico援引消息源称，德国总理默茨拟下周宣布独立于欧盟的对俄制裁，或于周二欧盟外长会晤期间或更早落地，预计将把俄方与'北溪'事件等挂钩并追加限制。若成行，将是欧盟框架外首个主要成员国单边对俄制裁，或加剧俄欧经贸摩擦。", "table": [["时间", "下周(或周二欧盟外长会同期)"], ["性质", "德国单边、独立于欧盟"]], "sourceFull": "https://www.interfax.ru/world/1112020"}, {"num": 9, "title": "俄外交部：美国认真研究在欧洲部署核武器的可能性", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-29 23:46", "summary": "俄外交部特命大使别洛乌索夫8-29表示，美国正认真研究在欧洲部署核武器的可能性；美方试图与俄就非战略核武库开启对话，意在转移国际社会对美核威胁的关注。俄方将密切跟踪并作出相应回应。", "table": [["表态方", "俄外交部特命大使别洛乌索夫"]], "sourceFull": "https://tass.ru/politika/28057373"}, {"num": 10, "title": "对俄制裁累计超3.37万项，美国占22%", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-30 01:03", "summary": "俄新社据公开数据统计：截至8月26日各国对俄实施超3.37万项个人制裁，其中97.3%为2022年2月底后新增；美国以约7400项居首（占22%），加拿大4400项（13.2%）、瑞士近3900项（11.4%）分列二三位，欧盟第四。制裁面覆盖个人、企业与运输工具。", "table": [["制裁总数", "超3.37万项(截至8-26)"], ["美国", "约7400项(22%)"], ["加拿大", "4400项(13.2%)"], ["瑞士", "近3900项(11.4%)"]], "sourceFull": "https://ria.ru/20260830/sanktsii-2114085000.html"}, {"num": 11, "title": "俄延长柴油出口禁令至9月30日", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-29 15:27", "summary": "俄政府签署命令，将针对生产商的柴油及船用燃料出口禁令延长至9月30日，以保障国内燃料供应与价格稳定。禁令延续对燃料出口的限制，利好国内油价稳定，但对俄燃料出口贸易构成持续约束。", "table": [["延长至", "2026-09-30"], ["对象", "生产商柴油/船用燃料"]], "sourceFull": "https://lenta.ru/news/2026/08/29/v-rossii-prodlili-zapret-na-eksport-dizelya/"}, {"num": 12, "title": "数字卢布9-1正式推出，超50%民众准备使用", "tag": "local", "tagText": "本地", "source": "行业门户(New Retail)引ВТБ民调", "time": "08-28 13:40", "summary": "俄罗斯9月1日起正式推出第三种国家货币形式——数字卢布。ВТБ民调显示，超50%的俄罗斯人表示在规模化推广后愿意使用数字卢布支付。数字卢布落地将逐步渗透零售支付场景，商家需关注支付通道接入与结算安排。", "table": [["推出时间", "2026-09-01"], ["使用意愿", "超50%(ВТБ民调)"]], "sourceFull": "https://new-retail.ru/novosti/retail/tret_rossiyan_gotova_ispolzovat_tsifrovoy_rubl_dlya_oplaty_v_magazinakh/"}, {"num": 13, "title": "俄fintech增速降至9%：top-100收入1300亿卢布", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-28 19:29", "summary": "生意人报援引行业数据：上半年俄前100大金融科技公司收入1300亿卢布，增速降至9%，较此前明显放缓；主因税改、高利率环境下资金成本高企及数字卢布上线前的准备期。行业增长动能减弱，或影响支付/信贷类电商金融服务供给。", "table": [["top-100收入", "1300亿卢布(上半年)"], ["增速", "降至9%"]], "sourceFull": "https://www.kommersant.ru/doc/8921025"}, {"num": 14, "title": "银行：市场房贷首付比例上升，买家与银行双驱动", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-28 19:58", "summary": "生意人报报道，大银行普遍观察到市场房贷（非优惠）首付比例上升：借款人为压低月供主动提高首付，银行亦为控制风险提高门槛。高利率环境下购房杠杆收紧，或抑制家具/装修/家电等大宗消费需求，相关品类卖家可关注。", "table": [["趋势", "市场房贷首付比例上升"], ["动因", "借款人降月供+银行控风险"]], "sourceFull": "https://www.kommersant.ru/doc/8921080"}, {"num": 15, "title": "阿克萨科夫：存款冻结谣言系境外蓄意散布", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-30 00:10", "summary": "俄杜马金融市场委员会主席阿克萨科夫表示，关于冻结居民存款的谣言系境外蓄意散布、意在动摇俄金融市场；'冻结存款违背经济逻辑，无人会做'。其称此类信息战手段不会影响俄金融体系稳定，官方将继续辟谣。", "table": [["表态方", "阿克萨科夫(杜马金融委员会主席)"]], "sourceFull": "https://ria.ru/20260830/zamorozka-2114082825.html"}, {"num": 16, "title": "边境三州实施特殊供气规则：欠费不得单方断供", "tag": "local", "tagText": "本地", "source": "国际文传(Interfax)", "time": "08-29 20:14", "summary": "俄政府针对库尔斯克、别尔哥罗德、布良斯克州出台特殊供气规则：供应商不得以欠费为由单方停止供气，两个结算期未缴费亦禁止停供，为边境地区居民与企业提供额外保障。三州持续受无人机袭扰，该措施具民生兜底性质。", "table": [["覆盖州", "库尔斯克/别尔哥罗德/布良斯克"], ["核心", "欠费不得单方断供"]], "sourceFull": "https://www.interfax.ru/russia/1112016"}, {"num": 17, "title": "俄药品出口去年增近1/3，2-3年内有望大幅放量", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-30 02:34", "summary": "俄出口中心总裁尼基申娜称，俄药品出口去年增长近三分之一、已超2022年水平，独联体、拉美、非洲及中东需求旺盛，未来2-3年出口有望显著增长。俄药企国际化提速，或带动医药类跨境供应链机会。", "table": [["2025出口增速", "+近1/3(超2022年水平)"], ["目标市场", "独联体/拉美/非洲/中东"]], "sourceFull": "https://ria.ru/20260830/lekarstva-2114088062.html"}, {"num": 18, "title": "俄蛋白类补充剂均价下降9.5%", "tag": "local", "tagText": "本地", "source": "行业门户(New Retail)", "time": "08-28 13:15", "summary": "俄市场监测显示，蛋白质类膳食补充剂(BАД)加权平均价格下降9.5%，供应放量与竞争加剧推动健康品类价格走低。健康/运动营养品类价格下行或利好电商渠道销量，卖家可关注补剂类目促销窗口。", "table": [["蛋白BАД均价", "-9.5%"]], "sourceFull": "https://new-retail.ru/novosti/retail/tseny_na_proteinovye_bady_v_rossii_snizilis_na_9_5/"}, {"num": 19, "title": "卫生产品9-1起强制标记'诚实标志'第一阶段", "tag": "local", "tagText": "本地", "source": "行业门户(New Retail)", "time": "08-28 09:30", "summary": "9月1日起俄罗斯启动卫生产品（洗护/卫生用品等）'诚实标志'强制标记第一阶段，进口商与卖家须在指定期限前完成标签注册与上传，未标记商品将面临流通限制。涉及洗护、清洁、个护等品类的跨境卖家需尽快完成合规。", "table": [["启动时间", "2026-09-01"], ["范围", "卫生产品(诚实标志)"]], "sourceFull": "https://new-retail.ru/novosti/retail/v_rossii_startuet_markirovka_sanitarno_gigienicheskoy_produktsii/"}, {"num": 20, "title": "医生警告肉毒杆菌注射风险", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-30 01:27", "summary": "俄医生提醒肉毒杆菌注射美容的风险：不当操作可能导致面部僵硬、表情不对称、过敏及感染等并发症，且市面上存在大量非正规来源产品。医美消费需选择正规机构与注册产品，合规资质与正品背书成为消费者关注重点。", "table": [["风险", "面部僵硬/不对称/过敏/感染"]], "sourceFull": "https://ria.ru/20260830/botoks-2114085968.html"}, {"num": 21, "title": "iPhone用户9-1起无法使用数字卢布", "tag": "local", "tagText": "本地", "source": "行业门户(New Retail)", "time": "08-28 17:50", "summary": "9月1日数字卢布正式成为俄第三种国家货币形式，但据New Retail报道iPhone用户将无法使用。数字支付领域的平台覆盖差异或影响部分数码产品用户的支付习惯，Apple生态相关配件卖家可关注替代支付方案需求。", "table": [["限制对象", "iPhone用户"], ["背景", "9-1数字卢布正式推出"]], "sourceFull": "https://new-retail.ru/novosti/retail/vladeltsy_iphone_ne_smogut_polzovatsya_tsifrovym_rublyem_s_1_sentyabrya/"}]}
