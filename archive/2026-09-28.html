{"date": "2026-09-28", "stats": {"total": 21, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "cat": "ecom", "catText": "电商动态", "title": "10-01 起平台未经卖家同意不得以卖家费用打折，卖方可设最低价", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-26 07:21", "summary": "ЦСР 主任 Смелов 通报：10-01 生效的《平台经济法》把「卖家费用上的自动折扣」单列规范——平台打折须经卖家同意并提前不少于 5 个工作日通知；卖家有权设定最低价或完全拒绝以自身费用打折，且该拒绝不得成为制裁、降权或搜索降位的依据。对卖家不利的变更（提高佣金、重新界定物流与责任）须提前 45 天通知，其他变更提前 15 天；平台实施制裁或限制商品卡/后台访问时须发具理由的通知，违规消除后 48 小时内必须撤销。含义：Q4 促销日历与费率预算须按 45 天窗口重排，10-01 前完成店铺折扣授权与最低价设置。", "table": [["生效", "2026-10-01（《平台经济法》）"], ["折扣要求", "卖家同意 + 提前 ≥5 个工作日通知"], ["卖方可", "自设最低价或完全拒绝以自身费用打折"], ["不得", "因拒绝打折而降权/降排名/制裁"], ["不利变更通知", "≥45 天（佣金、物流、责任）"], ["其他变更通知", "≥15 天"], ["制裁撤销", "违规消除后 48 小时内"]], "sourceFull": "https://ria.ru/20260926/prodavtsy-2120390925.html"}, {"num": 2, "cat": "ecom", "catText": "电商动态", "title": "平台系银行成消费贷增长最快梯队：WB 银行组合单月 +88%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-27 20:28", "summary": "央行数据显示 8 月无抵押消费贷组合增超 2,200 亿卢布（+1.7%，7 月 +1.1%）。平台系银行是主要增量：Ozon 银行 +20%（+130 亿卢布）、Яндекс 银行 +9%（+120 亿卢布）为前五，Wildberries 银行以 +88% 居 top-100 增幅首位（5 月组合仅约 3,000 万卢布，8 月已翻数倍）。专家预计 Яндекс/Ozon 银行组合到 2027 年底可达 3,000–3,300 亿与 2,500–2,750 亿卢布，但央行自 10-01 起收紧无抵押与车抵/房抵贷款的宏观审慎限额，增速将放缓。含义：平台金融渗透加快，卖家侧分期与账期工具增多；消费贷监管收紧或抑制冲动型高客单转化。", "table": [["8 月无抵押消费贷", "+2,200 亿卢布（+1.7%）"], ["Ozon 银行", "+20%（+130 亿卢布）"], ["Яндекс 银行", "+9%（+120 亿卢布）"], ["Wildberries 银行", "+88%（top-100 增幅第一）"], ["储蓄银行", "+近 2,100 亿卢布（绝对增量第一）"], ["监管变化", "10-01 起宏观审慎限额收紧"]], "sourceFull": "https://www.kommersant.ru/doc/8988128"}, {"num": 3, "cat": "ecom", "catText": "电商动态", "title": "数字卢布被塞进旧骗局：骗子谎称已付款，诱卖家点链接/扫假码", "tag": "local", "tagText": "本地", "source": "Vedomosti(Ведомости)", "time": "09-27 12:46", "summary": "联邦委员会参议员 Шейкин 警告：骗子把「数字卢布」嵌入旧骗术——在分类信息平台谎称已用数字卢布付货款，要求卖家点链接、扫二维码或输入银行 App 信息。数字卢布 09-01 起面向大众开放，前三周已开立近 20 万个账户，公众对规则不熟成为切口。实际转账由付款方发起并确认（需填收款方开通数字卢布账户的手机号），骗子二维码多指向仿冒页骗取登录名、密码、卡号或验证码。正确做法：只在自有银行 App 中自行核对到账，账户无记录绝不交货。含义：C2C、自提点与货到付款的混合收款流程须加「自行核账」环节并培训一线。", "table": [["开放时间", "2026-09-01"], ["前三周数字卢布账户", "近 20 万个"], ["骗术", "谎称已付款 + 假二维码/假链接"], ["应对", "仅在自有银行 App 核对到账后交货"]], "sourceFull": "https://www.vedomosti.ru/society/news/2026/09/27/1232151-moshenniki-nachali-ispolzovat"}, {"num": 4, "cat": "ecom", "catText": "电商动态", "title": "8 月集装箱市场环比 -0.9%；9 月黑海箱量 -25%、西北 +166%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-27 21:11", "summary": "FESCO：8 月俄集装箱市场环比 -0.9%，但 1-8 月累计 +6% 至 472 万 TEU（进口 +16% 至 203 万 TEU、内贸 +3.4%、出口 -3%、过境持平）。«Дело» 显示 8 月环比 -9%，归因新罗西斯克流量下降；9 月前三周亚速海-黑海方向日均箱量 -25%，西北方向 +166%。16 日联合战争委员会（JWC）把整个黑海（土/罗/保/格领海除外）列为高风险区；Sea-Intelligence：8 月集装箱班期准点率跌至 49.9%（低于 2022 年 9 月），平均延误 6.81 天。含义：黑海风险外溢，走西北/远东港口的补货周期、运价与库存前置天数必须重排。", "table": [["8 月（环比）", "-0.9%"], ["1-8 月累计", "+6% / 472 万 TEU"], ["进口", "+16% / 203 万 TEU"], ["9 月前三周·亚速海-黑海", "-25%"], ["9 月前三周·西北方向", "+166%"], ["班期准点率", "49.9%（平均延误 6.81 天）"], ["高风险区", "16 日起全黑海（JWC）"]], "sourceFull": "https://www.kommersant.ru/doc/8988018"}, {"num": 5, "cat": "ecom", "catText": "电商动态", "title": "9 月企业临时用工需求同比 +65%，负荷峰值落在 11 月大促", "tag": "local", "tagText": "本地", "source": "消息报(Izvestia)", "time": "09-28 00:20", "summary": "消息报报道：9 月企业对临时用工的需求同比增长 65%，而平台与配送服务的负荷峰值并不落在新年，而在 11 月的促销季。含义：Q4 仓储分拣、客服与末端配送的临时工需提前到 10 月锁定，排班与人力预算按 11 月峰值编制，避免大促档期出现履约瓶颈；同时注意 9-26 已披露的 2027 年 МРОТ +6.8% 对用工成本基线的抬升。", "table": [["9 月临时用工需求", "+65%（同比）"], ["负荷峰值", "11 月大促（非新年）"], ["主力", "平台与配送服务"]], "sourceFull": "https://iz.ru/2168011/galina-sedova/osennii-kadrovyi-bum-spros-na-vremennyi-personal-vyros-na-65-v-sentiabre-2026-goda"}, {"num": 6, "cat": "ecom", "catText": "电商动态", "title": "住宅开发商将建成 2026 年莫斯科 76% 的购物中心", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-28 02:03", "summary": "«Ъ» 报道：2026 年莫斯科由住宅开发商建设的购物中心占比可能较去年翻倍，达 76%，动因是开发商借此为住宅项目争取优惠条件。含义：社区型与住区配套商业空间供给上升，线上线下融合的小型前置仓/门店铺位可选物业增加，末端履约与 O2O 布局的租金与选址模型或有改善，但同时意味着线下商业竞争在社区层面加剧。", "table": [["2026 年占比", "76%（去年约 38%，或翻倍）"], ["动因", "开发商为住宅项目争取优惠"], ["市场", "莫斯科购物中心"]], "sourceFull": "https://www.kommersant.ru/doc/8988003"}, {"num": 7, "cat": "politics", "catText": "时政要闻", "title": "武契奇宣布辞去塞尔维亚总统职务，将转任总理", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-27 21:21", "summary": "塞尔维亚总统武契奇宣布辞去总统职务，并将在提前议会选举中以执政党塞尔维亚进步党候选人身份竞选总理。其总统任期原定 2027 年春到期；9 月初已解散议会为提前选举铺路，选举缘起于持续的学生抗议。宪法评估显示总理职权比总统更宽、更关键（塞尔维亚总统职位名义上偏礼仪性），因此转任并不削弱其实际影响力。含义：塞尔维亚是俄欧转口与物流要道，选举期欧盟对其制裁施压上升，经塞转口、结算与仓配方案的政策风险需重估。", "table": [["事件", "武契奇宣布辞职（09-27）"], ["原任期", "至 2027 年春"], ["目标职位", "总理（提前议会选举）"], ["背景", "学生抗议 + 9 月初解散议会"], ["影响", "转任后实权更集中（总理职权更宽）"]], "sourceFull": "https://www.kommersant.ru/doc/8988168"}, {"num": 8, "cat": "politics", "catText": "时政要闻", "title": "克宫把「大选后是否加税」的问题转给政府", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-27 11:18", "summary": "克宫发言人佩斯科夫把「是否在大选后引入新税」的问题转给政府，称预算由经济部门负责编制，并回应了对财政部相关表态可能影响民众信任的提问。含义：税负预期仍悬而未决，Q4 促销定价与 2027 年利润测算宜预留税率变化情景；对以俄罗斯为销售端的卖家，增值税、平台代扣与跨境网购税制（2027 年跨境网购 НДС 22% 修正案）需一并纳入价格带模型。", "table": [["表态人", "佩斯科夫（09-27）"], ["问题", "大选后是否新增税负"], ["回应", "应由经济部门解释预算编制"], ["相关", "财政部此前表态引发信任讨论"]], "sourceFull": "https://www.kommersant.ru/doc/8987945"}, {"num": 9, "cat": "politics", "catText": "时政要闻", "title": "特朗普称泽连斯基同意减少对俄炼油厂打击", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-28 01:12", "summary": "特朗普称已在 09-22 与泽连斯基会面时要求其「不要如此猛烈打击俄罗斯炼油厂」，泽连斯基回应「或许会这样做」，理由是打击造成全球性油价问题；特朗普未说明是哪次会面中的表态，两人最近一次会面为 09-22 联大期间。这是美方继 2024 年 3 月后再次以油价为由施压。含义：若打击强度下降，俄成品油供应与干线运价的不确定性缓和；但承诺执行仍待观察，Q4 燃油附加费与到仓时效仍应按情景法测算。", "table": [["表态", "特朗普（09-27）"], ["会面时间", "09-22 联大期间"], ["诉求", "减少对俄炼油厂的打击"], ["理由", "打击推高全球油价"]], "sourceFull": "https://www.kommersant.ru/doc/8988206"}, {"num": 10, "cat": "politics", "catText": "时政要闻", "title": "克宫警告马斯克：若 Starlink 被用于纵深打击将是「轻率之举」", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-27 12:35", "summary": "佩斯科夫警告称，若允许用 Starlink 打击俄纵深目标，对马斯克而言是轻率之举；此前芬兰总统请求马斯克向基辅提供卫星通信。报道显示 Starlink 已用于乌军无人机侦察、打击与炮兵校射，SpaceX 在 2026 年 2 月曾对移动终端加设移动速度等技术限制。含义：纵深打击能力的变化直接影响俄境内物流设施的防空需求与保险条件，仓储与分拨节点的安防投入、保单除外条款需持续复核。", "table": [["表态", "佩斯科夫警告马斯克"], ["诉求方", "芬兰总统"], ["现状", "截至 08-31 最终决定尚未作出"], ["关联", "纵深打击 → 设施保险与安防成本"]], "sourceFull": "https://www.kommersant.ru/doc/8987982"}, {"num": 11, "cat": "politics", "catText": "时政要闻", "title": "克宫不排除普京与习近平、特朗普在 АТЭС 峰会期间会面", "tag": "local", "tagText": "本地", "source": "Vedomosti(Ведомости)", "time": "09-27 12:48", "summary": "佩斯科夫表示，普京可能在中国举行的 АТЭС 峰会期间与中国国家主席习近平和美国总统特朗普会面。此前中美刚就相互降低约 300 亿美元商品关税、设立贸易委员会并启动 AI 对话达成共识，贸易休战再延长两个月。含义：若三方会晤成行，对以中国为采购中枢的卖家，关税、运价与结算环境的短期确定性上升；但需注意此类表态尚未形成正式日程。", "table": [["场合", "АТЭС 峰会（中国）"], ["可能", "普京—习近平—特朗普会面"], ["背景", "中美相互降税约 300 亿美元、贸易休战延两个月"], ["状态", "尚未确认为正式日程"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/27/1232152-peskov-dopustil"}, {"num": 12, "cat": "econ", "catText": "经济金融", "title": "审计院：全年油气收入 7.3 万亿卢布，缺口 1.6 万亿（-18%）", "tag": "local", "tagText": "本地", "source": "消息报(Izvestia)", "time": "09-28 00:20", "summary": "审计院报告预计，2026 年联邦预算油气收入为 7.3 万亿卢布，比批准额少 18%（缺口约 1.6 万亿），主因卢布偏强与供应相关支出上升。含义：财政缺口压力将传导至税制与非税收入，Q4 至 2027 年初政策面扰动概率上升；卖家在定价、税务筹划与合规成本预算中宜预留加税情景。", "table": [["油气收入预测", "7.3 万亿卢布"], ["缺口", "1.6 万亿卢布（-18%）"], ["原因", "卢布偏强、供应支出上升"], ["来源", "审计院报告"]], "sourceFull": "https://iz.ru/2174493/2026-09-28/biudzhet-mozhet-nedopoluchit-16-trln-neftegazovykh-dokhodov"}, {"num": 13, "cat": "econ", "catText": "经济金融", "title": "央行反市场操纵指令三季度 105 份，超过整个上半年", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-27 19:53", "summary": "据 «Ъ» 统计，央行三季度（不完整季度）因违反反市场操纵法（224-ФЗ）向交易参与者开出 105 份指令，比整个上半年还多近四分之一；9 个月内共 190 份（上半年 85 份）。三季度对持牌机构的指令达 181 份，为上半年两倍。但处罚上限偏低（自然人最高 5,000 卢布、法人最高 70 万卢布），取证周期长（Telegram 频道案件耗时约三年）。含义：市场监管趋严，卖家侧「刷单、操纵评价、异常交易」类灰色操作的法律与合规风险在抬升。", "table": [["三季度指令", "105 份"], ["上半年合计", "85 份"], ["9 个月合计", "190 份"], ["三季度对持牌机构", "181 份（上半年两倍）"], ["罚款上限", "自然人 5,000 / 法人 70 万卢布"], ["平均取证周期", "约 3 年（Telegram 频道案例）"]], "sourceFull": "https://www.kommersant.ru/doc/8988092"}, {"num": 14, "cat": "econ", "catText": "经济金融", "title": "МФО 二季度向催收机构转让 430 亿卢布不良债权，为两年新高", "tag": "local", "tagText": "本地", "source": "消息报(Izvestia)", "time": "09-28 00:35", "summary": "央行数据：二季度小额信贷机构（МФО）向催收机构转让不良债权 430 亿卢布，环比增 1.5 倍、同比增三分之一，为两年最高；转让折扣达 80%，逾期 90 天以上占比从 29% 升至 35%。含义：居民端信用质量走弱，分期付款与货到付款类消费的风险敞口上升，卖家的应收与退货损失准备、平台账期政策宜同步收紧。", "table": [["二季度转让额", "430 亿卢布（环比 +1.5 倍）"], ["同比", "+33%"], ["转让折扣", "80%"], ["逾期 90 天以上占比", "29% → 35%"], ["数据来源", "俄罗斯央行"]], "sourceFull": "https://iz.ru/2174498/2026-09-28/mfo-narastili-prodazhu-dolgov-kollektoram-v-poltora-raza"}, {"num": 15, "cat": "econ", "catText": "经济金融", "title": "存款保障体系 2027-01-01 起扩展：死亡风险保额 1000 万卢布", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-27 12:08", "summary": "财政部副部长 Чебесков 表示，自 2027-01-01 起存款保障体系扩展至三类新保险：死亡风险保障每名受保人 1,000 万卢布，其他风险 280 万卢布；适用于 2027 年后新签合同，以及在有效期内继续存续的既有合同。含义：居民储蓄保障增强，有利于存款留存与消费信心，但金融机构合规与成本相应上升，可能间接影响存款利率与理财产品定价。", "table": [["生效日", "2027-01-01"], ["死亡风险保额", "1,000 万卢布/人"], ["其他风险保额", "280 万卢布"], ["覆盖范围", "新合同 + 存续中的旧合同"]], "sourceFull": "https://www.kommersant.ru/doc/8987974"}, {"num": 16, "cat": "econ", "catText": "经济金融", "title": "10-01 起可经他行 ATM 用 СБП 向本人账户存现金，单月上限 20 万卢布", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-28 03:24", "summary": "经司法部登记的央行指令规定：自 2026-10-01 起，可用他行 ATM 以现金经快速支付系统（СБП）转入本人在其他银行开立的账户。限额：单笔不超 2.5 万卢布、单日 5 万卢布、单月 20 万卢布，由 СБП 运营中心校验并回传结果；是否开通由各银行自主决定。目前现金只能通过本行或其合作行设备存入。含义：现金回流渠道增加，自提点与货到付款的现金结算、回款速度与对账效率改善。", "table": [["生效", "2026-10-01"], ["单笔上限", "2.5 万卢布"], ["单日上限", "5 万卢布"], ["单月上限", "20 万卢布"], ["开通", "各银行自主决定"]], "sourceFull": "https://ria.ru/20260928/bankomat-2120606070.html"}, {"num": 17, "cat": "beauty", "catText": "美妆个护", "title": "«М.Косметик» 上半年关闭 97 家门店（同比 4.6 倍），营收仅增 0.8%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-27 13:39", "summary": "Infoline 统计：«М.Косметик»（原 «Магнит Косметик»）1-6 月关闭 97 家门店，为去年同期（21 家）的 4.6 倍；上半年净营收 1,165 亿卢布，仅增 0.8%（去年同期 +6.2%）。母公司 «Магнит» 同期还关闭 5 家大型/超市与 1 家 «Азбука вкуса»，«Моя цена» 与 «В1» 新开店数从 845 家降至 211 家。分析称非食品类线上渠道已占 57%。含义：美妆线下收缩、需求向线上迁移加速，线上货架竞争与流量成本将进一步上行，线下门店铺货型供应商需重排渠道权重。", "table": [["上半年关店", "97 家（去年 21 家，×4.6）"], ["净营收", "1,165 亿卢布（+0.8%）"], ["去年同期增速", "+6.2%"], ["非食品线上占比", "57%"], ["Магнит 新开店", "845 → 211 家"], ["数据来源", "Infoline"]], "sourceFull": "https://www.kommersant.ru/doc/8987392"}, {"num": 18, "cat": "beauty", "catText": "美妆个护", "title": "БАД 进口关税 35% 于 10-02 生效，零售价预计涨 10–15%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-27 21:17", "summary": "政府令（09-25 晚公布）对消费包装、需强制标识的 БАД（膳食补充剂）加征 35% 进口关税，10-02 生效、执行至 2027-12-31，现行税率为 10–20%。DSM Group 估算：按约 3,000 亿卢布市场测算可贡献财政约 300 亿卢布，零售价涨 10–15%；不友好国家 БАД 占市场金额 32.8%、实物 18%，2025 年销售额 752 亿卢布（8,800 万包），涉及 Solgar、Бак-Сет、Детримакс 等主流品牌；8 月药店平均单包价 512.8 卢布（+13.2%）。含义：保健与「保健+个护」组合品的采购结构需向本土/中国供应链切换，10 月前完成价格与标签合规调整。", "table": [["关税", "35%（现 10–20%）"], ["生效", "2026-10-02"], ["执行至", "2027-12-31"], ["价格影响", "+10–15%"], ["财政增收", "约 300 亿卢布"], ["不友好国家占比", "金额 32.8% / 实物 18%"], ["2025 年该类销售额", "752 亿卢布 / 8,800 万包"]], "sourceFull": "https://www.kommersant.ru/doc/8988103"}, {"num": 19, "cat": "other", "catText": "其它动态", "title": "工贸部长：所有需求级别车型的生产均已恢复，机床企业超 400 家", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-27 10:53", "summary": "工贸部长 Алиханов 在机械制造者日表示本国汽车工业发展顺利、所有需求级别车型的生产均已恢复；机床行业有 400 多家企业，已掌握各类工业机器人生产并建成 8 个机器人中心，同时推进民用飞机批产。含义：本土制造业产能持续回补，汽车及车载电子、配件、汽保类目的本地供给竞争加强，进口替代窗口在收窄。", "table": [["表态", "工贸部长 Алиханов"], ["机床企业", "400 余家"], ["机器人中心", "8 个"], ["场合", "机械制造者日（9 月最后一个周日）"]], "sourceFull": "https://ria.ru/20260927/rossija-2120523404.html"}, {"num": 20, "cat": "other", "catText": "其它动态", "title": "俄 8 月自格鲁吉亚矿泉水进口降至 250 万美元，为 2022 年 6 月以来最低", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-28 02:55", "summary": "依据格鲁吉亚海关数据，俄 8 月自格进口矿泉水类饮品降至 250 万美元，环比降约三分之二、同比降逾一半，为 2022 年 6 月以来最低；俄罗斯因此退居第二大进口国，哈萨克斯坦以 310 万美元升至第一（近乎翻倍），乌克兰以 130 万美元排第三（-13%）。含义：饮品进口结构变化，替代供应与本土品牌的空间上升，相关渠道商可关注价格带与货架重排机会。", "table": [["俄 8 月进口", "250 万美元（环比 ≈-2/3）"], ["哈萨克斯坦", "310 万美元（近翻倍）"], ["乌克兰", "130 万美元（-13%）"], ["数据来源", "格鲁吉亚海关"]], "sourceFull": "https://ria.ru/20260928/ekonomika-2120604905.html"}, {"num": 21, "cat": "other", "catText": "其它动态", "title": "专家：МРОТ 自 2020 年以来累计上调 1.5 万卢布，2026 年为 27,093 卢布", "tag": "local", "tagText": "本地", "source": "消息报(Izvestia)", "time": "09-28 03:44", "summary": "金融大学副教授 Балынин 称，最低工资标准（МРОТ）自 2020 年以来累计上调 1.5 万卢布，2026 年为 27,093 卢布。含义：低收入群体名义购买力抬升，性价比与低价带商品的基本盘有支撑；但仓储、分拣与末端配送的工资基数底线同步上行，叠加 2027 年 МРОТ 拟再上调 6.8%，Q4 临时用工与三方物流报价需按更高人力成本重算。", "table": [["2026 年 МРОТ", "27,093 卢布"], ["较 2020 年", "+1.5 万卢布"], ["2027 年拟", "28,935 卢布（+6.8%）"]], "sourceFull": "https://iz.ru/2174543/2026-09-28/mrot-v-rossii-vyros-na-15-tys-rublei-s-2020-goda"}]}
