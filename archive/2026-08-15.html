{"date": "2026-08-15", "stats": {"total": 15, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "俄出口中心(РЭЦ)在天津'俄罗斯制造'展销节设直播带货工作室", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-15 09:00", "summary": "俄出口中心(РЭЦ, ВЭБ.РФ集团)在天津'俄罗斯制造'展销节设置直播带货工作室，观众可边看直播边一键下单。该模式自2019年起在中文社交电商平台运营，2025年扎里亚季耶公园6小时直播销售额突破10亿卢布。9月东方经济论坛期间将办俄中线上节，拟邀粉丝超1亿的博主（含抖音达人大丹丹）参与；俄本土平台也开始自建直播带货应用。", "table": [["2025单场6小时直播销售额", "超10亿卢布"], ["直播带货开展时间", "自2019年起"], ["9月活动", "东方经济论坛俄中线上节（博主粉丝超1亿）"]], "sourceFull": "https://ria.ru/20260815/tovary-2110986278.html"}, {"num": 2, "title": "俄政府扩大强制标签范围：棒棒糖纳入'诚实标识'体系", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-14 21:15", "summary": "米舒斯京签署政府令，将棒状球形硬糖（棒棒糖，单支≤30克扭结包装）纳入强制标签（'诚实标识'）范围，自发布之日起生效，有二次包装的须在二次包装上标注。俄糖果强制标签自3月1日起分阶段实施：3月覆盖饼干、软糖、华夫、果仁糖等，5月覆盖蛋糕糕点，7月覆盖巧克力、糖衣豆与焦糖。糖果类卖家需尽快完成标签注册与数据上传。", "table": [["新增标签品类", "棒棒糖（≤30克扭结包装）"], ["生效时间", "发布之日（8月14日）起"], ["此前阶段", "3月饼干/软糖/华夫，5月蛋糕糕点，7月巧克力/焦糖"]], "sourceFull": "https://ria.ru/20260814/rossija-2111001296.html"}, {"num": 3, "title": "Q2俄儿童自行车均价同比降7.4%至7456卢布", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-13 05:53", "summary": "据'诚实标识'运营商ЦРПТ数据，2026年Q2俄儿童自行车均价7456卢布/辆，环比降5.8%、同比降7.4%；无发动机自行车均价2.1万卢布（环比-7.6%）；自行车市场总供给增至140万辆（同比+2.6%）。夏季促销与库存去化推动价格下行，开学季前自行车类目价格竞争加剧。", "table": [["儿童自行车均价(Q2)", "7456卢布（环比-5.8%/同比-7.4%）"], ["无发动机自行车均价", "2.1万卢布（环比-7.6%）"], ["市场总供给", "140万辆（同比+2.6%）"]], "sourceFull": "https://ria.ru/20260813/velosipedy-2110582085.html"}, {"num": 4, "title": "俄外交部就美国会文件质询美土涉供乌武器，土耳其称'不知情'", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-15 21:04", "summary": "俄外交部发言人扎哈罗娃称，俄已就美国会披露的向基辅供武计划向美、土两国要求澄清：文件显示土耳其拟向乌移交美制武器，包括12套多管火箭炮、超2500枚配套集束弹药、4.7万发203毫米集束炮弹及70枚ATACMS导弹。土耳其总统府回应'不了解此事'，未回应追问。俄土关系与军贸技术合作面临新变量。", "table": [["涉移交武器", "12套多管火箭炮/2500+集束弹药/4.7万发203mm炮弹/70枚ATACMS"], ["土方回应", "总统府：不知情"], ["事件背景", "俄外交部向美土两国要求澄清"]], "sourceFull": "https://ria.ru/20260815/turtsiya-2111139957.html"}, {"num": 5, "title": "6月卢布占俄出口结算份额创纪录69.7%", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-14 17:14", "summary": "据央行数据，6月俄出口商品与服务收入中以卢布结算占比达69.7%，创2019年有数据以来新高（5月为59.9%）。分地区看：亚洲69.1%（5月57.6%）、非洲95.6%（创2025年4月来新高）、欧洲75.3%；美洲降至40.3%、大洋洲39.4%（2022年12月来新低）。出口结算本币化持续推进。", "table": [["6月卢布结算占比", "69.7%（5月59.9%）"], ["亚洲/非洲", "69.1% / 95.6%"], ["美洲/大洋洲", "40.3% / 39.4%"]], "sourceFull": "https://ria.ru/20260814/raschety-2110962364.html"}, {"num": 6, "title": "6月欧盟对俄商品出口同比+4.8%至25.7亿欧元，俄欧贸易重回顺差", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-14 17:40", "summary": "欧统局数据：6月欧盟对俄出口25.7亿欧元（同比+4.8%、环比+21.1%），自俄进口22.8亿欧元（同比-2.1%、环比+3%），欧盟对俄贸易转为顺差2.947亿欧元（5月为逆差8710万欧元）。上半年俄欧贸易额约270亿欧元（同比-13%）：欧盟对俄出口仅-1.3%至148亿，自俄进口-24%至122亿，顺差扩大至约26亿欧元。", "table": [["6月欧盟对俄出口", "25.7亿欧元（同比+4.8%）"], ["6月自俄进口", "22.8亿欧元（同比-2.1%）"], ["上半年贸易额", "约270亿欧元（同比-13%）"]], "sourceFull": "https://ria.ru/20260814/rossija-2110968495.html"}, {"num": 7, "title": "欧洲8月上旬LNG进口降至两年低点，俄气经'土耳其流'增至3月来新高", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-15 12:52", "summary": "据GIE数据，8月1-12日欧盟LNG终端向管网注入32亿立方米，环比-3.7%、同比-12.6%，为2024年8月以来同期最低；同期俄气经'土耳其流'（斯特兰贾2-马尔科奇拉尔点）输欧6.092亿立方米，环比+7%、同比+5%，为3月以来最高。欧盟拟2027年起分阶段禁俄管道气与LNG长期合同，短期采购结构仍在调整。", "table": [["欧盟LNG注入(8/1-12)", "32亿立方米（同比-12.6%）"], ["土耳其流输欧", "6.092亿立方米（环比+7%）"], ["欧盟禁令时间表", "LNG长期合同2027年起禁/管道气2027年11月禁"]], "sourceFull": "https://ria.ru/20260815/evropa-2111066269.html"}, {"num": 8, "title": "央行拟将加密货币纳入专业参与者审慎监管指标", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-14 20:16", "summary": "央行发布监管草案：券商、资管、外汇交易商及加密兑换商计算自有资金时可将交易所允许流通的加密货币计入，占比上限为所接受计算资产的25%，且须托管于加密存管机构；草案公开征求意见。这是8月11日央行将比特币/以太坊/USDT纳入交易所公开交易清单后的配套监管落地，加密市场合规框架逐步成型。", "table": [["适用对象", "券商/资管/外汇交易商/加密兑换商"], ["计入上限", "所计算资产的25%"], ["前提条件", "交易所可流通+托管于加密存管机构"]], "sourceFull": "https://ria.ru/20260814/tsb-2110995657.html"}, {"num": 9, "title": "Совкомбанк上半年IFRS净利润同比+2.6倍至453亿卢布", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-14 15:26", "summary": "俄商业银行Совкомбанк上半年IFRS业绩：净利润453亿卢布（去年同期175亿，+2.6倍）；经常性净利润493亿卢布（+2.5倍）；净息差升至7.2%（去年同期4.5%）；资金成本降至12.4%（去年同期17.4%）；净利息收入1247亿卢布（+70.4%）。高利率环境下银行息差与盈利大幅改善，消费信贷资产质量需持续关注。", "table": [["上半年净利润", "453亿卢布（+2.6倍）"], ["净息差", "7.2%（去年同期4.5%）"], ["净利息收入", "1247亿卢布（+70.4%）"]], "sourceFull": "https://ria.ru/20260814/pribyl-2110931734.html"}, {"num": 10, "title": "印度将任2026俄能源周官方伙伴国，俄吸引印资进入油气", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-13 10:45", "summary": "副总理诺瓦克表示，俄方有意吸引印度投资俄油气行业，并发展与印销售网络合作；印度将首次担任10月举行的'俄罗斯能源周-2026'官方伙伴国。俄印战略伙伴关系下油气项目合作持续深化，能源出口东移格局下印度市场权重上升。", "table": [["印度角色", "俄能源周-2026官方伙伴国（10月举行）"], ["合作方向", "吸引印资入俄油气+发展对印销售网络"]], "sourceFull": "https://ria.ru/20260813/novak-2110627943.html"}, {"num": 11, "title": "分析师：美元汇率近期料在82-85卢布区间波动", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-15 03:26", "summary": "'第一'资管公司高级分析师瓦谢柳克预计，美元兑卢布近期大概率在82-85区间运行：场外美元自夏初已涨超19%、8月以来+6.6%并触及3月以来高点84.5卢布上方；油价回落滞后传导与进口高企压制卢布，但7-8月油价回升将改善出口结汇，月底税期亦支撑卢布，汇率大幅单边波动概率较低。", "table": [["预测区间", "82-85卢布/美元（至夏末秋初）"], ["场外美元8月以来", "+6.6%（高点84.5上方）"], ["支撑因素", "油价回升结汇改善+月底税期"]], "sourceFull": "https://ria.ru/20260815/rubl-2111025603.html"}, {"num": 12, "title": "俄2036年前拟新建17个海港码头、改造25处水运设施", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-13 08:39", "summary": "俄交通部通报：至2036年综合基础设施发展计划包含新建17个海港码头，新建/改造25处水运基础设施（其中北极水域3处、含北方海路沿线2个港口，远东水域12处码头综合体），并改造约4500公里铁路、2000公里公路。物流通道扩容利好跨境贸易与电商履约时效。", "table": [["新建海港码头", "17个（至2036年）"], ["水运设施", "新建/改造25处（北极3处/远东12处码头）"], ["同步改造", "约4500公里铁路、2000公里公路"]], "sourceFull": "https://ria.ru/20260813/mintrans-2110600623.html"}, {"num": 13, "title": "美妆栏目：本期无新增重大动态", "tag": "local", "tagText": "本地", "source": "综合检索", "time": "08-15 10:00", "summary": "2026年8月13-15日窗口内，RIA/Lenta/TASS/Interfax/Kommersant/Vedomosti检索（含косметика/парфюмерия/красота/уход关键词）未见俄罗斯美妆（化妆品/香水）市场的新增重大新闻。按去重规则标注：本期无新增重大动态，不填充旧信息。", "table": [], "sourceFull": ""}, {"num": 14, "title": "电器栏目：本期无新增重大
