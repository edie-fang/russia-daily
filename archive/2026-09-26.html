{"date": "2026-09-26", "stats": {"total": 24, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-25 08:01", "title": "生意人报专题《Торговое многоточие》：电商增速逐季失速，8 月平台消费仅 +17%，“无人机打击平台物流基础设施”被点名为直接原因", "summary": "《生意人报》9-25 刊发专题《Торговое многоточие》：俄电商增速逐年下滑——2023 年 +50%、2024 年 +39%、2025 年 +19%，2026 年预计仅 +15%（至 15 万亿卢布）。СберИндекс 数据显示，8 月平台名义消费同比仅 +17%（7 月 +25.6%、6 月 +29.4%、4–5 月 +31%）。МАРМП 会长 Молодых 认为消费降温正是从 8 月开始，时间上与平台物流基础设施遭袭的峰值重合；卖家被迫寻找新渠道，**线下零售意外受益**，且平台已不再被消费者视为“最低价保证”。对卖家的含义：流量与增速红利同步退坡，多渠道德（线下、自有站、B2B 招标）与“价格可信度”重建的价值上升。", "table": [["e-commerce 增速", "2023 +50% / 2024 +39% / 2025 +19%"], ["2026 预测", "+15%，至 15 万亿卢布"], ["8 月平台消费", "同比 +17%"], ["7 月 / 6 月 / 4–5 月", "+25.6% / +29.4% / +31%"], ["降温起点", "8 月，与物流设施遇袭峰值重合"], ["渠道变化", "卖家转向线下；平台不再等于最低价"]], "sourceFull": "https://www.kommersant.ru/doc/8974520"}, {"num": 2, "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-25 13:16", "title": "Nielsen/GfK 完成俄罗斯业务出售：俄方投资人取得 ГФК-Русь 60%、原总经理 40%，Nielsen 俄资产同期易主", "summary": "国际研究集团 **Nielsen/GfK** 9-25 宣布**完成俄罗斯资产出售**：**ООО «ГФК-Русь» 60% 由俄风险投资人 Константин Леонович 收购、40% 由其总经理 Алексей Дорофеев 旗下公司持有**；同时 Леонович 的公司亦收购了 **Nielsen 的俄罗斯资产**，并将由 Дорофеев 统一领导。管理层称将保留团队与现有合同、继续完整履约。对卖家的含义：俄零售与消费的**第三方测量数据**（货架份额、品类价格、媒体与电商监测）所有权完成本土化，短期服务连续性承诺不变，但**数据口径、样本覆盖与报告模板**在中长期存在调整风险——依赖 Nielsen/GfK 数据做选品与定价的团队应在 Q4 前确认合约与数据连续性条款，并准备替代数据源。", "table": [["交易", "Nielsen/GfK 出售俄业务（09-25 完成）"], ["«ГФК-Русь» 股权", "Леонович 60% / Дорофеев 40%"], ["Nielsen 俄资产", "同期由 Леонович 公司收购"], ["管理层", "Дорофеев 统一领导"], ["对客户承诺", "保留团队与现有合同、完整履约"]], "sourceFull": "https://www.retail.ru/news/gruppa-nielsen-gfk-zavershila-sdelku-po-prodazhe-svoego-biznesa-v-rossii-25-sentyabrya-2026-282577/"}, {"num": 3, "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-25 17:33", "title": "АКОРТ 年会定调：“全渠道”成为俄零售新护城河，RWB 预判下一步是“AI 代理带货”", "summary": "俄零售协会 АКОРТ 9-25 年会：Минпромторг 内部贸易发展司司长 Кузнецов 强调要给所有业态“公平一致”的监管环境、不让任何业态靠监管漏洞获利；Магнит 预计 3–5 年内物流综合体与分拨中心将大规模**机器人化**，无人配送与个性化推荐同步落地；X5 指出“数字平台”定义过宽、需统一规则；RWB（Wildberries&Russ）提出下一阶段是**代理式商业（агентная торговля）**——由 AI 代理完成选品与下单，卖家须提前思考“在 AI 代理世界里如何保持曝光”。", "table": [["监管口径", "业态公平 + 反监管套利"], ["技术趋势", "仓储机器人化、无人配送、个性化推荐"], ["机器人化窗口", "3–5 年（Магнит 判断）"], ["下一步形态", "AI 代理带货（RWB 预判）"], ["卖家风险", "流量入口向 AI 代理迁移"]], "sourceFull": "https://www.retail.ru/news/akort-omnikanalnost-stala-novoy-formoy-ustoychivosti-rossiyskogo-riteyla-25-sentyabrya-2026-282600/"}, {"num": 4, "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-25 12:58", "title": "«Лента» 在莫斯科开出首个 XS 城市版大卖场：玛丽诺 ТРЦ Mari，营业面积 2,544 ㎡、近 13,500 个 SKU", "summary": "«Группа Лента» 9-25 宣布在莫斯科**玛丽诺（Марьино）Поречная 街、ТРЦ Mari** 开出首个首都 **XS 版大卖场（Гипер Лента 城市业态）**：租赁总面积 **4,182 ㎡**、营业面积 **2,544 ㎡**，商品结构按首都居民偏好配置、共近 **13,500 个 SKU**，其中 **3,615 个为自有品牌（СТМ，约 27%）**。该点位此前为其他连锁超市门店，Лента 接手后扩大营业面积并改为城市大卖场（“大卖场的商品广度 + 近场便利”）。对卖家的含义：与本期 [1]“卖家转向线下、平台不再等于最低价”互为印证——**线下商超仍在以“降规格 + 提密度”方式扩张**，且自有品牌占比高，是快消与家居个护类目做线下面推的现实路径与议价参照。", "table": [["门店", "莫斯科 Марьино，ТРЦ Mari"], ["租赁面积 / 营业面积", "4,182 ㎡ / 2,544 ㎡"], ["SKU", "近 13,500"], ["自有品牌（СТМ）", "3,615 个（约 27%）"], ["业态", "Гипер Лента 城市版 XS"]], "sourceFull": "https://www.retail.ru/news/gruppa-lenta-otkryla-gipermarket-v-moskve-25-sentyabrya-2026-282576/"}, {"num": 5, "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)（引 Core.XP）", "time": "09-25 14:38", "title": "Core.XP：远东滨海边疆区仓储仍严重缺货——A 类空置率约 1%、B 类 2%，A 类年租金 10,500–12,500 卢布/㎡", "summary": "Core.XP 研究：符拉迪沃斯托克及周边 A、B 级优质仓储总量约 **47.85 万㎡**（A 类 62%、B 类 38%）。2026 年 9 月 **A 类空置率约 1%、B 类约 2%**，租户几乎无选择；A 类平均报价 **10,500–12,500 卢布/㎡/年**（不含运营费）。区域基本面：人口 180 万+、2025 年 GRP 约 2.3 万亿卢布、零售额 8,780 亿卢布（+9%）。2026–2027 年新增供应约 13.6 万㎡，单体平均 4.5 万㎡，历史建设高峰为 2017 与 2021 年。对卖家的含义：远东“自建/租仓”门槛继续抬升，中转与海外仓选址应向符拉迪沃斯托克以外的次级节点扩散，并把 1% 空置率作为“无备选仓”的极端假设做压力测试。", "table": [["A+B 级总量", "约 47.85 万 ㎡"], ["结构", "A 类 62% / B 类 38%"], ["空置率（09-2026）", "A ≈1% / B ≈2%"], ["A 类租金", "10,500–12,500 卢布/㎡/年"], ["2026–27 新增供应", "约 13.6 万 ㎡"], ["州零售额", "8,780 亿卢布（+9%）"]], "sourceFull": "https://www.retail.ru/news/skladskoy-rynok-primorskogo-kraya-sokhranyaet-defitsitnost-25-sentyabrya-2026-282582/"}, {"num": 6, "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-25 19:00", "title": "国家杜马拟对“过度消费者包装”立法设限：电商包装规范与运输成本面临新约束", "summary": "俄国家杜马 9-25 提出对**过度消费者包装（избыточная потребительская упаковка）**设定要求的立法倡议。这是继“伪环保宣称”整治（9-24）与商品卡环保标识核查之后，包装端监管的又一动作。对卖家的含义：若以“大盒装小件”或过度填充提升货损防护与开箱体验，可能面临合规约束；FBO 入仓的纸箱规格、填充物用量与包装体积需按可能的强制要求预做减法，同时评估“减包”对体积重量与物流费率的连带影响（多为正向）。", "table": [["提案主体", "国家杜马（09-25）"], ["监管对象", "过度消费者包装"], ["关联动作", "伪环保宣称整治、环保标识核查"], ["卖家影响", "FBO 纸箱规格 / 填充物用量"], ["连带影响", "体积重量与物流费率"]], "sourceFull": "https://ria.ru/20260925/chernyshov-2120155115.html"}, {"num": 7, "tag": "local", "tagText": "本地", "source": "俄新社(RIA) / 塔斯社(TASS) / 消息报(Izvestia)", "time": "09-26 04:00", "title": "9-26 凌晨打击直指库班与斯塔夫罗波尔：克拉斯诺达尔边疆区 Северский 区两家企业起火、有人员死亡，涅温诺梅斯克工业区被瞄准", "summary": "9-26 凌晨（MSK）俄南部多点遇袭：克拉斯诺达尔边疆区**Северский 区**遭 БПЛА 袭击——有人员死亡、1 人重伤住院，民宅受损，**两家企业厂区起火**；克拉斯诺达尔市拉响“全民警报”；斯塔夫罗波尔边疆区**涅温诺梅斯克**工业区被无人机瞄准（ПВО 接战、有击落）；图拉州击落 18 架无人机；北高加索与罗斯托夫州发布“火箭危险”；克拉斯诺达尔与索契机场临时限制航班起降。**待核实**：涅温诺梅斯克曾在 7-22 被通报有 Wildberries 仓库遇袭，但本次官方通报仅称“瞄准工业区”，**未确认平台设施受损**，故不计入仓库遇袭数据库。", "table": [["库班（Северский 区）", "2 家企业起火、有人员死亡、1 人重伤"], ["涅温诺梅斯克", "工业区被瞄准，ПВО 接战（未确认平台仓）"], ["图拉州", "击落 18 架 БПЛА"], ["危险级别", "北高加索 + 罗斯托夫州“火箭危险”"], ["机场", "克拉斯诺达尔、索契限制起降"]], "sourceFull": "https://ria.ru/20260926/ataka-2120381083.html"}, {"num": 8, "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-25 20:48", "title": "普京：乌克兰累计损伤 100 余艘俄籍与外籍船舶；基辅在“三个方向”提出停火，俄按自身利益决定接触", "summary": "普京 9-25 在联合文化论坛场边表示：乌克兰率先攻击俄民用基础设施与黑海商船，**累计损伤超过 100 艘船舶**（俄籍与外国旗籍），俄方称“已全部修复”；乌方曾试图对黑海沿岸实施**海上封锁**。他同时称基辅“在三个方向”提出停火（含能源停火），但俄将“从自身利益出发”决定是否恢复接触，并强调乌方应“感受到俄方的反击”。对卖家的含义：黑海航运与战争险仍为高风险变量，经黑海/地中海的班期与保单条款需按“随时中断”假设管理，Q4 舱位应预置替代路径。", "table": [["受损船舶", "100+ 艘（俄籍 + 外国旗籍）"], ["停火提议", "三个方向（含能源停火）"], ["俄方立场", "按自身利益决定接触"], ["黑海封锁", "乌方曾尝试海上封锁"], ["俄方表态", "损失已全部修复"]], "sourceFull": "https://www.kommersant.ru/doc/8987358"}, {"num": 9, "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant) / Lenta.ru", "time": "09-26 03:06", "title": "特朗普促泽连斯基赴莫斯科谈判被拒，德国外长支持邀请普京出席 G20 迈阿密峰会", "summary": "彭博社 9-25 报道：特朗普在联合国大会期间促请泽连斯基赴莫斯科与普京直接会晤，乌方办公室随后否认/拒绝该说法（俄乌双方表述存在出入，**待核实**）。同期德国外长 Вадефуль 表示支持特朗普邀请普京出席 G20 迈阿密峰会，认为可检验俄方意愿；Lenta.ru 亦称特朗普在会上呼吁泽连斯基与普京会面。对卖家的含义：制裁与结算框架的松动预期会先反映在**跨境收款渠道与汇兑成本**上；在政策正式落定前，不宜依据“缓和大新闻”做激进的定价或备货调整。", "table": [["特朗普提议", "泽连斯基赴莫斯科谈判"], ["乌方", "拒绝/否认（口径不一致，待核实）"], ["德国外长", "支持邀请普京出席 G20"], ["峰会地点", "迈阿密"], ["潜在影响面", "跨境收款与汇兑成本"]], "sourceFull": "https://www.kommersant.ru/doc/8987376"}, {"num": 10, "tag": "local", "tagText": "本地", "source": "消息报(Izvestia) / 生意人报(Kommersant)", "time": "09-25 19:44", "title": "中选委正式确认杜马选举结果：46 名特别军事行动参与者与老兵当选；普京签署新一届杜马首次会议令", "summary": "俄中央选举委员会（ЦИК）9-25 会议**正式确认第九届国家杜马选举结果**，主席 Памфилова 通报 **46 名特别军事行动参与者与老兵当选**议员。同日普京签署总统令，确定新一届国家杜马首次会议安排；佩斯科夫强调要避免因选举造成杜马工作的长期空档。对卖家的含义：新一届杜马的构成与委员会分工，将决定 2027 年**平台经济、税收与商品标记类立法**的推进节奏——10 月起的法案流向值得按周跟踪（含此前已排队的退货新规与跨境 НДС）。", "table": [["选举结果", "ЦИК 正式确认（09-25）"], ["老兵议员", "46 名 СВО 参与者/老兵"], ["总统令", "确定杜马首次会议安排"], ["克里姆林宫", "避免杜马长期空档"], ["关注点", "2027 立法节奏与法案流向"]], "sourceFull": "https://iz.ru/2173808/2026-09-26/tcik-46-uchastnikov-i-veteranov-svo-izbrany-v-gosdumu"}, {"num": 11, "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant) / Vedomosti", "time": "09-25 19:16", "title": "俄国防部：打击基辅 «Датагрупп» 数据中心（为乌军处理情报数据）；9-25 昼间击落 55 架无人机", "summary": "俄国防部 9-25 通报，俄军打击了基辅的 **«Датагрупп» 数据中心**，称其处理并传输为乌军服务的情报数据；同期通报 9-25 08:00–20:00（MSK）在俄境内**击落 55 架**乌克兰无人机。规模趋势：9-23 通报 514 架、9-24 通报 40 架、9-26 凌晨再度升级为南部多点袭击。对卖家的含义：数据中心、通信与电网与仓储同属“基础设施互击”范畴，属运营连续性风险；**ERP、订单与云服务的异地容灾**（含备份与切换演练）应纳入 Q4 预案。", "table": [["打击目标", "基辅 «Датагрупп» 数据中心"], ["9-25 昼间", "击落 55 架 БПЛА"], ["9-23 通报", "514 架"], ["9-24 通报", "40 架"], ["趋势", "9-26 凌晨南部再度升级"]], "sourceFull": "https://www.kommersant.ru/doc/8987314"}, {"num": 12, "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-25 07:47", "title": "新沙赫京斯克炼油厂遭空袭停产：被称为“南部最大油品供应商”的企业停摆，当日该州击落约 50 架无人机", "summary": "罗斯托夫州州长 Слюсарь 9-25 通报：**新沙赫京斯克炼油厂（НПЗ）**在空袭中受损、企业**暂时停产**，厂区无人员伤亡；当日该州击落约 **50 架**无人机（卡缅斯克-沙赫京斯基、新沙赫京斯克及米列罗沃等 6 个区）。该厂产出汽油、重油、船用/柴油与取暖油，被称作“俄南部最大油品供应方”。历史参照：2024-06 受损后一度全面停产、修复约 3 周；2022-07 则以单套装置维持生产。对卖家的含义：南部汽柴油与取暖油供应、公路运价与燃油附加费存在上行风险，Q4 运价模型应预留燃料成本波动并复核南向线路。", "table": [["事件", "НПЗ 受损、暂时停产"], ["厂区伤亡", "无"], ["当日击落", "约 50 架 БПЛА"], ["产品线", "汽油/重油/柴油/船用油/取暖油"], ["历史修复参照", "2024-06 全面停产约 3 周"]], "sourceFull": "https://www.kommersant.ru/doc/8974732"}, {"num": 13, "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "09-25 21:37", "title": "央行下调官方汇率：美元 84.34 卢布（−0.56）、欧元 95.02（−1.02），欧元跌破 96 为 8-13 以来首次", "summary": "俄央行公布 9-26 官方汇率：**美元 84.34 卢布**（较 9-25 的 84.91 下调 0.56）、**欧元 95.02 卢布**（下调 1.02，为 **8-13 以来首次低于 96**）、**人民币 12.54 卢布**（下调 0.11）。此前（9-24）经济发展部长 Решетников 称 2026 年美元年均汇率将落在 **79.5 卢布**，并预计 2027–2029 年卢布逐步走弱。对卖家的含义：卢布短期偏强会压低以卢布计的进口成本、但压缩出口与跨境结算的汇差；结合“汇率按月锁定”的薪酬与报价机制，应在月底前更新 10 月内部结算汇率与保底价。", "table": [["美元（09-26）", "84.34 卢布（−0.56）"], ["欧元", "95.02 卢布（−1.02）"], ["人民币", "12.54 卢布（−0.11）"], ["欧元破 96", "8-13 以来首次"], ["2026 年均汇率预测", "79.5 卢布/美元（Минэк）"]], "sourceFull": "https://www.vedomosti.ru/finance/news/2026/09/25/1231969-kurs-dollara-snizhen"}, {"num": 14, "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-25 21:51", "title": "2027 年酒类与烟草消费税上调 6.1–6.8%：烈酒或至 878 卢布/升，烟草非法市场已达 11–12%", "summary": "俄《税法》修正案草案拟将 2027 年酒类与烟草消费税上调 **6.1–6.8%**（2026 年个别酒类涨幅曾超 30%）；专家预计酒类零售价因此上行 **5–10%**；“国际文传电讯”消息称烈酒消费税将涨 6.6% 至 **878 卢布/升无水酒精**。烟草方面：消费税占售价 **70–85%**，财政部副部长 Сазанов 称非法烟草份额已从 9–10% 升至 **11–12%**，预算因此少收 **1,000–1,200 亿卢布**，政府拟以零售许可制应对。对卖家的含义：涉酒/涉烟与礼品酒类目需提前调价与备货，同时警惕“提价→向低税域（ЕАЭС）转移”带来的合规与渠道风险。", "table": [["2027 消费税", "+6.1–6.8%"], ["烈酒", "或 +6.6% → 878 卢布/升无水酒精"], ["酒类零售价", "预计 +5–10%"], ["烟草消费税占价", "70–85%"], ["非法烟草份额", "11–12%（此前 9–10%）"], ["预算流失", "1,000–1,200 亿卢布"]], "sourceFull": "https://www.kommersant.ru/doc/8987384"}, {"num": 15, "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)（引 Минфин РФ）", "time": "09-25 11:49", "title": "2027 年最低工资升至 28,935 卢布（+6.8%），最低生活保障线 20,227 卢布", "summary": "财长 Силуанов 在政府会议上介绍三年预算草案：**2027 年 МРОТ（最低工资）为 28,935 卢布，同比 +6.8%**（与明年工资增速预测一致）；**最低生活保障线（ПМ）上调 6.8% 至 20,227 卢布**，据此提高各类补贴与社会给付。他确认“到 2030 年 МРОТ 达 35,000 卢布”的总统目标将完成。对卖家的含义：最低工资与 ПМ 双升会同步抬升仓储、分拣与末端配送的**用工成本底线**；Q4 旺季临时工与三方物流报价须按 6.8% 的工资基数上浮重新询价。", "table": [["2027 МРОТ", "28,935 卢布（+6.8%）"], ["最低生活保障线", "20,227 卢布（+6.8%）"], ["2030 目标", "МРОТ 35,000 卢布"], ["工资增速假设", "+6.8%"], ["来源", "财长 Силуанов（政府会议）"]], "sourceFull": "https://www.retail.ru/news/v-2027-godu-mrot-mozhet-vyrasti-do-28-935-rubley-25-sentyabrya-2026-282568/"}, {"num": 16, "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "09-25 09:52", "title": "被动收入并入个税主税基：13–22% 累进，涉约 400 万公民、财政增收逾 1,000 亿卢布；ПИФ 15% 仅限合格投资者", "summary": "俄财长 Силуанов 9-24 宣布：居民被动收入（股息、存款利息、证券与数字权利交易、保险合同收入）将并入个人所得税主税基，**按 13–22% 累进税率**征收，税率取决于收入规模而非来源。РАНХиГС 专家 Еремкин 估算该措施可带来**逾 1,000 亿卢布**财政增收、涉及约 **400 万公民**，或影响最活跃人群的投资意愿。官方同期澄清：对 ПИФ 征收 **15% 利润税**仅适用于面向合格投资者的封闭式/区间式基金。对卖家的含义：“个税累进 + 基金税”会改变高收入人群可支配收入与投资偏好，是高价消费品与房产/家居链需求的新结构性变量。", "table": [["被动收入税率", "13–22% 累进"], ["财政增收", "逾 1,000 亿卢布"], ["涉及人数", "约 400 万公民"], ["ПИФ 利润税", "15%（仅限合格投资者基金）"], ["宣布时间", "09-24（政府会议）"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/09/25/1231734-poluchit-100-rublei"}, {"num": 17, "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "09-25 19:36", "title": "央行盯上“以分期之名行消费贷之实”：部分银行与电商平台涉嫌误导，已下发整改指令", "summary": "俄央行行为监督司代理司长 Колганов 9-25 在国际银行论坛表示：部分市场主体（含银行）把消费贷包装成“免息分期（рассрочка）”，内部却实际收取“分期手续费”等费用，属**不正当经营惯例**，央行正在整改并已下发指令。他特别指出部分**电商平台**也在提供此类“分期”，但“**平台只是橱窗，产品实际由银行提供**”。对卖家的含义：“分期/免息”促销话术可能被要求重写；与第三方分期服务商的合作条款、费用披露与客户告知义务需前置合规检查，避免大促期间被迫下架支付方式。", "table": [["监管主体", "央行行为监督司"], ["问题", "消费贷包装为免息分期"], ["措施", "整改 + 下发指令"], ["涉及主体", "部分银行与电商平台"], ["平台角色认定", "仅“橱窗”，产品由银行提供"]], "sourceFull": "https://www.vedomosti.ru/finance/news/2026/09/25/1232007-borotsya-s-maskirovkoi-potrebkreditov"}, {"num": 18, "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-25 17:25", "title": "俄气上半年天然气产量 2,165.5 亿立方米（+3.38%）；对近邻国家供气 +29%", "summary": "俄气（«Газпром»）发行人报告显示：2026 年上半年天然气（含伴生气）产量 **2,165.5 亿立方米，同比 +3.38%**（公司归因于寒冬）；同期对“近邻国家”供气 **+29%**；对欧盟方向，欧委会 9-25 因高价呼吁成员国**削减天然气消费**。对卖家的含义：气量增产与对近邻出口增长意味着工业用气与发电成本在 Q4 前相对可控；但欧盟需求波动会通过化工原料与包装成本传导至本土供应链，包材与含化工原料的类目建议锁定 1–2 个季度的价格。", "table": [["上半年产量", "2,165.5 亿立方米"], ["同比", "+3.38%"], ["原因", "寒冬拉动"], ["对近邻国家供气", "+29%"], ["欧盟动向", "呼吁成员国削减用气"]], "sourceFull": "https://www.kommersant.ru/doc/8987212"}, {"num": 19, "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)（引 Reuters）", "time": "09-25 17:11", "title": "意大利反垄断机构对 P&G 结案：Braun 脱毛仪撤下“两年无毛”承诺，100 天退款保障延长至年底", "summary": "意大利反垄断机构 **AGCM** 结束对 **Procter & Gamble** 的调查：因 Braun Skin i·expert 脱毛仪广告中“可保持身体**两年**无毛”的表述被认定可能**误导消费者**（夸大且不够直观），P&G 承诺撤下该宣称，并把 **100 天全额退款保障延长 6 个月至 12 月底**，机构据此结案（路透 9-25）。对卖家的含义：这是欧洲监管对美妆个护类**功效宣称**（时长、百分比、绝对化用语）收紧的最新案例；俄平台商品卡的“效果承诺”文案（含“永久/长期/彻底”类词）应同步做合规体检，并保留检测或临床依据备查。", "table": [["监管机构", "意大利 AGCM"], ["涉事产品", "Braun Skin i·expert 脱毛仪"], ["被质疑宣称", "“两年无毛”"], ["企业整改", "撤下该宣称"], ["退款保障", "100 天 → 延长至 12 月底"]], "sourceFull": "https://www.retail.ru/news/procter-gamble-otkazalas-ot-obeshchaniy-gladkoy-kozhi-v-reklame-25-sentyabrya-2026-282599/"}, {"num": 20, "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)（引 «Дела PR»）", "time": "09-25 14:49", "title": "«Дела PR» 调研：仅 15% 俄消费者会因公开丑闻彻底弃用品牌，82% 认为“质量差”才是致命伤", "summary": "传播机构 «Дела PR» 调研显示：俄消费者并不倾向因公开丑闻立刻抵制品牌——**仅 15% 会彻底弃用并转向竞品**；**70% 认为企业应首先赔偿受损方**，仅约 50% 期待公开道歉。最伤信任的是**产品质量差（82%）**，其次是欺骗消费者/信息不实（62%）、危及健康与安全（57%）、员工态度粗暴（45%）；高管不端 22%、失败营销 17% 影响相对较小。对美妆与个护卖家的含义：与其投入危机公关话术，不如把“质量与赔付”做成可见承诺（检测报告、成分透明、明确赔付流程）——这比公关更能稳定复购与评分。", "table": [["彻底弃用品牌", "仅 15%"], ["期待赔偿受损方", "70%"], ["期待公开道歉", "约 50%"], ["最伤信任", "产品质量差（82%）"], ["欺骗/误导", "62%"], ["高管不端 / 失败营销", "22% / 17%"]], "sourceFull": "https://www.retail.ru/news/rossiyane-ne-otkazyvayutsya-ot-brendov-iz-za-publichnykh-skandalov-25-sentyabrya-2026-282584/"}, {"num": 21, "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant) / Vedomosti", "time": "09-25 21:22", "title": "数字发展部拟强制在 Smart TV 预装 RuStore：2027 年起适用 40+ 款俄产应用清单", "summary": "俄数字发展部（Минцифры）公布政府决议草案，拟要求**带互联网功能的 Smart TV 预装 RuStore** 应用商店；部门强调预装不代表强制使用，意在让用户在电视端获得**目前在 Google Play / Google TV 不可用**的应用。背景：政府 7 月已确定自 **2027 年**起在 Android、iOS、HarmonyOS、HyperOS 等设备上强制预装的 **40+ 款**俄产与欧亚经济联盟应用清单，RuStore 名列其中（VK 自 2023 年起即推动电视端预装）。对卖家的含义：电视端应用分发生态扩张会改变**智能电视/机顶盒**在俄的产品定义（需适配本地商店与内容），相关硬件与配件存在窗口，但须提前做软件兼容与认证。", "table": [["草案主体", "Минцифры（09-25）"], ["要求", "Smart TV 预装 RuStore"], ["使用", "自愿，非强制"], ["强制清单生效", "2027 年起（40+ 款应用）"], ["覆盖系统", "Android / iOS / HarmonyOS / HyperOS"]], "sourceFull": "https://www.kommersant.ru/doc/8987336"}, {"num": 22, "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)（引 Poizon/«Дэву»）", "time": "09-25 21:22", "title": "Poizon（得物）：AI 智能眼镜进入俄罗斯年轻人设备 Top-5", "summary": "跨境平台 Poizon（俄市场名 «Дэву»）发布数据：**AI 智能眼镜已进入俄罗斯年轻用户常用设备 Top-5**。结合 9-24 报道的“智能手机与笔记本可享‘技术费’33% 折扣（与 ГИС 商品标记登记挂钩）”与 RuStore 电视端预装推进，可穿戴与智能硬件在俄的**政策–渠道–需求**三端同时出现松动信号。对卖家的含义：AI 眼镜属高单价、快迭代品类，需重点评估**技术费计征口径**（是否含电子元件基础）、商品标记合规与售后能力（软件更新、镜片适配），再决定铺货深度与生命周期定价。", "table": [["数据来源", "Poizon（«Дэву»）"], ["结论", "AI 眼镜进入年轻人设备 Top-5"], ["关联政策", "“技术费”33% 折扣（ГИС 登记挂钩）"], ["关联渠道", "RuStore 电视端预装推进"], ["卖家关注", "计征口径 + 标记合规 + 售后"]], "sourceFull": "https://www.retail.ru/news/poizon-devu-ii-ochki-voshli-v-top-5-ustroystv-u-molodezhi-25-sentyabrya-2026-282605/"}, {"num": 23, "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)（引 Дом.РФ）", "time": "09-25 14:40", "title": "Дом.РФ：1,630 万平方米新房面临“去化不足”风险，克拉斯诺达尔去化周期 5.6 年", "summary": "Дом.РФ 分析中心向《РБК Недвижимости》提供的数据显示：截至 9 月初，**约 1,630 万平方米**（近一半在建住房）存在去化不足风险，集中在**十大建设大区**——莫斯科 280 万㎡、克拉斯诺达尔边疆区 270 万㎡、莫斯科州 190 万㎡居前。去化周期最长：**克拉斯诺达尔边疆区 5.6 年**、巴什科尔托斯坦 4.4 年、列宁格勒州 4 年；最短为圣彼得堡与莫斯科州 2.3 年、莫斯科 2.6 年。归因于新房需求放缓与市场按揭利率高企。对灯具/家居卖家的含义：**房屋交付与装修需求（照明的领先指标）在南部与乌拉尔方向进一步后移**，Q4 备货权重应向去化较快的大都市圈倾斜，压制对南部的乐观预期。", "table": [["去化不足风险房源", "1,630 万 ㎡（9 月初）"], ["莫斯科 / 克拉斯诺达尔 / 莫斯科州", "280 / 270 / 190 万 ㎡"], ["最长去化周期", "克拉斯诺达尔 5.6 年"], ["巴什科尔托斯坦 / 列宁格勒州", "4.4 / 4 年"], ["最短", "圣彼得堡与莫斯科州 2.3 年、莫斯科 2.6 年"], ["归因", "需求放缓 + 市场按揭高利率"]], "sourceFull": "https://www.kommersant.ru/doc/8984718"}, {"num": 24, "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-25 14:51", "title": "别尔哥罗德州拟 4 年更换 986 部电梯（州财政 / 住宅大修渠道）：住宅公用设备更新采购持续放量", "summary": "别尔哥罗德州计划**在 4 年内以州财政资金、通过多户住宅大修（капремонт）渠道更换总计 986 部电梯**（Коммерсантъ 9-25）。公告本身**未提及照明设备**；但该 капремонт 通道同时采购**公共区域电气与照明、线路与配电**，是俄市政/住宅更新类 B 端订单的典型入口。对灯具卖家的含义：俄住宅大修与市政更新仍是**预算化、批次化**的采购流，中标要素是**长寿命、低光衰、能效论证与本地认证**；建议与地方大修运营商（региональный оператор капремонта）建立名录关系，而不是只做零售端。", "table": [["计划", "4 年内更换 986 部电梯"], ["资金", "州财政"], ["通道", "多户住宅大修（капремонт）"], ["同通道品类", "公共区域电气/照明、线路与配电"], ["报道", "Коммерсантъ 09-25"]], "sourceFull": "https://www.kommersant.ru/doc/8987089"}]}
