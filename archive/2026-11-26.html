"}, {"num": 14, "cat": "econ", "catText": "经济金融", "title": "周通胀加速至 0.3%：11 月累计 0.6%、年初至今 6.72%，黄瓜一周涨 12.8%", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-25 19:34", "summary": "俄统计局：11-17~23 周通胀 0.3%（前一周 0.19%），11 月累计 0.6%、年初至今 6.72%。蔬果周涨 1.9%，黄瓜 +12.8%、洋葱 +1.8%；非食品中智能手机 +0.5%、外资新乘用车 +0.2%；汽油 +0.5%、柴油 +0.8%。副总理已要求 ФАС 与农业部核查涨价最快的食品定价。", "table": [["周通胀", "0.3%（前周 0.19%）"], ["11 月累计", "0.6%"], ["年初至今", "6.72%"], ["黄瓜", "+12.8%（一周）"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/11/25/1415378-nedelnaya-inflyatsiya"}, {"num": 15, "cat": "econ", "catText": "经济金融", "title": "美方公布对 14 国加征最高 35% 关税：越南 35%、中国至 20%、欧盟 15%，听证定于 2027-01-25", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "11-25 21:00", "summary": "美国贸易代表办公室 11-25 宣布拟对 14 个贸易伙伴加征最高 35% 关税（依 1974 年贸易法 301 条）：越南 35%、印度 25%，中国与新加坡至 20%，东盟五国至 18%，欧盟、日本、韩国、瑞士、台湾至 15%；听证会 2027-01-25，书面意见 01-05 截止。11-24 期预告的「16 国」已明确为 14 国。", "table": [["最高税率", "35%（越南）"], ["中国 / 欧盟", "至 20% / 15%"], ["依据", "1974 年贸易法 301 条"], ["时间表", "意见 2027-01-05、听证 01-25"]], "sourceFull": "https://www.kommersant.ru/doc/9130729"}, {"num": 16, "cat": "econ", "catText": "经济金融", "title": "央行拟扩大官方汇率计算所用交易基数：与交易时段同步开收、纳入定向交易", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-25 18:25", "summary": "央行公布《指示》草案：拟扩大官方汇率计算所用的交易基数，把数据采集起点与交易所交易时段同步，并纳入定向交易等非主交易模式。现行依据为 2024-12-27 第 6956-У 号指示（合并场内与场外数据、必要时用交叉汇率），调整后官方汇率将更贴近实际成交。", "table": [["现行依据", "2024-12-27 第 6956-У 号指示"], ["变化", "同步开收 + 纳入定向交易"], ["状态", "草案公开征求意见"], ["影响", "海关计价/税费/结算参考汇率"]], "sourceFull": "https://www.vedomosti.ru/finance/news/2026/11/25/1415350-rasshirit-bazu-sdelok"}, {"num": 17, "cat": "econ", "catText": "经济金融", "title": "财政部拟自 2027-01-01 起把美食类（海鲜/帕玛森/火腿/松露）进口关税提至 15%", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-25 13:57", "summary": "财政部副部长萨扎诺夫称，拟自 2027-01-01 起把美食类进口关税提至 15%，覆盖海鲜、帕玛森、火腿、松露等，具体清单稍后确定，政府法规草案正在审议。配套拟取消此类商品 10% 优惠增值税（回到 22%），财政部估算可增加约 60 亿₽ 收入。", "table": [["关税税率", "15%（拟）"], ["生效", "2027-01-01"], ["清单", "待定"], ["VAT", "10% → 22%（拟）"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/11/25/1415192-minfin-predlozhil"}, {"num": 18, "cat": "econ", "catText": "经济金融", "title": "АКАР：1–9 月广告市场仅 +6% 至 7,200–7,250 亿₽，跑输通胀；互联网服务与户外各 +9%", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-25 10:08", "summary": "АКАР 专家委员会：1–9 月俄广告市场同比 +6% 至 7,200–7,250 亿₽（不含 VAT），低于同期通胀（9 月 6.35%），也比 2025 年同期 8% 放缓。互联网服务广告 +9% 至 3,915–3,935 亿₽、户外 +9% 至 850–860 亿₽、视频 +3%；出版 -5%、音频 -4%。上半年 +6% 至 4,450–4,500 亿₽。", "table": [["1-9 月", "+6%（7,200–7,250 亿₽）"], ["互联网服务", "+9%（3,915–3,935 亿₽）"], ["户外 / 视频", "+9% / +3%"], ["出版 / 音频", "-5% / -4%"]], "sourceFull": "https://www.vedomosti.ru/media/news/2026/11/25/1415062-reklamnii-rinok-v-yanvare-sentyabre"}, {"num": 19, "cat": "politics", "catText": "时政要闻", "title": "一夜 305 架无人机被击落于 14 州：萨马拉州 145+ 架、1 死，9 城机场自 11-24 晚受限", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-25 09:57", "summary": "俄国防部：一夜在 14 个州击落 305 架乌克兰固定翼无人机，含萨马拉、伏尔加格勒、萨拉托夫、乌里扬诺夫斯克、下诺夫哥罗德、坦波夫等；萨马拉州一夜击落 145+ 架，1 人死亡、部分地区停电、学校改作息。萨马拉、萨拉托夫、坦波夫、卡卢加、奔萨、乌法、索契等机场自 11-24 晚起限制起降。", "table": [["击落总数", "305 架（14 州）"], ["萨马拉州", "145+ 架、1 死"], ["机场限制", "萨马拉/萨拉托夫/坦波夫/卡卢加等 9 城"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/11/25/1415057-305-ukrainskih-bespilotnikov"}, {"num": 20, "cat": "politics", "catText": "时政要闻", "title": "涅温诺梅斯克工业区 11-26 凌晨遭无人机袭击，斯塔夫罗波尔全州进入无人机危险状态", "tag": "local", "tagText": "本地", "source": "Интерфакс", "time": "11-26 03:09", "summary": "斯塔夫罗波尔边疆区州长通报：11-26 凌晨防空部队在涅温诺梅斯克（Невинномысск）工业区拦截来袭无人机，已有目标被击落，全州进入「无人机危险」状态。暂无设施损毁与伤亡通报。该市为北高加索化工与化肥基地，对南向干线（新罗西斯克/矿水城方向）时效构成短期扰动。", "table": [["时间", "2026-11-26 凌晨"], ["地点", "涅温诺梅斯克工业区"], ["状态", "拦截中，无伤亡/损毁通报"]], "sourceFull": "https://www.interfax.ru/russia/1131455"}, {"num": 21, "cat": "politics", "catText": "时政要闻", "title": "欧盟理事会批准 2027 年向乌克兰提供最高 450 亿欧元（属 900 亿欧元贷款框架）", "tag": "local", "tagText": "本地", "source": "Lenta.ru", "time": "11-25 22:11", "summary": "欧盟理事会批准 2027 年向乌克兰提供最高 450 亿欧元援助，期限 2027-01-01 至 12-31，属 900 亿欧元贷款框架；11-16 已批准近 80 亿欧元 Ukraine Facility 付款（该机制单笔最大）。欧盟一边融资一边筹备 12 月第 22 轮对俄制裁，欧洲方向结算、保险与转运成本短期难降。", "table": [["金额", "最高 450 亿€（2027 年）"], ["框架", "900 亿€ 贷款"], ["前期", "11-16 批准近 80 亿€"]], "sourceFull": "https://lenta.ru/news/2026/11/26/es-odobril-vydelenie-ukraine-45-milliardov-evro/"}, {"num": 22, "cat": "politics", "catText": "时政要闻", "title": "库什纳：俄乌战俘交换预计节前完成，俄方寻求解决但「不是任何条件都接受」", "tag": "local", "tagText": "本地", "source": "Интерфакс", "time": "11-25 23:04", "summary": "美总统特使库什纳称俄乌战俘交换预计「节前」完成（未来数周）；他表示俄方寻求解决乌克兰问题，但「不是任何条件都接受」，美方将推动俄欧沟通渠道并呼吁欧盟指定单一谈判代表。目前无具体条款、时间表与监督机制，属谈判进程信号，待核实。", "table": [["战俘交换", "节前（未来数周，待核实）"], ["俄方立场", "寻求解决但有条件"], ["机制", "美方推动俄欧沟通渠道"]], "sourceFull": "https://www.interfax.ru/world/1131435"}, {"num": 23, "cat": "politics", "catText": "时政要闻", "title": "欧盟第 22 轮制裁 12 月通过：再断 60 家银行 SWIFT、制裁 70+ 影子油轮、禁为俄能源设施服务", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "11-25 11:03", "summary": "欧盟第 22 轮对俄制裁将于 12 月通过，11-26~27 特别峰会审议：拟再断开 60 家俄银行 SWIFT、限制加密与支付平台、制裁 70+「影子舰队」船舶、禁止为俄能源设施（炼厂、电力）提供服务并禁止在俄为油轮投保，另加 100+ 实体与个人，收紧签证。对跨境结算、货代与保险链路影响直接。", "table": [["SWIFT", "再断 60 家俄银行"], ["船舶 / 实体", "70+ 油轮 / 100+ 实体"], ["时间", "12 月通过，11-26~27 峰会审议"]], "sourceFull": "https://www.kommersant.ru/doc/9129923"}]}
