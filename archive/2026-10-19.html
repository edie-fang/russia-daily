{"date": "2026-10-19", "stats": {"total": 22, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "cat": "ecom", "catText": "电商动态", "title": "🚨仓库被炸：Ozon 圣彼得堡（列宁格勒州）物流中心凌晨遭无人机袭击起火", "tag": "local", "tagText": "本地", "source": "«Коммерсантъ» / Ozon 官方公告", "time": "10-18 08:36", "summary": "10-18 凌晨，Ozon 位于圣彼得堡/列宁格勒州的一处物流中心遭无人机袭击并起火。Ozon 官方通报称已迅速疏散全部员工、无人伤亡，应急部门现场处置；平台已把该中心在库商品从展示页下架，并将取消无法从其他设施送达的订单，同时明确该综合体不接收卖家供货（故对卖家在库库存的直接影响有限）。当晚列宁格勒州方向遭大规模空袭，州内 1 死 15 伤、Пулково 机场 50 余航班延误。对我方含义：圣彼得堡集群末端派送与跨区调拨受扰动，且该事故发生在 Ozon 10-13 停保「货损+无人机袭击险」之后，北部在仓与在途货需按「自担风险」口径评估。", "table": [["遇袭设施", "Ozon 物流中心（圣彼得堡 / 列宁格勒州）"], ["平台通报", "员工全部疏散 · 无人伤亡 · 发生起火"], ["卖家影响", "商品下架 + 订单取消；该中心不接收卖家供货"], ["集群影响", "圣彼得堡集群末端派送与跨区改道"]], "sourceFull": "https://www.kommersant.ru/doc/9041227"}, {"num": 2, "cat": "platform", "catText": "平台规则变动", "title": "Ozon：12-01 起改用新版结算公式，取消「折扣积分」计提与核销", "tag": "local", "tagText": "本地", "source": "Ozon 卖家官方（seller.ozon.ru）", "time": "10-16 17:33", "summary": "Ozon 宣布自 2026-12-01 起按新方式计算销售费率与其他服务费用，取消此前「折扣积分（баллы за скидки）」的计提与核销；平台称本次仅调整结算技术，卖家实际收益不变，但「Финансы」中每单显示的 Ozon 实收佣金将随买家各类额外折扣直接体现，并与结算/关账单据一致。对跨境卖家的含义：佣金口径更透明，但需按新口径重算净利率与促销折让敞口，并在 12-01 前核对当前积分抵扣造成的账期差异；旧积分余额的过渡处理规则平台尚未逐条说明（待核实）。", "table": [["⏱ 生效时间", "2026-12-01（10-16 公告）"], ["🎯 实际影响", "积分抵扣退出、佣金与结算单据口径统一：需重算净利率与促销敞口，核对历史账期差异"], ["✅ 建议动作", "财务 11-25 前用新公式重算 Top-SKU 净利率，并向客户经理确认旧积分余额的过渡口径"]], "sourceFull": "https://seller.ozon.ru/media/news/obnovim-poryadok-nashih-raschyotov"}, {"num": 3, "cat": "ecom", "catText": "电商动态", "title": "«Авито» 上查出约 3 万条仿冒知名品牌的商品信息", "tag": "local", "tagText": "本地", "source": "«Известия»", "time": "10-19 04:30", "summary": "监测发现 «Авито» 平台存在约 3 万条使用知名品牌名称或外观的「平替/仿品（дьюпы）」信息；同期调查显示俄消费者越来越多选择知名品牌的平替款而非正品，价格是首要因素。对我的含义：无授权使用他人商标、外观与图片的合规风险上升（平台与权利人核查趋严——商品卡统一核验机制拟 2027-03-01 起对全部电商参与者强制），自有品牌需确保图形与命名不构成近似侵权。", "table": [["仿品信息量", "约 3 万条"], ["消费倾向", "价格优先，平替需求上升"], ["风险", "商标/外观侵权下架与索赔"]], "sourceFull": "https://iz.ru/2184622/2026-10-19/30-tys-obiavlenii-s-analogami-izvestnykh-brendov-nashli-na-avito"}, {"num": 4, "cat": "ecom", "catText": "电商动态", "title": "国家杜马提议：贷款利率走高时对中小企业引入「破产缓期」", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-18 14:11", "summary": "国家杜马议员提议，当信贷利率上升超过设定阈值时，对中小企业引入「破产缓期（мораторий на банкротство）」机制，避免高利率周期中被债权人集中追偿。背景是中小企业融资成本高企：经济部调查显示向银行申请贷款/重组的受袭卖家被拒比例约 65.7%。对我的含义：若落地将改变债权人追偿节奏与应收账款谈判窗口，需同步评估对俄主体（含合作方）的应收应付账期与担保安排。", "table": [["提议主体", "国家杜马"], ["触发条件", "贷款利率上升（阈值待定）"], ["现状参照", "受袭卖家贷款/重组被拒率 65.7%"]], "sourceFull": "https://www.retail.ru/news/gosduma-predlozhila-vvodit-moratoriy-na-bankrotstvo-malogo-biznesa-pri-roste-sta-18-oktyabrya-2026-2834"}, {"num": 5, "cat": "ecom", "catText": "电商动态", "title": "Netflix 在俄注册商品商标，保护期至 2036 年", "tag": "local", "tagText": "本地", "source": "«Ведомости»", "time": "10-18 15:43", "summary": "Netflix 已在俄罗斯完成商品商标注册，保护期至 2036 年；此前 10-17 华纳兄弟（Warner Bros.）也为「哈利·波特」系列在俄完成商标注册。多家已退出俄市场的国际品牌相继恢复或延长在俄商标权，被视为保留重返市场的法律通道；对应风险是未来对使用其品牌元素、名称或视觉风格的本土商品可能加大维权与下架动作。", "table": [["主体", "Netflix"], ["区域", "俄罗斯"], ["保护期", "至 2036 年"]], "sourceFull": "https://www.vedomosti.ru/media/news/2026/10/18/1237984-netflix-zaregistriroval-znak"}, {"num": 6, "cat": "ecom", "catText": "电商动态", "title": "«Дикси» 用 AI 数字人把培训内容制作成本降低 77%", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-18 12:17", "summary": "连锁零售商 «Дикси» 通过 AI 数字人（ИИ-аватар）生产内部培训视频，把内容制作成本降低 77%，用于一线员工标准化培训。对我的含义：培训、商品讲解、客服话术与短视频等内容生产链条可用同类工具显著降本，但对外发布的宣称与素材需满足广告法与平台内容规则，并保留素材权属与合规留痕。", "table": [["主体", "«Дикси»"], ["降本幅度", "-77%"], ["场景", "培训内容生产"]], "sourceFull": "https://www.retail.ru/news/v-diksi-snizili-stoimost-sozdaniya-obuchayushchego-kontenta-na-77-s-pomoshchyu-i-18-oktyabrya-2026-2834"}, {"num": 7, "cat": "ecom", "catText": "电商动态", "title": "АКОРТ：俄消费者对健康生活方式（ЗОЖ）类商品需求持续上升", "tag": "local", "tagText": "本地", "source": "«РИА Новости»", "time": "10-19 04:53", "summary": "零售企业协会 АКОРТ 表示，俄罗斯消费者对 «ЗОЖ»（健康生活方式）类商品的需求持续增长，零售商相应扩大相关货架与自有品牌布局。对我的含义：美妆个护、家清与食品类目可关注「成分友好/无添加/低敏」卖点与本地化宣称，但功效表述须与 EAC 合规文件及俄广告法口径一致，避免功效宣称违规导致的下架与罚款。", "table": [["主体", "АКОРТ"], ["趋势", "ЗОЖ 类需求上升"], ["零售动作", "扩大相关货架与自有品牌"]], "sourceFull": "https://ria.ru/20261019/produkty-2125313930.html"}, {"num": 8, "cat": "econ", "catText": "经济金融", "title": "关键行情：卢布官方美元 83,62；Brent 周末窗口约 108 美元", "tag": "local", "tagText": "本地", "source": "ЦБ РФ / 市场数据", "time": "10-19 05:00", "summary": "俄央行公布的官方汇率为 1 美元 = 83,6177 卢布（10-17 起沿用；周末不更新），与上一期持平：卢布维持在 83–84 区间窄幅波动。原油端，Brent 最新收盘约 108 美元/桶，较前一交易日 109,86 小幅回落，仍处 5 月底以来高位区间。莫斯科交易所（MOEX）周一开盘前指数未取得，本期不列指数。含义：柴油/原油高价与霍尔木兹通行风险叠加，Q4 干线运价与到仓时效应按更高燃油附加费测算。", "table": [["美元/卢布（官方）", "83,6177"], ["Brent（最新收盘）", "约 108 美元/桶（前值 109,86）"], ["MOEX 指数", "周一开盘前未取得（本期不列）"], ["汇市区间", "83–84 窄幅波动"]], "sourceFull": "https://www.cbr.ru/currency_base/daily/?UniDbQuery.Posted=True&UniDbQuery.To=19.10.2026"}, {"num": 9, "cat": "econ", "catText": "经济金融", "title": "柴油交易进展：土耳其索要份额，美方称未放松对俄石油制裁，国会提出禁止法案", "tag": "local", "tagText": "本地", "source": "«Коммерсантъ»", "time": "10-18 22:17", "summary": "俄美柴油交易进入执行阶段的同时分歧扩大：土耳其表示希望按协议获得部分俄产柴油；俄方称首批柴油油轮已发运、美方收到可采购企业名单，货物将在合同签署后 15–20 天抵达。但美能源部长强调「未对俄石油放松任何一项制裁」，美国会已提出禁止该柴油交易的法案，鲁比奥则解释称俄方柴油「无论如何都会进入世界市场」。含义：柴油跨境流向仍具政策不确定性，短期利好燃油价格与运价预期下行，但若法案推进，成品油贸易与相关运费条款需保留回调空间。", "table": [["首批油轮", "已发运（Новак）"], ["到货窗口", "签合同后 15–20 天"], ["土耳其", "希望获得部分份额"], ["美方立场", "未放松任何对俄石油制裁"], ["国会", "已提出禁止柴油交易法案"]], "sourceFull": "https://www.kommersant.ru/doc/9041506"}, {"num": 10, "cat": "econ", "catText": "经济金融", "title": "2026 年俄经「西伯利亚力量」对华供气 390 亿立方米；「北溪」恢复可能性保留", "tag": "local", "tagText": "本地", "source": "«Коммерсантъ»", "time": "10-17 21:58", "summary": "俄方通报，2026 年将通过「西伯利亚力量」管道向中国供应 390 亿立方米天然气；同期副总理 Новак 表示恢复经「北溪」管道供气的可能性仍然保留，出口通道多元化继续推进。含义：对华能源口径放大意味着东部通道（远东/中亚线）的运力与结算通道更受重视，跨境货主可关注东向口岸与班列运力变化对备货节奏的间接影响。", "table": [["对华供气（2026）", "390 亿立方米"], ["通道", "«西伯利亚力量»"], ["北溪", "恢复可能性保留（Новак）"]], "sourceFull": "https://www.kommersant.ru/doc/9041181"}, {"num": 11, "cat": "econ", "catText": "经济金融", "title": "2027 年自愿医疗保险（ДМС）保费将上涨 15–30%", "tag": "local", "tagText": "本地", "source": "«Коммерсантъ»", "time": "10-18 18:27", "summary": "预计 2027 年俄罗斯自愿医疗保险（ДМС）保费将上涨 15–30%，主因医疗通胀与赔付成本上升。对我的含义：驻俄/合作团队的人员成本预算需按上限预留调整空间，与保险经纪在 Q4 重新议价并评估免赔额与保障范围，避免次年续保时被动接受涨价。", "table": [["项目", "ДМС（自愿医疗保险）"], ["涨幅", "15–30%"], ["生效", "2027 年"]], "sourceFull": "https://www.kommersant.ru/doc/9041442"}, {"num": 12, "cat": "econ", "catText": "经济金融", "title": "НОСТРОЙ：中国建材对俄供应或翻倍，中方企业关注「白名单」机制", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "10-19 00:47", "summary": "俄建筑企业协会 НОСТРОЙ 表示，中国建材企业表现出扩大对俄供货的兴趣，若按俄方标准完成认证，供应量有望较现在翻倍；中方企业同时对用于政府采购与工程准入的「白名单」机制表示关注，并不排除在俄本地化生产。对我的含义：建材/家居类跨境链路（含灯具、卫浴、五金）的竞争与供给会继续放大，同时「白名单 + 标准化认证」将成为绕不过的准入环节。", "table": [["供应变化", "中国建材对俄供应或翻倍"], ["关注点", "俄方「白名单」准入机制"], ["可能路径", "按俄标准认证 / 本地化生产"], ["影响品类", "建材、家居与五金配套"]], "sourceFull": "https://tass.ru/ekonomika/28227791"}, {"num": 13, "cat": "politics", "catText": "时政要闻", "title": "佩斯科夫：俄美中三方会晤「存在可能」，并公布莫迪访俄与普京年度直播安排", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "10-19 04:51", "summary": "克里姆林宫发言人佩斯科夫表示，俄罗斯、美国与中国三方会晤的可能性「各方都在讨论」，并称莫迪访俄的具体日期将通过外交渠道公布；同时宣布普京年度直播连线（прямая линия）时间已定。此前佩斯科夫还称普京尚未决定是否出席在美国迈阿密举行的 G20 峰会。含义：若三方会晤落地，对俄制裁与结算环境的预期或再松动，跨境资金与物流通道谈判窗口值得跟踪。", "table": [["三方会晤", "俄美中，可能性存在（筹备中）"], ["莫迪访俄", "日期待外交渠道公布"], ["普京年度直播", "时间已定"], ["G20（迈阿密）", "普京出席与否未决定"]], "sourceFull": "https://tass.ru/politika/28227931"}, {"num": 14, "cat": "politics", "catText": "时政要闻", "title": "特朗普与泽连斯基公开互斥升级：一方称「不想结束战争」，另一方指责「乌克兰投降」", "tag": "local", "tagText": "本地", "source": "«Коммерсантъ»", "time": "10-19 01:07", "summary": "特朗普称泽连斯基「从未想结束冲突」、乌克兰已失去对黑海与亚速海通道的控制，并称两年半前本可达成更好协议；泽连斯基则公开指责特朗普的路线等同「让乌克兰投降」，美国财长也批评乌方立场「鲁莽」。同时美方表示已恢复对乌部分情报共享。含义：和谈预期与制裁路径的不确定性同步上升，Q4 备货与付款条件需保留政策反复的弹性条款。", "table": [["特朗普立场", "称泽连斯基不想结束冲突、乌已失去出海口"], ["泽连斯基", "指责特朗普路线=「投降」"], ["美方动作", "恢复对乌部分情报共享"], ["风险评估", "和谈/制裁路径不确定性上升"]], "sourceFull": "https://www.kommersant.ru/doc/9041530"}, {"num": 15, "cat": "politics", "catText": "时政要闻", "title": "圣彼得堡与列宁格勒州大规模空袭善后：1 死 15 伤、СКР 以恐袭立案、VK 数据中心被击", "tag": "local", "tagText": "本地", "source": "«Коммерсантъ»", "time": "10-18 14:03", "summary": "10-18 凌晨圣彼得堡与列宁格勒州遭大规模无人机袭击：州/市通报 1 人死亡、15 人受伤（含四名儿童），Пулково 机场逾 50 个航班延误，市中心 ЗСД 路段一度封闭，VK 数据中心与涅瓦河畔油品码头被击中起火；侦查委员会已按恐袭立案，俄国防部称一夜击落 1 256 架无人机与 7 枚 «Фламинго» 导弹。含义：西北集群（圣彼得堡）空域与末端履约风险常态化，旺季经该节点的补货应预留改道与延误缓冲。", "table": [["伤亡（10-18）", "1 死 15 伤（含 4 名儿童）"], ["航空", "Пулково 逾 50 航班延误"], ["被击目标", "VK 数据中心、油品码头、居住区"], ["立案", "СКР 以恐袭立案"], ["俄方通报", "一夜击落 1 256 架无人机 + 7 枚 «Фламинго»"]], "sourceFull": "https://www.kommersant.ru/doc/9041334"}, {"num": 16, "cat": "politics", "catText": "时政要闻", "title": "法国抗议骚乱升级：2 400 人被拘留，米兰超 150 人被捕", "tag": "local", "tagText": "本地", "source": "«РИА Новости»", "time": "10-18 22:47", "summary": "法国因生活成本上涨引发的抗议演变为全国性骚乱与哄抢：官方通报被拘留者达 2 400 人，巴黎单日 855 人，多地市政厅与商铺受损，马克龙发表全国讲话并承诺「强硬措施」；米兰等地同步爆发冲突，200 余人被带至警局。含义：欧洲本地消费与治安风险上升，若涉欧洲仓/展会/差旅安排需预留计划变更空间。", "table": [["法国被拘留", "2 400 人（巴黎单日 855）"], ["受损", "多地市政厅、商铺哄抢"], ["米兰", "200 余人被带离"], ["官方回应", "马克龙全国讲话+强硬措施"]], "sourceFull": "https://ria.ru/20261018/frantsija-2125298321.html"}, {"num": 17, "cat": "politics", "catText": "时政要闻", "title": "拉夫罗夫 10-19 访问德黑兰；霍尔木兹海峡两日内再现油轮触雷", "tag": "local", "tagText": "本地", "source": "«Коммерсантъ»", "time": "10-18 22:02", "summary": "俄外长拉夫罗夫结束巴林与波斯湾国家会谈后，将于 10-19 在德黑兰会见伊朗总统，俄方称将推动地区局势降温；与此同时伊朗革命卫队称一艘油轮在霍尔木兹海峡南部触雷（两日内第二起），伊朗外长警告美国若再发动袭击将予以回应。含义：霍尔木兹通行风险直接抬升原油与集装箱保险成本，Q4 经中东中转的货物应确认船东改道与保险条款。", "table": [["俄外长行程", "10-18 巴林 → 10-19 德黑兰（会见伊朗总统）"], ["海峡事件", "油轮触雷（两日内第二起，КСИР 通报）"], ["伊朗立场", "警告美方勿再袭击"], ["我方风险", "原油/集装箱保险费与运费上行"]], "sourceFull": "https://www.kommersant.ru/doc/9041505"}, {"num": 18, "cat": "other", "catText": "其它动态", "title": "9 家已退出俄市场的车企仍保留法人并继续产生营收", "tag": "local", "tagText": "本地", "source": "«Коммерсантъ»", "time": "10-19 03:36", "summary": "统计显示，9 家已宣布退出俄罗斯市场的汽车集团仍保留在俄法人实体与业务收入，通过既有库存、售后与授权渠道维持经营，未完成法律意义上的「清盘」。含义：汽车及配件品类的品牌权利与官方渠道关系仍在，非官方平行进口与灰色渠道的政策风险会持续存在，跨境汽配卖家需关注品牌维权口径变化。", "table": [["主体", "9 家已「退出」的汽车集团"], ["现状", "保留在俄法人并继续产生营收"], ["趋势", "退出未完成法律清盘"]], "sourceFull": "https://www.kommersant.ru/doc/9041537"}, {"num": 19, "cat": "other", "catText": "其它动态", "title": "民调：三分之一俄民众认为中国车已牢牢站稳俄市场", "tag": "local", "tagText": "本地", "source": "«РИА Новости»", "time": "10-19 04:16", "summary": "「Дром」门户 9 月 14—21 日对 1.1 万余人的调查显示：33% 认为中国品牌汽车已牢牢站稳俄市场、即使其他品牌回归销量也仅小幅下滑；31% 认为传统品牌回归后中国车销量会明显下降或退出；36% 认为全球车企不会正式回归。含义：中国供应链在俄汽车与配件品类的中期地位已被消费者预期确认，但价格仍是决策首要因素。", "table": [["调查样本", "1.1 万余人（9-14 ~ 9-21）"], ["中国车「已站稳」", "33%"], ["回归后将下滑", "31%"], ["不会正式回归", "36%"]], "sourceFull": "https://ria.ru/20261019/avtomobili-2125312750.html"}, {"num": 20, "cat": "other", "catText": "其它动态", "title": "«Камаз» 计划 2026 年生产约 4 万辆汽车", "tag": "local", "tagText": "本地", "source": "«Ведомости»", "time": "10-18 17:59", "summary": "俄罗斯卡车制造商 «Камаз» 表示，按当前产销节奏，2026 年全年计划生产约 4 万辆汽车，产能与零部件供应保障仍是主要变量。含义：商用车与配套零部件（含物流车队更新）需求维持，干线运力更新与备件采购节奏可据此判断。", "table": [["主体", "«Камаз»"], ["2026 年计划产量", "约 4 万辆"], ["关键变量", "产能与零部件供应"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/10/18/1237993-kamaz-planiruet-vipustit"}, {"num": 21, "cat": "other", "catText": "其它动态", "title": "«МегаФон»：9 个月 DDoS 攻击均值同比下降 65%", "tag": "local", "tagText": "本地", "source": "«Коммерсантъ»", "time": "10-19 00:28", "summary": "«МегаФон» 通报，2026 年前 9 个月针对其网络的 DDoS 攻击平均强度同比下降 65%，攻击重心转向更隐蔽的渗透与钓鱼；同期运营商网络侧移动互联网速率与稳定性继续提升（独立数据：峰值速率同比提升约 20%）。含义：平台与供应链系统的威胁形态由「流量冲击」转向「账号与数据渗透」，店铺后台与财务账号的二次验证、权限最小化应立即复核。", "table": [["攻击强度变化", "DDoS 均值 -65%（1–9 月）"], ["威胁重心", "转向渗透与钓鱼"], ["网络侧", "移动互联网速率继续提升"], ["我方动作", "复核后台账号二次验证与权限"]], "sourceFull": "https://www.kommersant.ru/doc/9041256"}, {"num": 22, "cat": "appliance", "catText": "家电电器", "title": "总检察院被请求查处「摩托冒充电动自行车」销售乱象", "tag": "local", "tagText": "本地", "source": "«Известия»", "time": "10-19 01:05", "summary": "消费者倡议方向总检察院提出请求，要求查处市场上把电动摩托/助力车冒充「电动自行车（электровелосипед）」销售的乱象：此类商品无需登记即可上路，但实际速度与功率远超非机动车标准，存在安全隐患；同期专家呼吁限制危险电动自行车的销售。含义：轻型电动出行品类的合规门槛（功率/速度标识、认证与说明）将收紧，涉及该类目的 SKU 需自查标签与宣称是否与实际参数一致。", "table": [["问题", "电动摩托冒充电动自行车销售"], ["诉求", "总检察院介入查处"], ["风险", "限速/功率宣称与实际不符 → 下架与索赔"]], "sourceFull": "https://iz.ru/2186425/2026-10-19/genprokuraturu-prosiat-presech-prodazhu-opasnykh-elektrovelosipedov"}]}
