16 15:54", "summary": "«Лэтуаль»：2025 年约 51% 首单新客在 11.11 与黑五买入高端美妆；首购中香水 74%、面部护理 12%、彩妆 11%。女性占首购客户 80%，男性 20% 但人均支出高 19%。2025 年 11 月高端线营收 +8%、销量 -4%，17% 新客复购。", "table": [["首购品类", "香水 74% / 面部护理 12% / 彩妆 11%"], ["客群", "女 80%、男 20%，男性人均 +19%"], ["复购", "17% 新客回購；11 月高端营收 +8%、件数 -4%"]], "sourceFull": "https://www.retail.ru/news/muzhchiny-tratyat-na-lyuksovuyu-kosmetiku-na-19-bolshe-zhenshchin-16-noyabrya-2026-284502/"}, {"num": 15, "cat": "appliance", "catText": "家电电器", "title": "工贸部拟把机床、工业机器人、无人机纳入电子产业税收优惠清单", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "11-16 13:50", "summary": "工贸部提议把机床工具、工业机器人、无人机系统纳入享受电子产业税收优惠的产品清单（现行 ПП 1310 含 30 余类）。符合条件企业利润税联邦部分 8%、地方部分 0%，保险缴费 7.6%。对在俄设组装/本地化生产的家电与电子厂商是成本利好，纯进口商不适用。", "table": [["优惠", "利润税 8%（联邦）/0%（地方）、保险缴费 7.6%"], ["新增", "机床工具、工业机器人、无人机系统"], ["适用", "需在俄从事设计、开发、生产或维修"]], "sourceFull": "https://www.retail.ru/news/proizvoditelyam-elektroniki-dopolnyat-perechen-vidov-produktsii-s-pravom-na-nalo-16-noyabrya-2026-284490/"}, {"num": 16, "cat": "econ", "catText": "经济金融", "title": "ФНС 将核查自欧亚经济联盟进口商品价格，按市场下限重算 22% НДС", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "11-17 02:37", "summary": "财政部修订案拟授权 ФНС 对自欧亚经济联盟（亚美尼亚、白俄罗斯、哈萨克斯坦、吉尔吉斯）进口商品的价格进行纳税核查，按市场区间下限重算 22% НДС；杜马 11-19 二读。自 EAEU 入俄不再重复海关监管，低价申报空间将被压缩。专家预警税务争议与诉讼增加，企业需更完整保存合同、物流与付款凭证。", "table": [["节点", "2026-11-19 杜马二读"], ["机制", "按市场区间下限重算 НДС（22%）"], ["影响", "经 EAEU 转口的低价申报被压缩，补税与诉讼风险上升"]], "sourceFull": "https://www.kommersant.ru/doc/9110932"}, {"num": 17, "cat": "econ", "catText": "经济金融", "title": "Brent 单日跌 4.27% 至 91.75 美元，回吐霍尔木兹涨幅", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "11-17 02:22", "summary": "莫斯科时间 11-17 02:17，1 月布伦特期货跌 4.27% 至 91.75 美元/桶，WTI 涨 0.39% 至 84.14 美元/桶。布伦特单日回落逾 4 美元，基本抹去 11-13 因霍尔木兹油轮触雷带来的涨幅，干线燃油附加费与到岸成本压力短期缓和。", "table": [["Brent", "91.75 美元/桶（-4.27%）"], ["WTI", "84.14 美元/桶（+0.39%）"], ["时点", "2026-11-17 02:17 MSK"]], "sourceFull": "https://ria.ru/20261117/neft-2132004132.html"}, {"num": 18, "cat": "econ", "catText": "经济金融", "title": "央行：三季度俄罗斯外债增加 68 亿美元至 3158 亿美元", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-16 16:56", "summary": "央行：三季度俄外债增加 68 亿美元（+2.2%）至 3158 亿美元，年初以来 +90 亿（+2.9%）。其他部门 1778 亿（+49 亿）、银行与央行 1162 亿（+32 亿），政府部门降至 218 亿（-13 亿）。外债回升主要来自银行与私营部门。", "table": [["外债总额", "3158 亿美元（Q3 +68 亿）"], ["其他部门", "1778 亿美元（+49 亿）"], ["银行与央行", "1162 亿美元（+32 亿）"], ["政府部门", "218 亿美元（-13 亿）"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/11/16/1261340-tsb-vneshnii-dolg"}, {"num": 19, "cat": "econ", "catText": "经济金融", "title": "央行：流通现金 22.78 万亿卢布，同比 +22.3%，为六年来最高", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-16 12:20", "summary": "央行：截至 10-01 流通现金 22.78 万亿卢布，同比 +22.3%，为六年来最高；三季度环比 +7.1%（去年同期 3.7%）。纸币 22.65 万亿（102 亿张），硬币 1323 亿（+1.9%）。现金需求高企反映居民预防性储蓄与支付习惯。", "table": [["流通现金", "22.78 万亿 ₽（+22.3% YoY）"], ["季度环比", "+7.1%（去年 3.7%）"], ["纸币", "102 亿张、22.65 万亿 ₽"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/11/16/1245636-summa-nalichnih"}, {"num": 20, "cat": "econ", "catText": "经济金融", "title": "1–9 月非资源非能源出口 1235 亿美元（+7%），目标三年内回到 2000 亿", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-16 16:53", "summary": "工贸部：1–9 月非资源非能源出口 1235 亿美元，同比 +7%；第一副总理曼图罗夫称将在三年内恢复到 2021 年约 2000 亿美元的纪录。同期 МЭА 数据：10 月俄油出口 682 万桶/日（+26 万桶/日），收入 211.5 亿美元（+36.1 亿），为 2026 年 5 月以来最高。", "table": [["非资源出口", "1235 亿美元（1–9 月，+7%）"], ["目标", "三年内回到约 2000 亿美元"], ["10 月油出口", "682 万桶/日；收入 211.5 亿美元"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/11/16/1257856-manturov-ozhidaet"}, {"num": 21, "cat": "politics", "catText": "时政要闻", "title": "欧盟理事会新增制裁 12 名个人与 101 家机构，约 50 家为银行", "tag": "local", "tagText": "本地", "source": "Известия", "time": "11-17 02:07", "summary": "11-16 欧盟理事会新增制裁 12 名个人与 101 家机构，其中约 50 家为俄银行与金融结构（当日另有 49 家银行被单列），并覆盖炼油厂、圣彼得堡石油码头运营方及油气勘探开采企业。连同其他名单本轮共涉 145 名个人与实体。欧盟称目标是压缩支撑财政的资金流。", "table": [["新增", "12 名个人 + 101 家机构"], ["金融", "约 50 家银行与金融结构（另 49 家单列）"], ["能源", "炼油厂、圣彼得堡石油码头运营方、油气勘探开采"], ["合计", "本轮共 145 名个人与实体"]], "sourceFull": "https://iz.ru/2203002/2026-11-17/sovet-es-vvel-sanktcii-protiv-12-fizlitc-i-101-organizatcii-rf"}, {"num": 22, "cat": "politics", "catText": "时政要闻", "title": "莫斯科方向单夜击落 250 架无人机，乌法机场暂停起降", "tag": "local", "tagText": "本地", "source": "Известия", "time": "11-17 02:50", "summary": "11-17 凌晨莫斯科方向无人机袭击持续：市长索比亚宁称飞往莫斯科途中被击落的无人机累计达 250 架，应急部门在各残骸落点作业。乌法机场 04:11 暂停接收与放行航班，下诺夫哥罗德州随后解除无人机警报。莫斯科空域与东部航线时效风险上升，需关注机场临时管制。", "table": [["击落", "250 架（莫斯科方向，累计通报）"], ["机场", "乌法 04:11 暂停起降"], ["影响", "莫斯科空域与经东部航线的空运/快递时效"]], "sourceFull": "https://iz.ru/2203019/2026-11-17/kolichestvo-likvidirovannykh-na-podlete-k-moskve-bpla-dostiglo-250"}, {"num": 23, "cat": "politics", "catText": "时政要闻", "title": "АТЭС 商业峰会在深圳开幕，11-19 普京—习近平—特朗普三方会晤", "tag": "local", "tagText": "本地", "source": "ТАСС", "time": "11-17 04:10", "summary": "11-17 АТЭС 商业峰会在深圳开幕，会期 17–18 日；领导人峰会 18–19 日，11-19 安排普京、习近平、特朗普三方会晤，为首次该形式接触。普京 11-18 将在商业峰会演讲，俄方参展企业逾 30 家，含 Сбер、Яндекс、Wildberries。", "table": [["商业峰会", "11-17~18，深圳"], ["领导人峰会", "11-18~19"], ["三方会晤", "11-19（首次三方形式）"], ["俄方参展", "逾 30 家企业，含 Сбер、Яндекс、WB"]], "sourceFull": "https://tass.ru/ekonomika/28324183"}, {"num": 24, "cat": "politics", "catText": "时政要闻", "title": "拉夫罗夫抵达马尼拉出席东盟东亚峰会", "tag": "local", "tagText": "本地", "source": "Интерфакс", "time": "11-17 04:04", "summary": "俄外长拉夫罗夫 11-17 抵达马尼拉，率团出席东盟东亚峰会（ВАС），会议当日举行。俄外交部称将讨论亚太地缘局势，以及北约在亚太强化军事存在带来的风险。俄与东盟的贸易、物流与能源议题预计同步推进，是俄方在亚太布局的常规通道。", "table": [["地点", "马尼拉"], ["会期", "2026-11-17"], ["议题", "亚太局势、北约军事存在、贸易物流"]], "sourceFull": "https://www.interfax.ru/world/1129432"}, {"num": 25, "cat": "politics", "catText": "时政要闻", "title": "基辅北桥与南桥遭打击，乌境内物流中转或受影响", "tag": "local", "tagText": "本地", "source": "ТАСС", "time": "11-17 04:06", "summary": "基辅市长克利奇科称 11-17 凌晨基辅两座跨河桥（北桥与南桥）遭打击；俄国防部通报夜间对乌交通与能源设施实施打击，乌方称防空拦截部分目标。首都要害设施被打击将影响乌境内物流与中转过境时效，经乌克兰线路的货物需预留延误。", "table": [["目标", "基辅北桥、南桥"], ["时间", "2026-11-17 凌晨"], ["影响", "乌境内中转与陆运时效"]], "sourceFull": "https://tass.ru/proisshestviya/28324177"}]}
