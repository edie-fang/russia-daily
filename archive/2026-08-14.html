{"date": "2026-08-14", "stats": {"total": 26, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "俄上半年在线食品订单（e-grocery）达9520亿卢布，同比+23.9%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-14 02:36", "summary": "据Infoline统计，2026上半年俄e-grocery市场（在线食品零售）规模达9520亿卢布，同比+23.9%，增速延续放缓（2024年曾增99.6%）。玩家转向增效：Самокат覆盖超1500个居民点、Яндекс Лавка营收+25%、Магнит在线销售Q2增63.8%。", "table": [["e-grocery上半年规模", "9520亿卢布(+23.9%)"], ["Магнит Q2在线销售", "+63.8%"], ["Яндекс Лавка上半年", "+25%"]], "sourceFull": "https://www.kommersant.ru/doc/8879018"}, {"num": 2, "title": "俄杜马副议长提议：线上购物可全程远程办理退货", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-14 04:22", "summary": "国家杜马副主席切尔内绍夫（ЛДПР）向消保署署长波波娃提议修订消保法，允许消费者以电子形式（个人账户或卖家官网）远程提交投诉、退货、换货及保修申请，无需亲临线下门店。他指出许多卖家仍强制消费者线下办理，实际上剥夺了网购远程互动的核心优势。若落地将显著降低跨境及本土网购售后成本。", "table": [["提议内容", "退货/换货/保修全程电子化"], ["对象", "消保署署长波波娃"]], "sourceFull": "https://ria.ru/20260814/gosduma-2110811443.html"}, {"num": 3, "title": "乌军袭击致WB仓库超1100万册图书烧毁", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-14 01:43", "summary": "据Ведомости统计，乌军对Wildberries仓库的袭击导致超过1100万册图书损毁，以童书、文学及科普类为主。此前WB与卖家整体损失已引发政府关注（相关评估见下条）。图书品类是电商仓库火灾中损失最直观的品类之一，市场关注后续保险理赔与卖家补偿进度。", "table": [["烧毁图书", "超1100万册"], ["主要品类", "童书/文学/科普"]], "sourceFull": "https://tass.ru/ekonomika/28010941"}, {"num": 4, "title": "WB及卖家遭袭损失评估最高约8000亿卢布：仓库恢复需1690-2790亿", "tag": "local", "tagText": "本地", "source": "ОСН(转引Forbes)", "time": "08-13 18:43", "summary": "据Forbes引述分析师估算，乌军袭击对Wildberries及其卖家的总损失最高约8000亿卢布：仓库恢复需1690-2790亿；卖家（货损+物流中断）损失约4450-5080亿卢布。目前仍为分析性估算，最终数额待资产盘点后确定。", "table": [["总损失评估", "最高约8000亿卢布"], ["仓库恢复", "1690-2790亿卢布"], ["卖家损失", "4450-5080亿卢布"]], "sourceFull": "https://www.osnmedia.ru/ekonomika/poteri-wildberries-i-prodavtsov-ot-atak-bpla-otsenili-v-800-mlrd-rublej/"}, {"num": 5, "title": "军用双用途商品平台Рой.Маркет结束试点，向WB/Ozon卖家开放", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-13 15:14", "summary": "俄无人系统与技术中心（ЦБСТ）将双用途商品（无人机配件、电子、防护装备等）市场平台Рой.Маркет转正式运营，8月1日上线新IT平台，支持卖家自主管理商品与订单，并计划吸引已在WB/Ozon经营的卖家入驻。目标2027年目录超1万种，佣金低于主流平台（WB 21.3%、Ozon 22.9%）。", "table": [["2027目录目标", "超1万种"], ["WB/Ozon平均佣金", "21.3%/22.9%"], ["上线日期", "8月1日新平台"]], "sourceFull": "https://www.kommersant.ru/doc/8878535"}, {"num": 6, "title": "ЛДПР提议：为遭袭受损卖家提供税收优惠与还款延期", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-14 03:21", "summary": "俄自由民主党（ЛДПР）成员科托夫提出，因乌军袭击受损的数千名市场平台卖家面临破产风险，建议政府为其提供税收减免、贷款延期等纾困措施。此前央行已呼吁信贷机构支持受袭企业主，但卖家端呼吁更直接的国家财政手段。该提案反映平台生态受损面从大卖家向中小卖家扩散。", "table": [["提案", "税收优惠+还款延期"], ["背景", "卖家面临破产风险"]], "sourceFull": "https://tass.ru/ekonomika/28011025"}, {"num": 7, "title": "俄外交部：未收到土耳其关于黑海停火的正式提议", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-13 14:20", "summary": "俄副外长格鲁什科表示，俄方近期听到大量关于停火、休战的呼吁，但未收到任何正式化建议。此前土耳其外长菲丹称安卡拉已向俄乌双方转交在黑海停火的提议；另据媒体报道，乌克兰经中间人提议双方停止在黑海打击民用设施。俄方表态显示相关倡议仍处非正式沟通阶段。", "table": [["俄方表态", "未收到正式化建议"], ["提议方", "土耳其(菲丹称已转交)"]], "sourceFull": "https://ria.ru/20260813/rossiya-2110678673.html"}, {"num": 8, "title": "土耳其F-35采购交易因俄制S-400系统被暂停", "tag": "local", "tagText": "本地", "source": "国际文传电讯社(Interfax)", "time": "08-14 03:46", "summary": "美国与土耳其间关于F-35战斗机的交易被暂停，原因与土耳其持有的俄制S-400防空系统有关。该消息延续美土军售长期摩擦：土耳其2021年被美方移出F-35项目，近期交易重启尝试再度受阻。对俄市场影响：俄土军贸与技术合作仍是安卡拉对冲西方压力的重要筹码。", "table": [], "sourceFull": "https://www.interfax.ru/world/1109209"}, {"num": 9, "title": "普京：强卢布对普通民众有利，但给出口企业造成困难", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-13 07:13", "summary": "普京13日在伊图鲁普岛（千岛群岛）与萨哈林州州长会谈时表示，坚挺的卢布对普通公民有利，但对出口导向型企业构成压力。州长报告称当地企业因卢布走强出现收入下降。该表态正值卢布汇率波动加剧（场外美元一度突破84卢布后回落），官方口径为后续汇率与出口支持政策定调。", "table": [], "sourceFull": "https://ria.ru/20260813/putin-2110589745.html"}, {"num": 10, "title": "梅德韦杰夫：中小企业战争风险保险难题仍需推进解决", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-12 19:36", "summary": "俄联邦安全会议副主席梅德韦杰夫在统一俄罗斯专家委员会上表示，俄中小企业在战争风险下的保险与再保险是非常复杂的任务——既与国际保险市场隔绝，战争风险本身又极高，但对国有再保险公司而言不代表不需要去做。表态指向俄正探索本土战争风险保险机制，此前俄央行已呼吁金融机构支持遭袭企业主。", "table": [], "sourceFull": "https://ria.ru/20260812/medvedev-2110536776.html"}, {"num": 11, "title": "场外美元汇率升破84卢布，创3月20日以来新高", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-13 13:25", "summary": "8月13日俄场外市场美元计算汇率一度升至84.02-84.15卢布，为3月20日以来首次破84，收盘回落至83.1卢布附近；人民币逼近12.5卢布。主因：油价回落与Urals折扣扩大致出口商售汇骤减（7月净售汇仅22亿美元，2023年来新低），叠加财政部购汇。卢布贬值利好出口但加重进口成本。", "table": [["场外美元最高", "84.15卢布(3/20以来新高)"], ["人民币汇率", "12.451卢布"], ["7月出口商净售汇", "22亿美元(2023年来新低)"]], "sourceFull": "https://ria.ru/20260813/dollar-2110668130.html"}, {"num": 12, "title": "上半年中国进口俄原油+92%至704万吨，印度份额降至70%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-14 02:27", "summary": "Argus数据：2026上半年俄Urals等油种西向海运+管道出口增至56.3万吨/日（+17.7万桶/日），中国进口俄油同比大增92%至704万吨，主要承接原计划运往印度的货量；印度仍为最大买家但份额从76%降至70%。Urals对布伦特折扣扩大至25美元/桶，出口流向东移强化中国权重。", "table": [["中国上半年进口俄油", "704万吨(+92%)"], ["印度份额", "76%→70%"], ["Urals折扣", "25美元/桶"]], "sourceFull": "https://www.kommersant.ru/doc/8879076"}, {"num": 13, "title": "X5集团Q2财报：EBITDA 742.5亿卢布+2%，净利-28.9%", "tag": "local", "tagText": "本地", "source": "国际文传电讯社(Interfax)", "time": "08-13 10:46", "summary": "俄最大食品零售商X5 Q2按IFRS：EBITDA 742.5亿卢布（+2%）、净利211.9亿卢布（-28.9%）、营收1.289万亿卢布（+9.9%）。其中Чижик零售营收+29.8%至1348亿卢布；上半年净利344亿卢布（-28.4%）。利润下滑与成本上升、消费趋弱相关。", "table": [["Q2 EBITDA", "742.5亿卢布(+2%)"], ["Q2净利", "211.9亿卢布(-28.9%)"], ["Q2营收", "1.289万亿卢布(+9.9%)"]], "sourceFull": "https://www.interfax.ru/business/1109058"}, {"num": 14, "title": "Brent跌至87.34美元/桶：美油储激增+需求预期下调", "tag": "local", "tagText": "本地", "source": "国际文传电讯社(Interfax)", "time": "08-13 15:01", "summary": "13日Brent 10月合约跌1.84%至87.34美元/桶，WTI跌2.08%至81.54美元/桶。美商业原油库存上周大增1742万桶（2023年1月以来最大）；OPEC连续第四个月下调2026需求增长预期至58万桶/日；IEA预计2026年供应缺口127万桶/日。", "table": [["Brent/WTI", "87.34/81.54美元/桶"], ["美库存周增", "1742万桶"], ["IEA 2026供应缺口", "127万桶/日"]], "sourceFull": "https://www.interfax.ru/business/1109123"}, {"num": 15, "title": "俄国际储备周增197亿美元至7400亿美元", "tag": "local", "tagText": "本地", "source": "国际文传电讯社(Interfax)", "time": "08-13 16:04", "summary": "俄央行数据：截至8月7日俄国际储备达7400亿美元，较7月31日（7203亿）单周增加197亿美元。储备由外币资产、货币黄金、SDR及IMF储备头寸构成。储备回升为卢布汇率与财政提供缓冲，但在出口售汇减少背景下市场仍聚焦汇率压力。", "table": [["国际储备(8/7)", "7400亿美元"], ["单周增量", "+197亿美元"]], "sourceFull": "https://www.interfax.ru/business/1109137"}, {"num": 16, "title": "俄反垄断局（ФАС）启动牛肉与禽肉价格检查", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-12 19:30", "summary": "俄联邦反垄断局开始核查大型生产商的禽肉与牛肉定价，要求企业提供产量、销量、出厂价、成本及销售利润率数据，并说明年内涨价原因。若发现垄断行为将采取反垄断措施。肉类是俄食品通胀核心品类，监管介入或影响食品零售价格走势。", "table": [], "sourceFull": "https://ria.ru/20260812/fas-2110536146.html"}, {"num": 17, "title": "俄农业部：出口物流转向波罗的海、里海、远东及陆路", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-12 20:14", "summary": "农业部长卢特主持粮食销售与替代物流路线会议：受当前物流限制影响，俄正将农产品出口货流转向波罗的海与里海港口、远东方向及陆路通道，并为出口商确定各区域最优路线。核心任务是保障粮食与油料及时销售。制裁与航运风险背景下，俄农产品出口通道多元化加速。", "table": [["替代方向", "波罗的海/里海/远东/陆路"]], "sourceFull": "https://ria.ru/20260812/minselhoz-2110540321.html"}, {"num": 18, "title": "央行顾问：俄投资活跃度仍处高位，投资驱动的增长趋于衰减", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-12 17:43", "summary": "央行行长顾问特列马索夫称，年初投资回落谈不上戏剧性，整体投资活跃度仍高（近年在历史高位）；但他提醒纯投资驱动的经济增长通常趋于衰减，更可持续的路径需提高全要素生产率、优化资源配置。央行预计2027年投资增长。此表态为货币政策与结构性改革提供参考。", "table": [], "sourceFull": "https://ria.ru/20260812/bank-2110515319.html"}, {"num": 19, "title": "上半年俄虾出口+17%至约7600万美元", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-14 00:32", "summary": "俄联邦Агроэкспорт中心数据：2026上半年俄虾出口超5000吨、金额约7600万美元，同比增17%。2025全年俄冷冻虾出口逾8600万美元。出口增长显示俄渔业产品在亚洲市场的竞争力，中国为主要买家之一。", "table": [["上半年虾出口", "约7600万美元(+17%)"], ["出口量", "超5000吨"]], "sourceFull": "https://ria.ru/20260814/eksport-2110803595.html"}, {"num": 20, "title": "央行：上半年居民贷款偿还投诉增至3500件", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-14 03:40", "summary": "俄央行数据显示，2026上半年俄居民提交的关于贷款偿还困难的投诉达3500件，反映高利率环境下部分借款人偿债压力上升。央行已多次提示消费信贷风险，此前存款高利率（8月首旬10大行12.89%）与贷款成本高企并存。", "table": [["贷款偿还投诉(上半年)", "3500件"]], "sourceFull": "https://tass.ru/ekonomika/28011049"}, {"num": 21, "title": "М.Видео增发5亿股筹资300亿卢布，用于发展电商平台", "tag": "local", "tagText": "本地", "source": "RB.RU", "time": "08-13 19:00", "summary": "俄央行注册М.Видео（俄最大电子产品零售商）按闭式认购增发5亿股普通股，公司计划募资约300亿卢布，资金将投向其市场平台业务发展。增发反映电子零售商在行业客流回升（上半年+9%）背景下加码线上化，也是市场对电子零售板块资本运作的重要信号。", "table": [["增发规模", "5亿股"], ["计划募资", "约300亿卢布"]], "sourceFull": "https://rb.ru/news/cb-zaregistriroval-dopemissiyu-mvideo-na-500-mln-akcij-kompaniya-rasschityvaet-privlech-30-mlr/"}, {"num": 22, "title": "欧盟6月工业产出近乎停滞：环比+0.2%，德国仍低于2021年8%", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-13 22:12", "summary": "Eurostat数据：6月欧盟工业产出环比仅+0.2%、欧元区0.0%，同比欧元区+0.1%；投资品产出欧元区环比-1.4%。德国工业指数92.1（2021=100），较2021年低约7.9%。欧洲需求疲软持续压制俄对欧出口的间接空间（欧盟对俄制裁下贸易额已低，主要影响为宏观背景）。", "table": [["欧盟6月工业环比", "+0.2%"], ["欧元区", "0.0%"], ["德国vs 2021", "-7.9%"]], "sourceFull": "https://ria.ru/20260813/es-2110795682.html"}, {"num": 23, "title": "Rusprofile：俄女性创业集中在在线贸易与美容服务", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-14 00:20", "summary": "据俄企业信息平台Rusprofile统计，俄女性最常注册个体工商户（ИП）的领域为在线贸易与美容服务。数据显示女性创业在电商与美妆服务双赛道集中度上升，与平台经济门槛降低、美妆消费增长一致。对美妆卖家而言，本地女性创业活跃预示美妆垂直细分市场供给竞争加剧。", "table": [["女性创业TOP领域", "在线贸易+美容服务"]], "sourceFull": "https://tass.ru/ekonomika/28010907"}, {"num": 24, "title": "Известия：俄个人电动车充电设备购买量+20%", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-14 02:17", "summary": "据Известия报道，俄消费者对个人电动车充电设备（家用充电桩/便携充电器）的购买量增长20%。推动因素：电动车保有量上升、公共充电网络不足、电价相对稳定。该品类属于俄电气/新能源配件市场的增长细分，对电器卖家是值得关注的产品方向。", "table": [["个人充电设备购买", "+20%"]], "sourceFull": "https://tass.ru/ekonomika/28010963"}, {"num": 25, "title": "Минпромторг：允许政府采购在国产电子缺货时部分采购进口", "tag": "local", "tagText": "本地", "source": "RB.RU", "time": "08-13 20:00", "summary": "俄工贸部调整政府采购规则：若俄国产电子产品无法满足订单需求，允许采购方部分采购外国供应商产品（此前须整批选择国产或进口）。该新政为电子品类供应链提供弹性，进口电子（含中国家电数码）在俄政府与公共部门采购中的合规空间扩大。", "table": [], "sourceFull": "https://rb.ru/news/goszakazchikam-razreshili-zakupat-elektroniku-u-zarubezhnyh-postavshikov-esli-rossijskie-kompanii-ne-vypolnyat-zakaz/"}, {"num": 26, "title": "灯具栏目：本期无新增重大动态", "tag": "local", "tagText": "本地", "source": "综合检索", "time": "08-14 10:00", "summary": "2026年8月12-14日窗口内，RIA/Lenta/Interfax/TASS/Kommersant检索（含светильник/освещение/LED关键词）未见俄罗斯灯具照明市场的新增重大新闻。按去重规则标注：本期无新增重大动态，不填充旧信息。", "table": [], "sourceFull": ""}]}
