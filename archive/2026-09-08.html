орма ОФД»负责人Батюшенков：若卢布维持偏强，电子（均价已低于去年）与进口服装年底前或继续降价；当前服装鞋购买次数-6%、电子销售额-5%、客单-3%；Q2起电子/家电/汽配/家具等耐用品回暖、进口商品受益。对跨境卖家：利好进口标品旺季，但价格竞争或加剧。", "table": [["服装鞋", "购买次数-6%"], ["电子", "销售额-5%、客单-3%"], ["回暖品类", "Q2电子/家电/汽配/家具"], ["展望", "电子与进口服装年底或降价"]], "sourceFull": "https://ria.ru/20260908/tovar-2116188957.html"}, {"num": 9, "title": "1843年老牌化妆品厂«Свобода»（芭蕾面霜）避免破产：«Актив»代偿逾1亿卢布债务并撤诉，摇滚主唱参与投资", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-07 18:56", "summary": "生产«Балет»面霜的1843年老厂«Свобода»8-28终止破产程序：«Генезис»（关联Черноголовка）追讨的逾1亿卢布债务由ООО«Актив»代偿并撤诉；«Актив»持有原Albea诺金斯克包装厂«Тубапак»，摇滚主唱Севрюков确认参与投资，业务估值约15亿卢布。", "table": [["破产程序", "8-28终止（债务已代偿）"], ["债务", "逾1亿卢布（«Генезис»系）"], ["投资方", "ООО«Актив»（金额未披露）"], ["关联资产", "«Тубапак»=原Albea诺金斯克厂"], ["估值", "Infoline约15亿卢布"]], "sourceFull": "https://www.kommersant.ru/doc/8938379"}, {"num": 10, "title": "Автостат：36周新车注册超3万辆（+6.1%）；8月全月122,234辆（-7%），Lada -2%、Haval -9%、平行进口Mazda近5倍", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-07 08:49", "summary": "Автостат：36周（8-31~9-6）新车注册3万+辆（+6.1% w/w、+4% y/y，含月末翘尾）；8月全月122,234辆（-7%）：Lada -2%、Haval -9%、Geely -25%、Belgee -44%；平行进口Mazda约3,194辆（近5倍）、Toyota +5%。市场仍弱、难言反转。", "table": [["36周注册", ">30,000辆（+6.1% w/w、+4% y/y）"], ["8月全月", "122,234辆（-7% y/y）"], ["领跌", "Belgee -44%、Geely -25%、Changan -14%"], ["逆势", "Mazda平行≈3,194辆（×5）、Toyota +5%"], ["判断", "Целиков：需2-3周验证"]], "sourceFull": "https://www.vedomosti.ru/auto/news/2026/09/07/1226790-prodazhi-novih-legkovih"}]}
