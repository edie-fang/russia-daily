{"date": "2026-09-25", "stats": {"total": 27, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "Минфин 把「跨境网购 НДС 22%」写入税法修正案：平台代扣，另加每件 ≤200 欧元个人包裹 100 卢布海关费", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)（引 Минфин РФ）", "time": "09-24 20:17", "summary": "俄财政部向政府提交《税法》修正案：对电子跨境贸易商品按标准税率 22% 征收 НДС，由电子交易平台作为税务代理人代扣代缴，用于拉平国内市场贸易条件；同时拟对自境外邮寄、价值不超过 200 欧元的个人自用商品按每件 100 卢布征收海关费。机制沿用 НК РФ 第 174.4 / 174.5 条：限额内由平台按月代缴，超限额由买家在报关登记前自缴，中国直发小包到手成本将明确上台阶。", "table": [["跨境 НДС", "标准税率 22%，平台代扣代缴"], ["个人包裹海关费", "100 卢布/件（货值 ≤200 欧元）"], ["免税限额内", "平台作为税务代理人按月缴纳"], ["超限额", "买家在报关登记前自行缴纳"], ["依据", "НК РФ 第 174.4 / 174.5 条"]], "sourceFull": "https://www.retail.ru/news/onlayn-pokupki-tovarov-u-inostrannykh-prodavtsov-podpadut-pod-nds-24-sentyabrya-2026-282548/"}, {"num": 2, "title": "退货规则要改：7 日无理由退货从「权利」变为「请求」，卖家可否决；平台经济法 289-ФЗ 10-01 先行生效", "tag": "local", "tagText": "本地", "source": "丰坦卡(Фонтанка)（经 ЧИТА.ру 转载）", "time": "09-25 02:29", "summary": "Минэкономразвития 拟修订《消费者权益保护法》：7 日无理由退货改为需卖家审核的「请求」，卖家 2 日沉默视为同意；电子产品、化妆品、香水等类目是否保留退货权取决于政府后续清单，到货前拒收费用转由买家承担，经 ПВЗ 退货需与卖家协商。消费者组织反对、卖家与平台支持。另提示 № 289-ФЗ《平台经济法》将于 2026-10-01 生效，退货修正案拟 2027-03-01 施行。", "table": [["7 日退货", "改为需卖家同意，沉默 2 日视为同意"], ["受限类目", "电子、化妆品、香水等以政府清单为准"], ["到货前拒收", "费用由买家承担"], ["289-ФЗ 平台经济法", "2026-10-01 生效"], ["退货修正案", "拟 2027-03-01 生效"]], "sourceFull": "https://www.chita.ru/text/economics/2026/09/25/76660747/"}, {"num": 3, "title": "Versta.io：仓库遇袭后物流市场进入重构期——到门时效最坏拉长 2.5 倍、货物险涨价、大批量拆成小库点", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)（引 Versta.io）", "time": "09-24 10:29", "summary": "数字物流运营商 Versta.io 给出遇袭潮后首份行业判断：货主与平台已开始寻找新库源，通过把批次打散到更多更不起眼的小库点分散风险，而非继续押注单一大型枢纽；由此产生从南部向西伯利亚与远东的调货需求，到门时效最坏情形拉长至 2.5 倍，货物保险费率同步上行并传导至消费端价格。传统「一个大仓 + 一个备仓」的双仓结构将被多点多批次结构替代。", "table": [["时效影响", "最坏情形拉长 2.5 倍"], ["区域流向", "南部 → 西伯利亚 / 远东"], ["策略变化", "批次拆散、多点小库位"], ["成本项", "货物保险费率上行"]], "sourceFull": "https://www.retail.ru/news/rynok-logistiki-zhdet-masshtabnaya-perestroyka-posle-atak-na-sklady-marketpleyso-24-sentyabrya-2026-282516/"}, {"num": 4, "title": "Wildberries 与 Ozon 同时收紧「烟花类」审核：须持有效合格证，ПВЗ 不得存放", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-24 20:30", "summary": "针对国家打击工业品非法流通委员会提出的平台 ПВЗ 在居民楼内存放烟花制品问题，Wildberries 与 Ozon 双双收紧：接入专项强化审核，商品卡浏览与购买须年满 18 岁确认，无合格证的烟花类商品直接下架；平台内禁止直销烟花，卖家须自行仓储与配送，且仅允许销售 1–3 类民用级制品（拉炮、冷烟花、鞭炮、喷泉、非专业燃放烟花）。Q4 旺季可燃类目的合规门槛明显抬高。", "table": [["加强措施", "专项审核 + 18 岁确认"], ["下架标准", "无合格证即下架"], ["平台内直销", "禁止，卖家自发货"], ["可售等级", "仅 1–3 类民用级"]], "sourceFull": "https://www.retail.ru/news/wildberries-i-ozon-uzhestochili-pravila-proverki-pirotekhniki-24-sentyabrya-2026-282549/"}, {"num": 5, "title": "Роскачество：608 张羊毛拖鞋商品卡 80% 违规——Wildberries 99%、Яндекс Маркет 55%", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)（引 Роскачество）", "time": "09-24 11:49", "summary": "«Роскачество» 公布羊毛拖鞋专项监测第一阶段结果：在 Wildberries、Ozon、Яндекс Маркет 抽查 608 张商品卡，488 张（80%）使用 мех / овчина / евромех / экомех 等替代 шерсть（羊毛）的违规表述，不符合 ГОСТ。分平台违规率 Wildberries 99% 最高、Яндекс Маркет 55% 最低；第二阶段实验室检测定于 2026 年底。材质宣称类文案正被系统化抽检。", "table": [["抽查商品卡", "608 张（WB / Ozon / ЯМ）"], ["违规比例", "488 张 = 80%"], ["Wildberries", "99% 违规"], ["Яндекс Маркет", "55% 违规"], ["第二阶段", "2026 年底实验室检测"]], "sourceFull": "https://www.retail.ru/news/roskachestvo-80-kartochek-sherstyanykh-tapochek-na-marketpleysakh-vvodyat-pokupa-24-sentyabrya-2026-282524/"}, {"num": 6, "title": "前 200 食品连锁净新增商业面积同比 -46.2%：2011 年以来最低，X5 开店计划下调 30.3%", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-24 21:21", "summary": "200 家最大食品连锁 1–6 月净新增商业面积 43.01 万平方米，同比 -46.2%，为 2011 年以来最低。硬折扣业态 -50.7%（受 Светофор、Маяк、Доброцен 收缩影响）；超市、大卖场与近家店合计 -12.4%，仅贡献总增量 8.7%。Магнит 表示投资计划从数量转向质量；X5 计划 2026 年新开 2,000 家以上门店，较上年下调 30.3%。线下分销增量入口在收缩。", "table": [["净新增面积（1–6 月）", "43.01 万 ㎡（-46.2%）"], ["硬折扣", "-50.7%"], ["主流业态", "-12.4%，仅占增量 8.7%"], ["X5 2026 开店", "2,000+ 家（-30.3%）"]], "sourceFull": "https://www.retail.ru/news/na-46-upal-za-god-chistyy-prirost-torgovykh-ploshchadey-u-produktovykh-riteylero-24-sentyabrya-2026-282552/"}, {"num": 7, "title": "ВТБ 维持与 Wildberries-Russ 的交易计划：先买 РВБ 子银行 5% 股份，文件推迟、预计一个月内定案", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "09-24 11:43", "summary": "ВТБ 行长 Костин 表示，与 Wildberries-Russ（РВБ）的战略合作计划未变，但文件准备进度略有推迟，预计未来一个月内完成相关约定。双方 5 月宣布战略合作，第一步为收购 РВБ 子银行 5% 股份。平台系金融主体结构的定型速度直接决定卖家结算账户、账期与融资工具可用性，Q4 大促前可重新比较平台系与银行系的收款账期成本。", "table": [["计划", "ВТБ × Wildberries-Russ 战略合作"], ["首步", "收购 РВБ 子银行 5% 股份"], ["进度", "文件准备推迟，一个月内定案"]], "sourceFull": "https://www.vedomosti.ru/finance/news/2026/09/24/1231429-vtb-sohranyaet-plani"}, {"num": 8, "title": "莫斯科与莫斯科州成全国最大采购市场：零售板块采购额 +10%，食品 +445%、日用百货 +308%", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-24 12:42", "summary": "据电子交易平台数据，莫斯科与莫斯科州 2026 年上半年商业企业采购额 +10%，居全国采购需求集中度第一，其后为萨马拉州、斯维尔德洛夫斯克州、后贝加尔边疆区、圣彼得堡与列宁格勒州等。零售业是区域内最大采购板块，内容以软件、广告服务、日用百货、包装、计算机与办公设备、运输服务为主；增速最猛为食品 +445%、日用百货 +308%、服务器与网络设备近 +50%。", "table": [["采购额增速", "+10%（莫斯科市与州）"], ["区域排名", "全国第 1（采购集中度）"], ["食品采购", "+445%"], ["日用百货", "+308%"], ["服务器/网络设备", "近 +50%"]], "sourceFull": "https://www.retail.ru/news/roznichnaya-torgovlya-stala-krupneyshim-segmentom-po-obemu-zakupok-v-moskve-i-po-24-sentyabrya-2026-282525/"}, {"num": 9, "title": "打击纵深推到乌拉尔：9-25 凌晨斯维尔德洛夫斯克州进入「无人机危险状态」，沃罗涅日、乌里扬诺夫斯克同时遭袭", "tag": "local", "tagText": "本地", "source": "Lenta.ru / 塔斯社(TASS) / 俄新社(RIA) / Vedomosti", "time": "09-25 04:56", "summary": "9-25 凌晨俄境内多点遇袭：斯维尔德洛夫斯克州州长 Паслер 宣布全州进入无人机危险状态并提示可能出现通信与移动互联网限制，该州叶卡捷琳堡为 WB 大型履约中心所在地；乌里扬诺夫斯克正抵御大规模 БПЛА 袭击；沃罗涅日上空 ПВО 接战，州长 Гусев 称市内损伤仍在核实。参照系 9-23 通报击落 514 架、9-24 通报前夜 40 架，打击方向明显向伏尔加流域与乌拉尔移动。", "table": [["9-25 新增状态", "斯维尔德洛夫斯克州无人机危险状态"], ["同期袭击", "沃罗涅日、乌里扬诺夫斯克"], ["9-23 通报", "击落 514 架"], ["9-24 通报", "前夜 40 架 / 7 地区"]], "sourceFull": "https://lenta.ru/news/2026/09/25/bespilotniki-atakovali-ural/"}, {"num": 10, "title": "克拉斯诺达尔边疆区 9-23 起全州进入紧急状态：物流设施遭袭 + 港口停运，农产品无法外运", "tag": "local", "tagText": "本地", "source": "RTVI", "time": "09-24 15:36", "summary": "克拉斯诺达尔边疆区自 9 月 23 日起全州进入区域级紧急状态。政令称：因对物流基础设施的大规模袭击、港口作业暂停与亚速海-黑海海域航运中断，当地农业生产经营者无法外运销售大量农产品，导致国内粮食市场供过于求。这是本轮打击首次以地方政府 ЧС 形式把物流中断制度化，南部干线舱位将被粮食外运挤占，Q4 进出口运价与预约难度上升。", "table": [["生效时间", "2026-09-23 起"], ["范围", "克拉斯诺达尔边疆区全境"], ["原因", "物流设施遭袭 + 港口停运 + 航运中断"], ["后果", "农产品无法外运、州内供过于求"]], "sourceFull": "https://rtvi.com/news/na-kubani-vveli-rezhim-chs-iz-za-problem-s-vyvozom-zerna-na-fone-atak-bpla/"}, {"num": 11, "title": "Минтранс：10-01 起无人机飞行计划只受理接入「ЭРА-ГЛОНАСС」的飞行器", "tag": "local", "tagText": "本地", "source": "消息报(Izvestia)", "time": "09-25 04:22", "summary": "俄交通部 9-24 通报：自 2026 年 10 月 1 日起，无人机飞行计划只有在其飞行器接入 ЭРА-ГЛОНАСС 系统后才会被受理。对卖家含义：自用物流无人机、园区巡检与测绘无人机的合规门槛抬高；更直接的是低空管制与反无人机识别框架全国铺开，其配套通信、导航、检测硬件（模组、识别装置）将形成新的采购需求，是电子与安防类目的机会窗口。", "table": [["生效", "2026-10-01"], ["要求", "飞行计划须接入 ЭРА-ГЛОНАСС"], ["主管", "Минтранс РФ"], ["商业外溢", "识别/通信/导航硬件需求"]], "sourceFull": "https://iz.ru/2173201/2026-09-25/v-rossii-vvedut-novoe-uslovie-dlia-soglasovaniia-grazhdanskikh-poletov-bespilotnikov"}, {"num": 12, "title": "联大场边：拉夫罗夫向古特雷斯递交布查「挑衅」报告；俄 МИД 就欧盟动用冻结资产放话「对等回应」", "tag": "local", "tagText": "本地", "source": "消息报(Izvestia) / 俄新社(RIA) / Lenta.ru", "time": "09-25 04:53", "summary": "联合国大会期间，俄外长 Лавров 与秘书长 Гутерреш 会谈，议题包括联合国改革与布查事件，并向其递交关于布查「挑衅」的专项报告、要求联合国详细调查；同期 Лавров 与伊朗外长 Аракчи 会谈，双方强调伊朗危机只能外交解决。针对欧盟推动动用被冻结俄资产收益，俄 МИД 承诺给出经过校准的对等回应。冻结资产议题升温通常伴随对等反制与支付结算通道收紧。", "table": [["会谈方", "Лавров × Гутерреш（联大场边）"], ["递交文件", "布查「挑衅」报告"], ["俄方表态", "要求联合国详查"], ["冻结资产", "МИД 承诺对等回应"]], "sourceFull": "https://iz.ru/2173207/2026-09-25/lavrov-obsudil-s-guterrishem-reformu-oon-i-sobytiia-v-buche"}, {"num": 13, "title": "「商品大迁徙」：分析机构量化中美贸易战对第三国的分流效应", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-24 16:07", "summary": "生意人报刊发分析《Великое переселение товаров》：随着中美贸易休战延期与关税结构调整，商品流正在第三国之间重新分配，关税与合规成本推动的产能与货流迁移并未回到原路径，而是沉淀在新的中转国与新的品类组合上。对卖家的含义：转口中转国本地仓的选点逻辑应按关税与合规长期化为假设，而非押注单一政策回摆；中亚、外高加索与土耳其通道的合规成本与时效需重新并表测算。", "table": [["核心判断", "货流沉淀于新中转国与品类组合"], ["关联事件", "中美贸易缓和延长至 01-10"], ["结构影响", "第三国分流而非回迁"], ["卖家含义", "按长期化假设选点"]], "sourceFull": "https://www.kommersant.ru/doc/8974280"}, {"num": 14, "title": "政府批准 2027–2029 联邦预算：支出 48.8 万亿、赤字 2.2% GDP，2 万亿开支优化 + 五项精准加税", "tag": "local", "tagText": "本地", "source": "Vedomosti / 生意人报(Kommersant)", "time": "09-24 20:27", "summary": "俄政府 9-24 会议批准 2027 年及 2028–2029 计划期联邦预算法案：收入 43.3 万亿卢布、支出 48.8 万亿卢布，2027 年赤字 2.2% GDP（低于 2026 年预期 3%），三年赤字大致维持 2% GDP 附近，国家项目（含技术类）2027 年约 19 万亿卢布。资金来自优化其他支出约 2 万亿与五项精准加税：有色冶金与化肥、黄金开采、股市投资者、海外网购买家。法案 10-01 前送交新一届国家杜马。", "table": [["2027 收入", "43.3 万亿卢布"], ["2027 支出", "48.8 万亿卢布"], ["2027 赤字", "2.2% GDP（2026 预期 3%）"], ["国家项目", "约 19 万亿卢布"], ["支出优化", "约 2 万亿卢布"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/09/24/1231650-pravitelstvo-odobrilo-proekt-byudzheta"}, {"num": 15, "title": "Минэк 三年宏观预测：2026 GDP +0.6%、通胀 6.8%、美元均价 79.5、居民消费 +4.1% 而投资 -5.4%", "tag": "local", "tagText": "本地", "source": "Vedomosti（引 Минэкономразвития）", "time": "09-24 16:18", "summary": "俄经济发展部提交 2026–2029 宏观预测：2026 年 GDP 增速上调 0.2 п.п. 至 0.6%；2026 年底通胀预期由 5.2% 大幅上调至 6.8%（仍在 ЦБ 6–7% 区间），主因燃油涨价沿产业链传导；2026 年美元均价 79.5 卢布；居民消费需求 +4.1%，固定资产投资 2026 年 -5.4%（2027 年零增长）。行业侧：药品与医疗器械生产 2026 预计 +12.1%，天然气内销价格指数化 2027-07-01 起 +10.4%，2026 年石油产量预估 4.94 亿吨，航空客运量预计 -0.3%。", "table": [["GDP 2026", "+0.6%（上调 0.2 п.п.）"], ["通胀 2026 年底", "6.8%（前值 5.2%）"], ["美元均价 2026", "79.5 卢布"], ["消费 / 投资 2026", "+4.1% / -5.4%"], ["药品生产 2026", "+12.1%"], ["天然气指数化", "2027-07-01 起 +10.4%"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/09/24/1231559-inflyatsiyu-na-konets-goda"}, {"num": 16, "title": "Urals 波罗的海贴水收窄至 2025-11 以来最低：$20.85/桶，油价 +$9.3 至 $104.99", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)（引 Argus）", "time": "09-24 17:06", "summary": "据 Argus 监测：9 月 14–18 日 Urals 对 Dated Brent 的贴水在波罗的海港口收窄至 $20.85/桶，为 2025 年 11 月以来最低；同期 Urals 价格上涨 $9.3 至 $104.99/桶，为 4 月以来最高。驱动力为中东冲突升级导致的供应收缩与印度、中国炼厂的活跃需求。分析机构判断若中东局势进一步升级，Urals 港口报价可能再涨 $25–30/桶；油价高企亦使柴油与干线运价维持高位。", "table": [["Urals 贴水（波罗的海）", "$20.85/桶（2025-11 以来最低）"], ["Urals 价格", "$104.99/桶（+$9.3）"], ["驱动", "中东供应收缩 + 印中炼厂需求"], ["情景判断", "升级情形或再涨 $25–30/桶"]], "sourceFull": "https://www.kommersant.ru/doc/8974352"}, {"num": 17, "title": "Минфин 拟对采矿企业开征 30% 超额利润税（黄金 20%）：金属股应声下跌", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "09-24 12:14", "summary": "作为 2027 年预算的精准加税之一，俄财政部提议在采矿冶金领域对部分开采企业开征 30% 超额利润税，税基为因世界价格（卢布计价）相对 2025 年基准上涨而形成的超额收入，黄金开采企业税率 20%。消息公布后有色金属、化肥与黄金生产商股价在 09-24 交易中下跌。对卖家的含义：铜、铝、金及化肥类原料的成本与供应格局将被税负重塑，影响灯具线缆与散热件、家电金属件价格。", "table": [["税率", "30% 超额利润税"], ["黄金", "20%"], ["税基", "相对 2025 基准的超额价格收入"], ["市场反应", "金属/化肥/金矿股下跌"]], "sourceFull": "https://www.vedomosti.ru/investments/news/2026/09/24/1231437-aktsii-metallurgov-upali"}, {"num": 18, "title": "ЦБ 敲定加密市场准入规则：10-05 生效，兑换商最低资本 1,500 万卢布、数字托管人 5,000 万–2.5 亿", "tag": "local", "tagText": "本地", "source": "Vedomosti（引 ЦБ РФ）", "time": "09-24 19:11", "summary": "俄央行确定数字托管人、加密兑换商与信息系统运营方的加密市场准入办法，配套规范自 2026-10-05 生效：参与者须提交规定文件并证明负责人与关键岗位人员符合要求，存量机构可走简化程序。自有资金下限：加密兑换商 1,500 万卢布，数字托管人视业务类型 5,000 万至 2.5 亿卢布。加密结算通道从灰色转向持牌，但门槛较高、可用通道收紧。", "table": [["生效", "2026-10-05"], ["加密兑换商资本", "≥1,500 万卢布"], ["数字托管人资本", "5,000 万 – 2.5 亿卢布"], ["存量机构", "简化程序过渡"]], "sourceFull": "https://www.vedomosti.ru/finance/news/2026/09/24/1231638-tsb-utverdil-poryadok"}, {"num": 19, "title": "Набиуллина：ЦБ 愿对「保护关键基础设施」的贷款给予监管优惠", "tag": "local", "tagText": "本地", "source": "Vedomosti（引 ЦБ РФ）", "time": "09-24 11:16", "summary": "俄央行行长 Набиуллина 表示：当前许多借款人希望投资于自身基础设施的防护并为此申请贷款，央行在监管层面也愿意给予支持。该表态与财政部允许国防与受损设施修复支出税前扣除、ФАС 允许电网企业把防护与修复成本计入输配电价形成闭环。仓储、分拣与供电设施的反无人机加固开始具备融资与税务通道，但优惠以监管指引与个案口径落地，需向银行取得书面表述。", "table": [["主体", "Банк России"], ["表态", "基础设施防护贷款监管让步"], ["配套", "税前扣除 + 计入输配电价"], ["落地形式", "监管指引与个案口径"]], "sourceFull": "https://www.vedomosti.ru/finance/news/2026/09/24/1231417-nabiullina-tsb-gotov"}, {"num": 20, "title": "「家庭按揭」新规 10-01 起：利率与额度按地区、贷款额与子女数差异化，补贴期封顶 15 年", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant) / RTVI", "time": "09-24 20:12", "summary": "俄财政部敲定家庭按揭新规：利率与贷款额度按子女数量与所在地区差异化，优惠利率补贴最长期限 15 年，自 2026-10-01 起的新签合同适用。该计划占俄全部国家优惠按揭项目的 89%：现行条件为有子女即可申请、全国统一 6%，首都区贷款上限 1,200 万卢布、其他地区 600 万，2026-02-01 起一户限一笔，计划运行至 2030-12-31，累计发放约 11 万亿卢布。专家判断短期会压低按揭发放与新房销售。", "table": [["生效", "2026-10-01（新签合同）"], ["变化", "利率/额度按地区、子女数差异化"], ["补贴期上限", "15 年"], ["贷款上限", "首都区 1,200 万 / 其他 600 万卢布"], ["规模", "占国家优惠按揭 89%"]], "sourceFull": "https://www.kommersant.ru/doc/8974530"}, {"num": 21, "title": "增长引擎换挡：Минэк 预计 2026 年靠居民消费托底，储蓄率下降填补收入增长缺口", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)（引 Минэкономразвития）", "time": "09-24 21:06", "summary": "生意人报解读更新后的三年宏观预测：在多年投资拉动之后，2026 年起增长改由居民支出支撑——2026 年固定资产投资 -5.4%、居民消费 +4.1%，而实际可支配收入仅 +1%；2027 年资本积累零增长、消费再 +2.4%，收入 +1.4%。消费增速持续高于收入增速的组合须由储蓄率下降弥合，意味着价格敏感度上升、分期类支付工具重要性提高，高客单耐用品的换新周期进一步拉长。", "table": [["2026 投资", "-5.4%"], ["2026 消费 / 收入", "+4.1% / +1%"], ["2027 消费 / 收入", "+2.4% / +1.4%"], ["缺口来源", "储蓄率下降"]], "sourceFull": "https://www.kommersant.ru/doc/8974583"}, {"num": 22, "title": "Easy Commerce：上半年平台美妆营业额 5,040 亿卢布（+42%）——Wildberries 3,710 亿、Ozon 1,230 亿（+70%）", "tag": "local", "tagText": "本地", "source": "Absatz.media（引 Easy Commerce）", "time": "09-25 02:29", "summary": "研究机构 Easy Commerce 数据：2026 年上半年俄主要平台五类美妆（彩妆、男女护肤、香水、家用美容仪）营业额同比 +42% 至 5,040 亿卢布。Wildberries 3,710 亿卢布（+37%）居首，Ozon 1,230 亿卢布（+70%）增速更快；增长最快的细分是男性护理，Ozon 男士用品营业额一年增长 1.7 倍。Золотое Яблоко 上半年化妆品销售金额 +31%、数量 +38%，Иль де Ботэ 线上 +15–20%。", "table": [["平台美妆营业额（H1）", "5,040 亿卢布（+42%）"], ["Wildberries", "3,710 亿卢布（+37%）"], ["Ozon", "1,230 亿卢布（+70%）"], ["男性护理", "Ozon 男士用品 ×1.7"], ["Золотое Яблоко", "+31%（金额）/ +38%（数量）"]], "sourceFull": "https://absatz.media/amp//news/183785-kosmetika-ushla-v-onlajn-prodazhi-na-marketplejsah-rezko-vyrosli"}, {"num": 23, "title": "«Лэтуаль»：线上约占 30% 营收，香水为线上线下第一大品类", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)（引 «Лэтуаль»）", "time": "09-24 11:17", "summary": "«Лэтуаль» 发布渠道结构分析：2026 年约 30% 营收来自线上、约 70% 来自线下门店；两年前线上仅约四分之一，2025 年升至约三分之一，2026 年稳定在 30% 左右。用户路径已变为到店试香试用、线上复购，香水在线上线下均为第一品类，且闻香高度依赖线下体验。线上转化依赖线下触点，平台店铺应把香调内容与试用装小样前置到转化链路。", "table": [["线上 / 线下营收", "约 30% / 约 70%"], ["两年前线上", "约 25% → 2025 约 33%"], ["第一品类", "香水（线上线下均是）"], ["用户路径", "到店体验 → 线上复购"]], "sourceFull": "https://www.retail.ru/news/letual-rossiyane-uznayut-informatsiyu-o-tovarakh-v-magazinakh-a-pokupayut-v-pril-24-sentyabrya-2026-282522/"}, {"num": 24, "title": "SberDevices（«СалютДевайсы»）起诉 «М.Видео» 结构公司 МВМ：索赔 66 亿卢布", "tag": "local", "tagText": "本地", "source": "俄新社(RIA) / 塔斯社(TASS) / Vedomosti", "time": "09-25 00:30", "summary": "ООО «СалютДевайсы»（品牌 SberDevices）已向莫斯科仲裁法院起诉，要求从 «М.Видео» 的结构公司 ООО «МВМ» 追偿逾 66 亿卢布。«М.Видео» 回应称正在推进争议解决，目标达成双方可接受的方案。这家俄最大家电数码零售商的现金流与偿付能力压力继续显性化（此前代理商称欠款达 1,700 万卢布且逾期数月），以代理或供货方式铺货的卖家应把账期风险纳入授信模型。", "table": [["原告", "ООО «СалютДевайсы»（SberDevices）"], ["被告", "ООО «МВМ»（«М.Видео» 结构）"], ["索赔金额", "逾 66 亿卢布"], ["受理法院", "莫斯科仲裁法院"]], "sourceFull": "https://ria.ru/20260925/sud-2120138153.html"}, {"num": 25, "title": "Минпромторг 公布「技术费」清单与金额：2026-12-01 开征，单件不超 5,000 卢布", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)（引 Минпромторг РФ）", "time": "09-24 21:27", "summary": "俄工贸部拟定政府决议草案，列出须缴技术费（технологический сбор）的电子元件基础与含此类元件的工业品清单及金额：该费用自 2026 年 12 月 1 日起征收，由进口或在俄生产相关产品的组织与个体经营者向联邦预算缴纳，具体金额由政府以固定卢布金额确定、单件不超过 5,000 卢布。电子类目（含小家电、灯具驱动与智能模块）12-01 后将新增按件计的固定成本，需在 11 月内完成产品归类自检。", "table": [["开征时间", "2026-12-01"], ["计征方式", "固定卢布金额 / 件"], ["单件上限", "5,000 卢布"], ["缴纳主体", "进口方或在俄生产者"]], "sourceFull": "https://www.retail.ru/news/minpromtorg-opredelil-razmery-tekhnologicheskogo-sbora-dlya-elektroniki-24-sentyabrya-2026-282553/"}, {"num": 26, "title": "HUAWEI nova 16s Pro 在俄开启预售：2 亿像素摄像头", "tag": "local", "tagText": "本地", "source": "gazeta.ru", "time": "09-24 10:01", "summary": "俄渠道消息显示，HUAWEI nova 16s Pro 已在俄罗斯开启预售，主打 2 亿像素（200 МП）摄像头。对卖家的含义：中高端安卓机型在俄的迭代节奏未受渠道收缩影响，nova 系列的配件（壳、膜、充电套装、耳机）通常在新机发布后 2–6 周进入放量期，是配件卖家 Q4 的确定性窗口；新机预售价位亦可用于判断 10 月消费电子价格带。", "table": [["机型", "HUAWEI nova 16s Pro"], ["主打卖点", "200 МП 摄像头"], ["状态", "俄罗斯开启预售"], ["配件窗口", "发布后 2–6 周"]], "sourceFull": "http://www.gazeta.ru/tech/2026/09/24/23597647.shtml"}, {"num": 27, "title": "«Авто.ру»：车龄 3–7 年二手车中中国品牌份额一年翻三倍，中国车占该细分 20%", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)（引 «Авто.ру»）", "time": "09-24 20:07", "summary": "据 «Авто.ру» 对 2026 年前 8 个月挂牌与呼叫数据的分析：车龄 3–7 年的二手车细分中，中国品牌份额一年内翻三倍，挂牌量同比增加 2.5 倍，至 9 月初中国品牌已占该细分总量的 20%。69% 的中国车挂牌价位于 150 万–300 万卢布区间（同车龄其他进口车为 41%）；中国品牌混动与纯电占比 5.3%（同比 +1 п.п.），高于其他进口车的 3.5%。", "table": [["中国品牌份额（3–7 年车龄）", "20%（一年翻三倍）"], ["挂牌量", "同比 ×2.5"], ["价格带", "150–300 万卢布占 69%"], ["混动/纯电占比", "5.3%（+1 п.п.）"]], "sourceFull": "https://www.retail.ru/news/spros-na-poderzhannye-kitayskie-avtomobili-ne-starshe-7-let-vyros-v-dva-raza-za--24-sentyabrya-2026-282547/"}]}
