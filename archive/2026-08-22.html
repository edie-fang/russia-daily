：2026 上半年俄消费者网购助眠商品（矫形枕、重力毯、睡眠面膜、耳塞、白噪音设备等）超 370 万件，同比 +75%，合计花费 25 亿卢布（金额 +23%）。睡眠经济成为非必需消费中增速最快的细分之一，家居家纺类目卖家可关注。", "table": [["销量", "370万件（+75%）"], ["销售额", "25亿卢布（+23%）"], ["数据来源", "First Data"]], "sourceFull": "https://www.kommersant.ru/doc/8894261"}, {"num": 6, "title": "专题汇总：WB 仓库遇袭累计波及 17 个地区", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)、塔斯社(TASS)、国际文传(Interfax)", "time": "08-22 核实", "summary": "综合 8/10-8/22 俄官方通报与主流媒体报道，WB 物流设施遭无人机袭击已波及 17 个地区：沃罗涅日州（两处，1.6万㎡+7.5万㎡）、弗拉基米尔州索宾区、列宁格勒州红博尔、斯维尔德洛夫斯克州、图拉州、特维尔州、莫斯科州（波多利斯克+博戈罗茨基区两处）、圣彼得堡、克拉斯诺达尔、辛菲罗波尔、叶卡捷琳堡、坦波夫、奔萨、萨马拉、斯塔夫罗波尔、乌德穆尔特萨拉普尔、巴什科尔托斯坦。央行 8/10 通报 13 个地区，外交部 8/18 确认 3 个地区大型枢纽受损。普京 8/19 表态需恢复仓储能力，Сбер 已启动贷款重组。\"20个仓库\"为推测性说法，官方未发布统一统计。", "table": [["被袭地区总数", "17 个（含多仓库）"], ["央行通报（08-10）", "13 个地区"], ["外交部周报（08-18）", "3 个地区大型枢纽"], ["普京表态（08-19）", "需恢复仓储能力，含国家支持"], ["Сбер 措施（08-21）", "贷款重组+业务恢复"]], "sourceFull": "https://ria.ru/20260818/wildberries-2111482913.html"}, {"num": 7, "title": "杜马选举媒体竞选 8/22 正式启动，持续至 9/18 零时", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)、塔斯社(TASS)", "time": "08-22 00:11", "summary": "第九届国家杜马选举媒体宣传期 8 月 22 日开始、9 月 18 日 00:00 截止；中选委 8/18、8/20 已完成免费电视时段与报纸版面抽签，各注册党派在俄罗斯24、第一频道等获得等量免费时段。投票日 9 月 18-20 日，选战传播全面开闸。", "table": [["宣传期", "8/22—9/18 00:00"], ["投票日", "9月18-20日"]], "sourceFull": "https://ria.ru/20260822/vybory-2112404240.html"}, {"num": 8, "title": "俄外交部：将尽一切努力保障境外投票站安全", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-22 01:32", "summary": "外交部选举委员会副主席、特命大使 Райдер 接受 RIA 专访：在使领馆编制缩减背景下人员将双倍甚至三倍负荷工作，已引入安保强化措施但不便披露细节。此为连续第三日官方就境外投票安全表态，选举安保叙事持续加码。", "table": [["发言人", "特命大使 Райдер"], ["措施", "安保强化(细节不披露)"]], "sourceFull": "https://ria.ru/20260822/mid-2112407795.html"}, {"num": 9, "title": "黑海集装箱船 RMS TEAM 遭无人机袭击，当时正驶往新罗西斯克", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-22 04:56", "summary": "TASS：集装箱船 RMS TEAM 在黑海遭无人机袭击，事发时正驶往新罗西斯克港。亚速-黑海航运安全进一步恶化——俄谷物联盟前日刚将 8 月粮食出口腰斩归因于乌方对货船袭击增多，港口物流保险费与运费风险溢价继续上行。", "table": [["船只", "RMS TEAM 集装箱船"], ["目的地", "新罗西斯克港"]], "sourceFull": "https://tass.ru/proisshestviya/28033953"}, {"num": 10, "title": "俄国防部：单日拦截摧毁 211 架无人机", "tag": "local", "tagText": "本地", "source": "国际文传(Interfax)", "time": "08-21 20:24", "summary": "俄国防部：8 月 21 日 8 时至 20 时（莫斯科时间）在别尔哥罗德、布良斯克、库尔斯克、莫斯科州、克里米亚及黑海水域等 13 个地区/水域上空拦截摧毁 211 架固定翼无人机。单日拦截量维持高位，与当日多机场临时管制互为印证，民航与仓储物流扰动持续。", "table": [["拦截量", "211架/日"], ["范围", "13个地区/水域"]], "sourceFull": "https://www.interfax.ru/russia/1110565"}, {"num": 11, "title": "央行 8/22 官方美元汇率 82.92 卢布，欧元 96.86，莫交所 2134.97", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-21 18:03", "summary": "央行设定 8/22 官方汇率：美元 82.92 卢布（较前日 83.35 再降 0.43），三日累计下调约 2.2 卢布；欧元 96.86；莫交所指数 2134.97 点。卢布连续走强，进口商品（美妆/3C/灯具）采购成本端持续受益，出口商汇兑收益进一步承压。", "table": [["美元", "82.92（-0.43）"], ["欧元", "96.86"], ["IMOEX", "2134.97"]], "sourceFull": "https://lenta.ru/news/2026/08/21/tsb-ponizil-kurs-dollara-v-rossii/"}, {"num": 12, "title": "塞瓦斯托波尔 8/22 起燃油凭证化：QR 码限购，Аи-92 限 20 升", "tag": "local", "tagText": "本地", "source": "国际文传(Interfax)", "time": "08-21 22:15", "summary": "塞瓦斯托波尔州长 Развожаев：8/22 起 ТЭС 加油站 Аи-95/Аи-95 NP/Аи-92 及柴油凭 QR 码销售，ДТ NP 和 Аи-100 自由购买；两家 Атан 加油站 QR 码购 Аи-92 限 20 升，允许加注便携油桶供家用发电机。燃料危机进入凭证限购阶段。", "table": [["ТЭС", "4种燃油凭QR码"], ["Атан", "Аи-92 限20升"], ["生效日", "8月22日"]], "sourceFull": "https://www.interfax.ru/russia/1110579"}, {"num": 13, "title": "进口汽油交易所开售 3 日成交 1.02 千吨，价格维持 10.5 万卢布/吨", "tag": "local", "tagText": "本地", "source": "国际文传(Interfax)", "time": "08-21 21:20", "summary": "圣彼得堡交易所数据：进口汽油 8/19 首次开卖，前 3 日自摩尔曼斯克州 Кола 基地售出 Аи-92 共 1.02 千吨，价格维持 105,000 卢布/吨不变；8/1-21 全交易所汽油总成交 32.35 万吨。进口油进场量尚小、价格锚定高位，对国内缺口缓解仍属象征性。", "table": [["进口汽油成交", "3日1.02千吨"], ["价格", "105,000卢布/吨"], ["8月全场成交", "32.35万吨"]], "sourceFull": "https://www.interfax.ru/business/1110569"}, {"num": 14, "title": "8 月俄粮食出口骤降 2.5 倍至 140 万吨，政府拟拨 100 亿卢布补贴铁路外运", "tag": "local", "tagText": "本地", "source": "Lenta 引俄谷物联盟", "time": "08-21 19:09", "summary": "俄谷物联盟（РЗС）：8/1-20 粮食出口 140 万吨，同比 -2.5 倍；小麦 -2.6 倍至约 100 万吨、大麦 -2.9 倍至 16.8 万吨、玉米 -1.7 倍至 9.8 万吨。主因亚速-黑海航运受阻、货船遇袭增多；政府拟拨 100 亿卢布支持铁路外运，覆盖粮食、油料加工品、蔬菜及鱼类。", "table": [["粮食出口", "140万吨（-2.5倍）"], ["小麦", "约100万吨（-2.6倍）"], ["铁路补贴", "100亿卢布"]], "sourceFull": "https://lenta.ru/news/2026/08/21/postavki-rossiyskogo-zerna-za-rubezh-rezko-proseli/"}, {"num": 15, "title": "ФосАгро 上半年净利润缩水四倍至 186.5 亿卢布", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-22 01:50", "summary": "化肥巨头 ФосАгро 上半年净利润 186.5 亿卢布，同比（755.3 亿）下降超 4 倍。强卢布+高利率环境下俄出口型原料企业利润承压的又一例证，与前期俄铝靠价格扭亏形成对照。", "table": [["净利润", "186.5亿卢布"], ["去年同期", "755.3亿卢布"]], "sourceFull": "https://tass.ru/ekonomika/28033843"}, {"num": 16, "title": "比特币期货两天成交创纪录 700 亿卢布（СПБ 交易所）", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-21 21:18", "summary": "比特币急涨点燃投机：СПБ 交易所永续期货 8/20 单日成交首破 500 亿卢布（8/19 为 260 亿），两日合计创纪录 700 亿卢布，约占场内总成交 80%；外汇市场 BTC 差价合约交易量亦翻倍。Kommersant 提示其仍为小众工具。", "table": [["两日成交", "700亿卢布（纪录）"], ["8/20单日", "首破500亿卢布"], ["占比", "约总成交80%"]], "sourceFull": "https://www.kommersant.ru/doc/8905817"}, {"num": 17, "title": "央行：9/1 起居民可向境外钱包及外国商户转账加密货币", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-22 00:09", "summary": "央行确认：9 月 1 日起俄罗斯居民可将加密货币/稳定币转至本人境外钱包，或支付给非居民商户购买商品与服务；外贸企业可按外贸合同以加密货币结算，适用标准外汇管制与反洗钱程序，相关央行条例草案已通过监管影响评估。跨境加密支付正式开闸。", "table": [["生效日", "9月1日"], ["适用", "居民境外转账+外贸结算"], ["监管", "外汇管制+反洗钱程序"]], "sourceFull": "https://ria.ru/20260822/kriptovalyuta-2112404103.html"}, {"num": 18, "title": "9/1 起商店启用通用 QR 码支付：大网首先强制，2028 年全覆盖", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-22 00:25", "summary": "新法 9/1 生效：所有银行须支持通用 QR 码支付；年营收超 1.2 亿卢布的大型零售网络首批强制布设，一年后扩展至营收超 3000 万商家，2028/9/1 覆盖其余企业及大型个体户。通用 QR 为统一入口，可选 СБП、银行服务、分期，未来接入数字卢布。", "table": [["首批强制", "营收>1.2亿卢布大网(9/1)"], ["第二阶段", "营收>3000万(一年后)"], ["全覆盖", "2028/9/1"]], "sourceFull": "https://ria.ru/20260822/kod-2112405068.html"}, {"num": 19, "title": "欧洲储气库连续三周创历史同期最低：8/19 仅 61.82%（620 亿方）", "tag": "local", "tagText": "本地", "source": "俄新社(RIA) 据 GIE", "time": "08-22 00:42", "summary": "GIE 数据：8/1 储气率 57.09% 创历史反纪录（往年同日均超 60%）；8/1-20 每日均为 2011 年有记录以来最低；8/19 为 61.82%（620 亿立方米），8 月平均注气速度 2.881 亿方/日、同比 -18.49%。欧洲补库乏力预示冬季气价弹性增大。", "table": [["8/19储气率", "61.82%（620亿方）"], ["注气速度", "2.881亿方/日（-18.49%）"], ["纪录", "2011年来同期最低"]], "sourceFull": "https://ria.ru/20260822/gaz-2112405587.html"}, {"num": 20, "title": "韩国集装箱船 PanStar Acro 首航北方海路赴欧，欧洲外交官表达不满", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-22 00:14", "summary": "韩国 PanStar Acro 号 8/22 自釜山出发经北方海路（СМП）试航欧洲，为 2016 年以来韩国首次、且首次动用集装箱船，旨在评估北极亚-欧物流网络前景；首尔事先与莫斯科磋商并获通行许可，欧洲外交官通过路透社表达不满。СМП 商业化示范效应扩大。", "table": [["船只", "PanStar Acro"], ["航线", "釜山—欧洲（СМП）"], ["性质", "试航/2016年来首次"]], "sourceFull": "https://ria.ru/20260822/smp-2112404419.html"}, {"num": 21, "title": "莫斯科化妆品厂\"БИГ\"上半年产量超 4100 万件，覆盖全国各联邦主体", "tag": "local", "tagText": "本地", "source": "俄新社(RIA) 据莫斯科市工业政策局", "time": "08-21 12:02", "summary": "副市长 Ликсутов：本土化妆品企业 БИГ 2026 上半年产量超 4100 万件，产品覆盖儿童化妆品、面部/身体护理、染发护发及专业线，月向地区发货达 400 万件；借助莫斯科工业扶持基金（МФППиП）金融工具扩产并开发新配方。本土美妆制造端持续放量。", "table": [["上半年产量", "4100万+件"], ["月发货", "400万件"], ["支持", "МФППиП 金融工具"]], "sourceFull": "https://ria.ru/20260821/kosmetika-2112226132.html"}, {"num": 22, "title": "国家杜马议员提议对俄产技术装备与汽车降至 10% 增值税", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-22 03:44", "summary": "КПРФ 议员小组提议：对俄罗斯境内生产的技术设备（含家电电子产品）和汽车将 НДС 降至 10%，以降低国产商品价格、激励本土新建工厂。若推进将直接改写电器品类价格带与进口/国产竞争格局；目前仅为党派提案，落地前景待跟踪（待核实）。", "table": [["提案方", "КПРФ 议员小组"], ["内容", "俄产技术装备/汽车 НДС 降至10%"], ["状态", "党派提案(待核实)"]], "sourceFull": "https://tass.ru/obschestvo/28033913"}]}
