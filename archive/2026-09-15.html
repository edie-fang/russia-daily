{"date": "2026-09-15", "stats": {"total": 27, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "Ozon 开始在自提点（ПВЗ）直接上架销售未取件与退货商品", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)", "time": "09-14 18:29", "summary": "Ozon 自 9-10 起在部分自提点试点：客户拒收或逾期未取的包裹不再运回大仓，而是直接摆上 ПВЗ 货架，经处理后照常通过网站/App 销售，卖家可在「退货与取消」中查看（状态显示「Ozon 仓库」、地址显示「Ozon 提货点」，为安全不公开具体点位）。大件、有保质期商品、珠宝等仍送物流中心。10 月起可把 ПВЗ 在售商品运出、配送或交叉对接，物流费按所在集群计价。Ozon 2026 年初有逾 7.5 万个 ПВЗ、6300 万买家。", "table": [["试点启动", "2026-09-10"], ["Ozon ПВЗ 数量", "逾 7.5 万个（2026 年初）"], ["Ozon 买家数", "6300 万"], ["10 月起", "可在 ПВЗ 运出/配送/交叉对接"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/09/14/1228758-tovari-v-pvz"}, {"num": 2, "title": "Ozon 股价 9-14 单日涨 7.01% 至 2693 卢布", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)", "time": "09-14 18:48", "summary": "9-14 莫斯科时间 18:24，Ozon（МКПАО «Озон»）股价较前一交易日收盘涨 7.01% 至 2693 卢布，成交额 54.3 亿卢布；9-11 收盘价为 2533.50 卢布（成交 92 亿卢布）。本周股价反弹前后，萨拉托夫物流中心遇袭后的保险赔付与救助措施陆续落地、公司宣布在 ПВЗ 直接销售退货商品。不过过去 12 个月 Ozon 股价仍累计下跌 35.8%。", "table": [["9-14 涨幅", "+7.01%"], ["9-14 股价", "2693 卢布"], ["成交额", "54.3 亿卢布"], ["近 12 个月", "-35.8%"]], "sourceFull": "https://www.vedomosti.ru/investments/news/2026/09/14/1228774-tsena-aktsii-ozon"}, {"num": 3, "title": "Wildberries 上线「Хочу скидку」：买家可直接向卖家请求个人折扣", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-14 16:10", "summary": "Wildberries（RWB 集团）推出新工具「Хочу скидку」：买家可在支持该功能的商品卡上直接向卖家请求个人专属折扣，卖家自主决定是否让价与幅度，议价过程在平台内完成、无需转私域沟通。此举把讨价还价机制内嵌进平台，一方面提升转化与复购，另一方面强化了「平台内成交」的闭环，也让卖家的定价与折扣策略面临更直接的比价压力。", "table": [["工具名称", "«Хочу скидку»"], ["发起方", "Wildberries（RWB）"], ["折扣决定权", "卖家"], ["场景", "商品卡内议价"]], "sourceFull": "https://www.retail.ru/news/na-wildberries-poyavilas-vozmozhnost-zaprosit-skidku-u-prodavtsa-14-sentyabrya-2026-282100/"}, {"num": 4, "title": "卖家自发货（DBS）需求激增：4–8 月经 СДЭК 的 DBS 请求增 60%", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)", "time": "09-15 00:08", "summary": "「Ведомости」援引 СДЭК 数据：2026 年 4–8 月，平台卖家要求按 delivery-by-seller（DBS，由卖家自行配送）模式发货的申请量增长 60%。背景是大型网络零售商自有仓储持续遇到困难（遇袭、停摆、改道），叠加平台 FBO 费率与风险上升，卖家加速把库存与履约移出平台大仓。对使用多平台矩阵的商家而言，DBS/3PL 组合正在从备选变为常态。", "table": [["统计区间", "2026-04 ~ 2026-08"], ["DBS 请求量", "+60%"], ["驱动方", "СДЭК"], ["主因", "平台大仓风险与停摆"]], "sourceFull": "https://www.vedomosti.ru/business/articles/2026/09/15/1228743-prodavtsi-marketpleisov-stali-dostavlyat-tovari-samostoyatelno"}, {"num": 5, "title": "公众院：自 10-1 起卖家可就平台算法造成的损失提出申诉", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "09-15 03:15", "summary": "俄公众院（ОП）公民诉求与公共监督委员会委员表示，自 10 月 1 日起卖家将获得对平台算法运行结果提出异议的权利：若算法的排序、流量分发或订单分配导致卖家出现财务损失，卖家可依规申诉。该项权利与 10-1 生效的平台经济法配套，后者要求平台不得未经同意把商品纳入促销、且佣金与罚款变更须提前 45 天通知。对平台店铺而言，算法透明度与证据留存（费率明细、流量截图）将变得更重要。", "table": [["生效日", "2026-10-01"], ["主体", "平台卖家"], ["可申诉对象", "算法导致的财务损失"], ["配套法规", "平台经济法（10-1 生效）"]], "sourceFull": "https://tass.ru/obschestvo/28111863"}, {"num": 6, "title": "美众议院程序委员会通过加强对俄制裁法案，提交全院审议", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)/Lenta.ru", "time": "09-15 04:17", "summary": "美国众议院程序委员会（Rules Committee）9-14 表决支持进一步收紧对俄制裁的法案，并将其提交众议院全体会议审议，投票在委员会网站直播。该案此前由众议院审议程序推进，被视为「地狱制裁」类法案的关键一步，市场关注其是否包含对俄能源、金融与第三国交易对手的二级制裁条款。俄方多次表示已适应制裁压力、西方制裁未达预期效果。", "table": [["表决日", "2026-09-14"], ["机构", "美众议院程序委员会"], ["下一步", "众议院全院审议"], ["关注点", "二级制裁/能源金融条款"]], "sourceFull": "https://tass.ru/ekonomika/28111901"}, {"num": 7, "title": "美国财政部把 ВТБ 列入伊朗相关制裁名单，称其属全球受限制最严的金融机构", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-14 21:52", "summary": "美国财政部（OFAC）将俄罗斯 ВТБ 银行列入与伊朗相关的制裁名单，并声明 ВТБ 属于「世界上受到最广泛金融限制的金融机构」，警告与其往来会带来较高制裁风险。美方未说明新限制与既有措施的原则性差异；ВТБ 此前已被美方制裁多年。对俄卖家与跨境结算而言，这意味着涉伊朗链条的合规筛查与银行通道审查将继续收紧。", "table": [["决定方", "美国财政部 OFAC"], ["对象", "ВТБ"], ["关联事由", "伊朗制裁项目"], ["美方定性", "受限制最严金融机构之一"]], "sourceFull": "https://ria.ru/20260914/minfin-2117684052.html"}, {"num": 8, "title": "特朗普称俄乌同意互不攻击能源设施，莫斯科交易所指数应声涨约 3%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)/数据报(Vedomosti)", "time": "09-14 19:32", "summary": "美国总统特朗普表示，俄罗斯与乌克兰已同意放弃相互攻击能源设施，并称全球柴油价格上涨源于俄乌冲突而非伊朗局势。消息发布后莫斯科交易所指数上涨约 3%。不过俄罗斯军事博主对此普遍怀疑，认为对乌方而言这只是「暂停」，能源停火是否覆盖炼油厂、油库与输电设施仍有待确认。该表态若落实，或降低俄境内能源与物流设施的遇袭频率。", "table": [["表态方", "美国总统特朗普"], ["内容", "互不攻击能源设施"], ["市场反应", "莫斯科交易所指数 +约3%"], ["俄方舆论", "军事博主存疑"]], "sourceFull": "https://www.kommersant.ru/doc/8954609"}, {"num": 9, "title": "杜马选举：9-15 起至 9-20 禁止公布民调与选举预测", "tag": "local", "tagText": "本地", "source": "国际文传电讯社(Interfax)", "time": "09-15 03:00", "summary": "自 9 月 15 日起，俄全境禁止公布与国家杜马第九届选举相关的社会舆论调查结果、选举结果预测及其他研究，禁令持续至 9 月 20 日当地时间 20:00（即投票最后一日结束）。杜马选举与合并举行的地方选举将在 9-18~20 三天进行：计划举行 2200 多场各级选举，改选约 2.07 万个代表席位与选举职位；11 个地区选举最高长官（8 个直选、3 个由立法机关投票），39 个地区选举立法机关代表。", "table": [["民调禁令", "09-15 ~ 09-20 20:00"], ["投票日", "2026-09-18 ~ 09-20"], ["选举场次", "2200+ 场"], ["席位/职位", "约 2.07 万个"], ["地区长官选举", "11 个地区"]], "sourceFull": "https://www.interfax.ru/russia/1116111"}, {"num": 10, "title": "乌克兰总检察长在指控 НАБУ 局长后离境，反腐机构冲突公开化", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)", "time": "09-15 00:14", "summary": "乌克兰总检察长 Руслан Кравченко 签署对 НАБУ（国家反腐败局）局长 Семен Кривонос 的怀疑书（等同立案），指其伪造文件谋取特别巨额利益、并借虚假收养规避司法责任；同时对其副手与 САП 负责人亚历山大·克利缅科之妻签署怀疑书。随后Кравченко以「出差」名义出境，称将向外国伙伴通报 НАБУ 与 САП 的腐败问题。НАБУ 回应称这是对独立反腐机构的「系统性攻击」，旨在将其置于总检察长办公室管辖之下。", "table": [["当事方", "乌总检察长 Кравченко vs НАБУ"], ["措施", "对 НАБУ 局长签署怀疑书"], ["结果", "总检察长出境"], ["НАБУ 定性", "系统性攻击独立反腐机构"]], "sourceFull": "https://www.vedomosti.ru/politics/articles/2026/09/15/1228738-genprokuror-ukraini-sbezhal-za-rubezh"}, {"num": 11, "title": "芬兰加入法国核威慑倡议，俄方称将纳入军事规划", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-15 03:55", "summary": "俄副外长亚历山大·格鲁什科表示，俄罗斯将在军事规划中考虑芬兰加入法国核威慑倡议这一事实。此举意味着北欧—波罗的海方向的核因素进一步复杂化，俄方此前已多次警告芬兰与瑞典入约后的军事后果。对经贸与物流的间接影响在于：西北方向（芬兰边境、波罗的海）的紧张程度上升，可能进一步影响跨境运输通道与保险条件。", "table": [["表态方", "俄副外长 Грушко"], ["事由", "芬兰加入法国核威慑倡议"], ["俄方动作", "纳入军事规划"], ["方向", "北欧—波罗的海"]], "sourceFull": "https://www.kommersant.ru/doc/8954806"}, {"num": 12, "title": "北约战机在立陶宛上空击落无人机，维尔纽斯机场临时限航", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)/RBC", "time": "09-15 00:58", "summary": "立陶宛境内考纳斯地区上空出现无人机，北约战机随后升空并将其击落；维尔纽斯及若干地区宣布「黄色」威胁等级，维尔纽斯机场因警报限制运行。立陶宛消防与救援部门称无人机于午夜后不久进入领空。这是近期无人机越境事件（此前有经摩尔多瓦、罗马尼亚方向）的延续，波罗的海方向的空域安全与航班运行风险上升。", "table": [["地点", "立陶宛考纳斯地区"], ["处置", "北约战机击落"], ["威胁等级", "「黄色」（维尔纽斯等）"], ["机场", "维尔纽斯临时限航"]], "sourceFull": "https://ria.ru/20260915/dron-2117687181.html"}, {"num": 13, "title": "央行：8 月外汇市场波动加剧，美元振幅 8.2%、人民币 8.5%", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)", "time": "09-14 21:20", "summary": "俄央行《8 月金融市场风险综述》指出：8 月美元对卢布波动区间为 79.46–85.95 卢布，振幅 8.2%（7 月为 5.2%）；人民币区间 11.77–12.77，振幅 8.5%（7 月 5.9%）。8 月美元升值 7.2% 至 85.6 卢布、人民币升值 7.7% 至 12.73。非金融企业外汇净卖出环比减少 15.3% 至 188 亿美元，部分源于出口商还债；Minekonomrazvitiya 数据显示 7 月 Urals 跌至 59.02 美元/桶，8 月回升至 67.11 美元，因外汇收入到账有 1–2 个月滞后，尚未体现在统计中。", "table": [["8 月美元区间", "79.46–85.95 卢布（振幅 8.2%）"], ["8 月人民币区间", "11.77–12.77（振幅 8.5%）"], ["企业外汇净卖出", "188 亿美元（-15.3% 环比）"], ["Urals 7 月/8 月", "59.02 / 67.11 美元/桶"]], "sourceFull": "https://www.vedomosti.ru/economics/articles/2026/09/14/1228789-tsb-o-rastuschei-volatilnosti"}, {"num": 14, "title": "十大银行卢布存款最高利率升至 12.95%（9 月上旬）", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-14 21:35", "summary": "俄十大银行卢布存款平均最高利率在 9 月首十天上升 0.05 个百分点至 12.95% 年化。存款利率仍处高位，反映在央行维持关键利率 14% 的背景下，银行继续通过高息揽储支撑负债端；对消费与企业融资而言，高存款回报继续强化居民的储蓄倾向，抑制非必需消费品（家电、灯具、美妆等）的需求弹性。", "table": [["统计期", "2026-09 上旬"], ["十大行最高存款利率", "12.95%（+0.05 p.p.）"], ["关键利率", "14%"], ["影响", "储蓄倾向偏高"]], "sourceFull": "https://www.kommersant.ru/doc/8954751"}, {"num": 15, "title": "Brent 单日一度涨近 5% 至 109.36 美元，沙特管道停运或减全球供应 4%", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)", "time": "09-14 15:57", "summary": "受沙特「东西」输油管道暂停运行、市场担忧全球燃料短缺加剧影响，11 月布伦特期货 9-14 盘中涨至 109.36 美元/桶（+4.55%），当日最高 109.56 美元。路透此前报道，若沙特数日内无法恢复通往红海的主管道，其可出口库存将耗尽，全球供应或减少 4%；中东战事前该地区日供约 2200 万桶，冲突后降至 600–900 万桶/日。油价高企对卢布与俄预算收入构成支撑，但抬高全球物流与运输成本。", "table": [["Brent（11月合约）", "109.36 美元/桶（+4.55%）"], ["当日最高", "109.56 美元"], ["潜在供应缺口", "-4%"], ["中东日供应", "2200 万 → 600–900 万桶"]], "sourceFull": "https://www.vedomosti.ru/investments/news/2026/09/14/1228670-tsena-na-brent"}, {"num": 16, "title": "欧洲气价突破 1000 美元/千立方米，2022 年 12 月以来首次", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-14 20:26", "summary": "伦敦 ICE 交易所 9-14 气价自 2022 年 12 月以来首次突破 1000 美元/千立方米，荷兰 TTF 10 月期货升至约 1004 美元。价格受双重因素推升：霍尔木兹海峡通行受阻、以及与亚洲买家的竞争。欧洲气价高企将进一步抬升欧洲制造业与物流成本，同时对俄气过境与俄 LNG 出口的相对竞争力产生间接影响。", "table": [["TTF 10 月期货", "约 1004 美元/千m³"], ["突破时点", "2026-09-14（2022-12 以来首次）"], ["推升因素", "霍尔木兹受阻、亚洲竞争"], ["交易所", "ICE（伦敦）"]], "sourceFull": "https://www.kommersant.ru/doc/8954717"}, {"num": 17, "title": "央行：8 月黄金以 17.4% 收益率居俄金融资产首位", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-14 20:21", "summary": "据俄央行数据，黄金 8 月收益率为 17.4%，在俄金融市场各类资产中排名第一；欧元存款第二，人民币资产第三。黄金年内持续走高（9-14 现货一度跌破 4300 美元/盎司后仍处高位），在高通胀与地缘风险下成为俄居民与机构的主要保值工具。对消费品商家而言，居民资产配置向黄金/存款倾斜，进一步解释耐用品需求偏弱的结构。", "table": [["黄金 8 月收益率", "17.4%"], ["排名", "第 1（欧元存款第 2、人民币第 3）"], ["数据来源", "俄央行"], ["背景", "金价高位（约 4300 美元/盎司）"]], "sourceFull": "https://www.kommersant.ru/doc/8954710"}, {"num": 18, "title": "燃油市场：Новак 召开专题会议，ФАС 已立案 55 起、发出 83 次警告", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)", "time": "09-14 18:18", "summary": "副总理 Новак 主持燃油市场会议（能源部长 Цивилев、联邦委员会、国家杜马、农业部、ФАС、交通部与地方及油企参加）：能源部报告多家炼厂新增装置投产、燃油产量提升；北方运输（северный завоз）供应稳定；ФАС 已立案 55 起、发出 83 次警告。对叶卡捷琳堡、车里雅宾斯克、阿尔汉格尔斯克、特维尔、别尔哥罗德州及彼尔姆、克拉斯诺达尔边疆区实行「手工」保供，圣彼得堡与列宁格勒州的局部短缺仍在处置。", "table": [["主持", "副总理 Новак"], ["ФАС 立案/警告", "55 起 / 83 次"], ["手工保供地区", "5 州+2 边疆区"], ["短缺区域", "圣彼得堡、列宁格勒州"]], "sourceFull": "https://www.vedomosti.ru/business/articles/2026/09/14/1228759-o-novih-merah"}, {"num": 19, "title": "8 月钻石价格指数跌至历史最低 82 点", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-15 08:00", "summary": "受成品钻环节库存积压与合成钻石竞争影响，8 月行业钻石价格指数跌至 82 点，创历史新低，其中小颗粒钻石跌幅最明显；分析机构预计市场恢复不早于 2–3 年后。该趋势对俄钻石出口（АЛРОСА）与高值饰品类目的定价体系均有传导，也给珠宝/美妆类高溢价礼品的定价策略带来压力。", "table": [["8 月钻石价格指数", "82 点（历史最低）"], ["主因", "库存积压+合成钻竞争"], ["恢复预期", "不早于 2–3 年"], ["受影响品类", "小颗粒钻石"]], "sourceFull": "https://www.kommersant.ru/doc/8954756"}, {"num": 20, "title": "俄化妆品销量同比减少 2%：品类收缩、渠道向平台转移", "tag": "local", "tagText": "本地", "source": "New Retail（引 Известия/BusinesStat）", "time": "09-14 20:50", "summary": "New Retail 援引 Известия 与 BusinesStat/Nielsen 数据：2025 年俄化妆品总销量 39 亿件（以包装计），同比减少 2%；面部护理与化妆品品牌数量减少 13.3%，为 FMCG 各品类中降幅最大，儿童用品 -11%、剃须 -7.1%、护发 -5.3%、身体护理 -4.1%。线下连锁（Лента、Магнит）以优化基础品类组合应对，平台渠道则逆势增长。行业口径同时显示市场规模已达约 1.3 万亿卢布（+20% 卢布值），量降价升特征明显。", "table": [["化妆品销量", "39 亿件（-2%，2025）"], ["面部护理品类品牌数", "-13.3%"], ["市场规模", "约 1.3 万亿卢布（+20% 卢布值）"], ["渠道", "线下优化、平台增长"]], "sourceFull": "https://new-retail.ru/novosti/retail/prodazhi_kosmetiki_v_rossii_sokratilis_na_2/"}, {"num": 21, "title": "化妆品连锁 The Act 到 11 月将关闭 9 家门店中的 4 家", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-14 21:03", "summary": "The Act 在社交平台宣布优化门店网络：到 2026 年 11 月将关闭 4 家门店——沃罗涅日「Галерея Чижова」、伏尔加格勒「Ворошиловский」、萨马拉「Космопорт」以及圣彼得堡 ТРЦ «Лето»。据公司官网，品牌目前共 9 家门店，即缩减幅度接近一半。美妆线下渠道继续收缩，与此前公布的化妆品门店总数下降趋势一致，进一步凸显平台与线上渠道的分流。", "table": [["现门店数", "9 家"], ["关闭数", "4 家（至 2026-11）"], ["关闭城市", "沃罗涅日/伏尔加格勒/萨马拉/圣彼得堡"], ["趋势", "线下网络收缩"]], "sourceFull": "https://www.kommersant.ru/doc/8954647"}, {"num": 22, "title": "以 Lush 为基础的化妆品连锁 Oomph 申请破产", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-14 18:23", "summary": "以 Lush 产品体系为基础的化妆品连锁 Oomph 向法院提交破产申请，公司表示这是为挽救业务而非走完破产程序，即寻求通过司法程序进行债务重组/保护。该案是俄美妆零售承压的又一例证：在高利率（关键利率 14%）与消费谨慎的环境下，中型美妆连锁的租金与库存资金压力显著上升，渠道资源进一步向头部连锁与平台集中。", "table": [["企业", "Oomph（Lush 体系）"], ["动作", "提交破产申请"], ["公司说明", "为挽救业务而非结业"], ["背景", "关键利率 14%、消费谨慎"]], "sourceFull": "https://www.kommersant.ru/doc/8954604"}, {"num": 23, "title": "大型连锁家用化学品（个护相邻品类）营业额 2025 年增长 10%", "tag": "local", "tagText": "本地", "source": "Retail.ru（АКОРТ）", "time": "09-14 20:31", "summary": "АКОРТ（零售企业联合会）代表 Елизавета Протасова 表示，2025 年大型零售网络的家用化学品板块营业额增长 10%，成为非食品零售的重要增长点；本土品牌需求上升、进口替代比例提高。该品类与个护美妆在货架与供应链上高度重叠，对做家清/个护的商家（mosai、deepclean 等）而言，线下大连锁的货架资源与本土化采购倾向值得重点跟进。", "table": [["统计口径", "大型连锁·家用化学品"], ["2025 增速", "+10%"], ["结构变化", "本土品牌份额提升"], ["数据方", "АКОРТ"]], "sourceFull": "https://www.retail.ru/news/oborot-bytovoy-khimii-v-krupnykh-setyakh-v-2025-godu-vyros-na-10-14-sentyabrya-2026-282105/"}, {"num": 24, "title": "М.Видео 接入 Магнит 的 5000 个自提点，覆盖 24 城", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-15 01:38", "summary": "М.Видео 将 Магнит 覆盖 24 个俄城市、约 5000 个自提点（ПВЗ）接入其线上订单配送网络，作为既有自提与物流基础设施的补充。此举显著扩大了家电 3C 大件的末端触点：Магнит 今年夏天宣布关闭自有电商站与 App 后，其门店网络转为服务第三方履约，为家电零售商提供了低成本的下沉末端网络。对电器卖家而言，末端网点密度提升有利于降低退换货成本与配送时效。", "table": [["接入自提点", "约 5000 个"], ["覆盖城市", "24 个"], ["合作方", "Магнит"], ["意义", "家电 3C 末端触点下沉"]], "sourceFull": "https://www.kommersant.ru/doc/8954760"}, {"num": 25, "title": "М.Видео 扩展「М.Мастер」上门服务：新增厨房家具组装与水暖/电气施工", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-14 09:12", "summary": "М.Видео 宣布扩大「М.Мастер」上门服务范围：除既有的家电与电子设备安装、维修、外运与回收外，新增厨房与家具组装，以及水暖、电气类工程服务预约。这是公司「以新品类拓客」战略的延续，把服务收入与商品销售绑定，提升客单与复购。对经营小家电与清洁电器的商家而言，平台化安装/维修服务能力将成为差异化竞争点。", "table": [["服务品牌", "«М.Мастер»"], ["新增服务", "厨房/家具组装、水暖电气"], ["原有服务", "安装/维修/外运/回收"], ["战略", "服务+商品品类扩张"]], "sourceFull": "https://www.retail.ru/news/m-video-masshtabiruet-servisnoe-napravlenie-vsled-za-rostom-marketpleysa-14-sentyabrya-2026-282066/"}, {"num": 26, "title": "「ВсеИнструменты.ру」：8 月家庭清洁用品销售同比增长 2%", "tag": "local", "tagText": "本地", "source": "Retail.ru（ВсеИнструменты.ру）", "time": "09-14 16:32", "summary": "线上五金家居超市「ВсеИнструменты.ру」数据：2026 年 8 月俄罗斯家庭清洁用品销量同比增长 2%，与入秋前房屋整理、复工复学以及夏季过后基础清洁用品更新有关。对清洁电器（deepclean）与小家电（mosaihome）卖家而言，秋季换季是清洁相关品类的需求窗口，建议在 9–10 月配合换季场景做组合营销与备货。", "table": [["统计期", "2026 年 8 月"], ["清洁用品销量", "+2% 同比"], ["驱动", "入秋换季、复工复学"], ["数据方", "ВсеИнструменты.ру"]], "sourceFull": "https://www.retail.ru/news/vseinstrumenty-ru-pered-osenyu-rossiyane-obnovili-inventar-dlya-tshchatelnoy-ubo-14-sentyabrya-2026-282098/"}, {"num": 27, "title": "下诺夫哥罗德启动 Volga 全流程生产：焊接、涂装、总装全部本地化", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)", "time": "09-14 20:26", "summary": "据公司消息，下诺夫哥罗德工厂自 8 月起按「全流程」工艺生产 Volga 汽车，具备焊接、涂装与总装能力，80% 关键工序由机器人自动完成（搬运、安装与多数零部件的焊接），由智能控制系统监控；涂装车间包含 19 道清洗、磷化与阴极电泳工序。厂区此前生产大众与斯柯达车型。Volga 计划推出 D-SUV、C-SUV 与 D 级轿车三款车型，首批车将于 2026 年三季度到店。", "table": [["启动时间", "2026 年 8 月"], ["工艺", "焊接+涂装+总装（全流程）"], ["自动化率", "80% 关键工序"], ["规划车型", "3 款（D-SUV/C-SUV/D 级轿车）"], ["到店时间", "2026 年 Q3"]], "sourceFull": "https://www.vedomosti.ru/auto/news/2026/09/14/1228788-v-nizhnem-proizvodstvo-volga"}]}
