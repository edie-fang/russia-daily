": "08-26 14:00", "summary": "国际红十字会（ICRC）代表团8-26实地走访列宁格勒州舒沙雷与红博尔两处遭袭WB仓库，评估无人机袭击后果并会晤现场员工与管理层，确认仓库内无军事设施；ICRC称不公开走访结果、不背书任何第三方声明。国际人道机构独立核查介入，为'民用仓储设施被袭'争议提供观察视角。", "table": [["走访对象", "WB舒沙雷/红博尔仓库"], ["确认事项", "无军事设施"]], "sourceFull": "https://ria.ru/20260826/mkkk-2113363694.html"}, {"num": 10, "title": "8-28凌晨莫斯科州/雅罗斯拉夫尔/图拉州再遭无人机袭击，多地机场临时限航", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)、塔斯社(TASS)", "time": "08-28 19:26", "summary": "8-27深夜至8-28凌晨，莫斯科州（一诊所被冲击波损毁）、雅罗斯拉夫尔州、图拉州、别尔哥罗德州等地再遭乌克兰无人机袭击：图拉州拦截数量增至28架，别尔哥罗德州2人受伤；伊万诺沃、坦波夫、雅罗斯拉夫尔等机场临时限航后恢复，伏努科沃数十航班延误。空袭常态化叠加机场限流，航空物流时效波动需持续跟踪。", "table": [["图拉州拦截", "28架"], ["别尔哥罗德州", "2人受伤"], ["受限机场", "伊万诺沃/坦波夫/雅罗斯拉夫尔"]], "sourceFull": "https://ria.ru/20260828/ivanovo-2113809552.html"}, {"num": 11, "title": "立陶宛威胁对加里宁格勒'预防性打击'，波罗的海方向对抗风险升温", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-27 02:00", "summary": "Lenta报道，立陶宛方面威胁称若俄罗斯攻击北约国家，北约将对加里宁格勒州实施'预防性打击'并称该地区'将被摧毁'；此番言论正值俄乌冲突升级、北约与俄直接对抗风险讨论升温之际。波罗的海方向安全形势趋紧，或影响区域陆运物流通道与过境贸易信心。", "table": [["威胁对象", "加里宁格勒州"], ["背景", "俄乌冲突升级+北约对抗风险"]], "sourceFull": "https://lenta.ru/news/2026/08/27/long-budet-unichtozhena-v-litve-prigrozili-preventivnymi-udarami-nato-po-kaliningradskoy-oblasti/"}, {"num": 12, "title": "俄GDP年初至今突破100万亿卢布，预算收入超18.64万亿、非能源收入占比超80%", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-27 15:00", "summary": "俄总理米舒斯京8-27通报：年初至今俄GDP已突破100万亿卢布（约102万亿），预算收入超18.64万亿卢布且显著高于预期，非能源出口收入占比已超80%，经济多元化持续兑现；宏观基本面为制裁环境下的内需与投资提供支撑，但高利率下消费动能仍是观察重点。", "table": [["GDP（年初至今）", "超100万亿卢布（约102万亿）"], ["预算收入", "超18.64万亿卢布"], ["非能源收入占比", "超80%"]], "sourceFull": "https://ria.ru/20260827/vvp-2113600517.html"}, {"num": 13, "title": "世界银行：2025年俄PPP口径GDP达7.24万亿美元居全球第四，领先德国9398亿美元", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)引世界银行", "time": "08-26 10:00", "summary": "世界银行数据显示：2025年俄GDP按购买力平价（PPP）计达7.24万亿美元，稳居全球第四，领先德国9398亿美元、领先日本3983亿美元；IMF预计2026年俄PPP口径GDP约7.34万亿美元，继续稳坐欧洲第一。宏观购买力为俄电商大盘与消费市场提供长期支撑，也解释外资对俄市场潜力的持续评估。", "table": [["2025 PPP GDP", "7.24万亿美元（全球第四）"], ["领先德国", "9398亿美元"], ["2026年预测", "约7.34万亿美元"]], "sourceFull": "https://ria.ru/20260826/rossiya-2113403909.html"}, {"num": 14, "title": "俄政府拨95亿卢布补贴农产品铁路运输，出口物流获政策性托底", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-27 16:00", "summary": "俄政府将拨出超95亿卢布，对农产品铁路运输实施优惠运价补贴，用于弥补铁路运营商成本、稳定国内农业市场并履行对海外买家的出口义务；配合粮食丰收（总收成破1亿吨）与出口关税上调，农产品贸易链运输成本压力有望边际缓解，对粮食出口通道形成托底。", "table": [["补贴规模", "超95亿卢布"], ["用途", "农产品铁路优惠运价补贴"]], "sourceFull": "https://ria.ru/20260827/perevozki-2113590755.html"}, {"num": 15, "title": "俄央行将小额贷款现金限额翻倍：MFO单笔上限提至10万卢布", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-28 19:02", "summary": "俄央行发布指示草案：小额信贷机构（MFO）单笔现金贷款上限翻倍至10万卢布，当铺上限提至20万卢布，消费合作社（КПК/СКПК）最高上限从30万提至100万卢布；高利率环境下监管层放宽民间借贷额度，居民短期资金渠道扩容，消费信贷市场结构生变，也间接支撑低价位电商消费。", "table": [["MFO现金贷款上限", "5万→10万卢布"], ["当铺上限", "→20万卢布"], ["消费合作社上限", "→最高100万卢布"]], "sourceFull": "https://ria.ru/20260828/tsb-2113803343.html"}, {"num": 16, "title": "俄粮食总收成突破1亿吨：收获2790万公顷、单产36公担/公顷（+4.3%）", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)引农业部", "time": "08-26 15:00", "summary": "俄农业部数据：全国粮食总收成已突破1亿吨，收获面积2790万公顷，平均单产36公担/公顷、同比+4.3%；丰收叠加小麦出口关税自8-26起上调至超1000卢布/吨，国内粮价与食品通胀压力有望缓解；粮食丰产亦支撑俄农产品出口履约能力。", "table": [["粮食总收成", "超1亿吨"], ["收获面积", "2790万公顷"], ["单产", "36公担/公顷（+4.3%）"]], "sourceFull": "https://ria.ru/20260826/rossija-2113391957.html"}, {"num": 17, "title": "杜马金融委员会主席：乐观情形下年底关键利率可降至13%（现14%）", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-28 18:41", "summary": "俄杜马金融市场委员会主席阿克萨科夫8-28表示，在有利条件下央行关键利率年底前可能降至13%（现行14%），并承认此前对利率走势的预测过于乐观；预算调整及2027-2029三年预算案（财政部10月1日前提交杜马）将是利率路径关键变量。若降息兑现，电商融资与消费信贷成本将同步下行。", "table": [["现行关键利率", "14%"], ["年底乐观目标", "13%"], ["关键变量", "预算调整+三年预算案"]], "sourceFull": "https://ria.ru/20260828/aksakov-2113711889.html"}, {"num": 18, "title": "俄头部美妆品牌VOIS启动品牌收购计划，美妆市场进入整合期", "tag": "local", "tagText": "本地", "source": "零售门户(retail.ru)", "time": "08-27 12:50", "summary": "俄头部美妆品牌VOIS（2021年起深耕电商）宣布启动美妆品牌收购计划：面向现有化妆品企业征集出售或合作意向，可选全资收购、合伙或联合开发等灵活模式，借助其产品开发、电商运营、营销与物流基础设施快速放大收购标的；俄美妆市场进入整合期，中小品牌估值与退出通道值得关注。", "table": [["收购模式", "全资/合伙/联合开发"], ["目标", "有电商基础的beauty品牌"]], "sourceFull": "https://www.retail.ru/news/vois-obyavil-o-zapuske-programmy-po-priobreteniyu-kosmeticheskikh-brendov-27-avgusta-2026-281449"}, {"num": 19, "title": "研究：药妆品牌霸榜AI护肤推荐，奢侈品牌在AI回答中'隐身'", "tag": "local", "tagText": "本地", "source": "零售门户(retail.ru/Retail Life)", "time": "08-27 11:36", "summary": "最新研究显示，主流AI助手的护肤品牌推荐榜正被平价药妆霸榜，成分与功效导向品牌提及率大幅领先，奢侈品牌集体'隐身'；在美妆营销中'AI可见性'正成为新战场——品牌内容与功效表述是否被算法识别、引用，直接决定AI导购场景的露出份额，奢品与大众品牌都需调整内容策略。", "table": [["现象", "药妆霸榜AI推荐、奢牌隐身"]], "sourceFull": "https://www.retail.ru/news/aptechnye-brendy-zakhvatili-top-rekomendatsiy-ii-v-ukhode-za-litsom-issledovanie-27-avgusta-2026-281452"}, {"num": 20, "title": "М.Видео：上半年俄小家电销量+14.3%至3930万台，均价下降9%", "tag": "local", "tagText": "本地", "source": "行业门户(New Retail)引М.Видео", "time": "08-27 20:29", "summary": "М.Видео数据：2026上半年俄小家电市场销量同比+14.3%至3930万台，金额+4%至1662亿卢布，平均单价下降9%，电暖类产品增速居前；量增价减反映高利率下消费降级与性价比偏好，小家电品类仍具韧性，对华供应链订单结构持续利好走量品类。", "table": [["销量", "3930万台（+14.3%）"], ["金额", "1662亿卢布（+4%）"], ["平均单价", "-9%"]], "sourceFull": "https://new-retail.ru/novosti/retail/rynok_maloy_bytovoy_tekhniki_v_i_polugodii_pokazal_rost_na_14/"}, {"num": 21, "title": "海关查获13.5吨'灰色'Apple/Dyson设备（3300+件、货值1.23亿卢布）", "tag": "local", "tagText": "本地", "source": "消息报(iz.ru)", "time": "08-27 10:50", "summary": "多莫杰多沃海关在莫斯科'戈尔布什卡'商场查获约13.5吨未申报的Apple与Dyson设备（超3300件），估值1.23亿卢布，货主需补缴约3500万卢布关税方可赎回；灰色渠道打击升级，电子产品平行进口货源与价格体系或受扰动，正规授权渠道卖家相对受益。", "table": [["查获量", "13.5吨/超3300件"], ["货值", "1.23亿卢布"], ["补缴关税", "约3500万卢布"]], "sourceFull": "https://iz.ru/2156110"}]}
