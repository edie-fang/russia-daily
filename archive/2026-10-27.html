01"], ["🎯 实际影响", "退件与滞销件回仓成本上升；自动处置能省下临时存放费，但会直接损失货值，等于把尾货决策从「人工拖」变成「系统默认」"], ["✅ 建议动作", "11-15 前核算各店退货率与回仓频次，仅在 автовывоз 白名单里放低货值、不可再售 SKU，其余 SKU 保持人工 вывоз 以免被自动处置"]], "sourceFull": "https://www.retail.ru/news/ozon-s-1-dekabrya-2026-goda-razreshit-avtomaticheskuyu-utilizatsiyu-tovarov-prod-21-oktyabrya-2026-283539/"}, {"num": 4, "cat": "ecom", "catText": "电商动态", "title": "«Яндекс» 三座数据中心遭袭后续：超算整体迁移、Маркет 分拣中心曾停发、替换设备交期最长 6 个月", "tag": "local", "tagText": "本地", "source": "Lenta.ru", "time": "10-26 21:13", "summary": "10-26 晚 «Яндекс» 确认：自 10-07 起梁赞州萨索沃、卡卢加、弗拉基米尔三座数据中心遭无人机袭击，但 «Ляпунов»、«Галушкин»、«Червоненкис» 三台超算未受损，将整体迁往新场地后重新接入。最近一次袭击致两座变电站停机、5 000 名居民断电，司机与骑手端 «Яндекс Про» 一度停摆。此前 Маркет 分拣中心暂停发货，平台把 10-11 起订单剔出质量指数并免收延迟费。", "table": [["受影响数据中心", "3 座（萨索沃/卡卢加/弗拉基米尔）"], ["超算", "3 台未损，迁往新场地"], ["Маркет 处置", "10-11 起订单剔出质量指数、免延迟费"], ["设备替换交期", "最长 6 个月"]], "sourceFull": "https://lenta.ru/news/2026/10/26/yandeks-otsenil-sostoyanie-superkompyuterov-posle-atak-na-data-tsentry/"}, {"num": 5, "cat": "ecom", "catText": "电商动态", "title": "BrandSecurity：上半年俄网络品牌侵权 32.0 万起（+56.9%），平台内 +69.9%、点名中国卖家复用原版卡片", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-26 15:46", "summary": "BrandSecurity 统计：2026 年上半年俄网络品牌侵权 320 362 起，同比 +56.9%；其中电商平台 223 989 起（+69.9%）、社交媒体 15 864 起（+108.4%）、即时通讯 18 607 起（+66.3%），网店仅 +1.9%、分类信息 +6.1%。报告把增量归因于外国卖家扩张、销售渠道分散，并特别指出中国卖家常用原版卡片复制+低价策略，与权利人形成直接冲突。", "table": [["侵权总量", "320 362 起（+56.9%）"], ["电商平台", "223 989 起（+69.9%）"], ["社交媒体", "15 864 起（+108.4%）"], ["即时通讯", "18 607 起（+66.3%）"]], "sourceFull": "https://www.retail.ru/news/chislo-internet-prodazh-kontrafakta-v-rf-vyroslo-na-57--26-oktyabrya-2026-283715/"}, {"num": 6, "cat": "ecom", "catText": "电商动态", "title": "«Авито»：三季度家具与装饰二手成交 +14%、复古与古董近 +50%，包豪斯/复古风格成主流", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-26 20:36", "summary": "«Авито» 三季度家具与装饰板块数据：二手（ресейл）成交量 +14%、成交额 +8%；复古与古董成交量近 +50%、成交额 +25%；复古风家居与纺织品购买频次翻倍，retro 与包豪斯风格家具不再是冷门。对以设计感取胜的家具、照明品牌，二手与复古分流正把消费者对「耐看、可转售、能长期保值」的权重抬高。", "table": [["二手成交量", "+14%"], ["二手成交额", "+8%"], ["复古/古董成交量", "近 +50%"], ["复古成交额", "+25%"]], "sourceFull": "https://www.retail.ru/news/avito-vintazh-i-reseyl-ostayutsya-v-mode-na-rynke-mebeli-i-dekora-26-oktyabrya-2026-283722/"}, {"num": 7, "cat": "ecom", "catText": "电商动态", "title": "政府令 № 1238：受无人机袭击损毁的商业设施，2027-10-01 前免于绝大多数检查", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-26 10:26", "summary": "俄政府 2026-09-25 第 1238 号决议设立的检查豁免期自 09-28 生效、至 2027-10-01：受无人机袭击受损的企业与个体户，一年内不再接受任何计划内检查，以及消防、能源、建设、计量、工业安全、卫生防疫等领域的绝大部分计划外检查；税务、外汇、海关、反洗钱与反恐安保检查不在此列。仓库或门店被袭后，善后整改不再叠加合规检查压力。", "table": [["依据", "政府决议 2026-09-25 № 1238"], ["期限", "2026-09-28 ~ 2027-10-01"], ["覆盖", "全部计划内检查 + 多数计划外检查"], ["不适用", "税务/外汇/海关/反洗钱/反恐"]], "sourceFull": "https://www.retail.ru/news/moratoriy-na-proverki-postradavshego-ot-bpla-biznesa-do-oktyabrya-2027-goda-kak--26-oktyabrya-2026-283688/"}, {"num": 8, "cat": "lighting", "catText": "灯具照明", "title": "Smart City & Home by Interlight 2026 今日在 «Крокус Экспо» 开幕（10-27~10-30），Яндекс 智能家居任战略伙伴", "tag": "local", "tagText": "本地", "source": "Современная светотехника", "time": "10-27 10:00", "summary": "国际智能城市与智能家居系统展 Smart City & Home by Interlight 2026 于 10-27 至 10-30 在莫斯科 «Крокус Экспо» 举行，是俄境内城市数字化、楼宇自动化与智能家居方向的主要行业场。今年 «Умный дом с Алисой» 团队以战略伙伴身份参展并发布「无线智能家居」专题，设 «Умный дом Алисы» 演示区，覆盖卧室、厨房到整栋楼与园区。对灯具品牌，这是观察俄智能照明生态与生态合作入口的窗口。", "table": [["展期", "2026-10-27 ~ 10-30"], ["地点", "莫斯科 «Крокус Экспо»"], ["战略伙伴", "Яндекс（Умный дом с Алисой）"]], "sourceFull": "https://lightingmedia.ru/sobytiya/yandeks-na-vystavke-smart-city-home-by-interlight-2026/"}, {"num": 9, "cat": "beauty", "catText": "美妆个护", "title": "9 月中国对俄化妆品出口 3 360 万美元创单月纪录（同比 ×2.2），俄升至中国化妆品第三大买家", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "10-26 23:11", "summary": "俄新社据中国海关数据：9 月中国对俄化妆品出口 3 360 万美元，同比增至 2.2 倍、环比 +45%，创单月纪录；前三季度累计 1.914 亿美元（×1.7）。结构上护肤与粉底 1 850 万美元、唇妆 560 万、眼妆 557 万、粉饼 330 万、美甲用品 55.8 万。9 月中国化妆品出口总额 5.823 亿美元，俄为第三大买家（美国 1.324 亿、英国 4 110 万）。", "table": [["9 月对俄出口", "3 360 万美元（×2.2）"], ["前三季累计", "1.914 亿美元（×1.7）"], ["护肤+粉底", "1 850 万美元"], ["俄方排名", "中国化妆品第 3 大买家"]], "sourceFull": "https://ria.ru/20261026/postavki-2127166525.html"}, {"num": 10, "cat": "appliance", "catText": "家电电器", "title": "«М.Видео» 在 5 城门店开 marketplace 店中店，平台 1-9 月 GMV 228 亿卢布（+202%）、SKU 达 100 万", "tag": "local", "tagText": "本地", "source": "«Ведомости»", "time": "10-26 12:30", "summary": "«М.Видео» 已在莫斯科、波多利斯克、喀山、顿河畔罗斯托夫、塞兹兰 5 家门店开出 marketplace 商品专区（店中店），计划年底前再增 6 家。其平台 1-9 月 GMV 228 亿卢布（同比 +202%），SKU 增至 100 万（×7），入驻卖家 1.5 万；同期 Q2 营收 470 亿卢布（-40%），靠平台业务对冲自营下滑。对家电、照明卖家意味着多一个「线下体验+自提」的高客单价入口。", "table": [["试点门店", "5 家"], ["年底前新增", "6 家"], ["平台 GMV(1-9 月)", "228 亿卢布（+202%）"], ["SKU / 卖家", "100 万 / 1.5 万"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/10/26/1239667-mvideo-perezapustila"}, {"num": 11, "cat": "econ", "catText": "经济金融", "title": "Brent 跌破 110 美元至 109.96（-0.7%），WTI 101.04（-0.71%）", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "10-27 04:21", "summary": "10-27 莫斯科时间 03:56 报价：1 月交货的 Brent 期货跌 0.7% 至 109.96 美元/桶，12 月交货的 WTI 跌 0.71% 至 101.04 美元/桶，为连续第二个交易日走低。对跨境链路意味着海运与欧洲段陆运燃油附加费压力缓和，但油价回落同时削弱卢布结汇支撑，需与汇率联动看。", "table": [["Brent（1 月）", "109.96 美元/桶（-0.7%）"], ["WTI（12 月）", "101.04 美元/桶（-0.71%）"], ["报价时点", "10-27 03:56 MSK"]], "sourceFull": "https://ria.ru/20261027/neft-2127184772.html"}, {"num": 12, "cat": "econ", "catText": "经济金融", "title": "央行 10-27 官方汇率：美元 80.4909、欧元 90.0935、人民币 12.0680，关键利率维持 14.00%", "tag": "local", "tagText": "本地", "source": "Банк России", "time": "10-27 11:30", "summary": "俄央行公布 10-27 官方汇率：美元 80.4909 卢布（前一版 80.5381）、欧元 90.0935（90.2429）、人民币 12.0680（12.0557）。卢布对美元、欧元小幅走强，对人民币基本持平略贬，按 1 元=12.068 卢布折算，中国采购与头程结算成本与上期持平。关键利率自 10-23 决议后维持 14.00%，连续第二次暂停。", "table": [["美元/卢布", "80.4909"], ["欧元/卢布", "90.0935"], ["人民币/卢布", "12.0680（1 元）"], ["关键利率", "14.00%"]], "sourceFull": "https://www.cbr.ru/currency_base/daily/?date_req=27.10.2026"}, {"num": 13, "cat": "econ", "catText": "经济金融", "title": "Минстрой 起草法案：中小城市公用管网可免招标出租 5-7 年，条件是投资改造", "tag": "local", "tagText": "本地", "source": "«Коммерсантъ»", "time": "10-27 02:18", "summary": "«Ъ» 获悉 Минстрой 起草法案：国有公司、供热与保证供电组织及实际运营方，可在居民 2 万人以下的小城，以及 2 万至 20 万人、特许经营招标因无人投标而流标的城市，免招标租用供水、供热、排污管网 5 至 7 年，条件是必须投资改造。专家认为此举可终结「走形式的特许招标」，但更新老化管网仍需额外补贴、运营商整合与费率回报保证。", "table": [["租期", "5-7 年"], ["适用", "≤2 万人；2-20 万人且招标流标城市"], ["对价条件", "投资改造管网"]], "sourceFull": "https://www.kommersant.ru/doc/9061106"}, {"num": 14, "cat": "politics", "catText": "时政要闻", "title": "俄国防部：10-27 04:00 MSK 起赫尔松方向停火，为阿列什基人道行动开「静默模式」", "tag": "local", "tagText": "本地", "source": "ТАСС", "time": "10-27 04:01", "summary": "俄国防部宣布，为筹备赫尔松州阿列什基（Алешки，第聂伯河左岸，对岸为乌方控制的赫尔松）人道行动，自 10-27 04:00 MSK 起在赫尔松方向停止射击并进入「режим тишины」；将组织工程侦察、保障人道车队安全通行，为居民撤离与物资运送开通道。此类局部停火通常只覆盖车队通行窗口，随时可能恢复交火。", "table": [["生效", "2026-10-27 04:00 MSK"], ["范围", "赫尔松方向（阿列什基）"], ["目的", "人道车队通行与居民撤离"]], "sourceFull": "https://tass.ru/armiya-i-opk/28256077"}, {"num": 15, "cat": "politics", "catText": "时政要闻", "title": "沃罗涅日 10-26 遭无人机袭击：3 死约 40 伤，击落 113 架创 СВО 以来纪录，客运列车被击中", "tag": "local", "tagText": "本地", "source": "«Коммерсантъ»", "time": "10-26 18:17", "summary": "СКР 就 10-26 乌方无人机袭击沃罗涅日州立案（恐怖袭击罪）：死亡 3 人、受伤近 40 人；住宅、商业与工业建筑受损，一列载有莫斯科 «Локомотив» 球员的客运列车被击中。州政府称当日在州上空击落 113 架无人机，为 СВО 开始以来该地区最高纪录。对位于中部集群的卖家，铁路与公路运输可能短期绕行。", "table": [["死亡", "3 人"], ["受伤", "近 40 人"], ["击落无人机", "113 架（地区纪录）"], ["受损", "住宅/商业/工业建筑、客运列车"]], "sourceFull": "https://www.kommersant.ru/doc/9061006"}, {"num": 16, "cat": "politics", "catText": "时政要闻", "title": "普京在 ФСЭГ 峰会期间安排 5 场双边：伊朗、卡塔尔、莫桑比克、赤道几内亚、利比亚", "tag": "local", "tagText": "本地", "source": "Интерфакс", "time": "10-27 04:30", "summary": "俄总统助理乌沙科夫通报：普京在第八届天然气出口国论坛（ФСЭГ）峰会结束后，10-27 将进行 5 场双边会晤——伊朗总统佩泽希齐扬、卡塔尔埃米尔塔米姆、莫桑比克总统查波、赤道几内亚总统奥比昂、利比亚总统委员会主席门菲，其中与利比亚的一场排在深夜。议题围绕天然气出口协调与双边能源合作。", "table": [["双边场次", "5 场"], ["对象", "伊朗/卡塔尔/莫桑比克/赤道几内亚/利比亚"], ["时间", "2026-10-27（峰会结束后）"]], "sourceFull": "https://www.interfax.ru/russia/1125131"}, {"num": 17, "cat": "politics", "catText": "时政要闻", "title": "莫斯科伏努科沃与索契、格连吉克机场夜间临时管制，伏努科沃 03:34 恢复起降", "tag": "local", "tagText": "本地", "source": "ТАСС", "time": "10-27 03:34", "summary": "10-26 深夜至 10-27 凌晨，莫斯科伏努科沃机场两次转入「按协调时刻」运行并暂停起降，管制持续约 1.5 小时后于 03:34 恢复接收与放行；同期索契、格连吉克机场实施临时限制，02:24 解除。俄民航局未说明具体原因，此类管制通常与无人机预警相关。空运样品、急件与高价值小件需预留改期窗口。", "table": [["受影响机场", "伏努科沃/索契/格连吉克"], ["伏努科沃恢复", "10-27 03:34 MSK"], ["索契/格连吉克解除", "10-27 02:24 MSK"]], "sourceFull": "https://tass.ru/ekonomika/28256053"}]}
