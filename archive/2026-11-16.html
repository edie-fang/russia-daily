-284451/"}, {"num": 4, "cat": "ecom", "catText": "电商动态", "title": "Beget 恢复期再遭 2.1 Tbit/s DDoS，Ozon/WB/Сбер 在线服务或受影响", "tag": "local", "tagText": "本地", "source": "Sellers Platform", "time": "11-15 18:36", "summary": "俄主机商 Beget 在恢复期再遭大规模 DDoS，峰值 2.1 Tbit/s（初期 850 Gbit/s 后升级），公司称服务稳定、部分 FTP/SSH 会话中断，已恢复约 21.5 万个站点。Sellers Platform 提示使用其托管与接口的 Ozon、Wildberries 与 Сбер 在线服务可能出现访问故障。11-02 首轮攻击后云基础设施仍在重建（更新）。", "table": [["攻击峰值", "2.1 Tbit/s（初期 850 Gbit/s）"], ["恢复", "约 21.5 万站点"], ["受影响面", "Ozon / WB / Сбер 部分在线服务（平台风险提示）"]], "sourceFull": "https://sellersplatform.ru/news/iz-za-ataki-na-hosting-beget-vozmozhny-sboi-ozon-wildberries-i-sberbanka"}, {"num": 5, "cat": "ecom", "catText": "电商动态", "title": "Яндекс Маркет 上线商品直播评测：随时可看实物演示并向主播提问", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "11-15 10:25", "summary": "Retail.ru 周报（09.11–15.11）收录：Яндекс Маркет 上线商品直播评测，买家可随时找到对应直播回放、看商品实际使用效果并直接向主播提问。平台未披露直播场次、观看量或转化数据。对卖家的含义是商品卡之外新增视频化转化入口，测评素材的供给方从卖家自建内容转向平台直播。", "table": [["形式", "直播商品评测（可回看）"], ["互动", "实时提问"], ["数据", "平台未披露场次与转化"]], "sourceFull": "https://www.retail.ru/news/daydzhest-09-11-15-11--15-noyabrya-2026-284448/"}, {"num": 6, "cat": "ecom", "catText": "电商动态", "title": "WB 允许同一商品卡按最多 20 个买家受众分别置顶评价", "tag": "local", "tagText": "本地", "source": "Sellers Platform", "time": "11-14 15:29", "summary": "Wildberries 11 月帮助中心更新：卖家可为同一商品卡配置最多 20 个买家受众，并分别指定展示哪条置顶评价；«Джем» 订阅新增「已购未评」提醒，卖家回复中的 артикул 变为可点击，«Баллы за отзывы» 支持按文本、图片、视频分别计奖，未通过审核的部分不再整条作废。", "table": [["受众上限", "20 个/商品卡"], ["新增", "已购未评提醒"], ["奖励", "文本/图片/视频分项计奖"]], "sourceFull": "https://sellersplatform.ru/news/wildberries-razreshil-prodavtsam-nastraivat-zakreplyonnye-otzyvy-pod-raznye-auditorii"}, {"num": 7, "cat": "lighting", "catText": "灯具照明", "title": "灯具照明：本期无新增重大动态（已核对 8 家 P0/P1 RSS、Retail.ru 灯具主题与平台动态）", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "11-16 09:30", "summary": "本期（11-14~11-16）已核对 RIA、TASS、Interfax、Kommersant、Vedomosti、Izvestia、Lenta、RBC 八家俄媒 RSS，以及 Retail.ru 灯具主题页与 MPUP 平台规则源，无灯具照明行业新增重大动态。行业侧仅有电子与照明设备制造商协会联名反对第 2392 号决议新条件的表态，已收在 🔌 家电电器栏。", "table": [["核对范围", "8 家 P0/P1 RSS + Retail.ru 主题页 + MPUP"], ["结论", "无新增重大动态"], ["相关", "ПП 2392 联名信见第 9 条"]], "sourceFull": "https://www.retail.ru/theme/lighting/?d=2026-11-16"}, {"num": 8, "cat": "beauty", "catText": "美妆个护", "title": "美妆个护：本期无新增重大动态（已核对 8 家 P0/P1 RSS 与 Retail.ru 美妆主题）", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "11-16 09:30", "summary": "本期（11-14~11-16）已核对 RIA、TASS、Interfax、Kommersant、Vedomosti、Izvestia、Lenta、RBC 八家俄媒 RSS 与 Retail.ru 美妆个护主题页，无该行业新增重大动态。上期已收录的 «Золотое Яблоко» 11.11 战报（线上客单 5,044 ₽、比线下高 43%）不再重复。", "table": [["核对范围", "8 家 P0/P1 RSS + Retail.ru 美妆主题"], ["结论", "无新增重大动态"]], "sourceFull": "https://www.retail.ru/theme/cosmetics-perfumes/?d=2026-11-16"}, {"num": 9, "cat": "appliance", "catText": "家电电器", "title": "电子与灯具制造商联名反对 ПП 2392 新条件：警告涨价与失去登记资格", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "11-16 01:48", "summary": "多家协会（印刷电路板联盟、电信设备协会、灯具制造商协会 «Содружество производителей светотехники» 等）致函 Минпромторг，反对第 2392 号决议新条件：企业须把税收优惠节省额的两倍再投资，且 70% 收入须来自本国登记产品。协会称将推高俄产电子与灯具价格、部分企业或被剔出登记名录，要求取消 70% 门槛、改为 1 倍再投资并设过渡期。", "table": [["再投资要求", "≥2 倍税收优惠节省额"], ["本国收入占比", "≥70%（登记产品）"], ["协会诉求", "取消 70% 门槛 / 改 1 倍 / 设过渡期"]], "sourceFull": "https://www.kommersant.ru/doc/9109916"}, {"num": 10, "cat": "econ", "catText": "经济金融", "title": "俄统计局：Q3 GDP 同比 +1%，经发部上调 1–9 月增速至 0.8%", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "11-15 20:30", "summary": "俄统计局：2026 年 Q3 GDP 同比 +1.0%（Q2 +1.3%），符合央行预期、高于经发部原估 0.6%；数据发布后经发部将 1–9 月增速由 0.6% 上调至 0.8%，称全年可能略超 0.6% 的官方预测。投资继续拖累：Q3 固定资本投资 -6.2%，已连续六个季度下滑；10 月消费支付环比 -2.2%。", "table": [["Q3 GDP", "+1.0% YoY"], ["1–9 月", "+0.8%（上调）"], ["投资", "-6.2%（连续 6 季）"], ["10 月消费支付", "-2.2%（季调）"]], "sourceFull": "https://www.kommersant.ru/doc/9109892"}, {"num": 11, "cat": "econ", "catText": "经济金融", "title": "МЭА：10 月全球石油供给首次超过需求，俄油出口收入升至 211.5 亿美元", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "11-16 01:48", "summary": "МЭА 11-13 月报：10 月全球石油供给环比 +230 万桶/日至 1.054 亿桶/日，首次超过今年均值需求 1.023 亿桶/日，波斯湾出口仍比战前低 26%。俄油出口 +26 万桶/日至 682 万桶/日，收入 +36.1 亿美元至 211.5 亿美元，Urals FOB Primorsk 101.28 美元/桶（+6.98）。", "table": [["供给 / 需求", "1.054 / 1.023 亿桶/日"], ["俄油出口", "682 万桶/日"], ["俄油收入", "211.5 亿美元（+36.1 亿）"], ["Urals FOB", "101.28 美元/桶（+6.98）"]], "sourceFull": "https://www.kommersant.ru/doc/9109868"}, {"num": 12, "cat": "econ", "catText": "经济金融", "title": "10 月全俄新房销售 -29.7% 至 193 万㎡，开发商营收 -24.9%", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "11-15 14:43", "summary": "Dataflat：10 月全俄新房销售 193 万㎡，同比 -29.7%；开发商营收 -24.9% 至 4,065.8 亿卢布。跌幅最深为秋明州 -50%、罗斯托夫州 -48%、克拉斯诺达尔边疆区 -48%，莫斯科 -43%、圣彼得堡 -29%。主因 10-01 起家庭按揭条件收紧：优惠贷款占比由 65% 降至 22%，自有资金购房占比由 11% 升至 38%。", "table": [["销量", "193 万㎡（-29.7%）"], ["营收", "4,065.8 亿 ₽（-24.9%）"], ["优惠按揭占比", "65% → 22%"], ["自有资金占比", "11% → 38%"]], "sourceFull": "https://www.kommersant.ru/doc/9109631"}, {"num": 13, "cat": "econ", "catText": "经济金融", "title": "«Эйлер» 上调俄钢价预测：2026 年热轧 +37 美元/吨至 620 美元", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "11-16 00:00", "summary": "«Эйлер» 上调俄钢价预测：2026 年热轧均价 +37 美元/吨至 620 美元/吨（EXW），螺纹钢 +57 至 580 美元/吨，港口热轧 +42 至 500 美元/吨（FOB）；2027 年热轧再涨至 640 美元。9 月俄钢材消费 +12%、产量仅 +2%，出口 -41% 至 120 万吨。中国供应增加与黑海航运风险仍是主要变量。", "table": [["热轧 2026", "620 美元/吨（+37）"], ["螺纹 2026", "580 美元/吨（+57）"], ["9 月出口", "120 万吨（-41%）"]], "sourceFull": "https://www.kommersant.ru/doc/9109918"}, {"num": 14, "cat": "econ", "catText": "经济金融", "title": "ФАС：78 个地区签署价格稳定协议，覆盖 14,736 家经营主体", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "11-15 12:40", "summary": "ФАС：截至 11 月，78 个地区依第 662 号政府决议与 14,736 家经营主体签署价格稳定协议，含 231 家生产商、52 家批发商、13,705 家零售企业、49 家药店与 391 家建材商。11 月新加入马里埃尔共和国、克拉斯诺达尔边疆区、鄂木斯克州与莫斯科市。进入协议清单意味着价格与加价处于地区监控之下。", "table": [["覆盖", "78 地区 / 14,736 家主体"], ["新增", "马里埃尔、克拉斯诺达尔、鄂木斯克、莫斯科"], ["依据", "政府决议 №662"]], "sourceFull": "https://www.retail.ru/news/fas-k-soglasheniyam-o-stabilizatsii-tsen-prisoedinilos-4-regiona-15-noyabrya-2026-284460/"}, {"num": 15, "cat": "politics", "catText": "时政要闻", "title": "11-15 夜至 11-16 晨：莫斯科方向击落 139 架无人机，伏努科沃限航", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "11-16 02:54", "summary": "莫斯科市长索比亚宁通报：11-15 晚至 11-16 晨，飞往莫斯科的 139 架无人机被击落；伏努科沃机场实施临时限航，谢列梅捷沃按协调起降，雅罗斯拉夫尔机场暂停运营、雅罗斯拉夫尔—莫斯科公路封闭，雅罗斯拉夫尔州另击落 5 架。暂无平台仓受损通报，但空域与莫斯科—雅罗斯拉夫尔干线时效受扰。", "table": [["击落", "139 架（莫斯科方向）"], ["机场", "伏努科沃限航 / 谢列梅捷沃限流 / 雅罗斯拉夫尔暂停"], ["公路", "雅罗斯拉夫尔—莫斯科封闭"], ["平台仓", "无受损通报"]], "sourceFull": "https://ria.ru/20261116/ataka-2131723726.html"}, {"num": 16, "cat": "politics", "catText": "时政要闻", "title": "鞑靼斯坦下卡姆斯克工业区遭无人机袭击，6 人受伤", "tag": "local", "tagText": "本地", "source": "Lenta.ru", "time": "11-15 14:39", "summary": "下卡姆斯克市长 Беляев 通报：11-15 无人机袭击该市工业区，6 人受伤，其中 5 人已获救治、1 名国民近卫军员工住院；另有一架无人机击中一栋公寓楼（未引爆），居民已疏散，供电与供水恢复、燃气待恢复。当地为石化与工业集群，暂无电商平台仓储设施受损通报。", "table": [["地点", "下卡姆斯克（鞑靼斯坦）"], ["伤亡", "6 伤（1 人住院）"], ["设施", "工业区 + 公寓楼；无平台仓"]], "sourceFull": "https://lenta.ru/news/2026/11/15/v-rossiyskom-regione-shest-chelovek-postradali-v-rezultate-ataki-bpla-na-promzonu/"}, {"num": 17, "cat": "politics", "catText": "时政要闻", "title": "中国外交部确认 11-19 普京—习近平—特朗普在深圳举行三方会晤", "tag": "local", "tagText": "本地", "source": "Известия", "time": "11-16 04:36", "summary": "中国外交部确认，普京、习近平与特朗普将于 11-19 在深圳 APEC 峰会期间举行三方会晤。此前克宫 11-14 已确认日期与地点，中方此次为首次官方确认；美方称议题含核裁军，俄中均未确认具体议程（待核实）。三方会晤对能源、结算与跨境物流的政策预期影响大于即时商业条款。", "table": [["日期", "2026-11-19"], ["地点", "深圳（APEC 峰会期间）"], ["确认方", "中国外交部（首次官方确认）"], ["议程", "含核裁军（美方口径，待核实）"]], "sourceFull": "https://iz.ru/2202387/2026-11-16/mid-knr-podtverdil-vstrechu-putina-si-tczinpina-i-trampa-19-noiabria"}, {"num": 18, "cat": "politics", "catText": "时政要闻", "title": "爱沙尼亚拟自 12-01 关闭全部对俄口岸，导火索为国防企业纵火未遂", "tag": "local", "tagText": "本地", "source": "Lenta.ru", "time": "11-15 19:23", "summary": "爱沙尼亚总理 Михал 要求内政部与政府办公室做好准备，自 12-01 起关闭全部对俄边检站；导火索是本国国防企业 Threod Systems（无人机与侦察系统）遭纵火未遂。俄外交部称将评估后果。若落地，经波罗的海的陆路中转与电商小包时效将受扰动（是否执行待核实）。", "table": [["拟生效", "2026-12-01"], ["范围", "全部对俄口岸"], ["导火索", "Threod Systems 纵火未遂"], ["状态", "待政府决定（待核实）"]], "sourceFull": "https://lenta.ru/news/2026/11/15/vse/"}, {"num": 19, "cat": "politics", "catText": "时政要闻", "title": "欧盟下周拟批新一轮对俄制裁：瞄准「影子舰队」的银行、买家与承运商", "tag": "local", "tagText": "本地", "source": "Lenta.ru", "time": "11-15 16:09", "summary": "欧盟外交与安全政策高级代表 Каллас 称，欧盟外长会将于下周批准新一轮对俄制裁补充，对象包括支持俄「影子舰队」的银行、买家与承运公司；11-13 欧盟海军行动 EUNAVFOR MED IRINI 在地中海登检涉嫌悬挂他国旗帜运输俄油的 MV MIDAG。对卖家的含义是海运保险与合规审查趋严，油运成本会传导至干线运费。", "table": [["对象", "影子舰队相关银行 / 买家 / 承运公司"], ["时点", "下周欧盟外长会"], ["已动作", "登检 MV MIDAG（11-13）"]], "sourceFull": "https://lenta.ru/news/2026/11/15/new/"}]}
