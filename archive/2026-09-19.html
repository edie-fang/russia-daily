{"date": "2026-09-19", "stats": {"total": 30, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "Ozon 卖家首轮保险赔付到账 82 亿卢布，覆盖约 9 万家卖家", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru) / 生意人报(Kommersant)", "time": "09-18 20:16", "summary": "Ozon 公告称，针对 Чапаевск（萨马拉州）、Энем（阿迪格）、Махачкала（达吉斯坦）三处仓库事故中受损商品的首轮赔付已完成，承保方为 «Ингосстрах»：约 9 万名在事故时持有有效保单的卖家获赔，总额 82 亿卢布（8,2 млрд рублей）。Ozon 强调这只是第一部分，最终结算将在盘点完成后给出。仅获约 1,000 卢布的 FBS 卖家，是因为其仓内只存退货与取消订单、并非完整供货。", "table": [["赔付总额", "82 亿卢布（首轮）"], ["获赔卖家", "约 90,000 家"], ["涉及仓库", "Чапаевск / Энем / Махачкала"], ["承保方", "«Ингосстрах»"], ["后续", "盘点后最终结算"]], "sourceFull": "https://www.retail.ru/news/ingosstrakh-perechislil-prodavtsam-ozon-8-2-mlrd-rubley-18-sentyabrya-2026-282315/"}, {"num": 2, "title": "Wildberries 10-01 启动第三轮赔付：覆盖超 20 万卖家，为遇袭以来最大规模", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru) / 生意人报(Kommersant)", "time": "09-18 15:20", "summary": "Wildberries（RWB 集团）宣布自 10 月 1 日起开展第三轮自愿支持性赔付，对象是因无人机袭击物流设施而受损的卖家。获赔合作伙伴总数将超过 20 万家，可覆盖全部受损的中小企业卖家，是袭击发生以来规模最大的一次赔付。平台称该措施「部分得益于国家已作出的决定」，赔付期间将以卖家后台个人通知形式告知。", "table": [["启动日期", "2026-10-01"], ["覆盖卖家", ">20 万家"], ["性质", "自愿支持性赔付（第三轮）"], ["通知方式", "卖家后台个人通知"]], "sourceFull": "https://www.retail.ru/news/wildberries-s-1-oktyabrya-nachnet-tretiy-etap-vyplat-postradavshim-ot-atak-bpla--18-sentyabrya-2026-282304/"}, {"num": 3, "title": "Wildberries 9 月初以来新开 100+ 合作履约中心与收货点，物流半径下沉", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti) / 零售网(Retail.ru)", "time": "09-18 10:00", "summary": "Wildberries 自 9 月初起在各大联邦区累计启用 100 余个合作履约中心（ПФЦ）与收货点（ППТ）。ПФЦ 作为中转发货点，让卖家在离仓储或产地更近处交货，压缩到买家的「物流臂长」；ППТ 则是快速处理供货的收货点，使中小企业无需把货拉到大城市。首批 ППТ 于 9 月 4 日在中央、南部与西伯利亚联邦区上线。平台称仍在受理业主与租户的开点申请。背景：7 月以来 WB 物流设施持续遭无人机袭击，部分仓库连同货物被完全摧毁。", "table": [["新开对象数", ">100 个（9 月初以来）"], ["类型", "ПФЦ 合作履约中心 / ППТ 收货点"], ["首批 ППТ", "2026-09-04（中央/南部/西伯利亚）"], ["作用", "缩短物流臂长、下沉覆盖"], ["背景", "7 月起物流设施持续遇袭"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/09/18/1229732-100-logisticheskih-obektov"}, {"num": 4, "title": "图书行业遇袭损失口径细化：行业初步估 60 亿卢布、约 1,500 万册", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-18 14:05", "summary": "俄数字发展部（Минцифры）出版业国家支持司司长 Григорьев 表示，6–8 月乌克兰无人机袭击 Wildberries 与 Ozon 平台仓库给图书行业造成的损失初步估计为 60 亿卢布，该口径为被烧毁图书的成本价，涉及约 1,500 万册。同日出版社 «Книжники» 总编辑 Горин 确认已核实损失 5,000 册，金额达数百万卢布，形成的资金缺口约相当于该社三个月的营业额。", "table": [["行业损失（初步）", "60 亿卢布"], ["涉损册数", "约 1,500 万册"], ["口径", "图书成本价"], ["单家案例", "«Книжники» 5,000 册（≈3 个月营业额）"], ["统计方", "Минцифры"]], "sourceFull": "https://ria.ru/20260918/evreyskoe-2118498925.html"}, {"num": 5, "title": "近半数零售商拟靠 AI 削减人力开支，食品/家居/家电板块达 50%", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-18 07:23", "summary": "一项覆盖 77 家公司（57 家零售连锁、12 家制造商、8 家其他）的调研显示，近半数零售商计划通过 AI 削减人员开支，食品、家居、家电与电子板块该比例达 50%；24.6% 认为 AI 不改变人力成本，33.3% 尚未评估。落地案例：Магнит 称 AI 与机器人化使常规任务效率 +15%，研发端把新品构想落地速度提高 6 倍；Fix Price 约 50% 线性岗位候选人由机器人招聘官 Vocamate AI 筛选；Яндекс Лавка 用 AI 生成商品卡，手工工作量近乎减半。麦肯锡与 EuroCommerce 估计 AI 可提升零售 EBITDA 4–10 个百分点。本条目为前一期 TASS 转述《Известия》42% 标题级口径的完整版，以后者数据为准。", "table": [["拟减员比例", "≈50%（食品/家居/家电/电子）"], ["样本", "77 家公司（57 连锁）"], ["Магнит 效率", "常规任务 +15%、研发 +6 倍"], ["Fix Price", "50% 线性岗位 AI 初筛"], ["EBITDA 增益（McKinsey）", "4–10 个百分点"]], "sourceFull": "https://www.retail.ru/news/pochti-polovina-riteylerov-planiruet-sokratit-raskhody-na-personal-za-schet-ii-18-sentyabrya-2026-282273/"}, {"num": 6, "title": "Wildberries 阿拉木图物流中心工地被哈萨克斯坦执法部门搜查（承包商纠纷）", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-18 15:48", "summary": "哈萨克斯坦执法人员在 Wildberries 位于阿拉木图的物流中心建设工地进行搜查。Wildberries 方面称，搜查缘于施工承包商之间的纠纷，而非针对平台本身。该事件发生在 Wildberries 因俄境内仓库接连遇袭、正加速在境外与外围布点的时点，对其跨境物流建设节奏构成短期扰动，具体工期影响未披露。", "table": [["地点", "阿拉木图（哈萨克斯坦）"], ["对象", "WB 物流中心在建工地"], ["起因", "承包商之间纠纷"], ["平台表态", "非针对平台"], ["影响", "工期影响未披露"]], "sourceFull": "https://www.kommersant.ru/doc/8969837"}, {"num": 7, "title": "«Ашан» 就外部管理令请求解释；法方与涉俄被接管企业保持接触", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant) / 俄新社(RIA)", "time": "09-18 13:35", "summary": "针对普京 9-17 签署的总统令（把 Auchan、Nestle、FM Logistic、原 Leroy Merlin 俄罗斯资产移交临时管理），«Ашан Ритейл Россия» 表示已就命令内容发函请求解释。《Лемана Про》 此前称门店与运营照常。俄新社报道补充：法国方面正与在俄被移交管理的公司保持接触，涉及法国零售集团 Auchan、法国物流集团 FM Logistic 以及原 Leroy Merlin 资产。该事项属外资零售与物流资产治理结构的持续变动，为前一期 [7] 的后续进展。", "table": [["涉事主体", "Auchan / Nestle / FM Logistic / Лемана Про"], ["命令签署", "2026-09-17（普京总统令）"], ["«Ашан» 动作", "发函请求解释"], ["法方态度", "与涉事企业保持接触"], ["运营状态", "Лемана Про 称照常"]], "sourceFull": "https://www.kommersant.ru/doc/8969710"}, {"num": 8, "title": "现成餐食配送服务 Level Kitchen 走向破产：执行程序达 4,400 万卢布", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-18 16:16", "summary": "自 2017 年运营的现成餐食配送服务 Level Kitchen 准备破产。所属 Performance Group 解释称，公司因结算账户受限、以及税务局就争议性计提划扣资金而陷入困境，税务追缴正在申诉中，并称危机恰逢全行业最艰难时期。据 Rusprofile，针对运营商 «Левел мск» 的现行执行程序达 4,400 万卢布、涉 28 案；仅 2026 年就收到 30 余起诉讼、合计 1.252 亿卢布（2025 全年不超过 6,060 万，2021–2024 年均约 220 万）；8 月底欠缴罚息与罚款约 1,900 万卢布。", "table": [["公司", "Level Kitchen（«Левел мск»）"], ["成立于", "2017 年"], ["执行程序", "4,400 万卢布 / 28 案"], ["2026 年诉讼", "30+ 起，合计 1.252 亿卢布"], ["2025 年对比", "≤6,060 万卢布"], ["税务欠缴", "约 1,900 万卢布（8 月底）"]], "sourceFull": "https://www.retail.ru/news/servis-dostavki-pitaniya-level-kitchen-gotovitsya-k-bankrotstvu-18-sentyabrya-2026-282307/"}, {"num": 9, "title": "政府批准修法：餐饮车、移动加油站与售货亭可进入公路休息区", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-18 08:01", "summary": "俄政府批准相关修正案，允许在公路休息区设置餐饮车、移动式加油站与售货亭等流动商业设施。该规则把此前处于灰区的小型移动零售业态纳入合法经营通道，对以公路干线为轴心铺设渠道的食品、快消与非食品小业态是增量窗口，也意味着加油站便利店体系之外的移动零售场景将扩容。", "table": [["决定方", "俄政府（批准修正案）"], ["放开业态", "餐饮车 / 移动加油站 / 售货亭"], ["落地场景", "公路休息区"], ["影响", "移动零售合法化通道"]], "sourceFull": "https://www.kommersant.ru/doc/8957508"}, {"num": 10, "title": "特朗普签署「地狱制裁」法案：可对俄能源买家加征最高 100% 关税", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti) / 生意人报(Kommersant) / 塔斯社(TASS) / 国际文传电讯社(Interfax)", "time": "09-19 01:27", "summary": "白宫网站公布，特朗普已签署《2026 年林赛·格雷厄姆对俄与对伊制裁法》，授权并扩大对俄制裁、关税与禁令，其中包括对购买俄石油与天然气的国家（含中国、印度）加征最高 100% 的关税，同时延长对伊朗的现行限制。9-17 美众议院以 262:159 通过该案。俄国际事务委员会总干事 Тимофеев 认为该法「不会带来原则上的新现实」，其中二级关税部分总统可最小化执行甚至不使用。", "table": [["签署", "2026-09-18（特朗普）"], ["核心工具", "关税最高 100%（俄能源买家）"], ["点名对象", "中国、印度等"], ["众议院表决", "262:159（09-17）"], ["俄方评估", "实质增量有限，执行弹性大"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/19/1230119-tramp-podpisal-zakon"}, {"num": 11, "title": "美丹格陵兰安全协议：美军将扩大在格陵兰部署，但不获领土控制", "tag": "local", "tagText": "本地", "source": "国际文传电讯社(Interfax) / 俄新社(RIA)", "time": "09-19 03:44", "summary": "特朗普宣布美国与丹麦、格陵兰达成一项安全领域的无限期协议，并称将开始在该岛大规模部署军事力量，且对手国不得在格陵兰设基地。格陵兰与丹麦总理对此表示欢迎。PBS 记者则澄清美国不会获得该岛领土控制权。该协议在联大期间宣布，直接改变北极方向的力量态势，与俄方近期有关北约在北极急速增兵的表述形成呼应。", "table": [["协议方", "美国 / 丹麦 / 格陵兰"], ["期限", "无限期（特朗普表述）"], ["内容", "美扩大军事存在"], ["领土", "不转移（PBS 口径）"], ["宣布场合", "联大期间"]], "sourceFull": "https://www.interfax.ru/world/1117013"}, {"num": 12, "title": "普京：俄无意攻击欧洲、愿恢复关系；同时称已准备好回应油轮被扣", "tag": "local", "tagText": "本地", "source": "国际文传电讯社(Interfax) / 生意人报(Kommersant)", "time": "09-18 22:55", "summary": "普京在军事工业委员会会议上表示，俄罗斯对欧洲国家没有任何侵略意图、连理由都没有，并称愿与欧洲邻居合作、恢复关系；他同时批评波罗的海演习演练扣押民用船舶，反问西方为何反倒指责俄方。在同一场会议上，普京称俄罗斯已准备好回应其油轮被扣押的行为。此番表态与其 9-18 稍早关于某些人称俄要打欧洲是为援乌开支找理由的口径一致。", "table": [["表态人", "普京（军事工业委员会会议）"], ["对欧口径", "无侵略意图、愿恢复关系"], ["批评点", "波罗的海演习演练扣船"], ["油轮议题", "准备回应被扣"], ["时间", "2026-09-18 晚"]], "sourceFull": "https://www.interfax.ru/russia/1116993"}, {"num": 13, "title": "俄回应欧盟第 21 轮制裁：大幅扩大欧盟人员入境禁令名单", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti) / 生意人报(Kommersant)", "time": "09-18 16:19", "summary": "俄外交部宣布，作为对欧盟第 21 轮制裁的回应，扩大禁止入境俄罗斯的欧盟人员名单，新增对象包括参与损害俄利益与安全行动者、对俄敌对的公民活动人士、学术界代表以及支持反俄法案的欧洲议员；俄方称将继续坚持维护国家利益的外交路线。欧盟第 21 轮包于 7-23 通过，列入 170 家组织和 48 名个人，并冻结 94 家俄银行与大型金融机构资产。", "table": [["俄方动作", "扩大欧盟人员入境禁令"], ["新增类别", "活动人士 / 学者 / 欧洲议员"], ["对应制裁", "欧盟第 21 轮（7-23）"], ["欧方规模", "170 组织 + 48 个人"], ["冻结对象", "94 家俄银行与金融机构"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/18/1230013-rossiya-otvetila"}, {"num": 14, "title": "克宫否认年底动员 30 万人：佩斯科夫称选举后不会有隐性动员", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti) / 生意人报(Kommersant)", "time": "09-18 18:38", "summary": "针对流传的年底前动员 30 万人说法，俄总统新闻秘书佩斯科夫予以否认，并称选举结束后不会有隐性动员。该表态出现在国家杜马选举投票首日、社交平台上相关传闻扩散的背景下，对劳动力市场（尤其是仓储、物流与制造业用工）预期有直接影响，也是判断 Q4 人力成本走向的官方口径之一。", "table": [["表态人", "佩斯科夫（总统新闻秘书）"], ["否认内容", "年底动员 30 万人"], ["配套口径", "选后无隐性动员"], ["时点", "杜马选举首日"], ["影响面", "劳动力与用工预期"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/18/1230072-oprovergli-sluhi-o-planah"}, {"num": 15, "title": "一夜一晨击落 629 架无人机：覆盖 16 地区与两海域，莫斯科方向超 350 架", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti) / 俄国防部", "time": "09-18 10:29", "summary": "俄国防部通报，9-17 20:00 至 9-18 08:00 间防空力量在 16 个地区及亚速海、黑海海域击落 629 架乌克兰无人机，覆盖阿斯特拉罕、别尔哥罗德、布良斯克、弗拉基米尔、卡卢加、库尔斯克、奥廖尔、罗斯托夫、梁赞、斯摩棱斯克、图拉等州及克拉斯诺达尔、莫斯科地区、阿迪格、克里米亚。莫斯科市长 Собянин 称 9-17 晚往莫斯科地区方向飞行的无人机超 350 架、其中 64 架在近郊被击落；罗斯托夫州 10 余栋房屋受损。袭击仍处高位，仓储与物流设施为主要风险敞口。", "table": [["击落数量", "629 架（09-17 20:00–09-18 08:00）"], ["覆盖", "16 个地区 + 亚速海/黑海"], ["莫斯科方向", ">350 架飞向莫斯科地区"], ["近郊击落", "64 架"], ["次要影响", "罗斯托夫 10+ 房屋受损"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/18/1229840-pvo-sbili"}, {"num": 16, "title": "杜马选举首日投票率 29.19%，比 2021 年高出 10.8 个百分点", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti) / 塔斯社(TASS)", "time": "09-19 00:24", "summary": "据中央选举委员会 9-18 20:00（莫斯科时间）数据，杜马选举首日全国投票率 29.19%，比 2021 年首日（18.39%）高出 10.8 个百分点，各地区普遍增长 8–12 个百分点。增幅最大为布良斯克州（+37.57 个百分点至 64.49%），塞瓦斯托波尔首日 47.13% 已接近 2021 年三日投票的 49.26%；莫斯科 +5.51 个百分点至 28.58%。15 个地区首日投票率超 40%，领先者为顿涅茨克（72.7%）、布良斯克（64.49%）、车臣（63.2%）。9-19 起中国北京、上海等 7 城投票站开放。", "table": [["首日投票率", "29.19%"], ["2021 年首日", "18.39%（+10.8 п.п.）"], ["最高增幅", "布良斯克州 +37.57 п.п."], [">40% 地区数", "15 个"], ["前三", "顿涅茨克 72.7% / 布良斯克 64.49% / 车臣 63.2%"], ["海外投票", "中国 7 城（09-19 起）"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/19/1230115-yavka-previsila-2021"}, {"num": 17, "title": "央行 9-19 官方汇率：美元 84.1975、欧元 96.6671、人民币 12.5670", "tag": "local", "tagText": "本地", "source": "俄央行(ЦБ РФ)", "time": "09-19 00:00", "summary": "俄央行公布 9-19 官方汇率：美元 84.1975 卢布、欧元 96.6671 卢布、人民币 12.5670 卢布；9-18 分别为 84.5093、97.4984、12.5788。美元与欧元双双回落（美元 -0.31、欧元 -0.83），人民币基本持平。卢布在选举周、油价高位与新一轮美方制裁法案签署的叠加背景下小幅走强，跨境结算的汇率窗口相对友好。", "table": [["美元", "84.1975（前值 84.5093）"], ["欧元", "96.6671（前值 97.4984）"], ["人民币", "12.5670（前值 12.5788）"], ["变化", "美元 -0.31 / 欧元 -0.83"]], "sourceFull": "https://www.cbr.ru/scripts/XML_daily.asp"}, {"num": 18, "title": "MOEX：BR-10.26 合约 9-18 结算价 104.35 美元/桶，收盘 103.03", "tag": "local", "tagText": "本地", "source": "莫斯科交易所(MOEX)", "time": "09-18 23:49", "summary": "莫斯科交易所 BR-10.26（Brent 十月合约）9-18 开盘 103.90、最高 104.96、最低 101.89、收盘 103.03 美元/桶，官方结算价 104.35 美元（前一交易日结算 103.37、收盘 104.24）。如实标注：本机无法直连实时 ICE 行情源，RSS 中最新一条 ICE Brent 报价仍为 9-17 14:13 的 102.89 美元（-2.78%），9-18/9-19 的 ICE 即时价未取得，故此处仅给出 MOEX 可核验口径。", "table": [["BR-10.26 结算价", "$104.35（前值 $103.37）"], ["收盘", "$103.03"], ["日内区间", "$101.89 – $104.96"], ["ICE 最新可得", "$102.89（09-17 14:13，-2.78%）"], ["数据完整度", "ICE 09-18/19 即时价未取得"]], "sourceFull": "https://iss.moex.com/iss/history/engines/futures/markets/forts/securities/BRV6.json"}, {"num": 19, "title": "黑海航运受阻迫使俄石油出口重排：新罗西斯克 9 月上旬装运下降 40%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-18 20:43", "summary": "Kommersant 报道，9 月第一旬俄新罗西斯克港石油装运量环比下降 40%，同期波罗的海方向出口在一周内增长 8.5%，黑海航运受阻导致俄石油出口流重新分配；预计 9 月海上石油出口总量为 420 万桶/日。出口路径的再平衡直接影响运费与到岸成本结构，也是原油价格维持高位的支撑因素之一。", "table": [["新罗西斯克装运", "-40%（9 月第一旬）"], ["波罗的海出口", "+8.5%（一周）"], ["9 月海上出口预测", "420 万桶/日"], ["驱动", "黑海航运受阻"]], "sourceFull": "https://www.kommersant.ru/doc/8970081"}, {"num": 20, "title": "卢布走强重创农机出口：Ростсельмаш 对外农机报价上涨约 30%", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)", "time": "09-18 07:46", "summary": "«Ростсельмаш» 股东之一 Бабкин 向 Vedomosti 表示，卢布走强严重损害农机出口：按外币计价，俄产联合收割机价格因汇率因素上升约 30%，以前约 15 万美元的机器现在超过 20 万美元，客户需要反复解释成本，出口市场因此明显小于潜力。公司正适应需求下滑的第四年，削减成本与投资但仍推进新机型研发。该案例对强卢布叠加高利率环境下所有出口型制造与跨境定价有直接参考意义。", "table": [["出口报价变化", "+约 30%（汇率因素）"], ["举例", "$150,000 → >$200,000"], ["需求状态", "连续第 4 年下滑"], ["企业动作", "削减成本与投资、保住新机型"], ["归因", "汇率、税收与货币信贷政策"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/09/18/1229813-krepkii-rubl-obvalil"}, {"num": 21, "title": "央行发布数字资产投资风险限额草案：区分自有与客户资金口径", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-18 20:57", "summary": "俄央行公布一项条例草案，为核算直接投资与客户投资数字资产引入限额（нормативы），以限制信用机构在加密资产上的风险敞口。这是央行在数字资产合法化推进后首次以规范性文件形式设定资本与风险计量口径，对涉及加密相关业务的金融机构及其资金成本具有约束意义；草案细节与生效时点尚未最终确定。", "table": [["发布方", "俄央行（草案）"], ["对象", "数字资产直接投资与客户投资"], ["手段", "引入风险限额（нормативы）"], ["目的", "限制加密资产风险敞口"], ["状态", "草案，细节待定"]], "sourceFull": "https://www.kommersant.ru/doc/8970091"}, {"num": 22, "title": "比特币 5 月以来首次突破 8 万美元，单日 +6.3% 至 81,080 美元", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-18 19:49", "summary": "比特币价格升至 81,080 美元，24 小时上涨 6.3%，为 5 月中旬以来首次站上 8 万美元。报道称本轮上行发生在因美国通胀数据与油价上涨导致的一周下跌之后，属情绪与资金面的反转。对以加密结算或持币资产计价的对俄贸易通道而言，波动区间重新上移，但汇率与合规口径仍需单独核算。", "table": [["价格", "$81,080"], ["24h 涨幅", "+6.3%"], ["关键位", "5 月中旬以来首次破 $80,000"], ["前情", "美国通胀与油价推升导致的一周下跌"]], "sourceFull": "https://www.kommersant.ru/doc/8970056"}, {"num": 23, "title": "FT：欧洲国家开始把黄金运出美国，荷兰央行转出逾 78 吨至英国", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti) 引 Financial Times", "time": "09-18 18:27", "summary": "据 FT 报道，荷兰央行（DNB）以地缘政治动荡为由，把 78 吨以上黄金从美国转移至英国，行长 Слейпен 称此举改善了黄金储备的购买力。报道指出，DNB 是在欧洲政界呼吁撤回在美黄金储备后采取行动的，央行称该决定是为危机做准备。此前法国已在 2025 年 7 月至 2026 年 1 月间把全部黄金撤出美国。该趋势反映储备资产的去美国化取向，间接影响黄金计价与本币储备结构。", "table": [["主体", "荷兰央行（DNB）"], ["转移规模", ">78 吨"], ["路径", "美国 → 英国"], ["理由", "地缘政治动荡、危机准备"], ["先例", "法国 2025-07 至 2026-01 全部撤出"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/09/18/1230060-strani-evropi-nachali"}, {"num": 24, "title": "秋收推进：已收 1.2 亿吨粮食，小麦超 9,000 万吨，冬播已完成 600 万公顷", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)", "time": "09-18 14:58", "summary": "俄农业部长 Лут 通报，全国已收获粮食 1.2 亿吨以上，小麦已收超 9,000 万吨，仅剩 8% 播种面积待脱粒，南部地区已开始收玉米；秋播进展良好，冬作物已播近 600 万公顷，全年计划超 1,900 万公顷（2025 年冬播约 2,000 万公顷）。参考：2025 年俄粮食总产 1.412 亿吨（不含新地区），含新主体约 1.446 亿吨。粮食供给与出口潜力对汇率、物流与包材成本构成中期变量。", "table": [["已收粮食", ">1.2 亿吨"], ["小麦", ">9,000 万吨"], ["待收面积", "8%"], ["冬播进度", "近 600 万公顷（计划 >1,900 万）"], ["2025 年总产", "1.412 亿吨（含新地区 1.446 亿）"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/09/18/1229982-rossii-uzhe-sobrano"}, {"num": 25, "title": "政府向杜马提交法案：限制企业重组时的提前追债", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-18 19:11", "summary": "俄政府向国家杜马提交法律草案，限制企业重组（реорганизация）过程中债权人提前要求履行义务的空间。现行规则下债权人可在重组时要求提前清偿，导致重组难以推进；新草案意在降低重组过程中的资金链断裂风险，对处于制裁与遇袭双重压力下、正在做主体或资产重组的企业具有实际意义。", "table": [["提出方", "俄政府"], ["形式", "法律草案（已提交杜马）"], ["内容", "限制重组时提前追债"], ["目的", "降低重组中的资金链风险"]], "sourceFull": "https://www.kommersant.ru/doc/8970038"}, {"num": 26, "title": "iPhone 18 Pro Max 的 AI 功能对俄用户不可用，核心原因是缺俄语支持", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru) / 数据报(Vedomosti) 引《Известия》", "time": "09-18 10:30", "summary": "报道称，iPhone 18 Pro Max 的 AI 功能对俄罗斯用户不可用，关键障碍是俄语不在支持语言之列。受限功能包括带个人上下文的新版 Siri、通过语音助手的 ChatGPT 官方集成、Writing Tools（改写/缩写/调整文风），以及 Genmoji、Image Playground、Visual Intelligence、照片增强搜索、Clean Up 与 Live Translation（经 AirPods 的消息/通话/音频即时翻译）。此外俄用户仍面临无法支付 Apple 服务与无 5G 等传统限制。对高端智能机渠道而言，功能可用性正成为比价格更强的决策变量。", "table": [["受限核心", "无俄语支持"], ["受限功能", "Siri 新特性 / ChatGPT 集成 / Writing Tools"], ["另受限", "Genmoji / Image Playground / Visual Intelligence / Clean Up / Live Translation"], ["传统限制", "Apple 服务无法支付、无 5G"], ["渠道含义", "功能可用性成为决策变量"]], "sourceFull": "https://www.retail.ru/news/ii-vozmozhnosti-iphone-18-pro-max-ostalis-nedostupny-rossiyskim-vladeltsam-18-sentyabrya-2026-282277/"}, {"num": 27, "title": "中国 CXMT 将进入 NAND 闪存生产，存储供给格局或再变", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant) 引 Reuters", "time": "09-18 13:55", "summary": "据 Reuters，中国长鑫存储（CXMT）将进入 NAND 闪存生产领域。若落地，全球存储芯片供给将再增中国产能，改变目前由少数厂商主导的 NAND 价格周期。对俄市场的意义在于：存储颗粒与成品（SSD、U 盘、内存卡、手机/电脑整机）的采购成本与供给稳定性将受其产能释放节奏影响，配件与数码类卖家的备货与定价窗口值得跟踪；具体投产时间与规模尚未披露。", "table": [["主体", "长鑫存储（CXMT）"], ["方向", "进入 NAND 闪存生产"], ["信源", "Reuters（经 Kommersant）"], ["影响面", "存储颗粒与整机成本"], ["时点/规模", "未披露"]], "sourceFull": "https://www.kommersant.ru/doc/8969694"}, {"num": 28, "title": "8 月二手乘用车销量 -8.4% 至 51.82 万辆，连续第二个月下滑", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-18 07:01", "summary": "8 月俄罗斯二手乘用车市场销量 518,200 辆，同比下降 8.4%，为连续第二个月下滑。品牌层面 Lada 仍居首位但销量下降 17.7%；当月仅 Volkswagen 与 Honda 实现增长。二手车是俄汽车消费的主力盘，其连续两月下滑反映居民可选消费与信贷成本的双重挤压，对汽车配件、改装、保养与相关电器的关联需求构成压力信号。", "table": [["8 月销量", "518,200 辆（-8.4% YoY）"], ["趋势", "连续第 2 个月下滑"], ["Lada", "居首但 -17.7%"], ["正增长品牌", "Volkswagen、Honda"], ["含义", "可选消费与信贷承压"]], "sourceFull": "https://www.kommersant.ru/doc/8957498"}, {"num": 29, "title": "«Авито Авто»：夏季新电动车与混动车需求同比 +19.7%", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-18 17:15", "summary": "«Авито Авто» 统计，2026 年夏季俄罗斯市场对新电动车与混合动力车的需求同比上升 19.7%，混动仍是替代动力车型中最受欢迎的选项之一。该数据与此前平台侧二手电动车/混动车需求同比 +74.8% 的口径共同显示：在燃料价格与局部供应压力下，非汽油动力需求持续走强。对车用电子、充电配件与车内电器类卖家是明确的需求方向。", "table": [["需求变化", "+19.7%（同比，新车）"], ["热门类别", "混合动力"], ["对照口径", "二手电动车/混动 +74.8%"], ["驱动", "燃料价格与供应压力"]], "sourceFull": "https://www.retail.ru/news/avito-avto-letom-spros-na-novye-elektromobili-i-gibridy-vyros-na-19-7-18-sentyabrya-2026-282311/"}, {"num": 30, "title": "汽险联盟备件价格手册生效：平均备件价格上涨 8.2%", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "09-19 00:10", "summary": "俄罗斯汽车保险商联盟（РСА）更新的备件价格手册正式生效，平均备件价格上涨 8.2%。该手册用于车险理赔的维修成本核算，其调价会直接抬升保险公司赔付成本与维修厂结算价，并经维修端传导至车主实际支出，同时也为汽配渠道的价格与需求结构提供官方参考锚点。", "table": [["生效", "2026-09-19"], ["平均备件涨幅", "+8.2%"], ["发布方", "汽险联盟（РСА）"], ["用途", "车险理赔维修成本核算"], ["传导", "赔付成本 → 维修价 → 车主支出"]], "sourceFull": "https://tass.ru/ekonomika/28127297"}]}
