{"date": "2026-09-21", "stats": {"total": 24, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "Ozon 与 Wildberries 卖家诉讼量增至 1.5–2 倍：物流损失与回款中断成主因", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-20 17:34", "summary": "生意人报 9-20 报道，Ozon 与 Wildberries 记录的卖家起诉案件数量同比增至 1.5–2 倍，诉求集中在无人机袭击物流设施后的商品损失与平台赔付、回款流程中断两类。对卖家的实务含义：司法途径正成为索赔与保证金追索的替代通道，未获赔付或赔付口径有争议的卖家开始走诉讼；建议系统留存入库凭证、保单号与平台赔付登记编号，并按批次区分「遇袭损失」与「常规退货损失」，避免在举证时混同。", "table": [["诉讼量变化", "增至 1.5–2 倍"], ["主因", "物流损失 + 赔付/回款中断"], ["涉及平台", "Ozon、Wildberries"], ["口径", "平台侧记录的卖家诉讼案件数"]], "sourceFull": "https://www.kommersant.ru/doc/8970918"}, {"num": 2, "title": "«Ашан» 称收到临时管理人信函：对方有意维持业务不间断，门店正常运营", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-21 02:23", "summary": "俄新社 9-21 报道，「Ашан」新闻处称已收到临时管理人的信函，后者表示有兴趣保持该零售商的不间断运营，目前门店按正常模式营业。此前 9-17 普京签署总统令，将 Auchan、Nestlé、Лемана Про（原 Leroy Merlin）与 FM Logistic 等在俄外资资产移交临时管理，法方已与被接管企业保持接触。对平台卖家：外资线下零售与物流方是与平台并行的替代渠道，其治理结构变化会影响后续供货、承租仓储与结算条款，需关注管理人对接窗口。", "table": [["当事方", "«Ашан»（Auchan 俄罗斯）"], ["状态", "门店正常运营"], ["管理人表态", "有意保持不间断运营"], ["关联资产", "Auchan / Nestlé / Лемана Про / FM Logistic（9-17 起临时管理）"]], "sourceFull": "https://ria.ru/20260921/ashan-2119126436.html"}, {"num": 3, "title": "零售周报（9-14~9-20）重点：Wildberries 上线「买家向卖家议价」，折扣幅度 1%–35%、由卖家自主决定", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-20 10:25", "summary": "零售网 9-20 周报（覆盖 9-14 至 9-20）披露：Wildberries 已上线「向卖家请求折扣」功能，买家可在商品卡内提出期望折扣，幅度区间 1%–35%，是否开放该功能、对哪些商品开放以及是否应允，完全由卖家决定。周报同期还记录：90% 以上消费者选择自有品牌（СТМ）、Х5 成为俄最大食品生产商、«Светофор» 与 «Ашан» 上半年营收分别下滑 4.5% 与 2.5%。对卖家的含义：议价入口把定价与促销主动权部分交回卖家，需同步设定折扣下限与毛利红线，避免被动压价。", "table": [["新增功能", "买家可请求折扣"], ["折扣区间", "1%–35%"], ["决定权", "卖家（是否开放/是否应允）"], ["СТМ 渗透率", "90% 以上消费者"], ["上半年营收", "Светофор -4.5%、Ашан -2.5%"]], "sourceFull": "https://www.retail.ru/news/daydzhest-14-09-20-09--20-sentyabrya-2026-282316/"}, {"num": 4, "title": "国家杜马选举计票推进：«Единая Россия» 57.48% 锁定宪法多数（75.31% 计票口径）", "tag": "local", "tagText": "本地", "source": "俄新社(RIA) / RBC", "time": "09-21 04:50", "summary": "俄中央选举委员会 9-21 数据：处理 75.31% 议定书时，«Единая Россия» 政党名单得票 57.48%，КПРФ 14.03%、ЛДПР 8.75%、«Новые люди» 8.01%、«Справедливая Россия» 5.01%，五个政党进入第九届国家杜马。俄新社与 RBC 均指出，按此走势 ЕР 将获得宪法多数（可单独通过修宪法案），此前仅在 2007 年与 2016 年出现过两次。对商业环境：政权机构延续性强，预计平台经济法、税收与外资资产处置等既定路线不变，Q4 政策预期趋于稳定。", "table": [["已计票", "75.31% 议定书"], ["ЕР（政党名单）", "57.48%"], ["КПРФ / ЛДПР", "14.03% / 8.75%"], ["Новые люди / СР", "8.01% / 5.01%"], ["进入杜马政党数", "5 个"], ["宪法多数先例", "2007、2016"]], "sourceFull": "https://ria.ru/20260921/vybory-2119137098.html"}, {"num": 5, "title": "出口民调与电子投票：ВЦИОМ 49.4%、ИНСОМАР 52.8%，莫斯科 ДЭГ 平台 ЕР 得 52.60%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant) / RBC", "time": "09-20 21:00", "summary": "生意人报 9-20 汇总出口民调：ВЦИОМ 口径 «Единая Россия» 49.4%，ИНСОМАР 口径 52.8%，均领先 КПРФ 与 ЛДПР；莫斯科市选举委员会通报，远程电子投票（ДЭГ）平台 ЕР 得票 52.60%。RBC 指出 ЕР 已成为宪法多数候选人，此前仅 2007、2016 两度出现。投票持续三天（9-18 至 9-20），联邦选区投票率约 44.6%，电子投票人数超 600 万创纪录。对卖家：选举周结束、政策不确定性落地，平台补贴与监管节奏预计回归常态。", "table": [["ВЦИОМ 出口民调", "ЕР 49.4%"], ["ИНСОМАР 出口民调", "ЕР 52.8%"], ["莫斯科 ДЭГ", "ЕР 52.60%"], ["投票期", "9-18 ~ 9-20（三日）"], ["电子投票人数", "超 600 万（纪录）"]], "sourceFull": "https://www.kommersant.ru/doc/8971017"}, {"num": 6, "title": "梅德韦杰夫：«Единая Россия» 将保持宪法多数，继续支持总统路线", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-21 01:46", "summary": "执政党主席、安全会议副主席梅德韦杰夫 9-21 表示，«Единая Россия» 将继续保持国家杜马宪法多数，并「继续保障对总统路线的支持」。这是在出口民调与部分计票结果公布后，执政党高层首次就新一届杜马的立法议程定调。同期他此前公开呼吁「进一步超越临时管理」、援引苏联无偿没收外资先例（9-19 报道），两者叠加意味着外资在俄资产的处置逻辑与平台经济监管路线在第九届杜马任期内预计保持一致。", "table": [["表态人", "Дмитрий Медведев（执政党主席）"], ["核心口径", "保持宪法多数 + 支持总统路线"], ["性质", "政治表态，非新立法"]], "sourceFull": "https://www.kommersant.ru/doc/8971070"}, {"num": 7, "title": "莫斯科州遭大规模无人机袭击：2 死 5 伤（含 2 名儿童），17 个区击落与压制 249 架", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-20 06:24", "summary": "莫斯科州州长沃罗比约夫通报：9-20 凌晨 03:00 至 05:00，州境遭大规模无人机袭击，防空与电子战力量在 17 个区击落与压制 249 架无人机。奥列霍沃-祖耶沃区 1 名男性死亡，索菲诺（Софьино）1 名女性死亡、另有 5 人受伤（含 2 名儿童）。莫斯科市长索比亚宁通报，向莫斯科方向另有 151 架被摧毁，并有一架无人机击中奥列霍维布利瓦尔一带建筑。对卖家：莫斯科枢纽周边仓储与干线的单夜风险集中度极高，需按「同一夜多点受损」情景做库存与订单预案。", "table": [["袭击时段", "09-20 03:00–05:00 MSK"], ["州境击落/压制", "249 架（17 个区）"], ["莫斯科方向摧毁", "151 架"], ["死亡", "2 人（奥列霍沃-祖耶沃、索菲诺）"], ["受伤", "5 人（含 2 名儿童）"]], "sourceFull": "https://ria.ru/20260920/ataka-2118847265.html"}, {"num": 8, "title": "索菲诺（Софьино）仓储综合体起火、拉缅斯科耶 21 层楼疏散 400 人；莫斯科炼油厂受损", "tag": "local", "tagText": "本地", "source": "俄新社(RIA) / 消息报(Vedomosti)", "time": "09-20 06:37", "summary": "同一夜袭击中，莫斯科州拉缅斯科耶区的索菲诺（Софьино）一处仓储综合体被击中起火（州长通报，已投入多个消防班组扑救）；拉缅斯科耶另有一栋 21 层住宅屋顶起火、400 名住户被疏散；科捷利尼基、列宁区、雷特卡里诺、科洛姆纳、叶戈里耶夫斯克、伊斯特拉等多处住宅受损，伊斯特拉一处企业被波及。莫斯科市长通报，莫斯科炼油厂（МНПЗ）厂区内一处设施受损。州长另通报全州共 20 人需要医疗救助。如实标注：索菲诺起火仓储综合体的业主身份（是否属 Ozon/Wildberries 等平台）暂未获官方或平台确认，本报告不将其计入平台仓库遇袭数据库。", "table": [["起火地点", "Софьино 仓储综合体（拉缅斯科耶区）"], ["疏散", "拉缅斯科耶 400 人（21 层楼）"], ["受损设施", "莫斯科炼油厂（МНПЗ）厂内对象"], ["医疗求助", "全州 20 人"], ["业主身份", "未获确认（未计入平台遇袭库）"]], "sourceFull": "https://ria.ru/20260920/pozhar-2118848898.html"}, {"num": 9, "title": "选举舞弊与破坏口径：10 个地区 74 栋选举委员会建筑受损，МВД 记录 56 起虚假炸弹威胁", "tag": "local", "tagText": "本地", "source": "RBC / 生意人报(Kommersant)", "time": "09-21 00:50", "summary": "俄中央选举委员会主席帕姆菲洛娃通报：选举期间 10 个地区共 74 栋地方选举委员会与投票站建筑被损坏或摧毁，她称本届竞选是「其政治生涯中最艰难的一届」。内务部第一副部长库尔诺森科通报，选举期间在 23 个地区记录到 56 起虚假炸弹威胁信息。莫斯科市检察院另称发现投票期间的违规行为并提醒不要被挑衅带动。对商业活动：选举安全议程抬升了边境州与首都圈的安保与限航成本，相关的物流时效波动在 Q4 仍可能出现。", "table": [["受损/被毁选委会建筑", "74 栋"], ["涉及地区", "10 个"], ["虚假炸弹威胁", "56 起（23 个地区）"], ["ИК 主席表态", "本届竞选最艰难"]], "sourceFull": "https://www.rbc.ru/rbcfreenews/6ab01e529a794713090cfcf4"}, {"num": 10, "title": "特朗普致电泽连斯基要求停止打击俄炼油厂，泽连斯基称将在纽约会面", "tag": "local", "tagText": "本地", "source": "Lenta.ru / RBC（引 Axios）", "time": "09-20 23:18", "summary": "Lenta 引 Axios 报道：特朗普在与泽连斯基通话中要求乌克兰停止打击俄罗斯炼油厂（НПЗ），白宫把美国柴油价格创纪录与乌克兰冲突挂钩；泽连斯基则称通话中达成在纽约会面的约定，「可能改变很多事」。对俄本土市场：若对炼厂的打击节奏下降，燃油批发紧张的边际压力缓解，干线运输与平台物流的燃油附加费上行风险相应降温；但截至本期，俄境内燃油批发与炼厂非计划检修情况仍需逐周跟踪。", "table": [["通话方", "特朗普 ↔ 泽连斯基"], ["美方要求", "停止打击俄炼油厂（НПЗ）"], ["白宫口径", "美国柴油创纪录价格与乌冲突相关"], ["后续", "拟在纽约会面（泽连斯基称）"]], "sourceFull": "https://lenta.ru/news/2026/09/21/tramp-v-razgovore-s-zelenskim-potreboval-prekratit-udary-po-rossiyskim-npz/"}, {"num": 11, "title": "Brent 开盘涨逾 1% 至 104.42 美元/桶；MOEX BR-10.26 上一交易日结算 104.35", "tag": "local", "tagText": "本地", "source": "俄新社(RIA) / 莫斯科交易所(MOEX)", "time": "09-21 01:11", "summary": "俄新社 9-21 报道，莫斯科时间 01:11 Brent 原油期货较前收盘上涨 1.19%、报 104.42 美元/桶。莫斯科交易所 BR-10.26（Brent 十月合约，BRV6）9-18 结算价 104.35 美元/桶、收盘 103.03（前一结算 103.37），当周结算区间 103.37–108.08 美元，全周在 107 美元下方震荡。如实标注：09-19/09-20 为周末，MOEX 无交易，最新 MOEX 口径为 09-18；本机无法直连 ICE 实时源，ICE 即时报价未取得，亚洲盘价格为俄媒当日引用口径。", "table": [["Brent（09-21 01:11）", "$104.42（+1.19%）"], ["MOEX BR-10.26 结算(9-18)", "$104.35"], ["MOEX 收盘(9-18)", "$103.03"], ["当周结算区间", "$103.37 – $108.08"], ["数据完整度", "周末休市；ICE 实时价未取得"]], "sourceFull": "https://ria.ru/20260921/neft-2119122809.html"}, {"num": 12, "title": "央行官方汇率（09-19 生效口径，周末未更新）：美元 84.1975 / 欧元 96.6671 / 人民币 12.5670", "tag": "local", "tagText": "本地", "source": "俄罗斯央行(ЦБ РФ)", "time": "09-21 00:00", "summary": "俄央行 09-19 生效的官方汇率为：美元 84.1975 卢布、欧元 96.6671 卢布、人民币 12.5670 卢布（前一交易日分别为 84.5093、97.4984、12.5788）。因 09-19、09-20 为周末，央行未发布新的汇率设定，本表为当前有效口径，下一次更新于 09-21 生效。卢布在选举周、油价高位与美方新制裁法签署的叠加背景下保持相对稳定，跨境结算的汇率窗口未出现新的跳变；Q4 锁汇与对账仍建议沿用本期口径。", "table": [["美元", "84.1975（前值 84.5093）"], ["欧元", "96.6671（前值 97.4984）"], ["人民币", "12.5670（前值 12.5788）"], ["状态", "沿用 09-19 生效口径"], ["下一更新", "2026-09-21 生效"]], "sourceFull": "https://www.cbr.ru/scripts/XML_daily.asp"}, {"num": 13, "title": "Минфин 与央行开始研究「俄罗斯稳定币」机制，尚无成型模型", "tag": "local", "tagText": "本地", "source": "RBC", "time": "09-21 01:02", "summary": "RBC 9-21 报道，俄财政部副部长表示，财政部与央行正在讨论俄罗斯稳定币的运行机制与允许开展的业务范围，目前尚无成型的模型，当局拟先评估对该工具的需求与相关风险。这与此前数字卢布（已上线、平台已开通支付）形成互补讨论：数字卢布属央行货币，稳定币则指向私营发行、跨境结算场景。对跨境卖家的含义：若卢布计价稳定币落地，中俄贸易结算可能新增一条不依赖美元的通道，但税收与外汇合规口径将同步重构，短期不宜据传闻调整资金安排。", "table": [["参与方", "Минфин + 央行"], ["状态", "讨论机制与允许操作"], ["成型模型", "尚未有"], ["前置条件", "先评估需求与风险"], ["对照", "数字卢布已上线（平台已开通支付）"]], "sourceFull": "https://www.rbc.ru/technology_and_media/21/09/2026/6ab00490579212d74dcb2d43"}, {"num": 14, "title": "Дом.РФ 担保的抵押贷款证券化规模创纪录：年初至今近 4,550 亿卢布", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-21 02:15", "summary": "生意人报 9-21 报道，自年初以来在 «Дом.РФ» 担保下发行的住房抵押贷款证券规模接近 4,550 亿卢布，创下该项统计历史最高。这反映在高基准利率环境下，银行通过证券化腾挪资产负债表、把长期按揭资产转为可交易工具的动机明显增强。对实体零售与耐用消费品市场：按揭与住房交易的融资通道畅通程度直接影响家装、家电与家居类目的需求节奏，是 Q4 大件销售的前瞻变量之一。", "table": [["年初至今规模", "近 4,550 亿卢布"], ["担保方", "«Дом.РФ»"], ["口径", "历史最高纪录"], ["背景", "高基准利率下的资产负债表腾挪"]], "sourceFull": "https://www.kommersant.ru/doc/8971058"}, {"num": 15, "title": "中国 1–8 月自俄进口小麦 1,760 万美元，为去年同期 7 倍", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-20 13:12", "summary": "生意人报 9-20 报道，2026 年 1–8 月中国自俄罗斯进口小麦金额达 1,760 万美元（约 17.6 百万美元），为去年同期的 7 倍。同期中国对俄农产品采购整体扩张，构成中俄贸易结构向「俄方农产品与资源、中方工业品」继续倾斜的证据之一。对跨境卖家的含义：农产品与食品类目在中俄双向通道中增长最快、物流与检验检疫通道相对成熟，可作为食品、干货与粮油类目选品与供应链布局的参考方向。", "table": [["期间", "2026 年 1–8 月"], ["进口金额", "$17.6 百万"], ["同比", "7 倍"], ["类别", "小麦（农产品）"]], "sourceFull": "https://www.kommersant.ru/doc/8970806"}, {"num": 16, "title": "霍尔木兹海峡石油与货物通行量升至半年最高", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-20 16:47", "summary": "生意人报 9-20 报道，美国中央司令部司令库珀表示，经霍尔木兹海峡运输的石油与货物量已升至近半年来最高水平。此前该通道一度接近停摆，导致法国 11% 加油站断供、美国柴油价格创历史新高。通行量回升若持续，将缓解海运运价与燃料附加费的继续上行压力；但中东局势仍未定，运费与保险成本的波动仍是 Q4 头程报价的主要不确定项。", "table": [["通道", "霍尔木兹海峡"], ["通行量", "近半年最高"], ["通报方", "CENTCOM 司令 Купер"], ["前期影响", "法国 11% 加油站断供、美国柴油创历史新高"]], "sourceFull": "https://www.kommersant.ru/doc/8970884"}, {"num": 17, "title": "沙特央行确认 2025-05 已退出 mBridge：中国主导的「去美元化」跨境结算项目遇挫", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant) / RBC", "time": "09-21 03:48", "summary": "生意人报 9-21、RBC 9-20 报道：沙特央行（SAMA）确认已于 2025 年 5 月 13 日退出由中国主导的跨境数字货币结算项目 mBridge（该项目允许各国央行直接完成跨境结算、不依赖美元）；沙特目前仍与该项目保持非公开接触。mBridge 被视作绕开美元结算的基础设施选项之一，主要参与方之一的退出会直接影响其可信度与扩容速度。对中俄贸易结算的含义：非美元通道仍以双边本币结算与数字卢布为主线，短期内不依赖 mBridge 的落地节奏。", "table": [["退出方", "沙特央行（SAMA）"], ["退出确认时间", "2025-05-13"], ["项目", "mBridge（中国主导）"], ["现状", "仍保持非公开接触"], ["影响", "非美元结算基础设施扩容受阻"]], "sourceFull": "https://www.kommersant.ru/doc/8971101"}, {"num": 18, "title": "2027 年俄罗斯将有 7 个缩短工作周，新年假期连休 11 天", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-20 11:58", "summary": "生意人报 9-20 报道，因休息日调休安排，2027 年俄罗斯人将迎来 7 个缩短工作周（工作日减少的周），新年假期将连续 11 天。对电商的含义：新年长假是俄市场全年最大消费窗口之一，2026–2027 的排班日历决定了 Q4 促销节奏与物流压力峰值——11 天连休意味着节前发货窗口更集中、节中自提点与干线运力供给下降，备货与发货日历需按此提前排定。", "table": [["缩短工作周", "7 个"], ["新年假期", "连休 11 天"], ["适用年份", "2027"], ["成因", "休息日调休"]], "sourceFull": "https://www.kommersant.ru/doc/8970776"}, {"num": 19, "title": "Unilever 将婴幼儿护理品牌 Zwitsal 出售给荷兰 Royal Sanders", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)（引 Retail Detail）", "time": "09-20 12:52", "summary": "零售网 9-20 报道，Unilever 已为婴幼儿护理品牌 Zwitsal 找到买家——荷兰个人护理公司 Royal Sanders（旗下有 Van Gils、Odorex、Melkmeisje、Sanicur、Fresh Up、ProSet 等品牌），交易预计于 2027 年初完成，金额未披露。这是 Unilever 简化品牌组合战略的延续，此前已剥离 De Vegetarische Slager、Unox、Conimex、Becel 并把冰淇淋业务（Magnum、Ben & Jerry’s）分拆。对俄市场：Zwitsal 在俄认知度有限，更值得关注的是欧洲个人护理品牌持续重组对独联体供应链与经销权归属的连带影响。如实标注：本期俄本土美妆无符合 3 日窗口的重大新增动态。", "table": [["品牌", "Zwitsal（婴幼儿护理）"], ["买方", "Royal Sanders（荷兰）"], ["预计完成", "2027 年初"], ["金额", "未披露"], ["背景", "Unilever 品牌组合简化"]], "sourceFull": "https://www.retail.ru/news/unilever-prodast-brend-sredstv-po-ukhodu-za-detmi-zwitsal-20-sentyabrya-2026-282323/"}, {"num": 20, "title": "«М.Видео» 接入 «Магнит» 自提网络：首批约 5,000 个自提点、覆盖 24 个地区", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-20 10:25", "summary": "零售网 9-20 周报披露，「М.Видео」将借助已关闭的 «Магнит Маркет» 遗留的自提网络开展线上订单交付，首批向消费者开放约 5,000 个不同规格的自提点，覆盖 24 个俄罗斯地区。这意味着家电与 3C 零售在履约端进一步向「轻资产 + 第三方网络」倾斜：在大件家电上，自提/自送模式可摊薄最后一公里成本，并对平台的重货履约时效形成直接竞争。对卖家的含义：大件品类的线下自提与安装服务网络仍是差异化壁垒，平台重货链路需对应优化。", "table": [["合作方", "«М.Видео» × «Магнит»（原 Магнит Маркет 自提网）"], ["首批自提点", "约 5,000 个"], ["覆盖", "24 个地区"], ["形态", "线上订单线下自提"], ["品类侧重", "家电与 3C 大件"]], "sourceFull": "https://www.retail.ru/news/daydzhest-14-09-20-09--20-sentyabrya-2026-282316/"}, {"num": 21, "title": "Росстандарт 将 60 余类智能家居设备纳入 ОКПД 2 分类，用于生产与进口管控", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)（引«Известия»）", "time": "09-21 02:00", "summary": "塔斯社 9-21 引《消息报》报道，俄标准局（Росстандарт）已在全俄产品经济活动分类目录（ОКПД 2）中为 60 余类智能家居设备新增代码，用于对其生产与进口实施管控。涉及范围包括智能家居软件、控制器与无线接入点、压力/燃气/漏水传感器、自闭阀门、百叶窗与窗帘等。对电器类卖家的含义：新增分类通常是技术法规、认证与统计口径调整的前置动作，智能家居与家电智能化品类的认证路径与进口申报编码后续可能同步变化，建议在 Q4 新批次报关前核对 ОКПД 2 编码与合格证明要求。", "table": [["发布方", "Росстандарт"], ["分类目录", "ОКПД 2"], ["涉及品类", "60 余类智能家居设备"], ["典型对象", "软件、控制器、无线接入点、压力/燃气/漏水传感器、自闭阀、百叶窗与窗帘"], ["目的", "管控生产与进口"]], "sourceFull": "https://tass.ru/ekonomika/28132981"}, {"num": 22, "title": "俄罗斯用户反映 App Store 访问中断", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-20 13:22", "summary": "生意人报 9-20 报道，俄罗斯用户报告 App Store 出现访问与下载中断，具体原因未获官方说明。此事与近期 iPhone 18 系列的 AI 功能对俄用户不可用（缺俄语支持）形成叠加。对 3C 卖家的含义：苹果生态在俄的可用性波动会直接影响新机激活与相关配件（充电、保护壳、智能家居配件）的连带需求，也强化了安卓生态与本土应用商店的份额优势；建议在选品与售后话术上留出替代方案。", "table": [["现象", "App Store 访问/下载中断"], ["原因", "未获官方说明"], ["叠加因素", "iPhone 18 AI 功能对俄不可用"], ["影响", "苹果生态可用性波动 → 配件连带需求"]], "sourceFull": "https://www.kommersant.ru/doc/8970807"}, {"num": 23, "title": "中国 1–8 月对俄汽车出口 68.8 万辆，供应链依赖进一步固化", "tag": "local", "tagText": "本地", "source": "Lenta.ru（引塔斯社/中国海关总署）", "time": "09-20 15:34", "summary": "Lenta 引塔斯社报道，据中国海关总署（ГТУ КНР）数据，2026 年前 8 个月中国对俄汽车出口总量超过 68.8 万辆。同期俄罗斯二手车市场承压：8 月二手乘用车销量同比下滑 8.4%。结构上，中国整车（含新能源与混动）继续填补欧美日品牌退出后的供给缺口，进口渠道与口岸物流成为俄汽车市场的关键变量，对汽配、改装与车用电子类目的连带需求构成支撑。", "table": [["期间", "2026 年 1–8 月"], ["出口量", "68.8 万辆以上"], ["数据来源", "中国海关总署"], ["对照", "8 月俄二手乘用车销量 -8.4%"]], "sourceFull": "https://lenta.ru/news/2026/09/20/kitay-zavalil-rossiyu-avtomobilyami/"}, {"num": 24, "title": "1–8 月中国对俄二手车（乘用车）出口 7.5 万辆，同比 +98%", "tag": "local", "tagText": "本地", "source": "商业日报(Vedomosti)", "time": "09-20 12:14", "summary": "商业日报（Ведомости）9-20 报道，2026 年 1–8 月自中国进口至俄罗斯的二手乘用车约 75,000 辆，较 2025 年同期的约 3.8 万辆增长 98%（接近翻倍）。二手车进口激增与新车利率高企、居民消费降级相叠加，推动俄汽车市场向「性价比 + 中国渠道」集中。对车用配件、养护与改装类目卖家：存量车龄结构年轻化、中国车型保有量上升，将逐步把配件需求结构从欧系转向中国车型专用件。", "table": [["期间", "2026 年 1–8 月"], ["二手车进口量", "约 75,000 辆"], ["同比", "+98%"], ["来源国", "中国"], ["驱动因素", "新车利率高企、消费降级"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/09/20/1230268-vosem-mesyatsev-import"}]}
