{"date": "2026-08-24", "stats": {"total": 19, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "🚨仓库被炸：Ozon 克拉斯诺达尔物流中心遭大规模无人机袭击起火停工，同波袭击残骸坠入儿童中心致2名儿童遇难", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)、塔斯社(TASS)、Lenta、国际文传(Interfax)、消息报(Izvestia)", "time": "08-24 02:36", "summary": "8/24凌晨克拉斯诺达尔边疆区遭大规模无人机袭击，Ozon物流中心被击中起火、全面停工。Ozon：安全系统正常触发、员工全部疏散无伤亡；该仓商品已下架不可下单，订单取消并退款，卖家供货暂停，物流改道其他仓库。同波袭击残骸坠入24小时私人儿童中心：2名儿童遇难、7名儿童受伤、2名成人住院。这是Ozon第4处遇袭设施（鞑靼斯坦7-31、恰帕耶夫斯克8-22、奥伦堡8-23之后），四日内第三处。普京已责成政府恢复受损物流与仓储。", "table": [["平台", "Ozon（第4处遇袭设施）"], ["仓库处置", "起火停工、商品下架、订单取消退款"], ["儿童中心伤亡", "2名儿童遇难、7名儿童受伤、2名成人住院"], ["同期", "涅文诺梅斯克工业区无人机被拦截"]], "sourceFull": "https://ria.ru/20260824/tsentr-2112713388.html"}, {"num": 2, "title": "🚨Ozon 马哈奇卡拉(达吉斯坦)物流中心凌晨遇袭起火,数人受伤", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-24 05:00", "summary": "8/24 凌晨约5点,Ozon 马哈奇卡拉物流中心遭 БПЛА 袭击起火。安全系统正常触发,员工紧急疏散,数人受伤(无生命危险);仓库停工,商品下架,无法调配的订单取消,物流路线重新分配。这是 Ozon 第5处遇袭设施、8/24 当日第二处。", "table": [["被袭时间", "8/24 凌晨约5点"], ["人员伤亡", "数人受伤(无生命危险)"], ["仓库状态", "停工,商品下架,订单取消"], ["Ozon 遇袭设施数", "第5处"]], "sourceFull": "https://ria.ru/20260824/sklady-2112720568.html"}, {"num": 3, "title": "Ozon 阿迪格仓库夜间遇袭起火;Ozon 股价暴跌", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)、Lenta", "time": "08-24", "summary": "8/24 夜间阿迪格共和国塔赫塔穆凯区遭无人机袭击,Ozon 仓库起火——Ozon 遇袭设施达第6处。同日 Lenta 头条:Ozon 股价暴跌。四日内 Ozon 连续4处仓储设施遇袭,电商平台物流设施遇袭已从 WB 单一目标扩散为全行业系统性风险。", "table": [["Ozon 遇袭设施总数", "6 处"], ["四日内遇袭", "4 处(8-22~8-24)"], ["股价", "暴跌(Lenta头条)"]], "sourceFull": "https://ria.ru/20260824/ozon-2112723231.html"}, {"num": 4, "title": "俄财政部出台受损商家支持措施:损失超年收入5%即可申请", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-24", "summary": "俄财政部8/24公布支持措施:因无人机袭击受损的法人及个体户,损失超过年收入5%即可申请支持(含税收缓缴等)。WB创始人巴卡尔丘克评论:税收缓缴将帮助卖家适应新环境。支持政策从央行呼吁→地方专项→财政部全国措施,救助体系升级。", "table": [["申请门槛", "损失超年收入5%"], ["支持对象", "法人及个体户"], ["措施类型", "税收缓缴等"]], "sourceFull": "https://ria.ru/20260824/minfin-2112731458.html"}, {"num": 5, "title": "圣彼得堡普希金区仓库大火受控：过火面积从8.2万㎡降至6000㎡，火灾等级下调至1级", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)、塔斯社(TASS)", "time": "08-24 02:46", "summary": "圣彼得堡市紧急情况总局：8/24 02:03（莫斯科时间）火灾等级降至1级，燃烧面积6000㎡（前一日峰值8.2万㎡），火势已局部化。该仓库归属方至今未披露，是否涉电商平台仓储仍待核实，持续跟踪。", "table": [["过火面积", "8.2万㎡ → 6000㎡"], ["火灾等级", "降至1级（已局部化）"], ["仓库归属", "未披露，待核实"]], "sourceFull": "https://ria.ru/20260824/ploschad-2112713547.html"}, {"num": 6, "title": "俄线上食品杂货销售2026年Q2首次环比下滑2.5%，市场进入饱和期", "tag": "local", "tagText": "本地", "source": "Lenta 引 URA.RU / Infoline", "time": "08-23 12:54", "summary": "Infoline数据：2026年Q2俄在线食品销售环比-2.5%，为该板块首次下滑（此前持续不间断增长）。专家归因：低基数效应消退、市场趋于饱和、夏季假期季节因素；预计全年仍保持正增长。对Ozon/WB生鲜日百及即时零售板块增速预期有参考价值。", "table": [["Q2环比", "-2.5%（首次下滑）"], ["全年预期", "仍正增长"]], "sourceFull": "https://lenta.ru/news/2026/08/23/rossiyanam-nadoelo-zakazyvat-dostavku-produktov-v-onlayn-servisah/"}, {"num": 7, "title": "无人机威胁致俄南部至少7座机场轮番临时关闭：萨拉托夫一夜三次", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)、塔斯社(TASS)、国际文传(Interfax)", "time": "08-24 04:23", "summary": "8/23-24夜间，萨拉托夫（一夜三次限制）、奔萨、喀山、下卡姆斯克、伏尔加格勒、索契、克拉斯诺达尔机场相继临时限制起降，多数数小时后恢复。民航扰动与无人机袭击同步高发，对电商空运时效与区域物流构成持续扰动。", "table": [["涉及机场", "萨拉托夫/奔萨/喀山/下卡姆斯克/伏尔加格勒/索契/克拉斯诺达尔"], ["状态", "多数数小时后恢复"]], "sourceFull": "https://ria.ru/20260824/ogranicheniya-2112715751.html"}, {"num": 8, "title": "乌沙科夫：若普京与特朗普均出席11月中国APEC峰会，两人“不可避免地”会面", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-23 11:48", "summary": "总统国际事务助理乌沙科夫接受扎鲁宾采访：距APEC峰会尚早、美方未释放任何信号；但若两位领导人同场出席，“他们不可避免地会见面并交谈”。乌沙科夫同时表示对美“静默外交”一直在进行。", "table": [], "sourceFull": "https://lenta.ru/news/2026/08/23/stalo-izvestno-o-vozmozhnoy-vstreche-putina-i-trampa-v-noyabre/"}, {"num": 9, "title": "土耳其政府消息人士：预计乌克兰谈判年底前恢复，安卡拉愿继续支持外交努力", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-24 04:18", "summary": "RIA引土耳其政府消息人士：安卡拉预计乌克兰谈判进程年底前恢复，暂无具体时间表；土方愿继续支持外交斡旋。背景：梅金斯基8-19称“时间会证明”伊斯坦布尔谈判是否重启；普京8-22称愿在“地面现实”基础上对话。2025年土耳其主办三轮谈判，2026年冬接触转至阿布扎比、日内瓦。", "table": [["历史谈判", "2025年伊斯坦布尔3轮；2026年冬阿布扎比/日内瓦"]], "sourceFull": "https://ria.ru/20260824/turtsiya-2112715606.html"}, {"num": 10, "title": "哈萨克斯坦一院制议会选举投票率74.19%，“阿德勒特”党领先", "tag": "local", "tagText": "本地", "source": "国际文传(Interfax)、消息报(Izvestia)", "time": "08-23 18:41", "summary": "哈萨克斯坦8-23举行一院制议会（库鲁尔台）选举，投票率74.19%，五个政党进入议会，“阿德勒特”党领先。哈国是俄企仓配外迁目的地之一（WB已在哈寻仓10万㎡），选举结果关乎中亚布局的政商环境变量。", "table": [["投票率", "74.19%"], ["进入议会政党数", "5个"]], "sourceFull": "https://iz.ru/2153800/2026-08-24/v-kazakhstane-partiia-adilet-vyshla-v-lidery-na-parlamentskikh-vyborakh"}, {"num": 11, "title": "普京首次公开谈燃料危机：“确有不便”，政府已设专门委员会管控", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-23 14:17", "summary": "普京接受扎鲁宾采访：民众“确有某些不便”，政府必须将燃料局势置于管控之下；提及8-21与总理米舒斯京会面、政府已成立燃料行业形势专门委员会。此前诺瓦克表态：低标汽油（欧2-4）占比将很小、以进口平衡缺口。总统级表态确认燃料问题已进入最高层议程。", "table": [["政府动作", "已成立燃料行业专门委员会"], ["诺瓦克口径", "低标燃料占比<10%，进口平衡"]], "sourceFull": "https://lenta.ru/news/2026/08/23/putin-vyskazalsya-o-situatsii-s-toplivom-v-strane/"}, {"num": 12, "title": "首艘土耳其汽油油轮8月底前抵俄（20万桶），7月底以来海运进口汽油超100万桶", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant) 引 S&P Global / Kpler", "time": "08-23 16:40", "summary": "S&P Global CAS：油轮Wendrix（MR级，载约20万桶）自土耳其梅尔辛港驶往波罗的海港口，为首批土耳其来源进口汽油；7月底以来俄已接收3艘自印度瓦迪纳尔终端（埃及近海船对船过驳）+1艘摩洛哥来源油轮，累计海运进口超100万桶。诺瓦克：目前仅汽油供应紧张，柴油、煤油充足。", "table": [["土耳其首批", "20万桶，8月底前到港"], ["7月底以来累计", "超100万桶"], ["此前来源", "印度瓦迪纳尔3艘+摩洛哥1艘"]], "sourceFull": "https://www.kommersant.ru/doc/8906496"}, {"num": 13, "title": "小出口商外汇收入占比升至23.2%，卢布结算份额降至76.8%（2022年下半年以来最低）", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant) 引 Точка银行", "time": "08-24 03:23", "summary": "Точка银行数据：2026上半年微型/小型出口企业境外入账中卢布占76.8%（同比-4.5个百分点，2022H2以来最低），外币占23.2%；欧亚经济联盟/独联体方向卢布结算已成标准，区外买家更多使用人民币、迪拉姆、坚戈；部分俄出口商因需境外采购原料设备而更愿收人民币。对跨境收款路径选择有参考价值。", "table": [["卢布结算", "76.8%（-4.5pct）"], ["外币结算", "23.2%"], ["区外主要币种", "人民币/迪拉姆/坚戈"]], "sourceFull": "https://www.kommersant.ru/doc/8906498"}, {"num": 14, "title": "美军中央司令部：伊朗海上封锁重启以来已驱离70艘商船、瘫痪3艘", "tag": "local", "tagText": "本地", "source": "国际文传(Interfax)", "time": "08-24 04:38", "summary": "CENTCOM通报：截至8/23已驱离70艘商船、瘫痪3艘、登检2艘；美海军7/14重启对伊朗港口的海上封锁（此前4/13-6/18曾实施，两月内驱离142艘、瘫痪9艘）。伊朗威胁封锁波斯湾石油出口回应。海湾航运风险溢价上行，需关注对俄油价格与能源收入的传导。", "table": [["本轮封锁", "驱离70艘、瘫痪3艘（截至8-23）"], ["上轮(4-13~6-18)", "驱离142艘、瘫痪9艘"]], "sourceFull": "https://www.interfax.ru/world/1110862"}, {"num": 15, "title": "NYT：全球粮食体系三大支柱同时失灵，小麦价格面临大涨", "tag": "local", "tagText": "本地", "source": "俄新社(RIA) 引 NYT / FAO", "time": "08-24 03:45", "summary": "NYT引专家：全球粮食体系三大支柱——畅通贸易、廉价能源、稳定气候——当前均不成立；热浪干旱致美国等主要小麦生产国产量下滑；黑海处战区、红海胡塞袭击迫使粮船绕行非洲，厄尔尼诺威胁巴拿马运河、莱茵河多瑙河水位告急推高运输成本。FAO：多重不确定性正相互放大。对俄食品通胀与出口收入均是双向变量。", "table": [["三大支柱", "贸易/能源/气候均失灵"], ["风险传导", "小麦价格、航运成本上行"]], "sourceFull": "https://ria.ru/20260824/prodovolstvie-2112714888.html"}, {"num": 16, "title": "经发部拟放宽经济特区(ОЭЗ)评估：剔除企业营收指标、免除地区返还联邦基建资金责任", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-24 02:55", "summary": "经发部提交政府决议草案：ОЭЗ年度评估剔除“入驻企业营收”（无统一核算方法）与“对国家目标贡献”（指标过时），改为居民经营效率、预算投入回报率、管理机构效率三大核心指标；并免除效率不足地区返还联邦基建投入的财务责任。2025年度共53个特区参评。", "table": [["新评估框架", "居民效率/预算回报/管理效率"], ["2025年参评", "53个特区"]], "sourceFull": "https://www.kommersant.ru/doc/8906538"}, {"num": 17, "title": "美妆零售自有App订单频次同比+50%，金苹果客单价+36%；品牌因平台佣金与风险撤离市场平台", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant) 引 MTS AdTech", "time": "08-23 15:27", "summary": "MTS AdTech：2026年1-7月美妆零售App用户下单频次同比+50%（活跃用户仅+4%）；用户增长前三：金苹果+13%、彩虹微笑与女友各+11%；客单价：金苹果+36%、Л'Этуаль+20%、Рив гош+5%。金苹果线上占比2024年50%→2025年超60%。驱动因素：市场平台佣金上升与风险加大，厂商转向零售商自有线上渠道；隐忧：美妆行业企业注销数量同比增1.5倍。", "table": [["下单频次", "同比+50%"], ["活跃用户", "仅+4%"], ["客单价", "金苹果+36%/Л'Этуаль+20%/Рив гош+5%"], ["行业注销", "同比+1.5倍"]], "sourceFull": "https://www.kommersant.ru/doc/8906427"}, {"num": 18, "title": "印刷电路板厂商联盟致函工贸部：制裁物流致原料断供，强制本土化或使材料成本涨2-8倍", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-24 03:18", "summary": "АНО“印刷电路板联盟”（Yadro、GS Group、Резонит、Технотех）8-19致函ВНИИР及工贸部：制裁导致原料物流受阻，已出现断供与违约案例；若按719号决议强制使用俄产材料，材料成本将上涨2-8倍，Q4旺季生产或延误。建议过渡期以“额外本土化加分”替代强制，待每类关键材料有3-5家供应商后再强制。俄电子制造本土化瓶颈显性化，对电器/消费电子供给成本构成上行压力。", "table": [["成本风险", "材料成本或涨2-8倍"], ["涉及企业", "Yadro/GS Group/Резонит/Технотех"], ["诉求", "过渡期加分制替代强制"]], "sourceFull": "https://www.kommersant.ru/doc/8906437"}, {"num": 19, "title": "КАСКО车险均价Q2达6.38万卢布，同比+26%；部分车型涨幅15-35%", "tag": "local", "tagText": "本地", "source": "消息报(Izvestia) 引 Банки.ру", "time": "08-24 00:20", "summary": "Банки.ру测算：2026年Q2 КАСКО保单均价达6.38万卢布，同比+26%；Ингосстрах证实部分车型保费涨幅15-35%。车险成本上升叠加车价高位，进一步抬高拥车总成本，影响新车/二手车消费决策与汽车后市场结构。", "table": [["Q2均价", "6.38万卢布"], ["同比", "+26%"], ["部分车型", "+15%~35%"]], "sourceFull": "https://iz.ru/2153796/2026-08-24/sredniaia-tcena-kasko-uvelichilas-na-chetvert-za-god"}]}
