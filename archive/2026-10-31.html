{"date": "2026-10-31", "stats": {"total": 15, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "cat": "platform", "catText": "平台规则变动", "title": "11月1日起俄食用植物油追溯转「按件核算」，Честный знак 进入收尾阶段", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-30 15:37", "summary": "俄「诚信标识」体系对食用植物油进入最后阶段：自11月1日起实行按件核算，交接单据与ГИС МТ中须登记每一瓶的唯一码，实现从生产商/进口商到收银台的全链单件追溯；收银扫码后编码自动从「Честный знак」出库。ЦРПТ提示零售端可能需升级软件。本品类不涉及我方SKU，但同一套追溯基建正在向化妆品、家电等品类延伸。", "table": [["⏱ 生效时间", "2026-11-01"], ["🎯 实际影响", "合规风险：已标识商品的出入库与退货单据要求更严，未按件登记将导致收银拒付或异常码；间接影响：Честный знак 品类扩容加快，化妆品（mosai/莫赛）与部分家电是下一批候选，贴码成本与产线改造成本需提前评估"], ["✅ 建议动作", "合规负责人11月5日前确认在售SKU均不在11-01扩容清单内，向1С/ERP服务商索取按件核算升级包，并把按件追溯列入12月化妆品与家电合规预研"]], "sourceFull": "https://www.retail.ru/news/s-1-noyabrya-markirovka-rastitelnykh-masel-pereydet-na-poekzemplyarnyy-uchet-30-oktyabrya-2026-283904/"}, {"num": 2, "cat": "ecom", "catText": "电商动态", "title": "Ozon：俄罗斯人麂皮/皮革服饰需求爆发，麂皮外套销量同比增2,7倍", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-30 21:42", "summary": "Ozon Селект 对2026年前9个月时尚品类的分析显示，皮革与麂皮成为本季美学主轴（бохо风格：宽松廓形、自然色系、纹理细节）。女装麂皮外套销量同比增2,7倍，麂皮飞行夹克增2,3倍，麂皮与皮革报童帽增1,4倍。对以服饰配件为补充品类的卖家，四季度冬装与帽饰的麂皮款可加单，但Ozon Селект流量正明显向品牌化商品集中。", "table": [["品类", "同比"], ["麂皮外套", "×3,7"], ["麂皮飞行夹克", "×3,3"], ["麂皮/皮革报童帽", "×2,4"], ["统计口径", "2026年1-9月"]], "sourceFull": "https://www.retail.ru/news/ozon-rossiyane-stali-chashche-pokupat-odezhdu-iz-zamshi-i-kozhi-30-oktyabrya-2026-283923/"}, {"num": 3, "cat": "ecom", "catText": "电商动态", "title": "Яндекс：三季度通过「Алиса AI」接单的卖家数量增51%，YCP接入方近9千家", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-30 12:29", "summary": "Яндекс 2026年三季度数据：接入开放商务协议YCP的合作方接近9千家；接入后通过「搜索+Алиса AI对话」获得订单的卖家数环比增51%；用Яндекс KIT（含物流的一站式建站）开店并产生销售的商家数环比增57,6%；Маркет活跃卖家环比增4%，公司称当前重点是提升服务品质与实现盈亏平衡。AI对话入口正成为独立于站内搜索的新流量通道。", "table": [["指标", "Q3环比"], ["YCP接入伙伴", "≈9千家"], ["Алиса AI接单卖家", "+51%"], ["KIT建店商家", "+57,6%"], ["Маркет活跃卖家", "+4%"]], "sourceFull": "https://www.retail.ru/news/yandeks-chislo-prodavtsov-poluchayushchikh-zakazy-cherez-alisu-ai-vyroslo-v-1-5--30-oktyabrya-2026-283891/"}, {"num": 4, "cat": "ecom", "catText": "电商动态", "title": "«Магнит Доставка»九个月订单增1,7倍，自有App订单翻倍", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-30 11:25", "summary": "Магнит Доставка 三季度订单同比增超1,5倍，其中经自有App的订单增77,6%；1-9月总订单增近1,7倍、App订单增1倍。三季度线上GMV增62,6%，九个月增68,1%，即时配送平均时长继续压缩。俄即时零售高速扩张，商超自营App把高频刚需流量留在自有池内，第三方平台上的日化、纸品、小家电等标品将持续被分流。", "table": [["指标", "Q3", "9个月"], ["订单量", "+1,5倍以上", "≈×1,7"], ["自有App订单", "+77,6%", "×2"], ["线上GMV", "+62,6%", "+68,1%"]], "sourceFull": "https://www.retail.ru/news/za-9-mesyatsev-magnit-dostavka-udvoila-kolichestvo-zakazov-cherez-sobstvennoe-pr-30-oktyabrya-2026-283884/"}, {"num": 5, "cat": "ecom", "catText": "电商动态", "title": "«Почта России»九个月营收1660亿卢布，经营利润120亿卢布", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "10-30 17:57", "summary": "俄罗斯邮政按俄会计准则披露，2026年1-9月营收1660亿卢布，经营利润120亿卢布。邮政是跨境包裹与偏远地区「最后一公里」的主通道，财务改善有利于网点与分拣投入的持续性，但同时意味着资费与服务条款存在上调可能。对发往中小城市与非覆盖区的补货，仍需保留CDEK/Boxberry等商业快递的并行方案。", "table": [["指标", "1-9月"], ["营收", "1660亿₽"], ["经营利润", "120亿₽"], ["口径", "РСБУ（未合并）"]], "sourceFull": "https://www.kommersant.ru/doc/9077763"}, {"num": 6, "cat": "beauty", "catText": "美妆个护", "title": "Faberlic强化生产/物流/销售系统抗网络攻击，设300万卢布漏洞赏金", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-30 10:00", "summary": "俄化妆品与家化制造商Faberlic完成网络安全改造，并成为FMCG行业首批开展「漏洞赏金」测试的企业之一：若白帽研究者能证明可造成重大业务损害，由Positive Technologies支付300万卢布奖金，其信息安全伙伴为「Эксперт ИТ」。据Positive Technologies，2025年针对俄零售企业的成功网络攻击同比增60%，冲击面覆盖生产、物流、销售与结算环节。", "table": [["项目", "数据"], ["赏金规模", "300万₽"], ["支付方", "Positive Technologies"], ["2025零售业成功攻击", "+60%"], ["冲击环节", "生产/物流/销售/结算"]], "sourceFull": "https://www.retail.ru/news/faberlic-usilila-zashchitu-proizvodstva-logistiki-i-prodazh-ot-kiberatak-30-oktyabrya-2026-283874/"}, {"num": 7, "cat": "appliance", "catText": "家电电器", "title": "«М.Видео»：10月两周HDD/SSD销售额增41,5%，销量反降31,2%", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-30 21:11", "summary": "据ICMR（原ГФК-Русь）数据，2026年第41-42周HDD/SSD、存储卡、U盘三类合计销售27,3亿卢布（+32,5%），销量60万台（-37,4%）；其中HDD/SSD 22,7亿卢布（+41,5%）、销量19,2万台（-31,2%）；存储卡3,27亿（+35,7%）；U盘1,27亿（-39,8%）。金额涨、件数跌，说明存储涨价已完整传导到终端，低价小容量规格被挤出市场。", "table": [["品类", "金额", "同比", "销量"], ["HDD/SSD", "22,7亿₽", "+41,5%", "19,2万台(-31,2%)"], ["存储卡", "3,27亿₽", "+35,7%", "25万台(-15,5%)"], ["U盘", "1,27亿₽", "-39,8%", "15,8万台(-58,9%)"], ["三类合计", "27,3亿₽", "+32,5%", "60万台(-37,4%)"]], "sourceFull": "https://www.retail.ru/news/m-video-prodazhi-hdd-i-ssd-vyrosli-na-41-5-v-denezhnom-vyrazhenii-za-dve-nedeli--30-oktyabrya-2026-283922/"}, {"num": 8, "cat": "appliance", "catText": "家电电器", "title": "符拉迪沃斯托克前马自达发动机厂投产智能电视，一期年产60万台", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-30 12:17", "summary": "«Альтер инвест»在符拉迪沃斯托克原马自达发动机厂区（运营主体ООО «Санрайз электроникс»）启动Smart TV生产，一期规划年产60万台、后续拟提至120万台，产线可覆盖最大120英寸机型，已建成整机装配、质检与检测实验室；采用代工模式为俄本土品牌与分销商供货，DNS为锚定客户。本土整机产能扩张将逐步压缩进口电视份额。", "table": [["项目", "数据"], ["一期产能", "60万台/年"], ["规划产能", "120万台/年"], ["最大尺寸", "120英寸"], ["锚定客户", "DNS"], ["模式", "合同代工"]], "sourceFull": "https://www.retail.ru/news/na-byvshem-zavode-mazda-vo-vladivostoke-zarabotalo-proizvodstvo-televizorov-30-oktyabrya-2026-283890/"}, {"num": 9, "cat": "econ", "catText": "经济金融", "title": "10月31日俄央行汇率：美元80,5573、欧元89,6603、人民币12,0873；MOEX指数2509,26", "tag": "local", "tagText": "本地", "source": "ЦБ РФ", "time": "10-31 08:00", "summary": "俄央行10月31日官方汇率：美元80,5573卢布（较10-30的80,6761续降0,15%）、欧元89,6603、人民币12,0873；莫斯科交易所10-30收盘IMOEX指数2509,26点。卢布在油价高位与预算压力之间震荡，人民币结算成本小幅回落，对以人民币采购、卢布回款的补货节奏略有利；但2027年22%跨境网购增值税落地后，跨境直发的税负差将被抹平。", "table": [["币种", "官方汇率(₽)"], ["美元", "80,5573"], ["欧元", "89,6603"], ["人民币", "12,0873"], ["IMOEX", "2 509,26"]], "sourceFull": "https://www.cbr.ru/scripts/XML_daily.asp?date_req=31.10.2026"}, {"num": 10, "cat": "econ", "catText": "经济金融", "title": "«Лента»三季度营收增34,3%至3593亿卢布，毛利率降73个基点", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-30 11:53", "summary": "Группа «Лента» 2026年三季度营收同比增34,3%至3593亿卢布，零售销售3561亿（+34,5%）；销售面积增38,1%至397,6万㎡，主要来自便利店新开与并购「О'кей」「Реми」「Оби Россия」（已更名「Дом Лента」）；毛利率降73个基点至22,2%，销售管理费用率升98个基点至17,4%。1-9月营收1,0078万亿卢布（+29%）。", "table": [["指标", "Q3", "9个月"], ["营收", "3593亿₽ (+34,3%)", "1,0078万亿₽ (+29%)"], ["零售销售", "3561亿₽ (+34,5%)", "9998亿₽ (+29,2%)"], ["毛利率", "22,2% (-73bp)", "22,3% (-41bp)"]], "sourceFull": "https://www.retail.ru/news/gruppa-lenta-obyavila-o-roste-vyruchki-na-34-3-v-iii-kvartale-2026-goda-30-oktyabrya-2026-283886/"}, {"num": 11, "cat": "econ", "catText": "经济金融", "title": "俄财政部拟扩大数字卢布使用范围，明确可作跨境结算工具", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-30 09:11", "summary": "财长西卢安诺夫在杜马全会表示，财政部支持更广泛地在居民支付与预算流程中使用数字卢布，并称数字卢布可用于跨境结算、便于与贸易伙伴国央行直接对接，同时强调不会取代现金与非现金卢布。对以第三国主体收款的中国卖家，这意味着未来可能出现「数字卢布—伙伴国央行数字货币」的直接结算路径，绕开部分中间行合规摩擦。", "table": [["要点", "内容"], ["表态人", "财长西卢安诺夫"], ["场合", "杜马全会"], ["方向", "居民支付/预算/跨境结算"], ["现有卢布渠道", "维持不变"]], "sourceFull": "https://www.retail.ru/news/minfin-planiruet-rasshirit-ispolzovanie-tsifrovogo-rublya-v-raschetakh-30-oktyabrya-2026-283872/"}, {"num": 12, "cat": "politics", "catText": "时政要闻", "title": "波兰宪政危机升级：总统强闯宪法法庭、两名大使辞职", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "10-31 03:57", "summary": "波兰总统纳夫罗茨基在人群冲突中进入宪法法庭，警方进入法庭区域，华沙出现大规模抗议；波驻罗马尼亚大使索洛赫与驻华大使库莫赫以「非法夺取宪法法庭」为由辞职；美国驻波大使称局势「具有爆炸性」，欧盟委员会拒绝置评。总理图斯克称「别无选择」，法律与公正党方面称这是「政变的关键阶段」。", "table": [["事件", "时间(MSK)"], ["总统进入宪法法庭", "10-31 03:37"], ["两名使节辞职", "10-31 03:42"], ["美方表态", "「具有爆炸性」"], ["欧盟委员会", "拒绝置评"]], "sourceFull": "https://ria.ru/20261031/polsha-2128259159.html"}, {"num": 13, "cat": "politics", "catText": "时政要闻", "title": "拉夫罗夫在G20与鲁比奥非正式接触，称泽连斯基须赴莫斯科", "tag": "local", "tagText": "本地", "source": "Интерфакс", "time": "10-31 02:59", "summary": "俄外长拉夫罗夫在亚特兰大G20外长会期间与美国务卿鲁比奥在招待会上非正式交谈，并与沙特、日本外长分别会谈；因拉夫罗夫出席，G20外长会取消了集体合影。拉夫罗夫称，若泽连斯基想见普京须到莫斯科，欧洲不具备担任担保方的能力，并称安克雷奇共识未落实的责任在乌方。阿布扎比会谈前，俄美在程序与担保方问题上仍存分歧。", "table": [["要点", "内容"], ["俄美接触", "非正式（G20招待会）"], ["集体合影", "取消"], ["泽连斯基条件", "赴莫斯科"], ["俄方立场", "欧洲不能作担保"], ["下一轮", "阿布扎比"]], "sourceFull": "https://www.interfax.ru/russia/1126229"}, {"num": 14, "cat": "politics", "catText": "时政要闻", "title": "美国务院批准向乌克兰出售500枚「爱国者」导弹", "tag": "local", "tagText": "本地", "source": "Интерфакс", "time": "10-30 22:17", "summary": "美国国务院批准向乌克兰出售500枚用于Patriot防空系统的导弹，金额与交付时间待核实。这是美方在阿布扎比会谈前的又一次防空加码，冲突周期被拉长的概率上升，黑海与俄南部边境的物流风险溢价将维持高位。经俄南部口岸与黑海替代线路的运输方案仍需保留冗余与保险覆盖。", "table": [["项目", "内容"], ["数量", "500枚"], ["系统", "Patriot"], ["批准机构", "美国务院"], ["交付时间", "待核实"]], "sourceFull": "https://www.interfax.ru/world/1126243"}, {"num": 15, "cat": "politics", "catText": "时政要闻", "title": "加里宁格勒ТЭЦ-2部分设备跳机，市区局部停电", "tag": "local", "tagText": "本地", "source": "Интерфакс", "time": "10-31 04:55", "summary": "加里宁格勒ТЭЦ-2因自动保护动作导致部分设备停运，市区出现局部停电，紧急部门与电厂正在恢复供电，具体原因待核实。该州为飞地，电力与物流高度依赖本地设施，若停电时间延长，将直接影响当地仓配中心作业与末端配送时效；本期未见对电商仓库的波及通报。", "table": [["项目", "内容"], ["设施", "ТЭЦ-2（加里宁格勒）"], ["原因", "自动保护动作（待核实）"], ["影响", "市区局部停电"], ["电商仓库波及", "未见通报"]], "sourceFull": "https://www.interfax.ru/russia/1126249"}]}
