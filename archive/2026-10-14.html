{"date": "2026-10-14", "stats": {"total": 22, "local_pct": "95%", "cn_pct": "0%", "en_pct": "5%"}, "items": [{"num": 1, "cat": "platform", "catText": "平台规则变动", "title": "Ozon 未经卖家确认自动开通付费服务「首批评价征集」（Сбор первых отзывов）", "tag": "local", "tagText": "本地", "source": "Oborot.ru", "time": "10-13 12:00", "summary": "Ozon 于 2026-07-15 上线的付费服务「首批评价征集」（Сбор первых отзывов）正被平台批量自动开通：Ozon 事先公告将自行把商品加入该服务，卖家仅有一周窗口可关闭，逾期未关即视为同意。近期多名卖家在结算报表中发现按条扣费（有卖家被扣 3000 ₽/条的短视频评价费×3 条），平台以「服务已确认开通」为由拒绝退款，即便买家已退货、或视频评价拍摄的是其他商家的商品。", "table": [["⏱ 生效时间", "服务 2026-07-15 上线；2026-10 起批量自动开通（据 10-13 报道，具体批次待核实）"], ["🎯 实际影响", "成本/结算环节：未主动关闭的 SKU 会被持续按条扣费，直接侵蚀 unit-economics；新品缺评价的灯具、美妆、小家电类目敞口最大"], ["✅ 建议动作", "运营 10-16 前在后台逐类目核查该服务开关并按需关闭，调取 8–10 月扣费明细，对误扣款项集中发起申诉"]], "sourceFull": "https://oborot.ru/news/sellery-zhaluyutsya-chto-ozon-bez-ih-vedoma-vklyuchaet-tovary-v-sbor-pervyh-otzyvov-chto-delat-prodavcu-v-etoj-situacii-i281339.html"}, {"num": 2, "cat": "ecom", "catText": "电商动态", "title": "Ozon 白俄罗斯物流能力翻倍：Болбасово 与明斯克新仓投用", "tag": "local", "tagText": "本地", "source": "Oborot.ru", "time": "10-12 12:00", "summary": "Oborot.ru 10-12 报道，Ozon 在白俄罗斯把物流能力扩大一倍：位于 Болбасово 的新物流中心（约 2.6 万㎡）与明斯克新增仓配设施先后投用，形成覆盖白俄的次日达网络。此前 Ozon 已在哈萨克斯坦（阿拉木图、阿斯塔纳）开放免费入仓。含义：平台正把履约网络向俄境外（白俄/哈萨克斯坦）延伸，跨境卖家可借此把部分库存前置到关税同盟内的近岸仓，缩短到货时效并分散俄境内单点风险，但需同步核算白俄/哈国段的清关与增值税口径。", "table": [["新增设施", "Болбасово 物流中心（约 2.6 万㎡）+ 明斯克仓配"], ["效果", "白俄物流能力 ×2"], ["同类动作", "Ozon 哈萨克斯坦（阿拉木图/阿斯塔纳）开放免费入仓"]], "sourceFull": "https://oborot.ru/news/novye-sklady-na-vezde-v-belarus-i-v-minske-ozon-udvoil-logisticheskie-moshhnosti-v-sosednej-strane-i281301.html"}, {"num": 3, "cat": "ecom", "catText": "电商动态", "title": "家电零售商 «Holodilnik.ru» 上线自营 marketplace：佣金 22–30%", "tag": "local", "tagText": "本地", "source": "Oborot.ru", "time": "10-12 12:00", "summary": "Oborot.ru 10-12 报道，家电零售商 «Holodilnik.ru» 上线自营 marketplace，向第三方卖家开放：佣金 22–30%，提现费 2%、获客费 5%；履约先开 FBO，10 月上线 DBS、11 月上线 FBS（其线上销售占比已达约 60%）。含义：家电/小家电类目多了一个垂直渠道，可对冲 Ozon/WB 的佣金上行与仓库风险；但 22–30% 佣金偏高，需按品类毛利测算后再决定铺货，并优先用 DBS/FBS 控制库存敞口。", "table": [["佣金", "22–30%"], ["提现费 / 获客费", "2% / 5%"], ["履约节奏", "FBO 已开；DBS 10 月；FBS 11 月"]], "sourceFull": "https://oborot.ru/news/holodilnik-ru-tozhe-otkryvaet-svoj-marketplejs-sto-tam-s-assortimentom-komissiyami-i-logistikoj-i281307.html"}, {"num": 4, "cat": "ecom", "catText": "电商动态", "title": "Ozon FBS 状态同步故障：已发货商品未更新，卖家被平台处罚金", "tag": "local", "tagText": "本地", "source": "Oborot.ru", "time": "10-12 12:00", "summary": "Oborot.ru 报道（10-12），Ozon 的 FBS 物流出现系统故障：卖家实际已发货、包裹已交付，但系统未同步更新发货状态，导致平台按「未按时发货」对卖家开罚，申诉与举证困难。含义：技术故障时平台与卖家的责任边界容易失衡，罚金会直接吞掉订单利润；FBS 卖家需保留交运凭证（面单、揽收记录、扫描截图），并在系统性故障时集中发起免除罚金申诉（参考 10-12 Яндекс Маркет 剔除质量指数并免罚的先例）。", "table": [["故障环节", "FBS 发货状态同步失败"], ["后果", "已发货订单被判超时并处罚金"], ["影响面", "FBS 自发货卖家"]], "sourceFull": "https://oborot.ru/news/sellery-zhaluyutsya-na-shtrafy-ozon-iz-za-fakticheski-otgruzhennyh-no-pochemu-to-ne-otrazhayushhihsya-v-sisteme-tovarov-i281171.html"}, {"num": 5, "cat": "ecom", "catText": "电商动态", "title": "«Ozon»、«Яндекс Маркет» 与 «Магнит» 领跑 click-out 广告投放", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-12 15:00", "summary": "Retail.ru 10-12 报道，在「点击出站」（click-out）广告格式中，Ozon、Яндекс Маркет 与 Магнит 是投放量最大的三家零售商；该格式把站内流量导向站外商品页/落地页，正成为零售媒体（retail media）的新增长点。含义：媒体位与站外导流广告成本将随竞争上升，站内广告预算需与自然流量运营重新配比；旺季前建议按 ROI 分层测试 click-out 与站内搜索广告，并关注平台媒体位位次变化对曝光的影响。", "table": [["头部玩家", "Ozon / Яндекс Маркет / Магнит"], ["广告格式", "click-out（出站导流）"], ["性质", "零售媒体新增量"]], "sourceFull": "https://www.retail.ru/news/ozon-yandeks-market-i-magnit-lidery-po-razmeshcheniyu-reklamy-v-formate-click-ou-12-oktyabrya-2026-283190/"}, {"num": 6, "cat": "ecom", "catText": "电商动态", "title": "«Магнит» 成立独立金融科技业务板块", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-13 15:00", "summary": "Retail.ru 10-13 报道，俄零售连锁 «Магнит» 设立独立的金融科技业务板块，把金融与数字服务（支付、会员、消费信贷类产品）从零售主业中拆分运营。含义：头部零售商正把会员与支付数据做成独立业务，未来零售媒体、会员权益与信贷捆绑将进一步集中流量；线下渠道合作与联合促销或需对接其金融/会员体系，相关合作条款与数据使用口径需提前厘清。", "table": [["主体", "«Магнит» 零售连锁"], ["动作", "设立独立金融科技业务板块"], ["方向", "支付/会员/消费金融"]], "sourceFull": "https://www.retail.ru/news/magnit-sozdal-otdelnyy-biznes-format-dlya-razvitiya-finansovykh-tekhnologiy-13-oktyabrya-2026-283257/"}, {"num": 7, "cat": "ecom", "catText": "电商动态", "title": "«Пятёрочка» 放缓开新店，转向存量门店改造", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-13 14:30", "summary": "Retail.ru 10-13 报道，俄食品连锁 «Пятёрочка»（X5 集团）将放缓新开门店速度，转而加大对存量门店的重装与改造投入。含义：线下零售进入存量提效阶段，新增铺位与货架资源增速下降，新品牌进店（listing）难度上升、进店成本与条码费议价空间收窄；计划走线下渠道的卖家需更早启动与连锁的谈判，并用线上动销数据支撑报价。", "table": [["主体", "«Пятёрочка»（X5）"], ["策略", "放缓开店、加大改造"], ["趋势", "存量提效"]], "sourceFull": "https://www.retail.ru/news/pyatyerochka-zamedlit-otkrytie-novykh-magazinov-no-uvelichit-rekonstruktsiyu-sushch-13-oktyabrya-2026-283256/"}, {"num": 8, "cat": "ecom", "catText": "电商动态", "title": "«Avito» 上俄时尚品牌商品购买量同比 +18%", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-13 13:30", "summary": "Retail.ru 10-13 报道，在 «Avito» 平台上俄罗斯时尚品牌的商品购买量同比增长 18%，二手/转售与品牌清仓并行。含义：转售渠道的库存消化能力增强，为品牌提供了官方折扣之外的库存出清通道（灯具、家电等耐用品同样适用）；尾货处理可评估接入 Avito/转售平台，但需管理品牌形象与串货风险，注意与授权经销协议的冲突。", "table": [["平台", "«Avito»"], ["时尚品牌商品购买量", "同比 +18%"], ["渠道属性", "转售/清仓"]], "sourceFull": "https://www.retail.ru/news/avito-veshchi-rossiyskikh-fashion-brendov-stali-pokupat-na-18-chashche-13-oktyabrya-2026-283255/"}, {"num": 9, "cat": "beauty", "catText": "美妆个护", "title": "LVMH 前 9 个月营收同比 -1.6%：奢侈品与美妆需求承压", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-13 15:30", "summary": "Retail.ru 10-13 报道，全球最大奢侈品集团 LVMH 前 9 个月营收同比下降 1.6%，香化（香水与化妆品）与皮具板块放缓，亚洲需求偏弱是主因。含义：全球奢侈品与美妆需求走软，或促使品牌方加快向俄罗斯等市场通过平行进口/分销出货，进而压低部分进口美妆的批发价；但汇率与合规成本仍是变量，采购与定价窗口建议按月滚动评估，勿一次性锁长单。", "table": [["主体", "LVMH"], ["前 9 个月营收", "同比 -1.6%"], ["拖累项", "香化/皮具，亚洲需求偏弱"]], "sourceFull": "https://www.retail.ru/news/prodazhi-lvmh-upali-na-1-6-protsenta-za-devyat-mesyatsev-13-oktyabrya-2026-283244/"}, {"num": 10, "cat": "appliance", "catText": "家电电器", "title": "俄市场新 iPhone 需求未超去年同期：高端数码换机动能减弱", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-13 14:30", "summary": "Retail.ru 10-13 报道，俄罗斯市场对新一代 iPhone 的需求未超过去年同期，高端数码换机周期拉长、平行进口供给趋于稳定，价格较去年更温和。含义：高端电器/数码类目旺季爆发力弱于此前预期，备货不宜按去年增速外推；建议把预算向中端与配件（充电、保护、智能家居）倾斜，并通过预售/以旧换新预判真实需求，控制 Q4 库存深度。", "table": [["品类", "新一代 iPhone（俄市场）"], ["需求", "未超去年同期"], ["背景", "换机周期拉长、平行进口供给企稳"]], "sourceFull": "https://www.retail.ru/news/spros-na-novye-iphone-v-rossii-ne-prevysil-proshlogodnie-pokazateli-13-oktyabrya-2026-283243/"}, {"num": 11, "cat": "econ", "catText": "经济金融", "title": "关键行情：Brent 回升至约 106.9 美元/桶（10-14）；央行官方汇率 USD 83.8675", "tag": "en", "tagText": "英文", "source": "Yahoo Finance（ICE Brent）/ 俄央行(CBR)", "time": "10-14 08:30", "summary": "10-14 盘中 Brent（ICE 近月）约 106.9 美元/桶，较 10-13 收盘 105.69 美元继续回升（10-12 为 106.65 美元），油价维持高位。俄央行 10-14 官方汇率为 1 美元 = 83.8675 卢布、1 欧元 = 93.7723 卢布、1 元人民币 = 12.5028 卢布，卢布较 10-13（83.9153）小幅走强。含义：高油价支撑卢布并推高运费与包装成本，Q4 干线报价宜保留燃油浮动条款；汇率按公司月度锁汇口径执行，并把 105/110/115 美元油价情景纳入成本敏感性测算。", "table": [["Brent（10-14 盘中）", "≈106.9 美元/桶"], ["USD/RUB（10-14 官方）", "83.8675"], ["EUR/RUB", "93.7723"], ["CNY/RUB", "12.5028"]], "sourceFull": "https://query1.finance.yahoo.com/v8/finance/chart/BZ=F"}, {"num": 12, "cat": "econ", "catText": "经济金融", "title": "«Минфин» 解释修改预算规则提议：油价超额收入处置口径酝酿调整", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "10-14 03:56", "summary": "RIA 10-14 报道，俄财政部（Минфин）就修改预算规则（бюджетное правило）的提议作出解释：讨论围绕油价收入超额部分的使用与结转口径展开，涉及国家财富基金（ФНБ）补充与支出弹性安排。含义：预算规则决定油价上涨时财政的吸纳与投放节奏，间接影响卢布汇率、国债供给与通胀路径，进而影响融资成本与消费购买力；对卖家而言应作为 Q4 汇率与需求侧情景的输入变量，而非短期经营动作。", "table": [["主体", "俄财政部（Минфин）"], ["议题", "修改预算规则（油价超额收入处置）"], ["关联", "ФНБ、汇率与国债供给"]], "sourceFull": "https://ria.ru/20261014/minfin-2124342977.html"}, {"num": 13, "cat": "econ", "catText": "经济金融", "title": "分析师上调俄煤出口价预测；对越南煤炭出口近乎翻倍", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "10-14 02:45", "summary": "生意人报（Kommersant）10-14 报道，分析师上调对俄罗斯煤炭出口价格的预测，认为亚洲需求与运距结构改善支撑价格中枢上移；同期 RIA 10-14 报道，俄对越南的煤炭出口量同比近乎翻倍。含义：能源出口结构东移与价格改善有助于卢布与财政稳定，但煤炭运输会挤占铁路运力、推高干线运费；Q4 备货需提前锁定运力，并关注东部线路时刻与费率变动。", "table": [["主体", "俄煤出口"], ["预测", "分析师上调出口价预测"], ["对越出口", "同比近乎 ×2"]], "sourceFull": "https://www.kommersant.ru/doc/9025796"}, {"num": 14, "cat": "econ", "catText": "经济金融", "title": "俄居民外币存款降至 2008 年以来最低：资金转向卢布/人民币资产", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "10-14 02:07", "summary": "RIA 10-14 报道，俄罗斯居民外币存款规模降至 2008 年以来最低，资金持续转向卢布及人民币等资产，与卢布走强、存款利率结构及跨境结算去美元化相关。含义：居民资产本币化会强化卢布的稳定性，有利于采购与结算的汇率确定性；但外币存款占比下降意味着本地资金更依赖卢布利率环境，促销分期与消费信贷成本仍系于关键利率路径，建议按月锁汇并跟踪存款结构变化。", "table": [["指标", "居民外币存款"], ["水平", "2008 年以来最低"], ["方向", "转向卢布/人民币资产"]], "sourceFull": "https://ria.ru/20261014/vklady-2124347121.html"}, {"num": 15, "cat": "econ", "catText": "经济金融", "title": "俄石油产量继续下降（10-13）", "tag": "local", "tagText": "本地", "source": "连塔网(Lenta.ru)", "time": "10-13 19:15", "summary": "Lenta 10-13 报道，俄罗斯石油产量继续下降，与炼厂受袭、出口运输成本高企及 OPEC+ 产量安排有关。含义：产量与出口波动会同时作用于卢布汇率与成品油供应，进而影响干线运输的燃油成本与附加费；Q4 物流报价建议保留燃油浮动条款，并关注油品出口禁令与炼厂复工进度对国内柴油价格的传导。", "table": [["指标", "俄石油产量"], ["趋势", "继续下降（10-13）"], ["关联", "炼厂受袭/出口成本/OPEC+ 安排"]], "sourceFull": "https://lenta.ru/news/2026/10/13/nizhe/"}, {"num": 16, "cat": "politics", "catText": "时政要闻", "title": "萨拉托夫州 Балаково 遭无人机袭击：民宅受损、1 人死亡", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "10-14 04:23", "summary": "RIA 10-14 报道（RG/Interfax/TASS 同日印证），萨拉托夫州 Балаково 遭无人机袭击，数栋居民住宅受损，造成 1 人死亡。该州此前有 Ozon 物流中心遇袭记录（09-11 萨拉托夫）。含义：伏尔加下游仍是袭击高频区，当地仓储与干线面临时效与安全风险；建议核查是否有库存/运单经停萨拉托夫与萨马拉集群，并预设改道方案与到货延迟的客服话术。", "table": [["地点", "萨拉托夫州 Балаково"], ["伤亡", "1 人死亡"], ["损失", "数栋民宅受损"]], "sourceFull": "https://ria.ru/20261014/ataka-2124353470.html"}, {"num": 17, "cat": "politics", "catText": "时政要闻", "title": "莫斯科周边一夜击落百余架无人机：首都空域压力再升", "tag": "local", "tagText": "本地", "source": "连塔网(Lenta.ru)", "time": "10-14 03:44", "summary": "Lenta 10-14 报道（RIA/TASS/Interfax 印证），在莫斯科近郊一夜击落超过一百架无人机，其中伊斯特拉方向 2 架、图拉州 20 余架，市长另通报再击落 15 架飞向莫斯科的无人机。含义：首都方向空域活动密集，机场临时管制与航班调整将反复出现，空运与干线时效波动常态化；建议旺季优先稳定的陆运/铁运路由，为空运订单预留更长时效承诺与改期方案。", "table": [["击落规模", "莫斯科近郊 >100 架"], ["其他方向", "图拉州 20+、伊斯特拉 2"], ["影响", "空域管制/航班调整"]], "sourceFull": "https://lenta.ru/news/2026/10/14/vblizi-moskvy-sbili-bolee-sotni-bespilotnikov/"}, {"num": 18, "cat": "politics", "catText": "时政要闻", "title": "萨马拉机场一度停运、下诺夫哥罗德机场恢复通航", "tag": "local", "tagText": "本地", "source": "国际文传电讯社(Interfax)", "time": "10-14 04:14", "summary": "TASS/Interfax 10-14 报道，受无人机威胁影响，萨马拉（Курумоч）机场一度暂停接收与放行航班，下诺夫哥罗德机场在临时限制后恢复运行；普尔科沃机场建议旅客避免选择经莫斯科中转的航班。含义：伏尔加与中部机场的临时管制对空运与转运构成即时扰动，需在订单时效承诺中预留缓冲，并准备经莫斯科中转路由的替代方案。", "table": [["停运", "萨马拉机场（临时限制）"], ["恢复", "下诺夫哥罗德机场"], ["提示", "普尔科沃建议避开经莫斯科中转"]], "sourceFull": "https://www.interfax.ru/russia/1122244"}, {"num": 19, "cat": "politics", "catText": "时政要闻", "title": "Politico：特朗普近期不太可能对俄新增制裁", "tag": "local", "tagText": "本地", "source": "«Российская газета»", "time": "10-14 03:45", "summary": "«Российская газета» 10-14 引述 Politico 报道，特朗普近期不大可能对俄罗斯推出新一轮制裁，与欧盟刚通过第 22 轮对俄制裁形成对比。含义：美欧制裁节奏分化，短期美方列名风险暂缓但欧盟口径趋紧，跨境结算与供应链合规仍需按「欧盟先收紧」情景准备；涉欧结算、货物过境与保险安排按最严口径自查，勿因美方暂缓而放松。", "table": [["信源", "Politico（经 RG 转述）"], ["判断", "美方近期或不再新增对俄制裁"], ["对照", "欧盟已通过第 22 轮制裁"]], "sourceFull": "https://rg.ru/2026/10/14/politico-tramp-vriad-li-vvedet-novye-sankcii-protiv-rossii-v-blizhajshie-dni.html"}, {"num": 20, "cat": "politics", "catText": "时政要闻", "title": "泽连斯基 10-14 抵伦敦：英方加速对乌军援相关磋商", "tag": "local", "tagText": "本地", "source": "«Российская газета»", "time": "10-14 03:20", "summary": "«Российская газета» 10-14 报道，泽连斯基当日抵达伦敦，行程聚焦英方对乌支持；英国计划加快向乌克兰交付 Martlet 轻型多用途导弹。含义：西方对乌军援节奏与和谈动向直接左右袭击强度与空域风险，10 月内平台仓与机场设施的安全情景仍偏紧；建议按「袭击常态化」维持库存分散与备用路由，并把和谈进展作为周度情景更新项。", "table": [["事件", "泽连斯基于 10-14 抵伦敦"], ["相关", "英国拟加快 Martlet 导弹交付"], ["关联", "袭击强度与空域风险"]], "sourceFull": "https://rg.ru/2026/10/14/zelenskogo-zhdut-v-londone-utrom-14-oktiabria-on-vstretitsia-s-bernemom.html"}, {"num": 21, "cat": "other", "catText": "其它动态", "title": "克拉斯诺达尔边疆区（库班）因油轮漏油风险进入高度戒备", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "10-13 22:36", "summary": "Vedomosti 10-13 报道，因一艘油轮存在漏油风险，克拉斯诺达尔边疆区（库班）宣布进入高度戒备状态，相关部门布设围油栏并监测沿岸。含义：黑海沿岸是重要的港口与干线枢纽，海上事故会波及港口作业、船期与到货时效；经新罗西斯克等口岸的进出货建议预留缓冲时间，并关注环保清污对码头作业的临时限制。", "table": [["地区", "克拉斯诺达尔边疆区（库班）"], ["事由", "油轮漏油风险"], ["状态", "高度戒备"]], "sourceFull": "https://www.vedomosti.ru/society/news/2026/10/13/1236830-rezhim-povishennoi-gotovnosti"}, {"num": 22, "cat": "other", "catText": "其它动态", "title": "俄燃气瓶制造商警示假冒产品增多", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "10-14 00:27", "summary": "RIA 10-14 报道，俄燃气瓶（气罐）生产商警告市场上假冒产品增多，存在安全与合规隐患。含义：家居/户外燃气类产品与配件的合规与质检风险上升，进口与销售需确保 EAC 认证与来源可追溯；相关品类卖家应核查供应商资质与证书有效性，避免因假冒流通引发下架、罚没或安全事故责任。", "table": [["品类", "燃气瓶（气罐）"], ["问题", "假冒产品增多"], ["风险", "安全与合规（EAC/追溯）"]], "sourceFull": "https://ria.ru/20261014/kontrafakt-2124340723.html"}]}
