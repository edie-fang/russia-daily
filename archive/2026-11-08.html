и（引 WP）", "time": "11-08 03:37", "summary": "克宫确认俄、乌、美三方代表团 11-10 至 11-11 在阿布扎比闭门会谈，议题为安全保障；WP 称特朗普特使 Kushner 把「俄罗斯-北约理事会」视为欧洲安全谈判模板，美方拟让俄参与新的欧洲安全架构。会谈结果将直接影响制裁与能源价格预期。", "table": [["📅 时间", "11-10 ~ 11-11"], ["📍 地点", "阿布扎比（ОАЭ）"], ["🚪 形式", "闭门"], ["🧩 模板", "Россия–НАТО 理事会"]], "sourceFull": "https://ria.ru/20261108/kushner-2130048380.html"}, {"num": 19, "cat": "politics", "catText": "时政要闻", "title": "FT：民主党开始筹备约 150 亿美元对乌军援新方案", "tag": "local", "tagText": "本地", "source": "Известия（引 FT）", "time": "11-08 03:13", "summary": "FT 11-07 报道：中期选举拿下参众两院的民主党已开始筹备约 150 亿美元对乌军援新方案，消息来自国会相关委员会人士。含义：美国对乌支持的政策连续性上升，但对俄制裁加码与俄美谈判节奏的不确定性同步增加，需关注对能源与支付链路的二次影响。", "table": [["💵 规模", "约 150 亿美元"], ["🏛 推动方", "民主党（两院多数）"], ["📰 来源", "FT（11-07）"], ["⚠️ 影响", "制裁与谈判节奏不确定"]], "sourceFull": "https://iz.ru/2198065/ft-uznala-o-podgotovke-demokratami-pomoshchi-ukraine-na-15-mlrd-izi"}, {"num": 20, "cat": "politics", "catText": "时政要闻", "title": "霍尔木兹：两艘油轮触雷起火，КСИР 取消导弹射程限制，美军打击一商船", "tag": "local", "tagText": "本地", "source": "Lenta.ru", "time": "11-08 01:28", "summary": "11-08 凌晨，КСИР 称两艘运油船在霍尔木兹海峡「走未经许可航线」触雷起火；同日 КСИР 宣布取消伊朗弹道导弹射程限制，美军中央司令部称对一艘无视多次警告、试图突破对伊海上封锁的商船实施打击。海峡通行风险上升，油价与集装箱运价短期波动加大。", "table": [["🚢 事件", "2 艘油轮触雷起火"], ["🚀 КСИР", "取消导弹射程限制"], ["🇺🇸 美军", "打击 1 艘商船"], ["⚠️ 影响", "油价 / 运价波动"]], "sourceFull": "https://lenta.ru/news/2026/11/08/dva-neftyanyh-tankera-podorvalis-v-ormuzskom-prolive/"}, {"num": 21, "cat": "other", "catText": "其它动态", "title": "Avito Auto：10 个月新车需求 +13.5%，均价 340 万卢布，Lada Granta 居首", "tag": "local", "tagText": "本地", "source": "Retail.ru（引 Avito Auto）", "time": "11-07 11:11", "summary": "Avito Auto 统计：今年 1 至 10 月俄新车需求同比增 13.5%，均价 340 万卢布；10 月环比增 7.2%、同比增 16.1%。品牌增速领先的是 Evolute（3 倍）、Jaecoo（2.4 倍）、Voyah（2.2 倍）；销量榜前三为 Lada Granta（110 万卢布）、Haval Jolion（260 万）、Tenet T7（290 万）。", "table": [["🚗 需求", "+13.5%（1–10 月）"], ["💰 均价", "340 万卢布"], ["📈 10 月", "环比 +7.2% / 同比 +16.1%"], ["🏆 榜首", "Lada Granta 110 万"]], "sourceFull": "https://www.retail.ru/news/za-10-mesyatsev-spros-na-novye-m
