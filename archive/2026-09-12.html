{"date": "2026-09-12", "stats": {"total": 26, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "Ozon：«Ингосстрах» 启动对受损卖家保险赔付，首批款项 9-15 起分批发付", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-11 20:02", "summary": "Ozon 新闻处通报，«Ингосстрах» 将向商品在无人机袭击平台仓库中受损的卖家合作伙伴发放保险赔付，首批赔偿金自 9 月 15 日起支付、可分批打款。此前 Sber/Soglasie/Ingosstrakh/T-Strakhovanie 等险企均否认承保 WB 仓库，恐袭风险通常不在工业险范围，卖家一度认为赔付无门。这是 7-18 首次遇袭近两个月来首例官方确认的平台仓保险理赔通道。", "table": [["承保方", "СПАО «Ингосстрах»"], ["赔付对象", "Ozon 平台合作伙伴卖家（商品在无人机袭击中受损）"], ["首批到账", "2026-09-15 起，可分多个批次"], ["意义", "首次官方确认的平台仓商品保险理赔"]], "sourceFull": "https://www.kommersant.ru/doc/8952987"}, {"num": 2, "title": "受损中小企业优惠贷款 9-11 开放：「关键利率+3%」、单笔最高 5 亿卢布、总额度 500 亿", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-11 09:00", "summary": "俄经发部通报，因无人机袭击 WB 仓库而损失商品的中小企业自 9 月 11 日起可申请国家支持优惠贷款：利率按「关键利率 + 3%」执行（现约 17%），单笔 500 万至 5 亿卢布，用于补充流动资金与日常支出；73 家银行参与，由 Минэк、央行与 Корпорация МСП 共同实施，总额度 500 亿卢布，抵押不足可用「伞式」担保补至 50%。为继税收缓缴、Сбер 重组后的第三条资金救助通道。", "table": [["生效日", "2026-09-11"], ["利率", "「关键利率 + 3%」（关键利率 14% → 约 17%）"], ["单笔金额", "500 万 ~ 5 亿卢布"], ["用途", "补充流动资金与日常支出"], ["参与机构", "73 家银行；Минэк + ЦБ + Корпорация МСП"], ["总额度", "500 亿卢布；伞式担保补至 50%"]], "sourceFull": "https://www.kommersant.ru/doc/8941304"}, {"num": 3, "title": "萨拉托夫州组建行动指挥部与员工热线，服务遇袭 Ozon 仓员工", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-11 13:38", "summary": "萨拉托夫州长布萨尔金下令组建行动指挥部并开通员工热线，为 Ozon 萨拉托夫仓遇袭事件中的员工提供支持，并称现场各必要部门仍在作业；同期 Ozon 在萨拉托夫市及全州维持暂停收件与派件、在途商品改道其他物流中心。地方政府快速介入，反映平台仓遇袭已从企业事件升级为需要地方政府兜底的地方性事件（人员安置、赔付协调、物流疏导）。", "table": [["责任方", "州长 Роман Бусаргин"], ["措施", "行动指挥部 + 员工热线"], ["现场", "各应急部门持续作业"], ["平台侧", "萨拉托夫市及全州暂停收件派件、在途改道"]], "sourceFull": "https://www.kommersant.ru/doc/8952676"}, {"num": 4, "title": "Ozon 股价早盘一度跌 5% 至 2519 卢布，萨拉托夫仓遇袭施压估值", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-11 10:36", "summary": "受萨拉托夫物流中心与配送枢纽遭无人机袭击消息影响，Ozon 在莫斯科交易所早盘一度下跌 5% 至 2519 卢布/股，10:35 前后修正至约 2560 卢布；当日 IMOEX 因央行维持关键利率 14% 收跌约 1%。平台仓遇袭已形成明确的股价传导效应，成为平台估值的新增系统性折价因子，或间接影响平台融资与卖家补贴力度。", "table": [["盘中跌幅", "-5%（至 2519 卢布/股）"], ["10:35 修正", "约 2560 卢布"], ["触发因素", "萨拉托夫物流中心与配送枢纽遇袭"], ["大盘", "IMOEX 当日收跌约 1%"]], "sourceFull": "https://www.kommersant.ru/doc/8941535"}, {"num": 5, "title": "ФНС：平台奖励积分不计入卖家收入、不征税", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-11 09:46", "summary": "俄联邦税务局（ФНС）在 9 月 2 日函件中明确，平台向卖家发放的奖励积分不视为卖家收入、不应征税；税务局将其定性为平台内部奖励机制，卖家可借此抵扣平台服务费。此前卖家对「平台积分是否计入应税收入」争议较多，此次解释消除了重复计税风险，卖家可将积分视为真实的服务费折扣核算毛利，并同步调整后台账目与年度申报口径。", "table": [["依据", "ФНС 9 月 2 日函件（Frank Media 披露）"], ["定性", "平台内部奖励机制（可抵扣平台服务费）"], ["税务处理", "不计入收入、不缴纳所得税"], ["对卖家", "积分账目与报税口径明确"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/09/11/1228042-fns-razyasnila-poryadok"}, {"num": 6, "title": "取货点（ПВЗ）扩张放缓：年增 25%、全国约 26 万处", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-11 14:33", "summary": "《生意人报》援引 «Яндекс Карты» 数据：俄罗斯取货点（ПВЗ）增速放缓，一年内数量增长 25%、目前全国约 26 万处。此前平台以补贴快速铺点抢占末端，如今增速回落意味着末端网络进入存量效率竞争阶段，单点坪效、租金与人力成本成为胜负手。对卖家而言，末端密度变化将影响配送时效承诺与退货回流路径，需结合 FBS 切换重算末端成本。", "table": [["ПВЗ 总量", "约 26 万处（全国）"], ["年增幅", "+25%（增速放缓）"], ["数据来源", "«Яндекс Карты»"], ["趋势", "末端网络由「跑马圈地」转向效率竞争"]], "sourceFull": "https://www.kommersant.ru/doc/8952729"}, {"num": 7, "title": "运输业强制电子运单首周：登记 820 万份电子单据，行业反映混乱与放缓", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-11 01:44", "summary": "俄运输业自 9 月 1 日起强制推行电子运单（ЭДО），至 9 月 11 日已满十天，首周登记电子单据 820 万份。市场参与者反映流程混乱、明显放缓，原因既包括要求不清晰，也包括 ЭДО 运营商功能与负载未就绪，部分场景电子单据仍比纸质更慢更复杂。在仓库遇袭、物流改道背景下，运单数字化过渡期叠加威胁，干线时效与补货周期风险上升，建议预留缓冲库存。", "table": [["生效", "2026-09-01（已 10 天）"], ["首周电子单据", "820 万份"], ["市场反馈", "要求不清、系统未就绪、比纸质更慢"], ["对卖家", "干线时效与补货周期风险上升"]], "sourceFull": "https://www.kommersant.ru/doc/8941314"}, {"num": 8, "title": "普京第二日印度行程：BRICS 峰会小范围会议，会见莫迪、拉马福萨、塞西与马来西亚总理", "tag": "local", "tagText": "本地", "source": "ТАСС", "time": "09-12 00:00", "summary": "普京进入印度之行第二天，将参加 BRICS 峰会领导人小范围会议；期间已与莫迪会谈（并与其同乘礼车参观印度展），会见南非总统拉马福萨、埃及总统塞西与马来西亚总理安瓦尔·易卜拉欣，并邀请塞西出席 10 月「俄罗斯—非洲」峰会。Сбер 在印设立商务枢纽、ПСБ 提交俄印支付系统方案、格列夫领衔俄印商业理事会等配套安排同步推进，显示俄方把 BRICS 作为经贸突围主通道。", "table": [["行程", "9-11~13 新德里工作访问"], ["峰会", "第 18 届 BRICS 峰会"], ["9-12 议程", "领导人小范围会议"], ["双边", "莫迪、拉马福萨、塞西、安瓦尔·易卜拉欣"]], "sourceFull": "https://tass.ru/politika/28104813"}, {"num": 9, "title": "普京：欧洲军队进入乌克兰即意味对俄开战；俄与欧洲「没有冲突的理由」", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-11 23:12", "summary": "普京在新德里 BRICS 峰会记者会上警告：欧盟正把成员国推向与俄罗斯的冲突，欧洲军队进入乌克兰领土将意味着与莫斯科开战；同时称俄与欧洲「没有冲突的理由」——二战后所有问题都已解决，责任在于西方在苏联解体后试图「再挤压」俄罗斯。此番表态在美方特使访俄、三方会谈预期升温的窗口期释放，既是对欧洲「派兵论」划线，也是谈判前的立场锚定。", "table": [["场合", "BRICS 峰会记者会（新德里）"], ["表态 1", "欧洲军队进入乌克兰＝与俄罗斯开战"], ["表态 2", "俄与欧洲无冲突理由（二战后问题已解决）"], ["归因", "2014 年乌克兰政变；西方试图「再挤压」俄罗斯"]], "sourceFull": "https://www.kommersant.ru/doc/8953036"}, {"num": 10, "title": "普京：BRICS 近五年产出逾 40% 全球 GDP，G7 约 29%", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-11 16:04", "summary": "普京在新德里表示，BRICS 国家近五年产出的经济总量占全球 GDP 逾 40%，同期 G7 约 29%；并称俄罗斯经济 2023-2025 年累计增长 10.3%、超过世界平均水平。该表述与俄官方「经济增速超全球均值」叙事一致，旨在向印度等伙伴强化「向东/向南」经贸合作的合理性。对在俄经营企业，BRICS 框架下的支付结算（ПСБ 俄印支付系统方案）与 СМП 北方海航道通道是最值得跟踪的落地环节。", "table": [["BRICS 占全球 GDP", "逾 40%（近五年产出）"], ["G7 占比", "约 29%（同期）"], ["俄罗斯经济", "2023-2025 年 GDP 累计 +10.3%（普京口径）"], ["场合", "BRICS 峰会 / 俄印商业论坛"]], "sourceFull": "https://www.kommersant.ru/doc/8952819"}, {"num": 11, "title": "法国支持将乌斯马诺夫移出欧盟制裁名单，Euronews 称另有一国加入", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-12 01:07", "summary": "法国表示支持将阿利舍尔·乌斯马诺夫从欧盟制裁名单中移除；Euronews 报道称另有一国也提出解除对其制裁。乌斯马诺夫此前已就制裁提起多轮司法申诉，欧盟内部对俄制裁松动的讨论正在升温。需注意这仍属成员国表态与讨论阶段、尚无正式决定。若欧盟对个人制裁出现实质松动，将是 2022 年以来对俄制裁框架的首个方向性变化信号。", "table": [["主体", "阿利舍尔·乌斯马诺夫（俄寡头）"], ["进展", "法国支持其从欧盟制裁名单移除"], ["追加", "Euronews：另有一国提议解除制裁"], ["阶段", "欧盟内部讨论，未见正式决定"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/12/1228317-frantsiya-podderzhala-usmanova"}, {"num": 12, "title": "无人机击中萨马拉州地方选举委员会大楼；萨马拉市 7 人受伤", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-11 11:43", "summary": "无人机击中萨马拉州地方选举委员会办公楼，俄中央选举委员会主席潘菲洛娃予以通报；同日萨马拉市遭无人机打击，7 人受伤、经门诊治疗后离院。同一波次中图拉州 2 人死亡（夜间击落 26 架）、伏尔加格勒两栋多层住宅与捷尔任斯克民宅车辆受损。选举机构成为打击目标，叠加 9 月选举季与投票率争议，选举安全与地方治理风险上升，物流枢纽所在州的运营连续性值得关注。", "table": [["目标", "萨马拉州地方选举委员会办公楼（Памфилова 通报）"], ["伤亡", "萨马拉市 7 人受伤（门诊治疗后离院）"], ["同期", "图拉州 2 死；伏尔加格勒/捷尔任斯克民宅车辆受损"], ["背景", "9 月选举季（ЦИК 已邀请 12 个国际观察团）"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/11/1228094-bpla-popal-v-izbirkomom"}, {"num": 13, "title": "别尔哥罗德州：FPV 无人机撞击汽车致 1 死 3 伤", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-12 01:58", "summary": "别尔哥罗德州十月镇一辆汽车被 FPV 无人机直接撞击，一名女性死亡、三人受伤；此前一晚该州已有两名儿童与三名成人因无人机袭击受伤。边境州针对民用车辆与居民点的 FPV 战术打击持续，南部与边境州的末端配送、线下网点与人员安全风险居高不下；别尔哥罗德 Ozon 仓（8-30 遇袭、导弹袭击致 2 死）所在区域风险等级未降低。", "table": [["地点", "别尔哥罗德州十月镇（Октябрьский）"], ["手段", "FPV-дрон 直接撞击汽车"], ["伤亡", "1 名女性死亡、3 人受伤"], ["前夜", "另有 2 名儿童 + 3 名成人受伤"]], "sourceFull": "https://www.kommersant.ru/doc/8953044"}, {"num": 14, "title": "央行维持关键利率 14%：十连降后首次暂停", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-11 13:30", "summary": "俄央行 9-11 议息后维持关键利率 14% 不变，终结此前连续十次降息（降息步幅已从 50bp 放缓至 25bp）；行长纳比乌林娜称降息「内容上并未讨论」，若预算参数明朗且通胀与通胀预期回落，政策具备放松空间。此前市场共识即为维持不变（部分机构预期再降 25bp 至 13.75%）。高利率延续意味着平台融资成本、卖家信贷成本与消费信贷需求仍受压制，旺季资金规划需按 14% 甚至更高的资金成本测算。", "table": [["决议", "维持 14% 不变"], ["此前路径", "连续 10 次降息，步幅由 50bp 放缓至 25bp"], ["降息讨论", "「内容上未讨论」降息"], ["后续条件", "预算参数明朗、通胀与预期回落即可再宽松"]], "sourceFull": "https://www.kommersant.ru/doc/8941162"}, {"num": 15, "title": "央行：2026 年通胀 6-7%、2027 年回到 4%；稳定涨价加速至 5-6%", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-11 13:59", "summary": "央行在议息声明与记者会上给出路径：2026 年全年通胀 6-7%，2027 年回到 4% 目标；因部分行业产能临时收缩，稳定通胀已加速至 5-6%（年化），但在产能效应耗尽、总需求温和增长条件下「稳定通胀的下降将会恢复」。纳比乌林娜称将通胀目标从 4% 上调「极有害」，并强调通胀预期依然偏高。对价格敏感的电商卖家而言，2026 年内难见明显的需求端利率红利。", "table": [["2026 年通胀", "6-7%"], ["2027 年", "回到目标 4%"], ["稳定通胀", "加速至 5-6%（年化）"], ["通胀预期", "仍偏高；央行称上调 4% 目标「极有害」"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/09/11/1228158-tsb-godovaya-inflyatsiya"}, {"num": 16, "title": "央行因无人机袭击向 РНПК 注资 1650 亿卢布；称袭击物流设施对通胀影响不显著", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-11 17:50", "summary": "纳比乌林娜在议息记者会上宣布，央行将于 9 月向俄罗斯国家再保险公司（РНПК）注资 1650 亿卢布，直接理由是无人机袭击频发——这是平台仓遇袭风险向保险与再保险体系传导的官方确认，也解释了此前无人机险费率飙升、险企普遍拒保背景下国家层面的承保能力扩容。同时央行判断对物流设施的打击对通胀影响不显著。卖家可在再保险扩容后重新询价无人机/恐袭险。", "table": [["注资对象", "РНПК（俄罗斯国家再保险公司）"], ["金额", "1650 亿卢布（2026 年 9 月）"], ["官方理由", "无人机袭击频发"], ["通胀判断", "对物流设施打击对通胀影响不显著"]], "sourceFull": "https://www.kommersant.ru/doc/8952843"}, {"num": 17, "title": "央行决议后莫斯科交易所指数收跌约 1%，俄气、诺瓦泰克、Яндекс 领跌", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-11 13:56", "summary": "央行维持关键利率 14% 的决定公布后，莫斯科交易所指数当日下跌约 1%；俄气跌 2%、诺瓦泰克跌 2.3%、Яндекс 跌 2.2%（Ozon 因萨拉托夫仓遇袭早盘一度跌 5%），极地黄金逆势涨 6.1%。此前市场曾部分押注 25bp 降息，暂停降息叠加中东能源风险推高通胀预期，风险资产承压。平台系股票折价扩大可能间接影响平台融资与补贴力度。", "table": [["IMOEX", "当日下跌约 1%"], ["领跌", "俄气 -2%、诺瓦泰克 -2.3%、Яндекс -2.2%"], ["逆势", "极地黄金（Полюс）+6.1%"], ["触发", "央行维持 14%，未释放近期降息信号"]], "sourceFull": "https://www.vedomosti.ru/investments/news/2026/09/11/1228155-indeks-snizilsya"}, {"num": 18, "title": "Росстат：8 月通缩 0.08%、年通胀 6.33%，二季度 GDP 增速确认为 1.3%", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-11 19:59", "summary": "俄统计局确认：8 月出现 0.08% 的通缩（环比），8 月年通胀 6.33%，二季度 GDP 增速确认为 1.3%；分品类看食糖批发价月度下跌 8.3%，卷心菜为当月降价幅度最大的食品。月度通缩主要来自蔬果等季节性品类，但央行关注的稳定通胀仍在 5-6% 且加速，说明通缩是结构性与季节性的、不构成降息依据。做生鲜与低毛利快消品类的卖家可参考批发价走势调整促销节奏。", "table": [["8 月物价", "通缩 -0.08%（环比）"], ["年通胀（8 月）", "6.33%"], ["二季度 GDP", "+1.3%（确认）"], ["价格结构", "糖批发价 -8.3%；卷心菜为月度降价最多食品"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/09/11/1228296-deflyatsiya-v-rossii"}, {"num": 19, "title": "Brent 升至 108.59 美元（+0.9%，5 月以来最高）；IEA 下调石油供给预估 130 万桶/日", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-11 11:23", "summary": "Brent 原油上涨 0.9% 至 108.59 美元/桶，创 5 月以来新高（前一交易日曾触 108 后收于 107.63）；国际能源署因波斯湾袭击下调全球石油供给预估 130 万桶/日，并预计需求要到 2027 年之后才会恢复，同时美柴油价格首次突破 6 美元/加仑。高油价对俄罗斯是财政与出口收入利好，但通过运费、包装与电力成本传导至卖家履约成本，且推高国内通胀预期、压缩降息空间。", "table": [["Brent", "108.59 美元/桶（+0.9%），5 月以来最高"], ["前一日", "盘中触 108 后收 107.63 美元"], ["IEA 供给", "因波斯湾袭击下调预估 130 万桶/日"], ["IEA 需求", "预计 2027 年前难以恢复"]], "sourceFull": "https://www.kommersant.ru/doc/8941533"}, {"num": 20, "title": "沙特暂停「东西」输油管道运行（伊拉克方向无人机袭击），胡塞控制曼德海峡", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-11 23:56", "summary": "沙特阿拉伯在遭无人机袭击后暂停「东西」输油管道运行，沙特外交部称袭击无人机自伊拉克境内发射、伊方确认；同日胡塞武装宣布控制巴布-埃尔-曼德海峡与也门西海岸。中东供给与航道风险叠加：经霍尔木兹海峡的船只 9 月 10 日仅 7 艘，美国柴油价格首次突破 6 美元/加仑。能源与海运成本上行对中俄跨境物流报价与时效构成间接压力，建议旺季前锁定运力与运价。", "table": [["管道", "沙特 «Восток — Запад»（东西向）暂停运行"], ["袭击", "无人机自伊拉克境内发射（伊方确认）"], ["航运", "胡塞武装控制巴布-埃尔-曼德海峡"], ["叠加风险", "霍尔木兹 9-10 仅 7 艘船通过"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/11/1228313-saudovskaya-priostanovila-rabotu"}, {"num": 21, "title": "Canpack 宣布完全退出俄罗斯；俄 LNG 对西班牙出口增 36%", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-11 06:45", "summary": "铝制饮料罐生产商 Canpack 宣布完全退出俄罗斯市场，成为外资在俄包装领域的最新一例退出；同期数据显示俄罗斯液化天然气对西班牙出口同比增长 36%，俄能源出口在欧美政治压力下仍保持对欧部分国家的实际流量。包装产能的外资退出将加速俄本土替代，对饮料与食品类卖家的包装供应与成本结构有间接影响，同时能源出口韧性支撑卢布与财政基本盘。", "table": [["企业", "Canpack（铝制饮料罐制造商）"], ["决定", "完全退出俄罗斯市场"], ["背景", "俄铝制包装本土化提速、外资持续减持"], ["同期数据", "1-8 月俄 LNG 对西班牙出口 +36%"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/09/11/1228020-canpack-obyavil-vihode"}, {"num": 22, "title": "美容师因网红 Бурцева 死亡案被判 3 年流放地监禁（非法行医）", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-11 15:32", "summary": "莫斯科巴斯曼尼区法院认定美容师 Шоира Назуллоева 从事非法医疗活动罪名成立，判处三年流放地监禁，案件涉及博主尤利娅·布尔采娃接受美容项目后死亡。该案成为俄美容行业「非法医美」的标志性判例，监管对无资质医美与理疗项目的刑事追责明显收紧。从事美妆、护肤器材与家用美容仪品类的卖家需注意：宣传「医疗/治疗效果」的表述与设备合规证书（注册证）风险显著上升。", "table": [["法院", "莫斯科巴斯曼尼区法院"], ["被告", "Шоира Назуллоева（美容师）"], ["罪名", "非法从事医疗活动，致博主 Ю. Бурцева 死亡"], ["判决", "3 年流放地（колония-поселения）监禁"]], "sourceFull": "https://www.kommersant.ru/doc/8952778"}, {"num": 23, "title": "俄罗斯眼镜销量 +12%、客单价 +13% 至约 4800 卢布", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-11 07:30", "summary": "据「Чек Индекс」为《生意人报》测算，2026 年 1-8 月俄罗斯消费者对光学眼镜的需求同比增长 12%，平均客单价上涨 13%、接近 4800 卢布；同期用户在 «Яндекс Карты» 上搜索配镜店的次数同比增长 17%。眼镜正从功能品向「美妆化」时尚品类迁移，线上配镜与眼镜配饰（墨镜、防蓝光镜）成为增长较快的细分，是美妆与个护卖家可拓展的相邻品类。", "table": [["期间", "2026 年 1-8 月（同比）"], ["需求量", "+12%"], ["平均客单价", "+13%，接近 4800 卢布"], ["渠道热度", "«Яндекс Карты» 配镜店搜索量 +17%"]], "sourceFull": "https://www.kommersant.ru/doc/8941394"}, {"num": 24, "title": "俄罗斯正式商用 5G：四大运营商、16 城、1000 万用户，年底前再增 50 城", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-11 09:22", "summary": "俄罗斯四大移动运营商正式宣布商用 5G，网络已在 16 个城市开通（含莫斯科与圣彼得堡），已有 1000 万用户接入；数字发展部（Минцифры）宣布年底前再覆盖 50 个城市。5G 商用落地将带动换机需求与高阶终端销售，为智能手机、CPE 与智能家居品类创造新的营销卖点（尤其高速与低时延应用场景）。", "table": [["运营商", "四大（«большая четверка»）全部商用"], ["覆盖城市", "16 个（含莫斯科、圣彼得堡）"], ["已开通用户", "1000 万"], ["扩网计划", "2026 年底前再覆盖 50 个城市"]], "sourceFull": "https://www.kommersant.ru/doc/8941456"}, {"num": 25, "title": "Минцифры：Android 用户很快可用 5G，iPhone 是否可用取决于 Apple", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-11 10:00", "summary": "数字发展部表示，Android 设备用户将在近期内全部获得 5G 接入；而 iPhone 用户能否使用 5G 取决于 Apple 的技术适配（俄方频段配置），意味着苹果用户在 5G 体验上可能出现结构性落后于安卓。当前 5G 已在 16 城开通、部分城市仅个别运营商可用，未来可能推出单独的 5G 资费。对手机/器械卖家而言，「支持俄方 5G 频段」将成为产品页的差异化卖点与合规筛选条件。", "table": [["Android", "用户将在近期内全部获得 5G 接入"], ["iPhone", "取决于 Apple 是否支持俄方频段配置"], ["当前覆盖", "16 城（部分城市仅个别运营商提供）"], ["资费", "未来可能推出独立 5G 资费套餐"]], "sourceFull": "https://www.vedomosti.ru/technology/news/2026/09/11/1228047-dostup-5g-poluchat"}, {"num": 26, "title": "«Вымпелком»：2027 年 5G 市场 350-450 亿卢布；МТС 拟把 5G 投资提高 20%", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-11 15:27", "summary": "«Вымпелком» 评估 2027 年俄罗斯 5G 市场规模为 350-450 亿卢布，其中 200-300 亿属于运营商为提供服务而必须进行的网络投资（不计入收入），商业性 Private 5G 需求约 130-160 亿卢布；МТС 计划将 5G 相关投资提高 20%。5G 尚处「投资驱动」而非「收入驱动」阶段，运营商对终端补贴与套餐定价的态度将直接影响手机、路由器等品类的旺季竞争格局。", "table": [["2027 年 5G 市场", "350-450 亿卢布"], ["其中强制投资", "200-300 亿卢布（网络投资，非收入）"], ["Private 5G 商用需求", "130-160 亿卢布"], ["МТС", "5G 方向投资拟增 20%"]], "sourceFull": "https://www.kommersant.ru/doc/8952748"}]}
