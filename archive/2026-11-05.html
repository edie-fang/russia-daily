 "$95.5 / 桶"], ["日内跌幅", "超 $4"], ["参照", "11-02 期 $106.33"]], "sourceFull": "https://www.kommersant.ru/doc/9080449"}, {"num": 11, "cat": "econ", "catText": "经济金融", "title": "10 月炼油利润率环比 -9% 至 3.03 万卢布/吨，汽油批发收益 -17%、柴油 -6%", "tag": "local", "tagText": "本地", "source": "Коммерсантъ（引 «Эйлер»）", "time": "11-05 00:01", "summary": "«Эйлер»：10 月俄炼油利润率环比 -9% 至 3.03 万卢布/吨，汽油批发收益 -17%、柴油 -6%，主因补偿性 демпфер 下调与欧洲油品价格走弱。分析师预计四季度汽柴油收益可能近乎腰斩，部分由财政补贴抵消；柴油小批发价已从 9 月初约 9 万卢布/吨降至不足 8 万。", "table": [["炼油利润率", "3.03 万卢布/吨（-9% MoM）"], ["汽油批发收益", "-17%"], ["柴油批发收益", "-6%"], ["柴油小批发价", "9 万→不足 8 万卢布/吨"]], "sourceFull": "https://www.kommersant.ru/doc/9080282"}, {"num": 12, "cat": "econ", "catText": "经济金融", "title": "Сбер ЦМИ 给出 2027 年关键利率两套情景：基准维持近 14%，鸽派 12 月降至 13.75%", "tag": "local", "tagText": "本地", "source": "Коммерсантъ（引 ЦМИ Сбербанка）", "time": "11-03 11:30", "summary": "Сбер 宏观研究中心 11-03 给出 2027 年关键利率两情景：基准为 12 月第三次维持 14%、释放上半年偏紧信号，2027 年维持近 14%、年末降至约 13%；鸽派为 12 月降至 13.75%、2027 年末 11.25%。若坚持 4% 通胀目标，2027 年三季度前均值需 13.8–14.1%，高于央行隐含的 13.1%。", "table": [["基准情景", "12 月维持 14%，2027 年末约 13%"], ["鸽派情景", "12 月 13.75%，2027 年末 11.25%"], ["通胀目标", "2027 年底 4%（鸽派下高于 4.9%）"], ["所需均值", "2027Q3 前 13.8–14.1%"]], "sourceFull": "https://www.kommersant.ru/doc/9079646"}, {"num": 13, "cat": "econ", "catText": "经济金融", "title": "11-11 起进口烈酒关税升至 35%（最低 5 欧元/升），大众进口酒零售价预计涨 16–17%", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "11-04 17:52", "summary": "政府 11-03 公布、11-11 生效：对不友好国家烈酒关税从报关价值 20% 提至 35%，最低税率由 3 欧元/升提至 5 欧元/升。协会估算大众价位威士忌与干邑每瓶涨 220–260 卢布（16–17%），高端涨 10–12%；进口份额由 5% 升至 5.8%。", "table": [["关税", "20% → 35%（报关价值）"], ["最低税率", "€3 → €5 / 升"], ["涨幅", "67–75%"], ["零售价影响", "大众 +16–17%，高端 +10–12%"]], "sourceFull": "https://www.kommersant.ru/doc/9080373"}, {"num": 14, "cat": "politics", "catText": "时政要闻", "title": "美国中期选举：民主党夺下参众两院，特朗普转向「否决政治」", "tag": "local", "tagText": "本地", "source": "Интерфакс", "time": "11-04 10:06", "summary": "11-03 投票、11-04 计票明朗：民主党同时拿下参众两院，参院至少 53 席（艾奥瓦 Turek 拿
