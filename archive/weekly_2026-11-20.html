026/11/19/1413352-putin-tramp", "url": "https://www.vedomosti.ru/politics/news/2026/11/19/1413352-putin-tramp"}, {"num": 14, "title": "克里米亚大桥一周内三次遇袭：公路反复中断，铁路单线后恢复", "tag": "local", "tagText": "本地", "source": "РБК（本地）", "time": "11-19 02:02", "summary": "11-16、11-17、11-19 克里米亚大桥一周内三次遭无人机袭击，公路通行反复中断、刻赤设临时安置点，СК 按恐袭（ст. 205 УК）立案；铁路 11-17 先恢复单线、当晚全线恢复，俄方称桥体无关键损伤。当夜俄方称击落 1,441 架无人机，11-17 单日击落 2,049 架创纪录。", "table": [["💥 袭击", "一周 3 次（11-16 / 11-17 / 11-19）"], ["🛣 影响", "公路中断待修复；铁路 11-17 单线→当晚全线恢复"], ["🚁 防空", "当夜击落 1,441 架；11-17 单日 2,049 架创纪录"], ["⚠️ 物流", "克里米亚方向陆运需预留绕行与延误"]], "sourceFull": "https://www.rbc.ru/politics/19/11/2026/6afe2a2165a66eb4fb259784", "url": "https://www.rbc.ru/politics/19/11/2026/6afe2a2165a66eb4fb259784"}, {"num": 15, "title": "欧盟第 22 轮制裁正式落地：145 名个人与实体、约 50 家银行，WB 创始人金在列", "tag": "local", "tagText": "本地", "source": "Известия（本地）", "time": "11-17 02:07", "summary": "11-16 欧盟理事会新增制裁 12 名个人与 101 家机构，约 50 家为俄银行与金融结构，并覆盖炼油厂、圣彼得堡石油码头运营方及油气勘探企业，本轮合计 145 名个人与实体；同日 WB 创始人、RWB 负责人塔季扬娜·金被列入，RWB 称在欧盟无资产、无业务，不影响运营。", "table": [["📋 规模", "12 名个人 + 101 家机构（本轮合计 145）"], ["🏦 金融", "约 50 家银行与金融结构（另 49 家单列）"], ["🛢 能源", "炼油厂、圣彼得堡石油码头运营方、油气勘探开采"], ["⚠️ 卖家", "WB 生态跨境收款与合同受益方合规审查趋严"]], "sourceFull": "https://iz.ru/2203002/2026-11-17/sovet-es-vvel-sanktcii-protiv-12-fizlitc-i-101-organizatcii-rf", "url": "https://iz.ru/2203002/2026-11-17/sovet-es-vvel-sanktcii-protiv-12-fizlitc-i-101-organizatcii-rf"}]}, {"icon": "📊", "name": "📊 经济", "items": [{"num": 16, "title": "周通胀升至 0.19%、年化 7.08%：食品与果蔬加速，非食品仅 +0.06%", "tag": "local", "tagText": "本地", "source": "Ведомости（本地）", "time": "11-18 19:28", "summary": "俄经发部：11-10 至 11-16 周通胀 0.19%（前一周 0.12%），年化 7.08%；食品 +0.35%（果蔬 +1.69%，黄瓜 +10%、番茄 +3.1%），非食品 +0.06%，服务 +0.18%。央行对 2026 年全年通胀预测为 7.1–7.6%，当前年化已略低于区间下沿。", "table": [["📈 周通胀", "0.19%（前值 0.12%）｜年化 7.08%"], ["🍅 食品", "+0.35%；果蔬 +1.69%（黄瓜 +10%、番茄 +3.1%）"], ["🧺 非食品/服务", "+0.06% / +0.18%"], ["🏦 央行预测", "2026 年全年 7.1–7.6%"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/11/18/1413102-inflyatsiya-uskorilas", "url": "https://www.vedomosti.ru/economics/news/2026/11/18/1413102-inflyatsiya-uskorilas"}, {"num": 17, "title": "Q3 GDP 同比 +1.0%、1–9 月上调至 0.8%，固定投资 -6.2% 连续六季下滑", "tag": "local", "tagText": "本地", "source": "Коммерсантъ（本地）", "time": "11-15 20:30", "summary": "俄统计局：2026 年 Q3 GDP 同比 +1.0%（Q2 +1.3%），符合央行预期、高于经发部原估 0.6%；数据发布后经发部把 1–9 月增速由 0.6% 上调至 0.8%，称全年可能略超 0.6% 的官方预测。投资继续拖累：Q3 固定资本投资 -6.2%，已连续六个季度下滑；10 月消费支付环比 -2.2%。", "table": [["📊 Q3 GDP", "+1.0% YoY（Q2 +1.3%）"], ["📈 1–9 月", "+0.8%（由 0.6% 上调）"], ["🏗 投资", "-6.2%（连续 6 季下滑）"], ["💳 消费", "10 月消费支付环比 -2.2%"]], "sourceFull": "https://www.kommersant.ru/doc/9109892", "url": "https://www.kommersant.ru/doc/9109892"}, {"num": 18, "title": "11-20 股市急跌：IMOEX 盘中 -2.8%、RTS 跌破 900；ОФЗ 拍卖仅成交 737 亿创 7 月最低", "tag": "local", "tagText": "本地", "source": "РБК（本地）", "time": "11-20 16:51", "summary": "11-20 莫斯科交易所股指加速下跌：IMOEX 盘中跌 2.8% 至 2,349.93（17:03 MSK，日内低点 2,340.6），RTS 自 10-16 以来首次跌破 900 点，RBC 称「缺乏正面消息」。同期财政部 11-18 两期 ОФЗ 拍卖需求 1,630 亿卢布、砍单 56.6%，仅成交 737 亿，为 7-01 以来最低。", "table": [["📉 IMOEX", "2,349.93（11-20 17:03 MSK，-2.8%；自 11-13 收盘 -6.4%）"], ["📉 RTS", "跌破 900 点（10-16 以来首次）"], ["🏦 ОФЗ", "成交 737 亿 ₽（需求 1,630 亿、砍单 56.6%），7-01 以来最低"], ["🎯 含义", "风险偏好走弱、财政融资压力上升，Q4 资金成本难降"]], "sourceFull": "https://www.rbc.ru/quote/20/11/2026/6b004dff514b062afa4fe363", "url": "https://www.rbc.ru/quote/20/11/2026/6b004dff514b062afa4fe363"}]}, {"icon": "💄", "name": "💄 美妆", "items": [{"num": 19, "title": "«Лэтуаль»：51% 美妆新客在 11.11/黑五首购高端线，男性人均支出高 19%", "tag": "local", "tagText": "本地", "source": "Retail.ru（本地）", "time": "11-16 15:54", "summary": "«Лэтуаль»：2025 年约 51% 首单新客在 11.11 与黑五买入高端美妆；首购中香水 74%、面部护理 12%、彩妆 11%。女性占首购客户 80%，男性 20% 但人均支出高 19%。2025 年 11 月高端线营收 +8%、销量 -4%，17% 新客复购。", "table": [["🧴 首购品类", "香水 74% / 面部护理 12% / 彩妆 11%"], ["👥 客群", "女 80% / 男 20%，男性人均 +19%"], ["📊 11 月高端线", "营收 +8%、销量 -4%，17% 新客复购"]], "sourceFull": "https://www.retail.ru/news/muzhchiny-tratyat-na-lyuksovuyu-kosmetiku-na-19-bolshe-zhenshchin-16-noyabrya-2026-284502/", "url": "https://www.retail.ru/news/muzhchiny-tratyat-na-lyuksovuyu-kosmetiku-na-19-bolshe-zhenshchin-16-noyabrya-2026-284502/"}, {"num": 20, "title": "监管局：拦截 6,200 万次违规 БАД 销售，标记制度下合法生产商增至 3 倍", "tag": "local", "tagText": "本地", "source": "Интерфакс（本地）", "time": "11-20 03:12", "summary": "俄消费者权益监督局：2024-11 以来通过收银端「许可模式」拦截逾 6,200 万次违规 БАД 销售；标记制度实施后合法生产商数量增至 3 倍。含 симетикон / мелатонин 的 БАД 禁售涉及 550 万件，此后销量下降逾 260 倍，10 月未再发现违规在售；已封禁约 5.7 万个违规网站。", "table": [["🚫 拦截", ">6,200 万次（2024-11 起，收银端许可模式）"], ["🏭 供给", "合法生产商数量增至 3 倍"], ["📦 禁售", "симетикон/мелатонин 涉 550 万件，10 月无违规在售"], ["🌐 网站", "封禁约 5.7 万个"]], "sourceFull": "https://www.interfax.ru/russia/1130296", "url": "https://www.interfax.ru/russia/1130296"}]}, {"icon": "🔌", "name": "🔌 电器", "items": [{"num": 21, "title": "12-01 起电子技术费落地：手机 250/496 ₽、笔记本 500/992 ₽，单件上限 5,000 ₽", "tag": "local", "tagText": "本地", "source": "Известия（本地）", "time": "11-18 04:30", "summary": "依据工贸部 10-13 第 5366 号令，12-01 起对笔记本、智能手机及部分电话机征收技术费：手机 250 ₽（有品牌/型号信息）或 496 ₽（缺一项）；笔记本 500/992 ₽；有线无绳电话 100/198 ₽、蜂窝 50/100 ₽、其它 25/49 ₽，单件上限 5,000 ₽。", "table": [["📱 手机", "250 ₽（信息齐全）/ 496 ₽（缺一项）"], ["💻 笔记本", "500 / 992 ₽"], ["☎️ 其他", "有线/无绳 100/198 ₽；蜂窝 50/100 ₽；其它 25/49 ₽"], ["🧾 上限", "单件 5,000 ₽；依据工贸部令 №5366（10-13）"]], "sourceFull": "https://iz.ru/2193459/2026-11-18/v-rossii-s-1-dekabria-vvoditsia-tekhnologicheskii-sbor-na-elektroniku", "url": "https://iz.ru/2193459/2026-11-18/v-rossii-s-1-dekabria-vvoditsia-tekhnologicheskii-sbor-na-elektroniku"}, {"num": 22, "title": "调查：64% 俄消费者考虑在促销买电子品，平均预算 26,100 ₽", "tag": "local", "tagText": "本地", "source": "Retail.ru（本地）", "time": "11-17 15:48", "summary": "Авито Товары/Авито Реклама 访问 1 万名俄罗斯人：64% 考虑在 11 月促销购买电子品，55% 明确会买打折机；平均预算 26,100 卢布。手机最热（43%），其次笔记本（21%）、平板与耳机（各 17%）、电视（16%）、智能音箱与手表（各 14%）。", "table": [["👥 样本", "10,000 人"], ["🛒 意愿", "64% 考虑购买；55% 明确会买打折机"], ["💰 预算", "平均 26,100 ₽"], ["📱 品类", "手机 43% / 笔记本 21% / 平板·耳机各 17% / 电视 16%"]], "sourceFull": "https://www.retail.ru/news/64-zhiteley-rossii-rassmatrivayut-pokupku-gadzhetov-na-rasprodazhakh-issledovani-17-noyabrya-2026-284573/", "url": "https://www.retail.ru/news/64-zhiteley-rossii-rassmatrivayut-pokupku-gadzhetov-na-rasprodazhakh-issledovani-17-noyabrya-2026-284573/"}, {"num": 23, "title": "电子与灯具制造商联名反对 ПП 2392 新条件：警告涨价与失去登记资格", "tag": "local", "tagText": "本地", "source": "Коммерсантъ（本地）", "time": "11-16 01:48", "summary": "多家协会（印刷电路板联盟、电信设备协会、灯具制造商协会 «Содружество производителей светотехники» 等）致函 Минпромторг，反对第 2392 号决议新条件：企业须把税收优惠节省额的两倍再投资，且 70% 收入须来自本国登记产品。协会称将推高俄产电子与灯具价格、部分企业或被剔出登记名录。", "table": [["🏭 诉求方", "印刷电路板联盟、电信设备协会、灯具制造商协会等"], ["📜 新条件", "≥2 倍税收优惠节省额再投资；≥70% 收入来自本国登记产品"], ["⚠️ 风险", "俄产电子与灯具涨价、部分企业被剔出登记名录"], ["✅ 诉求", "取消 70% 门槛 / 改 1 倍再投资 / 设过渡期"]], "sourceFull": "https://www.kommersant.ru/doc/9109916", "url": "https://www.kommersant.ru/doc/9109916"}]}, {"icon": "💡", "name": "💡 灯具", "items": [{"num": 24, "title": "灯具照明：本周无新增行业动态；12-01 无码禁售与 ЭДО 按件验收是唯一实质变化", "tag": "local", "tagText": "本地", "source": "Retail.ru（本地）", "time": "11-20 09:00", "summary": "本周 5 期日报逐一核对 8 家 P0/P1 俄媒 RSS、Retail.ru 灯具主题页与照明行业媒体，11-16 至 11-20 窗口内无灯具照明新增行业新闻。唯一实质变化在合规端：12-01 起灯具（9405）、灯泡（8539）等无线电电子产品无码禁售，11-30 前须完成贴码或清库，12-01 起收货按件码走 ЭДО（详见第 2 条）。", "table": [["🔍 核对范围", "8 家 P0/P1 RSS + Retail.ru 灯具主题 + lightingmedia（5 期日报）"], ["📰 窗口内新增", "0 条（本周灯具行业无新增重大动态）"], ["⏱ 关键截止", "2026-11-30 贴码/清库；2026-12-01 无码禁售"], ["🧾 验收", "12-01 起按件码 + ЭДО（УПД 5.03 逐件传码）"]], "sourceFull": "https://www.retail.ru/theme/lighting/?d=2026-11-20", "url": "https://www.retail.ru/theme/lighting/?d=2026-11-20"}]}], "keyData": {"headers": ["指标", "周初（11-16）", "周末（11-20）", "周内变化"], "rows": [["USD/RUB（央行官方）", "82.1516", "81.9290", "卢布升 0.27%"], ["CNY/RUB（央行官方）", "12.3149", "12.2546", "卢布对人民币升 0.49%"], ["EUR/RUB（央行官方）", "91.0322", "89.8597", "卢布升 1.29%"], ["Brent 近月（美元/桶）", "96.06（11-13 收）", "91.53（11-20 14:24 MSK）", "-4.7%，第三周连跌；月内 -15.5%"], ["IMOEX 指数", "2,511.10（11-13 收）", "2,349.93（11-20 17:03 MSK 盘中）", "-6.4%"], ["俄央行关键利率", "14.00%", "14.00%", "10-23 会议维持 14.00%，本周无变动"], ["周通胀（周环比）", "+0.12%（11-03~09）", "+0.19%（11-10~16）", "年化 7.08%（前值 6.98%）"], ["跨境网购（1–9 月）", "—", "5,500 亿 ₽（+72%）", "订单 +61%；2027-01-01 起 22% НДС"], ["中国在俄主体数", "4,004（2021 年底）", "21,800（2026-11）", "×5.4，居外资首位"], ["财政部 ОФЗ 拍卖", "—", "737 亿 ₽（11-18）", "需求 1,630 亿、砍单 56.6%，7-01 以来最低"]]}, "trends": [{"title": "电商物流 / 平台政策：计费化与标记化同时收口，12-01 是本周期的分水岭", "text": "① 计费化：Ozon 12-01 起把佣金与服务费改成直算公式、取消「折扣积分」，并把到分拣中心的运输、кросс-докинг、30 天未提货处置逐项单列，12-22 再把退货端纳入自动处置（25/75 ₽/kg）——尾程与退货从「看不见的扣款」变成可逐单核算的成本项；WB 同日改 оферта（保理公司代付、银行欠款自动扣），并在 11-16 把 FBW 本地化指数统一为 1.00，区域布货的费率优惠消失，只剩时效价值。② 标记化：12-01 起灯具（9405）、灯泡（8539）等无线电电子产品无码禁售，11-30 是贴码/清库最后一天，入仓收货同时转为按件码 + ЭДО 验收；化妆品与日化也在同日进入 ЭДО 强制范围。③ 合规责任前移：11-16 出现首例卖家因伪造 EAC 检测报告被按刑法 327 条立案（最高 2 年），平台对证书与检测报告真实性的核验会更严。④ 制度风向：11-20 独联体跨议会大会审议《数字平台》示范法草案，明确平台与卖家、ПВЗ 的合作规则与商品信息义务（Интерфакс）——中期看，平台规则正从企业条款上升为区域立法。对卖家的净效应：Q4 的毛利表必须同时重算「费率 + 尾程 + 退货 + 标记合规」四项，12-01 前完成一次合同、费率与编码的全面核对。"}, {"title": "跨境物流：口岸与预申报双向拥堵，Q4 补货窗口被压缩", "text": "① 公路口岸：后贝加尔斯克—满洲里电子排队近 2–3 个月失灵，等待 5–6 天、单车日停运 2.5–3 万卢布，是本周对陆运时效最直接的负面变量。② 预申报：自 6-01 起 ЕАЭС 公路进口须走 СПОТ，拼箱一车 30–50 票逐票核码，7–10 月备运时间 +20%，白俄方向保证金推迟到 2027-07——「小批量、多批次」的拼箱模式正在被单据成本侵蚀。③ 地缘扰动：爱沙尼亚拟自 12-01 关闭全部对俄口岸（待最终执行），波罗的海陆路中转与小包时效面临改线；克里米亚大桥一周三次遇袭，虽以本地物流为主，但跨区绕行会占用南部运力。④ 建议：Q4 补货按「铁路优先 + 多口岸分流」排期，单批预留 5–7 天缓冲；把 СПОТ 核码与 ЭДО 传码纳入同一套发货前检查表，避免在口岸或收货口被单证卡住。"}, {"title": "需求与消费：平台渗透进入「基础设施」阶段，增量转向场景与支付", "text": "① 渗透率：ВЦИОМ 显示 55% 俄罗斯人最近一周在平台购物、另 17% 月内买过，农村 76% 用平台寻找线下缺货商品；购买动机里省时（73%）已高于省钱（57%）——平台从「便宜渠道」变成「省时基础设施」，单纯低价换量的边际收益继续下降。② 大促行为：Авито 调查 49% 计划参加 11 月大促、平均预算 13,362 卢布，33% 不提前准备、看到合适就买；电子品端 64% 考虑在促销购买、平均预算 26,100 卢布，手机占 43%——高客单品类仍有集中释放。③ 支付：Сбер 上线 СБП 分期（5,000–50,000 卢布、6/12/24 期，覆盖平台订单与家电电子），高客单灯具与家电的分期入口从信用卡扩展到 СБП，定价与详情页应同步标注分期方案。④ 跨境：1–9 月跨境网购 5,500 亿卢布（+72%），但 2027-01-01 起 22% НДС 会把这部分需求往本土仓/FBS 模式推，2027 年前是模式切换窗口。"}, {"title": "经济与金融：通胀反弹、投资六连降，股指与财政融资同时承压", "text": "① 通胀：11-10~16 周环比 0.19%（前值 0.12%）、年化 7.08%，食品 +0.35%、果蔬 +1.69%，非食品仅 +0.06%——商品端仍弱、食品端反弹，央行 7.1–7.6% 的全年预测已无缓冲。② 增长：Q3 GDP +1.0%（Q2 +1.3%）、1–9 月上调至 0.8%，但固定投资 -6.2% 连续六季下滑、10 月消费支付环比 -2.2%，增长靠消费与财政、投资端持续失血。③ 金融：11-20 IMOEX 盘中 -2.8%、RTS 跌破 900，周内 IMOEX 自 11-13 收盘 -6.4%；11-18 ОФЗ 拍卖仅成交 737 亿（砍单 56.6%）、创 7 月以来最低，年底前还需发行 1.75 万亿——风险偏好与财政融资同时走弱。④ 成本：2027 年 МРОТ 上调至 28,935 卢布（+6.8%），工伤社保费改由 ФНС 征管，仓储与末端用工成本将同步上移；银行业 1–9 月净利润 3.6 万亿（+36%）、净息差 5.3%，说明实体融资成本短期难降。对卖家的含义：Q4 定价按「汇率 81–83、利率 14%、油价 90–96」做三变量敏感性，现金流留出更厚的安全垫。"}, {"title": "能源与汇率：Brent 第三周连跌、卢布逆势走强，进口成本端出现短暂窗口", "text": "① 油价：Brent 从 11-13 收盘 96.06 跌至 11-20 14:24 MSK 的 91.53（-4.7%），为第三周连跌、月内 -15.5%，WTI 跌至 8-26 以来最低；驱动是美国库存意外增加与全球供应过剩预期，霍尔木兹油轮触雷只提供短线支撑。② 汇率：USD/RUB 由 11-16 的 82.1516 降至 11-20 的 81.9290（卢布升 0.27%），CNY/RUB 12.3149→12.2546（卢布对人民币升 0.49%），EUR/RUB 跌 1.29%——在油价走弱与股指下跌的同时卢布反而偏强，说明资本流动与结汇节奏的影响大于商品价格。③ 对跨境链路：油价回落利好干线燃油附加费，人民币计价成本也小幅下降，但卢布走强会压缩以卢布定价的毛利率；建议报价按 Brent 88–98、USD/RUB 81–84、CNY/RUB 12.1–12.5 做区间测试，合同保留浮动条款，不把本周的有利窗口当作全年假设。"}, {"title": "平台风险与合规：袭击常态化叠加标记/ЭДО 双门槛，履约韧性成为旺季胜负手", "text": "① 风险侧：本周无新增平台仓损毁（累计 44 起，WB 22 / Ozon 15），但 «Чашниково»（11-16）与 «Краснодар СГТ»（11-18）因空袭警报停收，平台用「取消供货免罚、停机不计发货速度」对冲——空袭已从「黑天鹅」变成常规运营变量。② 政策侧：第 1481 号决议把两平台损失合并计算、门槛定为年收入 5%、平台报损截止提前到每月 5 日，受袭卖家有了可操作的递延路径，但前提是 акты приёмки/УПД 等凭证齐全。③ 合规侧：12-01 起灯具/灯泡无码禁售 + ЭДО 按件传码，与本周期 Ozon/WB 的费率与结算变更同月生效，任何一项没对齐都会直接反映为下架、拒收或扣款。④ 操作建议：把「单一 SKU 不押一个枢纽、FBS 作为备用主干道、发货前单证三查（码、ЭДО、报关字段）」固化为 Q4 的周度检查表；对受袭与停收，逐单留存后台免罚截图，避免后续误罚与申报失败。"}], "sourceStats": "收录 24 条全部来自俄语本地媒体与官方口径（Retail.ru / Ведомости / Коммерсантъ / РБК / РИА Новости / Интерфакс / Известия / MPUP / Sellers Platform / Legium.pro / Контур.Маркет / Ozon 卖家后台；其中 Retail.ru 引 Infoline·Data Insight·ВЦИОМ·«Авито»·«Лэтуаль»，Ведомости 引日本财务省与央行数据，Коммерсантъ 引 Dataflat·«Эйлер»，均按本地媒体计）。行情与汇率另补取 ЦБ РФ 官方牌价与 Московская биржа（IMOEX），不单独计入条目。本地信源 24 条、占比 100%（中文 0%、英文 0%），满足本地 ≥60% 的要求。", "meta": ["报告编号：RU-WEEKLY-2026-W47", "覆盖周期：2026-11-16（周一）~ 11-20（周五），第47周，共 5 个工作日", "收录条目：24 条（仓库遇袭与履约韧性1/平台规则变动3/电商8/时政3/经济3/美妆2/电器3/灯具1）", "数据来源：本周日报 5 期（19/25/25/25/19，共 113 条）按重要性精选；周报按「事件」合并同一主题的多日条目，汇率补取央行官方牌价、油价取 11-13 收盘与 11-20 盘中、IMOEX 取 11-20 盘中值", "去重口径：URL 比对 state.db articles 表（本周日报 113 条已入库）；周报条目按「事件」去重，同一事件多日出现只保留信息最全的一条并合并数据。入库对账：attempted 24 / 新增 1（IMOEX 午盘行情，日报未覆盖的 RBC 条目）/ 命中旧记录 23，周内库内共 114 行；无重复 URL", "信源结构：本地 24 条 / 100%（要求 ≥60%）｜中文 0%｜英文 0%", "条数上限：电商 ≤8 条、其它每栏 ≤3 条；美妆 2 条、灯具 1 条为本栏本周全部可收录项，未凑数", "口径说明：汇率取央行 11-16 / 11-20 生效牌价；Brent 为 11-13 收盘与 11-20 14:24 MSK 盘中报价；IMOEX 为 11-20 17:03 MSK 盘中值（收盘前）；平台费率与规则以平台卖家渠道、行业监测为准，未见官方公告的项已在条目内标「待核实」"]}
