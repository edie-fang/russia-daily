会谈（超3小时）之后的首次官方进展口径；俄方乌沙科夫、德米特里耶夫参加会谈，双方确认普京与特朗普将继续保持个人联系。", "table": [["信源", "白宫官员（路透社）"], ["内容", "已讨论\"实质性\"下一步计划"], ["公布", "未来数周内"], ["背景", "普京-特使会谈>3小时"]], "sourceFull": "https://ria.ru/20260906/peregovory-2115798768.html"}, {"num": 5, "title": "普京启动\"东方石油\"北极输油主干管道：通往北湾港，资源量约70亿吨", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "09-05 19:10", "summary": "普京9-5启动通往克拉斯诺亚尔斯克边疆区北湾(Бухта Север)新码头的输油主干管道，属泰梅尔\"东方石油\"(Восток Ойл)大型北极项目的一部分，将为经新码头发出首批原油做准备，出口走俄北极海上航线。项目覆盖万科尔油田群及北部新区块，资源量约70亿吨液态烃，配套北湾港油码头、输油泵站、储油库与管网系统——普京此前在东方经济论坛预告该管道启用。", "table": [["项目", "东方石油(Восток Ойл)"], ["管道", "通北湾港(克拉斯诺亚尔斯克边疆区)"], ["资源量", "约70亿吨液态烃"], ["用途", "北极航线(北方海路)首运准备"]], "sourceFull": "https://lenta.ru/news/2026/09/05/putin-dal-start-rabote-nefteprovoda-k-arkticheskomu-terminalu/"}, {"num": 6, "title": "OPEC+七国9-6开会评估市场与协议执行：俄称市场\"短缺\"，9月为增产末档", "tag": "local", "tagText": "本地", "source": "国际文传电讯(Interfax)", "time": "09-06 00:01", "summary": "俄、沙特、阿尔及利亚、科威特、伊拉克、哈萨克、阿曼七国部长9-6开会讨论油市形势与协议执行（阿联酋5月退出OPEC）。七国2023年以来自愿减产2.2+1.65百万桶/日已基本回补，9月为最后一档恢复到期。俄副总理诺瓦克称市场\"短缺\"、无减产议题，近期决定均为提高配额与产量，俄因炼厂检修低于配额。中东冲突支撑高油价，OPEC+对需求恢复与中国补库持乐观。", "table": [["参会", "俄/沙特/阿尔及利亚/科威特/伊拉克/哈萨克/阿曼"], ["自愿减产", "2.2+1.65百万桶/日（基本回补）"], ["俄方", "低于配额（炼厂检修）"], ["诺瓦克", "市场短缺、不议减产"], ["背景", "9-2 Brent曾达$96/桶"]], "sourceFull": "https://www.interfax.ru/business/1113426"}, {"num": 7, "title": "霍尔木兹油轮互袭升级：伊朗宣布打击3艘涉美油轮，美方此前攻击3艘伊油轮", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-05 23:04", "summary": "伊朗革命卫队海军司令阿齐米宣布，伊方已对霍尔木兹海峡3艘与美国关联的油轮实施打击；此前五角大楼中央司令部称美军攻击了哈尔克岛附近、贾斯克地区及阿曼湾的3艘伊朗油轮。伊方警告波斯湾及海峡船只勿经\"未经许可航线\"，并威胁若美军继续攻击伊朗船只将实施更强回击。背景：特朗普8-20宣布对伊\"经济行动\"。油轮互袭令霍尔木兹这一关键原油通道的风险溢价高企，支撑油价维持高位。", "table": [["伊方", "打击3艘涉美油轮(霍尔木兹)"], ["美方先行", "攻击3艘伊油轮(哈尔克岛/贾斯克/阿曼湾)"], ["伊威胁", "若美继续将更强回击"], ["背景", "8-20起美对伊\"经济行动\""], ["影响", "原油通道风险溢价支撑油价"]], "sourceFull": "https://ria.ru/20260905/iran-2115782697.html"}]}
