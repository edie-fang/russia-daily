{"date": "2026-10-20", "stats": {"total": 17, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "cat": "platform", "catText": "平台规则变动", "title": "Ozon：12-01 起向自提点（ПВЗ）业主收取代理服务费，上限为其报酬的 1%", "tag": "local", "tagText": "本地", "source": "«Ведомости»", "time": "10-19 16:26", "summary": "Ozon 依据代理合同法自 2026-12-01 起向自提点业主收取代理服务费，上限为其就订单所获报酬的 1%；«Ведомости»与«Коммерсантъ»同日报道，平台称目的是让代理关系符合法律要求。对我方含义：费用由站主承担、不直接加到卖家账单，但站主收益被压缩，低单量或偏远站点可能关站、缩短营业时长，自提与退货处理时效将出现区域性波动。", "table": [["⏱ 生效时间", "2026-12-01（10-19 公告）"], ["🎯 实际影响", "自提点收益被压缩，末端覆盖与退货时效或波动"], ["✅ 建议动作", "运营 11 月内盘点依赖单一 ПВЗ 的集群，预备替代自提/派送方案"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/10/19/1238259-ozon-vvedet-platu"}, {"num": 2, "cat": "platform", "catText": "平台规则变动", "title": "Ozon FBS：11-19 起取消「推荐发货时段」，改按自设发货时间计费（超 6 小时加收 0.25%–3%）", "tag": "local", "tagText": "本地", "source": "Ozon 卖家官方", "time": "10-06 13:49", "summary": "Ozon 公告：原定 10-06 取消 FBS「推荐发货时段（рек. слот）」的计划暂缓，该时段保留至 2026-11-19；此后不再有推荐时段及其折扣与罚金，改由卖家自设「发货准备时间」决定费率——设 ≤6 小时按标准费率，超过 6 小时按发货单内全部货值的 0.25%–3% 加收，时间越长发散越高。对我方含义：FBS/realFBS 若沿用平台默认设置，可能直接落入加收档，单均物流成本被动上升。", "table": [["⏱ 生效时间", "2026-11-19"], ["🎯 实际影响", "发货时间设置直接决定 FBS 单均成本（0.25%–3% 货值）"], ["✅ 建议动作", "运营 11-10 前把发货准备时间调到 ≤6 小时并重算 FBS 成本"]], "sourceFull": "https://t.me/ozonmarketplace/3301"}, {"num": 3, "cat": "ecom", "catText": "电商动态", "title": "国家杜马提议：线上购物可选「拒绝过度包装」", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-19 17:20", "summary": "国家杜马工业与贸易委员会主席切尔内绍夫提议赋予线上买家「拒绝过度包装」的权利，已致函工贸部征求意见；若落地，卖家需在商品卡提供包装选项，默认包装与可回收包装的物流计费、体积重口径都要调整。目前仅为提案，尚无法案文本与生效日期（待核实）。对我方含义：提前评估简化包装对破损率、退货率与体积重计费的三重影响，别等立法后再改包材标准。", "table": [["指标", "数值"], ["提出方", "国家杜马工贸委员会"], ["状态", "提案，已致函工贸部（无法案文本）"], ["影响面", "包材标准、体积重计费、破损与退货率"]], "sourceFull": "https://www.retail.ru/news/rossiyskim-pokupatelyam-mogut-dat-pravo-otkazatsya-ot-lishney-upakovki-pri-onlay-19-oktyabrya-2026-283456/"}, {"num": 4, "cat": "ecom", "catText": "电商动态", "title": "Ozon 与税务局打通 АУСН 自动报送，卖家免手工台账", "tag": "local", "tagText": "本地", "source": "Ozon 卖家官方", "time": "10-19 13:17", "summary": "Ozon 与联邦税务局（ФНС）联合上线免费工具：适用 АУСН 的卖家可把平台与银行数据自动传给税务系统，按日或按月自动计算应缴税额，替代手工台账；АУСН 门槛为年收入 ≤6000 万卢布、员工少于 5 人。对我方含义：跨境主体通常不适用该税制，但在俄本土主体若已切换 АУСН，需要核对平台数据口径与自身账务是否一致，避免自动申报与手工账差异触发问询。", "table": [["指标", "数值"], ["合作方", "Ozon × ФНС"], ["适用税制", "АУСН（年收入 ≤6000 万卢布、员工 <5）"], ["对我方", "本土主体合规成本下降，需核对数据口径"]], "sourceFull": "https://t.me/ozonmarketplace/3316"}, {"num": 5, "cat": "ecom", "catText": "电商动态", "title": "ВЦИОМ：90% 线上买家愿不看实物下单，决定信任的是五项卡片要素", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-19 11:58", "summary": "ВЦИОМ 调查：90% 的线上买家认为不必亲手验货也能判断质量；过去一年 97% 网民网购，其中 97% 用过 Ozon、Wildberries、Яндекс Маркет 或 Авито。决定信任的要素依次是详细描述与成分（69%）、高评分（累计 83%）、评价区图文（87%）、长评（89%）、商品卡图文（90%）。对我方含义：卡片图文与长评是转化第一杠杆，运营预算应从单纯比价转向内容与评价体系建设。", "table": [["指标", "数值"], ["愿意不看实物下单", "90%"], ["用过平台网购", "97%（过去一年）"], ["五项要素覆盖", "描述 69% → 卡片图文 90%"]], "sourceFull": "https://www.retail.ru/news/vtsiom-90-onlayn-pokupateley-gotovy-doveryat-kachestvu-tovara-bez-lichnogo-osmot-19-oktyabrya-2026-283433/"}, {"num": 6, "cat": "lighting", "catText": "灯具照明", "title": "Ozon：10 月上半月圣诞灯串需求约 3 倍，新年装饰全面爆发", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-19 10:57", "summary": "Ozon 数据：10 月上半月新年相关品类需求同比大涨——圣诞树（针叶与人造）+40%，新年玩具与装饰 +3.3 倍，圣诞灯串与花环约 +3 倍，新年餐巾 +5.1 倍、桌布 +2.4 倍。对我方含义：灯串是 deeplight/pipolux 可直接延展的旺季品类，FBO 入仓预约与广告排期需在 11 月上旬前锁定；晚于 11 月中旬入仓将错过 12 月峰值，且届时平台仓储费与竞价都会上行。", "table": [["指标", "同比"], ["圣诞灯串与花环", "约 3 倍"], ["新年玩具装饰", "3.3 倍"], ["圣诞树", "+40%"], ["新年餐巾 / 桌布", "5.1 倍 / 2.4 倍"]], "sourceFull": "https://www.retail.ru/news/ozon-v-pervoy-polovine-oktyabrya-spros-na-elochnye-igrushki-i-girlyandy-vyros-bo-19-oktyabrya-2026-283429/"}, {"num": 7, "cat": "lighting", "catText": "灯具照明", "title": "«Авито»：55% 俄罗斯人新年前换软装，首选品类是灯具（44%）", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-19 21:39", "summary": "«Авито» 对约 1 万人的调查：55% 俄罗斯人计划新年前更新家居软装，人均预算 14,000 卢布；首位采购品类是灯具（44%），其后为纺织与装饰品；78% 计划线上购买。对我方含义：灯具需求在 11–12 月前置释放，落地灯、氛围灯、装饰灯串应提前备货，并围绕「换新」做场景化内容与套装组合，而不是只打单品低价。", "table": [["指标", "数值"], ["计划换软装", "55%"], ["人均预算", "14,000 卢布"], ["首选品类", "灯具 44%"], ["线上购买意愿", "78%"]], "sourceFull": "https://www.retail.ru/news/bolee-50-rossiyan-planiruyut-obnovit-interer-k-novomu-godu/"}, {"num": 8, "cat": "beauty", "catText": "美妆个护", "title": "Faberlic 首次进入传统零售：旗下 «Прайм» 9 个月做到 11 亿卢布", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-19 13:47", "summary": "Faberlic 首次进入传统零售渠道：旗下零售网络 «Прайм» 前 9 个月营业额 11 亿卢布，销售 Faberlic、Avon 与 Lamoda 商品；Faberlic 2025 年营收 540 亿卢布，同时是 Avon 在俄独家经销商。对我方含义：本土美妆巨头从直销转向全渠道，线下铺货叠加自有品牌，会挤压 marketplace 上中小美妆品牌与白牌的价格带，mosai/莫赛 的选品与定价需避开其主力价格段正面竞争。", "table": [["指标", "数值"], ["«Прайм» 9 个月营业额", "11 亿卢布"], ["Faberlic 2025 营收", "540 亿卢布"], ["渠道变化", "直销 → 传统零售（首次）"]], "sourceFull": "https://www.retail.ru/news/kompaniya-faberlic-vpervye-vyshla-v-traditsionnyy-riteyl-19-oktyabrya-2026-283441/"}, {"num": 9, "cat": "appliance", "catText": "家电电器", "title": "М.Видео：小家电销量 +17.6%、均价 -6%，集团线上 GMV 小电 +218%", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-19 13:12", "summary": "М.Видео-Эльдорадо：2026 年前 9 个月俄罗斯市场大家电销量 +7.1%（金额 +0.2%），小家电销量 +17.6%、金额 +12.9%，均价分别下降 6.4% 与 4%；集团线上 GMV 大家电 +103%、小家电 +218%。对我方含义：小家电是「量增价减」格局，靠低价位段与高频上新抢份额；平台化是该集团增长主引擎，我方小家电定价与促销节奏需对齐其大促档期，避免被自营补贴正面压制。", "table": [["指标", "同比"], ["小家电销量 / 金额", "+17.6% / +12.9%"], ["大家电销量 / 金额", "+7.1% / +0.2%"], ["均价变化", "-6.4%（大）/ -4%（小）"], ["集团线上 GMV", "大电 +103% / 小电 +218%"]], "sourceFull": "https://www.retail.ru/news/m-video-s-nachala-2026-goda-prodazhi-maloy-bytovoy-tekhniki-v-rossii-vyrosli-na--19-oktyabrya-2026-283439/"}, {"num": 10, "cat": "econ", "catText": "经济金融", "title": "参议员预测：10-23 央行维持关键利率 14%，年底前不再调整", "tag": "local", "tagText": "本地", "source": "Лента.ру", "time": "10-20 04:30", "summary": "联邦委员会预算与金融市场委员会委员佳吉列娃预计，10-23 央行会议将维持关键利率 14%，且这一水平至少维持到年底；理由是近月价格压力上升，上次会议已暂停降息周期。对我方含义：卢布融资成本维持高位，本地仓租、账期垫资与促销投放的资金成本按 14% 以上口径测算；汇率风险仍以远期锁汇和自然对冲为主，不宜加杠杆备货。", "table": [["指标", "数值"], ["当前关键利率", "14.00%"], ["下次会议", "2026-10-23"], ["预期", "维持 14%，年底前不变"]], "sourceFull": "https://lenta.ru/news/2026/10/20/dan-prognoz-po-klyuchevoy-stavke-na-blizhayshee-zasedanie-tsb/"}, {"num": 11, "cat": "econ", "catText": "经济金融", "title": "美元官方汇率跌破 83：82.85 卢布，为 8-22 以来首次", "tag": "local", "tagText": "本地", "source": "«Ведомости»", "time": "10-19 18:35", "summary": "俄央行 10-20 官方汇率：美元 82.85 卢布（-0.77）、欧元 93.23（-0.49）、人民币 12.39（-0.11）；美元自 8-22 的 82.92 以来首次收于 83 下方。机构预测四季度美元均值 85.3、2027 年 89.4。对我方含义：卢布短期偏强，人民币结算回款按 12.39 折算的毛利改善有限；建议按 12.3–12.5 区间做月度锁汇，报价单保留汇率调整条款。", "table": [["币种", "10-20 官方汇率"], ["USD/RUB", "82.85（-0.77）"], ["EUR/RUB", "93.23（-0.49）"], ["CNY/RUB", "12.39（-0.11）"], ["预测", "Q4 85.3 / 2027 89.4"]], "sourceFull": "https://www.vedomosti.ru/finance/news/2026/10/19/1238342-kurs-dollara"}, {"num": 12, "cat": "econ", "catText": "经济金融", "title": "预算修正案：2027–2029 年新增收入 3.6 万亿卢布，逾 3.2 万亿来自税收", "tag": "local", "tagText": "本地", "source": "«Известия»", "time": "10-20 00:30", "summary": "财政部预算材料：2027–2029 年立法变更将带来 3.6 万亿卢布额外收入，其中税收修正贡献逾 3.2 万亿——个税累进税率扩至投资与被动收入 1.4 万亿、矿业超额利润税 6000 亿、向「С」类账户（不友好国家主体）分红征税 3900 亿、基金信托管理收入征税 3000 亿。可覆盖每年 5.1–5.5 万亿赤字约五分之一。对我方含义：在俄主体与个人股东税负上升，利润汇出路径与代持结构需重新评估。", "table": [["指标", "数值"], ["三年额外收入", "3.6 万亿卢布"], ["其中税收", "逾 3.2 万亿"], ["个税累进扩容", "1.4 万亿"], ["年赤字", "5.1–5.5 万亿"]], "sourceFull": "https://iz.ru/2187020/2026-10-20/izmeneniia-v-biudzhete-prinesut-kazne-36-trln-rublei-za-tri-goda"}, {"num": 13, "cat": "econ", "catText": "经济金融", "title": "财政部：УСН「收入」口径不能把平台仓库货损计入损失抵扣", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-19 15:56", "summary": "财政部答复：采用简化税制「收入」口径（УСН «доходы»）的纳税人，不能把在 marketplace 仓库丢失或损毁商品的成本计入损失抵扣，因为该口径只按收入计税、不核算支出；此类损失只能在会计处理、保险理赔或诉讼层面解决。对我方含义：用 УСН «доходы» 的主体遇袭货损拿不到任何税收减免，风险成本必须计入定价，或评估切换「收入-支出」口径的可行性。", "table": [["指标", "数值"], ["适用口径", "УСН «доходы»"], ["结论", "仓库货损不可税前扣除"], ["替代路径", "保险理赔 / 诉讼 / 换税制"]], "sourceFull": "https://www.retail.ru/news/minfin-vprave-li-platelshchik-usn-spisat-ubytki-pri-utrate-tovarov-na-skladakh-m-19-oktyabrya-2026-283453/"}, {"num": 14, "cat": "politics", "catText": "时政要闻", "title": "路透：威特科夫计划访俄会见普京，行程排在奥斯陆会谈之后", "tag": "local", "tagText": "本地", "source": "«РИА Новости»", "time": "10-20 02:42", "summary": "路透社援引消息人士：美国特使威特科夫计划访俄并与普京会面，行程安排在其与乌方代表团在奥斯陆会谈之后；Axios 称泽连斯基拟周二或周三在奥斯陆会见威特科夫与库什纳，随后两人可能从奥斯陆飞莫斯科，会面也可能推迟。对我方含义：若本月出现高层接触，卢布与物流保险费率可能短线改善；但制裁与边境风险未实质解除，备货节奏不宜押注单次会晤结果。", "table": [["指标", "数值"], ["关键人物", "威特科夫、库什纳"], ["首站", "奥斯陆（会见乌方）"], ["后续", "或转飞莫斯科见普京（可能推迟）"]], "sourceFull": "https://ria.ru/20261020/vstrecha-2125516062.html"}, {"num": 15, "cat": "politics", "catText": "时政要闻", "title": "万斯：乌克兰不该加入北约，也不称其为美国盟友", "tag": "local", "tagText": "本地", "source": "«Интерфакс»", "time": "10-20 02:07", "summary": "美国副总统万斯在多个场合表示乌克兰不应加入北约，并拒绝把乌克兰称为美国盟友；同日他称乌克兰「时而违背美国利益」。这与特朗普政府内部对乌施压、推动尽快谈判的路线一致。对我方含义：北约议题被视为和谈筹码，若换得停火，乌克兰方向物流与保险成本将下降；若谈判破裂，黑海与边境风险溢价会重新上行。", "table": [["指标", "数值"], ["表态人", "副总统万斯"], ["核心立场", "反对乌入北约"], ["关联", "推动尽快谈判"]], "sourceFull": "https://www.interfax.ru/world/1123580"}, {"num": 16, "cat": "politics", "catText": "时政要闻", "title": "特朗普：现阶段优先谈，不急于动用「格雷厄姆法」制裁", "tag": "local", "tagText": "本地", "source": "«Интерфакс»", "time": "10-19 23:38", "summary": "特朗普 10-19 表示现阶段优先继续与普京就乌克兰问题谈判、不急于动用「格雷厄姆法」制裁，理由是「不想破坏谈判」；但他强调随时有权立即加码制裁。同期其政府被曝推迟向基辅交付爱国者拦截弹。对我方含义：制裁节奏短期可控，但属可逆变量，支付通道、报关与合规审查仍需按「随时收紧」的预案运行，避免单点依赖某条通道。", "table": [["指标", "数值"], ["当前取向", "谈判优先，暂不加码"], ["法律工具", "格雷厄姆法（可随时启用）"], ["同期动作", "推迟交付爱国者拦截弹"]], "sourceFull": "https://www.interfax.ru/world/1123569"}, {"num": 17, "cat": "politics", "catText": "时政要闻", "title": "FT：欧洲可能向俄提出两套乌克兰和平方案", "tag": "local", "tagText": "本地", "source": "«РИА Новости»", "time": "10-20 01:01", "summary": "英国评论员拉赫曼在 FT 撰文：欧洲若与普京直接谈判，可能提出两套方案——按现有接触线冻结冲突，或乌克兰让出顿巴斯剩余地区并加入北约；欧洲对俄方接受程度不抱信心，但认为启动直接谈判本身重要。对我方含义：两套方案的共同点是「先停火、后安排」，冬季前后物流与保险费率可能出现阶段性缓和窗口，可据此做备货与舱位锁定的情景推演。", "table": [["指标", "数值"], ["方案一", "按现有接触线冻结"], ["方案二", "让出顿巴斯剩余 + 入北约"], ["判断", "欧洲认为启动谈判本身重要"]], "sourceFull": "https://ria.ru/20261020/ukraina-2125512203.html"}]}
