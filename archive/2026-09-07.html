{"date": "2026-09-07", "stats": {"total": 11, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "俄政府10-1前圈定政府采购平台白名单：简化采购实验全国铺开，学校/幼儿园可直采本土电商平台", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-07 00:15", "summary": "普京在ВЭФ宣布的\"平台直采\"实验细化：Минэк向Ведомости确认，政府将先拟定准入门槛（平台须符合电子平台运营商法定要求并兼顾平台特性），再于10-1前确定可承接政府采购的电商平台名单；10-1起全国（非仅远东/北极）学校、幼儿园、学院可直接从本土电商平台采购，普京称此举可规避采购中的\"微腐败\"。", "table": [["节点", "10-1实验启动（全国）"], ["范围", "学校/幼儿园/学院日常采购直连本土平台"], ["门槛", "符合电子平台运营商法定要求（Минэк）"], ["状态", "准入条件制定中，名单未公布"]], "sourceFull": "https://www.vedomosti.ru/economics/articles/2026/09/07/1226726-kabmin-opredelit-perechen-marketpleisov-dlya-goszakupok"}, {"num": 2, "title": "电商\"去中心化\"提速：莫斯科+州头部品类线上份额26.1%→23.4%，Ozon 85%买家在地区", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-06 15:24", "summary": "Kokoc Group统计：2025.6~2026.7莫斯科+莫斯科州在服装/电子/鞋/家电/家居等热门品类在线销售占比由26.1%降至23.4%，同期Ozon与WB全国头部品类合计约5.4万亿卢布。Ozon称约85%活跃买家来自地区、上半年每3单1单送往5万人口以下小城镇；WB莫斯科+州份额已降至不足1/5（2022年为28%）。АКИТ：上半年俄电商总量7.2万亿卢布。", "table": [["莫斯科+州份额", "26.1%→23.4%（2025.6-2026.7）"], ["Ozon+WB头部品类合计", "≈5.4万亿卢布"], ["Ozon地区买家", "≈85%活跃客户"], ["Ozon小城订单", "每3单1单（≤5万人）"], ["WB莫斯科+州占比", "<1/5（2022年28%）"]], "sourceFull": "https://www.kommersant.ru/doc/8937236"}, {"num": 3, "title": "小面积仓供给骤降：莫斯科light industrial上半年新增交付-72%至6万㎡，空置率升至11.8%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-06 15:25", "summary": "NF Group：莫斯科及州light industrial（小型仓储/生产物业）H1-2026新交付同比-72%至6万㎡（Nikoliers口径-50%以上至10.83万㎡）；同期成交12.1万㎡（-25%），空置率升至11.8%（+1.3pp）。主因融资成本高企致项目延期，全年新增交付或达约82.8万㎡（近2倍）但集中于下半年。小型仓供给收缩影响电商卖家前置仓/中转仓布局与议价空间。", "table": [["新交付(H1)", "-72%至6万㎡（NF Group）"], ["成交", "12.1万㎡（-25%）"], ["空置率", "11.8%（+1.3pp）"], ["全年预估", "≈82.8万㎡（近2倍，集中H2）"], ["主因", "融资成本高企"]], "sourceFull": "https://www.kommersant.ru/doc/8937243"}, {"num": 4, "title": "美特使穿梭收官：维特科夫/库什纳9-6夜乘专列离基辅称\"和谈要素齐备\"；特朗普拟9-7先电普京再电泽连斯基", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "09-07 01:29", "summary": "乌克兰铁路通报：美代表团（维特科夫+库什纳）结束莫斯科-基辅行程，9-6与泽连斯基会谈后乘专列离乌。维特科夫称访俄期间听到新想法，俄美乌三方新一轮会谈官宣或很快到来，\"和平要素齐备\"；库什纳称美方正拟定一揽子和平方案。Shot报道：特朗普拟9-7（周一）听取汇报后先致电普京、再致电泽连斯基。若停火推进，平台仓袭击风险与市场情绪联动改善。", "table": [["行程", "莫斯科(9-5会谈)→基辅(9-6会谈)→专列离乌"], ["维特科夫", "\"和谈要素齐备\"，三方会谈或很快官宣"], ["库什纳", "美方正拟定一揽子方案"], ["特朗普", "9-7先电普京后电泽连斯基（Shot）"]], "sourceFull": "https://lenta.ru/news/2026/09/07/uitkoff-i-kushner-pokinuli-kiev-posle-vstrechi-s-zelenskim"}, {"num": 5, "title": "\"静默\"夜被打破：塞瓦斯托波尔遭无人机夜袭致1名女孩死亡（装填榴霰弹），伏尔加地区多城机场限航", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "09-07 02:05", "summary": "9-7凌晨乌无人机袭击塞瓦斯托波尔（州长Развожаев通报，Interfax/TASS交叉印证）：爆炸震碎幼儿园及多栋住宅玻璃、两次落地殉爆；无人机装填爆炸物+榴霰弹，现场发现数百枚杀伤元素。2011年生女孩伤重死于救护车上，另3人受伤（1名男性昏迷，两人门诊后返家）；防空击落3架。同夜伏尔加地区萨马拉/喀山/萨拉托夫/乌法/彼尔姆等多城机场一度限航。平台仓无受损通报。", "table": [["伤亡", "1死（2011年生女孩）+3伤（1昏迷）"], ["受损", "幼儿园+多栋住宅玻璃；2次落地殉爆"], ["无人机", "装榴霰弹；防空击落3架"], ["限航机场", "萨马拉/喀山/萨拉托夫/乌法/彼尔姆等（夜间）"], ["平台仓", "无受损通报"]], "sourceFull": "https://lenta.ru/news/2026/09/07/long-sevastopol"}, {"num": 6, "title": "OPEC+七国冻结10月产量配额：俄994.9万桶/日，结束6-9月连增序列；实际产量远低于配额", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-06 20:43", "summary": "OPEC+七国9-6决议：10月配额维持9月水平，终止6-9月每月+18.8万桶/日的增产序列；俄10月配额994.9万桶/日、沙特1047.8万桶。9月已完成165万桶/日减产退坡，另约200万桶/日额外限产保留，下次会议10-4。Argus：6月OPEC+实际产量3195万桶/日、较冲突前低约720万桶——霍尔木兹封锁（9-3仅3艘油轮通过≈战前2%）令增产\"名存实亡\"。Сечин称中国减进口550万桶/日抑价，否则油价或再高$30/桶。", "table": [["10月配额", "俄994.9万/沙特1047.8万桶/日（持平9月）"], ["增产序列", "6-9月每月+18.8万桶/日已终止"], ["减产退坡", "165万桶/日完成；另~200万桶/日额外限产在"], ["实际产量", "6月3195万桶/日，低于目标~720万（Argus）"], ["下次会议", "10-4"]], "sourceFull": "https://www.kommersant.ru/doc/8937607"}, {"num": 7, "title": "Ведомости共识：30位经济学家23位预期央行9-11维持14%——1.5年降息周期或首度暂停", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-07 00:14", "summary": "多数（23/30）受访经济学家预期央行9-11会议维持关键利率14%（7月刚降25bp）；7人认为或降25bp至13.75%，其中1人不排除降50bp；无人预期加息。逻辑：卢布走弱与燃料市场问题推升通胀风险，与经济活动放缓信号并存；央行副行长Заботкин称降息空间已收窄，Тремасов预计10月关键会议前燃料形势更明朗。若兑现，将是本轮宽松周期首次暂停，影响卖家融资与消费信贷成本预期。", "table": [["维持14%", "23/30经济学家"], ["降25bp至13.75%", "7人（1人不排除降50bp）"], ["加息预期", "0人"], ["会议", "9-11（基准日）"], ["背景", "7月降25bp；卢布走弱+燃料通胀vs放缓"]], "sourceFull": "https://www.vedomosti.ru/economics/articles/2026/09/07/1226724-konsensus-prognoz-vedomostei-tsb-sohranit-stavku"}, {"num": 8, "title": "俄股一周：IMOEX +6.55%至2253.41点、RTS +5.34%；Ozon周涨25.8%领涨（8-31~9-4）", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-07 00:06", "summary": "莫斯科交易所基准指数8-31~9-4一周上涨6.55%至2253.41点，美元计RTS涨5.34%至819.85点，市场\"活在地缘和谈希望里\"。领涨：Ozon +25.8%、ММК +14.1%、Фосагро +14%、Алроса +12.5%、НЛМК +12.4%；垫底：Полюс -4.6%、Лента -3.5%（被移出指数计算基数）、ЦИАН -2%。Ozon大涨与平台经济政策（政府采购实验、10月平台经济法生效）及停火预期共振。", "table": [["IMOEX", "+6.55%→2253.41点"], ["RTS", "+5.34%→819.85点"], ["领涨", "Ozon +25.8%、ММК +14.1%"], ["垫底", "Полюс -4.6%、Лента -3.5%"], ["驱动", "和谈预期+平台经济政策"]], "sourceFull": "https://www.vedomosti.ru/investments/articles/2026/09/06/1226719-itogi-torgov-na-mosbirzhe-s-31-avgusta-po-4-sentyabrya"}, {"num": 9, "title": "卢布跌出\"全球最被低估货币\"榜首至第5：PPP均衡32.42卢布/美元、现汇低估2.68倍", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "09-07 04:29", "summary": "俄新社按\"汉堡+薯条+可乐\"购买力平价篮子测算：卢布PPP均衡汇率为32.42卢布/美元，较现汇低估2.68倍，夏末失去全球最被低估货币榜首、退居第5；前四为菲律宾比索、印尼盾、印度卢比、伊朗里亚尔。央行官方汇率（9-5生效沿用）：美元86.59、欧元100.57、人民币12.88卢布。注：排名变化更多反映篮子比价结构，并非卢布显著走强的信号。", "table": [["PPP均衡", "32.42卢布/美元"], ["低估倍数", "2.68倍（较现汇）"], ["排名", "第5（榜首：菲律宾比索）"], ["官方汇率", "美元86.59/欧元100.57/人民币12.88卢布"]], "sourceFull": "https://lenta.ru/news/2026/09/07/rubl-lishilsya-statusa-samoy-nedootsenennoy-valyuty-v-mire"}, {"num": 10, "title": "美妆连锁\"跨界\"卖电器成新增长极：Золотое яблоко俄本土品牌电器销售两年增4.3倍", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-07 02:16", "summary": "Золотое яблоко上半年俄本土品牌（Яндекс/Remez/Kitfort/Redmond等）电器销售额+37%、销量+19%，增速超过店内化妆品等全品类；耳机/音箱金额同比增3.1倍；2026年1-8月较2024年同期电器销售金额增4.3倍、数量增3倍，客单价+15%。Infoline估算：美妆+小家电+个护电器混合盘约4000亿卢布（个护电器约1000亿），俄本土品牌占金额25-30%，智能音箱俄语助手机型份额超96%。Л'Этуаль去年美容设备销售超2亿卢布/7.7万台。", "table": [["H1俄品牌电器", "+37%金额/+19%销量（超化妆品）"], ["耳机/音箱", "金额×3.1"], ["两年增速", "金额×4.3（2026.1-8 vs 2024同期）"], ["俄品牌份额", "金额25-30%（个护电器盘~1000亿卢布）"], ["智能音箱", "俄语助手机型>96%"]], "sourceFull": "https://www.kommersant.ru/doc/8937525"}, {"num": 11, "title": "М.видео获17.5亿卢布7年期授信，投建\"自营+合作自提点+快递柜\"多品类电商平台", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-07 00:10", "summary": "М.видео集团8月与主要债权人签署17.5亿卢布授信（2033年9月到期；8-24股东会批准、8-26落地），资金用于主业发展，包括打造多品类电商平台：自营零售+合作自提点（ПВЗ）+快递柜（постаматы）。债务重组同步推进：6月30日总金融负债1592亿卢布（2025年末1522亿），短债由1500亿降至1325亿，长债由22亿升至267亿，大部分贷款展期最长7年。电器线下连锁加速线上平台化，平台格局再添变量。", "table": [["授信", "17.5亿卢布，2033-09到期"], ["用途", "多品类平台（自营+合作ПВЗ+快递柜）"], ["总负债", "1592亿卢布（6-30）"], ["短债", "1500→1325亿卢布"], ["展期", "最长7年"]], "sourceFull": "https://www.vedomosti.ru/business/articles/2026/09/07/1226734-mvideo-privleklo-kredit"}]}
