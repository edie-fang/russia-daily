{"date": "2026-08-12", "stats": {"total": 22, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "WB广告投放量下降：CPM降10-15%，7月横幅预算降63%", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "08-12 02:16", "summary": "俄大型广告机构消息：WB仓库遭无人机袭击后广告主削减并冻结平台推广预算，波及FMCG、药品、家电、电子等品类，平台CPM（千次展示价）下降10-15%。WB回应称规模被夸大，已两轮发放促销奖金支持卖家。2025年数字零售媒体板块增长58%至5800亿卢布，WB与Ozon均跻身广告主TOP10。", "table": [["7月横幅推广预算环比", "-63%"], ["CPM降幅", "10-15%"], ["2025数字零售媒体市场", "5800亿卢布(+58%)"]], "sourceFull": "https://www.kommersant.ru/doc/8877439"}, {"num": 2, "title": "Ozon在莫斯科州新租14万平方米仓库，Q2订单量增83%", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "08-11 20:58", "summary": "Ozon确认租下莫斯科州\"Инсити Радищево\"6万平方米（作物流枢纽）及\"Никольское-2\"8万平方米（大件商品仓），年租金合计约11-12亿卢布。Q2订单量同比增83%，大件商品线上订单上半年增25%。莫斯科州空置仓库约100万平方米、较去年同期翻倍，上半年物流园成交面积却降48%。", "table": [["新增仓库面积", "14万㎡(6万+8万)"], ["年租金", "约11-12亿卢布"], ["Q2订单量同比", "+83%"]], "sourceFull": "https://www.kommersant.ru/doc/8877453"}, {"num": 3, "title": "WB延长遭袭卖家支持措施至2027年2月，履约成本最高降22%", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "08-11 22:47", "summary": "WB将因乌军袭击仓库受损卖家的支持措施延长至2027年2月，订单履约成本最高可降22%，高价商品节省更多。7月22日起小卖家已开始获赔，卖家获3个月信贷宽限；副总理诺瓦克责成经发部、财政部、税务局与央行研究进一步支持。", "table": [["支持措施延长至", "2027年2月"], ["履约成本最高降幅", "22%"], ["卖家信贷宽限", "3个月"]], "sourceFull": "https://ria.ru/20260811/wildberries-2110333817.html"}, {"num": 4, "title": "土耳其拟提议黑海双走廊，分隔俄乌船只", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-11 23:36", "summary": "据土耳其官方报Yeni Şafak，安卡拉拟提出建立两条安全走廊，分别供驶往俄罗斯和乌克兰的船只通行，要求冲突双方承诺不打击走廊，并可能限制本国渔民在领海外黑海作业。安卡拉尚未官方证实，俄商界消息称该计划符合土方保障航运安全的意图。", "table": [["方案", "俄乌船只分道双走廊"], ["官方确认", "尚未证实"]], "sourceFull": "https://lenta.ru/news/2026/08/11/turtsiya-zahotela-razvesti-suda-rossii-i-ukrainy-v-chernom-more/"}, {"num": 5, "title": "中国警告美国：若通过对俄制裁法案将采取必要反制", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-11 23:50", "summary": "中国驻美使馆发言人刘畅警告，若美参议院通过以已故参议员格雷厄姆命名的对俄伊制裁法案——授权总统对俄油气五大进口国（含中国、印度、日本等）征收100%关税，中方将采取必要措施保护中企与公民合法权益。CNN此前报道该法案已在参议院获通过。", "table": [["拟征关税", "100%(对俄油气五大进口国)"], ["法案状态", "参议院已通过(CNN报道)"]], "sourceFull": "https://lenta.ru/news/2026/08/11/kitay-predupredil-ssha-ob-otvete-na-sanktsii-protiv-rossii/"}, {"num": 6, "title": "41国联合呼吁提前24小时通报弹道导弹试射，含美日韩", "tag": "local", "tagText": "本地", "source": "Interfax", "time": "08-12 02:27", "summary": "美国、日本、韩国等41国发表联合声明，呼吁各国提前24小时通报弹道导弹及运载火箭试射，通报内容含导弹级别、发射区域与预定方向，称此举不限制军事发展但可降低误判风险、增进互信。此声明发布正值朝鲜再次试射弹道导弹（落点日本海）之际。", "table": [["参与国数量", "41国"], ["通报时限", "提前24小时"]], "sourceFull": "https://www.interfax.ru/world/1108783"}, {"num": 7, "title": "塞瓦斯托波尔遭大规模无人机袭击：30余架被击落，8栋房屋受损", "tag": "local", "tagText": "本地", "source": "Interfax", "time": "08-12 03:27", "summary": "8月12日凌晨乌军对塞瓦斯托波尔发动大规模无人机袭击，俄防空与机动火力组击落超30架无人机；巴拉克拉瓦区3栋公寓楼、5栋私宅玻璃及墙体受损，多个区域有坠落碎片引燃草丛，初步无人员伤亡。", "table": [["击落无人机", "超30架"], ["受损房屋", "8栋(3公寓+5私宅)"]], "sourceFull": "https://www.interfax.ru/russia/1108784"}, {"num": 8, "title": "美军CENTCOM在阿曼湾导弹袭击伊朗相关货船Vela Nova", "tag": "local", "tagText": "本地", "source": "Interfax", "time": "08-12 03:44", "summary": "美国中央司令部称，MH-60直升机向试图突破对伊海上封锁、驶往伊朗港口的巴拿马旗货船Vela Nova发射两枚\"地狱火\"导弹击中机舱，致其丧失动力。截至8月11日，CENTCOM已分流55艘试图闯关商船、瘫痪3艘、登船2艘。", "table": [["发射导弹", "2枚地狱火"], ["截至8/11分流商船", "55艘(瘫痪3/登船2)"]], "sourceFull": "https://www.interfax.ru/world/1108787"}, {"num": 9, "title": "伊朗经中间人向美国转交开放霍尔木兹海峡条件", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-11 19:56", "summary": "伊朗最高国家安全委员会秘书雷扎伊称，美方须停止对伊战争、解冻被扣押的伊朗资产、结束包括黎巴嫩和加沙在内的中东冲突，否则海峡不会开放。此前特朗普宣称美军控制霍尔木兹海峡并维持对伊海上封锁。", "table": [["开放条件", "停战/解冻资产/结束中东冲突"], ["当前状态", "美方未回应"]], "sourceFull": "https://lenta.ru/news/2026/08/11/iran-peredal-ssha-usloviya-otkrytiya-ormuzskogo-proliva/"}, {"num": 10, "title": "数据修正：Brent 8月11日盘中曾突破90美元/桶（多家俄媒证实）", "tag": "local", "tagText": "本地", "source": "eprussia.ru(Финам/oilexp)", "time": "08-11 12:04", "summary": "8月11日多家俄媒（eprussia、Финам、oilexp、vestikavkaza等）报道Brent盘中自7月31日以来首次突破90美元/桶，主因霍尔木兹海峡封锁持续；Interfax同日午后则报Brent回落至87.37美元。此前日报\"Brent盘中最高89.06未破90\"仅反映早盘9:39时段数据，特此修正。", "table": [["Brent盘中高点", "破90美元/桶"], ["Interfax午后报价", "87.37美元/桶"], ["上次破90", "7月31日"]], "sourceFull": "https://ria.ru/20260811/neft-2110145007.html"}, {"num": 11, "title": "俄7月单月预算赤字7200亿卢布，累计6.5万亿占GDP2.8%", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "08-11 20:18", "summary": "俄财政部8月11日数据：7月支出4.21万亿、收入3.49万亿，单月赤字7200亿卢布；1-7月累计赤字6.5万亿卢布（占GDP2.8%），已达全年计划（1.6%GDP）的1.7倍。非油气收入1-7月同比+18.3%至17.5万亿卢布，其中增值税贡献9.8万亿（+24.9%）。", "table": [["7月单月赤字", "7200亿卢布"], ["1-7月累计赤字", "6.5万亿卢布(占GDP2.8%)"], ["非油气收入1-7月", "17.5万亿卢布(+18.3%)"]], "sourceFull": "https://www.kommersant.ru/doc/8877440"}, {"num": 12, "title": "央行：7月俄居民现金需求加速增长，流通现金新增7000亿卢布", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-11 20:39", "summary": "俄央行数据：7月国内流通现金增加7000亿卢布，高于6月的5000亿。分析认为与增值税上调后企业倾向现金收款、存款利率持续下行促使居民取现、部分区域网络受限难以线上支付等因素有关。", "table": [["7月流通现金增量", "7000亿卢布"], ["6月增量", "5000亿卢布"]], "sourceFull": "https://lenta.ru/news/2026/08/11/tsb-ukazal-na-uskorenie-tempov-rosta-sprosa-rossiyan-na-nalichnye/"}, {"num": 13, "title": "巴拿马运河通行均价创纪录：8月日均拍卖槽位约110万美元，同比涨16倍", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "08-12 01:51", "summary": "据FT援引运河管理局数据，8月巴拿马运河日拍卖通行槽位均价约110万美元，同比涨16倍；大闸门均价250万美元，个别槽位28日起拍出378万、263万美元。排队船只从1月2日40艘增至8月3日113艘，主因厄尔尼诺低水位叠加霍尔木兹海峡关闭引发改道潮。", "table": [["8月日均槽位价", "约110万美元(同比+16倍)"], ["大闸门均价", "250万美元"], ["排队船只(8/3)", "113艘"]], "sourceFull": "https://ria.ru/20260812/kanal-2110346293.html"}, {"num": 14, "title": "7月中国新车在俄销量同比降27%至4.8万辆", "tag": "local", "tagText": "本地", "source": "TASS", "time": "08-12 04:46", "summary": "\"Газпромбанк автолизинг\"研究显示，2026年7月俄罗斯市场中国品牌新车销量同比下滑27%至约4.8万辆，系年内显著调整。此前中国品牌曾连续数月高增长，本轮下滑或与市场需求降温及库存周期有关。", "table": [["7月中国品牌新车销量", "约4.8万辆"], ["同比", "-27%"]], "sourceFull": "https://tass.ru/ekonomika/28004235"}, {"num": 15, "title": "中国公司最快下周开通经北方海路的定期集装箱航线", "tag": "local", "tagText": "本地", "source": "TASS", "time": "08-12 04:25", "summary": "据Global Times报道，中国公司计划开通经北方海路（Севморпуть）的定期集装箱运输航线，常规班期最快下周启动。该航线为亚欧货物运输提供绕开传统红海/苏伊士通道的新选择，俄方一直推动北方海路商业化运营。", "table": [["启动时间", "最快下周"], ["航线", "中国⇄欧洲(经北方海路)"]], "sourceFull": "https://tass.ru/ekonomika/28004197"}, {"num": 16, "title": "央行将比特币、以太坊、USDT纳入俄交易所可公开交易清单", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "08-11 13:08", "summary": "俄央行将BTC、ETH、Tether USDT列入俄交易所可公开交易加密货币清单，依据市值、日均成交额及境外定价历史筛选。合格投资者可无限制买卖，非合格投资者经每家中介年购限额30万卢布，交易前须通过测试并了解风险。", "table": [["纳入品种", "BTC/ETH/USDT"], ["非合格投资者年购限额", "30万卢布/中介"]], "sourceFull": "https://ria.ru/20260811/bitkoin-2110201078.html"}, {"num": 17, "title": "7月最降价食品榜：西红柿环比降12.7%领跌", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "08-12 04:54", "summary": "俄食品生产者联盟（Руспродсоюз）数据：截至8月3日，7月西红柿零售均价环比下降12.7%，为月度最大跌幅；罗宋汤蔬菜组合（洋葱、胡萝卜、甜菜等）整体领跌月度降价榜。", "table": [["西红柿月环比跌幅", "-12.7%"], ["统计截止", "8月3日"]], "sourceFull": "https://ria.ru/20260812/pomidory-2110354789.html"}, {"num": 18, "title": "NSPK警告Visa/Mastercard证书更换或致在线支付故障，建议改用Мир卡", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "08-12 04:53", "summary": "俄国家支付卡系统（NSPK）警告，Visa/MC安全证书更换后俄持卡人可能遭遇在线支付失败，建议更换为Мир卡。Мир卡占俄交易量75%，可通过СБП、QR码及银行Pay服务替代。受影响卡多为制裁前发行、仍由NSPK清算的老卡。", "table": [["Мир卡交易占比", "75%"], ["风险", "Visa/MC证书更换致在线支付失败"]], "sourceFull": "https://ria.ru/20260812/bank-2110354937.html"}, {"num": 19, "title": "Перекрёсток与Natura Siberica联名自有护肤化妆品线开售", "tag": "local", "tagText": "本地", "source": "New-Retail", "time": "08-11 13:49", "summary": "俄大型连锁超市\"Перекрёсток\"（十字路口）开始销售与本土美妆品牌Natura Siberica合作开发的自有护肤化妆品线，标志零售商自有品牌向美妆品类扩张。俄零售业近年加速自有品牌化，美妆类目竞争加剧。", "table": [["参与方", "Перекрёсток×Natura Siberica"], ["品类", "自有护肤化妆品线"]], "sourceFull": "https://new-retail.ru/"}, {"num": 20, "title": "俄电子电器店客流同比+9%，DIY店+6%（Focus Technologies）", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "08-12 00:38", "summary": "据\"Известия\"援引Focus Technologies数据：7月6日至8月2日俄电子电器商店客流同比增9%（去年同期仅+2%），家装DIY店客流+6%（去年同期-2%）。专家称与季节性促销、新品季备货及WB物流中断促使部分消费者转线下购买有关。", "table": [["电子电器店客流", "+9%(去年+2%)"], ["DIY店客流", "+6%(去年-2%)"], ["统计区间", "7/6-8/2"]], "sourceFull": "https://ria.ru/20260812/magaziny-2110341720.html"}, {"num": 21, "title": "М.Видео：上半年俄售数码相机21.9万台，创六年新高", "tag": "local", "tagText": "本地", "source": "TASS", "time": "08-12 00:07", "summary": "俄最大电子零售商\"М.Видео\"数据：2026年1-6月俄居民购买数码相机21.9万台，为六年来同期最高。数码相机市场回暖与出境旅行恢复、内容创作需求增长相关，无反相机为增长主力。", "table": [["上半年销量", "21.9万台"], ["对比", "六年同期新高"]], "sourceFull": "https://tass.ru/ekonomika/28004119"}, {"num": 22, "title": "💡 灯具：本期无新增重大动态", "tag": "local", "tagText": "本地", "source": "综合检索(RIA/Lenta/Interfax/TASS/Kommersant)", "time": "08-12 10:55", "summary": "2026年8月10-12日窗口内，RIA/Lenta/Interfax/TASS/Kommersant检索未见俄罗斯灯具照明市场新增重大新闻。按去重规则标注：本期无新增重大动态，不填充旧信息。", "table": [], "sourceFull": ""}]}
