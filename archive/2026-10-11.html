{"date": "2026-10-11", "stats": {"total": 14, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "cat": "platform", "catText": "平台规则变动", "title": "俄政府开通「商品卡片统一核验服务」（基于 ЕСНСИ），90 天后对全部电商参与者强制", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-10 11:00", "summary": "俄政府 10-09 签署决议，向市场平台开放基于「统一规范参考信息体系（ЕСНСИ）」的商品卡片核验服务，汇聚 Роспатент、ЕАЭС 药品注册簿、农药与农化品登记簿等 9 个国家级信息系统数据，用于上架前自动核验商品资质，配套 10-01 生效的《平台经济法》。决议自正式公布之日起生效，公布满 90 天后该服务对全部电商参与者强制使用。", "table": [["⏱ 生效时间", "公布即生效（约 2026-10-10）；满 90 天后强制（约 2027-01-08）"], ["🎯 实际影响", "上架/合规环节：卡片资质信息将与国家系统自动交叉核验，缺失或不一致将影响审核通过；灯具(EAC/СГР)、家电(EAC)、化妆品等强合规类目最直接"], ["✅ 建议动作", "合规+运营在 10 月内逐 SKU 核对证书/声明编号与申报主体，并向俄代/认证机构确认已进入国别登记系统"]], "sourceFull": "https://www.retail.ru/news/marketpleysam-otkryli-dostup-k-edinomu-servisu-proverki-kartochek-tovarov-10-oktyabrya-2026-283171/"}, {"num": 2, "cat": "ecom", "catText": "电商动态", "title": "«Продо»：e-com 已从货架补充变为完整销售渠道，快消品牌加速线上化", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-09 15:41", "summary": "俄大型食品生产商 «Продо» 在行业活动中表示，电商渠道已不再是线下货架的补充，而是独立的完整销售渠道，公司据此重构品类、包装与促销节奏。同期零售信号同向：连锁 «Монетка» 通报自有品牌需求上升、«ВкусВилл» 报告大包装与细分品类需求增长，调查显示 8 成 35 岁以上俄消费者购前观看商品视频。含义：线上渠道话语权继续上升，供货方与平台的议价结构向平台倾斜。", "table": [["主体", "«Продо»（俄食品生产商）"], ["渠道定性", "e-com 为独立完整渠道（非货架补充）"], ["同期信号", "自有品牌/大包装需求上升；8 成 35+ 消费者购前看视频"]], "sourceFull": "https://www.retail.ru/news/prodo-e-com-uzhe-ne-dopolnenie-k-polke-a-polnotsennyy-kanal-prodazh-9-oktyabrya-2026-283152/"}, {"num": 3, "cat": "ecom", "catText": "电商动态", "title": "Ozon fresh：俄消费者生鲜订单翻倍，梨/李/鸡油菌需求同比约 ×2", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-09 13:21", "summary": "Ozon 通报其生鲜业务（Ozon fresh）秋季需求显著走高：梨、李与鸡油菌类订单同比增长约 2 倍，生鲜正成为平台拉高购买频次与客单的重要品类。结合平台对本地农场与短保商品履约（前置仓与温控链）的持续投入，生鲜与短保品类正在成为俄电商争夺的下一个高频入口。含义：生鲜类目扩张会继续挤压传统商超的线上份额，并抬高对温控物流与包装的需求。", "table": [["平台", "Ozon（Ozon fresh）"], ["品类", "梨/李/鸡油菌等生鲜"], ["变化", "订单量同比约 ×2"]], "sourceFull": "https://www.retail.ru/news/ozon-fresh-rossiyane-stali-v-2-raza-chashche-zakazyvat-grushi-slivy-i-lisichki-9-oktyabrya-2026-283145/"}, {"num": 4, "cat": "econ", "catText": "经济金融", "title": "俄部分解除柴油出口禁令：首期 50 万吨进入国际市场（10-10 即日生效）", "tag": "local", "tagText": "本地", "source": "Interfax", "time": "10-10 21:28", "summary": "俄政府 10-10 宣布部分解除柴油出口禁令并即日生效，依据普京与特朗普通话共识，首期允许向国际市场投放 50 万吨柴油；Новак 表示 10 月可供 30 万吨、11 月 50 万吨、12 月至 100 万吨，后续月度上限有望达 300 万吨。此前禁令对生产商有效至 10-31、对非生产商至 2027-01-31；航空煤油禁运至 11-30、汽油全面禁运至 2027-01-31 不变。同期美国共和党议员宣布拟提全面禁止采购俄油的跨党派法案。", "table": [["生效时间", "2026-10-10（即日）"], ["首期规模", "50 万吨柴油（10 月 30 万 / 11 月 50 万 / 12 月至 100 万吨）"], ["仍受限", "汽油禁运至 2027-01-31；航空煤油至 2026-11-30"], ["同期风险", "美议员拟提全面禁购俄油法案（待审议）"]], "sourceFull": "https://www.interfax.ru/world/1121623"}, {"num": 5, "cat": "econ", "catText": "经济金融", "title": "关键行情：Brent 收于约 $104.7（10-09 收），央行汇率维持美元 84.90/欧元 94.97/人民币 12.67", "tag": "local", "tagText": "本地", "source": "俄央行(CBR)｜ICE", "time": "10-11 10:00", "summary": "周末俄市场休市：Brent 最近收盘（10-09）约 $104.7/桶，较前一交易日小幅走高；地缘与油品供应扰动（霍尔木兹油轮遇袭、美方战略储备释放）继续支撑油价。俄央行 10-10 公布的官方汇率为美元 84.9048 ₽、欧元 94.9745 ₽、人民币 12.6739 ₽，周末维持不变；莫交所指数因周末休市本期未取得，不以上一交易日数据充数。对跨境卖家：结汇成本与卢布结算价随油价与制裁预期波动，需关注月度锁汇窗口。", "table": [["Brent", "约 $104.7/桶（10-09 收，周末休市）"], ["美元/欧元", "84.9048 / 94.9745 ₽"], ["人民币", "12.6739 ₽"], ["莫交所指数", "周末休市，本期未取得"]], "sourceFull": "https://www.cbr.ru/currency_base/daily/?date_req=10.10.2026"}, {"num": 6, "cat": "econ", "catText": "经济金融", "title": "2027 年最低工资（МРОТ）定为 28 935 ₽，同比 +6.8%", "tag": "local", "tagText": "本地", "source": "消息报(Izvestia)｜连塔网(Lenta.ru)", "time": "10-11 03:54", "summary": "据 2027 年联邦预算法案，2027 年俄最低月工资（МРОТ）将为 28 935 ₽，较 2026 年的 27 093 ₽ 增长 6.8%，与预期平均工资增速挂钩；官方目标是 2030 年达到 35 000 ₽。含义：人力与外包成本基准继续抬升，仓储、分拣与客服等劳动密集型环节的用工成本上升，旺季临时用工报价与外包服务费将同步走高，需在下一年度预算中体现。", "table": [["2027 МРОТ", "28 935 ₽/月"], ["2026 МРОТ", "27 093 ₽/月"], ["涨幅", "+6.8%"], ["2030 目标", "35 000 ₽"]], "sourceFull": "https://iz.ru/2182227/professor-zayavil-ob-uvelichenii-mrot-v-2027-godu-na-68"}, {"num": 7, "cat": "econ", "catText": "经济金融", "title": "美国能源部批准紧急释放战略石油储备（SPR），油品与运费预期重定价", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "10-10 22:35", "summary": "美方 Минэнерго 批准紧急释放战略石油储备（SPR），叠加霍尔木兹海峡油轮遇袭与俄柴油部分解禁，全球油品与运费预期同步重定价。对俄市场含义：一是成品油（柴油/汽油）内外盘价差与出口节奏更易波动；二是运输与仓储燃油成本预期上行，跨境物流附加费与海运费存在上调压力，旺季备货需提前锁定运价。", "table": [["措施", "美国战略石油储备（SPR）紧急释放获批"], ["触发", "中东供应扰动与油轮遇袭"], ["关联", "俄柴油部分解禁（同期）"]], "sourceFull": "https://ria.ru/20261010/minenergo-2123735031.html"}, {"num": 8, "cat": "econ", "catText": "经济金融", "title": "普京：本农业年度粮食产量再超 1 亿吨，全年预计约 1.4 亿吨", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "10-11 00:10", "summary": "普京在农业工作者日视频讲话中表示，本年度将再获「体面的」粮食收成，产量已突破 1 亿吨；农业部长此前预计 2026 年粮食总产约 1.4 亿吨（2025 年约 1.4 亿吨、其中小麦 9 100 万吨）。含义：粮食产能与出口能力维持高位对卢布与财政形成支撑；对食品及农产品类目卖家，原料端供应与出口配额政策仍是关键变量。", "table": [["已收获", "突破 1 亿吨"], ["2026 预期", "约 1.4 亿吨"], ["2025 实际", "约 1.4 亿吨（小麦 9 100 万吨）"]], "sourceFull": "https://ria.ru/20261011/putin-2123741188.html"}, {"num": 9, "cat": "politics", "catText": "时政要闻", "title": "俄多地机场因无人机威胁临时管制：萨马拉、下诺夫哥罗德、奔萨、萨兰斯克、萨拉托夫、伏尔加格勒、索契", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)｜塔斯社(ТАСС)", "time": "10-11 03:18", "summary": "10-11 凌晨，俄航空署对萨马拉、下诺夫哥罗德、奔萨、萨兰斯克、萨拉托夫、伏尔加格勒及索契等机场先后实施临时起降限制（同期图拉州通报击落 5 架无人机），多数机场在数小时内恢复运行。含义：空域管制与无人机袭击趋于常态化，干线空运时效与保险条款不确定性上升，高价值小件走空运的卖家需预留时效缓冲并向货代确认改道方案。", "table": [["管制机场", "萨马拉/下诺夫哥罗德/奔萨/萨兰斯克/萨拉托夫/伏尔加格勒/索契"], ["时段", "10-11 凌晨（数小时内恢复）"], ["同期", "图拉州击落 5 架无人机"]], "sourceFull": "https://ria.ru/20261011/ogranicheniya-2123749108.html"}, {"num": 10, "cat": "politics", "catText": "时政要闻", "title": "乌方无人机袭击俄境内铁路桥：布良斯克州桥梁受损，罗斯托夫州 13 趟列车晚点", "tag": "local", "tagText": "本地", "source": "连塔网(Lenta.ru)｜Interfax", "time": "10-10 13:04", "summary": "乌方无人机夜间袭击布良斯克州维戈尼奇区一座铁路桥，桥面受损、无人员伤亡；同日罗斯托夫州铁路桥亦遭破坏，导致 13 趟列车晚点。铁路是俄境内电商干线运输的重要方式，连续针对性打击将放大线路改道、时效延误与运费波动风险，卖家需在旺季备货排期中预留 1–2 天冗余并关注承运商改道通知。", "table": [["受损设施", "布良斯克州铁路桥（维戈尼奇区）"], ["连带", "罗斯托夫州铁路桥受损，13 趟列车晚点"], ["伤亡", "无"]], "sourceFull": "https://lenta.ru/news/2026/10/10/vsu-atakovali-esche-odin-zheleznodorozhnyy-most-v-rossii/"}, {"num": 11, "cat": "politics", "catText": "时政要闻", "title": "库尔斯克州：无人机击中购物中心并引爆弹药，2 人受伤", "tag": "local", "tagText": "本地", "source": "Interfax", "time": "10-10 20:16", "summary": "库尔斯克州通报，一架无人机击中当地购物中心区域并引发弹药爆炸，2 人受伤。民用商业设施（购物中心、仓储）遭袭风险持续存在，对线下门店与临近商业设施的仓储布局构成安全与保险压力；结合平台侧保险产品收紧，俄乌冲突对零售终端与库存保障的直接冲击仍在扩大。", "table": [["地点", "库尔斯克州（购物中心）"], ["伤亡", "2 人受伤"], ["方式", "无人机袭击 + 弹药爆炸"]], "sourceFull": "https://www.interfax.ru/russia/1121620"}, {"num": 12, "cat": "politics", "catText": "时政要闻", "title": "特朗普：乌克兰应举行选举、需要能达成协议的新领导人；美乌迈阿密会谈提前结束", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)｜Interfax", "time": "10-11 04:07", "summary": "特朗普公开表示泽连斯基应举行选举，并称乌克兰需要一位能与莫斯科达成协议的新领导人；同时批评乌方未听从美方劝阻、仍袭击俄炼油设施。美乌代表在迈阿密的会谈原定两天，因柴油协议等因素提前结束。含义：美俄能源与制裁议题进入交易化阶段，制裁口径与能源流向的政策不确定性升高，需持续关注二级制裁与结算通道变化。", "table": [["表态人", "美国总统特朗普"], ["要点", "乌应举行选举；需新领导人达成协议"], ["会谈", "美乌迈阿密会谈提前结束"]], "sourceFull": "https://ria.ru/20261011/tramp-2123750439.html"}, {"num": 13, "cat": "politics", "catText": "时政要闻", "title": "亚美尼亚籍 ЕЭК 部长 Симонян 被指涉假证与延宕 ЕАЭС 信息系统", "tag": "local", "tagText": "本地", "source": "连塔网(Lenta.ru)", "time": "10-10 12:36", "summary": "据媒体调查，亚美尼亚籍 ЕЭК 部长 Варос Симонян 被指在任亚美尼亚经济部副部长期间纵容或推动「无实测即出证」的实验室体系，涉向俄供应假冒商品的认证链条；并被指影响 ЕАЭС 统一数字服务（ИИС，用于追踪证书有效性）的按期上线。含义：ЕАЭС 证书（EAC）真实性核验链条本身存在漏洞，跨境卖家应优先自查证书出具机构资质与登记状态。", "table": [["当事人", "Варос Симонян（ЕЭК 部长，亚美尼亚）"], ["指控", "涉假证 / 无实测出证；延宕 ЕАЭС ИИС 上线"], ["风险", "ЕАЭС 证书核验链条漏洞"]], "sourceFull": "https://lenta.ru/news/2026/10/10/falsifikat/"}, {"num": 14, "cat": "other", "catText": "其它动态", "title": "Yandex Cloud 可用区出现供电中断（更新）", "tag": "local", "tagText": "本地", "source": "塔斯社(ТАСС)", "time": "10-11 04:25", "summary": "继 10-08/10-09 «Яндекс» 梁赞州与卡卢加数据中心遇袭、«Алиса» AI 部分功能异常之后，10-11 凌晨 Yandex Cloud 的一个可用区再次出现供电中断。依赖 Яндекс 生态（Маркет、「Алиса」、客服机器人）的卖家后台、站内推荐与自动化工具可能短时受影响。建议关键运营系统做多云备份与降级预案，避免对单一基础设施的依赖。", "table": [["事件", "Yandex Cloud 可用区供电中断"], ["时间", "2026-10-11 凌晨"], ["背景", "10-08/10-09 两座数据中心遇袭；«Алиса» 功能异常"]], "sourceFull": "https://tass.ru/proisshestviya/28202595"}]}
