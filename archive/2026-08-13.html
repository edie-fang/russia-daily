{"date": "2026-08-13", "stats": {"total": 23, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "俄企业家更常自建网店：8月首周Yandex KIT新卖家注册量环比增2.5倍", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-12 14:56", "summary": "俄企业家越来越倾向自建独立网店与市场平台并行发展：8月第一周，俄Yandex KIT网店建站平台新注册卖家数量环比上月同期增长2.5倍；7月底平台新卖家注册数已较月初翻倍，已上线运营的店铺一周内再增约三分之一。该平台提供带交钥匙物流的独立网店建站服务，商家可借此降低对单一平台的依赖。", "table": [["新卖家注册量环比", "+2.5倍(8月首周)"], ["7月底注册数较月初", "+100%"]], "sourceFull": "https://ria.ru/20260812/rossija-2110468539.html"}, {"num": 2, "title": "俄市场平台完成危险减肥BАД排查：含西布曲明商品已全部下架", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-12 17:11", "summary": "АКИТ称，俄各市场平台已完成对减肥类BАД商品卡片的排查，被Роспотребнадзор点名含西布曲明的商品已从线上货架隐藏。此前媒体曝光部分BАД冒用欧美品牌销售，含强效成分西布曲明，可致严重精神损害与心脏问题。平台方表示查实违规将封禁卖家。此为8月11日Ozon与WB自查事件的官方收尾进展。", "table": [["涉及平台", "俄各主要市场平台"], ["处置方式", "隐藏商品卡片+封禁违规卖家"]], "sourceFull": "https://ria.ru/20260812/marketplejsy-2110509276.html"}, {"num": 3, "title": "Wildberries应用重返美国App Store，可重新下载更新", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-12 19:23", "summary": "Wildberries应用再次在美区App Store恢复上架，可正常下载和更新。当日稍早RIA记者核实该应用曾一度从美区商店下架（已安装版本仍可使用），随后平台方确认恢复。这是WB在与美国市场准入相关波折中的最新状态，反映俄头部电商平台与海外应用商店关系的反复。", "table": [], "sourceFull": "https://ria.ru/20260812/wildberries-2110535072.html"}, {"num": 4, "title": "梅德韦杰夫：市场平台已成民生系统性元素，遭袭因敌人与普通俄民众为敌", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-12 19:28", "summary": "俄联邦安全会议副主席梅德韦杰夫12日表示，市场平台已成为保障民众基本社会需求的系统性元素，敌人在冲突中打击市场平台，本质是在与普通俄罗斯人作战。他称十年前几乎无人知晓市场平台一词，如今其已是俄社会生活的重要组成部分。此表态回应近期乌军无人机对WB等平台物流设施的连串袭击。", "table": [], "sourceFull": "https://ria.ru/20260812/medvedev-2110535997.html"}, {"num": 5, "title": "美军自重启对伊封锁以来已拦截59艘商船，瘫痪3艘、登船2艘", "tag": "local", "tagText": "本地", "source": "国际文传电讯社(Interfax)", "time": "08-12 23:22", "summary": "美国中央司令部称，自7月14日重启对伊朗海上封锁以来，截至8月12日已拦截并改道59艘与伊朗相关的商船，其中瘫痪3艘、登船检查2艘，以确保封锁完全执行。较此前报道的55艘进一步增加。霍尔木兹海峡相关紧张局势持续影响国际航运与油价。", "table": [["拦截商船", "59艘"], ["瘫痪/登船", "3艘/2艘"], ["封锁重启日", "7月14日"]], "sourceFull": "https://www.interfax.ru/world/1108980"}, {"num": 6, "title": "塞瓦斯托波尔遭乌军袭击停电，市长称正在抢修", "tag": "local", "tagText": "本地", "source": "国际文传电讯社(Interfax)", "time": "08-13 00:14", "summary": "8月13日凌晨乌军对俄能源基础设施发动袭击，塞瓦斯托波尔市暂时全面停电，市长拉兹沃扎耶夫确认城市暂时失去供电，相关设施已进入特殊状态，专家正评估受损规模并恢复供电。这是近期克里米亚方向能源设施遭袭的最新一起。", "table": [], "sourceFull": "https://www.interfax.ru/russia/1108984"}, {"num": 7, "title": "克里米亚大桥临时关闭约1.5小时后恢复通行", "tag": "local", "tagText": "本地", "source": "国际文传电讯社(Interfax)", "time": "08-13 03:27", "summary": "克里米亚大桥8月13日凌晨约1时56分起临时禁止车辆通行，信息中心通报临时封闭，约一个半小时后（3时27分）恢复通车。此前俄南方多个机场（萨马拉、索契、乌里扬诺夫斯克、克拉斯诺达尔等）亦因安全原因短暂限航，相关限制随后陆续解除。", "table": [["关闭时段", "01:56-03:27(约1.5小时)"]], "sourceFull": "https://www.interfax.ru/russia/1108996"}, {"num": 8, "title": "普京在南萨哈林斯克主持东部边界安全会议", "tag": "local", "tagText": "本地", "source": "国际文传电讯社(Interfax)", "time": "08-13 03:44", "summary": "俄罗斯总统普京13日在前往南萨哈林斯克出席太平洋舰队演习收官阶段期间，主持召开保障俄东部边界安全会议。普京强调，主要任务当前在特别军事行动前线解决，但国家有义务保障所有边界、所有领土的安全，并听取了地区局势评估与补充建议。", "table": [], "sourceFull": "https://www.interfax.ru/russia/1108997"}, {"num": 9, "title": "7月俄通胀放缓至0.54%（月环比），年化降至5.98%", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-12 19:09", "summary": "俄统计局数据：7月CPI环比上涨0.54%（6月为0.87%），同比降至5.98%（6月为6.02%）。食品价格7月环比仅+0.29%，非食品+1.26%，服务+0.19%。另据统计局，8月4-10日一周俄整体呈0.06%的通缩。通胀放缓与果蔬降价、卢布汇率波动等因素相关，市场关注央行后续利率路径。", "table": [["7月CPI环比", "+0.54%(6月+0.87%)"], ["7月CPI同比", "+5.98%(6月+6.02%)"], ["8/4-10周度", "-0.06%通缩"]], "sourceFull": "https://ria.ru/20260812/infljatsija-2110533154.html"}, {"num": 10, "title": "上半年俄GDP同比增0.6%，二季度增速1.3%大超央行与经发部预期", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-12 19:05", "summary": "俄经发部评估上半年GDP同比增长0.6%（7月底曾估0.3%）。统计局12日发布二季度初值：同比+1.3%，明显高于央行（0.8%）和经发部（0.9%）的预期，统计局称差异或源于私人消费估算。但7月以来高频数据显示经济复苏并不稳固，私人部门活跃度续降。", "table": [["上半年GDP", "+0.6%同比"], ["Q2 GDP初值", "+1.3%(央行预期0.8%/经发部0.9%)"]], "sourceFull": "https://ria.ru/20260812/ekonomika-2110532446.html"}, {"num": 11, "title": "OPEC下调2026年全球石油需求增长预期至58万桶/日", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-12 15:02", "summary": "OPEC 8月月报将2026年全球石油需求增长预期下调20万桶/日至58万桶/日（7月预期78万桶/日），全年需求预计105.74百万桶/日；同时将2027年需求增长预期上调至216万桶/日（原194万桶/日），2027年总需求约107.9百万桶/日。需求预期下修反映全球经济放缓与能源转型压力。", "table": [["2026需求增长预测", "58万桶/日(下调20万)"], ["2026总需求", "105.74百万桶/日"], ["2027增长预测", "216万桶/日(上调)"]], "sourceFull": "https://ria.ru/20260812/opek-2110470608.html"}, {"num": 12, "title": "金价突破4500美元/盎司，为6月5日以来首次", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-12 16:44", "summary": "纽约Comex 12月期金12日盘中涨1.18%至4495.67美元/盎司，并首次自6月5日以来升破4500美元关口。金价上涨受地缘局势紧张（霍尔木兹海峡封锁、中东冲突持续）及避险资金流入推动。", "table": [["Comex期金", "4495.67美元/盎司(+1.18%)"], ["破4500", "6月5日以来首次"]], "sourceFull": "https://ria.ru/20260812/zoloto-2110498560.html"}, {"num": 13, "title": "俄汽油价格一周内在45个地区下降，达吉斯坦降超9%", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-12 19:15", "summary": "据俄统计局数据测算，8月4-10日一周俄45个地区汽油价格环比下降：达吉斯坦降幅超9%、布良斯克州约5%，另有4个地区降幅超3%（塞瓦斯托波尔、托木斯克、弗拉基米尔、秋明州含亚马尔与汉特-曼西自治区）。燃料零售价持续回落，与政府保障供应、稳定油市的措施相关。", "table": [["降价地区数", "45个"], ["最大降幅", "达吉斯坦-9%+"]], "sourceFull": "https://ria.ru/20260812/benzin-2110533947.html"}, {"num": 14, "title": "8月上旬俄10大银行存款最高平均利率升至12.89%", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-12 14:26", "summary": "俄央行数据：吸引居民卢布存款最多的10家银行，8月第一旬平均最高存款利率环比上升0.04个百分点至12.89%年化。历史最高纪录为2024年12月第二旬的22.28%，最低为2020年10月第一旬的4.33%。存款利率缓升显示银行竞争揽储意愿增强。", "table": [["10行最高平均利率", "12.89%(+0.04pp)"], ["历史最高", "22.28%(2024年12月)"]], "sourceFull": "https://ria.ru/20260812/stavka-2110460663.html"}, {"num": 15, "title": "俄央行大幅上调美元官方汇率：8月13日约83卢布（+63戈比）", "tag": "local", "tagText": "本地", "source": "Lenta.ru", "time": "08-12 18:10", "summary": "俄央行12日公布的官方汇率显示，8月13日美元官方汇率将升至约83卢布，较12日的82.37卢布上调63戈比；欧元官方汇率上调60戈比至95.78卢布，人民币在莫斯科交易所约12.25-12.3卢布。Альфа-Форекс预计8月中旬美元或达84.5卢布；俄外贸银行行长科斯京称对俄经济更优的美元区间为90-100卢布。", "table": [["美元官方汇率(8/13)", "约83卢布(+63戈比)"], ["欧元官方汇率(8/13)", "95.78卢布(+60戈比)"]], "sourceFull": "https://lenta.ru/news/2026/08/12/tsb-rezko-povysil-kurs-dollara/"}, {"num": 16, "title": "俄炼油量8月或降至400万桶/日创纪录新低（Kpler预测）", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-12 19:36", "summary": "据Kpler预测，受计划外检修与停工影响，8月俄炼厂加工量可能降至400万桶/日，较7月的420万桶/日降近5%，比6月（410万桶/日，已是近年低点）低约2.5%。业内已不指望年内回到530-550万桶/日常态水平，9月或因产能恢复略有回升。部分地区的燃油限售措施已重新收紧。", "table": [["8月炼油量预测", "400万桶/日(7月420万)"], ["年内容量常态", "530-550万桶/日"]], "sourceFull": "https://www.kommersant.ru/doc/8878289"}, {"num": 17, "title": "土耳其因航运风险寻求替代俄罗斯煤炭", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-12 20:10", "summary": "在黑海航运风险上升背景下，土耳其开始寻找替代俄罗斯煤炭的供应来源。俄土煤炭贸易受制裁、保险与航运安全多重因素制约，安卡拉正评估其他产煤国供应方案。土耳其是俄煤炭重要买家之一，此举或进一步影响俄能源出口流向。", "table": [], "sourceFull": "https://www.kommersant.ru/doc/8878283"}, {"num": 18, "title": "黄瓜成俄年初以来最便宜商品：公斤均价降2.5倍", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-12 22:18", "summary": "据俄统计局数据，黄瓜是2026年初以来俄降价幅度最大的商品：1月全国均价299卢布/公斤，7月降至121.1卢布/公斤，下降2.5倍。西红柿紧随其后降27%至186.2卢布/公斤，橙子降15%至137.98卢布/公斤。时令果蔬集中上市叠加通胀放缓，食品价格持续回落。", "table": [["黄瓜均价", "299→121.1卢布/公斤(1-7月)"], ["西红柿", "-27%至186.2卢布"], ["橙子", "-15%至137.98卢布"]], "sourceFull": "https://ria.ru/20260812/ogurtsy-2110554858.html"}, {"num": 19, "title": "俄微贷公司数量五年来首次增长：803家，同比+8.4%", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-13 03:59", "summary": "据Контур.Фокус数据，截至2026年8月1日俄以小额信贷业务为主营的微贷公司（МФО）达803家，较上年同期增8.4%，为2022年有观察记录以来首次正增长（2022年8月为811家后持续收缩）。分析认为与监管环境稳定、消费信贷需求回升有关。", "table": [["МФО数量", "803家(+8.4%同比)"], ["上次正增长", "2022年(五年来首次)"]], "sourceFull": "https://ria.ru/20260813/mfo-2110577794.html"}, {"num": 20, "title": "俄企业加速采用中国大模型：Yandex AI Studio上半年消耗5970亿token", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-13 02:33", "summary": "据Ъ对俄主流云平台的调查，2026年上半年俄企业对海外大语言模型（LLM）调用量成倍增长且需求转向中国厂商：Yandex AI Studio上半年消耗5970亿token（为去年同期18倍），其中Yandex自家模型占54%，阿里Qwen占21.2%、DeepSeek占13.5%、OpenAI GPT-OSS占7.5%。企业选中国模型主因价格低、开源且可在俄云端私有化部署。", "table": [["AI Studio上半年token", "5970亿(18倍)"], ["Qwen/DeepSeek占比", "21.2%/13.5%"]], "sourceFull": "https://www.kommersant.ru/doc/8878331"}, {"num": 21, "title": "ЕЭК暂停对华二氧化钛反倾销税：EAEU唯一生产商停产，化妆品/涂料原料承压", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-12 18:46", "summary": "因克里米亚Титановые инвестиции工厂（EAEU唯一二氧化钛生产商）停产，欧亚经济委员会（ЕЭК）宣布在复审期间暂停对自中国进口二氧化钛的反倾销税。2025年该税曾上调，但下游涂料、化妆品等行业称无法完全替代中国货源。此举将缓解俄本土化妆品及涂料企业的原料成本压力。", "table": [["政策", "暂停对华二氧化钛反倾销税"], ["原因", "EAEU唯一生产商停产"]], "sourceFull": "https://www.kommersant.ru/doc/8878241"}, {"num": 22, "title": "外媒评更新支持最短手机品牌：摩托罗拉、小米上榜", "tag": "local", "tagText": "本地", "source": "Lenta.ru(转引BGR)", "time": "08-12 18:00", "summary": "据BGR对全球手机品牌更新支持周期的评测，摩托罗拉和小米被列入系统更新支持最短的品牌名单：摩托罗拉旗舰机型仅获约两年Android大版本更新；小米虽对部分旗舰承诺最长五年支持，但多数机型实际仅获得两次大版本更新。该信息对俄市场消费者选购及跨境卖家备货节奏具参考意义。", "table": [["摩托罗拉", "旗舰约2年Android更新"], ["小米", "多数机型仅2次大版本更新"]], "sourceFull": "https://lenta.ru/news/2026/08/12/support/"}, {"num": 23, "title": "灯具栏目：本期无新增重大动态", "tag": "local", "tagText": "本地", "source": "综合检索", "time": "08-13 10:00", "summary": "2026年8月11-13日窗口内，RIA/Lenta/Interfax/TASS/Kommersant检索（含светильник/освещение/LED关键词）未见俄罗斯灯具照明市场的新增重大新闻。按去重规则标注：本期无新增重大动态，不填充旧信息。", "table": [], "sourceFull": ""}]}
