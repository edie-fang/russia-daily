5-oktyabrya-2026-283361/"}, {"num": 4, "cat": "ecom", "catText": "电商动态", "title": "俄经济发展部与 Wildberries 旗下 RWB 共建区域企业家支持中心网络", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-15 09:33", "summary": "俄经济发展部与 Wildberries 旗下 RWB 联合启动面向中小企业的区域支持中心网络，作为 «RWB Среда» 平台的一部分，提供入驻、合规、融资与培训服务（10-15 公布）。对跨境卖家的含义：本地中小供应商/工厂上线 WB 的门槛与成本下降，同类目将出现更多本地化对手，价格与上新速度竞争加剧。", "table": [["主体", "Минэкономразвития + RWB"], ["载体", "«RWB Среда»"], ["服务", "入驻/合规/融资/培训"]], "sourceFull": "https://www.retail.ru/news/minekonomrazvitiya-rossii-i-rwb-zapustili-set-regionalnykh-tsentrov-dlya-predpri-15-oktyabrya-2026-283318/"}, {"num": 5, "cat": "beauty", "catText": "美妆个护", "title": "俄零售 БАД 保健品两年增长 75%", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-15 10:37", "summary": "俄零售数据显示，近两年 БАД（膳食补充剂）销售额增长 75%，为健康/家居类中增速最快的细分之一，线上占比持续提升。对美妆个护卖家的含义：口服美容、补充剂是明确的增量赛道，但须注意 10-13 起生效的 Роспотребнадзор 第 644 号令已将 БАД 列入「风险指标」抽查范围，合规标注与声明缺一不可。", "table": [["指标", "数值"], ["БАД 销售增速", "2 年 +75%"]], "sourceFull": "https://www.retail.ru/news/za-dva-goda-prodazhi-badov-v-riteyle-vyrosli-na-75--15-oktyabrya-2026-283322/"}, {"num": 6, "cat": "beauty", "catText": "美妆个护", "title": "«Золотое Яблоко»：38% 生成式 AI 用户用 ИИ 选购化妆品", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-15 14:44", "summary": "美妆连锁 «Золотое Яблоко» 调研显示，38% 的生成式 AI 用户会在挑选化妆品时向 ИИ 咨询（10-15 发布）。对卖家的含义：商品卡片的结构化属性（成分、功效、适用肤质）与真实评价内容将更直接影响 AI 推荐与选购入口，粗放式图片+短标题的卡片会被弱化。", "table": [["指标", "数值"], ["ИИ 咨询占比", "38%"]], "sourceFull": "https://www.retail.ru/news/zolotoe-yabloko-38-polzovateley-neyrosetey-konsultiruyutsya-s-ii-pri-vybore-kosm-15-oktyabrya-2026-283337/"}, {"num": 7, "cat": "beauty", "catText": "美妆个护", "title": "Geltek 收购儿童彩妆品牌 Nomi", "tag": "local", "tagText": "本地", "source": "Oborot.ru", "time": "10-15 11:44", "summary": "Geltek 收购儿童装饰性化妆品品牌 Nomi（10-15 报道），加码儿童美妆细分。俄儿童/青少年美妆近两年增速高于整体美妆，本土品牌正通过并购整合渠道与产品线。对跨境卖家的含义：该细分竞争加剧，进入需先解决儿童化妆品的检验与合规要求。", "table": [["交易", "Geltek ← Nomi"], ["细分", "儿童装饰性化妆品"]], "sourceFull": "https://oborot.ru/news/geltek-priobrel-brend-detskoj-dekorativnoj-kosmetiki-nomi-i281492.html"}, {"num": 8, "cat": "appliance", "catText": "家电电器", "title": "工贸部确定电子技术回收费率：12-01 起执行，标注溯源可减半", "tag": "local", "tagText": "本地", "source": "RG", "time": "10-15 21:37", "summary": "俄工贸部确定电子产品的技术回收/技术费（технологический сбор）基准与优惠费率，自 2026-12-01 起执行：笔记本电脑基准 746 卢布/台，在 ГИС 标注溯源信息后降至 500 卢布，未标注则为 992 卢布；智能手机基准 373 卢布，标注后 250 卢布，未标注 496 卢布。标注溯源（Честный знак）成为降低成本的关键变量，未赋码的实际成本接近翻倍。", "table": [["品类", "基准 / 优惠 / 未标注(₽)"], ["笔记本电脑", "746 / 500 / 992"], ["智能手机", "373 / 250 / 496"], ["生效", "2026-12-01"]], "sourceFull": "https://rg.ru/2026/10/15/minpromtorg-utverdil-stavki-tehnologicheskogo-sbora-na-elektroniku.html"}, {"num": 9, "cat": "appliance", "catText": "家电电器", "title": "«М.Видео»：Samsung 智能手表销售增长近 8%", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-15 09:55", "summary": "«М.Видео» 数据显示，1 至 9 月 Samsung 智能手表在俄销售额同比增长近 8%（10-15 发布），可穿戴设备成为数码/小家电中稳健的增量品类，线上渠道贡献持续提升。对自有电器线卖家的含义：Q4（11-12 月促销季）是可穿戴的备货关键窗口，需提前锁定物流运力与结算周期。", "table": [["指标", "数值"], ["Samsung 手表销售", "1-9 月 +8%（金额）"]], "sourceFull": "https://www.retail.ru/news/m-video-s-nachala-goda-samsung-narastil-prodazhi-smart-chasov-pochti-na-8-v-dene-15-oktyabrya-2026-283319/"}, {"num": 10, "cat": "econ", "catText": "经济金融", "title": "关键行情：卢布小幅走强至 83.76，Brent 约 105.6 美元", "tag": "local", "tagText": "本地", "source": "俄央行(CBR)", "time": "10-16 09:00", "summary": "10-16 俄央行官方汇率：1 美元 = 83.7600 卢布（10-15 为 83.95，卢布小幅走强）；Brent 原油约 105.6 美元/桶（Yahoo Finance 10-16 盘前；10-15 收盘 105.92）。10-15 晚间特朗普批评乌方袭击俄炼油厂一度推升油价预期，其后回落。MOEX 指数于本报告生成时点（MSK 上午）尚未取得。", "table": [["指标", "数值"], ["USD/RUB（CBR 10-16）", "83.7600"], ["Brent", "≈105.6 美元/桶"]], "sourceFull": "https://www.cbr.ru/scripts/XML_daily.asp?date_req=16.10.2026"}, {"num": 11, "cat": "econ", "catText": "经济金融", "title": "普京将 Tarkett 及另 4 家公司资产移交 «Центр Капитал» 临时管理", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "10-16 00:03", "summary": "普京签署命令，将芬兰地板建材商 Tarkett 及另 4 家公司的俄罗斯资产移交 «Центр Капитал» 实施外部临时管理；同期他调整了俄企应对境外（外国法院/监管）索赔与要求的机制。这是俄对外国资产「临时管理」机制的延续（此前涉及 Danone、Carlsberg 等），对外资/合资企业、代理与供应链关系有直接影响。", "table": [["措施", "资产临时管理"], ["对象", "Tarkett 等 5 家公司"], ["受托方", "«Центр Капитал»"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/10/16/1237536-aktivi-tarkett"}, {"num": 12, "cat": "econ", "catText": "经济金融", "title": "俄表示准备向印度增供石油", "tag": "local", "tagText": "本地", "source": "TASS", "time": "10-16 02:10", "summary": "俄方表示准备向印度提供额外石油供应量（10-16）；俄外交部称「俄印关系在任何形势下都会保持良好」。印度方向以折扣乌拉尔原油为主，能源与本币结算合作继续深化。对出口链条的含义：印方采购节奏与结算安排会间接影响俄国内汇率、运费与油品供给预期。", "table": [["主体", "俄—印"], ["事项", "增供石油（规模待核实）"]], "sourceFull": "https://tass.ru/politika/28219867"}, {"num": 13, "cat": "econ", "catText": "经济金融", "title": "电商平台游说财政部保留零售 УСН 优惠税率", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-15 10:28", "summary": "电商平台与行业协会请求俄财政部在税改中保留零售与批发贸易的 УСН（简易税制）优惠税率（10-15 报道）。此前财政部方案拟收紧 УСН 以填补财政缺口，若落地，年营收超阈值的中小卖家税负将上升，平台可能部分转嫁成本。对以本地主体运营的跨境卖家：需关注 11 月税改落地口径与自身主体税制选择。", "table": [["诉求方", "电商平台/行业协会"], ["事项", "保留贸易 УСН 低税率"], ["状态", "游说中（待核实）"]], "sourceFull": "https://www.retail.ru/news/marketpleysy-poprosili-minfin-sokhranit-ponizhennye-stavki-usn-dlya-torgovli-15-oktyabrya-2026-283321/"}, {"num": 14, "cat": "econ", "catText": "经济金融", "title": "中国出口创新高，对俄供给继续放量", "tag": "local", "tagText": "本地", "source": "Kommersant", "time": "10-16 01:42", "summary": "《Коммерсантъ》世界经贸监测显示，中国出口总量攀升至阶段新高，对俄的机械、电子、汽车与消费品供给继续放量。对中国出海卖家的含义：俄市场中国供给竞争白热化，价格带整体下移；差异化需落在合规（EAC/Честный знак）、本地仓时效与品牌化，而非单纯价格竞争。", "table": [["指标", "趋势"], ["中国出口/对俄供给", "创新高"]], "sourceFull": "https://www.kommersant.ru/doc/9027494"}, {"num": 15, "cat": "politics", "catText": "时政要闻", "title": "莫斯科四大机场停运：一夜击落 79 架无人机", "tag": "local", "tagText": "本地", "source": "RG", "time": "10-16 03:44", "summary": "10-16 凌晨乌军无人机大规模袭击莫斯科方向：市长 Собянин 通报一夜击落 79 架 БПЛА（早前另一通报为 49 架）；Внуково、Домодедово、Шереметьево、Жуковский 四大机场暂停起降，逾 20 架航班备降至下诺夫哥罗德、乌里扬诺夫斯克、萨兰斯克等地，多州机场 а）"]], "sourceFull": "https://tass.ru/ekonomika/28219895"}, {"num": 20, "cat": "other", "catText": "其它动态", "title": "俄深度伪造数量两年半增长 10 倍", "tag": "local", "tagText": "本地", "source": "«Известия»", "time": "10-16 01:00", "summary": "《消息报》报道，俄境内深度伪造（дипфейк）视频数量自 2024 年以来增长约 10 倍，集中于诈骗与商业诋毁；监管与平台正加强标记与追溯要求。对卖家的含义：直播、短视频素材与品牌代言内容需留存授权凭证，防范 AI 换脸侵权、虚假代言与诈骗风险。", "table": [["指标", "变化"], ["дипфейк 数量", "2.5 年 +10 倍"]], "sourceFull": "https://iz.ru/2185043/2026-10-16/kolichestvo-dipfeikov-v-rossii-s-2024-goda-vyroslo-v-10-raz"}, {"num": 21, "cat": "other", "catText": "其它动态", "title": "俄民众手机与二维码支付占比持续上升", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "10-16 04:50", "summary": "俄媒报道，越来越多俄民众用手机与 QR 码（СБП 快速支付系统）完成购物结算，现金与刷卡占比继续下降（10-16）。对卖家的含义：接入 СБП/QR 结算、并优化移动端支付与免密流程，可直接提升下单转化率；同时需关注支付环节的诈骗与风控要求。", "table": [["趋势", "手机/QR 支付占比上升"]], "sourceFull": "https://ria.ru/20261016/oplata-2124831572.html"}]}
