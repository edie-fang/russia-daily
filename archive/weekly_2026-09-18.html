"title": "库存外迁成为主流：卖家转向持牌第三方物流分散存储，Ozon 公开招商仓储（现房 5 千㎡起、代建 1 万–8.5 万㎡）", "tag": "local", "tagText": "本地", "source": "零售网 (Retail.ru) / 生意人报", "time": "09-17", "summary": "化妆品、保健品、医疗器械、婴幼儿食品类卖家开始把库存从平台自有仓转入持药品许可的物流运营商：新机制把同一批货分散到多个终端，降低单一设施遇袭导致整批全损的风险，运营商按药品标准控温湿洁净并按平台要求重新包装、加贴「Честный знак」Data Matrix 重复码（贴码错误即视为非法流通）。同期 Ozon 上线线上仓储租赁平台，向业主与开发商征集长期租赁或 build-to-suit 代建方案，现房门槛 5 千平方米、代建项目 1 万–8.5 万平方米，运营流程与设备由 Ozon 承担——平台首次把仓储需求公开给外部业主，反映其物流网络重构的现实压力。", "url": "https://www.retail.ru/news/sellery-marketpleysov-perekhodyat-na-khranenie-tovara-na-skladakh-logisticheskikh-17-sentyabrya-2026-282262/；https://www.retail.ru/news/ozon-zapustil-platformu-dlya-poiska-i-arendy-skladskikh-pomeshcheniy-17-sentyabrya-2026-282237/", "table": [["卖家动作", "平台仓 → 持牌第三方物流分散存储"], ["合规", "「Честный знак」Data Matrix 重复码"], ["Ozon 现房门槛", "5,000 ㎡ 起"], ["Ozon 代建规模", "10,000–85,000 ㎡"], ["运营分工", "流程与设备由 Ozon 承担"]]}, {"num": 7, "title": "卖家自发货（DBS）需求 4–8 月经 СДЭК 增 60%；Ozon 在自提点直接销售未取件/退货商品，股价单日 +7.01%", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-14 / 09-15", "summary": "«Ведомости» 援引 СДЭК 数据：2026 年 4–8 月平台卖家要求按 DBS（卖家自行配送）模式发货的申请量增长 60%；背景是大型网络零售商自有仓储持续遇袭与改道，叠加平台 FBO 费率与风险上升，卖家加速把库存与履约移出平台大仓，DBS/3PL 组合从备选变为常态。同期 Ozon 自 9-10 起在部分自提点试点：客户拒收或逾期未取的包裹不再运回大仓，而是直接摆上 ПВЗ 货架经处理后照常通过网站/App 销售（10 月起可把 ПВЗ 在售商品运出、配送或交叉对接，物流费按集群计价）。市场对此给出正面反馈：9-14 Ozon 股价单日上涨 7.01% 至 2693 卢布、成交 54.3 亿卢布，但过去 12 个月仍累计下跌 35.8%。", "url": "https://www.vedomosti.ru/business/articles/2026/09/15/1228743-prodavtsi-marketpleisov-stali-dostavlyat-tovari-samostoyatelno；https://www.vedomosti.ru/business/news/2026/09/14/1228758-tovari-v-pvz；https://www.vedomosti.ru/investments/news/2026/09/14/1228774-tsena-aktsii-ozon", "table": [["DBS 申请量（4–8 月）", "+60%（СДЭК）"], ["Ozon ПВЗ 直售", "09-10 起试点，10 月可外发"], ["Ozon 股价", "2693 卢布（09-14，+7.01%）"], ["12 个月累计", "-35.8%"]]}, {"num": 8, "title": "Wildberries 工具与流量三连发：智能自提用户半年 ×6、无人 ПВЗ 回购率近 90%，上线议价工具与 AI 搭配", "tag": "local", "tagText": "本地", "source": "零售网 (Retail.ru)", "time": "09-14 / 09-16 / 09-17", "summary": "Wildberries & Russ 披露：自 2026 年 5 月上线智能自提（смарт-выдача）以来使用该功能的买家数量增长 6 倍以上，用户在自提点扫描 App 二维码即可自动开柜取货、无需店员介入，适用尺寸不超过 60×40×40 см、货值不超过 5 万卢布的单件，智能自提订单中最热门品类包含「美妆」，公司同时在推进 7×24 小时无员工的「Смарт-ПВЗ」、回购率接近 90%。工具侧另有两条上新：买家可在支持的商品卡上直接向卖家请求个人专属折扣（«Хочу скидку»，议价在平台内闭环完成）；商品卡新增 AI 功能 «Идеи образов»，可一次生成至多 10 套可购搭配并直接加购，把搜索式购物转为搭配推荐，对服饰与美妆类目的关联转化有直接意义。", "url": "https://www.retail.ru/news/wildberries-kolichestvo-polzovateley-pvz-so-smart-vydachey-zakazov-vyroslo-v-6-r-16-sentyabrya-2026-282173/；https://www.retail.ru/news/na-wildberries-poyavilas-vozmozhnost-zaprosit-skidku-u-prodavtsa-14-sentyabrya-2026-282100/；https://www.retail.ru/news/na-wildberries-poyavilas-ii-funktsiya-idei-obrazov-17-sentyabrya-2026-282231/", "table": [["智能自提用户", "6 个月内 ×6 以上"], ["适用规格", "≤60×40×40 см、≤5 万卢布"], ["无人 ПВЗ 回购率", "近 90%"], ["议价工具", "«Хочу скидку» 买家向卖家求折扣"], ["AI 搭配", "«Идеи образов» 至多 10 套"]]}, {"num": 9, "title": "政策与金融侧救助加码：银行协会建议优惠融资与贷款重组，第一副总理提出凭证制补偿反无人机防护支出", "tag": "local", "tagText": "本地", "source": "俄新社 / Ведомости / 生意人报", "time": "09-16 / 09-17", "summary": "俄银行协会（АБР）应 RWB 与 WB 银行倡议于 9-16 开会讨论对遭袭物流中心、仓库、生产与商贸设施、炼油厂及旅游、农业企业的金融支持，与会方认为现有措施可能不足，建议扩大优惠融资并把数字平台与电商、炼油、农业、旅游单列额度，区分中小企业/大企业/系统重要性企业，同时提供贷款重组、延期付款与信贷假期，并临时调整监管口径以放行融资。第一副总理 Мантуров 在保障行业不间断运行小组会上表示「工业韧性正在成为成本的一部分」，政府与地方应在企业提供投入凭证的前提下补偿其防护支出，包括实体防护、关键设备与物流的冗余备份以及受损设施恢复。", "url": "https://ria.ru/20260917/abr-2118233673.html；https://www.vedomosti.ru/business/news/2026/09/17/1229677-kompensirovat-biznesu", "table": [["建议主体", "俄银行协会（АБР）"], ["工具", "优惠融资、贷款重组、延期付款、信贷假期"], ["重点行业", "数字平台与电商、炼油、农业、旅游"], ["防护补偿", "凭证制，覆盖实体防护与冗余备份"]]}, {"num": 10, "title": "平台侧结构数据：夏季新增卖家同比 -27%，官方预计 2026 年电商占零售比重由 20% 升至 25%", "tag": "local", "tagText": "本地", "source": "Ведомости（引 Известия 与俄工商会）/ 副总理 Григоренко", "time": "09-15", "summary": "2026 年夏季俄平台新增卖家较去年同期减少 27%——俄工商会电商发展委员会主席 Федоров 称 9 月初平台约有 80 万卖家、联邦税务局估计 85 万，下降主因是「易进易做」期结束（竞争加剧、物流与推广费用上升、平台算法调整）；Wildberries 与 Ozon 均否认自身新增卖家下滑（1-8 月 WB 新注册卖家同比多 12%）。副总理兼政府办公厅主任 Григоренко 表示 2026 年俄电子商务占商品流通总额的比重可能由当前 20% 升至 25%，平台是主要推动者，同时承认数字平台正改变商业结构与中介环节、对政府构成严峻挑战。", "url": "https://www.vedomosti.ru/business/news/2026/09/15/1228834-pritok-novih-prodavtsov；https://www.vedomosti.ru/business/news/2026/09/15/1228982-rost-doli-onlain-torgovli", "table": [["夏季新增卖家", "同比 -27%"], ["卖家总数", "约 80 万（工商会）/85 万（ФНС）"], ["WB 新注册（1-8 月）", "+12%"], ["电商占零售", "20% → 25%（2026 年预测）"]]}, {"num": 11, "title": "遇袭损失向供货链传导：«Эксмо-АСТ» 损失 500 万册/约 4 亿卢布并加印补库，行业口径 1500 万册/约 60 亿卢布", "tag": "local", "tagText": "本地", "source": "生意人报 / Retail.ru", "time": "09-15 / 09-16", "summary": "出版集团 «Эксмо-АСТ» 总裁 Новиков 表示，因无人机袭击平台仓库，公司已损失 500 万册图书、金额约 4 亿卢布，计划在半年内补印缺货品种，并直言「这些书已被销毁，损失无论如何无法弥补」；此前行业口径为图书业 1500 万册、约 60 亿卢布。该案是仓储遇袭向供货链传导的最完整样本：实物不可逆、赔付只覆盖印数成本，断货缺口与商誉损失由供应商自行承担。对经营高值或易损品类的卖家，本周的赔付到账与库存外迁动作已给出明确的风险定价参照。", "url": "https://www.kommersant.ru/doc/8955689；https://www.retail.ru/news/izdatelstva-eksmo-i-ast-dopechatayut-5-mln-knig-vzamen-sgorevshikh-na-skladakh-m-16-sentyabrya-2026-282168/", "table": [["单家损失", "500 万册 / 约 4 亿卢布"], ["行业口径", "1500 万册 / 约 60 亿卢布"], ["补救", "半年内加印 500 万册"], ["赔付覆盖", "仅印数成本"]]}, {"num": 12, "title": "需求侧走弱与新工具并行：消费者信心 7 月 -15%、近三成压缩单次采购，Lamoda 个性化带来 +10% NMV", "tag": "local", "tagText": "本地", "source": "零售网 (Retail.ru) 引 «Ромир» / Lamoda Brand Day", "time": "09-16 / 09-17", "summary": "研究机构 «Ромир» 披露俄消费者信心指数连续走弱：2025 年 Q1 +11% 逐季降至 Q4 +3%，2026 年 Q1 转为 -4%、Q2 -8%，月度口径 6 月 -13%、7 月 -15%；同步收缩的是消费篮子——2026 年 6 月 29% 的消费者把单次采购件数压缩 10%、18% 压缩 11–20%，主要表现为删除重复项与收窄品类。平台侧的对冲工具同步成熟：Lamoda 在 Brand Day 披露 95% 展示面已实现个性化、直接带来约 +10% 额外 NMV，俄罗斯设计师板块增速最快 +44%、运动 +25%、高端 +22%，地区客户占 62%，公司以趋势分析与卖家趋势指南替代「人人打折」，微观趋势可带来周转率 +63%。", "url": "https://www.retail.ru/news/indeks-potrebitelskoy-uverennosti-snizilsya-do-15-kolichestvo-pozitsiy-v-cheke-s-16-sentyabrya-2026-282201/；https://www.retail.ru/news/lamoda-personalizatsiya-i-bolshie-dannye-prinesli-kompanii-10-dopolnitelnogo-obo-16-sentyabrya-2026-282191/", "table": [["消费者信心指数", "7 月 -15%（Q1 -4%、Q2 -8%）"], ["采购件数压缩", "29% 压缩 10%、18% 压缩 11–20%"], ["Lamoda 个性化", "95% 展示面，+10% NMV"], ["俄设计师板块", "+44%"], ["区域客户占比", "62%"]]}, {"num": 13, "title": "履约入口前移：2ГИС 上线寄件比价（接入 СДЭК/Яндекс Доставка/Versta.io），«Ашан» 联手 Яндекс 做 30–90 分钟快送", "tag": "local", "tagText": "本地", "source": "零售网 (Retail.ru)", "time": "09-16 / 09-17", "summary": "地理服务 2ГИС 在路线规划页新增「Доставка（寄件）」板块：用户输入起终点即可看到多家物流商报价与取派时间，选定后跳转承运商 App 并自动带填地址，首批接入 СДЭК、「Яндекс Доставка」与 Versta.io，支持同城、跨城市及哈萨克斯坦、白俄罗斯、亚美尼亚、吉尔吉斯斯坦等邻国方向。对卖家意味着比价入口进一步前置到消费级流量平台，自发货（FBS/DBS）承运商的获客与议价格局可能被重塑。同周 «Ашан Ритейл Россия» 与 «Яндекс Доставка» 推出门店快送（30–90 分钟、覆盖门店 5 公里半径，已落地 19 家门店），食品零售的即时履约竞争进一步升温。", "url": "https://www.retail.ru/news/servis-2gis-zapustil-dostavku-posylok-16-sentyabrya-2026-282169/；https://www.retail.ru/news/ashan-i-yandeks-dostavka-zapustili-bystruyu-dostavku-iz-magazinov-seti-17-sentyabrya-2026-282282/", "table": [["2ГИС 接入承运商", "СДЭК / Яндекс Доставка / Versta.io"], ["覆盖", "同城+跨城+4 个邻国方向"], ["Ашан×Яндекс", "30–90 分钟、19 家门店"]]}, {"num": 14, "title": "渠道结构：平台占俄家具市场收入 37%、线下跌破一半；42% 零售商计划靠 AI 压缩人力（待核实）", "tag": "local", "tagText": "本地", "source": "零售网 (Retail.ru) / 生意人报 / 塔斯社", "time": "09-17", "summary": "performance 机构 Adgasm 与家具市场机构 FCP 对 40 余家家具企业管理层的调研显示：2026 年上半年平台占俄家具市场收入 37%（去年同期 30%），线下零售份额由 55% 降至 47%，厂商与零售商自营电商基本持平（15%→16%）——渠道继续向平台集中，线下门店的流量与转化进一步承压；对家居类照明、软装品类的渠道选择构成直接参照。另据《Известия》报道，42% 的俄零售商计划通过自动化（AI）削减人员支出（塔斯社文章页对本机返回 403，本条仅有标题级信息，未取得细分方案与样本口径，如实标注为待核实）。", "url": "https://www.retail.ru/news/po-itogam-i-polugodiya-dolya-marketpleysov-v-vyruchke-mebelnogo-rynka-vyrosla-do-17-sentyabrya-2026-282229/；https://tass.ru/ekonomika/28123161", "table": [["平台（上半年）", "37%（去年同期 30%）"], ["线下零售", "47%（去年 55%）"], ["自营电商", "16%"], ["AI 降本计划", "42% 零售商（标题级信息，待核实）"]]}, {"num": 15, "title": "普京签令：Auchan、Nestle、«Лемана Про»（原 Leroy Merlin）、FM Logistics 等俄资产移交临时管理", "tag": "local", "tagText": "本地", "source": "生意人报 / Retail.ru", "time": "09-17", "summary": "普京 9-17 签署总统令，把 Auchan（«Ашан»）、Nestle（«Нестле»）、管理 «Лемана Про»（原 Leroy Merlin）的 ООО «Ле Монлид»，以及 FM Logistics 与 Bati Logistics 的俄罗斯资产移交 АО «Л.Е.В. Менеджмент» 临时管理（该公司 2024 年 10 月在莫斯科注册，主营商业咨询与经营管理）。«Лемана ПРО» 回应称门店与运营一切照常；Nestle 9-18 表示正在评估可能采取的步骤。该项属外资零售与物流资产治理结构的重大变动，对家居建材类目的供给渠道与供应商结算关系具有中期影响。", "url": "https://www.retail.ru/news/rossiyskie-aktivy-auchan-nestle-lerua-merlen-i-fm-logistics-byli-peredany-vo-vre-17-sentyabrya-2026-282268/", "table": [["签令日期", "2026-09-17"], ["涉及资产", "Auchan、Nestle、Лемана Про、FM/Bati Logistics"], ["受托方", "АО «Л.Е.В. Менеджмент»"], ["运营口径", "«Лемана ПРО» 称一切照常"]]}, {"num": 16, "title": "物流设施反无人机规则进入行业议程：企业界预计 6–12 个月内出标准，公众院推动算法透明与卖家申诉", "tag": "local", "tagText": "本地", "source": "塔斯社", "time": "09-14 / 09-15", "summary": "塔斯社报道，咨询公司 Umbrella Consulting Group 总经理 Агапов 表示企业界正在讨论物流设施防御无人机袭击的规则，预计未来 6–12 个月内将出现行业标准或试点的强制性要求，适用于仓储、分拣与履约中心；对卖家而言，标准出台可能提高平台仓与第三方仓的准入与费用门槛，同时改善货损赔付的责任界定。另一条监管线索是平台算法透明：9-14 公众院（ОП）称平台将被要求公开商品搜索排序因子与卖家间的订单分配规则；9-15 公众院进一步明确自 10-01 起卖家可就算法运行结果造成的财务损失提出申诉。", "url": "https://tass.ru/ekonomika/28108863；https://tass.ru/ekonomika/28108875", "table": [["标准预期", "6–12 个月内"], ["适用对象", "仓储、分拣与履约中心"], ["影响", "准入与费用门槛上升、货损责任更清晰"], ["算法申诉", "10-01 起可提，需留存证据链"]]}, {"num": 17, "title": "平台加码年轻化与新客获取：Ozon 推出 «Лайкзон» 模式，品牌榜 Сбер/Газпром/Яндекс 领跑", "tag": "local", "tagText": "本地", "source": "Retail.ru / 生意人报", "time": "09-15", "summary": "Ozon 推出面向年轻受众的 «Лайкзон» 模式，可在移动 App 与移动网页版使用，以独立界面与内容化推荐争取年轻用户的心智与停留时长，属于流量结构与用户分层运营的细化——年轻客群对应的选品、图文风格与价格带或出现新的曝光入口，值得在下一轮上新与投放中做对照测试。同期咨询公司 BrandLab 的 2026 俄百强品牌榜显示 Сбер、Газпром、Яндекс 位列前三（Сбер 品牌价值 +4.5% 至 2.35 万亿卢布），«Пятёрочка»、«Магнит» 与 Wildberries 保持零售前十，渠道集中度与用户心智继续向头部平台与大连锁集中。", "url": "https://www.retail.ru/news/ozon-predstavil-rezhim-laykzon-dlya-molodoy-auditorii-15-sentyabrya-2026-282155/；https://www.kommersant.ru/doc/8954899", "table": [["Ozon 新模块", "«Лайкзон»（App+移动网页）"], ["目标", "年轻客群心智与停留时长"], ["品牌榜前三", "Сбер / Газпром / Яндекс"], ["Сбер 品牌价值", "+4.5% 至 2.35 万亿卢布"]]}]}, {"icon": "🏛", "name": "时政", "items": [{"num": 1, "title": "国家杜马选举 9-18~20 投票：堪察加与楚科奇首开、10 个地区同步选举，选举周恐袭抬头", "tag": "local", "tagText": "本地", "source": "生意人报 / RBC / 俄新社 / 国际文传电讯社", "time": "09-14 ~ 09-18", "summary": "俄第九届国家杜马选举于 9-18~20 举行：莫斯科时间 9-17 23:00（当地时间 9-18 8:00）首批投票站在堪察加边疆区与楚科奇自治区开放，同时 10 个地区举行州长直选或议会选举（莫尔多瓦、图瓦、车臣、别尔哥罗德、布良斯克、奔萨、特维尔、乌里扬诺夫斯克等），北奥塞梯与卡拉恰伊-切尔克斯由地方议会确认人选；计划举行 2200 多场各级选举，改选约 2.07 万个代表席位与选举职位，境外与偏远地区提前投票持续推进（堪察加已完成 7103 名选民投票）。选举周安全事件抬头：扎波罗热州选举委员会主席在乌方袭击中身亡（俄外交部 9-18 表示哀悼）、别尔哥罗德州 5 人受伤、ЛНР 一日内四人身亡且巴士遭两次无人机袭击、别尔哥罗德一度暂停 ДЭГ 部分投票。9-15 起至 9-20 20:00 全境禁止公布选举民调与结果预测。", "url": "https://www.kommersant.ru/doc/8957458；https://www.interfax.ru/russia/1116111；https://ria.ru/20260918/mid-2118570672.html", "table": [["投票期", "2026-09-18 ~ 09-20"], ["首批开放", "堪察加、楚科奇（当地 09-18 8:00）"], ["同步选举", "10 个地区州长/议会选举"], ["席位", "约 2.07 万个"], ["民调禁令", "09-15 ~ 09-20 20:00"], ["选举周事件", "扎波罗热州选委会主席身亡、别尔哥罗德 5 伤、ЛНР 4 死"]]}, {"num": 2, "title": "袭击强度维持高位并转向首都方向：9-18 凌晨莫斯科方向击落 35 架，机场限航与公路封闭持续", "tag": "local", "tagText": "本地", "source": "生意人报 / RBC / Ведомости", "time": "09-13 ~ 09-18", "summary": "本周防空与空域扰动持续：9-12 夜至 13 日晨击落 389 架、13 日白天再击落 140 架（7 州+克里米亚+黑海）；9-16 单日全国击落 68 架（库尔斯克州地区口径单日 100 架、前一夜 71 架）；9-17 凌晨 2 架飞向莫斯科的无人机被击落，喀山、切博克萨雷、马哈奇卡拉、雅罗斯拉夫尔、伊万诺沃、普斯科夫、索契、格连吉克等机场先后限航，雅罗斯拉夫尔—莫斯科公路因无人机威胁封闭；9-18 零时后莫斯科市长 Собянин 逐批通报，向首都方向飞行的无人机被击落数量由 10 架升至 20 架、再升至 35 架。民航侧的连锁反应同步上升：9-13~9-14 伏尔加格勒、克拉斯诺达尔、坦波夫、索契、马哈奇卡拉、弗拉季高加索、格罗兹尼机场多次临时限航，俄方拟就乌方对民航安全的威胁在欧安组织提出议题。本周未再现平台仓库受损通报（连续 3 日）。", "url": "https://www.vedomosti.ru/politics/news/2026/09/13/1228495-unichtozhili-140-bpla；https://www.vedomosti.ru/politics/news/2026/09/16/1229466-sbili-68-bpla；https://www.kommersant.ru/doc/8957490", "table": [["09-12 夜~09-13 晨", "击落 389 架"], ["09-13 白天", "再击落 140 架"], ["09-16 单日", "68 架（库尔斯克州日 100 架）"], ["09-18 莫斯科方向", "35 架（零时后）"], ["民航", "多城机场反复临时限航、雅—莫公路封闭"]]}, {"num": 3, "title": "下卡姆斯克（鞑靼斯坦）遭袭：2 人死亡、伤者升至 14 人，侦查委员会以恐袭立案", "tag": "local", "tagText": "本地", "source": "РИА Новости / Ведомости / 生意人报", "time": "09-13", "summary": "9-13 凌晨鞑靼斯坦共和国下卡姆斯克市遭无人机袭击：一架无人机坠机砸中停在民宅旁的汽车，车内 4 名年轻人中 2 人死亡、2 人重伤，民宅受损另致 4 人受伤，全市民用与工业设施合计受伤人数由 12 人更新至 14 人（2 人重伤、1 人中等伤情）；市内一家工业企业起火，火被扑灭且生产流程未中断。共和国首脑明尼哈诺夫要求尽快消除后果、为受损住户提供临时住所并及时修复窗户，市里开设临时安置点。俄侦查委员会已就该袭击以恐怖袭击条款刑事立案。打击落在伏尔加流域石化重镇，对沿伏尔加方向的仓储与干线运输时效构成新的扰动源。", "url": "https://ria.ru/20260913/nizhnekamsk-2117429260.html", "table": [["时间", "09-13 凌晨"], ["地点", "鞑靼斯坦下卡姆斯克"], ["死亡", "2 人"], ["受伤", "12 → 14 人"], ["工业设施", "一家企业起火，生产未中断"], ["立案", "СКР 以恐袭条款"]]}, {"num": 4, "title": "美众议院通过对俄制裁法案（262:159）送交总统签署：对俄商品最高 500% 关税、对俄油气五大买家最高 100% 关税", "tag": "local", "tagText": "本地", "source": "俄新社 / 塔斯社 / RBC / 国际文传电讯社", "time": "09-16 / 09-17", "summary": "美国众议院 9-16 以 214:211 通过程序性决议为全院表决铺路，9-17 以 262 票赞成、159 票反对通过对俄制裁法案，法案此前已获参议院通过，现将送交总统特朗普签署。核心条款包括：对全部俄罗斯商品加征最高 500% 关税；对俄油气的五大买家国商品加征最高 100% 关税（若其新增采购俄能源）；对运输俄石油、铀、煤等货物的船舶实施限制；限制美国公民对俄投资；禁止美国对俄供应能源资源；同时规定总统有权以「美国国家利益」为由不予执行并设有解除机制，国务卿鲁比奥称其为「有价值的工具」。若最终成法，第三方买家与跨境结算的合规压力将进一步上升。", "url": "https://ria.ru/20260916/sanktsii-2117916162.html；https://www.interfax.ru/world/1116534", "table": [["程序性决议", "214:211（09-16）"], ["全院表决", "262:159（09-17）"], ["对俄商品关税", "最高 500%"], ["对俄油气买家", "最高 100% 关税"], ["其他", "船舶限制、投资限制、禁止供能"], ["豁免", "总统可依国家利益不执行"]]}, {"num": 5, "title": "俄美乌三方接触与「能源设施互不攻击」表态：MOEX 应声涨约 3%，NYT 称美方考虑冲突结束前达成商业交易", "tag": "local", "tagText": "本地", "source": "生意人报 / Ведомости / RBC", "time": "09-13 ~ 09-18", "summary": "特朗普 9-14 表示俄乌已同意放弃相互攻击能源设施、并称全球柴油涨价源于俄乌冲突而非伊朗局势，消息发布后莫斯科交易所指数上涨约 3%，但俄军事博主普遍存疑、认为对乌方而言只是「暂停」。此前佩斯科夫 9-13 称希望三方会谈能在可预见未来举行、阿联酋已确认愿承办，乌沙科夫称克宫认为阿布扎比是可接受场地；《纽约时报》9-18 援引两名知情人士称美国政府在考虑于冲突结束前就与俄罗斯达成商业交易。上述表态与美众议院制裁法案并存，构成「制裁与交易并行」的双轨信号：袭击烈度的实际变化比声明本身更值得跟踪。", "url": "https://www.kommersant.ru/doc/8954609；https://www.kommersant.ru/doc/8957486；https://www.vedomosti.ru/politics/news/2026/09/13/1228423-peskov-trehstoronnie-peregovori", "table": [["特朗普表态", "俄乌同意互不攻击能源设施"], ["市场反应", "MOEX +约 3%"], ["三方会谈", "阿联酋确认愿承办，乌沙科夫称阿布扎比可接受"], ["NYT", "美方考虑冲突结束前与俄达成商业交易"]]}, {"num": 6, "title": "欧盟制裁与俄反制：21 轮磋商延长后拟「创纪录」扩大，俄 9-18 大范围扩大欧盟人员入境禁令", "tag": "local", "tagText": "本地", "source": "生意人报 / RBC / 俄新社 / Lenta", "time": "09-15 ~ 09-18", "summary": "欧盟成员国常驻代表 9-15 未能就新一轮对俄制裁方案达成一致、决定延长磋商，随后据欧洲议会渠道消息，欧盟正准备「创纪录规模」的新一轮制裁，范围与条款尚未定稿，显示布鲁塞尔倾向在能源、金融与涉第三国企业方向进一步加码。俄方 9-18 作出对等回应：外交部宣布大幅扩大禁止入境的欧盟机构代表、成员国及「支持布鲁塞尔反俄政策」的欧洲国家人员名单，涉及参与援助乌克兰武装力量决策者、制裁执行者、阻碍航运者，以及投票支持反俄决议的议员与学术界人士。对跨境卖家而言，结算通道与物流服务商的可选范围可能进一步收窄。", "url": "https://www.kommersant.ru/doc/8955456；https://www.rbc.ru/politics/17/09/2026/6aab0bc4f5653e1f583969d2；https://ria.ru/20260918/otvet-2118549250.html", "table": [["欧盟进度", "磋商延长 → 拟「创纪录」扩大"], ["俄方反制", "扩大欧盟人员入境禁令（09-18）"], ["自 21 轮", "欧盟 7 月底通过，涉能源/金融/防务"]]}, {"num": 7, "title": "路透：俄特使 Дмитриев 与德国 АдГ 筹备 2027 年会谈讨论恢复对德供气，«Газпром» 股价涨超 4%", "tag": "local", "tagText": "本地", "source": "俄新社 引 Reuters", "time": "09-18", "summary": "路透社报道，俄总统投资与经济合作特别代表 Кирилл Дмитриев 与德国右翼政党「德国选择党」（АдГ）联合主席 Тино Крупалла、Алиса Вайдель 正在筹备 2027 年的会面，议题包括恢复俄罗斯对德天然气供应，消息人士称会面最快可于 3 月举行。消息发布后 «Газпром» 股价在莫斯科交易所加速上行、涨幅超过 4%（消息前涨幅在 2% 以内）。该报道与同期「又一欧盟国家放弃俄气」「欧洲气价破 1000 美元/千m³」的新闻并置，说明欧洲能源结构的政治不确定性仍在为俄气留下议题空间。", "url": "https://ria.ru/20260918/gaz-2118550190.html", "table": [["筹备会面", "2027 年，或最早 3 月"], ["议题", "恢复对德天然气供应"], ["市场反应", "«Газпром» 股价 +4% 以上"]]}, {"num": 8, "title": "乌克兰反腐机构冲突公开化：总检察长对 НАБУ 局长签署怀疑书后出境、随即被泽连斯基解职", "tag": "local", "tagText": "本地", "source": "Ведомости / 生意人报 / Lenta", "time": "09-15 / 09-16", "summary": "乌克兰总检察长 Кравченко 签署对 НАБУ（国家反腐败局）局长 Кривонос 的怀疑书，指其伪造文件谋取特别巨额利益并借虚假收养规避司法责任，同时对其副手与 САП 负责人克利缅科之妻签署怀疑书；НАБУ 回应称这是对独立反腐机构的「系统性攻击」，意在将其置于总检察长办公室管辖之下。随后 Кравченко 以「出差」名义出境，称将向外国伙伴通报 НАБУ 与 САП 的腐败问题；9-15 泽连斯基签署命令解除其职务。该内部冲突可能影响乌方与外部伙伴在援助监督与资金透明度方面的配合节奏。", "url": "https://www.vedomosti.ru/politics/articles/2026/09/15/1228738-genprokuror-ukraini-sbezhal-za-rubezh；https://www.kommersant.ru/doc/8955668", "table": [["冲突主体", "总检察长 Кравченко ↔ НАБУ 局长 Кривонос"], ["处置", "泽连斯基 09-15 解除总检察长职务"], ["风险", "援助监督与资金透明度配合节奏"]]}, {"num": 9, "title": "制裁与安全外溢：美财政部将 ВТБ 列入伊朗相关名单，北约在立陶宛击落无人机、芬兰核议题", "tag": "local", "tagText": "本地", "source": "俄新社 / Lenta / 生意人报", "time": "09-14 / 09-15", "summary": "美国财政部（OFAC）将俄罗斯 ВТБ 银行列入与伊朗相关的制裁名单，并称其为「世界上受到最广泛金融限制的金融机构」，警告与其往来存在较高制裁风险；对俄卖家与跨境结算而言，涉伊朗链条的合规筛查与银行通道审查将继续收紧。安全侧，立陶宛考纳斯地区上空出现无人机、北约战机升空将其击落，维尔纽斯及若干地区宣布「黄色」威胁等级、维尔纽斯机场因警报限制运行；俄副外长格鲁什科表示俄将在军事规划中考虑芬兰加入法国核威慑倡议这一事实；土耳其则就乌克兰在黑海对船只的袭击向国际刑事法院提交申请，把黑海航运安全推向国际司法层面。", "url": "https://ria.ru/20260914/minfin-2117684052.html；https://ria.ru/20260915/dron-2117687181.html；https://www.rbc.ru/politics/16/09/2026/6aaafccd1dd4401cf16144ef", "table": [["金融", "ВТБ 被列入伊朗相关制裁名单"], ["波罗的海", "北约在立陶宛击落无人机、维尔纽斯机场限航"], ["北欧", "芬兰加入法国核威慑倡议，俄纳入军事规划"], ["黑海", "土耳其就船只遇袭向 МУС 提交申请"]]}, {"num": 10, "title": "欧洲安全架构重构信号：美或削减驻欧美军 2.5 万，德国总理称跨大西洋友谊「或已结束」", "tag": "local", "tagText": "本地", "source": "RBC", "time": "09-18", "summary": "NBC 报道称五角大楼可能把驻欧美军削减 2.5 万人，为 1990 年代以来最大规模（最终建议尚未提交，德国方面同时在评估医院对可能冲突的接收能力）；德国总理 Мерц 表示二战后形成的「无条件跨大西洋友谊」时代已经结束。同期波兰总理图斯克警告未来数月俄罗斯可能对支持乌克兰的北约国家发动「混合」无人机打击，并称乌军月损失达 2.7 万人、为冲突以来最高；俄外交部发言人扎哈罗娃称杜马选举期间国内外投票站已出现挑衅事件。对经营的含义是：欧洲方向的安全溢价与航线/保险成本将长期化，而非阶段性扰动。", "url": "https://www.rbc.ru/politics/18/09/2026/6aac906a5ca62c1c84573cf0；https://www.kommersant.ru/doc/8957345", "table": [["驻欧美军", "或削减 2.5 万人（1990 年代以来最大）"], ["德国口径", "跨大西洋友谊时代已结束"], ["波兰警告", "或对北约国家发动混合无人机打击"], ["乌军月损失", "2.7 万人（图斯克口径）"]]}, {"num": 11, "title": "欧盟援乌规模与新接触渠道并存：累计超 2200 亿欧元（军事 780 亿），新任外长不排除与普京对话", "tag": "local", "tagText": "本地", "source": "俄新社 / 生意人报", "time": "09-16 / 09-17", "summary": "欧盟外交与安全政策高级代表卡拉斯在欧洲议会斯特拉斯堡全会表示，欧盟及成员国自冲突以来对乌援助总额已超过 2200 亿欧元，其中军事支持超 780 亿欧元，并提及一项两年 900 亿欧元的对乌信贷支持计划（其中 600 亿计划用于军事援助）；此前她已表态不排除与普京对话，强调任何接触须以维护欧盟立场与对乌支持为前提。这种「加码援乌+保留接触渠道」的双轨姿态，是本周制裁预期与谈判预期同时存在的政策背景。", "url": "https://ria.ru/20260916/es-2118121010.html；https://www.kommersant.ru/doc/8955485", "table": [["累计援乌", "超 2200 亿欧元"], ["其中军事", "超 780 亿欧元"], ["信贷计划", "两年 900 亿欧元（600 亿拟用于军事）"], ["接触", "不排除与普京对话"]]}, {"num": 12, "title": "制裁适应与贸易外交：俄拟启动对美贸易前景讨论、呼吁解除对所有石油供应国制裁，食品反制延至 2028 年底", "tag": "local", "tagText": "本地", "source": "俄新社 / 生意人报", "time": "09-15 / 09-17", "summary": "俄外交部表示认为有必要启动与美国的贸易前景讨论；克宫发言人佩斯科夫同日呼吁确保安全的贸易航行，并主张解除对所有石油供应国的制裁以缓解全球燃料市场紧张。9-17 普京签署总统令，把自 2014 年实施、针对对俄制裁国家的部分农产品与食品进口禁令延长至 2028 年 12 月 31 日，为进口食品、餐饮供应链与替代性本土/第三国采购的中期格局设定新的时间边界，意味着相关分销渠道不会在短期内回归。另据 РИА Новости，因埃博拉病毒传播风险，俄已在边境加强卫生检疫，对来自疫区（含经俄过境）的入境人员信息实施严密监控，经非洲或第三国中转的商务出行需预留检疫时间。", "url": "https://ria.ru/20260915/mid-2117869622.html；https://www.kommersant.ru/doc/8957406；https://ria.ru/20260914/kontrol-2117490660.html", "table": [["贸易外交", "拟启动对美贸易前景讨论"], ["能源主张", "解除对所有石油供应国制裁"], ["食品反制", "延长至 2028-12-31"], ["边境", "加强埃博拉相关卫生检疫"]]}, {"num": 13, "title": "俄美、俄日与欧亚方向的外交动态：俄方评估俄日关系「显著退化」，阿曼出口首单落地", "tag": "local", "tagText": "本地", "source": "俄新社 / 生意人报", "time": "09-13 ~ 09-18", "summary": "俄外交部 9-18 表示俄日关系出现「显著退化」，同期日本财务省数据显示 8 月俄日贸易额同比增长 19.51%（日本对俄汽车供应 +18.7%），政治与贸易走势背离；俄工贸部副部长切库绍夫 9-13 表示俄已开始向阿曼出口乘用车，并同步拓展尼日尔、多哥等非洲市场与阿根廷方向，标志制裁下出口方向多元化的持续推进。此外，因埃博拉风险加强边境检疫、以及民航安全议题被提交欧安组织，显示俄方正把卫生与航空安全纳入外交与合规议程。", "url": "https://ria.ru/20260918/mid-2118566302.html；https://ria.ru/20260913/rossija-2117405328.html；https://tass.ru/ekonomika/28115277", "table": [["俄日关系", "俄方称显著退化"], ["8 月俄日贸易额", "+19.51%（日对俄汽车 +18.7%）"], ["新出口市场", "阿曼（乘用车）、尼日尔/多哥、阿根廷"]]}]}, {"icon": "📊", "name": "经济", "items": [{"num": 1, "title": "【能源主线】Brent 周内 108→109.36→跌破 103：沙特「东西」管道遇袭、Saudi Aramco 对欧 10 月断供", "tag": "local", "tagText": "本地", "source": "Ведомости / 生意人报 / 国际文传电讯社 / Lenta / Fortune", "time": "09-14 ~ 09-18", "summary": "本周油市剧烈震荡：9-14 布伦特 11 月期货因霍尔木兹航运协议会议无限期推迟而涨 3.16% 至 107.77 美元/桶，随后受沙特「东西」输油管道遭无人机袭击（全球供应或减 4%、出口库存仅够 5–7 天）推动，9-14 盘中涨 4.55% 至 109.36 美元、当日最高 109.56；9-16 早盘报 108.34 美元（+1.77），9-17 因中东航运与制裁风险溢价回落跌破 103 美元（ICE 11 月合约盘中跌 2.78% 至 102.89，9-10 以来首次），莫斯科交易所 BR-10.26 结算价 104.20 美元（-1.27%），9-18 报 103.68 美元。国际文传电讯社引 Bloomberg：Saudi Aramco 已通知至少两家欧洲炼厂 10 月不供油且「涉及所有欧洲客户」，管道计划数日内部分重启、一个半月内全修；某美国最大银行称当前油价「虚高」，俄专家则认为最高可能冲至 130 美元。", "url": "https://ria.ru/20260914/neft-2117484510.html；https://www.vedomosti.ru/investments/news/2026/09/14/1228670-tsena-na-brent；https://www.interfax.ru/business/1116907；https://www.kommersant.ru/doc/8957074", "table": [["09-14 开盘", "107.77（+3.16%）"], ["09-14 盘中高", "109.36（+4.55%，最高 109.56）"], ["09-16 早盘", "108.34（+1.77）"], ["09-17", "ICE 跌破 103（102.89，-2.78%）；MOEX 结算 104.20"], ["09-18", "103.68"], ["供应侧", "沙特东西管道部分重启需数日、全修约 1.5 个月；Aramco 对欧 10 月断供"]]}, {"num": 2, "title": "欧洲气价破 1000 美元/千m³（2022-12 以来首次）；俄 7 月重回欧盟第四大供气国", "tag": "local", "tagText": "本地", "source": "生意人报", "time": "09-14 / 09-15", "summary": "伦敦 ICE 交易所气价自 2022 年 12 月以来首次突破 1000 美元/千立方米，荷兰 TTF 10 月期货升至约 1004 美元，价格受霍尔木兹海峡通行受阻以及与亚洲买家竞争双重推升；欧洲气价高企将进一步抬升欧洲制造业与物流成本。与此同时，2026 年 7 月俄罗斯在欧盟天然气（管道+液化）供应中排名第四、份额 14.1%（当月供应金额 11 亿欧元），1–7 月累计份额 17%，落后于美国与挪威但稳定保有前四；在「又一欧盟国家宣布放弃俄气」与「俄特使与德国 АдГ 筹备恢复供气会谈」并行的背景下，俄气对欧的边际议价环境有所改善。", "url": "https://www.kommersant.ru/doc/8954717；https://www.kommersant.ru/doc/8955188", "table": [["TTF 10 月期货", "约 1004 美元/千m³（2022-12 以来首次破千）"], ["俄 7 月对欧供气排名", "第 4"], ["7 月份额/金额", "14.1% / 11 亿欧元"], ["1–7 月累计份额", "17%"]]}, {"num": 3, "title": "通胀主线：周度 +0.02%、年通胀 6.2–6.3%，10 月起 ЖКУ 指数化将再推高 0.7 п.п.、逼近 7% 上限", "tag": "local", "tagText": "本地", "source": "Ведомости / 生意人报 / 俄统计局", "time": "09-16 / 09-17", "summary": "俄统计局数据显示 9 月 8–14 日 CPI 为 +0.02%，9 月以来累计 +0.07%、年初至今 +4.74%；食品端鸡蛋 +2.5% 居前，非食品端上涨的品类包括药品、洗衣粉、洗发水、智能手机与电视机（与电商 3C/美妆类目的成本与定价直接相关），童装、运动鞋服等回落，汽油 +0.4%、柴油 -0.3%。期内权威口径：普京在 9-17 经济会议上通报截至 9-14 年通胀 6.2%（央行预测全年 6–7%、2027 年回到 4%）；央行行长顾问 Тремасов 指出 10 月 1 日启动的住房公用事业费率指数化将直接给年通胀增加约 0.7 个百分点，通胀实际已接近预测区间上限；央行评估燃油市场对通胀的贡献约 0.7–0.8 п.п.，并指出上游成本已外溢（焦炭与油品生产价 8 月环比 +3.1%、年初至今 +30.5%，柴油生产价 +9.4%）。", "url": "https://www.vedomosti.ru/economics/news/2026/09/16/1229448-inflyatsiya-v-rossii；https://www.vedomosti.ru/economics/news/2026/09/16/1229262-sovetnik-glavi-tsb；https://www.kommersant.ru/doc/8956521", "table": [["周度 CPI（09-08~09-14）", "+0.02%"], ["年初至今", "+4.74%"], ["年通胀", "6.2%（普京口径）/6.3%（央行）"], ["燃油贡献", "0.7–0.8 п.п."], ["10-01 ЖКУ 指数化", "+约 0.7 п.п. → 逼近 7%"], ["上游", "柴油生产价 +9.4%、油品年初至今 +30.5%"]]}, {"num": 4, "title": "燃油市场：汽油年初至今 +21%、均价 78.51 卢布/升；柴油出口禁令延长至 10 月底，ФАС 立案 55 起", "tag": "local", "tagText": "本地", "source": "Ведомости / RBC / 生意人报", "time": "09-13 ~ 09-16", "summary": "俄统计局数据显示 9 月 8–14 日汽油零售价环比 +0.36%、年初至今累计 +21%（АИ-92 +21.4%、АИ-95 +21%、АИ-98+ +15.3%、柴油 +15.5%），全国均价 78.51 卢布/升（АИ-92 74.6、АИ-95 80.78、АИ-98+ 102.89），36 个地区涨价、20 个地区降价，柴油均价从 88.44 降至 88.05 卢布。政策侧：政府决定把柴油出口禁令再延长至 10 月底以保内需；副总理 Новак 主持燃油市场专题会议，能源部报告多家炼厂新增装置投产，ФАС 已立案 55 起、发出 83 次警告，并对叶卡捷琳堡、车里雅宾斯克、阿尔汉格尔斯克、特维尔、别尔哥罗德州及彼尔姆、克拉斯诺达尔边疆区实行「手工」保供；列宁格勒州州长称州内短缺预计不早于 10 月初缓解、正讨论单双号限购。", "url": "https://www.vedomosti.ru/business/news/2026/09/16/1229442-benzin-podorozhal；https://www.rbc.ru/economics/15/09/2026/6aa99ffa414aa27a393f1d59；https://www.vedomosti.ru/business/articles/2026/09/14/1228759-o-novih-merah", "table": [["汽油周环比", "+0.36%"], ["汽油年初至今", "+21%"], ["全国均价", "78.51 卢布/升"], ["柴油出口禁令", "延长至 10 月底"], ["ФАС", "立案 55 起、警告 83 次"], ["列宁格勒州", "短缺预计不早于 10 月初缓解"]]}, {"num": 5, "title": "利率背离：央行维持关键利率 14%（首次暂停降息），前十大银行平均最高存款利率升至 12.984%（连升 12 周）", "tag": "local", "tagText": "本地", "source": "RBC / 生意人报", "time": "09-11 ~ 09-18", "summary": "央行 9-11 维持关键利率 14%——为一年半降息周期中的首次暂停、未给出方向信号；与之背离的是负债端：俄前十大银行卢布存款平均最高利率在 9 月上旬升至 12.95%，至 9-18 进一步升至 12.984%（RBC 口径，已连续 12 周上行），同期央行已下调关键利率 0.25 个百分点。分析认为这反映银行争夺长期负债的竞争与储户的通胀预期，高存款回报继续强化居民储蓄倾向、抑制家电/灯具/美妆等非必需消费的需求弹性；对企业而言，Q4 备货的资金成本与账期需按高位利率重算。", "url": "https://www.kommersant.ru/doc/8954751；https://www.rbc.ru/finances/18/09/2026/6aac33049a79472450446886", "table": [["关键利率（俄）", "14%（09-11 维持，首次暂停）"], ["十大行最高存款利率", "12.95%（上旬）→ 12.984%（09-18）"], ["连升", "12 周"], ["含义", "储蓄倾向强化、耐用品需求承压"]]}, {"num": 6, "title": "汇率：美元连续 7 个交易日守在 84 区间（84.17→84.51），8 月外汇振幅 8.2%/8.5%", "tag": "local", "tagText": "本地", "source": "俄央行 / Ведомости", "time": "09-15 ~ 09-18", "summary": "央行官方汇率本周基本走平：9-15 美元 84.3363、欧元 97.7626、人民币 12.5353；9-17 美元 84.1732、欧元 97.1275、人民币 12.5457；9-18 美元 84.5093、欧元 97.4984、人民币 12.5788——美元已连续第 7 个交易日维持在 84 卢布附近，卢布在选举周与油价回落背景下保持窄幅波动。央行《8 月金融市场风险综述》显示 8 月美元对卢布波动区间 79.46–85.95（振幅 8.2%，7 月 5.2%）、人民币 11.77–12.77（振幅 8.5%，7 月 5.9%），8 月美元升值 7.2% 至 85.6、人民币升值 7.7% 至 12.73，非金融企业外汇净卖出环比 -15.3% 至 188 亿美元。进口成本与定价换算窗口因此相对稳定。", "url": "https://www.vedomosti.ru/finance/news/2026/09/16/1229384-derzhit-kurs；https://www.vedomosti.ru/economics/articles/2026/09/14/1228789-tsb-o-rastuschei-volatilnosti；https://www.cbr.ru/scripts/XML_daily.asp", "table": [["09-15", "美元 84.3363 / 欧元 97.7626 / 人民币 12.5353"], ["09-17", "美元 84.1732 / 欧元 97.1275 / 人民币 12.5457"], ["09-18", "美元 84.5093 / 欧元 97.4984 / 人民币 12.5788"], ["8 月振幅", "美元 8.2%、人民币 8.5%"], ["企业净售汇（8 月）", "188 亿美元（-15.3% 环比）"]]}, {"num": 7, "title": "财政与储备：8 月预算盈余 6060 亿卢布，2027 年赤字约 2% GDP（油价假设 50 美元），国际储备升至 7582 亿美元", "tag": "local", "tagText": "本地", "source": "俄新社 / 生意人报 / Ведомости.", "time": "09-17 / 09-18", "summary": "普京在 9-17 经济问题会议上通报：截至 9-14 年通胀 6.2%、全年经济增长在 1% 以内、上半年实际工资增长 6.5%、8 月联邦预算盈余 6060 亿卢布（主要来自非油气收入）、2027 年预算赤字约占 GDP 2% 且基于每桶约 50 美元的保守油价假设，三年期预算与 2027–2029 年社会经济发展预测正在收尾。储备与出口收入侧：国际储备在 9-11 达到 7582 亿美元、一周增加 47 亿美元（主要来自资产重估），8 月石油出口收入 138.7 亿美元。财政缓冲的现实基础因此同时取决于储备规模与油气收入节奏。", "url": "https://ria.ru/20260917/putin-2118332354.html；https://www.kommersant.ru/doc/8957236", "table": [["8 月预算", "盈余 6060 亿卢布（非油气收入为主）"], ["2027 赤字", "约 2% GDP（油价假设 50 美元）"], ["2026 增长", "1% 以内"], ["实际工资（上半年）", "+6.5%"], ["国际储备", "7582 亿美元（周 +47 亿）"], ["8 月石油出口收入", "138.7 亿美元"]]}, {"num": 8, "title": "宏观与外部账户：二季度 GDP +1.3%、经常账户顺差 339 亿美元（+1.6 倍），中国 8 月工业增加值 +5.2%", "tag": "local", "tagText": "本地", "source": "生意人报 / 俄央行", "time": "09-13 / 09-16", "summary": "俄统计局确认二季度 GDP 同比增长 1.3%、上半年增长 0.6%，与此前初值一致；在关键利率 14%、8 月年通胀 6.33%（当月出现 0.08% 通缩）的背景下，1.3% 的季度增速显示经济维持低速扩张，制造业与军工相关行业仍是主要支撑、消费与投资动能偏弱。俄央行数据显示前 7 个月经常账户顺差增至 339 亿美元、同比增长 1.6 倍，出口因世界价格上涨而增长 16.3%。中国 8 月规模以上工业增加值同比增长 5.2%（7 月 4.5%，预期 4.8%）、其中制造业 +6.1%——作为俄最大贸易伙伴与灯具、电器、美妆的主要供给方，该指标是到货节奏与成本的先行变量。", "url": "https://www.kommersant.ru/doc/8953817；https://www.kommersant.ru/doc/8955667；https://www.kommersant.ru/doc/8955671", "table": [["二季度 GDP", "+1.3%"], ["上半年 GDP", "+0.6%"], ["经常账户（前 7 月）", "339 亿美元（+1.6 倍）"], ["出口（价格因素）", "+16.3%"], ["中国 8 月工业增加值", "+5.2%（制造业 +6.1%）"]]}, {"num": 9, "title": "全球利率重心上移：美联储自 2023 年以来首次加息 25bp 至 3.75–4%，特朗普要求降至 1% 以下", "tag": "local", "tagText": "本地", "source": "Ведомости / RBC / 塔斯社", "time": "09-16", "summary": "美联储将联邦基金利率目标区间上调 25 个基点至 3.75–4%，为 2023 年 7 月以来首次加息；声明称经济「以稳健速度增长」、生产率增速高、资本开支显著，但通胀仍处高位，此举有助于把通胀降至 2%。白宫对此表示遗憾，特朗普公开要求美联储把利率降至 1% 或以下，并威胁称若要求未被满足，美国将停止与对美存在贸易逆差的国家的贸易（含欧盟方向）。全球利率重心上移对新兴市场货币与大宗商品定价链条构成新的扰动，也影响卢布资产的相对吸引力。", "url": "https://www.vedomosti.ru/economics/news/2026/09/16/1229467-frs-povisila-stavku", "table": [["美联邦基金利率", "3.75–4%（+25bp）"], ["性质", "2023-07 以来首次加息"], ["白宫/特朗普", "要求降至 ≤1%，威胁停止与逆差国贸易"]]}, {"num": 10, "title": "俄油出口价格结构：ESPO 对华溢价创 2018 年以来纪录 $12.5/桶，Urals 折价收窄", "tag": "local", "tagText": "本地", "source": "生意人报 引 Argus 周报", "time": "09-17", "summary": "据 Argus 周报，9 月 13 日当周俄罗斯 ESPO（ВСТО）对华山东到岸溢价升至 $12.5/桶（对 ICE Brent），为该报价 2018 年发布以来最高，ESPO 山东到岸价达 $117.11/桶；Urals 山东溢价升至 $6/桶（到岸 $110.69），对印度 Dated Brent 溢价升至 $2.25/桶（到岸 $120.79）；Primorsk 港 Urals 对 Dated Brent 的折价一个月内收窄 $4.25 至 $21.65/桶。中东供应中断使俄油成为替代选项，俄出口收入与卢布结汇因此获得额外支撑，但也意味着俄方折扣空间被压缩、买家议价能力阶段性下降。", "url": "https://www.kommersant.ru/doc/8956451", "table": [["ESPO 对华溢价", "$12.5/桶（2018 年以来最高）"], ["ESPO 山东到岸", "$117.11/桶"], ["Urals 山东", "$6/桶溢价，到岸 $110.69"], ["Urals 对布伦特折价", "收窄 $4.25 至 $21.65/桶"]]}, {"num": 11, "title": "消费与居住指标走弱：租金 2020 年以来首次下降、莫斯科新房需求 -37.2%，居民资产转向黄金（8 月 +17.4%）", "tag": "local", "tagText": "本地", "source": "塔斯社 / 生意人报", "time": "09-13 ~ 09-16", "summary": "塔斯社数据显示 2026 年 9 月俄一居室与两居室公寓平均租金同比均下降 1.7%（分别降至 3.11 万与 3.88 万卢布），为 2020 年以来首次下降，反映居民实际收入承压与租赁需求走弱；1–8 月莫斯科州新建住房需求同比下降 8.8% 至 2.56 万笔交易、莫斯科市下降 37.2%，购房者向价格更低的近郊转移。资产端，俄央行数据显示 8 月黄金以 17.4% 的收益率在俄金融资产中排名第一（欧元存款第二、人民币资产第三）。对经营家具（mosai）、灯具与家居类的卖家而言，「新房交付—家装」的增量场景持续偏弱，需求更多要靠换新与平台流量争夺。", "url": "https://tass.ru/nedvizhimost/28115355；https://www.kommersant.ru/doc/8953705；https://www.kommersant.ru/doc/8954710", "table": [["租金（9 月）", "同比 -1.7%（一居 3.11 万、两居 3.88 万卢布）"], ["新房需求（1-8 月）", "莫斯科 -37.2%、莫斯科州 -8.8%"], ["黄金收益率（8 月）", "17.4%（金融资产第一）"]]}, {"num": 12, "title": "价格管理新工具：政府批准 24 类食品价格监测清单，2027-01-01 起执行", "tag": "local", "tagText": "本地", "source": "РИА Новости / Lenta.ru", "time": "09-13", "summary": "俄政府已批准需监测价格形成情况的食品清单，自 2027 年 1 月 1 日起实施，共 24 类：牛肉、猪肉、羊肉、鸡肉、鱼、黄油与葵花籽油、牛奶、奶酪、鸡蛋、糖、盐、面粉、面包、大米、荞麦、通心粉、土豆、甜菜、洋葱、胡萝卜、西红柿、黄瓜、卷心菜。获得数据查询权的机构包括农业部、工贸部、经济发展部、联邦反垄断局与统计局，将获取经营主体关于食品销售与供应、利润、收入与支出的数据。这是俄在年通胀高于目标背景下强化价格管理的新工具，食品零售与分销商需提前准备数据报送能力与合规成本预算。", "url": "https://ria.ru/20260913/pravitelstvo-2117461393.html", "table": [["清单规模", "24 类食品"], ["执行时点", "2027-01-01"], ["查询机构", "农业部/工贸部/经发部/ФАС/统计局"], ["数据范围", "销售与供应、利润、收支"]]}, {"num": 13, "title": "外贸结构：全球南方占俄外贸 76.3%（上半年 +14.5%），俄日贸易 +19.51%，欧盟俄化肥进口 1–7 月缩水 3.7 倍", "tag": "local", "tagText": "本地", "source": "俄新社 / 塔斯社 / Ведомости", "time": "09-14 ~ 09-17", "summary": "工贸部副部长切库绍夫表示全球南方国家已占俄外贸 76.3% 且逐年上升，上半年对全球南方贸易额增长 14.5%、近三年增长 24.5%，未来增量更多依靠自贸协定（已与印尼签署等）。日本财务省数据显示 8 月俄日贸易额同比增长 19.51%（日本自俄进口 +24%），其中日本对俄汽车供应 +18.7%、汽车零配件 +2.5%，同期日本自俄 LNG 进口 -2.2%、煤炭 -31.6%。欧盟对俄化肥采购大幅萎缩：7 月进口额降至年内最低 3160 万欧元（同比 -27%），1–7 月累计 3.295 亿欧元、同比缩水 3.7 倍，主因欧盟在 6.5% 关税之上加征附加税并计划升至货值 100%。此外俄小麦出口 7–9 月将创 2010 年以来最低。", "url": "https://ria.ru/20260914/chekushov-2117089738.html；https://tass.ru/ekonomika/28115277；https://www.vedomosti.ru/business/news/2026/09/16/1229222-eksport-pshenitsi", "table": [["全球南方占比", "76.3%（上半年 +14.5%）"], ["8 月俄日贸易额", "+19.51%（日对俄汽车 +18.7%）"], ["欧盟俄化肥（7 月）", "3160 万欧元（-27%）；1–7 月 -3.7 倍"], ["小麦出口（7-9 月）", "2010 年以来最低"]]}, {"num": 14, "title": "资本市场与保险：ВТБ 股价创历史新低、«Евротранс» 违约被查操纵，央行向 РНПК 注资 1650 亿卢布", "tag": "local", "tagText": "本地", "source": "生意人报 / Ведомости", "time": "09-13 / 09-17", "summary": "资本市场持续承压：央行副行长 Мумута 表示正调查 «Евротранс» 债券违约中的市场操纵与内幕迹象，莫斯科交易所将该股从一级降至三级上市；«Самолет» 债券因可能移交部分管理权（Сбербанк 或接手部分业务）盘中一度下跌 0.2%–11.6%；ВТБ 股价创历史新低 49.435 卢布；央行此前已就欧盟限制承认俄法院判决向欧盟普通法院提起诉讼。保险侧，央行宣布对国家再保险公司 РНПК 注资 1650 亿卢布——РНПК 在恐袭与蓄意破坏风险上的再保总责任已超 8 万亿卢布，注资后资本仍不足 2000 亿卢布，即便计入此前 7500 亿卢布担保仍可能需继续注资；该举措与电商仓储遇袭赔付压力直接相关，无人机险与货物险的承保能力有望改善。", "url": "https://www.kommersant.ru/doc/8957268；https://www.kommersant.ru/doc/8953798", "table": [["ВТБ 股价", "历史新低 49.435 卢布"], ["«Евротранс»", "违约被查操纵/内幕，降级至三级上市"], ["РНПК 注资", "1650 亿卢布"], ["恐袭/破坏再保责任", "> 8 万亿卢布"], ["政府担保", "此前 7500 亿卢布"]]}, {"num": 15, "title": "其他大宗与结构指标：钻石价格指数跌至历史最低 82 点，俄居民外汇与存款配置继续偏向保值", "tag": "local", "tagText": "本地", "source": "生意人报", "time": "09-15", "summary": "受成品钻环节库存积压与合成钻石竞争影响，8 月行业钻石价格指数跌至 82 点、创历史新低，其中小颗粒钻石跌幅最明显，分析机构预计市场恢复不早于 2–3 年后；该趋势对俄钻石出口（АЛРОСА）与高值饰品类目的定价体系均有传导，也给珠宝/美妆类高溢价礼品的定价策略带来压力。结合黄金 8 月以 17.4% 收益率居金融资产首位、存款利率升至 12.98% 的背景，俄居民资产配置继续偏向保值与高息工具，可选消费品类的需求弹性相应受压。", "url": "https://www.kommersant.ru/doc/8954756", "table": [["钻石价格指数（8 月）", "82 点（历史最低）"], ["恢复预期", "不早于 2–3 年"], ["受影响", "АЛРОСА 出口、高值饰品/美妆礼盒定价"]]}, {"num": 16, "title": "中国 8 月制造业景气与俄采购联动：工业增加值 +5.2% 支撑对俄供应链，仓储自动化引入中国方案", "tag": "local", "tagText": "本地", "source": "生意人报 / 零售网 (Retail.ru)", "time": "09-16 / 09-17", "summary": "中国 8 月规模以上工业增加值同比增长 5.2%（高于 7 月 4.5% 与预期 4.8%），其中制造业增长 6.1%、采矿业下降 1.4%——对依赖中国供给的灯具、电器、美妆等品类，这是到货节奏与采购价格的先行指标，宜同步观察运价与交期变化。产业联动侧，俄 Merlion 集团宣布进入机器人仓储技术与场内物流自动化设备分销，旗下履约运营商 «Кактус» 与合肥井松智能科技（品牌 Xgen Robot）签署分销协议（«Кактус» 月处理逾 15 万线上订单），显示中国仓储机器人品牌正借本土分销商加速进入俄市场。", "url": "https://www.kommersant.ru/doc/8955671；https://www.retail.ru/news/gk-merlion-vyydet-na-rynok-robotizirovannoy-skladskoy-tekhniki-17-sentyabrya-2026-282245/", "table": [["中国工业增加值（8 月）", "+5.2%"], ["制造业", "+6.1%"], ["采矿业", "-1.4%"], ["中俄联动案例", "Merlion×Xgen Robot 仓储机器人分销"]]}, {"num": 17, "title": "【周五补充】普京：社会 газификация 计划改为无期限，ИЖС 占在建住房过半", "tag": "local", "tagText": "本地", "source": "塔斯社 / 俄新社", "time": "09-18", "summary": "普京 9-18 在出席社会燃气化设施启用仪式时表示，社会燃气化（газификация）计划将改为无期限执行，并称小型城镇的燃气接入需求「巨大」、俄拥有世界最大天然气储量、燃气储备应服务于国家发展；他同时指出，独立住宅建设（ИЖС）已占俄在建住房的一半以上，并要求保证地方航空运输与区域交通连通性。对经营家居、灯具、家装品类的商家而言，「社会燃气化+独立住宅」的组合是少数确定性较高的增量场景，可作为 Q4 与明年上半年的渠道与选品方向。本条为 10:00 日报窗口之后（09:00-17:00 北京时）的补充抓取。", "url": "https://tass.ru/ekonomika/28126187；https://ria.ru/20260918/putin-2118572624.html", "table": [["社会燃气化", "计划改为无期限"], ["独立住宅（ИЖС）", "占在建住房一半以上"], ["数据来源", "09-18 塔斯社/俄新社（日报窗口后补充抓取）"]]}]}, {"icon": "💄", "name": "美妆", "items": [{"num": 1, "title": "俄化妆品市场「量降价升」：2025 年销量 39 亿件（-2%），面部护理品牌数减少 13.3%、市场规模 1.3 万亿卢布（+20%）", "tag": "local", "tagText": "本地", "source": "New Retail 引 Известия 与 BusinesStat/Nielsen", "time": "09-15", "summary": "New Retail 援引 Известия 与 BusinesStat/Nielsen 数据：2025 年俄化妆品总销量 39 亿件（以包装计）、同比减少 2%；面部护理与化妆品品牌数量减少 13.3%，为 FMCG 各品类中降幅最大，其后为儿童用品 -11%、剃须 -7.1%、护发 -5.3%、身体护理 -4.1%；线下连锁（Лента、Магнит）以优化基础品类组合应对，平台渠道则逆势增长；行业口径显示市场规模已达约 1.3 万亿卢布（+20% 卢布值），量降价升特征明显——单价上行是维持规模的主要动力，对定价带与规格策略构成直接压力。", "url": "https://new-retail.ru/novosti/retail/prodazhi_kosmetiki_v_rossii_sokratilis_na_2/", "table": [["2025 销量", "39 亿件（-2%）"], ["品牌数降幅最大", "面部护理与化妆品 -13.3%"], ["其他", "儿童用品 -11%、剃须 -7.1%、护发 -5.3%"], ["市场规模", "约 1.3 万亿卢布（+20% 卢布值）"]]}, {"num": 2, "title": "线下美妆渠道继续收缩：The Act 到 11 月关闭 9 家门店中的 4 家，Lush 体系连锁 Oomph 申请破产", "tag": "local", "tagText": "本地", "source": "生意人报", "time": "09-14", "summary": "美妆连锁 The Act 在社交平台宣布优化门店网络：到 2026 年 11 月将关闭 4 家门店（沃罗涅日 «Галерея Чижова»、伏尔加格勒 «Ворошиловский»、萨马拉 «Космопорт»、圣彼得堡 ТРЦ «Лето»），据公司官网品牌目前共 9 家门店，缩减幅度接近一半。同期以 Lush 产品体系为基础的化妆品连锁 Oomph 向法院提交破产申请，公司表示这是为挽救业务而非走完破产程序，即寻求司法程序下的债务重组/保护。在高利率（14%）与消费谨慎环境下，中型美妆连锁的租金与库存资金压力显著上升，渠道资源进一步向头部连锁与平台集中。", "url": "https://www.kommersant.ru/doc/8954647；https://www.kommersant.ru/doc/8954604", "table": [["The Act 门店", "9 家 → 到 2026-11 关闭 4 家"], ["关闭城市", "沃罗涅日、伏尔加格勒、萨马拉、圣彼得堡"], ["Oomph", "申请破产（拟债务重组）"]]}, {"num": 3, "title": "韩妆对俄持续放量、原料双向流动：1–8 月韩对俄化妆品出口 +20.3% 至 2.877 亿美元，韩国 8 月自俄进口动物源原料创两年新高", "tag": "local", "tagText": "本地", "source": "俄新社 / 生意人报 引韩国海关", "time": "09-15 / 09-16", "summary": "韩国海关数据：1–8 月韩国对俄出口 HS 3304 类化妆品与护肤品（含防晒、美甲护理等）2.877 亿美元，较去年同期 2.392 亿美元增长 20.3%、增量约 4850 万美元，主要来自「其他彩妆与护肤品」子类（精华、乳液、精华霜等，由 2.226 亿增至约 2.77 亿美元）。同期反向流动显著：8 月韩国自俄罗斯进口用于化妆品、膳食补充剂与香水的动物源原料（龙涎香、麝香、马鹿茸等）达 480 万美元，为近两年最高、环比增长近 4 倍，俄当月成为韩国该类原料最大供应国。原料与成品双向流动，说明制裁背景下俄韩在美妆供应链上的分工反而加深。", "url": "https://ria.ru/20260915/koreja-2117703441.html；https://ria.ru/20260916/koreja-2118097459.html", "table": [["韩国对俄化妆品（1-8 月）", "2.877 亿美元（+20.3%）"], ["增量", "约 4850 万美元"], ["韩国自俄原料（8 月）", "480 万美元（环比近 4 倍，两年最高）"]]}, {"num": 4, "title": "欧盟对俄美妆出口收缩：7 月香水 -37%、化妆品 -16%（环比回升），高端进口替代窗口打开", "tag": "local", "tagText": "本地", "source": "俄新社 引 Eurostat", "time": "09-18", "summary": "欧统局数据显示，7 月欧盟对俄香水与淡香水出口 2640 万欧元、同比 -37%，但环比 +7%、为 2 月以来最高；化妆品出口 3450 万欧元、环比 +4%、同比 -16%。1–7 月累计香水 1.902 亿欧元（-22%）、化妆品 2.368 亿欧元（-17%）；结构上香水主要由法国（880 万欧元）、西班牙（620 万）、意大利（530 万）供应，化妆品以法国（近 1200 万）、德国（近 700 万）、波兰（550 万）居前。欧盟高端供给收缩与韩妆、本土品牌的放量并行，为替代品牌留出价格带与货架空间。", "url": "https://ria.ru/20260918/postavki-2118361520.html", "table": [["欧盟对俄香水（7 月）", "2640 万欧元（-37% 同比，+7% 环比）"], ["欧盟对俄化妆品（7 月）", "3450 万欧元（-16% 同比，+4% 环比）"], ["累计（1-7 月）", "香水 -22%、化妆品 -17%"], ["主要供应国", "法国、德国、波兰、西班牙、意大利"]]}, {"num": 5, "title": "消费行为与合规：副总理称「到店试用、线上下单」，«Золотое яблоко» 向社媒比价帖发律师函，网红美妆公司被清算", "tag": "local", "tagText": "本地", "source": "生意人报 / 俄新社 / Retail.ru", "time": "09-15 ~ 09-17", "summary": "副总理 Григоренко 表示俄女性消费者到美妆实体店主要目的是查看与试用产品、实际下单却在互联网完成，该判断与线上美妆渠道增长、线下中型连锁收缩（The Act 关店、Oomph 破产）互为印证——线下门店正更多承担「体验与种草」功能，线上商品卡、图文与测评内容质量直接决定转化。渠道端，美妆连锁 «Золотое яблоко» 在斯塔夫罗波尔边疆区开设首家门店（区域扩张继续），同时就一名用户在 Threads 发布的价格对比帖发出诉前律师函（理由为「不正当广告」并损害品牌声誉）。合规端，联邦税务局以登记信息不实为由于 9-11 将网红 Карина Кросс 持股的「Кара Кросс косметикс」移出法人登记，对同类轻资产美妆品牌的合规成本构成示范效应。此外 Авито Услуги 调查显示 38% 俄女性不会因其他事务取消已排定的美容预约。", "url": "https://www.kommersant.ru/doc/8955176；https://ria.ru/20260915/jabloko-2117870293.html；https://www.retail.ru/news/fns-likvidirovala-kosmeticheskuyu-kompaniyu-blogera-kariny-kross-17-sentyabrya-2026-282252/", "table": [["购买路径", "到店试用 + 线上下单"], ["线下承压", "The Act 关店、Oomph 破产"], ["品牌动作", "«Золотое яблоко» 开区域首店、发比价帖律师函"], ["合规", "网红美妆公司被税务局清算（09-11）"]]}, {"num": 6, "title": "个护相邻品类：大型连锁家用化学品 2025 年营业额 +10%，本土品牌与进口替代比例上升", "tag": "local", "tagText": "本地", "source": "Retail.ru（АКОРТ）", "time": "09-14", "summary": "АКОРТ（零售企业联合会）代表 Протасова 表示，2025 年大型零售网络的家用化学品板块营业额增长 10%，成为非食品零售的重要增长点，本土品牌需求上升、进口替代比例提高。该品类与个护美妆在货架与供应链上高度重叠，对经营美妆（mosai）与清洁电器（deepclean）的商家而言，线下大连锁的货架资源与本土化采购倾向值得重点跟进；同时叠加本周 «Честный знак» 标记要求（含化妆品）与平台化趋势，货权、贴码与数据报送能力正在成为进场门槛。", "url": "https://www.retail.ru/news/oborot-bytovoy-khimii-v-krupnykh-setyakh-v-2025-godu-vyros-na-10-14-sentyabrya-2026-282105/", "table": [["家用化学品（2025）", "大型连锁营业额 +10%"], ["结构", "本土品牌需求上升、进口替代提高"]]}]}, {"icon": "🔌", "name": "电器", "items": [{"num": 1, "title": "М.Видео 接入 Магнит 的 5000 个自提点（覆盖 24 城），并扩展「М.Мастер」上门服务至厨房家具与水暖电气", "tag": "local", "tagText": "本地", "source": "生意人报 / Retail.ru", "time": "09-14 / 09-15", "summary": "М.Видео 将 Магнит 覆盖 24 个俄城市、约 5000 个自提点（ПВЗ）接入其线上订单配送网络，作为既有自提与物流基础设施的补充：Магнит 今年夏天宣布关闭自有电商站与 App 后，其门店网络转为服务第三方履约，为家电零售商提供了低成本的下沉末端网络，末端触点密度提升有利于降低退换货成本与配送时效。服务侧，М.Видео 宣布扩大「М.Мастер」上门服务范围：除既有的家电与电子设备安装、维修、外运与回收外，新增厨房与家具组装以及水暖、电气类工程服务预约，把服务收入与商品销售绑定以提升客单与复购——对小家电与清洁电器卖家而言，平台化安装/维修能力正在成为差异化竞争点。", "url": "https://www.kommersant.ru/doc/8954760；https://www.retail.ru/news/m-video-masshtabiruet-servisnoe-napravlenie-vsled-za-rostom-marketpleysa-14-sentyabrya-2026-282066/", "table": [["М.Видео×Магнит", "约 5000 个 ПВЗ、24 城"], ["М.Мастер 新增", "厨房/家具组装、水暖、电气施工"], ["背景", "Магнит 关闭自有电商，门店转第三方履约"]]}, {"num": 2, "title": "换机与装机需求：56% 居民半年内拟购新手机（10% 首发买最新 iPhone），Ситилинк 品类榜电脑零组件占 5 席", "tag": "local", "tagText": "本地", "source": "Retail.ru 引阿维托 / «Ситилинк»", "time": "09-15 / 09-16", "summary": "阿维托调查显示 56% 的俄受访者计划在未来半年内购买新智能手机，其中每十人有一人（10%）表示准备在新款 iPhone 开售后立即购买——指向 Q4 3C 换机需求仍有基础且高端需求集中在首发窗口，适合用配件与保修服务承接中低价位需求、用首发货源承接高端需求。«Ситилинк» 发布的 2026 年品类数据显示需求前十为笔记本电脑、智能手机、电视机、显示器、洗衣机、冰箱、路由器、打印机、SSD 与处理器，其中电脑零组件占 5 席（SSD、处理器、主板、显卡、内存），公司归因于用户自行组装与升级 PC 的意愿上升；用户平均比较 2–4 款机型，16 ГБ 内存+512 ГБ 已成「舒适下限」。", "url": "https://www.retail.ru/news/56-rossiyan-planiruyut-kupit-novyy-smartfon-v-blizhayshie-polgoda-issledovanie-a-15-sentyabrya-2026-282147/；https://www.retail.ru/news/sitilink-v-2026-godu-samoy-vostrebovannoy-tekhnikoy-u-rossiyan-stali-noutbuki-sm-16-sentyabrya-2026-282184/", "table": [["半年内拟购手机", "56%（10% 拟首发买最新 iPhone）"], ["Ситилинк 前十", "笔记本/手机/电视/显示器/洗衣机/冰箱/路由器/打印机/SSD/处理器"], ["选购行为", "平均比较 2–4 款；16ГБ+512ГБ 为舒适下限"]]}, {"num": 3, "title": "DIY/家居零售客单价全线走高（ВсеИнструменты +16%、Лемана Про +7%、Hoff +4%），但行业预期转弱", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-16", "summary": "行业统计显示 2026 年初以来平均客单价（средний чек）同比显著上升：«ВсеИнструменты.ру» +16%、«Лемана Про» +7%、«Hoff» +4%；下单频次前五为 «Лемана Про» > «Петрович» > «Максидом» > «ВсеИнструменты.ру» > «Hoff»。结构上 «ВсеИнструменты.ру» 的 B2B 占比已超 75%（均价自然更高），«Лемана Про» 1–8 月家具销售 +38%。客单价上行与件数压缩（消费者信心 -15%、29% 消费者压缩单次采购件数）同时发生，说明增长更多来自单价而非频次——对家居、灯具、清洁电器的组合销售与套装定价是有利背景。", "url": "https://www.retail.ru/news/s-nachala-2026-go-goda-sredniy-chek-v-vseinstrumenty-ru-lemana-pro-i-hoff-pokaza-16-sentyabrya-2026-282162/", "table": [["平均客单价", "ВсеИнструменты +16%、Лемана Про +7%、Hoff +4%"], ["ВсеИнструменты B2B", "占比 >75%"], ["Лемана Про 家具（1-8 月）", "+38%"]]}, {"num": 4, "title": "换季与配件需求：8 月家庭清洁用品销售 +2%，Авито 显卡销量环比 +16%（供给趋稳释放需求）", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-14 / 09-17", "summary": "线上五金家居超市 «ВсеИнструменты.ру» 数据显示 2026 年 8 月俄家庭清洁用品销量同比增长 2%，与入秋前房屋整理、复工复学以及夏季过后基础清洁用品更新有关——对清洁电器（deepclean）与小家电（mosaihome）卖家，9–10 月换季是清洁相关品类的需求窗口，建议配合换季场景做组合营销与备货。配件侧，「Авито」统计 8 月平台显卡销量环比 +16%、同比 +5%，增长来自返校季装机与游戏旺季前的升级需求，也与新一代显卡供给与渠道趋稳、型号覆盖扩大有关，需求侧还包含图形处理、视频剪辑与 AI 计算任务——说明「供给稳定性」本身即可释放被压抑的替换需求。", "url": "https://www.retail.ru/news/vseinstrumenty-ru-pered-osenyu-rossiyane-obnovili-inventar-dlya-tshchatelnoy-ubo-14-sentyabrya-2026-282098/；https://www.retail.ru/news/avito-prodazhi-videokart-vyrosli-na-16-17-sentyabrya-2026-282236/", "table": [["家庭清洁用品（8 月）", "销量同比 +2%"], ["显卡（8 月）", "销量环比 +16%、同比 +5%"], ["需求动因", "换季整理、返校装机、供给趋稳"]]}, {"num": 5, "title": "产业政策与本地化：工贸部与业界拟定微电子新战略（组件配额、包销合同），CPI 显示智能手机/电视机涨价", "tag": "local", "tagText": "本地", "source": "生意人报 / Ведомости", "time": "09-16", "summary": "俄工贸部与企业界正拟定微电子产业新发展战略，业界建议引入组件配额、包销（офтейк）合同与税收/采购优惠以刺激对俄产微芯片的需求；该战略若落地，将影响俄产电子元器件（含家电与照明控制器所需芯片）的供给结构与价格，也为本地化组装、贴牌路径提供政策窗口，采购依赖进口元器件的商家宜同步跟踪本地替代方案的交期与认证要求。价格侧，俄统计局 9-8~9-14 周报显示非食品端智能手机与电视机进入涨价名单（同期药品、洗衣粉、洗发水亦上涨），成本端对 3C 与个护品类的定价构成上行推力。", "url": "https://www.kommersant.ru/doc/8955669；https://www.vedomosti.ru/economics/news/2026/09/16/1229448-inflyatsiya-v-rossii", "table": [["微电子战略", "组件配额、包销合同、税收与采购优惠"], ["影响", "家电/照明控制器芯片供给结构与价格"], ["涨价品类（9-8~9-14）", "智能手机、电视机、药品、洗涤用品"]]}, {"num": 6, "title": "仓储自动化与渠道成本：Merlion 引入中国 Xgen Robot，机器人配送累计交付 100 万单", "tag": "local", "tagText": "本地", "source": "Retail.ru / 俄新社", "time": "09-14 / 09-17", "summary": "Merlion 集团宣布进入机器人仓储技术与场内物流自动化设备分销：旗下履约运营商 «Кактус»（月处理逾 15 万线上订单）与合肥井松智能科技（品牌 Xgen Robot）签署分销协议，俄仓储自动化市场正因人力短缺与电商增长快速扩张，中国仓储机器人品牌借本土分销商加速入场。官方侧，工贸部副部长切库绍夫透露俄平台与连锁零售正加快引入机器人，机器人配送已累计交付 100 万单，从搬运机械臂到配送机器人均在铺开；结合 42% 零售商计划靠 AI 压缩人力（待核实）的口径，自动化已从试点转入成本竞争阶段。", "url": "https://www.retail.ru/news/gk-merlion-vyydet-na-rynok-robotizirovannoy-skladskoy-tekhniki-17-sentyabrya-2026-282245/；https://ria.ru/20260914/chekushov-2117089738.html", "table": [["Merlion×Xgen Robot", "仓储机器人与场内物流自动化分销"], ["«Кактус» 规模", "月处理逾 15 万线上订单"], ["机器人配送", "累计交付 100 万单（工贸部口径）"]]}]}, {"icon": "💡", "name": "灯具", "items": [{"num": 1, "title": "灯具栏目本周持续静默（本月连续多周无新增格局变化）；合规节点须提前锁定，间接变量集中在运输与家装需求", "tag": "local", "tagText": "本地", "source": "8 个 P0/P1 本土信源 + «Консорциум Светотехника»（light-cons.ru）", "time": "09-14 ~ 09-18", "summary": "本周 5 期日报窗口内，RIA、TASS、Interfax、Kommersant、Vedomosti、Izvestia、Gazeta.ru、Lenta 八个 P0/P1 本土信源及行业信源 «Консорциум Светотехника»（light-cons.ru）均无涉及俄罗斯照明/灯具市场格局的新条目（无新政策、无渠道或产能变化，本栏目连续多周静默）。存量口径不变：2025 年俄灯具产量 2380 万只（同比 -21.4%）、吊灯产量 12.34 万只（+38.9%），进口仍以中国产品为主。合规节点：自 2026-05-01 起含灯具在内的电子电工与无线电电子产品实施 «Честный знак» Data Matrix 强制标记，2026-12-01 起全面禁止未标记产品流通，批发与分销环节须在 11-30 前完成库存标记或售罄。本周间接变量：①袭击与机场限航持续扰动伏尔加流域与中部到仓时效（9-15 塔甘罗格、9-18 莫斯科方向 35 架）；②新房需求下滑（莫斯科 -37.2%、租金 -1.7%）压制家装类照明增量；③存款利率升至 12.984% 抬升 Q4 备货资金成本；④Brent 周内 108→103 略缓运输与包材成本压力；⑤家具渠道平台化（平台占收入 37%）为家居灯具类目打开同步窗口；⑥社会燃气化改为无期限、ИЖС 占在建住房过半（9-18），是少数确定性增量场景。", "url": "https://edie-fang.github.io/russia-daily/；https://light-cons.ru/", "table": [["本周新增格局事件", "0（连续多周静默）"], ["灯具产量（2025）", "2380 万只（-21.4%）"], ["吊灯产量", "12.34 万只（+38.9%）"], ["强制标记", "2026-05-01 起；2026-12-01 起禁止未标记流通"], ["库存标记/售罄截止", "2026-11-30"], ["间接变量", "袭击与限航、新房需求、利率、油价、燃气化/ИЖС"]]}]}, {"icon": "🚗", "name": "汽车（扩展）", "items": [{"num": 1, "title": "俄车企本地化提速：Volga 在下诺夫哥罗德实现全流程生产，「Атом」电动车在 «Москвич» 工厂启动量产（本地化率 70%）", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-14 / 09-16", "summary": "下诺夫哥罗德工厂自 8 月起按「全流程」工艺生产 Volga 汽车，具备焊接、涂装与总装能力，80% 关键工序由机器人自动完成，涂装车间包含 19 道清洗、磷化与阴极电泳工序；Volga 计划推出 D-SUV、C-SUV 与 D 级轿车三款车型，首批车将于 2026 年三季度到店。同期电动车 «Атом» 已在 «Москвич» 工厂启动全流程量产（分段焊接车身、涂装、防腐、整车装配与电子系统标定测试），电机功率 150 кВт（204 马力）、零百加速 7 秒、续航最高 500 公里，生产方 АО «Кама» 称 2026–2027 年计划生产至多 1 万辆、当前本地化率已达 70%。本地化提速将逐步改变零部件与车载电器的需求结构。", "url": "https://www.vedomosti.ru/auto/news/2026/09/14/1228788-v-nizhnem-proizvodstvo-volga；https://www.vedomosti.ru/auto/news/2026/09/16/1229271-moskvich-zapustil-massovoe", "table": [["Volga", "下诺夫哥罗德全流程生产，80% 工序机器人化"], ["«Атом»", "150 кВт / 续航 500 км / 本地化 70%"], ["«Атом» 产量计划", "2026–2027 年至多 1 万辆"], ["Volga 到店", "2026 年三季度"]]}, {"num": 2, "title": "燃料短缺推动非汽油动力需求： Автостат 口径与 «Авито Авто» 夏季二手电动/混动需求 +74.8%", "tag": "local", "tagText": "本地", "source": "Ведомости 引 Автостат / Retail.ru 引 «Авито Авто»", "time": "09-15 / 09-17", "summary": "俄分析机构 Автостат 负责人 Целиков 指出，在燃油短缺背景下电动车（BEV）与混合动力车的占比正在上升，该趋势与燃油市场局部短缺、政府延长柴油出口禁令以及油价高企直接相关，意味着动力结构的选择正被燃料可得性而非单纯补贴推动。平台侧数据印证：«Авито Авто» 统计 2026 年夏季俄二手电动车与混合动力车需求同比 +74.8%，最受欢迎车型为 Toyota Camry、Nissan Leaf 与 Voyah Free；«Дром» 显示夏季柴油车整体较去年同期多售 17%（环比春季零增长），柴油+混动+电动合计销量 +22%、较 2025 年夏季多出 1 万辆，二手车销冠为 Toyota Land Cruiser/Prado 与 VW Touareg。对车载电器、灯具与充电配件构成新的需求场景。", "url": "https://www.vedomosti.ru/auto/news/2026/09/15/1228856-spros-na-elektrokari；https://www.retail.ru/news/letom-spros-na-elektromobili-i-gibridy-s-probegom-vyros-na-74-8-17-sentyabrya-2026-282247/；https://ria.ru/20260917/avtomobili-2118160397.html", "table": [["二手 EV/HEV 需求（夏季）", "+74.8%（Авито Авто）"], ["柴油车", "较去年同期 +17%（环比春季持平）"], ["柴油+混动+电动", "合计 +22%（2025 年夏季 +1 万辆）"], ["热门车型", "Toyota Camry、Nissan Leaf、Voyah Free"]]}, {"num": 3, "title": "【周五补充】8 月俄二手车销量同比 -8.4%，汽车出口方向多元化（向阿曼出口乘用车）", "tag": "local", "tagText": "本地", "source": "国际文传电讯社 / 俄新社", "time": "09-18 / 09-13", "summary": "国际文传电讯社 9-18 援引数据：8 月俄带里程二手乘用车销量同比下降 8.4%，与高利率下信贷成本高企、居民购置意愿偏弱一致，也与 1–8 月新车需求下滑（莫斯科 -37.2%）形成同一方向的印证。出口侧，工贸部副部长切库绍夫表示俄已开始向阿曼出口乘用车，并同步开拓尼日尔、多哥等非洲市场与阿根廷方向，制裁下的出口方向多元化持续推进。对以俄市场为主的整车与配件卖家而言，本土车企出口放量可能带来国内供给结构变化与零部件需求的联动效应。本条为 10:00 日报窗口后的补充抓取。", "url": "https://www.interfax.ru/business/1116802；https://ria.ru/20260913/rossija-2117405328.html", "table": [["8 月二手车销量", "同比 -8.4%"], ["新车需求（1-8 月）", "莫斯科 -37.2%、莫斯科州 -8.8%"], ["出口新方向", "阿曼（乘用车）、尼日尔/多哥、阿根廷"]]}]}], "keyData": {"headers": ["指标", "周初（09-14/15）", "周末（09-17/18）", "趋势"], "rows": [["Brent 原油（美元/桶）", "107.77（09-14）→ 109.36 盘中高", "102.89 ICE 盘中 / 104.20 MOEX 结算 → 103.68（09-18）", "先因中东断供冲高、后回吐约 6 美元"], ["欧洲气价（美元/千m³）", "约 1004（TTF 10 月，2022-12 以来首次破千）", "高位维持", "欧洲能源成本抬升，俄气议题回温"], ["央行官方美元汇率", "84.3363（09-15）", "84.5093（09-18）", "连续 7 日守在 84 区间上方"], ["央行官方欧元汇率", "97.7626（09-15）", "97.4984（09-18）", "窄幅波动、仍在 100 下方"], ["央行官方人民币汇率", "12.5353（09-15）", "12.5788（09-18）", "基本走平，8 月振幅 8.5%"], ["关键利率（俄）", "14%（09-11 维持、首次暂停）", "14%", "降息周期中断，未给方向信号"], ["十大银行最高存款利率", "12.95%（9 月上旬）", "12.984%（连升 12 周）", "负债端与政策利率背离，资金成本高位"], ["周度 CPI", "—", "+0.02%（09-08~09-14）；年初至今 +4.74%", "通胀环比趋缓，但年通胀仍 6.2–6.3%"], ["年通胀", "6.3%（央行口径）", "6.2%（普京 09-14 口径）", "10-01 ЖКУ 指数化 +0.7 п.п.，逼近 7% 上限"], ["汽油零售均价", "78.25 卢布/升（前周）", "78.51 卢布/升（+0.36% 周）", "年初至今 +21%；柴油出口禁令延至 10 月底"], ["Ozon 遇袭城市数", "11 城", "12 城（09-15 塔甘罗格）", "本周 +1；09-16~09-18 连续 3 日无新增"], ["Wildberries 遇袭城市数", "22 城", "22 城", "本周无新增（仓库受损面积约 27%）"], ["Ozon 首批赔付", "—", "50,000 家卖家（09-16 首日）", "无需申请；尾款 «Ингосстрах» 20 日内补付"], ["平台市场商品损失", "—", "≥5500 亿卢布（Bloomberg）；修复 >2000 亿卢布", "约 1/3 仓储能力被摧毁"], ["8 月联邦预算", "—", "盈余 6060 亿卢布（非油气收入为主）", "2027 年赤字约 2% GDP（油价假设 50 美元）"], ["国际储备", "7535 亿美元（09-04 附近）", "7582 亿美元（09-11，周 +47 亿）", "资产重估为主要增量"], ["平台占零售比重", "20%（当前）", "或 25%（2026 年官方预测）", "平台渠道份额继续上行"], ["消费者信心指数", "Q2 -8%", "7 月 -15%", "29% 消费者压缩单次采购件数 10%"], ["家具渠道结构", "线下 55%（去年同期）", "平台 37% / 线下 47%（上半年）", "渠道继续向平台集中"], ["美众议院对俄制裁法案", "程序性决议 214:211（09-16）", "262:159 通过并送交总统签署（09-17）", "对俄商品最高 500% 关税，总统可豁免"]]}, "trends": [{"title": "电商物流与平台政策", "text": "本周是「平台仓风险定价完成、监管规则集中落地」的一周。风险侧，9-15 塔甘罗格 Ozon 合作方枢纽遇袭（Ozon 遇袭城市 11→12）后，9-16~9-18 连续 3 日无新增平台仓库通报，袭击强度转向首都方向与民航；赔付从承诺转为到账（Ozon 首日 5 万卖家、尾款 20 日内），救助侧叠加银行协会建议的优惠融资/贷款重组与第一副总理提出的凭证制防护补偿。行为侧已发生结构性迁移：СДЭК 口径 4–8 月 DBS 发货申请 +60%、化妆品与保健品卖家把库存迁往持牌第三方物流并「按药品标准」分散存储、Ozon 公开招商仓储（现房 5 千㎡起、代建 1 万–8.5 万㎡）——头部平台开始把仓储从自有资产转为外部供给。规则侧，佣金禁止差别对待、商品卡上架前核验、卖家可设最低价并拒绝平台补贴降价且不得降权、退货须 2 日内答复、10-01 起可就算法损失申诉，构成 10 月-2027 年 3 月的新合规日程。建议：①按「单点损失上限」重构库存分布，FBO 与第三方/自有仓配比写入 Q4 合同；②10 月前完成贴码（«Честный знак» Data Matrix）与商品卡资料核验流程；③把售后响应压到 48 小时内以适应新退货规则；④留存费率明细与流量截图以备算法申诉；⑤对平台仓储能力下降导致的时效波动，按「区域集群」重排承运商与运费假设。"}, {"title": "经济数据与利率", "text": "通胀与利率进入「高位横盘+上行风险」组合：周度 CPI 仅 +0.02%、年初至今 +4.74%，年通胀 6.2–6.3%，但燃油对通胀的贡献达 0.7–0.8 п.п.，10 月 1 日 ЖКУ 费率指数化将再推高约 0.7 п.п.、逼近央行 7% 的预测上限；央行 9-11 维持关键利率 14%（一年半来首次暂停降息）且未给方向信号，而存款端十大行最高利率升至 12.984%（连升 12 周），形成典型背离——居民储蓄倾向继续被高息强化，企业 Q4 备货资金成本难降。宏观侧，二季度 GDP +1.3%、上半年 +0.6%、全年 1% 以内，8 月预算盈余 6060 亿卢布（非油气为主）、2027 年赤字约 2% GDP 且基于 50 美元/桶的保守油价、储备 7582 亿美元，缓冲尚在但依赖油气收入节奏。外部变量是美联储加息 25bp 至 3.75–4%（2023 年以来首次）与美方「制裁+交易」双轨信号，全球利率重心上移会压缩新兴市场货币的喘息空间。建议：①价格与促销预算按「成本端 10 月再上一层」做压力测试；②库存资金按 13% 以上的实际利率重算，避免为冲规模压价；③汇率按 84–85 区间做保守换算、避免单边押注卢布升值。"}, {"title": "能源价格与运输成本", "text": "油价本周经历完整「冲高—回吐」：沙特「东西」管道遇袭（全球供应或 -4%）叠加霍尔木兹会议推迟把布伦特推到 109.36 美元，随后因风险溢价回落跌破 103 美元（09-17 ICE 盘中 102.89、MOEX 结算 104.20），09-18 报 103.68；Saudi Aramco 已通知欧洲客户 10 月不供油、管道全修约需 1.5 个月，机构对后市分歧加大（某美国最大银行称「虚高」，俄方专家看至 130 美元）。对俄国内，油价是双刃剑：高油价支撑预算与卢布结汇（ESPO 对华溢价创 2018 年以来纪录 $12.5/桶），但也抬高干线运输与包材成本；国内燃油紧张的根源仍在炼厂遇袭——汽油年初至今 +21%、均价 78.51 卢布/升，柴油出口禁令延至 10 月底，列宁格勒州短缺预计不早于 10 月初缓解，ФАС 立案 55 起。欧洲气价破 1000 美元/千m³ 与俄气议题回温（7 月俄重回欧盟第四大供应国、俄特使与 АдГ 筹备恢复对德供气会谈）构成中期变量。建议：①干线运价与燃料附加条款按「柴油高位延续到 10 月」锁价；②对西北方向（圣彼得堡/列宁格勒州路径）预留更长时效；③把油气价格回落视为短期窗口、不做长期成本假设下调。"}, {"title": "消费市场与需求结构", "text": "需求侧呈「量缩价升、信心走弱、结构分化」：消费者信心指数 7 月降至 -15%（2026 Q1 -4%、Q2 -8%），29% 消费者把单次采购件数压缩 10%；租金同比 -1.7%（2020 年以来首降）、莫斯科新房需求 -37.2%，「新房交付—家装」场景持续偏弱；居民资产继续向黄金（8 月 +17.4%）与高息存款（12.98%）集中。与此同时客单价在多个渠道上行（ВсеИнструменты +16%、Лемана Про +7%、Hoff +4%，ВсеИнструменты B2B 占比 >75%），平台个性化工具显效（Lamoda 个性化带来 +10% NMV、俄设计师板块 +44%、微观趋势口径周转率 +63%）。品类机会集中在：换季清洁（8 月家庭清洁用品 +2%）、3C 换机与装机（56% 半年内拟购手机、显卡环比 +16%）、非汽油动力车相关配件（二手 EV/HEV 需求 +74.8%）、以及社会燃气化+ИЖС 家居场景。建议：①以「客单价与组合套装」替代「件数增长」作为主 KPI；②营销资源向确定性场景（换季、返校、燃气新接入住宅、首发新品）集中；③对高溢价礼盒类（珠宝/美妆）下调定价预期（钻石价格指数 82 点历史最低）。"}, {"title": "美妆渠道", "text": "美妆是本周「渠道重构」最清晰的品类：总量量降价升（2025 年销量 39 亿件、-2%，市场规模 1.3 万亿卢布、+20% 卢布值，面部护理品牌数 -13.3% 为 FMCG 降幅最大）；线下中型连锁继续出清（The Act 到 11 月关闭 9 家中的 4 家、Lush 体系 Oomph 申请破产），线下转向「体验与种草」（副总理口径：到店试用、线上下单），平台与内容驱动转化成为主战场（WB 智能自提最热门品类含美妆、AI 搭配工具上线、«Хочу скидку» 议价）。竞争格局上，韩妆继续放量（1–8 月 +20.3% 至 2.877 亿美元）且与俄形成原料双向流动（8 月韩国自俄进口动物源原料创两年新高），欧盟高端供给收缩（7 月香水 -37%、化妆品 -16%）留下替代窗口；家用化学品等相邻品类 2025 年在大型连锁 +10%，本土化与进口替代同步推进。建议：①把资源从线下铺货转向内容化商品卡与测评素材；②在韩妆强势价位带（精华/乳液/防晒）做差异化或规格对位；③按 «Честный знак» 与平台核验规则前置合规；④连锁进场谈判以「本土化采购+货架组合」为筹码。"}, {"title": "电器与灯具", "text": "电器端的核心是「渠道效率+场景切换」：М.Видео 接入 Магнит 5000 个自提点（24 城）并扩展上门服务至厨房家具组装与水暖电气，末端触点密度提升、退换货成本下降；需求侧 3C 换机（56% 半年内拟购手机、10% 拟首发买最新 iPhone）与装机升级（Ситилинк 品类榜零组件占 5 席、显卡环比 +16%）构成 Q4 主力场景，客单价上行（ВсеИнструменты +16%）但件数压缩，宜以套装与保修服务承接中低价位。产业侧微电子新战略（组件配额、包销合同）与仓储自动化（Merlion 代理中国 Xgen Robot、机器人配送累计 100 万单）说明本地化与自动化正在改变成本曲线；价格侧 9-8~9-14 周报显示智能手机与电视机进入涨价名单。灯具本周仍无格局性变化：产量存量（2025 年 2380 万只、-21.4%；吊灯 12.34 万只、+38.9%）与 «Честный знак» 强制标记时间表（2026-05-01 起实施、2026-12-01 起禁止未标记流通、11-30 前完成库存标记或售罄）是唯一必须锁定的硬节点；需求端依托「社会燃气化+ИЖС」与家具渠道平台化（平台占家具收入 37%）寻找增量。建议：①11-30 前完成灯具库存标记/售罄，避免 12 月起无法流通；②Q4 以换季清洁、返校装机、首发新品的组合套装承接需求；③关注本地微电子供应替代对控制器成本的中期影响。"}], "sourceStats": "本周周报共收录 63 条条目（实体引用 62 条 + 程序性标注 1 条），信源以俄语本土媒体与官方机构为主：РИА Новости、ТАСС、Интерфакс、Lenta.ru、生意人报（Коммерсантъ）、Ведомости、RBC、Retail.ru、New Retail、Gazeta.ru、俄央行（ЦБ РФ）、俄统计局（Росстат）、莫斯科交易所、工贸部/经济发展部等。其中 Ведомости/生意人报/RBC 引 Автостат、Frank RG、Infoline、АКОРТ、«Ромир»、«Ситилинк»、«Дром»、Argus、韩国海关、Eurostat 等机构的第三方数据，仍按俄媒信源计入本地。本地信源 61 条 ＝ 98%（≥60% 达标）；英文直采 1 条（09-16 Brent 报价引 Fortune，因本机无法直连实时行情源，已在条目内如实标注时点与来源）；中文 0 条。另有 Bloomberg、NYT、NBC、Reuters 的第三方数据经俄本土媒体（Retail.ru / Коммерсантъ / RBC / 俄新社）转述后收录，按转述链计入本地信源并在条目内注明原始出处。周五补充抓取（09-18 09:00-17:00 北京时窗口）来自 РИА Новости、ТАСС、Lenta.ru、Interfax 四家俄语媒体。", "meta": ["报告编号：RU-WEEKLY-2026-W38", "覆盖周期：2026-09-14（周一）~ 09-18（周五），第 38 周", "收录条目：63 条（电商 17、时政 13、经济 17、美妆 6、电器 6、汽车 3、灯具 1；其中灯具 1 条为程序性标注，不计入实体引用统计，实体条目 62 条）", "数据来源：本地日报 5 期（09-14 共 18 条、09-15 共 27 条、09-16 共 28 条、09-17 共 27 条、09-18 共 28 条，合计 128 条；窗口 09-14~09-18 无空窗）+ 周五补充抓取 09-18 白天（10:00 北京时日报窗口后）俄语信源新条目若干，其中 3 条作为独立条目收录（经济·社会燃气化/ИЖС、汽车·8 月二手车 -8.4%、时政·欧盟制裁反制等），其余（选举日场次通报、机场限航快讯等）按主题并入既有条目", "去重：周报条目与本周日报同源内容（塔甘罗格遇袭链、Ozon 赔付、平台经济监管、库存外迁、Brent 与汇率、通胀、杜马选举、制裁法案等）按周视角归并改写，不重复计数；补充抓取的 09-18 URL 全部查 state.db articles 表确认无冲突后 INSERT OR IGNORE 入库", "入库：本周补充抓取条目已写入 state.db articles 表（report_date=2026-09-18，category 按电商/时政/经济/汽车分类）；本周日报 128 条此前已入库（report_date=2026-09-14~09-18）", "重点提示：①仓储风险已从「事件」转为「成本」：约 1/3 平台仓储能力被毁、商品损失 ≥5500 亿卢布，赔付与救助（Ozon 首日 5 万卖家、银行协会优惠融资、凭证制防护补偿）开始落地，库存分散与保单条款应写入 Q4 合同；②平台监管进入密集执行期（10-01 算法申诉与平台经济法、2027-03-01 佣金与商品卡核验），售后 48 小时 SLA、贴码与资料核验须先行；③燃油是 10 月通胀与运价的共同推力（汽油年初至今 +21%、柴油出口禁令延至 10 月底、ЖКУ 指数化 +0.7 п.п.），报价与促销预算按成本再上一层做压力测试；④利率背离（关键利率 14% vs 存款 12.984%）意味着资金成本高位延续，Q4 备货以周转优先、避免压价冲量；⑤杜马选举 9-18~20 落地，选举周袭击强度未降级（莫斯科方向 35 架），空域与干线时效波动应作为常态成本；⑥灯具唯一硬节点是 «Честный знак»（2026-12-01 起禁止未标记流通、11-30 前完成库存标记或售罄），需求端看「社会燃气化 + ИЖС 占比过半」与家具渠道平台化增量", "推送渠道：微信（iLink bot）＋ 日报网站「📅 周度复盘」板块（archive/weekly_2026-09-18.html）"]}
