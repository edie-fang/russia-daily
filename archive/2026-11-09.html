{"date": "2026-11-09", "stats": {"total": 14, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "cat": "platform", "catText": "平台规则变动", "title": "Ozon：11-06 起对账单按「期末数据」出具，11-23 起在线对账写入合同（7 个日历日内签认）", "tag": "local", "tagText": "本地", "source": "ГуруСеллер（引 Ozon 卖家公告）", "time": "11-07 12:00", "summary": "Ozon 公告：11-06 起月度对账单按单据所列期间末的数据生成，平台在期末后才处理的退货、赔付等操作顺延计入下一期；11-23 起对账流程写入合同 п.6.2.2，卖家可在后台「财务—文件—对账单」申请 1–12 个已关账月份的数据（某月自次月 8 日起算关账），并在 7 个日历日内核对签认，逾期视为认可。", "table": [["⏱ 生效时间", "2026-11-06（出单口径）；2026-11-23（合同条款与在线签认）"], ["🎯 实际影响", "跨月退货与赔付的归属期改变，12 月关账、年度汇算的应收口径需重算；7 日内未签认即默认接受平台数据，事后争议成本上升"], ["✅ 建议动作", "财务 11-20 前导出 9–10 月结算单与银行流水做基线，11-23 起逐月申请对账单并在第 3 个工作日前完成签认"]], "sourceFull": "https://guruseller.ru/ozon-akty-sverki-23-noyabrya-2026/"}, {"num": 2, "cat": "platform", "catText": "平台规则变动", "title": "WB：11-16 起 FBW 供货本地化指数统一按 1.00 计（待核实，未见官方公告）", "tag": "local", "tagText": "本地", "source": "MPUP（行业监测）", "time": "11-08 12:00", "summary": "行业监测称，Wildberries 自 11-16 起把所有 FBW 供货的本地化指数统一设为 1.00，覆盖 8-15 前已创建与已排期的供货；该指数原按商品本地化程度浮动并直接乘入物流费。MPUP 注明未找到平台官方公告，需在卖家后台核实。对我方中国备货直发的低本地化 SKU，运费系数与到仓成本将更可预测。", "table": [["⏱ 生效时间", "2026-11-16（待核实：仅有行业监测，未见官方通知）"], ["🎯 实际影响", "物流费不再按本地化程度浮动，低本地化（中国直发备货）SKU 的运费溢价或消失、高本地化 SKU 的折价或取消，单品成本结构需重算"], ["✅ 建议动作", "物流 11-15 前用 16 日后费率重算 20 个主力 SKU 的单件物流费，并向 WB 客户经理索取书面通知后再调价"]], "sourceFull": "https://mpup.ru/news/s-16-noyabrya-indeks-lokalizacii-fbw-1-00-volq0ju0"}, {"num": 3, "cat": "ecom", "catText": "电商动态", "title": "中国卖家冒牌 omega-3 占位 Ozon：俄鱼品厂致信米舒斯京，要求平台整治并封堵「封号即换号」", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "11-08 15:42", "summary": "堪察加 Тымлатский 鱼品厂（旗下 Salmonica 占俄 omega-3 市场 3.1%）11-02 致信总理米舒斯京，指 Ozon 上中国卖家长期售卖其品牌假冒 omega-3，平台封号后新卖家迅速补位；俄 omega-3 年销增 19.7%。Ozon 称 БАД 品类发布前会自动比对国家登记库，并已就该品牌启动额外核查。", "table": [["📈 品类增速", "omega-3 年销 +19.7%"], ["🏷 涉及品牌", "Salmonica / Тымлатский РК（市占 3.1%，第 5 位）"], ["⚖️ 诉求", "政府介入、平台封堵换号重开"], ["🚨 对我方", "БАД/保健类目审核与权利人投诉下架将趋严"]], "sourceFull": "https://www.kommersant.ru/doc/9091897"}, {"num": 4, "cat": "ecom", "catText": "电商动态", "title": "Wildberries 扩大二手车销售：在售超 1000 辆，需 100% 预付、到店验车提车", "tag": "local", "tagText": "本地", "source": "EcomHub", "time": "11-08 18:19", "summary": "EcomHub 周报（11-02~11-08）：Wildberries 扩大二手车销售，目录内在售已超 1000 辆，交易要求 100% 预付、到店验车后提车，平台未公布可比成交统计。汽车类目由新车、平行进口向二手延伸，对汽配、车载用品与汽车美容类卖家是新增流量入口，但也意味着平台在高客单价履约上继续加杠杆。", "table": [["🚗 在售规模", "1000+ 辆"], ["💳 交易条件", "100% 预付 + 到店验车提车"], ["📊 数据披露", "无成交统计"], ["🧩 含义", "汽车后市场品类获新增流量入口"]], "sourceFull": "https://ecomhub.ru/russia-ecommerce-marketplace-weekly-news-ozon-wildberries-november-2-8-2026/"}, {"num": 5, "cat": "lighting", "catText": "灯具照明", "title": "铜进口升水创 2014 年监测以来新高：LME 三个月期铜 13.76 千美元/吨，灯具线缆与驱动成本再承压", "tag": "local", "tagText": "本地", "source": "Коммерсантъ（引 Platts / S&P Global）", "time": "11-09 02:31", "summary": "Platts 数据：中国进口精炼铜升水一个月涨 83.3% 至 220 美元/吨，为 2014 年 8 月开始监测以来最高；11-06 LME 三个月期铜报 13.76 千美元/吨。上海期货交易所铜库存一周降 17.9% 至 4.461 万吨，中国本地冶炼厂检修叠加日本减产，现货偏紧。铜是灯具线缆、驱动电源与散热件的核心原料。", "table": [["📈 进口升水", "+83.3% 至 220 美元/吨（一个月）"], ["💵 LME 3M 铜", "13.76 千美元/吨（11-06）"], ["📦 SHFE 库存", "4.461 万吨（周环比 -17.9%）"], ["🏭 供应端", "中国冶炼厂检修 + 日本减产"]], "sourceFull": "https://www.kommersant.ru/doc/9092299"}, {"num": 6, "cat": "beauty", "catText": "美妆个护", "title": "Easy Commerce：上半年平台美妆销售 5040 亿卢布、同比 +42%，但平台平均抽成从 20% 升至 40%", "tag": "local", "tagText": "本地", "source": "Навигатор исследований（引 Easy Commerce）", "time": "11-06 12:00", "summary": "Easy Commerce（Okkam 技术伙伴）研究：2026 上半年俄平台美妆销售 5040 亿卢布、同比 +42%；平台对美妆的平均抽成从 20% 升至 40%，成为主要抑制因素。Ozon 美妆 +70%、Wildberries +37%、Яндекс Маркет -6%；男士护理增长最快（Ozon +75%、WB +56%），预测 2026 年 Ozon 357 亿、WB 578 亿卢布。", "table": [["💰 规模", "5040 亿卢布（H1 2026，+42%）"], ["📉 抽成", "20% → 40%（美妆平均）"], ["📊 平台增速", "Ozon +70% / WB +37% / ЯМ -6%"], ["🧔 最快细分", "男士护理（Ozon +75%、WB +56%）"]], "sourceFull": "https://research-navigator.ru/issledovanie-agentstva-easy-commerce-onlajn-prodazhi-kosmetiki-na-marketplejsah-42-za-pervoe-polugodie-2026-goda/"}, {"num": 7, "cat": "econ", "catText": "经济金融", "title": "零售业缺工 52 万人：880 万在岗对应 930 万需求，10 月每个岗位仅 2.4 份简历", "tag": "local", "tagText": "本地", "source": "Retail.ru（引 Экопси / hh.ru）", "time": "11-08 14:10", "summary": "Экопси 数据：俄零售业现有从业 880 万人，岗位需求 930 万，缺口 52 万人；今年以来 hh.ru 零售类职位发布超 92 万个，10 月每个岗位仅 2.4 份简历。ВНИИ труда 归因于行业高流动率与入行门槛低。含义：分拣、配送与门店岗位薪资继续上行，旺季临时用工与外包成本压不下来。", "table": [["👥 在岗 / 需求", "880 万 / 930 万"], ["🕳 缺口", "52 万人"], ["📄 年内职位", "92 万+（hh.ru）"], ["📉 供需比", "2.4 份简历 / 岗位（10 月）"]], "sourceFull": "https://www.retail.ru/news/rossiyskoy-roznitse-ne-khvataet-bolee-polumilliona-sotrudnikov-8-noyabrya-2026-284151/"}, {"num": 8, "cat": "econ", "catText": "经济金融", "title": "盖达尔研究所：2025 年贸易条件拉低增长 1.23 个百分点，2026 年结构性贡献转负、投资再降 5.4%", "tag": "local", "tagText": "本地", "source": "Коммерсантъ（引 Институт Гайдара）", "time": "11-08 18:06", "summary": "盖达尔研究所分解 2025–2026 增长：2025 年 GDP 增 1% 中结构性因素贡献 1.97 个百分点，但贸易条件恶化（Urals 均价 55.62 美元/桶）拉低 1.23 个百分点，景气因素仅 0.26 个百分点；2026 年结构性贡献转负，固定资产投资在 2025 年 -2.3% 后再降 5.4%，反映货币紧缩后的降温。", "table": [["📐 2025 结构贡献", "+1.97 п.п."], ["🛢 贸易条件", "-1.23 п.п.（Urals 55.62 美元）"], ["🏗 投资", "2025 -2.3% / 2026 -5.4%"], ["📉 2026", "结构性贡献转负"]], "sourceFull": "https://www.kommersant.ru/doc/9092229"}, {"num": 9, "cat": "econ", "catText": "经济金融", "title": "波罗的海煤炭转运费一个月涨 65%：西北港口 15–25 美元/吨，南向改道小批量达 20–25 美元", "tag": "local", "tagText": "本地", "source": "Коммерсантъ（引 NEFT Research / ЦЦИ）", "time": "11-09 02:31", "summary": "NEFT Research：西北港口 10 月煤炭转运费涨至 15–25 美元/吨，较 9 月高 8–9 美元、较 7–8 月高 9–13 美元；自南向改道的小批量达 20–25 美元/吨。ЦЦИ 数据：10 月波罗的海煤炭转运均价环比 +65%，创 2024 年 4 月以来新高，主因塔曼港关闭后货流北移、运力竞争加剧。", "table": [["💵 转运费", "15–25 美元/吨（10 月）"], ["📈 环比", "+8–9 美元（对 9 月）"], ["📊 均价涨幅", "+65% м/м，2024-04 以来最高"], ["🚧 主因", "塔曼港关闭、货流北移"]], "sourceFull": "https://www.kommersant.ru/doc/9092194"}, {"num": 10, "cat": "econ", "catText": "经济金融", "title": "9 月家庭现金操作降至 2632 亿卢布、环比 -35%，二季度非现金占比 88.4% 首现回落", "tag": "local", "tagText": "本地", "source": "Коммерсантъ（引 ЦБ РФ）", "time": "11-08 17:48", "summary": "俄央行「家庭部门」数据：9 月家庭现金操作 2632 亿卢布，环比 8 月 -35%，不足 7 月（5505 亿）的一半，为 2 月以来最低；二季度非现金支付占零售额比重降 0.5 个百分点至 88.4%，为多年来首次下降。专家归因于移动互联网恢复、存款利率稳定与恐慌情绪消退，预计 12 月节前再迎高峰。", "table": [["💵 9 月现金操作", "2632 亿卢布"], ["📉 环比", "-35%（对 8 月）"], ["💳 非现金占比", "88.4%（Q2，-0.5 п.п.）"], ["📅 季节性", "预计 12 月节前回升"]], "sourceFull": "https://www.kommersant.ru/doc/9092227"}, {"num": 11, "cat": "politics", "catText": "时政要闻", "title": "11-09 凌晨列宁格勒州遭 81 架无人机：基里希工业区被命中，居民楼遭碎片波及", "tag": "local", "tagText": "本地", "source": "Lenta.ru / РИА Новости", "time": "11-09 04:56", "summary": "列宁格勒州长 Дрозденко 通报：11-09 凌晨该州遭大规模无人机袭击，基里希市工业区有无人机命中，另有碎片击中一套居民公寓、住户已疏散，无需疏散整栋楼；防空在该州击落 81 架无人机（一小时内由 38 架上调）。基里希是俄西北炼油与油品枢纽，圣彼得堡集群的干线运价与燃油供应风险上升。", "table": [["🚁 击落数量", "81 架（州长通报）"], ["📍 命中地点", "基里希工业区（列宁格勒州）"], ["🏠 民用损失", "1 套公寓被碎片击中，住户疏散"], ["⚠️ 物流含义", "西北炼油/燃油枢纽，圣彼得堡集群时效风险"]], "sourceFull": "https://lenta.ru/news/2026/11/09/raskryty-posledstviya-ataki-vsu-na-leningradskuyu-oblast/"}, {"num": 12, "cat": "politics", "catText": "时政要闻", "title": "普京下周出席 11-11 莫斯科 ОДКБ 峰会，并主持体育委员会与安全会议", "tag": "local", "tagText": "本地", "source": "Ведомости（引 «Вести»）", "time": "11-08 13:06", "summary": "«Вести» 记者 Зарубин 称，普京下周将出席 11-11 在莫斯科举行的集体安全条约组织（ОДКБ）峰会，并主持体育发展委员会、进行国际接触与安全会议。ОДКБ 成员为俄、白俄、哈萨克斯坦、吉尔吉斯斯坦、塔吉克斯坦与亚美尼亚，亚美尼亚自 2024 年 2 月起实际冻结参与。", "table": [["📅 峰会", "11-11，莫斯科"], ["🌍 成员", "俄 / 白俄 / 哈 / 吉 / 塔 / 亚美尼亚"], ["🧊 变量", "亚美尼亚 2024-02 起实际冻结参与"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/11/08/1243469-putin-primet-uchastie"}, {"num": 13, "cat": "politics", "catText": "时政要闻", "title": "桑杜：摩尔多瓦已「零采购」俄气，接入罗马尼亚线路并另建两条", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-08 22:57", "summary": "摩尔多瓦总统桑杜称，该国已完全不采购俄罗斯天然气，并已投运一条连接罗马尼亚与欧洲电网的输电线路，另两条在建。前总统多东 9-25 称，弃购俄气后自欧盟购气价格高约 40%，两年半多支出约 3.3 亿美元；若沿用 2021 年与俄气公式，2022–2026 可省约 7.45 亿美元。", "table": [["🛢 俄气采购", "0"], ["⚡ 电网", "1 条投运 + 2 条在建（对罗马尼亚）"], ["💸 额外成本", "约 3.3 亿美元（多东口径，两年半）"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/11/08/1243541-sandu-zayavila"}, {"num": 14, "cat": "politics", "catText": "时政要闻", "title": "国家杜马 11-09 复会：三年预算 11-19 二读，政府拟提高近 30 条行政罚则", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "11-08 17:44", "summary": "国家杜马 11-09 结束「地区周」复会：2027–2029 三年预算 11-19 二读；政府提交的《行政违法法典》修正案一读，拟提高近 30 条罚则（含公共场所吸烟饮酒、极端材料传播等）；另有社会广告须展示多子女家庭、法官待遇改革、女性服役年龄上调等议案。对企业而言，预算二读前的税费口径与罚则调整需跟踪。", "table": [["📅 复会", "2026-11-09"], ["💰 预算二读", "2026-11-19（2027–2029）"], ["⚖️ 罚则", "近 30 条拟上调"], ["🏛 其它", "社会广告 / 法官待遇 / 服役年龄"]], "sourceFull": "https://www.kommersant.ru/doc/9092226"}]}
