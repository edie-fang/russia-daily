{"date": "2026-09-11", "stats": {"total": 23, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "09-11 04:59", "title": "🚨仓库被炸：Ozon 萨拉托夫物流中心与配送枢纽遭无人机袭击起火，全市及全州暂停收派件", "summary": "乌军无人机凌晨约 4 时袭击 Ozon 萨拉托夫物流中心与配送枢纽并引发火灾，员工疏散、初步无伤亡；Ozon 随即在萨拉托夫市及全州暂停收件派件，在途商品改道其他物流中心，州长通报民用基础设施受损。Ozon 遇袭城市升至 11 处，首次落在伏尔加河下游节点（距乌边境约 600 公里），WB 22 城不变。", "table": [["Ozon 设施", "萨拉托夫物流中心 + 配送枢纽（起火）"], ["伤亡", "初步无伤亡（员工数分钟内疏散）"], ["平台应对", "萨拉托夫市及全州暂停收件/派件；在途商品改道其他物流中心"], ["累计口径", "Ozon 遇袭城市 10→11；WB 22 城不变（连续第 11 天无新增）"], ["同夜袭击", "伏尔加格勒/利佩茨克导弹警报；9 城机场一度限航"]], "sourceFull": "https://ria.ru/20260911/ozon-2116953369.html"}, {"num": 2, "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-11 01:43", "title": "卖家把库存搬出平台仓：分销商占 3PL 库容升至 43%，平台卖家转向外部物流", "summary": "《生意人报》报道，2026 年 1-9 月分销商在 3PL 仓（运营商承揽从运输到仓储的全流程）总面积中占比升至 43%；电商平台卖家与小型零售商也开始租用此类库容，主动避免把全部库存压在平台自有仓。仓库遇袭常态化下，物流外包、多仓分散成为主流应对，平台“仓配一体化”的黏性被削弱。", "table": [["分销商占 3PL 库容", "43%（2026 年 1-9 月）"], ["新增租户", "平台卖家 + 小型零售商"], ["驱动", "平台仓遇袭风险、避免全库存集中于平台自有仓"], ["趋势", "物流外包 + 多仓分散（去中心化）"]], "sourceFull": "https://www.kommersant.ru/doc/8941252"}, {"num": 3, "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "09-10 11:02", "title": "平台打假升级：米舒斯京要求保护消费者，Роспатент 商品卡真伪核验机制 2027-03-01 上线", "summary": "米舒斯京 9-10 强调必须保护俄公民免受平台假货侵害、并帮助权利人解决知识产权争议；Роспатент 已开发商品卡真实性核验机制，2027-03-01 上线——数字平台将自动比对独家权利与商标注册库，核验卖家与商品。对平台卖家而言，品牌授权链、商标证明与进口合规文件将成为刚性材料。", "table": [["核验对象", "商品卡/卖家（自动比对独家权利+商标库）"], ["上线时间", "2027-03-01"], ["官方口径", "米舒斯京：保护消费者免受平台假货侵害"], ["对卖家", "品牌授权链与合规文件成为刚性，避免卡片被批量下架"]], "sourceFull": "https://ria.ru/20260910/rospatent-2116760011.html"}, {"num": 4, "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-10 14:10", "title": "Роспатент：俄本土品牌注册申请增 23% 至 7.5 万件，服装与电子品类最活跃", "summary": "Роспатент 局长祖博夫向米舒斯京汇报：2026 上半年俄本土品牌注册申请量增长 23% 至 7.5 万件，覆盖服装、食品与电子等品类；发明专利申请约 1.1 万件（+15%）、IT 软件登记申请 +20%，近五年俄科学家累计提交 14 万件专利。本土供给替代提速，进口卖家的竞争与合规门槛同步抬升。", "table": [["品牌注册申请", "7.5 万件（2026H1，+23% y/y）"], ["活跃品类", "服装、食品、电子产品"], ["发明专利", "约 1.1 万件（+15%）；IT 软件登记 +20%"], ["五年累计", "俄科学家提交 14 万件专利"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/09/10/1227822-zubov-chislo-otechestvennih"}, {"num": 5, "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "09-09 13:04", "title": "Ростех 工业品电商平台 PCAT.ru 刚全面上线即遭强力黑客攻击、门户不可访问", "summary": "Ростех 旗下工业技术电商平台 PCAT.ru 自 9 月起覆盖集团全部民品企业、正式对外亮相后，随即遭到强力黑客攻击，门户当前不可访问；公司称专家正在消除后果、恢复访问，未披露攻击来源与数据影响。俄首个工业品电商平台开局即遇网攻，平台基础设施安全成为新的风险点。", "table": [["平台", "PCAT.ru（Ростех，9 月起覆盖全部民品企业）"], ["事件", "上线后即遭强力黑客攻击，门户不可访问"], ["官方", "正在消除后果、恢复访问；未披露来源与数据影响"], ["意义", "俄首个工业品电商平台，基建安全风险暴露"]], "sourceFull": "https://ria.ru/20260909/marketplejs-2116549577.html"}, {"num": 6, "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "09-10 22:26", "title": "「Госуслуги」通知：建议用俄本土浏览器或安装 Минцифры 证书，否则平台站点访问或异常", "summary": "俄公民收到「Госуслуги」通知：建议使用俄罗斯本土浏览器或安装 Минцифры 证书，以便无故障访问俄境内网站、电商平台与银行服务。此前多项境外证书在俄受限，导致平台页面加载与支付出现异常。对跨境卖家而言，店铺后台稳定性与客服链路越来越依赖俄本土访问环境。", "table": [["通知渠道", "「Госуслуги」"], ["建议", "使用俄本土浏览器 / 安装 Минцифры 证书"], ["影响面", "俄境内网站、电商平台、银行服务"], ["对卖家", "后台与支付链路的本土化访问依赖上升"]], "sourceFull": "https://ria.ru/20260910/gosuslugi-2116924434.html"}, {"num": 7, "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-11 01:10", "title": "普京抵达新德里：三天工作访问并出席 9-11~13 第 18 届 BRICS 峰会", "summary": "普京 9-11 凌晨抵达新德里，开始三天工作访问并出席 9-11~13 第 18 届 BRICS 峰会。他将与莫迪会谈、共同参观「ИННОПРОМ. Индия」展并在 BRICS 商务论坛演讲，双边会见南非、埃及、马来西亚、埃塞俄比亚领导人、新开发银行行长及阿布扎比王储。议题含对伊美冲突立场、能源与结算通道。", "table": [["行程", "9-11~13 新德里，第 18 届 BRICS 峰会"], ["双边", "莫迪（9-11）+ 南非/埃及/马来西亚/埃塞/新开行/阿布扎比王储"], ["商务", "BRICS 商务论坛全会 +「ИННОПРОМ. Индия」展"], ["对市场", "能源、结算与对印贸易通道为关注焦点"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/11/1228009-putin-pribil"}, {"num": 8, "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-11 01:43", "title": "杜马选举终盘预测：ВЦИОМ/ФОМ 预计「统一俄罗斯」政党名单票约 50%，投票率近 70%", "summary": "ВЦИОМ 与 ФОМ 于 9-10 发布杜马选举终盘预测：政党名单投票中「统一俄罗斯」预计获约 50% 选票、将拿下过半席位；ЦИК 称约 70% 俄公民表示将参加投票，联邦远程电子投票（ДЭГ）演练已完成。选举结果预期巩固现行政策路径，对平台监管与支持措施的延续性构成利好。", "table": [["政党名单预测", "«Единая Россия» 约 50%（ВЦИОМ/ФОМ）"], ["投票意愿", "约 70%（ЦИК）"], ["技术准备", "联邦 ДЭГ 演练完成（Артамонов 称成功）"], ["对市场", "政策与平台监管路径延续性增强"]], "sourceFull": "https://www.kommersant.ru/doc/8941269"}, {"num": 9, "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-11 00:49", "title": "加拿大制裁俄 8 名官员；并与乌克兰敲定 2.53 亿美元防空拦截弹供应", "summary": "加拿大对俄新增 8 名个人制裁，含青年署署长古罗夫、紧急情况部长库连科夫、「第一运动」主席奥尔洛夫等；同日加总理卡尼宣布与乌克兰敲定经美国 Jumpstart 机制提供防空拦截弹，金额 3.5 亿加元（2.53 亿美元）。西方对乌防空军援继续加码，俄境纵深打击与反制风险同步上升。", "table": [["制裁", "8 名俄个人（含青年署署长、紧急情况部长）"], ["对乌军援", "防空拦截弹 3.5 亿加元＝2.53 亿美元（Jumpstart 机制）"], ["宣布人", "加总理卡尼（与泽连斯基联合记者会）"], ["影响", "乌防空能力提升，俄境纵深打击与反制风险上升"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/11/1228006-kanada-vnesla"}, {"num": 10, "tag": "local", "tagText": "本地", "source": "Lenta", "time": "09-11 01:43", "title": "立陶宛拟修宪解除核武部署禁令，俄杜马回应或在立边境部署武器", "summary": "立陶宛议长奥莱卡斯称政府准备从宪法中删除禁止在本国境内部署核武器的条款；国家杜马议员切帕回应称，若立陶宛出现核武器，俄可能在立边境部署相应武器。北约东翼核议题升温，叠加波兰、德国方向的无人机事件，俄西部边境军事风险抬升，或进一步影响加里宁格勒方向物流与保险成本。", "table": [["立陶宛", "议长奥莱卡斯：准备删除宪法核武部署禁令"], ["俄方回应", "杜马议员切帕：或在立边境部署武器"], ["背景", "北约东翼核议题升温；波德方向无人机事件"], ["风险", "加里宁格勒方向物流与保险成本或受影响"]], "sourceFull": "https://lenta.ru/news/2026/09/11/long-deystvie-rozhdaet-protivodeystvie-litva-reshila-snyat-zapret-na-razmeschenie-yadernogo-oruzhiya-kak-sobiraetsya-otvetit-rossiya/"}, {"num": 11, "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-10 22:08", "title": "Brent 突破 108 美元/桶（5-21 以来首次）：盘中 108.21，Goldman 称或至 120 美元", "summary": "受中东局势升级推动，Brent 11 月期货 9-10 约 21:00 MSK 升至 108.21 美元/桶，为 5 月 21 日以来首次，21:40 回落至 107.29 美元。Goldman Sachs 称若中东船舶袭击增加油价或至 120 美元，出口正常化则回到 80 美元。俄油气收入改善与输入性通胀压力同步上升。", "table": [["Brent（11月期货）", "盘中 108.21（5-21 以来首次）；21:40 报 107.29"], ["当日走势", "早间破 102.71（5-22 以来最高）"], ["机构预测", "Goldman：或升至 120；正常化则回落 80"], ["驱动", "中东冲突升级（美伊、船舶袭击）"], ["对俄", "油气收入改善 + 输入性通胀压力上升"]], "sourceFull": "https://www.vedomosti.ru/investments/news/2026/09/10/1227987-tsena-nefti-brent"}, {"num": 12, "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-10 17:24", "title": "央行下调 9-11 官方汇率：美元 84.35（-1.11）、欧元 98.29，场外最低 83.47", "summary": "央行下调 9-11 官方汇率：美元 84.35 卢布（-1.11）、欧元 98.29、人民币 12.56；场外美元当日跌 0.92 卢布至 84.15，日内最低 83.47。出口结汇增加与财政部操作量变化支撑卢布，Совкомбанк 预计秋季在 83-89 区间，Финам 预计 9 月为 82-88。", "table": [["美元（9-11 生效）", "84.35 卢布（-1.11）"], ["欧元", "98.29 卢布（-0.97）"], ["人民币", "12.56 卢布（-0.17）"], ["场外美元", "84.15（-1.08%），日内最低 83.47"], ["机构区间", "Совкомбанк 83-89；Финам（9 月）82-88"]], "sourceFull": "https://www.vedomosti.ru/finance/news/2026/09/10/1227904-ponizil-kurs"}, {"num": 13, "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-09 19:00", "title": "Росстат：9 月 1-7 日通胀 0.05%，智能手机一周涨 2.4%、电视涨 1.5%", "summary": "Росстат：9 月 1-7 日 CPI 为 100.05%，年初以来累计 4.72%。食品端鸡蛋 +1.8%、荞麦 +1.7%、糖 +0.6%，蔬果整体 -1.8%；耐用品继续涨价——智能手机一周 +2.4%、电视 +1.5%、国产乘用车 +0.9%。开学季需求与汇率传导叠加，耐用品成为通胀新推手。", "table": [["CPI（9-1~7）", "100.05%；年初以来 104.72%"], ["食品涨价", "鸡蛋 +1.8%、荞麦 +1.7%、糖 +0.6%"], ["蔬果", "整体 -1.8%（卷心菜 -4.9%）"], ["耐用品", "智能手机 +2.4%、电视 +1.5%、国产车 +0.9%"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/09/09/1227603-inflyatsiya-v-rossii"}, {"num": 14, "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-10 15:24", "title": "央行监测：企业价格预期升至 22.7 点、连续第三个月上升，商业景气指数 -2.3", "summary": "央行监测：9 月首周企业价格预期 22.7 点，连续第三个月上升；综合商业景气指数 -2.3 点（+0.1），产出预期 7.1 点（+0.7）、短期需求预期 5.4 点（+0.9）。居民 8 月通胀预期降至 13.7%、观察通胀 14.3%，但五年期预期升至 12.4%。价格预期回升将限制央行降息空间。", "table": [["企业价格预期", "22.7 点（三连升）"], ["商业景气指数", "-2.3 点（+0.1）"], ["产出/需求预期", "7.1 点（+0.7）/ 5.4 点（+0.9）"], ["居民通胀预期", "13.7%（观察通胀 14.3%；五年期 12.4%）"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/09/10/1227857-tsenovie-ozhidaniya"}, {"num": 15, "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-10 18:00", "title": "俄 1-7 月外贸顺差 892 亿美元（+13.3%）：对亚出口增 16.9%，机械装备出口下滑", "summary": "俄联邦海关署：1-7 月外贸顺差 892 亿美元（+13.3%），出口 2634 亿美元（+12.4%），进口 1742 亿美元（+12.0%）。对亚出口 +16.9% 至 2104 亿美元，对欧出口 335 亿美元（-3.7%）；食品与农产原料出口 +24.9%、金属 +21.2%，机械与装备 -5.8%。", "table": [["顺差（1-7月）", "892 亿美元（+13.3% y/y）"], ["出口 / 进口", "2634 亿美元（+12.4%）/ 1742 亿美元（+12.0%）"], ["对亚 / 对欧出口", "2104 亿美元（+16.9%）/ 335 亿美元（-3.7%）"], ["结构", "食品农产 +24.9%、金属 +21.2%、机械装备 -5.8%"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/09/10/1227913-profitsit-vneshnei-torgovli"}, {"num": 16, "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-10 18:54", "title": "莫斯科交易所指数站上 2300 点（+1.77%）：俄油、诺瓦泰克、俄气领涨", "summary": "9-10 莫斯科交易所指数盘中最高 2306.26 点（8-13 以来首次站上 2300），18:40 报 2304.19 点（+1.77%），本月累计 +5.75%；RTS 报 861.61 点（+3.21%）。领涨为俄油（+6.32%）、诺瓦泰克（+6.2%）、俄气（+5.14%）。油气涨价与 BRICS 峰会预期推升风险偏好。", "table": [["IMOEX", "盘中 2306.26；18:40 报 2304.19（+1.77%）"], ["本月累计", "+5.75%"], ["RTS", "861.61 点（+3.21%）"], ["领涨", "俄油 +6.32%、诺瓦泰克 +6.2%、俄气 +5.14%"]], "sourceFull": "https://www.vedomosti.ru/investments/news/2026/09/10/1227944-indeks-mosbirzhi"}, {"num": 17, "tag": "local", "tagText": "本地", "source": "Lenta", "time": "09-10 20:05", "title": "央行 9-11 议息：共识维持 14%，部分分析师预期再降 25bp 至 13.75%", "summary": "央行将于 9-11 13:30 MSK 公布利率决议，市场共识维持 14%，部分分析师预期再降 25bp 至 13.75%——分析频道「Твердые цифры」认为若要暂停降息「现在正是时点」：通胀与通胀预期仍偏高、货币供应快速扩张、8 月信贷强劲、预算参数未更新且供给侧受限。决议措辞将决定卢布与风险资产方向。", "table": [["决议时间", "9-11 13:30 MSK"], ["共识", "维持 14%（个别预期 13.75%）"], ["反对降息理由", "通胀/预期偏高、M2 快增、8 月信贷强劲"], ["其他约束", "预算参数未更新、供给侧受限"]], "sourceFull": "https://lenta.ru/news/2026/09/10/vozmozhnoe-snizhenie-klyuchevoy-stavki-banka-rossii-nazvali-proyavleniem-optimizma/"}, {"num": 18, "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-10 17:12", "title": "ЕЦБ 年内第二次加息 25bp：存款利率升至 2.5%，上调 2026 年通胀预测至 3.0%", "summary": "欧洲央行年内第二次加息，三大关键利率各上调 25bp：存款利率 9-16 起升至 2.5%，主要再融资利率 2.65%，边际贷款利率 2.9%。因中东冲突推升能源价格，ЕЦБ 上调通胀预测——2026 年平均 3.0%、2027 年 2.5%、2028 年 2.1%，并称仅靠货币政策难以回到 2% 目标，需结构性改革。", "table": [["加息幅度", "+25bp（年内第二次）"], ["存款利率", "2.5%（9-16 起生效）"], ["MRO / 边际贷款", "2.65% / 2.9%"], ["通胀预测", "2026 年 3.0%、2027 年 2.5%、2028 年 2.1%"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/09/10/1227896-etsb-stavki"}, {"num": 19, "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "09-09 14:13", "title": "华纳兄弟在俄申请注册「Harry Potter」商标，拟覆盖化妆品、饰品与餐具", "summary": "华纳兄弟娱乐 9 月在俄提交「Harry Potter」商标注册申请，拟覆盖化妆品、首饰、配饰、餐具、食品饮料及广告服务。西方品牌在俄商标布局出现重启迹象，若注册成功将挤压现有同名/近名商品；做美妆与周边品类的卖家需提前排查商品命名与图案的侵权风险。", "table": [["申请人", "Warner Bros. Entertainment（2026 年 9 月）"], ["拟覆盖品类", "化妆品、首饰、配饰、餐具、食品饮料、广告服务"], ["信号", "西方品牌在俄商标布局或重启"], ["对卖家", "排查商品命名/图案侵权风险，避免下架"]], "sourceFull": "https://ria.ru/20260909/rossija-2116574056.html"}, {"num": 20, "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "09-09 00:48", "title": "摩尔曼斯克胶原蛋白获亚太多国认证：月产 3.5 吨，大部分产量留国内", "summary": "摩尔曼斯克生物技术企业成为俄首家以北大西洋鳕鱼生产低分子胶原蛋白的厂商，已获日本、巴西、阿联酋、卡塔尔、科威特、巴林、韩国市场认证并扩大出口地理；月产海洋胶原蛋白 3.5 吨，大部分产量保留给俄本土市场。俄美妆原料端的进口替代与出口双线推进，本土原料供应链地位上升。", "table": [["企业/产品", "摩尔曼斯克低分子鳕鱼胶原蛋白（俄首家）"], ["认证市场", "日本、巴西、阿联酋、卡塔尔、科威特、巴林、韩国"], ["产能", "3.5 吨/月（大部分留俄市场）"], ["意义", "美妆原料进口替代 + 出口地理扩张"]], "sourceFull": "https://ria.ru/20260909/kollagen-2116458421.html"}, {"num": 21, "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "09-10 03:18", "title": "约 37% 俄家长推迟开学季电子采购：8 月价格可涨 50-100%，9-10 月成关键窗口", "summary": "调查显示约 37% 俄家长将笔记本、平板与智能手机等开学电子采购推迟到秋季以省钱：8 月是需求峰值、卖家没有折扣动力，价格可上涨 50-100%；延后购买可买到更高品质机型或同款更低价。对 3C 卖家而言，9-10 月的价格策略与转化窗口至关重要。", "table": [["推迟比例", "约 37% 的家长（笔记本/平板/手机）"], ["8 月价格", "旺季可上涨 50-100%"], ["消费者逻辑", "延后购买可升级机型或同款更低价"], ["对卖家", "9-10 月价格与转化关键窗口"]], "sourceFull": "https://ria.ru/20260910/tekhnika-2116706956.html"}, {"num": 22, "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-11 00:00", "title": "Минцифры 拟立法把「Алиса AI」设为不可卸载预装应用，行业要求公开讨论", "summary": "Минцифры 正在修订法案，拟将「Алиса AI」定位为智能手机上不可卸载的预装应用；行业要求该倡议公开讨论。参照此前俄对预装软件清单的强制要求，新规将进一步锁定国产 AI 助手的入口地位，影响手机厂商、应用分发渠道与数字广告的流量分配，也牵动第三方 App 的预装博弈。", "table": [["主管机关", "Минцифры（修订法案中）"], ["拟规定", "«Алиса AI» 成为不可卸载预装应用"], ["行业态度", "要求公开讨论"], ["影响", "手机厂商预装结构、应用分发与广告流量分配"]], "sourceFull": "https://www.kommersant.ru/doc/8941278"}, {"num": 23, "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "09-11 02:47", "title": "俄电表更换期限自 2027-01-01 起由 6 个月缩短至 3 个月，费用由供能企业承担", "summary": "自 2027-01-01 起，俄故障电表更换期限由 6 个月缩短至 3 个月：公寓楼内由保底供电方、私宅由电网公司负责更换，居民无需自购设备与支付安装费；若能源公司逾期未在用户投诉后整改，电价将适用下调系数。电表采购与安装责任明确转向供能企业侧，B2B 设备与安装服务需求相应上升。", "table": [["生效时间", "2027-01-01"], ["期限", "6 个月 → 3 个月"], ["责任方", "公寓楼：保底供电方；私宅：电网公司"], ["用户成本", "免购设备与安装费（逾期电价下调系数）"]], "sourceFull": "https://ria.ru/20260911/elektroschetchiki-2116947994.html"}]}
