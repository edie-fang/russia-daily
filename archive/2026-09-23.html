{"date": "2026-09-23", "stats": {"total": 29, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "俄「СПОТ」进口预申报系统运行三个月：财政效应 338 亿卢布，中国货直报俄罗斯比例上升", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-23 01:54", "summary": "财政部副部长萨扎诺夫 9-21 在莫斯科金融论坛披露：自 6-1 起对经欧亚经济联盟陆路入境的进口推行的「货物等待确认系统」（СПОТ），到 9 月初已产生 338 亿卢布财政效应（全年目标 500 亿卢布）；至 9-10 应缴间接税超过 2180 亿卢布，办理 54.4 万份 ДОПП 预申报，月均 1.1 万进口商使用，95% 的 QR 码有效，每周约 600 辆卡车因手续问题被拦在边境。联邦海关署长皮卡列夫称，中国货「绝大多数按真实价值直接报关进入俄罗斯」，经吉尔吉斯斯坦与哈萨克斯坦的转口通道明显减少。企业界要求以银行保函替代保证金，并把免缴保证金的「诚信门槛」从年营收 300 亿卢布降至 50–100 亿卢布。", "table": [["财政效应(至9月初)", "338亿卢布 / 全年目标 500亿"], ["应缴间接税(至9-10)", "超 2180 亿卢布"], ["已办 ДОПП", "54.4 万份"], ["月均使用进口商", "1.1 万家"], ["每周被拦卡车", "约 600 辆"], ["企业诉求", "银行保函替代保证金；诚信门槛降至 50–100 亿卢布"]], "sourceFull": "https://www.kommersant.ru/doc/8972646"}, {"num": 2, "title": "俄线上药品销售增长动能枯竭：金额 +22% 但包装量仅 +2%，客单价被抬至 674 卢布", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-23 01:54", "summary": "「药房峰会」上披露的数据显示，2026 年 1–7 月俄线上药品销售按包装仅增长 2%（2.7 亿盒，去年同期 +18%），金额增长 22% 至 1818 亿卢布（2025 年同期 +31%）；DSM Group 口径的线上药房营业额为 2507 亿卢布（+22.2%，去年同期 33.2%）。增长几乎全靠涨价：线上单件均价 674 卢布（+19%）、7 月升至 724 卢布，线下均价 392 卢布（+12%）。传统药房金额仅 +4% 至 9270 亿卢布、销量 -7% 至 23 亿盒。唯一强驱动为司美格鲁肽/替尔泊肽类（«Оземпик»/«Мунджаро» 型），占线上收入的 11%、销量增长 2.4 倍；但随「Фармстандарт」等新厂商入场，该细分可能面临价格侵蚀。", "table": [["线上金额", "+22% → 1818 亿卢布"], ["线上包装量", "+2% → 2.7 亿盒(去年 +18%)"], ["线上单件均价", "674 卢布(+19%)，7 月 724"], ["线下金额/销量", "+4% / -7%"], ["GLP-1 类线上占比", "11%，销量 +2.4 倍"]], "sourceFull": "https://www.kommersant.ru/doc/8972526"}, {"num": 3, "title": "俄金融监测局拟新增冻结账户理由：姓名与出生日期「部分吻合」即暂停操作 5 个工作日", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-23 04:44", "summary": "《Известия》9-23 报道，俄金融监测局（Росфинмониторинг）提议新增一项账户冻结依据：当客户资料与被列入冻结名单人员的资料出现部分吻合时，即可触发限制。银行系统将比对姓名与出生日期，以提升对不法分子操作的抵抗力。若数据相似，客户的操作将被暂停 5 个工作日；若期间未作出延长限制的决定，资金访问即恢复。该局此前称账户被冻结的常见原因是客户行为异常，包括过于频繁的转账与大额操作。对卖家的含义：法人及实际控制人在银行登记的姓名与出生日期务必与证件完全一致，并预留备用收款通道，避免货款被误冻结造成回款中断。", "table": [["触发条件", "姓名 + 出生日期部分吻合"], ["暂停时长", "5 个工作日"], ["恢复条件", "未作出延长限制决定"], ["信息来源", "《Известия》引金融监测局"]], "sourceFull": "https://ria.ru/20260923/rossiya-2119635895.html"}, {"num": 4, "title": "俄消费者组织集体反对收紧网购退货新规：拟允许整类商品不可退、ПВЗ 退货取决于卖家", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)（引《Ъ》）", "time": "09-22 05:25", "summary": "多家消费者组织批评经济发展部收紧远程交易退货规则的草案。据「社会消费倡议」（ОПИ）向《Ъ》提交的意见，草案明显收窄线上购物者权利：允许对整类远程购买商品完全取消退货权（含尚未收货的预付商品，清单由政府单独法令确定）；取件点（ПВЗ）退货与否取决于平台卖家，卖家可拒绝退货；为向消费者扣收「拒收前运费」设立依据；无人签收配送时商品的意外毁损风险转由买家承担。莫斯科消费者保护协会与鞑靼斯坦消费者联盟持相同立场，并警告卖家保证商品描述真实性的动力也会下降。经济发展部回应称，草案旨在「拉平平台与其合作伙伴的条件」。", "table": [["草案主体", "俄经济发展部"], ["反对方", "ОПИ / МОЗП / 鞑靼斯坦消费者联盟"], ["新增不可退清单", "由政府单独确定"], ["ПВЗ 退货权", "取决于卖家，可拒绝"], ["风险转移", "无人签收时归买家"]], "sourceFull": "https://www.retail.ru/news/obshchestvennye-organizatsii-vystupili-protiv-uzhestocheniya-pravil-vozvrata-kup-22-sentyabrya-2026-282400/"}, {"num": 5, "title": "«Яндекс» 与 VK 洽谈合并 B2B 资产，组建各持股 50% 的合资公司", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)（引 RBC）", "time": "09-22 05:25", "summary": "据 RBC 消息，«Яндекс» 与 VK 正就组建合资公司进行谈判，新实体可能以 Yandex B2B Tech 与 VK Tech 两大方向为基础。资产清单尚未最终确定，讨论中的方案包括 VK 转出 VK Tech，«Яндекс» 转出云平台 Yandex Cloud、「Яндекс 360」服务以及 B2B 部门的一项 ИИ 资产；双方预计各持 50%，运营主体可能是 ООО «БТБ Тех»，谈判已持续两个多月。对卖家的含义：俄本土 B2B 云与数字化服务供给可能进一步集中，店铺所用的 IT、广告与 CRM 服务商归属及费率或在整合后调整，建议先梳理合同期限与数据迁移条款。", "table": [["双方持股", "各 50%"], ["Яндекс 侧资产", "Yandex Cloud / «Яндекс 360» / 一项 ИИ 资产"], ["VK 侧资产", "VK Tech"], ["运营主体(候选)", "ООО «БТБ Тех»"], ["谈判时长", "2 个多月"]], "sourceFull": "https://www.retail.ru/news/yandeks-i-vk-mogut-obedinit-b2b-aktivy-22-sentyabrya-2026-282418/"}, {"num": 6, "title": "莫斯科州轻型工业仓储回暖：二季度新增 7.5 万㎡（环比 +42%），全年预计同比 +77%", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)（引 CORE.XP）", "time": "09-22 05:25", "summary": "CORE.XP 数据显示，2026 年上半年莫斯科环城公路以外 light industrial 新增建设 19.7 万㎡（同比 -36%），但二季度单季投用 7.5 万㎡、环比增长 42%；年内预计再投用 50.2 万㎡，全年潜在规模达 62.9 万㎡，比 2025 年的 35.5 万㎡高 77%。上半年优质存量达 109.5 万㎡，供应仍集中于南向（辛菲罗波尔公路占 53%），多层仓库形态开始起量。二季度自由区块加权年租金 14 849 卢布/㎡（不含增值税与运营费），多层仓 17 189 卢布/㎡。对卖家的含义：分散库存的现货仓源正在放量，可趁租金与供应窗口锁定多年期租约，降低对平台单点仓的依赖。", "table": [["二季度新投用", "7.5 万㎡（环比 +42%）"], ["全年潜在规模", "62.9 万㎡（2025 年 35.5 万㎡，+77%）"], ["自由块年租金", "14 849 卢布/㎡（多层仓 17 189）"], ["供应集中度", "辛菲罗波尔公路占 53%"], ["交易结构", "上半年 78% 面积通过购买成交"]], "sourceFull": "https://www.retail.ru/news/rynok-light-industrial-narashchivaet-tempy-vvod-ploshchadey-v-ii-kvartale-2026-g-22-sentyabrya-2026-282403/"}, {"num": 7, "title": "«Ашан Ритейл Россия» 换帅；«Ашан» 与 «Нестле» 声明移交管理权不等于国有化", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-22 05:25", "summary": "俄媒 9-22 报道，法国欧尚俄罗斯业务 «Ашан Ритейл Россия» 由 Илья Бердников 出任负责人。同日 «Нестле» 与 «Ашан» 均发表声明，强调 9-17 总统令将部分外资在俄资产（含 Auchan、Nestlé、«Лемана Про»、FM Logistic）移交临时管理「不属于国有化」。此前临时管理人表示有意保留 «Лемана Про» 连锁网络，各方声明继续按原有模式运营。对卖家的含义：外资线下零售与建材 DIY 渠道暂未中断，但治理结构变化后原合同条款（账期、承租条件、退换货）需与临时管理人逐项重新确认，涉及这四家主体的应收与预付敞口建议做压力测试。", "table": [["新负责人", "Илья Бердников"], ["联合声明方", "«Ашан» / «Нестле»"], ["定性", "非国有化"], ["背景", "9-17 临时管理令"], ["涉及主体", "Auchan / Nestlé / «Лемана Про» / FM Logistic"]], "sourceFull": "https://www.retail.ru/news/ilya-berdnikov-mozhet-vozglavit-roznichnuyu-set-ashan-22-sentyabrya-2026-282443/"}, {"num": 8, "title": "9-22 夜至 9-23 晨大规模无人机袭击：喀山、萨马拉、乌法、布古利马、下卡姆斯克、切博克萨雷机场先后停摆", "tag": "local", "tagText": "本地", "source": "国际文传电讯社(Interfax)", "time": "09-23 03:57", "summary": "俄联邦航空运输署（Росавиация）通报，9-23 凌晨起先后对喀山（02:19）、布古利马与下卡姆斯克（Бегишево，02:41）、萨马拉（Курумоч）与乌法（03:57）、切博克萨雷（04:05）机场实施航班接收与放行的临时限制；莫斯科多莫杰多沃机场在实施限制后已恢复常态运行；克里米亚大桥公路交通一度暂停后恢复。所有限制理由均为「保障飞行安全」。对跨境卖家的含义：伏尔加流域与乌拉尔方向的主干航空及部分干线物流出现间歇性停摆，四季度补货与快件时效需按「枢纽中断 24–48 小时」预留缓冲，并为高时效订单准备备用通道。", "table": [["受限机场", "喀山 / 萨马拉（Курумоч）/ 乌法 / 布古利马 / 下卡姆斯克 / 切博克萨雷"], ["首起限制", "02:19（喀山）"], ["多莫杰多沃", "限制后已恢复"], ["克里米亚大桥", "暂停后恢复"]], "sourceFull": "https://www.interfax.ru/russia/1117854"}, {"num": 9, "title": "萨马拉州连续第二夜遭袭：州长称目标为工业企业，防空击落数十架无人机", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-22 06:55", "summary": "萨马拉州州长 Федорищев 9-22 通报，该州当夜「再次击退乌克兰攻击」，防空击落数十架无人机，「敌人瞄准的是工业企业」，并出现民用设施受损（包括私人住宅与汽车），行动指挥部正在核实后果。这是该州连续第二夜遭遇大规模无人机袭击（9-21 夜已有同类通报），同期伏尔加流域多个机场实施航班限制。对卖家的含义：萨马拉/乌法/喀山方向的在库与在途货物需立即核对，无人机风险在伏尔加下游已成常态化——该州正是 Ozon 恰帕耶夫斯克仓所在州，应持续跟踪平台的区域暂停收货与改道公告。", "table": [["时间", "9-22 凌晨"], ["袭击目标", "工业企业（州长口径）"], ["击落", "数十架无人机"], ["民用受损", "私人住宅、汽车"], ["连续性", "连续第二夜"]], "sourceFull": "https://ria.ru/20260922/ataka-2119414860.html"}, {"num": 10, "title": "塔甘罗格再遭袭后 МИД 定性「恐怖主义」；特使通报一周内近 9000 次打击、日均 1250–1270 次", "tag": "local", "tagText": "本地", "source": "消息报(Izvestia)", "time": "09-23 02:40", "summary": "俄外交部特使 Мирошник 9-22 表示，乌克兰军队袭击塔甘罗格（罗斯托夫州）居民区与民用基础设施，再次显示其「恐怖主义本质」。另据其提交的 9-14 至 9-20 周报，乌克兰无人机与导弹袭击覆盖了沃罗涅日、乌льянов、伏尔加格勒、卡卢加、库尔斯克、莫斯科州、奥廖尔、梁赞、奥伦堡、罗斯托夫、萨马拉、特维尔、萨拉托夫、图拉、雅罗斯拉夫尔等近 20 个地区（不含顿巴斯），远程打击使用飞机型无人机；Мирошник 称本周达到「近 9000 次命中」的峰值、日均 1250–1270 次，并指袭击集中在杜马选举期间。当地仍在扑救此前两轮袭击引发的火情，已排查 76 套受损住房，9-23 塔甘罗格再次发布 БПЛА 威胁预警。", "table": [["一周命中", "近 9000 次"], ["日均", "1250–1270 次"], ["覆盖地区", "近 20 个（不含顿巴斯）"], ["塔甘罗格受损住房", "76 套已排查"], ["9-23", "再发 БПЛА 威胁预警"]], "sourceFull": "https://iz.ru/2171791/2026-09-23/miroshnik-zaiavil-o-terroristicheskoi-sushchnosti-kieva-posle-ataki-na-taganrog"}, {"num": 11, "title": "达吉斯坦确定需重点防护的「关键重要设施」清单，无人机防护下沉至地区执行层", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "09-23 00:31", "summary": "塔斯社 9-23 报道，达吉斯坦共和国已形成需重点防护的「关键重要设施」清单。此前财政部正研究修改立法以保护各类设施免遭 БПЛА 袭击（9-21），财政部副部长萨扎诺夫同期表示「国防支出与受损设施修复支出」拟纳入利润税税前扣除——本轮清单落地意味着反无人机防护正从中央立法下沉到地区执行层面。对卖家的含义：若自有仓或 3PL 仓所在地区被纳入清单管理，可能面临新增的安防合规要求（监控覆盖、物理加固、报备流程等），建议在四季度租约谈判与工程预算中预留相应科目与工期。", "table": [["主体", "达吉斯坦共和国"], ["对象", "关键重要设施清单"], ["政策链条", "立法研究(9-21) + 税前列支(9-21) → 地区清单(9-23)"], ["卖家影响", "安防合规要求与改造成本"]], "sourceFull": "https://tass.ru/obschestvo/28141065"}, {"num": 12, "title": "西班牙宣布自 2027-01-01 起停购俄液化天然气，尽管存在长期合同", "tag": "local", "tagText": "本地", "source": "消息报(Izvestia)", "time": "09-23 03:54", "summary": "西班牙外交大臣 Альбарес 9-22 在华盛顿大西洋理事会表示，西班牙计划自 2027 年 1 月 1 日起停止进口俄罗斯液化天然气（СПГ），尽管存在多年期长期合同——「合同是按十年计的，我们将执行这些新制裁」。他称西班牙拥有可观的 СПГ 储存与再加工能力，可帮助其他欧洲国家对接美国等伙伴的供应。本条为 9-23 03:54 更新的最新表态（此前通报称自 1 月 1 日起）。同期背景：德国储气库 9 月初仅灌装 53%，为 15 年统计以来同期最低。对卖家的含义：欧洲天然气与电价的中枢风险未解除，对欧出口的运费与需求仍存扰动，四季度物流报价宜保留浮动条款。", "table": [["停购生效", "2027-01-01"], ["当事方", "西班牙（外长 Альбарес）"], ["存量合同", "仍将执行"], ["德国储气", "9 月初 53%（15 年同期最低）"]], "sourceFull": "https://iz.ru/2171833/glava-mid-ispanii-albares-anonsiroval-otkaz-ot-spg-iz-rf-nesmotria-na-kontrakty-izi"}, {"num": 13, "title": "拉夫罗夫与卢比奥将于莫斯科时间 9-23 16:00 在纽约会晤，拉夫罗夫 9-26 在联大演讲", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "09-23 03:13", "summary": "美国国务院与俄方分别确认，俄外长拉夫罗夫与美国国务卿卢比奥计划于 9-23 在联合国大会期间会晤，时间定为莫斯科时间 16:00；双方将讨论俄美在联合国框架内的互动问题与分歧。俄外交部同时宣布，拉夫罗夫将于 9-26 在联大一般性辩论发言并举行记者会；此行仅安排与一位欧洲代表会面。对市场与卖家的含义：若会晤释放缓和信号，可能影响能源价格、卢布汇率与物流保险成本；反之或加剧制裁与航运风险。建议本周内对四季度运价与汇率敞口保持双向预案，不宜单向押注。", "table": [["会晤时间", "9-23 16:00 MSK"], ["地点", "纽约（联大期间）"], ["议题", "联合国框架内互动与分歧"], ["拉夫罗夫演讲", "9-26"], ["欧洲会面", "仅 1 位代表"]], "sourceFull": "https://tass.ru/mezhdunarodnaya-panorama/28141229"}, {"num": 14, "title": "统一俄罗斯党在托木斯克州立法杜马获 42 席中的 28 席；米罗诺夫继续任「公正俄罗斯」党团领袖", "tag": "local", "tagText": "本地", "source": "国际文传电讯社(Interfax)", "time": "09-23 04:07", "summary": "托木斯克州选举委员会 9-23 通报，统一俄罗斯党在州立法杜马选举中获得 42 个席位中的 28 席，巩固多数地位。同日塔斯社报道，米罗诺夫将继续担任国家杜马「公正俄罗斯—为了真理」党团领袖（自 2011 年起担任该职）。至此 2026 年杜马选举后的地方立法机构格局进一步定型。对卖家的含义：地方层面的政策延续性较强，涉及地区性补贴、仓储用地与地方采购的政策窗口大概率沿用既有框架，可据此推进地方渠道与政府采购方向的布局，同时关注新一届地方杜马对中小企业扶持预算的审议节奏。", "table": [["托木斯克州杜马", "42 席"], ["统一俄罗斯党", "28 席"], ["米罗诺夫", "继续任党团领袖"], ["背景", "2026 杜马选举后地方格局定型"]], "sourceFull": "https://www.interfax.ru/russia/1117855"}, {"num": 15, "title": "布伦特跌破 98 美元：9-22 盘中报 97.67 美元（-2.66%），为 9-8 以来首次", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-22 13:27", "summary": "9-22 莫斯科时间 13:12，11 月交割的布伦特原油期货较前一交易日收盘下跌 2.66% 至 97.67 美元/桶，自 9-8 以来首次跌破 98 美元；WTI 同期下跌 3.18% 至 89.43 美元/桶，全球油价整体跌幅超过 3%。此前 9-21 布伦特已一度跌破 100 美元关口。对卖家的含义：油价回落对卢布与干线运价形成双向影响——一方面燃油附加费压力或缓解，另一方面财政承压可能带来税费与流动性政策的调整，四季度成本结构仍建议按财政部预算口径（油价 50 美元/桶）的保守情形测算。", "table": [["布伦特（11 月合约）", "97.67 美元/桶（-2.66%）"], ["WTI", "89.43 美元/桶（-3.18%）"], ["时点", "9-22 13:12 MSK"], ["里程碑", "9-8 以来首次跌破 98 美元"]], "sourceFull": "https://ria.ru/20260922/neft-2119487323.html"}, {"num": 16, "title": "审计院：上半年联邦预算赤字 5.85 万亿卢布，为全年批准赤字（3.786 万亿）的 1.5 倍", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-23 00:09", "summary": "俄审计院半年度执行报告显示，2026 年 1–6 月联邦预算赤字 5.85 万亿卢布，而 2026 年全年批准赤字为 3.786 万亿；收入 18.5 万亿卢布（油气 3.5 万亿、非油气 15 万亿），支出 24.4 万亿卢布。国家债务上半年增长 6.8% 至 37.5 万亿卢布，付息支出 1.8 万亿卢布。国家福利基金（ФНБ）卢布口径较年初减少 3110 亿至 13.1 万亿卢布，其中流动性资产减少 4733 亿至 3.6 万亿。对卖家的含义：财政压力上升通常对应税收征管趋严与扶持政策审慎，四季度至 2027 年的税费安排与补贴申请需按「更严格合规」预期准备。", "table": [["上半年赤字", "5.85 万亿卢布"], ["全年批准赤字", "3.786 万亿卢布"], ["收入 / 支出", "18.5 万亿 / 24.4 万亿"], ["国家债务", "37.5 万亿（+6.8%）"], ["ФНБ", "13.1 万亿（-3110 亿），流动性资产 3.6 万亿"]], "sourceFull": "https://ria.ru/20260923/defitsit-2119624863.html"}, {"num": 17, "title": "АКРА：仅 5 个地区贡献全俄合并预算一半税收，莫斯科独占 23.6%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)（引 АКРА）", "time": "09-23 01:54", "summary": "评级机构 АКРА 的监测显示，仅 5 个地区贡献了俄合并预算全部税收收入的一半：莫斯科（10.7 万亿卢布、同比 +28%、占比 23.6%）、汉特-曼西自治区（3.95 万亿、-22%、8.7%）、亚马尔-涅涅茨自治区（2.84 万亿、-14%、6.3%）、莫斯科州（2.71 万亿、+22%、6%）与圣彼得堡（2.64 万亿、+10%、5.8%）。莫斯科的增长来自金融业创纪录利润、贸易与 IT 板块；能源型地区因油价下跌与卢布走强明显承压。对卖家的含义：税务与消费能力的地区分化加剧，资源型地区的需求与地方扶持力度可能走弱，渠道与库存配置宜向莫斯科、莫斯科州、圣彼得堡等高税收高消费地区倾斜。", "table": [["莫斯科", "10.7 万亿（+28%，占 23.6%）"], ["汉特-曼西", "3.95 万亿（-22%）"], ["亚马尔-涅涅茨", "2.84 万亿（-14%）"], ["莫斯科州", "2.71 万亿（+22%）"], ["圣彼得堡", "2.64 万亿（+10%）"]], "sourceFull": "https://www.kommersant.ru/doc/8972411"}, {"num": 18, "title": "«Эксперт РА»：若预算执行改善，2026 年底前关键利率有望再降 50 个基点", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "09-23 00:33", "summary": "评级机构 «Эксперт РА» 总经理 Чекурова 表示，在预算执行动态改善的条件下，俄央行到 2026 年底前可能再下调关键利率 50 个基点（当前为 14%，9-11 议息维持不变）。同日该机构把「现金需求上升」的根本原因归结为 2025 年的低基数——当时存款利率在 18% 及以上，居民把钱大量存入银行，形成今日偏低的对比基数。对卖家的含义：降息路径取决于财政与通胀数据，短期资金成本仍高（存款利率已突破 13%），四季度备货融资不宜依赖「快速降息」假设，建议按当前利率水平做资金预算。", "table": [["当前关键利率", "14%（9-11 维持）"], ["潜在下调", "50 个基点（年底前）"], ["前置条件", "预算执行动态改善"], ["现金需求上升主因", "2025 年低基数"]], "sourceFull": "https://tass.ru/ekonomika/28141075"}, {"num": 19, "title": "俄十大行最高存款利率突破 13%，为 5 月下半月以来最高；银行争夺「新资金」", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-22 20:54", "summary": "俄央行数据显示，9 月第二旬十大银行卢布存款最高平均利率突破 13% 年化，为 5 月第二旬以来最高，近两个月上升 0.25 个百分点。Сбер 自 9-17 起将 6 个月与 7 个月以上存款利率分别上调 0.9 与 1.2 个百分点至 13.5%；«Дом.РФ» 自 9-22 起上调 7–12 个月存款利率 0.2–0.5 个百分点，最高达 13.7%。8 月流动性缺口达 2.45 万亿卢布，居民存款 6 月减少 3230 亿、7 月减少 5660 亿，8 月降幅收窄至 0.1 万亿。下次议息为 10-23，秋季 ЖКХ 涨价将推升通胀风险。", "table": [["十大行最高存款利率", ">13%（两个月 +0.25 п.п.）"], ["Сбер", "13.5%（9-17 起）"], ["«Дом.РФ»", "13.7%（9-22 起）"], ["8 月流动性缺口", "2.45 万亿卢布"], ["居民存款", "7 月 -5660 亿卢布"], ["下次议息", "10-23"]], "sourceFull": "https://www.kommersant.ru/doc/8972577"}, {"num": 20, "title": "俄央行 9-22 单日回购投放创纪录 7 万亿卢布，并把 2026 年结构性缺口预测上调至 4–5.2 万亿", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-22 19:13", "summary": "9-22 俄央行通过回购向银行体系投放 7 万亿卢布，创此类拍卖历史纪录：一日「微调」回购投放 1 万亿（加权利率 14.28%，需求超过供给 2.6 倍），7 天期回购满足 6 万亿（14.13%，需求达 7.7 万亿）。流动性缺口来自现金外流（9-1 为 2.6 万亿卢布）、国库投放减少（2.4 万亿）与对公信贷增长（8 月 +1.6% 至 105.2 万亿）。央行 9 月已把 2026 年结构性流动性缺口预测从 2.4–3.6 万亿上调至 4–5.2 万亿卢布。对卖家的含义：资金成本短期难降，平台结算与供应链融资费率的下行空间有限。", "table": [["单日回购投放", "7 万亿卢布（历史纪录）"], ["一日回购", "1 万亿 @14.28%"], ["7 天回购", "6 万亿 @14.13%"], ["8 月对公信贷", "+1.6% 至 105.2 万亿卢布"], ["2026 缺口预测", "4–5.2 万亿卢布（上调）"]], "sourceFull": "https://www.kommersant.ru/doc/8972583"}, {"num": 21, "title": "ФАС 拟把电网企业「防打击安全支出」计入输配电价，明确不涉及居民电价", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-22 20:41", "summary": "俄联邦反垄断局（ФАС）公布命令草案，拟将电网企业「保障人员与电力设施免遭打击手段伤害」的支出纳入不受控成本清单、计入输配电价必要毛收入（НВВ），同时把储能系统（СНЭ）维护支出纳入核算。政府此前已就此出台相关决议（含新地区与边境地区）。ФАС 强调居民电价不受影响；«Россети» 称此举使安防支出在电价监管中获得经济合理性依据，首要目标是维持供电可靠性。专家指出，此类支出规模取决于地区与交战线距离，且应具临时性。对卖家的含义：仓库与门店的电力安防成本可能被部分社会化，租赁与 3PL 合同中的电力/安防分摊条款值得重新谈判。", "table": [["发布方", "ФАС（命令草案）"], ["纳入项", "人员与电力设施防打击安全支出"], ["居民电价", "不受影响"], ["另纳入", "储能系统（СНЭ）维护支出"], ["依据", "政府 2026-07-01 决议"]], "sourceFull": "https://www.kommersant.ru/doc/8972457"}, {"num": 22, "title": "铜价创历史新高：Comex 12 月合约最高 6.903 美元/磅，РФПИ 总裁称「铜是新的黄金」", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-23 03:18", "summary": "9-22 晚间，Comex 12 月交割铜期货价格最高触及 6.903 美元/磅，创历史新高。俄直接投资基金（РФПИ）总裁、总统对外投资与经济合作特别代表德米特里耶夫在社交平台 X 发文称「铜是新的黄金」。对卖家的含义：铜是灯具（电线、驱动电源、散热件）、家电与电工材料的关键成本项，铜价处于纪录高位将沿产业链传导至到岸成本与零售定价；四季度至 2027 年一季度的采购与报价建议按铜价上行情景重算，并评估替代规格、轻量化设计与价格保护期安排。", "table": [["Comex 铜（12 月合约）", "最高 6.903 美元/磅"], ["状态", "历史新高"], ["时点", "9-22 晚间"], ["当事表态", "РФПИ 德米特里耶夫"], ["相关品类", "灯具 / 家电 / 电工材料"]], "sourceFull": "https://ria.ru/20260923/glava-2119632944.html"}, {"num": 23, "title": "«Лэтуаль»：8 个月俄罗斯人买走 280 万件护发产品，约占网络总营收 3%", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-22 05:26", "summary": "连锁美妆零售商 «Лэтуаль» 通报，2026 年前 8 个月俄罗斯消费者在该网络购买了约 280 万件护发类产品，护发品类约占网络总营收的 3%。该数据与公司此前「消费者不再按季节整套更换护肤品，而是按皮肤状态替换单品」的判断同向，显示美妆消费正从「成套换新」转向「按需单品补位」。对美妆卖家的含义：护发与洗护类目的单品化、功能化（防脱、修护、头皮护理）是相对确定的增量方向，可用小规格与套装组合提升复购，并在 9–10 月换季窗口加大头皮护理类内容的投放力度。", "table": [["护发产品销量", "280 万件（1–8 月）"], ["占网络营收", "约 3%"], ["消费趋势", "单品替代成套"], ["机会窗口", "9–10 月换季"]], "sourceFull": "https://www.retail.ru/news/letual-za-vosem-mesyatsev-rossiyane-kupili-2-8-mln-sredstv-dlya-volos-22-sentyabrya-2026-282416/"}, {"num": 24, "title": "俄圣彼得堡国立电工大学研发「皮肤多扫描仪」，可多因子评估美容护理效果", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-23 03:58", "summary": "俄新社 9-23 报道，圣彼得堡国立电工大学（ЛЭТИ）研发出可对皮肤进行多因子评估的「多扫描仪」（мультисканер кожи），用于客观评估美容师的护理效果。该设备通过多项皮肤参数给出护理前后的对比结果，可把美容效果可视化。对美妆卖家的含义：若设备进入商用，美容院与美妆连锁的「效果可视化」营销将成为差异化卖点，仪器类产品与配套护肤品的捆绑销售机会值得关注；目前仍处研发与产业化早期，宜持续跟踪量产、认证与价格信息，暂不宜据此制定采购计划。", "table": [["研发单位", "圣彼得堡国立电工大学（ЛЭТИ）"], ["产品", "皮肤多扫描仪"], ["用途", "客观评估美容护理效果"], ["阶段", "研发/早期（待产业化）"], ["潜在场景", "美妆门店 / 美容院"]], "sourceFull": "https://ria.ru/20260923/kosmetika-2119634491.html"}, {"num": 25, "title": "«М.Видео» 商业总监承认流动资金短缺：代理制供货商欠款 3 个月达 1700 万卢布", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)（引 РБК）", "time": "09-22 05:27", "summary": "«М.Видео» 商业总监 Сергей Уваров 在其与交易对手的沟通中承认公司出现流动资金短缺。一名按代理模式合作的供应商称，欠款已持续三个月、金额达 1700 万卢布且仍在增长；Уваров 回应称问题「在控制之中」，逾期欠款「几乎以手工方式」逐笔处理，期望 1–2 个月内恢复正常。公司 2025 年财报显示营收同比 -28% 至 3248 亿卢布、GMV -26% 至 4181 亿卢布，净亏损从 201 亿扩大至 636 亿卢布，并已放弃年度分红；2026 年一季度代理商与 3P 销售合计约占集团总营业额的 35%。", "table": [["欠款时长", "3 个月"], ["单笔欠款", "1700 万卢布"], ["恢复预期", "1–2 个月"], ["2025 营收", "3248 亿卢布（-28%）"], ["2025 净亏", "636 亿卢布（上年 201 亿）"], ["代理+3P 占比", "约 35%（2026 Q1）"]], "sourceFull": "https://www.retail.ru/news/kommercheskiy-direktor-m-video-soobshchil-o-nekhvatke-oborotnykh-sredstv-22-sentyabrya-2026-282442/"}, {"num": 26, "title": "«М.Видео» 恢复自有品牌 ПВЗ 加盟申请：数日收到 700+ 申请，覆盖将扩至 13 个地区", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-22 05:27", "summary": "«М.Видео» 在莫斯科、莫斯科州与圣彼得堡恢复自有品牌取件点（ПВЗ）注册（此前因申请量过大而暂停），并宣布第二波拓展进入 10 个地区：萨马拉州、罗斯托夫州、新西伯利亚州、斯维尔德洛夫斯克州、鄂木斯克州、克麦罗沃州、托木斯克州、鞑靼斯坦、巴什科尔托斯坦与克拉斯诺达尔边疆区，自有 ПВЗ 地理覆盖将达 13 个地区。恢复注册数日内收到 700 多份申请，兴趣最高的是罗斯托夫州、斯维尔德洛夫斯克州、萨马拉州与鞑靼斯坦。新规还要求入口装修达到最低标准并完成员工培训。对 3P 卖家的含义：家电与电子品类在俄罗斯西伯利亚与南部的新增取件网络扩容，末端配送与自提转化机会增加。", "table": [["恢复注册区域", "莫斯科 / 莫斯科州 / 圣彼得堡"], ["新增 10 个地区", "萨马拉、罗斯托夫、新西伯利亚等"], ["覆盖地区总数", "13 个"], ["首几日申请", "700+"], ["新增要求", "门面装修 + 员工培训"]], "sourceFull": "https://www.retail.ru/news/m-video-vozobnovila-priem-zayavok-na-registratsiyu-pvz-22-sentyabrya-2026-282411/"}, {"num": 27, "title": "«М.Видео» 总经理：计划 2027–2028 年恢复稳定盈利，上半年净亏 361 亿卢布同比 +43%", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-23 01:56", "summary": "«М.Видео» 总经理 Владислав Бакальчук 对《Ведомости》表示，公司预计在 2027–2028 年恢复稳定盈利，主要靠业务转型——正从传统电子产品零售商转为多品类平台，自研几乎所有关键组件（前台、物流、个人中心、仓库与 ПВЗ 工具、运输、商品搜索与移动端），并借鉴中国方案建设「开放平台」，与 «Холодильник.ру» 等伙伴共同开发开放协议，让商家一次接入即可在多平台销售。财务方面，上半年净亏损同比扩大 43% 至 361 亿卢布，营收 1082 亿卢布、同比 -36.8%。对卖家的含义：若开放协议落地，家电类卖家可一次对接多平台；但该公司资金链承压期应设定账期上限与信用额度。", "table": [["盈利目标", "2027–2028 年"], ["上半年净亏", "361 亿卢布（+43%）"], ["上半年营收", "1082 亿卢布（-36.8%）"], ["转型方向", "多品类开放平台"], ["合作伙伴", "«Холодильник.ру» 等"]], "sourceFull": "https://ria.ru/20260923/pribylnost-2119629455.html"}, {"num": 28, "title": "装修成本上行预警：人工费 3 年翻倍以上，50㎡ 全面翻新现价 550 万卢布，2027 再涨 20% 则多付 110 万", "tag": "local", "tagText": "本地", "source": "消息报(Izvestia)", "time": "09-23 04:30", "summary": "《Известия》9-23 报道的专家评估显示，装修人工费从 2024 年的 8–12 千卢布/㎡ 升至 2026 年的 35–50 千卢布/㎡，同期材料价格涨约 23%——装修涨价的主导因素已从材料变为「稀缺的合格人工」。以 50㎡ 公寓为例，当前全面翻新（含工程、拆除、材料、门与地板）单价 110 千卢布/㎡、总额 550 万卢布；若明年涨价 5%/10%/15%/20%，则分别多支出 27.5 万/55 万/82.5 万/110 万卢布。对灯具与家居卖家的含义：装修「延后决策」会把需求推到更晚且更贵，宜在 9–11 月装修旺季用「含安装/含设计」的全包方案锁定订单，并对人工依赖度高的品类设置价格保护期。", "table": [["装修人工费", "2024 年 8–12 千卢布/㎡ → 2026 年 35–50 千卢布/㎡"], ["材料涨幅", "同期约 +23%"], ["50㎡ 全面翻新", "110 千卢布/㎡ = 550 万卢布"], ["涨价 20% 情景", "总价 660 万卢布（+110 万）"]], "sourceFull": "https://iz.ru/2169444/2026-09-23/ekspert-rasskazala-o-riskakh-podorozhaniia-remonta-v-2027-godu"}, {"num": 29, "title": "俄杜马预测 2026 年底市场房贷利率或达 15–16%，央行预计 2027 年平均关键利率降至 10.5–12.5%", "tag": "local", "tagText": "本地", "source": "Lenta.ru（引 «Газета.Ru»）", "time": "09-23 03:37", "summary": "俄国家杜马建设与住房公用事业委员会副主席 Аксененко 对《Газета.Ru》预测，到 2026 年底市场房贷利率可能达到 15–16%，因此无法简单建议家庭「现在买」或「再等一年」——期间房贷条件、房价、租金、家庭收入与储蓄收益都会变化。但他承认存在继续降息的前提：俄央行基准情景预计 2027 年平均关键利率为 10.5–12.5%（2026 年为 14.5–14.6%），这将逐步降低市场房贷成本，但关键利率与房贷利率并不同步、也不同比例变动。对灯具与家居卖家的含义：房屋成交是照明与家居需求的领先指标，若 2027 年降息兑现，装修与照明需求有望在 2027 年上半年回暖，四季度备货不宜过度悲观，也不宜押注「立即反弹」。", "table": [["2026 年底市场房贷利率", "或达 15–16%"], ["2027 平均关键利率", "10.5–12.5%（央行基准情景）"], ["2026 平均关键利率", "14.5–14.6%"], ["利率传导", "不同步、不同比例"], ["领先指标", "房屋成交 → 装修/照明需求"]], "sourceFull": "https://lenta.ru/news/2026/09/23/v-gosdume-raskryli-srok-snizheniya-stavok-po-ipoteke/"}]}
