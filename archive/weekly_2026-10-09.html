]}, {"icon": "📊", "name": "经济", "items": [{"num": 12, "title": "【汇率】卢布走弱：市场美元 10-06 破 85 ₽（9-10 以来首次），财政部购汇规模提高 5 倍以上", "tag": "local", "tagText": "本地", "source": "Ведомости / Коммерсантъ / 央行（ЦБ）", "time": "10-05 ~ 10-09", "summary": "卢布本周承压：场外美元汇率 10-06 升破 85 ₽（盘中最高 85.37、9-10 以来首次），央行官方美元汇率 10-07 报 85.7116 ₽、10-08/10-09 连续维持在约 85 ₽。主因财政部在预算规则下将外汇与黄金购买规模提高 5 倍以上，叠加油价高位与地缘扰动。含义：进口成本与跨境结算汇率风险上行，卖家定价与换汇节奏需动态管理。", "table": [["市场美元", "10-06 破 85 ₽"], ["官方美元（10-07）", "85.7116 ₽"], ["官方美元（10-08）", "≈85 ₽"], ["财政部购汇", "提高 5 倍以上"]], "url": "https://www.vedomosti.ru/finance/news/2026/10/06/1234786-kurs-dollara-podnyalsya", "sourceFull": "https://www.vedomosti.ru/finance/news/2026/10/06/1234786-kurs-dollara-podnyalsya"}, {"num": 13, "title": "【通胀·利率】周通胀 0.96%（年内逼近 6%）；央行合意利率区间 10.5–12.5%，机构称降息周期已启", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "10-05 ~ 10-09", "summary": "俄统计局口径周通胀为 0.96%（9-29~10-05），年内累计逼近 6%，其中住房公用事业（ЖКХ）调价贡献约 0.75 个百分点。央行副行长扎博特金表示，要稳定通胀关键利率应处 10.5–12.5% 区间；Сбер 总裁格列夫称央行已开启降息周期。含义：通胀黏性使降息节奏偏慢，但方向明确，Q4 信贷与消费弹性是关键变量。", "table": [["周通胀（9-29~10-05）", "0.96%"], ["年内累计", "逼近 6%"], ["ЖКХ 贡献", "约 0.75 п.п."], ["合意利率区间", "10.5–12.5%"]], "url": "https://www.vedomosti.ru/economics/news/2026/10/07/1235202-inflyatsiya-v-rossii", "sourceFull": "https://www.vedomosti.ru/economics/news/2026/10/07/1235202-inflyatsiya-v-rossii"}, {"num": 14, "title": "【油价·增长】Brent 高位震荡（103→102 美元）；EIA 上调 2026 均价预测至 96.3 美元；世行维持俄 GDP +0.8%", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "10-05 ~ 10-08", "summary": "Brent 本周先突破 103 美元（10-05）、后回落至 102 美元附近（10-07），维持高位宽幅震荡；美国 EIA 将 2026 年 Brent 均价预测上调至 96.3 美元、四季度看 105 美元。世界银行维持俄罗斯 2026 年 GDP 增长 0.8% 的判断；国家福利基金（ФНБ）9 月缩水 2,100 亿 ₽，政府筹备「低油价时期」预案。含义：油价高位托底财政与卢布，但基金消耗与增长偏弱并存，宏观不确定性延续。", "table": [["Brent", "103 → 102 美元"], ["EIA 2026 均价", "96.3 美元（Q4 105）"], ["世行俄 GDP（2026）", "+0.8%"], ["ФНБ（9 月）", "−2100 亿 ₽"]], "url": "https://www.vedomosti.ru/business/news/2026/10/06/1234825-prognoz-tseni-brent", "sourceFull": "https://www.vedomosti.ru/business/news/2026/10/06/1234825-prognoz-tseni-brent"}]}, {"icon": "💄", "name": "美妆", "items": [{"num": 15, "title": "【渠道】«Улыбка радуги» 上线跨境专区「Из-за рубежа」：首批 7000+ 海外品牌", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-06", "summary": "俄美妆零售连锁 «Улыбка радуги» 上线跨境专区「Из-за рубежа」，首批引入 7,000+ 海外品牌商品，覆盖美妆、家居、服装与配饰。含义：本土连锁以跨境直邮补充海外供给，为海外（含中国）美妆品牌提供新的入俄渠道，同时加剧本土线上美妆竞争。", "table": [["专区", "Из-за рубежа"], ["首批", "7000+ 海外品牌"], ["品类", "美妆/家居/服装/配饰"]], "url": "https://www.retail.ru/news/ulybka-radugi-zapustila-prodazhi-tovarov-iz-za-rubezha-5-oktyabrya-2026-282932/", "sourceFull": "https://www.retail.ru/news/ulybka-radugi-zapustila-prodazhi-tovarov-iz-za-rubezha-5-oktyabrya-2026-282932/"}, {"num": 16, "title": "【合规】Роспотребнадзор 累计封禁 4.86 万个售卖禁售 БАД（保健品）的网站", "tag": "local", "tagText": "本地", "source": "Retail.ru / Роспотребнадзор", "time": "10-07", "summary": "俄消费者权益保护局（Роспотребнадзор）累计封禁 48,600 余个销售未经国家注册或违规宣传的 БАД（保健品/膳食补充剂）网站。含义：保健品线上合规门槛抬高，涉及 БАД 的卖家须核对国家注册与宣传用语，避免因渠道被清退而损失库存与流量。", "table": [["封禁网站", "48,600+"], ["口径", "禁售/违规宣传 БАД"]], "url": "https://www.retail.ru/news/v-rossii-zablokirovali-bolee-48-600-saytov-s-zapreshchennymi-badami-6-oktyabrya-2026-283036/", "sourceFull": "https://www.retail.ru/news/v-rossii-zablokirovali-bolee-48-600-saytov-s-zapreshchennymi-badami-6-oktyabrya-2026-283036/"}, {"num": 17, "title": "【风险】Seahava 化妆品生产方涉嫌 2 亿 ₽「金融金字塔」", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "10-09", "summary": "俄调查机构称，化妆品品牌 Seahava 的生产方涉嫌以「金融金字塔」模式吸收资金约 2 亿 ₽，承诺年化 50%–150% 收益，相关责任人被查。含义：美妆赛道出现以招商/理财为名的资金盘风险，跨境供货与代理合作须同步做主体与资质背调。", "table": [["涉案金额", "约 2 亿 ₽"], ["模式", "金融金字塔"], ["承诺收益", "年化 50%–150%"]], "url": "https://www.kommersant.ru/doc/9009306", "sourceFull": "https://www.kommersant.ru/doc/9009306"}]}, {"icon": "🔌", "name": "电器", "items": [{"num": 18, "title": "【清洁小电】俄吸尘器市场 1–9 月 616 万台（+16.5%）、617 亿 ₽（+4.5%）：量增价跌", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-06", "summary": "2026 年 1–9 月俄吸尘器销量 616 万台（同比 +16.5%），销售额仅 617 亿 ₽（+4.5%），呈「量增价跌」结构；机器人与无线立式为高值赛道，Dreame 份额居前。含义：清洁小电需求旺盛但价格竞争激烈，卖家应以差异化型号与套装提升客单，而非单纯降价冲量。", "table": [["1–9 月销量", "616 万台（+16.5%）"], ["1–9 月金额", "617 亿 ₽（+4.5%）"], ["结构", "量增价跌 / 机器人与无线立式为高值"]], "url": "https://www.retail.ru/news/naturalnye-prodazhi-pylesosov-vyrosli-s-nachala-goda-na-16-5-4-oktyabrya-2026-282888/", "sourceFull": "https://www.retail.ru/news/naturalnye-prodazhi-pylesosov-vyrosli-s-nachala-goda-na-16-5-4-oktyabrya-2026-282888/"}, {"num": 19, "title": "【消费电子】«М.Видео»：俄平板电脑 9 个月达 434 亿 ₽，「量减价增」、均价升至 2.03 万 ₽", "tag": "local", "tagText": "本地", "source": "Retail.ru（М.Видео）", "time": "10-08", "summary": "据 «М.Видео»，2026 年 1–9 月俄平板电脑市场规模 434 亿 ₽，金额同比 +4.3%、销量约 -4%，均价升至约 2.03 万 ₽，呈「量减价增」；华为、苹果、小米居前。含义：平板需求向中高端集中，低价机型承压，选品与定价应向中高配置与配件生态倾斜。", "table": [["9 个月规模", "434 亿 ₽"], ["金额 / 销量", "+4.3% / −4%"], ["均价", "约 2.03 万 ₽"]], "url": "https://www.retail.ru/news/m-video-rynok-planshetov-v-rossii-vyros-do-43-4-mlrd-rubley-7-oktyabrya-2026-283050/", "sourceFull": "https://www.retail.ru/news/m-video-rynok-planshetov-v-rossii-vyros-do-43-4-mlrd-rubley-7-oktyabrya-2026-283050/"}, {"num": 20, "title": "【成本预警】8 月全球半导体销售额 1597 亿美元（同比 +144.3%）：元器件景气上行，家电/电子 BOM 成本承压", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "10-07", "summary": "8 月全球半导体销售额达 1,597 亿美元，同比 +144.3%，元器件进入高景气周期。含义：芯片与关键元器件价格/交期上行，将在 Q4–2027H1 传导至家电、消费电子与智能家居品类的 BOM 成本，卖家需提前锁定采购价与备货节奏。", "table": [["8 月全球半导体", "1597 亿美元"], ["同比", "+144.3%"], ["影响", "Q4–2027H1 BOM 成本上行"]], "url": "https://www.vedomosti.ru/technology/news/2026/10/06/1234719-prodazhi-mikroshem", "sourceFull": "https://www.vedomosti.ru/technology/news/2026/10/06/1234719-prodazhi-mikroshem"}]}, {"icon": "💡", "name": "灯具", "items": [{"num": 21, "title": "【行业日历】Interlight 2026（Smart City & Home by Interlight）10-27~30 莫斯科开展，「Яндекс」确认参展", "tag": "local", "tagText": "本地", "source": "Современная светотехника / lightingmedia.ru", "time": "10-07", "summary": "本周灯具照明行业无价格/合规类重大新增动态。行业日历方面：Smart City & Home by Interlight 2026 将于 10-27~30 在莫斯科 «Крокус Экспо» 举办，聚焦智慧城市/家居、楼宇自动化与数字照明；「Яндекс」确认参展智能家居板块，反映 IT 平台加速切入照明与智慧家居生态。含义：本月末展会是获取照明新品、技术路线与渠道资源的关键窗口，建议提前预约重点展商。核对信源：lightingmedia.ru、Retail.ru、RIA、ТАСС、Коммерсантъ、Ведомости、行业媒体（本周均未见灯具类目重大价格或合规变动）。", "table": [["展会", "Smart City & Home by Interlight 2026"], ["时间", "10-27 ~ 10-30"], ["地点", "莫斯科 Crocus Expo"], ["参展", "Яндекс（智能家居）"]], "url": "https://lightingmedia.ru/sobytiya/yandeks-na-vystavke-smart-city-home-by-interlight-2026/", "sourceFull": "https://lightingmedia.ru/sobytiya/yandeks-na-vystavke-smart-city-home-by-interlight-2026/"}]}, {"icon": "🚗", "name": "汽车（扩展）", "items": [{"num": 22, "title": "【新车】Автостат+ОЛА：9 月俄车市新增 26 款车型（21 款轻型车），创单月纪录", "tag": "local", "tagText": "本地", "source": "Российская газета / «За рулём» / Автостат", "time": "10-05", "summary": "Автостат 与联合租赁协会（ОЛА）统计，2026 年 9 月俄车市新增 26 款车型（21 款轻型车、1 款 LCV、2 款卡车、2 款客车），创单月新高（8 月为 16 款）。含 АвтоВАЗ 首款跨界车 Lada Azimut、国产 Tenet Plus L4/L6，以及多款中国品牌车型（含 Higer、Zhongtong 客车）。含义：新车型密集入市，汽配与车品卖家的适配 SKU 与备货应随新车型节奏更新。", "table": [["9 月新车型", "26 款（21 轻型车）"], ["环比", "8 月 16 款"], ["代表车型", "Lada Azimut / Tenet Plus L4、L6"]], "url": "https://rg.ru/2026/10/05/v-sentiabre-v-rossii-poiavilos-26-novyh-modelej-chto-eto-za-mashiny.html", "sourceFull": "https://rg.ru/2026/10/05/v-sentiabre-v-rossii-poiavilos-26-novyh-modelej-chto-eto-za-mashiny.html"}, {"num": 23, "title": "【品牌】Geely 停止对俄官方进口 Monjaro/Atlas/Preface；年底将在俄首发电动掀背 EX2", "tag": "local", "tagText": "本地", "source": "Lenta.ru", "time": "10-08", "summary": "Geely 停止对俄官方进口 Monjaro、Atlas、Preface 三款车型（经销商清库），保留 Cityray、Coolray、Okavango；计划年底在俄首发电动掀背 EX2（中国起售价 69,800 元，约合 88.9 万 ₽），并于 2027 年推出燃油/混动新车。含义：中国品牌在俄车型结构加速调整，汽配与周边品类的适配清单与库存需同步更新。", "table": [["停进口", "Monjaro / Atlas / Preface"], ["保留", "Cityray / Coolray / Okavango"], ["新车", "EX2（年底首发）"]], "url": "https://lenta.ru/news/2026/10/08/kitayskiy-brend-geely-prekratil-postavki-treh-modeley-v-rossiyu/", "sourceFull": "https://lenta.ru/news/2026/10/08/kitayskiy-brend-geely-prekratil-postavki-treh-modeley-v-rossiyu/"}]}], "keyData": {"headers": ["指标", "周初（10-05/06）", "周末（10-08/09）", "趋势"], "rows": [["央行美元汇率", "84.9309 ₽（10-06）", "85.4811 ₽（10-08）", "卢布贬值约 0.6%，市场美元 10-06 破 85（9-10 以来首次）、官方 10-07 一度 85.71"], ["央行人民币汇率（每 10 元）", "12.6491 ₽（10-06）", "12.7516 ₽（10-08）", "人民币兑卢布走强约 0.8%"], ["Brent 原油", "$103（10-05 破）", "$102（10-07）", "高位宽幅震荡；EIA 上调 2026 均价至 $96.3、Q4 看 $105"], ["周通胀（9-29~10-05）", "—", "0.96%", "年内累计逼近 6%，ЖКХ 调价贡献约 0.75 п.п."], ["关键利率（合意区间）", "14%（9-11 维持）", "10.5–12.5%（央行副行长表态）", "Греф 称央行已开启降息周期"], ["IMOEX 指数", "2321.57（10-05）", "重回 2300（10-08）", "10-07 一度破 2350（9-15 以来首次）后回落"], ["国家福利基金（9 月）", "—", "−2100 亿 ₽", "缩水，政府筹备「低油价时期」预案"], ["Ozon 货损保险费率", "0.0115%/天", "0.0838%/天（10-05 起）", "年化成本 4.2% → 30.6%"], ["Ozon FMCG 线上（上半年）", "—", "4405 亿 ₽（+44%）", "俄 FMCG 线上第一"], ["吸尘器市场（1–9 月）", "—", "616 万台 / 617 亿 ₽", "量增价跌（+16.5% / +4.5%）"], ["平板电脑（1–9 月）", "—", "434 亿 ₽（+4.3%）", "量减价增、均价约 2.03 万 ₽"], ["平台仓库遇袭专题", "WB/Russ 22 城、Ozon 12 城", "不变", "本周无新增平台仓遇袭（连续第 20~24 日）"]]}, "trends": [{"title": "平台规则与成本：一周内 Ozon/WB 集中调整费率与罚则，履约成本「有升有降」", "text": "本周平台规则高度集中：Ozon 一侧货损保险费率（0.0115%→0.0838%/天）、低价商品佣金（14%→17%、20%→23%）、FBS/realFBS 罚则与超时发货费（11-19）、FBO 入仓标签校验全面加严；Wildberries 一侧则下调 FBS 超时罚款并给出「13 小时发货降佣 5 个百分点」的正向激励。方向已从「合规即货架」转入「成本与时效精算」：卖家需按品类毛利、周转与发货能力，在 Ozon 与 WB 之间做结构化的成本再平衡。"}, {"title": "电商物流与站外流量：Ozon FMCG 登顶 + VK「шопсы」内容带货成为主通道", "text": "Infoline 显示 Ozon 以 4405 亿 ₽（+44%）成为俄 FMCG 线上第一，VK「шопсы」一年为 Ozon 带来 950 万单、日峰值 14 万单。站外内容分发正成为平台外溢流量的主要入口，配合 Ozon 开放直送自提点（降佣 3 个百分点 + 免仓储至 11-30）、WB 移动自提点与 Детский мир 免费仓储等履约创新，「内容 + 履约密度」的复合竞争格局成型。"}, {"title": "宏观经济与汇率：卢布在购汇放量下走弱，降息周期预期升温", "text": "财政部将购汇/购金规模提高 5 倍以上，叠加地缘扰动，市场美元 10-06 破 85 ₽（9-10 以来首次），官方汇率连续数日维持约 85 ₽。通胀端周通胀 0.96%、年内逼近 6%，但央行副行长给出 10.5–12.5% 的合意利率区间、Сбер 总裁称降息周期已启——汇率走弱与利率下行预期并存，进口成本与资金成本走向分化，卖家应动态管理定价与换汇节奏。"}, {"title": "能源价格与运输成本：油价高位震荡，柴油/黑海不确定性延续", "text": "Brent 本周 103 → 102 美元高位震荡，EIA 上调 2026 均价至 96.3 美元（Q4 105）；ФНБ 9 月缩水 2100 亿 ₽。黑海油轮遇袭与制裁延续使海运与保险成本承压，粮食货运获铁路最高优先级进一步挤压其他货物运力。物流成本与运力不确定性仍是 Q4 大促的核心变量。"}, {"title": "消费市场与合规：平台内容质量与卖家主体透明度成为信任与转化关键", "text": "ВЦИОМ 调查显示 87% 平台买家信任商品描述、评分与带图评价，而 37% 买家不信任 ИП 卖家、54% 称卡片展示邮箱/ОГРН 可提升信任；ТАСС 民调称逾 70% 中小企业认可商品「诚信标识（маркировка）」制度。与此同时三季度俄零售商遭 DDoS 攻击激增 61%，Yandex 数据中心遇袭致服务中断。内容质量、主体透明度与系统安全共同构成信任门槛。"}, {"title": "电器与灯具：清洁小电「以价换量」、半导体涨价抬高 BOM；灯具本周无价格/合规新动态", "text": "吸尘器 1–9 月 616 万台（+16.5%）但金额仅 +4.5%，平板电脑「量减价增」、均价升至 2.03 万 ₽；8 月全球半导体销售 +144.3% 预示 Q4–2027H1 元器件成本上行。灯具照明本周无价格/合规类重大动态，行业焦点转向 10-27~30 的 Interlight 2026（Smart City & Home），Яндекс 参展智能家居板块。"}], "sourceStats": "本周周报共收录 23 条条目，信源全部为俄语本土媒体、行业媒体与官方机构：Lenta.ru、生意人报（Коммерсантъ）、商业日报（Ведомости）、零售网（Retail.ru）、俄新社（РИА Новости）、塔斯社（ТАСС）、国际文传电讯社（Интерфакс）、消息报（Известия）、«Автостат»/«Автостат Инфо»、Ferta.su（平台规则监测）、Российская газета / «За рулём»、«М.Видео»、Infoline、以及 Роспотребнадзор、ФНС、央行（ЦБ）、Минпромторг 等官方与机构口径；VK、Авито、PIM Solutions 等平台数据经俄本土媒体转述后收录，按转述链计入本地信源。本地信源 23 条 ＝ 100%（≥60% 达标）；中文信源 0 条、英文直采 0 条；vc.ru 与 lightingmedia.ru（«Современная светотехника»）为补充抓取的俄语行业信源。", "meta": ["报告编号：RU-WEEKLY-2026-W41", "覆盖周期：2026-10-05（周一）~ 10-09（周五），第 41 周", "收录条目：23 条（电商 8、时政 3、经济 3、美妆 3、电器 3、灯具 1、汽车（扩展）2）", "数据来源：本地日报 5 期（10-05 共 22 条、10-06 共 16 条、10-07 共 24 条、10-08 共 18 条、10-09 共 23 条，窗口 10-05~10-09 无空窗）；灯具栏目本周日报均报「无新增」，经补充抓取 lightingmedia.ru / «Современная светотехника» 复核，仅 Interlight 展会一条在窗口内，如实收录并注明；汽车（扩展）为本期新增板块，信源为 Автостат/ОЛА 与 Lenta.ru。", "去重：周报条目与本周日报同源内容按周视角归并改写，不重复计数；URL 逐一经 state.db articles 表核对，已入库者沿用既有 report_date（2026-10-05~10-09），仅窗口内新增条目（lightingmedia Interlight、rg.ru 9 月新车型）执行 INSERT OR IGNORE。", "入库：周报条目写入 state.db articles 表（category 与日报同口径：平台规则/电商/时政/经济/美妆/电器/其它，汽车条目归入「汽车」），入库后按 attempted / count 对账。", "仓库遇袭专题：本周 10-05~10-09 五期日报均报「无新增平台仓库遇袭事件」（连续第 20~24 日）；累计口径不变（Wildberries / Russ 22 城、Ozon 12 城，最近一处仍为 09-15 塔甘罗格）；warehouse_attacks.json 的 events / totals 不变。", "汇率（ЦБ РФ 官方）：美元 84.9309（10-06）→ 85.4811（10-08），10-07 一度 85.7116；人民币 12.6491 → 12.7516（每 10 元）。", "重点提示：① Ozon 货损保险费率与低价佣金同周上调，成本压力集中在低价/时尚类目；② Wildberries 反向下调 FBS 罚款并给出履约激励，平台间费率分化，可择优分配库存；③ 卢布走弱 + 降息预期并存，进口成本与资金成本走向分化；④ 灯具本周无重大动态，关注 10-27~30 Interlight 展会窗口。"]}
