政", "items": [{"num": 11, "title": "无人机袭击周：莫斯科8/18凌晨约620架来袭（两年最大规模），莫斯科州整夜拦截197架；8/21再报新袭击企图", "tag": "local", "tagText": "本地", "source": "TASS、Interfax、RIA、Lenta", "time": "08-18~08-21", "summary": "索比亚宁通报 8/18 凌晨向莫斯科方向飞来约 620 架无人机（历次最大规模之一），防空击落 86 架；莫斯科州整夜拦截 197 架、3 人受伤，WB 波戈罗茨克仓库被击中。谢列梅捷沃、伏努科沃、多莫杰多沃、茹科夫斯基等多座机场一度暂停起降，8/19-20 奔萨/萨拉托夫/伏尔加格勒机场夜间临时关闭；8/21 索比亚宁再通报乌军新一轮袭莫斯科企图（Lenta 标题级）。同期俄对乌发动新一轮打击。航空与仓储物流扰动全周延续。", "sourceFull": "tass.ru/proisshestviya/28020525；ria.ru/20260818/bpla-2111495365.html；interfax.ru/russia/1110209；lenta.ru/news/2026/08/21/sobyanin-soobschil-o-novoy-popytke-vsu-atakovat-moskvu/"}, {"num": 12, "title": "9月选举冲刺：候选人登记收官、\"亚博卢\"出局、32地区首次电子计票、境外投票挑衅预警升级", "tag": "local", "tagText": "本地", "source": "TASS、Kommersant、RIA、Lenta", "time": "08-17~08-21", "summary": "中央选举委员会完成杜马选举候选人登记；最高法院维持取消\"亚博卢\"党参选资格；39 个地区议会选举登记结束；中选委批准 32 个地区首次电子化编制与传送计票结果。俄驻德使馆与外交部连续预警 9/20 前后境外投票站或遭挑衅、出现虚假出口民调；8/21 俄共杜马候选人邦达连科被拘留，КПРФ 作出回应（Lenta 标题级）。选举季安保与舆论管控同步升级。", "sourceFull": "tass.ru/politika/28017243；kommersant.ru/doc/8891568；kommersant.ru/doc/8893225；ria.ru/20260821/moskva-2112166413.html"}, {"num": 13, "title": "俄缅签署《反对单边强制措施宣言》及10份合作文件", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-18 19:00", "summary": "拉夫罗夫与缅外长签署反制裁宣言，双方另签能源、卫星通信等领域 10 份联合文件；普京与缅甸领导人会谈超 3 小时，缅方邀请俄投资者赴缅并看好俄 LNG 对缅出口前景。俄\"反制裁朋友圈\"再扩容，出口市场与结算渠道多元化持续推进。", "sourceFull": "ria.ru/20260818/sanktsii-2111657255.html"}, {"num": 14, "title": "瑞士跟进欧盟第20轮对俄制裁：禁止LNG油轮服务等", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-19 21:39", "summary": "瑞士政府宣布采纳欧盟第 20 轮制裁框架下的对俄措施：禁止为俄液化天然气油轮、破冰船及 LNG 接收终端提供服务，并禁止向俄出售油轮及经第三国转售；同日 RIA 报道瑞士首次拒绝俄公民入境就医。制裁网络向俄能源海运服务链延伸，LNG 出口物流成本与船队获取难度上升。", "sourceFull": "lenta.ru/news/2026/08/19/shveytsariya-vvela-novye-sanktsii-protiv-rossii/"}, {"num": 15, "title": "\"北溪\"案进展：克罗地亚逮捕德国通缉的乌克兰籍嫌疑人", "tag": "local", "tagText": "本地", "source": "Interfax、Kommersant", "time": "08-20 22:02", "summary": "克罗地亚在讯问后逮捕一名德国通缉的乌克兰公民，涉 2022 年\"北溪\"管道爆炸案；Kommersant 披露其为职业潜水员 Журавлев，此前曾两度逃脱对德引渡。案件调查持续指向乌方人员，俄欧能源基础设施旧案重回舆论场。", "sourceFull": "interfax.ru/world/1110394；kommersant.ru/doc/8893834"}, {"num": 16, "title": "涅边贾在安理会表态\"俄罗斯不需要动员\"", "tag": "local", "tagText": "本地", "source": "RIA、TASS", "time": "08-20 23:00", "summary": "俄常驻联合国代表涅边贾在安理会表示俄罗斯没有必要进行动员（TASS 同播）。该表态与前期 FT\"克里姆林宫招募 40.9 万合同兵\"报道形成直接对照——该待核实事项仍无俄媒佐证，本期以官方否认性表态记录在案。", "sourceFull": "ria.ru/20260820/nebenzya-2112160889.html；tass.ru/politika/28030455"}, {"num": 17, "title": "乌克兰对俄铝（Русал）集团实施制裁", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-21 00:09", "summary": "泽连斯基签署制裁令，对俄铝集团及多名关联人员实施限制，基辅将其与俄军工体系挂钩。俄铝中报刚披露上半年销量 -10%、靠铝价 +33.4% 扭亏，其亚洲市场收入占比已升至 58%，乌方制裁实际冲击有限，但增加第三国交易的合规噪音。", "sourceFull": "tass.ru/ekonomika/28030473"}, {"num": 18, "title": "反诈法案\"Антифрод 3.0\"修订：取消平台3年用户数据留存义务", "tag": "local", "tagText": "本地", "source": "RIA 引《消息报》", "time": "08-19 01:11", "summary": "Минцифры 已将反诈法案新修订版送部门间协调，删除网站/信息系统/APP 所有者保存用户注册与授权数据（绑定手机号）3 年的义务，相关同意处理条款亦被移除。新规降低平台数据合规成本，对电商及 O2O 平台的数据留存与合规投入要求边际放松。", "sourceFull": "ria.ru/20260819/antifrod-2111694965.html"}, {"num": 19, "title": "千岛群岛摩擦：俄媒批评日本首相就普京视察反应过激", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-17 02:07", "summary": "Strategic Culture 刊文称日本首相高市早苗无权就普京视察千岛群岛抗议，指东京持续篡改历史事实；此前日本政府表示正酝酿反制措施。日俄围绕南千岛群岛摩擦持续，对俄远东开发外资节奏的影响需跟踪，对中俄贸易直接冲击有限。", "sourceFull": "ria.ru/20260817/putin-2111261040.html"}]}, {"icon": "📊", "name": "经济", "items": [{"num": 20, "title": "Brent全周三级跳：破91（8/17）→破92（8/19）→盘中破93.5、峰值94.71（8/20），创逾三周新高", "tag": "local", "tagText": "本地", "source": "RIA、TASS、Lenta", "time": "08-17~08-20", "summary": "油价受美伊对峙升级与霍尔木兹风险溢价推动全周上行：8/17 自 7 月底以来首破 91 美元/桶（单日 +3%）；8/19 早间破 92；8/20 盘中破 93.5、峰值 94.71（+2.07%），驱动为特朗普威胁升级对伊\"经济绞杀\"并警告其贸易伙伴将面临\"巨大经济后果\"。油价高位支撑俄出口收入与预算，但推升进口成本与燃油内销压力。", "sourceFull": "ria.ru/20260817/neft-2111449372.html；tass.ru/ekonomika/28023955；lenta.ru/news/2026/08/20/tseny-na-neft-dostigli-maksimuma-na-fone-ugrozy-trampa-usilit-davlenie-na-iran/"}, {"num": 21, "title": "卢布汇率先贬后升：场外美元冲85.44（8/17）→官方85.13（8/20）→83.35破84关口（8/21）", "tag": "local", "tagText": "本地", "source": "Kommersant、Lenta", "time": "08-17~08-20", "summary": "8/17 场外美元升至 85.44 卢布（3 月 19 日以来最高），人民币升至 12.69 卢布/CNY（2025 年 2 月以来最高）；随后央行官方汇率 8/20 小幅下调至 85.13，8/21 单日再下调 1.78 卢布至 83.35，跌破 84 关口，两日累计回调近 2 卢布。卢布在 84-85 区间高位拉锯：贬值端推升进口成本，升值端挤压出口商利润，汇率双向波动加剧卖家定价与锁价难度。", "sourceFull": "kommersant.ru/doc/8891541；lenta.ru/news/2026/08/20/bank-rossii-ponizil-kursy-dollara-i-evro/；kommersant.ru/doc/8894035"}, {"num": 22, "title": "莫交所指数剧震：8/17盘中跌破2100（7/24以来首次），8/18反弹+2.5%收2148.13", "tag": "local", "tagText": "本地", "source": "RIA、Kommersant", "time": "08-17~08-19", "summary": "8/17 莫交所指数（iMOEX2）盘中跌至 2094.64 点（-1.95%），为 7 月 24 日以来首次破 2100；8/18 开盘重回 2100 上方，当日收涨 2.5% 至 2148.13，银行股领涨、\"Самолет\"单日大涨 9%（成交超 90 亿卢布）。市场仍由投机资金主导，风险偏好修复但波动率居高不下。", "sourceFull": "ria.ru/20260817/mosbirzha-2111277664.html；kommersant.ru/doc/8892389"}, {"num": 23, "title": "数字卢布9/1全面商用倒计时：12家大行就绪→130+银行接入→跨境结算探讨→航司购票场景落地", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-18~08-21", "summary": "央行支付系统司司长巴金娜通报：全部 12 家系统重要性银行（覆盖 80%+ 支付市场）9/1 起可为客户开通数字卢布账户；超 130 家银行（含中小银行）正在接入平台；央行正与多国探讨数字卢布跨境结算（前提为对方拥有 CBDC 平台）；Red Wings、S7、Smartavia 确认将支持数字卢布购票。叠加 WB/Ozon 9/1 上线（电商[5]），数字卢布从\"大行试点\"转向\"全行业+多场景\"铺开，零售支付基础设施换代加速。", "sourceFull": "ria.ru/20260818/rubl-2111686425.html；ria.ru/20260820/banki-2112158074.html；ria.ru/20260820/tsb-2111953598.html；ria.ru/20260820/aviakompanija-2112162949.html"}, {"num": 24, "title": "加密金融共振：莫交所9月推BTC/ETH永续期货；比特币破7.5万→7.7万美元，空头清算超16亿", "tag": "local", "tagText": "本地", "source": "Interfax、RIA、Kommersant", "time": "08-17~08-21", "summary": "莫交所宣布 9 月推出比特币与以太坊永续期货合约，俄加密衍生品市场加速成型。8/19 晚间比特币单日 +10% 引发超 16 亿美元空头平仓（创纪录），8/21 晨突破 7.5 万美元（5/27 以来首次），周五盘中进一步突破 7.7 万美元（5/26 以来首次，RIA 标题级）；Kommersant 提示投资者在监管预期下获利了结、涨势或难持续。合规化与币价上行共振。", "sourceFull": "interfax.ru/russia/1109637；ria.ru/20260821/bitkoin-2112176206.html；ria.ru/20260821/bitkoin-2112223523.html"}, {"num": 25, "title": "通胀降温：8/11-17周度通缩-0.02%、年内+4.67%；居民通胀预期降至13.7%", "tag": "local", "tagText": "本地", "source": "RIA 据Росстат、Kommersant", "time": "08-19~08-20", "summary": "Росстат：8/11-17 周度 CPI 99.98%（连续第二周通缩），8 月以来 -0.08%，年初以来 +4.67%；通缩由果蔬（-2.1%）与黑海旅游线路拉动，汽油周涨 0.5%、智能手机 +1%。央行 инФОМ 调查：8 月居民一年期通胀预期从 14.7% 降至 13.7%，观测通胀从 15.1% 降至 14.3%，零售业三月价格预期从 11.8% 降至 10.6%；但调查期未完全反映燃油第二轮紧张，10 月还有公用事业费调涨。", "sourceFull": "ria.ru/20260819/defljatsija-2111908026.html；kommersant.ru/doc/8893267"}, {"num": 26, "title": "利率路径博弈：现14%，9月有降息空间、10/23或暂停降息；7月居民现金贷款4870亿卢布创纪录", "tag": "local", "tagText": "本地", "source": "Lenta 引Gazeta.ru、Kommersant", "time": "08-20~08-21", "summary": "Garda Capital 专家 Селезнев 预测：央行大概率在 10/23 会议暂停降息，9 月会议前将参考 8 月通胀数据，若燃油危机缓解则有降息空间；三大变数为通胀预期、燃油价格、预算赤字（10 月将向杜马提交三年预算）。另：7 月居民现金贷款创纪录达 4870.4 亿卢布。利率走向直接决定电商消费贷与卖家融资成本。", "sourceFull": "lenta.ru/news/2026/08/21/v-rossii-dali-prognoz-po-klyuchevoy-stavke-na-osen/；kommersant.ru/doc/8893267"}, {"num": 27, "title": "燃料危机升级：9月短缺预警→芳烃出口禁令讨论→俄开始进口燃料，诺瓦克称\"第二阶段\"紧张", "tag": "local", "tagText": "本地", "source": "Kommersant、RIA", "time": "08-17~08-19", "summary": "消息人士预警 9 月大型炼厂检修叠加白俄供应骤降（8 月铁路出货仅 2.1 万吨 vs 前段 16.5 万吨）或再致燃料短缺；政府经济委员会讨论禁止芳烃（苯、苯酚、甲苯、二甲苯）出口（未达成一致）；8/19 诺瓦克确认俄已开始从其他国家进口燃料，称燃油市场处于\"第二阶段\"紧张，政府每日监控调度，部分炼厂将于近期复产；8/10-17 一周汽油价格在 25 个地区下降（图瓦 -3.46% 居首）。燃油供给紧张直接影响物流运输成本与偏远地区履约。", "sourceFull": "kommersant.ru/doc/8890827；kommersant.ru/doc/8891588；ria.ru/20260819/toplivo-2111899835.html；ria.ru/20260819/benzin-2111908484.html"}, {"num": 28, "title": "全球石油贸易重构：俄油运费大涨（黑海-西印度+43.5%）；伊朗称石油出口\"几乎停止\"；阿联酋暂停与伊贸易；KTK终端附近油轮遇袭", "tag": "local", "tagText": "本地", "source": "Kommersant、RIA、Interfax", "time": "08-17~08-19", "summary": "ЦЦИ 数据：8/10-14 黑海新罗西斯克至西印度航线运费 +43.5% 至 22.3 美元/桶、至华北 +22.7% 至 24.7 美元；伊朗央行行长称\"当前条件下石油出口几乎已经停止\"；阿联酋暂停与伊朗全部贸易金融往来；希腊旗油轮 8/16 在 KTK 新罗西斯克终端附近黑海水域遭袭。Vortexa 指伊俄沙美合计海运出口降至约 1200 万桶/日（较 7 月 -500 万）。运费上涨侵蚀俄油出口净回值，地缘溢价逻辑面临重估。", "sourceFull": "kommersant.ru/doc/8893157；ria.ru/20260819/iran-2111935947.html；ria.ru/20260818/oae-2111689809.html；ria.ru/20260817/bloomberg-2111451434.html"}, {"num": 29, "title": "储备与资产配置：国际储备7556亿美元（周+156亿）；央行7月减持黄金20万盎司；私人持金超10.8吨；俄持美债降至2700万美元", "tag": "local", "tagText": "本地", "source": "Kommersant、TASS、RIA", "time": "08-17~08-21", "summary": "截至 8/14 俄国际储备 7556 亿美元，单周 +156 亿；截至 8/1 货币黄金储备降至 7320 万盎司（7 月 -20 万），为 2020 年 1 月以来最低，储备资产结构向外汇资产回摆。民间端，私人投资者黄金持有量超 10.8 吨，避险配置持续升温；6 月俄持有美债降至 2700 万美元、连续第二个月减持，俄美金融脱钩下敞口接近清零。", "sourceFull": "kommersant.ru/doc/8893935；kommersant.ru/doc/8894024；tass.ru/ekonomika/28017245；ria.ru/20260818/vlozhenija-2111463757.html"}, {"num": 30, "title": "俄欧贸易上半年-13%至269亿欧元（1999年以来最低），药品成最大输俄品类（+21%至57亿）", "tag": "local", "tagText": "本地", "source": "Kommersant 据Eurostat", "time": "08-20 02:06", "summary": "\"Ъ\"据 Eurostat 测算：2026 上半年俄欧贸易额同比 -13% 至 269 亿欧元，为 1999 年上半年以来最低；俄对欧出口 122 亿（天然气 74 亿居首、石油腰斩至 13 亿），欧对俄出口 148 亿，欧盟连续第二个半年对俄顺差（+26 亿）。未受制裁的药品成最大输俄品类（+21% 至 57 亿欧元）。俄欧贸易萎缩倒逼进口替代与平行进口通道，对电商货源结构影响深远。", "sourceFull": "kommersant.ru/doc/8893245"}, {"num": 31, "title": "出口多元化全周密集：对印煤炭+2.9倍、对韩小麦创8年新高、对欧鱼类+1.7倍、欧盟葡萄酒+8%；对印钻石腰斩；大豆出口关税延至2028", "tag": "local", "tagText": "本地", "source": "Kommersant、RIA、TASS", "time": "08-15~08-21", "summary": "7 月俄对印煤炭出口 362 万吨（+2.9 倍）居各出口国增幅之首；7 月对韩小麦出口 1440 万美元创 2018 年 8 月以来新高；6 月对欧鱼类出口 7490 万欧元（+1.7 倍），俄美在欧盟鱼柳市场各占 8% 份额\"并驾齐驱\"；上半年欧盟对俄葡萄酒出口 +8% 至 2.397 亿欧元。负面项：上半年对印钻石出口近乎腰斩；泰国表达扩大进口俄油/LNG 意向；大豆出口关税（20% 且不低于 100 美元/吨）延长至 2028/8/31。", "sourceFull": "kommersant.ru/doc/8892187；ria.ru/20260817/rossija-2111385081.html；ria.ru/20260816/ryba-2111186382.html；kommersant.ru/doc/8893833"}, {"num": 32, "title": "地产链持续承压：7月新房销售-7.6%、优惠房贷发放量-50%；水泥产量+3.2%现企稳信号；长期分期拟立法规范", "tag": "local", "tagText": "本地", "source": "Kommersant、TASS", "time": "08-16~08-18", "summary": "7 月俄签订 4.15 万份新房合同（同比 -7.6%），莫斯科与克拉斯诺达尔均 -38%；ОКБ 数据优惠房贷发放量下降约 50%（标题级）。对冲信号：7 月水泥产量 640 万吨（+3.2%）为 2026 年以来首次正增长。Минстрой 与央行联合起草法案规范开发商长期分期（交房可过户、付清前抵押开发商）。住宅量价承压，地产后周期家居/家电/建材需求或继续走弱。", "sourceFull": "kommersant.ru/doc/8890082；tass.ru/nedvizhimost/28020379；kommersant.ru/doc/8891548；kommersant.ru/doc/8892351"}, {"num": 33, "title": "企业与行业：俄铝上半年销量-10%但净利4.19亿美元扭亏；雀巢5家俄子公司被请求引入临时管理（估值1600-1700亿卢布）；银行网点全年或关超2100家", "tag": "local", "tagText": "本地", "source": "Kommersant、RIA", "time": "08-17~08-20", "summary": "РУСАЛ 中报：铝销量 -10% 至 205 万吨，LME 铝价 +33.4% 带动营收 +10.9% 至 83.3 亿美元、净利 4.19 亿美元扭亏，亚洲收入占比升至 58%。\"КС Логистика\"致信普京请求对雀巢俄 5 家子公司引入临时管理，政府年底前评估。俄银行 2026 年或关闭超 2100 家网点（1-8 月已关 1370 家），信息安全支出预计 +10-15%。", "sourceFull": "kommersant.ru/doc/8893227；kommersant.ru/doc/8890807；ria.ru/20260817/bank-2111279644.html；kommersant.ru/doc/8894011"}, {"num": 34, "title": "消费与车市：失业率2.2%但薪资增速放缓；中俄品牌汽车租赁份额首次持平；上半年车贷+35-40%；7月新车贷利率回升至12%；香蕉零售价月降8%；47地区达成抑糖价协议", "tag": "local", "tagText": "本地", "source": "RIA、Kommersant、TASS", "time": "08-17~08-21", "summary": "6 月失业率 2.2%，劳动力市场稳定但 2026 年雇主加薪幅度首次低于预期，居民实际购买力修复趋缓。车市：前 7 个月中俄品牌在汽车租赁市场份额几乎持平；Sberbank/T-Bank 上半年车贷组合 +35-40%；7 月新车贷加权平均利率升至 12%（2025/11 以来首升）。民生价格：大型连锁香蕉一个月降价近 8%（110 卢布/公斤起）；ФАС 称 47 个地区同意签署抑制食糖价格协议，食品价格行政管控范围扩大。", "sourceFull": "ria.ru/20260817/pravitelstvo-2111364661.html；ria.ru/20260817/lizing-2111269510.html；kommersant.ru/doc/8894069；ria.ru/20260821/banany-2112165141.html；tass.ru/ekonomika/28027435"}, {"num": 35, "title": "宏观研判与政策：央行研究称潜在增速仅1.3-1.5%/年；普京主持战略发展委员会部署新投资周期；国企偿还中小企业欠款17.4亿卢布；欧洲天然气破800美元/千立方米", "tag": "local", "tagText": "本地", "source": "Kommersant、RIA", "time": "08-18~08-21", "summary": "央行研究团队评估俄经济潜在增速中位数约 1.3~1.5%/年，2.5% 上限需结构性改革支撑。8/19 战略发展委员会会议：结构转型 55 项措施完成 11 项，普京称提升投资活跃度是增长首要条件，消费品生产获政策倾斜信号明确。政府以\"手动模式\"推动国企清偿对中小企业欠款（已还申报债务 60%、17.4 亿卢布）。8/21 欧洲交易所天然气价格 +1.5% 突破 800 美元/千立方米（3/19 以来首次，补充抓取）。", "sourceFull": "kommersant.ru/doc/8892334；kommersant.ru/doc/8893265；kommersant.ru/doc/8891479；ria.ru/20260821/gaz-2112224086.html"}]}, {"icon": "💄", "name": "美妆", "items": [{"num": 36, "title": "俄疗愈泥在中国走红：РЭЦ称天然成分美妆需求持续增长", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-15 10:12", "summary": "РЭЦ 总经理尼基申娜在天津\"俄罗斯制造\"展销节表示，俄罗斯疗愈泥（грязь）在中国消费者中人气上升，含护肤泥类产品需求增长；展销节同期设直播带货工作室。俄天然成分美妆/护肤产品对华出口机会扩大，俄美妆品牌可借\"天然/疗愈\"定位拓展中国市场，也为反向选品（对俄出口同类定位产品）提供参照。", "sourceFull": "ria.ru/20260815/rossija-2111048026.html"}, {"num": 37, "title": "上半年俄自欧盟进口化妆品及护肤品2.36亿欧元（-4%），通道仍存", "tag": "local", "tagText": "本地", "source": "Kommersant 据Eurostat", "time": "08-20 02:06", "summary": "Kommersant 对 Eurostat 俄欧贸易数据的分析显示：2026 上半年俄罗斯仍从欧盟进口化妆品及各类护肤品 2.36 亿欧元，同比 -4%，属俄自欧进口的主要品类之一（最大品类为未受制裁药品 57 亿欧元，+21%）。欧洲美妆输俄规模温和收缩但通道仍存，与本土品牌替代及平行进口形成持续竞争，跨境美妆卖家的欧洲货源成本与合规路径需持续跟踪。", "sourceFull": "kommersant.ru/doc/8893245"}]}, {"icon": "🔌", "name": "电器", "items": [{"num": 38, "title": "俄大型电子产品供应商被曝借税务抵扣骗局获利约10亿卢布", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-16 17:25", "summary": "Lenta 报道：俄大型电子产品供应商通过税务抵扣（налоговые вычеты）骗局牟利约 10 亿卢布，涉虚报抵扣申报（标题级收录，正文细节因站点访问限制未能全文核实）。电子品类供应链税务合规风险曝光，跨境卖家与本土渠道商需关注税务申报规范性，避免因上下游违规被牵连稽查。", "sourceFull": "lenta.ru/news/2026/08/16/nalogi-vychety/"}, {"num": 39, "title": "周度家电价格：吸尘器-0.1%、电视持平、智能手机+1%", "tag": "local", "tagText": "本地", "source": "RIA 据Росстат", "time": "08-19 19:03", "summary": "Росстат 8/11-17 周度物价：非食品类中吸尘器降价 0.1%、电视机价格持平、智能手机上涨 1%；新车中国产品牌价格不变、进口车 +0.2%。电器品类价格整体平稳，智能手机涨幅居前；叠加卢布本周先贬后升的双向波动，3C 品类进口成本与终端定价的传导节奏需密切跟踪。", "sourceFull": "ria.ru/20260819/defljatsija-2111908026.html"}, {"num": 40, "title": "复古音频回潮：上半年便携音乐播放器销量同比+40%（М.Видео口径）", "tag": "local", "tagText": "本地", "source": "RIA 引М.Видео", "time": "08-19 09:09", "summary": "М.Видео 向 RIA 披露：上半年便携音乐播放器销量同比增长近 40%，复古音频消费回潮。3C 细分品类再现结构性增长，与本周毛皮配件热销、智能手机周涨价并列为非必需消费回暖信号，卖家可关注复古/情怀向音频产品的选品机会。", "sourceFull": "ria.ru/20260819/pleer-2111723637.html"}]}, {"icon": "💡", "name": "灯具", "items": [{"num": 41, "title": "本周无新增重大动态（灯具栏目连续第二周静默）", "tag": "local", "tagText": "标注", "source": "综合检索", "time": "08-15~08-21", "summary": "本周五期日报（08-17~08-21）及周五下午补充检索（RIA/Lenta 含 светильник/освещение/LED/лампы 关键词）均未见俄罗斯灯具照明市场新增重大新闻，灯具栏目连续第二周静默，按去重规则如实标注，不填充旧信息。可关注的间接变量：卢布双向波动对进口灯具成本的影响（经济[21]）、地产后周期需求走弱（经济[32]）、数字卢布上线对平台结算的改变（电商[5]）。", "sourceFull": ""}]}, {"icon": B 仓储遇袭的\"常态化-制度化\"演进——从 8/16 波多利斯克、8/18 波戈罗茨克单点遇袭，到 МИД 定性\"协调性系列袭击\"（三地枢纽），再到损失外溢至 100+ 生产企业、圣彼得堡市政府启动专项贷款兜底，履约安全风险已被官方确认为系统性威胁并在地方层面形成制度化救助安排；АКИТ 的 10 项措施（税务/金融/行政/保险）若落地，将把救助从地方试点推向联邦层面。叠加 8/18 互联网大面积故障与全周多座机场临时管制，电商履约的\"基础设施风险溢价\"正在常态化定价，卖家应将仓库分散、库存保险、多节点服务商冗余纳入常规运营成本。8/21 索比亚宁再报新袭击企图，下周仓储安全仍是第一变量。"}, {"title": "平台政策", "text": "监管呈现\"一松一紧\"双向：紧的一面是 Rospotrebnadzor 累计封锁 3.4 万个违禁 БАД 网站、健康品类合规持续加压；松的一面是\"Антифрод 3.0\"修订取消平台 3 年用户数据留存义务、Yandex 开放无网站卖家交易通道，降低中小卖家合规与触网门槛。渠道格局上，购物中心\"1/10 关闭或转型\"预警与 Alice AI 购物、数字卢布支付（WB/Ozon 9/1 上线）共同指向：流量与支付入口正在从\"平台货架\"向\"AI 对话+央行数字货币\"迁移，卖家需要同步评估 AI 搜索曝光与数字卢布回款两条新链路。"}, {"title": "经济数据", "text": "宏观组合全周围绕\"通胀降温 vs 燃油紧张\"展开——周度连续第二周通缩（-0.02%）、通胀预期降至 13.7%、年内通胀 4.67% 低于往年，为央行降息打开空间（9 月有窗口、10/23 或暂停，单一机构预测）；但燃油\"第二阶段\"紧张（开始进口、芳烃禁令讨论）与 10 月公用事业费调涨构成反向压力。央行研究显示潜在增速仅 1.3-1.5%/年，叠加战略发展委员会\"新投资周期\"部署，政策天平正向\"保增长\"倾斜，消费品生产获明确政策倾斜信号。银行体系冷热不均：网点全年或关超 2100 家、信安支出 +10-15%、7 月现金贷款 4870 亿创纪录——居民加杠杆与渠道收缩并行。"}, {"title": "能源价格", "text": "Brent 全周 87.34→94.71 美元（+8.4%）三级跳，美伊\"经济绞杀\"升级（伊朗自称石油出口几乎停止、阿联酋断贸、特朗普威胁波及其贸易伙伴）是核心驱动；俄油出口\"以价补量\"延续但成本端恶化——黑海-西印度运费 +43.5%、瑞士制裁延伸至 LNG 海运服务链、KTK 终端附近油轮遇袭。欧洲天然气 8/21 破 800 美元/千立方米为 3 月以来首次，全球能源价格中枢整体上移。国内端燃料危机未解：9 月炼厂检修+白俄供应骤降的短缺预警仍在，进口燃料与出口禁令双管齐下，物流燃油成本下周仍是卖家定价的关键输入。"}, {"title": "消费市场", "text": "结构性信号分化——非必需消费现回暖亮点（毛皮化妆包 +8.5 倍、便携播放器 +40%、私人持金 10.8 吨、车贷 +35-40%），但基本盘偏弱：失业率 2.2% 背后薪资增速首次低于预期，新车贷利率回升至 12% 压缩\"以价换量\"空间，地产链（新房 -7.6%、优惠房贷 -50%）拖累家居/家电/建材后周期需求。民生价格行政管控扩围（47 地区抑糖价、香蕉月降 8%）稳定底层购买力。美妆赛道：欧盟化妆品输俄 2.36 亿欧元（-4%）温和收缩，\"天然/疗愈\"定位对华出口走红提示双向选品机会；电器赛道警惕供应链税务合规风险（10 亿卢布抵扣骗局）。"}], "sourceStats": "40 条收录条目全部来自俄语媒体（RIA / TASS / Kommersant / Interfax / Lenta；RIA 引 Eurostat/Росстат/Bloomberg/М.Видео/АКОРТ、TASS 引 Vedomosti、Lenta 引《消息报》/Gazeta.ru 等按本地媒体计）；灯具\"无新增\"标注与待核实事件汇总不计入信源统计。本地信源占比 100% ≥ 60% 达标。", "meta": ["报告编号：RU-WEEKLY-2026-W34", "覆盖周期：2026-08-17（周一）~ 08-21（周五），第34周", "收录条目：42 条（电商 10 / 时政 9 / 经济 16 / 美妆 2 / 电器 3 / 灯具 1 条\"无新增\"标注 / 待核实汇总 1 条）", "数据来源：本地日报 5 期（08-17~08-21，窗口合计 08-15~08-21 无空窗）+ 周五下午补充抓取 5 条（R
