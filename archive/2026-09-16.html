{"date": "2026-09-16", "stats": {"total": 28, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "🚨仓库被炸：塔甘罗格（罗斯托夫州）Ozon 仓库遭导弹袭击受损，合作方配送枢纽疏散停工", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)/国际文传电讯社(Interfax)/数据报(Vedomosti)/生意人报(Kommersant)", "time": "09-15 08:50", "summary": "罗斯托夫州州长 Слюсарь 通报，塔甘罗格 9-15 凌晨遭大规模导弹袭击：Ozon 仓库、农业企业仓库、两栋多层与三栋私宅玻璃、教育机构、商业建筑、燃气管道与食品店受损，无人员伤亡；州防空夜击落 30 余架无人机与导弹。Ozon 澄清受损方为合作方配送枢纽（хаб），从未接收卖家供货，已疏散停工、在途货改配其他设施，买家订单照常派送；СК 以「恐怖袭击」立案，Ozon 遇袭城市升至 12 个。", "table": [["日期", "2026-09-15"], ["地点", "罗斯托夫州塔甘罗格"], ["平台", "Ozon（合作方配送枢纽）"], ["伤亡", "无（全员疏散）"], ["防空拦截", "30 余架无人机与导弹"], ["Ozon 遇袭城市", "11 → 12"]], "sourceFull": "https://ria.ru/20260915/bpla-2117707075.html"}, {"num": 2, "title": "俄经济发展部拟定平台经济新规：禁止对俄卖家收取更高佣金，商品卡信息须上架前核验", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)/俄新社(RIA)", "time": "09-16 04:14", "summary": "俄经济发展部在规范性文件门户公布平台经济措施草案：平台运营方不得对俄法人、个体户及适用「专业收入税」的自然人，就同类服务设定高于对其他人设定的服务报酬；并须在商品卡上线前核验卡片信息及平台上可访问的商品卡信息。塔斯社称若获通过将自 2027-03-01 生效，其标题强调「俄中与外籍卖家佣金或拉平」；零售媒体同步报道此为平台经济监管第二套措施。", "table": [["主管", "俄经济发展部"], ["关键条款", "禁止对俄卖家设定更高服务报酬"], ["附加义务", "商品卡信息上架前核验"], ["拟生效", "2027-03-01（如通过）"], ["配套", "平台经济法 10-01 生效"]], "sourceFull": "https://ria.ru/20260916/rossiya-2117914728.html"}, {"num": 3, "title": "副总理：2026 年电商占零售比重或由 20% 升至 25%，平台是主要推动者", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)", "time": "09-15 15:41", "summary": "副总理兼政府办公厅主任 Григоренко 在叶卡捷琳堡国际青年节讲座上表示，2026 年俄电子商务占商品流通总额的比重可能由当前 20% 升至 25%，其中平台（маркетплейс）起主要作用。他同时指出，数字平台正改变既有商业结构与中介环节，对政府亦构成严峻挑战。该口径与此前官方的「在线零售约 20%」一致，显示平台渠道份额仍在快速上行。", "table": [["当前电商占比", "20%"], ["2026 年预期", "25%"], ["表态人", "副总理 Григоренко"], ["主要载体", "平台/маркетплейс"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/09/15/1228982-rost-doli-onlain-torgovli"}, {"num": 4, "title": "夏季平台新增卖家同比减少约 27%：平台进入「高门槛」阶段", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)（引 Известия 与俄工商会）", "time": "09-15 09:13", "summary": "2026 年夏季俄平台新增卖家较去年同期减少 27%。俄工商会电商发展委员会主席 Федоров 称 9 月初平台约有 80 万卖家，联邦税务局估计为 85 万。下降主因是「易进易做」期结束——竞争加剧、物流与推广费用上升、平台算法调整。Wildberries 与 Ozon 均称未见新增卖家下滑：1-8 月 WB 新注册卖家同比多 12%，Ozon 称不预期买家规模高速增长。", "table": [["新增卖家", "-27%（夏季同比）"], ["卖家总数", "约 80 万（ТПП）/85 万（ФНС）"], ["WB 新注册", "+12%（1-8 月）"], ["主因", "竞争、物流与推广成本、算法调整"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/09/15/1228834-pritok-novih-prodavtsov"}, {"num": 5, "title": "Эксмо-АСТ：平台仓库遇袭已致 500 万册图书、约 4 亿卢布损失", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-15 23:55", "summary": "出版社 Эксмо-АСТ 总裁 Новиков 表示，因无人机袭击平台（маркетплейс）仓库，公司已损失 500 万册图书，金额约 4 亿卢布，计划在半年内补印缺货品种。该口径把此前行业层面的损失估算（图书业 1500 万册、约 60 亿卢布）落到单一头部出版社，显示平台仓库遇袭的库存损失正向出版-供货链条实质传导，也为高值/易损品类索赔提供参照。", "table": [["损失图书", "500 万册"], ["金额", "约 4 亿卢布"], ["补货计划", "半年内补印"], ["主体", "Эксмо-АСТ"]], "sourceFull": "https://www.kommersant.ru/doc/8955689"}, {"num": 6, "title": "Wildberries 否认「大规模冻结买家钱包」传闻", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-15 17:19", "summary": "针对社交网络上关于「Wildberries 大规模冻结客户钱包（кошелёк）」的传言，Wildberries & Russ（RWB）明确回应称该信息不属实。此前平台资金与结算环节已连续出现插曲（卖家回款延迟、WB 银行相关传闻），买家端资金功能传闻容易放大用户与卖家对平台资金安全的担忧，平台选择当日快速辟谣以稳定信心。", "table": [["主体", "Wildberries & Russ (RWB)"], ["平台回应", "信息不属实"], ["传闻内容", "大规模冻结买家钱包"], ["背景", "结算/资金安全关注度上升"]], "sourceFull": "https://www.kommersant.ru/doc/8955440"}, {"num": 7, "title": "Ozon 面向年轻用户推出「Лайкзон」模式", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-15 20:11", "summary": "Ozon 推出面向年轻受众的「Лайкзон」模式，可在移动 App 与移动网页版使用。平台以独立的界面与内容化推荐争取年轻用户的心智与停留时长，属于流量结构与用户分层运营的进一步细化。对卖家而言，年轻客群对应的选品、图文风格与价格带或出现新的曝光入口，值得在下一轮上新与投放中做对照测试。", "table": [["新功能", "«Лайкзон»"], ["可用端", "移动 App + 移动网页"], ["目标", "年轻受众"], ["形式", "内容化/独立界面"]], "sourceFull": "https://www.retail.ru/news/ozon-predstavil-rezhim-laykzon-dlya-molodoy-auditorii-15-sentyabrya-2026-282155/"}, {"num": 8, "title": "Сбер、Газпром、Яндекс 领跑 2026 俄百强品牌榜，零售与平台品牌稳居前十", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)/Retail.ru", "time": "09-15 09:20", "summary": "咨询公司 BrandLab 的 2026 俄百强品牌榜显示，Сбер、Газпром、Яндекс 位列前三，其中 Сбер 品牌价值一年增长 4.5% 至 2.35 万亿卢布。同期零售榜单显示 «Пятёрочка»、«Магнит» 与 Wildberries 保持在前十。平台与连锁零售品牌价值持续靠前，反映渠道集中度与用户心智仍在向头部平台与大连锁集中，中小品牌借平台流量获取增长的性价比相应下降。", "table": [["榜首", "Сбер"], ["Сбер 品牌价值", "2.35 万亿卢布（+4.5%）"], ["第 2/3", "Газпром/Яндекс"], ["零售前十", "Пятёрочка、Магнит、Wildberries"]], "sourceFull": "https://www.kommersant.ru/doc/8954899"}, {"num": 9, "title": "美众议院通过程序性决议，推进对俄「地狱制裁」法案（214:211）", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)/塔斯社(TASS)/RBC", "time": "09-16 01:25", "summary": "美国众议院以 214 票赞成、211 票反对通过对新对俄、对伊制裁法案的程序性决议，为全院表决铺路；两名民主党议员（Голден、Глюзенкамп Перес）倒戈支持。该案 8 月已在参议院以压倒多数通过，条款包括对俄能源五大买家征收 100% 关税、对俄输美全部商品征收 500% 关税。若最终成法，第三方买家与跨境结算的合规压力将进一步上升。", "table": [["表决", "214 票赞成 / 211 票反对"], ["下一步", "众议院全院表决"], ["核心条款", "5 大俄能源买家 100% 关税"], ["对俄输美", "全部商品 500% 关税"], ["参议院", "8 月已通过"]], "sourceFull": "https://ria.ru/20260916/sanktsii-2117916162.html"}, {"num": 10, "title": "欧盟新一轮对俄制裁磋商延长：成员国大使未达成一致", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-15 17:33", "summary": "欧盟成员国常驻代表未能就新一轮对俄制裁方案达成一致，决定延长磋商时间，方案通过时点待定。此前欧盟内部在制裁范围（能源、金融、涉第三国企业）与法律依据上分歧明显，加之部分成员国对对俄经济往来承压，导致本轮包件推进放缓。对俄贸易与跨境支付的合规节奏取决于最终条款，宜预留政策发布时间窗。", "table": [["状态", "磋商延长"], ["主体", "欧盟成员国大使"], ["待定", "方案通过时点与条款范围"]], "sourceFull": "https://www.kommersant.ru/doc/8955456"}, {"num": 11, "title": "泽连斯基签署命令解除乌克兰总检察长职务，反腐机构冲突升级", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)/Lenta.ru", "time": "09-15 22:07", "summary": "泽连斯基签署命令，解除乌克兰总检察长 Руслан Кравченко 的职务。此前 Кравченко 曾对乌克兰国家反腐败局（НАБУ）局长签署「怀疑书」（等同立案），НАБУ 将此举定性为对独立反腐机构的系统性攻击，随后其以出差名义出境。该内部冲突公开化，可能影响乌方与外部伙伴在援助监督、资金透明度方面的配合节奏。", "table": [["被解职者", "乌总检察长 Кравченко"], ["签署方", "泽连斯基（命令）"], ["冲突对象", "НАБУ"], ["性质", "反腐机构冲突公开化"]], "sourceFull": "https://www.kommersant.ru/doc/8955668"}, {"num": 12, "title": "欧盟外长卡拉斯不排除与普京对话", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-15 17:56", "summary": "欧盟外交与安全政策高级代表卡拉斯表示不排除与俄罗斯总统普京进行对话，同时强调任何接触都须以维护欧盟立场与对乌支持为前提。此前卡拉斯长期主张对俄强硬，此番表态被解读为欧盟在制裁与谈判之间保持双轨准备。对市场而言，若外交接触推进，能源与物流设施的袭击频次、以及制裁包推进节奏都可能出现边际变化。", "table": [["表态人", "欧盟高级代表卡拉斯"], ["内容", "不排除与普京对话"], ["前提", "维持对乌支持与欧盟立场"], ["性质", "双轨准备"]], "sourceFull": "https://www.kommersant.ru/doc/8955485"}, {"num": 13, "title": "俄外交部：认为有必要启动与美国的贸易前景讨论；克里姆林宫呼吁解除对所有石油供应国制裁", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-15 17:50", "summary": "俄外交部表示认为有必要启动与美国的贸易前景讨论；克里姆林宫发言人佩斯科夫同日呼吁确保安全的贸易航行，并主张解除对所有石油供应国的制裁以缓解全球燃料市场紧张，同时称保障炼厂安全运行不足以解决全球性问题。俄方在制裁与能源议题上的表态转向「贸易与航运」，为本国出口与航运通道争取更宽空间。", "table": [["表态方", "俄外交部"], ["内容", "启动与美贸易前景讨论"], ["佩斯科夫", "解除对所有石油供应国制裁"], ["另一主张", "确保安全贸易航行"]], "sourceFull": "https://ria.ru/20260915/mid-2117869622.html"}, {"num": 14, "title": "央行：燃油市场对通胀的贡献约 0.7–0.8 个百分点", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)/数据报(Vedomosti)", "time": "09-15 13:16", "summary": "俄央行评估称，燃油市场形势对通胀的贡献约 0.7–0.8 个百分点。该口径首次把燃油短缺与批发价格波动对物价的影响量化到接近 1 个百分点，意味着即便核心通胀回落，燃料—运输成本链条仍在托住整体物价。对消费类商家而言，干线运价与到仓成本的上行压力短期内难以消退，Q4 定价与促销预算须预留该项成本弹性。", "table": [["通胀贡献", "0.7–0.8 п.п."], ["数据方", "俄央行"], ["时点", "2026-09-15"], ["影响", "运价与到仓成本上行"]], "sourceFull": "https://www.kommersant.ru/doc/8955172"}, {"num": 15, "title": "政府将柴油出口禁令再延长至 10 月底", "tag": "local", "tagText": "本地", "source": "RBC（引 RBC 与《数据报》消息源）", "time": "09-15 22:47", "summary": "俄政府决定再次延长柴油出口禁令，本次延长至 10 月底，以保障国内供应。此前政府已多次延长该限制。此举与燃油市场局部短缺（圣彼得堡、列宁格勒州）以及央行对燃油通胀贡献的量化相互呼应，显示政策优先保内需。对物流侧而言，柴油外运受限将持续影响干线运价与跨区到仓时效，Q4 补货计划宜按更高运价与更长时效重排。", "table": [["措施", "延长柴油出口禁令"], ["新期限", "至 2026-10 月底"], ["目的", "保障国内供应"], ["累计", "已多次延长"]], "sourceFull": "https://www.rbc.ru/economics/15/09/2026/6aa99ffa414aa27a393f1d59"}, {"num": 16, "title": "央行：前 7 个月经常账户顺差增至 339 亿美元，同比增 1.6 倍", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-16 02:08", "summary": "俄央行数据显示，2026 年前 7 个月经常账户顺差增至 339 亿美元，同比增长 1.6 倍，出口因世界价格上涨而增长 16.3%。外需价格改善为卢布与财政提供缓冲，也部分抵消了制裁与支付限制的影响。对出口导向的商家而言，本币结算与贸易条件改善有利于回款效率，但同时也意味着国内高利率环境与内需偏弱的组合短期难以改变。", "table": [["经常账户顺差", "339 亿美元"], ["同比", "增长 1.6 倍"], ["出口", "+16.3%"], ["统计期", "2026 年 1–7 月"]], "sourceFull": "https://www.kommersant.ru/doc/8955667"}, {"num": 17, "title": "8 月俄日贸易额同比增 19.51%，日本对俄汽车供应增 18.7%", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)（引日本财务省）", "time": "09-16 02:53", "summary": "日本财务省数据显示，8 月俄日贸易额同比增长 19.51%，其中日本自俄进口增长 24%；日本对俄汽车供应增长 18.7%，汽车零配件供应增长 2.5%。同期日本自俄 LNG 进口下降 2.2%、煤炭进口下降 31.6%。汽车供应回升与日本在制裁框架下的「民生例外」口径有关，对俄汽车及配件渠道的替代格局构成边际影响。", "table": [["贸易额", "+19.51%（8 月）"], ["自俄进口", "+24%"], ["对俄汽车", "+18.7%"], ["自俄 LNG", "-2.2%"], ["自俄煤炭", "-31.6%"]], "sourceFull": "https://tass.ru/ekonomika/28115277"}, {"num": 18, "title": "中国 8 月工业增加值同比增 5.2%，制造业增 6.1%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-16 02:08", "summary": "中国 8 月规模以上工业增加值同比增长 5.2%，高于 7 月的 4.5%，也高于 Trading Economics 调查预期 4.8%；其中制造业增长 6.1%，采矿业下降 1.4%。中国作为俄最大贸易伙伴，其制造业景气度直接影响对俄供应链的供货节奏与价格，对灯具、电器、美妆等依赖中国供给的品类是先行指标，宜同步观察运价与交期变化。", "table": [["工业增加值", "+5.2%（同比）"], ["前置值", "7 月 +4.5%"], ["制造业", "+6.1%"], ["采矿业", "-1.4%"], ["市场预期", "+4.8%"]], "sourceFull": "https://www.kommersant.ru/doc/8955671"}, {"num": 19, "title": "俄租房价格自 2020 年以来首次下降：9 月同比降 1.7%", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "09-16 04:05", "summary": "塔斯社数据显示，2026 年 9 月俄一居室与两居室公寓平均租金同比均下降 1.7%，分别降至 3.11 万与 3.88 万卢布，为 2020 年以来首次下降。租金转跌反映居民实际收入承压与租赁需求走弱，与高存款利率下的储蓄倾向一致。对家电、灯具、家居类商家而言，租房市场的降温意味着「新居/搬家」场景带来的耐用品增量或继续偏弱。", "table": [["一居室租金", "3.11 万卢布（-1.7%）"], ["两居室租金", "3.88 万卢布（-1.7%）"], ["特征", "2020 年以来首次下降"], ["时点", "2026 年 9 月"]], "sourceFull": "https://tass.ru/nedvizhimost/28115355"}, {"num": 20, "title": "油价与燃料：Brent 最新可得报价 109.36 美元/桶，沙特「东西」管道修复需数周，专家预警或达 130 美元", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)/生意人报(Kommersant)/Lenta.ru", "time": "09-14 15:57", "summary": "窗口中最新可得报价为 Brent 11 月合约 109.36 美元/桶（09-14 涨 4.55%，当日最高 109.56）；此前一交易日盘中曾报 108.2 美元（+2.1%）。报道称遭袭的沙特「东西」输油管道恢复满负荷需数周。俄专家 Юшков 认为全球油市处于严重短缺边缘（战略储备降至 1982 年水平），油价最高或冲至 130 美元。高油价支撑俄预算与卢布，同时抬高全球运输成本。", "table": [["Brent（11 月合约）", "109.36 美元/桶（+4.55%）"], ["当日最高", "109.56 美元"], ["前一交易日盘中", "108.2 美元（+2.1%）"], ["沙特管道", "恢复满负荷需数周"], ["专家预测", "最高或达 130 美元"]], "sourceFull": "https://www.vedomosti.ru/investments/news/2026/09/14/1228670-tsena-na-brent"}, {"num": 21, "title": "俄 7 月重回欧盟第四大天然气供应国，1–7 月份额 17%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-15 14:11", "summary": "2026 年 7 月俄罗斯在欧盟天然气（管道+液化）供应中排名第四，份额 14.1%，当月供应金额 11 亿欧元；1–7 月累计份额 17%，落后于美国与挪威。俄气对欧份额虽已大幅低于战前，但仍稳定保有前四位置，欧洲气价高企（此前突破 1000 美元/千立方米）背景下，俄气对欧的边际供给意义与议价环境有所改善。", "table": [["7 月排名", "第 4 位"], ["7 月份额", "14.1%"], ["1–7 月份额", "17%"], ["7 月金额", "11 亿欧元"]], "sourceFull": "https://www.kommersant.ru/doc/8955188"}, {"num": 22, "title": "工贸部：全球南方占俄外贸 76.3%，上半年贸易额增 14.5%；机器人配送已交付百万单", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)（工贸部副部长 Чекушов 专访）", "time": "09-14 10:00", "summary": "工贸部副部长 Чекушов 表示，全球南方国家已占俄外贸 76.3% 且逐年上升，上半年对全球南方贸易额增长 14.5%、近三年增长 24.5%；未来增量将更多依靠自贸协定（已与印尼签署等）。他同时透露俄平台与连锁零售正加快引入机器人，机器人配送已累计交付 100 万单，从搬运机械臂到配送机器人均在铺开。", "table": [["全球南方占比", "76.3%"], ["上半年贸易额", "+14.5%"], ["近三年", "+24.5%"], ["机器人配送", "累计交付 100 万单"]], "sourceFull": "https://ria.ru/20260914/chekushov-2117089738.html"}, {"num": 23, "title": "韩国对俄化妆品出口前 8 个月增长 20.3%，达 2.877 亿美元", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)/生意人报(Kommersant)（引韩国海关）", "time": "09-15 08:07", "summary": "韩国海关数据显示，1–8 月韩国对俄出口 HS 3304 类化妆品与护肤品（含防晒、美甲护理等）2.877 亿美元，较去年同期 2.392 亿美元增长 20.3%，增量约 4850 万美元。增长主要来自「其他彩妆与护肤品」子类（精华、乳液、精华霜等），由 2.226 亿美元增至约 2.77 亿美元。韩妆持续放量，对本土品牌与平台店铺的价格带与选品结构构成直接竞争。", "table": [["出口额", "2.877 亿美元"], ["同比", "+20.3%"], ["增量", "约 4850 万美元"], ["主要子类", "其他彩妆护肤品（2.77 亿美元）"]], "sourceFull": "https://ria.ru/20260915/koreja-2117703441.html"}, {"num": 24, "title": "副总理：俄女性「到店试用、线上下单」，美妆购买决策进一步向线上迁移", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-15 13:51", "summary": "副总理 Григоренко 表示，俄女性消费者到美妆实体店主要目的是查看与试用产品，实际下单却在互联网完成。该判断与线上美妆渠道的持续增长、以及线下中型连锁收缩（The Act 关闭 4 家门店、Oomph 申请破产）互为印证。对美妆品牌而言，线下门店正更多承担「体验与种草」功能，线上商品卡、图文与测评内容的质量直接决定转化。", "table": [["表态人", "副总理 Григоренко"], ["消费者行为", "到店试用、线上下单"], ["含义", "线下转向体验、线上承接成交"], ["印证", "中型美妆连锁收缩"]], "sourceFull": "https://www.kommersant.ru/doc/8955176"}, {"num": 25, "title": "«Золотое яблоко»：新开斯塔夫罗波尔边疆区首店，同时就社媒比价帖发出诉前律师函", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)/Retail.ru", "time": "09-15 17:52", "summary": "美妆连锁 «Золотое яблоко» 在斯塔夫罗波尔边疆区开设首家门店，线下网络继续向区域城市扩张。同期公司就一名用户在 Threads 上发布的价格对比帖（先晒该店香水截图、后给出更低价的其他商店链接）发出诉前律师函，理由是该帖属「不正当广告」并损害品牌声誉；公司称此类以「反馈」为名的比价内容具有广告特征。", "table": [["新店", "斯塔夫罗波尔边疆区首店"], ["争议", "社媒比价帖诉前律师函"], ["企业口径", "属不正当广告、损害声誉"], ["平台面", "线下扩张 vs 线上比价压力"]], "sourceFull": "https://ria.ru/20260915/jabloko-2117870293.html"}, {"num": 26, "title": "阿维托调查：56% 俄居民计划半年内购买新智能手机，10% 拟首发购入最新款 iPhone", "tag": "local", "tagText": "本地", "source": "Retail.ru（引阿维托数据）", "time": "09-15 17:14", "summary": "阿维托调查显示，56% 的俄受访者计划在未来半年内购买新智能手机，其中每十人有一人（10%）表示准备在新款 iPhone 开售后立即购买。该数据指向四季度 3C 换机需求仍有基础，且高端机型需求集中在首发窗口。对店铺而言，9–12 月的换机周期与首发节点适合做价格带分层：用配件与保修服务承接中低价位需求，用首发货源承接高端需求。", "table": [["半年内计划购机", "56%"], ["拟首发买最新 iPhone", "10%"], ["数据方", "阿维托（调查）"], ["窗口", "未来 6 个月"]], "sourceFull": "https://www.retail.ru/news/56-rossiyan-planiruyut-kupit-novyy-smartfon-v-blizhayshie-polgoda-issledovanie-a-15-sentyabrya-2026-282147/"}, {"num": 27, "title": "工贸部与业界拟定微电子产业新战略：组件配额、包销合同与定向优惠", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-16 02:11", "summary": "俄工贸部与企业界正拟定微电子产业新发展战略，业界建议引入组件配额、包销（офтейк）合同与税收/采购优惠，以刺激对俄产微芯片的需求。该战略若落地，将影响俄产电子元器件（含家电与照明控制器所需芯片）的供给结构与价格，也为本地化组装、贴牌路径提供政策窗口。对采购依赖进口元器件的商家而言，宜同步跟踪本地替代方案的交期与认证要求。", "table": [["政策工具", "组件配额、包销合同、优惠"], ["目标", "刺激对俄产芯片需求"], ["牵头", "工贸部 + 业界"], ["关联", "家电/照明控制芯片供给"]], "sourceFull": "https://www.kommersant.ru/doc/8955669"}, {"num": 28, "title": "燃料短缺推升电动车与混动车需求", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)（引 Автостат）", "time": "09-15 10:42", "summary": "俄分析机构 Автостат 负责人 Целиков 指出，在燃油短缺背景下电动车（BEV）与混合动力车的占比正在上升。该趋势与燃油市场局部短缺、政府延长柴油出口禁令以及油价高企直接相关，也意味着汽车动力结构的选择正被燃料可得性而非单纯补贴推动。对汽配与充电相关品类（含车载电器、灯具）构成新的需求场景。", "table": [["驱动因素", "燃料短缺"], ["观察方", "Автостат（Целиков）"], ["趋势", "BEV 与混动占比上升"], ["关联", "柴油出口禁令延长、油价高企"]], "sourceFull": "https://www.vedomosti.ru/auto/news/2026/09/15/1228856-spros-na-elektrokari"}]}
