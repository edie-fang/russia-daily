{"date": "2026-09-29", "stats": {"total": 29, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "cat": "ecom", "catText": "电商动态", "title": "Ozon 开通现金付款：15,000 卢布以内订单可在银行 ATM 预缴", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-28 14:43", "summary": "Ozon 新增现金支付渠道，单笔上限 15,000 卢布：买家可在自提点取货前，于 Ozon 银行 ATM 完成现金存款支付。此举主要面向银行卡覆盖不足或偏好现金的客群，有望提升低线城市与中老年客群的下单转化，同时把货到付款环节的现金回笼纳入自有银行体系，降低外部收单成本与退货环节的现金纠纷。", "table": [["单笔金额上限", "15,000 卢布"], ["支付方式", "Ozon 银行 ATM 现金存款"], ["支付时点", "取货前（自提点）"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/09/28/1232408-ozon-nalichnie"}, {"num": 2, "cat": "ecom", "catText": "电商动态", "title": "Wildberries 全俄上线忠诚度计划「Мой WB」，积分即卢布、最高抵 99%", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-28 11:02", "summary": "Wildberries（RWB 集团）把忠诚度计划「Мой WB」从试点推向全俄买家：在 App/网站「个人中心」可查看等级、积分、任务与权益，积分 1 分 = 1 卢布折扣、单笔最高抵扣 99%，并打通 Еаптека、Рив Гош、WB Travel、WB 银行、WB Ресейл 等生态。对卖家而言这是新的复购与私域工具，但积分抵扣的成本分摊需提前核算。", "table": [["积分换算", "1 分 = 1 卢布折扣"], ["最高抵扣", "99%（单笔）"], ["打通生态", "Еаптека / Рив Гош / WB Travel / WB 银行 / Ресейл"]], "sourceFull": "https://www.retail.ru/news/wildberries-zapustil-programmu-loyalnosti-dlya-vsekh-pokupateley-v-rossii-28-sentyabrya-2026-282646/"}, {"num": 3, "cat": "ecom", "catText": "电商动态", "title": "政府一年内免除受袭受损企业的检查：9-28 起生效、效期至 2027-10-01", "tag": "local", "tagText": "本地", "source": "Ведомости / Коммерсантъ", "time": "09-28 09:23", "summary": "俄政府通过决议：2026-01-01 以后因无人机或其他火力打击受损的商业设施，自 9-28 起一年内不再进行计划性检查及部分计划外监管，效期至 2027-10-01。该措施把受损卖家的合规与迎检负担转为可预期的「静默期」，与税收缓缴、优惠贷款形成组合救助；卖家需保存受损证明以备免检登记与索赔证据链。", "table": [["生效日", "2026-09-28"], ["效期", "至 2027-10-01"], ["适用对象", "2026-01-01 后受损的商业设施"], ["豁免范围", "计划性检查 + 部分计划外监管"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/09/28/1232253-rossii-na-god-otmenili"}, {"num": 4, "cat": "ecom", "catText": "电商动态", "title": "Metro 俄罗斯资产被移交临时管理，接管方为 «УК Торг РУС»", "tag": "local", "tagText": "本地", "source": "Ведомости / Retail.ru", "time": "09-28 16:30", "summary": "普京签署命令，把 Metro 在俄业务资产移交临时管理，接管方为 АО «УК Торг РУС»。Metro 在俄运营约 90 余家门店并是 FMCG 批发供货的重要节点，此次与外资本地资产处置路线一致，延续 9-17 以来对 Auchan、Nestlé、Лемана Про、FM Logistic 的处理逻辑。对供应商意味着账期与采购主体可能变更，需核对合同相对方与结算路径。", "table": [["接管方", "АО «УК Торг РУС»"], ["资产", "Metro 在俄业务（含批发与门店）"], ["上半年营业额", "1,189 亿卢布（+0.5%，Infoline）"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/09/28/1232458-aktivi-metro"}, {"num": 5, "cat": "ecom", "catText": "电商动态", "title": "«Читай-город — Буквоед» 7-8 月营业额 57 亿卢布，创三年最强增长", "tag": "local", "tagText": "本地", "source": "Retail.ru / Ведомости", "time": "09-28 21:28", "summary": "图书连锁 «Читай-город — Буквоед» 7-8 月营业额同比 +10% 至 57 亿卢布，为近三年最高（2025 年同期 +2.7%、2024 年同期 -0.1%）。增长由图书驱动：线下 +15.5%、线上 +19%，合计 +16.4% 至 32 亿卢布；主因母公司 «Эксмо-АСТ» 自 2025 年起投入约 20 亿卢布做门店改造与新业态。但行业整体（约 700 家门店的 АСКР 口径）在金额与册数上仍下滑，属结构性分化。", "table": [["7-8 月营业额", "57 亿卢布（+10%）"], ["图书线下", "+15.5%"], ["图书线上", "+19%"], ["门店改造累计投入", "约 20 亿卢布"]], "sourceFull": "https://www.retail.ru/news/set-chitay-gorod-bukvoed-dobilas-rekordnogo-prirosta-tovarooborota-28-sentyabrya-2026-282680/"}, {"num": 6, "cat": "ecom", "catText": "电商动态", "title": "上半年 FMCG 零售 TOP10：X5 2.48 万亿、Магнит 1.89 万亿，Лента 增速 26.2% 最快", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-28 21:26", "summary": "Infoline 口径 2026 上半年俄罗斯 FMCG 零售商营业额排名：X5 24,805 亿卢布（+10.5%）、Магнит 18,872 亿（+12.8%）、Красное & Белое/Бристоль 8,780 亿（+11.2%）、Лента 6,485 亿（+26.2%，并购效应）、ВкусВилл 1,911 亿（+7.8%）、«Светофор» 1,890 亿（-4.5%）、Самокат 1,350 亿（+15.5%）、Ашан 1,270 亿（-2.5%）、Metro 1,189 亿（+0.5%）。存量博弈下，并购与折扣业态领跑，外资大卖场继续退坡。", "table": [["X5", "24,805 亿卢布 / +10.5%"], ["Магнит", "18,872 亿 / +12.8%"], ["Лента", "6,485 亿 / +26.2%"], ["Ашан", "1,270 亿 / -2.5%"], ["Metro", "1,189 亿 / +0.5%"]], "sourceFull": "https://www.kommersant.ru/doc/8988986"}, {"num": 7, "cat": "ecom", "catText": "电商动态", "title": "恶意电子供应商将被追溯核查：工贸部用 маркировка 追溯元器件来源", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-28 21:51", "summary": "在 «Микроэлектроника-2026» 全会上，工贸部长 Алиханов 宣布将通过 «Честный знак» 标记系统对电子产品供应商做额外核查：借助跨部门数据库核对生产所用材料/化学品的实际来源，识别「以国产名义进入国产产品名录、实际批量使用进口件」的供应商；第一副总理 Мантуров 称已启动对生产企业的多部门重复核查。电子、家电、灯具类目需补齐原产地与组件溯源资料。", "table": [["核查工具", "«Честный знак» 标记系统"], ["核查对象", "电子元器件与电子产品的来源"], ["配套", "多部门对生产企业重复核查"]], "sourceFull": "https://www.kommersant.ru/doc/8988998"}, {"num": 8, "cat": "ecom", "catText": "电商动态", "title": "酒精烟草监管局：线上售酒合法化不在当前议程", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-28 17:45", "summary": "Росалкогольтабакконтроль 表示，放开线上（含平台）酒类销售的问题目前未列入议程，短期内电商渠道仍不得销售酒精饮品。对平台与卖家意味着酒类相关品类的渠道空间不变，围绕酒类的「线上比价—线下自提」模式仍处灰色地带，相关营销素材与商品卡需继续规避违规表述。", "table": [["监管口径", "线上售酒合法化未上议程"], ["影响渠道", "电商平台 / 线上零售"], ["现状", "线上销售酒精仍被禁止"]], "sourceFull": "https://www.retail.ru/news/rosalkogoltabakkontrol-vopros-legalizatsii-onlayn-prodazh-alkogolya-seychas-ne-s-28-sentyabrya-2026-282672/"}, {"num": 9, "cat": "ecom", "catText": "电商动态", "title": "拟全面禁售电子烟：ОПИ 提请联邦层立法禁止生产、进口与零售", "tag": "local", "tagText": "本地", "source": "Известия", "time": "09-29 01:00", "summary": "«Общественная потребительская инициатива»（ОПИ）已向政府、财政部与卫生部提请制定联邦法律，全面禁止电子烟的生产、进口与零售。理由为现行「由地区自行设限」的机制形成监管缺口——商品可在其他地区合法销售再流入禁售区；并指出哈萨克斯坦（2024）、乌兹别克斯坦与吉尔吉斯斯坦（2025）已全面禁售，俄成区域内最大合法市场。若落地将影响相关品类与周边配件。", "table": [["诉求", "生产/进口/零售全面禁止"], ["受理方", "政府、Минфин、Минздрав"], ["已全面禁售国", "哈萨克斯坦、乌兹别克斯坦、吉尔吉斯斯坦"]], "sourceFull": "https://iz.ru/2175148/2026-09-29/v-rossii-khotiat-polnostiu-zapretit-prodazhi-veipov"}, {"num": 10, "cat": "ecom", "catText": "电商动态", "title": "«Купер» 以 10 万卢布买下 Cooper 商标", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-28 10:07", "summary": "运营 «Купер» 配送服务的 ООО «Инстамарт Сервис» 通过和解协议，以 10 万卢布从个体经营者 Азамат Ибатуллин 处取得 Cooper 商标的独家权利。此前公司曾请求法院因「未使用」提前终止该商标在第 35 类（广告/商业管理）的注册保护，最终以和解收尾。该卖家名下约 1,500 个商标、约 3 万件仲裁案件，属典型「商标囤积」博弈案例。", "table": [["成交价", "10 万卢布"], ["受让方", "ООО «Инстамарт Сервис»（«Купер»）"], ["商标类别", "第 35 类 МКТУ"]], "sourceFull": "https://www.retail.ru/news/kuper-vykupil-tovarnyy-znak-cooper-za-100-tysyach-rubley-28-sentyabrya-2026-282641/"}, {"num": 11, "cat": "politics", "catText": "时政要闻", "title": "普京把俄武装力量编制人数提高至 244 万人", "tag": "local", "tagText": "本地", "source": "Известия / Ведомости", "time": "09-28 19:54", "summary": "普京签署命令，把俄罗斯武装力量编制人数上限提高至 244 万人（含现役军人约 150 万），并下达了与该编制相关的新任务指令。编制扩容延续战时人力与财政的结构性压力：国防与安全支出比重维持高位，劳动人口向军工/合同兵渠道分流，对民营仓储、分拣与末端配送的用工供给构成中期挤压，Q4 临时用工成本需据此上修。", "table": [["编制人数", "244 万人"], ["现役军人", "约 150 万"], ["签署日", "2026-09-28"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/28/1232522-putin-uvelichil-chislennost"}, {"num": 12, "cat": "politics", "catText": "时政要闻", "title": "普京签署限制 ТЭК（燃料能源综合体）信息获取的总统令", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-29 01:07", "summary": "普京签署总统令，限制对燃料能源综合体（ТЭК）相关信息的获取。在无人机持续打击炼厂、油库与物流节点的背景下，该令旨在收紧设施运行、产能与位置类信息的公开范围。对市场的影响是成品油产量、检修与运输数据的公开度下降，卖方与物流方获取燃油供应前瞻信息的渠道收窄，Q4 运价与燃油附加费的预判难度上升。", "table": [["措施", "限制 ТЭК 领域信息获取"], ["对象", "燃料能源综合体相关数据"], ["签署日", "2026-09-29"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/29/1232579-putin-podpisal-ukaz"}, {"num": 13, "cat": "politics", "catText": "时政要闻", "title": "杜马新一届格局落定：普京支持沃洛金连任议长，各党派分委会", "tag": "local", "tagText": "本地", "source": "Ведомости / Lenta.ru", "time": "09-28 22:24", "summary": "普京会见进入新一届国家杜马的五个议会党派领导人，支持沃洛金出任杜马主席，并称选举结果确认民众支持特别军事行动参与者。各党派分委会底定：ЛДПР 由 Слуцкий 领导并获原 СР 的委员会，СР 由 Миронов 领导保留三个委员会，КПРФ 取得家庭事务委员会，«Новые люди» 或获生态委员会。平台经济法与外资资产处置的立法路线预计延续。", "table": [["杜马主席", "沃洛金（普京支持）"], ["ЛДПР 党团", "Слуцкий"], ["СР 党团", "Миронов"], ["委员会数", "34 个（第九届）"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/28/1232561-putin-podderzhal-volodina"}, {"num": 14, "cat": "politics", "catText": "时政要闻", "title": "普京解除萨维利耶夫副总理职务", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-28 15:47", "summary": "普京签署命令，解除 Олег Савельев 的副总理职务；同日 Лента 报道称已出现接任人选。萨维利耶夫此前分管交通与物流相关事务，人事变动发生在铁路运输受袭中断、燃油与干线运价承压的窗口，涉及交通部与物流政策的执行连续性，关注其继任者的交通/物流政策取向对干线运能与运价的影响。", "table": [["人事变动", "解除副总理 Савельев"], ["签署日", "2026-09-28"], ["原分管方向", "交通/物流等"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/28/1232439-putin-osvobodil-saveleva"}, {"num": 15, "cat": "politics", "catText": "时政要闻", "title": "欧盟因选举问题对俄实施新制裁，涉鞑靼斯坦领导人", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-28 14:35", "summary": "欧盟以「不允许亚博卢科（«Яблоко»）参选」为由对俄罗斯实施新一轮制裁，制裁对象包括鞑靼斯坦领导人在内的相关人员。本轮制裁延续欧盟「人权/选举」框架下的小范围个人清单模式，对俄本土零售与电商经营无直接限制，但会强化被列名主体在跨境结算与出行上的摩擦，供应商需排查合作方与受益所有人是否在列。", "table": [["制裁主体", "欧盟（选举/人权框架）"], ["涉及对象", "鞑靼斯坦领导人等"], ["对俄零售影响", "无直接限制"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/28/1232400-es-vvel-sanktsii"}, {"num": 16, "cat": "econ", "catText": "经济金融", "title": "Brent 首次自 9-8 跌破 97 美元，11 月合约报 97.25 美元", "tag": "local", "tagText": "本地", "source": "ПРАЙМ (1prime)", "time": "09-28 20:18", "summary": "莫斯科时间 9-28 19:30，11 月交割的 Brent 期货较前收 -0.19% 至 97.25 美元/桶，盘中首次自 9 月 8 日以来跌破 97 美元；WTI 11 月合约 -0.15% 至 92.27 美元/桶。油价回落有利 Q4 干线运输燃油成本与燃油附加费压力缓和，但在 ТЭК 信息受限与炼厂遇袭背景下波动放大，运价谈判宜保留可重新协商条款。", "table": [["Brent（11 月）", "97.25 美元/桶（-0.19%）"], ["WTI（11 月）", "92.27 美元/桶（-0.15%）"], ["首次跌破 97", "自 2026-09-08 以来首次"]], "sourceFull": "https://1prime.ru/20260928/neft-873735674.html"}, {"num": 17, "cat": "econ", "catText": "经济金融", "title": "卢布第三周稳定：央行 9-29 官方美元 84.41 卢布", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-28 17:51", "summary": "俄央行把 9-29 官方美元汇率定为 84.41 卢布，较 9-25 仅上涨 0.07 卢布，美元连续第三周维持窄幅稳定。汇率的低波动降低跨境采购与结算的汇率风险溢价，利于以人民币/美元计价的头程与备货成本预算；但企业大额外汇采购的汇率敞口仍需按季度锁定，避免单边预期下放松对冲。", "table": [["官方 USD/RUB（9-29）", "84.41"], ["较 9-25 变动", "+0.07 卢布"], ["EUR", "96.25"], ["CNY", "12.5629"]], "sourceFull": "https://www.vedomosti.ru/finance/news/2026/09/28/1232485-kurs-stabilen"}, {"num": 18, "cat": "econ", "catText": "经济金融", "title": "财政部讨论对高风险地区自建住房引入强制保险", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "09-29 00:36", "summary": "财政部副部长 Чебесков 在莫斯科金融论坛表示，在自然灾害风险较高的地区建房应当投保，以降低联邦预算的救灾支出并促使民众审慎选址；2019 年通过的自愿住房保险机制未能真正运转，因此正在讨论对计划在高风险区建造住房的公民实行强制保险。对家居建材、装修与配套品类的需求结构有中期影响。", "table": [["提议", "高风险区自建住房强制保险"], ["现状", "2019 年自愿机制未落地"], ["目的", "降低预算救灾负担"]], "sourceFull": "https://ria.ru/20260929/minfin-2120851381.html"}, {"num": 19, "cat": "econ", "catText": "经济金融", "title": "求职超过一年者占比升至 13.3%，为去年同期的 1.5 倍", "tag": "local", "tagText": "本地", "source": "Известия / Росстат", "time": "09-29 00:20", "summary": "俄统计局报告显示，2026 年 7 月约 13.3% 的求职者超过 12 个月未能就业，去年同期为 9.7%；平均求职时长 5.1 个月（女 5.6、男 4.4）。生产、建筑与蓝领岗位仍缺人，但办公室岗位竞争加剧；中小企业在高利率、信贷成本与消费需求收缩下关停，推动隐性失业上升。对卖家的含义：招聘难度结构性缓解，但消费需求端走弱信号增强。", "table": [["求职超 1 年占比（7 月）", "13.3%（去年 9.7%）"], ["平均求职时长", "5.1 个月"], ["女性/男性", "5.6 / 4.4 个月"]], "sourceFull": "https://iz.ru/2175124/2026-09-29/chislo-ishchushchikh-rabotu-bolshe-goda-vyroslo-v-poltora-raza"}, {"num": 20, "cat": "econ", "catText": "经济金融", "title": "财政部支持上调 ОСАГО 赔付限额，业界估算保费或上涨 10%", "tag": "local", "tagText": "本地", "source": "Известия", "time": "09-29 00:02", "summary": "财政部副部长 Чебесков 表示支持提高交强险（ОСАГО）赔付限额，优先上调「生命健康」项（现行财产 40 万卢布、生命健康 50 万卢布），将与央行、议会及保险业共同细化，最快 2027 年春季落地。保险业界初估保费将上涨约 10%，叠加零部件价格上调，自营车队与三方运力的车险成本需提前预置到 Q4 运费与到仓成本模型。", "table": [["现行限额", "财产 40 万 / 生命健康 50 万卢布"], ["业界估保费涨幅", "约 +10%"], ["预计落地", "2027 年春季"]], "sourceFull": "https://iz.ru/2174919/kirill-sazonov/koshelek-ili-zhizn-na-skolko-mogut-podorozhat-polisy-osago"}, {"num": 21, "cat": "beauty", "catText": "美妆个护", "title": "化妆品店平均客单价 +21% 至 1,880 卢布，但美妆消费支出同比 -12%", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-28 12:28", "summary": "«Сбер2B Аналитика» 上半年俄「时尚与美妆」消费数据显示：服装鞋履占 72%、香水化妆品占 14.5%、美容院占 13.5%。三大类支出全面下滑，服装鞋履与香水化妆品均 -12%、美容院 -2%；但单次消费额普涨，化妆品店客单价 +21% 至 1,880 卢布、服装鞋履 3,282 卢布（+7%）、美容院 2,201 卢布（+12%）。购买人数减少、单笔金额走高，说明客群在向中高客单集中，低价走量策略的边际效率下降。", "table": [["化妆品店客单价", "1,880 卢布（+21%）"], ["香水化妆品支出", "-12%"], ["服装鞋履客单价", "3,282 卢布（+7%）"], ["美容院客单价", "2,201 卢布（+12%）"]], "sourceFull": "https://www.retail.ru/news/sredniy-chek-v-magazinakh-kosmetiki-vyros-na-21-a-raskhody-rossiyan-v-nikh-snizi-28-sentyabrya-2026-282652/"}, {"num": 22, "cat": "beauty", "catText": "美妆个护", "title": "Armani 拟出售 15% 少数股权给 LVMH、L'Oréal 或 EssilorLuxottica", "tag": "local", "tagText": "本地", "source": "Retail.ru / Financial Times", "time": "09-28 07:36", "summary": "据 FT 报道，意大利时尚/美妆集团 Armani 拟就出售少数股权与法国 LVMH、L'Oréal 及意大利 EssilorLuxottica 展开谈判，涉及 15% 股份，可能由三家投资人分持。创始人为 Giorgio Armani（2026 年逝世，享年 91 岁）留下出售少数股权的指示，谈判关键议题是公司估值。此举或改变高端美妆（香水/眼妆）在中长期的所有权与渠道格局，值得关注其对俄分销与免税渠道的连带影响。", "table": [["拟售比例", "15%"], ["潜在买方", "LVMH / L'Oréal / EssilorLuxottica"], ["信息源", "Financial Times"]], "sourceFull": "https://www.retail.ru/news/armani-planiruet-prodat-minoritarnuyu-dolyu-lvmh-ili-l-oreal-28-sentyabrya-2026-282633/"}, {"num": 23, "cat": "appliance", "catText": "家电电器", "title": "«М.Видео»：开学前复新 Android 手机需求 +13%，Xiaomi 月内 +62%", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-28 13:37", "summary": "«М.Видео» 称 8 月 24-30 日（开学前最后完整一周）复新（восстановленные）Android 手机需求环比前一周 +13%；8 月整体复新机销量较 7 月 +15%，其中 Android 占比由 51% 升至 56%、销量 +15%（金额 +19%）。分品牌看 Xiaomi +62%、Honor +35%、Huawei +6%、Samsung 数量持平（金额 +8%）。买家更倾向「理性购买」，复新机成为新品涨价的替代选项，对配件与中低价位机型备货有指引意义。", "table": [["开学周 Android 复新机", "+13%（环比）"], ["8 月复新机整体", "+15%（环比 7 月）"], ["Android 占比", "56%（7 月 51%）"], ["Xiaomi / Honor", "+62% / +35%"]], "sourceFull": "https://www.retail.ru/news/m-video-pered-1-sentyabrya-spros-na-vosstanovlennye-android-smartfony-vyros-na-1-28-sentyabrya-2026-282656/"}, {"num": 24, "cat": "appliance", "catText": "家电电器", "title": "俄微电子生产商或获扩大税收优惠", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-28 20:49", "summary": "报道称俄罗斯微电子（микроэлектроника）生产商有望获得扩大的税收优惠。此前同日 vedomosti 报道：俄将基于 «Интегральные системы» 组建统一的微电子公司，并已掌握约 60 种关键电子材料的生产。政策取向是借税收工具与国产替代拉动本土半导体与元器件产能，对依赖进口元器件的家电、灯具与消费电子的成本与合规要求构成中期变量。", "table": [["政策方向", "扩大微电子税收优惠"], ["产业动作", "组建统一微电子公司（«Интегральные системы» 为基础）"], ["国产化进展", "约 60 种关键材料已量产"]], "sourceFull": "https://www.retail.ru/news/rossiyskim-proizvoditelyam-mikroelektroniki-mogut-rasshirit-nalogovye-lgoty-28-sentyabrya-2026-282678/"}, {"num": 25, "cat": "other", "catText": "其它动态", "title": "«Додо Пицца» 遭网络攻击，IT 系统受影响", "tag": "local", "tagText": "本地", "source": "РИА Новости / Ведомости", "time": "09-28 23:39", "summary": "«Додо Пицца» 通报其 IT 系统遭受网络攻击，公司称正在恢复；同期 «Ведомости» 亦报道该事件。餐饮连锁是外卖与即时配送体系的关键节点，其系统中断会波及第三方配送与聚合平台的订单流。对电商卖家的含义：平台生态的第三方服务商（ERP、订单中台、结算工具）近月连续出现被攻击案例，需核对关键 SaaS 的灾备与账号权限，避免联动的订单/收款中断。", "table": [["事件", "IT 系统遭网络攻击"], ["主体", "«Додо Пицца»"], ["通报日", "2026-09-28"]], "sourceFull": "https://ria.ru/20260928/dodo-2120846326.html"}, {"num": 26, "cat": "other", "catText": "其它动态", "title": "Nestlé 拟就俄资产移交临时管理提出异议", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-28 09:46", "summary": "报道称 Nestlé 可能对把其在俄资产移交临时管理的决定提出异议。此前 9-17 普京令已把 Auchan、Nestlé、Лемана Про、FM Logistic 等在俄资产纳入临时管理，Северсталь 等亦启动司法挑战。外资零售与快消资产的处置争议进入法律对抗阶段，相关品牌在俄的供应链、渠道供货与账期存在不确定性，作为其俄境内供应商/分销商的卖家需准备主体变更的预案。", "table": [["主体", "Nestlé"], ["动作", "拟对临时管理提出异议"], ["关联名单", "Auchan / Лемана Про / FM Logistic 等"]], "sourceFull": "https://www.retail.ru/news/nestle-planiruet-osporit-peredachu-rossiyskikh-aktivov-vo-vremennoe-upravlenie-28-sentyabrya-2026-282640/"}, {"num": 27, "cat": "other", "catText": "其它动态", "title": "匈牙利 OTP 银行考虑全面退出俄罗斯市场", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-28 15:48", "summary": "匈牙利 OTP Bank 表示正在考虑完全退出俄罗斯市场。OTP 是俄境内为数不多的外资银行之一，其退出将减少本地企业（含跨境卖家）可用的外资结算与外汇服务选项，进一步把跨境收付集中到中资银行、本土大行与替代性支付通道上。卖家应评估现有收付路径的冗余度，避免单一通道中断影响回款周期。", "table": [["主体", "OTP Bank（匈牙利）"], ["动作", "考虑全面退出俄罗斯"], ["影响", "外资银行收付通道减少"]], "sourceFull": "https://www.vedomosti.ru/finance/news/2026/09/28/1232433-vengerskii-otp-bank"}, {"num": 28, "cat": "other", "catText": "其它动态", "title": "Sunlight：Z 世代成首个「给自己买珠宝」多于收礼的一代", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-28 14:01", "summary": "珠宝连锁 Sunlight 的调研显示，Z 世代成为首个「为自己购买珠宝」多于收到珠宝作为礼物的世代，即珠宝消费动机从「礼品/纪念」转向「自我犒赏与日常佩戴」。该趋势利好入门价位与日常款饰品的销量，也意味着营销重心从节日礼赠节点转向常态化内容种草与自购场景，对美妆个护与配饰类目的商品卡与内容策略有参考价值。", "table": [["主体", "Sunlight（珠宝连锁）"], ["结论", "Z 世代自购珠宝 > 收礼"], ["含义", "营销从礼赠节点转向日常自购"]], "sourceFull": "https://www.retail.ru/news/sunlight-zumery-stali-pervym-pokoleniem-kotoroe-chashche-pokupaet-ukrasheniya-se-28-sentyabrya-2026-282658/"}, {"num": 29, "cat": "other", "catText": "其它动态", "title": "布良斯克州：无人机袭击致铁路桥坍塌、10 节车厢脱轨，两州铁路一度停运", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-28 11:02", "summary": "9-28 凌晨布良斯克州遭无人机袭击，一座铁路桥坍塌、货运列车 10 节车厢脱轨，布良斯克州与卡卢加州列车运行一度暂停；同日沃罗涅日遭袭致 3 名儿童与 1 名女性受伤，莫斯科 MCD-2「Тушинская」站数人受伤。该窗口打击重心转向铁路与交通节点，虽然无平台仓库受损，但西南/中部干线的铁路通道出现中断性风险，Q4 备货需为铁路停运预留公路替代运力与更长在途天数。", "table": [["受影响节点", "布良斯克州铁路桥 / 货运列车"], ["中断范围", "布良斯克州 + 卡卢加州铁路"], ["其他", "沃罗涅日 4 伤、莫斯科 MCD-2 数人受伤"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/28/1232283-pod-bryanskom-posle"}]}
