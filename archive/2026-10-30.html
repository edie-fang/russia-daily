{"date": "2026-10-30", "stats": {"total": 20, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "cat": "platform", "catText": "平台规则变动", "title": "国家杜马一读通过网购退货新规：远程退货成义务，卖家须披露退货运费与风险，并可验货", "tag": "local", "tagText": "本地", "source": "ТКС.ru（引 俄新社）", "time": "10-28 00:00", "summary": "国家杜马 10-28 一读通过《消费者权益保护法》修正案：合格商品退货必须提供可远程寄回的方式，卖家不得再要求买家到数百公里外的门店退货；卖家须在成交前告知退货权、退货运费由谁承担、以及运输途中灭失或损坏的风险；同时赋予卖家收货时查验退货商品的权利。法案未强制卖家承担回寄运费，二读前将细化运费分担与平台代收流程。", "table": [["⏱ 生效时间", "待核实（10-28 一读通过，待二读、三读与总统签署，最早 2027 年上半年）"], ["🎯 实际影响", "退货退款环节：Ozon/WB 现有『退回自提点/门店』流程与卖家自设退货地址将被规制，跨境卖家不能再只挂莫斯科一个退货点；退货运费与运输风险须在商品卡与客服话术中披露，退货损耗与纠纷成本上升；卖家获得验货权，可降低『空盒退货』损失"], ["✅ 建议动作", "11 月内由运营整理在售 SKU 的退货地址与运费口径，在 Ozon/WB 后台与详情页补齐退货说明；同步把『退货验收拍照留证』写入俄罗斯退货仓 SOP"]], "sourceFull": "https://www.tks.ru/politics/2026/10/28/0029/gosduma-odobrila-novyie-pravila-vozvrata-tovarov-s-marketplejsov"}, {"num": 2, "cat": "ecom", "catText": "电商动态", "title": "跨境网购 22% 增值税进入一读：2027 年起由平台代扣，预计年增财政收入 750 亿卢布", "tag": "local", "tagText": "本地", "source": "ТКС.ru", "time": "10-28 00:00", "summary": "预算包中的税法修正案规定，自 2027 年起对个人从境外平台购买、由境外直发的商品按 22% 征收增值税，纳税义务由平台承担（境外卖家自有站点、境外平台、以及代售境外商品的俄境内平台分别作为纳税代理人），预计每年新增财政收入 750 亿卢布。杜马预算与税收委员会 10-28 提出二读修改意见：需明确纳税人范围、税基计算与拒收退货时的退税流程；法案一读排在 10-29。俄方口径是拉平本土卖家与跨境直购的税负差。", "table": [["税率", "22%（拟自 2027 年起）"], ["年增财政收入", "750 亿卢布"], ["代扣主体", "平台：境外卖家站点 / 境外平台 / 俄境内平台"], ["状态", "一读程序 10-29，是否通过待核实"]], "sourceFull": "https://www.tks.ru/politics/2026/10/28/0001/gosduma-predlozhila-utochnit-kto-i-kak-budet-platit-nds-za-pokup"}, {"num": 3, "cat": "ecom", "catText": "电商动态", "title": "Wildberries 向俄买家开放埃塞俄比亚卖家商品：咖啡、纺织、皮革、家居与天然化妆品", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-29 15:10", "summary": "WB 创始人、РВБ 负责人 Татьяна Ким 在 КИТ 大会宣布，平台已向俄罗斯买家开放埃塞俄比亚卖家的商品，首期品类为咖啡、纺织品、皮革制品、家居用品与天然化妆品。第二阶段将把平台开放给埃塞俄比亚买家，俄罗斯卖家可反向进入非洲市场。Ким 称埃塞是东非增长最快市场、人口规模接近俄罗斯，且有 Ethiopia 2030 数字化规划支撑。", "table": [["首期品类", "咖啡 / 纺织 / 皮革 / 家居 / 天然化妆品"], ["第二阶段", "向埃塞买家开放，俄卖家可反向出海"], ["背景", "2025-11 与埃塞投资控股签合作备忘录"]], "sourceFull": "https://www.retail.ru/news/wildberries-nachal-prodavat-tovary-iz-efiopii-29-oktyabrya-2026-283852/"}, {"num": 4, "cat": "ecom", "catText": "电商动态", "title": "WB 与肯尼亚洽谈数字贸易投资：俄非论坛期间会见鲁托总统，规模与时间表未披露", "tag": "local", "tagText": "本地", "source": "ТКС.ru", "time": "10-29 00:00", "summary": "俄非经济与人道论坛期间，肯尼亚总统鲁托会见 РВБ 总裁 Роберт Мирзоян，双方讨论在肯尼亚投资的可能性，重点为电子商务与数字贸易。投资规模、落地时间与具体形式均未公布，官方表述为『讨论机会』，并非开站或签署投资合同。此前 2025-11 WB 与埃塞俄比亚投资控股签署战略合作备忘录，2025-06 Мирзоян 已提及筹备进入非洲市场。", "table": [["状态", "洽谈中，无投资额与时间表"], ["会谈方", "肯尼亚总统鲁托 / РВБ 总裁 Мирзоян"], ["历史节点", "2025-11 埃塞备忘录；2025-06 首次提非洲计划"]], "sourceFull": "https://www.tks.ru/politics/2026/10/29/0008/keniya-obsuzhdaet-investitsii-s-wildberries"}, {"num": 5, "cat": "ecom", "catText": "电商动态", "title": "卖家向 Сбер 提交约 6,000 份贷款重组申请，合计 210 亿卢布", "tag": "local", "tagText": "本地", "source": "ТКС.ru", "time": "10-29 00:00", "summary": "Сбер 副行长兼 CFO Тарас Скворцов 披露：平台卖家已提交约 6,000 份贷款重组申请，合计约 210 亿卢布，申请高峰出现在仓库遭大规模袭击的几个月，银行把主要成因归于仓储受损导致的现金流中断。该客群占银行对公信贷组合不足 0.2%（按 9-30 的 34.15 万亿卢布组合折算约 680 亿卢布），银行称不构成系统性风险；重组是调整还款条件，不等于免债，获批金额未披露。", "table": [["申请量", "约 6,000 份"], ["申请金额", "约 210 亿卢布"], ["占对公信贷", "不足 0.2%（约 680 亿卢布）"], ["对公组合", "34.151 万亿卢布（9-30，IFRS）"]], "sourceFull": "https://www.tks.ru/politics/2026/10/29/0025/selleryi-zaprosili-restrukturizatsiyu-kreditov-na-21-mlrd-rublej"}, {"num": 6, "cat": "ecom", "catText": "电商动态", "title": "电商零售媒体广告 9 个月达 5,800 亿卢布、同比 +58%，成广告市场最快板块", "tag": "local", "tagText": "本地", "source": "Retail.ru（引 РАЭК）", "time": "10-29 17:25", "summary": "РАЭК 评估，2026 年前 9 个月俄罗斯电商零售媒体（eRetail Media，即平台站内竞价与展示广告）规模达 5,800 亿卢布，同比增长 58%，是广告市场增速最快的细分类目。增长来自平台内搜索竞价、推荐位与品牌旗舰位扩张，广告投放已成为卖家获取流量最主要的成本项之一，也意味着单纯靠自然搜索的毛利空间继续被压缩。", "table": [["规模（1-9 月）", "5,800 亿卢布"], ["同比", "+58%"], ["属性", "平台站内竞价与展示广告"]], "sourceFull": "https://www.retail.ru/news/raek-eretail-media-vzletel-na-58-do-580-mlrd-rubley-29-oktyabrya-2026-283856/"}, {"num": 7, "cat": "ecom", "catText": "电商动态", "title": "莫斯科区域 9 个月新建仓储 167 万㎡ 创历史纪录，成交面积 +51%", "tag": "local", "tagText": "本地", "source": "Retail.ru（引 CORE.XP）", "time": "10-29 19:05", "summary": "CORE.XP 数据：2026 年 1-9 月莫斯科区域新建仓储 166.8 万㎡，同比增 30%，为该市场有史以来九个月最高；仓储成交面积同比 +51% 至 158.5 万㎡。三季度单季交付 66.8 万㎡，季末新交付面积仅 38% 空置（二季度为 62%），说明预租比例上升。机构预计全年新建可达 220 万㎡、成交 200 万㎡，供给仍在追赶被袭击打乱的仓配需求。", "table": [["新建（1-9 月）", "166.8 万㎡（+30%）"], ["成交面积", "158.5 万㎡（+51%）"], ["Q3 交付", "66.8 万㎡"], ["新交付空置率", "38%（Q2 为 62%）"], ["全年预测", "新建 220 万㎡ / 成交 200 万㎡"]], "sourceFull": "https://www.retail.ru/news/v-moskovskom-regione-za-devyat-mesyatsev-postroili-rekordnye-1-67-mln-kv-m-sklad-29-oktyabrya-2026-283861/"}, {"num": 8, "cat": "ecom", "catText": "电商动态", "title": "Яндекс 撤回 2026 年财务指引：数据中心遇袭后不确定性上升", "tag": "local", "tagText": "本地", "source": "ТКС.ru", "time": "10-29 00:00", "summary": "Яндекс 撤回此前发布的 2026 年财务指引：原预期营收增长约 20%、调整后 EBITDA 约 3,500 亿卢布，现两项指标全部撤回，理由是 10 月无人机袭击数据中心后难以评估影响，公司称将在下一季度视确定性考虑恢复预测。9 个月资本开支 1,150 亿卢布，2026 年 capex 计划不追加，称受损前已完成基础设施冗余与设备储备；AI、自动驾驶与 Алиса 产品线方向不变。", "table": [["原指引", "营收 +20%；调整后 EBITDA 3,500 亿卢布（已撤回）"], ["9M capex", "1,150 亿卢布"], ["恢复预测", "下一季度视情况"]], "sourceFull": "https://www.tks.ru/technology/2026/10/29/0004/yandeks-otozval-finansovyij-prognoz-na-2026-god/"}, {"num": 9, "cat": "ecom", "catText": "电商动态", "title": "欧亚经济联盟与中国通过新版经贸合作计划：2027 年磋商跨境电商与技术法规", "tag": "local", "tagText": "本地", "source": "ТКС.ru", "time": "10-29 00:00", "summary": "10-29 青岛举行的欧亚经济联盟-中国联合委员会第六次会议上，双方签署议定书并通过新版经贸合作计划。2027 年将就跨境电子商务、卫生与植物检疫措施（СФС）、技术法规三项开展磋商，直接关系中国商品进入联盟市场的准入条件。数据显示中国占联盟外贸额 36.2%（2025 年），今年前 7 个月相互贸易增 19.7%，中俄本币结算占比接近 100%。", "table": [["中国占联盟外贸", "36.2%（2025 年）"], ["前 7 月相互贸易", "+19.7%"], ["中俄本币结算占比", "接近 100%"], ["2027 磋商议题", "跨境电商 / СФС / 技术法规"]], "sourceFull": "https://www.tks.ru/politics/2026/10/29/0017/eaes-i-kitaj-podgotovili-novyij-plan-razvitiya-torgovo-ekonomicheskog"}, {"num": 10, "cat": "beauty", "catText": "美妆个护", "title": "RWB 任命 Анна Ларина 为『Рив Гош』总经理：主攻高端香水美妆与全渠道", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-29 14:40", "summary": "Wildberries 母公司 RWB 任命 Анна Ларина 为香水美妆连锁『Рив Гош』总经理，接替 Эдгар Шабанов。Ларина 在美妆行业逾 25 年，1998 年起任职 L'Oréal 俄罗斯，曾负责 Lancôme、Giorgio Armani Beauty，管理 300 人以上团队。新岗位重点为巩固高端香水美妆定位、扩品类、优化客户服务，并推进门店与数字渠道打通的全渠道模式。", "table": [["新任总经理", "Анна Ларина（L'Oréal 俄罗斯 25 年）"], ["战略重点", "高端香水美妆 + 全渠道"], ["归属", "2025 年底并入 RWB 生态"]], "sourceFull": "https://www.retail.ru/news/gruppa-rwb-naznachila-annu-larinu-upravlyayushchim-direktorom-riv-gosh--29-oktyabrya-2026-283837/"}, {"num": 11, "cat": "appliance", "catText": "家电电器", "title": "手机 IMEI 白名单讨论中：境外自购须在 Госуслуги 登记，未登记或将被断网（拟 2027-03-01）", "tag": "local", "tagText": "本地", "source": "РИА Новости / Ведомости", "time": "10-29 00:00", "summary": "Минцифры 正与运营商讨论自 2027-03-01 起对手机实行 IMEI 白名单管理：在俄境外自行购买或携带入境的手机须在 Госуслуги 登记，未登记设备将被限制接入移动网络，目标是打击走私与『影子进口』。方案仍在讨论，纳入范围（平板、手表、笔记本是否同规）、登记时限与豁免情形均待核实。对以平行进口和境外直邮为主的家电数码卖家，这是潜在的合规与退货风险点。", "table": [["拟生效", "2027-03-01（讨论中，待核实）"], ["登记渠道", "Госуслуги"], ["适用", "境外自购 / 携带入境的手机"], ["后果", "未登记限制接入网络"]], "sourceFull": "https://www.vedomosti.ru/technology/news/2026/10/29/1241221-mintsifri-obsuzhdaet"}, {"num": 12, "cat": "appliance", "catText": "家电电器", "title": "М.Видео 首次上线电子与家电租赁：与 Pauri 合作，免押金小额分期", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-29 15:55", "summary": "М.Видео 与租赁服务商 Pauri 合作，首次在官网推出电子与家电租赁：М.Видео 提供自有翻新机，Pauri 负责下单与服务，首批为笔记本、手机、平板、音响、游戏主机与吸尘器，同时可租 Pauri 全系（电视、投影、扫地机、挂烫机、VR 等）。免押金、不办贷款，按固定周期小额付费，可自提或送货上门，到期可退可续；后续考虑在莫斯科高客流门店设试点柜台。", "table": [["模式", "免押金、按期小额付费"], ["首批品类", "笔记本 / 手机 / 平板 / 音响 / 游戏机 / 吸尘器"], ["合作方", "Pauri（负责下单与服务）"], ["下一步", "莫斯科门店试点柜台"]], "sourceFull": "https://www.retail.ru/news/set-m-video-vpervye-zapustit-uslugu-arendy-tekhniki-29-oktyabrya-2026-283848/"}, {"num": 13, "cat": "econ", "catText": "经济金融", "title": "布伦特站上 113.60 美元（+2.53%），WTI 104.94 美元，油价延续强势", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "10-30 04:44", "summary": "10-30 莫斯科时间 04:44，ICE 1 月布伦特期货报 113.60 美元/桶，较前一结算价上涨 2.53%；WTI 报 104.94 美元/桶，涨 2.88%。延续胡塞袭击沙特能源设施与对俄制裁预期带来的涨势，连续第二日走高。高油价一方面抬升跨境物流与仓储的能源成本、推高俄国内运费，另一方面支撑卢布计价预算收入与卢布汇率。", "table": [["Brent（1 月）", "113.60 美元/桶（+2.53%）"], ["WTI", "104.94 美元/桶（+2.88%）"], ["取数时点", "10-30 04:44 MSK"]], "sourceFull": "https://ria.ru/20261030/neft-2127978441.html"}, {"num": 14, "cat": "econ", "catText": "经济金融", "title": "央行 10-30 官方汇率：美元 80.6761、欧元 89.8167、人民币 12.0844，卢布续强", "tag": "local", "tagText": "本地", "source": "ЦБ РФ", "time": "10-30 00:00", "summary": "俄央行公布 10-30 官方汇率：美元 80.6761 卢布（前一日 80.8664，卢布升值约 0.24%），欧元 89.8167，人民币 12.0844。卢布连续走强，市场归因于高油价带来的出口结汇、预算季资金回流与进口需求偏弱。对进口型卖家是采购成本利好，但卢布计价售价与毛利率需按新汇率重算，锁汇窗口建议跟随月度定价节奏。", "table": [["USD/RUB", "80.6761"], ["EUR/RUB", "89.8167"], ["CNY/RUB", "12.0844"], ["前一日 USD", "80.8664"]], "sourceFull": "https://www.cbr.ru/scripts/XML_daily.asp?date_req=30.10.2026"}, {"num": 15, "cat": "econ", "catText": "经济金融", "title": "国家杜马一读通过最低工资上调：2027 年起 МРОТ 达 28,935 卢布", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "10-29 00:00", "summary": "国家杜马 10-29 一读支持自 2027 年起将最低工资（МРОТ）提高至 28,935 卢布/月。最低工资上调会推高仓储、分拣、快递与门店等劳动密集型环节的人工成本，并抬高社保与加班基数；对自营仓、自建配送与本地客服团队的卖家，2027 年人力预算需按此重算。", "table": [["МРОТ（2027）", "28,935 卢布/月"], ["状态", "一读通过（10-29）"], ["影响环节", "仓储 / 分拣 / 配送 / 客服"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/10/29/1241307-povishenie-mrot"}, {"num": 16, "cat": "econ", "catText": "经济金融", "title": "央行拟把企业 СБП 单笔限额提至 3,000 万卢布，征求意见至 11-12", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "10-29 00:00", "summary": "俄央行公布指令草案，拟将企业通过快速支付系统（СБП）的单笔支付上限从现行水平提高至 3,000 万卢布，覆盖法人间结算以及个人与企业向预算系统缴款。央行称可提升企业资金周转效率、加快预算缴款。征求意见截止 2026-11-12。若落地，卖家与供应商、物流商之间的大额货款可用 СБП 即时结算，降低对传统电汇时效与手续费的依赖。", "table": [["拟提限额", "3,000 万卢布/笔"], ["覆盖", "法人间结算 + 预算缴款"], ["意见截止", "2026-11-12"]], "sourceFull": "https://www.vedomosti.ru/finance/news/2026/10/29/1241176-sbp-do-30-mln"}, {"num": 17, "cat": "econ", "catText": "经济金融", "title": "15 个地区取消燃油限购，但油价未同步回落", "tag": "local", "tagText": "本地", "source": "ТКС.ru", "time": "10-29 00:00", "summary": "10 月俄 15 个地区取消了此前因供应紧张实施的燃油限购，包括梁赞、利佩茨克、科斯特罗马、沃罗涅日、新西伯利亚、秋里、斯维尔德洛夫斯克、托木斯克、弗拉基米尔州，以及克拉斯诺亚尔斯克、斯塔夫罗波尔边疆区、卡累利阿、莫尔多瓦、塞瓦斯托波尔与克里米亚；列宁格勒州限制仍在。原因部分炼厂恢复运转、季节性需求下降。俄统计局数据显示 10-20 至 10-26 有 57 个地区汽油价格下降，但专家不认为加油站会明显降价。", "table": [["取消限购", "15 个地区"], ["仍受限", "列宁格勒州"], ["降价地区", "57 个（10-20~10-26）"], ["油价预期", "不会明显回落"]], "sourceFull": "https://www.tks.ru/politics/2026/10/29/0023/v-15-regionah-otmenili-ogranicheniya-na-prodazhu-topliva"}, {"num": 18, "cat": "politics", "catText": "时政要闻", "title": "莫斯科方向夜间再拦截 37 架无人机，多莫杰多沃与谢列梅捷沃限飞，4 架伊斯坦布尔航班返航", "tag": "local", "tagText": "本地", "source": "ТАСС / Ведомости", "time": "10-30 01:42", "summary": "俄国防部通报，10-29 夜间至 10-30 凌晨防空力量击落 37 架飞向莫斯科的无人机；莫斯科市长索比亚宁此前通报击落 22 架（较早时点口径）。多莫杰多沃、谢列梅捷沃机场实施临时起降限制，雅罗斯拉夫尔、乌里扬诺夫斯克、奔萨与萨拉托夫机场同步限飞，4 架自伊斯坦布尔起飞的航班因莫斯科限制返航。这是连续第二夜的大规模拦截，仓配与快递时效仍面临夜间中断风险。", "table": [["击落（莫斯科方向）", "37 架（至 10-30 01:42）"], ["市长口径", "22 架（较早时点）"], ["机场", "多莫杰多沃 / 谢列梅捷沃等限飞"], ["航班", "4 架伊斯坦布尔航班返航"]], "sourceFull": "https://tass.ru/proisshestviya/28269233"}, {"num": 19, "cat": "politics", "catText": "时政要闻", "title": "拉加德宣布提前卸任欧洲央行行长，接任程序 10-29 启动", "tag": "local", "tagText": "本地", "source": "ТКС.ru", "time": "10-29 00:00", "summary": "欧洲央行 10-29 发布公告，行长拉加德通知理事会与欧洲理事会主席科斯塔，将提前卸任。她自 2019 年 11 月出任行长，是首位女性行长，曾任 IMF 总裁与法国财长；公告未说明原因。欧洲理事会当日启动继任者遴选，热门人选为前西班牙央行行长、现 BIS 行长 Pablo Hernández de Cos，以及前荷兰央行行长 Klaas Knot。消息发布于欧央行议息会议当日，欧元资产的利率路径预期面临重估。", "table": [["事件", "拉加德提前卸任（10-29 公告）"], ["任期起点", "2019-11"], ["热门继任", "Hernández de Cos / Klaas Knot"], ["程序", "欧洲理事会遴选，最终由其决定"]], "sourceFull": "https://www.tks.ru/politics/2026/10/29/0019/glava-evropejskogo-tsentralnogo-banka-kristin-lagard-obyavila-o-dosro"}, {"num": 20, "cat": "politics", "catText": "时政要闻", "title": "数据中心连环遇袭后 Ростелеком 加强反无人机防护，客户未现大规模迁移", "tag": "local", "tagText": "本地", "source": "ТКС.ru（引 商业彼得堡）", "time": "10-29 00:00", "summary": "Ростелеком 总裁 Осеевский 在『Территория』论坛表示，公司正以被动防护手段、并与军方协作加强数据中心反无人机能力，细节不便披露。10 月俄科技企业数据中心连环遇袭：10-07/08 梁赞州萨索沃的 Яндекс 数据中心严重受损并停机，10-09 卡卢加另一处 Яндекс 数据中心多个模块故障，10-18 VK 列宁格勒州数据中心被击中。Ростелеком 称未见对手客户大规模迁入。", "table": [["措施", "被动防护 + 与军方协作"], ["遇袭设施", "Яндекс 萨索沃（10-07/08）、卡卢加（10-09）、VK 列宁格勒州（10-18）"], ["客户迁移", "未见大规模迁移"]], "sourceFull": "https://www.tks.ru/politics/2026/10/29/0018/posle-atak-na-tsodyi-yandeksa-i-vk-rostelekom-usilivae"}]}
