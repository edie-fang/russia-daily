ru/doc/9126604"}, {"num": 20, "cat": "econ", "catText": "经济金融", "title": "8 月平均工资 103,014 卢布，同比 +10.9%", "tag": "local", "tagText": "本地", "source": "Известия", "time": "11-21 01:43", "summary": "俄统计局：2026 年 8 月平均名义工资 103,014 卢布，较 2025 年 8 月的 92,866 卢布增加 10,148 卢布（+10.9%）。工资增速持续高于通胀，对中低价位日用与家电子类需求形成支撑。", "table": [["2026-08 平均工资", "103,014 ₽"], ["2025-08", "92,866 ₽"], ["同比", "+10,148 ₽（+10.9%）"]], "sourceFull": "https://iz.ru/2205847/2026-11-21/sredniaia-zarplata-v-rossii-za-god-vyrosla-bolee-chem-na-10-tys-rublei"}, {"num": 21, "cat": "politics", "catText": "时政要闻", "title": "阿布扎比三方谈判：北约东扩成主要障碍，美方称「比几个月前更接近解决」", "tag": "local", "tagText": "本地", "source": "Lenta.ru", "time": "11-21 04:36", "summary": "美国经济学家萨克斯向 ТАСС 表示，北约东扩是阿布扎比三方谈判的「主要障碍」；他称美方谈判代表曾提出讨论乌克兰入约、以换取从顿巴斯撤军，并认为「比几个月前更接近解决，但美国尚未迈出决定性一步」。该进程直接影响对俄制裁与跨境物流预期的节奏。", "table": [["地点", "阿布扎比"], ["主要障碍", "北约东扩"], ["美方评估", "更接近解决，未迈决定性一步"]], "sourceFull": "https://lenta.ru/news/2026/11/21/v-ssha-nazvali-glavnoe-prepyatstvie-na/"}, {"num": 22, "cat": "politics", "catText": "时政要闻", "title": "萨拉托夫州无人机袭击致 3 死 2 伤；11-19 全俄击落 8 枚「Нептун」与 268 架无人机", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-19 16:58", "summary": "萨拉托夫州州长通报，无人机袭击致 3 人死亡、2 人受伤，克拉斯诺阿尔梅斯克区有设施受损。11-19 俄防空共击落 8 枚「Нептун」巡航导弹与 268 架无人机；同日无人机再次袭击克里米亚大桥，通行一度中断。", "table": [["死亡", "3 人"], ["受伤", "2 人"], ["11-19 拦截", "8 枚 Нептун + 268 架无人机"], ["其他", "克里米亚大桥一度中断"]], "sourceFull": "https://www.vedomosti.ru/society/news/2026/11/19/1413448-saratovskoi-oblasti"}, {"num": 23, "cat": "politics", "catText": "时政要闻", "title": "库尔斯克遭袭：13 人受伤含 1 名儿童，98 栋建筑受损", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-19 18:44", "summary": "库尔斯克州州长通报，遭袭受伤人数升至 13 人（8 名女性、4 名男性、1 名儿童），3 人住院；截至 11-19 晚，库尔斯克市 98 栋建筑受损，含住宅、医院、法院、图书馆等，67 辆汽车受损。损失评估委员将在周末继续工作。", "table": [["受伤", "13 人（含 1 儿童）"], ["住院", "3 人"], ["建筑受损", "98 栋"], ["车辆受损", "67 辆"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/11/19/1413500-chislo-postradavshih-viroslo"},
