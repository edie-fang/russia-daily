{"date": "2026-08-26", "stats": {"total": 15, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "🚨仓库被炸：Ozon官方确认涅文诺梅斯克仓库8-24夜疏散停工；俄外交部定性系列袭击为\"协调攻击\"", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)、T-J、BBC Russian", "time": "08-25 07:08", "summary": "Ozon官方TG确认：斯塔夫罗波尔边疆区涅文诺梅斯克仓库8-24夜因无人机威胁疏散并停工（此前官方口径仅两城遇袭），BBC将其列入当夜遇袭名单，是否被直接击中仍待核实。Ozon受影响设施升至7处。俄外交部米罗什尼克周报定性：WB与Ozon物流设施遭协调的系列无人机袭击。累计：WB 22处、Ozon 7处。", "table": [["Ozon受影响设施", "7处（新增确认涅文诺梅斯克）"], ["WB累计遇袭设施", "22处（17地区）"], ["涅文诺梅斯克状态", "疏散+停工，是否被击中待核实"]], "sourceFull": "https://ria.ru/20260825/ataka-2112970692.html"}, {"num": 2, "title": "袭击重塑仓储地产：莫斯科圈物流园成交量预期由降转升，全年或达150万㎡（+8%）", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-26 02:07", "summary": "咨询机构上调莫斯科及莫斯科州物流园成交预期：2026年成交量或同比增长8%至150万㎡，此前预测为年降20-30%。上调主因是仓库遇袭受损案例增多——电商平台需恢复损失的仓储面积，带动租赁需求。仓库被炸正从风险事件转化为物流地产增量需求，卖家需关注核心区仓储租金上行压力。", "table": [["物流园成交预期", "150万㎡/年（+8%）"], ["此前预期", "年降20-30%"]], "sourceFull": "https://www.kommersant.ru/doc/8908186"}, {"num": 3, "title": "地方救助扩容：诺夫哥罗德州为仓库遇袭受损卖家提供5%低息贷款（最高500万卢布/3年）", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-25 16:29", "summary": "诺夫哥罗德州长德罗诺夫宣布：因电商平台仓库遇袭导致商品受损的本地卖家，可申请最高500万卢布、期限最长3年的专项贷款，最低利率5%，由州小企业支持基金发放，用于补充流动资金和恢复经营。这是财政部一年税收缓缴之后，地方层面首个针对遇袭受损卖家的专项金融工具，其他受袭地区或跟进。", "table": [["贷款上限", "500万卢布"], ["期限", "最长3年"], ["最低利率", "5%"]], "sourceFull": "https://ria.ru/20260825/marketpleysy-2113119776.html"}, {"num": 4, "title": "Ozon全面下架芳香吸入器：复核在售商品，相关卡片将全部隐藏", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-24 18:13", "summary": "Ozon向NEWS.ru表示，将以用户安全与健康优先为由对平台在售商品进行额外复核，隐藏所有芳香吸入器（аромаингалятор）商品卡片，此后该类商品完全不可下单。平台未披露涉及商品数量。提示：平台以安全为由的品类清理可随时启动，相关类目卖家需评估合规与清货预案。", "table": [], "sourceFull": "https://ria.ru/20260824/ozon-2112894608.html"}, {"num": 5, "title": "俄乌正协商\"相当大规模\"换俘名单", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-26 04:53", "summary": "俄联邦委员会国际事务委员会委员兰特拉托娃透露，俄罗斯与乌克兰正在协商用于\"相当大规模\"战俘交换的名单。这是近期换俘谈判的最新进展信号，具体规模与时间未披露。", "table": [], "sourceFull": "https://tass.ru/politika/28044695"}, {"num": 6, "title": "无人机威胁夜袭俄中部：莫斯科方向击落10架，超10座机场轮番关闭；利佩茨克州民宅被坠机致2死", "tag": "local", "tagText": "本地", "source": "国际文传(Interfax)、塔斯社(TASS)", "time": "08-26 03:52", "summary": "8-25夜至26凌晨，俄防空击落10架飞往莫斯科的无人机；莫斯科三大机场及喀山、下诺夫哥罗德、切博克萨雷、萨兰斯克、奔萨、坦波夫、卡卢加、雅罗斯拉夫尔等超10座机场轮番临时限流，凌晨陆续恢复。利佩茨克州一架无人机坠落民宅致2死；别尔哥罗德州多地遭袭多人受伤。中部航空物流夜间中断已成常态，需关注空运时效。", "table": [["莫斯科方向拦截", "10架"], ["限流机场", "10+座"], ["利佩茨克州伤亡", "2死（民宅）"]], "sourceFull": "https://www.interfax.ru/russia/1111253"}, {"num": 7, "title": "亚美尼亚政局震荡：前总统科恰良在埃里温被拘、其子被批捕；俄外交部称不怕双边贸易萎缩", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)、俄新社(RIA)", "time": "08-25 17:08", "summary": "亚美尼亚执法部门在埃里温拘留前总统罗伯特·科恰良，法院随后批捕其子；案件细节未完全公开。同期俄外交部就俄亚贸易额下滑表态称，俄罗斯不期待也不担忧与亚美尼亚贸易收缩带来的冲击。南高加索方向政商关系继续降温，对经亚美尼亚的平行进口链路需保持关注。", "table": [], "sourceFull": "https://www.kommersant.ru/doc/8908071"}, {"num": 8, "title": "9月1日起俄罗斯中小学课堂全面禁用手机", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-26 01:15", "summary": "俄教育部确认，自9月1日新学年起，学生课堂上禁止使用手机，仅威胁师生生命健康的紧急情况除外。开学季为电商8月销售高峰，新规落地后家长对非智能替代品（电话手表、功能机）需求或现结构性变化。", "table": [["生效日期", "2026-09-01"]], "sourceFull": "https://tass.ru/obschestvo/28044497"}, {"num": 9, "title": "小麦出口关税8月26日起上调至每吨1000+卢布", "tag": "local", "tagText": "本地", "source": "国际文传(Interfax)", "time": "08-26 00:06", "summary": "俄罗斯小麦出口关税自8月26日起上调至每吨1000卢布以上，按弹性关税机制随基准价格浮动。出口成本抬升或继续传导至国内粮价与食品通胀预期。", "table": [["小麦出口关税", "1000+卢布/吨（08-26起）"]], "sourceFull": "https://www.interfax.ru/russia/1111241"}, {"num": 10, "title": "居民资金加速入市：二季度经纪账户净流入1.1万亿卢布", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-25 20:33", "summary": "生意人报报道，2026年二季度投资者向经纪账户净存入1.1万亿卢布，创阶段性高点。高利率环境下存款与股市同步吸金，反映居民资产配置在高息尾声前的再平衡。", "table": [["Q2经纪账户净流入", "1.1万亿卢布"]], "sourceFull": "https://www.kommersant.ru/doc/8908201"}, {"num": 11, "title": "银行体系冷热分化：大行存款利率上限触及19%，信贷发放节奏降1.5-2倍", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)、塔斯社(TASS)", "time": "08-26 03:10", "summary": "Финуслуги数据显示俄最大银行存款利率上限已达19%；同期国家信用记录局（НБКИ）通报，信贷发放节奏同比下降1.5-2倍，新信用卡平均额度持续收缩。高息揽储与信贷收缩并存，消费端购买力承压，对耐用品与大件消费的抑制将延续。", "table": [["存款利率上限", "19%"], ["信贷发放节奏", "同比降1.5-2倍"]], "sourceFull": "https://tass.ru/ekonomika/28044587"}, {"num": 12, "title": "燃料危机应对：哈萨克斯坦\"康登萨特\"炼厂将向俄供应汽柴油；加油站运营商请求延长柴油出口全面禁令", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)、国际文传(Interfax)", "time": "08-25 18:55", "summary": "哈萨克斯坦\"康登萨特\"炼厂将启动对俄汽油与柴油供应，补充国内缺口；同期俄加油站运营商请求政府延长柴油出口全面禁令。塞瓦斯托波尔周三起燃油实行QR码限购+自由购买双轨。进口补充+出口封锁双管齐下，短期燃油紧张或边际缓解，但区域价差与限购仍将存在。", "table": [], "sourceFull": "https://www.kommersant.ru/doc/8908160"}, {"num": 13, "title": "2026年俄数字营销市场或萎缩1-3%，公共部门削减最狠", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-25 18:45", "summary": "生意人报报道，企业与政府双双缩减数字与营销服务开支，2026全年市场规模或下降1-3%；此前市场曾预期杜马选举带动公部门投放增长，实际反而削减最多。广告投放大盘收缩将压低电商站外获客效率，卖家需相应调整投放预算结构。", "table": [["数字营销市场年度预期", "-1% ~ -3%"]], "sourceFull": "https://www.kommersant.ru/doc/8908050"}, {"num": 14, "title": "研究：俄美妆市场转入\"无限循环\"消费模型，复购留存取代拉新成竞争核心", "tag": "local", "tagText": "本地", "source": "Рухим行业门户 引Оккам研究", "time": "08-25 12:00", "summary": "俄营销传播集团Оккам发布美妆品类客户旅程研究：市场已从线性漏斗转入\"无限循环\"模型——购买不再是终点，复购与注意力争夺成为主战场；品牌忠诚度被视为核心资产，仅靠新品首发声量已不足以建立优势。对美妆卖家提示：内容与会员运营投入权重应继续高于一次性拉新。", "table": [], "sourceFull": "https://www.ruhim.ru/news/news.htm"}, {"num": 15, "title": "二手电动车销量创历史新高：7月成交3646辆（同比2.9倍），日产占35%", "tag": "local", "tagText": "本地", "source": "Lenta 引Автостат", "time": "08-25 18:19", "summary": "Автостат数据：7月俄二手电动车成交3646辆，为2025年7月的2.9倍，二手市场首次突破3000辆。品牌结构：日产1281辆（35%）、极氪430辆、特斯拉337辆，前三合计56%。1-7月累计11374辆（+67%）。新车进口端：7月进口新电动车1210辆，1-7月累计2698辆，阿维塔占7月到港量过半。", "table": [["7月二手电动车销量", "3646辆（2.9倍）"], ["品牌前三", "日产35%/极氪430辆/特斯拉337辆"], ["1-7月累计", "11374辆（+67%）"]], "sourceFull": "https://lenta.ru/news/2026/08/25/rossiyane-kupili-rekordnoe-kolichestvo-odnogo-vida-avtomobiley/"}]}
