"summary": "俄中双方确认将相互支持在两国境内已开立银行的正常运营，避免跨境结算通道因次级制裁中断；同日普京在圣彼得堡会见中国国务院总理李强，双方并称贸易本币结算比例已接近完全。含义：对以人民币结算、经俄本地银行收付的跨境卖家而言，回款通道的稳定性预期改善，但仍需保留第二通道以防单点断链。", "table": [["核心安排", "相互支持已开立银行运转"], ["结算币种", "本币结算接近全覆盖"], ["同期会晤", "普京—李强（圣彼得堡）"]], "url": "https://www.vedomosti.ru/politics/news/2026/10/21/1239038-podderzhivat", "sourceFull": "https://www.vedomosti.ru/politics/news/2026/10/21/1239038-podderzhivat"}, {"num": 15, "cat": "politics", "catText": "时政要闻", "title": "630 架无人机夜袭莫斯科地区：163 架在莫斯科方向被击落，ТиНАО 2 人受伤", "tag": "local", "tagText": "本地", "source": "ТАСС / Интерфакс / RBK", "time": "10-22 09:35", "summary": "莫斯科市长索比亚宁通报，10-21 夜至 10-22 晨共有 630 架无人机飞向莫斯科地区，其中 163 架在莫斯科方向被击落；新莫斯科（ТиНАО）有 2 人受伤。受空袭影响三座莫斯科机场一度实施临时限流，雅罗斯拉夫尔方向出城公路交通中断后已恢复。这是 10 月以来对首都地区规模最大的一次袭击，莫斯科集群的仓配与干线时效当日出现波动。", "table": [["来袭无人机", "630 架"], ["莫斯科方向击落", "163 架"], ["伤亡", "ТиНАО 2 人受伤"], ["交通", "雅罗斯拉夫尔公路中断后恢复；三场临时限流"]], "url": "https://tass.ru/proisshestviya/28239987", "sourceFull": "https://tass.ru/proisshestviya/28239987"}, {"num": 16, "cat": "politics", "catText": "时政要闻", "title": "威特科夫称会谈「建设性」，普京表示愿 11 月恢复谈判；特朗普暂不追加制裁", "tag": "local", "tagText": "本地", "source": "«Ведомости»", "time": "10-21 22:09", "summary": "美国总统特使威特科夫 10-21 在圣彼得堡与普京会谈后称磋商「建设性」，随后离境；乌沙科夫表示普京已向威特科夫转达与特朗普、习近平会晤的考虑，并称「事情正走向结束」，三方会晤或在 АТЭС 期间举行，普京愿在 11 月恢复乌克兰问题谈判。特朗普同日表示暂不追加对俄制裁，并称解决问题「比以往任何时候都更近」。含义：制裁与地缘风险溢价短期回落，但缺乏可执行文本，政策仍可能反复。", "table": [["会谈定性", "「建设性」「有实质内容」"], ["下一步", "11 月或恢复谈判；АПЕК 期间或三方会晤"], ["制裁", "特朗普暂不追加"]], "url": "https://www.vedomosti.ru/politics/news/2026/10/21/1239045-uitkoff-nazv", "sourceFull": "https://www.vedomosti.ru/politics/news/2026/10/21/1239045-uitkoff-nazv"}, {"num": 17, "cat": "politics", "catText": "时政要闻", "title": "亚美尼亚请求欧亚经济委员会把俄方限制认定为贸易壁垒", "tag": "local", "tagText": "本地", "source": "«Ведомости»", "time": "10-21 20:31", "summary": "亚美尼亚已向欧亚经济委员会（ЕЭК）提出申请，要求把俄罗斯对其商品流通施加的限制认定为贸易壁垒。这是欧亚经济联盟内部首次由成员国就俄方限制正式启动壁垒认定程序。若 ЕЭК 受理并作出认定，俄方需在限期内取消或调整相关限制，否则可能进入联盟争端解决程序；对经亚美尼亚中转的平行进口与转口路径构成变量。", "table": [["申请方", "亚美尼亚"], ["受理方", "欧亚经济委员会（ЕЭК）"], ["性质", "联盟内首次就俄方限制启动壁垒认定"], ["影响路径", "经亚美尼亚中转的平行进口与转口"]], "url": "https://www.vedomosti.ru/politics/news/2026/10/21/1238915-armeniya-pop", "sourceFull": "https://www.vedomosti.ru/politics/news/2026/10/21/1238915-armeniya-pop"}, {"num": 18, "cat": "politics", "catText": "时政要闻", "title": "俄军称打击乌克兰物流中心与港口，乌方物流节点持续承压", "tag": "local", "tagText": "本地", "source": "«Ведомости»", "time": "10-22 00:54", "summary": "俄国防部通报对乌克兰境内物流中心与港口设施实施打击，称目标为军事物资转运节点；乌方尚未公布具体损失。这是近期双方围绕后方物流设施相互打击的延续：10-19 至 10-22 期间，俄境内仓库与物流中心亦多次被无人机袭击。含义：黑海与陆路口岸的运输保险与时延风险同步抬升，经乌克兰过境的通道基本不可用。", "table": [["打击目标", "物流中心与港口"], ["时间", "10-21 夜间"], ["背景", "双方围绕后方物流设施相互打击"]], "url": "https://www.vedomosti.ru/politics/news/2026/10/21/1239036-armiya-udari", "sourceFull": "https://www.vedomosti.ru/politics/news/2026/10/21/1239036-armiya-udari"}, {"num": 19, "cat": "politics", "catText": "时政要闻", "title": "美国把卢克石油海外资产出售许可延长至 11 月 21 日", "tag": "local", "tagText": "本地", "source": "«Ведомости»", "time": "10-22 01:48", "summary": "美国财政部将允许与卢克石油（«Лукойл»）海外资产处置相关交易的许可延期至 11 月 21 日，为潜在买家完成尽职调查与交割留出窗口；对卢克石油自身的制裁仍在议程内，乌沙科夫称相关制裁是俄美谈判议题之一。含义：能源资产处置的时间表后移，短期不改变俄油出口与运费格局，但制裁不确定性仍在。", "table": [["许可延期至", "2026-11-21"], ["对象", "卢克石油海外资产处置交易"], ["制裁状态", "仍在美方议程内（乌沙科夫）"]], "url": "https://www.vedomosti.ru/business/news/2026/10/21/1239042-prodlili-lit", "sourceFull": "https://www.vedomosti.ru/business/news/2026/10/21/1239042-prodlili-lit"}]}
