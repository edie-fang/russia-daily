eFull": "https://www.retail.ru/news/71-rossiyan-vybirayut-internet-magazin-po-tsene-no-bolshinstvo-ukhodit-iz-za-slo-20-oktyabrya-2026-283484/"}, {"num": 11, "cat": "ecom", "catText": "电商动态", "title": "«Яндекс» 恢复 «Директ» 关键功能：新建与编辑广告、账户管理均可用", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-20 17:14", "summary": "因 10-11 起无人机袭击数据中心导致 «Директ» 接口受限，Яндекс 分阶段恢复：10-15 先开放个人中心（启停已有广告、充值、设周预算上限），10-20 已恢复新建与编辑广告、注册账号、修改用户设置与完整账户管理。10-11~14 已投放广告照常展示，但统计报表可能仍不完整。对我方含义：旺季投放可恢复，但 10-11 后数据需另行补数校准。", "table": [["受限起点", "2026-10-11"], ["首批恢复", "2026-10-15"], ["关键功能恢复", "2026-10-20"]], "sourceFull": "https://www.retail.ru/news/yandeks-vosstanovil-klyuchevye-funktsii-servisa-dlya-prodvizheniya-direkt--20-oktyabrya-2026-283495/"}, {"num": 12, "cat": "lighting", "catText": "灯具照明", "title": "本期无新增重大动态（灯具照明）", "tag": "local", "tagText": "本地", "source": "编辑部核对", "time": "10-21 09:30", "summary": "本期窗口（10-18~10-21）内，RIA/TASS/Interfax/Kommersant/Vedomosti/Izvestia/Lenta 的 RSS 全量与 Retail.ru、«Современная светотехника» 行业页均未出现达到收录标准的灯具/照明行业新动态；10-20 期已收录的新年灯串需求 3 倍与 Авито 软装灯具 44% 为首选品类，本期不重复。", "table": [], "sourceFull": ""}, {"num": 13, "cat": "beauty", "catText": "美妆个护", "title": "Natura Siberica 任命 Екатерина Агеева 为营销与战略总监并进入董事会", "tag": "local", "tagText": "本地", "source": "New Retail", "time": "10-20 14:05", "summary": "ГК Natura Siberica 宣布任命 Екатерина Агеева 为营销与战略总监，同时进入公司董事会。对我方含义：俄本土个护品牌在渠道与品牌侧调整管理层，通常伴随价格带与促销策略重排，mosai 个护线在同类货架的竞争节奏需跟踪其 Q4 新品与促销力度。", "table": [], "sourceFull": "https://new-retail.ru/novosti/retail/ekaterina_ageeva_zanyala_post_direktora_po_marketingu_v_natura_siberica/"}, {"num": 14, "cat": "beauty", "catText": "美妆个护", "title": "Valentino 在俄重新注册名称与标识商标，此前已停止在俄运营", "tag": "local", "tagText": "本地", "source": "New Retail", "time": "10-19 20:45", "summary": "意大利时尚屋 Valentino 在已停止俄市场运营的背景下，完成了品牌名称与标识在俄的商标注册。对我方含义：奢侈品牌保留商标属防备性布局，短期不构成回归信号，但相关品类（香水、配饰）的平行进口与授权格局可能随之变化，代购/跨境链路需留意授权口径。", "table": [], "sourceFull": "https://new-retail.ru/novosti/retail/italyanskiy_brend_valentino_oformil_registratsiyu_tovarnykh_znakov_v_rf/"}, {"num": 15, "cat": "appliance", "catText": "家电电器", "title": "ICMR：75 英寸以上电视 2026 上半年销量再增 25%，均价三年降 28%", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-20 17:32", "summary": "ICMR 拆解同一台电视在不同客群中的选购逻辑：75 英寸以上机型销量从 2022 年 7.4 万台增至 2025 年 17.9 万台，均价由 16.6 万降至 12 万卢布，2026 上半年再增 25%；QLED 从 20.6 万台增至 150 万台，均价由 7.5 万降至 4 万卢布。对我方含义：大屏与量子点已进入大众价格带，卖点应从参数转向场景与安装服务。", "table": [["75\"+ 销量", "7.4 万 → 17.9 万台"], ["75\"+ 均价", "16.6 万 → 12 万卢布"], ["QLED 销量", "20.6 万 → 150 万台"], ["QLED 均价", "7.5 万 → 4 万卢布"]], "sourceFull": "https://www.retail.ru/news/analitiki-icmr-vyyasnili-kak-raznye-tipy-pokupateley-vybirayut-odin-i-tot-zhe-te-20-oktyabrya-2026-283496/"}, {"num": 16, "cat": "appliance", "catText": "家电电器", "title": "«Известия»：折叠屏 iPhone Duo 在俄遇冷，多家零售商放弃预售", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "10-21 00:48", "summary": "«Известия» 报道称首款折叠 iPhone Duo 在俄需求低迷，售价约为其他热销折叠机型的两倍，且在使用与生态上存在限制，多家零售商已放弃预售。对我方含义：高端手机配件（保护壳、支架、充电）的备货不宜按「折叠机放量」假设铺货，重心仍应放在主流直板机型。", "table": [], "sourceFull": "https://ria.ru/20261021/smartfon-2125764257.html"}, {"num": 17, "cat": "econ", "catText": "经济金融", "title": "公司债占企业融资比重升至创纪录 31%，存量达 40.15 万亿卢布", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "10-21 00:02", "summary": "«Эксперт РА» 综述：2026 年债券在企业融资结构中首次超过 31%（年初以来 +1.5 个百分点），刷新 2020 年 30% 的纪录；上半年企业债务总额增 4.5% 至 126 万亿卢布，其中银行贷款仅增 2.2% 至 86.8 万亿，债券增近 10% 至 39 万亿，7-8 月再增至 40.15 万亿。原因是银行更严格的债务负担计算规则与公开市场更低收益率。", "table": [["债券占比", "31%（纪录）"], ["债券存量", "40.15 万亿卢布"], ["企业债务总额", "126 万亿卢布"], ["个人债券投资", "1.6 万亿卢布"]], "sourceFull": "https://www.kommersant.ru/doc/9043196"}, {"num": 18, "cat": "econ", "catText": "经济金融", "title": "俄对欧盟冻鱼出口 8 月降至 2016 年以来最低", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "10-21 02:53", "summary": "据 Eurostat 数据，俄罗斯 8 月对欧盟冻鱼出口降至十年来最低水平。对我方含义：食品类跨境与冷链运力可能向其他品类释放，但西方港口与保险限制仍是主因；与电商主业关联有限，仅作宏观与运力参考。", "table": [], "sourceFull": "https://ria.ru/20261021/eksport-2125771617.html"}, {"num": 19, "cat": "econ", "catText": "经济金融", "title": "日本 9 月自俄有色金属进口同比增 191.1%", "tag": "local", "tagText": "本地", "source": "ТАСС", "time": "10-21 03:11", "summary": "ТАСС 依据日本海关数据：9 月日本自俄罗斯进口有色金属同比增长 191.1%。对我方含义：俄金属出口在亚洲方向继续扩容，若后续涉及铝、铜等家电与灯具原材料，成本端需关注亚洲定价对俄内需价格的传导。", "table": [], "sourceFull": "https://tass.ru/ekonomika/28235205"}, {"num": 20, "cat": "econ", "catText": "经济金融", "title": "欧洲气价一度突破 90 欧元/兆瓦时，为 2022 年 12 月以来最高", "tag": "local", "tagText": "本地", "source": "Лента.ру", "time": "10-20 20:50", "summary": "10-20 欧洲天然气现货一度超过 90 欧元/兆瓦时（TTF 约 1,062 美元/千立方米），为 2022 年 12 月以来最高，约为美伊冲突前水平的三倍；欧洲储气库填充率仅约 75%，为 2009 年有观测以来同期最低，德国约 60%。对我方含义：欧洲能源成本上行会推高本地仓储与干线成本预期，Q4 物流报价需按能源附加费情景测算。", "table": [["TTF 峰值", ">90 欧元/兆瓦时"], ["折合", "约 1,062 美元/千立方米"], ["储气率", "约 75%（德国约 60%）"]], "sourceFull": "https://lenta.ru/news/2026/10/20/tseny-na-gaz-v-evrope-dostigli-maksimuma-s-kontsa-2022-goda/"}, {"num": 21, "cat": "econ", "catText": "经济金融", "title": "关键行情：卢布官方汇率 82.8879，Brent 约 108.2 美元，IMOEX 前收 2472.26", "tag": "local", "tagText": "本地", "source": "ЦБ РФ / Лента.ру", "time": "10-21 09:00", "summary": "俄央行 10-21 官方汇率：美元 82.8879 卢布、欧元 93.0417、人民币 12.3708。10-20 Brent 盘中一度跌超 3% 至 106.24 美元，后回升至约 108.2 美元，仍低于前收；此前曾创五个月高点 111 美元以上。MOEX 指数与 RTS 取 10-20 收盘值。", "table": [["USD/RUB", "82.8879（ЦБ 10-21）"], ["EUR/RUB", "93.0417"], ["CNY/RUB", "12.3708"], ["Brent", "约 108.2 美元/桶"], ["IMOEX", "2472.26（10-20 收盘）"]], "sourceFull": "https://www.cbr.ru/scripts/XML_daily.asp?date_req=21.10.2026"}, {"num": 22, "cat": "politics", "catText": "时政要闻", "title": "夜间防空：莫斯科方向击落 3 架无人机，科斯特罗马、雅罗斯拉夫尔、下诺夫哥罗德机场限流", "tag": "local", "tagText": "本地", "source": "Интерфакс", "time": "10-21 03:19", "summary": "莫斯科市长索比亚宁通报 10-20 夜在接近莫斯科空域击落 3 架无人机；俄航管部门（Росавиация）对科斯特罗马、雅罗斯拉夫尔、下诺夫哥罗德机场实施临时限制，格连吉克机场恢复运行。对我方含义：中部集群航空货运与快递的到货时间仍有波动，旺季发货应按「机场临时关闭 3-6 小时」做缓冲。", "table": [], "sourceFull": "https://www.interfax.ru/russia/1123826"}, {"num": 23, "cat": "politics", "catText": "时政要闻", "title": "欧盟委员会拟把对俄石油限制纳入第 22 轮制裁包", "tag": "local", "tagText": "本地", "source": "ТАСС", "time": "10-21 00:08", "summary": "欧盟委员会表示希望在第 22 轮对俄制裁中加入针对俄罗斯石油的限制措施。对我方含义：若落地，油价与运费波动加大，卢布结算与跨境支付合规审查也会趋严，需提前准备支付通道备用方案（具体条目与生效时间待核实）。", "table": [], "sourceFull": "https://tass.ru/ekonomika/28235055"}, {"num": 24, "cat": "politics", "catText": "时政要闻", "title": "美国特使 Уиткофф 10-21 抵达圣彼得堡，继续乌克兰问题磋商", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "10-21 00:22", "summary": "据挪威首相披露，美国总统特别代表 Стивен Уиткофф 于周三抵达圣彼得堡，就乌克兰问题继续磋商。对我方含义：谈判窗口仍在，但接触层级与议题未明；制裁与物流政策的短期方向仍取决于会谈结果，Q4 备货不宜押注「快速缓和」。", "table": [], "sourceFull": "https://ria.ru/20261021/uitkoff-2125761688.html"}, {"num": 25, "cat": "politics", "catText": "时政要闻", "title": "米舒斯京：2025 年俄与 ШОС 国家贸易额超 30 万亿卢布，2026 上半年再增 18%", "tag": "local", "tagText": "本地", "source": "Лента.ру", "time": "10-20 22:11", "summary": "总理米舒斯京在杜尚别 ШОС 政府首脑会议上表示，2025 年俄与 ШОС 成员国贸易额超过 30 万亿卢布，2026 年上半年同比增长 18%；ШОС 秘书长称成员国相互贸易额 2025 年突破 7,000 亿美元。对我方含义：中亚通道与结算替代方案的政治支持继续增强。", "table": [["俄-ШОС 贸易额", ">30 万亿卢布（2025）"], ["2026 上半年", "+18%"], ["ШОС 内部贸易", ">7,000 亿美元（2025）"]], "sourceFull": "https://lenta.ru/news/2026/10/20/mishustin-soobschil-o-znachitelnom-uvelichenii-tovarooborota-so-stranami-shos/"}, {"num": 26, "cat": "politics", "catText": "时政要闻", "title": "奥斯陆法院扣押俄 5 处不动产，Нафтогаз 索赔升至约 60 亿美元", "tag": "local", "tagText": "本地", "source": "Лента.ру", "time": "10-20 23:42", "summary": "奥斯陆地区法院依据 9 月 22 日裁定，对俄在挪威的 5 处不动产实施保全：包括弗罗格纳区一栋公寓楼（抵押额 400 亿挪威克朗，约 42 亿美元）及 4 套合作公寓；含利息与诉讼费后索赔升至 570 亿克朗（约 60 亿美元）。另涉斯瓦尔巴 «Русский дом» 与 62 台雪地摩托等资产。", "table": [["扣押对象", "5 处不动产"], ["抵押额", "400 亿挪威克朗（约 42 亿美元）"], ["含息索赔", "570 亿克朗（约 60 亿美元）"]], "sourceFull": "https://lenta.ru/news/2026/10/20/sud-v-oslo-arestoval-pyat-rossiyskih-ob-ektov-po-isku-ukrainskogo-naftogaza/"}, {"num": 27, "cat": "other", "catText": "其它动态", "title": "汽车：全俄展厅数量达 4,700 家创纪录，本土品牌份额 27%→35%", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "10-21 02:27", "summary": "«Газпромбанк Автолизинг» 与 «АвтоБизнесРевю» 统计：1-9 月乘用车经销商网点增 14.4% 至 4,700 家（历史新高），新开 974 家、关闭 386 家；俄本土品牌展厅由 1,100 增至 1,600 家、份额从 27% 升至 35%，中国品牌份额由 64% 降至 55%（255 开/301 关）。经销商预计半年内出现回撤。", "table": [["展厅总数", "4,700 家（+14.4%）"], ["新开/关闭", "974 / 386"], ["俄本土品牌份额", "27% → 35%"], ["中国品牌份额", "64% → 55%"]], "sourceFull": "https://www.kommersant.ru/doc/9043105"}, {"num": 28, "cat": "other", "catText": "其它动态", "title": "汽车：ФНС 对豪华车加征税款 66 亿卢布", "tag": "local", "tagText": "本地", "source": "ТАСС / «Известия»", "time": "10-21 04:01", "summary": "«Известия» 援引税务部门数据：税务机关已对豪华车（повышающий коэффициент）加征税款 66 亿卢布。对我方含义：高端车型持有成本上升，会挤压高价汽车用品的连带消费，车载电器与清洁用品的高价位段备货宜保守。", "table": [["加征税款", "66 亿卢布"]], "sourceFull": "https://tass.ru/ekonomika/28235249"}, {"num": 29, "cat": "other", "catText": "其它动态", "title": "汽车：Авито 第三季度新钉胎销量同比 +15%，钉胎占总销量 65%", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-20 15:32", "summary": "Авито 数据：三季度新钉胎销量同比 +15%、非钉胎 +8%，二手车胎占平台销量主体（二手钉胎 -7%）；钉胎占全部轮胎销量 65%。增长最快的是赤塔与加里宁格拉德（近 2.5 倍）、远东 +61%、哈巴罗夫斯克 +45%。Ikon Tyres 份额 23%（均价 2 万卢布/套），Pirelli 9%（2.5 万），Hankook 8%。", "table": [["新钉胎", "+15% YoY"], ["非钉胎", "+8% YoY"], ["钉胎占销量", "65%"], ["Ikon 份额", "23%（均价 2 万卢布）"]], "sourceFull": "https://www.retail.ru/news/avito-prodazhi-novoy-shipovannoy-reziny-v-rossii-vyrosli-na-15-za-god-20-oktyabrya-2026-283492/"}]}
