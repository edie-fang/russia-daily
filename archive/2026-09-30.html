{"date": "2026-09-30", "stats": {"total": 26, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "cat": "ecom", "catText": "电商动态", "title": "10-01 起《平台经济法》配套法律生效：买家可经平台向卖家索赔", "tag": "local", "tagText": "本地", "source": "Известия", "time": "09-30 00:02", "summary": "自 2026-10-01 起，中介数字平台须进入专门名录（上一年度日均俄用户≥10 万，且年交易卖家≥1 万或交易总额≥500 亿卢布）；须规范商品卡与报价发布、合作伙伴与自提点管理、个人后台访问与申诉处理。买家可就被侵权事项直接通过平台向卖家提出诉求，平台须提供技术入口并在法定情形下经平台基础设施退款退货；同时限制公开销售禁售品、未注册药品与医械、部分 БАД、无强制标记或无合规文件商品（部分条款 2027-01-01起生效）。平台不因此自动成为商品卖家。", "table": [["生效日", "2026-10-01"], ["名录门槛", "日均俄用户≥10 万"], ["交易门槛", "卖家≥1 万 或 GMV≥500 亿卢布"], ["买家索赔", "可经平台直接提出"]], "sourceFull": "https://iz.ru/2174817/naina-kurbanova/chto-izmenitsia-v-zhizni-rossiian-s-1-oktiabria"}, {"num": 2, "cat": "ecom", "catText": "电商动态", "title": "ВТБ 拟 10 月底完成对 RWB（Wildberries-Russ）的交易，SPO 参数不变", "tag": "local", "tagText": "本地", "source": "Retail.ru / Интерфакс", "time": "09-29 12:33", "summary": "ВТБ 第一副行长 Пьянов 称，与 RWB 的交易「不晚于 10 月底」完成，SPO 的规模、价格与锚定投资者均不变；按 6 月股东大会通过的方案，ВТБ 可公开配售最多 62.92 亿股、每股 87 卢布，募资规模估 3,000–4,000 亿卢布（倾向区间下沿）。此前 ВТБ 已先行收购该平台系银行 5% 股权并保留增持空间。含义：平台股权与银行资本绑定加深，WB 生态的结算、分期与 ЦФА 类金融产品预计加速落地，卖家账期与金融工具选项随之变化。", "table": [["交易完成", "预计 10 月底"], ["配售上限", "62.92 亿股"], ["价格", "87 卢布/股"], ["募资规模", "3,000–4,000 亿卢布"]], "sourceFull": "https://www.retail.ru/news/vtb-i-rwb-planiruyut-zakryt-sdelku-k-kontsu-oktyabrya-29-sentyabrya-2026-282702/"}, {"num": 3, "cat": "ecom", "catText": "电商动态", "title": "«ВсеИнструменты.ру» 董事会批准最多 5 亿卢布股票回购", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-29 12:02", "summary": "俄家居建材与工具类垂直电商 «ВсеИнструменты.ру»（ВИ.ру）董事会批准回购计划，规模上限 5 亿卢布。公司同期在扩展自有物流与线上渠道投入，回购资金通常用于员工长期激励与并购对价，市场解读为管理层对现金流与估值的信心信号。含义：工具、五金、清洁电器、家装建材类目的本土垂直渠道仍在资本市场获得流动性支持，头部玩家将持续由自有渠道分流平台流量，卖家的渠道组合不应单一依赖平台。", "table": [["回购规模上限", "5 亿卢布"], ["主体", "ВИ.ру（ВсеИнструменты.ру）"], ["用途", "员工激励/并购对价（市场解读）"]], "sourceFull": "https://www.retail.ru/news/sovet-direktorov-vseinstrumenty-ru-odobril-vykup-aktsiy-obemom-do-500-mln-rubley-29-sentyabrya-2026-282700/"}, {"num": 4, "cat": "ecom", "catText": "电商动态", "title": "ЦУМ 败诉：法院维持 ФАС 关于与 D&G、Gucci、Premiata 反竞争协议的认定", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-29 21:10", "summary": "莫斯科仲裁法院驳回 ЦУМ 运营方 ООО «Меркури Мода»（Mercury 集团）的诉请，维持 ФАС 2026-04-17 的三份裁定：其与 Dolce & Gabbana、Guccio Gucci、Premiata 的供货与授权协议含「不得直营、不得另定零售/加盟商」等排他条款，构成反竞争协议并（可能）限制同类商品在俄市场竞争。公司有一个月上诉期。含义：奢侈品、美妆服饰在俄的「单点独家代理」模式合规风险上升，多品牌多渠道分销更受鼓励。", "table": [["判决日", "2026-09-29"], ["涉事品牌", "D&G / Gucci / Premiata"], ["上诉人", "ООО «Меркури Мода»"], ["上诉期", "1 个月"]], "sourceFull": "https://www.retail.ru/news/tsum-ne-smog-osporit-resheniya-fas-ob-antikonkurentnykh-otnosheniyakh-s-dolce-ga-29-sentyabrya-2026-282738/"}, {"num": 5, "cat": "ecom", "catText": "电商动态", "title": "Ozon：53% 买家在自提点营业时间变化后仍保持忠诚", "tag": "local", "tagText": "本地", "source": "Retail.ru / Ozon", "time": "09-29 09:45", "summary": "Ozon 调研显示：70% 以上受访者每周至少到 ПВЗ 取件一次；40% 始终在同一自提点取货、48% 固定使用不超过3 个点；即使营业时间变化或出现临时不便，53% 仍会继续光顾或事后回流；65% 对常用点关闭持负面反应；62% 至今更换自提点不超过两次；77% 通过 App 地图发现新点；选择自提点的首要因素是位置便利（90%）、可当场验货与退货（65%）、有试衣间与良好照明（51%）。含义：ПВЗ 位置与履约体验是高黏性资产，网点关停或迁址对卖家履约稳定性的影响被放大。", "table": [["每周至少一次取件", ">70%"], ["固定同一点", "40%"], ["营业时间变动后仍光顾", "53%"], ["首要选择因素", "位置便利 90%"]], "sourceFull": "https://www.retail.ru/news/ozon-53-rossiyan-sokhranyat-vernost-lyubimomu-pvz-pri-smene-ego-grafika-29-sentyabrya-2026-282685/"}, {"num": 6, "cat": "ecom", "catText": "电商动态", "title": "Globus 拟在莫斯科 300 公里半径内新开多家大卖场", "tag": "local", "tagText": "本地", "source": "Retail.ru / Ведомости", "time": "09-29 07:20", "summary": "德国连锁 Globus 正为在莫斯科周边 300 公里内新建门店寻找地块，目标单店面积 1.6–2 万㎡；同时测试带咖啡与即食的「Глобус Лавка」小店型。2025 年俄业务收入 1,656 亿卢布、净利 74 亿卢布，现运营8 个地区 22 家门店；2025 年末现金及短期存款 126 亿卢布、两年内借款规模减半。市场认为加大在俄投资也有助于降低被移交临时管理的风险（对照 Metro 与 Auchan）。含义：大卖场放量与自有品牌、即食扩张将加剧食品及非食品溢出类目的线下价格竞争。", "table": [["目标单店面积", "1.6–2 万㎡"], ["覆盖半径", "300 公里"], ["2025 收入", "1,656 亿卢布"], ["现有门店", "22 家"]], "sourceFull": "https://www.retail.ru/news/globus-planiruet-otkryt-v-rf-neskolko-novykh-gipermarketov-29-sentyabrya-2026-282681/"}, {"num": 7, "cat": "ecom", "catText": "电商动态", "title": "工贸部长：本土轻工业产品占俄市场份额升至 45%（战略目标 50%）", "tag": "local", "tagText": "本地", "source": "Retail.ru / Минпромторг", "time": "09-29 20:56", "summary": "工贸部长 Алиханов 在 BRICS+ Fashion Summit 表示，俄本土轻工产品在国内市场份额已达 45%，《轻工业发展战略 2035》目标为 50%，更新版战略将于 2026 年底前批准。服装生产在 2025 年由增长转为-3%，进入「市场饱和」阶段；俄品牌约半数集中于窄众细分（功能面料、民族与区域品牌）。材料结构上，30 年前棉占约 50%、合成纤维 39%，现为棉 25–26%、合成纤维 60%。含义：本土替代率与合成纤维占比同步上升，对化纤面料、辅料与成衣供应链的选品与采购结构有直接指引。", "table": [["本土份额", "45%"], ["战略目标", "50%"], ["2025 服装产量", "-3%"], ["合成纤维占比", "60%"]], "sourceFull": "https://www.retail.ru/news/dolya-otechestvennoy-produktsii-legkoy-promyshlennosti-na-rynke-rf-dostigla-45-29-sentyabrya-2026-282736/"}, {"num": 8, "cat": "ecom", "catText": "电商动态", "title": "财政部拟将 ККТ（收银机）风险指标清单扩大约 3 倍", "tag": "local", "tagText": "本地", "source": "Retail.ru / Минфин", "time": "09-29 13:08", "summary": "财政部拟定新的收银机（ККТ）与营收完整核算检查风险指标清单：在现行 3 项基础上新增 7 项面向零售与餐饮的指标，含连续 60 天 100% 现金收款或 100% 非现金收款、「支出」票占「收入」票比例≥50%、「退货入账」金额占比≥80%、更正票金额占比≥30%，以及 ЕГРЮЛ/ЕГРИП 登记主营（ОКВЭД 47.1/47.2/47.5/47.7/47.73）满 90 天未登记 ККТ、个体户餐饮专利（ПСН）生效满 180 天未登记 ККТ等。含义：平台卖家与实体门店的收银合规将进入更细的自动比对，现金与退货异常会直接触发核查。", "table": [["现行指标", "3 项"], ["拟新增指标", "7 项"], ["现金/非现金 100% 阈值", "连续 60 天"], ["退货金额阈值", "≥80%"]], "sourceFull": "https://www.retail.ru/news/nalogovym-organam-v-3-raza-uvelichat-perechen-indikatorov-riska-dlya-naznacheniya-29-sentyabrya-2026-282706/"}, {"num": 9, "cat": "ecom", "catText": "电商动态", "title": "配送机器人试点新规生效：覆盖 34 个地区，三年后目标 1.2 万台", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-29 18:28", "summary": "俄政府关于配送机器人（роверы-доставщики）的新实验性法律机制（ЭПР）正式生效，覆盖 34 个地区；试点为期三年，政府预计设备总量将增至 1.2 万台，并将同步准备修改道路交通规则（ПДД）。含义：末端即时配送的自动化被纳入规范化通道，对「即时零售/小时达」的履约成本结构、以及 ПВЗ 之外的末端网络形态构成为中期变量，卖家可提前评估机器人与人力配送的混合成本模型。", "table": [["覆盖地区", "34 个"], ["试点期", "3 年"], ["目标设备量", "1.2 万台"], ["配套", "拟修改 ПДД"]], "sourceFull": "https://www.kommersant.ru/doc/8989812"}, {"num": 10, "cat": "ecom", "catText": "电商动态", "title": "通用支付 QR 码制度落地：卖家须向银行申领并改造收银设备", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-29 15:32", "summary": "自 2026-09-01 生效的 248-ФЗ 补充规定落地：「通用支付码」取代各银行分别生成的多套收款码，一个码即可支持 СБП、任意银行 App、分期服务与数字卢布；由 НСПК 免费提供，买家自愿使用。义务主体分阶段：2026-09-01 起 22 家系统重要性银行适用；同时，2025 年营收超 1.2 亿卢布且已与在册银行签约受理电子支付的卖家须自 09-01 起使用通用码（2027-09-01 起扩至 2026 年营收超 3,000 万卢布者；2028-09-01起覆盖所有银行）。央行至 2027-03-01 前不对银行未使用通用码处罚。含义：收银与 POS 需重新配置，卖家应核对银行侧改造进度与对账口径。", "table": [["法律依据", "248-ФЗ（2025-07-23）"], ["系统重要性银行", "22 家"], ["卖家门槛（2026-09-01）", "2025 年营收 >1.2 亿卢布"], ["下一阶段", "2027-09-01 起 >3,000 万卢布"]], "sourceFull": "https://www.retail.ru/news/s-1-sentyabrya-vstupil-v-silu-zakon-b-universalnom-qr-kode-dlya-prodavtsov-29-sentyabrya-2026-282717/"}, {"num": 11, "cat": "politics", "catText": "时政要闻", "title": "普京签署法令：个人向 ЕАЭС 等国携带现金卢布上限降至 100 万", "tag": "local", "tagText": "本地", "source": "Коммерсантъ / Известия / Ведомости", "time": "09-29 21:40", "summary": "09-29 普京签署法令收紧自然人携带现金卢布出境规则：前往 ЕАЭС 国家及阿塞拜疆、塔吉克斯坦、乌兹别克斯坦的携带上限降至 100 万卢布（此前为等值 10 万美元，降幅逾 8 倍）；对法人仍保留原有规则。含义：以现金结算的跨境采购、样品携带与代付通道将更受约束，卖家需把卢布现金支付转向银行转账、СБП 或替代结算工具，并预计边境查验趋严、报关与资金流凭证要求提高。", "table": [["生效日", "2026-09-29"], ["个人上限", "100 万卢布"], ["原口径", "等值 10 万美元"], ["适用范围", "个人（法人另计）"]], "sourceFull": "https://www.kommersant.ru/doc/8989972"}, {"num": 12, "cat": "politics", "catText": "时政要闻", "title": "第九届国家杜马 09-30 召开首次全会，各党派完成领导职务分配", "tag": "local", "tagText": "本地", "source": "Интерфакс / Коммерсантъ", "time": "09-30 02:00", "summary": "第九届杜马于 09-30（周三）举行首次全体会议。此前 09-29，各党派完成新一届领导岗位提名：「Единая Россия」「Новые люди」与 КПРФ 均已提出人选；ЦИК 亦通过连续 8 次会议完成空缺席位的重新分配，超 60 名当选者放弃席位。含义：新一届议会的委员会结构与人事就位后，《平台经济法》配套细则、外资资产处置与税制立法预计延续现有路线，卖家应关注 2027 年生效条款的细则节奏。", "table": [["首次全会", "2026-09-30"], ["放弃席位", "60+ 人"], ["ЦИК 加开会议", "8 场"], ["立法连续性", "平台经济法配套/外资处置延续"]], "sourceFull": "https://www.interfax.ru/russia/1119248"}, {"num": 13, "cat": "politics", "catText": "时政要闻", "title": "10-01 起军人薪资指数化 +4%，两类退休人员养老金翻倍", "tag": "local", "tagText": "本地", "source": "РИА Новости / Известия", "time": "09-30 01:59", "summary": "自 2026-10-01 起，军人及安全部门人员薪资指数化上调 4%；同一时点，2026 年 9 月满 80 周岁的公民与已获一级残疾认定者的保险养老金固定部分自动加倍。含义：居民可支配收入在 Q4 获得小幅政策性补充，对老年客群与军属家庭的日用、健康与家居类消费构成温和支撑；同时用工成本基数继续上行，Q4 临时用工与 2027 年人力预算需据此上调。", "table": [["军人薪资", "+4%（10-01 起）"], ["养老金", "80 岁 / 一级残疾者固定部分翻倍"], ["生效日", "2026-10-01"]], "sourceFull": "https://ria.ru/20260930/oklady-2121092869.html"}, {"num": 14, "cat": "politics", "catText": "时政要闻", "title": "普京会见多迪克与塞族共和国总理，讨论双边合作与制裁议题", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-29 20:52", "summary": "09-29 普京在莫斯科会见塞族共和国（波黑）领导人多迪克与总理 Минич，双方谈及历史、未来合作并涉及制裁议题，多迪克表示反对波黑对俄实施制裁。含义：俄在巴尔干的政治与经贸通道维持，对以塞尔维亚/波黑为中转的欧洲路向物流与贸易合规安排具有参考价值，相关线路的结算与清关预案可继续保留。", "table": [["会见日", "2026-09-29"], ["对象", "多迪克 / Минич"], ["议题", "制裁与双边合作"]], "sourceFull": "https://www.kommersant.ru/doc/8989947"}, {"num": 15, "cat": "politics", "catText": "时政要闻", "title": "欧盟未能就向乌克兰提供 Patriot 拦截弹达成一致", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-29 20:20", "summary": "欧盟成员国防长未能就动用本国库存向乌克兰转让 Patriot 防空系统拦截弹达成一致，原因为全球范围短缺及各方不愿作出政治承诺。含义：乌方防空弹药供给的不确定性上升，间接影响俄境内空袭强度与物流/仓储设施风险敞口的中期节奏；Q4 备货的运输路径与保险方案仍应维持冗余假设，不宜因单日无通报而下调风控等级。", "table": [["主体", "欧盟成员国防长"], ["结果", "未达成一致"], ["原因", "全球短缺 + 政治顾虑"]], "sourceFull": "https://www.kommersant.ru/doc/8989726"}, {"num": 16, "cat": "econ", "catText": "经济金融", "title": "9 月居民通胀预期升至 14.2%，年内再度走高", "tag": "local", "tagText": "本地", "source": "Коммерсантъ / Ведомости", "time": "09-30 02:17", "summary": "俄央行数据显示，9 月居民对未来 12 个月通胀的中位预期上升 0.5 个百分点至 14.2%；有储蓄者由 12% 升至12.8%，无储蓄者由 15% 升至 15.4%。含义：通胀预期继续「脱锚」，压制降息节奏，Q4 消费更偏向必需品与折扣渠道；对卖家而言价格带上移空间有限、促销敏感度上升，同时运费、仓租与人工等成本仍应按高通胀假设测算，促销预算需为运输成本波动预留弹性。", "table": [["中位通胀预期(9月)", "14.2%（+0.5pp）"], ["有储蓄者", "12.8%"], ["无储蓄者", "15.4%"]], "sourceFull": "https://www.kommersant.ru/doc/8989929"}, {"num": 17, "cat": "econ", "catText": "经济金融", "title": "央行：50 美元/桶门槛价或成宽松理由；ВТБ 称 12 月利率决定可能是「新年礼物」", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-29 14:48", "summary": "央行官员表态称，若预算规则中的油价「门槛价」下调至 50 美元/桶，将成为货币政策转向宽松的有利因素；ВТБ 第一副行长 Пьянов 同日称 12 月利率决议「可能成为新年礼物」，并预计未来三年银行体系利润不低于3.8 万亿卢布/年。含义：市场对 Q4—Q1 降息的预期抬升，卖家可据此重估库销比与备货杠杆成本，但不宜提前依赖低利率做长周期扩张。", "table": [["门槛价讨论", "$50/桶"], ["降息窗口", "2026-12"], ["银行利润预期", "≥3.8 万亿卢布/年"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/09/29/1232741-tsena-otsecheniya"}, {"num": 18, "cat": "econ", "catText": "经济金融", "title": "央行允许银行对「反无人机防护」项目贷款下调风险权重（30%/50%）", "tag": "local", "tagText": "本地", "source": "Коммерсантъ / Ведомости", "time": "09-29 21:30", "summary": "央行董事会决定：对用于保障关键基础设施免遭空袭威胁的项目贷款，银行可适用折减系数——投资级借款人 30%、其余 50%，并可不计提宏观审慎附加；措施自发布起生效，但仅有效至 2026-12-31。背景为 8-24 总统令 №604：关键基础设施若未采取或未及时采取安保措施，可被引入临时管理。市场认为取消宏观审慎附加能直接释放资本，但期限偏短、难支撑长周期项目；行业测算未来数年该类投资达数千亿卢布，其中银行融资或占约一半。含义：仓配与工业设施的防空/РЭБ/无人机探测设备可获更便宜资金，Q4 可关注与房东、3PL 服务商的防护成本分摊谈判。", "table": [["风险权重", "30%（投资级）/ 50%（其他）"], ["宏观审慎附加", "不适用"], ["有效期", "至 2026-12-31"], ["政策依据", "总统令 №604（2026-08-24）"]], "sourceFull": "https://www.kommersant.ru/doc/8989953"}, {"num": 19, "cat": "econ", "catText": "经济金融", "title": "俄石油出口周收入创 2022 年以来新高：单周 27.5 亿美元，Brent 回落至 96.76", "tag": "local", "tagText": "本地", "source": "Lenta.ru / Bloomberg", "time": "09-30 03:44", "summary": "彭博测算，俄罗斯一周石油出口收入达 27.5 亿美元，为 2022 年以来最高；9 月 1 日至 27 日日均出口 371 万桶，为 8 月初以来最高，主因中东局势推高油价与出口量回升。同期（09-29 19:55）Brent 转向下跌至 96.76 美元/桶（-1.09%，盘中最低 95.76），因沙特自延布港恢复出口。含义：出口收入改善对卢布与财政形成支撑，运价与燃油附加费压力短期缓和；但霍尔木兹海峡仍未通航，油价双向波动风险仍在，Q4 运输合约建议保留可重议条款。", "table": [["周出口收入", "27.5 亿美元（2022 年来最高）"], ["日均出口", "371 万桶"], ["Brent(11 月)", "96.76 美元/桶（-1.09%）"], ["盘中低点", "95.76 美元"]], "sourceFull": "https://lenta.ru/news/2026/09/30/stalo-izvestno-o-rekordnoy-nedelnoy-vyruchke-rossii-ot-eksporta-nefti-s-nachala-svo/"}, {"num": 20, "cat": "econ", "catText": "经济金融", "title": "央行自 10-01 起对「欺骗客户」的银行提高存款保险基金缴款", "tag": "local", "tagText": "本地", "source": "Известия", "time": "09-30 00:20", "summary": "自 2026-10-01 起，若央行认定银行在客户服务中存在严重违规（如误导销售、隐瞒费用、阻碍投诉处理等），该行向强制存款保险基金缴纳的费率将提高。含义：银行渠道端的合规与销售行为约束增强，涉及平台系银行（WB 银行、Ozon 银行）及消费金融、分期服务的营销话术与条款透明度要求提升；卖家在合作支付与分期产品时应同步复核条款披露与售后责任划分，避免因服务方违规牵连自身结算。", "table": [["生效日", "2026-10-01"], ["机制", "提高存款保险基金缴款费率"], ["触发条件", "严重客户违规"]], "sourceFull": "https://iz.ru/2175755/2026-09-30/tcb-nakazhet-banki-povyshennymi-vznosami-za-obman-klientov"}, {"num": 21, "cat": "beauty", "catText": "美妆个护", "title": "«ЮKassa»：俄居民「自我关怀」支出全面走高，SPA 营业额 +78%", "tag": "local", "tagText": "本地", "source": "Retail.ru / ЮKassa", "time": "09-29 21:43", "summary": "ЮMoney（«ЮKassa»）支付数据显示俄消费结构向预防性健康与自我关怀倾斜：SPA 服务营业额 +78%、支付笔数+37%、客单价 +30% 至 7,138 卢布；医学检验机构营业额 +61%、笔数 +55%、客单价 3,409 卢布；医院与诊所 +48%/+45%、客单价 6,052 卢布；药品零售 +28%/+23%、客单价 2,942 卢布；眼镜店 +28%/+32%、客单价 7,224 卢布（-4%）。含义：高客单的护理与恢复类场景在放量，家用美容仪、护理类小电器与功能性护肤的溢价空间优于基础洗护品类。", "table": [["SPA 营业额", "+78%"], ["SPA 客单价", "7,138 卢布"], ["医学检验", "+61%"], ["药品零售", "+28%"]], "sourceFull": "https://www.retail.ru/news/yukassa-rossiyane-stali-bolshe-vkladyvatsya-v-zabotu-o-sebe-29-sentyabrya-2026-282740/"}, {"num": 22, "cat": "appliance", "catText": "家电电器", "title": "Apple 失去俄智能手机「销售额第一」：份额降至 23%，Samsung 反超至 24%", "tag": "local", "tagText": "本地", "source": "Известия", "time": "09-30 00:40", "summary": "据某电子厂商合作伙伴公司资料（未满三个季度口径），Apple 在俄智能手机销售额份额同比下降约 16 个百分点至 23%，Samsung 上升逾 10 个百分点至 24%，Apple 让出金额口径第一；分析师估算 Apple 的销量份额仅约 7%，位列第五。含义：俄消费者在涨价与信贷收紧下向中端 Android 集中，中低价位机型、配件、以旧换新与复新机渠道的库存与定价策略应据此调整，高端旗舰的价格弹性进一步下降。", "table": [["Apple 金额份额", "23%（-16pp）"], ["Samsung 金额份额", "24%（+10pp 以上）"], ["Apple 销量份额", "约 7%（第五）"]], "sourceFull": "https://iz.ru/2175763/2026-09-30/apple-utratila-pervoe-mesto-v-rf-po-prodazham-smartfonov-v-dengakh"}, {"num": 23, "cat": "other", "catText": "其它动态", "title": "布良斯克州铁路恢复通车：此前无人机袭击致桥梁坍塌、10 节车厢脱轨", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "09-29 16:32", "summary": "Ведомости 报道，布良斯克州已恢复列车运行（09-29）。此前 09-28 的无人机袭击导致铁路桥坍塌、货运列车10 节车厢脱轨，布良斯克州与卡卢加州铁路一度停运；俄国防部通报过去一昼夜击落 287 架无人机，米罗什尼克称一周内袭击致 41 名俄公民死亡。含义：中部—西南干线铁路的中断已修复但风险未除，Q4 备货仍应保留公路替代运力与更长在途时间的缓冲，并把「干线中断 24–72 小时」写入补货应急预案。", "table": [["恢复通车", "2026-09-29"], ["单日击落无人机", "287 架"], ["一周死亡通报", "41 人"]], "sourceFull": "https://www.vedomosti.ru/society/news/2026/09/29/1232795-vosstanovili-dvizhenie"}, {"num": 24, "cat": "other", "catText": "其它动态", "title": "俄国产无人机因聚合物发动机将降价约四分之一", "tag": "local", "tagText": "本地", "source": "Известия", "time": "09-30 02:00", "summary": "俄工程团队在「国家技术倡议」支持下开发出用于无人机的轻量二冲程发动机系列，关键部件采用高温聚合物复合材料，使国产无人机成本下降约 25%。含义：无人机本土化与降本将降低相关供应链（电机、复合材料、控制件）的进口依赖度，也意味着空域风险与反制手段的成本结构继续演化；仓储与物流设施的防空加固仍是必选项，防护投入不能按「威胁下降」假设削减。", "table": [["成本降幅", "约 25%"], ["关键部件", "高温聚合物复合材料"], ["支持方", "НТИ"]], "sourceFull": "https://iz.ru/2175772/2026-09-30/rossiiskie-bpla-podesheveiut-na-chetvert-blagodarya-polimernym-dvigateliam"}, {"num": 25, "cat": "other", "catText": "其它动态", "title": "2026 年俄网络犯罪数量下降", "tag": "local", "tagText": "本地", "source": "РИА Новости / Lenta.ru", "time": "09-30 01:32", "summary": "РИА 报道，2026 年俄网络犯罪案件数量出现下降；同期（09-29）«Додо Пицца» 通报其 IT 系统遭网络攻击，零售与外卖体系的关键节点仍被命中。含义：宏观统计改善与企业级攻击并存，卖家的关键 SaaS（订单中台、ERP、结算与广告工具）灾备、账号权限与收款链路仍需按高频攻击假设演练，避免第三方服务中断联动造成订单与回款停滞。", "table": [["宏观趋势", "网络犯罪数量下降"], ["对照事件", "«Додо Пицца» IT 系统被攻击（09-28/29）"]], "sourceFull": "https://ria.ru/20260930/kiberbezopasnost-2121090752.html"}, {"num": 26, "cat": "other", "catText": "其它动态", "title": "俄数据中心能耗到 2030 年将增 76%，其中约 70% 增量来自 AI", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "09-29 10:30", "summary": "俄罗斯国家评级机构（НРА）测算，俄数据中心用电量到 2030 年将达 262 亿千瓦时，较 2025 年增长 76%，其中约 70% 的增量由人工智能驱动。含义：算力与电力成本上行将传导至云服务、SaaS 与平台技术服务的定价，卖家在选择订单中台、ERP、广告与数据服务商时，应把 2027—2030 年的续费涨幅纳入成本模型，并在合同中约定涨幅上限或提前锁定多年价格。", "table": [["2030 年用电量", "262 亿千瓦时"], ["增幅（对比 2025）", "+76%"], ["AI 贡献增量", "约 70%"]], "sourceFull": "https://www.kommersant.ru/doc/8989073"}]}
