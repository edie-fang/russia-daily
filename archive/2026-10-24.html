retail.ru/business/azhiotazh_na_fbs_mozhet_proyti_kak_menyaetsya_rynok_fulfilmenta/"}, {"num": 4, "cat": "ecom", "catText": "电商动态", "title": "WB 反对把税务监管职能移交平台：称无权力、无完整数据、非必要职能", "tag": "local", "tagText": "本地", "source": "Retail.ru / РБК", "time": "10-23 17:32", "summary": "针对「平台可在卖家税务义务确定前冻结商品卡」的提案，РВБ 税务风险方向总监 Назарова 明确反对：商业公司不具备税务监管权限与完整数据，纳税人不应监督另一纳税人，该职能对平台不必要；并称平台卖家纳税合规度与其他零售行业差异不大。该表态关系到平台未来能否以税务风险为由冻结或下架商品卡。", "table": [["表态方", "РВБ（WB+Russ）税务风险总监 Елена Назарова"], ["争议点", "税务义务确定前冻结卖家商品卡"], ["提案状态", "讨论中（立法进度待核实）"]], "sourceFull": "https://www.retail.ru/news/wildberries-vozrazil-protiv-peredachi-marketpleysam-funktsiy-nalogovogo-kontrolya-23-oktyabrya-2026-283660/"}, {"num": 5, "cat": "ecom", "catText": "电商动态", "title": "杜马经济政策委员会建议一读通过「俄产葡萄酒线上销售」实验：仅 Почта России、莫斯科+莫斯科州", "tag": "local", "tagText": "本地", "source": "New Retail / ТАСС", "time": "10-22 14:55", "summary": "国家杜马经济政策委员会建议一读通过政府 2023 年 4 月提交的俄产葡萄酒远程销售法案：试点在«Почта России»专属网站销售俄产葡萄酿造的葡萄酒（含加强型与起泡酒），范围限莫斯科与莫斯科州、参与自愿，政府可扩大地域。Минсельхоз 公布获准生产者名单与遴选规则，Росалкогольтабакконтроль 负责接入 ЕГАИС 与监管。", "table": [["法案提交", "2023-04（政府）"], ["试点平台", "АО «Почта России»"], ["范围", "莫斯科 + 莫斯科州（可扩、自愿）"], ["监管", "ЕГАИС / Росалкогольтабакконтроль"]], "sourceFull": "https://new-retail.ru/novosti/retail/v_gosdume_rekomendovali_odobrit_eksperiment_po_onlayn_prodazhe_vina/"}, {"num": 6, "cat": "ecom", "catText": "电商动态", "title": "仓库地产投资 9 个月 1,008 亿卢布（-21%）：莫斯科空置率 4.8%，资本化率 12-13%", "tag": "local", "tagText": "本地", "source": "Retail.ru / CORE.XP", "time": "10-23 09:31", "summary": "CORE.XP：1-9 月俄仓储地产投资 1,008 亿卢布，同比 -21%（去年同期 1,273 亿），不到 2024 年同期的一半；占地产投资 17%（去年 19%）。莫斯科 A 级空置率（含转租）4.8%，Big Box 859 亿、Light Industrial 149 亿（份额 15%），资本化率 12-13%。", "table": [["投资额（9个月）", "1,008 亿卢布（-21%）"], ["占地产投资比", "17%（去年 19%）"], ["莫斯科空置率", "4.8%（A 级含转租）"], ["资本化率", "12-13%"]], "sourceFull": "https://www.retail.ru/news/s-nachala-goda-investitsii-v-skladskuyu-nedvizhimost-rossii-sokratilis-na-21--23-oktyabrya-2026-283629/"}, {"num": 7, "c 道，乌军开始在空中引爆搭载杀伤元素的无人机，使防空拦截后的碎片具备杀伤力。此类战术会扩大地面附带损伤范围，对仓储、分拣与干线装卸等有人员在场的环节构成额外风险；目前尚无平台设施因此受损的通报（待核实）。", "table": [["战术变化", "空中引爆带杀伤元素无人机"], ["直接影响", "拦截碎片杀伤范围扩大"], ["平台设施受损", "暂无通报（待核实）"]], "sourceFull": "https://tass.ru/armiya-i-opk/28248681"}, {"num": 15, "cat": "politics", "catText": "时政要闻", "title": "特朗普威胁对俄乌同时加征 200% 关税", "tag": "local", "tagText": "本地", "source": "РБК", "time": "10-24 00:28", "summary": "特朗普公开放话，可能对俄罗斯与乌克兰商品加征 200% 关税。若落地，将影响俄对美出口链条与经第三国的转运安排，也会通过二级制裁预期抬高支付与航运合规成本；目前仍属表态阶段，尚无具体商品清单与生效时间（待核实）。", "table": [["关税威胁", "200%"], ["对象", "俄罗斯与乌克兰"], ["状态", "表态阶段，清单与时间待核实"]], "sourceFull": "https://www.rbc.ru/politics/24/10/2026/6adbc9df24f972147d188710"}, {"num": 16, "cat": "other", "catText": "其它动态", "title": "ВсеИнструменты：9 月绝缘材料 +59%、屋面 +35%，防水 +89%，冬季施工前置明显", "tag": "local", "tagText": "本地", "source": "Retail.ru / ВсеИнструменты.ру", "time": "10-23 21:35", "summary": "«ВсеИнструменты.ру»：2026 年 9 月俄民众购买绝缘材料同比 +59%、屋面材料 +35%、防水材料 +89%、防风与防潮膜 +34%、屋面配件（挡雪板、密封件、雨水斗）+81%、排水系统 +14%。入冬前施工与保温抢工带动建材需求，通常领先室内灯具与卫浴的翻新替换需求 1-2 个月。", "table": [["绝缘材料（9月）", "+59%"], ["屋面材料", "+35%"], ["防水材料", "+89%"], ["屋面配件", "+81%"]], "sourceFull": "https://www.retail.ru/news/vseinstrumenty-ru-v-rf-vyrosli-prodazhi-izolyatsionnykh-i-krovelnykh-materialov-23-oktyabrya-2026-283648/"}]}
