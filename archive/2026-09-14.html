{"date": "2026-09-14", "stats": {"total": 18, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "公众院（ОП）：平台将被要求公开商品搜索排序因子与卖家间的订单分配规则", "tag": "local", "tagText": "本地", "source": "塔斯社(ТАСС)", "time": "09-14 04:31", "summary": "塔斯社报道，俄公众院（Общественная палата）公众监督委员会成员叶夫根尼·马沙罗夫表示，电商平台将被要求明确披露其算法如何运作——具体包括哪些因素决定商品在搜索结果中的排序位置，以及订单在卖家之间如何分配。此举指向平台流量分配透明度：卖家长期无法获知排名规则与订单分配逻辑，导致定价、广告投放与履约方式的选择缺乏依据。若规则落地，平台需以可核查方式公布排序因子与订单分配机制，自然流量与广告位的相对价值可能被重估。条文、生效时间与适用范围尚未公布，待官方确认。", "table": [["表态人", "Евгений Машаров（ОП 公众监督委员会成员）"], ["要求 1", "明确商品搜索排序因子"], ["要求 2", "明确订单在卖家间的分配规则"], ["状态", "讨论中，条文与生效时间未公布"]], "sourceFull": "https://tass.ru/ekonomika/28108875"}, {"num": 2, "title": "企业界讨论物流设施反无人机规则，6-12 个月内或出行业标准", "tag": "local", "tagText": "本地", "source": "塔斯社(ТАСС)", "time": "09-14 04:08", "summary": "塔斯社报道，咨询公司 Umbrella Consulting Group 总经理兼管理合伙人基里尔·阿加波夫表示，企业界正在讨论物流设施防御无人机袭击的规则，预计未来 6-12 个月内将出现行业标准或试点的强制性要求，适用于物流枢纽（仓储、分拣与履约中心）。背景是 8 月以来 WB、Ozon 仓储设施持续遭无人机与导弹袭击，仓储安防、保险与合规成本随之上升。对卖家而言，标准出台可能提高平台仓与第三方仓的准入与费用门槛，同时改善货损赔付的责任界定；建议提前评估自有仓与海外仓的安防投入与保单条款。", "table": [["表态方", "Umbrella Consulting Group 总经理 Кирилл Агапов"], ["预计时间", "6-12 个月"], ["可能形式", "行业标准或试点强制要求"], ["适用对象", "物流枢纽：仓储/分拣/履约中心"]], "sourceFull": "https://tass.ru/ekonomika/28108863"}, {"num": 3, "title": "无人机袭击持续：12 日夜至 13 日晨击落 389 架，13 日白天再击落 140 架，多地机场反复限航", "tag": "local", "tagText": "本地", "source": "Vedomosti(Ведомости)、生意人报(Коммерсантъ)", "time": "09-13 21:14", "summary": "俄国防部通报，9 月 12 日夜至 13 日晨，防空力量在俄境内击落 389 架乌克兰无人机；13 日白天（8:00-20:00）再击落 140 架固定翼无人机，覆盖别尔哥罗德、布良斯克、卡卢加、库尔斯克、奥廖尔、罗斯托夫州及克里米亚与黑海水域。同日俄方通报打击敖德萨的物流中心 «Пальма»、«Raben-ukraine»、«Одесса-22» 与 «Новая почта» 枢纽以及尼古拉耶夫 «Новая» 变电站，并打击乌克兰西部铁路基础设施。9 月 13-14 日伏尔加格勒、克拉斯诺达尔、坦波夫、索契、马哈奇卡拉、弗拉季高加索、格罗兹尼等地机场多次实施临时起降限制，客货运输时效受到扰动。", "table": [["击落（12 日夜~13 日晨）", "389 架"], ["击落（13 日 8:00-20:00）", "140 架 / 7 州+克里米亚+黑海"], ["俄方打击目标", "敖德萨物流中心 ×3 + «Новая почта» 枢纽"], ["机场临时限航", "伏尔加格勒/克拉斯诺达尔/坦波夫/索契等 7 地"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/13/1228495-unichtozhili-140-bpla"}, {"num": 4, "title": "下卡姆斯克（鞑靼斯坦）遭袭：2 人死亡、伤者升至 14 人，侦查委员会以恐袭立案", "tag": "local", "tagText": "本地", "source": "俄新社(РИА Новости)、Vedomosti(Ведомости)", "time": "09-13 14:56", "summary": "9 月 13 日凌晨，鞑靼斯坦共和国下卡姆斯克市遭无人机袭击。据共和国政府通报，一架无人机坠机砸中停在民宅旁的汽车，车内 4 名年轻人中 2 人死亡、2 人重伤；民宅受损另致 4 人受伤，全市民用与工业设施合计受伤 12 人，共和国首脑新闻处稍后将伤者数字更新为 14 人（2 人重伤、1 人中等伤情）。市内一家工业企业起火，火被扑灭且生产流程未中断；共和国首脑明尼哈诺夫要求尽快消除后果、为受损住户提供临时住所并按天气及时修复窗户，市里开设临时安置点。俄侦查委员会已就该袭击以恐怖袭击条款刑事立案。", "table": [["死亡", "2 人（车内年轻人）"], ["受伤", "12 人 → 14 人（2 人重伤）"], ["受损", "民宅 + 工业企业起火（生产未中断）"], ["处置", "临时安置点、修复窗户、СКР 以恐袭立案"]], "sourceFull": "https://ria.ru/20260913/nizhnekamsk-2117429260.html"}, {"num": 5, "title": "特朗普要求乌克兰停止打击俄炼油厂：称全球柴油短缺由乌克兰冲突造成", "tag": "local", "tagText": "本地", "source": "生意人报(Коммерсантъ)、Vedomosti(Ведомости)", "time": "09-13 17:14", "summary": "《生意人报》《Vedomosti》与 Gazeta.ru 报道，美国总统特朗普要求乌克兰当局停止对俄罗斯炼油厂的打击，并称当前全球柴油与燃料短缺是乌克兰冲突造成的、而不是中东局势。他同期还表示美国“可能尝试控制伊朗的石油”，并威胁若美联储不降息美国将停止与部分国家的贸易。背景是乌方持续打击俄炼油与出口设施，已导致俄国内燃油紧张，列宁格勒州等地加油站排队、州内讨论单双号限购。若乌方减少对炼厂的打击，俄炼厂开工率与燃油供给或改善，燃料成本向干线运价的传导压力有望缓解。", "table": [["表态人", "美国总统特朗普"], ["要求", "乌方停止打击俄炼油厂"], ["归因", "全球柴油短缺系乌克兰冲突所致（非中东）"], ["同期表态", "称美“可能控制伊朗石油”、以贸易手段施压美联储"]], "sourceFull": "https://www.kommersant.ru/doc/8953746"}, {"num": 6, "title": "俄拟就民航安全威胁在欧安组织提出议题", "tag": "local", "tagText": "本地", "source": "生意人报(Коммерсантъ)", "time": "09-13 07:38", "summary": "《生意人报》报道，俄外交部无任所大使、常驻欧安组织代表处负责人波利扬斯基表示，俄方打算在欧安组织框架内提出乌克兰方面对民航安全构成的威胁。此前俄方已多次通报无人机残骸坠落与机场临时限航情况；9 月 13-14 日索契、伏尔加格勒、克拉斯诺达尔、坦波夫等地机场多次实施临时起降限制。把民航安全议题提交欧安组织，意味着俄方将空域与航班安全纳入外交议程，可能推动国际航空保险与航线风险评估的进一步调整，进而影响经俄领空航班的运价与时效安排。", "table": [["表态人", "Дмитрий Полянский（俄常驻 ОБСЕ 代表处负责人）"], ["议题", "乌方对民航安全的威胁"], ["同期", "9-13~14 多地机场临时限航"], ["影响面", "航班时效、航空保险与航线评估"]], "sourceFull": "https://www.kommersant.ru/doc/8953546"}, {"num": 7, "title": "佩斯科夫：俄美乌三方会谈有望在近期举行，阿联酋确认愿承办", "tag": "local", "tagText": "本地", "source": "Vedomosti(Ведомости)、生意人报(Коммерсантъ)", "time": "09-13 12:24", "summary": "《Vedomosti》与《生意人报》报道，俄总统新闻秘书佩斯科夫表示，俄方希望俄罗斯、美国与乌克兰的三方会谈能在可预见的未来举行，并称土耳其等国已提出承办场地；总统助理乌沙科夫透露阿联酋已确认愿意在其境内举办谈判，克宫认为阿布扎比是可接受的场地。佩斯科夫同时表示俄方尚未就美方提出的方案作出回应，俄方立场没有改变。此前一天，美方谈判代表库什纳称除领土问题外“大部分条款已谈妥”。会谈若在 10 月前后重启，将影响制裁预期、汇率与跨境结算的风险溢价。", "table": [["表态人", "Дмитрий Песков（俄总统新闻秘书）"], ["形式", "莫斯科—华盛顿—基辅三方会谈"], ["时间", "“可预见未来”，Vedomosti 口径称可能在 10 月"], ["场地", "阿联酋（已确认愿承办）、土耳其等"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/13/1228423-peskov-trehstoronnie-peregovori"}, {"num": 8, "title": "国家杜马选举 9-18~20：提前投票推进，远程电子投票申请 9-14 截止", "tag": "local", "tagText": "本地", "source": "俄新社(РИА Новости)、国际文传电讯社(Интерфакс)", "time": "09-14 02:26", "summary": "俄国家杜马第九届选举定于 9 月 18-20 日举行，境外与偏远地区的提前投票持续推进。堪察加边疆区选举委员会通报，已在海上与偏远地区完成 7103 名选民投票，涵盖边防舰艇、渔船与运输船船员、驯鹿队、矿山企业、气象站与灯塔等站点，提前投票结果将于 9 月 20 日公布。俄中央选举委员会主席帕姆菲洛娃表示，任何外部威胁都不会影响远程电子投票（ДЭГ）的实施；国际文传电讯社报道称 ДЭГ 参选申请将于 9 月 14 日截止。选举期间网络攻击、钓鱼与假冒选举机构的欺诈活动通常上升，经营数据与结算凭证的安全防护需加强。", "table": [["主要投票日", "2026-09-18 ~ 09-20（三天）"], ["提前投票", "堪察加已完成 7103 人（海上/极地/偏远）"], ["ДЭГ 申请截止", "2026-09-14"], ["选举机构表态", "外部威胁不影响 ДЭГ 实施"]], "sourceFull": "https://ria.ru/20260914/vybory-2117486584.html"}, {"num": 9, "title": "因埃博拉风险，俄在边境加强卫生检疫", "tag": "local", "tagText": "本地", "source": "俄新社(РИА Новости)", "time": "09-14 04:09", "summary": "俄消费者权益保护局局长波波娃向俄新社表示，因埃博拉病毒传播风险，俄已在边境加强卫生检疫：边防部门对所有来自疫区、包括经俄过境的入境公民信息实施严密监控与通报，一旦发现发热或其他健康异常即安排送医。她还表示，俄方研究机构自疫情初期即协助与刚果（金）接壤的乌干达开展防控，并向非洲同行提供了本国检测试剂，其中包括针对罕见 Bundibugyo 株的检测。对跨境物流与人员往来的影响取决于疫区名单与检疫措施的持续时间，经非洲或第三国中转的货代与商务出行需预留检疫时间。", "table": [["主管", "俄消费者权益保护局局长 Попова"], ["措施", "边境加强卫生检疫、入境监测与通报"], ["处置", "发热或健康异常者送医"], ["对外援助", "向乌干达提供检测试剂（含 Bundibugyo 株）"]], "sourceFull": "https://ria.ru/20260914/kontrol-2117490660.html"}, {"num": 10, "title": "Brent 单日上涨 3.16% 至 107.77 美元/桶：霍尔木兹航运协议会议无限期推迟", "tag": "local", "tagText": "本地", "source": "俄新社(РИА Новости)", "time": "09-14 01:34", "summary": "俄新社援引交易数据报道，9 月 14 日开盘后国际油价上涨 3.16%，布伦特（Brent）11 月期货升至 107.77 美元/桶，数据截至莫斯科时间 01:03。上涨的直接诱因是原定 9 月 14 日在阿曼萨拉拉举行、由波斯湾国家参加的会议被无限期推迟——该会议原拟宣布伊朗与阿曼就霍尔木兹海峡航运路线达成的协议，阿曼外长于当日凌晨宣布推迟。此前伊朗外长已否认霍尔木兹海峡即将开放。油价高位运行继续支撑卢布，同时抬升俄进口商品到岸成本与干线运输成本。", "table": [["Brent 11 月期货", "107.77 美元/桶（+3.16%）"], ["数据时间", "09-14 01:03 MSK"], ["诱因", "霍尔木兹航运协议会议无限期推迟"], ["背景", "沙特「东西」管道遇袭、霍尔木兹商船遇袭"]], "sourceFull": "https://ria.ru/20260914/neft-2117484510.html"}, {"num": 11, "title": "沙特「东西」输油管道遇袭：全球石油供应或减 4%，出口库存仅够 5-7 天", "tag": "local", "tagText": "本地", "source": "生意人报(Коммерсантъ)、Vedomosti(Ведомости)、РБК", "time": "09-13 21:54", "summary": "《生意人报》、《Vedomosti》与 RBC 援引路透社报道，沙特阿拉伯「东西」输油管道遭无人机袭击后，若未来数日无法恢复运行，用于出口的原油库存仅够维持 5-7 天，全球石油供应可能因此减少约 4%，管道修复预计需要较长时间。沙特外交部称该管道系被从伊拉克境内发射的无人机袭击，伊拉克方面已证实。叠加霍尔木兹海峡商船遇袭与红海—曼德海峡风险，全球海运与能源供应链溢价或将持续，运价与保险费率上行会逐级传导至俄进口商品成本与本地物价。", "table": [["受影响设施", "沙特「东西」（Восток — Запад）输油管道"], ["出口库存可维持", "5-7 天（Янбу 港）"], ["全球供应影响", "或减少约 4%"], ["归因", "自伊拉克境内发射的无人机（沙方口径）"]], "sourceFull": "https://www.kommersant.ru/doc/8953825"}, {"num": 12, "title": "列宁格勒州燃油短缺预计最早 10 月初缓解，州内讨论单双号限购", "tag": "local", "tagText": "本地", "source": "生意人报(Коммерсантъ)、国际文传电讯社(Интерфакс)", "time": "09-13 23:42", "summary": "《生意人报》报道，列宁格勒州州长德罗兹登科表示，州内加油站汽油短缺由近期无人机袭击大型炼油厂造成，形势预计不会早于 10 月初缓解；州内正在考虑实行按车牌尾号单双号隔日加油。同期大型石油公司表示将增加对该州的汽油供应，国际文传电讯社援引州政府新闻处称供应形势有望在 10 月初改善。燃油紧张直接推高干线运价并加大配送时效波动，对以圣彼得堡为运输节点的西北方向卖家到仓与派送影响最为明显，Q4 补货计划需按上浮运价与更长时效重排。", "table": [["影响区域", "列宁格勒州（西北联邦区）"], ["预计缓解", "不早于 2026-10-01"], ["拟采取措施", "单双号隔日加油；油企增供"], ["成因", "无人机袭击大型炼油厂"]], "sourceFull": "https://www.kommersant.ru/doc/8953836"}, {"num": 13, "title": "央行向国家再保险公司 РНПК 注资 1650 亿卢布：恐袭/破坏再保责任超 8 万亿卢布", "tag": "local", "tagText": "本地", "source": "生意人报(Коммерсантъ)", "time": "09-13 19:58", "summary": "《生意人报》报道，俄央行宣布对国内主要再保险公司——俄罗斯国家再保险公司（РНПК）注资 1650 亿卢布，专家与市场参与者认为这是当前形势下的必要举措：РНПК 在恐怖主义与蓄意破坏风险上的再保总责任已超过 8 万亿卢布，注资后资本仍不足 2000 亿卢布，即便计入央行此前提供的 7500 亿卢布担保，未来仍可能需要继续注资。该举措与电商仓储遇袭、无人机袭击常态化带来的赔付压力直接相关，对卖家而言意味着无人机险与货物险的承保能力有望改善，续保时应重新询价并核对抗恐袭、战争除外条款。", "table": [["注资金额", "1650 亿卢布"], ["注资对象", "РНПК（国家再保险公司）"], ["恐袭/破坏再保责任", "超 8 万亿卢布"], ["既有担保", "7500 亿卢布（央行）"]], "sourceFull": "https://www.kommersant.ru/doc/8953798"}, {"num": 14, "title": "俄统计局确认二季度 GDP 增长 1.3%、上半年增长 0.6%", "tag": "local", "tagText": "本地", "source": "生意人报(Коммерсантъ)", "time": "09-13 21:31", "summary": "《生意人报》报道，俄联邦统计局（Росстат）确认二季度 GDP 同比增长 1.3%、上半年增长 0.6%，与此前初值一致，未因后续数据修订而变化。在关键利率 14%、8 月年通胀 6.33%（当月出现 0.08% 通缩）的背景下，1.3% 的季度增速显示经济维持低速扩张，制造业与军工相关行业仍是主要支撑，消费与投资动能偏弱。对卖家而言，宏观增速温和意味着消费支出难以出现强劲反弹，旺季增长更依赖市场份额争夺与品类结构优化，而非大盘自然增长。", "table": [["二季度 GDP", "+1.3% 同比（确认值）"], ["上半年 GDP", "+0.6%"], ["关键利率 / 8 月年通胀", "14% / 6.33%"], ["数据源", "Росстат"]], "sourceFull": "https://www.kommersant.ru/doc/8953817"}, {"num": 15, "title": "政府批准 24 类食品价格监测清单，2027-01-01 起执行", "tag": "local", "tagText": "本地", "source": "俄新社(РИА Новости)、Lenta.ru", "time": "09-13 19:06", "summary": "俄新社报道，俄政府已批准需监测价格形成情况的食品清单，自 2027 年 1 月 1 日起实施，共 24 类：牛肉、猪肉、羊肉、鸡肉、鱼、黄油与葵花籽油、牛奶、奶酪、鸡蛋、糖、盐、面粉、面包、大米、荞麦、通心粉、土豆、甜菜、洋葱、胡萝卜、西红柿、黄瓜、卷心菜。获得数据查询权的机构包括农业部、工贸部、经济发展部、联邦反垄断局与统计局，将获取经营主体关于食品销售与供应、利润、收入与支出的数据。这是俄在年通胀高于目标背景下强化价格管理的新工具，食品零售与分销商需提前准备数据报送能力与合规成本预算。", "table": [["生效时间", "2027-01-01"], ["监测品类", "24 类食品"], ["授权机构", "农业部/工贸部/经济发展部/反垄断局/统计局"], ["报送内容", "销售供应、利润、收入与支出"]], "sourceFull": "https://ria.ru/20260913/pravitelstvo-2117461393.html"}, {"num": 16, "title": "1-8 月莫斯科新房需求下降 37.2%，莫斯科州下降 8.8%", "tag": "local", "tagText": "本地", "source": "生意人报(Коммерсантъ)", "time": "09-13 15:42", "summary": "《生意人报》报道，2026 年 1-8 月莫斯科州新建住房需求同比下降 8.8% 至 2.56 万笔交易，莫斯科市下降 37.2%，莫斯科州在总成交中的占比升至 65%。高利率环境下按揭成本高企、购房者向价格更低的近郊转移，是两级市场分化的主因。房地产与家装需求走弱，对由新房交付带动的家具、灯具与家用电器需求形成压制——对经营家具与灯具品类的卖家，该趋势应纳入 Q4 与明年上半年的需求判断与备货节奏。", "table": [["莫斯科市（1-8 月）", "-37.2% 同比"], ["莫斯科州（1-8 月）", "-8.8%（2.56 万笔）"], ["莫斯科州占比", "升至 65%"], ["成因", "高利率与按揭成本、需求外溢近郊"]], "sourceFull": "https://www.kommersant.ru/doc/8953705"}, {"num": 17, "title": "数字卢布养老金诈骗预警：央行与银行不会强制转换", "tag": "local", "tagText": "本地", "source": "俄新社(РИА Новости)", "time": "09-14 03:12", "summary": "俄新社援引“人民阵线”平台 «Мошеловка» 新闻处报道，诈骗分子近期大规模致电老年人，冒充央行或商业银行人员，称“养老金将被转为数字卢布”，并要求对方口述短信验证码以“确认拒绝转换”，一旦提供即可被划走资金。平台建议不要向任何人透露短信验证码、密码与登录名，并强调央行与商业银行从不会强制公民把资金转换为数字卢布，是否开立数字钱包完全自愿。数字卢布自 9 月 1 日起对 Android 用户开放，新支付形态上线期往往是诈骗高发期，卖家可在客服话术与店铺公告中提示买家防范。", "table": [["诈骗形式", "冒充央行/银行来电 + 索要短信验证码"], ["话术", "“养老金转为数字卢布，可申请拒绝”"], ["官方口径", "央行不强制转换，数字钱包自愿开立"], ["数字卢布开放", "2026-09-01（当前仅 Android）"]], "sourceFull": "https://ria.ru/20260914/moshenniki-2117487922.html"}, {"num": 18, "title": "俄开始向阿曼出口乘用车，同步拓展非洲与南美市场", "tag": "local", "tagText": "本地", "source": "俄新社(РИА Новости)", "time": "09-13 11:12", "summary": "俄新社报道，俄工贸部国务秘书兼副部长切库绍夫在采访中表示，俄已开始向阿曼出口乘用车；同时俄企正积极开拓非洲市场，例如向尼日尔、多哥供应矿物肥料，今年对阿根廷的产品出口也在增长。这是俄在西方制裁下推进出口方向多元化的一部分，汽车与化肥两大品类的新增市场有助于平衡传统出口渠道的萎缩。对以俄市场为主的整车与配件卖家而言，俄本土车企出口放量可能带来国内供给结构变化与零部件需求的联动效应。", "table": [["新出口方向", "阿曼（乘用车）"], ["其他新增", "尼日尔/多哥（矿物肥料）、阿根廷（增长）"], ["表态人", "Роман Чекушов（工贸部副部长）"], ["意义", "制裁下出口方向多元化"]], "sourceFull": "https://ria.ru/20260913/rossija-2117405328.html"}]}
