s://veved.ru/eburg/news/ekonomika/216334-61-mln-rublej-vydeljajut-na-zamenu-osveschenija-na-cheljabinskom-trakte.html"}, {"num": 11, "cat": "lighting", "catText": "灯具照明", "title": "弗拉基米尔木建筑博物馆照明采购二度被 УФАС 投诉叫停", "tag": "local", "tagText": "本地", "source": "Владимирские новости", "time": "11-27 12:00", "summary": "弗拉基米尔-苏兹达尔博物馆保护区对木建筑博物馆建筑泛光照明维修与加装的采购第二次被投诉叫停：11-23 重新发布的标的初始价逾 800 万₽，要求拆除旧灯具、灯架与 «Клетка» 结构，安装 1.5 m 与 6 m 高度投光灯、装饰灯并调光；因 «Оптима Плюс» 向 УФАС 投诉再次暂停，两周内第二次。", "table": [["标的", "建筑泛光照明维修/加装"], ["初始价", "逾 800 万₽"], ["状态", "УФАС 投诉，第二次暂停"], ["工期", "合同签订后 20 天"]], "sourceFull": "https://newsvladimir.ru/fn_2004115.html"}, {"num": 12, "cat": "beauty", "catText": "美妆个护", "title": "12-01 起 ГОСТ Р 72620-2026 素食化妆品标准生效", "tag": "local", "tagText": "本地", "source": "Аргументы и Факты", "time": "11-27 07:11", "summary": "俄新国标 ГОСТ Р 72620-2026《素食化妆品 通用技术条件》自 2026-12-01 生效，统一「vegan」宣称判定：不得含羊毛脂、蜂蜡、胶原蛋白、胭脂虫红等动物来源成分，生产者需按标准举证。此前素食宣称多靠自律，标准落地后包装标注须有依据，跨境美妆的成分表与宣称将受直接检验。", "table": [["标准号", "ГОСТ Р 72620-2026"], ["生效", "2026-12-01"], ["排除成分", "羊毛脂/蜂蜡/胶原/胭脂虫红等"], ["适用", "宣称素食的化妆品"]], "sourceFull": "https://aif.ru/society/novyy-gost-kosmetiku-vstupaet-v-silu-v-rossii"}, {"num": 13, "cat": "beauty", "catText": "美妆个护", "title": "«Лэтуаль»：母亲节前 3 天占 56% 美妆销售，香水套装最热", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "11-26 16:58", "summary": "«Лэтуаль» 与 «Флаувау» 数据显示，节前最后三天（含节日当天）贡献 56% 的节日美妆购买；2026 年 11 月上半月香水套装在线上与门店均为最畅销礼盒，其次为身体护理与彩妆套装；单品中香水、沐浴露、面膜与面霜需求最高。同期蛋糕订单同比 +30%，均价 3,491₽。", "table": [["节前 3 天占比", "56%"], ["最热礼盒", "香水套装"], ["蛋糕订单", "+30%"], ["蛋糕均价", "3,491₽"]], "sourceFull": "https://www.retail.ru/news/letual-i-flauvau-vyyasnili-kakie-tsvety-i-byuti-podarki-vybirayut-rossiyane-dlya-26-noyabrya-2026-284985/"}, {"num": 14, "cat": "beauty", "catText": "美妆个护", "title": "«Золотое яблоко» 改版返现：按等级自选品类、最高 3+4 类", "tag": "local", "tagText": "本地", "source": "RB.ru", "time": "11-25 10:00", "summary": "«Золотое яблоко» 上线新返现机制：登录用户每月末为下月自选返现品类（护肤、彩妆、亚洲美妆等），可获额外积分 综合法案"]], "sourceFull": "https://ria.ru/20261128/smartfon-2134554237.html"}, {"num": 18, "cat": "econ", "catText": "经济金融", "title": "政府批准电子产品技术费征收规则：12-01 起按 ГИСП 通知缴纳", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-27 22:16", "summary": "俄政府批准电子产品技术费（техсбор）计缴规则：企业经 «Честный знак» 提交上市通知，ГИСП 据此计算应缴额并通知，须在收到通知后 10 个工作日内缴清；逾期 1 天发提醒、7 天未缴则申请作废；多缴可按 НК 第 79 条退还；金额同步传 АИС «Налог-3»。费率按设备类型与是否入 «Честный знак» 分档（Минпромторг 令 13.10.2026 № 5366）。", "table": [["生效", "2026-12-01"], ["缴费期限", "通知后 10 个工作日"], ["计算", "маркировка + ГИСП"], ["费率依据", "Минпромторг № 5366（13.10.2026）"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/11/27/1416201-pravitelstvo-utverdilo-pravila"}, {"num": 19, "cat": "econ", "catText": "经济金融", "title": "俄禁止荞麦出口 6 个月：公布次日生效，ЕАЭС 除外", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-27 12:15", "summary": "俄政府出台荞麦临时出口禁令，自正式公布次日生效、为期 6 个月，旨在稳定国内食品市场；对 ЕАЭС 供货、政府决定的人道援助、政府间协议供货，以及阿布哈兹、南奥塞梯出口不适用。2021 年曾实施类似禁令（6-05 至 8-31）；今年荞麦产量约 70 万吨、同比增近 20%。", "table": [["期限", "6 个月"], ["生效", "公布次日"], ["豁免", "ЕАЭС/人道/政府间协议/阿布哈兹/南奥塞梯"], ["产量", "约 70 万吨（+近 20%）"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/11/27/1415947-eksport-grechihi"}, {"num": 20, "cat": "econ", "catText": "经济金融", "title": "俄拟把非友好国家海产品进口关税提至 35%", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-27 13:11", "summary": "财长 Силуанов 在联邦委员会表示，政府已起草决议草案，将非友好国家海产品进口关税提高至 35%，文件正在各部委会签；此前 11-25 财政部提议自 2027-01-01 起把海鲜珍品税率提至 15%。对以俄为市场的进口水产与相关加工品，成本将明显上升，替代来源与本地采购价值提高。", "table": [["拟提税率", "最高 35%"], ["适用", "非友好国家海产品"], ["状态", "决议草案会签中"], ["前案", "2027-01-01 起 15%（珍品）"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/11/27/1415982-poshlini-import"}, {"num": 21, "cat": "econ", "catText": "经济金融", "title": "贵金属集体大涨：金 +4%、银 +10%、铂 +8.3%", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-27 15:01", "summary": "Comex 12 月合约：黄金盘中 3,678.1 美元/oz（+4%，周涨逾 3%），白银 44.1 美元/oz（+10%），铂 1,346 美元/oz（+8.3%）；此前 11-25 金价一度跌至 3,484 美元（2025 年 8 月以来低位）后急速反弹。对以美元计价采购、以卢布销售的中国供货链，汇率与金属成本同时上行，需重算 12 月定价。", "table": [["黄金", "3,678.1 $/oz（+4%）"], ["白银", "44.1 $/oz（+10%）"], ["铂", "1,346 $/oz（+8.3%）"], ["周涨幅", "金 >3%"]], "sourceFull": "https://www.vedomosti.ru/investments/news/2026/11/27/1416035-zoloto-podorozhalo"}, {"num": 22, "cat": "econ", "catText": "经济金融", "title": "联邦委员会批准被动收入 НДФЛ 升至 13–22% 五档", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-27 14:09", "summary": "联邦委员会通过预算包中的税法修正：股息、存款利息、证券与数字权利交易、房产与股权转让、保险与赠与等被动收入，由现行 13%/15% 两档改为 13–22% 五档累进；财政部估计影响不超过 6% 人口（约 400 万人），参战津贴与北部补贴仍按 13%/15%；2027 年起银行可代扣存款利息税。", "table": [["税率", "13–22%（五档）"], ["覆盖", "股息/利息/证券/房产等"], ["影响人群", "≤6%（约 400 万）"], ["执行", "2027 年起银行代扣"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/11/27/1416025-sf-odobril"}, {"num": 23, "cat": "politics", "catText": "时政要闻", "title": "11-27 夜至 11-28 凌晨莫斯科方向 48 架无人机被击落，多机场限流", "tag": "local", "tagText": "本地", "source": "Коммерсантъ", "time": "11-28 03:30", "summary": "11-27 夜间至 11-28 凌晨莫斯科方向多轮无人机来袭：市长 Собянин 通报累计 48 架被击落（23:05 起分波通报，最后一波 02:24），残骸坠落点由应急部门处置；Внуково、Домодедово、Жуковский 限流并按协调运行，萨马拉、坦波夫、奔萨、萨拉托夫机场一度暂停或限流。俄国防部称 11-27 日间在四州击落 74 架。", "table": [["莫斯科方向", "48 架被击落"], ["机场", "Внуково/Домодедово/Жуковский 限流；萨马拉/坦波夫/奔萨/萨拉托夫受影响"], ["日间全国", "74 架（МО РФ）"], ["时段", "11-27 23:05~11-28 02:24"]], "sourceFull": "https://www.kommersant.ru/doc/9144905"}, {"num": 24, "cat": "politics", "catText": "时政要闻", "title": "普京在 Северодвинск 为 «Пермь» 核潜艇升旗：2030 年前再交 5 艘", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-27 19:27", "summary": "普京 11-27 在 Северодвинск 出席 «Пермь» 号核潜艇首次升海军旗仪式，宣布 2030 年前海军将再接收 5 艘战略核潜艇，其中 3 艘为 «Ясень-М» 项目；称 «Ясень» 级可在全球任意海域隐蔽执行任务、发射各型海基巡航导弹，并称 «Циркон» 已验证打击精度与威力。", "table": [["交付", "2030 年前 5 艘（3 艘 Ясень-М）"], ["新艇", "«Пермь» 升旗"], ["地点", "Северодвинск"], ["导弹", "«Циркон» 已验证"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/11/27/1416179-vmf-poluchit-raketonostsev"}, {"num": 25, "cat": "politics", "catText": "时政要闻", "title": "爱沙尼亚 12-01 起关闭俄爱口岸至少 6 个月，Ивангород 排队过夜", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-28 01:14", "summary": "爱沙尼亚政府 11-20 决定自 12-01 起关闭对俄口岸至少 6 个月，理由为安全（此前国防企业疑遭纵火）；11-27 夜间爱方放行缓慢，50 余人被迫在零下 5℃ 排队过夜，列宁格勒州调派大巴、开放夜间取暖点并安排住宿。俄方称此举是「政治疯狂」。对经波罗的海的陆路小包与样品通道构成直接中断。", "table": [["关闭时间", "2026-12-01 起，≥6 个月"], ["口岸", "俄爱边境（Ивангород/Нарва 方向）"], ["现状", "50+ 人排队过夜，州政府安置"], ["影响", "波罗的海陆路小包/样品通道中断"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/11/28/1416212-vlasti-lenoblasti-pomogli"}, {"num": 26, "cat": "politics", "catText": "时政要闻", "title": "匈牙利反对在 EU 预算中向乌克兰提供 1000 亿欧元", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-27 11:53", "summary": "匈牙利在欧盟预算谈判中反对向乌克兰提供 1000 亿欧元资金，成为 11-27 欧盟特别峰会预算谈崩的关键阻力之一；峰会未能就 2028–2034 七年预算达成一致，各国领导人拟在 12 月底再试。对俄市场而言，欧盟对乌资金与第 22 轮制裁节奏可能后移，短期政策不确定性延续。", "table": [["反对金额", "1000 亿€"], ["场合", "EU 特别峰会（11-27）"], ["结果", "七年预算未达成"], ["下一步", "12 月底再谈"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/11/27/1415931-vengriya-protiv"}]}
