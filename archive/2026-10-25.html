24 14:05", "summary": "建材连锁 «Петрович» 称建筑与装修材料约 60% 销售来自线上，工具类仍有三分之二在线下成交；需求结构从专业客户转向自己动手的业主。今夏电工类（электротовары）同比 +15-20%，装修材料、工具与工程设备 +6-8%，发电机近几个月需求增长 2-3 倍。近月线下占比回升 1-2 个百分点，但尚未形成稳定趋势。", "table": [["建材线上占比", "约60%"], ["电工类(夏季)", "+15-20%"], ["装修/工具/工程设备", "+6-8%"], ["发电机", "×2-3"], ["线下回升", "+1-2 п.п."]], "sourceFull": "https://www.retail.ru/news/petrovich-do-60-prodazh-stroymaterialov-prikhoditsya-na-internet-magazin-24-oktyabrya-2026-283673/"}, {"num": 8, "cat": "econ", "catText": "经济金融", "title": "Минэнерго：克里米亚及赫尔松、扎波罗热、ДНР、ЛНР 部分地区断电", "tag": "local", "tagText": "本地", "source": "«Ведомости»", "time": "10-24 21:30", "summary": "俄能源部通报，克里米亚以及赫尔松、扎波罗热两州和 ДНР、ЛНР 部分地区出现停电。南部与新区电网反复受损，直接波及当地仓储照明、冷库、分拣线与门店 POS 用电，配送与自提点可能出现断点；跨区调拨的干线时效还会受充电、加油与通信中断拖累。具体停电时长与恢复时间待核实。", "table": [["通报方", "Минэнерго"], ["日期", "2026-10-24"], ["范围", "克里米亚+赫尔松/扎波罗热/ДНР/ЛНР 部分地区"], ["待核实", "停电时长与恢复时间"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/10/24/1239850-obestochena-chast-krima"}, {"num": 9, "cat": "econ", "catText": "经济金融", "title": "特朗普：战后愿与俄乌恢复商务往来；普京确认同意重启俄美乌三方谈判", "tag": "local", "tagText": "本地", "source": "Интерфакс", "time": "10-25 02:35", "summary": "特朗普 10-25 对记者表示，希望俄乌达成协议后「与双方都做生意」，美方可能恢复与俄罗斯和乌克兰的商务关系；普京此前确认俄方同意重启俄美乌三方谈判，讨论最终和平协议后两国安全保障问题。目前均为表态，尚无解除制裁清单、时间表与支付通道安排（待核实），但方向性措辞已影响市场对结算与保险的预期。", "table": [["表态方", "特朗普 / 普京"], ["内容", "战后恢复商务·重启三方谈判"], ["状态", "表态阶段，无清单与时间表（待核实）"]], "sourceFull": "https://www.interfax.ru/world/1124815"}, {"num": 10, "cat": "politics", "catText": "时政要闻", "title": "别尔哥罗德市中心遭大规模无人机袭击：1 死 10 伤", "tag": "local", "tagText": "本地", "source": "Интерфакс", "time": "10-25 02:56", "summary": "别尔哥罗德市中心 10-25 凌晨遭大规模无人机袭击，造成 1 人死亡、10 人受伤（州长通报口径，伤亡数字以官方后续更新为准）。同一夜间该州另一轮袭击致 1 死 2 伤；利佩茨克一处停车场因残骸坠落多车起火。边境州的仓储、门店与自提点运营风险继续上升。", "table": [["地点", "别尔哥罗德市中心"], ["时间", "2026-10-25 凌晨"], ["伤亡", "1 死 10 伤"], ["同期", "州内另 1 死 2 伤；利佩茨克车辆起火"]], "sourceFull": "https://www.interfax.ru/russia/1124819"}, {"num": 11, "cat": "politics", "catText": "时政要闻", "title": "喀山、萨马拉、乌里扬诺夫斯克、切博克萨雷机场暂停起降", "tag": "local", "tagText": "本地", "source": "Интерфакс", "time": "10-25 02:40", "summary": "10-25 凌晨喀山、萨马拉、乌里扬诺夫斯克、切博克萨雷四座机场暂停航班起降；此前下诺夫哥罗德、坦波夫机场亦一度停止服务，奔萨与萨拉托夫随后恢复正常。空域管制会连带影响航空货运与跨境小包的空运段，旺季补货若走空运需预留 1-2 天缓冲。", "table": [["暂停", "喀山/萨马拉/乌里扬诺夫斯克/切博克萨雷"], ["已恢复", "奔萨、萨拉托夫"], ["时间", "2026-10-25 凌晨"]], "sourceFull": "https://www.interfax.ru/russia/1124816"}, {"num": 12, "cat": "politics", "catText": "时政要闻", "title": "布良斯克州一辆小巴遭无人机袭击，2 人死亡", "tag": "local", "tagText": "本地", "source": "Интерфакс", "time": "10-24 21:12", "summary": "布良斯克州 10-24 晚一辆小巴遭无人机袭击，造成 2 人死亡（州方通报）。袭击点位于边境州公路运输线上，说明无人机打击目标已从固定仓储设施扩散到移动运输目标；跨区干线运输的夜班车次、司乘与随车货物风险同步上升。", "table": [["地点", "布良斯克州"], ["时间", "2026-10-24 21:12"], ["伤亡", "2 死"], ["目标类型", "公路小巴（移动目标）"]], "sourceFull": "https://www.interfax.ru/russia/1124798"}]}
