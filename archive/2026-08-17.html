{"date": "2026-08-17", "stats": {"total": 18, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "俄电商协会(AКИТ)致信总理：提交10项措施支持遭乌军袭击受损卖家", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-17 05:02", "summary": "俄电商协会AКИТ向总理米舒斯京提交信函，提出10项优先支持措施（税务/金融/行政/保险）：损失商品计入亏损、免除恢复增值税、税费社保延期分期、优惠贷款及预算直补。背景为7月乌军袭击WB 11个仓储中心、8/16波多利斯克仓库再遭袭。若落地将改善受损卖家资金链，电商从业者应跟踪细则。", "table": [["措施数量", "10项（税务/金融/行政/保险）"], ["收件人", "总理米舒斯京"]], "sourceFull": "https://ria.ru/20260817/mery-2111265345.html"}, {"num": 2, "title": "WB波多利斯克物流中心遭无人机袭击起火，订单收发转至其他设施", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-16 13:37", "summary": "WB波多利斯克物流设施因袭击起火，公司称已提前疏散、无人员伤亡，订单收发已转移至其他设施，物流链重构；同日乌军对莫斯科方向发动两年最大规模无人机袭击（Lenta报道），莫斯科州多处受损。仓库袭击频发持续推高俄电商履约风险与物流成本，卖家需关注仓库选址分散与库存保险。", "table": [["事件", "波多利斯克物流中心遭袭起火"], ["应对", "收发转其他设施，物流链重构"]], "sourceFull": "https://ria.ru/20260816/pozhar-2111174287.html"}, {"num": 3, "title": "俄毛绒质感配件销售暴涨：毛皮化妆包上半年同比+8.5倍", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-15 11:17", "summary": "Ozon Селект数据分析：2026上半年俄毛皮化妆包销量同比增长8.5倍，人造毛皮手袋+1.5倍、毛绒手拿包+1.7倍；毛绒质感（плюшевая текстура）成为俄消费新趋势，配件/家居装饰类目可关注这一风格化需求。", "table": [["毛皮化妆包", "+8.5倍（同比）"], ["人造毛皮手袋/毛绒手拿包", "+1.5倍/+1.7倍"]], "sourceFull": "https://ria.ru/20260815/aksessuar-2111053705.html"}, {"num": 4, "title": "俄累计封锁超3.4万个销售违禁膳食补充剂(БАД)的网站", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-17 03:09", "summary": "Rospotrebnadzor通报：已累计封锁超3.4万个销售违禁БАД的互联网资源，含未注册产品及含危险成分NMN胶囊等；建议消费者仅从官方渠道购买并核验注册文件。此前AKIT已要求平台下架危险减肥类БАД，健康品类监管持续收紧，相关类目卖家需确保产品注册合规。", "table": [["封锁网站数", "超3.4万个"], ["监管机构", "Rospotrebnadzor"]], "sourceFull": "https://ria.ru/20260817/sayt-2111262498.html"}, {"num": 5, "title": "俄国家杜马选举候选人登记工作结束，9月选举进入冲刺阶段", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-17 00:02", "summary": "俄中央选举委员会完成9月国家杜马选举候选人登记，各政党名单与单席选区候选人确定。选举前政策节奏（含消费补贴、汇率、电商监管类议题）通常加快，市场可关注竞选期的政策承诺对零售消费与中小企业扶持的潜在影响。", "table": [["节点", "候选人登记结束"], ["选举时间", "2026年9月"]], "sourceFull": "https://tass.ru/politika/28017243"}, {"num": 6, "title": "千岛群岛摩擦进展：俄媒批评日本首相就普京视察反应过激", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-17 02:07", "summary": "Strategic Culture刊文称日本首相高市早苗无权就普京视察千岛群岛抗议，指东京持续篡改历史事实；此前日本政府表示正酝酿反制措施（8/14已收录）。日俄围绕南千岛群岛摩擦持续，对俄远东开发外资节奏的影响需跟踪，对中俄贸易直接冲击有限。", "table": [["事件", "普京视察千岛群岛"], ["日方反应", "首相抗议，俄媒反击"]], "sourceFull": "https://ria.ru/20260817/putin-2111261040.html"}, {"num": 7, "title": "莫交所9月将推出比特币和以太坊永续期货", "tag": "local", "tagText": "本地", "source": "国际文传电讯社(Interfax)", "time": "08-17 00:07", "summary": "莫交所宣布9月推出BTC与ETH永续期货合约，此前央行已将加密资产纳入交易所公开交易清单、并发布专业参与者审慎监管草案（8/14已收）。俄加密衍生品市场加速成型，为跨境支付结算与投资配置提供新工具，但监管细则仍在完善中。", "table": [["新品", "BTC/ETH永续期货"], ["上线时间", "2026年9月"]], "sourceFull": "https://www.interfax.ru/russia/1109637"}, {"num": 8, "title": "媒体：中东石油出口商正秘密经霍尔木兹海峡运油", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-17 01:16", "summary": "Bloomberg援引消息人士：中东石油出口商正以隐蔽方式经霍尔木兹海峡运输原油，规避地区局势风险；此前伊朗称霍尔木兹污染累计损失达数万亿美元（8/15已收）。全球油市风险溢价维持高位，油价波动对俄出口收入与卢布汇率构成支撑。", "table": [["信源", "Bloomberg援引消息人士"], ["背景", "霍尔木兹局势紧张"]], "sourceFull": "https://ria.ru/20260817/neft-2111259339.html"}, {"num": 9, "title": "上半年欧盟对俄葡萄酒出口+8%至2.397亿欧元，意大利为最大供应国", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-15 11:52", "summary": "Eurostat数据：2026上半年欧盟对俄葡萄酒出口2.397亿欧元（同比+8%），6月单月3910万欧元（环比+3%、同比-8%）；意大利6月对俄出口1550万欧元（环比+21%、同比+8%）居首。俄进口消费回暖下酒类进口恢复增长，进口商可关注欧盟供应格局变化。", "table": [["上半年出口额", "2.397亿欧元（+8%）"], ["6月最大供应国", "意大利1550万欧元"]], "sourceFull": "https://ria.ru/20260815/vino-2111059987.html"}, {"num": 10, "title": "6月俄对欧盟鱼类出口同比+1.7倍至7490万欧元，创2024年11月以来新高", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-16 10:40", "summary": "Eurostat数据：6月俄对欧盟鱼类出口7490万欧元（同比+1.7倍），创2024年11月以来最高；主要买家为德国、法国、荷兰、波兰、丹麦，以冷冻狭鳕/鳕鱼片为主。俄农产品对欧出口边际回暖，出口通道与结算仍是关键变量。", "table": [["6月出口额", "7490万欧元（+1.7倍）"], ["主要买家", "德法荷波丹"]], "sourceFull": "https://ria.ru/20260816/ryba-2111186382.html"}, {"num": 11, "title": "7月俄新房销售同比-7.6%，莫斯科/克拉斯诺达尔跌幅最大", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-16 15:48", "summary": "ЦИАН数据：7月俄签订4.15万份新房合同（同比-7.6%），百万人口城市-9.6%；Dataflat.ru统计销售-9.1%至4.05万套；莫斯科与克拉斯诺达尔均-38%，主因家庭房贷收紧与房价高企。住宅走弱反映居民购买力承压，家居/家电等地产后周期品类需求或受拖累。", "table": [["7月新房合同", "4.15万份（-7.6%）"], ["莫斯科/克拉斯诺达尔", "-38%"]], "sourceFull": "https://www.kommersant.ru/doc/8890082"}, {"num": 12, "title": "俄物流公司请求对雀巢5家俄子公司引入临时管理，业务估值1600-1700亿卢布", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-17 01:17", "summary": "\"КС Логистика\"致信普京，请求对雀巢俄5家子公司（Нестле Россия/Кубань/Сириал Партнерс Рус等）引入临时管理，理由为停止出口俄产商品且无扩产计划；政府年底前评估，雀巢称未收到官方问询、工厂持续运营。若落地将影响食品快消市场格局。", "table": [["雀巢俄业务估值", "1600-1700亿卢布"], ["评估时间", "政府年底前"]], "sourceFull": "https://www.kommersant.ru/doc/8890807"}, {"num": 13, "title": "俄9月或现新一轮燃料短缺：炼厂检修叠加白俄供应骤降", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-17 01:58", "summary": "消息人士：9月俄大型炼厂计划检修叠加白俄新波洛茨克炼厂检修，燃料供应或再承压；白俄7月对俄燃料出口创纪录（汽油21.2万吨）后8月骤降（铁路出货仅2.1万吨vs前段16.5万吨），缺口或由印度进口补充。燃料价格与物流成本上行风险延续。", "table": [["7月白俄对俄出口", "汽油21.2万吨创纪录"], ["8月铁路出货", "骤降至2.1万吨（汽油）"]], "sourceFull": "https://www.kommersant.ru/doc/8890827"}, {"num": 14, "title": "俄私人投资者持有黄金超10.8吨", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-17 00:22", "summary": "塔斯社援引交易所数据：俄私人投资者投资组合中黄金持有量超10.8吨。央行放开个人黄金投资渠道后，黄金避险配置持续升温，反映高利率与地缘不确定性下居民资产配置加速转向硬资产；贵金属零售与投资品（金条/金币）类目需求或受此带动，对贵金属饰品及礼品类目卖家构成利好。", "table": [["私人黄金持有", "超10.8吨"]], "sourceFull": "https://tass.ru/ekonomika/28017245"}, {"num": 15, "title": "调查：超10%俄人网银密码泄露后蒙受资金损失，人均1.84万卢布", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-16 07:10", "summary": "Выберу.ру调查：密码泄露的俄人中超10%遭资金损失，近一个月平均损失1.84万卢布；31%因点击钓鱼链接泄露密码、24%主动向电话诈骗者透露验证码。网络金融安全风险高发，平台与卖家需加强买家防诈提示与交易风控。", "table": [["资金损失比例", ">10%"], ["人均损失", "1.84万卢布"]], "sourceFull": "https://ria.ru/20260816/dengi-2111166791.html"}, {"num": 16, "title": "俄疗愈泥在中国走红：РЭЦ称需求持续增长，天然成分美妆出口机会扩大", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-15 10:12", "summary": "РЭЦ总经理尼基申娜在天津\"俄罗斯制造\"展销节表示，俄罗斯疗愈泥（грязь）在中国消费者中人气上升，含护肤泥类产品需求增长；展销节同期设直播带货工作室。俄天然成分美妆/护肤产品对华出口机会扩大，俄美妆品牌可借\"天然/疗愈\"定位拓展中国市场。", "table": [["渠道", "天津展销节+直播带货"], ["趋势", "疗愈泥在华需求增长"]], "sourceFull": "https://ria.ru/20260815/rossija-2111048026.html"}, {"num": 17, "title": "俄大型电子产品供应商被曝借税务抵扣骗局获利约10亿卢布", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-16 17:25", "summary": "Lenta报道：俄大型电子产品供应商通过税务抵扣（налоговые вычеты）骗局牟利约10亿卢布，涉虚报抵扣申报。电子品类供应链税务合规风险曝光，跨境卖家与本土渠道商需关注税务申报规范性（正文细节待进一步核实）。", "table": [["涉案金额", "约10亿卢布"], ["手法", "税务抵扣骗局"]], "sourceFull": "https://lenta.ru/news/2026/08/16/nalogi-vychety/"}, {"num": 18, "title": "灯具栏目：本期无新增重大动态", "tag": "local", "tagText": "本地", "source": "综合检索", "time": "08-17 10:00", "summary": "2026年8月15-17日窗口内，RIA/Lenta/TASS/Interfax/Kommersant检索（含светильник/освещение/LED/лампы关键词）未见俄罗斯灯具照明市场的新增重大新闻。按去重规则标注：本期无新增重大动态，不填充旧信息。", "table": [], "sourceFull": ""}]}
