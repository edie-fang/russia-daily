{"date": "2026-08-16", "stats": {"total": 18, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "Ozon主应用及Ozon Fresh/Seller/Travel被Google Play下架，Ozon称未违规且不受制裁限制", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "08-15 00:25", "summary": "Ozon确认主应用及Ozon Fresh、Ozon Seller、Ozon Travel已从Google Play下架（搜索不可见），Ozon Bank应用8月12日先被下架。Ozon回应：未违反平台规则、应用不受制裁限制，建议安卓用户从RuStore/AppGallery/Galaxy Store下载，App Store与App Gallery正常。俄头部电商安卓分发渠道生变，需关注买家端安装路径变化。", "table": [["下架应用", "Ozon/Ozon Fresh/Ozon Seller/Ozon Travel（Ozon Bank于8/12先下架）"], ["替代渠道", "RuStore/AppGallery/Galaxy Store"], ["iOS渠道", "App Store正常"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/08/15/1221325-ozon-podtverdil-udalenie"}, {"num": 2, "title": "俄外交部报告：7月乌军蓄意袭击WB 11个大型仓储物流中心", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-14 13:29", "summary": "俄外交部特使米罗什尼克报告：7月乌军蓄意袭击Wildberries 11个大型仓储物流中心，数十万平方米仓储面积被烧毁、数百台设备与数十栋设施损毁。此前WB仓库遭袭已致超1100万册图书烧毁，官方口径首次给出7月袭击总数，平台卖家损失评估持续发酵。", "table": [["袭击仓库数(7月)", "11个大型仓储物流中心"], ["烧毁面积", "数十万平方米"], ["损毁", "数百台设备、数十栋设施"]], "sourceFull": "https://ria.ru/20260814/sklad-2110889341.html"}, {"num": 3, "title": "俄市场睡眠用品销售Q2环比+122%（件）/+95%（额）", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-15 04:02", "summary": "据RIA引大型平台数据：2026年Q2俄睡眠用品销售环比Q1增长122%（件数）和95%（金额）；双层床+500%（件）/710%（额）、床垫保护垫+800%/+280%、床垫+229%/+242%、矫形枕+157%/+253%；5万人口以下小城镇增长最明显。睡眠/家居品类为平台电商高增长细分。", "table": [["Q2环比", "+122%（件）/+95%（额）"], ["双层床", "+500%/+710%"], ["床垫保护垫", "+800%/+280%"], ["矫形枕", "+157%/+253%"]], "sourceFull": "https://ria.ru/20260815/tovary-2111026758.html"}, {"num": 4, "title": "开学季：俄学校用品销售同比-2%~-17%，基础套装成本+11%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-14 18:56", "summary": "Платформа ОФД统计（6月1日-8月10日）：俄开学用品销量普遍下滑，日记本-17%、书包-15%、校服-13%、童裤裙-10%、衬衫-7%、笔袋文具-2%；基础入学套装成本同比+11%至1.87万卢布；СберИндекс显示8/3-8/9文具消费-10.1%。主因入学人数下降与消费者节省，开学季消费趋弱对文具服饰类目构成压力。", "table": [["日记本/书包/校服", "-17%/-15%/-13%"], ["基础套装成本", "1.87万卢布（+11%）"], ["文具周消费(8/3-8/9)", "-10.1%"]], "sourceFull": "https://www.kommersant.ru/doc/8890022"}, {"num": 5, "title": "诈骗团伙借'在线服务故障补偿'钓鱼，瞄准运营商与银行APP用户", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-16 00:35", "summary": "社交媒体出现定向广告，以运营商/银行APP故障'补偿'诱导用户填写银行卡信息与短信验证码；反诈平台Мошеловка提醒：官方补偿仅通过APP个人账户发布，切勿在第三方页面输入个人信息。近期Ozon等应用下架后此类钓鱼高发，跨境卖家需提示买家防骗。", "table": [["手法", "社媒广告诱导输卡号+短信码"], ["官方提醒", "补偿仅经APP个人账户发布"]], "sourceFull": "https://ria.ru/20260816/moshenniki-2111153416.html"}, {"num": 6, "title": "东方经济论坛(ВЭФ)9月1-4日举行，普京将发表重要政策讲话", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "08-15 11:57", "summary": "克宫顾问、组委会责任秘书科比亚科夫表示，普京在东方经济论坛上的讲话将包含大量重要声明，建议西方关注。论坛9月1-4日在符拉迪沃斯托克远东联邦大学校园举行，主题'远东——为人民发展'，70余场活动分5大板块（民生、私人投资、国际协作、未来技术、物流基建）。远东政策与外贸物流走向为市场关注焦点。", "table": [["时间地点", "9月1-4日/符拉迪沃斯托克"], ["论坛主题", "远东——为人民发展"], ["规模", "70+场/5大板块"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/08/15/1221356-kobyakov-rekomendoval"}, {"num": 7, "title": "日本酝酿对普京视察千岛群岛采取反制措施", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "08-14 07:17", "summary": "普京8月13日视察伊图鲁普岛后，日本政府表示正考虑反制措施；此前日本曾对涉千岛项目（含与中企合作项目）实施制裁。日俄围绕南千岛群岛摩擦升级，或影响俄远东开发的外资与物流合作节奏。", "table": [["事件", "普京8/13视察伊图鲁普岛"], ["日方反应", "考虑反制措施"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/08/14/1221089-yaponiya-rassmotrit"}, {"num": 8, "title": "莫交所9月14日起主交易时段提前至9:00，总时长延至10小时", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-14 19:37", "summary": "莫交所宣布9月14日起股票/衍生品/外汇市场主要交易时段提前1小时至9:00开市，总时长达10小时（现主时段10:00-19:00，另7:00-10:00受限早盘）；交易所总裁日德科夫称将丰富投资策略、引入机构流动性，便利西伯利亚与远东投资者；专家提示流动性稀释与波动上升风险。", "table": [["新开市时间", "9:00（9月14日起）"], ["主时段总长", "10小时"], ["早盘限制", "现7:00-10:00仅限高流动性标的"]], "sourceFull": "https://www.kommersant.ru/doc/8890044"}, {"num": 9, "title": "7月卢布实际有效汇率环比-4.7%", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "08-14 17:59", "summary": "央行数据：7月卢布实际有效汇率（对贸易伙伴国货币篮子）环比下降4.7%，反映卢布名义走弱与通胀差；8月以来场外美元已升破85卢布（5个月新高）。实际有效汇率走弱改善俄出口竞争力，但推升进口成本与通胀压力。", "table": [["7月REER环比", "-4.7%"], ["场外美元(8/14)", "升破85.14卢布"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/08/14/1221278-realnii-kurs-rublya"}, {"num": 10, "title": "上半年俄化肥对欧盟出口降3.9倍至2.979亿欧元", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "08-14 22:52", "summary": "Eurostat数据：2026上半年俄对欧盟化肥出口降至2.979亿欧元（降约3.9倍），其中混合肥1.427亿、钾肥1.119亿、氮肥4290万、有机肥仅47.4万欧元；6月单月9397万欧元（同比-3.5倍、环比+1.6倍，去年12月以来新高），斯洛文尼亚（2950万）为最大进口国，其后德国/保加利亚/波兰。俄化肥对欧通道收缩但月度边际回升。", "table": [["上半年对欧出口", "2.979亿欧元（降3.9倍）"], ["6月单月", "9397万欧元（-3.5倍同比）"], ["6月最大进口国", "斯洛文尼亚2950万欧元"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/08/14/1221320-eksport-udobrenii-upal"}, {"num": 11, "title": "莫斯科/莫斯科州/库尔斯克州8边境区8月15日起禁止挖矿至2032年底", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "08-15 15:44", "summary": "依据米舒斯京7月31日签署的政府令，8月15日至2032年12月31日禁止在莫斯科、莫斯科州及库尔斯克州8个边境区（别洛夫斯基、格卢什科夫斯基等）与利戈夫市进行加密货币挖矿及参与矿池；背景为7月下旬俄通过加密资产与数字权利监管法。禁令反映能源紧平衡下对高耗电产业的管控。", "table": [["生效期", "2026-08-15至2032-12-31"], ["范围", "莫斯科/莫斯科州/库尔斯克州8区+利戈夫市"], ["法规背景", "7/24联邦委员会通过加密资产法"]], "sourceFull": "https://www.vedomosti.ru/technology/news/2026/08/15/1221378-zapret-maining"}, {"num": 12, "title": "伊朗评估霍尔木兹石油污染累计损失达数万亿美元", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "08-15 19:50", "summary": "伊朗外交部发言人巴加伊称：数十年来霍尔木兹海峡石油泄漏累计损失达数万亿美元，波斯湾与阿曼海水域受污染；近期格什姆岛近海再发现污染（疑似外籍干货船泄漏），并质问应由能源消费者、保险公司还是区域军事活动方赔偿。8月14日特朗普称'美伊冲突结束后霍尔木兹将成为美国领土'。油价自8/14起止跌回升。", "table": [["累计损失评估", "数万亿美元"], ["新污染点", "格什姆岛近海（疑似外籍船泄漏）"], ["特朗普表态(8/14)", "战后霍尔木兹归美"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/08/15/1221396-uscherb-zagryazneniya-ormuza"}, {"num": 13, "title": "中国Sea Legend开通北极航线(NSR)至欧洲首条定期航线", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "08-15 18:22", "summary": "据WSJ：中企Sea Legend宣布开通北极航线（北方海路）至欧洲首条定期航线'Arctic Express'，Dubai Tower轮从宁波至英国费利克斯托，运力1740 TEU；去年试航约20天（约为好望角航线一半）；2026年计划8-10月执行8个航次，8月8日俄原子能集团已发放通行许可。北极航线保险成本高约40%，仍处商业化早期。", "table": [["航线", "宁波→费利克斯托（Arctic Express）"], ["运力", "1740 TEU"], ["2026计划", "8-10月8个航次"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/08/15/1221389-reis-po-sevmorputi"}, {"num": 14, "title": "7月欧盟采购俄燃料15亿欧元，欧盟仍是俄LNG最大买家（49%）", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "08-14 14:53", "summary": "CREA数据：7月欧盟采购俄燃料15亿欧元，其中管道气38%（5.61亿）、LNG 36%（5.26亿）、友谊管道原油26%；欧盟为俄能源第四大买家（次于中印土），但仍是俄LNG最大买家（占俄LNG出口49%，中国23%、日本18%、韩国6%）；俄原油出口收入环比+1%至日均3.92亿欧元。能源出口结构东移但LNG仍高度依赖欧市。", "table": [["7月欧盟采购额", "15亿欧元"], ["结构", "管道气38%/LNG 36%/原油26%"], ["俄LNG占欧盟进口份额", "49%"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/08/14/1221216-es-zakupil"}, {"num": 15, "title": "俄政府：10个地区加油站燃料供应仍紧张，ФАС查处价格虚高", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "08-14 19:34", "summary": "俄政府燃料市场会议（诺瓦克主持，能源部/农业部/ФАС/远东发展部等参加）：奥伦堡、利佩茨克、特维尔、奥廖尔、图瓦、克拉斯诺达尔、哈卡斯、外贝加尔、滨海、克拉斯诺亚尔斯克等地加油站燃料供应仍复杂；石油公司正加大向问题地区供货；农业用油充足、北方海运补给按计划；ФАС发现部分区域油价虚高并立案。燃料紧张影响物流配送成本与电商履约。", "table": [["紧张地区", "奥伦堡/利佩茨克/特维尔等10个地区"], ["ФАС动作", "发现价格虚高并立案"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/08/14/1221306-o-slozhnoi-situatsii"}, {"num": 16, "title": "美妆连锁'Золотое яблоко'仓库经理涉叛国罪被莫斯科法院羁押", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-13 16:39", "summary": "莫斯科梅尚斯基区法院8月12日对俄大型美妆连锁'Золотое яблоко'仓库经理科洛季采取羁押措施（叛国罪，刑法275条）；此人此前多次因轻微流氓行为被行政拘留15天。涉事为基层员工，对公司经营影响待观察；美妆渠道合规与员工背景审查或成行业关注点。", "table": [["羁押", "8/12，梅尚斯基区法院"], ["罪名", "叛国罪（刑法275条）"]], "sourceFull": "https://ria.ru/20260813/sud-2110718132.html"}, {"num": 17, "title": "电器栏目：本期无新增重大动态", "tag": "local", "tagText": "本地", "source": "综合检索", "time": "08-16 10:00", "summary": "2026年8月14-16日窗口内，RIA/Lenta/TASS/Kommersant/Vedomosti检索（含электроника/бытовая техника/М.Видео/Ситилинк关键词）未见俄罗斯电器（家电数码）市场的新增重大新闻。按去重规则标注：本期无新增重大动态，不填充旧信息。", "table": [], "sourceFull": ""}, {"num": 18, "title": "灯具栏目：本期无新增重大动态", "tag": "local", "tagText": "本地", "source": "综合检索", "ti
