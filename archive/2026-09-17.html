{"date": "2026-09-17", "stats": {"total": 27, "local_pct": "96%", "cn_pct": "0%", "en_pct": "4%"}, "items": [{"num": 1, "title": "Ozon 启动首批保险赔付：首日 5 万受损卖家到账，尾款由 Ингосстрах 20 日内补付", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)", "time": "09-16 17:29", "summary": "Ozon 已开始向商品在遇袭设施中受损的卖家发放预付款，涉及恰帕耶夫斯克、埃涅姆、马哈奇卡拉三处设施。公司称首日即有 5 万名卖家收到款项，其余卖家本周内到账，无需提交申请或补充文件；预付款金额取决于卖家在受损设施中的商品数量，最终金额待盘点完成后确定，个人中心将公示受损商品清单与理赔申请入口，由 Ингосстрах 在文件确认后 20 日内补付尾款；若商品已毁损而保费仍继续扣缴，Ozon 将退还多收部分。这是平台仓储遇袭后首个成规模的赔付落地案例。", "table": [["首日获赔卖家", "50,000 家"], ["涉及设施", "Чапаевск / Энем / Махачкала"], ["是否需要申请", "否（无需文件）"], ["尾款时限", "文件确认后 20 日内"], ["承保方", "Ингосстрах"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/09/16/1229371-o-pervih-viplatah"}, {"num": 2, "title": "平台经济修正案细则公布：卖家可自设最低价、拒绝平台补贴降价且不得被降权", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-16 17:39", "summary": "俄经济发展部公布平台经济法与消费者权益保护法修正案草案（已挂规范性文件门户）：禁止对俄卖家与外国卖家适用不同服务报酬；卖家可设定最低售价并拒绝由平台承担的降价补贴，且不得因此被降低评分、搜索排名或限制后台访问；平台须核查合作方与自提点经营者资质；商品卡内容须在上架前由平台核验；政府有权设定结算与回款的最长时限。草案直指佣金差异、平台自主补贴与结算变更等新实践，叠加 10-01 平台经济法生效，Q4 促销与费率结构须提前重排。", "table": [["主管", "俄经济发展部"], ["监管范围", "佣金均等、最低价、商品卡核验、结算时限"], ["卖家新增权利", "自设最低价、拒绝平台补贴降价且不被降权"], ["平台新增义务", "核查合作方与自提点资质"], ["配套节点", "10-01 平台经济法生效"]], "sourceFull": "https://www.retail.ru/news/marketpleysam-uzhestochat-trebovaniya-po-ustanovleniyu-komissiy-dlya-prodavtsov--16-sentyabrya-2026-282197/"}, {"num": 3, "title": "Wildberries 智能自提用户半年增 6 倍，无人 ПВЗ 回购率近 90%", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-16 10:32", "summary": "Wildberries & Russ 披露：自 2026 年 5 月上线智能自提以来，使用该功能的买家数量增长 6 倍以上。用户在自提点扫描 App 内二维码即可自动开柜取货，无需店员介入，单件适用尺寸不超过 60x40x40 см、货值不超过 5 万卢布。公司口径显示智能自提订单中最热门的是美妆等品类（原文品类枚举处有截断）。公司同时推进全自动 Смарт-ПВЗ（无员工、7x24 小时自取），该模式下回购率接近 90%；莫斯科现有 17 个智能自提点，计划年底增至 20 个，无人点增至 10 个。", "table": [["上线时间", "2026-05"], ["用户增长", "6 倍以上"], ["适用上限", "60x40x40 см / 5 万卢布"], ["无人点回购率", "近 90%"], ["莫斯科网点", "17 → 20（年底），无人点 10 个"]], "sourceFull": "https://www.retail.ru/news/wildberries-kolichestvo-polzovateley-pvz-so-smart-vydachey-zakazov-vyroslo-v-6-r-16-sentyabrya-2026-282173/"}, {"num": 4, "title": "Эксмо 与 АСТ 增印 500 万册补库，总裁称损失无论如何无法弥补", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-16 11:04", "summary": "出版集团 Эксмо-АСТ 总裁 Новиков 表示，出版社已在加印 500 万册图书以替换在平台仓库遇袭与火灾中被销毁的库存，并直言这些书已被销毁、损失无论如何无法弥补。集团此前披露的损失金额约 4 亿卢布，此前行业口径为 1500 万册、约 60 亿卢布。该案是平台仓储遇袭向供货链条传导的最完整样本：实物不可逆，赔付只覆盖印数成本，商誉与断货缺口由供应商自行承担。", "table": [["加印数量", "500 万册"], ["集团损失", "约 4 亿卢布"], ["行业损失口径", "1500 万册 / 约 60 亿卢布"], ["补偿性质", "实物不可逆，仅部分货币赔付"]], "sourceFull": "https://www.retail.ru/news/izdatelstva-eksmo-i-ast-dopechatayut-5-mln-knig-vzamen-sgorevshikh-na-skladakh-m-16-sentyabrya-2026-282168/"}, {"num": 5, "title": "Ромир：消费者信心指数 7 月降至 -15%，近三成消费者单次采购件数压缩逾 10%", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-16 14:27", "summary": "研究机构 Ромир 客户总监 Сидорина 披露，俄消费者信心指数已连续走弱：2025 年 Q1 +11%、Q2 +13%、Q3 +10%、Q4 +3%；2026 年 Q1 转为 -4%、Q2 -8%，月度口径 6 月 -13%、7 月 -15%。同步收缩的是消费篮子：2026 年 6 月 29% 的消费者把单次采购件数压缩 10%、18% 压缩 11-20%，主要表现为删除重复项与收窄品类宽度。该趋势与此前零售端客单价靠低价商品拉动的口径互相印证，对耐用品（家电、灯具、家居）的 Q4 需求模型构成直接压力。", "table": [["消费者信心指数", "7 月 -15%（Q1 -4%、Q2 -8%）"], ["采购件数 -10% 人群", "29%"], ["采购件数 -11~20% 人群", "18%"], ["主要行为", "删除重复项、收窄品类"]], "sourceFull": "https://www.retail.ru/news/indeks-potrebitelskoy-uverennosti-snizilsya-do-15-kolichestvo-pozitsiy-v-cheke-s-16-sentyabrya-2026-282201/"}, {"num": 6, "title": "2ГИС 上线寄件比价入口，接入 СДЭК、Яндекс Доставка 与 Versta.io", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-16 09:40", "summary": "地理服务 2ГИС 在路线规划页新增寄件板块：用户输入起终点后可直接看到多家物流商的报价与取派时间，选定后跳转至承运商 App，地址自动带填，无需二次录入。首批接入 СДЭК、Яндекс Доставка 与 Versta.io 三家，支持同城、跨城市以及哈萨克斯坦、白俄罗斯、亚美尼亚、吉尔吉斯斯坦等邻国方向，公司称后续将扩充合作名单。对卖家而言，比价入口进一步前置到消费级流量平台，自发货（FBS/DBS）承运商的获客与议价格局可能被重塑。", "table": [["新功能", "2ГИС 寄件/比价"], ["首批承运商", "СДЭК、Яндекс Доставка、Versta.io"], ["覆盖范围", "俄境内 + 哈/白/亚/吉"], ["对卖家的意义", "比价前置、承运商格局变动"]], "sourceFull": "https://www.retail.ru/news/servis-2gis-zapustil-dostavku-posylok-16-sentyabrya-2026-282169/"}, {"num": 7, "title": "Lamoda：个性化贡献 +10% NMV，俄罗斯设计师板块 +44%", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-16 12:54", "summary": "Lamoda 在 Brand Day 披露运营数据：95% 的展示面已实现个性化，直接带来约 10% 的额外 NMV；平台板块口径占公司上半年 NMV 的 59%，其中俄罗斯设计师板块增速最快 +44%、运动 +25%、高端 +22%。客户结构中地区客户占 62%、莫斯科 27%、圣彼得堡 11%，人均下单 5 次。公司强调以趋势分析与卖家趋势指南替代人人打折，其微观趋势可带来周转率 +63%。对平台卖家而言，内容化与趋势契合度正取代单纯降价成为流量分配变量。", "table": [["个性化增益", "约 +10% NMV"], ["个性化覆盖率", "95% 展示面"], ["俄罗斯设计师板块", "+44%"], ["运动 / 高端", "+25% / +22%"], ["客户分布", "地区 62% / 莫斯科 27% / 圣彼得堡 11%"]], "sourceFull": "https://www.retail.ru/news/lamoda-personalizatsiya-i-bolshie-dannye-prinesli-kompanii-10-dopolnitelnogo-obo-16-sentyabrya-2026-282191/"}, {"num": 8, "title": "美众议院以 262:159 通过对俄制裁法案，送交特朗普签署", "tag": "local", "tagText": "本地", "source": "国际文传电讯社(Interfax)", "time": "09-17 01:53", "summary": "美国众议院批准一项授权白宫对俄实施额外制裁的法案，表决结果 262 票赞成、159 票反对（部分弃权），法案此前已获参议院通过，现将送交总统特朗普签署。条款包括：对全部俄罗斯商品加征最高 500% 关税；对俄油气的五大买家国商品加征最高 100% 关税（若其新增采购俄能源）；对运输俄石油、铀、煤等货物的船舶实施限制；限制美国公民对俄投资；禁止美国对俄供应能源资源。法案同时规定总统有权以美国国家利益为由不执行，并设有解除机制。", "table": [["表决", "262:159（赞成:反对）"], ["下一步", "总统签署"], ["对俄商品关税", "最高 500%"], ["五大能源买家", "最高 100% 关税"], ["总统豁免权", "有（国家利益条款）"]], "sourceFull": "https://www.interfax.ru/world/1116534"}, {"num": 9, "title": "欧洲议会方面消息：欧盟拟创纪录扩大对俄制裁", "tag": "local", "tagText": "本地", "source": "RBC", "time": "09-17 00:52", "summary": "据欧洲议会渠道消息，欧盟正准备创纪录规模的新一轮对俄制裁方案，范围与条款尚未定稿。此前欧盟成员国常驻代表已因内部分歧延长磋商，本轮创纪录口径显示布鲁塞尔倾向在能源、金融与涉第三国企业方向上进一步加码。对跨境卖家而言，结算通道与物流服务商的可选范围可能进一步收窄。", "table": [["主体", "欧盟新一轮对俄制裁"], ["规模口径", "创纪录"], ["状态", "方案未定稿"], ["前期状态", "成员国大使磋商已延长"]], "sourceFull": "https://www.rbc.ru/politics/17/09/2026/6aab0bc4f5653e1f583969d2"}, {"num": 10, "title": "俄防空：单日击落 68 架乌无人机；9-17 凌晨 2 架飞向莫斯科被击落，9 城机场限航", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)", "time": "09-17 04:31", "summary": "俄国防部口径显示，9-16 单日在全国击落 68 架乌无人机，其中库尔斯克州单日 100 架为地区口径、夜间 71 架为前一夜口径；9-17 凌晨又有 2 架飞向莫斯科的无人机被击落。袭击影响扩散到民航与公路：9-17 凌晨喀山、切博克萨雷、马哈奇卡拉、雅罗斯拉夫尔、伊万诺沃、普斯科夫、索契、格连吉克等机场先后实施临时限制，部分随后解除；雅罗斯拉夫尔至莫斯科公路因无人机威胁封闭；诺夫哥罗德州宣布无人机袭击危险。未出现平台仓库或物流中心受损通报。", "table": [["9-16 全俄击落", "68 架（夜间 71 架）"], ["库尔斯克州单日", "100 架"], ["飞向莫斯科被击落", "2 架（9-17 凌晨）"], ["限航机场", "喀山、切博克萨雷、马哈奇卡拉、雅罗斯拉夫尔等 9 城"], ["平台仓受损", "无通报"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/16/1229466-sbili-68-bpla"}, {"num": 11, "title": "欧盟外长卡拉斯：对乌援助累计超 2200 亿欧元，其中军事 780 亿", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-16 21:20", "summary": "欧盟外交与安全政策高级代表卡拉斯在欧洲议会斯特拉斯堡全会上表示，欧盟及成员国自冲突以来对乌援助总额已超过 2200 亿欧元，其中军事支持超 780 亿欧元；她并提及一项两年 900 亿欧元的对乌信贷支持计划，其中 600 亿欧元计划用于军事援助。此前她已表态不排除与普京对话，显示欧盟在加码援乌与保留接触渠道之间维持双轨。", "table": [["援助总额", "超 2200 亿欧元"], ["其中军事", "超 780 亿欧元"], ["信贷计划", "两年 900 亿欧元（600 亿军事）"], ["表态场合", "欧洲议会全会"]], "sourceFull": "https://ria.ru/20260916/es-2118121010.html"}, {"num": 12, "title": "土耳其就乌方袭击黑海船只向国际刑事法院提交申请", "tag": "local", "tagText": "本地", "source": "RBC", "time": "09-16 23:40", "summary": "土耳其已就乌克兰在黑海对船只的袭击向国际刑事法院（МУС）提交申请。该动作把黑海航运安全问题推向国际司法层面，可能影响黑海走廊的保险成本与航运意愿，对依赖黑海与新罗西斯克方向的海运与保险链条构成新的不确定性。", "table": [["提交方", "土耳其"], ["受理机构", "国际刑事法院（МУС）"], ["起因", "乌方袭击黑海船只"], ["潜在影响", "黑海航运保险与运价"]], "sourceFull": "https://www.rbc.ru/politics/16/09/2026/6aaafccd1dd4401cf16144ef"}, {"num": 13, "title": "美联储自 2023 年以来首次加息 25bp 至 3.75-4%，特朗普要求降至 1% 以下", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)", "time": "09-16 21:33", "summary": "美联储将联邦基金利率目标区间上调 25 个基点至 3.75-4%，为 2023 年 7 月以来首次加息。声明称经济以稳健速度增长、生产率增速高、资本开支显著，但通胀仍处高位，此举有助于把通胀降至 2%。白宫对此表示遗憾，特朗普公开要求美联储把利率降至 1% 或以下，并威胁称若要求未被满足，美国将停止与对美存在贸易逆差的国家的贸易（含欧盟方向）。全球利率重心上移对新兴市场货币与大宗商品定价链条构成新的扰动。", "table": [["决议", "+25 bp"], ["新区间", "3.75-4%"], ["上次加息", "2023 年 7 月"], ["特朗普诉求", "降至 1% 或以下"], ["附加威胁", "停止与逆差国贸易"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/09/16/1229467-frs-povisila-stavku"}, {"num": 14, "title": "俄周度通胀 9-8 至 9-14 为 +0.02%，非食品端药品、洗涤用品、智能手机、电视机涨价", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)", "time": "09-16 19:17", "summary": "俄统计局数据显示，9 月 8 至 14 日 CPI 为 100.02%（+0.02%）；9 月以来累计 +0.07%，年初至今 +4.74%。食品端涨幅居前：鸡蛋 +2.5%、荞麦 +0.8%、肉类与蔬菜类儿童罐头 +0.7% 与 +0.6%；非食品端上涨的品类包括药品、洗衣粉、洗发水、智能手机与电视机，而童装、运动服与球鞋、牛仔裤、男式 T 恤与袜子价格回落。汽油 +0.4%、柴油 -0.3%。涨价面集中在个护与 3C，与电商 3C 和美妆类目的成本与定价直接相关。", "table": [["周度 CPI", "+0.02%（9-8~9-14）"], ["9 月累计", "+0.07%"], ["年初至今", "+4.74%"], ["非食品上涨", "药品、洗衣粉、洗发水、智能手机、电视机"], ["汽油 / 柴油", "+0.4% / -0.3%（周）"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/09/16/1229448-inflyatsiya-v-rossii"}, {"num": 15, "title": "央行顾问：10-1 住房公用费率指数化再推高年通胀约 0.7 个百分点，将逼近 7% 预测上限", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)", "time": "09-16 13:14", "summary": "俄央行行长顾问 Тремасов 表示，10 月 1 日启动的住房公用事业费率指数化将直接给年通胀增加约 0.7 个百分点：目前是 6.3%，若指数化按原定 7 月 1 日执行，现在已经在 7%；考虑即将到来的指数化，通胀实际已接近央行预测区间上限 7%。央行维持关键利率 14%，为一年半降息周期中的首次暂停。7 月季调后当前价格增速曾加速至 11.6% 年化，Q2 均值 5.3%，核心通胀升至 7%。对卖家而言，10 月起末端需求与自有成本将同向上行。", "table": [["ЖКУ 指数化", "2026-10-01"], ["对年通胀贡献", "约 +0.7 п.п."], ["年通胀（9-7 口径）", "6.3%"], ["预测上限", "7%"], ["关键利率", "14%（首次暂停）"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/09/16/1229262-sovetnik-glavi-tsb"}, {"num": 16, "title": "央行：10 月物价受燃油、卢布与 ЖКУ 费率三重推力；化工原料涨超一倍，涂料成本上行", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-16 20:51", "summary": "俄央行通胀观察指出，8 月通胀虽回落但仍显著高于二季度均值：季调后稳定性通胀估为 5-6% 年化，中位数与剔除极端分项的口径反而上行。价格支撑来自燃油涨价的二次效应与卢布贬值，10 月再加 ЖКУ 指数化；燃油的直接贡献为 0.7-0.8 个百分点（全年综合央行此前估 1.5 个百分点）。上游成本已外溢：焦炭与油品生产价格 8 月环比 +3.1%、年初至今 +30.5%，柴油生产价 +9.4%；Сбер 宏观研究中心数据显示 3 至 8 月苯、邻二甲苯、甲苯价格涨超一倍，推升化工原料包括涂料生产商成本。", "table": [["稳定性通胀（8 月）", "5-6%（SAAR）"], ["燃油直接贡献", "0.7-0.8 п.п.（全年综合 1.5 п.п.）"], ["油品生产价", "8 月 +3.1%；年初至今 +30.5%"], ["柴油生产价", "8 月 +9.4%"], ["苯/邻二甲苯/甲苯", "3 至 8 月涨超一倍"]], "sourceFull": "https://www.kommersant.ru/doc/8956521"}, {"num": 17, "title": "ESPO 对华溢价创 2018 年以来纪录 12.5 美元/桶，俄油成中东供应中断的替代选项", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-16 19:26", "summary": "据 Argus 周报，9 月 13 日当周俄罗斯 ESPO 对华山东到岸溢价升至 12.5 美元/桶，为该报价 2018 年发布以来最高，ESPO 山东到岸价达 117.11 美元/桶；Urals 山东溢价升至 6 美元/桶（到岸 110.69 美元），对印度到岸 120.79 美元。Primorsk 港 Urals 对 Dated Brent 折价一个月内收窄 4.25 美元至 21.65 美元/桶。驱动因素是中东供应中断——沙特东西管道 700 万桶/日输量因泵站遇袭暂停，令中印炼厂转向更可靠更短程的俄油。", "table": [["ESPO 对华溢价", "12.5 美元/桶（2018 年以来最高）"], ["ESPO 山东到岸", "117.11 美元/桶"], ["Urals 山东到岸", "110.69 美元/桶"], ["Urals 印度到岸", "120.79 美元/桶"], ["Primorsk 折价", "21.65 美元/桶（FOB）"], ["沙特管道", "700 万桶/日暂停"]], "sourceFull": "https://www.kommersant.ru/doc/8956451"}, {"num": 18, "title": "Brent 报价：108.34 美元/桶（9-16 早盘），较前日 +1.77 美元", "tag": "en", "tagText": "英文", "source": "Fortune", "time": "09-16 07:00", "summary": "据 Fortune 引用的基准报价，9 月 16 日 07:00 美东时间 Brent 为 108.34 美元/桶，较前一交易日早盘的 106.57 美元上涨 1.77 美元（+1.63%）；与一个月前的 90.94 美元相比 +19.13%，与一年前的 68.72 美元相比 +57.65%。高油价持续支撑俄预算与卢布结汇，同时抬高全球海运与干线的燃料成本。说明：本机网络无法直连实时行情源，此为本期唯一可交叉验证的可引用报价（英文源），时点已如实标注。", "table": [["Brent（9-16 早盘）", "108.34 美元/桶"], ["较前日", "+1.77 美元（+1.63%）"], ["环比一月", "+19.13%"], ["同比一年", "+57.65%"]], "sourceFull": "https://fortune.com/article/price-of-oil-09-16-2026"}, {"num": 19, "title": "汽油零售 9-8 至 9-14 涨 0.36%，年初至今 +21%，均价 78.51 卢布/升", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)", "time": "09-16 19:23", "summary": "俄统计局数据显示，9 月 8 至 14 日汽油零售价环比 +0.36%，年初至今累计 +21%（АИ-92 +21.4%、АИ-95 +21%、柴油 +15.5%）。全国均价 78.51 卢布/升，前周 78.25；柴油均价从 88.44 降至 88.05 卢布。36 个地区涨价，印古什 +12.6% 居首；20 个地区降价，塞瓦斯托波尔 -6.7%，莫斯科与圣彼得堡基本持平。政府继续以手工调度方式保供，干线运价与到仓成本压力未消退。", "table": [["周度涨幅", "+0.36%（9-8~9-14）"], ["年初至今", "+21%"], ["均价", "78.51 卢布/升"], ["АИ-95 / АИ-98+", "80.78 / 102.89 卢布"], ["柴油均价", "88.05 卢布（-0.3%）"], ["地区分布", "36 州涨 / 20 州降"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/09/16/1229442-benzin-podorozhal"}, {"num": 20, "title": "央行汇率：9-17 美元 84.1732、欧元 97.1275、人民币 12.5457；美元连续第 6 日守在 84 区间", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)", "time": "09-16 18:08", "summary": "俄央行公布 9 月 17 日官方汇率：美元 84.1732 卢布、欧元 97.1275、人民币 12.5457，美元已连续第 6 个交易日维持在 84 卢布附近。央行称 8 月卢布走弱的主因是出口商在油价下跌背景下停止卖出外汇，非金融企业外汇净售额环比 -15.3% 至 188 亿美元（12 个月均值 194 亿），部分与出口商偿债有关。8 月卢布对美元月均贬值 6.8%，实际有效汇率环比 -9.1%。", "table": [["美元（9-17）", "84.1732 卢布"], ["欧元 / 人民币", "97.1275 / 12.5457 卢布"], ["连续持平", "第 6 个交易日"], ["外汇净售额", "188 亿美元（-15.3% м/м）"], ["实际有效汇率", "8 月 -9.1%"]], "sourceFull": "https://www.vedomosti.ru/finance/news/2026/09/16/1229384-derzhit-kurs"}, {"num": 21, "title": "农产品与化肥：小麦出口 7-9 月将创 2010 年以来最低；欧盟 7 月俄化肥进口降至年内低点", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)", "time": "09-16 11:50", "summary": "俄小麦出口在 7 至 9 月将达到 2010 年以来的最低水平；同期欧盟对俄化肥采购大幅萎缩：7 月进口额降至年内最低 3160 万欧元，同比 -27%，其中钾肥 2130 万欧元、氮肥 870 万欧元；1 至 7 月累计 3.295 亿欧元，同比缩水 3.7 倍，主因欧盟加征进口关税（氮肥另加 40 欧元/吨、复合肥 45 欧元/吨，计划升至货值 100%）。俄罗斯因此在欧盟化肥供应国中降至第 4 位，对农机配件与园艺类目需求构成间接压制。", "table": [["小麦出口（7-9 月）", "2010 年以来最低"], ["欧盟 7 月俄化肥进口", "3160 万欧元（-27%）"], ["1-7 月累计", "3.295 亿欧元（-3.7 倍）"], ["欧盟排名", "第 4 位"], ["关税", "6.5% + 40/45 欧元每吨（拟升至 100%）"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/09/16/1229222-eksport-pshenitsi"}, {"num": 22, "title": "韩国 8 月自俄进口化妆品动物源原料达两年最高 480 万美元，环比近 4 倍", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-16 14:49", "summary": "据韩国海关数据，8 月韩国自俄罗斯进口用于化妆品、膳食补充剂与香水的动物源原料（龙涎香、麝香、马鹿茸等）达 480 万美元，为近两年最高，环比增长近 4 倍；俄罗斯当月成为韩国该类原料的最大供应国，乌干达 30 万美元、澳大利亚 14.1 万美元次之。此前的口径是韩国对俄化妆品出口 1 至 8 月增长 20.3%。原料与成品双向流动，说明俄韩在美妆供应链上的分工在制裁背景下反而加深。", "table": [["8 月原料进口额", "480 万美元（两年最高）"], ["环比", "近 +4 倍"], ["主要品类", "龙涎香、麝香、马鹿茸"], ["俄罗斯排名", "该类原料第 1 大供应国"], ["对照", "韩国对俄化妆品出口 1-8 月 +20.3%"]], "sourceFull": "https://ria.ru/20260916/koreja-2118097459.html"}, {"num": 23, "title": "阿维托调查：38% 俄女性不会取消已预约的美容服务，31% 因想改变形象主动预约", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-16 21:33", "summary": "Авито Услуги 调查显示，38% 的俄罗斯女性不会因其他事务取消已排定的美容或美发预约，即已排定需求黏性强；31% 会在想改变形象或进入人生新阶段时主动预约，25% 因很久没为自己做点什么、24% 因外观不再符合自我认知、23% 因照片不好看而预约。取消或改期的首要原因是加班 25%，其次为不愿为自己花钱 18% 与家务 15%。若能腾出 3 小时，31% 会选择美发、24% 美甲或美足、20% SPA、16% 到店护理。到店服务的黏性与形象驱动属性，是线上美妆内容种草的重要入口。", "table": [["不取消预约", "38%"], ["因改变形象预约", "31%"], ["取消首因", "加班 25%"], ["3 小时首选", "美发 31% / 美甲 24% / SPA 20%"]], "sourceFull": "https://www.retail.ru/news/38-rossiyanok-ne-otmenyat-zapis-na-uslugi-krasoty-iz-za-drugikh-del-16-sentyabrya-2026-282196/"}, {"num": 24, "title": "Ситилинк：2026 年最受欢迎品类为笔记本、智能手机与电视机，购前平均比较 2 至 4 款", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-16 13:40", "summary": "Ситилинк 发布的 2026 年品类数据显示，需求前十为笔记本电脑、智能手机、电视机、显示器、洗衣机、冰箱、路由器、打印机、SSD 与处理器，其中电脑零组件占 5 席，公司归因于用户自行组装与升级 PC 的意愿上升。选购上用户平均比较 2 至 4 款，且常在同一次会话内完成购买；最受欢迎的笔记本没有超过 512 ГБ 的 SSD 型号，16 ГБ 内存加 512 ГБ SSD 已是舒适下限；智能手机的比较次数最多。对 3C 卖家而言，参数表与对比工具的价值高于单纯价格。", "table": [["前三品类", "笔记本、智能手机、电视机"], ["前十含零组件", "5 类（SSD、CPU、主板、显卡、内存）"], ["笔记本主流配置", "512 ГБ SSD / 16 ГБ RAM"], ["比较款数", "2 至 4 款"], ["比较最多", "智能手机"]], "sourceFull": "https://www.retail.ru/news/sitilink-v-2026-godu-samoy-vostrebovannoy-tekhnikoy-u-rossiyan-stali-noutbuki-sm-16-sentyabrya-2026-282184/"}, {"num": 25, "title": "DIY 与家居零售客单价全线走高（ВсеИнструменты +16%、Лемана Про +7%、Hoff +4%），但行业预期转弱", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "09-16 07:33", "summary": "据行业统计，2026 年初以来平均客单价同比显著上升：ВсеИнструменты.ру +16%、Лемана Про +7%、Hoff +4%；下单频次前五为 Лемана Про、Петрович、Максидом、ВсеИнструменты.ру、Hoff。结构上 ВсеИнструменты.ру 的 B2B 占比已超 75%；Лемана Про 1 至 8 月家具 +38%、室内门 +23%、园艺 +19%；Hoff 计划把企业客户占比从 5% 提至 2027 年底的 10%。但分析指出 2026 年 DIY 市场艰难：消费者因装修服务涨价压缩支出，家居与灯具增量更可能来自 B2B 与替换性需求。", "table": [["客单价同比", "ВсеИнструменты +16% / Лемана Про +7% / Hoff +4%"], ["Лемана Про 品类", "家具 +38%、室内门 +23%、园艺 +19%"], ["ВсеИнструменты B2B", "超 75% 营收"], ["Hoff 企业占比", "5% → 10%（2027 年底）"], ["行业判断", "2026 年 DIY 市场困难"]], "sourceFull": "https://www.retail.ru/news/s-nachala-2026-go-goda-sredniy-chek-v-vseinstrumenty-ru-lemana-pro-i-hoff-pokaza-16-sentyabrya-2026-282162/"}, {"num": 26, "title": "Москвич 启动 Атом 电动车全流程量产，本地化率达 70%", "tag": "local", "tagText": "本地", "source": "数据报(Vedomosti)", "time": "09-16 13:38", "summary": "电动车 Атом 已在 Москвич 工厂启动全流程量产，涵盖分段焊接车身、涂装、防腐处理、整车装配、机械部分调校以及电子系统标定、测试与终检。参数上电机功率 150 кВт（204 马力），零百加速 7 秒，续航最高 500 км。生产方 АО Кама 总经理称 2026 至 2027 年计划生产至多 1 万辆，当前本地化率已达 70%。对车载电器、灯具与零配件品类，俄产电动车放量意味着本地配套需求的结构性增量。", "table": [["状态", "全流程量产启动"], ["电机功率", "150 кВт（204 马力）"], ["零百加速 / 续航", "7 秒 / 最高 500 км"], ["规划产量", "至多 10,000 辆（2026-2027）"], ["本地化率", "70%"]], "sourceFull": "https://www.vedomosti.ru/auto/news/2026/09/16/1229271-moskvich-zapustil-massovoe"}, {"num": 27, "title": "Дром：夏季俄柴油二手车销冠为 Toyota Land Cruiser、Prado 与 VW Touareg；柴油加混动加电动销量 +22%", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-17 05:00", "summary": "汽车门户 Дром 数据显示，2026 年夏季俄罗斯二手柴油车销量前三为 Toyota Land Cruiser、Toyota Land Cruiser Prado、Volkswagen Touareg，同比需求 +3%、+9%、+20%，Touareg 均价下滑 5% 至 200 万卢布。柴油车整体较去年同期多售 17%，但环比春季零增长；柴油车加混合动力加电动车夏季合计销量 +22%，较 2025 年夏季多出 1 万辆，其中电动车为去年同期 2.5 倍、混动 +22%。燃料短缺与汽油年初至今 +21% 正把部分需求推向非汽油动力。", "table": [["柴油二手车前三", "Toyota LC / LC Prado / VW Touareg"], ["需求变化", "+3% / +9% / +20%"], ["柴油车同比", "+17%（环比春季 0%）"], ["柴油加混动加电动", "+22%（+1 万辆）"], ["电动车同比", "乘 2.5"]], "sourceFull": "https://ria.ru/20260917/avtomobili-2118160397.html"}]}
