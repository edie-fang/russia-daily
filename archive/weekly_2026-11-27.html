kryty-podrobnosti-ataki-vsu-na-sankt-peterburg/"}, {"num": 14, "title": "欧盟第 22 轮制裁 12 月通过：再断 60 家俄银行 SWIFT、制裁 70+ 影子油轮", "tag": "local", "tagText": "本地", "source": "Коммерсантъ（本地）", "time": "11-25 11:03", "summary": "欧盟第 22 轮对俄制裁将于 12 月通过，11-26~27 峰会审议：拟再断开 60 家俄银行 SWIFT、限制加密与支付平台、制裁 70+「影子舰队」船舶、禁止为俄能源设施（炼厂、电力）提供服务并禁止在俄为油轮投保，另加 100+ 实体与个人，收紧签证。对跨境结算、货代与保险链路影响直接。", "table": [["🏦 金融", "再断 60 家俄银行 SWIFT；限制加密与支付平台"], ["🚢 航运", "制裁 70+ 影子油轮；禁在俄为油轮投保"], ["🏭 服务", "禁止为俄炼厂、电力等能源设施提供服务"], ["📅 时间", "12 月通过，11-26~27 峰会审议"]], "sourceFull": "https://www.kommersant.ru/doc/9129923", "url": "https://www.kommersant.ru/doc/9129923"}, {"num": 15, "title": "欧盟特别峰会提前收场：2028–2034 预算未谈成，对乌资金与制裁节奏或延后", "tag": "local", "tagText": "本地", "source": "Коммерсантъ（本地）", "time": "11-27 16:17", "summary": "原定两天的欧盟特别峰会因丹麦、瑞典、比利时、奥地利等净出资国拒绝继续磋商 2028–2034 多年财政框架而提前结束（11-27 凌晨），领导人将于 12-17 复谈。预算与对乌追加资金若延后，欧洲防务、工业补贴与对俄制裁的执行节奏都会被拉长；11-26 欧盟理事会刚批准 2027 年最高 450 亿欧元对乌援助。", "table": [["🗓 结果", "2028–2034 MFF 未达成，峰会提前结束，12-17 复谈"], ["🇪🇺 分歧", "丹麦/瑞典/比利时/奥地利等净出资国拒继续磋商"], ["🇺🇦 对照", "11-26 理事会批准 2027 年最高 450 亿 € 对乌援助"]], "sourceFull": "https://www.kommersant.ru/doc/9144379", "url": "https://www.kommersant.ru/doc/9144379"}]}, {"icon": "📊", "name": "经济", "items": [{"num": 16, "title": "周通胀加速至 0.3%：11 月累计 0.6%、年初至今 6.72%，黄瓜一周涨 12.8%", "tag": "local", "tagText": "本地", "source": "Ведомости（本地）", "time": "11-25 19:34", "summary": "俄统计局：11-17~23 周通胀 0.3%（前一周 0.19%），11 月累计 0.6%、年初至今 6.72%。蔬果周涨 1.9%（黄瓜 +12.8%），非食品中智能手机 +0.5%、外资新乘用车 +0.2%，汽油 +0.5%、柴油 +0.8%。副总理已要求 ФАС 与农业部核查涨价最快食品的定价，通胀反弹削弱了近期降息预期。", "table": [["📈 周通胀", "0.3%（前周 0.19%）｜11 月累计 0.6%｜年初至今 6.72%"], ["🍅 食品", "蔬果 +1.9%，黄瓜 +12.8%"], ["🧺 非食品", "智能手机 +0.5%、新车 +0.2%、汽油 +0.5%"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/11/25/1415378-nedelnaya-inflyatsiya", "url": "https://www.vedomosti.ru/economics/news/2026/11/25/1415378-nedelnaya-inflyatsiya"}, {"num": 17, "title": "2027–2029 预算获联邦委员会批准：2027 支出 48.8 万亿₽；同步 МРОТ 提至 28,935₽、地区 УСН 优惠取消", "tag": "local", "tagText": "本地", "source": "Lenta.ru（本地）", "time": "11-27 14:14", "summary": "联邦委员会 11-27 批准 2027–2029 预算：2027 年支出 48.8 万亿₽、收入 43.3 万亿₽（赤字约 5.5 万亿），2028 年 50.9/45.8 万亿、2029 年 53.9/48.6 万亿。本周同批立法还包括：2027-01-01 起 МРОТ 提至 28,935₽/月（+6.8%）、地区不得再给贸易等四行业 УСН 优惠（回到 6%/15% 基准）。", "table": [["🧾 2027 预算", "支出 48.8 万亿 ₽ / 收入 43.3 万亿 ₽，赤字约 5.5 万亿"], ["👷 МРОТ", "28,935 ₽/月（2027-01-01，+6.8%，原 27,093）"], ["🏷 УСН", "贸易/建筑/酒店/餐饮地区优惠取消，回到 6% / 15% 基准"], ["📅 后续", "2028 年 50.9/45.8 万亿 ₽；2029 年 53.9/48.6 万亿 ₽"]], "sourceFull": "https://lenta.ru/news/2026/11/27/sovet-federatsii-odobril-proekt-trehletnego-byudzheta-rossii/", "url": "https://lenta.ru/news/2026/11/27/sovet-federatsii-odobril-proekt-trehletnego-byudzheta-rossii/"}, {"num": 18, "title": "美拟对 14 国加征最高 35% 关税：越南 35%、中国至 20%、欧盟 15%", "tag": "local", "tagText": "本地", "source": "Коммерсантъ（本地）", "time": "11-25 21:00", "summary": "美国贸易代表办公室 11-25 公布拟对 14 个贸易伙伴加征最高 35% 关税（1974 年贸易法 301 条）：越南 35%、印度 25%，中国与新加坡至 20%，东盟五国至 18%，欧盟、日本、韩国、瑞士、台湾至 15%；书面意见 2027-01-05 截止、听证 2027-01-25。对经中国直采或第三国转口的供应链构成成本与合规风险。", "table": [["📊 税率", "越南 35%、印度 25%、中国/新加坡至 20%、欧盟等至 15%"], ["⚖️ 依据", "1974 年贸易法 301 条（产业补贴调查）"], ["🗓 程序", "意见截止 2027-01-05，听证 2027-01-25"]], "sourceFull": "https://www.kommersant.ru/doc/9130729", "url": "https://www.kommersant.ru/doc/9130729"}]}, {"icon": "💄", "name": "美妆", "items": [{"num": 19, "title": "ФАС 对 «Прайм фарма» 立案：以 «Фурацилин» 命名化妆品涉嫌误导消费者", "tag": "local", "tagText": "本地", "source": "Коммерсантъ（本地）", "time": "11-25 21:46", "summary": "俄反垄断局（ФАС）对 «Прайм фарма» 立案：该公司以 «Фурацилин» 与 «ФурацилОки» 命名销售化妆品，与苏联时期知名抗菌药同名，ФАС 认为易让消费者误以为产品具消炎、抗菌效果，构成不正当竞争。罚则与案值未披露，认定后或按营收比例罚款；对卖家的含义是「药感命名」类文案与包装在选品与上架阶段就要规避。", "table": [["🏢 主体", "«Прайм фарма»"], ["🏷 品牌", "«Фурацилин» / «ФурацилОки»"], ["⚠️ 风险", "名称暗示药品功效 → 不正当竞争；罚款或按营收比例"]], "sourceFull": "https://www.kommersant.ru/doc/9130635", "url": "https://www.kommersant.ru/doc/9130635"}, {"num": 20, "title": "阿尔泰 УФАС 认定 «Лэтуаль» 邮件广告违法：会员注册捆绑广告同意，罚款 30–100 万₽", "tag": "local", "tagText": "本地", "source": "Атмосфера（本地）", "time": "11-25 15:46", "summary": "阿尔泰边疆区 УФАС 认定 «Лэтуаль»（Алькор и Ко）邮件广告违规：会员注册时把广告同意与入会条款捆绑，用户无法单独拒绝，违反《广告法》第 18 条；公司已移除投诉人邮箱，行政处罚另案审理，法人罚款区间 30–100 万₽（КоАП 14.3 条第 4.1 款）。", "table": [["⚖️ 依据", "《广告法》18 条 + КоАП 14.3 ч.4.1"], ["💸 罚款", "30–100 万 ₽（待定）"], ["✅ 整改", "已移除投诉人邮箱；注册页需拆开广告同意"]], "sourceFull": "https://www.asferainfo.ru/news/136492-altajskoe-ufas-priznalo-nezakonnoj-reklamnuu-rassylku-letual", "url": "https://www.asferainfo.ru/news/136492-altajskoe-ufas-priznalo-nezakonnoj-reklamnuu-rassylku-letual"}, {"num": 21, "title": "调查：33% 俄女性按社媒评价与评论区内容决定化妆品购买", "tag": "local", "tagText": "本地", "source": "Retail.ru（本地）", "time": "11-23 11:09", "summary": "«Одноклассники» 节前调查：33% 的女性受访者表示社媒评价与评论区讨论直接影响化妆品与护肤品购买决策，节日礼盒选品更依赖口碑内容。对卖家的含义是评分、评价数量与 UGC 素材对转化的影响大于单纯降价，节前应把评价运营与内容素材排在促销之前。", "table": [["👩 影响面", "33% 女性受访者受社媒评价直接影响"], ["🎁 场景", "节前礼盒与补货采购"], ["🎯 启示", "评价数量与 UGC 素材优先于降价"]], "sourceFull": "https://www.retail.ru/news/kazhdaya-tretya-rossiyanka-vybiraet-kosmetiku-po-otzyvam-i-obsuzhdeniyam-v-sotss-23-noyabrya-2026-284800/", "url": "https://www.retail.ru/news/kazhdaya-tretya-rossiyanka-vybiraet-kosmetiku-po-otzyvam-i-obsuzhdeniyam-v-sotss-23-noyabrya-2026-284800/"}]}, {"icon": "🔌", "name": "电器", "items": [{"num": 22, "title": "俄咖啡机销量创纪录：9 个月近 200 万台（+11%），均价降至 1.39 万₽", "tag": "local", "tagText": "本地", "source": "Retail.ru（本地）", "time": "11-22 13:28", "summary": "ICMR（原 «ГфК-Русь»）数据：2026 年前 9 个月俄罗斯售出近 200 万台咖啡机与咖啡壶，同比 +11%，创纪录；平均单价同比下降 6.4% 至 1.39 万卢布，销量增速快于金额增速。«М.Видео» 称在家煮咖啡需求上升、外带咖啡涨价推动，属「量增价减」的典型小家电品类。", "table": [["📦 销量", "约 200 万台（9M，+11%）"], ["💵 均价", "1.39 万 ₽（−6.4%）"], ["📉 结构", "金额增速低于销量 → 中低价位段放量"]], "sourceFull": "https://www.retail.ru/news/prodazhi-kofemashin-v-rossii-dostigli-rekorda-na-fone-rosta-tsen-na-kofe-navynos-22-noyabrya-2026-284784", "url": "https://www.retail.ru/news/prodazhi-kofemashin-v-rossii-dostigli-rekorda-na-fone-rosta-tsen-na-kofe-navynos-22-noyabrya-2026-284784"}, {"num": 23, "title": "«М.Видео» 门店首卖电动车；其 marketplace 1–9 月 GMV 228 亿₽（+202%）", "tag": "local", "tagText": "本地", "source": "Retail.ru（本地）", "time": "11-24 12:17", "summary": "«М.Видео» 首次在实体店卖车：莫斯科 «Калейдоскоп» 商场门店上架 Автотор 在加里宁格勒生产的 Eonyx City M2 电动车，此前仅线上销售。其多品类 marketplace 1–9 月 GMV 228 亿₽（+202%），卖家超 1.5 万、SKU 达 158 万（截至 10 月底），家电连锁正把门店变成「体验 + 履约」节点。", "table": [["🚗 门店", "莫斯科 ТЦ «Калейдоскоп»｜Eonyx City M2（Автотор，加里宁格勒）"], ["📈 GMV", "1–9 月 228 亿 ₽（+202%）"], ["👥 生态", "卖家 1.5 万+，SKU 158 万（10 月底）"]], "sourceFull": "https://www.retail.ru/news/set-m-video-vpervye-nachala-prodavat-avtomobili-v-oflayn-magazine-24-noyabrya-2026-284851/", "url": "https://www.retail.ru/news/set-m-video-vpervye-nachala-prodavat-avtomobili-v-oflayn-magazine-24-noyabrya-2026-284851/"}, {"num": 24, "title": "11.11 复盘：仅 12% 电器卖家给出 >10% 真折扣，27% 促销前抬价，系统机加价 19%", "tag": "local", "tagText": "本地", "source": "Retail.ru（本地）", "time": "11-27 16:33", "summary": "«Т-Банк» 旗下「Честная пятница」比对 3.4 万个卖家的售前与促销价（覆盖近 30 个平台）：只有 12% 的电器/数码卖家给出高于 10% 的真折扣，27% 在促销前抬价，61% 价格基本不变；抬价幅度最高的是台式主机（+19%），其次足部按摩器 8%、脱毛器 7%、冰箱 7%。", "table": [["✅ 真打折", "12%（折扣 >10%）"], ["📈 抬价", "27% 促销前涨价；61% 价格不变"], ["📊 抬价品类", "台式主机 +19%、足部按摩器 8%、脱毛器/冰箱 7%"]], "sourceFull": "https://www.retail.ru/news/tolko-12-prodavtsov-tekhniki-zapustili-krupnye-skidki-na-rasprodazhakh-11-11-27-noyabrya-2026-285042/", "url": "https://www.retail.ru/news/tolko-12-prodavtsov-tekhniki-zapustili-krupnye-skidki-na-rasprodazhakh-11-11-27-noyabrya-2026-285042/"}]}, {"icon": "💡", "name": "灯具", "items": [{"num": 25, "title": "«Россети Центр» 今年装 6,000 盏路灯、改造 120 km 照明线路（全部俄产设备）", "tag": "local", "tagText": "本地", "source": "EnergyLand（本地）", "time": "11-24 03:32", "summary": "«Россети Центр» 与 «Россети Центр и Приволжье» 今年已安装 6,000 盏路灯、新建与改造 120 km 照明线路，全部采用俄产设备；其中伊万诺沃州建成 80+ km 线路、约 5,000 盏 LED 灯，并为排球中心与达曼桥做建筑景观照明。市政 LED 替换仍是俄灯具需求的主要来源。", "table": [["🛣 规模", "6,000 盏路灯｜新建/改造 120 km 线路"], ["🏙 区域", "伊万诺沃州 80+ km、约 5,000 盏 LED"], ["🇷🇺 采购", "全部俄产设备（本地化要求）"]], "sourceFull": "http://energyland.info/news-show-tek-electro-289596", "url": "http://energyland.info/news-show-tek-electro-289596"}, {"num": 26, "title": "彼尔姆 2,000 台 LED 灯具采购（约 7,000 万₽）因 УФАС 投诉暂停签约", "tag": "local", "tagText": "本地", "source": "Business Class（本地）", "time": "11-24 05:30", "summary": "彼尔姆 «Пермблагоустройство» 四个 LED 灯具与投光灯采购（合计约 7,000 万₽）因 УФАС 收到投诉暂停签约：四标分别 1,802 万、1,790 万、1,790 万、1,616 万₽，共 2,000 台（8 W RGBW 投光灯、16/32 W 线性灯），交付期 12-15、质保 60 个月；11-23 已因单家投标流标。", "table": [["💵 合同额", "约 7,000 万 ₽（4 标：1,802/1,790/1,790/1,616 万）"], ["📦 数量", "2,000 台（8 W RGBW 投光灯、16/32 W 线性灯）"], ["📅 交付", "2026-12-15；质保 60 个月；因 УФАС 投诉暂停"]], "sourceFull": "https://www.business-class.su/news/2026/11/24/v-permi-priostanovili-zakupki-na-postavku-svetilnikov-na-70-mln-rublei", "url": "https://www.business-class.su/news/2026/11/24/v-permi-priostanovili-zakupki-na-postavku-svetilnikov-na-70-mln-rublei"}, {"num": 27, "title": "IEK Group 投产灯杆/桅杆厂：投资 5.5 亿₽、年产能 5,000 吨、最高 80 m", "tag": "local", "tagText": "本地", "source": "AK&M（本地）", "time": "11-26 05:11", "summary": "IEK Group 在卡卢加州小雅罗斯拉韦茨投产 «IEK Opora» 金属灯杆/桅杆厂：投资 5.5 亿₽，其中工业发展基金（ФРП）优惠贷款 2 亿₽（3%–5%、最长 7 年）；年产能 5,000 吨，产品含最高 80 m 的道路、城市照明与电力杆塔，100% 俄产钢材、本地化率 100%。", "table": [["💰 投资", "5.5 亿 ₽（ФРП 贷款 2 亿，3–5%、最长 7 年）"], ["🏭 产能", "5,000 吨金属结构/年"], ["📏 产品", "道路/城市照明与电力杆塔，最高 80 m，100% 俄产钢材"]], "sourceFull": "https://www.akm.ru/eng/news/iek-group-with-the-support-of-frp-has-started-the-production-of-metal-supports-and-masts-in-the-kalu/", "url": "https://www.akm.ru/eng/news/iek-group-with-the-support-of-frp-has-started-the-production-of-metal-supports-and-masts-in-the-kalu/"}]}], "keyData": {"headers": ["指标", "周初（11-23）", "周末（11-27）", "周内变化"], "rows": [["USD/RUB（央行官方）", "82.1911", "82.1265", "卢布升 0.08%"], ["CNY/RUB（央行官方）", "12.2759", "12.3184", "卢布对人民币贬 0.35%"], ["EUR/RUB（央行官方）", "90.3445", "89.8053", "卢布升 0.60%"], ["Brent 近月（美元/桶）", "91.39（11-23）", "96.51（11-27）；08:25 MSK 97.02", "+5.6%，中东风险溢价回归"], ["IMOEX 指数", "2,374.21（11-24 收）", "2,358.80（11-27 14:37 MSK）", "−0.65%；周内低点 2,322.95（11-26）"], ["俄央行关键利率", "14.00%", "14.00%", "10-23 会议维持，本周无会议"], ["周通胀（周环比）", "+0.19%（11-10~16）", "+0.30%（11-17~23）", "11 月累计 0.6%、年初至今 6.72%"], ["联邦预算 2027", "—", "支出 48.8 / 收入 43.3 万亿₽", "赤字约 5.5 万亿₽；11-27 联邦委员会批准"], ["МРОТ（2027-01-01 起）", "27,093₽", "28,935₽", "+6.8%"], ["Ozon 9M 业绩", "—", "营收 1.06 万亿₽（+53%）/ 净利 183 亿₽", "首次分红 120₽/股；袭击损失 301 亿₽"], ["WB/Ozon Q3 终端价", "—", "+11.2% 同比", "非食品通胀 6.5%；扣费率 56.7% / 52.9%"], ["2026 电商预测（Data Insight）", "100 亿单 / 15.4 万亿₽", "96 亿单 / 15 万亿₽", "因仓库遇袭下调"]]}, "trends": [{"title": "电商物流 / 平台政策：费用货币化继续加码，12-01 是下一道分水岭", "text": "① 计费化：Ozon 11-26 把「发货时长」纳入收费（超 6 小时收 0.25%–3%），叠加 12-01 计费公式重构与 12-22 退货自动处置，卖家可自由调节的运营缓冲在被逐项定价；唯一利好是 11-25 的跨集群调拨费下调（约一半方向 −36%）。② 履约中断：WB «Щеглово» 11-29 起停收 FBS、余货清零，西北方向需在 4 天内改派。③ 制度侧：杜马通过线上贸易管控法（2027-06 起 ККТ 违规者可被封站），Минэк 的 2036 数字平台战略草案提出平台与传统零售共享 ПВЗ/门店与物流设施——监管在同时收「合规」与放「基础设施复用」两头。④ 12-01 还有灯具/灯泡等无线电电子无码禁售与 WB 新版 оферта（玩具付费包装、保理代付）同日生效，本周末是最后的对齐窗口。"}, {"title": "履约与仓储：袭击从「炸仓」转为「停收 + 疏散」，平台用分布式履约对冲", "text": "① 本周无新增平台仓损毁，累计仍 44 起（WB 22 / Ozon 15），但警报停收每周都在发生：11-23 «Пермь-3»、11-25 萨马拉三中心、11-27 «Порошкино» 疏散（仓体未受损）。② 平台侧的应对已从「加固仓库」转向「减少对单点枢纽的依赖」：WB 把 R-Mixed 四个品牌接入 Click&Collect、9 月起新开 100+ 合作履约中心，ЯМ 借 Melon Fashion 覆盖 400+ 门店，Ozon 拟把 8 万 ПВЗ 改造为小型物流点。③ 对卖家的含义：单一集群布货的风险溢价在上升，但 ПВЗ 端正在出清（单点月佣金中位降至 18.5 万₽、近半数经营主反馈降佣），分布式履约的「最后一公里」并不稳固。④ 操作上把「警报日 +1–2 天」写进承诺交期，并对西北（Щеглово/Порошкино）与伏尔加（萨马拉）两条线各留一个备用 СЦ。"}, {"title": "需求与价格：平台终端价跑赢通胀 11.2%，红利从「流量」转向「广告位与场景」", "text": "① 价格：Q3 WB/Ozon 同款终端价 +11.2%，是非食品通胀（6.5%）的 1.7 倍，而扣费率涨得更快（WB 56.7%、Ozon 52.9%），说明涨价并未转化为卖家毛利。② 增长：Data Insight 把 2026 年订单从 100 亿下调到 96 亿单、规模从 15.4 下调到 15 万亿₽，遇袭直接损失非食品线上 2.7% 年营业额，服装、家居、图书最重。③ 流量：广告集中度继续上升（Ozon 前 20% 广告主占 84% 展示位），CPM 上行挤压中小卖家；WB 则把「WB Услуги」扩到家教、摄影、换胎，开始把流量卖给非商品场景。④ 结论：Q4 的增量更依赖「评价/UGC + 场景组合」而非降价——11.11 只有 12% 的电器卖家给出真折扣，27% 靠促销前抬价，价格战的实际空间已很薄。"}, {"title": "经济与金融：通胀反弹至 0.3%，财政定调「支出扩张 + 税优回收」", "text": "① 通胀：11-17~23 周通胀 0.3%（前值 0.19%），11 月累计 0.6%、年初至今 6.72%，食品（黄瓜 +12.8%）领涨，降息预期被推后。② 财政：2027–2029 预算获联邦委员会批准，2027 年支出 48.8 万亿₽、赤字约 5.5 万亿；同批立法把 МРОТ 提到 28,935₽（+6.8%）并取消地区对贸易等四行业的 УСН 优惠（回到 6%/15%）——用工与税负同时上行。③ 汇率：USD/RUB 82.1911→82.1265（卢布 +0.08%）、EUR/RUB −0.60%，但 CNY/RUB 12.2759→12.3184（卢布对人民币 −0.35%），人民币采购成本小幅抬升。④ 股市：IMOEX 周内在 2,322–2,374 区间震荡，11-27 因阿布扎比谈判传闻盘中 +1.54% 至 2,367.87，情绪仍由地缘消息驱动。"}, {"title": "能源与汇率：Brent 一周 +5.6%，中东风险溢价重新定价，卢布几乎走平", "text": "① 油价：Brent 从 11-23 的 91.39 涨到 11-27 的 96.51（+5.6%），11-27 08:25 MSK 报 97.02；驱动是 11-25 胡塞武装打击沙特 Рас-Таннура 炼厂与霍尔木兹海峡油轮触雷，风险溢价重新计入。② 对跨境链路：干线燃油附加费与中亚陆运成本 Q4 易涨难跌，本周的油价回落窗口已关闭。③ 汇率：卢布对美元、欧元基本持平，对人民币小幅走弱，人民币计价采购的落地成本抬升 0.3%–0.4%，与油价上行叠加，Q4 毛利需要重新测算。④ 建议：报价按 Brent 90–100、USD/RUB 81–84、CNY/RUB 12.2–12.5 做区间测试，合同保留浮动条款。"}, {"title": "合规与监管：标记、证书、税控三线同时收紧，2027 是集中执行年", "text": "① 标记：12-01 起灯具/灯泡等无线电电子无码禁售，WB 轻工「第 4 波」未贴 КИЗ 库存只可售至 11-30，WB 12-03 起把 40₽/件包装罚款从 2 类目扩到 4 类目（内衣/成人用品/健康/玩具）。② 证书：Росаккредитация 自 10-01 起自动校验证书，下一阶段用 AI 比对证书与商品描述、照片与编码，「证真货不对」将被直接阻断商品卡。③ 税控与准入：线上贸易管控法建立 ККТ 违规名录（2027-02-01）、2027-06 起可封站；Роспотребнадзор 直接下 3–7 天整改令的法案已提交杜马。④ 广告合规：本周 «Лэтуаль» 因注册捆绑广告同意被罚 30–100 万₽，说明「默示同意」类做法在东欧市场已不可行，注册与营销流程需逐项拆开授权。"}], "sourceStats": "收录 27 条全部来自俄语本地媒体与官方、行业渠道（Ведомости / Коммерсантъ / Lenta.ru / Известия / Retail.ru / Sellers Platform / MPUP / Витрина / «Бумага» / EnergyLand / Business Class / AK&M / Атмосфера；其中 Retail.ru 引 ICMR·Easy Commerce·АУРЭК·«Одноклассники»，Sellers Platform 引 АПЭТ，Ведомости 引 Росстат，Витрина 引 Marketplace_biz，均按本地媒体计）。行情与汇率另补取 ЦБ РФ 官方牌价（XML_daily 11-23 / 11-27 生效值）、Интерфакс 油价快照与 MOEX 收盘公告，不单独计入条目。本地信源 27 条、占比 100%（中文 0%、英文 0%），满足本地 ≥60% 的要求。", "meta": ["报告编号：RU-WEEKLY-2026-W48", "覆盖周期：2026-11-23（周一）~ 11-27（周五），第48周，共 5 个工作日", "收录条目：27 条（仓库遇袭与履约韧性1/平台规则变动3/电商8/时政3/经济3/美妆3/电器3/灯具3）", "数据来源：本周日报 4 期（11-23 16 条 / 11-24 22 条 / 11-25 20 条 / 11-26 23 条，共 81 条）按重要性精选；11-27 日报因 cron 执行中断缺期，本期以 RSS（Lenta / Интерфакс / ТАСС / Коммерсантъ / Retail.ru / РИА）+ 单篇抓取补全 11-26 05:00 MSK 之后至 11-27 16:00 的动态", "去重口径：URL 比对 state.db articles 表（本周日报 81 条已入库）；周报按「事件」合并同一主题的多日条目，同一事
