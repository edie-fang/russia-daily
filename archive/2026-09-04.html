{"date": "2026-09-04", "stats": {"total": 18, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "普京宣布10-1起全俄试行简化政府采购：学校等可直连本土电商平台下单", "tag": "local", "tagText": "本地", "source": "Kommersant", "time": "09-03 10:06", "summary": "普京在ВЭФ全会宣布：10月1日起以实验形式在全俄（不限远东与北极）推行简化政府采购，配套新联邦法生效后，各联邦主体的学校、幼儿园、中小学可绕过繁琐法规直接从俄本土电商平台\"货架\"下单，称可更快更便宜并压缩寻租空间。市场解读为平台经济获国家订单新入口，Ozon当日股价一度涨近4~5%至2489卢布。", "table": [["启动", "2026-10-01 实验"], ["范围", "全俄教育机构"], ["市场反应", "Ozon股价+4~5%至2489卢布"]], "sourceFull": "https://www.kommersant.ru/doc/8924757"}, {"num": 2, "title": "WB将参加俄交通部无人机配送试点：偏远地区空投包裹，称比地面快30倍", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "09-03 18:47", "summary": "据Ведомости报道，RWB创新与生态发展总监埃廷称，Wildberries已接受交通部邀请，将在某地区参与无人机空中配送试点，面向偏远及人口稀少定居点送订单；单公斤配送成本预估数千卢布，宣称时效可比地面运输快约30倍，具体路线、载量与货量尚未公布。此前平台物流设施连遭袭击，低空配送被视为仓储网络之外的补充履约选项。", "table": [["试点", "交通部无人机配送项目"], ["成本", "数千卢布/公斤(估)"], ["时效", "称快于地面约30倍"]], "sourceFull": "https://lenta.ru/news/2026/09/03/wildberries-reshil-zadeystvovat-bespilotniki/"}, {"num": 3, "title": "出版业核算：WB/Ozon仓遇袭烧毁约1500万册图书，损失60亿卢布", "tag": "local", "tagText": "本地", "source": "Kommersant", "time": "09-03 20:28", "summary": "俄数字发展部官员格里戈里耶夫在行业会议上披露：WB与Ozon仓库遭无人机袭击已致约1500万册图书被毁、出版业损失约60亿卢布，最终损毁量可能升至2000万册。业者呼吁将书业增值税由10%降至5%、对焚毁商品取消进项税转回并允许全额计入成本，另建议为补库存提供优惠贷款。平台售书渠道占行业收入50.8%~59.1%。", "table": [["烧毁图书", "~1500万册(或达2000万)"], ["行业损失", "60亿卢布"], ["诉求", "书业增值税10%→5%"]], "sourceFull": "https://www.kommersant.ru/doc/8925374"}, {"num": 4, "title": "俄购物中心联盟：全俄或有关店潮超1000家门店，各地客流下滑", "tag": "local", "tagText": "本地", "source": "TASS", "time": "09-04 02:16", "summary": "俄购物中心联盟主席沙基罗夫预计，全国或将关闭超过1000家门店，称各联邦区购物中心客流均呈下降趋势。实体零售客流收缩背景下，消费进一步向线上与社区业态迁移，品牌方与卖家需重新评估线下分销网点的边际效益，关注租赁议价空间与关店转线上的节奏。", "table": [["预计关店", ">1000家"], ["背景", "购物中心客流全面下滑"]], "sourceFull": "https://tass.ru/ekonomika/28077713"}, {"num": 5, "title": "央行：中央联邦区仓储租金上涨，小面积仓与订单处理设施询盘增加", "tag": "local", "tagText": "本地", "source": "TASS", "time": "09-04 03:14", "summary": "俄央行在区域经济监测中指出，中央联邦区仓储物业租金上行，专家观察到对小型仓库及订单处理（履约）类物业的询盘数量增长。背景是大型物流中心接连遭无人机袭击后，零售商与平台卖家趋向分散备货、以小面积多点仓储替代单一大仓，仓储成本结构变化值得卖家在FBO备货与成本测算中纳入。", "table": [["区域", "中央联邦区(ЦФО)"], ["现象", "仓储租金上行"], ["需求", "小面积仓/订单处理物业增加"]], "sourceFull": "https://tass.ru/ekonomika/28077805"}, {"num": 6, "title": "斯洛伐克拒绝延长欧盟对俄个人制裁：现行一揽子措施9-15到期", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "09-03 19:48", "summary": "据Politico报道，斯洛伐克政府否决了将欧盟对俄个人制裁延期12个月的提议；该一揽子制裁已多次按6个月展期，现行措施9月15日到期，欧盟本希望一次性延长12个月避免反复谈判，但27国需一致同意，大使级磋商尚未达成共识。斯总理菲佐此前公开不满欧盟批准对乌900亿欧元贷款。若制裁断档将影响涉俄贸易融资环境。", "table": [["到期日", "2026-09-15"], ["分歧方", "斯洛伐克(菲佐政府)"], ["背景", "不满对乌900亿欧元贷款"]], "sourceFull": "https://lenta.ru/news/2026/09/03/v-es-ne-smogli-prodlit-sanktsii-protiv-rossii-po-odnoy-prichine/"}, {"num": 7, "title": "美众议院对俄新制裁法案或推迟至11月中期选举后表决（彭博）", "tag": "local", "tagText": "本地", "source": "Interfax", "time": "09-04 03:34", "summary": "彭博社援引众议院议长约翰逊表态：参议院已通过的美国对俄追加制裁法案在众议院遭遇越来越大阻力，审议可能至少推迟到11月中期选举之后，此前\"9月14日起审议\"的预期落空。这是9月1日Грэм法案在众议院受阻后的新进展，短期内对俄新制裁落地的尾部风险进一步后移。", "table": [["参议院", "已通过"], ["众议院", "阻力上升，或推迟至11月选举后"]], "sourceFull": "https://www.interfax.ru/world/1113102"}, {"num": 8, "title": "9-3夜~9-4晨无人机大规模袭击：莫斯科方向拦截23架，索契油库区域起火", "tag": "local", "tagText": "本地", "source": "Interfax", "time": "09-04 04:02", "summary": "莫斯科市长索比亚宁通报，9月4日凌晨又击落13架飞向莫斯科的无人机，全夜累计达23架（零时后10架+凌晨13架），应急部门正在处理残骸坠落点；同期索契与天狼星遭遇针对基础设施的大规模无人机袭击，石油基地区域发生火灾；图拉州亦拦截4架БПЛА。截至目前无电商平台仓库受损通报，但能源与交通基础设施风险上升。", "table": [["莫斯科拦截", "23架(10+13)"], ["索契", "нефтебаза区域起火"], ["平台仓库", "无受损通报"]], "sourceFull": "https://www.interfax.ru/russia/1113107"}, {"num": 9, "title": "普京ВЭФ视频启动10家远东新企业：50万TEU码头、1.8百万吨甲醇厂等", "tag": "local", "tagText": "本地", "source": "RIA", "time": "09-04 04:30", "summary": "普京在东方经济论坛期间以视频连线为10家远东企业新阶段启动揭幕，其中6家位于滨海边疆区：符拉迪沃斯托克\"五一\"集装箱码头年吞吐50万TEU、创造近300岗位；乌苏里斯克Фармасинтез制药厂投资14亿卢布、480岗位、年产1200万包；纳霍德卡Росхим化肥厂年产180万吨甲醇、已投入220亿卢布。俄方称超前发展区等机制已催生1100余家企业。", "table": [["企业数", "10家(滨海6家)"], ["集装箱码头", "50万TEU/年"], ["甲醇厂", "180万吨/年"]], "sourceFull": "https://ria.ru/20260904/vef-2115344393.html"}, {"num": 10, "title": "俄副外长：部分欧盟国家坚持要求允许进口俄天然气，禁气或致欧盟衰退", "tag": "local", "tagText": "本地", "source": "RIA", "time": "09-03 20:34", "summary": "俄副外长格鲁什科在ВЭФ透露，尽管欧盟已决定彻底弃用俄气，部分欧盟国家仍在私下坚持应允许俄天然气进口，并警告2027年全面禁运将令欧盟经济进一步下滑。按现行时间表，俄管道气短期合同禁运6月17日已生效，长期合同管道气进口禁令2027年11月1日生效。欧洲天然气价格与俄出口结算格局仍存变数。", "table": [["全面禁运节点", "管道气长期合同2027-11-01"], ["欧盟内部分歧", "部分国家主张放行俄气"]], "sourceFull": "https://ria.ru/20260903/mid-2115314286.html"}, {"num": 11, "title": "俄8月油气预算收入4240亿卢布环比-55%：НДД缺位叠加Urals跌至59美元", "tag": "local", "tagText": "本地", "source": "Kommersant", "time": "09-03 22:08", "summary": "俄财政部9月3日数据：8月联邦预算油气收入仅4240亿卢布，为1月以来最低，环比大降55%（7月9340亿卢布含一次性3960亿卢布НДД）、同比降16%；剔除日历因素后环比仍降约21%，主因Urals均价由6月63.52跌至7月59.02美元/桶及减产。1-8月累计5.02万亿卢布、同比-17%。财政部同时宣布9月7日-10月6日每日购汇25亿卢布（净额19亿）。", "table": [["8月油气收入", "4240亿卢布(环比-55%)"], ["Urals(7月)", "59.02美元/桶"], ["1-8月累计", "5.02万亿卢布(同比-17%)"]], "sourceFull": "https://www.kommersant.ru/doc/8925272"}, {"num": 12, "title": "ВЭФ：雅库特签署28项协议超1800亿卢布，聚焦交通与能源", "tag": "local", "tagText": "本地", "source": "TASS", "time": "09-04 02:51", "summary": "雅库特行政长官尼古拉耶夫在东方经济论坛表示，该共和国共签署28项合作协议、总额超过1800亿卢布，重点投向交通与能源领域的区域大项目；共和国同时希望成为远东IT枢纽。远东各联邦主体在ВЭФ密集签约，反映俄方将远东-北极作为承接投资与贸易转移的优先方向，物流与基建标的值得持续跟踪。", "table": [["协议数", "28项"], ["金额", ">1800亿卢布"], ["方向", "交通、能源"]], "sourceFull": "https://tass.ru/ekonomika/28077769"}, {"num": 13, "title": "俄中能源新议题：西伯利亚力量-贝加尔管道、北极LNG与新建核电站", "tag": "local", "tagText": "本地", "source": "TASS", "time": "09-04 04:56", "summary": "塔斯社援引俄方官员在ВЭФ表态：俄中正讨论新的\"西伯利亚力量-贝加尔\"天然气管道项目、北极液化天然气项目，俄方并对与中方讨论新建核电站持开放态度。若管道与LNG项目推进，将重塑远东能源流向与跨境基建投资节奏，对俄远东经济、物流走廊及中方能源布局均有中期影响，需跟踪项目可研与融资进展。", "table": [["管道", "西伯利亚力量-贝加尔(讨论中)"], ["LNG", "北极新项目"], ["核电", "俄方愿谈新建核电站"]], "sourceFull": "https://tass.ru/ekonomika/28077935"}, {"num": 14, "title": "央行官方汇率（9-4生效）：美元86.89卢布，卢布结束连贬小幅回升", "tag": "local", "tagText": "本地", "source": "ЦБ РФ", "time": "09-03 11:30", "summary": "俄央行设定9月4日生效的官方汇率：美元86.8872卢布（较前值86.9963回落）、欧元100.598、人民币12.9191，卢布在连续多日贬值后首次小幅走强。油价高位与财政部购汇规模缩减（9月7日起日净购19亿卢布、低于此前59亿）为卢布提供支撑；对卖家而言人民币-卢布结算与换汇窗口仍宜按区间波动管理。", "table": [["美元", "86.8872(前值86.9963)"], ["欧元", "100.598"], ["人民币", "12.9191"]], "sourceFull": "https://www.cbr-xml-daily.ru/daily_json.js"}, {"num": 15, "title": "俄北极项目累计投资达38万亿卢布，ВЭФ发布开发进展", "tag": "local", "tagText": "本地", "source": "RIA", "time": "09-04 04:48", "summary": "俄方在ВЭФ披露，北极地区各类项目累计投资已达38万亿卢布，北方海航道与北极资源开发持续吸纳预算与私人资本。远东-北极双极开发战略下，基础设施（港口、能源、物流节点）订单与建设周期将影响跨境货运通道选择，俄罗斯境内物流版图的北移趋势对入俄卖家选仓与干线规划具有参考意义。", "table": [["累计投资", "38万亿卢布"], ["场合", "ВЭФ-2026"]], "sourceFull": "https://ria.ru/20260904/investitsii-2115346037.html"}, {"num": 16, "title": "圣彼得堡Сестрорецк工厂启动Tenet Plus L4跨界车全周期量产", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "09-03 17:40", "summary": "АГР控股旗下塞斯特罗列茨克工厂完成大规模现代化改造后，开始对紧凑型跨界车Tenet Plus L4实行焊装-涂装-总装全周期批量生产：焊装车间部署175台机器人、涂装54台，总装线引入无人搬运车与AI质检摄像头，并强化空腔注蜡等防腐工艺。俄本土整车产能持续恢复，配套零部件与售后市场机会同步扩大。", "table": [["车型", "Tenet Plus L4(АГР)"], ["焊接机器人", "175台"], ["涂装机器人", "54台"]], "sourceFull": "https://lenta.ru/news/2026/09/03/zavod-pod-peterburgom-zapustil-polnyy-tsikl-proizvodstva-krossovera-tenet-plus-l4/"}, {"num": 17, "title": "中国汽车零部件大厂不愿迁厂入俄：本地化瓶颈威胁俄整车产业", "tag": "local", "tagText": "本地", "source": "Kommersant", "time": "09-03 17:37", "summary": "生意人报调查：大型中国汽车零部件供应商对在俄设厂本地化兴趣有限，主要顾虑俄方政策风险与中方对技术外流、产能布局的要求，俄整车产业高度依赖中国供应链的现状短期难改，本地化率提升受阻。俄产汽车组装与零部件进口并存的格局将持续，相关品类的跨境供应与认证要求需按现状规划。", "table": [["中企态度", "对俄设厂意愿低"], ["影响", "俄本土化率提升受阻"]], "sourceFull": "https://www.kommersant.ru/doc/8925040"}, {"num": 18, "title": "俄联邦委员会：ОСАГО赔付上限宜由40万提至100万卢布", "tag": "local", "tagText": "本地", "source": "TASS", "time": "09-04 03:03", "summary": "俄联邦委员会副主席茹拉夫廖夫称，将交强险（ОСАГО）财产损失赔付上限从40万卢布提高至100万卢布是合理选项，但须与遏制\"汽车律师\"不当索赔的措施配套推进。若落地将抬升保险成本并传导至车险价格，对汽车后市场与用车成本敏感品类（配件、养护）的定价预期有参考意义。", "table": [["现赔付上限", "40万卢布"], ["建议上限", "100万卢布"], ["配套", "打击不当汽车律师索赔"]], "sourceFull": "https://tass.ru/ekonomika/28077797"}]}
