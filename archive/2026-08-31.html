{"date": "2026-08-31", "stats": {"total": 21, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "🚨仓库被炸：Ozon别尔哥罗德分拣中心与配送枢纽遭袭，员工疏散有伤、大火已扑灭", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-30 19:16", "summary": "Ozon官方确认别尔哥罗德分拣中心与配送枢纽遭乌军袭击：员工被疏散、有员工受伤、火灾已扑灭。同波次别尔哥罗德市遭导弹袭击，全市2死16伤（含7名16-17岁青少年、1人危重），7处仓库建筑起火、1处屋顶坍塌。为Ozon 8-27乌法/奥伦堡后第3座新遇袭城市，距边境约40公里。", "table": [["Ozon设施", "分拣中心+配送枢纽"], ["全市伤亡", "2死16伤"], ["仓库建筑起火", "7处（1处屋顶坍塌）"]], "sourceFull": "https://lenta.ru/news/2026/08/30/vsu-udarili-po-ob-ektam-ozon-v-stolitse-rossiyskogo-regione/"}, {"num": 2, "title": "🚨仓库被炸：Ozon顿河畔罗斯托夫物流设施遭无人机袭击起火，快速扑灭无伤亡", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-29 06:14", "summary": "8-29凌晨乌军对罗斯托夫州发动大规模无人机袭击，Ozon一处物流设施被击中起火，火势迅速扑灭、无人员伤亡。袭击致全州7名平民受伤：罗斯托夫市4人住院（2成人2儿童、1名儿童危重），阿克赛区3人就医。Ozon南部物流节点遇袭，显示其南部履约链承压。注：8-30日报曾漏报此事件。", "table": [["Ozon物流设施", "被击中起火（快速扑灭）"], ["全州平民受伤", "7人（4人住院）"], ["袭击方向", "罗斯托夫州"]], "sourceFull": "https://ria.ru/20260829/rostovskaya-2113951403.html"}, {"num": 3, "title": "俄家具市场转向B2B：上半年产量410万件、零售跌10%、企业订单成主力", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-31 02:49", "summary": "俄家具企业加速转向B2B/B2G：AMDPR预计今年企业+政府采购占全市场35-40%；第一家具厂上半年企业+政府订单占比达59%、超10亿卢布。背景是消费需求骤降——Q1零售同比-10%，8-17~23家具消费名义支出-6.3%；上半年家具产量410万件、办公家具产量同比-5.5%。C端疲软、项目单成新赛道。", "table": [["上半年家具产量", "410万件"], ["Q1零售同比", "-10%"], ["B2B+B2G占比预计", "35-40%"], ["第一家具厂企业订单", "59%（超10亿卢布）"]], "sourceFull": "https://www.kommersant.ru/doc/8921764"}, {"num": 4, "title": "\"Ведомости\"：亚太国家公司在俄商标注册数量增加", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-31 03:45", "summary": "据《Ведомости》报道，来自亚太地区国家的公司增加了在俄罗斯的商标注册数量。该趋势或反映亚太企业借平行进口/本土化生产加大对俄市场布局，与中国卖家在俄电商竞争加剧相关。商标抢注与合规风险值得卖家关注。具体增幅数据未在标题披露，待核实。", "table": [], "sourceFull": "https://tass.ru/ekonomika/28059261"}, {"num": 5, "title": "俄中小企业支持首份地区排名：奥廖尔州居首，仅38/89地区按时处理申请", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-31 02:49", "summary": "俄中小企业集团发布首份地区中小企业支持效率排名：奥廖尔州综合表现最均衡居首，秋明州第二、克拉斯诺亚尔斯克边疆区第三；莫斯科州、车里雅宾斯克、奔萨等垫底。全国仅38/89个地区不超期处理企业申请。受损卖家申请税收缓缴等支持时，需关注本地区办理时效差异。", "table": [["排名前三", "奥廖尔/秋明/克拉斯诺亚尔斯克"], ["按时处理申请地区", "38/89"]], "sourceFull": "https://www.kommersant.ru/doc/8921808"}, {"num": 6, "title": "专家警告：骗子借数字卢布转账实施新骗局", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-31 01:44", "summary": "专家库恰瓦提醒，欺诈分子利用数字卢布这一新支付方式设计骗局，借\"数字卢布转账\"名义诱导受害者操作。9月1日数字卢布正式全国推出，超50%民众准备使用，新支付场景成为诈骗高发区。卖家与消费者需警惕冒充银行/平台客服的转账要求，具体手法待核实。", "table": [["背景", "9-1数字卢布正式推出"]], "sourceFull": "https://tass.ru/obschestvo/28059155"}, {"num": 7, "title": "别尔哥罗德市遭导弹袭击：2死16伤、7处仓库建筑起火", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-30 23:48", "summary": "8-30晚间乌军对别尔哥罗德市发动导弹袭击：一商业设施内1名男子与1名16岁少年遇难，全市16人受伤（含7名16-17岁青少年、1人危重；3名成人危重）。袭击造成7处仓库建筑起火、1处屋顶坍塌，消防与救援持续作业。商业/物流设施集中受损，与当日Ozon分拣中心遇袭同属一波。", "table": [["死亡", "2人（男+16岁少年）"], ["受伤", "16人（含7名青少年）"], ["仓库建筑起火", "7处、1处屋顶坍塌"]], "sourceFull": "https://lenta.ru/news/2026/08/31/chislo-postradavshih-pri-atake-vsu-na-belgorod-uvelichilos/"}, {"num": 8, "title": "俄国防部：8-29夜击落494架无人机，8-30白天再击落54架", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-30 21:14", "summary": "俄国防部通报：8-29夜全俄防空击落494架乌军无人机（单夜新高），其中别尔哥罗德州方向受袭；8-30白天8:00-20:00再击落54架，覆盖别尔哥罗德、布良斯克、卡卢加、库尔斯克、罗斯托夫州及克拉斯诺达尔边疆区、克里米亚与黑海水域。无人机袭击常态化扩大，物流设施风险居高不下。", "table": [["8-29夜击落", "494架"], ["8-30白天击落", "54架"]], "sourceFull": "https://lenta.ru/news/2026/08/31/raskryto-chislo-sbityh-nad-rossiey-dronov-vsu/"}, {"num": 9, "title": "索比亚宁：8-22~8-30共1455架无人机飞向莫斯科地区，50架近距被毁", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-30 14:12", "summary": "莫斯科市长索比亚宁通报：8-22 08:30至8-30 08:30，共1455架无人机在袭击中飞向莫斯科及周边地区，大部分在远郊被防空拦截，50架在接近莫斯科时被摧毁。8-16莫斯科方向遭两年最大规模袭击后，无人机袭扰呈高频化，首都圈物流/配送时效或持续受影响。", "table": [["8-22~8-30来袭无人机", "1455架"], ["近距摧毁", "50架"]], "sourceFull": "https://lenta.ru/news/2026/08/30/sobyanin-soobschil-o-pochti-1-5-tysyachi-letevshih-k-moskve-dronov/"}, {"num": 10, "title": "欧盟拟对俄石油海运实施新制裁，考虑波罗的海/北海海军任务", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-31 00:50", "summary": "欧洲议会议员（卢森堡）卡尔特海泽对《消息报》称，欧盟正制定针对俄石油海运的新限制措施，打击所谓\"影子船队\"，并考虑组建波罗的海与北海特别海军任务。若落地将推高俄油出口物流成本，影响乌拉尔原油折扣与卢布汇率，间接传导至进口商品价格。目前处于讨论阶段，落地时间待确认。", "table": [["措施方向", "打击俄石油海运/影子船队"], ["选项", "波罗的海+北海海军任务"]], "sourceFull": "https://lenta.ru/news/2026/08/31/v-evrosoyuze-zahoteli-vvesti-novye-sanktsii-protiv-rossiyskoy-nefti/"}, {"num": 11, "title": "拉夫罗夫：北约在北极活动威胁俄安全，制造紧张温床", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-31 00:08", "summary": "俄外长拉夫罗夫在\"北极：现在与未来\"论坛表示，北约在北极的军事活动为地区制造紧张温床、威胁俄安全，并指责北约国家损害北极理事会工作。北极航道与北方海路是俄出口物流（含中俄贸易航线）关键通道，地缘紧张或影响航运保险与物流成本。", "table": [["表态", "北约北极活动威胁俄安全"]], "sourceFull": "https://ria.ru/20260831/lavrov-2114215587.html"}, {"num": 12, "title": "美伊互袭推高油价：Brent涨2.34%至90.35美元/桶", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-31 01:34", "summary": "中东局势升级推动油价跳涨：截至莫斯科时间8-31 01:00，Brent 12月期货涨2.34%至90.35美元/桶，WTI 10月期货涨2.64%至85.64美元/桶。背景是美伊在霍尔木兹海峡互袭（美打击拉拉克岛、伊导弹回击美舰）。油价上行将传导俄油气收入与通胀预期，跨境卖家关注汇率与运费联动。", "table": [["Brent(12月期货)", "$90.35 (+2.34%)"], ["WTI(10月期货)", "$85.64 (+2.64%)"]], "sourceFull": "https://ria.ru/20260831/neft-2114222008.html"}, {"num": 13, "title": "俄9月小麦出口或骤降52-62%，至180-230万吨", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-30 19:56", "summary": "《生意人报》分析称，因收成与出口政策因素，俄9月小麦出口预计同比降52.1-62.5%，至180-230万吨。全球最大小麦出口国供应收缩将推高国际粮价，或影响俄国内食品通胀走势与农产品电商价格。下降具体原因（配额/收成/物流）报道未详述，待核实。", "table": [["9月出口预计", "180-230万吨"], ["同比降幅", "52.1-62.5%"]], "sourceFull": "https://www.kommersant.ru/doc/8921811"}, {"num": 14, "title": "阿克萨科夫：2027年通胀将回落至4%目标", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-31 04:08", "summary": "俄国家杜马金融市场委员会主席阿克萨科夫预计，俄通胀将在2027年回到4%目标水平。此前央行将关键利率维持在14%，2026上半年预算赤字已达5.7万亿卢布。若通胀如期回落，降息预期将改善消费信贷与电商融资环境；反之高利率延续将压制耐用品消费。", "table": [["通胀目标", "4%（2027年）"]], "sourceFull": "https://tass.ru/ekonomika/28059279"}, {"num": 15, "title": "俄券商H1：收入+40%至418亿卢布，净利润却降30%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-31 02:49", "summary": "47家主要券商上半年收入同比+40%至418亿卢布（BKS以102亿居首、增长9%），佣金收入+26%；但净利润同比-30%，主因高利率环境推升资金成本与合规投入。盈利质量分化：\"Солид\"收入近翻倍至32亿卢布，而\"Регион\"降27.5%。俄散户投资热情延续。", "table": [["Top-47收入", "418亿卢布 (+40%)"], ["净利润", "-30%"], ["最大券商", "BKS 102亿卢布"]], "sourceFull": "https://www.kommersant.ru/doc/8921848"}, {"num": 16, "title": "储蓄银行：维持50%分红底线，2026年对各级预算贡献1.7万亿卢布", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-31 02:00", "summary": "俄储蓄银行表示希望将股息支付率维持在不低于利润50%的水平，并披露2026年其对俄各级预算的贡献将达1.7万亿卢布。作为俄最大银行，Sber分红政策与预算贡献反映银行业盈利稳健；其此前\"平台支出-15%\"等消费数据亦为市场关注。", "table": [["分红率底线", "50%"], ["2026年预算贡献", "1.7万亿卢布"]], "sourceFull": "https://tass.ru/ekonomika/28059167"}, {"num": 17, "title": "俄消费者权益局：约3.94万个违禁膳食补充剂销售网站被封", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-31 03:16", "summary": "俄联邦消费者权益保护局通报，已累计封锁约3.94万个销售违禁БАД（膳食补充剂）的互联网资源，涉及未获国家注册的产品如Ozemptrin、\"俄罗斯精神\"腐殖酸饮品、NOW Selenium等。监管趋严对美妆健康品类卖家合规提出更高要求：无注册证产品禁售，正规渠道与注册文件是底线。", "table": [["被封网站", "约3.94万个"], ["典型案例", "Ozemptrin/NOW Selenium等"]], "sourceFull": "https://ria.ru/20260831/bad-2114227032.html"}, {"num": 18, "title": "\"Ведомости\"：俄罗斯鲜花销量出现下滑", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-31 05:03", "summary": "据《Ведомости》报道，俄罗斯市场鲜花销量出现下滑。消费降级背景下非必需品支出收缩（家具-6.3%、鲜花下滑同向），花店与礼品类目承压。对电商卖家：礼品/装饰类目需求走弱，需关注价格带下移趋势。具体降幅数据未披露，待核实。", "table": [], "sourceFull": "https://tass.ru/ekonomika/28059345"}, {"num": 19, "title": "Z世代抢购教堂乳香香调\"香水油\"，小众香氛走红", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-30 14:26", "summary": "据Baza电报频道，俄Z世代流行起乳香、麝香、没药、乌木、龙涎香等深沉香调的\"香水油\"，甚至开始大量购买教堂出售的香薰油。年轻消费者对木质/焚香调的兴趣分流传统香水消费，香氛类目出现小众差异化机会，卖家可关注香薰油、小众香调产品选品空间。", "table": [["流行香调", "乳香/麝香/没药/乌木/龙涎香"]], "sourceFull": "https://lenta.ru/news/2026/08/30/rossiyskie-zumery-nachali-skupat-maslyanye-duhi-s-ladanom-v-hramah/"}, {"num": 20, "title": "AI热潮推高服务器硬件价格：内存/SSD半年涨数十个百分点", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-31 02:49", "summary": "《生意人报》报道，受AI算力建设热潮驱动，服务器内存与SSD价格2026年上半年大涨数十个百分点，数据中心与云服务成本承压。对数码/3C卖家：上游存储芯片涨价或传导至消费电子终端价格；俄本土数据中心扩容需求同时利好相关设备进口商。具体涨幅待核实。", "table": [["涨幅", "数十个百分点（半年）"], ["动因", "AI算力建设热潮"]], "sourceFull": "https://www.kommersant.ru/doc/8921840"}, {"num": 21, "title": "\"Автостат\"：俄本土汽车品牌年底市场份额或超中国品牌", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-31 04:18", "summary": "分析机构\"Автостат\"预计，到2026年底俄本土汽车品牌市场份额可能超过中国品牌。当前俄市场格局为本土/中国/其他三方竞争，中国品牌近年凭借性价比快速扩张后增速或见顶。对汽车配件/用品卖家：本土品牌份额回升意味着配套供应链与售后件需求结构变化。", "table": [["趋势", "俄本土品牌份额年底或超中国品牌"]], "sourceFull": "https://tass.ru/ekonomika/28059287"}]}
</script>
