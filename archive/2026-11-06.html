 09:30", "summary": "俄央行公布 11-06 生效官方汇率：美元 81.7947 卢布（前值 81.67，+0.12）、欧元 92.1581（前值 91.60，+0.56）、人民币 12.2570（前值 12.1816，+0.08）。卢布对主要货币小幅走弱，进口成本与人民币结算采购价差需按新汇率重算。", "table": [["💵 USD/RUB", "81.7947（前值 81.67）"], ["💶 EUR/RUB", "92.1581（前值 91.60）"], ["🇨🇳 CNY/RUB", "12.2570（前值 12.1816）"]], "sourceFull": "https://www.cbr.ru/currency_base/daily/?date_req=06.11.2026"}, {"num": 18, "cat": "econ", "catText": "经济金融", "title": "央行会议纪要：三季度再现「过热」，当前物价增速升至 8%，通胀预测上调至 7.1–7.6%", "tag": "local", "tagText": "本地", "source": "Ведомости（引 ЦБ 纪要）", "time": "11-05 17:31", "summary": "央行关键利率讨论纪要：2026 年 Q3 经济再现正产出缺口（「过热」），内需增长叠加部分行业供给受限，稳通胀压力上升；Q3 当前物价增速（季调年化）由 Q2 的 4.8% 升至 8%，2026 年通胀预测上调至 7.1%–7.6%，10-23 会议维持关键利率 14%。", "table": [["🔥 产出缺口", "Q3 转正（过热）"], ["📈 物价增速", "8%（Q2 为 4.8%）"], ["🏦 关键利率", "14%（10-23 维持）"], ["🎯 通胀预测", "2026 年 7.1–7.6%"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/11/05/1242975-peregrev-ekonomiki"}, {"num": 19, "cat": "politics", "catText": "时政要闻", "title": "特朗普称将达成「超越乌克兰、或覆盖整个欧洲」的大协议，并确认会见德米特里耶夫", "tag": "local", "tagText": "本地", "source": "Интерфакс", "time": "11-06 01:47", "summary": "特朗普 11-06 对记者称正筹备一份「大协议」，不只涉及乌克兰、甚至可能覆盖整个欧洲，并称「我们很快会结束它」；同期他确认已会见俄方特使德米特里耶夫，克宫称普京高度评价其斡旋。美方口径反复，制裁与能源价格预期仍将剧烈波动。", "table": [["🤝 进展", "特朗普会见德米特里耶夫"], ["🗺 范围", "乌克兰 + 可能覆盖欧洲"], ["⏱ 时点", "11-06 表态"]], "sourceFull": "https://www.interfax.ru/world/1127308"}, {"num": 20, "cat": "politics", "catText": "时政要闻", "title": "Минтранс 提议把外资租赁飞机「特殊运营制度」延长至 2028 年", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "11-06 04:03", "summary": "俄交通部拟定政府决议草案，把从不友好国家租赁的飞机与航空发动机的特殊运营制度延长至 2028 年。该制度 2022 年 3 月出台，允许继续适航运营被制裁的租赁飞机。对依赖空运的跨境卖家而言，意味着俄航空货运运力与被扣飞机（双重注册）格局短期不变。", "table": [["📜 草案", "特殊租赁运营制度延至 2028 年"], ["🛫 覆盖", "飞机 + 航空发动机"], ["📅 现行制度", "2022-03 起施行"]], "sourceFull": "https://ria.ru/20261106/mintrans-2129575431.html"}]}
