{"date": "2026-08-18", "stats": {"total": 22, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "Wildberries为遭无人机袭击仓库员工组织就业安置与招聘会", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-17 11:41", "summary": "WB为遭乌军无人机袭击仓库的员工寻找就业安置方案，在受袭地区组织招聘会（含图拉、萨马拉、乌德穆尔特、伏尔加格勒、奔萨、克拉斯诺达尔等），提供继续原址工作、调往其他设施等个性化方案。8/16波多利斯克仓库遭袭后平台应对持续加码，卖家可关注仓库网络调整对履约时效的影响。", "table": [["安置方式", "多地区招聘会+个性化方案"], ["涉及地区", "图拉/萨马拉/乌德穆尔特/伏尔加格勒等"]], "sourceFull": "https://ria.ru/20260817/wildberries--2111322197.html"}, {"num": 2, "title": "调查：俄企业对华供应商要求提高，采购审核更趋严格", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-18 04:02", "summary": "分析师调查显示，俄企业对华供应商的要求日益提高，采购审核更趋严格（标题级收录，TASS正文受访问限制，细节待核实）。俄企在华采购从拼价格转向拼质量与合规，对跨境卖家供应链管理与产品合规提出更高要求。", "table": [["收录级别", "标题级（正文受限待核实）"]], "sourceFull": "https://tass.ru/ekonomika/28020425"}, {"num": 3, "title": "莫斯科遭遇大规模无人机袭击：约620架来袭，防空击落86架", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-18 05:12", "summary": "索比亚宁通报：向莫斯科方向飞来约620架无人机，为历次袭击中规模最大之一；俄防空系统击落86架（Interfax口径73架，统计时段不同）；莫斯科及周边多座机场（谢列梅捷沃、伏努科沃、多莫杰多沃、茹科夫斯基等）一度暂停航班起降。俄电商仓储物流再暴露于袭击风险，履约不确定性上升。", "table": [["来袭无人机", "约620架"], ["击落数", "86架（TASS）/73架（Interfax）"]], "sourceFull": "https://tass.ru/proisshestviya/28020525"}, {"num": 4, "title": "俄最高法院维持取消\"亚博卢\"党杜马选举参选资格", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-17 21:15", "summary": "俄最高法院裁定维持取消\"亚博卢\"党参加国家杜马选举的资格，判决已生效。9月选举临近，非议会政党\"亚博卢\"与\"祖国\"在地区议会选举登记中亦受挫。选举季政策节奏加快，消费补贴、电商监管类议题或密集出台。", "table": [["裁定", "维持取消参选资格（已生效）"]], "sourceFull": "https://www.kommersant.ru/doc/8891568"}, {"num": 5, "title": "俄39个地区议会选举候选人登记结束，9月统一选举日临近", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-18 02:07", "summary": "俄39个地区议会选举候选人登记结束：卡累利阿（9个政党名单）与克拉斯诺亚尔斯克（8个）竞争最激烈；11个参选政党中9个全部名单获登记，仅非议会政党\"亚博卢\"和\"祖国\"有损失（亚博卢在圣彼得堡和列宁格勒州出局）。9月统一选举日临近，政策窗口期开启。", "table": [["选举地区数", "39个"], ["登记受损政党", "亚博卢、祖国"]], "sourceFull": "https://www.kommersant.ru/doc/8891579"}, {"num": 6, "title": "Brent油价自7月底以来首次突破91美元/桶，单日涨3%", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-17 21:24", "summary": "国际油价涨幅扩大至3%，Brent自7月底以来首次突破91美元/桶，受美伊局势与霍尔木兹海峡风险溢价推动（8/13收于87.34美元，8/17已突破91）。油价高位支撑俄出口收入与预算，但对进口成本与通胀构成压力，油价→卢布→进口成本的传导需持续跟踪。", "table": [["Brent", "突破91美元/桶（+3%）"], ["前值", "8/13收于87.34美元"]], "sourceFull": "https://ria.ru/20260817/neft-2111449372.html"}, {"num": 7, "title": "卢布急贬：场外美元创5个月新高85.44卢布，人民币升至12.69", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-17 20:22", "summary": "8/17场外美元升至85.44卢布/$（3月19日以来最高）；人民币首次自2025年2月以来升至12.69卢布/CNY（月初以来+8%）；三个月内美元对卢布累计+21.5%。主因出口商售汇减少叠加购汇需求高企；分析师测算美元站稳85以上全年预算可额外增收5000亿卢布，进口成本与定价压力上升。", "table": [["场外美元", "85.44卢布/$（5个月新高）"], ["人民币", "12.69卢布/CNY"], ["预算增收测算", "5000亿卢布（美元站稳85）"]], "sourceFull": "https://www.kommersant.ru/doc/8891541"}, {"num": 8, "title": "莫交所指数跌破2100点，创7月24日以来新低", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-17 08:55", "summary": "俄股市早盘加速下跌，莫交所指数（iMOEX2）盘中跌破2100点至2094.64点（-1.95%），为7月24日以来首次。高利率与卢布走弱背景下俄股市持续承压，反映市场对经济基本面的谨慎情绪，企业融资环境与消费者信心或受波及。", "table": [["莫交所指数", "2094.64点（-1.95%）"]], "sourceFull": "https://ria.ru/20260817/mosbirzha-2111277664.html"}, {"num": 9, "title": "俄6月持有美债降至2700万美元，连续第二个月减持", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-18 00:57", "summary": "据美财政部数据：6月俄持有美国国债降至2700万美元（5月为2900万），其中长期国债2400万、短期300万。俄美金融脱钩下俄在美债敞口已接近清零，资产配置进一步转向黄金（私人持有已超10.8吨）等硬资产。", "table": [["俄持美债", "2700万美元（6月）"], ["环比", "-200万美元"]], "sourceFull": "https://ria.ru/20260818/vlozhenija-2111463757.html"}, {"num": 10, "title": "俄银行2026年或关闭超2100家网点，创近年纪录", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-17 09:08", "summary": "按当前节奏，俄银行2026年全年关闭网点或超2100家（创近年纪录）；1-8月已关闭1370家（约为去年同期2倍），主因客户加速转向数字渠道。银行线下网络收缩或影响部分区域现金业务与商户收单服务，电商卖家需关注收款渠道稳定性。", "table": [["全年预计关闭", "超2100家网点"], ["1-8月已关闭", "1370家"]], "sourceFull": "https://ria.ru/20260817/bank-2111279644.html"}, {"num": 11, "title": "7月俄水泥产量640万吨同比+3.2%，为2026年以来首次增长", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-18 02:12", "summary": "7月俄水泥产量640万吨（同比+3.2%），为2026年以来首次正增长，主因需求企稳与政府订单带动；但专家认为增长短期性。建材等地产后周期品类边际回暖信号，可关注与新房销售（7月-7.6%）的背离走势。", "table": [["7月水泥产量", "640万吨（+3.2%）"]], "sourceFull": "https://www.kommersant.ru/doc/8891548"}, {"num": 12, "title": "俄最大银行上半年汽车贷款组合增长35-40%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-17 20:44", "summary": "Sberbank与T-Bank上半年汽车贷款组合增长35-40%，专家提示车价上涨与居民债务负担上升风险。汽车金融热度延续，反映俄车市需求仍旺，汽车用品/配件类目或持续受益。", "table": [["汽车贷款增速", "+35-40%（上半年）"]], "sourceFull": "https://www.kommersant.ru/doc/8891531"}, {"num": 13, "title": "俄国企偿还中小企业欠款17.4亿卢布，占申报债务60%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-18 01:43", "summary": "俄政府以\"手动模式\"推动国企清偿对中小企业欠款：2026年已偿还申报债务的60%（17.4亿卢布）。政府持续以行政手段改善中小企业现金流、缓解拖欠问题，B2B供应商回款环境边际改善。", "table": [["已偿还欠款", "17.4亿卢布"], ["偿还比例", "申报债务的60%"]], "sourceFull": "https://www.kommersant.ru/doc/8891479"}, {"num": 14, "title": "7月俄对韩小麦出口1440万美元，创2018年8月以来新高", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-17 15:15", "summary": "据韩海关数据：7月俄对韩小麦出口达1440万美元，创2018年8月以来最高，俄进入韩国小麦供应前三（次于美国、澳大利亚）。俄粮食出口多元化持续推进，农产品出口通道与结算体系持续拓展。", "table": [["对韩小麦出口", "1440万美元（7月）"], ["排名", "韩国供应前三"]], "sourceFull": "https://ria.ru/20260817/rossija-2111385081.html"}, {"num": 15, "title": "俄6月失业率2.2%，劳动力市场稳定但薪资增速放缓", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-17 14:07", "summary": "俄政府通报：6月失业率为2.2%，劳动力市场形势稳定。Regroup调查（近200家企业）显示2026年雇主加薪幅度首次低于预期，77.1%企业以市场薪资为参照（2025年为43.9%），企业更注重生产率提升。居民实际购买力修复节奏趋缓。", "table": [["6月失业率", "2.2%"], ["参照市场薪资企业", "77.1%（2025年43.9%）"]], "sourceFull": "https://ria.ru/20260817/pravitelstvo-2111364661.html"}, {"num": 16, "title": "中俄品牌汽车租赁市场份额首次持平", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-17 06:53", "summary": "2026年前7个月，俄国产与华系品牌在汽车租赁市场（含乘用车与商用车）份额几乎持平，与整体新车市场格局一致；后续走势取决于厂商定价、融资条件与本地化水平。华系车在俄金融租赁渠道渗透加深。", "table": [["租赁份额", "中俄品牌首次持平（前7个月）"]], "sourceFull": "https://ria.ru/20260817/lizing-2111269510.html"}, {"num": 17, "title": "俄优惠房贷发放量下降约50%", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-18 03:09", "summary": "俄联合信贷局（ОКБ）数据：优惠房贷发放量下降约50%（标题级收录，基期与细分数据待核实）。叠加7月新房销售-7.6%，俄住宅市场量价承压，地产后周期家居/家电/建材需求或继续走弱。", "table": [["优惠房贷发放", "-50%（ОКБ）"]], "sourceFull": "https://tass.ru/nedvizhimost/28020379"}, {"num": 18, "title": "希腊旗油轮在KTK新罗西斯克终端附近遭袭", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-17 21:43", "summary": "据Bloomberg：一艘希腊旗油轮8/16在里海管道财团（КТК）新罗西斯克终端附近黑海水域遭袭，无人受伤。КТК为俄主要原油出口通道，袭击事件加剧俄油出口运输安全担忧，地缘风险溢价或继续支撑油价。", "table": [["事件", "希腊旗油轮遭袭（8/16）"], ["伤亡", "无人受伤"]], "sourceFull": "https://ria.ru/20260817/bloomberg-2111451434.html"}, {"num": 19, "title": "俄政府讨论禁止芳烃出口以缓解燃料短缺", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-18 01:29", "summary": "据消息人士：政府经济委员会讨论禁止出口芳烃（苯、苯酚、甲苯、二甲苯），因炼厂检修致产量下降，芳烃作为汽油辛烷值提升组分需求大增，石化原料短缺且价格上涨；8月中旬工作组会议未达成一致（苯/苯酚禁令存在分歧），各部委将征求市场意见。若落地将影响化工品出口。", "table": [["拟禁止出口", "苯/苯酚/甲苯/二甲苯"], ["状态", "讨论中，未定案"]], "sourceFull": "https://www.kommersant.ru/doc/8891588"}, {"num": 20, "title": "美妆栏目：本期无新增重大动态", "tag": "local", "tagText": "本地", "source": "综合检索", "time": "08-18 10:00", "summary": "2026年8月16-18日窗口内，RIA/Lenta/TASS/Interfax/Kommersant检索（含косметика/парфюмерия/уход关键词）未见俄罗斯美妆市场新增重大新闻。按去重规则标注：本期无新增重大动态，不填充旧信息。", "table": [], "sourceFull": ""}, {"num": 21, "title": "电器栏目：本期无新增重大动态", "tag": "local", "tagText": "本地", "source": "综合检索", "time": "08-18 10:00", "summary": "2026年8月16-18日窗口内，RIA/Lenta/TASS/Interfax/Kommersant检索（含электроника/бытовая техника关键词）未见俄罗斯电器市场新增重大新闻（Lenta消费向手机充电/寿命软文不计）。按去重规则标注：本期无新增重大动态，不填充旧信息。", "table": [], "sourceFull": ""}, {"num": 22, "title": "灯具栏目：本期无新增重大动态", "tag": "local", "tagText": "本地", "source": "综合检索", "time": "08-18 10:00", "summary": "2026年8月16-18日窗口内，RIA/Lenta/TASS/Interfax/Kommersant检索（含светильник/освещение/LED/лампы关键词）未见俄罗斯灯具照明市场新增重大新闻。按去重规则标注：本期无新增重大动
