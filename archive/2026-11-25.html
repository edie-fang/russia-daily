（+202%），卖家 1.5 万+，SKU 158 万"]], "sourceFull": "https://www.retail.ru/news/set-m-video-vpervye-nachala-prodavat-avtomobili-v-oflayn-magazine-24-noyabrya-2026-284851/"}, {"num": 11, "cat": "econ", "catText": "经济金融", "title": "杜马三读通过 2027-2029 联邦预算：2027 年支出 48.8 万亿₽、赤字约 5.5 万亿₽", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-24 13:36", "summary": "国家杜马三读通过 2027-2029 联邦预算：2027 年支出 48.8 万亿₽、收入 43.3 万亿₽（赤字约 5.5 万亿₽）；2028 年 50.9/45.8 万亿₽，2029 年 53.9/48.6 万亿₽。396 票赞成、37 票弃权。Силуанов 称赤字降至略高于 GDP 2%，下一步交联邦委员会；预算含约 8.7 万亿₽调整，部分用于国防与安全。", "table": [["2027", "支出 48.8 / 收入 43.3 万亿₽"], ["2028", "支出 50.9 / 收入 45.8 万亿₽"], ["2029", "支出 53.9 / 收入 48.6 万亿₽"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/11/24/1414726-prinyala-proekt-byudzheta"}, {"num": 12, "cat": "econ", "catText": "经济金融", "title": "2027-01-01 起 МРОТ 提至 28,935₽/月（+6.8%），ФНС 接管工伤社保费征管", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-24 14:41", "summary": "杜马通过：2027-01-01 起 МРОТ 提高至 28,935₽/月，较现行 27,093₽ 增长 6.8%；2027-2029 年暂停按中位工资计算 МРОТ 的机制。同步自 2027-01-01 起 ФНС 接管工伤与职业病强制社保费征管。对仓储、ПВЗ 与外包用工成本形成直接上行压力。", "table": [["新 МРОТ", "28,935₽/月（2027-01-01 起）"], ["涨幅", "+6.8%（27,093₽ → 28,935₽）"], ["配套", "ФНС 接管工伤/职业病社保费征管"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/11/24/1414747-povishenie-mrot"}, {"num": 13, "cat": "econ", "catText": "经济金融", "title": "杜马取消地区对贸易等四行业的 УСН 优惠税率，回到 6%/15% 基准", "tag": "local", "tagText": "本地", "source": "MPUP", "time": "11-24 16:14", "summary": "杜马通过税改修正案：地区不得再对贸易、建筑、酒店与餐饮提供 УСН 优惠税率，统一回到 6%（收入）与 15%（收入减支出）基准，法律尚待签署。此前在优惠地区注册的卖家将失去低税率；官方通知未发布，具体适用范围与生效日待核实，需按注册地逐一确认。", "table": [["变化", "地区不再能给贸易等四行业 УСН 优惠"], ["基准税率", "6%（收入）/ 15%（收入-支出）"], ["状态", "已通过，待签署（细则待核实）"]], "sourceFull": "https://mpup.ru/news/gosduma-prinyala-popravki-ogranichiv-regionalnye-nalogovye-lgoty-dlya-q5fivcf0"}, {"num": 14, "cat": "econ", "catText": "经济金融", "title": "央行 11-25 官方汇率：美元 82.1664₽、欧元 89.8818₽、人民币 12.2767₽", "tag": "local", "tagText": "本地", "source": "Lenta.ru", "time": "11-24 18:13", "summary": "俄央行公布 11-25 生效官方汇率：美元 82.1664₽（前值 82.15，+0.02%）、欧元 89.8818₽（前值 90.28，-0.44%）、人民币 12.2767₽。卢布对美元基本持平、对欧元小幅升值；11-24 莫斯科交易所人民币盘中约 12.29₽。进口采购与结汇成本短期稳定。", "table": [["USD", "82.1664₽（前值 82.15）"], ["EUR", "89.8818₽（前值 90.28）"], ["CNY", "12.2767₽（MOEX 盘中约 12.29）"]], "sourceFull": "https://lenta.ru/news/2026/11/24/tsb-povysil-kurs-dollara-v-rossii/"}, {"num": 15, "cat": "econ", "catText": "经济金融", "title": "美拟对欧盟、中国等 16 国加征关税，中国面临最严限制（税率未定）", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-24 17:39", "summary": "WSJ 报道：美贸易代表办公室本周将公布对欧盟、中国等 16 国产业补贴调查结果，并可能据此加征关税；7 月已对 86 国加征 10%-12.5%（依 1974 年贸易法，上限 15%、期限 150 天）。消息称中国面临最严限制，具体税率未定。对经中国直采或第三国转口的供应链构成成本与合规风险。", "table": [["涉及", "欧盟、中国等 16 国"], ["上一轮", "86 国，10%-12.5%，期限 150 天"], ["状态", "税率未定，待贸易代表办公室公布"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/11/24/1414833-ssha-mogut-vvesti-poshlini"}, {"num": 16, "cat": "politics", "catText": "时政要闻", "title": "11-24 夜五州导弹警报 02:16-03:10 解除；乌法机场一度停降，萨马拉州击退无人机", "tag": "local", "tagText": "本地", "source": "Lenta.ru", "time": "11-25 04:46", "summary": "11-24 夜至 11-25 晨：利佩茨克、沃罗涅日、奥廖尔、图拉、库尔斯克五州 02:16-03:10 发布导弹警报，无伤亡与损毁通报；乌法机场一度暂停起降，萨马拉州同日击退无人机袭击。俄国防部称前一夜乌方向俄发射 30+ 架无人机。中部与伏尔加流域空域风险仍在。", "table": [["警报", "5 州，02:16-03:10，无伤亡"], ["机场", "乌法临时限制起降"], ["前夜", "乌方 30+ 架无人机"]], "sourceFull": "https://lenta.ru/news/2026/11/25/raketnuyu-opasnost-ob-yavlyali-srazu-v-pyati-rossiyskih-regionah/"}, {"num": 17, "cat": "politics", "catText": "时政要闻", "title": "英乌签署协议：允许乌克兰在英国境内建攻击型无人机工厂", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "11-25 02:47", "summary": "乌克兰与英国签署新协议，允许乌方在英国境内建设攻击型无人机工厂；英防长 Стритинг 在基辅与泽连斯基签署。俄方称此举直接卷入冲突，相关运输将成为合法打击目标。对欧洲供应链与空运风险属中期变量，短期不改变俄境内仓配格局。", "table": [["签署方", "英国国防部 / 乌克兰"], ["内容", "在英境内建攻击型无人机工厂"], ["俄方反应", "称相关运输将成合法打击目标"]], "sourceFull": "https://ria.ru/20261125/ukraina-2133743243.html"}, {"num": 18, "cat": "politics", "catText": "时政要闻", "title": "特朗普：对伊军事行动资金可撑到 1 月底，称从未主张推翻伊朗政权", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "11-25 04:51", "summary": "特朗普对《纽约邮报》称，美国对伊朗军事行动的资金「可支撑到 1 月底」，并称民主党可能阻挠；他表示自己「从未支持也未反对」推翻伊朗政权。美以自 2 月 28 日起打击伊朗目标，冲突处于间歇但未解决。油价与霍尔木兹航运对升级消息仍高度敏感。", "table": [["资金", "覆盖至 2027-01 底"], ["立场", "自称不主张政权更迭"], ["冲突", "2-28 起美以打击伊朗，未停火"]], "sourceFull": "https://ria.ru/20261125/tramp-2133749263.html"}, {"num": 19, "cat": "politics", "catText": "时政要闻", "title": "波兰就 11-20 三枚「俄导弹」进入领空召见俄大使，递交抗议照会", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "11-24 19:54", "summary": "波兰外交部就 11-20 三枚「俄方导弹」进入领空召见俄大使 Михно 并递交抗议照会，称导弹落入卢布林省新利波维采与喀尔巴阡山省两处；波方已提升 Patriot 战备。俄方未承认，事件待核实。北约东翼紧张对经波兰的陆路中转与欧洲仓配构成潜在扰动。", "table": [["时间", "11-20 事件，11-24 递交照会"], ["落点", "卢布林省、喀尔巴阡山省 3 处"], ["状态", "俄方未承认，待核实"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/11/24/1414894-posol-vizvan-v-mid"}, {"num": 20, "cat": "politics", "catText": "时政要闻", "title": "美陪审团认定华为及三家子公司违反伊朗制裁、窃取技术，量刑定于 2027-09-04", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "11-25 01:54", "summary": "美联邦陪审团认定华为及三家子公司犯有共谋窃取商业秘密与电汇欺诈；母公司另被认定违反《国际紧急经济权力法》、为伊朗提供金融服务等共 10 项，量刑定于 2027-09-04。对经中国供应链采购的卖家属合规警示：涉伊朗业务、第三国转口与美元结算仍是高风险环节。", "table": [["被告", "Huawei 及 3 家子公司"], ["罪名", "制裁违规、窃密、银行欺诈等 10 项"], ["量刑", "2027-09-04"]], "sourceFull": "https://ria.ru/20261125/ssha-2133741609.html"}]}
