{"date": "2026-10-04", "stats": {"total": 13, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "cat": "ecom", "catText": "电商动态", "title": "【税务·ПВЗ】国家杜马收到法案：取货点（ПВЗ）拟按地籍价值计征财产税，不论产权归属", "tag": "local", "tagText": "本地", "source": "Retail.ru", "time": "10-03 10:30", "summary": "有法案提交国家杜马，拟将订单取货点（ПВЗ）纳入按地籍价值（кадастровая стоимость）计征财产税的设施清单。该口径目前适用于购物中心、商铺、餐饮、办公与生活服务场所：楼宇中被用于上述用途的面积≥20%，即按商业物业计税。Wildberries 主张，税务认定不应取决于 ПВЗ 归谁所有。同期动态：欠税卖家商品卡将被屏蔽、税务违规罚款拟提高 3 倍。含义：取货点持有方（平台直营与加盟）税负或上升，可能传导至取货点佣金与我方末端履约成本。", "table": [["主体", "法案（已提交国家杜马）"], ["计税口径", "按地籍价值；商业用途面积≥20%"], ["行业诉求", "税务认定不应取决于 ПВЗ 产权归属"], ["关联", "欠税商品卡屏蔽；税务罚款拟 ×3"]], "sourceFull": "https://www.retail.ru/news/pvz-predlozhili-oblagat-nalogom-na-imushchestvo-po-kadastrovoy-stoimosti-3-oktyabrya-2026-282886/"}, {"num": 2, "cat": "ecom", "catText": "电商动态", "title": "【渠道·更新】独立电商继续爆发：订单 +87%、М.Видео 自 10-01 上调佣金", "tag": "local", "tagText": "本地", "source": "CNews / Forbes", "time": "10-02 12:00", "summary": "据 Forbes（援引 Яндекс Пэй / INFOLine / Data Insight）数据：7–8 月私有网店订单同比 +87%、成交额 +36%（较 5–6 月）；8 月俄罗斯私有网店数量环比 +59%；预计 2026 全年私有网店销售 +25,8% 至 5,75 万亿卢布，独立电商份额自 32,4% 回升至 34,9%。М.Видео 自 10-01 起上调卖家佣金；СберИндекс 显示 9 月俄罗斯人在平台的支出环比 7–8 月 -15%。含义：头部平台佣金上行叠加仓损风险，推动卖家转向自建渠道与 FBS；我方宜评估自有站/私域与平台的双轨布局。", "table": [["订单", "7–8 月 +87% г/г"], ["成交额", "7–8 月 +36% г/г"], ["私有网店数", "8 月环比 +59%"], ["2026 预测", "+25,8% → 5,75 万亿卢布"], ["份额", "32,4% → 34,9%"], ["М.Видео", "10-01 起上调佣金"]], "sourceFull": "https://www.cnews.ru/news/top/2026-10-02_wildberries_i_ozon_doigralis_s_komissiyami"}, {"num": 3, "cat": "ecom", "catText": "电商动态", "title": "【合规·标识】包装水「 разрешительный режим」年内拦截 6500 万次违规售卖；线上占比升至 14,3%", "tag": "local", "tagText": "本地", "source": "Ведомости", "time": "10-02 10:28", "summary": "Роспотребнадзор 通报：2026 年初以来，依托「 разрешительный режим」（收银端校验包装水标识）已拦截逾 6500 万次违规售水尝试，制度运行以来累计约 2 亿次。1–8 月入市包装水 107 亿升（同比 +0,5%），国产占 98,4%；线上（дистанционная）销售 8 个月 +91,9%，占比由 7,9% 升至 14,3%。收银在线校验：大型连锁自 2024-05-01 起、其余卖家自 2024-09-01 起；离线校验自 2025-03-01 起。含义：标识与追溯合规趋严，线上水饮类卖家须确保商品已贴码并通过校验。", "table": [["年内拦截", ">6500 万次"], ["累计", "约 2 亿次"], ["1–8 月入市", "107 亿升（+0,5%）"], ["国产占比", "98,4%"], ["线上销售", "+91,9%（占比 14,3%）"]], "sourceFull": "https://www.vedomosti.ru/society/news/2026/10/02/1233696-rospotrebnadzor-predotvratil"}, {"num": 4, "cat": "econ", "catText": "经济金融", "title": "【收入】Росстат：7 个地区平均工资超 15 万卢布；全国均值 +9,5% 至约 11 万", "tag": "local", "tagText": "本地", "source": "ТАСС", "time": "10-04 00:34", "summary": "Росстат（7 月数据）：楚科奇、马加丹州、莫斯科、亚马尔-涅涅茨自治区、萨哈林州、涅涅茨自治区、堪察加 7 个地区平均工资超过 15 万卢布；全国平均工资同比 +9,5%，接近 11 万卢布；5 个行业的平均工资超过 20 万卢布。含义：高收入地区与行业人群的消费力相对更强，客单价较高的美妆个护、灯具与小家电可考虑在上述地区/行业人群做定向投放。", "table": [["超 15 万卢布地区", "7 个"], ["全国均值", "约 11 万卢布（+9,5% г/г）"], ["超 20 万卢布行业", "5 个"]], "sourceFull": "https://tass.ru/ekonomika/28179355"}, {"num": 5, "cat": "econ", "catText": "经济金融", "title": "【财政】2027–2029 预算草案：约 19 万亿卢布投向国家项目（技术主权与基建 6,4 万亿）", "tag": "local", "tagText": "本地", "source": "ТАСС", "time": "10-04 01:23", "summary": "国家杜马小企业委员会主席 Дружинин 称，2027 年及 2028–2029 计划期预算草案为国家项目（нацпроекты）安排约 19 万亿卢布；其中技术领导力与基础设施 6,4 万亿卢布，三年内道路基础设施投入 4,4 万亿卢布以上。含义：财政支出维持扩张，基建与技术类需求及政府采购相关品类（照明、电气、工具）或有拉动。", "table": [["国家项目", "约 19 万亿卢布"], ["技术领导力+基建", "6,4 万亿卢布"], ["道路（三年）", ">4,4 万亿卢布"]], "sourceFull": "https://tass.ru/ekonomika/28179371"}, {"num": 6, "cat": "econ", "catText": "经济金融", "title": "【物流】北方海航道 9 月航次创纪录 133 次：环比 +46%、为 2022 年同期 4 倍", "tag": "local", "tagText": "本地", "source": "ТАСС / FT", "time": "10-03 15:08", "summary": "据 Financial Times（援引 Lloyd's List Intelligence），9 月北方海航道（СМП）航次达创纪录的 133 次，为 2022 年 9 月的 4 倍，环比 8 月 +46%；近半数为俄籍船舶，中国船舶亦经此航线绕开中东冲突区域通往欧洲市场。含义：中俄北极航线利用率抬升，为俄线大件/集装箱入俄提供替代通道，Q4 可评估经 СМП 的时效与成本。", "table": [["9 月航次", "133 次（纪录）"], ["vs 2022-09", "4 倍"], ["vs 2026-08", "+46%"], ["俄籍船占比", "近一半"]], "sourceFull": "https://fomag.ru/news-streem/rekordnye-133-sudna-proshli-po-sevmorputi-v-sentyabre-ft/"}, {"num": 7, "cat": "econ", "catText": "经济金融", "title": "【地缘·能源】NYT：美俄谈判扩大至「数十亿美元石油交易」，牵涉中东企业高层", "tag": "local", "tagText": "本地", "source": "Lenta.ru / NYT", "time": "10-03 13:02", "summary": "《纽约时报》援引消息称，特朗普政府与俄罗斯围绕结束乌克兰战争的谈判已扩展至一项数十亿美元级的石油交易，涉及与美方两名主要谈判代表（威特科夫、库什纳）有关联的中东企业高层；报道称交易与一揽子油田资产相关。含义：若制裁或能源合作出现松动，油价与俄能源出口预期或重估；我方物流与汇率假设需保留情景弹性。", "table": [["来源", "NYT（经 Lenta 转述）"], ["性质", "美俄石油交易谈判"], ["关联方", "威特科夫 / 库什纳 相关中东企业"]], "sourceFull": "https://lenta.ru/news/2026/10/03/stalo-izvestno-ob-obsuzhdenii-rossiey-i-ssha-mnogomilliardnoy-sdelki-po-nefti/"}, {"num": 8, "cat": "econ", "catText": "经济金融", "title": "【能源】ОПЕК+ 部长级监督委员会 10-04 会商油市，另议含俄沙 7 国会议", "tag": "local", "tagText": "本地", "source": "ТАСС", "time": "10-04 00:00", "summary": "据 ТАСС，ОПЕК+ 部长级监督委员会（JMMC）周日（10-04）开会评估油市与协议执行情况；同日另安排含俄罗斯、沙特的 7 个 ОПЕК+ 国家会议。JMMC 无产量决定权，仅监督履约与分析市场，但可提出建议。含义：短期油价对供应政策预期的敏感度上升，需关注对卢布与干线运价的影响。", "table": [["会议", "JMMC（10-04）"], ["参会", "7 国（含俄、沙）"], ["职权", "监督履约、可提建议（无产量决定权）"]], "sourceFull": "https://tass.ru/ekonomika/28179335"}, {"num": 9, "cat": "politics", "catText": "时政要闻", "title": "莫斯科方向：ПВО 击落 6 架来袭无人机；Внуково/Домодедово 一度受限，Астрахань/Волгоград 暂停起降", "tag": "local", "tagText": "本地", "source": "РИА Новости / ТАСС", "time": "10-04 01:26", "summary": "莫斯科市长 Собянин 称，防空部队击落 6 架飞向莫斯科的无人机，残骸落点有应急部门处置。同期受无人机威胁影响，Внуково、Домодедово 一度按「许可」接收/放行航班（Внуково 于 04:19 恢复），Астрахань、Волгоград 机场暂停起降。含义：首都及南部空域扰动反复出现，影响商务出行与空运时效，涉航空货运需预留备选路线。", "table": [["莫斯科方向", "击落 6 架"], ["Внуково", "04:19 恢复正常起降"], ["Домодедово", "按许可放行"], ["Астрахань/Волгоград", "暂停起降"]], "sourceFull": "https://ria.ru/20261004/moskva-2122063504.html"}, {"num": 10, "cat": "politics", "catText": "时政要闻", "title": "图拉州上空击落 13 架无人机", "tag": "local", "tagText": "本地", "source": "ТАСС / РИА Новости", "time": "10-04 01:39", "summary": "据俄方通报，防空部队在图拉州（Тульская область）上空击落 13 架无人机。含义：莫斯科以南空域与相关州的基础设施风险仍在，经该走廊的俄线陆运/铁路时效需持续关注。", "table": [["击落数量", "13 架"], ["区域", "Тульская область"]], "sourceFull": "https://tass.ru/proisshestviya/28179377"}, {"num": 11, "cat": "politics", "catText": "时政要闻", "title": "别尔哥罗德：无人机袭击居民区，有儿童受伤、私人住宅受损", "tag": "local", "tagText": "本地", "source": "Lenta.ru / Известия", "time": "10-04 01:09", "summary": "通报称乌克兰无人机袭击别尔哥罗德（Белгород）居民区，有儿童受伤、多处私人住宅受损；乌方当日亦对别尔哥罗德州多个市镇实施打击。含义：边境州安全形势紧张，周边仓储与运输的风险溢价上升，涉南部/边境线路需关注安全与保险成本。", "table": [["地点", "Белгород 居民区"], ["伤亡", "有儿童受伤"], ["损失", "私人住宅受损"]], "sourceFull": "https://lenta.ru/news/2026/10/04/long-super/"}, {"num": 12, "cat": "politics", "catText": "时政要闻", "title": "梅德韦杰夫：上合组织转向本币结算是对制裁的回应；俄伊贸易额继续增长", "tag": "local", "tagText": "本地", "source": "ТАСС", "time": "10-03 22:19", "summary": "梅德韦杰夫表示，上合组织（ШОС）成员国转向本币相互结算，是对西方制裁的回应；他同时指出俄伊贸易额继续增长，俄伊关系处于「前所未有」的高水平，Решт—Астара 铁路为区域发展驱动力。含义：去美元化与本币结算推进，利好卢布/人民币结算与俄线贸易，但需同步关注制裁与合规风险。", "table": [["主张", "ШОС 转向本币结算"], ["动因", "回应制裁"], ["俄伊", "贸易额继续增长"]], "sourceFull": "https://tass.ru/ekonomika/28179245"}, {"num": 13, "cat": "politics", "catText": "时政要闻", "title": "白俄罗斯：与美对话不以损害俄中关系为代价", "tag": "local", "tagText": "本地", "source": "РИА Новости", "time": "10-04 04:04", "summary": "白俄罗斯外长 Рыженков 称，明斯克与华盛顿就双方关切议题保持对话，但不以损害与俄罗斯、中国的关系为代价。含义：区域外交格局出现微调，白俄作为对欧/对俄物流节点的地位需持续观察。", "table": [["主体", "白俄外长 Рыженков"], ["口径", "与美对话不损害俄中关系"]], "sourceFull": "https://ria.ru/20261004/minsk-2122068197.html"}]}
