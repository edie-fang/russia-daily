{"date": "2026-10-10", "stats": {"total": 26, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "cat": "platform", "catText": "平台规则变动", "title": "Ozon×«Ингосстрах» 商品保险（含无人机袭击损失）10-13 起停保", "tag": "local", "tagText": "本地", "source": "Ozon 卖家公告(seller.ozon.ru)｜俄《Vedomosti》", "time": "10-09 22:10", "summary": "Ozon 与 СПАО«Ингосстрах» 宣布自 2026-10-13 起关闭面向卖家的「商品大规模损坏」保险，其保障范围包含商品批量损坏与无人机袭击造成的损失。保单有效期至 10-12 23:59（МСК），10-13 起在卖家后台停用，再保险容量（перестраховочная ёмкость）已收缩。此前 10-05 起平台已放宽该项激励条件——卖家不再需要把价格保持在低于常规赔付额 5% 以上。平台称其余卖家支持措施保留，相关赔付累计已达 82 亿 ₽；10-12 前发生的保险事故仍按约赔付。", "table": [["⏱ 生效时间", "2026-10-13（保单有效至 2026-10-12 23:59 МСК）"], ["🎯 实际影响", "风控与库存保障环节：俄仓与在途库存失去「大宗货损＋无人机袭击」赔付通道，仓库遇袭、火灾、批量货损将全由卖家自担，直接影响旺季备货的风险敞口"], ["✅ 建议动作", "风控+财务在本周内盘点在保货值与剩余保期，10-13 前完成替代方案评估（第三方货运/仓储险），并把仓损风险纳入旺季备货与定价决策"]], "sourceFull": "https://seller.ozon.ru/media/news/strahovka-tovarov-ot-massovyh-povrezhdenij-zakryvaetsya/"}, {"num": 2, "cat": "platform", "catText": "平台规则变动", "title": "Ozon：新注册卖家服装/鞋类费率降至 27%（10-06 起，优惠至 2027-03-31）", "tag": "local", "tagText": "本地", "source": "Ferta 平台规则监测(Ozon 费率表)", "time": "10-05 12:00", "summary": "自 2026-10-06 起，凡在 2026-10-01（含）之后首次注册卖家账号并接受 oферта 的新卖家，fashion（服装/鞋类）类目在全部销售方案下的销售费率降至 27%，优惠期至 2027-03-31（含）；此前已注册的卖家不适用。同期放宽拼箱规则：10-01 至 12-31 提交的供货申请，可在同一 грузоместо（拼箱）内混装非服装鞋类商品，按各自费率计费。", "table": [["⏱ 生效时间", "2026-10-06（优惠至 2027-03-31）"], ["🎯 实际影响", "成本与准入环节：为服装鞋类提供近 5 个月的降佣窗口，适合以新主体开号测试时尚类目；老主体需评估另开账号带来的主体、税务与结算合规成本"], ["✅ 建议动作", "时尚类目负责人评估是否在年内以新主体开号，11 月前完成类目结构、定价与合规成本测算"]], "sourceFull": "https://ferta.su/izmeneniya/2026-10-05-ozon-commissions-archive-536"}, {"num": 3, "cat": "platform", "catText": "平台规则变动", "title": "Wildberries：商品卡内资质文件（证书/声明）要件将对买家公开（10-08 起）", "tag": "local", "tagText": "本地", "source": "Ferta 平台规则监测(Wildberries)", "time": "10-08 12:00", "summary": "WB 修订「许可文件（разрешительные документы）」章节：卖家录入商品卡的许可文件要件（сертификаты/декларации/СГР 等）将直接展示在 WB 网站与 App 商品页；对依法必须提供许可文件的商品，填写义务保留。该改动与 2026-10-01 起生效的平台经济法配套要求同源——商品卡须标注许可文件信息，缺少文件或文件状态异常（РФ 文件缺失/状态错误，ЕАЭС 文件失效/暂停/终止）已成为拒绝入市的新依据。证书缺项或与实物不符将被买家直接看到。", "table": [["⏱ 生效时间", "2026-10-08（配套法规自 2026-10-01 起）"], ["🎯 实际影响", "合规与上架环节：证书与声明信息由「后台存档」变为「对外公示」，缺证、过期或主体不一致会同时触发下架风险与买家信任损失"], ["✅ 建议动作", "合规专员在 10 月内逐 SKU 核对许可文件有效期与申报主体一致性，优先补齐 ЕАЭС 文件与 СГР；无法补证的 SKU 主动下架"]], "sourceFull": "https://ferta.su/izmeneniya/2026-10-08-wb-certificates-572"}, {"num": 4, "cat": "platform", "catText": "平台规则变动", "title": "Wildberries：明确交付点（ПВЗ/ППТ/ПФЦ/СЦ）增值服务收费与验收单 10 日期限（10-08 起）", "tag": "local", "tagText": "本地", "source": "Ferta 平台规则监测(Wildberries)", "time": "10-08 12:00", "summary": "WB 修订《仓库与分拣中心收货》规则：验收单（акт приёмки）须在货件交付至发货点后 10 天内出具；明确「箱体准备」（在 ПВЗ/ППТ 交货时）与「商品处理」（在 ПВЗ、ППТ、ПФЦ 或 СЦ 交货时，含分拣等）为付费服务。另自 10-05 起，分拣中心与 фулфилмент-центр 的到货处理仍免费，自备仓发货单据中「处理费」字段改名「Приёмка」，在仓库地图上改为选择发货点。", "table": [["⏱ 生效时间", "2026-10-08（其中部分条款自 2026-10-05 起）"], ["🎯 实际影响", "履约成本环节：交货至 ПВЗ/ППТ 将产生可预见的箱体准备与处理费，需重算「直送自提点」的单件成本；验收单 10 日期限使跟单更紧、货损与短少的申诉窗口收窄"], ["✅ 建议动作", "仓储/物流在下一批供货前核算各发货点（ПВЗ/ППТ/ПФЦ/СЦ）的箱体准备费与处理费，并把「验收单 10 天内核对」写入收货 SOP"]], "sourceFull": "https://ferta.su/izmeneniya/2026-10-08-wb-acceptance-warehouse-sc-568"}, {"num": 5, "cat": "platform", "catText": "平台规则变动", "title": "Ozon：首批评价单条悬赏上限由 10 000 降至 5 000 积分（10-26 起）", "tag": "local", "tagText": "本地", "source": "Ferta 平台规则监测(Ozon 费率表)", "time": "10-08 12:00", "summary": "自 2026-10-26 起，Ozon 费率条款 п.2.25 把「Сбор первых отзывов（征集首批评价）」中评价作者单条评价可获得的最高奖励由 10 000 积分下调至 5 000 积分，同时取消 2026-07-15 至 09-15 的临时例外（该期间购买的商品不计固定费率）。计费公式未变：S + (P+B)×(1+НДС)，其中 S=300 ₽、P 为折后价、B 为买家使用积分。对使用该服务的卖家，单条评价的支出上限下降。", "table": [["⏱ 生效时间", "2026-10-26"], ["🎯 实际影响", "成本环节：新品冷启动的「首批评价」单条成本上限减半，测评预算可下调；但奖励吸引力下降可能拉长评价积累周期，需用广告补位"], ["✅ 建议动作", "运营把新品上市 SOP 中的单条评价预算上限改为 5 000 积分，并测试以少量站内广告替代部分测评投入"]], "sourceFull": "https://ferta.su/izmeneniya/2026-10-08-ozon-commissions-archive-574"}, {"num": 6, "cat": "ecom", "catText": "电商动态", "title": "Ozon：2026 年初以来识别可疑订单 32.2 万笔、涉额 114 亿 ₽", "tag": "local", "tagText": "本地", "source": "零售报(Retail.ru)｜Ozon", "time": "10-09 20:15", "summary": "Ozon 监管政策总监 А. Васильев 向 ТАСС 表示，2026 年初以来平台借助机器学习识别出带欺诈特征的可疑订单 322 тыс. 笔、涉额 11,4 млрд ₽，并封禁买卖双方聊天中近 60 万条可疑信息；联合伙伴关停约 200 个仿冒 App 与逾 1.1 万个仿 Ozon 钓鱼站点。AI 每天核查约 2 200 万张商品卡以发现错误、违规与非法内容。近三年欺诈操作与投诉量下降 10 倍，同期交易额增长 3 倍。", "table": [["可疑订单（2026 年初以来）", "32.2 万笔（涉额 114 亿 ₽）"], ["封禁可疑聊天信息", "近 60 万条"], ["关停仿冒 App / 钓鱼站点", "约 200 个 / 逾 1.1 万个"], ["AI 日均核查商品卡", "约 2 200 万张"]], "sourceFull": "https://www.retail.ru/news/ozon-vyyavil-podozritelnye-zakazy-na-11-4-mlrd-rubley-s-nachala-2026-goda-9-oktyabrya-2026-283167/"}, {"num": 7, "cat": "ecom", "catText": "电商动态", "title": "«БериБеру» 启用第 50 个自提柜，自提柜租赁市场同比增长 44%", "tag": "local", "tagText": "本地", "source": "零售报(Retail.ru)", "time": "10-09 16:48", "summary": "平台«БериБеру» 宣布启用第 50 个 постамат（自助取货柜），并援引数据称俄罗斯自提柜租赁市场规模同比增长 44%。自提柜与自提点网络加速扩张，正在改变「最后一百米」交付结构：卖家在设置发货时效与物流方案时多了一条低成本交付通道，头部城市与非头部城市的交付时效差距也可能拉大。", "table": [["«БериБеру» 自提柜数量", "第 50 个（新启用）"], ["俄自提柜租赁市场", "同比 +44%"]], "sourceFull": "https://www.retail.ru/news/beriberu-otkryl-50-y-postamat-na-fone-rosta-rynka-arendy-na-44--9-oktyabrya-2026-283160/"}, {"num": 8, "cat": "ecom", "catText": "电商动态", "title": "Сбербанк：市场平台周转逐步恢复，无需新增储备或专项救助", "tag": "local", "tagText": "本地", "source": "俄《Vedomosti》｜Сбербанк/Interfax", "time": "10-09 11:18", "summary": "Сбербанк 副董事长兼财务总监 Т. Скворцов 表示，市场平台（маркетплейсы）周转正逐步恢复，按目前财务状况分析无需对其贷款追加拨备，已计提的储备足够；重组申请量同步下降（峰值在 7–8 月）。7–8 月该行已就受影响最重的一家市场平台（WB）单独追加储备，对 Ozon 未采取额外措施。另据 Vedomosti，政府 10-02 已对受无人机袭击影响的市场平台卖家给予最长 12 个月的税款缓缴并暂停检查（涉及 2026-08 至 2027-07 应缴的增值税、利润税、УСН/НПД、个税及保险缴款）。", "table": [["平台周转", "逐步恢复；无需追加拨备"], ["贷款重组申请", "下降（峰值 7–8 月）"], ["已出台纾困", "10-02 起最长 12 个月税款缓缴＋暂停检查"]], "sourceFull": "https://www.vedomosti.ru/investments/news/2026/10/09/1235695-sberbank-ne-vidit"}, {"num": 9, "cat": "beauty", "catText": "美妆个护", "title": "«Лента» 前股东、「Рив Гош」共同所有者 Костыгин 被软禁", "tag": "local", "tagText": "本地", "source": "零售报(Retail.ru)", "time": "10-09 14:26", "summary": "据 retail.ru 报道，«Лента» 前共同所有者、美妆连锁 «Рив Гош» 共同所有者 Д. Костыгин 被采取软禁（домашний арест）强制措施（案件指控与涉案金额待核实）。事件处于零售与美妆连锁渠道的资本层面，短期不改变门店与线上运营，但美妆专营渠道的股权结构与供应链稳定性值得跟踪，作为线下渠道风险的观察样本。", "table": [], "sourceFull": "https://www.retail.ru/news/eks-sovladeltsa-lenty-i-riv-gosh-kostygina-otpravili-pod-domashniy-arest-9-oktyabrya-2026-283149/"}, {"num": 10, "cat": "appliance", "catText": "家电电器", "title": "预警：2027 年多类电子设备涨价，内存短缺推高路由器、充电宝、低价手机与主机", "tag": "local", "tagText": "本地", "source": "连塔网(Lenta.ru)｜BGR/Omdia", "time": "10-09 20:01", "summary": "据 BGR 援引分析师观点，2027 年多类电子设备将因内存持续短缺与电池成本上升而涨价：据 Omdia 预测，售价低于 400 美元（约 3.4 万 ₽）的入门机型在市场上的可选数量可能减少 22%；路由器等网络设备专用内存在 2026 年涨价近 700%；充电宝受锂价全年上行推动涨价；游戏主机已开始涨价（含光驱版 Xbox Series X 等）。对跨境卖家：2027 年备货成本与选品结构需提前重估。", "table": [["入门手机（<$400）可选机型", "预计减少 22%（Omdia）"], ["路由器/网络设备专用内存", "2026 年涨价近 700%"], ["受影响品类", "低价手机、充电宝、路由器、游戏主机"]], "sourceFull": "https://lenta.ru/news/2026/10/09/prices/"}, {"num": 11, "cat": "appliance", "catText": "家电电器", "title": "«М.Видео»：白俄罗斯品牌家电销售 +34,3%，Gefest 占金额份额 63,3%", "tag": "local", "tagText": "本地", "source": "零售报(Retail.ru)｜«М.Видео»", "time": "10-09 10:27", "summary": "«М.Видео» 统计 2025-09 至 2026-09 白俄罗斯品牌销售：金额同比 +34,3%。Gefest 以 63,3% 居首、Atlant 28,9%、Horizont 6,4%（前三合计近 99%）。需求集中在大件厨电（占 56,2%）、冰箱与冷柜（26,7%）、嵌入式（7,1%），三者合计逾 90%；品类还扩展到电视与电脑设备。渠道端新增「Сделано в Беларуси」专区以集中陈列白俄品牌。", "table": [["白俄品牌销售", "同比 +34,3%（2025-09~2026-09）"], ["金额份额", "Gefest 63,3% / Atlant 28,9% / Horizont 6,4%"], ["品类结构", "大件厨电 56,2%、冰箱冷柜 26,7%、嵌入式 7,1%"]], "sourceFull": "https://www.retail.ru/news/m-video-prodazhi-belorusskoy-tekhniki-vyrosli-na-34-3-vo-ii-kvartale-9-oktyabrya-2026-283132/"}, {"num": 12, "cat": "appliance", "catText": "家电电器", "title": "退出俄市场品牌的笔记本品类开始收缩：8 月起须逐批自办认证，无证无法清关", "tag": "local", "tagText": "本地", "source": "零售报(Retail.ru)｜《消息报》/РАТЭК", "time": "10-09 07:23", "summary": "据《消息报》，2026 年 8 月起俄对笔记本、耳机与充电设备的合格证书（сертификат соответствия）办理规则变更：每个进口商必须就每一批进口笔记本自行办理合格文件；此前可由生产商或大型经销商办理一次、其他主体凭统一数据库中的既有文件进口同一型号。无证书则无法完成海关清关。小批量进口（Dell、HP、Apple 等在俄的典型进货方式）已不经济，美国品牌笔记本品类开始收缩、部分型号短缺，笔记本价格上涨 3–4%；РАТЭК 确认该状况，并指出已退出俄市场的厂商不再办理认证。", "table": [["新规生效", "2026 年 8 月（逐批自办认证）"], ["直接后果", "无证书无法清关；小批量进口不经济"], ["价格与品类", "笔记本价格上涨 3–4%；美国品牌品类收缩、部分型号短缺"]], "sourceFull": "https://www.retail.ru/news/assortiment-noutbukov-ushedshikh-iz-rf-brendov-nachal-sokrashchatsya-9-oktyabrya-2026-283124/"}, {"num": 13, "cat": "appliance", "catText": "家电电器", "title": "«ВсеИнструменты.ру»：家电养护清洁类商品销量最高增长 5 倍（6–8 月）", "tag": "local", "tagText": "本地", "source": "零售报(Retail.ru)｜«ВсеИнструменты.ру»", "time": "10-09 12:21", "summary": "«ВсеИнструменты.ру» 统计 2026 年 6–8 月：设备养护与定期保养类商品在部分品类销量最高达去年同期 5 倍。其中去离子清洁水全国销量 +5 倍（鄂木斯克 +18 倍、圣彼得堡 +9 倍、喀山 +7 倍、莫斯科 +4 倍）；专用清洗剂 +1,3 倍；空调清洗剂单品 +69%；吸尘器配件（集尘袋、电池、管件、转接头）+12%；表面清洁剂 +12%（叶卡捷琳堡、喀山、下诺夫哥罗德、顿河畔罗斯托夫、萨马拉约 +2 倍）。反映消费者延长在用设备寿命、以养护替代换新的趋势。", "table": [["去离子清洁水", "全国 +5 倍（鄂木斯克 +18 倍）"], ["专用清洗剂", "+1,3 倍；空调清洗剂单品 +69%"], ["吸尘器配件", "+12%；表面清洁剂 +12%"]], "sourceFull": "https://www.retail.ru/news/vseinstrumenty-ru-rossiyane-stali-v-5-raz-chashche-pokupat-sredstva-dlya-ukhoda--9-oktyabrya-2026-283142/"}, {"num": 14, "cat": "econ", "catText": "经济金融", "title": "Минфин：1–9 月联邦预算赤字 5,2 万亿 ₽", "tag": "local", "tagText": "本地", "source": "俄《Vedomosti》｜俄财政部", "time": "10-09 19:36", "summary": "俄财政部公布：2026 年 1–9 月联邦预算赤字为 5,2 万亿 ₽。赤字规模决定国债发行与融资需求，并通过国债收益率、卢布汇率与信贷成本传导至进口采购与物流定价；收入与支出明细（油气收入、非油气收入结构）待核实。", "table": [["1–9 月联邦预算赤字", "5,2 万亿 ₽"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/10/09/1235952-defitsit-byudzheta"}, {"num": 15, "cat": "econ", "catText": "经济金融", "title": "ЦБ 下调官方汇率：美元 84,9 ₽（10-12 前）、欧元 94,97 ₽、人民币 12,67 ₽", "tag": "local", "tagText": "本地", "source": "连塔网(Lenta.ru)｜俄央行", "time": "10-09 17:56", "summary": "俄央行将 10 月 10–11 日（周末）与 10 月 12 日（周一）的官方美元汇率下调至 84,9 ₽，日降近 50 коп.；欧元由 95,4 降至 94,97 ₽，人民币由 12,73 降至 12,67 ₽（日降 6 коп.）。此前央行连续多日将美元维持在 85 ₽ 附近。人民币同时走强——彭博口径的 CNY 指数升至 103,9，为 2022 年 4 月以来最高，年初以来升幅超 5%。汇率直接决定跨境卖家的采购成本与以卢布结算的收入。", "table": [["美元（10-12 前）", "84,9 ₽（日降近 50 коп.）"], ["欧元", "94,97 ₽（自 95,4 下调）"], ["人民币", "12,67 ₽（日降 6 коп.）"]], "sourceFull": "https://lenta.ru/news/2026/10/09/kurs-dollara-upal/"}, {"num": 16, "cat": "econ", "catText": "经济金融", "title": "Brent 下跌 1,2% 至 $103,05/桶；金价随美元走弱上涨", "tag": "local", "tagText": "本地", "source": "俄《Vedomosti》", "time": "10-09 09:42", "summary": "10-09 国际油价 Brent 收跌 1,2% 至 $103,05/桶（当日亦为俄柴油出口限制取消等供应侧消息密集释放的一天）；同日金价在美元走弱与油价下跌背景下上涨。原油价格经海运费与燃油附加费传导至跨境到岸成本，需与 10 月结算价一并跟踪。", "table": [["Brent", "$103,05/桶（-1,2%）"], ["黄金", "上涨（美元走弱、油价下跌）"]], "sourceFull": "https://www.vedomosti.ru/investments/news/2026/10/09/1235660-brent-podeshevela"}, {"num": 17, "cat": "econ", "catText": "经济金融", "title": "莫交所指数站上 2400 点，为 6 月 30 日以来首次", "tag": "local", "tagText": "本地", "source": "塔斯社(ТАСС)", "time": "10-09 23:40", "summary": "莫斯科交易所指数（IMOEX）在晚间交易中升破 2400 点（约 2401,80），为 2026 年 6 月 30 日以来首次（前一日报告口径为重回 2300 点上方）。指数走高反映风险偏好修复与油价、汇率组合变化，对俄本地融资成本与消费信心有边际影响。", "table": [["IMOEX", "约 2401,80（6-30 以来首次站上 2400 点）"]], "sourceFull": "https://tass.ru/ekonomika/28200359"}, {"num": 18, "cat": "econ", "catText": "经济金融", "title": "Сбербанк：1–9 月净利润同比 +18,2%，同时指出企业财务状况恶化", "tag": "local", "tagText": "本地", "source": "俄《Vedomosti》｜Сбербанк", "time": "10-09 10:26", "summary": "Сбербанк 公布 1–9 月净利润同比 +18,2%。同日该行另指出企业客户财务状况出现恶化（详见同日另一条报道：平台类借款人周转恢复、重组申请下降，但对公资产质量仍需观察）。银行盈利增长与实体财务状况分化，意味着旺季前后的信贷条件可能收紧，卖家融资与账期需提前安排。", "table": [["Сбербанк 1–9 月净利润", "同比 +18,2%"]], "sourceFull": "https://www.vedomosti.ru/investments/news/2026/10/09/1235672-pribil-sberbanka"}, {"num": 19, "cat": "politics", "catText": "时政要闻", "title": "普京与特朗普通话约 1.5 小时：谈乌克兰、伊朗与石油产品，或于中国 APEC 峰会会面", "tag": "local", "tagText": "本地", "source": "俄《Vedomosti》｜俄总统助理 Ушаков", "time": "10-10 01:05", "summary": "克里姆林宫助理 Ю. Ушаков 通报：普京与特朗普通话持续约 1.5 小时（比上一次多半小时），「内容充实、气氛友好，双方都不愿先挂电话」。议题包括乌克兰局势（俄方立场不变）、伊朗问题（俄方称与伊朗「可以也必须谈判」、愿接收伊朗铀的提议仍有效）、石油产品供应，以及筹备大规模经济倡议；双方满意现有沟通渠道，并认可在 10 月下旬中国 APEC 峰会期间接触的可能。特朗普在通话中祝贺普京生日并转达夫人问候；乌方对通话反应强烈。", "table": [["通话时长", "约 1.5 小时（较上次多 0.5 小时）"], ["主要议题", "乌克兰、伊朗、石油产品、经济倡议"], ["后续接触", "或借 10 月下旬中国 APEC 峰会"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/10/10/1235978-razgovor-putina-trampa-prodolzhalsya"}, {"num": 20, "cat": "politics", "catText": "时政要闻", "title": "俄取消柴油出口限制，美财政部发放许可：10 月 30 万吨、11 月 50 万吨、12 月 100 万吨", "tag": "local", "tagText": "本地", "source": "Interfax｜塔斯社(ТАСС)｜俄能源部", "time": "10-10 00:24", "summary": "俄能源部副部长 Новак 表示，俄罗斯取消对柴油出口的限制并准备向美国追加供应：10 月供 30 万吨、11 月 50 万吨、12 月 100 万吨，长期可达最高 300 万吨/月。美国财政部（OFAC）已发放临时通用许可（general license），允许俄柴油进入全球市场；美方称后续将就供应条件作进一步说明。特朗普再次感谢俄方，并称美柴油价格已回落；乌方公开批评该安排。", "table": [["10 月供应量", "30 万吨"], ["11 月", "50 万吨"], ["12 月", "100 万吨（长期上限约 300 万吨/月）"], ["美方动作", "OFAC 发放临时通用许可"]], "sourceFull": "https://tass.ru/ekonomika/28200275"}, {"num": 21, "cat": "politics", "catText": "时政要闻", "title": "Ростов-на-Дону 遭大规模无人机袭击：击落逾 50 架，市区起火无伤亡", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)｜Interfax", "time": "10-10 03:44", "summary": "罗斯托夫州州长 Ю. Слюсарь 通报：自周五晚起在该州上空击落逾 50 架无人机（БПЛА），罗斯托夫-на-Дону 市遭到空中袭击并发生火灾，无人伤亡，应急部门正在现场处置、信息将持续更新；同期彭萨州也出现无人机并被拦截。袭击已连续多日覆盖俄南部工业与物流节点，对铁路/公路运输时效构成扰动。", "table": [["击落无人机", "逾 50 架（自周五晚）"], ["地点", "罗斯托夫州 · 罗斯托夫-на-Дону（市区起火）"], ["伤亡", "无（通报时点）"]], "sourceFull": "https://ria.ru/20261010/bpla-2123612983.html"}, {"num": 22, "cat": "politics", "catText": "时政要闻", "title": "卡卢加 «Tenet» 汽车厂因无人机残骸坠落停产", "tag": "local", "tagText": "本地", "source": "俄《Vedomosti》", "time": "10-09 16:29", "summary": "据 Vedomosti，位于卡卢加（Калуга）的 «Tenet» 汽车厂在无人机残骸坠落后暂停生产。该厂是俄境内较新的整车组装项目之一，停摆将影响其零部件供应链排产，也反映出无人机袭击对俄中部工业产能的直接干扰（该州同期还出现数据中心遇袭事件）。停产时长与复产安排待核实。", "table": [["地点", "卡卢加 «Tenet» 汽车厂"], ["原因", "无人机残骸坠落"], ["状态", "停产（时长待核实）"]], "sourceFull": "https://www.vedomosti.ru/auto/news/2026/10/09/1235880-zavod-tenet"}, {"num": 23, "cat": "politics", "catText": "时政要闻", "title": "2026 年诺贝尔和平奖授予 Нави Пиллай，特朗普表示不以为然", "tag": "local", "tagText": "本地", "source": "Interfax", "time": "10-10 04:44", "summary": "2026 年诺贝尔和平奖授予 Нави Пиллай（前联合国人权事务高级专员）。美国前总统特朗普公开表示对该结果并不欣赏，相关表态与其近期推动的俄乌、中东调停议程形成对照。该奖项本身不直接影响俄市场，但围绕调停角色的政治叙事会影响对后续制裁与能源安排的预期。", "table": [["2026 诺贝尔和平奖", "Нави Пиллай"], ["相关表态", "特朗普对结果不满"]], "sourceFull": "https://www.interfax.ru/world/1121538"}, {"num": 24, "cat": "other", "catText": "其它动态", "title": "«Яндекс» 卡卢加数据中心遭无人机袭击，「Алиса」AI 部分功能中断（更新）", "tag": "local", "tagText": "本地", "source": "俄《Vedomosti》｜«Яндекс»", "time": "10-09 16:51", "summary": "继 10-08 梁赞州数据中心遇袭（俄侦查委员会已立案）之后，«Яндекс» 10-09 通报其卡卢加数据中心在无人机袭击中受损；随后 «Алиса» AI 的部分功能出现异常/中断。«Яндекс» 已与多家云服务商达成协议，协助 Yandex Cloud 客户迁移与灾备。当日 «Яндекс» 股价在莫交所下跌约 2%，个股成交额达 130 亿 ₽。含义：平台侧基础设施与 AI 服务的中断风险上升，依赖 Яндекс 生态（Маркет/«Алиса»）的卖家后台与站内流量可能受扰。", "table": [["受影响设施", "卡卢加数据中心（10-08 梁赞州数据中心亦曾遇袭）"], ["服务影响", "«Алиса» AI 部分功能异常；Yandex Cloud 客户获云商迁移支持"], ["市场反应", "股价约 -2%，日成交 130 亿 ₽"]], "sourceFull": "https://www.vedomosti.ru/technology/news/2026/10/09/1235893-chast-funktsii-alisi"}, {"num": 25, "cat": "other", "catText": "其它动态", "title": "ЕЭК 拟要求进口商就关税完税价格书面举证（须附单证）", "tag": "local", "tagText": "本地", "source": "俄《Коммерсантъ》(商人报)", "time": "10-09 21:16", "summary": "ЕЭК 公布决议草案，拟扩大「完税价格（ТС）不实」的判定情形：当不同申报人就相同或同类商品的申报完税价格（含运费、保险、包装等抵境前费用）出现差异时，海关可要求申报人提交书面说明，并须以与供货方的往来函件、可核验来源的全球价格分析等文件佐证。ЕЭК 称不设「无法完成」的要求，但业内担忧价格控制将演变为对交易经济逻辑的审查（「有罪推定」）。对跨境卖家：申报价格与物流成本的举证链条需更完整。", "table": [["发起方", "ЕЭК（决议草案）"], ["新增风险指标", "不同申报人之间完税价格存在差异"], ["举证材料", "与供货方函件、可核验的全球价格分析等"]], "sourceFull": "https://www.kommersant.ru/doc/9023304"}, {"num": 26, "cat": "other", "catText": "其它动态", "title": "Минпромторг：1–9 月电动车与混动车销量 99 749 辆（+94,6%）", "tag": "local", "tagText": "本地", "source": "连塔网(Lenta.ru)｜Минпромторг/ППК", "time": "10-09 17:47", "summary": "据 Минпромторг 与 ППК（电子车辆登记系统）数据，2026 年 1–9 月俄电动与混动新车销量 99 749 辆，同比 +94,6%（去年同期 51 253 辆）；占新车市场 9,3%（去年 5,1%）；俄产车型占比升至 28,4%（去年 12,5%）。混动/电动结构性增长，为车载配件、充电设备与养护类目提供增量空间。", "table": [["1–9 月销量（电动+混动）", "99 749 辆（+94,6%）"], ["占新车市场", "9,3%（去年同期 5,1%）"], ["俄产占比", "28,4%（去年同期 12,5%）"]], "sourceFull": "https://lenta.ru/news/2026/10/09/prodazhi-novyh-elektromobiley-i-gibridov-v-rossii-vyrosli/"}]}
