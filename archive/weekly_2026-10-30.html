引：数据中心遇袭后不确定性上升", "tag": "local", "tagText": "本地", "source": "ТКС.ru / Lenta.ru（本地）", "time": "10-26 ~ 10-29", "summary": "Яндекс 撤回 2026 年财务指引（原预期营收 +20%、调整后 EBITDA 约 3,500 亿卢布），理由是 10 月数据中心遇袭后难以评估影响，将在下一季度视确定性考虑恢复预测。10 月其萨索沃（10-07/08）、卡卢加（10-09）两处数据中心遇袭，三台超算未损但整体迁移，替换设备交期最长 6 个月；Маркет 自 10-11 起把受影响订单剔出质量指数并免延迟费。", "table": [["撤回项", "营收 +20% / EBITDA 3,500 亿 ₽"], ["9M capex", "1,150 亿 ₽"], ["受影响数据中心", "萨索沃（10-07/08）、卡卢加（10-09）"], ["设备替换交期", "最长 6 个月"]], "sourceFull": "https://www.tks.ru/technology/2026/10/29/0004/yandeks-otozval-finansovyij-prognoz-na-2026-god/", "url": "https://www.tks.ru/technology/2026/10/29/0004/yandeks-otozval-finansovyij-prognoz-na-2026-god/"}]}, {"icon": "🏛", "name": "时政", "items": [{"num": 12, "title": "莫斯科方向连续三夜空袭：10-28 全俄 90 架、10-29 莫斯科 74 架、10-30 37 架", "tag": "local", "tagText": "本地", "source": "Интерфакс / ТАСС / Ведомости（本地）", "time": "10-26 ~ 10-30", "summary": "10-28 全俄击落 90 架无人机，10-29 至 03:18 莫斯科方向 74 架，10-30 凌晨再拦 37 架；伏努科沃、多莫杰多沃、谢列梅捷沃多次临时限飞，4 架伊斯坦布尔航班返航。10-26 沃罗涅日遭袭 3 死约 40 伤、单日击落 113 架创 СВО 以来纪录，一列载有 «Локомотив» 球员的客运列车被击中。空域间断关闭直接拉长莫斯科方向干线时效与保险成本。", "table": [["10-28", "全俄击落 90 架"], ["10-29", "莫斯科方向 74 架（至 03:18）"], ["10-30", "莫斯科方向 37 架（至 01:42）"], ["沃罗涅日（10-26）", "3 死约 40 伤、击落 113 架（纪录）"]], "sourceFull": "https://www.interfax.ru/moscow/1125664", "url": "https://www.interfax.ru/moscow/1125664"}, {"num": 13, "title": "三方谈判定在 11-04 之后，阿布扎比筹备推进但俄方称不含停火", "tag": "local", "tagText": "本地", "source": "Ведомости / Интерфакс（本地）", "time": "10-29 ~ 10-30", "summary": "乌沙科夫 10-29 称乌克兰问题三方谈判将在 11-04 之后举行，日期与地点仍在协调；佩斯科夫 10-30 表示阿布扎比的筹备工作并不意味着停火。此前特朗普称会谈「很快」举行、泽连斯基表示愿与普京本人讨论领土交换。谈判窗口正落在 11.11 与黑五备货期，制裁与通关口径在这段时间仍可能反复，跨境链路需按「不确定」预留缓冲。", "table": [["时间", "11-04 之后，日期地点待定"], ["地点", "阿布扎比（筹备中）"], ["停火", "俄方明确称不在议程"], ["定位", "俄方称首次会晤属「试射性」"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/10/29/1240982-trehstoronnie-peregovori", "url": "https://www.vedomosti.ru/politics/news/2026/10/29/1240982-trehstoronnie-peregovori"}, {"num": 14, "title": "第三届俄非峰会莫斯科开幕：48 国确认、22 国元首到场，普京 19 场双边", "tag": "local", "tagText": "本地", "source": "РИА Новости（本地）", "time": "10-28 05:05", "summary": "10-28 第三届「俄罗斯-非洲」峰会在莫斯科开幕，48 个非洲国家确认参会、其中 22 国由国家元首出席，普京当日安排 19 场双边会见；议程覆盖能源、矿产、粮食、制药与数字/金融基础设施，配套经济与人道论坛。峰会直接带出平台侧动作：WB 已向俄买家开放埃塞俄比亚卖家商品，并与肯尼亚洽谈数字贸易投资，非洲成为平台双向开放的试验场。", "table": [["参会", "48 国（元首级 22 国）"], ["双边", "普京 19 场"], ["议题", "能源/矿产/粮食/制药/数字金融"], ["平台侧动作", "WB 开放埃塞俄比亚卖家、洽谈肯尼亚"]], "sourceFull": "https://ria.ru/20261028/putin-2127409441.html", "url": "https://ria.ru/20261028/putin-2127409441.html"}]}, {"icon": "📊", "name": "经济", "items": [{"num": 15, "title": "卢布全周先弱后强：美元 80.5381→80.6761、人民币 12.0557→12.0844，关键利率维持 14%", "tag": "local", "tagText": "本地", "source": "Банк России / Ведомости（本地）", "time": "10-26 ~ 10-30", "summary": "央行官方汇率：10-26 美元 80.5381、人民币 12.0557；10-27 转强至 80.4909；10-29 回落至 80.8664；10-30 回升至 80.6761（欧元 89.8167、人民币 12.0844）。全周卢布对美元微贬 0.17%、对人民币贬 0.24%，高油价结汇与预算季资金回流支撑，进口需求偏弱。关键利率维持 14.00%，10 月居民通胀预期降至 13.2%，为连续回落。", "table": [["USD/RUB", "80.5381 → 80.6761（+0.17%）"], ["EUR/RUB", "90.2429 → 89.8167（-0.47%）"], ["CNY/RUB", "12.0557 → 12.0844（+0.24%）"], ["关键利率 / 通胀预期", "14.00% / 13.2%（10 月）"]], "sourceFull": "https://www.cbr.ru/scripts/XML_daily.asp?date_req=30.10.2026", "url": "https://www.cbr.ru/scripts/XML_daily.asp?date_req=30.10.2026"}, {"num": 16, "title": "布伦特由 109.83 回升至 113.60（+2.53%），欧洲 TTF 首破 100 欧元/MWh（2022-12 以来）", "tag": "local", "tagText": "本地", "source": "РИА Новости / Ведомости / Интерфакс（本地）", "time": "10-28 ~ 10-30", "summary": "ICE 1 月布伦特 10-30 04:44 报 113.60 美元/桶（+2.53%）、WTI 104.94（+2.88%），周内低点 109.83（10-28）；驱动为胡塞再袭沙特能源设施与对俄制裁预期。欧洲 TTF 11 月期货 10-28 涨 4.1% 至 100 欧元/MWh、折约 1,169 美元/千立方米，为 2022-12-21 以来首次，欧盟库存偏低叠加冷冬风险。能源双涨直接推高干线运输与包装成本。", "table": [["Brent（1 月）", "109.83 → 113.60 美元/桶（周内 +3.4%）"], ["WTI（12 月）", "104.94 美元/桶（+2.88%）"], ["TTF 天然气", "100 欧元/MWh（+4.1%，2022-12 以来首破百）"], ["柴油出口", "10 月 51 万吨 → 11 月计划 215 万吨"]], "sourceFull": "https://ria.ru/20261030/neft-2127978441.html", "url": "https://ria.ru/20261030/neft-2127978441.html"}, {"num": 17, "title": "预算与工资：杜马一读 2027-2029 预算、МРОТ 上调至 28,935 卢布，Сбер 上调 GDP 至 1%", "tag": "local", "tagText": "本地", "source": "Ведомости / Коммерсантъ / ТКС.ru（本地）", "time": "10-27 ~ 10-30", "summary": "10-29 杜马一读审议 2027-2029 联邦预算与配套税收法案，并一读通过自 2027 年起把最低工资提至 28,935 卢布/月，仓储、分拣、配送与客服等劳动密集环节成本将随之抬升。Сбер 把 2026 年 GDP 增速预测上调至 1%，认为消费与投资仍有韧性。外部：美联储 10-28 维持 3.75-4.00%，拉加德 10-29 宣布提前卸任欧央行行长；IMOEX 10-27 收 2,510.56（+1.6%），6-16 以来首上 2500。", "table": [["МРОТ（2027）", "28,935 卢布/月（一读通过）"], ["GDP 预测（Сбер）", "1%（上调）"], ["美联储", "维持 3.75-4.00%"], ["IMOEX", "2,510.56（+1.6%，月内 +10%）"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/10/29/1241307-povishenie-mrot", "url": "https://www.vedomosti.ru/economics/news/2026/10/29/1241307-povishenie-mrot"}]}, {"icon": "💄", "name": "美妆", "items": [{"num": 18, "title": "9 月中国对俄化妆品出口 3,360 万美元创单月纪录（×2.2），俄升至中国第三大买家", "tag": "local", "tagText": "本地", "source": "РИА Новости（本地）", "time": "10-26 23:11", "summary": "俄新社据中国海关数据：9 月中国对俄化妆品出口 3,360 万美元，同比增至 2.2 倍、环比 +45%，创单月纪录；前三季度累计 1.914 亿美元（×1.7）。结构上护肤与粉底 1,850 万美元、唇妆 560 万美元。俄已成为中国化妆品第三大出口市场，中国供给在俄美妆进口中的份额继续上移，对本土品牌与代运营形成直接价格压力。", "table": [["9 月出口", "3,360 万美元（×2.2，环比 +45%）"], ["前三季累计", "1.914 亿美元（×1.7）"], ["结构", "护肤+粉底 1,850 万美元 / 唇妆 560 万美元"], ["排名", "中国化妆品第 3 大买家"]], "sourceFull": "https://ria.ru/20261026/postavki-2127166525.html", "url": "https://ria.ru/20261026/postavki-2127166525.html"}, {"num": 19, "title": "RWB 任命 Анна Ларина 为「Рив Гош」总经理，主攻高端香水美妆与全渠道", "tag": "local", "tagText": "本地", "source": "Retail.ru（本地）", "time": "10-29 14:40", "summary": "Wildberries 母公司 RWB 任命 Анна Ларина 接替 Эдгар Шабанов 出任香水美妆连锁「Рив Гош」总经理。她在美妆行业逾 25 年，1998 年起任职 L'Oréal 俄罗斯，曾负责 Lancôme 等品牌。Рив Гош 于 2025 年底并入 RWB 生态，此次人事意味着高端香水与全渠道（门店 + 平台）成为整合重点，供应商谈判口径预计进一步向平台侧收敛。", "table": [["新任总经理", "Анна Ларина"], ["背景", "L'Oréal 俄罗斯 25 年（Lancôme 等）"], ["战略重点", "高端香水美妆 + 全渠道"], ["归属", "RWB（2025 年底并入）"]], "sourceFull": "https://www.retail.ru/news/gruppa-rwb-naznachila-annu-larinu-upravlyayushchim-direktorom-riv-gosh--29-oktyabrya-2026-283837/", "url": "https://www.retail.ru/news/gruppa-rwb-naznachila-annu-larinu-upravlyayushchim-direktorom-riv-gosh--29-oktyabrya-2026-283837/"}, {"num": 20, "title": "拜尔斯道夫明确不退出俄罗斯，Nivea 继续在俄销售", "tag": "local", "tagText": "本地", "source": "РИА Новости（本地）", "time": "10-27 23:34", "summary": "Beiersdorf CEO Vincent Warnery 表示公司不打算退出俄罗斯，Nivea 等品牌继续销售；公司自 2022 年起已停止在俄投资与广告投放，但保留供货。这与部分欧美日化企业撤离形成对比，意味着大众护肤价格带的国际品牌供给延续，平行进口与本地灌装的价格空间被压缩，渠道方的品牌组合预期更稳定。", "table": [["主体", "Beiersdorf（Nivea）"], ["表态", "不退出俄罗斯"], ["在俄投入", "2022 年起停止投资与广告"], ["供货", "维持"]], "sourceFull": "https://ria.ru/20261027/beiersdorf-2127406606.html", "url": "https://ria.ru/20261027/beiersdorf-2127406606.html"}]}, {"icon": "🔌", "name": "电器", "items": [{"num": 21, "title": "手机 IMEI 白名单讨论中：境外自购须在 Госуслуги 登记，未登记或被限制入网（拟 2027-03-01）", "tag": "local", "tagText": "本地", "source": "РИА Новости / Ведомости（本地）", "time": "10-29 00:00", "summary": "Минцифры 正与运营商讨论自 2027-03-01 起对手机实施 IMEI 白名单管理：在俄境外自行购买或携带入境的手机须在 Госуслуги 登记，未登记设备将被限制接入移动网络，目标是打击走私与「影子进口」。方案仍在讨论，纳入范围与执行细则未定；一旦落地，将直接冲击跨境手机与平行进口链条，需提前评估登记流程与售后凭证。", "table": [["拟生效", "2027-03-01（讨论中，未定稿）"], ["登记渠道", "Госуслуги"], ["适用", "境外自购 / 携带入境手机"], ["后果", "未登记限制接入移动网络"]], "sourceFull": "https://www.vedomosti.ru/technology/news/2026/10/29/1241221-mintsifri-obsuzhdaet", "url": "https://www.vedomosti.ru/technology/news/2026/10/29/1241221-mintsifri-obsuzhdaet"}, {"num": 22, "title": "М.Видео 在 5 城开出 marketplace 店中店，平台 1-9 月 GMV 228 亿（+202%）", "tag": "local", "tagText": "本地", "source": "«Ведомости»（本地）", "time": "10-26 12:30", "summary": "М.Видео 已在莫斯科、波多利斯克、喀山、顿河畔罗斯托夫、塞兹兰 5 家门店开设 marketplace 商品专区（店中店），年底前计划再增 6 家。其平台 1-9 月 GMV 228 亿卢布（+202%），SKU 100 万、卖家 1.5 万。线下门店正被改造成第三方卖家的展示与自提节点，家电类卖家可评估入驻以获得到店流量与体验式转化。", "table": [["试点门店", "5 家（年底前 +6 家）"], ["平台 GMV（1-9 月）", "228 亿 ₽（+202%）"], ["SKU / 卖家", "100 万 / 1.5 万"], ["模式", "门店内 marketplace 专区 + 自提"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/10/26/1239667-mvideo-perezapustila", "url": "https://www.vedomosti.ru/business/news/2026/10/26/1239667-mvideo-perezapustila"}, {"num": 23, "title": "М.Видео：9 个月翻新机需求 +4%、均价 3.45 万卢布（Apple 占 55.3%），本周首推电子租赁", "tag": "local", "tagText": "本地", "source": "Retail.ru（本地）", "time": "10-28 ~ 10-29", "summary": "М.Видео 旗下 М.Мастер：1-9 月翻新智能手机需求同比 +4%，均价 3.45 万卢布，8 月开学季环比 +15%；销量份额 Apple 55.3%、Samsung 16.8%，金额份额 Apple 74.9%。10-29 公司又与 Pauri 合作首次上线电子与家电租赁（免押金、按期小额付费），首批含笔记本、手机、平板、音响、游戏机与吸尘器，莫斯科门店将设试点柜台。以租代买开始进入主流渠道。", "table": [["翻新机需求", "+4%（1-9 月 YoY），均价 3.45 万 ₽"], ["份额", "Apple 销量 55.3% / 金额 74.9%"], ["租赁模式", "免押金、按期小额付费（Pauri）"], ["首批品类", "笔记本/手机/平板/音响/游戏机/吸尘器"]], "sourceFull": "https://www.retail.ru/news/m-video-spros-na-vosstanovlennye-smartfony-vyros-na-4-za-9-mesyatsev-28-oktyabrya-2026-283811/", "url": "https://www.retail.ru/news/m-video-spros-na-vosstanovlennye-smartfony-vyros-na-4-za-9-mesyatsev-28-oktyabrya-2026-283811/"}]}, {"icon": "💡", "name": "灯具", "items": [{"num": 24, "title": "Interlight 2026（Smart City & Home）10-27~30 在 Crocus Expo 举办，本周为实际展期", "tag": "local", "tagText": "本地", "source": "Современная светотехника / Lightingmedia.ru（本地）", "time": "10-27", "summary": "国际智慧城市与家居系统解决方案展 Interlight 2026 于 10-27 至 10-30 在莫斯科 Crocus Expo 举行，是俄照明与智能家居领域年度主展（10-09 日报已收录预告，本周进入实际展期）。展期集中发布智能照明、驱动电源与楼宇自动化方案，也是本地渠道商选品与比价窗口。本周俄媒未出现灯具价格或强制性新规，市场层面无实质变化。", "table": [["展期", "2026-10-27 ~ 10-30"], ["地点", "莫斯科 Crocus Expo"], ["定位", "智慧城市 / 家居系统解决方案"], ["本周新政", "无（价格与强制规则均未变动）"]], "sourceFull": "https://lightingmedia.ru/sobytiya/yandeks-na-vystavke-smart-city-home-by-interlight-2026/", "url": "https://lightingmedia.ru/sobytiya/yandeks-na-vystavke-smart-city-home-by-interlight-2026/"}, {"num": 25, "title": "俄照明学科奠基人 Юлиан Айзенберг 逝世，享年 96 岁（10-29）", "tag": "local", "tagText": "本地", "source": "Современная светотехника / Lightingmedia.ru（本地）", "time": "10-30", "summary": "10-29 俄罗斯照明界权威 Юлиан Борисович Айзенберг 逝世，享年 96 岁：技术科学博士、教授、俄电科学院院士、功勋发明家，ВНИСИ 首席研究员，《Светотехника》与《Light & Engineering》主编。他是苏联/俄照明工程学派的核心人物，其主导的照明计算方法与标准体系仍是俄项目招标与能效评估的技术基础，对进入俄工程照明渠道的品牌具有长期参照意义。", "table": [["逝世", "2026-10-29"], ["享年", "96 岁"], ["职务", "ВНИСИ 首席研究员"], ["主编", "《Светотехника》《Light & Engineering》"]], "sourceFull": "https://lightingmedia.ru/sobytiya/skonchalsya-yulian-borisovich-ajzenberg/", "url": "https://lightingmedia.ru/sobytiya/skonchalsya-yulian-borisovich-ajzenberg/"}]}, {"icon": "🚗", "name": "汽车", "items": [{"num": 26, "title": "15 个地区取消燃油限购，但独立加油站四年来首次净减少（注销 935 家 vs 新开 669 家）", "tag": "local", "tagText": "本地", "source": "«Ъ» / Lenta.ru（本地）", "time": "10-30 15:21", "summary": "10 月 15 个地区取消因供应紧张实施的燃油限购（列宁格勒州仍受限），但 «Ъ» 据 Контур.Фокус：1-9 月注销燃油零售企业 935 家（+16.7%，2022 年以来最高）、新注册 669 家（-28.4%），四年来首次注销多于新开；在营 10.72 万家（-2.9%）。批零价差与交易所销售配额下调使独立加油站亏损关停，配送末端加油便利性下降。", "table": [["取消限购", "15 个地区（列宁格勒州仍受限）"], ["注销 / 新注册", "935 家（+16.7%）/ 669 家（-28.4%）"], ["在营（10-01）", "10.72 万家（-2.9%）"], ["结构", "独立加油站占点位 60%、销量 30-40%"]], "sourceFull": "https://lenta.ru/news/2026/10/30/upalo/", "url": "https://lenta.ru/news/2026/10/30/upalo/"}, {"num": 27, "title": "10-30 三座炼厂与一座气化综合体再遭袭，柴油出口禁令拟延至 1 月底", "tag": "local", "tagText": "本地", "source": "Интерфакс（本地）", "time": "10-30 15:45", "summary": "诺瓦克 10-30 通报当日三座炼油厂与一座气化综合体遭袭，一处轻微受损，萨马拉州袭击善后中 2 人死亡；他称袭击在暂停一段时间后重新开始。政府正起草命令把柴油出口禁令延至 2027 年 1 月底，11 月计划出口 215 万吨（10 月为 51 万吨）。燃料供应风险回归，公路运输与干线燃油附加费面临上行，旺季末端配送成本需重新测算。", "table": [["遇袭", "3 座 НПЗ + 1 座气化综合体"], ["伤亡", "萨马拉州 2 人死亡"], ["柴油出口禁令", "拟延至 2027-01 底"], ["出口量", "11 月 215 万吨（10 月 51 万吨）"]], "sourceFull": "https://www.interfax.ru/russia/1126129", "url": "https://www.interfax.ru/russia/1126129"}, {"num": 28, "title": "1-9 月俄二手电动车成交 15,141 辆（+53.8%），Nissan 占 26.6%、Zeekr 第二", "tag": "local", "tagText": "本地", "source": "Автостат / Lenta.ru（本地）", "time": "10-30 12:43", "summary": "Автостат：1-9 月俄二手电动车成交 15,141 辆，同比 +53.8%；Nissan 4,035 辆（26.6%）居首，中国 Zeekr 2,143 辆第二，Tesla 1,368 辆第三。增长与夏季燃油危机、加油站收缩同步，电车二手流通加快也意味着电池健康度与售后成为新的议价点。对配件与充电类卖家，二手电车保有量上升带来后市场需求增量。", "table": [["销量（1-9 月）", "15,141 辆（+53.8%）"], ["Nissan", "4,035 辆（26.6%）"], ["Zeekr / Tesla", "2,143 辆 / 1,368 辆"], ["背景", "燃油危机 + 加油站净减少"]], "sourceFull": "https://lenta.ru/news/2026/10/30/v-rossii-vzletel-spros-na-odin-vid-mashin/", "url": "https://lenta.ru/news/2026/10/30/v-rossii-vzletel-spros-na-odin-vid-mashin/"}]}], "keyData": {"headers": ["指标", "周初（10-26）", "周末（10-30）", "周内变化"], "rows": [["USD/RUB（央行官方）", "80.5381", "80.6761", "卢布微贬 0.17%"], ["CNY/RUB（央行官方）", "12.0557", "12.0844", "卢布对人民币贬 0.24%"], ["Brent 原油（1 月，美元/桶）", "111.94（10-23 收）", "113.60（10-30 04:44）", "周内低点 109.83，累计 +1.5%"], ["WTI（12 月，美元/桶）", "101.04", "104.94", "+3.9%"], ["欧洲 TTF 天然气（欧元/MWh）", "<100", "100.0（10-28）", "+4.1%，2022-12 以来首破百"], ["IMOEX 指数", "2,469.36（10-23）", "2,510.56（10-27 收）", "+1.7%，6-16 以来首上 2500"], ["俄央行关键利率", "14.00%", "14.00%", "不变"], ["居民通胀预期（10 月）", "—", "13.2%", "连续回落"], ["Ozon Q3 营收 / GMV", "—", "4,212 亿 / 1.6 万亿 ₽", "营收 +60%、GMV +42%"], ["Ozon 物流设施损失计提", "—", "301 亿 ₽（11 个设施）", "首次进入财务口径"], ["平台受损仓储面积（6 月底以来）", "—", "≥210 万㎡", "卖家损失数千亿 ₽"], ["电商零售媒体规模（1-9 月）", "—", "5,800 亿 ₽", "+58%，广告市场最快板块"]]}, "trends": [{"title": "电商物流 / 平台政策：旺季与袭击叠加，平台把“时间与体积”变成收费点", "text": "本周主线是履约风险与成本同时抬升。供给端，6 月底以来受损仓储累计不少于 210 万㎡、卖家损失数千亿卢布，7-8 月运输单量同比 -12%，而黑五档期已锁定（М.Видео 11-12、Ozon 11-13~12-02、WB 11-16~11-30），补货窗口已过，缺货与延迟概率上升。平台端则在把可控变量货币化：Ozon 11-19 对 FBS“延长发货期”按单收费、12-05 起自提点按体积计费（≤5 升 4.5 卢布、超出 0.5 卢布/升）；Яндекс Маркет 11-01 改按体积差 10 卢布/升计罚。同时 WB 把卖家门店变成自提点（Click&Collect 全量开放，自提成交一年近 3 倍）、М.Видео 把门店改成 marketplace 店中店，说明平台在抢线下履约节点。卖家应对：把备货期压到平台最优值、复核包装体积、把“多节点 + 自提”纳入履约方案，并用历史 11.11 数据反推安全库存。"}, {"title": "平台资本与基础设施：Ozon 计提、Яндекс 撤回指引，仓储供给中期回补", "text": "Ozon Q3 营收 +60%、GMV +42%、订单 +76%，但同时为 11 个物流设施计提 301 亿卢布损失；Яндекс 直接撤回 2026 年指引（原 +20% 营收、3,500 亿 EBITDA），替换设备交期最长 6 个月。资本开支节奏被打乱，短期意味着平台对费率、补贴和罚则的依赖上升（本周四项费率变动即是印证），中期则看到仓储供给在补：莫斯科区域 1-9 月新建 166.8 万㎡（+30%，历史最高）、成交 +51%，新交付空置率由 62% 降至 38%。风险偏好已改变——租户要求独立建筑、远离平台园区与联邦公路，优先莫斯科州北部与东北部，租金跌势停止。对自建仓或多点布货的卖家，四季度是锁定 2027 年库容与租金的窗口。"}, {"title": "跨境合规：2027 年是分水岭，税、退货、IMEI、准入四条线同时收紧", "text": "① 税：政府放弃 100 卢布/件海关费，只保留 2027 年起 22% 跨境网购增值税（平台代扣，年增财政 750 亿卢布），“低价小包 + 低申报”模式被彻底抹平；② 退货：杜马一读要求合格商品可远程退货、退货运费与风险必须事先披露，并赋予卖家验货权；③ 设备：Минцифры 讨论 2027-03-01 起手机 IMEI 白名单，境外自购须在 Госуслуги 登记，未登记限制入网；④ 准入：ЕАЭС 与中国新版经贸合作计划把跨境电商、СФС 与技术法规列为 2027 年磋商议题。四条线都指向同一结论：2027 年前必须完成“本土仓/白俄通道 + 合规卡片 + 设备登记/认证”的结构性改造；白俄通道本周有缓冲——政府 10-30 第 1424 号令把保证金豁免延至 2027-06-30，但 СПОТ 的 ДОПП/QR 申报仍要跑通。"}, {"title": "经济数据：卢布在 80.5-80.9 区间，高利率与工资上调双向挤压", "text": "全周美元官方汇率在 80.4909-80.8664 区间，收于 80.6761（对美元微贬 0.17%），人民币 12.0844（贬 0.24%）；高油价结汇与预算季资金回流是支撑，进口需求偏弱是拖累。关键利率维持 14.00%，消费与投资有韧性（Сбер 把 2026 年 GDP 上调至 1%），但企业信贷成本高企；10-29 杜马一读通过 2027 年 МРОТ 28,935 卢布，仓储、分拣、配送、客服等劳动密集环节的人工与社保基数将同步抬升。对卖家：需求端不会快速转弱，但资金成本 + 工资上涨 + 平台费率上调三者叠加，2027 年的单位履约成本大概率上台阶，需在 Q4 定价中预留空间。"}, {"title": "能源价格：油、气双涨叠加柴油出口禁令延长，运输成本看涨", "text": "Brent 从周内低点 109.83 回升至 113.60 美元/桶（+2.53%），WTI 104.94；欧洲 TTF 首次自 2022-12 以来突破 100 欧元/MWh（+4.1%，折约 1,169 美元/千立方米），欧盟库存偏低叠加冷冬风险。10-30 三座炼厂与一座气化综合体再遭袭，政府拟把柴油出口禁令延至 2027 年 1 月底，11 月出口计划 215 万吨（10 月 51 万吨）；国内独立加油站四年来首次净减少（注销 935 vs 新开 669）。对跨境链路：干线运费、燃油附加费与包装（塑料/纸）成本在 Q4 均面临上行，报价建议按 Brent 110-115 区间做敏感性测试，并在合同里保留燃油附加条款。"}, {"title": "消费市场：价格敏感度上升，“中国供给 + 翻新/租赁/二手”三条线同时扩张", "text": "① 中国供给：9 月中国对俄化妆品出口 3,360 万美元（×2.2）创单月纪录，俄升至中国第三大买家；中国广告主在 Yandex 投放 ×2.4、电商类 ×9，供给与流量两端同时加码，本土品牌价格带被压缩。② 翻新与租赁：М.Видео 翻新机需求 +4%、均价 3.45 万卢布（Apple 销量 55.3%、金额 74.9%），并首次上线免押金电子租赁。③ 二手新能源：二手电动车 1-9 月 +53.8% 至 15,141 辆（Nissan 26.6%、Zeekr 第二）。三条线共同指向“以更低单价获得同等体验”，新品正价段需靠差异化（售后、套装、延保）而非单纯降价。"}], "sourceStats": "收录 28 条全部来自俄语本地媒体与官方口径（РИА Новости / ТАСС / Интерфакс / «Ведомости» / «Коммерсантъ» / Retail.ru / Lenta.ru / ТКС.ru / RB.ru / Oborot.ru / Банк России / Современная светотехника；其中 РИА 引中国海关、Retail.ru 引 РАЭК·CORE.XP·«Ъ»、Lenta 引 Автостат·«Ъ» 等按本地媒体计）。本地信源 28 条、占比 100%（中文 0%、英文 0%），满足本地 ≥60% 的要求；10-30 白天增量 7 条（Retail.ru / Lenta / Интерфакс / Lightingmedia）已在日报截稿后补入。", "meta": ["报告编号：RU-WEEKLY-2026-W44", "覆盖周期：2026-10-26（周一）~ 10-30（周五），第44周，共 5 个工作日", "收录条目：28 条
