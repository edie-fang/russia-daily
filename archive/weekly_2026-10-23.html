径，宽松窗口后移"]], "sourceFull": "https://www.cbr.ru/press/event/?id=32929", "url": "https://www.cbr.ru/press/event/?id=32929"}, {"num": 16, "title": "卢布全周升值约 3%：官方美元 83.6177→81.1255，人民币 12.4950→12.1460", "tag": "local", "tagText": "本地", "source": "ЦБ РФ（本地）", "time": "10-19 ~ 10-23", "summary": "央行官方汇率：美元 83.6177（10-19 生效）降至 81.1255（10-23，单日 -1.04%），连续两日低于 82；欧元 93.7187→91.1364，人民币 12.4950→12.1460。布伦特走高带来的外汇收入、以及美方暂不追加制裁的表态共同支撑卢布，全周升值约 3%。", "table": [["USD/RUB", "83.6177 → 81.1255（卢布升值 3.0%）"], ["EUR/RUB", "93.7187 → 91.1364"], ["CNY/RUB", "12.4950 → 12.1460（人民币计价采购结汇成本改善）"]], "sourceFull": "https://www.cbr.ru/currency_base/daily/?UniDbQuery.Posted=True&UniDbQuery.To=23.10.2026", "url": "https://www.cbr.ru/currency_base/daily/?UniDbQuery.Posted=True&UniDbQuery.To=23.10.2026"}, {"num": 17, "title": "Brent 突破 113 美元/桶（+4.19%），为 5 月 5 日以来首次；WTI 站上 100", "tag": "local", "tagText": "本地", "source": "«Ведомости»（本地）", "time": "10-22", "summary": "10-22 伦敦 ICE 12 月布伦特盘中最高涨 4.19% 至 113.38 美元，莫斯科时间 20:55 报 113.22（+4.04%），为 5 月 5 日以来首次站上 113；WTI 11 月合约涨 2.94% 至 100.01 美元。触发是也门胡塞武装 10-21 袭击亚丁机场与沙特目标，红海—曼德海峡供应中断担忧升温。", "table": [["Brent（12 月）", "113.22 美元/桶（+4.04%），盘中高 113.38"], ["WTI（11 月）", "100.01 美元/桶（+2.94%）"], ["上次破 113", "2026-05-05"]], "sourceFull": "https://www.vedomosti.ru/investments/news/2026/10/22/1239436-tsena-nefti-brent", "url": "https://www.vedomosti.ru/investments/news/2026/10/22/1239436-tsena-nefti-brent"}]}, {"icon": "💄", "name": "美妆", "items": [{"num": 18, "title": "Дрогери 门店购买频次 8 月 -4.8%，线上已占非食品销售 30% 以上", "tag": "local", "tagText": "本地", "source": "Retail.ru / Infoline（本地）", "time": "10-22", "summary": "2026 年 8 月俄 дрогери 门店购买频次同比 -4.8%，传统零售 -7%、专业连锁 -2.5%，仅便利店（+3.7%）与硬折扣（+8.4%）增长；线上已占非食品销售 30% 以上、部分品类达 40%，日用化工与护肤转移最快。«М.Косметик» 上半年小票 -4.7% 至 2.07 亿张，商场客流 9-28~10-04 同比 -5%。", "table": [["дрогери 频次（8 月）", "-4.8%（传统零售 -7% / 专业连锁 -2.5%）"], ["增长渠道", "便利店 +3.7% / 硬折扣 +8.4%"], ["线上占比", "非食品销售 >30%（部分品类 40%）"]], "sourceFull": "https://www.retail.ru/news/rossiyane-stali-rezhe-priobretat-tovary-v-magazinakh-drogeri-22-oktyabrya-2026-283580/", "url": "https://www.retail.ru/news/rossiyane-stali-rezhe-priobretat-tovary-v-magazinakh-drogeri-22-oktyabrya-2026-283580/"}, {"num": 19, "title": "Faberlic 首次进入传统零售：旗下 «Прайм» 9 个月做到 11 亿卢布", "tag": "local", "tagText": "本地", "source": "Retail.ru（本地）", "time": "10-19", "summary": "Faberlic 首次进入传统零售渠道：旗下零售网络 «Прайм» 前 9 个月营业额 11 亿卢布，销售 Faberlic、Avon 与 Lamoda 商品；Faberlic 2025 年营收 540 亿卢布，同时是 Avon 在俄的独家经销商。本土美妆巨头由直销转全渠道，线下铺货叠加自有品牌，压缩平台中小品牌与白牌的价格带。", "table": [["«Прайм» 9 个月营业额", "11 亿卢布"], ["Faberlic 2025 营收", "540 亿卢布"], ["渠道变化", "直销 → 传统零售（首次）"]], "sourceFull": "https://www.retail.ru/news/kompaniya-faberlic-vpervye-vyshla-v-traditsionnyy-riteyl-19-oktyabrya-2026-283441/", "url": "https://www.retail.ru/news/kompaniya-faberlic-vpervye-vyshla-v-traditsionnyy-riteyl-19-oktyabrya-2026-283441/"}, {"num": 20, "title": "Valentino 完成名称与标识商标注册，Givenchy 同期完成 logo 注册（均不含第 3 类化妆品）", "tag": "local", "tagText": "本地", "source": "New Retail（本地）", "time": "10-19 ~ 10-22", "summary": "意大利 Valentino 在已停止俄市场运营的背景下完成品牌名称与标识在俄的商标注册；法国 Givenchy 同期完成 logo 注册，覆盖第 9/14/18/25 类（电子、珠宝、皮革、服装），明确不含第 3 类化妆品。奢侈品牌保留商标属防备性布局，短期不是回归信号，但香水与配饰的平行进口与授权格局可能变化。", "table": [["Valentino", "名称与标识商标已注册（停止运营背景下）"], ["Givenchy", "logo 注册第 9/14/18/25 类，不含第 3 类化妆品"], ["含义", "防备性布局；香水/配饰的平行进口与授权口径需跟踪"]], "sourceFull": "https://new-retail.ru/novosti/retail/italyanskiy_brend_valentino_oformil_registratsiyu_tovarnykh_znakov_v_rf/", "url": "https://new-retail.ru/novosti/retail/italyanskiy_brend_valentino_oformil_registratsiyu_tovarnykh_znakov_v_rf/"}]}, {"icon": "🔌", "name": "电器", "items": [{"num": 21, "title": "М.Видео：小家电销量 +17.6%、均价 -6%，集团线上小家电 GMV +218%", "tag": "local", "tagText": "本地", "source": "Retail.ru（本地）", "time": "10-19", "summary": "М.Видео-Эльдорадо：2026 年前 9 个月俄大家电销量 +7.1%（金额 +0.2%），小家电销量 +17.6%、金额 +12.9%，均价分别下降 6.4% 与 4%；集团线上 GMV 大家电 +103%、小家电 +218%。小家电呈「量增价减」，平台化是该集团增长主引擎。", "table": [["小家电", "销量 +17.6% / 金额 +12.9% / 均价 -4%"], ["大家电", "销量 +7.1% / 金额 +0.2% / 均价 -6.4%"], ["集团线上 GMV", "大家电 +103% / 小家电 +218%"]], "sourceFull": "https://www.retail.ru/news/m-video-s-nachala-2026-goda-prodazhi-maloy-bytovoy-tekhniki-v-rossii-vyrosli-na--19-oktyabrya-2026-283439/", "url": "https://www.retail.ru/news/m-video-s-nachala-2026-goda-prodazhi-maloy-bytovoy-tekhniki-v-rossii-vyrosli-na--19-oktyabrya-2026-283439/"}, {"num": 22, "title": "折叠屏 1-9 月 9.6 万台 / 97.8 亿卢布、增速降至 +23.7%；iPhone Duo 10-23 开售", "tag": "local", "tagText": "本地", "source": "New Retail / М.Видео / РБК（本地）", "time": "10-22 ~ 10-23", "summary": "2026 年 1–9 月俄折叠屏手机销量约 9.6 万台、营收 97.8 亿卢布，同比 +23.7% 与 +20.4%，绝对量为历史新高，但增速较去年同期 44%/37.4% 明显放缓。折叠屏 iPhone Duo 于 10-23 全球开售，Авито 在售约 800 条、均价 23 万卢布，灰色渠道一度报 150 万卢布。", "table": [["折叠屏销量（1–9 月）", "9.6 万台（+23.7%）"], ["营收", "97.8 亿卢布（+20.4%）"], ["去年同期增速", "+44% / +37.4%（明显放缓）"], ["iPhone Duo", "10-23 开售；Авито 均价 23 万卢布"]], "sourceFull": "https://new-retail.ru/novosti/retail/m_video_spros_na_skladnye_smartfony_v_rf_vyros_na_23_7/", "url": "https://new-retail.ru/novosti/retail/m_video_spros_na_skladnye_smartfony_v_rf_vyros_na_23_7/"}, {"num": 23, "title": "ICMR：75 英寸以上电视上半年再增 25%，均价三年降 28%；QLED 均价降至 4 万卢布", "tag": "local", "tagText": "本地", "source": "Retail.ru（本地）", "time": "10-20", "summary": "ICMR：75 英寸以上电视销量由 2022 年 7.4 万台增至 2025 年 17.9 万台，均价从 16.6 万降至 12 万卢布，2026 上半年再增 25%；QLED 从 20.6 万台增至 150 万台，均价由 7.5 万降至 4 万。大屏与量子点已进入大众价格带，卖点应从参数转向场景与安装服务。", "table": [["75\"+ 销量", "7.4 万 → 17.9 万台（2026H1 再 +25%）"], ["75\"+ 均价", "16.6 万 → 12 万卢布（三年 -28%）"], ["QLED", "20.6 万 → 150 万台；均价 7.5 万 → 4 万卢布"]], "sourceFull": "https://www.retail.ru/news/analitiki-icmr-vyyasnili-kak-raznye-tipy-pokupateley-vybirayut-odin-i-tot-zhe-te-20-oktyabrya-2026-283496/", "url": "https://www.retail.ru/news/analitiki-icmr-vyyasnili-kak-raznye-tipy-pokupateley-vybirayut-odin-i-tot-zhe-te-20-oktyabrya-2026-283496/"}]}, {"icon": "💡", "name": "灯具", "items": [{"num": 24, "title": "Ozon：10 月上半月圣诞灯串与花环需求约 3 倍、圣诞树 +40%", "tag": "local", "tagText": "本地", "source": "Retail.ru（本地）", "time": "10-19", "summary": "Ozon 数据：10 月上半月新年相关品类需求同比大涨——圣诞树（针叶与人造）+40%，新年玩具与装饰 +3.3 倍，圣诞灯串与花环约 +3 倍，新年餐巾 +5.1 倍、桌布 +2.4 倍。灯串是 deeplight/pipolux 可直接延展的旺季品类，FBO 入仓预约与广告排期须在 11 月上旬前锁定。", "table": [["圣诞灯串与花环", "同比约 +3 倍"], ["新年玩具装饰", "+3.3 倍"], ["圣诞树", "+40%"], ["餐巾 / 桌布", "+5.1 倍 / +2.4 倍"]], "sourceFull": "https://www.retail.ru/news/ozon-v-pervoy-polovine-oktyabrya-spros-na-elochnye-igrushki-i-girlyandy-vyros-bo-19-oktyabrya-2026-283429/", "url": "https://www.retail.ru/news/ozon-v-pervoy-polovine-oktyabrya-spros-na-elochnye-igrushki-i-girlyandy-vyros-bo-19-oktyabrya-2026-283429/"}, {"num": 25, "title": "Авито：55% 俄罗斯人年前换软装、首选品类是灯具（44%）、人均预算 1.4 万卢布", "tag": "local", "tagText": "本地", "source": "Retail.ru（本地）", "time": "10-19", "summary": "Авито 对约 1 万人的调查：55% 俄罗斯人计划新年前更新家居软装，人均预算 14,000 卢布；首位采购品类是灯具（44%），其后为纺织与装饰品；78% 计划线上购买。灯具需求在 11–12 月前置释放，落地灯、氛围灯、装饰灯串宜做场景化套装而非单品低价。", "table": [["计划换软装", "55%"], ["人均预算", "14,000 卢布"], ["首选品类", "灯具 44%"], ["线上购买意愿", "78%"]], "sourceFull": "https://www.retail.ru/news/bolee-50-rossiyan-planiruyut-obnovit-interer-k-novomu-godu/", "url": "https://www.retail.ru/news/bolee-50-rossiyan-planiruyut-obnovit-interer-k-novomu-godu/"}, {"num": 26, "title": "Авито：维修翻新需求 +24%、地板 +62%、瓷砖 +37%，存量改造带动灯具替换", "tag": "local", "tagText": "本地", "source": "Retail.ru / Авито Услуги（本地）", "time": "10-22", "summary": "Авито Услуги：9 月维修服务需求同比 +24%、建筑施工类 +15%，结构从「新交付楼盘整装」转向「存量房局部改造」：地板 +62%、瓷砖 +37%、窗户 +28%、墙漆 +25%、壁纸 +8%，城市越小增速越高。局部改造通常伴随灯具更换，对吸顶灯、筒射灯、灯带是需求前置信号。", "table": [["维修服务需求（9 月）", "同比 +24%（建筑施工 +15%）"], ["分项", "地板 +62% / 瓷砖 +37% / 窗户 +28% / 墙漆 +25%"], ["结构变化", "新盘整装 → 存量房局部改造（小城市增速更高）"]], "sourceFull": "https://www.retail.ru/news/v-nachale-oseni-spros-na-remontnye-raboty-vyros-na-24--22-oktyabrya-2026-283602/", "url": "https://www.retail.ru/news/v-nachale-oseni-spros-na-remontnye-raboty-vyros-na-24--22-oktyabrya-2026-283602/"}]}, {"icon": "🚗", "name": "汽车（扩展）", "items": [{"num": 27, "title": "全俄经销商展厅 4,700 家创纪录：本土品牌份额 27%→35%、中国品牌 64%→55%", "tag": "local", "tagText": "本地", "source": "Коммерсантъ（本地）", "time": "10-21", "summary": "«Газпромбанк Автолизинг» 与 «АвтоБизнесРевю» 统计：1-9 月乘用车经销商网点增 14.4% 至 4,700 家（历史新高），新开 974 家、关闭 386 家；俄本土品牌展厅由 1,100 增至 1,600 家、份额 27%→35%，中国品牌份额由 64% 降至 55%（255 开/301 关）。经销商预计半年内出现回撤。", "table": [["展厅总数", "4,700 家（+14.4%）：新开 974 / 关闭 386"], ["本土品牌份额", "27% → 35%（展厅 1,100 → 1,600 家）"], ["中国品牌份额", "64% → 55%（255 开 / 301 关）"]], "sourceFull": "https://www.kommersant.ru/doc/9043105", "url": "https://www.kommersant.ru/doc/9043105"}, {"num": 28, "title": "工贸部：优惠车贷暂停或致 АвтоВАЗ 年底前产量与销量下降 20–25%", "tag": "local", "tagText": "本地", "source": "New Retail / Минпромторг（本地）", "time": "10-22", "summary": "俄工贸部汽车工业与铁路机械制造司副司长在联邦委员会关于汽车需求支持措施的会议上称，优惠车贷项目暂停可能导致 АвтоВАЗ 到 2026 年底产量与销量下降 20–25%。汽车是平台大件品类，减产将传导至汽配、车品与车载电子的供给与促销节奏。", "table": [["受影响主体", "АвтоВАЗ"], ["预计降幅", "产量与销量 -20–25%（至 2026 年底）"], ["触发原因", "优惠车贷项目暂停"]], "sourceFull": "https://new-retail.ru/novosti/retail/avtovaz_mozhet_sokratit_proizvodstvo_na_20_25/", "url": "https://new-retail.ru/novosti/retail/avtovaz_mozhet_sokratit_proizvodstvo_na_20_25/"}, {"num": 29, "title": "9 家已「退出」俄市场的车企仍保留法人并继续产生营收", "tag": "local", "tagText": "本地", "source": "Коммерсантъ（本地）", "time": "10-19", "summary": "统计显示 9 家已宣布退出俄罗斯市场的汽车集团仍保留在俄法人实体与业务收入，通过既有库存、售后与授权渠道维持经营，未完成法律意义上的清盘。汽车及配件品类的品牌权利与官方渠道关系仍在，非官方平行进口与灰色渠道的政策风险将持续存在。", "table": [["主体", "9 家已「退出」的汽车集团"], ["现状", "保留在俄法人并继续产生营收"], ["含义", "品牌维权口径可能变化，灰色渠道风险持续"]], "sourceFull": "https://www.kommersant.ru/doc/9041537", "url": "https://www.kommersant.ru/doc/9041537"}]}], "keyData": {"headers": ["指标", "周初（10-19）", "周末（10-23）", "趋势"], "rows": [["央行美元汇率", "83.6177 ₽", "81.1255 ₽（-1.04% 单日）", "卢布全周升值 3.0%，连续两日低于 82"], ["央行人民币汇率", "12.4950 ₽", "12.1460 ₽", "人民币兑卢布贬值 2.8%（卢布走强），人民币采购结汇成本改善"], ["央行欧元汇率", "93.7187 ₽", "91.1364 ₽", "欧元同步回落 2.8%"], ["关键利率", "14%（9-11 决议）", "14%（10-23 决议）", "维持不变但上调利率路径；2026 通胀预测升至 7.1–7.6%"], ["周通胀", "—", "0.05%", "显著放缓；汽油一周 -0.7%，10 月通胀预期回落至 13.2%"], ["Brent 原油（12 月）", "≈108 美元", "113.22 美元（10-22 收）", "单周约 +5%，5-05 以来首破 113；WTI 100.01"], ["现金贷全额成本 ПСК", "—", "30.08%（+0.56 п.п. vs 9-10）", "无抵押 34.35%（+0.89 п.п.），居民融资成本抬升"], ["大卖家平台占比", "1 月：WB 57.54% / Ozon 42.46%", "8 月：WB 41.71% / Ozon 58.29%", "年内反转，仓配中断推动卖家多平台重分配"], ["仓库地产吸纳量", "—", "前三季 223 万㎡（-22%）", "莫斯科 -15%、圣彼得堡 -31%、地区 -44%，议价窗口打开"], ["小家电（9 个月）", "—", "销量 +17.6% / 均价 -6%", "量增价减；М.Видео 线上小电 GMV +218%"], ["дрогери 购买频次（8 月）", "—", "-4.8%", "线上已占非食品销售 >30%（部分品类 40%）"], ["汽车经销商展厅", "—", "4,700 家（+14.4%）", "本土品牌份额 27%→35%，中国品牌 64%→55%"], ["平台仓遇袭专题", "WB 22 城 / Ozon 13 城", "不变", "本周无新增遇袭（最近一次 10-18 圣彼得堡 Ozon）；损失进入结算期"], ["电商合规节点", "10-12 三大平台 ЧЗ 核验", "12-15 家电追溯实验（草案）", "赋码与合规文件成为上架硬门槛"]]}, "trends": [{"title": "1. 平台规则：从「调费率」转向「拆服务项 + 转移库存风险」，卖家承担的成本边界更模糊", "text": "本周 11 条平台规则变动中，没有任何一条是公开费率上调，但卖家侧成本同时上升：Ozon 把「ПВЗ/ППЗ→分拣中心」从基础物流拆出单收费（12-01），并对超期未取退货引入自动销毁（12-01）；WB 把订单险单件赔付上限提到 30 万卢布以对冲仓袭损失（10-19），而 Ozon 自 10-13 停保仍未恢复。资金侧则一收一放：RWB 银行开放 17%/年的国家补贴贷款（10-22），但准入要求创始人均为俄公民，中资背景主体被排除；Ozon 银行向法人开放 15% 起的 ЦФА 理财（10-22），把闲置回款变成 1–3 个月锁定资金。同期 СПМ、电商联盟、АКИТ 三条线同时向 ФАС/杜马/总统办公厅申诉平台单方面裁量权，规则博弈从「费率」转向「默认值、责任分配与准入资格」。行动上应把「服务开关清单」「退货滞留清单」「融资准入自检」做成月度例行动作。"}, {"title": "2. 电商物流与履约：仓库地产降温打开议价窗口，空域风险常态化", "text": "仓库地产前三季吸纳量 -22%（圣彼得堡 -31%、地区 -44%），第三方仓空置上升、租金议价窗口打开，与去年「一仓难求、租金 +13%」形成反转；与此同时 10-18 圣彼得堡 Ozon 物流中心遇袭（本周连续的起点）、10-21 夜 630 架无人机袭莫斯科地区，说明风险已从「仓被炸」转向「空域与干线常态化扰动」。两条线叠加的正确读法是：仓位可以趁低锁定更长期限与更优价格，但必须要求合同写入改道条款、延误免责与分段赔付；同时用 WB 订单险（单件 30 万卢布）覆盖高值灯具/家电，弥补 Ozon 侧 10-13 起的保险空窗。Ozon 58.29% vs WB 41.71% 的大卖家占比反转，本质就是仓配中断后卖家把库存重心搬到 Ozon 的结果，Q4 备货建议按「平台分散 + 仓位分散 + 保险覆盖」三条同时落。"}, {"title": "3. 宏观经济与汇率：卢布单周升值 3%，利率维持 14% 但路径上移、降息窗口后移", "text": "官方美元从 83.6177（10-19 生效）降至 81.1255（10-23），全周卢布升值约 3%，人民币从 12.4950 降至 12.1460（-2.8%），以人民币采购的结汇成本明显改善；布伦特走高带来的外汇收入与美方暂不追加制裁是主要支撑。但 10-23 央行议息维持 14% 并上调利率路径，把 2026 年通胀预测调到 7.1–7.6%，明确表示需要更长时间维持紧缩——意味着旺季备货的卢布资金价格不会回落。周通胀 0.05%、汽油 -0.7%、通胀预期 13.2% 只是短期缓和，稳定通胀部分仍在 5–6%。财务动作：按 81–82 区间分批结汇锁定进口成本，同时保留 12.0–12.2 的人民币汇率情景；融资优先用补贴类工具（RWB 17%）而非现金贷（ПСК 已升至 30.08%）。"}, {"title": "4. 能源价格与运输成本：Brent 破 113，燃油附加费与预算收入同向抬升", "text": "10-22 Brent 12 月合约盘中最高 113.38 美元、收报 113.22（+4.04%），为 5 月 5 日以来首次站上 113，WTI 站上 100；触发是也门胡塞袭击亚丁机场与沙特目标、红海—曼德海峡供应担忧。叠加欧盟拟在第 22 轮制裁中加入对俄石油限制（10-21 表态），油价与运价的双向波动加大：一方面俄预算与卢布受益，另一方面跨境干线与燃油附加费上行。Q4 物流报价应保留燃油浮动条款，并把「红海/曼德海峡绕行」作为运价情景的独立变量测算，而不是假设现有运价延续。"}, {"title": "5. 消费市场：量增价减与线上迁移同时加速，退货体验成为复购第一杠杆", "text": "本周三组数据指向同一结构：小家电销量 +17.6% 但均价 -6%、дрогери 门店频次 -4.8% 而线上占非食品销售 >30%、折叠屏绝对量创新高但增速从 44% 降至 23.7%——增量集中在低价位段与线上渠道，价格战与内容/评价体系建设取代单纯比价。复购调研给出更硬的结论：45% 的用户因「退货换货麻烦」彻底流失，高于价格因素的边际影响，而 Ozon 12-01 起把退货段物流单收费、并对超期未取退货引入自动销毁，正在把「退货成本」从隐性变成显性。运营上应优先做退货链路与卡片质量（ВЦИОМ：90% 愿不看实物下单，决定信任的是卡片图文 90%、长评 89%、评价图文 87%），而非继续压价。"}, {"title": "6. 灯具与电器：新年旺季窗口已开，灯具是「首选品类」，电器在等追溯码落地", "text": "灯具侧三项需求信号同时出现：Ozon 10 月上半月圣诞灯串与花环约 +3 倍、圣诞树 +40%；Авито 调查 55% 计划年前换软装、首选品类即灯具（44%）、人均 1.4 万卢布、78% 线上购买；9 月维修翻新需求 +24%（地板 +62%、瓷砖 +37%），存量房局部改造带动吸顶灯/筒射灯/灯带替换。电器侧的节奏由合规决定：12-15 起家电追溯码实验（IV 阶段含吸尘器、洗碗机、洗衣机、冰箱等）、12-01 起约 20 类电子未贴标禁售，赋码能力将成为上新前置条件。建议 11 月上旬前完成灯串与氛围灯的 FBO 入仓与广告排期，同时并行推进小家电的 Data Matrix 赋码方案比价。"}], "sourceStats": "本周周报共收录 29 条条目，信源全部为俄语本土媒体、行业媒体与官方机构：生意人报（Коммерсантъ）、«Ведомости»、РБК、俄新社（РИА Новости）、塔斯社（ТАСС）、国际文传电讯社（Интерфакс）、Retail.ru、New Retail、Ferta.su（卖家文档核对）、以及 ЦБ РФ（央行官网一手汇率与利率决议）。本地信源 29 条 = 100%（≥60% 达标）；中文信源 0 条、英文直采 0 条。其中 2 条为一手抓取补充：央行 10-23 利率决议（cbr.ru/press/event/?id=32929，日报 10:00 生成时点在莫斯科 05:00、决议尚未公布）与 10-19/10-23 央行官方汇率（XML_daily.asp 按日取值）。", "meta": ["报告编号：RU-WEEKLY-2026-W43", "覆盖周期：2026-10-19（周一）~ 10-23（周五），第 43 周", "收录条目：29 条（平台规则 3、电商 8、时政 3、经济 3、美妆 3、电器 3、灯具 3、汽车（扩展）3）", "数据来源：本地日报 5 期（10-19 共 23 条、10-20 共 17 条、10-21 共 30 条、10-22 共 21 条、10-23 共 18 条，窗口内无空窗，合计 109 条原始条目）；周报按周视角归并为 29 条，剔除各期「本期无新增重大动态」占位条目（10-21 灯具、10-22 灯具/美妆）。", "补充抓取：央行 10-23 议息决议（维持 14%，一手）、10-19 与 10-23 官方汇率（ЦБ XML_daily）；Brent 与 WTI 报价经«Ведомости»/РИА 转述。", "去重：条目 URL 逐一经 state.db articles 表核对，已入库者沿用既有 report_date，仅窗口内新增条目执行 INSERT OR IGNORE，入库后按 attempted / count 对账。", "入库：周报条目写入 state.db articles 表（category 与日报同口径：电商 / 时政 / 经济 / 美妆 / 电器 / 灯具 / 汽车 / 平台规则），平台规则条目归入「平台规则」。入库对账：attempted 29 = 新增 1 + 命中既有 28 + miss 0；28 条命中均为本周日报（10-19~10-23）已入库记录，属正常按 URL 去重，未产生重复行。", "仓库遇袭专题：本周 10-19~10-23 五期日报均报「无新增平台仓遇袭」（最近一次仍为 10-18 圣彼得堡 Ozon，连续第 4 日无新增）；累计 WB 22 城 / Ozon 13 城不变，warehouse_attacks.json 仅更新 note 与 insight，events/totals 未变。", "汇率（ЦБ РФ 官方）：美元 83.6177（10-19）→ 81.1255（10-23）；人民币 12.4950 → 12.1460；欧元 93.7187 → 91.1364。", "重点提示：① 12-15 起家电/电脑追溯码实验（草案）+ 12-01 起约 20 类电子未贴标禁售；② Ozon 12-01 拆出 ПВЗ→分拣中心运费并对超期退货自动销毁；③ WB 订单险单件 30 万卢布（Ozon 10-13 停保仍空窗）；④ 央行 10-23 维持 14% 并上调路径，2026 通胀预测 7.1–7.6%；⑤ 卢布全周升值 3%（美元 81.1255、人民币 12.1460）。"]}
