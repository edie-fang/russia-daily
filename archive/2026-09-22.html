{"date": "2026-09-22", "stats": {"total": 24, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "财政部支持给 Ozon 及其卖家税收递延：参照 Wildberries 先例，方案「处于高度成熟阶段」", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-22 04:15", "summary": "俄新社 9-22 报道，财政部副部长萨扎诺夫（Алексей Сазанов）对《Vedomosti》表示，财政部正讨论参照 Wildberries 先例，向 Ozon 及其卖家（селлеры）提供税款与社保费缓缴，「财政部同意支持是必要的，支持规模由政府确定」，该问题处于「高度成熟阶段」。今年 8 月政府已批准针对因无人机袭击受损的 Wildberries 设施相关企业的一揽子措施：税款与社保缓缴、暂停税务检查与缴费正确性核查。对卖家的实务含义：Ozon 侧受损卖家有望在 Ozon 平台内取得与 WB 卖家同口径的现金流缓冲，需在政策落地前按「仓库+批次」整理损失凭证与保单号，确保申请时可直接对应。", "table": [["当事方", "Ozon 及其卖家(селлеры)"], ["参照先例", "Wildberries（2026-08 已获批）"], ["措施", "税款/社保缓缴 + 暂停税务检查"], ["官方口径", "「高度成熟阶段」"]], "sourceFull": "https://ria.ru/20260922/ozon-2119405473.html"}, {"num": 2, "title": "财政部起草《税法典》修正案：国防支出与受损设施修复支出可计入利润税税前扣除", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-21 17:18", "summary": "财政部副部长萨扎诺夫在莫斯科金融论坛期间表示，财政部正与各行业代表共同起草《税法典》修正案，把「设施国防支出」与「受袭受损设施的修复支出」纳入企业所得税税前扣除基数，「需要修改，我认为秋季提交」。这是继税收缓缴、暂停检查之后，制度层面对「反无人机实体防护投入」的进一步松绑。对卖家的含义：自有仓/3PL 仓的防空与物理加固投入、遇袭后的修复成本有望从税基中扣除，建议即刻按「防空设备—工程改造—保险理赔」三条线分类立账留存凭证，为秋季立法通过后的追溯申报预留证据链。", "table": [["新增可扣除项", "国防支出 + 受损设施修复"], ["立法状态", "起草中，拟秋季提交杜马"], ["表态人", "财政部副部长萨扎诺夫"], ["来源", "buh.ru 转述"]], "sourceFull": "https://www.retail.ru/news/biznesu-razreshat-uchityvat-raskhody-na-oboronu-i-vosstanovlenie-razrushennykh-o-21-sentyabrya-2026-282383/"}, {"num": 3, "title": "财政部研究修改立法以保护设施免遭无人机袭击：反无人机防护从「企业自选」走向「法制配套」", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "09-21 15:11", "summary": "《Vedomosti》9-21 报道，财政部正研究对相关立法作出修改，以保护各类设施免遭无人机（БПЛА）袭击。该动向与萨扎诺夫同日「国防与修复支出可税前扣除」的表态同向，意味着反无人机防护正在从企业个别行为转向法律与税务层面的系统性安排。对平台与卖家的含义：仓储、分拣与履约中心的防空与物理加固投入将获得更明确的合规依据，可作为 Q4 安防预算与 3PL 租赁谈判（防护责任划分）的编制基础；结合行业早前的「物流枢纽反无人机标准或 6–12 个月内出台」预期，宜提前锁定供应商与报价。", "table": [["方向", "反无人机相关立法修改"], ["配套", "利润税扣除（同日表态）"], ["适用对象", "各类设施/物流枢纽"], ["节奏", "研究阶段，尚未成文"]], "sourceFull": "https://www.vedomosti.ru/business/news/2026/09/21/1230536-zaschiti-ot-bpla"}, {"num": 4, "title": "联邦海关署：СПОТ 系统上线后进口未见异常；普京与海关署长讨论打击「灰色进口」", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "09-21 14:33", "summary": "《Vedomosti》9-21 报道，联邦海关署（ФТС）表示自新系统 СПОТ 启用以来，未记录到进口环节出现问题，跨境申报与放行流程保持稳定。同日普京会见海关署长皮卡列夫（Валерий Пикалев），专门讨论海关工作与打击「灰色进口」（серый импорт）。对跨境卖家的含义：短期看进口通道无新增摩擦，但灰色进口整治力度抬升意味着报关单据与「白关」合规链的检查会更严——建议复核进口来源与报关凭证链、品牌授权文件，避免上架后因来源不合规被批量下架（与 2027-03-01 商品卡真伪核验机制形成前后夹击）。", "table": [["系统", "СПОТ（进口无异常记录）"], ["核心议题", "打击灰色进口"], ["会见", "普京 — 海关署长皮卡列夫"], ["风险方向", "报关链合规要求上升"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/09/21/1230518-fts-ne-zafiksirovala"}, {"num": 5, "title": "«Лемана Про» 临时管理人拟保留连锁网络；«Ашан» 声明照常运营", "tag": "local", "tagText": "本地", "source": "Vedomosti / 零售网(Retail.ru)", "time": "09-21 12:48", "summary": "9-21 双源报道：出任 «Лемана Про»（原 Leroy Merlin 俄罗斯业务）临时管理人的一方表示有意保留该连锁零售网络；同日 «Ашан» 与 «Лемана Про» 均声明继续按原有模式运营。背景是 9-17 总统令将 Auchan、Nestlé、Лемана Про 与 FM Logistic 等在俄外资资产移交临时管理。对卖家的含义：外资线下零售与建材 DIY 渠道暂未中断，供货、承租仓储与结算对接窗口仍在，但治理结构变化后原合同条款（账期、承租条件、退换货）须逐项与临时管理人重新确认；涉及这四家主体的应收/预付敞口宜做压力测试。", "table": [["当事方", "Лемана Про / Ашан"], ["状态", "继续运营；管理人拟保留网络"], ["背景", "9-17 临时管理令"], ["影响", "渠道未断，合同条款待重确认"]], "sourceFull": "https://www.retail.ru/news/lemana-pro-i-ashan-prodolzhat-rabotat-v-prezhnem-rezhime-21-sentyabrya-2026-282365/"}, {"num": 6, "title": "食品零售商靠零售媒体广告赚取数十亿卢布：站内推广成本将继续上行", "tag": "local", "tagText": "本地", "source": "消息报(Izvestia)", "time": "09-22 01:00", "summary": "《消息报》9-22 报道，俄罗斯食品零售商（продуктовые ритейлеры）通过零售媒体（retail media）广告已赚取数十亿卢布收入，成为毛利之外的第二个利润引擎。对平台卖家的含义：零售渠道的流量变现模式正快速向电商平台靠拢，站内广告位供给与竞价密度都会上升，推广费占售价比重面临新一轮抬升——建议把推广费按「单件成本项」纳入定价模型、设定 ROI 下限与预算上限，并把一部分预算回流到复购与私域，避免在竞价通胀中被单向挤压。", "table": [["广告收入量级", "数十亿卢布"], ["渠道", "食品零售"], ["趋势", "渠道平台化/流量变现"], ["卖家影响", "推广费占比上行"]], "sourceFull": "https://iz.ru/2171122/2026-09-22/produktovye-riteilery-zarabotali-milliardy-na-reklame"}, {"num": 7, "title": "俄罗斯消费者转向二手商品与租赁：需求端「降级 + 循环使用」延续", "tag": "local", "tagText": "本地", "source": "消息报(Izvestia)", "time": "09-22 00:30", "summary": "《消息报》9-22 报道，俄罗斯消费者在预算约束下更多转向二手物品与租赁（прокат）消费。该趋势与近期多项口径一致：8 月二手乘用车销量连续第二个月下滑、7 月消费者信心指数降至 -15%、近三成消费者单次采购件数压缩 10% 以上。对卖家的含义：耐用品（家电、灯具、家居、家具）的新品需求弹性下降，卖点需从「更新换代」转向「性价比 + 耐用 + 服务」（保修、以旧换新、安装），并评估把租赁/订阅式服务作为增量入口；Q4 备货弹性宜下调，避免沿用旧需求模型。", "table": [["趋势", "二手 + 租赁消费上升"], ["关联口径", "消费者信心 -15%（7 月）"], ["适用品类", "家电/灯具/家居等耐用品"], ["策略方向", "性价比+耐用+服务"]], "sourceFull": "https://iz.ru/2171109/2026-09-22/rossiiane-perekliuchilis-na-poderzhannye-veshchi-i-prokat"}, {"num": 8, "title": "杜马选举收官：ЕР 在地方立法机构与单席位选区大胜，ЦИК 已处理逾 95% 议定书", "tag": "local", "tagText": "本地", "source": "Vedomosti / 俄新社(RIA)", "time": "09-22 04:39", "summary": "选举结果在 9-21 至 9-22 间基本落定：中央选举委员会（ЦИК）已处理超过 95% 议定书，«Единая Россия» 联邦选区得票率稳定在 57% 区间并锁定宪法多数；单席位选区中 ЕР 候选人在 225 个选区里的 208 个领先。地方层面：克里米亚 ЕР 得票 60.70%（投票率 48.52%）、堪察加立法会议 28 席中拿下 24 席（创纪录优势）、ЛДПР 历史上首次进入车臣议会；全国投票率超过 59%。普京将于本周会见各杜马党团领袖与 ЦИК 负责人。对商业环境：政权机构延续性强，平台经济法、税收与外资资产处置路线预计不变，Q4 政策预期趋于稳定。", "table": [["议定书处理进度", "> 95%"], ["ЕР 联邦得票", "57% 区间（锁定宪法多数）"], ["单席位领先", "208 / 225"], ["投票率", "> 59%"], ["克里米亚 ЕР", "60.70%（投票率 48.52%）"]], "sourceFull": "https://ria.ru/20260922/vybory-2119407274.html"}, {"num": 9, "title": "Памфилова 通报选举违规口径：逾 3.68 万张选票被判无效，15 名观察员被法院撤下", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "09-21 12:07", "summary": "ЦИК 主席 Памфилова 9-21 通报：本次选举中超过 36,800 张选票被认定为无效；经法院裁决，15 名观察员被取消资格；收到 5 起严重违规报告，其中 3 起得到确认。她同时表示不存在取消选举结果的依据，并将本届选举称为其职业生涯中最复杂的一次。对卖家的含义有限但值得记录：选举合规争议进入司法收尾阶段，短期内不会出现需要重新选举的政治不确定性，平台合规与执法环境保持连续；同时说明对网络与信息渠道的监管强度将持续。", "table": [["无效选票", "> 36,800 张"], ["被撤观察员", "15 人（法院裁决）"], ["严重违规", "5 报 3 确认"], ["取消结果", "无依据"]], "sourceFull": "https://www.vedomosti.ru/politics/news/2026/09/21/1230456-nedeistvitelnimi-priznali"}, {"num": 10, "title": "欧盟常驻代表同意把对俄、对白俄制裁一次延长三年；Усманов 与 Фридман 被移出名单", "tag": "local", "tagText": "本地", "source": "Lenta.ru", "time": "09-21 18:42", "summary": "据捷克电视台援引外交消息源，欧盟成员国常驻代表 9-21 在布鲁塞尔会议上同意把针对俄罗斯与白俄罗斯个人及实体的制裁延长三年（此前每次仅延长 6 个月），协议随后需走书面程序完成最终批准。同时消息称俄罗斯企业家 Усманов（乌斯马诺夫）与 Фридман（弗里德曼）被移出制裁名单，此前法国、卢森堡在两人的去留问题上存在分歧。对卖家的含义：制裁框架由「半年一续」变为「三年锁定」，政策不确定性下降但退出通道收窄；从事对欧转口、物流保险与结算的卖家应据此按三年期重估合规成本与替代路径。", "table": [["延长时长", "3 年（此前 6 个月）"], ["对象", "俄罗斯/白俄罗斯个人与实体"], ["移出名单", "Усманов、Фридман"], ["状态", "待书面程序批准"]], "sourceFull": "https://lenta.ru/news/2026/09/21/evrosoyuz-prodlil-sanktsii-protiv-rossii-srazu-na-tri-goda/"}, {"num": 11, "title": "泽连斯基称愿与普京会面、在不停止火力的前提下转向外交", "tag": "local", "tagText": "本地", "source": "Lenta.ru", "time": "09-21 20:15", "summary": "泽连斯基 9-21 公开表示希望与普京会面并「转向外交」，同时明确不会停止军事行动。此前特朗普与泽连斯基通话要求停止对俄炼油厂的打击，俄方克里姆林宫则称三方谈判尚无任何进展，乌方也未在联合国大会期间向俄方提议会面。对卖家的含义：谈判信号相互矛盾，短期不构成风险缓释；能源与物流成本假设不宜按「停火」情景下调，Q4 备货与运费预算仍应按「袭击常态化」基准编制，同时保留对油价快速回落的期权式预案。", "table": [["表态", "愿会面 + 转向外交"], ["前提", "不停止火力"], ["俄方口径", "三方谈判无进展"], ["对风控", "暂不构成缓和信号"]], "sourceFull": "https://lenta.ru/news/2026/09/21/zelenskiy-zayavil-o-zhelanii-vstretitsya-s-putinym-i-pereyti-k-diplomatii-bez-ostanovki-ognya/"}, {"num": 12, "title": "9-21 夜全俄击落 244 架无人机：覆盖 19 个地区，布良斯克 1 死、库尔斯克能源设施受损致约 500 人断电", "tag": "local", "tagText": "本地", "source": "丰坦卡(Fontanka) / 俄新社(RIA)", "time": "09-21 09:45", "summary": "俄国防部 9-21 晨报：夜间防空在 19 个地区上空击落 244 架固定翼无人机，涉及别尔哥罗德、布良斯克、沃罗涅日、伏尔加格勒、卡卢加、库尔斯克、奥廖尔、奥伦堡、罗斯托夫、梁赞、萨马拉、萨拉托夫、特维尔、图拉、乌里扬诺夫斯克等州及克拉斯诺达尔、阿迪格、巴什科尔托斯坦、鞑靼斯坦与黑海海域，名单中不含莫斯科与西北地区。布良斯克州一架自杀式无人机击中民居致 1 人死亡、多人受伤；库尔斯克州一名居民点能源设施受损、约 500 人断电。9-22 凌晨萨马拉州再遭「新的大规模无人机袭击」，州长已发布无人驾驶器危险预警。", "table": [["单夜击落", "244 架（19 个地区）"], ["布良斯克", "民居被击中，1 死多伤"], ["库尔斯克", "能源设施受损、约 500 人断电"], ["9-22 凌晨", "萨马拉州新一轮大规模袭击"]], "sourceFull": "https://www.fontanka.ru/2026/09/21/76653137/"}, {"num": 13, "title": "Brent 跌破 100 美元关口：盘中最低 99.56、18:40 报 99.98 美元，单日跌幅 3.75%", "tag": "local", "tagText": "本地", "source": "Lenta.ru", "time": "09-21 18:50", "summary": "Lenta 引 Investing 数据：9-21 交易日布伦特（Brent）原油盘中一度跌破 100 美元心理关口至 99.56 美元/桶，为 9 月 9 日以来最低；莫斯科时间 18:40 前后回升至 99.98 美元，仍较前一交易日收盘下跌 3.75%（3.89 美元）。分析师将急跌归因于美伊和谈出现进展迹象——特朗普未排除在联合国大会期间与伊朗总统佩泽什基安会面，市场对霍尔木兹海峡通航恢复产生预期；但双方在「外国船舶安全通行收费」等核心条件上分歧依旧，通行前景仍不明朗。对卖家的含义：油价从 104 美元区间快速回落，Q4 头程与境内干线燃油附加费的压力略有缓解，但波动率显著放大，建议按 95/100/110 三档情景分别测算到岸成本，并把燃油附加费上限条款写进承运合同。", "table": [["盘中低点", "99.56 美元/桶"], ["18:40 报价", "99.98 美元/桶"], ["单日跌幅", "-3.75%（-3.89 美元）"], ["上次低位", "9 月 9 日"], ["主因", "美伊和谈信号 / 霍尔木兹预期"]], "sourceFull": "https://lenta.ru/news/2026/09/21/tseny-na-neft-upali-nizhe-psihologicheskoy-otmetki/"}, {"num": 14, "title": "西卢安诺夫公布 2027 预算参数：赤字 2% GDP、预算油价 50 美元/桶、ФНБ 年内最多补充 1 万亿卢布", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "09-21 15:30", "summary": "财政部长西卢安诺夫 9-21 集中披露 2027 年预算框架：联邦预算赤字设定为 GDP 的 2%；编制预算采用的油价假设为每桶 50 美元（远低于当前 100 美元附近的市场价，属保守口径）；国家福利基金（ФНБ）年内将获得最多 1 万亿卢布的补充注资。米舒斯京同期强调联邦预算必须保持平衡，并称俄罗斯仍保持全球第四大经济体地位。对卖家的含义：预算的保守油价假设意味着财政对能源收入的依赖被主动下调，间接指向税负结构调整（含电商与平台经济方向）仍将继续；1 万亿卢布的 ФНБ 补充为「受袭企业补偿与修复支出」提供了资金来源线索，与萨扎诺夫当日「秋季提交税前扣除修正案」互为配套。", "table": [["2027 赤字", "2% GDP"], ["预算油价假设", "50 美元/桶"], ["ФНБ 年内补充", "最多 1 万亿卢布"], ["GDP 排名", "全球第四（米舒斯京）"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/09/21/1230540-federalnii-byudzhet-2027"}, {"num": 15, "title": "央行：预算政策变化不排除 2027 年降息；财政部称已为货币宽松做足功课", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "09-21 17:31", "summary": "央行 9-21 表示，预算政策的变化并不排除 2027 年下调关键利率的可能性；财政部长西卢安诺夫同日称，财政部已为「软化货币政策」做了应做的一切，并强调自身对美方制裁具有「免疫力」。背景是 9-11 议息会议维持 14% 的关键利率、市场部分分析师曾预期再降 25 个基点。对卖家的含义：降息路径若在 2027 年确立，将直接改善平台融资、仓储贷款与卖家信贷成本，也可支撑耐用消费品需求的边际修复；但 2026 年内不宜提前定价，Q4 定价与促销仍应按高利率环境测算资金成本。", "table": [["关键利率", "14%（9-11 维持）"], ["降息窗口", "2027 年（不排除）"], ["财政部口径", "已为宽松做足"], ["影响", "融资成本 / 消费信贷"]], "sourceFull": "https://www.vedomosti.ru/economics/news/2026/09/21/1230590-ne-isklyuchayut-snizheniya-stavki"}, {"num": 16, "title": "8 月中国进口俄罗斯原油同比增长 41%：制裁背景下东向能源通道继续放量", "tag": "local", "tagText": "本地", "source": "消息报(Izvestia)", "time": "09-22 04:17", "summary": "《消息报》9-22 报道，8 月中国自俄罗斯进口原油同比增长 41%。该数据出现在美国新制裁法（可对购买俄油气的国家加征最高 100% 关税）生效后的首个完整月份，显示主要买方在短期尚未实质性压缩采购。对卖家的含义：能源出口收入是卢布与财政的关键变量，东向通道放量对卢布形成支撑，跨境结算中人民币通道的重要性进一步上升；同时提示美国二级制裁的执行风险将在 Q4 逐步显现，涉及美元敞口或美国主体（银行、保险、物流）的卖家应提前做替代安排。", "table": [["中国自俄原油进口", "8 月同比 +41%"], ["背景", "美制裁法生效首月"], ["渠道含义", "人民币结算权重上升"], ["风险", "Q4 二级制裁执行"]], "sourceFull": "https://iz.ru/2171176/kitaiskii-import-rossiiskoi-nefti-vyros-v-avguste-na-41-izi"}, {"num": 17, "title": "数字卢布落地提速：政府可把部分预算支出与国家合同转为数字卢布，财政部员工已开始以数字卢布领薪", "tag": "local", "tagText": "本地", "source": "俄新社(RIA) / Vedomosti", "time": "09-22 00:42", "summary": "9-21 至 9-22 连续报道：财政部拟允许以数字卢布执行部分预算支出，政府将获得把国家合同结算转为数字卢布的能力；同时财政部员工已经开始以数字卢布形式领取工资，西卢安诺夫公开强调数字卢布对公民与预算的优势（可编程、定向、可追溯）。作为对照，一项调查显示俄民众对数字卢布前景的信心仍有限。对卖家的含义：参与政府采购/公立机构订单（含 10-1 起的学校、幼儿园直采渠道）的企业将面临数字卢布收款配置；宜尽早确认银行账户与 ERP 对数字卢布钱包的支持能力，并把「可编程支付」条款纳入合同谈判要点。", "table": [["预算支出", "部分可用数字卢布执行"], ["国家合同", "政府可转数字卢布结算"], ["先行案例", "财政部员工工资"], ["采购影响", "10-1 起公立机构直采"]], "sourceFull": "https://ria.ru/20260922/minfin-2119394763.html"}, {"num": 18, "title": "宏观三条同日发布：预算税收六年翻倍、失业率五年减半、二季度居民债务负担下降", "tag": "local", "tagText": "本地", "source": "俄新社(RIA) / 塔斯社(TASS) / 消息报", "time": "09-22 04:46", "summary": "9-22 同日发布的三个口径：俄罗斯预算税收收入六年内翻了一番（俄新社）；失业率五年内下降一半（塔斯社、《消息报》）；二季度居民债务负担（долговая нагрузка）出现下降（俄新社），同期外汇存款规模继续收缩。对卖家的含义：劳动力市场紧张与居民收入端改善对耐用品需求构成支撑，但「债务负担下降 + 外币存款收缩」的组合说明家庭在主动去杠杆并重新配置资产，消费更偏谨慎——与「二手与租赁消费上升」相互印证，Q4 客单价与件单价假设宜保守，促销应聚焦「刚需 + 高性价比」条目。", "table": [["预算税收", "6 年翻倍"], ["失业率", "5 年减半"], ["居民债务负担", "Q2 环比下降"], ["外币存款", "继续收缩"]], "sourceFull": "https://ria.ru/20260922/nalogi-2119391683.html"}, {"num": 19, "title": "汇率连续第 8 日维持 84 卢布/美元；8 个月自韩国二手乘用车进口骤降 63%", "tag": "local", "tagText": "本地", "source": "Vedomosti", "time": "09-21 16:13", "summary": "《Vedomosti》9-21 两条数据：央行官方美元汇率连续八个交易日维持在约 84 卢布水平，波动被显著压缩；同期 1—8 月自韩国的二手乘用车进口同比骤降 63%，而与中国的二手车进口（+98%）形成鲜明反差。对卖家的含义：汇率横盘降低进口成本核算的短期波动，但也意味着卢布对美元计价采购的对冲收益有限；汽车与汽配类卖家应把品类结构向「中国供应链」倾斜，同时评估韩国渠道替代品（含欧系平行进口）的可行性。", "table": [["美元汇率", "约 84 卢布（连续 8 日）"], ["自韩二手乘用车", "1—8 月 -63%"], ["自华二手车", "同期 +98%"], ["含义", "供应链继续东移"]], "sourceFull": "https://www.vedomosti.ru/finance/news/2026/09/21/1230058-kurs-dollara"}, {"num": 20, "title": "«Лэтуаль»：消费者不再按季节换整套护肤，而是按皮肤状态替换单品——冬季视黄醇销量 +136%", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-21 12:37", "summary": "«Лэтуаль»（Лэтуаль）分析 2026 年面部护理销售后发现：「季节性换整套化妆品」的做法正在退场，消费者保留常用基础品、只按皮肤状态替换单品。成分端季节性显著：冬季视黄醇类销量增长约 136%、酸类约 116%，透明质酸与烟酰胺在寒冷季需求最高；防晒（SPF）销售峰值不在夏季而在春季，夏季维 C 需求下降约四分之一。地域上，北部地区对保湿产品的需求比南部高约 35%。渠道端：线上客单价高于线下，3—4 月差距可达两倍，但 2026 年线下销售占比反而回升约 3%。", "table": [["面部护理占公司营收", "约 15%（2023 年以来稳定）"], ["冬季视黄醇", "+136%"], ["冬季酸类", "+116%"], ["SPF 峰值", "春季（非夏季）"], ["北方保湿需求", "高于南部约 35%"], ["线下占比", "2026 年回升约 3%"]], "sourceFull": "https://www.retail.ru/news/letual-rossiyane-ne-menyayut-ukhod-po-sezonu-oni-menyayut-ego-pod-sostoyanie-kozh-21-sentyabrya-2026-282364/"}, {"num": 21, "title": "Mixit 联合创始人 Пай 就居家软禁提出上诉，特大诈骗案进入二审程序", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-21 19:10", "summary": "俄新社 9-21 报道，化妆品品牌 Mixit 联合创始人奥列格·Пай（Олег Пай）已就其被采取的居家软禁措施提出上诉。上周末莫斯科特维尔区法院以「特大诈骗」（мошенничество в особо крупном размере）立案对其作出居家软禁决定，上诉登记信息已进入司法系统。对美妆卖家的含义：Mixit 是俄本土美妆头部品牌之一，案件走向会影响其供应链合作方与渠道库存的稳定性；与其有代销、联名或供货关系的卖家应跟踪案件进展，评估应收敞口与合同履约风险，并避免在舆情期集中铺货。", "table": [["当事人", "Mixit 联合创始人 Олег Пай"], ["强制措施", "居家软禁（9-19 决定）"], ["案由", "特大诈骗"], ["进展", "已提交上诉（9-21）"]], "sourceFull": "https://ria.ru/20260921/pay-2119365545.html"}, {"num": 22, "title": "«М.Видео» 确定增发配售价 49.9 卢布/股：500 亿股框架下募资 300 亿卢布补资本", "tag": "local", "tagText": "本地", "source": "Vedomosti / Эксперт", "time": "09-21 12:47", "summary": "《Vedomosti》9-21 报道，«М.Видео» 已确定增发（допэмиссия）股票配售价格，为每股 49.9 卢布（Эксперт 引公司公告）。该增发为 6 月股东大会批准的向现有股东定向增发、合计不超过 5 亿股（面值 10 卢布）的方案，目标是完成 300 亿卢布的资本补充，资金用于把公司转型为「多品类市场平台 + 线下门店 + 自提点/快递柜网络」。对电器类卖家的含义：М.Видео 的资金面改善后，其平台化招商与 ПВЗ 网络扩张（此前已接入约 5,000 个 Магнит 自提点）会继续推进，是平台之外的一个增量渠道；关注其开放招商的类目佣金与仓储服务条款。", "table": [["配售价", "49.9 卢布/股"], ["增发规模", "不超过 5 亿股（面值 10 卢布）"], ["募资目标", "300 亿卢布"], ["资金用途", "多品类市场平台 + 自提网络"]], "sourceFull": "https://www.vedomosti.ru/investments/news/2026/09/21/1230470-mvideo-dopemissii"}, {"num": 23, "title": "全部运营商移动通信将覆盖小城镇与村庄：智能设备下沉市场的网络底座继续补齐", "tag": "local", "tagText": "本地", "source": "消息报(Izvestia)", "time": "09-22 00:40", "summary": "《消息报》9-22 报道，俄罗斯将实现所有移动运营商在小型城镇与乡村的通信覆盖。对电器卖家的含义：网络覆盖是智能家居设备（联网插座、摄像头、扫地机器人、智能照明）在下沉市场渗透的前置条件，覆盖补齐将逐步释放非城市市场的联网设备需求；结合智能家居设备已被纳入生产与进口分类管控（ОКПД 2）的背景，建议提前准备联网类目商品的合规与说明书本地化材料，并把县级市与乡镇列为 Q1 增量测试市场。", "table": [["政策方向", "全运营商覆盖小城镇与乡村"], ["受益品类", "智能家居 / 联网设备"], ["配套背景", "智能家居设备纳入 ОКПД 2 管控"], ["机会市场", "县级市与乡镇"]], "sourceFull": "https://iz.ru/2171113/2026-09-22/mobilnaia-sviaz-vsekh-operatorov-poiavitsia-v-malykh-selakh-i-derevniakh"}, {"num": 24, "title": "«Лента» 调研：44% 俄罗斯人秋季考虑更新家居内饰，色彩点缀型消费带动装饰与纺织品类", "tag": "local", "tagText": "本地", "source": "零售网(Retail.ru)", "time": "09-21 17:31", "summary": "«Группа Лента» 的调研显示：44% 的俄罗斯人在秋季会考虑更新家居内饰；63% 的受访者在居室布置中使用色彩点缀（цветовые акценты），与销售数据吻合——饱和色调与亮色印花类的餐具、装饰品与纺织品的兴趣在上升。更新方式上，12% 每个季节都会小幅更换家居装饰，17% 会关注新的秋季系列，另有 15% 在旧物需要替换时才会购置新品。对灯具与家居卖家的含义：秋季是「局部焕新」型需求窗口（装饰性、氛围型照明与家居配件优先于整套换代），可围绕「色彩点缀 + 场景方案」做组合套餐；同时注意 44% 是意愿口径而非预算口径，客单价应按「单件替换」而非「整屋重装」设计。", "table": [["秋季考虑更新内饰", "44%"], ["使用色彩点缀", "63%"], ["每季小改装饰", "12%"], ["关注秋季新系列", "17%"], ["按需替换", "15%"]], "sourceFull": "https://www.retail.ru/news/lenta-44-rossiyan-zadumyvayutsya-ob-obnovlenii-interera-osenyu-21-sentyabrya-2026-282384/"}]}
