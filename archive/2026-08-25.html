{"date": "2026-08-25", "stats": {"total": 15, "local_pct": "100%", "cn_pct": "0%", "en_pct": "0%"}, "items": [{"num": 1, "title": "📦Ozon关闭38个地区FBO订单货到付款，称系支持受损卖家、减少退货回仓", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)、Lenta、俄新社(RIA)", "time": "08-25 01:20", "summary": "Ozon宣布在38个地区关闭货到付款（收货后付款），适用FBO（平台仓发货）订单，同时取消卖家原因延迟发货罚款。官方解释为减少退货回流仓库，属支持遭乌军仓库袭击受损卖家的措施。Lenta称8-24夜Ozon共4处物流设施受影响：克拉斯诺达尔与涅文诺梅斯克疏散、阿迪格与马哈奇卡拉被击中（涅文诺梅斯克遇袭情况待核实）。38地区下单门槛抬高，卖家需关注转化率变化。", "table": [["关闭货到付款地区", "38个"], ["适用范围", "FBO（平台仓发货）订单"], ["配套措施", "取消卖家延迟发货等罚款"], ["8-24夜受影响设施", "Lenta称4处（涅文诺梅斯克待核实）"]], "sourceFull": "https://tass.ru/ekonomika/28041165"}, {"num": 2, "title": "📦财政部税收缓缴细则落地：受损卖家免审计、RWB缴税延至2027-07-28；WB损失全景曝光", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-24 20:45", "summary": "财政部提交政府决议：损失超年收入5%的受损卖家可将增值税（进口除外）、利润税、简化税制税、社保费延后一年并分期缴纳，豁免税务检查，追缴期限延长半年；RWB缴税延至2027-07-28。Ъ测算：7-18以来WB15处仓储对象遇袭约180万㎡（占RWB物流基础设施32%），重建需1243亿卢布；МАРМП称22%仓储能力停摆、总需求超1万亿卢布；78%活跃卖家（22.56万）在受损仓有货，仅43%获赔、平均赔付约20%。", "table": [["缓缴门槛", "损失超年收入5%"], ["缓缴期限", "1年；RWB延至2027-07-28"], ["WB遇袭设施(Ъ口径)", "15处/约180万㎡（占32%）"], ["重建估算", "1243亿卢布"], ["卖家损失", "超5000亿卢布"], ["获赔进度", "43%卖家获赔、平均约20%"]], "sourceFull": "https://www.kommersant.ru/doc/8907381"}, {"num": 3, "title": "📦Ozon股价单日暴跌28%触发离散拍卖，拖累俄股大盘跌破2100点", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-24 21:01", "summary": "8-24莫交所指数收跌1%至2100点下方，成交约820亿卢布。Ozon开盘暴跌28%至2112.5卢布（2023年8月以来最低），占全市场成交约1/4，交易所多次下调价格走廊并启动离散拍卖；Ozon权重约3%，单日拖累指数超0.6个百分点。大股东АФК系统跌12%，俄气-3.5%、卢克-2.5%、俄油-3.6%。诱因即8-22起仓库连续遇袭；管理层称物流已重构、商品已分流，仍未能止血。", "table": [["Ozon盘中跌幅", "-28%（至2112.5卢布）"], ["莫交所指数", "跌破2100点（-1%）"], ["Ozon成交占比", "全市场约1/4"], ["АФК系统", "-12%"], ["当日成交量", "约820亿卢布"]], "sourceFull": "https://www.kommersant.ru/doc/8907408"}, {"num": 4, "title": "🏛芬兰总统公开为乌军袭击WB仓库辩护，基辅回应称“任务就是杀”", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)、Lenta", "time": "08-25 02:20", "summary": "芬兰总统斯图布公开为乌克兰袭击Wildberries仓库辩护；基辅方面回应其言论时称“任务就是杀”。俄外交部无任所大使米罗什尼克指斯图布意在以袭击俄商业设施的呼吁破坏和平倡议，俄舆论援引希特勒类比抨击。克宫8-24已表态：对乌方袭击商业基础设施的回应“基辅将持续感受到”。电商仓库遇袭已被推升为国际政治议题，袭击风险短期难见降温。", "table": [], "sourceFull": "https://ria.ru/20260825/ukraina-2112961785.html"}, {"num": 5, "title": "🏛美国在联合国承诺斡旋俄乌谈判，并拒签反俄涉乌声明", "tag": "local", "tagText": "本地", "source": "Lenta 引 RIA", "time": "08-25 00:12", "summary": "美国常驻联合国副代表丹·内格雷亚：美国将“尽一切可能发挥建设性作用”促成莫斯科与基辅谈判。此前美国拒绝加入联合国涉乌反俄声明（要求俄立即无条件停火）。结合土耳其方面“谈判有望年底前恢复”的预判，斡旋信号继续增多；但俄常驻联合国代表涅边贾同日称“向俄方提出的谈判要求看起来奇怪”，实质进展仍待观察。", "table": [], "sourceFull": "https://lenta.ru/news/2026/08/25/v-ssha-poobeschali-sodeystvovat-peregovoram-mezhdu-rossiey-i-ukrainoy/"}, {"num": 6, "title": "🏛拉夫罗夫将与梵蒂冈外交负责人在莫斯科会谈——开战以来首次", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-25 00:02", "summary": "梵蒂冈外交负责人、总主教保罗·理查德·加拉格尔抵达莫斯科正式访问，为特别军事行动开始以来首次。俄外交委员会主席称梵蒂冈可在乌克兰人道主义议题上提供帮助。梵蒂冈渠道或成为战俘交换、儿童遣返等人道议题的旁路通道。", "table": [], "sourceFull": "https://tass.ru/politika/28041107"}, {"num": 7, "title": "🏛杜马选举前哨：广播辩论启动；“亚博卢”被禁参选，“新人党”争抢其选民", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)、塔斯社(TASS)", "time": "08-25 02:16", "summary": "杜马选举预热启动：8-25起“灯塔”“Вести ФМ”13:00、“俄罗斯广播”14:00开播竞选辩论。Ъ报道：“亚博卢”党被取消参选资格，其相当一部分选民成为“新人党”争取目标，反对票仓面临重新分配。选战格局变化关乎9月统一投票日后的经济与平台监管立法走向，持续跟踪。", "table": [], "sourceFull": "https://www.kommersant.ru/doc/8907360"}, {"num": 8, "title": "📊央行上调官方汇率：美元83.29卢布、欧元97.44卢布；VTB行长称出口商最优区间90-100", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "08-24 18:29", "summary": "央行8-25官方牌价：美元83.29卢布（+37戈比）、欧元97.44卢布（+58戈比），人民币在莫交所报约12.5卢布。VTB行长科斯廷称对出口商更优的美元区间为90-100卢布，可增出口收入并补充联邦预算；但РСПП主席绍欣认为央行紧缩货币政策不会允许卢布大幅贬值。直接影响跨境卖家回款汇率与定价策略。", "table": [["美元官方价", "83.29卢布（+0.37）"], ["欧元", "97.44卢布（+0.58）"], ["人民币", "约12.5卢布"], ["科斯廷最优区间", "90-100卢布/美元"]], "sourceFull": "https://lenta.ru/news/2026/08/24/tsb-povysil-kurs-dollara-v-rossii/"}, {"num": 9, "title": "📊9月1日起НСПК向金融监测局传输СБП快捷支付转账数据", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-25 00:21", "summary": "国家支付卡系统（НСПК）自9月1日起向俄金融监测局（Росфинмониторинг）传输СБП转账数据，官方目的为加速数据核验、减轻信贷机构负担。个人间及小额商户СБП流水进入反洗钱监测视野，电商卖家私域收款合规要求趋严。", "table": [["生效日期", "2026-09-01"], ["内容", "СБП转账数据报送金融监测局"]], "sourceFull": "https://tass.ru/ekonomika/28041129"}, {"num": 10, "title": "📊MTS 9月1日起支持数字卢布缴话费——数字卢布消费场景扩容", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS) 引 Vedomosti", "time": "08-25 02:15", "summary": "据Vedomosti：运营商计划开通数字卢布缴纳通信服务费，MTS客户9月1日起可用。数字卢布从对公/政务场景向日常消费支付渗透，后续或延伸至电商支付链路，关注平台接入进展。", "table": [["生效日期", "2026-09-01"], ["首家运营商", "MTS"]], "sourceFull": "https://tass.ru/ekonomika/28041205"}, {"num": 11, "title": "📊阿曼湾油轮被不明弹丸击中瘫痪——海湾航运风险再升级", "tag": "local", "tagText": "本地", "source": "国际文传(Interfax)", "time": "08-25 03:15", "summary": "英国海上贸易行动办公室（UKMTO）：一艘油轮在阿曼Ash-Shishah东北约16公里处被不明弹丸击中，机舱受损、船舶瘫痪，船员安全；UKMTO要求过往船只保持警惕。此前美海军对伊朗海上封锁已驱离70艘商船，海湾-俄油运输链风险溢价继续上行。", "table": [["位置", "阿曼Ash-Shishah东北16公里"], ["伤情", "机舱受损瘫痪，船员安全"]], "sourceFull": "https://www.interfax.ru/world/1111054"}, {"num": 12, "title": "📊卢克石油罗马尼亚Petrotel炼厂考虑宣布无力偿债", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "08-25 00:51", "summary": "卢克石油旗下罗马尼亚Petrotel炼厂称考虑申请无力偿债，以获得法律保护、维持经营、稳定商业关系并筹备复产。俄能源企业在欧资产在制裁压力下持续收缩，对卢克石油欧洲下游布局与集团现金流构成边际压力。", "table": [["涉事资产", "罗马尼亚Petrotel炼厂"]], "sourceFull": "https://tass.ru/ekonomika/28041155"}, {"num": 13, "title": "📊塞瓦斯托波尔燃油启动QR码限购：Ai-92每单限20升", "tag": "local", "tagText": "本地", "source": "国际文传(Interfax)", "time": "08-24 21:57", "summary": "塞瓦斯托波尔州长拉兹沃扎耶夫：8-25起ТЭС加油站四种燃油（Ai-95、Ai-95 NP、Ai-92、柴油）凭QR码销售；两座Атан加油站10:00起Ai-92凭码限购20升；DT NP、Ai-100、丙烷气自由销售；允许灌装油桶供家用发电机。燃料危机从供应端紧张传导至终端配给，地方管控措施落地。", "table": [["QR限购", "Ai-92限20升（2座Атан站）"], ["自由销售", "DT NP/Ai-100/丙烷气等"]], "sourceFull": "https://www.interfax.ru/russia/1111038"}, {"num": 14, "title": "💄韩国化妆品对俄出口1-7月达2.541亿美元，同比+21%", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "08-23 12:20", "summary": "韩国2026年1-7月对俄化妆品供应额2.541亿美元，同比增长21%。在欧美品牌退出/收缩背景下，韩妆继续填补俄罗斯进口美妆份额，与本土品牌（上半年莫斯科БИГ厂产量超4100万件）及中国品牌形成三线竞争。对美妆线选品与定价有对标意义。", "table": [["1-7月对俄出口", "2.541亿美元"], ["同比", "+21%"]], "sourceFull": "https://ria.ru/20260823/koreja-2112626522.html"}, {"num": 15, "title": "🔌工贸部发布PCB设备本土化草案：13类设备入强制清单，2027年起积分制", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "08-24 18:21", "summary": "工贸部就719号决议修订案（8-21公示）拟将13类PCB生产设备（机械加工、X光检测、光刻胶处理、化学处理等）及部分组件纳入强制本土化；2027-2029年“俄产”认定需20-170分、2030-2032年40-240分、2033年起60-290分。2025年俄PCB市场1.23亿平方分米，国产仅占24%；厂商联盟刚请求放宽（强制俄产材料或使成本涨2-8倍），工贸部反向收紧。消费电子/电器供给成本上行压力加大。", "table": [["拟本土化设备", "13类"], ["积分要求", "2027-29年20-170分→2033年60-290分"], ["俄PCB市场(2025)", "1.23亿平方分米"], ["国产占比", "24%"]], "sourceFull": "https://www.kommersant.ru/doc/8907276"}]}
</script>
