МАЛЛ数据：8月最后一周（开学前）莫斯科购物中心客流量同比下滑4.6%，降幅高于全俄均值；但环比前一周回升6.4%。专家预计高客流或维持数周，年底前将再度走弱。线下客流波动叠加电商物流遇袭，俄消费市场渠道格局仍在再平衡。", "table": [["莫斯科客流(同比)", "-4.6%（高于全俄降幅）"], ["环比", "+6.4%（开学采购季）"], ["展望", "短期活跃后年内转弱"]], "sourceFull": "https://www.kommersant.ru/doc/8924512"}, {"num": 6, "title": "德国正式指控俄涉莱比锡无人机事件并预告反制，俄斥斯克里帕尔式构陷", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-02 16:17", "summary": "德方就莱比锡无人机事件正式指责俄罗斯并宣布将采取回应措施（紧随其关闭柏林俄之家、限波恩总领馆之后）；俄外交部扎哈罗娃将之比作斯克里帕尔案式构陷，多国召见俄大使；拉夫罗夫称德方无法证实无人机归属，俄将相应关闭德国在俄歌德学院分院。对俄欧经贸物流环境的扰动信号需持续跟踪。", "table": [["德方", "指控+预告反制"], ["俄方", "斥构陷、对等关闭歌德学院"], ["影响面", "俄欧外交/经贸环境"]], "sourceFull": "https://www.kommersant.ru/doc/8924215"}, {"num": 7, "title": "9-2晚~9-3晨大规模无人机袭击：俄国防部称15个地区遭袭，莫斯科零时后累计拦截27架", "tag": "local", "tagText": "本地", "source": "国际文传电讯(Interfax)", "time": "09-03 04:48", "summary": "俄国防部9-2晚间通报乌方无人机袭击波及15个地区；9-3凌晨索比亚宁连续通报莫斯科方向拦截：先10架、再17架，零时起累计27架；Внуково/Домодедово/索契/格连吉克/奔萨/萨拉托夫机场一度临时限航。目前无电商平台仓库受损通报。", "table": [["莫斯科(9-3零时起)", "累计拦截27架(10+17)"], ["波及范围", "俄国防部：15个地区"], ["机场限航", "Внуково/Домодедово/索契等"], ["平台仓库", "无受损通报"]], "sourceFull": "https://www.interfax.ru/moscow/1112864"}, {"num": 8, "title": "美俄接触升温：特朗普称愿与普京会晤但时机未到，鲁比奥重申对俄对话必要", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "09-02 22:30", "summary": "特朗普表示已准备好与普京会面但稍后再说，此前一天他称想与普京会晤；鲁比奥同日表态承认美俄直接对话的必要性，并透露美中情局局长访俄目的。俄方对美方接触信号反应积极。若美俄高层接触成行，俄乌冲突走向及对俄制裁放松预期将直接影响俄市场风险偏好。", "table": [["特朗普", "愿会晤普京，但时机未到"], ["鲁比奥", "承认对俄对话必要"], ["信号", "CIA局长访俄"]], "sourceFull": "https://lenta.ru/news/2026/09/03/long-ya-hochu-sdelat-eto-tramp-zayavil-chto-hochet-vstretitsya-s-putinym-no-pozzhe/"}, {"num": 9, "title": "乌克兰推动ICAO限制俄领空民航：俄航空署称文件无效，ICAO指公约禁止对民航器用武", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "09-02 17:52", "summary": "乌克兰呼吁国际民航组织(ICAO)禁止民航飞越俄领空；俄航空署回应称基辅相关文件无法律效力并指责其违反《芝加哥公约》；ICAO表示公约禁止对民用航空器使用武器。空域争端若升级将推高欧亚航线绕行成本，跨境货运与物流时效需关注。", "table": [["乌方", "呼吁ICAO禁飞俄领空"], ["俄方", "称文件无法律效力"], ["ICAO", "公约禁止对民航器使用武器"]], "sourceFull": "https://lenta.ru/news/2026/09/02/genseka/"}, {"num": 10, "title": "俄经济下半年增速放缓、通胀上升：7月基础行业仅+0.8%，工业H1下修至零增长", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-03 01:34", "summary": "生意人报援引Росстат数据：7月基础行业产值同比+0.8%（1-7月仅+0.1%），而居民消费+4.6%——产出与需求缺口持续；上半年工业增速由0.4%下修至0，GDP维持0.6%；下半年预计增长更慢、通胀更高。需求过热叠加供给受限，对进口消费品价格与卢布汇率构成支撑。", "table": [["7月基础行业", "+0.8% 同比（1-7月+0.1%）"], ["居民消费", "7月+4.6%"], ["工业H1(修正)", "0.4%→0"], ["GDP H1", "0.6%"]], "sourceFull": "https://www.kommersant.ru/doc/8924509"}, {"num": 11, "title": "ВЭФ：俄中上半年贸易额增长22%，俄企拟在华发行熊猫债", "tag": "local", "tagText": "本地", "source": "塔斯社(TASS)", "time": "09-03 04:47", "summary": "俄中上半年贸易额同比增长22%；第一副总理曼图罗夫在ВЭФ-2026表示，两国正研究俄企在华发行熊猫债、扩大联合投资项目清单。贸易结算与融资渠道的进一步人民币化，将影响在俄卖家回款路径与汇兑成本。", "table": [["俄中贸易H1", "+22%"], ["新工具", "熊猫债（拟）"], ["场合", "ВЭФ-2026"]], "sourceFull": "https://tass.ru/ekonomika/28073171"}, {"num": 12, "title": "俄财政部单周发债近9390亿卢布创年内纪录，季度计划完成63%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-02 21:46", "summary": "俄财政部在中断数周后重启ОФЗ拍卖，单周发行约9390亿卢布、为年初以来最大规模，三季度借款计划完成63%；因市场要求较高收益率，财政部支付了额外溢价，预计年底前将继续发行浮动利率债。高利率环境下联邦融资成本上行，挤压财政救助（含受袭卖家支持）空间。", "table": [["单周ОФЗ发行", "≈9390亿卢布（年内纪录）"], ["季度计划完成", "63%"], ["特征", "溢价发行、续推浮息债"]], "sourceFull": "https://www.kommersant.ru/doc/8924466"}, {"num": 13, "title": "俄拟对油脂粕出口关税设上限、谷物关税归零至2026年底", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-02 20:44", "summary": "俄政府拟至2026年底对植物油与粕类出口关税设最高限额，并将谷物出口关税归零，以托底持续下跌的农产品收购价、支持农户。粮食出口政策转向将影响俄农产品出口报价与农户种植意愿，间接影响食品通胀与对华、对中东出口量。", "table": [["油粕关税", "设上限（至2026底）"], ["谷物关税", "拟归零"], ["目的", "托底收购价、支持农户"]], "sourceFull": "https://www.kommersant.ru/doc/8924514"}, {"num": 14, "title": "数字卢布冲击银行业：佣金年损或达1000亿卢布、10%负债流失", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-03 00:00", "summary": "生意人报分析：数字卢布全面推广后，俄银行每年或损失至多1000亿卢布佣金收入并流失约10%负债；5-7年内数字卢布或占无现金支付5%-30%，但近一两年难成主流。三大平台9-1起已支持数字卢布支付，银行成本转嫁或推高商户收单费率。", "table": [["年佣金损失", "至多1000亿卢布"], ["负债流失", "约10%"], ["远期渗透率", "5-30%（5-7年）"]], "sourceFull": "https://www.kommersant.ru/doc/8924395"}, {"num": 15, "title": "燃油危机：5-9月近60%交易所汽油合同未履约，炼厂修复还剩10%", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-03 02:33", "summary": "因炼厂遭袭受损，俄油企在圣彼得堡交易所的汽油供货合同5-9月近60%未完成执行，油企优先保障关键消费者；买家称难以获得不可抗力确认。普京表示受损炼能已修复90%、还剩10%。燃料短缺与优先供应机制或继续推高物流与零售配送成本。", "table": [["合同履约缺口", "近60%（5-9月）"], ["炼能修复", "已修复90%（剩10%）"], ["传导", "物流/配送成本承压"]], "sourceFull": "https://www.kommersant.ru/doc/8924445"}, {"num": 16, "title": "卢布续贬：央行9-3官方美元汇率上调至86.99卢布", "tag": "local", "tagText": "本地", "source": "Lenta", "time": "09-02 18:02", "summary": "俄央行9-2傍晚公布9-3官方汇率：美元上调至86.99卢布，卢布延续弱势（8月中旬以来持续走低）。汇率贬值叠加高通胀环境，利好俄本土替代与出口，但推高进口商品（含中国跨境电商货源）到岸成本与结算汇率风险——卖家应关注月度锁汇窗口。", "table": [["美元官方汇率(9-3)", "86.99卢布"], ["方向", "连续上调"]], "sourceFull": "https://lenta.ru/news/2026/09/02/tsb-povysil-kurs-dollara-v-rossii/"}, {"num": 17, "title": "ИКС Холдинг投资超350亿卢布在滨海边疆区建半导体项目", "tag": "local", "tagText": "本地", "source": "生意人报(Kommersant)", "time": "09-03 04:45", "summary": "ИКС Холдинг集团拟在滨海边疆区落地两个半导体项目（芯片及配套产品），2030年前投产，总投资超350亿卢布；企业称选址考量是当地优惠经济条件与毗邻中国（元器件与材料供应中心）。俄电子元件国产化提速，利好俄本土电子产业链配套，但短期仍依赖进口芯片。", "table": [["投资额", ">350亿卢布"], ["项目", "2个半导体项目（滨海边疆区）"], ["投产", "2030年前"], ["动因", "优惠条件+毗邻中国供应链"]], "sourceFull": "https://www.kommersant.ru/doc/8924498"}, {"num": 18, "title": "俄工贸部：外资退出的13家整车厂全部找到新伙伴，控制权留俄", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-03 04:10", "summary": "俄工贸部长阿里汉诺夫在ВЭФ-2026表示，俄已为外资车企退出的全部13家整车厂找到新的技术合作伙伴，且工厂控制权保留在俄方受益人名下。俄本土整车产能恢复将影响进口车与配件市场格局，对俄汽配及周边品类卖家是中长期结构性信号。", "table": [["整车厂", "13家全部找到新伙伴"], ["控制权", "俄方受益人名下"], ["场合", "ВЭФ-2026"]], "sourceFull": "https://ria.ru/20260903/rossija-2115030691.html"}, {"num": 19, "title": "Москвич将与中国Shibao签署协议发展无人驾驶技术", "tag": "local", "tagText": "本地", "source": "俄新社(RIA)", "time": "09-03 03:50", "summary": "莫斯科人(Moskvich)厂宣布将与中国世宝(Shibao)签署合作协议，共同开发无人驾驶技术。俄本土车企在制裁下加速与中国伙伴的技术绑定，涵盖整车、零部件与智能驾驶，中国供应链在俄汽车生态中的权重进一步上升。", "table": [["合作方", "中国Shibao（世宝）"], ["方向", "无人驾驶技术"], ["背景", "俄本土车企加速绑定中国供应链"]], "sourceFull": "https://ria.ru/20260903/moskvich-2115029128.html"}]}
