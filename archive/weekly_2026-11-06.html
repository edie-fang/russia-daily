商占需求 62%；莫斯科州占比反降至 10.1%，彼得堡占区域新增 20%，仓容在向区域与西北外迁。② 收费端：YM 11-01 起对 FBY 供货差额按 10 ₽/升罚款（单件 ≤200 ₽、单次 ≤25 000 ₽），WB 11-09 起把品牌货架最低出价改为「基准价 × 类目系数」，Ozon 11-17 起对 FBS 商品核验收 15 ₽/次（12-16 起 FBO 收费）——平台正把时间、体积、核验、出价逐项货币化。③ 通道端：WB 向 ≥30 家网点连锁开放店中店 ПВЗ，Ozon 向全部卖家开放直送 ПВЗ/ППЗ 与越库，自提点从末端变成可绕开 FBO 的补货通道。净效应：履约半径可以更短，但每一环都要按新费率重算，11 月与 12 月的物流账单不可直接同比。另需跟踪央行 11-06 提出的规则——数字平台（含 marketplace）退款须退回原支付工具，若落地将改变平台钱包的退款路径。"}, {"title": "平台基础设施与风险：两座枢纽遇袭，赔付口径单方化", "text": "本周 11-04 凌晨 Ozon 阿迪格伊斯克 9.2 万㎡ 物流中心、11-05 凌晨 WB 梁赞「Тюшевская」17.3 万㎡ 配送中心先后起火（后者官方未点名、待核实）。两起事件叠加 Q4 旺季，暴露三点：① 南部与中部枢纽的单点依赖仍在，袭击后的「在库下架—订单取消—在途改派」会同时打击现货率与店铺评分；② 平台风险成本正向卖家转移——Ozon 三季度已为 11 处设施计提 301 亿卢布，WB 对白俄卖家提出「一次性赔付、12-01 前到账、签字即放弃后续索赔」，金额由平台单方核定，卖家反馈从接近成本到 5%–50% 不等；③ 卖家侧可行动作只有三个：分散仓（单一 SKU 不押一个枢纽）、留齐在库凭证（акты приёмки、УПД）、赔付协议保留谈判空间。旺季备货应把「设施可用性」当成与销量同级的变量。"}, {"title": "跨境合规：ЧЗ 与 ЕАЭС 双线压向灯具/电工，12-01 是硬门槛", "text": "① 俄方：2025-11-28 第 1954 号决议把无线电电子纳入强制标识，清单明确含照明器具（投光灯、探照灯、吊灯、灯、LED 及光源）与插座、遥控器、印刷电路板；2026-12-01 起须提交流通数据、2027-03-01 起申报退出流通，2026-04-30 前进入流通的未标识库存只能卖到 2026-11-30。② 欧亚层面：11-03 ЕЭК 通过灯具与电工产品统一标记规则（整流器、车灯、便携灯具、灯泡与 LED、灯具、PCB、继电器/插座/连接器、≤1000V 开关设备与配电盘），识别码为加密 Data Matrix，各国自定生效日但须提前 6 个月通知。两条线合起来意味着灯具、光源、驱动、插座将从「单一国别合规」升级为「全链路可追溯」，贴码与包装线改造必须在 11 月内启动，否则 12-01 后无码商品无法合规流转与结算。建议把「ЧЗ 贴码 + ГИС МТ 回传」写进供应商准入与对客户报价说明，作为合规卖点而非成本项。"}, {"title": "经济数据：卢布贬 1.5%、油价全周 -12%、央行承认 Q3 过热，降息继续后移", "text": "官方汇率：美元 80.5573（11-02）→81.7947（11-06），卢布贬 1.54%；人民币 12.0873→12.2570（-1.40%）；欧元 89.6603→92.1581（-2.79%）。油价是本周最大的宏观变量：Brent 从 11-02 的 106.33 跌至 11-04 的 95.5（单日 -8%+），11-05 反弹 3.9%、11-06 报 98.55，全周跌超 12%。央行 10 月纪要承认 Q3 再现正产出缺口（过热）、当前物价增速由 4.8% 升至 8%、2026 年通胀预测上调至 7.1–7.6%，并以「广泛共识」连续第二次维持 14%；Сбер ЦМИ 基准情景已把 2027 年利率定在近 14%。对卖家：油价回落利好干线与燃油附加费，但卢布走弱与高利率同时抬升进口成本与资金占用，Q4 报价应按「汇率 81–82、油价 95–100」做双变量敏感性测试。财政部 11-09 起把购汇规模从日均 127 亿提到 156 亿卢布，短期对卢布构成额外压力。"}, {"title": "能源价格：全周 -12% 但周尾反弹，运输成本仍将双向摆动", "text": "Brent 1 月合约本周从 106.33 跌至 95.5（11-04），周五回升至 98.55，WTI 90.98；全周跌幅仍超 12%，主因民主党拿下两院后市场押注中东降温。但波斯湾与霍尔木兹袭船数量仍接近纪录，价格对消息高度敏感——11-04 单日 -8%、11-05 单日 +3.9%，这种波动无法用月度均价对冲。对跨境链路：① 干线运费与燃油附加费短期仍按周调整，合同应保留浮动条款；② 柴油批发收益继续走弱（10 月炼油利润率 -9%，柴油小批发价从 9 万降至不足 8 万卢布/吨），国内公路运输成本暂有缓冲；③ 欧洲去俄油加速（匈豁免 11-21 到期、MOL 改造走 JANAF、哈国请求恢复「友谊」对德输油），中期欧洲炼厂配油与 Urals 价差仍会反复。报价建议按 Brent 95–105 区间做敏感性区间，而不是押单边。"}, {"title": "消费市场：51% 想参与 vs 7% 真下单，本土替代与「两头热」并行", "text": "① 促销：51% 在职者计划参加 11 月促销、预算约月薪 20%，但另一项 1600 人调查显示仅 7% 计划在黑五下单、72% 明确不买、67% 认为折扣是套路——「想买」与「真买」之间存在巨大缺口，靠折扣拉动的边际效率在下降，套装、延保、赠品与内容种草比单纯降价更有效。② 结构：1–9 月进入俄市场的新品牌仅 16 个（本土 13、国际 3），服装鞋履占 62%，货架空位更多由本土与白牌填补；电视市场销量 510 万台、1490 亿卢布（+8.5%/+5.7%），TCL、小米、Hisense 稳居前五，需求「两头热」。③ 美妆：面部护理 50% 选本土、韩系 35%、49% 从不买韩妆，连锁渠道美妆个护 SKU -13.6% 而 FMCG 仅 -0.6%，货架正向头部与本土集中。三条线共同指向：中价位「不上不下」的品牌最危险，要么向上做差异化（设计、认证、售后），要么向下做极致性价比。"}], "sourceStats": "收录 26 条全部来自俄语本地媒体与官方口径（РИА Новости / Интерфакс / «Коммерсантъ» / «Ведомости» / Retail.ru / Oborot.ru / vc.ru / ТКС.ru / КонсультантПлюс / ЦБ РФ / Московская биржа / ASTRA / Wildberries 卖家公告（avoshop 转述）/ Яндекс Маркет 官方帮助；其中 Retail.ru 引 CORE.XP·CMWP·Н-Дэйта Фэктори·МТС Ads、Oborot.ru 引 SuperJob·卖家联盟、Ведомости 引 ЦБ 纪要，均按本地媒体计）。本地信源 26 条、占比 100%（中文 0%、英文 0%），满足本地 ≥60% 的要求；11-06 白天（日报截稿后）增量经 Интерфакс 核对并补入 2 条（油价、卢布/财政部购汇）。", "meta": ["报告编号：RU-WEEKLY-2026-W45", "覆盖周期：2026-11-02（周一）~ 11-06（周五），第45周，共 5 个工作日", "收录条目：26 条（仓库2/平台规则3/电商8/时政3/经济3/美妆3/电器3/灯具1）", "数据来源：本周日报 5 期（62 条）+ 11-06 白天增量核对 4 条（Интерфакс：油价、卢布/财政部购汇、央行平台退款建议、国际储备），入稿 2 条 + 1 条用于趋势判断", "去重口径：URL 比对 state.db articles 表（本周日报 60 条已入库，2 条「本期无新增」说明条无原文链接不入库）；周报按「事件」去重，同一事件多日出现只保留信息最全的一条", "信源结构：本地 26 条 / 100%（要求 ≥60%）｜中文 0%｜英文 0%", "条数上限：电商 ≤8 条、其它每栏 ≤3 条；灯具本周仅 1 条（唯一监管变化），未凑数"]}
