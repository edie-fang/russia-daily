/ППЗ）越库 + 白俄罗斯物流能力翻倍", "tag": "local", "tagText": "本地", "source": "Oborot.ru（本地）", "time": "10-12 ~ 10-14", "summary": "Ozon 自 10-12 起启动 FBO 越库（кросс-докинг）试点：卖家在后台建供货单、选定物流集群后把货交到可用自提点（ПВЗ）/收件点（ППЗ），由平台在集群内自行分拨至各仓，无需卖家自送大仓，按标准 FBO 费率计费，每件商品须单独贴 QR 码；目前限受邀卖家，测试后拟全量开放。同期 Ozon 在白俄罗斯把物流能力翻倍：Болбасово 新物流中心（约 2.6 万㎡）与明斯克新增仓配投用，形成覆盖白俄的次日达网络；此前已在哈萨克斯坦（阿拉木图、阿斯塔纳）开放免费入仓。含义：履约网络向「自提点前端化」与「俄境外近岸仓」两端延伸，可省干线运输并分散单点风险，但标签流程与关税同盟段清关/增值税口径需同步改造。", "table": [["试点启动", "10-12（限受邀）"], ["费率", "标准 FBO 费率"], ["标签", "每件单独 QR 码"], ["白俄物流", "Болбасово 2.6 万㎡ + 明斯克（×2）"], ["哈萨克", "阿拉木图/阿斯塔纳免费入仓"]], "url": "https://oborot.ru/news/ozon-nachal-testirovat-kross-doking-cherez-pvz-i281366.html", "sourceFull": "https://oborot.ru/news/ozon-nachal-testirovat-kross-doking-cherez-pvz-i281366.html"}, {"num": 6, "title": "【市场格局】Ozon×VK 内容电商带来 950 万单；маркетплейсы 成「改善生活」第一品类（31.3%）；click-out 广告 Ozon/Яндекс Маркет/Магнит 领跑", "tag": "local", "tagText": "本地", "source": "Oborot.ru / Retail.ru（本地）", "time": "10-10 ~ 10-14", "summary": "① Ozon 通报与 VK 内容电商合作成果：2.2 万名博主发布约 70 万条视频，带来超过 950 万笔已成交订单。② BrandLab 对 1,000 名受访者的调查显示，电商平台（маркетплейсы）成为最常与「改善生活」关联的品类、得票 31.3% 居首，食品与外卖配送 27.5%、银行服务与支付卡 26.8% 次之，美妆个护 18.5% 排第 9。③ Retail.ru：click-out（出站导流）广告投放量前三为 Ozon、Яндекс Маркет 与 Магнит，零售媒体成为新增量。含义：站外内容与零售媒体正成为平台流量入口，卖家应把达人内容、click-out 与站内广告按 ROI 分层组合进 Q4 获客预算。", "table": [["VK×Ozon", "2.2 万博主 / 约 70 万条视频"], ["带来订单", "超 950 万笔（已成交）"], ["маркетплейсы", "31.3%（第 1）"], ["click-out 前三", "Ozon / Яндекс Маркет / Магнит"]], "url": "https://oborot.ru/news/22-tysyachi-blogerov-700-tysyach-video-kak-ozon-poluchil-iz-vk-bolee-95-mln-vykuplennyh-zakazov-i281203.html", "sourceFull": "https://oborot.ru/news/22-tysyachi-blogerov-700-tysyach-video-kak-ozon-poluchil-iz-vk-bolee-95-mln-vykuplennyh-zakazov-i281203.html"}, {"num": 7, "title": "【平台自营延伸】Ozon 设立两家保险公司（拟投入 ≤10 亿 ₽）+ WB 注册自有品牌 «Wibe»（至 2034）+ 经济发展部与 RWB 共建区域支持中心", "tag": "local", "tagText": "本地", "source": "Kommersant / Retail.ru（本地）", "time": "10-15", "summary": "① Ozon 通过 ООО «Озон Капитал» 于 10-15 注册 «СК Озон Страхование» 与 «СК Озон Страхование жизни» 两家保险公司，拟投入最多 10 亿卢布，把保险从第三方合作升级为自有变现渠道，向交易、退货与物流环节的金融收入延伸。② Wildberries 完成文字商标 «Wibe» 注册（保护期至 2034 年），并递交含「粉色熊」图案的商标申请，自有品牌（服装、家居等）将加速铺开。③ 经济发展部与 WB 旗下 RWB 以 «RWB Среда» 为载体共建区域中小企业支持中心网络，提供入驻、合规、融资与培训。含义：平台自营与金融化加深，同台竞争加剧的本地供应商上线门槛同时下降。", "table": [["Ozon 保险", "2 家（≤10 亿 ₽）"], ["持股主体", "ООО «Озон Капитал»"], ["WB 商标", "Wibe（至 2034）"], ["WB 支持中心", "Минэкономразвития + RWB"]], "url": "https://www.kommersant.ru/doc/9027605", "sourceFull": "https://www.kommersant.ru/doc/9027605"}, {"num": 8, "title": "【仓储·成本】莫斯科州仓储成交或 +25% 至约 200 万㎡、租金 +13%、空置率降至约 5%；Q3 仓储险费率环比涨近 7 倍", "tag": "local", "tagText": "本地", "source": "Kommersant / Vedomosti（本地）", "time": "10-11 ~ 10-13", "summary": "① 生意人报：受电商需求推动，俄年内仓库成交面积有望增长 25% 至约 200 万㎡，莫斯科州平均租金同比 +13% 至约 1.03 万卢布/㎡/年，空置率由 7.8% 降至约 5%。② Vedomosti（Полис.онлайн × Рентал про 联合研究）：2026 Q3 仓储险平均费率环比近乎上涨 7 倍、达保额约 2%（同比涨 13–20 倍），A 级干仓费率由 6 月的 0.08–0.15% 升至 9 月的 3–5%，1 亿卢布保额对象保费由 80–150 万升至 3,000–5,000 万卢布；国家再保险公司 РНПК 自 7 月将 1 万㎡ 以上仓库列入高风险，并自 10-01 起把 БПЛА 赔付上限压至保额 20%。含义：仓位紧张推高仓储价格、仓损保险成本剧增，需重估库存集中度与自保敞口并提前锁价。", "table": [["成交量", "约 200 万㎡（+25%）"], ["莫斯科州租金", "约 1.03 万 ₽/㎡/年（+13%）"], ["空置率", "7.8% → 约 5%"], ["Q3 仓储险", "≈保额 2%（环比近 +7 倍）"], ["A 级干仓", "0.08–0.15% → 3–5%"], ["РНПК 上限", "БПЛА 赔付 ≤保额 20%（10-01 起）"]], "url": "https://www.kommersant.ru/doc/9023787", "sourceFull": "https://www.kommersant.ru/doc/9023787"}]}, {"icon": "🏛", "name": "时政", "items": [{"num": 9, "title": "【安全·基础设施】一周多夜高强度空袭：单夜击落 900+ 架、莫斯科四机场停摆；Yandex 与 Сбербанк 数据中心接连遇袭", "tag": "local", "tagText": "本地", "source": "Vedomosti / Oborot.ru / RG / RIA（本地）", "time": "10-11 ~ 10-16", "summary": "本周无人机攻防维持高位：10-11 凌晨 «Яндекс» 弗拉基米尔数据中心遇袭（一周内第三座，此前梁赞州、卡卢加），Яндекс Маркет 大量分拣中心临时不可用、支付与云服务一度中断，平台剔除 10-11 订单质量指数并免除超时罚金；10-13 夜至 10-14 晨俄方称击落 900 余架无人机、萨拉托夫州 Балаково 1 名女性死亡，同期 Сбербанк 巴拉克沃数据中心遇袭、俄互联网出现大范围故障；10-16 凌晨莫斯科方向一夜击落 79 架，Внуково/Домодедово/Шереметьево/Жуковский 四大机场暂停起降、逾 20 架航班备降，罗斯托夫州仓库起火 1 人受伤。含义：数字基础设施与首都空域成为高频目标，平台系统、空运与末端时效波动常态化，需预设备用通道与时效冗余。", "table": [["数据中心遇袭", "Яндекс 弗拉基米尔 / Сбербанк 巴拉克沃"], ["10-13 夜", "击落 900+ 架"], ["10-16 凌晨", "击落 79 架 / 莫斯科 4 机场停运"], ["连带", "俄互联网大范围故障（DownDetector）"]], "url": "https://www.business-gazeta.ru/news/713211", "sourceFull": "https://www.business-gazeta.ru/news/713211"}, {"num": 10, "title": "【制裁·外交】欧盟通过第 22 轮对俄制裁（含 GAZ 与新当选杜马议员）；美方立场分化、或放宽影子船队制裁", "tag": "local", "tagText": "本地", "source": "Kommersant / RG / Interfax / Lenta（本地）", "time": "10-12 ~ 10-16", "summary": "欧盟 10-12 正式通过第 22 轮对俄制裁，措施含对高尔基汽车厂（GAZ）、部分新当选国家杜马议员等主体的限制，与美方「优先和谈」立场形成对冲。美方立场明显分化：Politico 称特朗普近期不太可能新增对俄制裁；美媒称美方正考虑放宽对俄「影子船队」船舶部分制裁；美方向欧盟提议解冻部分俄资产以重启谈判遭欧盟拒绝；俄美已就向全球市场供应柴油启动谈判。含义：涉汽车及零部件、双用途商品的采购与结算通道或再收紧，涉欧结算、过境与保险安排仍须按「欧盟先收紧」的最严口径自查。", "table": [["欧盟", "第 22 轮（含 GAZ、杜马议员）"], ["美方", "近期或不再新增制裁（Politico）"], ["考虑放宽", "影子船队船舶制裁（媒体，待核实）"], ["美提议解冻俄资产", "欧盟拒绝"], ["俄美", "启动柴油供应谈判"]], "url": "https://www.kommersant.ru/doc/9024942", "sourceFull": "https://www.kommersant.ru/doc/9024942"}, {"num": 11, "title": "【和谈·停火】停火议题反复：克宫称普京愿在乌选举日暂停打击；特朗普「能源休战」后转批乌方袭俄炼油厂「耻辱」", "tag": "local", "tagText": "本地", "source": "Vedomosti / RG / Lenta / Interfax（本地）", "time": "10-12 ~ 10-16", "summary": "停火与能源议题反复：10-12 克宫称普京愿就乌克兰选举日下令暂停对乌打击（需乌方对等回应）；10-12 特朗普宣布俄乌「能源休战」、要求停止互击炼油厂并扩大美自俄/加采购柴油，泽连斯基一度拒绝；10-15~16 特朗普转而批评乌方袭击俄炼油厂「Это позор（耻辱）」，称泽连斯基不寻求和解、与普京更好打交道，并称乌克兰应举行选举；普京 10-15 称将对乌方袭击俄境内设施作出回应、并称炼油产能未受实质损害。含义：和谈与军援口径反复，袭击强度与能源流向存在政策不确定性，宜按「袭击常态化」维持库存分散与备用路由。", "table": [["克宫", "愿在乌选举日暂停打击（10-12）"], ["特朗普", "宣布能源休战（10-12）"], ["立场反转", "批乌袭 НПЗ「耻辱」（10-16）"], ["普京", "将回应袭击、称产能未受损（10-15）"]], "url": "https://www.vedomosti.ru/politics/news/2026/10/12/1236306-ne-nanosit-udari", "sourceFull": "https://www.vedomosti.ru/politics/news/2026/10/12/1236306-ne-nanosit-udari"}]}, {"icon": "📊", "name": "经济", "items": [{"num": 12, "title": "【汇率】卢布全周走强：官方美元 84.9048 → 83.7600，10-12 起跌破 84", "tag": "local", "tagText": "本地", "source": "Vedomosti / ЦБ РФ（本地）", "time": "10-12 ~ 10-16", "summary": "卢布本周整体走强：央行官方美元汇率由 10-12 的 84.9048 ₽ 降至 10-13 的 83.9153 ₽（自 10-12 起跌破 84 关口），10-14 83.8675 ₽、10-15 83.9497 ₽、10-16 83.7600 ₽；人民币由 12.6739 ₽（10-12）降至 12.5358 ₽（10-15）。同期居民外币存款降至 2008 年以来最低，资金转向卢布与人民币资产；央行副行长 Заботкин 表示压缩预算赤字有助于下调关键利率（当前关键利率 14%，9-11 会议维持）。含义：人民币换卢布成本下降利好采购与结算，但卢布单边升值会压缩卢布收入折算利润，需按公司月度锁汇口径执行并同步更新定价模型中的汇率参数。", "table": [["USD/RUB", "84.9048 → 83.7600"], ["10-13", "83.9153（跌破 84）"], ["10-15 / 10-16", "83.9497 / 83.7600"], ["CNY/RUB", "12.6739 → 12.5358"], ["关键利率", "14%（9-11 维持）"], ["居民外币存款", "2008 年以来最低"]], "url": "https://www.vedomosti.ru/finance/news/2026/10/12/1236423-kurs-dollara", "sourceFull": "https://www.vedomosti.ru/finance/news/2026/10/12/1236423-kurs-dollara"}, {"num": 13, "title": "【通胀·油价】周通胀 0.11%（10-6~10-12）显著放缓，但央行调查上调 2026 通胀预测至 7.1%；Brent 高位震荡 104.94–106.9", "tag": "local", "tagText": "本地", "source": "Vedomosti / RIA（本地）", "time": "10-12 ~ 10-16", "summary": "通胀端：10-6~10-12 一周通胀 0.11%（Lenta 称「放缓近九倍」），同期美国 9 月通胀加速至 3.7%；但俄央行对分析师的调查显示 2026 年通胀预测被上调至 7.1%，市场对「通胀目标推迟实现」的预期强化。油价端：Brent 高位宽幅震荡——10-12 盘中回升至约 105.6 美元、10-13 收 105.69、10-14 约 106.9、10-15 回落至 104.94（−1.06%）、10-16 盘前约 105.6 美元。含义：油价高位托底卢布与财政，但运输与包装成本承压，Q4 物流报价宜保留燃油浮动条款，并按 100/105/110 美元情景做成本敏感性测算。", "table": [["周通胀（10-6~10-12）", "0.11%"], ["2026 通胀预测", "上调至 7.1%（央行调查）"], ["美国 9 月通胀", "3.7%（加速）"], ["Brent", "105.6 → 106.9 → 104.94 → ≈105.6 美元"]], "url": "https://www.vedomosti.ru/economics/news/2026/10/14/1237099-inflyatsiya-sostavila", "sourceFull": "https://www.vedomosti.ru/economics/news/2026/10/14/1237099-inflyatsiya-sostavila"}, {"num": 14, "title": "【能源·外贸】МЭА：柴油短缺持续至 2027 年中；中东供给压制 Urals；俄拟增供印度、对越煤出口近乎翻倍", "tag": "local", "tagText": "本地", "source": "Kommersant / TASS / Vedomosti（本地）", "time": "10-12 ~ 10-16", "summary": "能源与外经贸：① МЭА 预计全球柴油/中间馏分油供给紧张持续至 2027 年年中（炼能瓶颈 + 需求韧性），对依赖公路干线的电商履约意味着燃油附加费与卡车运价中期难回落；② 生意人报：中东（波斯湾）供给增长使全球买家对俄原油需求下降，Urals 面临价格与贴水双重压力、运保成本高位；③ 俄石油产量继续下降（炼厂受袭、出口成本、OPEC+ 安排）；④ 俄表示准备向印度增供石油；⑤ 分析师上调俄煤出口价预测，对越南煤炭出口同比近乎翻倍；⑥ 普京将芬兰建材商 Tarkett 及另 4 家公司的俄资产移交 «Центр Капитал» 临时管理。含义：出口结构东移有助卢布与财政，但煤炭运输挤占铁路运力、柴油紧张推高干线成本，Q4 备货需提前锁定运力与运价。", "table": [["柴油短缺", "持续至 2027 年中（МЭА）"], ["Urals", "中东供给压制，贴水扩大"], ["俄油产量", "继续下降"], ["拟增供印度", "（规模待核实）"], ["对越煤出口", "同比近乎 ×2"], ["Tarkett", "俄资产移交临时管理"]], "url": "https://www.kommersant.ru/doc/9026683", "sourceFull": "https://www.kommersant.ru/doc/9026683"}]}, {"icon": "💄", "name": "美妆", "items": [{"num": 15, "title": "【合规】Роспотребнадзор 抽查 Ozon/WB 的 Chanel 卖家：37% 商品卡被下架、仅 8% 完全合规、44% 涉境外卖家", "tag": "local", "tagText": "本地", "source": "Retail.ru（本地）", "time": "10-13", "summary": "Роспотребнадзор 对香化类 Chanel 卖家开展检查（起因：国际 «Антиконтрафакт» 协会 2026 年 7 月对 Ozon 与 Wildberries 的监测）：平台下架了受检商品卡的 37%，仅 8% 完全符合法定要求，主要违规为缺少合规声明（декларации соответствия）与卖家未在「Честный знак」注册；14% 的样品在被查时已售出并被给予警示、3% 在警示后补交有效声明；受检商品卡中 44% 来自境外卖家（跨境贸易）。检查覆盖卡尔梅克、科米、莫斯科、莫斯科州、新西伯利亚州、乌德穆尔特与车臣。含义：美妆香化线上合规审查进入实操阶段，跨境卖家须补齐合规声明并完成 ЧЗ 参与人注册，否则面临下架与罚款。", "table": [["商品卡下架", "37%"], ["完全合规", "仅 8%"], ["主要违规", "缺合规声明 / 未注册 Честный знак"], ["境外卖家占比", "44%（监测样本）"]], "url": "https://www.retail.ru/news/rospotrebnadzor-proveril-prodavtsov-chanel-na-ozon-i-wildberries-13-oktyabrya-2026-283220/", "sourceFull": "https://www.retail.ru/news/rospotrebnadzor-proveril-prodavtsov-chanel-na-ozon-i-wildberries-13-oktyabrya-2026-283220/"}, {"num": 16, "title": "【需求】俄零售 БАД 两年增长 75%；«Золотое Яблоко»：38% 生成式 AI 用户借 ИИ 选购化妆品", "tag": "local", "tagText": "本地", "source": "Retail.ru（本地）", "time": "10-15", "summary": "① 俄零售数据显示，近两年 БАД（膳食补充剂）销售额增长 75%，为健康/家居类增速最快细分之一、线上占比持续提升（但已被 10-13 生效的 Роспотребнадзор 第 644 号令列入「风险指标」抽查范围）。② 美妆连锁 «Золотое Яблоко» 调研显示 38% 的生成式 AI 用户会在挑选化妆品时向 ИИ 咨询。含义：口服美容/补充剂是明确增量赛道，但商品卡的结构化属性（成分、功效、适用肤质）与真实评价将更直接影响 AI 推荐入口，粗放式「图片+短标题」卡片会被弱化。", "table": [["БАД 销售", "2 年 +75%"], ["合规提示", "已入 644 号令抽查范围"], ["ИИ 选购占比", "38%（Золотое Яблоко）"]], "url": "https://www.retail.ru/news/za-dva-goda-prodazhi-badov-v-riteyle-vyrosli-na-75--15-oktyabrya-2026-283322/", "sourceFull": "https://www.retail.ru/news/za-dva-goda-prodazhi-badov-v-riteyle-vyrosli-na-75--15-oktyabrya-2026-283322/"}, {"num": 17, "title": "【并购·全球】Geltek 收购儿童彩妆品牌 Nomi；LVMH 前 9 个月营收同比 -1.6%", "tag": "local", "tagText": "本地", "source": "Oborot.ru / Retail.ru（本地）", "time": "10-13 / 10-15", "summary": "① Geltek 收购儿童装饰性化妆品品牌 Nomi（10-15 报道），加码儿童美妆细分——俄儿童/青少年美妆近两年增速高于整体，本土品牌正通过并购整合渠道与产品线。② LVMH 前 9 个月营收同比下降 1.6%，香化（香水与化妆品）与皮具板块放缓、亚洲需求偏弱是主因。含义：全球奢侈品与美妆需求走软，或促使品牌方加快经平行进口/分销向俄出货、压低部分进口美妆批发价；采购与定价窗口建议按月滚动评估，勿一次性锁长单。", "table": [["并购", "Geltek ← Nomi"], ["细分", "儿童装饰性化妆品"], ["LVMH", "前 9 个月 -1.6%"], ["拖累", "香化/皮具，亚洲需求偏弱"]], "url": "https://oborot.ru/news/geltek-priobrel-brend-detskoj-dekorativnoj-kosmetiki-nomi-i281492.html", "sourceFull": "https://oborot.ru/news/geltek-priobrel-brend-detskoj-dekorativnoj-kosmetiki-nomi-i281492.html"}]}, {"icon": "🔌", "name": "电器", "items": [{"num": 18, "title": "【成本·合规】工贸部确定电子技术回收费率（12-01 起）：笔记本基准 746 ₽、标注溯源 500 ₽、未标注 992 ₽；中国进口笔记本价 +10%", "tag": "local", "tagText": "本地", "source": "RG / Izvestia（本地）", "time": "10-13 ~ 10-15", "summary": "俄工贸部确定电子产品的技术回收/技术费（технологический сбор）基准与优惠费率，自 2026-12-01 起执行：笔记本电脑基准 746 卢布/台，在 ГИС 标注溯源信息后降至 500 卢布、未标注则为 992 卢布；智能手机基准 373 卢布、标注后 250 卢布、未标注 496 卢布——标注溯源（Честный знак）成为降低成本的关键变量，未赋码的实际回收成本接近翻倍。同期消息报报道，从中国进口的笔记本电脑均价上涨约 10%（内存/存储芯片涨价、汇率与物流成本）。含义：数码类目需在 12-01 前完成 ЧЗ 标注以锁定优惠费率，并把 +10% 的采购涨价纳入定价。", "table": [["生效", "2026-12-01"], ["笔记本电脑", "746 / 500 / 992 ₽"], ["智能手机", "373 / 250 / 496 ₽"], ["中国进口笔记本", "均价约 +10%"]], "url": "https://rg.ru/2026/10/15/minpromtorg-utverdil-stavki-tehnologicheskogo-sbora-na-elektroniku.html", "sourceFull": "https://rg.ru/2026/10/15/minpromtorg-utverdil-stavki-tehnologicheskogo-sbora-na-elektroniku.html"}, {"num": 19, "title": "【需求结构】IDC：Q3 全球 PC 出货 -20.1%；«М.Видео»：Samsung 智能手表 1–9 月 +8%；新 iPhone 需求未超去年同期", "tag": "local", "tagText": "本地", "source": "Lenta.ru / Retail.ru（本地）", "time": "10-12 ~ 10-15", "summary": "① IDC：2026 Q3 全球 PC 出货 6,270 万台、同比 -20.1%，前五厂商全线下滑（联想 -22.6%、惠普 -30.9%、戴尔 -25%、苹果 -11.3%、华硕 -8.6%），内存等零部件短缺与涨价为主因。② «М.Видео»：1–9 月 Samsung 智能手表在俄销售额同比增长近 8%，可穿戴为稳健增量品类。③ 俄市场新 iPhone 需求未超去年同期，高端换机周期拉长、平行进口供给趋稳。含义：PC 及周边采购价与到货节奏风险上升，Q4 预算应向中端与可穿戴/配件倾斜，不宜按去年增速外推高端备货。", "table": [["全球 PC Q3", "6,270 万台（-20.1%）"], ["前五厂商", "联想 -22.6% / 惠普 -30.9% 等"], ["Samsung 手表", "1–9 月 +8%（М.Видео）"], ["新 iPhone 需求", "未超去年同期"]], "url": "https://lenta.ru/news/2026/10/12/pcs/", "sourceFull": "https://lenta.ru/news/2026/10/12/pcs/"}, {"num": 20, "title": "【需求·安全】«ВсеИнструменты.ру»：6–9 月消防器材需求增至 1.4 倍；俄燃气瓶假冒产品增多", "tag": "local", "tagText": "本地", "source": "Retail.ru / RIA（本地）", "time": "10-14", "summary": "① 在线工具与家装超市 «ВсеИнструменты.ру»：2026 年 6–9 月俄民众购买消防设备支出同比增长 1.4 倍、消防安防报警系统销量同比增至 1.1 倍；2026 年 1–8 月保险案件同比增加 28%，其中 57% 发生在私人住宅。② RIA：俄燃气瓶（气罐）生产商警示市场假冒产品增多，存在安全与合规隐患。含义：消防安全与家装安全类目需求上行，同时进口燃气类产品须确保 EAC 认证与来源可追溯，避免因假冒流通引发下架、罚没或安全责任。", "table": [["消防设备需求", "6–9 月同比 ×1.4"], ["报警系统", "同比 ×1.1"], ["保险案件", "1–8 月 +28%（57% 在私宅）"], ["风险", "燃气瓶假冒产品增多（EAC/追溯）"]], "url": "https://www.retail.ru/news/vseinstrumenty-ru-v-rossii-vyros-spros-na-ognetushiteli-i-datchiki-dyma-14-oktyabrya-2026-283304/", "sourceFull": "https://www.retail.ru/news/vseinstrumenty-ru-v-rossii-vyros-spros-na-ognetushiteli-i-datchiki-dyma-14-oktyabrya-2026-283304/"}]}, {"icon": "💡", "name": "灯具", "items": [{"num": 21, "title": "【行业动向】本周灯具照明无价格/合规/渠道类重大变动；窗口内仅见 11-13 格连吉克「酒店与疗养院场所照明」圆桌会议预告", "tag": "local", "tagText": "本地", "source": "lightingmedia.ru / «Современная светотехника»（补充抓取）", "time": "10-12 ~ 10-16", "summary": "本周（10-12~10-16）俄罗斯灯具照明行业无价格、合规或渠道类重大变动。补充抓取行业媒体 lightingmedia.ru / «Современная светотехника» 后，窗口内仅见一条行业活动预告：11-13 将在格连吉克（Геленджик）举行「酒店与疗养院场所照明」圆桌会议（10-16 发布）。核对信源包括 lightingmedia.ru、Retail.ru、RIA、ТАСС、Интерфакс、Коммерсантъ、Ведомости、Lenta 及站内检索，窗口内均无实质新条目。含义：本月照明行业的节奏仍由 10-27~30 的 Interlight 2026（Smart City & Home）主导，渠道与选品动作宜集中在展会窗口，本周无需额外合规或定价动作。", "table": [["本周结论", "无价格/合规/渠道重大变动"], ["窗口内条目", "1 条（活动预告）"], ["活动", "11-13 格连吉克「酒店/疗养院照明」圆桌"], ["下一个行业节点", "Interlight 2026（10-27~30）"]], "url": "https://lightingmedia.ru/sobytiya/13-noyabrya-v-gelendzhike-obsudyat-osveshhenie-territorij-gostinicz-i-sanatoriev/", "sourceFull": "https://lightingmedia.ru/sobytiya/13-noyabrya-v-gelendzhike-obsudyat-osveshhenie-territorij-gostinicz-i-sanatoriev/"}]}, {"icon": "🚗", "name": "汽车（扩展）", "items": [{"num": 22, "title": "【销量】Автостат：10-05~10-11 周新注册 28,948 辆，环比 -12.8%、同比 -19.8%；年内累计破百万（+6.4%）", "tag": "local", "tagText": "本地", "source": "Автостат（经 Lenta.ru / RG 转述）（本地）", "time": "10-12", "summary": "Автостат 数据（经 Lenta.ru、RG 10-12 转述）：10-05~10-11 俄新乘用车注册 28,948 辆，环比前一周（33,200 辆，为年内纪录周）下降 12.8%、同比去年同期下降 19.8%；同期轻型商用车（LCV ≤3.5 吨）1,456 辆（环比 -15.3%）、重型卡车 1,133 辆（环比 -3.8%）。年内 41 周累计新乘用车 1,027,170 辆、同比 +6.4%，车市已越过百万辆关口。Автостат 负责人 Целиков 预计 10 月仍将成 2026 年销量最佳月份。含义：车市「季度回暖 + 周度波动加大」，汽配与车品的备货与促销节奏需按月而非线性调整。", "table": [["周注册量", "28,948 辆"], ["环比", "-12.8%（前周 33,200 辆）"], ["同比", "-19.8%"], ["年内累计", "1,027,170 辆（+6.4%）"], ["10 月预期", "仍为年内最佳月份"]], "url": "https://lenta.ru/news/2026/10/12/v-rossii-rezko-upali-prodazhi-novyh-mashin", "sourceFull": "https://lenta.ru/news/2026/10/12/v-rossii-rezko-upali-prodazhi-novyh-mashin"}, {"num": 23, "title": "【需求】«Авито Авто»：2026 Q3 俄新车需求同比增长 8.5%", "tag": "local", "tagText": "本地", "source": "«Авито Авто»（经 Retail.ru 转述）（本地）", "time": "10-15", "summary": "«Авито Авто» 数据（经 Retail.ru 10-15 发布）：2026 年三季度俄罗斯市场对新车的需求同比增长 8.5%，与 Автостат 的周度销量数据共同显示「季度需求回暖、周度波动加大」的组合特征。含义：新车需求的季度改善利好汽配、车品与车载配件的长周期需求，但本周环比 -12.8% 的回落说明促销与补贴节奏对短期销量影响显著，备货与投放不宜按单周外推。", "table": [["指标", "2026 Q3 新车需求"], ["同比", "+8.5%"], ["数据方", "«Авито Авто»"]], "url": "https://www.retail.ru/news/v-iii-kvartale-2026-goda-spros-na-novye-avtomobili-vyros-na-8-5--15-oktyabrya-2026-283347/", "sourceFull": "https://www.retail.ru/news/v-iii-kvartale-2026-goda-spros-na-novye-avtomobili-vyros-na-8-5--15-oktyabrya-2026-283347/"}]}], "keyData": {"headers": ["指标", "周初（10-12/13）", "周末（10-15/16）", "趋势"], "rows": [["央行美元汇率", "84.9048 ₽（10-12）", "83.7600 ₽（10-16）", "卢布走强约 1.3%，10-12 起跌破 84 关口，全周单边小幅升值"], ["央行人民币汇率（1 元）", "12.6739 ₽（10-12）", "12.5358 ₽（10-15）", "人民币兑卢布走弱约 1.1%（卢布升值），利于人民币计价采购结汇"], ["Brent 原油（12 月合约）", "≈105.6 美元（10-12 盘中）", "≈105.6 美元（10-16 盘前）", "高位宽幅震荡：10-14 高见 106.9、10-15 收 104.94（−1.06%）"], ["周通胀（10-6~10-12）", "—", "0.11%", "显著放缓（近九倍）；但央行调查上调 2026 通胀预测至 7.1%"], ["关键利率", "14%（9-11 维持）", "14%", "央行称压缩预算赤字有助于降息，市场关注 10 月议息"], ["仓储险平均费率（Q3）", "—", "≈保额 2%", "环比近 +7 倍、同比 13–20 倍；A 级干仓 0.08–0.15% → 3–5%（РНПК 10-01 起 БПЛА 赔付封顶 20%）"], ["莫斯科州仓租金", "—", "≈1.03 万 ₽/㎡/年", "同比 +13%，空置率 7.8% → 约 5%，年内成交或 +25% 至约 200 万㎡"], ["居民外币存款", "—", "2008 年以来最低", "资金转向卢布/人民币资产，本币化强化汇率确定性"], ["全球 PC 出货（Q3）", "—", "6,270 万台（−20.1%）", "前五厂商全线下滑（联想 −22.6%、惠普 −30.9%），内存短缺/涨价为主因"], ["俄新车周注册（10-05~10-11）", "33,200 辆（前周，年内纪录）", "28,948 辆", "环比 −12.8%、同比 −19.8%；年内累计 102.72 万辆（+6.4%）"], ["平台仓遇袭专题", "累计 WB 22 城 / Ozon 12 城", "不变", "本周（10-12~10-16）无新增平台仓遇袭（连续第 25~31 日），warehouse_attacks.json 不变"], ["电商合规红线", "—", "10-13 起 644 号令生效", "三大平台 10-12 接入 ЧЗ 核验；БАД/抗菌香化/饮料入抽查范围；植物油 11-01 逐件追溯"]]}, "trends": [{"title": "1. 平台规则与成本：从「调费率」转向「改默认值 + 故障转嫁」，卖家隐性成本上升", "text": "本周平台规则的重点不再是公开费率，而是「默认开通」与「系统故障责任分配」：Ozon 把付费「首批评价征集」批量自动开通，只给 7 天关闭窗口、按条扣费最高 3,000 ₽/条，并以「已确认开通」拒绝退款；同期 Ozon FBS 状态同步故障致已发货订单被判超时罚金。叠加 Wildberries 提现积压（3–5 笔/卖家）与 Ozon 误发停付通知，卖家侧的结算可预期性下降。建议把「增值服务开关」「罚金申诉举证」「对账单核对」列为例行动作，而非问题发生后的补救。"}, {"title": "2. 电商物流与履约：履约网络两向扩张，仓储与保险成本同时抬升", "text": "履约侧出现两条清晰路径：一端「前端化」——Ozon 试点 FBO 经自提点（ПВЗ/ППЗ）越库，卖家自送大仓的干线成本被省去但需逐件贴 QR 码；另一端「近岸化」——Ozon 白俄物流能力翻倍（Болбасово 2.6 万㎡ + 明斯克）、哈萨克阿拉木图/阿斯塔纳免费入仓。与此同时俄境内仓位紧张（莫斯科州租金 +13%、空置率降至约 5%）与仓储险费率环比近 +7 倍，使「库存到底放在哪」成为比运费更关键的决策；建议按「近岸仓前置 + 俄境内分散」双轨评估总持有成本。"}, {"title": "3. 宏观经济与汇率：卢布单边走强、周通胀显著放缓，但全年通胀预测被上调", "text": "卢布全周单边升值（官方美元 84.9048 → 83.7600），周通胀降至 0.11% 的短期低点，居民外币存款跌至 2008 年以来最低、资金本币化强化汇率确定性；但央行对分析师的调查反而把 2026 年通胀预测上调至 7.1%，关键利率仍维持 14%，央行称压缩赤字有助于降息。对以人民币采购、卢布销售的主体而言，短期结汇成本改善与中期通胀/利率不确定性并存——建议继续执行月度锁汇，并在定价模型中同时保留汇率升值与通胀上行的双向情景。"}, {"title": "4. 能源价格与运输成本：柴油短缺延续至 2027 年中，Urals 贴水扩大，干线成本中期难降", "text": "МЭА 预计全球柴油/中间馏分油供给紧张持续至 2027 年年中，叠加 Brent 维持 105 美元上下的高位，干线运价与燃油附加费中期难回落；俄油侧则受中东（波斯湾）供给增长压制，Urals 面临价格与贴水双重压力，运保成本仍在高位。出口结构继续东移（拟增供印度、对越煤出口近乎翻倍），但煤炭运输挤占铁路运力。Q4 备货应提前锁定运力与报价，并在物流合同中保留燃油浮动条款。"}, {"title": "5. 消费市场与合规：合规抽查进入实操阶段，БАД/可穿戴/消防器材是主要增量", "text": "本周合规从「规则发布」转向「检查落地」：Роспотребнадзор 抽查 Chanel 卖家，37% 商品卡被下架、仅 8% 完全合规、44% 涉境外卖家；第 644 号令 10-13 生效后 БАД、抗菌香化与饮料类目进入「风险指标」抽查范围。需求侧则呈现结构性增量：БАД 两年 +75%、Samsung 智能手表 1–9 月 +8%、消防器材 6–9 月同比 ×1.4、маркетплейсы 以 31.3% 成为「改善生活」第一品类。合规能力正在成为上新与铺货的前置门槛，而非事后成本。"}, {"title": "6. 电器与灯具：回收费率与芯片涨价双压，家电需求分化；灯具本周无重大动态", "text": "电器侧双重压力落地：工贸部确定 12-01 起执行电子技术回收费率（笔记本 746/500/992 ₽、手机 373/250/496 ₽，标注溯源可减半），中国进口笔记本均价 +10%，全球 PC Q3 出货 -20.1%（内存短缺为主因）。需求端分化：可穿戴（Samsung 手表 +8%）与安全类（消防器材 ×1.4）走强，高端新 iPhone 需求未超去年同期。灯具照明本周无价格/合规/渠道重大动态，行业焦点仍在 10-27~30 的 Interlight 2026（Smart City & Home）。"}], "sourceStats": "本周周报共收录 23 条条目，信源全部为俄语本土媒体、行业媒体与官方机构：商业日报（Ведомости）、零售网（Retail.ru）、电商行业网（Oborot.ru）、生意人报（Коммерсантъ）、俄新社（РИА Новости）、塔斯社（ТАСС）、国际文传电讯社（Интерфакс）、连塔网（Lenta.ru）、消息报（Известия）、俄罗斯报（Российская газета）、Бизнес Online、ЦБ РФ（央行）、«Автостат»、«Авито Авто»、«М.Видео»、lightingmedia.ru（«Современная светотехника»），以及 Роспотребнадзор、ФНС、Минпромторг、Минэкономразвития 等官方口径；VK、Ozon、Wildberries、BrandLab、IDC、МЭА 等平台/机构数据经俄本土媒体转述后收录，按转述链计入本地信源。本地信源 23 条 = 100%（≥60% 达标）；中文信源 0 条、英文直采 0 条（Brent 报价经 Yahoo Finance 仅作行情输入，不作为条目信源）；lightingmedia.ru 为灯具栏目补充抓取的俄语行业信源。", "meta": ["报告编号：RU-WEEKLY-2026-W42", "覆盖周期：2026-10-12（周一）~ 10-16（周五），第 42 周", "收录条目：23 条（电商 8、时政 3、经济 3、美妆 3、电器 3、灯具 1、汽车（扩展）2）", "数据来源：本地日报 5 期（10-12 共 16 条、10-13 共 16 条、10-14 共 22 条、10-15 共 24 条、10-16 共 21 条，窗口 10-12~10-16 无空窗）；灯具栏目本周日报均报「无新增」，经补充抓取 lightingmedia.ru / «Современная светотехника» 复核，窗口内仅 1 条活动预告（11-13 格连吉克圆桌），如实收录并注明核对方法；汽车（扩展）信源为 Автостат（经 Lenta.ru / RG 转述）与 «Авито Авто»（经 Retail.ru 转述）。", "去重：周报条目与本周日报同源内容按周视角归并改写，不重复计数；URL 逐一经 state.db articles 表核对，已入库者沿用既有 report_date，仅窗口内新增条目执行 INSERT OR IGNORE，入库后按 attempted / count 对账。", "入库：周报条目写入 state.db articles 表（category 与日报同口径：电商 / 时政 / 经济 / 美妆 / 电器 / 灯具 / 汽车 / 其它），汽车（扩展）条目按 CATMAP 归入「汽车」。", "仓库遇袭专题：本周 10-12~10-16 五期日报均报「无新增平台仓库遇袭事件」（连续第 25~31 日）；累计口径不变（Wildberries / Russ 22 城、Ozon 12 城，最近一处仍为 09-15 塔甘罗格）；warehouse_attacks.json 的 events / totals 不变。", "汇率（ЦБ РФ 官方）：美元 84.9048（10-12）→ 83.7600（10-16）；人民币 12.6739 → 12.5358（10-15）。", "重点提示：① Ozon 付费「首批评价征集」被批量自动开通、按条扣费（最高 3,000 ₽/条），叠加 FBS 状态同步故障罚款；② 跨境税务：第 617–9 号法案拟自 2027 年起对个人跨境网购按一般税率征增值税、平台为税务代理人；③ 合规收紧：三大平台接入「Честный знак」核验、Роспотребнадзор 644 号令 10-13 生效、电子品技术回收费 12-01 落地；④ 卢布全周走强、周通胀放缓至 0.11%，但央行调查上调 2026 通胀预测至 7.1%；⑤ 灯具本周无重大动态，行业焦点仍在 10-27~30 Interlight 2026。"]}
